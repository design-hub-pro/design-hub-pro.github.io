<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrushBuddy — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-teal-400 to-sky-500 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-tooth text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">BrushBuddy</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A toothbrush sleeve for kids 6 to 10. Its motion sensor spots missed zones and scrubbing that is too hard.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Oral Health</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">IMU Sensing</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Kids</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">BLE Wearable</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606253800-image-1.png" alt="BrushBuddy — child brushing with the sleeve, tablet showing the mouth map"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606254684-image-1.png" alt="BrushBuddy — the sleeve beside a toothbrush and ruler"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606224104-image-1.png" alt="BrushBuddy — sleeve fitted on a toothbrush in a cup"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606224131-image-1.png" alt="BrushBuddy — parent fitting the sleeve, charger and phone nearby"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606222912-image-1.png" alt="BrushBuddy — signal path from motion sensor to zone map to app"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606222881-image-1.png" alt="BrushBuddy — exploded stack of shell, board, force strip, battery, coil"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606253541-image-1.png" alt="BrushBuddy — bench validation on a dental jaw model and scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793606253922-image-1.png" alt="BrushBuddy — power and wiring concept"></div>
        </div>
    </div>
</body>
</html>
