<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GripGlow | System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-emerald-500 to-sky-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-golf-ball-tee text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">GripGlow</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A training grip with six pressure pads that glows green, red or blue as juniors squeeze.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Sports Training</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Pressure Sensing</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">ESP32</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Edge ML</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926232671-image-1.png" alt="GripGlow, "></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926232831-image-1.png" alt="GripGlow, junior golfer gripping a club with the grip glowing green"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926261772-image-1.png" alt="GripGlow, the training grip with a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926233044-image-1.png" alt="GripGlow, grip fitted on a junior iron at the range"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926231419-image-1.png" alt="GripGlow, coach fitting the grip onto a club"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926231695-image-1.png" alt="GripGlow, signal path from pressure pads to LEDs and phone"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926233960-image-1.png" alt="GripGlow, exploded stack of the grip build"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794926261565-image-1.png" alt="GripGlow, bench test against a force gauge"></div>
        </div>
    </div>
</body>
</html>
