<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WeedRover - History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0B140D; color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-three-quarters" style="font-size: 15px;"></i>
  </div>
</div>

<div style="padding: 0 28px 110px 28px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin: 4px 0 20px;">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">History</div>
    <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #C5CFC9;">This week <i class="fas fa-chevron-down" style="font-size: 9px; margin-left: 4px;"></i></div>
  </div>

  <!-- Hero stat -->
  <div style="background: linear-gradient(150deg, #1B3A1E, #123018); border-radius: 24px; padding: 22px; margin-bottom: 18px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -40px; right: -30px; width: 150px; height: 150px; border-radius: 50%; background: rgba(163,230,53,0.08);"></div>
    <div style="font-size: 12px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Weeds sprayed this week</div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <div style="font-size: 42px; font-weight: 800; letter-spacing: -1px;">86</div>
      <div style="display: inline-flex; align-items: center; gap: 5px; background: rgba(163,230,53,0.18); padding: 4px 10px; border-radius: 20px;">
        <i class="fas fa-arrow-trend-up" style="font-size: 10px; color: #A3E635;"></i>
        <span style="font-size: 11px; font-weight: 700; color: #A3E635;">+18% vs last week</span>
      </div>
    </div>
  </div>

  <!-- Bar chart -->
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px; margin-bottom: 18px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 110px; gap: 8px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 54px; background: rgba(163,230,53,0.35); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">M</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 70px; background: rgba(163,230,53,0.5); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">T</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 40px; background: rgba(163,230,53,0.35); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">W</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 88px; background: rgba(163,230,53,0.65); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">T</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 62px; background: rgba(163,230,53,0.4); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">F</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 100px; background: #A3E635; border-radius: 6px;"></div><span style="font-size: 10px; color: #A3E635; font-weight: 700;">S</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 24px; background: rgba(163,230,53,0.25); border-radius: 6px;"></div><span style="font-size: 10px; color: #6B776F;">S</span></div>
    </div>
  </div>

  <!-- Secondary stats -->
  <div style="display: flex; gap: 12px; margin-bottom: 18px;">
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #38BDF8;">172<span style="font-size: 11px; color: #8FA093;">mL</span></div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Herbicide used</div>
    </div>
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #FBBF24;">92<span style="font-size: 11px; color: #8FA093;">%</span></div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Avg confidence</div>
    </div>
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #A3E635;">9</div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Day streak</div>
    </div>
  </div>

  <!-- Streak card -->
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(163,230,53,0.14); display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-fire" style="color: #A3E635; font-size: 18px;"></i>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 14px; font-weight: 700;">9 days of active patrols</div>
      <div style="font-size: 12px; color: #8FA093; margin-top: 1px;">Zero missed schedule since Sep 10</div>
    </div>
  </div>

</div>

<!-- Tab Bar -->
<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; background: rgba(11,20,13,0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 100;">
  <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-house" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Home</span>
  </a>
  <a href="map.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-map-location-dot" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Map</span>
  </a>
  <a href="history.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-chart-simple" style="font-size: 21px; color: #A3E635;"></i>
    <span style="font-size: 10px; color: #A3E635; font-weight: 600;">History</span>
  </a>
  <a href="settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-gear" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Settings</span>
  </a>
</div>

</body>
</html>
