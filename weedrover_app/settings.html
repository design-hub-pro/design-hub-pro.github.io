<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WeedRover - Settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0B140D; color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .toggle { width: 40px; height: 24px; border-radius: 20px; position: relative; flex-shrink: 0; }
  .toggle .dot { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .sectitle { font-size: 12px; font-weight: 700; color: #8FA093; text-transform: uppercase; letter-spacing: 0.6px; margin: 20px 2px 8px; }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-three-quarters" style="font-size: 15px;"></i>
  </div>
</div>

<div style="padding: 0 28px 110px 28px;">

  <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 4px 0 18px;">Settings</div>

  <!-- Device card -->
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 6px;">
    <div style="width: 58px; height: 58px; border-radius: 14px; overflow: hidden; flex-shrink: 0;">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789790675722-image-1.png" style="width: 100%; height: 100%; object-fit: cover;" alt="WeedRover device">
    </div>
    <div style="flex: 1;">
      <div style="font-size: 15px; font-weight: 700;">WeedRover Unit 01</div>
      <div style="font-size: 12px; color: #8FA093; margin-top: 1px;">Docked · charging · firmware 1.4.2</div>
    </div>
    <div style="width: 9px; height: 9px; border-radius: 50%; background: #A3E635; box-shadow: 0 0 8px #A3E635;"></div>
  </div>

  <!-- Spray settings -->
  <div class="sectitle">Spray settings</div>
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;">
    <div class="row" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
      <i class="fas fa-bullseye" style="color: #A3E635; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600;">Detection sensitivity</div>
        <div style="height: 5px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 8px; position: relative;">
          <div style="width: 70%; height: 100%; background: linear-gradient(90deg, #65A30D, #A3E635); border-radius: 4px;"></div>
          <div style="position: absolute; left: 70%; top: 50%; transform: translate(-50%,-50%); width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4);"></div>
        </div>
      </div>
      <span style="font-size: 12px; color: #8FA093; font-weight: 600;">70%</span>
    </div>
    <div class="row">
      <i class="fas fa-tint" style="color: #38BDF8; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">Dose per hit</div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 13px;">–</div>
        <span style="font-size: 13px; font-weight: 700; min-width: 34px; text-align: center;">2 mL</span>
        <div style="width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 13px;">+</div>
      </div>
    </div>
  </div>

  <!-- Notifications -->
  <div class="sectitle">Notifications</div>
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;">
    <div class="row" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
      <i class="fas fa-tint-slash" style="color: #F59E0B; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">Low tank alert</div>
      <div class="toggle" style="background: #A3E635;"><div class="dot" style="right: 3px;"></div></div>
    </div>
    <div class="row" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
      <i class="fas fa-flag-checkered" style="color: #A3E635; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">Patrol complete</div>
      <div class="toggle" style="background: #A3E635;"><div class="dot" style="right: 3px;"></div></div>
    </div>
    <div class="row">
      <i class="fas fa-leaf" style="color: #A3E635; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">New weed detected</div>
      <div class="toggle" style="background: rgba(255,255,255,0.12);"><div class="dot" style="left: 3px;"></div></div>
    </div>
  </div>

  <!-- Safety & more -->
  <div class="sectitle">Safety & schedule</div>
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;">
    <a href="schedule.html" class="row" style="border-bottom: 1px solid rgba(255,255,255,0.06); text-decoration: none; color: #fff;">
      <i class="fas fa-calendar-check" style="color: #38BDF8; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">Patrol schedule</div>
      <i class="fas fa-chevron-right" style="font-size: 12px; color: #6B776F;"></i>
    </a>
    <a href="map.html" class="row" style="text-decoration: none; color: #fff;">
      <i class="fas fa-draw-polygon" style="color: #A3E635; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">No-go zones</div>
      <i class="fas fa-chevron-right" style="font-size: 12px; color: #6B776F;"></i>
    </a>
  </div>

  <!-- About -->
  <div class="sectitle">About</div>
  <div style="background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;">
    <div class="row" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
      <i class="fas fa-circle-question" style="color: #8FA093; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600;">Help & support</div>
      <i class="fas fa-chevron-right" style="font-size: 12px; color: #6B776F;"></i>
    </div>
    <div class="row">
      <i class="fas fa-right-from-bracket" style="color: #EF4444; font-size: 15px; width: 18px;"></i>
      <div style="flex: 1; font-size: 13px; font-weight: 600; color: #EF4444;">Sign out</div>
    </div>
  </div>

</div>

<!-- Tab Bar -->
<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; background: rgba(11,20,13,0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 100;">
  <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-house" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Home</span>
  </a>
  <a href="map.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-map-location-dot" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Map</span>
  </a>
  <a href="history.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-chart-simple" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">History</span>
  </a>
  <a href="settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-gear" style="font-size: 21px; color: #A3E635;"></i>
    <span style="font-size: 10px; color: #A3E635; font-weight: 600;">Settings</span>
  </a>
</div>

</body>
</html>
