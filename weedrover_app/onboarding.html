<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WeedRover - Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0B140D; color: #FFFFFF;
    width: 100%; height: 100%; overflow: hidden; scrollbar-width: none;
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 10;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-full" style="font-size: 15px;"></i>
  </div>
</div>

<!-- Hero image -->
<div style="position: relative; height: 560px; margin-top: 4px;">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789790677255-image-1.png" style="width: 100%; height: 100%; object-fit: cover;" alt="WeedRover spraying a weed">
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11,20,13,0) 40%, rgba(11,20,13,0.9) 85%, #0B140D 100%);"></div>
  <div style="position: absolute; top: 20px; left: 28px; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #A3E635;">
    <i class="fas fa-seedling" style="margin-right: 6px;"></i>WEEDROVER
  </div>
</div>

<!-- Content -->
<div style="padding: 0 28px;">
  <h1 style="font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; margin-bottom: 10px;">Meet your backyard rover</h1>
  <p style="font-size: 14px; color: #8FA093; line-height: 1.55; margin-bottom: 22px;">Finds weeds in the lawn with its camera and spot-sprays each one. No scouting, no blanket spraying.</p>

  <!-- Steps preview -->
  <div style="display: flex; gap: 10px; margin-bottom: 24px;">
    <div style="flex: 1; background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 14px 10px; text-align: center;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(163,230,53,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
        <i class="fab fa-bluetooth-b" style="color: #A3E635; font-size: 15px;"></i>
      </div>
      <div style="font-size: 11px; font-weight: 600; color: #C5CFC9;">Pair rover</div>
    </div>
    <div style="flex: 1; background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 14px 10px; text-align: center;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(163,230,53,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
        <i class="fas fa-draw-polygon" style="color: #A3E635; font-size: 15px;"></i>
      </div>
      <div style="font-size: 11px; font-weight: 600; color: #C5CFC9;">Map yard</div>
    </div>
    <div style="flex: 1; background: #131F16; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 14px 10px; text-align: center;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(163,230,53,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
        <i class="fas fa-calendar-check" style="color: #A3E635; font-size: 15px;"></i>
      </div>
      <div style="font-size: 11px; font-weight: 600; color: #C5CFC9;">Set schedule</div>
    </div>
  </div>

  <div style="background: linear-gradient(135deg, #65A30D, #22C55E); border-radius: 18px; padding: 17px; text-align: center; font-size: 16px; font-weight: 700; color: #06140C; box-shadow: 0 14px 34px rgba(101,163,13,0.35); margin-bottom: 14px;">
    Get Started
  </div>
  <div style="text-align: center; font-size: 13px; color: #6B776F; font-weight: 500;">Already have a rover? <span style="color: #A3E635;">Sign in</span></div>
</div>

</body>
</html>
