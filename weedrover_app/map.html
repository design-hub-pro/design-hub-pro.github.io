<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WeedRover - Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0B140D; color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-three-quarters" style="font-size: 15px;"></i>
  </div>
</div>

<div style="padding: 0 28px 110px 28px;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin: 4px 0 16px;">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Yard Map</div>
    <div style="background: rgba(163,230,53,0.14); border: 1px solid rgba(163,230,53,0.3); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #A3E635;">74% mapped</div>
  </div>

  <!-- Map canvas -->
  <div style="background: #10241A; border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 14px; position: relative; margin-bottom: 16px;">
    <svg viewBox="0 0 320 360" style="width: 100%; height: auto; display: block;">
      <!-- lawn area -->
      <polygon points="24,30 296,18 306,300 150,340 14,290" fill="#1B3A1E" stroke="rgba(163,230,53,0.35)" stroke-width="2" stroke-dasharray="6 5"/>
      <!-- patio no-go zone -->
      <rect x="200" y="230" width="80" height="60" rx="8" fill="rgba(245,158,11,0.16)" stroke="rgba(245,158,11,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="240" y="264" fill="#F59E0B" font-size="9" font-weight="700" text-anchor="middle">NO-GO</text>
      <!-- flower bed no-go zone -->
      <rect x="40" y="60" width="60" height="42" rx="8" fill="rgba(245,158,11,0.16)" stroke="rgba(245,158,11,0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- patrol path -->
      <path d="M60,80 L260,80 L260,160 L60,160 L60,230 L230,230" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
      <!-- rover position -->
      <circle cx="230" cy="230" r="12" fill="rgba(163,230,53,0.25)"><animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="230" r="7" fill="#A3E635"/>
      <!-- sprayed weed pins -->
      <g fill="#22C55E">
        <circle cx="95" cy="110" r="6"/><circle cx="150" cy="70" r="6"/><circle cx="210" cy="120" r="6"/><circle cx="90" cy="190" r="6"/><circle cx="180" cy="200" r="6"/>
      </g>
      <!-- pending weed pins -->
      <g fill="#F59E0B">
        <circle cx="130" cy="270" r="6"/><circle cx="260" cy="200" r="6"/>
      </g>
    </svg>
  </div>

  <!-- Legend -->
  <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px;">
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; border-radius: 50%; background: #A3E635;"></div><span style="font-size: 12px; color: #C5CFC9;">Rover</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; border-radius: 50%; background: #22C55E;"></div><span style="font-size: 12px; color: #C5CFC9;">Sprayed</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; border-radius: 50%; background: #F59E0B;"></div><span style="font-size: 12px; color: #C5CFC9;">Pending</span></div>
    <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; border-radius: 3px; background: rgba(245,158,11,0.4); border: 1px dashed #F59E0B;"></div><span style="font-size: 12px; color: #C5CFC9;">No-go zone</span></div>
  </div>

  <!-- Stats -->
  <div style="display: flex; gap: 12px;">
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #FFFFFF;">1,240<span style="font-size: 11px; color: #8FA093;">m²</span></div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Yard area</div>
    </div>
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #22C55E;">5</div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Sprayed</div>
    </div>
    <div style="flex: 1; background: #131F16; border-radius: 18px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 24px; font-weight: 800; color: #F59E0B;">2</div>
      <div style="font-size: 10px; color: #8FA093; margin-top: 2px;">Pending</div>
    </div>
  </div>

</div>

<!-- Tab Bar -->
<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; background: rgba(11,20,13,0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 100;">
  <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-house" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Home</span>
  </a>
  <a href="map.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-map-location-dot" style="font-size: 21px; color: #A3E635;"></i>
    <span style="font-size: 10px; color: #A3E635; font-weight: 600;">Map</span>
  </a>
  <a href="history.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-chart-simple" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">History</span>
  </a>
  <a href="settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-gear" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Settings</span>
  </a>
</div>

</body>
</html>
