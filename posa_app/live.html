<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Posa — Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0A1310; color:#fff; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; padding-bottom:120px; background:#0A1310; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  .header { padding:8px 28px 6px; display:flex; align-items:center; justify-content:space-between; }
  .header h1 { font-size:24px; font-weight:900; letter-spacing:-0.6px; }
  .live-chip { display:inline-flex; align-items:center; gap:7px; background:rgba(52,211,153,0.14); color:#34D399; padding:7px 13px; border-radius:18px; font-size:11px; font-weight:800; }
  .live-chip .pulse { width:8px; height:8px; border-radius:50%; background:#34D399; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,0.6);} 70%{box-shadow:0 0 0 7px rgba(52,211,153,0);} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0);} }

  /* VISUAL STAGE */
  .stage { margin:14px 28px 0; border-radius:30px; background:radial-gradient(120% 90% at 50% 0%,#13241D 0%,#0E1A15 100%); border:1px solid rgba(255,255,255,0.06); padding:24px 20px 22px; position:relative; overflow:hidden; }
  .stage-status { text-align:center; margin-bottom:6px; }
  .stage-status .lbl { font-size:11px; font-weight:800; letter-spacing:1.2px; color:#34D399; }
  .stage-status .big { font-size:26px; font-weight:900; letter-spacing:-0.6px; margin-top:4px; }
  .figure { display:flex; justify-content:center; align-items:flex-end; height:248px; position:relative; }
  .grade { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:9px; }
  .grade .g { display:flex; align-items:center; gap:8px; font-size:10px; font-weight:700; color:#7E9088; }
  .grade .g .d { width:9px; height:9px; border-radius:50%; }
  .ang-pill { position:absolute; left:18px; padding:6px 11px; border-radius:14px; font-size:11px; font-weight:800; backdrop-filter:blur(6px); }

  /* METRICS */
  .metrics { display:flex; gap:11px; padding:18px 28px 0; }
  .metric { flex:1; background:#121E18; border:1px solid rgba(255,255,255,0.06); border-radius:18px; padding:15px 13px; }
  .metric-l { font-size:10px; color:#7E9088; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; }
  .metric-v { font-size:23px; font-weight:900; letter-spacing:-0.8px; margin-top:8px; }
  .metric-v small { font-size:12px; opacity:0.55; }
  .metric-bar { height:5px; border-radius:5px; background:#1E2D26; margin-top:9px; overflow:hidden; }
  .metric-bar i { display:block; height:100%; border-radius:5px; }

  /* SPARK */
  .card { margin:18px 28px 0; background:#121E18; border:1px solid rgba(255,255,255,0.06); border-radius:22px; padding:18px; }
  .card-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .card-t { font-size:14px; font-weight:800; }
  .card-s { font-size:11px; color:#7E9088; font-weight:700; }
  .spark { display:flex; align-items:flex-end; gap:4px; height:62px; }
  .spark .b { flex:1; border-radius:4px 4px 0 0; }

  /* VIBRATION TOGGLE */
  .vib { margin:14px 28px 0; background:linear-gradient(135deg,#10B981,#0EA5A4); border-radius:22px; padding:18px 20px; display:flex; align-items:center; gap:15px; }
  .vib-ic { width:46px; height:46px; border-radius:15px; background:rgba(8,18,14,0.25); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .vib-ic i { font-size:19px; }
  .vib-t { font-size:14.5px; font-weight:800; }
  .vib-s { font-size:11.5px; font-weight:600; opacity:0.9; margin-top:2px; }
  .switch { margin-left:auto; width:50px; height:30px; border-radius:16px; background:rgba(8,18,14,0.3); position:relative; flex-shrink:0; }
  .switch.on { background:#0A1310; }
  .switch .knob { position:absolute; top:3px; left:23px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s; }

  /* CALIBRATE */
  .cal { margin:14px 28px 0; display:flex; gap:11px; }
  .cal-btn { flex:1; background:#121E18; border:1px solid rgba(255,255,255,0.07); border-radius:18px; padding:15px; display:flex; align-items:center; justify-content:center; gap:9px; font-size:13.5px; font-weight:800; }
  .cal-btn i { color:#5EEAD4; }

  .tabbar { position:absolute; bottom:0; left:0; right:0; height:92px; background:rgba(10,19,16,0.88); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-around; padding:12px 14px 0; z-index:100; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:5px; color:#5A6B62; font-size:10px; font-weight:700; }
  .tab.active { color:#34D399; }
  .tab i { font-size:19px; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar"><div class="time">9:41</div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

  <div class="header">
    <h1>Live Posture</h1>
    <div class="live-chip"><span class="pulse"></span> CONNECTED</div>
  </div>

  <!-- STAGE -->
  <div class="stage">
    <div class="stage-status">
      <div class="lbl">SPINE ALIGNMENT</div>
      <div class="big">Sitting tall</div>
    </div>
    <div class="figure">
      <!-- seated side-profile silhouette with highlighted spine -->
      <svg width="190" height="248" viewBox="0 0 190 248">
        <!-- chair -->
        <path d="M40 248 L40 150 M40 200 L150 200 L150 248" stroke="#1E2D26" stroke-width="7" fill="none" stroke-linecap="round"/>
        <!-- thigh -->
        <path d="M55 200 L135 200" stroke="#2A3F36" stroke-width="22" stroke-linecap="round"/>
        <!-- body silhouette -->
        <path d="M55 200 C50 150 58 120 70 96" stroke="#2A3F36" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.55"/>
        <!-- head -->
        <circle cx="82" cy="58" r="22" fill="#2A3F36" opacity="0.7"/>
        <!-- SPINE highlighted (healthy S-curve) -->
        <path d="M58 198 C54 168 60 138 64 116 C67 100 74 88 80 80" stroke="url(#sg)" stroke-width="8" stroke-linecap="round" fill="none"/>
        <!-- vertebrae dots -->
        <circle cx="58" cy="196" r="4.5" fill="#5EEAD4"/>
        <circle cx="56" cy="170" r="4.5" fill="#5EEAD4"/>
        <circle cx="60" cy="146" r="4.5" fill="#34D399"/>
        <circle cx="64" cy="124" r="4.5" fill="#34D399"/>
        <circle cx="71" cy="104" r="4.5" fill="#A3E635"/>
        <circle cx="79" cy="84" r="4.5" fill="#A3E635"/>
        <defs>
          <linearGradient id="sg" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#A3E635"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="ang-pill" style="top:60px; background:rgba(163,230,53,0.16); color:#A3E635;">Neck 12°</div>
      <div class="ang-pill" style="top:150px; background:rgba(52,211,153,0.16); color:#34D399;">Lumbar 38°</div>
      <div class="grade">
        <div class="g"><span class="d" style="background:#A3E635;"></span> Ideal</div>
        <div class="g"><span class="d" style="background:#FBBF24;"></span> Watch</div>
        <div class="g"><span class="d" style="background:#FB7185;"></span> Slouch</div>
      </div>
    </div>
  </div>

  <!-- METRICS -->
  <div class="metrics">
    <div class="metric">
      <div class="metric-l">Spine angle</div>
      <div class="metric-v">3.2<small>°</small></div>
      <div class="metric-bar"><i style="width:22%; background:#34D399;"></i></div>
    </div>
    <div class="metric">
      <div class="metric-l">Shoulder tilt</div>
      <div class="metric-v">1.8<small>°</small></div>
      <div class="metric-bar"><i style="width:14%; background:#5EEAD4;"></i></div>
    </div>
    <div class="metric">
      <div class="metric-l">Neck flex</div>
      <div class="metric-v">12<small>°</small></div>
      <div class="metric-bar"><i style="width:40%; background:#A3E635;"></i></div>
    </div>
  </div>

  <!-- SPARK -->
  <div class="card">
    <div class="card-h"><div class="card-t">Last 10 minutes</div><div class="card-s">94% upright</div></div>
    <div class="spark">
      <div class="b" style="height:80%;background:#34D399;"></div>
      <div class="b" style="height:90%;background:#34D399;"></div>
      <div class="b" style="height:72%;background:#34D399;"></div>
      <div class="b" style="height:55%;background:#A3E635;"></div>
      <div class="b" style="height:40%;background:#FBBF24;"></div>
      <div class="b" style="height:85%;background:#34D399;"></div>
      <div class="b" style="height:95%;background:#34D399;"></div>
      <div class="b" style="height:88%;background:#34D399;"></div>
      <div class="b" style="height:78%;background:#34D399;"></div>
      <div class="b" style="height:92%;background:#34D399;"></div>
      <div class="b" style="height:86%;background:#34D399;"></div>
      <div class="b" style="height:96%;background:#34D399;"></div>
    </div>
  </div>

  <!-- VIBRATION -->
  <div class="vib">
    <div class="vib-ic"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div>
      <div class="vib-t">Haptic reminders</div>
      <div class="vib-s">Buzz when you slouch &gt; 20s</div>
    </div>
    <div class="switch on"><div class="knob"></div></div>
  </div>

  <!-- CALIBRATE -->
  <div class="cal">
    <div class="cal-btn"><i class="fa-solid fa-crosshairs"></i> Calibrate</div>
    <div class="cal-btn"><i class="fa-solid fa-pause"></i> Pause session</div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i><span>Today</span></div>
    <div class="tab active"><i class="fa-solid fa-wave-square"></i><span>Live</span></div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i><span>Insights</span></div>
    <div class="tab"><i class="fa-solid fa-spa"></i><span>Coach</span></div>
    <div class="tab"><i class="fa-solid fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
