<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>Cadenza · Listening</title></head><body>
<div class="screen" style="background:#17161B;color:#fff">
  <div class="scroll" style="padding-bottom:0">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <div class="text-center"><p class="text-[12px] text-white/50 font-semibold uppercase tracking-wider">Listening</p><p class="font-bold text-[15px] mt-0.5">Clair de Lune</p></div>
    <div class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-sliders"></i></div>
  </div>

  <div class="flex flex-col items-center mt-10">
    <div class="relative w-[56px] h-[56px] flex items-center justify-center">
      <span class="absolute inset-0 rounded-full bg-rose-500/40 pulse"></span>
      <span class="w-4 h-4 rounded-full bg-rose-500"></span>
    </div>
    <p class="font-display font-bold text-[72px] leading-none mt-5 tabular-nums">04:37</p>
    <p class="text-white/50 text-[14px] mt-2">Bar <span class="text-white font-bold">14</span> of 72</p>
  </div>

  <!-- waveform -->
  <div class="mx-[28px] mt-10 h-[110px] text-[#F2A93B] flex items-center justify-center">
    <div class="wave" style="height:100px">
      <span style="height:30%;animation-delay:0s"></span><span style="height:55%;animation-delay:.1s"></span><span style="height:80%;animation-delay:.2s"></span><span style="height:45%;animation-delay:.3s"></span><span style="height:95%;animation-delay:.4s"></span><span style="height:60%;animation-delay:.5s"></span><span style="height:35%;animation-delay:.6s"></span><span style="height:75%;animation-delay:.7s"></span><span style="height:100%;animation-delay:.8s"></span><span style="height:50%;animation-delay:.9s"></span><span style="height:70%;animation-delay:1s"></span><span style="height:40%;animation-delay:.15s"></span><span style="height:85%;animation-delay:.25s"></span><span style="height:55%;animation-delay:.35s"></span><span style="height:30%;animation-delay:.45s"></span><span style="height:65%;animation-delay:.55s"></span><span style="height:90%;animation-delay:.65s"></span><span style="height:45%;animation-delay:.75s"></span><span style="height:70%;animation-delay:.85s"></span><span style="height:35%;animation-delay:.95s"></span><span style="height:60%;animation-delay:.05s"></span><span style="height:80%;animation-delay:.3s"></span><span style="height:40%;animation-delay:.6s"></span><span style="height:55%;animation-delay:.9s"></span>
    </div>
  </div>

  <!-- live meters -->
  <div class="px-c mt-8 grid grid-cols-3 gap-3">
    <div class="rounded-2xl bg-white/[.07] p-4"><p class="text-[11px] text-white/50 font-semibold uppercase tracking-wider">Tempo</p><p class="font-display font-bold text-[30px] leading-tight mt-1">66</p><p class="text-[11px] text-emerald-400 font-semibold">target 66</p></div>
    <div class="rounded-2xl bg-white/[.07] p-4"><p class="text-[11px] text-white/50 font-semibold uppercase tracking-wider">Notes</p><p class="font-display font-bold text-[30px] leading-tight mt-1">97<span class="text-[16px] text-white/50">%</span></p><p class="text-[11px] text-white/40 font-semibold">2 missed</p></div>
    <div class="rounded-2xl bg-white/[.07] p-4"><p class="text-[11px] text-white/50 font-semibold uppercase tracking-wider">Dynamics</p><p class="font-display font-bold text-[30px] leading-tight mt-1">pp</p><p class="text-[11px] text-amber-400 font-semibold">a little loud</p></div>
  </div>

  <!-- piano strip -->
  <div class="mx-[28px] mt-8 rounded-2xl overflow-hidden h-[92px] bg-[#111016] p-2">
    <div class="keys">
      <div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div><div class="w"></div>
      <div class="b" style="left:4.6%"></div><div class="b" style="left:11.7%"></div><div class="b" style="left:26%"></div><div class="b" style="left:33.1%"></div><div class="b" style="left:40.3%"></div><div class="b" style="left:54.6%"></div><div class="b" style="left:61.7%"></div><div class="b" style="left:76%"></div><div class="b" style="left:83.1%"></div><div class="b" style="left:90.3%"></div>
      <div class="absolute bottom-0 rounded-b" style="left:35.7%;width:7.1%;height:100%;background:rgba(242,169,59,.75);z-index:3"></div>
      <div class="absolute bottom-0 rounded-b" style="left:50%;width:7.1%;height:100%;background:rgba(242,169,59,.75);z-index:3"></div>
      <div class="absolute bottom-0 rounded-b" style="left:64.3%;width:7.1%;height:100%;background:rgba(242,169,59,.75);z-index:3"></div>
    </div>
  </div>
  <p class="text-center text-white/40 text-[12px] mt-3">Hearing D♭ major, both hands</p>
  </div>

  <div class="absolute left-0 right-0 bottom-0 px-c pb-12 pt-6 flex items-center justify-between" style="background:linear-gradient(180deg,rgba(23,22,27,0),#17161B 35%)">
    <div class="flex flex-col items-center gap-2 w-16"><div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-rotate-left"></i></div><span class="text-[11px] text-white/50 font-semibold">Redo bar</span></div>
    <div class="w-[84px] h-[84px] rounded-full bg-white flex items-center justify-center shadow-2xl"><div class="w-8 h-8 rounded-lg bg-rose-500"></div></div>
    <div class="flex flex-col items-center gap-2 w-16"><div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-stopwatch"></i></div><span class="text-[11px] text-white/50 font-semibold">Metronome</span></div>
  </div>
</div>
</body></html>
