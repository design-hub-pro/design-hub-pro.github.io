<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadenza · AI piano practice app</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Inter',sans-serif;color:#17161B}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2d31,#0b0c0d);box-shadow:0 50px 80px -30px rgba(20,20,30,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F6F4F0}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#F2A93B,#C9711A)"><i class="fa-solid fa-music text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-bold tracking-tight" style="font-family:Fraunces,Georgia,serif">Cadenza</h1>
  <p class="mt-3 text-[19px] text-gray-500">Play. Cadenza listens, marks the bars that need work, and keeps you practicing.</p>
  <div class="mt-6 flex gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-amber-50 text-amber-800">Music Education</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">AI Audio Analysis</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Progress Tracking</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Social</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="welcome.html" scrolling="no" title="welcome"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="record.html" scrolling="no" title="record"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="feedback.html" scrolling="no" title="feedback"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="piece.html" scrolling="no" title="piece"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="progress.html" scrolling="no" title="progress"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="community.html" scrolling="no" title="community"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="challenge.html" scrolling="no" title="challenge"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
</div></main>
</body></html>
