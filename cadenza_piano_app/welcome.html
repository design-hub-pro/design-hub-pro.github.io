<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>Cadenza · Welcome</title></head><body>
<div class="screen" style="background:#17161B">
  <img src="assets/hands.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:60% 40%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(23,22,27,.15) 0%,rgba(23,22,27,.2) 35%,rgba(23,22,27,.96) 68%,#17161B 100%)"></div>
  <div class="absolute inset-0 flex flex-col">
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="flex-1"></div>
    <div class="px-c pb-12 text-white">
      <div class="w-14 h-14 rounded-2xl grad-gold flex items-center justify-center mb-6"><i class="fa-solid fa-music text-[22px]"></i></div>
      <h1 class="font-display font-bold text-[46px] leading-[1.02]">Your piano teacher<br>between lessons.</h1>
      <p class="mt-4 text-white/70 text-[16px] leading-relaxed">Play. Cadenza listens, marks the bars that need work, and keeps you coming back.</p>
      <p class="mt-7 text-[12px] font-semibold uppercase tracking-wider text-white/50">I play at</p>
      <div class="mt-3 flex gap-2">
        <span class="chip bg-white/10 text-white border border-white/15">Beginner</span>
        <span class="chip grad-gold text-white">Intermediate</span>
        <span class="chip bg-white/10 text-white border border-white/15">Advanced</span>
      </div>
      <div class="btn grad-gold text-white mt-7">Get started<i class="fa-solid fa-arrow-right text-[15px]"></i></div>
      <div class="btn bg-white/10 text-white mt-3 h-[54px]"><i class="fa-brands fa-apple text-[20px]"></i>Continue with Apple</div>
    </div>
  </div>
</div>
</body></html>
