<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>Cadenza · Challenge</title></head><body>
<div class="screen" style="background:#17161B;color:#fff"><div class="scroll">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <p class="font-bold text-[15px]">Weekly challenge</p>
    <div class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
  </div>

  <div class="px-c mt-6 text-center">
    <span class="chip bg-[#F2A93B] text-[#17161B]"><i class="fa-regular fa-clock"></i>Ends Sunday</span>
    <h1 class="font-display font-bold text-[38px] leading-tight mt-4">150 minutes<br>of Chopin</h1>
    <p class="text-white/50 text-[14px] mt-2">38 friends joined</p>
  </div>

  <!-- podium -->
  <div class="px-c mt-8 flex items-end justify-center gap-3">
    <div class="flex flex-col items-center flex-1"><img src="assets/av3.jpg" class="w-16 h-16 rounded-full object-cover ring-[3px] ring-white/20"><p class="font-bold text-[13px] mt-2">Mia</p><p class="text-[11px] text-white/50 font-semibold">148 min</p><div class="w-full h-[72px] mt-2 rounded-t-2xl bg-white/10 flex items-start justify-center pt-2 font-display font-bold text-[20px] text-white/60">2</div></div>
    <div class="flex flex-col items-center flex-1"><div class="relative"><img src="assets/av2.jpg" class="w-20 h-20 rounded-full object-cover ring-[3px] ring-[#F2A93B]"><div class="absolute -top-3 left-1/2 -translate-x-1/2 text-[#F2A93B] text-[20px]"><i class="fa-solid fa-crown"></i></div></div><p class="font-bold text-[14px] mt-2">Noah</p><p class="text-[11px] text-white/50 font-semibold">176 min</p><div class="w-full h-[104px] mt-2 rounded-t-2xl grad-gold flex items-start justify-center pt-2 font-display font-bold text-[24px]">1</div></div>
    <div class="flex flex-col items-center flex-1"><img src="assets/av1.jpg" class="w-16 h-16 rounded-full object-cover ring-[3px] ring-white/20"><p class="font-bold text-[13px] mt-2">You</p><p class="text-[11px] text-white/50 font-semibold">102 min</p><div class="w-full h-[56px] mt-2 rounded-t-2xl bg-white/10 flex items-start justify-center pt-2 font-display font-bold text-[20px] text-white/60">3</div></div>
  </div>

  <div class="mt-0 rounded-t-[32px] bg-[#F6F4F0] text-[#17161B] px-c pt-6 pb-8 min-h-[460px]">
    <div class="flex items-center justify-between"><h2 class="font-display font-bold text-[21px]">Leaderboard</h2><span class="text-[13px] font-semibold text-gray-400">Minutes</span></div>
    <div class="mt-4 space-y-2">
      <div class="card p-3 flex items-center gap-3 ring-2 ring-[#F2A93B]"><span class="w-6 text-center font-bold text-[14px] text-[#C9711A]">3</span><img src="assets/av1.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14px]">You</p><div class="bar mt-1.5 w-[70%]"><span class="grad-gold" style="width:68%"></span></div></div><span class="font-display font-bold text-[20px]">102</span></div>
      <div class="card p-3 flex items-center gap-3"><span class="w-6 text-center font-bold text-[14px] text-gray-400">4</span><img src="assets/av4.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14px]">Theo</p><div class="bar mt-1.5 w-[70%]"><span class="bg-gray-300" style="width:64%"></span></div></div><span class="font-display font-bold text-[20px]">96</span></div>
      <div class="card p-3 flex items-center gap-3"><span class="w-6 text-center font-bold text-[14px] text-gray-400">5</span><img src="assets/av5.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14px]">Ava</p><div class="bar mt-1.5 w-[70%]"><span class="bg-gray-300" style="width:55%"></span></div></div><span class="font-display font-bold text-[20px]">83</span></div>
      <div class="card p-3 flex items-center gap-3"><span class="w-6 text-center font-bold text-[14px] text-gray-400">6</span><img src="assets/av7.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14px]">Omar</p><div class="bar mt-1.5 w-[70%]"><span class="bg-gray-300" style="width:47%"></span></div></div><span class="font-display font-bold text-[20px]">71</span></div>
      <div class="card p-3 flex items-center gap-3"><span class="w-6 text-center font-bold text-[14px] text-gray-400">7</span><img src="assets/av6.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14px]">Jonas</p><div class="bar mt-1.5 w-[70%]"><span class="bg-gray-300" style="width:36%"></span></div></div><span class="font-display font-bold text-[20px]">54</span></div>
    </div>
    <div class="mt-5 btn grad-gold text-white"><i class="fa-solid fa-microphone"></i>Add 48 minutes to pass Mia</div>
  </div>
</div>
<nav class="tabbar">
<div class="tab "><i class="fa-solid fa-house"></i>Home</div>
<div class="tab "><i class="fa-solid fa-book-open"></i>Library</div>
<div class="tab go"><div class="fab"><i class="fa-solid fa-microphone"></i></div></div>
<div class="tab "><i class="fa-solid fa-chart-line"></i>Progress</div>
<div class="tab on"><i class="fa-solid fa-users"></i>Friends</div>
</nav></div>
</body></html>
