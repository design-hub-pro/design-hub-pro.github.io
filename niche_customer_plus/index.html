<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niche CUSTOMER+ | Social-Powered Product Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            min-height: 100vh;
            color: #1a1a1a;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .logo-icon i {
            background: linear-gradient(135deg, #667EEA, #764BA2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text {
            font-size: 34px;
            font-weight: 700;
            color: white;
        }

        .logo-text span {
            color: #FFE066;
        }

        .tagline {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* Key Features */
        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            padding: 10px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .feature i {
            font-size: 16px;
        }

        .feature span {
            font-size: 13px;
            font-weight: 500;
            color: white;
        }

        .feature.youtube i { color: #FF0000; }
        .feature.tiktok i { color: #00F2EA; }
        .feature.affiliate i { color: #FFE066; }

        /* Screens Gallery */
        .screens-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 36px;
            padding: 20px 40px 100px;
            max-width: 2400px;
            margin: 0 auto;
        }

        .screen-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* iPhone 17 Pro Frame */
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 11px;
            box-shadow:
                0 50px 100px rgba(0, 0, 0, 0.3),
                0 20px 50px rgba(0, 0, 0, 0.2),
                inset 0 0 0 2px #333,
                inset 0 0 0 4px #1a1a1a;
            position: relative;
        }

        /* Dynamic Island */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 18px;
            z-index: 10;
        }

        /* Side Button */
        .phone-frame::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 160px;
            width: 3px;
            height: 90px;
            background: #333;
            border-radius: 0 2px 2px 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 44px;
            overflow: hidden;
            background: #f9fafb;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive */
        @media (max-width: 1600px) {
            .screens-gallery {
                gap: 28px;
                padding: 20px 30px 80px;
            }

            .phone-frame {
                width: 340px;
                height: 736px;
                border-radius: 50px;
            }

            .phone-frame::before {
                width: 108px;
                height: 30px;
            }

            .phone-screen {
                border-radius: 40px;
            }
        }

        @media (max-width: 1200px) {
            .screens-gallery {
                gap: 24px;
                padding: 20px 20px 70px;
            }

            .phone-frame {
                width: 300px;
                height: 650px;
                border-radius: 46px;
                padding: 10px;
            }

            .phone-frame::before {
                width: 95px;
                height: 28px;
                top: 14px;
            }

            .phone-screen {
                border-radius: 36px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 36px 20px 24px;
            }

            .logo-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .logo-text {
                font-size: 26px;
            }

            .tagline {
                font-size: 15px;
            }

            .features {
                gap: 12px;
            }

            .feature {
                padding: 8px 12px;
            }

            .feature span {
                font-size: 11px;
            }

            .screens-gallery {
                gap: 20px;
                padding: 20px 16px 60px;
            }

            .phone-frame {
                width: 280px;
                height: 606px;
                border-radius: 42px;
                padding: 8px;
            }

            .phone-frame::before {
                width: 85px;
                height: 25px;
                top: 12px;
            }

            .phone-screen {
                border-radius: 34px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-fire-flame-curved"></i>
            </div>
            <span class="logo-text">Niche <span>CUSTOMER+</span></span>
        </div>
        <p class="tagline">Social-Powered Product Discovery for Gen Z</p>
        <p class="tagline" style="font-size: 14px; opacity: 0.85; margin-top: -8px;">Real reviews from TikTok, YouTube & Reddit. Shop via affiliate links.</p>

        <div class="features">
            <div class="feature youtube">
                <i class="fab fa-youtube"></i>
                <span>Video Transcripts</span>
            </div>
            <div class="feature tiktok">
                <i class="fab fa-tiktok"></i>
                <span>Social Reviews</span>
            </div>
            <div class="feature ai" style="background: rgba(99,102,241,0.3);">
                <i class="fas fa-brain" style="color: #A5B4FC;"></i>
                <span>AI Fake Detection</span>
            </div>
            <div class="feature affiliate">
                <i class="fas fa-link"></i>
                <span>Affiliate Model</span>
            </div>
        </div>
    </header>

    <!-- Screens Gallery -->
    <section class="screens-gallery">
        <div class="screen-wrapper">
            <span class="screen-label">Home</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="home.html" title="Home Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Social Reviews</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="social_reviews.html" title="Social Reviews Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Product Details</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="product.html" title="Product Details Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">AI Analysis</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="ai_analysis.html" title="AI Analysis Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Business Model</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="business_model.html" title="Business Model Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Scan</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="scan.html" title="Scan Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Profile</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="profile.html" title="Profile Screen"></iframe>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
