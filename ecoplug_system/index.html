<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPlug — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-amber-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-plug text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">EcoPlug</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A smart outlet that measures what each plugged-in device draws and lets you switch it off from your phone.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Hardware</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">IoT</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Smart Home</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Energy</span>
        </div>
    </div>

    <!-- Shots: all 8, two per row -->
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825244588-image-1.png" alt="EcoPlug — in use in a living room with the phone app"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825251170-image-1.png" alt="EcoPlug — the device, three-quarter view with a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825257117-image-1.png" alt="EcoPlug — installed behind a TV cabinet"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825262963-image-1.png" alt="EcoPlug — hands plugging in a device and pressing the pairing button"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825268933-image-1.png" alt="EcoPlug — signal path from current sensor to microcontroller, cloud and phone"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825327842-image-1.png" alt="EcoPlug — exploded stack of shell, relays, sensing board, controller and power module"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825280570-image-1.png" alt="EcoPlug — bench check against a reference power meter and clamp meter"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791825322350-image-1.png" alt="EcoPlug — wiring and power concept with relays, current sensors and isolated low-voltage side"></div>
        </div>
    </div>
</body>
</html>
