<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Learn your bottle</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.stage{position:relative;height:344px;margin-top:18px;border-radius:30px;background:radial-gradient(120% 90% at 50% 0%,#E3F7FC 0%,#F2F9FB 55%,#fff 100%);border:1px solid var(--border);overflow:hidden}
.read{position:absolute;right:24px;top:28px;text-align:right}
.read b{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.read b small{font-size:18px;color:var(--muted);letter-spacing:-.3px;margin-left:2px}
.mark{position:absolute;left:170px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.mark:before{content:"";width:34px;border-top:1.5px dashed #9FB3BF}
.cap{color:var(--sip)}
.cap:before{border-color:var(--sip)}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px}
.row + .row{border-top:1px solid var(--border)}
.row b{font-size:22px;font-weight:800;letter-spacing:-.8px}
.wave{animation:wv 3s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(-18px)}}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">3:43</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad mt-3">
    <div class="flex items-center justify-between">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="flex gap-1.5"><i class="w-6 h-2 rounded bg-cyan-700 block"></i><i class="w-6 h-2 rounded bg-cyan-700 block"></i><i class="w-6 h-2 rounded bg-slate-200 block"></i></div>
      <div class="w-11"></div>
    </div>
    <div class="meta mt-6">Step 2 of 3</div>
    <div class="h1 mt-2">Learn your bottle</div>
    <div class="sub mt-2">Fill it to the cap line and set it down.</div>

    <div class="stage">
      <svg width="178" height="320" viewBox="0 0 200 360" style="position:absolute;left:22px;top:14px">
        <defs>
          <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
          <clipPath id="b"><path d="M70 40 h60 v22 q0 10 10 18 q20 16 20 44 v206 q0 18 -18 18 h-84 q-18 0 -18 -18 v-206 q0 -28 20 -44 q10 -8 10 -18z"/></clipPath>
        </defs>
        <rect x="74" y="14" width="52" height="28" rx="7" fill="#0A1A24"/>
        <path d="M70 40 h60 v22 q0 10 10 18 q20 16 20 44 v206 q0 18 -18 18 h-84 q-18 0 -18 -18 v-206 q0 -28 20 -44 q10 -8 10 -18z" fill="#fff" stroke="#C9D8E0" stroke-width="2"/>
        <g clip-path="url(#b)">
          <path class="wave" d="M0 92 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 v300 h-250z" fill="url(#w)" opacity=".95"/>
          <rect x="40" y="168" width="120" height="150" rx="12" fill="#0E7490" opacity=".9"/>
          <rect x="40" y="168" width="120" height="150" rx="12" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity=".6"/>
          <circle cx="100" cy="300" r="5" fill="#5EEAD4"/>
        </g>
        <text x="100" y="250" text-anchor="middle" font-family="Inter" font-size="13" font-weight="800" fill="#fff" letter-spacing="1.5">TILTCUFF</text>
      </svg>
      <div class="mark cap" style="top:90px"><i class="fa-solid fa-check-circle"></i>Cap line</div>
      <div class="mark" style="top:160px">Sleeve</div>
      <div class="mark" style="top:290px">Load cell</div>
      <div class="read">
        <div class="meta">Live weight</div>
        <b class="num block mt-2">892<small>g</small></b>
        <div class="pill mt-3" style="background:rgba(18,184,134,.12);color:#0E9F6E"><span class="live"></span>Steady 2.4 s</div>
      </div>
    </div>

    <div class="card mt-5">
      <div class="row">
        <div class="gicon g-bump"><i class="fa-solid fa-bottle-water"></i></div>
        <div class="flex-1"><div class="text-[13px] font-semibold text-slate-500">Empty</div><b class="num">182 g</b></div>
        <i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
      </div>
      <div class="row">
        <div class="gicon g-water"><i class="fa-solid fa-droplet"></i></div>
        <div class="flex-1"><div class="text-[13px] font-semibold text-slate-500">Full</div><b class="num">892 g</b></div>
        <i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
      </div>
      <div class="row" style="background:var(--surface);border-radius:0 0 24px 24px">
        <div class="flex-1 text-[13px] font-semibold text-slate-500">Bottle holds</div>
        <b class="num" style="color:var(--deep)">710 ml</b>
      </div>
    </div>

    <div class="btn mt-6">Save bottle<i class="fa-solid fa-arrow-right"></i></div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
