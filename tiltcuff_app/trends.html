<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Trends</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.seg{display:flex;background:#E9F0F3;border-radius:14px;padding:4px;margin-top:18px}
.seg span{flex:1;text-align:center;padding:8px 0;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(10,26,36,.08)}
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:172px;position:relative;margin-top:14px}
.chart .goal{position:absolute;left:0;right:0;bottom:145px;border-top:2px dashed #CBD5E1}
.chart .goal span{position:absolute;right:0;top:-20px;font-size:10.5px;font-weight:700;color:var(--muted)}
.col{width:30px;display:flex;flex-direction:column;align-items:center;gap:8px}
.col .b{width:30px;border-radius:10px;background:var(--grad);position:relative}
.col .b.lo{background:linear-gradient(180deg,#FCD34D,#F2A626)}
.col .b em{position:absolute;left:0;right:0;top:-4px;height:6px;border-radius:3px;background:var(--spill)}
.col small{font-size:11px;font-weight:600;color:var(--muted)}
.col.today small{color:var(--ink);font-weight:800}
.stats{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:14px}
.st{padding:16px}
.st b{font-size:32px;font-weight:800;letter-spacing:-1.4px;line-height:1;display:block;margin-top:8px}
.st b span{font-size:14px;color:var(--faint);letter-spacing:0}
.sess{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:0 28px 4px}
.sc{flex:none;width:200px;height:224px;border-radius:24px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.sc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,36,0) 30%,rgba(10,26,36,.88) 100%)}
.sc > div{position:absolute;left:16px;right:16px;bottom:15px;z-index:2;color:#fff}
.sc .bar{background:rgba(255,255,255,.25);height:6px;margin-top:9px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">8:02</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="pad">
    <div class="flex items-end justify-between mt-3"><div><div class="meta">Oct 24 – 30</div><div class="h1 mt-1.5">Trends</div></div><div class="iconbtn"><i class="fa-solid fa-arrow-up-from-bracket"></i></div></div>
    <div class="seg"><span>Day</span><span class="on">Week</span><span>Month</span></div>

    <div class="card mt-4 p-5">
      <div class="flex items-end justify-between">
        <div><div class="text-[13px] font-semibold text-slate-500">Daily average</div><div class="text-[36px] font-extrabold tracking-tighter leading-none mt-1 num">2.04<span class="text-base text-slate-400"> L</span></div></div>
        <span class="pill" style="background:rgba(18,184,134,.12);color:#0E9F6E"><i class="fa-solid fa-arrow-trend-up"></i>+12%</span>
      </div>
      <div class="chart">
        <div class="goal"><span class="num">2.2 L</span></div>
        <div class="col"><div class="b" style="height:112px"></div><small>F</small></div>
        <div class="col"><div class="b lo" style="height:74px"><em></em></div><small>S</small></div>
        <div class="col"><div class="b lo" style="height:88px"></div><small>S</small></div>
        <div class="col"><div class="b" style="height:126px"></div><small>M</small></div>
        <div class="col"><div class="b" style="height:121px"><em></em></div><small>T</small></div>
        <div class="col"><div class="b" style="height:131px"></div><small>W</small></div>
        <div class="col today"><div class="b" style="height:98px;opacity:.55"></div><small>T</small></div>
      </div>
      <div class="flex gap-4 mt-4 text-[11px] font-semibold text-slate-500"><span><span class="dot mr-1" style="background:var(--deep)"></span>Goal met</span><span><span class="dot mr-1" style="background:var(--refill)"></span>Short</span><span><span class="dot mr-1" style="background:var(--spill)"></span>Spill caught</span></div>
    </div>

    <div class="stats">
      <div class="card st"><div class="flex items-center gap-2"><div class="gicon g-spill" style="width:30px;height:30px;border-radius:10px;font-size:12px"><i class="fa-solid fa-shield-halved"></i></div><span class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">Kept out</span></div><b class="num">410<span> ml</span></b><div class="text-[12px] font-medium text-slate-400 mt-1.5">4 spills, 11 bumps</div></div>
      <div class="card st"><div class="flex items-center gap-2"><div class="gicon g-refill" style="width:30px;height:30px;border-radius:10px;font-size:12px"><i class="fa-solid fa-fire"></i></div><span class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">Streak</span></div><b class="num">5<span> days</span></b><div class="text-[12px] font-medium text-slate-400 mt-1.5">Best: 9</div></div>
    </div>

    <div class="sec"><div class="h2">Practices</div><span class="act">See all</span></div>
    <div class="sess">
      <div class="sc" style="background-image:url(img/court.jpg)"><div><div class="text-[11px] font-bold opacity-75 uppercase tracking-wider">Today · 2h 10m</div><div class="text-[19px] font-extrabold tracking-tight mt-1 num">910 ml</div><div class="bar"><i style="width:82%"></i></div></div></div>
      <div class="sc" style="background-image:url(img/track.jpg)"><div><div class="text-[11px] font-bold opacity-75 uppercase tracking-wider">Wed · 1h 30m</div><div class="text-[19px] font-extrabold tracking-tight mt-1 num">760 ml</div><div class="bar"><i style="width:100%"></i></div></div></div>
      <div class="sc" style="background-image:url(img/field.jpg)"><div><div class="text-[11px] font-bold opacity-75 uppercase tracking-wider">Tue · 2h 30m</div><div class="text-[19px] font-extrabold tracking-tight mt-1 num">1.10 L</div><div class="bar"><i style="width:94%"></i></div></div></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-droplet"></i>Today</div>
  <div class="tab"><i class="fa-solid fa-stopwatch"></i>Practice</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-bottle-water"></i></div></div>
  <div class="tab on"><i class="fa-solid fa-chart-simple"></i>Trends</div>
  <div class="tab"><i class="fa-solid fa-user-group"></i>Team</div>
</div>
<div class="homebar"></div>
</div></body></html>
