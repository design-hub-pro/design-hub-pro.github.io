<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Refill alerts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.wall{position:absolute;inset:0;background:url(img/track.jpg) center/cover}
.wall:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,36,.25) 0%,rgba(10,26,36,.05) 35%,rgba(10,26,36,.55) 100%)}
.clock{text-align:center;color:#fff;position:relative;z-index:2}
.clock .d{font-size:19px;font-weight:600;opacity:.92}
.clock .h{font-size:104px;font-weight:700;letter-spacing:-4px;line-height:1;margin-top:2px}
.glass{background:rgba(245,248,250,.72);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border-radius:26px}
.la{padding:16px 18px}
.noti{padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.noti .ap{width:40px;height:40px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex:none}
.noti .tt{font-size:15px;font-weight:700;letter-spacing:-.3px}
.noti .bd{font-size:14px;color:#2A3F4C;font-weight:500;line-height:1.3;margin-top:1px}
.noti .tm{font-size:12px;color:#5B6E7A;font-weight:500;margin-left:auto;flex:none}
.stack{position:relative}
.stack:after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:20px;border-radius:0 0 20px 20px;background:rgba(245,248,250,.5);backdrop-filter:blur(20px);z-index:-1}
.lb{position:absolute;bottom:44px;width:50px;height:50px;border-radius:50%;background:rgba(10,26,36,.35);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;z-index:5}
.mini{position:relative;width:62px;height:62px;flex:none}
.mini .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
</style></head>
<body><div class="screen" style="background:#000">
  <div class="wall"></div>
  <div class="sb light"><span class="t"></span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half"></i></div></div>
  <div class="clock mt-6">
    <div class="d"><i class="fa-solid fa-lock text-[14px] mr-1.5"></i>Thursday, October 30</div>
    <div class="h num">5:18</div>
  </div>

  <div class="pad relative z-10" style="margin-top:250px">
    <div class="glass la">
      <div class="flex items-center gap-4">
        <div class="mini">
          <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" fill="none" stroke="rgba(10,26,36,.12)" stroke-width="7"/><circle cx="31" cy="31" r="26" fill="none" stroke="#0891B2" stroke-width="7" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="52" transform="rotate(-90 31 31)"/></svg>
          <div class="c num">68%</div>
        </div>
        <div class="flex-1">
          <div class="text-[12px] font-bold tracking-wider text-slate-600 uppercase">Track practice · 0:48</div>
          <div class="text-[24px] font-extrabold tracking-tight leading-tight num">1.50 <span class="text-[15px] text-slate-500">/ 2.2 L</span></div>
        </div>
        <div class="text-right">
          <div class="w-7 h-14 rounded-lg relative overflow-hidden ml-auto" style="background:rgba(10,26,36,.12)"><i class="absolute left-0 right-0 bottom-0 h-[12%] block" style="background:var(--gradRefill)"></i></div>
        </div>
      </div>
    </div>

    <div class="text-white text-[13px] font-semibold mt-5 mb-2 px-1 flex justify-between"><span>Notifications</span><span class="opacity-70">Show less</span></div>

    <div class="glass noti">
      <div class="ap" style="background:var(--gradRefill)"><i class="fa-solid fa-bottle-water"></i></div>
      <div class="flex-1">
        <div class="flex"><span class="tt">Refill now</span><span class="tm">now</span></div>
        <div class="bd">85 ml left. Cooler is by the north gate.</div>
      </div>
    </div>
    <div class="stack mt-2.5">
      <div class="glass noti">
        <div class="ap"><i class="fa-solid fa-droplet"></i></div>
        <div class="flex-1">
          <div class="flex"><span class="tt">Time to sip</span><span class="tm">9m ago</span></div>
          <div class="bd">18 min since your last drink. Aim for 150 ml.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="lb" style="left:46px"><i class="fa-solid fa-lightbulb"></i></div>
  <div class="lb" style="right:46px"><i class="fa-solid fa-camera"></i></div>
  <div class="homebar light"></div>
</div></body></html>
