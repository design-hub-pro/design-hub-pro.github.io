<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.me{display:flex;align-items:center;gap:16px;margin-top:16px}
.me img{width:76px;height:76px;border-radius:26px;object-fit:cover;border:3px solid #fff;box-shadow:0 10px 24px -10px rgba(10,26,36,.4)}
.goal{padding:20px;margin-top:20px;position:relative;overflow:hidden}
.goal .big{font-size:40px;font-weight:800;letter-spacing:-1.8px;line-height:1}
.goal .big small{font-size:17px;color:var(--faint);letter-spacing:0}
.fx{display:flex;gap:8px;margin-top:16px}
.fx div{flex:1;border-radius:15px;background:var(--surface);padding:10px 11px}
.fx div i{font-size:13px}
.fx div b{display:block;font-size:14px;font-weight:700;margin-top:4px;letter-spacing:-.2px}
.row{display:flex;align-items:center;gap:13px;padding:13px 16px}
.row + .row{border-top:1px solid var(--border)}
.row .gicon{width:38px;height:38px;border-radius:12px;font-size:15px}
.row .l{font-size:15px;font-weight:600;letter-spacing:-.2px}
.row .r{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.tg{width:50px;height:30px;border-radius:16px;background:#34C759;position:relative;flex:none;margin-left:auto}
.tg:after{content:"";position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.off{background:#E3E8EB}.tg.off:after{right:auto;left:2px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">8:15</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><div class="text-[16px] font-bold">Profile</div><div class="iconbtn"><i class="fa-solid fa-gear"></i></div></div>
    <div class="me">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&h=200&fit=crop">
      <div><div class="text-[24px] font-extrabold tracking-tight">Maya Santos</div>
        <div class="flex gap-2 mt-1.5"><span class="pill" style="background:rgba(8,145,178,.1);color:var(--deep);padding:5px 10px"><i class="fa-solid fa-futbol"></i>Soccer</span><span class="pill" style="background:var(--surface);color:var(--ink2);padding:5px 10px">Age 15</span></div></div>
    </div>

    <div class="card goal">
      <div class="flex items-start justify-between">
        <div><div class="meta">Practice-day goal</div><div class="big num mt-2">2.2<small> L</small></div></div>
        <div class="text-[13px] font-semibold" style="color:var(--water)">Edit</div>
      </div>
      <div class="fx">
        <div><i class="fa-solid fa-weight-scale text-cyan-600"></i><b class="num">52 kg</b></div>
        <div><i class="fa-solid fa-clock text-violet-500"></i><b class="num">2.5 h</b></div>
        <div><i class="fa-solid fa-sun" style="color:var(--refill)"></i><b class="num">80°F+</b></div>
      </div>
      <div class="text-[11.5px] font-medium text-slate-400 mt-3">Starting point. Confirm with your coach or doctor.</div>
    </div>

    <div class="sec"><div class="h2">Bottle</div></div>
    <div class="card">
      <div class="row"><div class="gicon g-water"><i class="fa-solid fa-bottle-water"></i></div><span class="l">Capacity</span><span class="r num">710 ml</span></div>
      <div class="row"><div class="gicon g-violet"><i class="fa-solid fa-scale-balanced"></i></div><span class="l">Re-learn weights</span><span class="r">Oct 12<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i></span></div>
    </div>

    <div class="sec"><div class="h2">Alerts</div></div>
    <div class="card">
      <div class="row"><div class="gicon g-spill"><i class="fa-solid fa-triangle-exclamation"></i></div><span class="l">Spills</span><div class="tg"></div></div>
      <div class="row"><div class="gicon g-refill"><i class="fa-solid fa-rotate"></i></div><span class="l">Refill at</span><span class="r num">15%<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i></span></div>
      <div class="row"><div class="gicon g-sip"><i class="fa-solid fa-droplet"></i></div><span class="l">Sip nudge</span><span class="r num">15 min<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i></span></div>
      <div class="row"><div class="gicon g-bump"><i class="fa-solid fa-user-shield"></i></div><span class="l">Share with</span><span class="r"><span class="avs"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop"></span><i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i></span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-droplet"></i>Today</div>
  <div class="tab"><i class="fa-solid fa-stopwatch"></i>Practice</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-bottle-water"></i></div></div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Trends</div>
  <div class="tab"><i class="fa-solid fa-user-group"></i>Team</div>
</div>
<div class="homebar"></div>
</div></body></html>
