<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.hero{border-radius:28px;padding:20px;background:var(--grad);color:#fff;position:relative;overflow:hidden;margin-top:18px}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:after{content:"";position:absolute;right:30px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;position:relative;z-index:2}
.tri div + div{border-left:1px solid rgba(255,255,255,.22);padding-left:14px}
.tri b{font-size:30px;font-weight:800;letter-spacing:-1.2px;display:block;line-height:1}
.tri small{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.8;text-transform:uppercase}
.pl{display:flex;align-items:center;gap:13px;padding:12px 16px}
.pl + .pl{border-top:1px solid var(--border)}
.pl .ph{position:relative;flex:none}
.pl .ph img{width:46px;height:46px;border-radius:15px;object-fit:cover}
.pl .ph .dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border:3px solid #fff}
.pl .nm{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.pl .bar{height:6px;margin-top:7px;width:150px}
.pl .v{margin-left:auto;text-align:right}
.pl .v b{font-size:18px;font-weight:800;letter-spacing:-.6px;display:block}
.pl .v small{font-size:11px;font-weight:600;color:var(--muted)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">5:22</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half"></i></div></div>
  <div class="pad">
    <div class="flex items-end justify-between mt-3"><div><div class="meta">Coach view</div><div class="h1 mt-1.5">Lions U16</div></div><div class="iconbtn"><i class="fa-solid fa-bullhorn"></i></div></div>

    <div class="hero">
      <div class="flex items-center justify-between relative z-10">
        <span class="pill" style="background:rgba(255,255,255,.2)"><span class="live" style="background:#fff"></span>Practice · 0:52</span>
        <div class="avs"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=80&h=80&fit=crop" style="border-color:#0891B2"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop" style="border-color:#0891B2"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop" style="border-color:#0891B2"><span style="border-color:#0891B2;background:#fff;color:#0566A8">+15</span></div>
      </div>
      <div class="tri">
        <div><b class="num">14</b><small>On pace</small></div>
        <div><b class="num">3</b><small>Behind</small></div>
        <div><b class="num">1</b><small>Empty</small></div>
      </div>
    </div>

    <div class="flex gap-2 mt-5 overflow-x-auto">
      <span class="chip on">Needs water · 4</span><span class="chip">All 18</span><span class="chip">Spills</span>
    </div>

    <div class="card mt-4">
      <div class="pl">
        <div class="ph"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop"><span class="dot" style="background:var(--spill)"></span></div>
        <div><div class="nm">Jordan K.</div><div class="bar"><i style="width:8%;background:var(--gradSpill)"></i></div></div>
        <div class="v"><b class="num" style="color:var(--spill)">Empty</b><small class="num">22 min ago</small></div>
      </div>
      <div class="pl">
        <div class="ph"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop"><span class="dot" style="background:var(--refill)"></span></div>
        <div><div class="nm">Ava R.</div><div class="bar"><i style="width:34%;background:var(--gradRefill)"></i></div></div>
        <div class="v"><b class="num">-210</b><small>ml behind</small></div>
      </div>
      <div class="pl">
        <div class="ph"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop"><span class="dot" style="background:var(--refill)"></span></div>
        <div><div class="nm">Leo M.</div><div class="bar"><i style="width:41%;background:var(--gradRefill)"></i></div></div>
        <div class="v"><b class="num">-160</b><small>ml behind</small></div>
      </div>
      <div class="pl">
        <div class="ph"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&h=100&fit=crop"><span class="dot" style="background:var(--refill)"></span></div>
        <div><div class="nm">Maya S.</div><div class="bar"><i style="width:47%;background:var(--gradRefill)"></i></div></div>
        <div class="v"><b class="num">-90</b><small>ml behind</small></div>
      </div>
      <div class="pl">
        <div class="ph"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop"><span class="dot" style="background:var(--sip)"></span></div>
        <div><div class="nm">Zoe T.</div><div class="bar"><i style="width:72%"></i></div></div>
        <div class="v"><b class="num" style="color:#0E9F6E">+40</b><small>ml ahead</small></div>
      </div>
    </div>

    <div class="btn dark mt-5"><i class="fa-solid fa-droplet"></i>Call a water break</div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-droplet"></i>Today</div>
  <div class="tab"><i class="fa-solid fa-stopwatch"></i>Practice</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-bottle-water"></i></div></div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Trends</div>
  <div class="tab on"><i class="fa-solid fa-user-group"></i>Team</div>
</div>
<div class="homebar"></div>
</div></body></html>
