<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Pair sleeve</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.hero{position:absolute;top:0;left:0;right:0;height:560px;background:url(img/pair.jpg) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,36,.55) 0%,rgba(10,26,36,.05) 30%,rgba(247,250,251,0) 62%,var(--bg) 100%)}
.radar{position:absolute;left:50%;top:300px;transform:translate(-50%,-50%);width:120px;height:120px}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:ring 2.4s ease-out infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.radar b{position:absolute;inset:34px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:0 28px 46px}
.dev{padding:20px}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.spec div{background:var(--surface);border-radius:16px;padding:12px 12px 11px}
.spec b{font-size:20px;font-weight:800;letter-spacing:-.6px;display:block;margin-top:4px}
.spec small{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.steps{display:flex;gap:6px;justify-content:center;margin:22px 0 18px}
.steps i{width:8px;height:8px;border-radius:5px;background:#D5E1E7}
.steps i.on{width:26px;background:var(--deep)}
</style></head>
<body><div class="screen">
  <div class="hero"></div>
  <div class="sb light"><span class="t num">3:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad relative z-10 mt-3 flex items-center justify-between text-white">
    <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:var(--grad)"><i class="fa-solid fa-bottle-water"></i></div><span class="font-extrabold text-lg tracking-tight">TiltCuff</span></div>
    <span class="text-sm font-semibold opacity-90">Skip</span>
  </div>
  <div class="radar"><span></span><span></span><span></span><b><i class="fa-brands fa-bluetooth-b"></i></b></div>

  <div class="sheet">
    <div class="meta">Step 1 of 3</div>
    <div class="h1 mt-2">Sleeve found</div>
    <div class="sub mt-2">Squeeze the sleeve once to confirm it is yours.</div>

    <div class="card dev mt-6">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 rounded-2xl bg-cover bg-center flex-none" style="background-image:url(img/sleeve.jpg)"></div>
        <div class="flex-1">
          <div class="flex items-center gap-2"><span class="live"></span><span class="text-[17px] font-bold tracking-tight">Maya's TiltCuff</span></div>
          <div class="text-[13px] text-slate-500 font-medium mt-1">TC-1 · 8F:2A · 1 m away</div>
        </div>
        <div class="flex items-end gap-[3px] h-5">
          <i class="w-[4px] h-2 rounded bg-cyan-600 block"></i><i class="w-[4px] h-3 rounded bg-cyan-600 block"></i><i class="w-[4px] h-4 rounded bg-cyan-600 block"></i><i class="w-[4px] h-5 rounded bg-slate-200 block"></i>
        </div>
      </div>
      <div class="spec">
        <div><small>Battery</small><b class="num">92%</b></div>
        <div><small>Fits</small><b class="num">60–80<span class="text-xs text-slate-400 font-bold"> mm</span></b></div>
        <div><small>Sensors</small><b>2 <i class="fa-solid fa-check-circle text-emerald-500 text-sm"></i></b></div>
      </div>
    </div>

    <div class="steps"><i class="on"></i><i></i><i></i></div>
    <div class="btn"><i class="fa-solid fa-link"></i>Connect sleeve</div>
  </div>
  <div class="homebar"></div>
</div></body></html>
