<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Spill caught</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.photo{position:absolute;top:0;left:0;right:0;height:430px;background:url(img/bench.jpg) center 60%/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,26,36,.5) 0%,rgba(10,26,36,0) 30%,rgba(10,26,36,.25) 70%,rgba(10,26,36,.6) 100%)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:360px;background:#fff;border-radius:34px 34px 0 0;padding:14px 28px 0;box-shadow:0 -20px 40px -20px rgba(10,26,36,.35)}
.grab{width:40px;height:5px;border-radius:3px;background:#DCE5EA;margin:0 auto 18px}
.big{font-size:56px;font-weight:900;letter-spacing:-3px;line-height:.95;color:var(--spill)}
.big small{font-size:22px;letter-spacing:-.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cmp > div{border-radius:20px;padding:14px 14px 10px;border:1px solid var(--border)}
.cmp .lab{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sig{display:flex;gap:8px;margin-top:14px}
.sig div{flex:1;display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:15px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2)}
.sig i{font-size:14px}
.ping{position:absolute;left:28px;top:96px;z-index:5}
</style></head>
<body><div class="screen" style="background:#fff">
  <div class="photo"></div>
  <div class="sb light"><span class="t num">4:47</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half"></i></div></div>
  <div class="pad relative z-10 mt-3 flex justify-between">
    <div class="iconbtn" style="background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(10px)"><i class="fa-solid fa-xmark"></i></div>
    <span class="pill" style="background:var(--gradSpill);color:#fff;height:36px;align-self:center"><i class="fa-solid fa-triangle-exclamation"></i>Spill caught</span>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="flex items-end justify-between">
      <div><div class="meta">Knockover · 4:47 PM</div><div class="big num mt-2">130<small> ml</small></div></div>
      <div class="gicon g-spill" style="width:58px;height:58px;border-radius:19px;font-size:22px"><i class="fa-solid fa-bottle-droplet"></i></div>
    </div>
    <div class="text-[15px] font-semibold text-slate-600 mt-2">Lost, not drunk. Your total stays at <span class="text-slate-900 font-bold num">1.28 L</span>.</div>

    <div class="cmp">
      <div>
        <div class="lab" style="color:#0E9F6E"><span class="dot" style="background:var(--sip)"></span>Typical sip</div>
        <svg width="100%" height="74" viewBox="0 0 160 74" preserveAspectRatio="none">
          <path d="M0 64 C20 64 30 64 40 50 C52 26 64 22 80 22 C96 22 108 26 118 48 C128 64 140 64 160 64" fill="none" stroke="#12B886" stroke-width="3" stroke-linecap="round"/>
          <path d="M0 60 L60 60 L64 64 L160 64" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
        </svg>
        <div class="text-[11px] font-semibold text-slate-400 num">70° · 3 s · slow</div>
      </div>
      <div style="border-color:rgba(240,97,74,.35);background:rgba(240,97,74,.04)">
        <div class="lab" style="color:var(--spill)"><span class="dot" style="background:var(--spill)"></span>This event</div>
        <svg width="100%" height="74" viewBox="0 0 160 74" preserveAspectRatio="none">
          <path d="M0 64 L34 64 L40 6 L160 6" fill="none" stroke="#F0614A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M0 26 L44 26 L70 56 L160 56" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
        </svg>
        <div class="text-[11px] font-semibold text-slate-400 num">92° · 0.2 s · fast</div>
      </div>
    </div>
    <div class="flex gap-4 mt-2 text-[11px] font-semibold text-slate-400"><span><i class="fa-solid fa-minus mr-1" style="color:#0E9F6E"></i>Tilt</span><span><i class="fa-solid fa-ellipsis mr-1"></i>Weight</span></div>

    <div class="sig">
      <div><i class="fa-solid fa-person-falling" style="color:var(--spill)"></i>Fell flat</div>
      <div><i class="fa-solid fa-hand" style="color:var(--spill)"></i>No lift</div>
      <div><i class="fa-solid fa-water" style="color:var(--water)"></i>Cap wet</div>
    </div>

    <div class="flex gap-3 mt-6">
      <div class="btn ghost flex-1" style="font-size:15px">It was a sip</div>
      <div class="btn flex-[1.4]"><i class="fa-solid fa-check"></i>Got it</div>
    </div>
  </div>
  <div class="homebar"></div>
</div></body></html>
