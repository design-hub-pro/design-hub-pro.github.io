<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiltCuff · Today</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.ringcard{padding:22px;margin-top:18px;position:relative;overflow:hidden}
.ringwrap{position:relative;width:176px;height:176px;flex:none}
.ringwrap .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .v b{font-size:36px;font-weight:800;letter-spacing:-1.6px;line-height:1}
.ringwrap .v b small{font-size:16px;color:var(--muted);margin-left:1px}
.ringwrap .v span{font-size:12px;font-weight:600;color:var(--muted);margin-top:5px}
.leg{display:flex;flex-direction:column;gap:14px}
.leg .k{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.leg .n{font-size:24px;font-weight:800;letter-spacing:-.9px;margin-top:2px}
.nudge{display:flex;align-items:center;gap:13px;padding:14px 16px;margin-top:14px;border-radius:20px;background:linear-gradient(90deg,rgba(242,166,38,.14),rgba(242,166,38,.04));border:1px solid rgba(242,166,38,.28)}
.bottle{display:flex;gap:16px;padding:16px}
.bimg{width:112px;height:132px;border-radius:18px;background:url(img/sleeve.jpg) 38% center/cover;position:relative;flex:none}
.lvl{width:28px;height:132px;border-radius:12px;background:#E8F0F3;position:relative;overflow:hidden;flex:none}
.lvl i{position:absolute;left:0;right:0;bottom:0;height:58%;background:var(--grad)}
.lvl s{position:absolute;left:0;right:0;top:12%;border-top:2px dashed rgba(10,26,36,.25)}
.prac{height:150px;border-radius:24px;background:url(img/field.jpg) center 35%/cover;position:relative;overflow:hidden;margin-top:14px}
.prac:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,26,36,.82),rgba(10,26,36,.15))}
.prac > div{position:relative;z-index:2}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">4:12</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-start justify-between mt-3">
      <div><div class="meta">Thu · Oct 30</div><div class="h1 mt-1.5">Hi, Maya</div></div>
      <div class="flex gap-2.5"><div class="iconbtn"><i class="fa-regular fa-bell"></i><span class="badge">2</span></div>
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop" class="w-11 h-11 rounded-[15px] object-cover"></div>
    </div>

    <div class="card ringcard">
      <div class="flex items-center gap-6">
        <div class="ringwrap">
          <svg width="176" height="176" viewBox="0 0 176 176">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#0566A8"/></linearGradient></defs>
            <circle cx="88" cy="88" r="74" fill="none" stroke="#EAF2F5" stroke-width="16"/>
            <circle cx="88" cy="88" r="74" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="163" transform="rotate(-90 88 88)"/>
          </svg>
          <div class="v"><b class="num">1.42<small>L</small></b><span class="num">of 2.2 L goal</span></div>
        </div>
        <div class="leg">
          <div><div class="k"><span class="dot" style="background:var(--sip)"></span>Sips</div><div class="n num">23</div></div>
          <div><div class="k"><span class="dot" style="background:var(--spill)"></span>Not counted</div><div class="n num">180<span class="text-sm text-slate-400"> ml</span></div></div>
          <div><div class="k"><span class="dot" style="background:var(--refill)"></span>Refills</div><div class="n num">1</div></div>
        </div>
      </div>
      <div class="nudge">
        <div class="gicon g-refill" style="width:40px;height:40px;border-radius:13px;font-size:16px"><i class="fa-solid fa-stopwatch"></i></div>
        <div class="flex-1"><div class="text-[15px] font-bold tracking-tight">Sip in 6 min</div><div class="text-[12.5px] text-slate-500 font-medium">You are 140 ml behind practice pace</div></div>
        <i class="fa-solid fa-chevron-right text-slate-300"></i>
      </div>
    </div>

    <div class="sec"><div class="h2">My bottle</div><span class="pill" style="background:rgba(18,184,134,.12);color:#0E9F6E"><span class="live"></span>Live</span></div>
    <div class="card bottle">
      <div class="bimg"></div>
      <div class="flex-1 flex flex-col justify-between">
        <div><div class="text-[13px] font-semibold text-slate-500">Left in bottle</div><div class="text-[34px] font-extrabold tracking-tighter leading-none mt-1 num">410<span class="text-base text-slate-400 font-bold"> ml</span></div></div>
        <div class="flex gap-4 text-[12px] font-semibold text-slate-500">
          <span><i class="fa-solid fa-battery-three-quarters text-emerald-500 mr-1"></i>88%</span>
          <span><i class="fa-solid fa-scale-balanced text-cyan-600 mr-1"></i>Calibrated</span>
        </div>
      </div>
      <div class="lvl"><i></i><s></s></div>
    </div>

    <div class="prac">
      <div class="p-5 h-full flex flex-col justify-between text-white">
        <div class="flex items-center justify-between"><span class="pill" style="background:rgba(255,255,255,.18);backdrop-filter:blur(8px)"><i class="fa-solid fa-futbol"></i>Practice</span>
          <div class="avs"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=80&h=80&fit=crop"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop"><span>+14</span></div></div>
        <div class="flex items-end justify-between">
          <div><div class="text-[22px] font-extrabold tracking-tight">Varsity soccer</div><div class="text-[13px] font-medium opacity-80 num">4:30 – 7:00 PM · 82°F</div></div>
          <div class="w-12 h-12 rounded-2xl bg-white text-cyan-800 flex items-center justify-center text-lg"><i class="fa-solid fa-play ml-0.5"></i></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab on"><i class="fa-solid fa-droplet"></i>Today</div>
  <div class="tab"><i class="fa-solid fa-stopwatch"></i>Practice</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-bottle-water"></i></div></div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Trends</div>
  <div class="tab"><i class="fa-solid fa-user-group"></i>Team</div>
</div>
<div class="homebar"></div>
</div></body></html>
