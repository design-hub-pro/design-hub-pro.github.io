<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{brand:{50:'#F0FDFA',100:'#CCFBF1',200:'#99F6E4',500:'#14B8A6',600:'#0D9488',700:'#0F766E',800:'#115E59',900:'#134E4A'},amber:{50:'#FFFBEB',100:'#FEF3C7',500:'#F59E0B',600:'#D97706',700:'#B45309'}},fontFamily:{sans:['"Noto Sans SC"','-apple-system','sans-serif'],serif:['"Noto Serif SC"','serif']},boxShadow:{card:'0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.08)'}}}}
</script>
<style>
html,body{margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Noto Sans SC",-apple-system,sans-serif;color:#1C1917;-webkit-font-smoothing:antialiased}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0F766E,#14B8A6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
</style>
<title>留个交接 · 继续专注</title>
</head>
<body class="bg-white">
<!-- The page the user switched to -->
<header class="h-16 border-b border-stone-200 flex items-center px-10 gap-8">
  <div class="font-serif text-xl font-bold text-rose-700">场地通</div>
  <nav class="flex gap-6 text-sm text-stone-600"><span>会议室</span><span class="text-stone-900 font-medium">报告厅</span><span>户外场地</span><span>校园合作</span></nav>
  <div class="ml-auto flex items-center gap-2 border border-stone-200 rounded-full px-4 py-2 text-sm text-stone-400 w-72"><i class="fas fa-search"></i>搜索场地</div>
</header>
<div class="px-10 py-6 flex gap-10">
  <div class="w-[820px]">
    <div class="text-xs text-stone-400 mb-2">首页 / 报告厅 / 海淀区</div>
    <h1 class="text-2xl font-bold">学术报告厅 A · 可容纳 320 人</h1>
    <div class="text-sm text-stone-500 mt-1">海淀区学院路 37 号 · 4.8 分（126 条评价）</div>
    <div class="grid grid-cols-3 gap-2 mt-5 h-[330px]">
      <img class="col-span-2 h-[330px] w-full object-cover rounded-l-xl" src="https://images.unsplash.com/photo-1505373877841-8d25f7d46678?w=1000&h=700&fit=crop">
      <div class="flex flex-col gap-2">
        <img class="h-[161px] w-full object-cover rounded-tr-xl" src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=500&h=340&fit=crop">
        <img class="h-[161px] w-full object-cover rounded-br-xl" src="https://images.unsplash.com/photo-1511578314322-379afb476865?w=500&h=340&fit=crop">
      </div>
    </div>
    <div class="mt-6 grid grid-cols-4 gap-4 text-sm">
      <div><div class="text-stone-400 text-xs">面积</div>420 ㎡</div>
      <div><div class="text-stone-400 text-xs">投影</div>双屏 4K</div>
      <div><div class="text-stone-400 text-xs">音响</div>含 4 支无线麦</div>
      <div><div class="text-stone-400 text-xs">可用时段</div>周六 8:00–12:00</div>
    </div>
  </div>
  <aside class="w-[380px] mt-14">
    <div class="border border-stone-200 rounded-xl p-5 shadow-sm">
      <div class="text-sm text-stone-500">半天报价（含税）</div>
      <div class="text-3xl font-bold mt-1">¥3,680</div>
      <div class="text-xs text-stone-400 mt-1">学生组织价 ¥3,200，需提供盖章函</div>
      <div class="mt-4 space-y-2 text-sm">
        <div class="flex justify-between"><span class="text-stone-500">场地费</span><span>¥2,600</span></div>
        <div class="flex justify-between"><span class="text-stone-500">设备与技术支持</span><span>¥680</span></div>
        <div class="flex justify-between"><span class="text-stone-500">保洁</span><span>¥400</span></div>
      </div>
      <button class="mt-5 w-full py-2.5 rounded-lg bg-rose-700 text-white text-sm">咨询档期</button>
    </div>
  </aside>
</div>

<!-- Extension toolbar badge state -->
<div class="absolute top-0 right-6 w-[400px]">
  <div class="ml-auto mr-4 w-3 h-3 bg-white rotate-45 translate-y-1.5 border-l border-t border-stone-200"></div>
  <div class="bg-white rounded-xl shadow-card border border-stone-200">
    <div class="px-5 pt-4 flex items-center gap-3">
      <div class="mark"><i class="fas fa-rotate-left"></i></div>
      <div class="text-sm text-stone-500">你离开「预算部分」<span class="text-stone-900 font-medium">2 分 40 秒</span></div>
      <button class="ml-auto text-stone-300"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="px-5 pt-3">
      <div class="font-serif text-lg font-semibold">要留一句回来后先做什么吗？</div>
      <div class="mt-3 rounded-xl border-2 border-brand-600 px-3.5 py-3 text-[15px] leading-6">
        预算表已列好，回来先核对场地报价<span class="inline-block w-px h-5 bg-stone-800 align-middle ml-0.5"></span>
      </div>
      <div class="mt-2 text-xs text-stone-400 flex items-center gap-1.5"><i class="fas fa-wand-magic-sparkles text-brand-600"></i>根据你离开前的小节和表格状态起草</div>
    </div>
    <div class="px-5 pt-4 pb-5 space-y-2">
      <button class="w-full py-2.5 rounded-xl bg-brand-700 text-white text-sm font-medium flex items-center justify-center gap-2"><i class="fas fa-bell"></i>保存，15 分钟后提醒我</button>
      <div class="flex gap-2 text-sm">
        <button class="flex-1 py-2 rounded-xl border border-stone-200 text-stone-700">只保存</button>
        <button class="flex-1 py-2 rounded-xl border border-stone-200 text-stone-700">改成 30 分钟</button>
        <button class="px-4 py-2 rounded-xl text-stone-400">跳过</button>
      </div>
    </div>
  </div>
</div>

<!-- Why it waited -->
<div class="absolute left-10 bottom-8 flex items-center gap-3 bg-stone-900 text-stone-100 text-sm rounded-xl px-4 py-3 shadow-card">
  <i class="fas fa-hourglass-half text-brand-200"></i>
  前 90 秒没有打扰你：查资料常常一会儿就回去了
</div>
</body>
</html>
