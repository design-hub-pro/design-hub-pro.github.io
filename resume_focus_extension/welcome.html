<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{brand:{50:'#F0FDFA',100:'#CCFBF1',200:'#99F6E4',500:'#14B8A6',600:'#0D9488',700:'#0F766E',800:'#115E59',900:'#134E4A'},amber:{50:'#FFFBEB',100:'#FEF3C7',500:'#F59E0B',600:'#D97706',700:'#B45309'}},fontFamily:{sans:['"Noto Sans SC"','-apple-system','sans-serif'],serif:['"Noto Serif SC"','serif']},boxShadow:{card:'0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.08)'}}}}
</script>
<style>
html,body{margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Noto Sans SC",-apple-system,sans-serif;color:#1C1917;-webkit-font-smoothing:antialiased}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0F766E,#14B8A6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
</style>
<title>欢迎 · 继续专注</title>
</head>
<body class="bg-[#FBFAF8]">
<header class="px-16 h-20 flex items-center">
  <div class="flex items-center gap-2.5"><div class="mark"><i class="fas fa-rotate-left"></i></div><span class="font-medium">继续专注</span></div>
  <div class="ml-auto text-sm text-stone-500">已安装 · 版本 0.1</div>
</header>
<div class="px-16 pt-20 grid grid-cols-[1fr_560px] gap-16">
  <div>
    <h1 class="font-serif text-[46px] leading-[1.25] font-bold text-stone-900">切走不可怕。<br>怕的是回来不知道<br>从哪儿接着做。</h1>
    <p class="mt-6 text-lg text-stone-600 leading-8 max-w-[560px]">离开前留一句「回来先做什么」。到点了，通知会把这句话带给你，点一下就回到原来的标签页。</p>

    <div class="mt-10 bg-white rounded-xl border border-stone-200 shadow-card p-6 max-w-[600px]">
      <div class="text-xs text-stone-400 mb-3">先做一件事</div>
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-stone-100 flex items-center justify-center text-stone-500"><i class="fas fa-puzzle-piece"></i></div>
        <div class="flex-1">
          <div class="font-medium">把它固定到工具栏</div>
          <div class="text-sm text-stone-500">点地址栏右边的拼图图标，再点「继续专注」旁的图钉</div>
        </div>
        <button class="px-4 py-2.5 rounded-xl bg-brand-700 text-white text-sm font-medium">已固定</button>
      </div>
    </div>

    <div class="mt-8 flex gap-8 text-sm text-stone-600 max-w-[600px]">
      <div class="flex-1"><span class="font-serif text-brand-700 text-lg mr-1.5">1</span>在要做的页面点「开始专注」，确认一句任务</div>
      <div class="flex-1"><span class="font-serif text-brand-700 text-lg mr-1.5">2</span>切走超过 90 秒，留一句下一步</div>
      <div class="flex-1"><span class="font-serif text-brand-700 text-lg mr-1.5">3</span>到点收到提醒，点它回去</div>
    </div>
  </div>
  <div class="relative">
    <img class="w-full h-[600px] object-cover rounded-2xl" src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1100&h=1200&fit=crop">
    <div class="absolute left-[-48px] bottom-16 w-[340px] bg-white rounded-xl shadow-card border border-stone-200 p-4">
      <div class="flex items-center gap-3"><div class="mark"><i class="fas fa-rotate-left"></i></div><div class="text-xs text-stone-500">继续专注 · 现在</div></div>
      <div class="mt-2 font-semibold">完善活动方案的预算部分</div>
      <div class="text-sm text-stone-600">回来先做：核对场地报价</div>
    </div>
  </div>
</div>
</body>
</html>
