<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, height=852, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedCare - Scan Result</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="phone-frame">
        <!-- iOS Status Bar -->
        <div class="status-bar" style="background: #1B7D3E;">
            <div class="status-bar-left" style="color: white;">9:41</div>
            <div class="status-bar-center"></div>
            <div class="status-bar-right" style="color: white;">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <div class="battery-icon" style="border-color: white;">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" style="height: calc(852px - 54px); background: #F5F5F5;">
            <!-- Success Header -->
            <div style="background: linear-gradient(135deg, #1B7D3E, #156432); color: white; padding: 32px 24px; text-align: center;">
                <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                    <i class="fas fa-check" style="font-size: 40px;"></i>
                </div>
                <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Medicine Found!</h1>
                <p style="font-size: 20px; opacity: 0.9; font-weight: 500;">We recognized your medication</p>
            </div>

            <!-- Recognized Drug Card -->
            <div style="margin: -24px 16px 0; background: white; border-radius: 24px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; z-index: 10;">
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                    <div style="width: 72px; height: 72px; background: #E3F0FF; border-radius: 20px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-tablets" style="font-size: 32px; color: #1E5AA8;"></i>
                    </div>
                    <div>
                        <p style="font-size: 28px; font-weight: 800; color: #1A1A1A;">Metformin</p>
                        <p style="font-size: 20px; color: #4A4A4A; margin-top: 4px;">500mg Tablet</p>
                    </div>
                </div>

                <!-- Info Grid -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div style="background: #E3F0FF; padding: 16px; border-radius: 16px;">
                        <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Strength</p>
                        <p style="font-size: 24px; font-weight: 800; color: #1E5AA8; margin-top: 4px;">500mg</p>
                    </div>
                    <div style="background: #E2F5E9; padding: 16px; border-radius: 16px;">
                        <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Form</p>
                        <p style="font-size: 24px; font-weight: 800; color: #1B7D3E; margin-top: 4px;">Tablet</p>
                    </div>
                    <div style="background: #FFF0E5; padding: 16px; border-radius: 16px;">
                        <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Quantity</p>
                        <p style="font-size: 24px; font-weight: 800; color: #C85000; margin-top: 4px;">60 pills</p>
                    </div>
                    <div style="background: #FFE5EA; padding: 16px; border-radius: 16px;">
                        <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Purpose</p>
                        <p style="font-size: 24px; font-weight: 800; color: #C41E3A; margin-top: 4px;">Diabetes</p>
                    </div>
                </div>
            </div>

            <!-- Set Reminder -->
            <div style="padding: 24px 16px;">
                <p style="font-size: 22px; font-weight: 700; color: #1A1A1A; margin-bottom: 16px;">When to take?</p>
                <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                    <button style="padding: 16px 24px; background: #E3F0FF; border: 3px solid #1E5AA8; border-radius: 16px; font-size: 18px; font-weight: 700; color: #1E5AA8; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-sun" style="font-size: 20px;"></i> Morning
                    </button>
                    <button style="padding: 16px 24px; background: #E3F0FF; border: 3px solid #1E5AA8; border-radius: 16px; font-size: 18px; font-weight: 700; color: #1E5AA8; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-cloud-sun" style="font-size: 20px;"></i> Afternoon
                    </button>
                    <button style="padding: 16px 24px; background: white; border: 3px solid #D0D0D0; border-radius: 16px; font-size: 18px; font-weight: 700; color: #4A4A4A; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-moon" style="font-size: 20px;"></i> Evening
                    </button>
                    <button style="padding: 16px 24px; background: white; border: 3px solid #D0D0D0; border-radius: 16px; font-size: 18px; font-weight: 700; color: #4A4A4A; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-bed" style="font-size: 20px;"></i> Bedtime
                    </button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div style="padding: 16px; position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, #F5F5F5, #F5F5F5 80%, transparent);">
                <div style="display: flex; gap: 12px;">
                    <button style="flex: 1; padding: 20px; background: white; border: 3px solid #D0D0D0; border-radius: 16px; font-size: 20px; font-weight: 700; color: #4A4A4A; display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <i class="fas fa-redo" style="font-size: 22px;"></i> Rescan
                    </button>
                    <button style="flex: 2; padding: 20px; background: #1E5AA8; border: none; border-radius: 16px; font-size: 20px; font-weight: 700; color: white; display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <i class="fas fa-plus" style="font-size: 22px;"></i> Add Medicine
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
