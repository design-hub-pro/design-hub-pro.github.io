<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, height=852, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedCare - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="phone-frame">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">9:41</div>
            <div class="status-bar-center"></div>
            <div class="status-bar-right">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header - Simple greeting -->
            <div class="page-header" style="padding-bottom: 24px;">
                <p style="font-size: 20px; color: #4A4A4A; font-weight: 600;">Good Morning</p>
                <h1 style="font-size: 38px; font-weight: 800; color: #1A1A1A; margin-top: 4px;">Robert</h1>
            </div>

            <!-- Big Next Medication Alert -->
            <div style="margin: 0 16px 20px; background: linear-gradient(135deg, #1E5AA8, #164785); border-radius: 24px; padding: 24px; color: white;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                    <i class="fas fa-clock" style="font-size: 24px;"></i>
                    <span style="font-size: 20px; font-weight: 700;">Next Medication</span>
                </div>
                <div style="background: rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
                    <p style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Metformin</p>
                    <p style="font-size: 22px; opacity: 0.9;">500mg - 1 tablet</p>
                    <p style="font-size: 20px; opacity: 0.85; margin-top: 8px;">
                        <i class="fas fa-utensils"></i> Take with lunch
                    </p>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <p style="font-size: 18px; opacity: 0.9;">Due in</p>
                        <p style="font-size: 28px; font-weight: 800;">2 hours</p>
                    </div>
                    <button style="background: white; color: #1E5AA8; border: none; padding: 18px 32px; border-radius: 16px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-check" style="font-size: 22px;"></i> Take Now
                    </button>
                </div>
            </div>

            <!-- Today's Progress - Simple and Clear -->
            <div class="card">
                <div style="text-align: center;">
                    <p style="font-size: 22px; font-weight: 700; color: #1A1A1A; margin-bottom: 16px;">Today's Progress</p>

                    <!-- Large Progress Display -->
                    <div style="display: flex; justify-content: center; align-items: center; gap: 24px; margin-bottom: 20px;">
                        <div style="width: 120px; height: 120px; border-radius: 50%; border: 10px solid #E2F5E9; display: flex; align-items: center; justify-content: center; position: relative;">
                            <div style="position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 10px solid #1B7D3E; border-right-color: transparent; border-bottom-color: transparent; transform: rotate(45deg);"></div>
                            <span style="font-size: 36px; font-weight: 800; color: #1B7D3E;">3/4</span>
                        </div>
                    </div>

                    <!-- Status Summary -->
                    <div style="display: flex; justify-content: center; gap: 32px;">
                        <div style="text-align: center;">
                            <div style="width: 56px; height: 56px; background: #E2F5E9; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                                <i class="fas fa-check" style="font-size: 24px; color: #1B7D3E;"></i>
                            </div>
                            <p style="font-size: 24px; font-weight: 800; color: #1B7D3E;">3</p>
                            <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Taken</p>
                        </div>
                        <div style="text-align: center;">
                            <div style="width: 56px; height: 56px; background: #FFF0E5; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                                <i class="fas fa-clock" style="font-size: 24px; color: #C85000;"></i>
                            </div>
                            <p style="font-size: 24px; font-weight: 800; color: #C85000;">1</p>
                            <p style="font-size: 16px; color: #4A4A4A; font-weight: 600;">Pending</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Completed Today - Simple List -->
            <div class="card" style="margin-bottom: 110px;">
                <p style="font-size: 22px; font-weight: 700; color: #1A1A1A; margin-bottom: 16px;">
                    <i class="fas fa-check-circle" style="color: #1B7D3E; margin-right: 8px;"></i>
                    Completed Today
                </p>

                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Completed Item 1 -->
                    <div style="display: flex; align-items: center; padding: 16px; background: #E2F5E9; border-radius: 16px;">
                        <div style="width: 52px; height: 52px; background: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                            <i class="fas fa-tablets" style="font-size: 24px; color: #1E5AA8;"></i>
                        </div>
                        <div style="flex: 1;">
                            <p style="font-size: 20px; font-weight: 700; color: #1A1A1A;">Lisinopril</p>
                            <p style="font-size: 18px; color: #4A4A4A;">10mg at 8:00 AM</p>
                        </div>
                        <i class="fas fa-check-circle" style="font-size: 28px; color: #1B7D3E;"></i>
                    </div>

                    <!-- Completed Item 2 -->
                    <div style="display: flex; align-items: center; padding: 16px; background: #E2F5E9; border-radius: 16px;">
                        <div style="width: 52px; height: 52px; background: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                            <i class="fas fa-capsules" style="font-size: 24px; color: #C85000;"></i>
                        </div>
                        <div style="flex: 1;">
                            <p style="font-size: 20px; font-weight: 700; color: #1A1A1A;">Vitamin D3</p>
                            <p style="font-size: 18px; color: #4A4A4A;">1000 IU at 8:00 AM</p>
                        </div>
                        <i class="fas fa-check-circle" style="font-size: 28px; color: #1B7D3E;"></i>
                    </div>

                    <!-- Completed Item 3 -->
                    <div style="display: flex; align-items: center; padding: 16px; background: #E2F5E9; border-radius: 16px;">
                        <div style="width: 52px; height: 52px; background: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                            <i class="fas fa-tablets" style="font-size: 24px; color: #1E5AA8;"></i>
                        </div>
                        <div style="flex: 1;">
                            <p style="font-size: 20px; font-weight: 700; color: #1A1A1A;">Aspirin</p>
                            <p style="font-size: 18px; color: #4A4A4A;">81mg at 8:00 AM</p>
                        </div>
                        <i class="fas fa-check-circle" style="font-size: 28px; color: #1B7D3E;"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-pills"></i>
                <span>Meds</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
