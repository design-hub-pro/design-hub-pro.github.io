<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCare Senior - Medication Management for Seniors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #FFFFFF;
            color: #1A1A1A;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            background: #FFFFFF;
        }

        .app-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #1E5AA8, #164785);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 32px rgba(30, 90, 168, 0.35);
        }

        .app-icon i {
            font-size: 48px;
            color: white;
        }

        .app-title {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #1E5AA8, #164785);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-subtitle {
            font-size: 22px;
            color: #4A4A4A;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Features Grid */
        .features {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 30px 20px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: #F5F5F5;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            color: #1A1A1A;
        }

        .feature i {
            font-size: 22px;
            color: #1E5AA8;
        }

        /* Phone Showcase */
        .showcase {
            padding: 40px 20px 80px;
            overflow-x: auto;
            background: #FFFFFF;
        }

        .phones-container {
            display: flex;
            gap: 40px;
            justify-content: flex-start;
            padding: 20px 40px;
            min-width: min-content;
        }

        .phone-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .phone-label {
            font-size: 16px;
            font-weight: 700;
            color: #4A4A4A;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .phone-device {
            width: 290px;
            height: 628px;
            background: #1A1A1A;
            border-radius: 44px;
            padding: 10px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 36px;
            overflow: hidden;
            background: #F5F5F5;
        }

        .phone-screen iframe {
            width: 393px;
            height: 852px;
            border: none;
            transform: scale(0.69);
            transform-origin: top left;
        }

        /* Scrollbar styling */
        .showcase::-webkit-scrollbar {
            height: 10px;
        }

        .showcase::-webkit-scrollbar-track {
            background: #F5F5F5;
            border-radius: 5px;
        }

        .showcase::-webkit-scrollbar-thumb {
            background: #D0D0D0;
            border-radius: 5px;
        }

        .showcase::-webkit-scrollbar-thumb:hover {
            background: #AEAEB2;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 40px 20px 30px;
            }

            .app-icon {
                width: 80px;
                height: 80px;
                border-radius: 22px;
            }

            .app-icon i {
                font-size: 38px;
            }

            .app-title {
                font-size: 36px;
            }

            .app-subtitle {
                font-size: 18px;
            }

            .features {
                gap: 12px;
                padding: 20px;
            }

            .feature {
                padding: 12px 20px;
                font-size: 16px;
            }

            .phones-container {
                padding: 10px 20px;
                gap: 28px;
            }

            .phone-device {
                width: 250px;
                height: 541px;
            }

            .phone-screen iframe {
                transform: scale(0.595);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="app-icon">
            <i class="fas fa-pills"></i>
        </div>
        <h1 class="app-title">MedCare Senior</h1>
        <p class="app-subtitle">Simple medication management designed for seniors. Large text, easy buttons, clear reminders.</p>
    </header>

    <!-- Features -->
    <div class="features">
        <div class="feature">
            <i class="fas fa-camera"></i>
            <span>Scan Medicine Labels</span>
        </div>
        <div class="feature">
            <i class="fas fa-bell"></i>
            <span>Clear Reminders</span>
        </div>
        <div class="feature">
            <i class="fas fa-text-height"></i>
            <span>Large Text</span>
        </div>
        <div class="feature">
            <i class="fas fa-hand-pointer"></i>
            <span>Big Touch Targets</span>
        </div>
    </div>

    <!-- Phone Showcase -->
    <section class="showcase">
        <div class="phones-container">
            <!-- Home Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Dashboard</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="home.html" title="Home Screen"></iframe>
                    </div>
                </div>
            </div>

            <!-- Medications Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Medications</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="medications.html" title="Medications Screen"></iframe>
                    </div>
                </div>
            </div>

            <!-- Scan Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Scan Label</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="scan.html" title="Scan Screen"></iframe>
                    </div>
                </div>
            </div>

            <!-- Scan Result Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Recognition</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="scan_result.html" title="Scan Result Screen"></iframe>
                    </div>
                </div>
            </div>

            <!-- Reminders Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Schedule</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="reminders.html" title="Reminders Screen"></iframe>
                    </div>
                </div>
            </div>

            <!-- Profile Screen -->
            <div class="phone-wrapper">
                <div class="phone-label">Profile</div>
                <div class="phone-device">
                    <div class="phone-screen">
                        <iframe src="profile.html" title="Profile Screen"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
