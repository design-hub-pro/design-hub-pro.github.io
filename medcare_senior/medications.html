<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, height=852, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedCare - Medications</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="phone-frame">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">9:41</div>
            <div class="status-bar-center"></div>
            <div class="status-bar-right">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="page-header">
                <h1 class="page-title">My Medications</h1>
                <p class="page-subtitle">6 medications</p>
            </div>

            <!-- Big Action Buttons -->
            <div style="padding: 0 16px; display: flex; gap: 12px; margin-bottom: 8px;">
                <button style="flex: 1; background: #1E5AA8; color: white; border: none; padding: 20px; border-radius: 16px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <i class="fas fa-camera" style="font-size: 24px;"></i>
                    Scan Label
                </button>
                <button style="flex: 1; background: white; color: #1E5AA8; border: 3px solid #1E5AA8; padding: 20px; border-radius: 16px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <i class="fas fa-plus" style="font-size: 24px;"></i>
                    Add New
                </button>
            </div>

            <!-- Medications List - Simplified -->
            <div class="section-header">Daily Medications</div>

            <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
                <!-- Med Item 1 -->
                <div style="background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; border: 2px solid #D0D0D0;">
                    <div style="width: 64px; height: 64px; background: #E3F0FF; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                        <i class="fas fa-tablets" style="font-size: 28px; color: #1E5AA8;"></i>
                    </div>
                    <div style="flex: 1;">
                        <p style="font-size: 22px; font-weight: 700; color: #1A1A1A;">Lisinopril</p>
                        <p style="font-size: 18px; color: #4A4A4A; margin-top: 4px;">10mg - Twice daily</p>
                    </div>
                    <i class="fas fa-chevron-right" style="font-size: 24px; color: #6B6B6B;"></i>
                </div>

                <!-- Med Item 2 -->
                <div style="background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; border: 2px solid #D0D0D0;">
                    <div style="width: 64px; height: 64px; background: #E3F0FF; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                        <i class="fas fa-tablets" style="font-size: 28px; color: #1E5AA8;"></i>
                    </div>
                    <div style="flex: 1;">
                        <p style="font-size: 22px; font-weight: 700; color: #1A1A1A;">Metformin</p>
                        <p style="font-size: 18px; color: #4A4A4A; margin-top: 4px;">500mg - With meals</p>
                    </div>
                    <i class="fas fa-chevron-right" style="font-size: 24px; color: #6B6B6B;"></i>
                </div>

                <!-- Med Item 3 -->
                <div style="background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; border: 2px solid #D0D0D0;">
                    <div style="width: 64px; height: 64px; background: #FFF0E5; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                        <i class="fas fa-capsules" style="font-size: 28px; color: #C85000;"></i>
                    </div>
                    <div style="flex: 1;">
                        <p style="font-size: 22px; font-weight: 700; color: #1A1A1A;">Vitamin D3</p>
                        <p style="font-size: 18px; color: #4A4A4A; margin-top: 4px;">1000 IU - Once daily</p>
                    </div>
                    <i class="fas fa-chevron-right" style="font-size: 24px; color: #6B6B6B;"></i>
                </div>

                <!-- Med Item 4 -->
                <div style="background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; border: 2px solid #D0D0D0;">
                    <div style="width: 64px; height: 64px; background: #E3F0FF; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                        <i class="fas fa-tablets" style="font-size: 28px; color: #1E5AA8;"></i>
                    </div>
                    <div style="flex: 1;">
                        <p style="font-size: 22px; font-weight: 700; color: #1A1A1A;">Atorvastatin</p>
                        <p style="font-size: 18px; color: #4A4A4A; margin-top: 4px;">20mg - At bedtime</p>
                    </div>
                    <i class="fas fa-chevron-right" style="font-size: 24px; color: #6B6B6B;"></i>
                </div>

                <!-- Med Item 5 -->
                <div style="background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; border: 2px solid #D0D0D0; margin-bottom: 110px;">
                    <div style="width: 64px; height: 64px; background: #E3F0FF; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                        <i class="fas fa-tablets" style="font-size: 28px; color: #1E5AA8;"></i>
                    </div>
                    <div style="flex: 1;">
                        <p style="font-size: 22px; font-weight: 700; color: #1A1A1A;">Aspirin</p>
                        <p style="font-size: 18px; color: #4A4A4A; margin-top: 4px;">81mg - Once daily</p>
                    </div>
                    <i class="fas fa-chevron-right" style="font-size: 24px; color: #6B6B6B;"></i>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item active">
                <i class="fas fa-pills"></i>
                <span>Meds</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
