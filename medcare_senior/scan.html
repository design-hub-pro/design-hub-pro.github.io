<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, height=852, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedCare - Scan Medicine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scan-container {
            position: relative;
            height: calc(852px - 54px);
            background: #000;
            overflow: hidden;
        }

        .camera-view {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }

        .scan-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        .scan-header a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
        }

        .scan-title {
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .scan-frame-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .scan-frame {
            width: 320px;
            height: 220px;
            border: 4px solid white;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }

        .scan-frame::before,
        .scan-frame::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 6px solid #1E5AA8;
        }

        .scan-frame::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
            border-radius: 24px 0 0 0;
        }

        .scan-frame::after {
            top: -4px;
            right: -4px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 24px 0 0;
        }

        .scan-corners-bottom {
            position: absolute;
            bottom: -4px;
            left: -4px;
            right: -4px;
            height: 50px;
            pointer-events: none;
        }

        .scan-corners-bottom::before,
        .scan-corners-bottom::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 6px solid #1E5AA8;
        }

        .scan-corners-bottom::before {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 24px;
        }

        .scan-corners-bottom::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
            border-radius: 0 0 24px 0;
        }

        .scan-line {
            position: absolute;
            top: 30px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #1E5AA8, transparent);
            border-radius: 2px;
            animation: scan 2.5s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 30px; opacity: 1; }
            50% { top: calc(100% - 30px); opacity: 1; }
        }

        .scan-instruction {
            color: white;
            text-align: center;
            margin-top: 32px;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .scan-hint {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            margin-top: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 500;
        }

        .scan-bottom {
            padding: 24px 20px 48px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .scan-button {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: white;
            border: 6px solid rgba(255,255,255,0.4);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-button i {
            font-size: 36px;
            color: #1E5AA8;
        }

        .scan-help {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        .tips-card {
            position: absolute;
            bottom: 200px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tips-icon {
            width: 56px;
            height: 56px;
            background: #E3F0FF;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tips-icon i {
            font-size: 26px;
            color: #1E5AA8;
        }

        .tips-content h4 {
            font-size: 20px;
            font-weight: 700;
            color: #1A1A1A;
            margin-bottom: 4px;
        }

        .tips-content p {
            font-size: 17px;
            color: #4A4A4A;
            line-height: 1.4;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- iOS Status Bar -->
        <div class="status-bar" style="background: transparent; position: absolute; z-index: 10;">
            <div class="status-bar-left" style="color: white;">9:41</div>
            <div class="status-bar-center"></div>
            <div class="status-bar-right" style="color: white;">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <div class="battery-icon" style="border-color: white;">
                    <div class="battery-level"></div>
                </div>
            </div>
        </div>

        <!-- Scan Container -->
        <div class="scan-container">
            <!-- Camera Background -->
            <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&h=900&fit=crop" alt="Medicine" class="camera-view">

            <!-- Overlay -->
            <div class="scan-overlay">
                <!-- Header -->
                <div class="scan-header">
                    <a href="#"><i class="fas fa-arrow-left"></i> Back</a>
                    <span class="scan-title">Scan Label</span>
                    <a href="#"><i class="fas fa-bolt"></i></a>
                </div>

                <!-- Scan Frame Area -->
                <div class="scan-frame-area">
                    <div class="scan-frame">
                        <div class="scan-line"></div>
                        <div class="scan-corners-bottom"></div>
                    </div>
                    <p class="scan-instruction">Point at medicine label</p>
                    <p class="scan-hint">Hold steady for best results</p>
                </div>

                <!-- Tips Card -->
                <div class="tips-card">
                    <div class="tips-icon">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                    <div class="tips-content">
                        <h4>Tip</h4>
                        <p>Make sure the drug name is visible and well-lit.</p>
                    </div>
                </div>

                <!-- Bottom Controls -->
                <div class="scan-bottom">
                    <div class="scan-button">
                        <i class="fas fa-camera"></i>
                    </div>
                    <p class="scan-help">Tap to capture</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
