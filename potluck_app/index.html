<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Potluck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:#fff;color:#1B1512;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:78px 48px 110px}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.icon{width:76px;height:76px;border-radius:23px;background:linear-gradient(135deg,#D9502B 0%,#F2933C 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;box-shadow:0 18px 34px -16px rgba(217,80,43,.85)}
h1{font-size:52px;font-weight:800;letter-spacing:-2.2px;line-height:1}
.tag{font-size:19px;color:#6B615A;font-weight:500;letter-spacing:-.3px;max-width:760px}
.tags{display:flex;gap:9px;margin-top:22px}
.tags span{padding:7px 15px;border-radius:100px;background:#FBF0E9;color:#D9502B;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:64px 40px;margin-top:74px;justify-items:center}
.cell{width:460px}
.lbl{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8D8279;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.lbl b{color:#D9502B;font-variant-numeric:tabular-nums}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#171310;box-shadow:0 44px 80px -40px rgba(23,19,16,.6),0 0 0 1px rgba(23,19,16,.08)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#FAF6F2}
</style></head><body>
<div class="wrap">
 <div class="hero">
  <div class="icon"><i class="fas fa-utensils"></i></div>
  <div><h1>Potluck</h1></div>
 </div>
 <p class="tag">A neighborhood food community where dishes, recipes and open portions come from the cooks whose palate matches yours.</p>
 <div class="tags"><span>Food Community</span><span>Palate Match</span><span>Recipe Sharing</span><span>Local Swaps</span></div>

 <div class="grid">
  <div class="cell"><div class="lbl"><b>01</b>Palate setup</div><div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div></div>
  <div class="cell"><div class="lbl"><b>02</b>Feed</div><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div></div>
  <div class="cell"><div class="lbl"><b>03</b>Share a dish</div><div class="frame"><iframe src="post.html" scrolling="no"></iframe></div></div>
  <div class="cell"><div class="lbl"><b>04</b>Dish detail</div><div class="frame"><iframe src="dish.html" scrolling="no"></iframe></div></div>
  <div class="cell"><div class="lbl"><b>05</b>Table forum</div><div class="frame"><iframe src="table.html" scrolling="no"></iframe></div></div>
  <div class="cell"><div class="lbl"><b>06</b>Your palate</div><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div></div>
 </div>
</div>
</body></html>
