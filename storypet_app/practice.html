<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice · StoryPet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FAF7FF;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(180deg,#FFE9D6 0%,#FAF7FF 50%)}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#2D2552;position:relative;z-index:5}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:10}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #ECE6FF;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B8AECC;font-size:10px;font-weight:500}
.tab.active{color:#7C6FE5}
.tab i{font-size:22px}
.scenario-hero{border-radius:28px;overflow:hidden;position:relative;height:230px;box-shadow:0 12px 40px rgba(255,139,102,0.20)}
.choice-card{background:white;border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(124,111,229,0.10);position:relative}
.choice-card.selected{background:linear-gradient(135deg,#E8E1FF,#FFFFFF);box-shadow:0 0 0 2px #7C6FE5,0 8px 24px rgba(124,111,229,0.20)}
.choice-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;flex-shrink:0}
.lumi-tip{background:linear-gradient(135deg,#FFE0B6,#FFCB57);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:#5A3D00}
.streak-badge{background:rgba(255,255,255,0.30);backdrop-filter:blur(10px);border-radius:14px;padding:8px 12px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <!-- Header -->
    <div class="flex items-center justify-between mt-2 mb-4">
      <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center"><i class="fas fa-chevron-left text-gray-700"></i></div>
      <div class="text-center">
        <p class="text-[10px] text-[#FF8B66] font-bold tracking-wider">PRACTICE</p>
        <p class="text-sm font-bold text-gray-900">What would you do?</p>
      </div>
      <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center"><i class="fas fa-circle-info text-[#7C6FE5]"></i></div>
    </div>

    <!-- Scenario hero -->
    <div class="scenario-hero">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1778256108097-image-1.png" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#5B4FD8]/85 via-[#5B4FD8]/10 to-transparent"></div>
      <div class="absolute top-3 left-3 bg-white/95 rounded-full px-2.5 py-1 flex items-center gap-1.5">
        <span class="text-base">⚽️</span>
        <span class="text-[10px] font-black text-gray-800">RECESS</span>
      </div>
      <div class="absolute top-3 right-3 streak-badge">
        <span class="text-white text-[11px] font-black">⚡ +20 XP</span>
      </div>
      <div class="absolute bottom-3 left-3 right-3">
        <p class="text-white text-xl font-black leading-tight">Want to join the game? ⚽️</p>
      </div>
    </div>

    <!-- Lumi tip -->
    <div class="lumi-tip mt-4">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1778256095736-image-1.png" class="w-10 h-10 rounded-full border-2 border-white object-cover bg-white">
      <p class="text-[14px] font-bold leading-snug">No wrong answer! 💛</p>
    </div>

    <!-- Choices -->
    <p class="text-[13px] font-black text-gray-700 mt-6 mb-3">What would you do? 🤔</p>
    <div class="space-y-3">
      <div class="choice-card selected">
        <div class="choice-num" style="background:linear-gradient(135deg,#9C8DFF,#7C6FE5)">A</div>
        <p class="text-[15px] font-bold text-gray-900 flex-1">Ask "Can I play?" 😊</p>
        <i class="fas fa-circle-check text-[#7C6FE5] text-xl"></i>
      </div>
      <div class="choice-card">
        <div class="choice-num" style="background:linear-gradient(135deg,#FFCB85,#FF8B66)">B</div>
        <p class="text-[15px] font-bold text-gray-900 flex-1">Watch first 👀</p>
      </div>
      <div class="choice-card">
        <div class="choice-num" style="background:linear-gradient(135deg,#A8E6CF,#56C596)">C</div>
        <p class="text-[15px] font-bold text-gray-900 flex-1">Find a grown-up 🧑‍🏫</p>
      </div>
      <div class="choice-card">
        <div class="choice-num" style="background:linear-gradient(135deg,#F5C6E0,#E891B7)">D</div>
        <p class="text-[15px] font-bold text-gray-900 flex-1">Play on my own 🎨</p>
      </div>
    </div>

    <!-- Submit -->
    <button class="w-full mt-7 py-4 rounded-2xl text-white font-black text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#FF8B66,#FF6B47);box-shadow:0 8px 20px rgba(255,139,102,0.35)">
      <span>Try it!</span>
      <i class="fas fa-arrow-right"></i>
    </button>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-book-open"></i><span>Library</span></div>
    <div class="tab active"><i class="fas fa-puzzle-piece"></i><span>Practice</span></div>
    <div class="tab"><i class="fas fa-chart-line"></i><span>Growth</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
