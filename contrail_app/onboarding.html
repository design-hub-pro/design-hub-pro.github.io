<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrail — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Space Grotesk',sans-serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#08142D}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30}
.statusbar .time{font-size:16px;font-weight:700}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
</style>
</head>
<body>
<div class="screen">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782584874594-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,20,45,.25) 0%,rgba(8,20,45,.35) 45%,rgba(8,20,45,.96) 100%)"></div>

  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="absolute inset-0 z-20 flex flex-col">
    <!-- Brand -->
    <div class="pt-4 px-8 flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#38BDF8,#1E5FE8)"><i class="fas fa-plane-up text-white"></i></div>
      <span class="display text-[20px] font-700 tracking-tight">Contrail</span>
    </div>

    <div class="flex-1"></div>

    <!-- Copy -->
    <div class="px-8 pb-10">
      <span class="inline-flex items-center gap-1.5 bg-white/10 border border-white/15 backdrop-blur px-3 py-1.5 rounded-full text-[12px] font-semibold mb-5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>For everyone who looks up</span>
      <h1 class="display text-[42px] font-700 leading-[1.04] mb-4">Track it.<br>Spot it.<br><span class="text-sky-300">Collect it.</span></h1>
      <p class="text-white/75 text-[15px] leading-relaxed max-w-[300px]">Identify any plane overhead, follow flights in real time, and build a logbook of every aircraft you've spotted.</p>

      <!-- feature chips -->
      <div class="flex flex-wrap gap-2 mt-6">
        <span class="bg-white/10 border border-white/15 px-3 py-1.5 rounded-full text-[12px] font-semibold"><i class="fas fa-binoculars text-sky-300 mr-1.5"></i>Identify overhead</span>
        <span class="bg-white/10 border border-white/15 px-3 py-1.5 rounded-full text-[12px] font-semibold"><i class="fas fa-satellite-dish text-sky-300 mr-1.5"></i>Live radar</span>
        <span class="bg-white/10 border border-white/15 px-3 py-1.5 rounded-full text-[12px] font-semibold"><i class="fas fa-book-bookmark text-sky-300 mr-1.5"></i>Logbook</span>
      </div>

      <!-- CTA -->
      <a href="home.html" class="mt-8 flex items-center justify-center gap-2 w-full h-[56px] rounded-2xl text-[16px] font-bold" style="background:linear-gradient(135deg,#38BDF8,#1E5FE8);box-shadow:0 14px 30px rgba(30,95,232,.45)">Start spotting <i class="fas fa-arrow-right text-[13px]"></i></a>
      <div class="flex items-center justify-center gap-2 mt-5 text-white/60 text-[12px]">
        <span class="w-6 h-1.5 rounded-full bg-white"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-white/40"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
