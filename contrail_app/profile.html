<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrail — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#EEF3FA;color:#0B1B33;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Space Grotesk',sans-serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:700}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:0;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:112px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:90px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid #E1E8F2;display:flex;align-items:flex-start;justify-content:space-around;padding:12px 14px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#9FB1CC;width:56px}
.tab i{font-size:19px}.tab.active{color:#1E73E8}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#38BDF8,#1E5FE8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 10px 22px rgba(30,95,232,.42);margin-top:-16px}
</style>
</head>
<body>
<div class="screen">
  <div class="content">
    <!-- Header banner -->
    <div class="relative h-[238px]">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782584882060-image-1.png" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,20,45,.35),rgba(8,20,45,.85))"></div>
      <div class="island"></div>
      <div class="statusbar">
        <span class="time">9:41</span>
        <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
      </div>
      <div class="absolute top-[64px] right-7 z-20"><button class="w-10 h-10 rounded-full bg-black/30 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-gear"></i></button></div>
      <div class="absolute bottom-5 left-7 right-7 z-20 flex items-end gap-4">
        <div class="w-[78px] h-[78px] rounded-3xl bg-cover bg-center ring-4 ring-white/90 shadow-xl" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782584964214-image-1.png')"></div>
        <div class="flex-1 pb-1">
          <h1 class="display text-white text-[22px] font-700 leading-none">Maya Chen</h1>
          <p class="text-white/80 text-[13px] font-semibold mt-1.5">@mayaflies · San Francisco</p>
        </div>
      </div>
    </div>

    <!-- Level card -->
    <div class="px-7 -mt-1">
      <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#FB923C,#EA580C)"><i class="fas fa-medal text-white text-[15px]"></i></div>
            <div><p class="display font-700 text-[15px] leading-none">Level 7 · Captain</p><p class="text-[11.5px] text-slate-400 mt-1">1,420 / 2,000 XP</p></div>
          </div>
          <span class="text-[12px] font-bold text-sky-600">Rank #214</span>
        </div>
        <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:71%;background:linear-gradient(90deg,#FB923C,#F59E0B)"></div></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="px-7 mt-5 grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl p-4 text-center border border-slate-100"><p class="display font-700 text-[24px] leading-none">142</p><p class="text-[11px] text-slate-400 mt-1.5 font-medium">Spots</p></div>
      <div class="bg-white rounded-2xl p-4 text-center border border-slate-100"><p class="display font-700 text-[24px] leading-none">38</p><p class="text-[11px] text-slate-400 mt-1.5 font-medium">Types</p></div>
      <div class="bg-white rounded-2xl p-4 text-center border border-slate-100"><p class="display font-700 text-[24px] leading-none text-amber-500">9</p><p class="text-[11px] text-slate-400 mt-1.5 font-medium">Badges</p></div>
    </div>

    <!-- Badges -->
    <div class="flex items-center justify-between px-7 mt-6 mb-3">
      <h3 class="text-[15px] font-bold">Badge case</h3>
      <span class="text-[13px] text-sky-600 font-semibold">9 of 30</span>
    </div>
    <div class="px-7 grid grid-cols-4 gap-3">
      <div class="flex flex-col items-center gap-1.5"><div class="w-full aspect-square rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-star text-white"></i></div><span class="text-[9.5px] font-semibold text-slate-500 text-center leading-tight">A380</span></div>
      <div class="flex flex-col items-center gap-1.5"><div class="w-full aspect-square rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FB923C,#EA580C)"><i class="fas fa-sun text-white"></i></div><span class="text-[9.5px] font-semibold text-slate-500 text-center leading-tight">Golden</span></div>
      <div class="flex flex-col items-center gap-1.5"><div class="w-full aspect-square rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#34D399,#0E9F6E)"><i class="fas fa-globe text-white"></i></div><span class="text-[9.5px] font-semibold text-slate-500 text-center leading-tight">Globe</span></div>
      <div class="flex flex-col items-center gap-1.5"><div class="w-full aspect-square rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#38BDF8,#1E5FE8)"><i class="fas fa-fire text-white"></i></div><span class="text-[9.5px] font-semibold text-slate-500 text-center leading-tight">Streak</span></div>
    </div>

    <!-- Menu -->
    <div class="px-7 mt-6 space-y-2.5">
      <a href="community.html" class="flex items-center gap-3.5 bg-white rounded-2xl p-3.5 border border-slate-100"><div class="w-9 h-9 rounded-xl bg-sky-100 flex items-center justify-center"><i class="fas fa-users text-sky-600 text-[14px]"></i></div><span class="flex-1 font-semibold text-[14px]">My community feed</span><i class="fas fa-chevron-right text-slate-300 text-[13px]"></i></a>
      <a href="explore.html" class="flex items-center gap-3.5 bg-white rounded-2xl p-3.5 border border-slate-100"><div class="w-9 h-9 rounded-xl bg-orange-100 flex items-center justify-center"><i class="fas fa-bullseye text-orange-600 text-[14px]"></i></div><span class="flex-1 font-semibold text-[14px]">Spotting goals</span><span class="text-[11px] font-bold text-slate-400 mr-1">26 left</span><i class="fas fa-chevron-right text-slate-300 text-[13px]"></i></a>
      <a href="#" class="flex items-center gap-3.5 bg-white rounded-2xl p-3.5 border border-slate-100"><div class="w-9 h-9 rounded-xl bg-violet-100 flex items-center justify-center"><i class="fas fa-bell text-violet-600 text-[14px]"></i></div><span class="flex-1 font-semibold text-[14px]">Flight alerts</span><span class="w-9 h-5 rounded-full bg-sky-500 flex items-center px-0.5 justify-end"><span class="w-4 h-4 rounded-full bg-white"></span></span></a>
      <a href="#" class="flex items-center gap-3.5 bg-white rounded-2xl p-3.5 border border-slate-100"><div class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center"><i class="fas fa-gear text-slate-600 text-[14px]"></i></div><span class="flex-1 font-semibold text-[14px]">Settings</span><i class="fas fa-chevron-right text-slate-300 text-[13px]"></i></a>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tabbar">
    <a href="home.html" class="tab"><i class="fas fa-house"></i>Home</a>
    <a href="radar.html" class="tab"><i class="fas fa-satellite-dish"></i>Radar</a>
    <a href="identify.html" class="flex flex-col items-center"><div class="fab"><i class="fas fa-binoculars"></i></div></a>
    <a href="logbook.html" class="tab"><i class="fas fa-book-bookmark"></i>Logbook</a>
    <a href="profile.html" class="tab active"><i class="fas fa-user"></i>Me</a>
  </div>
</div>
</body>
</html>
