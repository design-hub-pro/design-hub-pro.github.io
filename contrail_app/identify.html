<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrail — Identify</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Space Grotesk',sans-serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30}
.statusbar .time{font-size:16px;font-weight:700}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
@keyframes pulse2{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.5}}
.reticle{animation:pulse2 2.2s ease-in-out infinite}
</style>
</head>
<body>
<div class="screen">
  <!-- sky camera feed -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782584888294-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/15"></div>

  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- top bar -->
  <div class="absolute top-[64px] left-0 right-0 px-7 flex items-center justify-between z-30">
    <a href="home.html" class="w-10 h-10 rounded-full bg-black/35 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark"></i></a>
    <span class="bg-black/35 backdrop-blur px-3.5 py-2 rounded-full text-[12px] font-bold flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 reticle"></span>Point at the sky</span>
    <button class="w-10 h-10 rounded-full bg-black/35 backdrop-blur flex items-center justify-center"><i class="fas fa-bolt"></i></button>
  </div>

  <!-- reticle on plane -->
  <div class="absolute z-20" style="left:50%;top:42%;transform:translate(-50%,-50%)">
    <div class="reticle w-40 h-40 rounded-3xl border-2 border-sky-300/90" style="box-shadow:0 0 40px rgba(56,189,248,.4)">
      <div class="absolute -top-1 -left-1 w-5 h-5 border-t-[3px] border-l-[3px] border-white rounded-tl-lg"></div>
      <div class="absolute -top-1 -right-1 w-5 h-5 border-t-[3px] border-r-[3px] border-white rounded-tr-lg"></div>
      <div class="absolute -bottom-1 -left-1 w-5 h-5 border-b-[3px] border-l-[3px] border-white rounded-bl-lg"></div>
      <div class="absolute -bottom-1 -right-1 w-5 h-5 border-b-[3px] border-r-[3px] border-white rounded-br-lg"></div>
    </div>
    <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap bg-sky-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full">99% match</span>
  </div>

  <!-- result card bottom -->
  <div class="absolute bottom-0 left-0 right-0 z-30 px-6 pb-9">
    <div class="rounded-[26px] p-5" style="background:rgba(11,27,51,.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1)">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-[10px] font-bold text-emerald-300 bg-emerald-400/15 px-2 py-1 rounded-full"><i class="fas fa-circle-check mr-1"></i>IDENTIFIED</span>
        <span class="text-[10px] font-bold text-sky-200 bg-sky-400/15 px-2 py-1 rounded-full">NEW TO YOU</span>
      </div>
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="display text-[24px] font-700 leading-none">Boeing 787-9</h2>
          <p class="text-white/70 text-[13px] font-semibold mt-1.5">United · UA 858 · SFO → NRT</p>
        </div>
        <div class="w-16 h-16 rounded-2xl bg-cover bg-center ring-1 ring-white/15" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782584906744-image-1.png')"></div>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4 text-center">
        <div class="bg-white/8 rounded-xl py-2.5"><p class="display font-700 text-[16px]">38,000</p><p class="text-white/55 text-[10px] font-medium">altitude ft</p></div>
        <div class="bg-white/8 rounded-xl py-2.5"><p class="display font-700 text-[16px]">512</p><p class="text-white/55 text-[10px] font-medium">speed kt</p></div>
        <div class="bg-white/8 rounded-xl py-2.5"><p class="display font-700 text-[16px]">9 mi</p><p class="text-white/55 text-[10px] font-medium">distance</p></div>
      </div>
      <div class="flex gap-3">
        <a href="spot-detail.html" class="flex-1 h-[50px] rounded-2xl flex items-center justify-center gap-2 text-[15px] font-bold" style="background:linear-gradient(135deg,#38BDF8,#1E5FE8)"><i class="fas fa-plus"></i>Add to logbook</a>
        <a href="aircraft-detail.html" class="w-[50px] h-[50px] rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center text-[16px]"><i class="fas fa-circle-info"></i></a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
