<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermaPack - Smart Backpack Health Monitor</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #ffffff;
      color: #1E293B;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 50px;
      background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
      font-size: 13px;
      font-weight: 600;
      color: #6366F1;
      margin-bottom: 20px;
    }
    .hero-title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: 18px;
      color: #64748B;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .screens-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 32px;
      max-width: 1560px;
      margin: 0 auto;
      padding: 20px 40px 60px;
      justify-items: center;
    }

    .screen-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .phone-frame {
      width: 460px;
      height: 980px;
      border-radius: 62px;
      background: #000;
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1) inset,
        0 25px 60px rgba(0,0,0,0.15),
        0 10px 30px rgba(0,0,0,0.1);
      position: relative;
    }

    .phone-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 52px;
      background: #F8FAFC;
    }

    .screen-label {
      font-size: 15px;
      font-weight: 600;
      color: #64748B;
    }

    @media (max-width: 1600px) {
      .screens-grid {
        gap: 32px 24px;
        padding: 20px 24px 60px;
      }
      .phone-frame {
        width: 420px;
        height: 896px;
        border-radius: 56px;
        padding: 11px;
      }
      .phone-frame iframe {
        border-radius: 47px;
      }
    }

    @media (max-width: 1400px) {
      .screens-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 28px 20px;
      }
      .phone-frame {
        width: 380px;
        height: 810px;
        border-radius: 50px;
        padding: 10px;
      }
      .phone-frame iframe {
        border-radius: 42px;
      }
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <div class="hero">
    <div class="hero-badge">
      <i class="fas fa-shield-heart"></i>
      Smart Wearable Health Tech
    </div>
    <h1 class="hero-title">DermaPack</h1>
    <p class="hero-subtitle">Smart backpack companion app that monitors skin health, tracks stress & workload, and reduces irritation risk for students.</p>
  </div>

  <!-- Screenshots Grid -->
  <div class="screens-grid">
    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="home.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Dashboard</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="sensors.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Sensor Monitor</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="tasks.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Task Manager</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="stress.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Stress Check-in</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="calendar.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Calendar</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="report.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Symptom Report</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="trends.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Insights & Trends</div>
    </div>

    <div class="screen-wrapper">
      <div class="phone-frame">
        <iframe src="profile.html" scrolling="no"></iframe>
      </div>
      <div class="screen-label">Profile & Device</div>
    </div>
  </div>
</body>
</html>
