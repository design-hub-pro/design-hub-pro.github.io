<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGolf Lab - Game Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .screenshot-frame {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .screenshot-frame:hover {
            transform: translateY(-4px);
            box-shadow: 0 35px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08);
        }
        .screenshot-frame img {
            width: 100%;
            height: auto;
            display: block;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-5xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-sky-600 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-golf-ball-tee text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">EcoGolf Lab</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Redesign an Orlando golf hole to save water, bring back wildlife and keep golfers happy.</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Simulation</span>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Sustainability</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Climate Data</span>
            <span class="text-xs bg-lime-100 text-lime-700 px-3 py-1 rounded-full font-medium">Middle School</span>
        </div>
    </div>

    <!-- Game Screenshots -->
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038119806-image-1.png" alt="EcoGolf Lab - Title Screen">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038120298-image-1.png" alt="EcoGolf Lab - Hole Builder">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038120514-image-1.png" alt="EcoGolf Lab - Orlando Course Map">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038119223-image-1.png" alt="EcoGolf Lab - Drought Event">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038120788-image-1.png" alt="EcoGolf Lab - Wildlife Returns">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038118978-image-1.png" alt="EcoGolf Lab - Course Report">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038119079-image-1.png" alt="EcoGolf Lab - Water Simulation">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038119052-image-1.png" alt="EcoGolf Lab - Habitat Corridor">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038121558-image-1.png" alt="EcoGolf Lab - Playtest Mode">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038134745-image-1.png" alt="EcoGolf Lab - Hole Results">
            </div>
        </div>
    </div>
</body>
</html>
