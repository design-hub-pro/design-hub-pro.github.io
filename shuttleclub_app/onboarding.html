<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome · ShuttleClub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}*::-webkit-scrollbar{display:none}html,body{scrollbar-width:none}
  html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Inter',sans-serif;color:#0c0a09;overflow:hidden;}
  .font-serif{font-family:'Fraunces',serif;}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden bg-black">

  <!-- Hero photo -->
  <img src="https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=900&h=1600&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-90">
  <div class="absolute inset-0 bg-gradient-to-b from-black/35 via-black/20 to-black"></div>
  <div class="absolute inset-0 bg-gradient-to-tr from-lime-500/25 via-transparent to-amber-400/15"></div>

  <!-- Status bar -->
  <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-7 pt-3 text-white text-sm font-semibold z-30" style="height:59px">
    <span>9:41</span>
    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-xs"></i></div>
  </div>

  <!-- Logo -->
  <div class="absolute top-20 left-0 right-0 px-7 z-20 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-lime-400 to-emerald-600 flex items-center justify-center shadow-lg shadow-lime-500/30">
        <i class="fas fa-shuttle-space text-white text-lg rotate-45"></i>
      </div>
      <div class="text-white">
        <div class="font-serif text-xl font-bold leading-none">ShuttleClub</div>
        <div class="text-[10px] text-white/60 tracking-widest mt-0.5">PLAY · LEARN · CONNECT</div>
      </div>
    </div>
    <button class="text-white/80 text-xs font-semibold">Skip</button>
  </div>

  <!-- Live pill -->
  <div class="absolute top-44 left-1/2 -translate-x-1/2 z-20">
    <div class="bg-white/12 backdrop-blur-md ring-1 ring-white/20 rounded-full px-4 py-2 flex items-center gap-2.5">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-lime-400"></span>
      </span>
      <span class="text-white text-[11px] font-bold tracking-wider uppercase">2,184 playing now</span>
    </div>
  </div>

  <!-- Bottom content -->
  <div class="absolute left-0 right-0 bottom-0 z-20 px-7 pb-12">

    <!-- Tagline -->
    <div class="text-white mb-8">
      <h1 class="font-serif font-black text-[44px] leading-[0.95] tracking-tight">
        Find your<br>next <span class="text-lime-400 italic">rally.</span>
      </h1>
      <p class="text-white/75 text-[15px] mt-4 leading-relaxed max-w-[340px]">
        Book courts, match with players at your level, and learn from coaches — all in one place.
      </p>
    </div>

    <!-- Stats triple -->
    <div class="grid grid-cols-3 gap-2.5 mb-8">
      <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3.5 ring-1 ring-white/15">
        <div class="font-serif text-white text-2xl font-bold leading-none">28k</div>
        <div class="text-[10px] text-white/70 mt-1.5 font-semibold uppercase tracking-wider">Players</div>
      </div>
      <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3.5 ring-1 ring-white/15">
        <div class="font-serif text-white text-2xl font-bold leading-none">412</div>
        <div class="text-[10px] text-white/70 mt-1.5 font-semibold uppercase tracking-wider">Courts</div>
      </div>
      <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3.5 ring-1 ring-white/15">
        <div class="font-serif text-white text-2xl font-bold leading-none">6.1k</div>
        <div class="text-[10px] text-white/70 mt-1.5 font-semibold uppercase tracking-wider">Sessions/wk</div>
      </div>
    </div>

    <!-- CTAs -->
    <div class="space-y-3">
      <button class="w-full bg-lime-400 text-stone-900 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-lime-500/30">
        <i class="fab fa-apple text-lg"></i>
        Continue with Apple
      </button>
      <button class="w-full bg-white/10 backdrop-blur-md ring-1 ring-white/20 text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-2">
        <i class="fas fa-envelope text-sm"></i>
        Continue with email
      </button>
    </div>

    <div class="text-center text-white/50 text-[11px] mt-5">
      Already a member? <span class="text-lime-400 font-semibold">Sign in</span>
    </div>

    <!-- Home indicator -->
    <div class="mt-6 mx-auto w-32 h-1 bg-white rounded-full"></div>
  </div>

</div>
</body>
</html>
