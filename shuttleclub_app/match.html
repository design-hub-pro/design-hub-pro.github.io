<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Match · ShuttleClub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}*::-webkit-scrollbar{display:none}html,body{scrollbar-width:none}
  html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Inter',sans-serif;background:#0A1F1A;color:#fff;overflow:hidden;}
  .font-serif{font-family:'Fraunces',serif;}
  .scroll{overflow-y:scroll;height:100%;padding-bottom:120px;}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden">

  <!-- Subtle gradient background -->
  <div class="absolute inset-0 bg-gradient-to-b from-emerald-950 via-[#0A1F1A] to-black"></div>
  <div class="absolute top-0 right-0 w-72 h-72 rounded-full bg-lime-500/10 blur-3xl"></div>

  <!-- Status bar -->
  <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-7 pt-3 text-white text-sm font-semibold z-30" style="height:59px">
    <span>9:41</span>
    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-xs"></i></div>
  </div>

  <div class="scroll pt-[59px] relative">

    <!-- Header -->
    <div class="px-7 pt-3 flex items-center justify-between">
      <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur ring-1 ring-white/15 flex items-center justify-center">
        <i class="fas fa-chevron-left text-white text-xs"></i>
      </button>
      <div class="text-center">
        <div class="inline-flex items-center gap-1.5 bg-rose-500/20 backdrop-blur ring-1 ring-rose-500/30 rounded-full px-2.5 py-1">
          <span class="relative flex h-1.5 w-1.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-rose-400"></span>
          </span>
          <span class="text-[10px] font-bold uppercase tracking-widest text-rose-200">Live · Game 2</span>
        </div>
        <div class="text-[10px] text-white/50 mt-1 font-bold">MISSION BAY · COURT 3</div>
      </div>
      <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur ring-1 ring-white/15 flex items-center justify-center">
        <i class="fas fa-ellipsis text-white text-xs"></i>
      </button>
    </div>

    <!-- Scoreboard -->
    <div class="px-7 mt-5">
      <div class="bg-white/5 backdrop-blur ring-1 ring-white/10 rounded-3xl p-5">
        <!-- Team rows -->
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="flex -space-x-2">
              <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&h=80&fit=crop" class="w-9 h-9 rounded-full ring-2 ring-emerald-950 object-cover">
              <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop" class="w-9 h-9 rounded-full ring-2 ring-emerald-950 object-cover">
            </div>
            <div>
              <div class="font-serif font-bold text-base leading-tight">You · Priya</div>
              <div class="text-[10px] text-lime-400 font-bold uppercase tracking-wider">SERVING ▸</div>
            </div>
          </div>
          <div class="font-serif text-5xl font-black leading-none text-lime-400">18</div>
        </div>

        <div class="h-px bg-white/10"></div>

        <div class="flex items-center justify-between mt-4">
          <div class="flex items-center gap-3">
            <div class="flex -space-x-2">
              <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&h=80&fit=crop" class="w-9 h-9 rounded-full ring-2 ring-emerald-950 object-cover">
              <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=80&h=80&fit=crop" class="w-9 h-9 rounded-full ring-2 ring-emerald-950 object-cover">
            </div>
            <div>
              <div class="font-serif font-bold text-base leading-tight">Marcus · Sara</div>
              <div class="text-[10px] text-white/50 font-bold uppercase tracking-wider">RECEIVING</div>
            </div>
          </div>
          <div class="font-serif text-5xl font-black leading-none text-white/80">15</div>
        </div>

        <!-- Game tracker -->
        <div class="mt-5 flex items-center gap-2">
          <span class="text-[10px] text-white/40 font-bold uppercase tracking-widest">Best of 3 ·</span>
          <div class="flex items-center gap-1">
            <span class="w-6 h-6 rounded-md bg-lime-400 text-emerald-950 text-[10px] font-bold flex items-center justify-center">21</span>
            <span class="text-white/30 text-[10px]">/</span>
            <span class="w-6 h-6 rounded-md bg-white/10 text-white/60 text-[10px] font-bold flex items-center justify-center">15</span>
          </div>
          <span class="text-[10px] text-white/40 font-bold">→</span>
          <div class="flex items-center gap-1">
            <span class="w-6 h-6 rounded-md bg-lime-400/40 ring-1 ring-lime-400 text-lime-300 text-[10px] font-bold flex items-center justify-center">18</span>
            <span class="text-white/30 text-[10px]">/</span>
            <span class="w-6 h-6 rounded-md bg-white/10 text-white/60 text-[10px] font-bold flex items-center justify-center">15</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Court visual -->
    <div class="px-7 mt-5">
      <div class="bg-white/5 ring-1 ring-white/10 rounded-3xl p-4">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[10px] font-bold uppercase tracking-widest text-white/60">Last rally · 14 shots</span>
          <span class="text-[10px] font-bold text-lime-400">Won the point</span>
        </div>

        <!-- Court drawing -->
        <div class="relative w-full aspect-[5/7] bg-gradient-to-b from-emerald-700/50 to-emerald-900/60 rounded-2xl ring-1 ring-white/10 overflow-hidden">
          <!-- court lines -->
          <div class="absolute inset-3 ring-2 ring-white/50 rounded-sm"></div>
          <div class="absolute top-1/2 left-3 right-3 h-px bg-white/50"></div>
          <div class="absolute top-3 bottom-3 left-1/2 w-px bg-white/30"></div>
          <div class="absolute top-[28%] left-3 right-3 h-px bg-white/30"></div>
          <div class="absolute bottom-[28%] left-3 right-3 h-px bg-white/30"></div>

          <!-- net -->
          <div class="absolute top-1/2 left-3 right-3 h-1.5 bg-amber-300/60 -translate-y-1/2 rounded"></div>

          <!-- shot trajectory dots -->
          <div class="absolute w-2.5 h-2.5 rounded-full bg-lime-400" style="top:88%;left:30%"></div>
          <div class="absolute w-2 h-2 rounded-full bg-lime-300" style="top:18%;left:65%"></div>
          <div class="absolute w-2 h-2 rounded-full bg-lime-300" style="top:80%;left:75%"></div>
          <div class="absolute w-2 h-2 rounded-full bg-lime-300" style="top:24%;left:25%"></div>
          <div class="absolute w-3 h-3 rounded-full bg-rose-500 ring-2 ring-white" style="top:88%;left:62%"></div>

          <!-- lines connecting -->
          <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 140" preserveAspectRatio="none">
            <path d="M30,123 L65,25 L75,112 L25,34 L62,123" stroke="rgba(163,230,53,0.6)" stroke-width="0.5" fill="none" stroke-dasharray="2 1.5"/>
          </svg>

          <span class="absolute top-3 left-3 text-[9px] font-bold text-white/70 px-1.5 py-0.5 rounded bg-black/20">OPP</span>
          <span class="absolute bottom-3 right-3 text-[9px] font-bold text-lime-300 px-1.5 py-0.5 rounded bg-black/20">YOU</span>
        </div>
      </div>
    </div>

    <!-- Shot breakdown -->
    <div class="px-7 mt-5">
      <h3 class="text-[10px] font-bold uppercase tracking-widest text-white/60 mb-3">Game 2 · shot mix</h3>
      <div class="grid grid-cols-4 gap-2.5">
        <div class="bg-white/5 ring-1 ring-white/10 rounded-2xl p-3 text-center">
          <div class="font-serif text-xl font-bold text-lime-400">9</div>
          <div class="text-[9px] text-white/60 font-bold uppercase tracking-wider mt-0.5">Smashes</div>
        </div>
        <div class="bg-white/5 ring-1 ring-white/10 rounded-2xl p-3 text-center">
          <div class="font-serif text-xl font-bold text-amber-300">4</div>
          <div class="text-[9px] text-white/60 font-bold uppercase tracking-wider mt-0.5">Net kills</div>
        </div>
        <div class="bg-white/5 ring-1 ring-white/10 rounded-2xl p-3 text-center">
          <div class="font-serif text-xl font-bold text-sky-300">12</div>
          <div class="text-[9px] text-white/60 font-bold uppercase tracking-wider mt-0.5">Clears</div>
        </div>
        <div class="bg-white/5 ring-1 ring-white/10 rounded-2xl p-3 text-center">
          <div class="font-serif text-xl font-bold text-rose-300">3</div>
          <div class="text-[9px] text-white/60 font-bold uppercase tracking-wider mt-0.5">Faults</div>
        </div>
      </div>
    </div>

    <!-- Scoring action -->
    <div class="px-7 mt-5">
      <div class="grid grid-cols-2 gap-3">
        <button class="bg-lime-400 text-emerald-950 font-bold py-4 rounded-2xl flex flex-col items-center">
          <div class="text-[10px] font-bold uppercase tracking-wider opacity-80">You · Priya</div>
          <div class="font-serif text-xl font-bold flex items-center gap-1.5 mt-0.5">
            <i class="fas fa-plus text-xs"></i> Point
          </div>
        </button>
        <button class="bg-white/10 backdrop-blur ring-1 ring-white/15 text-white font-bold py-4 rounded-2xl flex flex-col items-center">
          <div class="text-[10px] font-bold uppercase tracking-wider opacity-80">Marcus · Sara</div>
          <div class="font-serif text-xl font-bold flex items-center gap-1.5 mt-0.5">
            <i class="fas fa-plus text-xs"></i> Point
          </div>
        </button>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-2.5">
        <button class="bg-white/5 ring-1 ring-white/10 text-white/80 font-bold py-2.5 rounded-xl text-[11px]">
          <i class="fas fa-rotate-left text-[10px] mr-1"></i> Undo
        </button>
        <button class="bg-white/5 ring-1 ring-white/10 text-white/80 font-bold py-2.5 rounded-xl text-[11px]">
          <i class="fas fa-pause text-[10px] mr-1"></i> Pause
        </button>
        <button class="bg-white/5 ring-1 ring-white/10 text-white/80 font-bold py-2.5 rounded-xl text-[11px]">
          <i class="fas fa-video text-[10px] mr-1"></i> Clip
        </button>
      </div>
    </div>

    <div class="h-6"></div>
  </div>

  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/60 rounded-full z-40"></div>
</div>
</body>
</html>
