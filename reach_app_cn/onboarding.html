<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>触达 · 设置</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#3A47C7;--accent2:#7C7BF0;--warm:#DE8635;--ok:#1E9E6A;--ink:#141726;--ink2:#3A3F55;--muted:#767C93;--border:#E4E6F0;--surface:#F3F4F9;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;width:100%;height:100%;overflow-y:auto;overflow-x:hidden}
.screen{width:100%;min-height:100%;background:var(--surface);padding-bottom:118px}
.status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px}
.status .t{font-size:15px;font-weight:700}
.status .i{display:flex;gap:6px;font-size:13px}
.pad{padding:0 28px}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--white);border-radius:22px;box-shadow:0 1px 2px rgba(20,23,38,.05),0 8px 24px -12px rgba(20,23,38,.16)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.spk{width:44px;height:44px;border-radius:14px;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent)}
h1{font-size:38px;font-weight:800;letter-spacing:0;line-height:1.05;margin-top:20px}
/* need tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tl{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:18px 10px 14px;text-align:center;position:relative}
.tl i{font-size:24px;color:var(--ink2)}
.tl span{display:block;font-size:13.5px;font-weight:700;margin-top:11px;letter-spacing:0}
.tl.on{border-color:var(--accent);background:#EEF0FD;box-shadow:0 10px 22px -14px rgba(58,71,199,.9)}
.tl.on i{color:var(--accent)}
.tl u{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.ch{font-size:14px;font-weight:600;padding:11px 15px;border-radius:14px;background:var(--white);border:1.5px solid var(--border);display:flex;align-items:center;gap:8px}
.ch i{font-size:13px;color:var(--muted)}
.ch.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ch.on i{color:#fff}
/* toggles */
.tg{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border)}
.tg:last-child{border-bottom:none}
.tg .ic{width:36px;height:36px;border-radius:12px;background:#EEF0FD;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px}
.tg .n{font-size:16px;font-weight:600;flex:1}
.sw{width:50px;height:30px;border-radius:16px;background:#DDE0EC;position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
/* radius */
.rad{padding:18px 18px 20px;margin-top:12px}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;padding:0 2px}
.rhead b{font-size:36px;font-weight:800;letter-spacing:0;line-height:1}
.rhead b em{font-style:normal;font-size:16px;font-weight:600;color:var(--muted)}
.slider{height:8px;border-radius:5px;background:#E5E7F1;margin:16px 4px 0;position:relative}
.slider i{position:absolute;left:0;top:0;height:100%;width:58%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.slider u{position:absolute;left:58%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 4px 10px rgba(58,71,199,.35)}
.scale{display:flex;justify-content:space-between;margin:12px 4px 0}
.scale span{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.btnbar{position:absolute;left:0;right:0;bottom:0;padding:18px 28px 30px;background:linear-gradient(180deg,rgba(243,244,249,0),rgba(243,244,249,.98) 35%)}
.btn{height:58px;border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -14px rgba(58,71,199,.95)}
</style>
</head>
<body>
<div class="screen">
  <div class="status"><div class="island"></div><span class="t num">9:41</span><span class="i"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="pad">
    <div class="top">
      <div class="meta">第 1 步，共 1 步</div>
      <div class="spk"><i class="fas fa-volume-high"></i></div>
    </div>
    <h1>触达该知道<br>你的哪些事？</h1>

    <div class="sec"><div class="meta">我需要帮忙的事</div><div style="font-size:13px;font-weight:700;color:var(--accent)">已选 4 项</div></div>
    <div class="tiles">
      <div class="tl on"><u><i class="fas fa-check"></i></u><i class="fas fa-prescription-bottle-medical"></i><span>取药</span></div>
      <div class="tl on"><u><i class="fas fa-check"></i></u><i class="fas fa-basket-shopping"></i><span>买东西</span></div>
      <div class="tl"><i class="fas fa-route"></i><span>出门</span></div>
      <div class="tl on"><u><i class="fas fa-check"></i></u><i class="fas fa-file-lines"></i><span>办手续</span></div>
      <div class="tl on"><u><i class="fas fa-check"></i></u><i class="fas fa-briefcase"></i><span>工作</span></div>
      <div class="tl"><i class="fas fa-comments"></i><span>难受的日子</span></div>
    </div>

    <div class="sec"><div class="meta">用什么方式找我</div></div>
    <div class="chips">
      <div class="ch on"><i class="fas fa-microphone"></i>语音</div>
      <div class="ch"><i class="fas fa-message"></i>文字</div>
      <div class="ch on"><i class="fas fa-icons"></i>图符</div>
      <div class="ch"><i class="fas fa-video"></i>视频</div>
      <div class="ch"><i class="fas fa-hands"></i>手语</div>
    </div>

    <div class="sec"><div class="meta">应用该怎么表现</div></div>
    <div class="card">
      <div class="tg"><div class="ic"><i class="fas fa-text-height"></i></div><div class="n">大字号</div><div class="sw on"></div></div>
      <div class="tg"><div class="ic"><i class="fas fa-volume-high"></i></div><div class="n">每屏都朗读</div><div class="sw on"></div></div>
      <div class="tg"><div class="ic"><i class="fas fa-gauge-simple-low"></i></div><div class="n">放慢语速</div><div class="sw"></div></div>
      <div class="tg"><div class="ic"><i class="fas fa-circle-half-stroke"></i></div><div class="n">高对比度</div><div class="sw"></div></div>
    </div>

    <div class="sec"><div class="meta">谁能看到我的求助</div></div>
    <div class="card rad">
      <div class="rhead">
        <div><div class="meta" style="font-size:11px">邻居范围</div><b class="num" style="margin-top:8px;display:block">1.2<em> 公里</em></b></div>
        <div style="text-align:right"><b class="num" style="font-size:26px;color:var(--accent)">48</b><div class="meta" style="font-size:10.5px;margin-top:3px">已实名</div></div>
      </div>
      <svg viewBox="0 0 344 132" width="100%" height="132" style="margin-top:8px">
        <g fill="none" stroke="#DDE0EC" stroke-width="1.2">
          <circle cx="172" cy="126" r="42"/><circle cx="172" cy="126" r="82"/><circle cx="172" cy="126" r="122" stroke-dasharray="4 5"/>
        </g>
        <circle cx="172" cy="126" r="82" fill="#3A47C7" opacity="0.06"/>
        <g fill="#3A47C7">
          <circle cx="132" cy="98" r="4.5"/><circle cx="206" cy="88" r="4.5"/><circle cx="168" cy="60" r="4.5"/>
          <circle cx="112" cy="118" r="4.5"/><circle cx="238" cy="112" r="4.5"/><circle cx="196" cy="112" r="4.5"/>
          <circle cx="144" cy="72" r="4.5"/><circle cx="228" cy="66" r="4.5"/>
        </g>
        <g fill="#C3C7DA">
          <circle cx="72" cy="86" r="4"/><circle cx="276" cy="78" r="4"/><circle cx="60" cy="118" r="4"/>
          <circle cx="292" cy="114" r="4"/><circle cx="120" cy="40" r="4"/><circle cx="222" cy="30" r="4"/>
        </g>
        <circle cx="172" cy="126" r="13" fill="#3A47C7"/><circle cx="172" cy="126" r="21" fill="#3A47C7" opacity="0.16"/>
        <text x="172" y="130" font-family="Inter" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">我</text>
      </svg>
      <div class="slider"><i></i><u></u></div>
      <div class="scale"><span>300 米</span><span>1 公里</span><span>3 公里</span><span>10 公里</span></div>
    </div>
  </div>

  <div class="btnbar"><div class="btn">开始使用触达 <i class="fas fa-arrow-right"></i></div></div>
</div>
</body>
</html>
