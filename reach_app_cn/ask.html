<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>触达 · 求助</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#3A47C7;--accent2:#7C7BF0;--warm:#DE8635;--ok:#1E9E6A;--ink:#141726;--ink2:#3A3F55;--muted:#767C93;--border:#E4E6F0;--surface:#F3F4F9;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;width:100%;height:100%;overflow-y:auto;overflow-x:hidden}
.screen{width:100%;min-height:100%;background:var(--surface);padding-bottom:208px}
.status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px}
.status .t{font-size:15px;font-weight:700}
.status .i{display:flex;gap:6px;font-size:13px}
.pad{padding:0 28px}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--white);border-radius:22px;box-shadow:0 1px 2px rgba(20,23,38,.05),0 8px 24px -12px rgba(20,23,38,.16)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.sec .r{font-size:13px;font-weight:600;color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.rnd{width:44px;height:44px;border-radius:14px;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2)}
.nav h1{font-size:18px;font-weight:700;letter-spacing:0}
/* picture tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tl{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:20px 8px 15px;text-align:center;position:relative}
.tl i{font-size:27px;color:var(--ink2)}
.tl span{display:block;font-size:13.5px;font-weight:700;margin-top:12px;letter-spacing:0}
.tl.on{border-color:var(--accent);background:#EEF0FD;box-shadow:0 12px 24px -14px rgba(58,71,199,1)}
.tl.on i{color:var(--accent)}
.tl u{position:absolute;top:9px;right:9px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal}
/* chips */
.chips{display:flex;gap:9px}
.ch{flex:1;text-align:center;font-size:14.5px;font-weight:700;padding:14px 8px;border-radius:15px;background:var(--white);border:1.5px solid var(--border);color:var(--ink2)}
.ch.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* where */
.where{padding:16px 18px;display:flex;align-items:center;gap:13px}
.where .ic{width:42px;height:42px;border-radius:14px;background:#EEF0FD;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.where .nm{font-size:16px;font-weight:600}
.where .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
/* voice */
.voice{padding:18px 18px 16px;margin-top:2px}
.vtop{display:flex;align-items:center;gap:14px}
.play{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 10px 20px -10px rgba(58,71,199,1)}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:46px}
.wave i{flex:1;border-radius:2px;display:block;background:#D9DCEA}
.wave i.p{background:var(--accent)}
.vfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.vfoot .l{font-size:13px;font-weight:600;color:var(--muted)}
.vfoot .rr{font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:7px}
.trans{background:#F7F8FC;border-radius:14px;padding:13px 15px;margin-top:13px;font-size:14px;font-weight:500;color:var(--ink2);line-height:1.45}
/* audience */
.aud{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border)}
.aud:last-child{border-bottom:none}
.aud .ic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.aud .nm{font-size:15.5px;font-weight:600}
.aud .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.sw{width:50px;height:30px;border-radius:16px;background:#DDE0EC;position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.btnbar{position:absolute;left:0;right:0;bottom:88px;padding:16px 28px 18px;background:linear-gradient(180deg,rgba(243,244,249,0),rgba(243,244,249,.98) 38%)}
.btn{height:58px;border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -14px rgba(58,71,199,1)}
.hint{text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:11px;font-variant-numeric:tabular-nums}
.tabs{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:12px 12px 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#A3A8BC;font-size:10px;font-weight:600}
.tab i{font-size:19px}
.tab.on{color:var(--accent)}
</style>
</head>
<body>
<div class="screen">
  <div class="status"><div class="island"></div><span class="t num">13:58</span><span class="i"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="pad">
    <div class="nav">
      <div class="rnd"><i class="fas fa-chevron-left"></i></div>
      <h1>发起求助</h1>
      <div class="rnd" style="color:var(--accent)"><i class="fas fa-volume-high"></i></div>
    </div>

    <div class="sec"><div class="meta">你需要什么</div><div class="r">更多</div></div>
    <div class="tiles">
      <div class="tl on"><u><i class="fas fa-check"></i></u><i class="fas fa-prescription-bottle-medical"></i><span>取药</span></div>
      <div class="tl"><i class="fas fa-basket-shopping"></i><span>买东西</span></div>
      <div class="tl"><i class="fas fa-route"></i><span>去某个地方</span></div>
      <div class="tl"><i class="fas fa-envelope-open-text"></i><span>念封信</span></div>
      <div class="tl"><i class="fas fa-screwdriver-wrench"></i><span>修东西</span></div>
      <div class="tl"><i class="fas fa-mug-hot"></i><span>说说话</span></div>
    </div>

    <div class="sec"><div class="meta">什么时候</div></div>
    <div class="chips">
      <div class="ch on">现在</div>
      <div class="ch">今天</div>
      <div class="ch">选时间</div>
    </div>

    <div class="sec"><div class="meta">在哪里</div><div class="r">修改</div></div>
    <div class="card where">
      <div class="ic"><i class="fas fa-house-chimney"></i></div>
      <div style="flex:1"><div class="nm">家 · B 门</div><div class="sub num">榆杭路 88 弄 · 有电梯，无台阶</div></div>
      <i class="fas fa-chevron-right" style="color:var(--muted);font-size:13px"></i>
    </div>

    <div class="sec"><div class="meta">你的语音</div><div class="r num">0:14</div></div>
    <div class="card voice">
      <div class="vtop">
        <div class="play"><i class="fas fa-play"></i></div>
        <div class="wave">
          <i class="p" style="height:22%"></i><i class="p" style="height:44%"></i><i class="p" style="height:70%"></i><i class="p" style="height:52%"></i><i class="p" style="height:88%"></i><i class="p" style="height:64%"></i><i class="p" style="height:36%"></i><i class="p" style="height:76%"></i><i class="p" style="height:96%"></i><i class="p" style="height:58%"></i><i class="p" style="height:30%"></i><i class="p" style="height:66%"></i>
          <i style="height:82%"></i><i style="height:46%"></i><i style="height:60%"></i><i style="height:34%"></i><i style="height:72%"></i><i style="height:50%"></i><i style="height:26%"></i><i style="height:62%"></i><i style="height:40%"></i><i style="height:78%"></i><i style="height:32%"></i><i style="height:20%"></i>
        </div>
      </div>
      <div class="trans">“四川路永新药房的长期处方药配好了。今天我自己搬不上楼。”</div>
      <div class="vfoot">
        <span class="l">已自动转文字，方便听障邻居</span>
        <span class="rr"><i class="fas fa-rotate-left"></i> 重录</span>
      </div>
    </div>

    <div class="sec"><div class="meta">谁能看到这条求助</div></div>
    <div class="card">
      <div class="aud">
        <div class="ic" style="background:var(--accent)"><i class="fas fa-user-check"></i></div>
        <div style="flex:1"><div class="nm">已核验的邻居</div><div class="sub num">1.2 公里内 48 人 · 已实名</div></div>
        <div class="sw on"></div>
      </div>
      <div class="aud">
        <div class="ic" style="background:var(--warm)"><i class="fas fa-people-roof"></i></div>
        <div style="flex:1"><div class="nm">家人</div><div class="sub num">妈妈 · 哥哥</div></div>
        <div class="sw on"></div>
      </div>
      <div class="aud">
        <div class="ic" style="background:#5B6ACF"><i class="fas fa-building-shield"></i></div>
        <div style="flex:1"><div class="nm">街道社工</div><div class="sub num">仅在 30 分钟无人应答时</div></div>
        <div class="sw"></div>
      </div>
    </div>
  </div>

  <div class="btnbar">
    <div class="btn"><i class="fas fa-paper-plane"></i> 发出求助</div>
    <div class="hint">上一次求助 4 分钟就有人应了</div>
  </div>

  <div class="tabs">
    <div class="tab"><i class="fas fa-house"></i>首页</div>
    <div class="tab on"><i class="fas fa-hand-holding-heart"></i>求助</div>
    <div class="tab"><i class="fas fa-ear-listen"></i>听</div>
    <div class="tab"><i class="fas fa-seedling"></i>成长</div>
    <div class="tab"><i class="fas fa-heart-pulse"></i>稳住</div>
  </div>
</div>
</body>
</html>
