<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gluco-Sync - Active Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        @keyframes pulse-wave {
            0%, 100% { r: 60; opacity: 0.8; }
            50% { r: 80; opacity: 0.3; }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes float-up {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        .wave-ring {
            animation: pulse-wave 2s ease-out infinite;
        }
        .spin-slow {
            animation: spin-slow 20s linear infinite;
        }
        .music-note {
            animation: float-up 4s ease-in infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900">

    <!-- Phone Frame -->
    <div class="w-[430px] h-[932px] mx-auto bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 relative overflow-hidden">

        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 h-14 flex items-start justify-between px-8 pt-3 z-50">
            <div class="text-white text-[17px] font-semibold">9:41</div>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-white text-sm"></i>
                <i class="fas fa-wifi text-white text-sm"></i>
                <i class="fas fa-battery-three-quarters text-white text-sm"></i>
            </div>
        </div>

        <!-- Floating Music Notes -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <i class="fas fa-music text-white/10 text-2xl absolute music-note" style="left: 20%; top: 60%; animation-delay: 0s;"></i>
            <i class="fas fa-music text-white/10 text-xl absolute music-note" style="left: 70%; top: 70%; animation-delay: 1s;"></i>
            <i class="fas fa-music text-white/10 text-2xl absolute music-note" style="left: 50%; top: 80%; animation-delay: 2s;"></i>
            <i class="fas fa-music text-white/10 text-xl absolute music-note" style="left: 30%; top: 65%; animation-delay: 3s;"></i>
        </div>

        <!-- Main Content -->
        <div class="pt-16 pb-32 px-6 h-full overflow-y-auto">

            <!-- Header -->
            <div class="flex items-center justify-between mb-10">
                <button class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center active:scale-95 transition-transform">
                    <i class="fas fa-chevron-left text-white"></i>
                </button>
                <div class="text-center">
                    <div class="text-white/70 text-xs uppercase tracking-wider mb-1">Active Session</div>
                    <div class="text-white text-sm font-bold">Entrainment Mode</div>
                </div>
                <button class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center active:scale-95 transition-transform">
                    <i class="fas fa-ellipsis text-white"></i>
                </button>
            </div>

            <!-- Central Visualization -->
            <div class="flex items-center justify-center mb-10">
                <div class="relative">
                    <!-- Pulsing Waves -->
                    <svg width="280" height="280" viewBox="0 0 280 280" class="absolute inset-0">
                        <circle cx="140" cy="140" class="wave-ring" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" style="animation-delay: 0s;" />
                        <circle cx="140" cy="140" class="wave-ring" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" style="animation-delay: 0.5s;" />
                        <circle cx="140" cy="140" class="wave-ring" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" style="animation-delay: 1s;" />
                    </svg>

                    <!-- Rotating Ring -->
                    <svg width="280" height="280" class="absolute inset-0 spin-slow">
                        <circle cx="140" cy="140" r="110" fill="none" stroke="url(#gradient)" stroke-width="3" stroke-dasharray="4 8" opacity="0.6"/>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:rgb(167,139,250);stop-opacity:1" />
                                <stop offset="100%" style="stop-color:rgb(244,114,182);stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>

                    <!-- Center Content -->
                    <div class="relative w-72 h-72 flex items-center justify-center">
                        <div class="text-center">
                            <div class="mb-6">
                                <div class="text-white/60 text-sm mb-2">Current Heart Rate</div>
                                <div class="text-white text-6xl font-black mb-1">76</div>
                                <div class="text-white/80 text-sm">BPM</div>
                            </div>
                            <div class="w-px h-8 bg-white/20 mx-auto mb-6"></div>
                            <div>
                                <div class="text-white/60 text-sm mb-2">Music Tempo</div>
                                <div class="text-teal-300 text-5xl font-black mb-1">66</div>
                                <div class="text-teal-300/80 text-sm">BPM</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Stats -->
            <div class="grid grid-cols-3 gap-3 mb-8">
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 text-center">
                    <div class="text-white text-2xl font-bold mb-1">-6</div>
                    <div class="text-white/70 text-xs">BPM Drop</div>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 text-center">
                    <div class="text-white text-2xl font-bold mb-1">18:42</div>
                    <div class="text-white/70 text-xs">Elapsed</div>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 text-center">
                    <div class="text-white text-2xl font-bold mb-1">73%</div>
                    <div class="text-white/70 text-xs">Synced</div>
                </div>
            </div>

            <!-- Now Playing -->
            <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-5 mb-6">
                <div class="flex items-center space-x-4 mb-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-pink-500 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg">
                        <i class="fas fa-compact-disc text-white text-2xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-white font-bold text-base truncate">Clair de Lune</div>
                        <div class="text-white/70 text-sm truncate">Claude Debussy</div>
                        <div class="flex items-center space-x-2 mt-1">
                            <span class="text-teal-300 text-xs font-semibold">66 BPM</span>
                            <span class="text-white/40 text-xs">•</span>
                            <span class="text-white/60 text-xs">Classical</span>
                        </div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="h-1 bg-white/20 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-teal-400 to-blue-500 rounded-full" style="width: 62%"></div>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-white/60 text-xs">2:34</span>
                        <span class="text-white/60 text-xs">4:12</span>
                    </div>
                </div>

                <!-- Playback Controls -->
                <div class="flex items-center justify-center space-x-6">
                    <button class="w-10 h-10 text-white/60 active:text-white transition-colors">
                        <i class="fas fa-backward text-xl"></i>
                    </button>
                    <button class="w-16 h-16 bg-white rounded-full flex items-center justify-center active:scale-95 transition-transform shadow-xl">
                        <i class="fas fa-pause text-purple-600 text-xl ml-0.5"></i>
                    </button>
                    <button class="w-10 h-10 text-white/60 active:text-white transition-colors">
                        <i class="fas fa-forward text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Parasympathetic Activation -->
            <div class="bg-gradient-to-r from-teal-500/20 to-blue-500/20 backdrop-blur-md rounded-3xl p-5 border border-teal-400/30">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h4 class="text-white font-bold text-sm mb-1">Parasympathetic Activation</h4>
                        <p class="text-white/70 text-xs">Your "rest & digest" system</p>
                    </div>
                    <div class="w-12 h-12 bg-gradient-to-br from-teal-400 to-blue-500 rounded-2xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-leaf text-white text-xl"></i>
                    </div>
                </div>

                <!-- Activation Level -->
                <div class="relative h-3 bg-white/20 rounded-full overflow-hidden mb-2">
                    <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-teal-400 to-blue-500 rounded-full transition-all duration-500" style="width: 73%"></div>
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent animate-pulse"></div>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-white/60 text-xs">Activation Level</span>
                    <span class="text-teal-300 text-sm font-bold">73%</span>
                </div>
            </div>

        </div>

        <!-- Bottom Action -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/40 to-transparent backdrop-blur-xl px-6 py-4 pb-8">
            <button class="w-full bg-rose-500 hover:bg-rose-600 text-white rounded-full py-4 px-6 font-bold active:scale-95 transition-all shadow-xl">
                <i class="fas fa-stop mr-2"></i>
                End Session
            </button>
        </div>

    </div>

</body>
</html>
