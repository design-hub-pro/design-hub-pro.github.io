<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Training</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <h1 class="text-[30px] font-extrabold tracking-tight">Training</h1>
    <div class="chip bg-white shadow !py-2"><i class="fa-solid fa-fire text-orange-500"></i><span class="num text-[16px] font-bold">9</span>day streak</div>
  </div>

  <!-- continue hero video -->
  <div class="mt-4 rounded-[28px] overflow-hidden relative h-[240px]">
    <img src="img/facing.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.1) 30%,rgba(10,18,36,.92))"></div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="w-16 h-16 rounded-full bg-white/90 flex items-center justify-center text-[#0E1B36] text-[22px] shadow-xl"><i class="fa-solid fa-play ml-1"></i></div></div>
    <span class="absolute top-4 left-4 chip glass text-white">Continue · Lesson 4 of 8</span>
    <span class="absolute top-4 right-4 num text-[13px] font-bold text-white bg-black/50 px-2 py-0.5 rounded-md">3:12</span>
    <div class="absolute bottom-5 left-5 right-5 text-white">
      <div class="text-[22px] font-extrabold">Facing movements</div>
      <div class="mt-2 flex items-center gap-3"><div class="bar flex-1 !bg-white/20"><span class="g-gold" style="width:55%"></span></div><span class="num text-[14px] font-bold">55%</span></div>
    </div>
  </div>

  <!-- practice with camera -->
  <div class="mt-4 card p-4 flex items-center gap-4">
    <div class="w-14 h-14 rounded-2xl g-navy text-[#E8C55B] flex items-center justify-center text-[22px]"><i class="fa-solid fa-camera-rotate"></i></div>
    <div class="flex-1"><div class="text-[15px] font-bold">Self-check with camera</div><div class="text-[12px] text-gray-500">Record, get posture tips</div></div>
    <div class="chip g-gold text-[#0E1B36]">Try</div>
  </div>

  <div class="mt-6 flex items-center justify-between"><div class="text-[18px] font-bold">Drill &amp; ceremonies</div><span class="text-[13px] font-semibold text-gray-400">See all</span></div>
  <div class="hscroll mt-3">
    <div class="w-[170px] shrink-0"><div class="relative h-[110px] rounded-2xl overflow-hidden"><img src="img/rifle.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 right-1.5 num text-[11px] font-bold text-white bg-black/60 px-1.5 rounded">4:40</span><div class="absolute bottom-0 left-0 right-0 h-1 bg-white/30"><span class="block h-full bg-[#E8C55B]" style="width:100%"></span></div></div><div class="text-[14px] font-bold mt-2">Manual of arms</div><div class="text-[12px] text-green-600 font-semibold"><i class="fa-solid fa-check"></i> Done</div></div>
    <div class="w-[170px] shrink-0"><div class="relative h-[110px] rounded-2xl overflow-hidden"><img src="img/cadence.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 right-1.5 num text-[11px] font-bold text-white bg-black/60 px-1.5 rounded">2:55</span></div><div class="text-[14px] font-bold mt-2">Calling cadence</div><div class="text-[12px] text-gray-500">Leaders</div></div>
    <div class="w-[170px] shrink-0"><div class="relative h-[110px] rounded-2xl overflow-hidden"><img src="img/guard.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 right-1.5 num text-[11px] font-bold text-white bg-black/60 px-1.5 rounded">5:10</span></div><div class="text-[14px] font-bold mt-2">Flag folding</div><div class="text-[12px] text-gray-500">Color Guard</div></div>
  </div>

  <div class="mt-5 grid grid-cols-3 gap-3">
    <div class="card p-3 text-center"><div class="w-10 h-10 mx-auto rounded-xl g-blue text-white flex items-center justify-center"><i class="fa-solid fa-book-open"></i></div><div class="text-[12px] font-bold mt-2">Knowledge</div></div>
    <div class="card p-3 text-center"><div class="w-10 h-10 mx-auto rounded-xl g-orange text-white flex items-center justify-center"><i class="fa-solid fa-dumbbell"></i></div><div class="text-[12px] font-bold mt-2">Fitness</div></div>
    <div class="card p-3 text-center"><div class="w-10 h-10 mx-auto rounded-xl g-violet text-white flex items-center justify-center"><i class="fa-solid fa-clipboard-question"></i></div><div class="text-[12px] font-bold mt-2">Quizzes</div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab active"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
