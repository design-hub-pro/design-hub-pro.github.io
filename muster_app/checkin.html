<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Check-in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body{background:#0A1224;color:#fff}
.qr{display:grid;grid-template-columns:repeat(21,1fr);gap:0;width:210px;height:210px}
.qr i{background:#0E1B36}.qr b{background:transparent}
.corner{position:absolute;width:44px;height:44px;border-color:#E8C55B;border-style:solid}
</style>
</head><body><div class="screen">
<img src="img/pt.jpg" class="absolute inset-0 w-full h-full object-cover opacity-30">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.7),#0A1224 75%)"></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full relative flex flex-col items-center text-center">
  <div class="w-full flex justify-between mt-1"><div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div><div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div></div>

  <div class="mt-6 chip glass"><span class="dot s-ok"></span>On campus · Track</div>
  <h1 class="mt-3 text-[30px] font-extrabold tracking-tight">Morning PT muster</h1>
  <div class="text-[15px] text-white/60">Show this to your squad leader</div>

  <div class="relative mt-8 p-6 rounded-[32px] bg-white">
    <span class="corner -top-3 -left-3 border-t-4 border-l-4 rounded-tl-[22px]"></span>
    <span class="corner -top-3 -right-3 border-t-4 border-r-4 rounded-tr-[22px]"></span>
    <span class="corner -bottom-3 -left-3 border-b-4 border-l-4 rounded-bl-[22px]"></span>
    <span class="corner -bottom-3 -right-3 border-b-4 border-r-4 rounded-br-[22px]"></span>
    <div class="qr" id="qr"></div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="w-14 h-14 rounded-2xl g-gold border-4 border-white flex items-center justify-center text-[#0E1B36] text-[20px]"><i class="fa-solid fa-shield-halved"></i></div></div>
  </div>

  <div class="mt-8 flex items-center gap-3"><img src="img/c1.jpg" class="w-11 h-11 av"><div class="text-left"><div class="text-[16px] font-bold">C/SGT Maya Reyes</div><div class="text-[12px] text-white/50">Alpha · 2nd Squad</div></div></div>

  <div class="mt-6 w-full grid grid-cols-3 gap-3">
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[30px] font-bold leading-none text-[#E8C55B]">0641</div><div class="text-[11px] text-white/50 mt-1">Arrived</div></div>
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[30px] font-bold leading-none">23</div><div class="text-[11px] text-white/50 mt-1">On-time streak</div></div>
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[30px] font-bold leading-none text-green-400">+1</div><div class="text-[11px] text-white/50 mt-1">Merit</div></div>
  </div>
</div>
<div class="home-ind light"></div>
<script>
// deterministic pseudo-QR pattern
(function(){var q=document.getElementById('qr'),s=7,h='';
function finder(r,c){var zones=[[0,0],[0,14],[14,0]];for(var i=0;i<3;i++){var R=zones[i][0],C=zones[i][1];if(r>=R-1&&r<=R+7&&c>=C-1&&c<=C+7){var y=r-R,x=c-C;if(y<0||y>6||x<0||x>6)return 0;return (y==0||y==6||x==0||x==6||(y>=2&&y<=4&&x>=2&&x<=4))?1:0;}}return -1;}
for(var r=0;r<21;r++)for(var c=0;c<21;c++){var v=finder(r,c);if(v<0){s=(s*9301+49297)%233280;v=s/233280>.5?1:0;}h+=v?'<i></i>':'<b></b>';}
q.innerHTML=h})();
</script>
</div></body></html>
