<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div class="flex items-center gap-3">
      <img src="img/sai.jpg" class="w-12 h-12 av shadow">
      <div><div class="text-[13px] text-gray-400 font-semibold">Instructor view</div><h1 class="text-[24px] font-extrabold tracking-tight leading-tight">SGM Holloway</h1></div>
    </div>
    <div class="chip g-navy text-[#E8C55B] !py-2"><i class="fa-solid fa-repeat"></i>Cadet</div>
  </div>

  <!-- approvals hero -->
  <div class="mt-5 rounded-[28px] g-navy text-white p-5">
    <div class="flex items-end justify-between">
      <div><div class="label !text-white/50">Waiting on you</div><div class="num text-[52px] font-bold leading-none mt-1">19</div></div>
      <div class="chip bg-[#E8C55B] text-[#0E1B36] !py-2">Review all <i class="fa-solid fa-arrow-right"></i></div>
    </div>
    <div class="mt-4 grid grid-cols-3 gap-2">
      <div class="rounded-2xl bg-white/10 p-3"><i class="fa-solid fa-hand-holding-heart text-teal-300"></i><div class="num text-[26px] font-bold leading-none mt-2">12</div><div class="text-[11px] text-white/60">Hour logs</div></div>
      <div class="rounded-2xl bg-white/10 p-3"><i class="fa-solid fa-angles-up text-[#E8C55B]"></i><div class="num text-[26px] font-bold leading-none mt-2">5</div><div class="text-[11px] text-white/60">Promotions</div></div>
      <div class="rounded-2xl bg-white/10 p-3"><i class="fa-solid fa-scale-balanced text-red-300"></i><div class="num text-[26px] font-bold leading-none mt-2">2</div><div class="text-[11px] text-white/60">Appeals</div></div>
    </div>
  </div>

  <!-- swipe approve -->
  <div class="mt-4 card p-4">
    <div class="flex items-center gap-3">
      <img src="img/c1.jpg" class="w-11 h-11 av">
      <div class="flex-1"><div class="text-[14px] font-bold">Reyes · +4 service hrs</div><div class="text-[12px] text-gray-500">Food bank · photo attached</div></div>
      <img src="img/fair.jpg" class="w-11 h-11 rounded-xl object-cover">
    </div>
    <div class="mt-3 grid grid-cols-2 gap-2"><div class="h-11 rounded-xl bg-gray-100 text-gray-600 font-bold text-[14px] flex items-center justify-center gap-2"><i class="fa-solid fa-xmark"></i>Return</div><div class="h-11 rounded-xl g-green text-white font-bold text-[14px] flex items-center justify-center gap-2"><i class="fa-solid fa-check"></i>Approve</div></div>
  </div>

  <!-- attendance by unit -->
  <div class="mt-5 flex items-center justify-between"><div class="text-[18px] font-bold">Today's muster</div><span class="num text-[16px] font-bold text-green-600">158/168</span></div>
  <div class="mt-3 card p-4 space-y-3">
    <div class="flex items-center gap-3"><span class="w-16 text-[13px] font-bold">Alpha</span><div class="flex-1 bar !h-2.5"><span class="g-green" style="width:98%"></span></div><span class="num text-[15px] font-bold w-10 text-right">41</span></div>
    <div class="flex items-center gap-3"><span class="w-16 text-[13px] font-bold">Bravo</span><div class="flex-1 bar !h-2.5"><span class="g-green" style="width:95%"></span></div><span class="num text-[15px] font-bold w-10 text-right">38</span></div>
    <div class="flex items-center gap-3"><span class="w-16 text-[13px] font-bold">Echo</span><div class="flex-1 bar !h-2.5"><span class="g-orange" style="width:84%"></span></div><span class="num text-[15px] font-bold w-10 text-right">32</span></div>
    <div class="flex items-center gap-3"><span class="w-16 text-[13px] font-bold">Band</span><div class="flex-1 bar !h-2.5"><span class="g-green" style="width:96%"></span></div><span class="num text-[15px] font-bold w-10 text-right">21</span></div>
  </div>

  <!-- quick actions -->
  <div class="mt-4 grid grid-cols-4 gap-2 text-center">
    <div><div class="w-14 h-14 mx-auto rounded-2xl g-navy text-[#E8C55B] flex items-center justify-center text-[18px]"><i class="fa-solid fa-bullhorn"></i></div><div class="text-[11px] font-bold mt-1.5">Post order</div></div>
    <div><div class="w-14 h-14 mx-auto rounded-2xl g-gold text-white flex items-center justify-center text-[18px]"><i class="fa-solid fa-star"></i></div><div class="text-[11px] font-bold mt-1.5">Merit</div></div>
    <div><div class="w-14 h-14 mx-auto rounded-2xl g-teal text-white flex items-center justify-center text-[18px]"><i class="fa-solid fa-boxes-stacked"></i></div><div class="text-[11px] font-bold mt-1.5">Supply</div></div>
    <div><div class="w-14 h-14 mx-auto rounded-2xl g-slate text-white flex items-center justify-center text-[18px]"><i class="fa-solid fa-file-export"></i></div><div class="text-[11px] font-bold mt-1.5">Reports</div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab active"><i class="fa-solid fa-gauge"></i>Command</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-clipboard-check"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab"><i class="fa-solid fa-people-group"></i>Units</div></div><div class="home-ind"></div>
</div></body></html>
