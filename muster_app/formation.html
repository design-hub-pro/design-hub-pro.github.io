<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Formation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body{background:#0A1224;color:#fff}
.field{background:radial-gradient(circle at 50% 40%,#16284D,#0C1630 70%);background-size:cover;position:relative}
.field::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;border-radius:inherit}
.sq{display:flex;gap:10px;justify-content:center}
.p{width:30px;height:30px;border-radius:50%;background:#E8EDF7;color:#0E1B36;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.p.ld{background:linear-gradient(140deg,#F0CF6A,#B98D14)}
.p.gap{background:transparent;border:2px dashed #F87171;color:#F87171;box-shadow:none}
.p.sel{outline:3px solid #E8C55B;outline-offset:3px}
</style>
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[13px] text-white/50 font-semibold">Alpha Co. · 1st Platoon</div><h1 class="text-[28px] font-extrabold tracking-tight leading-tight">Formation</h1></div>
    <div class="chip bg-[#E8C55B] text-[#0E1B36] !py-2"><i class="fa-solid fa-wand-magic-sparkles"></i>Auto-fill</div>
  </div>

  <div class="mt-4 p-1 rounded-2xl bg-white/5 grid grid-cols-3 text-center text-[13px] font-bold">
    <div class="py-2 rounded-xl bg-white text-[#0E1B36]">Line</div><div class="py-2 text-white/50">Column</div><div class="py-2 text-white/50">Mass</div>
  </div>

  <!-- field -->
  <div class="field mt-4 rounded-[28px] p-5 pb-6 border border-white/10">
    <div class="relative flex flex-col items-center gap-4">
      <div class="flex items-center gap-2 text-[11px] font-bold text-white/50"><i class="fa-solid fa-arrow-up"></i>FRONT</div>
      <div class="flex gap-12 items-center">
        <div class="flex flex-col items-center gap-1"><div class="p ld !w-9 !h-9"><i class="fa-solid fa-flag text-[12px]"></i></div><span class="text-[10px] text-white/50">Guidon</span></div>
        <div class="flex flex-col items-center gap-1"><div class="p ld !w-9 !h-9">PL</div><span class="text-[10px] text-white/50">Okafor</span></div>
      </div>
      <div class="sq mt-2"><div class="p ld">SL</div><div class="p">02</div><div class="p">03</div><div class="p">04</div><div class="p">05</div><div class="p">06</div></div>
      <div class="sq"><div class="p ld sel">SL</div><div class="p">08</div><div class="p gap"><i class="fa-solid fa-xmark"></i></div><div class="p">10</div><div class="p">11</div><div class="p">12</div></div>
      <div class="sq"><div class="p ld">SL</div><div class="p">14</div><div class="p">15</div><div class="p">16</div><div class="p gap"><i class="fa-solid fa-xmark"></i></div><div class="p">18</div></div>
      <div class="sq"><div class="p ld">SL</div><div class="p">20</div><div class="p">21</div><div class="p">22</div><div class="p">23</div><div class="p" style="opacity:.25">24</div></div>
      <div class="flex flex-col items-center gap-1 mt-1"><div class="p ld !w-9 !h-9">PSG</div><span class="text-[10px] text-white/50">Tran</span></div>
    </div>
  </div>

  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[28px] font-bold leading-none">22</div><div class="text-[11px] text-white/50 mt-1"><span class="dot s-ok mr-1"></span>Present</div></div>
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[28px] font-bold leading-none text-red-400">2</div><div class="text-[11px] text-white/50 mt-1"><span class="dot s-bad mr-1"></span>Gaps</div></div>
    <div class="rounded-2xl bg-white/5 p-3"><div class="num text-[28px] font-bold leading-none text-[#E8C55B]">4</div><div class="text-[11px] text-white/50 mt-1"><span class="dot mr-1" style="background:#E8C55B"></span>Squads</div></div>
  </div>

  <!-- selected -->
  <div class="mt-4 rounded-[22px] bg-white text-[#111A2E] p-4 flex items-center gap-3">
    <img src="img/c1.jpg" class="w-12 h-12 av">
    <div class="flex-1"><div class="text-[15px] font-bold">Reyes · 2nd Squad Leader</div><div class="text-[12px] text-gray-500">Tap a gap to move a cadet</div></div>
    <div class="w-10 h-10 rounded-full g-navy text-[#E8C55B] flex items-center justify-center"><i class="fa-solid fa-arrows-up-down-left-right"></i></div>
  </div>
</div>
<div class="tab-bar dark"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab active"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind light"></div>
</div></body></html>
