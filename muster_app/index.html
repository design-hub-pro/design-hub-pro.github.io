<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#111A2E}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2f36,#0b0d11);box-shadow:0 50px 80px -30px rgba(14,27,54,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F2EC}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center bg-gradient-to-br from-blue-900 to-slate-950"><i class="fa-solid fa-shield-halved text-amber-300 text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight">Muster</h1>
  <p class="mt-3 text-[19px] text-gray-500">One app for a high school JROTC battalion: orders, schedule, ribbons, rank, drill and formation.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-blue-50 text-blue-900">JROTC</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Education</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Team Management</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Mobile</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="checkin.html" scrolling="no" title="checkin"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="announcements.html" scrolling="no" title="announcements"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="schedule.html" scrolling="no" title="schedule"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="logistics.html" scrolling="no" title="logistics"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="awards.html" scrolling="no" title="awards"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="award.html" scrolling="no" title="award"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="promotion.html" scrolling="no" title="promotion"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="units.html" scrolling="no" title="units"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="formation.html" scrolling="no" title="formation"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="drillteam.html" scrolling="no" title="drillteam"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="training.html" scrolling="no" title="training"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="social.html" scrolling="no" title="social"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="command.html" scrolling="no" title="command"></iframe></div></div>
</div></main>
</body></html>
