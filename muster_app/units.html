<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Units</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[13px] text-gray-400 font-semibold">Raider Battalion</div><h1 class="text-[30px] font-extrabold tracking-tight leading-tight">Units</h1></div>
    <div class="w-11 h-11 rounded-full bg-white shadow flex items-center justify-center"><i class="fa-solid fa-sitemap"></i></div>
  </div>

  <!-- battalion strip -->
  <div class="mt-4 card p-4 flex items-center justify-between">
    <div><div class="num text-[34px] font-bold leading-none">168</div><div class="text-[12px] text-gray-500">Cadets</div></div>
    <div class="w-px h-10 bg-gray-100"></div>
    <div><div class="num text-[34px] font-bold leading-none">6</div><div class="text-[12px] text-gray-500">Units</div></div>
    <div class="w-px h-10 bg-gray-100"></div>
    <div><div class="num text-[34px] font-bold leading-none text-green-600">94<span class="text-[18px]">%</span></div><div class="text-[12px] text-gray-500">Present today</div></div>
  </div>

  <!-- my units -->
  <div class="label mt-6">My units</div>
  <div class="mt-3 rounded-[26px] overflow-hidden relative h-[170px]">
    <img src="img/formation.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 60%">
    <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(10,18,36,.92) 10%,rgba(10,18,36,.2))"></div>
    <div class="absolute inset-0 p-5 text-white flex flex-col justify-between">
      <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl g-gold text-[#0E1B36] flex items-center justify-center font-extrabold">A</div><div class="text-[20px] font-extrabold">Alpha Company</div></div>
      <div class="flex items-end justify-between">
        <div><div class="text-[12px] text-white/60">CO · C/CPT Okafor</div><div class="flex -space-x-2 mt-2"><img src="img/c2.jpg" class="w-8 h-8 av"><img src="img/c4.jpg" class="w-8 h-8 av"><img src="img/c6.jpg" class="w-8 h-8 av"><div class="w-8 h-8 rounded-full border-2 border-white bg-white/20 backdrop-blur text-[11px] font-bold flex items-center justify-center">+39</div></div></div>
        <div class="text-right"><div class="num text-[30px] font-bold leading-none text-[#E8C55B]">1st</div><div class="text-[11px] text-white/60">Streamer race</div></div>
      </div>
    </div>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-3">
    <div class="card overflow-hidden"><div class="relative h-[96px]"><img src="img/drill.jpg" class="w-full h-full object-cover"><span class="absolute top-2 right-2 chip glass text-white !py-0.5 !px-2"><span class="dot s-ok"></span></span></div><div class="p-3"><div class="text-[15px] font-bold">Drill Team</div><div class="text-[12px] text-gray-500"><span class="num text-[14px] font-bold text-[#111A2E]">16</span> members</div></div></div>
    <div class="card overflow-hidden"><div class="relative h-[96px]"><img src="img/band.jpg" class="w-full h-full object-cover"><span class="absolute top-2 right-2 chip glass text-white !py-0.5 !px-2"><span class="dot s-ok"></span></span></div><div class="p-3"><div class="text-[15px] font-bold">Band</div><div class="text-[12px] text-gray-500"><span class="num text-[14px] font-bold text-[#111A2E]">22</span> members</div></div></div>
  </div>

  <div class="label mt-6">All units</div>
  <div class="mt-3 card divide-y divide-gray-100">
    <div class="p-4 flex items-center gap-3"><div class="w-10 h-10 rounded-xl g-blue text-white flex items-center justify-center font-extrabold">B</div><div class="flex-1"><div class="text-[14px] font-bold">Bravo Company</div><div class="text-[12px] text-gray-500">40 cadets</div></div><span class="dot s-ok"></span></div>
    <div class="p-4 flex items-center gap-3"><div class="w-10 h-10 rounded-xl g-violet text-white flex items-center justify-center font-extrabold">E</div><div class="flex-1"><div class="text-[14px] font-bold">Echo Company</div><div class="text-[12px] text-gray-500">38 cadets · 3 absent</div></div><span class="dot s-warn"></span></div>
    <div class="p-4 flex items-center gap-3"><div class="w-10 h-10 rounded-xl g-red text-white flex items-center justify-center"><i class="fa-solid fa-flag"></i></div><div class="flex-1"><div class="text-[14px] font-bold">Color Guard</div><div class="text-[12px] text-gray-500">8 cadets</div></div><span class="dot s-ok"></span></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab active"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
