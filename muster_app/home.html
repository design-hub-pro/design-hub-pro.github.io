<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div class="flex items-center gap-3">
      <img src="img/c1.jpg" class="w-12 h-12 av shadow">
      <div><div class="text-[13px] text-gray-400 font-semibold">Alpha Company · <span class="text-[#B98D14]">C/SGT</span></div><h1 class="text-[24px] font-extrabold tracking-tight leading-tight">Morning, Reyes</h1></div>
    </div>
    <div class="relative w-11 h-11 rounded-full bg-white shadow flex items-center justify-center"><i class="fa-regular fa-bell text-[18px]"></i><span class="absolute top-2 right-2.5 w-2.5 h-2.5 rounded-full bg-red-500 border-2 border-white"></span></div>
  </div>

  <!-- next event hero -->
  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[250px]">
    <img src="img/guard.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.05) 25%,rgba(10,18,36,.92))"></div>
    <div class="absolute top-4 left-4 chip glass text-white"><span class="dot s-warn"></span>Uniform: Class A</div>
    <div class="absolute bottom-5 left-5 right-5 text-white">
      <div class="text-[13px] text-white/60 font-semibold">Next up · Sat Nov 22</div>
      <div class="text-[24px] font-extrabold leading-tight">Veterans Day Parade</div>
      <div class="mt-3 flex items-center justify-between">
        <div class="flex items-center gap-4 num text-[30px] font-bold leading-none"><span>0<small class="text-[14px] text-white/50 ml-0.5">d</small></span><span>21<small class="text-[14px] text-white/50 ml-0.5">h</small></span><span>19<small class="text-[14px] text-white/50 ml-0.5">m</small></span></div>
        <div class="chip bg-[#E8C55B] text-[#0E1B36]"><i class="fa-solid fa-check"></i>Going</div>
      </div>
    </div>
  </div>

  <!-- stats -->
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-4"><div class="w-9 h-9 rounded-xl g-gold text-white flex items-center justify-center text-[15px]"><i class="fa-solid fa-star"></i></div><div class="num text-[32px] font-bold leading-none mt-3">128</div><div class="text-[12px] text-gray-500">Merit pts</div></div>
    <div class="card p-4"><div class="w-9 h-9 rounded-xl g-violet text-white flex items-center justify-center text-[15px]"><i class="fa-solid fa-medal"></i></div><div class="num text-[32px] font-bold leading-none mt-3">7<span class="text-[18px] text-gray-300">/12</span></div><div class="text-[12px] text-gray-500">Ribbons</div></div>
    <div class="card p-4"><div class="w-9 h-9 rounded-xl g-green text-white flex items-center justify-center text-[15px]"><i class="fa-solid fa-calendar-check"></i></div><div class="num text-[32px] font-bold leading-none mt-3">96<span class="text-[18px] text-gray-300">%</span></div><div class="text-[12px] text-gray-500">Attendance</div></div>
  </div>

  <!-- promotion progress -->
  <div class="mt-4 card p-5 flex items-center gap-4">
    <div class="w-14 h-14 rounded-2xl g-navy flex items-center justify-center"><div class="chev"><i></i><i></i><i></i></div></div>
    <div class="flex-1">
      <div class="flex items-center justify-between"><div class="text-[16px] font-bold">Next: C/SSG</div><div class="num text-[16px] font-bold text-[#B98D14]">4 of 5</div></div>
      <div class="bar mt-2"><span class="g-gold" style="width:80%"></span></div>
      <div class="text-[12px] text-gray-500 mt-2">Board Dec 4 · 1 item left</div>
    </div>
  </div>

  <!-- pinned announcement -->
  <div class="mt-4 card p-4 flex items-center gap-3">
    <img src="img/sai.jpg" class="w-11 h-11 av">
    <div class="flex-1 min-w-0"><div class="text-[14px] font-bold truncate"><i class="fa-solid fa-thumbtack text-[#B98D14] mr-1"></i>Bus leaves 0615 sharp</div><div class="text-[12px] text-gray-500 truncate">SGM Holloway · Parade logistics</div></div>
    <span class="dot s-bad"></span>
  </div>
</div>
<div class="tab-bar"><div class="tab active"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
