<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Award detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="absolute top-0 left-0 right-0 h-[300px]">
  <img src="img/fair.jpg" class="w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.35),rgba(10,18,36,.1) 40%,#F4F2EC)"></div>
</div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full relative" style="padding-bottom:120px">
  <div class="flex justify-between mt-1"><div class="w-10 h-10 rounded-full glass text-white flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div><div class="w-10 h-10 rounded-full glass text-white flex items-center justify-center"><i class="fa-solid fa-share-nodes"></i></div></div>

  <div class="mt-[150px] card p-5">
    <div class="flex items-center gap-4">
      <div class="ribbon lg r4"></div>
      <div><div class="text-[21px] font-extrabold leading-tight">Community Service</div><div class="text-[12px] text-gray-500 mt-0.5">Service · set by SGM Holloway</div></div>
    </div>
    <div class="mt-4 flex items-end justify-between"><div class="num text-[40px] font-bold leading-none">16<span class="text-[20px] text-gray-300"> / 20 hrs</span></div><div class="text-[13px] font-bold text-teal-700">4 to go</div></div>
    <div class="bar mt-2 !h-2.5"><span class="g-teal" style="width:80%"></span></div>
  </div>

  <div class="label mt-6">How to earn it</div>
  <div class="mt-3 card divide-y divide-gray-100">
    <div class="p-4 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-[13px]"><i class="fa-solid fa-hourglass-half"></i></div><div class="flex-1 text-[14px] font-semibold">20 verified service hours</div><span class="num text-[15px] font-bold text-gray-400">16/20</span></div>
    <div class="p-4 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center text-[13px]"><i class="fa-solid fa-check"></i></div><div class="flex-1 text-[14px] font-semibold">At least 3 different events</div><span class="num text-[15px] font-bold text-green-600">4/3</span></div>
    <div class="p-4 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-[13px]"><i class="fa-solid fa-signature"></i></div><div class="flex-1 text-[14px] font-semibold">Instructor sign-off</div><span class="dot s-off"></span></div>
  </div>

  <div class="label mt-6">My log</div>
  <div class="mt-3 space-y-2.5">
    <div class="card p-3 flex items-center gap-3"><img src="img/fair.jpg" class="w-12 h-12 rounded-xl object-cover"><div class="flex-1"><div class="text-[14px] font-bold">Food bank sort</div><div class="text-[12px] text-gray-500">Nov 15 · photo + supervisor</div></div><span class="num text-[18px] font-bold">+4</span><span class="dot s-warn"></span></div>
    <div class="card p-3 flex items-center gap-3"><img src="img/guard.jpg" class="w-12 h-12 rounded-xl object-cover"><div class="flex-1"><div class="text-[14px] font-bold">Game-day color guard</div><div class="text-[12px] text-gray-500">Nov 7 · approved</div></div><span class="num text-[18px] font-bold">+3</span><span class="dot s-ok"></span></div>
  </div>
</div>
<div class="absolute bottom-0 left-0 right-0 px-7 pt-4 pb-9 bg-gradient-to-t from-[#F4F2EC] via-[#F4F2EC] to-transparent z-30 flex gap-3">
  <div class="btn w-14 shrink-0 bg-white shadow text-[#0E1B36]"><i class="fa-solid fa-camera"></i></div>
  <div class="btn flex-1 g-navy text-white"><i class="fa-solid fa-plus text-[#E8C55B]"></i>Log service hours</div>
</div>
<div class="home-ind"></div>
</div></body></html>
