<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Awards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>.ring{--p:60;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c,#C9A227) calc(var(--p)*1%),#ECE9E0 0);display:flex;align-items:center;justify-content:center}.ring>div{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}</style>
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <h1 class="text-[30px] font-extrabold tracking-tight">Awards</h1>
    <div class="chip bg-white shadow text-[#0E1B36] !py-2"><i class="fa-solid fa-plus text-[#B98D14]"></i>Log activity</div>
  </div>

  <!-- rack -->
  <div class="mt-4 rounded-[28px] g-navy p-6 text-white relative overflow-hidden">
    <div class="absolute -right-10 -top-10 w-44 h-44 rounded-full bg-white/5"></div>
    <div class="flex items-end justify-between relative">
      <div><div class="label !text-white/50">My ribbon rack</div><div class="num text-[44px] font-bold leading-none mt-1">7<span class="text-[22px] text-white/40"> / 12</span></div></div>
      <div class="text-right"><div class="num text-[22px] font-bold text-[#E8C55B]">Top 15%</div><div class="text-[12px] text-white/50">of battalion</div></div>
    </div>
    <div class="mt-5 flex flex-col items-center gap-1.5 relative">
      <div class="flex gap-1.5"><div class="ribbon r8"></div><div class="ribbon r1"></div></div>
      <div class="flex gap-1.5"><div class="ribbon r2"></div><div class="ribbon r6"></div><div class="ribbon r3"></div></div>
      <div class="flex gap-1.5"><div class="ribbon r4"></div><div class="ribbon r7"></div><div class="ribbon r5 locked"></div></div>
      <div class="flex gap-1.5"><div class="ribbon r9 locked"></div><div class="ribbon r2 locked"></div><div class="ribbon r1 locked"></div><div class="ribbon r3 locked"></div></div>
    </div>
  </div>

  <div class="hscroll mt-4">
    <span class="chip bg-[#0E1B36] text-white shrink-0">All</span>
    <span class="chip bg-white text-gray-600 shrink-0"><i class="fa-solid fa-book text-blue-500"></i>Academic</span>
    <span class="chip bg-white text-gray-600 shrink-0"><i class="fa-solid fa-hand-holding-heart text-teal-500"></i>Service</span>
    <span class="chip bg-white text-gray-600 shrink-0"><i class="fa-solid fa-dumbbell text-orange-500"></i>Fitness</span>
    <span class="chip bg-white text-gray-600 shrink-0"><i class="fa-solid fa-person-rifle text-red-500"></i>Drill</span>
  </div>

  <div class="mt-5 flex items-center justify-between"><div class="text-[18px] font-bold">Almost there</div><span class="text-[13px] font-semibold text-gray-400">3 in progress</span></div>
  <div class="mt-3 space-y-3">
    <div class="card p-4 flex items-center gap-4 ring-2 ring-[#C9A227]/40">
      <div class="ring" style="--p:80;--c:#0F766E"><div><span class="num text-[16px] font-bold">80</span></div></div>
      <div class="flex-1"><div class="flex items-center gap-2"><div class="ribbon r4 !w-8 !h-3"></div><div class="text-[15px] font-bold">Community Service</div></div><div class="text-[12px] text-gray-500 mt-1"><span class="num text-[14px] font-bold text-[#111A2E]">16</span> / 20 hours</div></div>
      <i class="fa-solid fa-chevron-right text-gray-300"></i>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="ring" style="--p:66;--c:#EA580C"><div><span class="num text-[16px] font-bold">66</span></div></div>
      <div class="flex-1"><div class="flex items-center gap-2"><div class="ribbon r9 !w-8 !h-3"></div><div class="text-[15px] font-bold">Physical Fitness</div></div><div class="text-[12px] text-gray-500 mt-1"><span class="num text-[14px] font-bold text-[#111A2E]">2</span> / 3 events passed</div></div>
      <i class="fa-solid fa-chevron-right text-gray-300"></i>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="ring" style="--p:40;--c:#6D28D9"><div><span class="num text-[16px] font-bold">40</span></div></div>
      <div class="flex-1"><div class="flex items-center gap-2"><div class="ribbon r5 !w-8 !h-3"></div><div class="text-[15px] font-bold">Leadership</div></div><div class="text-[12px] text-gray-500 mt-1"><span class="num text-[14px] font-bold text-[#111A2E]">4</span> / 10 weeks as squad leader</div></div>
      <i class="fa-solid fa-chevron-right text-gray-300"></i>
    </div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab active"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
