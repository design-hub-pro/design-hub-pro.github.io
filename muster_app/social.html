<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Mess Hall</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>.st{width:62px;height:62px;border-radius:50%;padding:2.5px;background:linear-gradient(140deg,#F0CF6A,#B98D14)}.st img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid #F4F2EC}</style>
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <h1 class="text-[30px] font-extrabold tracking-tight">Mess Hall</h1>
    <span class="chip bg-white shadow text-gray-500"><i class="fa-solid fa-shield-halved text-green-600"></i>Instructor-moderated</span>
  </div>

  <div class="hscroll mt-4">
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="w-[62px] h-[62px] rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400"><i class="fa-solid fa-plus"></i></div><span class="text-[11px] font-semibold text-gray-500">Post</span></div>
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="st"><img src="img/c2.jpg"></div><span class="text-[11px] font-semibold">Okafor</span></div>
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="st"><img src="img/c5.jpg"></div><span class="text-[11px] font-semibold">Patel</span></div>
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="st"><img src="img/c3.jpg"></div><span class="text-[11px] font-semibold">Kim</span></div>
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="st"><img src="img/c4.jpg"></div><span class="text-[11px] font-semibold">Brooks</span></div>
    <div class="flex flex-col items-center gap-1 shrink-0"><div class="st" style="background:#D6D3CA"><img src="img/c6.jpg"></div><span class="text-[11px] font-semibold text-gray-400">Walsh</span></div>
  </div>

  <!-- streamer race -->
  <div class="mt-5 card p-5">
    <div class="flex items-center justify-between"><div class="text-[16px] font-bold">Streamer race</div><span class="text-[12px] font-semibold text-gray-400">Merits this month</span></div>
    <div class="mt-4 space-y-3">
      <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg g-gold text-[#0E1B36] text-[13px] font-extrabold flex items-center justify-center">A</div><div class="flex-1 bar !h-3"><span class="g-gold" style="width:92%"></span></div><span class="num text-[18px] font-bold w-12 text-right">1,840</span></div>
      <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg g-violet text-white text-[13px] font-extrabold flex items-center justify-center">E</div><div class="flex-1 bar !h-3"><span class="g-violet" style="width:84%"></span></div><span class="num text-[18px] font-bold w-12 text-right">1,690</span></div>
      <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg g-blue text-white text-[13px] font-extrabold flex items-center justify-center">B</div><div class="flex-1 bar !h-3"><span class="g-blue" style="width:71%"></span></div><span class="num text-[18px] font-bold w-12 text-right">1,420</span></div>
    </div>
  </div>

  <!-- shout-out -->
  <div class="mt-4 rounded-[24px] g-navy text-white p-4 flex items-center gap-3">
    <div class="relative"><img src="img/c5.jpg" class="w-12 h-12 av !border-[#E8C55B]"><span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full g-gold text-[#0E1B36] text-[11px] flex items-center justify-center"><i class="fa-solid fa-hands-clapping"></i></span></div>
    <div class="flex-1"><div class="text-[14px] font-bold">Shout-out to Patel</div><div class="text-[12px] text-white/60">Stayed late to help freshmen with facings</div></div>
    <div class="text-center"><div class="num text-[22px] font-bold text-[#E8C55B] leading-none">48</div><i class="fa-solid fa-fire text-[12px] text-orange-400"></i></div>
  </div>

  <!-- photo post -->
  <div class="mt-4 card overflow-hidden">
    <div class="p-4 flex items-center gap-3"><img src="img/c2.jpg" class="w-9 h-9 av"><div class="flex-1"><div class="text-[14px] font-bold">C/CPT Okafor</div><div class="text-[12px] text-gray-500">Band · 2h</div></div><i class="fa-solid fa-ellipsis text-gray-400"></i></div>
    <div class="relative h-[190px]"><img src="img/band.jpg" class="w-full h-full object-cover"></div>
    <div class="p-4 flex items-center gap-5 text-[14px] font-semibold text-gray-500"><span><i class="fa-solid fa-heart text-red-500 mr-1"></i><span class="num text-[16px] font-bold text-[#111A2E]">112</span></span><span><i class="fa-solid fa-medal text-[#B98D14] mr-1"></i><span class="num text-[16px] font-bold text-[#111A2E]">31</span></span><span><i class="fa-regular fa-comment mr-1"></i><span class="num text-[16px] font-bold text-[#111A2E]">9</span></span></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab active"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
