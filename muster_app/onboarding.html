<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen" style="background:#0A1224">
<img src="img/drill.jpg" class="absolute inset-0 w-full h-[62%] object-cover" style="object-position:50% 30%">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.15) 0%,rgba(10,18,36,.55) 38%,#0A1224 60%)"></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="absolute left-0 right-0 bottom-0 px-7 pb-12 text-white">
  <div class="w-16 h-16 rounded-2xl g-gold flex items-center justify-center text-[#0E1B36] text-[28px] shadow-xl"><i class="fa-solid fa-shield-halved"></i></div>
  <h1 class="mt-5 text-[44px] font-extrabold tracking-tight leading-none">Muster</h1>
  <p class="mt-3 text-[17px] text-white/70 leading-snug">Your whole battalion,<br>in one formation.</p>

  <div class="label mt-8 !text-white/50">I am a</div>
  <div class="mt-3 space-y-3">
    <div class="rounded-[22px] p-4 flex items-center gap-4 bg-white text-[#111A2E] ring-4 ring-[#C9A227]/50">
      <div class="w-12 h-12 rounded-2xl g-navy text-[#E8C55B] flex items-center justify-center text-[20px]"><i class="fa-solid fa-user-shield"></i></div>
      <div class="flex-1"><div class="text-[17px] font-bold">Cadet</div><div class="text-[13px] text-gray-500">Track awards, drills, rank</div></div>
      <i class="fa-solid fa-circle-check text-[#C9A227] text-[22px]"></i>
    </div>
    <div class="rounded-[22px] p-4 flex items-center gap-4 glass">
      <div class="w-12 h-12 rounded-2xl g-gold text-[#0E1B36] flex items-center justify-center text-[20px]"><i class="fa-solid fa-person-military-pointing"></i></div>
      <div class="flex-1"><div class="text-[17px] font-bold">Instructor</div><div class="text-[13px] text-white/60">Run units, approve, promote</div></div>
      <i class="fa-regular fa-circle text-white/40 text-[22px]"></i>
    </div>
    <div class="rounded-[22px] p-4 flex items-center gap-4 glass">
      <div class="w-12 h-12 rounded-2xl g-slate text-white flex items-center justify-center text-[20px]"><i class="fa-solid fa-building-columns"></i></div>
      <div class="flex-1"><div class="text-[17px] font-bold">School admin</div><div class="text-[13px] text-white/60">Rosters, forms, reports</div></div>
      <i class="fa-regular fa-circle text-white/40 text-[22px]"></i>
    </div>
  </div>

  <div class="btn mt-7 g-gold text-[#0E1B36]"><i class="fa-solid fa-qrcode"></i>Join with unit code</div>
  <div class="mt-4 text-center text-[13px] text-white/50">Invited by your instructor · <span class="text-white/80 font-semibold">Sign in</span></div>
</div>
<div class="home-ind light"></div>
</div></body></html>
