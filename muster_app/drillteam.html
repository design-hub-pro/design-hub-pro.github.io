<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster · Drill Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="absolute top-0 left-0 right-0 h-[330px]">
  <img src="img/trophy.jpg" class="w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,18,36,.4),rgba(10,18,36,.55) 50%,#F4F2EC)"></div>
</div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content relative">
  <div class="flex items-center justify-between mt-2 text-white">
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="flex -space-x-2"><img src="img/c2.jpg" class="w-8 h-8 av"><img src="img/c3.jpg" class="w-8 h-8 av"><img src="img/c6.jpg" class="w-8 h-8 av"><div class="w-8 h-8 rounded-full border-2 border-white bg-white/20 backdrop-blur text-[11px] font-bold flex items-center justify-center">+13</div></div>
  </div>
  <div class="mt-[60px] text-white">
    <div class="chip glass"><i class="fa-solid fa-trophy text-[#E8C55B]"></i>Region Drill Meet · Jan 17</div>
    <h1 class="text-[34px] font-extrabold tracking-tight leading-tight mt-2">Raider Drill Team</h1>
  </div>

  <!-- countdown -->
  <div class="mt-4 card p-5 flex items-center justify-between">
    <div><div class="label">Days out</div><div class="num text-[48px] font-bold leading-none mt-1">57</div></div>
    <div class="w-px h-14 bg-gray-100"></div>
    <div><div class="label">Routine ready</div><div class="num text-[48px] font-bold leading-none mt-1 text-[#B98D14]">68<span class="text-[22px]">%</span></div></div>
  </div>

  <!-- routine segments -->
  <div class="mt-5 flex items-center justify-between"><div class="text-[18px] font-bold">Exhibition routine</div><span class="num text-[15px] font-bold text-gray-400">4:30</span></div>
  <div class="mt-3 card p-4">
    <div class="flex gap-1.5 h-[54px] items-end">
      <div class="flex-1 rounded-lg g-green" style="height:100%"></div>
      <div class="flex-1 rounded-lg g-green" style="height:95%"></div>
      <div class="flex-1 rounded-lg g-green" style="height:88%"></div>
      <div class="flex-1 rounded-lg g-gold" style="height:70%"></div>
      <div class="flex-1 rounded-lg g-gold ring-2 ring-offset-2 ring-[#C9A227]" style="height:55%"></div>
      <div class="flex-1 rounded-lg g-red" style="height:35%"></div>
      <div class="flex-1 rounded-lg g-red" style="height:28%"></div>
      <div class="flex-1 rounded-lg bg-gray-200" style="height:12%"></div>
    </div>
    <div class="mt-2 flex justify-between num text-[12px] font-bold text-gray-400"><span>1</span><span>2</span><span>3</span><span>4</span><span class="text-[#B98D14]">5</span><span>6</span><span>7</span><span>8</span></div>
    <div class="mt-3 pt-3 border-t border-gray-100 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl g-gold text-white flex items-center justify-center"><i class="fa-solid fa-rotate"></i></div>
      <div class="flex-1"><div class="text-[14px] font-bold">Seg 5 · Ripple spin</div><div class="text-[12px] text-gray-500">Counts 33–48 · 9 of 16 clean</div></div>
      <div class="w-10 h-10 rounded-full bg-[#0E1B36] text-white flex items-center justify-center text-[13px]"><i class="fa-solid fa-play ml-0.5"></i></div>
    </div>
  </div>

  <!-- practice tools -->
  <div class="mt-4 grid grid-cols-2 gap-3">
    <div class="card p-4"><div class="w-10 h-10 rounded-xl g-navy text-[#E8C55B] flex items-center justify-center"><i class="fa-solid fa-stopwatch"></i></div><div class="text-[15px] font-bold mt-3">Count trainer</div><div class="text-[12px] text-gray-500">96 bpm metronome</div></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl g-red text-white flex items-center justify-center"><i class="fa-solid fa-video"></i></div><div class="text-[15px] font-bold mt-3">Film review</div><div class="text-[12px] text-gray-500"><span class="dot s-bad mr-1"></span>3 new notes</div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-regular fa-calendar"></i>Schedule</div><div class="tab"><div class="tab-fab"><i class="fa-solid fa-qrcode"></i></div></div><div class="tab"><i class="fa-solid fa-medal"></i>Awards</div><div class="tab active"><i class="fa-solid fa-people-group"></i>Unit</div></div><div class="home-ind"></div>
</div></body></html>
