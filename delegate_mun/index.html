<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegate - Game Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .screenshot-frame {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .screenshot-frame:hover {
            transform: translateY(-4px);
            box-shadow: 0 35px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08);
        }
        .screenshot-frame img {
            width: 100%;
            height: auto;
            display: block;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-5xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-sky-500 to-blue-900 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-earth-americas text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">Delegate</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Represent a country, debate AI delegates on a world crisis, and pass a resolution.</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Simulation</span>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Debate</span>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">AI Agents</span>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Education</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802825-image-1.png" alt="Delegate - ">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802061-image-1.png" alt="Delegate - Title Screen">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802359-image-1.png" alt="Delegate - Council Debate">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311801747-image-1.png" alt="Delegate - Crisis Campaign Map">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311801971-image-1.png" alt="Delegate - Emergency Crisis Update">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802673-image-1.png" alt="Delegate - Late-Night Negotiation">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802328-image-1.png" alt="Delegate - Delegate Skill Tree">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311804376-image-1.png" alt="Delegate - Resolution Drafting">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311801931-image-1.png" alt="Delegate - Caucus Alliance Web">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793311802616-image-1.png" alt="Delegate - Point of Information">
            </div>
        </div>
    </div>
</body>
</html>
