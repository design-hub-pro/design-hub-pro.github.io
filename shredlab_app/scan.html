<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShredLab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#0B0F16;--brand:#2DD4BF;--brand2:#3B82F6;--good:#4ADE80}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.cam{position:relative;width:100%;height:100%}
.cam img{width:100%;height:100%;object-fit:cover;filter:brightness(.92)}
.dim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:6}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.topbar{position:absolute;top:78px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;z-index:6}
.iconbtn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.chip{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:8px 14px;border-radius:20px;display:flex;align-items:center;gap:7px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.frame{position:absolute;top:190px;left:44px;right:44px;bottom:270px}
.cnr{position:absolute;width:34px;height:34px;border:3px solid var(--brand)}
.cnr.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:10px 0 0 0}
.cnr.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 10px 0 0}
.cnr.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 10px}
.cnr.br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 10px 0}
.scanline{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);top:52%;box-shadow:0 0 12px rgba(45,212,191,.8)}
.hint{position:absolute;left:0;right:0;bottom:-38px;text-align:center;font-size:12.5px;font-weight:650;color:#E7FBF7;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:22px 28px 46px;z-index:6;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 40%,rgba(0,0,0,.85))}
.tip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 14px;display:flex;gap:9px;align-items:center;margin-bottom:20px}
.tip i{color:var(--brand);font-size:13px}
.tip span{font-size:11.5px;font-weight:550;color:#DCE6F0}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.thumb{width:46px;height:46px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.thumb img{width:100%;height:100%;object-fit:cover}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.shutter i{color:#0B0F16;font-size:0}
.shutter .ring{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.lib{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
</style></head><body>
<div class="screen">
  <div class="cam"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788989796544-image-1.png" alt=""><div class="dim"></div></div>
  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="topbar">
    <a href="nutrition.html" class="iconbtn"><i class="fa-solid fa-xmark"></i></a>
    <div class="chip"><span class="dot"></span>AI FOOD SCAN</div>
    <div class="iconbtn"><i class="fa-solid fa-bolt"></i></div>
  </div>
  <div class="frame">
    <div class="cnr tl"></div><div class="cnr tr"></div><div class="cnr bl"></div><div class="cnr br"></div>
    <div class="scanline"></div>
    <div class="hint">Fit the whole plate in frame, then capture</div>
  </div>
  <div class="bottom">
    <div class="tip"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Estimates portion size from the plate &mdash; adjust after if it's off</span></div>
    <div class="ctrl">
      <div class="thumb"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788989369480-image-1.png"></div>
      <a href="scan-result.html" class="shutter"><div class="ring"></div></a>
      <div class="lib"><i class="fa-solid fa-image"></i></div>
    </div>
  </div>
</div>
</body></html>
