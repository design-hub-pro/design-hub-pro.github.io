<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShredLab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#0B0F16;--card:#141B26;--card2:#1B2431;--border:rgba(255,255,255,.09);--ink:#F3F6FA;--muted:#7E8CA0;--brand:#2DD4BF;--brand2:#3B82F6;--good:#4ADE80}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.bodyw{height:100%;overflow-y:auto;padding-bottom:40px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.meta{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.back{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row i.li{width:34px;color:var(--muted);font-size:15px;text-align:center}
.row b{font-size:13.5px;font-weight:650;flex:1}
.row span{font-size:12px;color:var(--muted);font-weight:550}
.statrow{display:flex;gap:9px;margin-top:16px}
.statrow div{flex:1;background:var(--card2);border-radius:14px;padding:12px 0;text-align:center}
.statrow b{font-size:16px;font-weight:800;display:block}
.statrow span{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
</style></head><body>
<div class="screen"><div class="bodyw">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px" style="margin:6px 0 4px;display:flex;align-items:center;justify-content:space-between">
  <span class="meta">Profile</span>
  <a href="home.html" class="back"><i class="fa-solid fa-xmark"></i></a>
</div>

<div class="px" style="display:flex;align-items:center;gap:15px;margin-top:8px">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788989369434-image-1.png" style="width:74px;height:74px;border-radius:20px;object-fit:cover">
  <div><div style="font-size:21px;font-weight:800;letter-spacing:-.5px">Marcus Reid</div><div style="font-size:12.5px;color:var(--muted);font-weight:550;margin-top:3px">16 &middot; JV Football &middot; Lineman</div></div>
</div>

<div class="px"><div class="statrow">
  <div><b>5'11"</b><span>Height</span></div>
  <div><b>174 lb</b><span>Weight</span></div>
  <div><b style="color:var(--brand)">Cut</b><span>Phase</span></div>
</div></div>

<div class="px" style="margin-top:24px">
  <div class="meta" style="margin-bottom:9px">Goal</div>
  <div class="card">
    <div class="row"><i class="fa-solid fa-weight-scale li"></i><b>Lose fat, keep strength</b><span>Editable</span></div>
    <div class="row"><i class="fa-solid fa-calendar li"></i><b>10-week cut phase</b><span>Wk 4 of 10</span></div>
    <div class="row"><i class="fa-solid fa-bullseye li"></i><b>Rate cap</b><span>0.7 lb/wk max</span></div>
  </div>
</div>

<div class="px" style="margin-top:20px">
  <div class="meta" style="margin-bottom:9px">Care team</div>
  <div class="card">
    <div class="row"><i class="fa-solid fa-user-shield li"></i><b>Share plan with parent</b><span>On</span></div>
    <div class="row"><i class="fa-solid fa-whistle li"></i><b>Sync with coach</b><span>Off</span></div>
    <div class="row"><i class="fa-solid fa-flask li"></i><a href="learn.html" style="color:inherit;text-decoration:none;flex:1"><b>Science library</b></a><i class="fa-solid fa-chevron-right" style="font-size:11px;color:var(--muted)"></i></div>
  </div>
</div>

<div class="px" style="margin-top:20px">
  <div class="meta" style="margin-bottom:9px">Settings</div>
  <div class="card">
    <div class="row"><i class="fa-solid fa-bell li"></i><b>Reminders</b><span>Meals &amp; water</span></div>
    <div class="row"><i class="fa-solid fa-ruler li"></i><b>Units</b><span>lb &middot; oz</span></div>
    <div class="row"><i class="fa-solid fa-right-from-bracket li" style="color:#F87171"></i><b style="color:#F87171">Sign out</b></div>
  </div>
</div>

</div></div>
</body></html>
