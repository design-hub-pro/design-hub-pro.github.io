<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body style="background:#0A1630">
<div class="screen">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167767234-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,22,48,.15) 0%,rgba(10,22,48,.35) 38%,rgba(10,22,48,.97) 76%)"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute left-7 right-7 top-[86px] flex items-center gap-2 text-white">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#3B82F6,#10B981)"><i class="fas fa-staff-snake text-[15px]"></i></div>
    <span class="display text-[20px] font-bold">Upstretch <span class="opacity-70">Med</span></span>
  </div>
  <div class="absolute left-7 right-7 bottom-10 text-white">
    <span class="inline-flex items-center gap-2 text-[12px] font-bold bg-white/15 backdrop-blur px-3 py-1.5 rounded-full"><span class="dot bg-[#34D399]"></span>Medical &amp; Bio track</span>
    <h1 class="display text-[42px] font-extrabold leading-[1.03] mt-4">Get cleared. Get placed. Get real patient hours.</h1>
    <p class="text-[16px] opacity-75 mt-4 leading-relaxed">Shots, CPR, HIPAA and age rules in one place, so the right hospital or lab says yes.</p>
    <div class="grid grid-cols-4 gap-2 mt-7">
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-hospital text-[#93C5FD]"></i><p class="text-[11px] font-semibold mt-2">Clinical</p></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-flask text-[#6EE7B7]"></i><p class="text-[11px] font-semibold mt-2">Research</p></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-user-doctor text-[#FDBA74]"></i><p class="text-[11px] font-semibold mt-2">Shadow</p></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-people-roof text-[#F9A8D4]"></i><p class="text-[11px] font-semibold mt-2">Public health</p></div>
    </div>
    <div class="btn mt-7 bg-white text-[#0A1630]">Build my med pathway <i class="fas fa-arrow-right"></i></div>
    <p class="text-center text-[13px] opacity-60 mt-4">Already on Upstretch? <span class="font-semibold opacity-100">Switch track</span></p>
  </div>
</div>
</body>
</html>
