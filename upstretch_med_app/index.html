<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upstretch Med</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#14211F}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2f2e,#0b0f0e);box-shadow:0 50px 80px -30px rgba(20,40,110,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F5F7FB}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8 50%,#10B981)"><i class="fa-solid fa-staff-snake text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:'Bricolage Grotesque',sans-serif">Upstretch Med</h1>
  <p class="mt-3 text-[19px] text-gray-500">Medical and bio volunteering for students: get cleared, get placed, log verified clinical hours.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-blue-50 text-blue-700">Pre-Med</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Clinical Hours</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Research</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Credentials</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pathway.html" scrolling="no" title="pathway"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="discover.html" scrolling="no" title="discover"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="program.html" scrolling="no" title="program"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="credentials.html" scrolling="no" title="credentials"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="training.html" scrolling="no" title="training"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="applications.html" scrolling="no" title="applications"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="research.html" scrolling="no" title="research"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="log.html" scrolling="no" title="log"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="cohort.html" scrolling="no" title="cohort"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="portfolio.html" scrolling="no" title="portfolio"></iframe></div></div>
</div></main>
</body></html>
