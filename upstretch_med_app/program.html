<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="absolute top-0 left-0 right-0 h-[330px]">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167074487-image-1.png" class="w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 35%)"></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute top-[66px] left-7 right-7 flex justify-between">
    <div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-chevron-left"></i></div>
    <div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-bookmark text-[#1D4ED8]"></i></div>
  </div>

  <div class="absolute left-0 right-0 bottom-0 top-[290px] bg-[#F5F7FB] rounded-t-[32px] px-7 pt-6 overflow-y-auto pb-[120px]">
    <div class="flex items-center gap-2"><img class="w-7 h-7 rounded-lg object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167766907-image-1.png"><span class="text-[13px] font-semibold text-[#4B5A56]">Valley Medical Center</span><i class="fas fa-circle-check text-[#1D4ED8] text-[13px]"></i></div>
    <h1 class="display text-[26px] font-bold leading-tight mt-2">Teen Volunteer Program</h1>
    <div class="flex gap-2 mt-3">
      <span class="text-[12px] font-bold bg-white px-3 py-1.5 rounded-full shadow-sm"><i class="fas fa-bed-pulse text-[#1D4ED8] mr-1"></i>Patient-facing</span>
      <span class="text-[12px] font-bold bg-white px-3 py-1.5 rounded-full shadow-sm"><i class="fas fa-calendar text-[#F97362] mr-1"></i>Dec 1</span>
    </div>

    <!-- requirement checklist -->
    <div class="card mt-4 !p-0 overflow-hidden">
      <div class="flex items-center justify-between px-4 pt-3.5 pb-2"><span class="label">Requirements</span><span class="text-[12px] font-bold text-[#10B981]">5 / 6</span></div>
      <div class="flex items-center gap-3 px-4 py-2.5"><i class="fas fa-cake-candles w-5 text-center text-[#8A9692]"></i><span class="text-[14px] font-semibold flex-1">Age 16+</span><i class="fas fa-circle-check text-[#10B981]"></i></div>
      <div class="flex items-center gap-3 px-4 py-2.5"><i class="fas fa-syringe w-5 text-center text-[#8A9692]"></i><span class="text-[14px] font-semibold flex-1">MMR, Hep B, flu shot</span><i class="fas fa-circle-check text-[#10B981]"></i></div>
      <div class="flex items-center gap-3 px-4 py-2.5 bg-[#FFFBEB]"><i class="fas fa-lungs w-5 text-center text-[#F59E0B]"></i><span class="text-[14px] font-bold flex-1">TB test (last 12 mo)</span><span class="text-[12px] font-bold text-[#B45309]">Find clinic</span></div>
      <div class="flex items-center gap-3 px-4 py-2.5"><i class="fas fa-user-shield w-5 text-center text-[#8A9692]"></i><span class="text-[14px] font-semibold flex-1">HIPAA training</span><i class="fas fa-circle-check text-[#10B981]"></i></div>
      <div class="flex items-center gap-3 px-4 py-2.5"><i class="fas fa-fingerprint w-5 text-center text-[#8A9692]"></i><span class="text-[14px] font-semibold flex-1">Background check</span><i class="fas fa-circle-check text-[#10B981]"></i></div>
      <div class="flex items-center gap-3 px-4 py-2.5 pb-3.5"><i class="fas fa-file-signature w-5 text-center text-[#8A9692]"></i><span class="text-[14px] font-semibold flex-1">Parent consent</span><i class="fas fa-circle-check text-[#10B981]"></i></div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="card !p-3 text-center"><p class="display text-[24px] font-extrabold leading-none">100</p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">hrs / year</p></div>
      <div class="card !p-3 text-center"><p class="display text-[24px] font-extrabold leading-none">4h</p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">Weekly shift</p></div>
      <div class="card !p-3 text-center"><p class="display text-[24px] font-extrabold leading-none text-[#F97362]">+2</p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">Stretch</p></div>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-8 pt-4 bg-gradient-to-t from-[#F5F7FB] via-[#F5F7FB] to-transparent">
    <div class="btn primary">Send application with 5 docs</div>
  </div>
</div>
</body>
</html>
