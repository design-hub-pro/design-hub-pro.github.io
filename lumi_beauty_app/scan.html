<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi — Skin Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0E0A0C;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
@keyframes scanmove{0%{top:8%}100%{top:88%}}
.scanline{animation:scanmove 2.4s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.dot{animation:pulse 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782427602689-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,10,12,.55),rgba(14,10,12,.2) 35%,rgba(14,10,12,.85))"></div>

  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top bar -->
  <div class="absolute top-[70px] left-0 right-0 px-7 flex items-center justify-between z-20">
    <a href="survey.html" class="w-9 h-9 rounded-full bg-black/35 backdrop-blur flex items-center justify-center border border-white/15"><i class="fas fa-xmark text-white text-[15px]"></i></a>
    <div class="inline-flex items-center gap-2 bg-black/35 backdrop-blur rounded-full px-3.5 py-1.5 border border-white/15">
      <span class="w-1.5 h-1.5 rounded-full bg-pink-400 dot"></span>
      <span class="text-white text-[11px] font-semibold">AI SKIN ANALYSIS</span>
    </div>
    <button class="w-9 h-9 rounded-full bg-black/35 backdrop-blur flex items-center justify-center border border-white/15"><i class="fas fa-bolt text-white text-[14px]"></i></button>
  </div>

  <!-- Face frame -->
  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10" style="width:260px;height:330px">
    <div class="relative w-full h-full rounded-[130px/160px] border-2 border-white/50 overflow-hidden">
      <div class="scanline absolute left-0 right-0 h-[3px]" style="background:linear-gradient(90deg,transparent,#F472B6,transparent);box-shadow:0 0 16px #F472B6"></div>
    </div>
    <!-- corner ticks -->
    <span class="absolute -top-1 left-1/2 -translate-x-1/2 text-pink-300 text-[10px] font-bold tracking-widest">ALIGN FACE</span>
    <!-- detection points -->
    <span class="absolute top-[30%] left-[20%] w-2 h-2 rounded-full bg-pink-400 dot"></span>
    <span class="absolute top-[44%] right-[22%] w-2 h-2 rounded-full bg-pink-400 dot"></span>
    <span class="absolute top-[68%] left-[40%] w-2 h-2 rounded-full bg-pink-400 dot"></span>
  </div>

  <!-- Live readouts -->
  <div class="absolute left-7 top-[40%] z-20 space-y-2">
    <div class="bg-black/40 backdrop-blur rounded-xl px-3 py-1.5 border border-white/10"><p class="text-[9px] text-white/50 font-semibold">UNDERTONE</p><p class="text-[13px] font-bold text-pink-200">Warm</p></div>
    <div class="bg-black/40 backdrop-blur rounded-xl px-3 py-1.5 border border-white/10"><p class="text-[9px] text-white/50 font-semibold">CLARITY</p><p class="text-[13px] font-bold text-emerald-200">Good</p></div>
  </div>

  <!-- Bottom -->
  <div class="absolute left-0 right-0 bottom-0 px-7 pb-10 z-20">
    <div class="bg-white/10 backdrop-blur rounded-2xl border border-white/15 p-3.5 mb-7 flex items-center gap-3">
      <i class="fas fa-circle-info text-pink-200"></i>
      <p class="text-[12.5px] text-white/85 leading-snug">Find soft, even light. We analyze tone, undertone &amp; texture — never stored without your okay.</p>
    </div>
    <div class="flex items-center justify-center gap-10">
      <button class="flex flex-col items-center gap-1.5"><div class="w-12 h-12 rounded-2xl bg-white/12 backdrop-blur flex items-center justify-center border border-white/15"><i class="fas fa-images text-white"></i></div><span class="text-[10px] text-white/60 font-medium">Upload</span></button>
      <a href="analysis.html" class="w-[78px] h-[78px] rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#F08CAE,#C2548A);box-shadow:0 0 0 5px rgba(255,255,255,.18),0 14px 34px rgba(194,84,138,.6)">
        <i class="fas fa-camera text-white text-2xl"></i>
      </a>
      <button class="flex flex-col items-center gap-1.5"><div class="w-12 h-12 rounded-2xl bg-white/12 backdrop-blur flex items-center justify-center border border-white/15"><i class="fas fa-rotate text-white"></i></div><span class="text-[10px] text-white/60 font-medium">Flip</span></button>
    </div>
  </div>
</div>
</body>
</html>
