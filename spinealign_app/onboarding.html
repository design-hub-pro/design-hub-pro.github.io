<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpineAlign AI — Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;overflow:hidden;scrollbar-width:none;font-family:'Inter',-apple-system,sans-serif;background:#0F172A;}

/* Status Bar */
.status-bar{height:59px;padding:16px 28px 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10;}
.status-time{font-size:16px;font-weight:700;color:#fff;}
.status-icons{display:flex;align-items:center;gap:6px;}
.status-icons i{font-size:13px;color:#fff;}
.dynamic-island{width:120px;height:36px;background:#000;border-radius:20px;position:absolute;top:12px;left:50%;transform:translateX(-50%);}

.screen{width:100%;height:100%;position:relative;overflow:hidden;}

/* Hero background */
.onboard-bg{position:absolute;inset:0;z-index:0;}
.onboard-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.35);}
.onboard-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0.3) 0%,rgba(15,23,42,0.6) 40%,rgba(15,23,42,0.95) 70%,#0F172A 100%);}

.content{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 50px;}

/* Logo & branding */
.logo-area{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.logo-icon{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#14B8A6,#0EA5E9);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(20,184,166,0.4);}
.logo-icon i{font-size:24px;color:#fff;}
.logo-text{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.logo-text span{color:#14B8A6;}

.tagline{font-size:36px;font-weight:900;color:#fff;line-height:1.1;letter-spacing:-1.5px;margin-bottom:14px;}
.tagline span{background:linear-gradient(135deg,#14B8A6,#0EA5E9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.subtitle{font-size:15px;color:rgba(255,255,255,0.55);line-height:1.6;margin-bottom:32px;max-width:340px;}

/* Feature pills */
.features{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px;}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);padding:8px 14px;border-radius:30px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.8);}
.pill i{font-size:11px;color:#14B8A6;}

/* CTA */
.cta-btn{width:100%;padding:18px;border-radius:18px;border:none;background:linear-gradient(135deg,#14B8A6,#0EA5E9);color:#fff;font-size:17px;font-weight:700;letter-spacing:-0.3px;cursor:pointer;margin-bottom:14px;box-shadow:0 8px 30px rgba(20,184,166,0.35);}
.secondary-text{text-align:center;font-size:13px;color:rgba(255,255,255,0.35);}
.secondary-text a{color:#14B8A6;text-decoration:none;font-weight:600;}

/* Trust badges */
.trust{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px;}
.trust-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.4);}
.trust-item i{font-size:10px;color:#14B8A6;}
</style>
</head>
<body>
<div class="screen">
  <div class="onboard-bg">
    <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=800&q=80" alt="">
    <div class="onboard-gradient"></div>
  </div>

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-bone"></i></div>
      <div class="logo-text">Spine<span>Align</span> AI</div>
    </div>

    <div class="tagline">Your AI <span>Rehab</span><br>Coach</div>

    <p class="subtitle">Pose-powered rehabilitation for scoliosis, sports injuries & orthopedic recovery.</p>

    <div class="features">
      <div class="pill"><i class="fas fa-camera"></i>AI Pose Scan</div>
      <div class="pill"><i class="fas fa-chart-line"></i>Progress Track</div>
      <div class="pill"><i class="fas fa-dumbbell"></i>Guided Rehab</div>
      <div class="pill"><i class="fas fa-user-md"></i>Expert Connect</div>
    </div>

    <button class="cta-btn">Get Started <i class="fas fa-arrow-right" style="margin-left:8px;"></i></button>
    <p class="secondary-text">Already have an account? <a href="#">Sign In</a></p>

    <div class="trust">
      <div class="trust-item"><i class="fas fa-shield-halved"></i>HIPAA Compliant</div>
      <div class="trust-item"><i class="fas fa-lock"></i>End-to-End Encrypted</div>
      <div class="trust-item"><i class="fas fa-star"></i>4.9 Rating</div>
    </div>
  </div>
</div>
</body>
</html>
