<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"><rect width="1000" height="400" fill="#FDFCFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202B"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B7A"/></marker></defs><line x1="40" y1="330" x2="960" y2="330" stroke="#16202B" stroke-width="2"/><text x="40" y="352" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7A" text-anchor="start" font-weight="400">car roof, parked, same bay every session</text><rect x="120" y="250" width="150" height="62" rx="7" fill="#fff" stroke="#16202B" stroke-width="1.4"/><text x="195.0" y="277.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16202B" text-anchor="middle">BirdGuard</text><text x="195.0" y="294.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7A" text-anchor="middle">device under test</text><line x1="195" y1="250" x2="195" y2="222" stroke="#16202B" stroke-width="1.4"/><circle cx="195" cy="214" r="9" fill="none" stroke="#16202B" stroke-width="1.4"/><text x="195" y="196" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A6B7A" text-anchor="middle" font-weight="400">camera</text><path d="M195 214 L520 96 L520 300 Z" fill="#12494F" fill-opacity="0.09" stroke="#12494F" stroke-width="1" stroke-dasharray="5 4"/><text x="330" y="210" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#12494F" text-anchor="start" font-weight="600">65 deg, useful to 4 m</text><rect x="700" y="250" width="190" height="62" rx="7" fill="#fff" stroke="#B8601C" stroke-width="1.4"/><text x="795.0" y="277.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#16202B" text-anchor="middle">Reference camera</text><text x="795.0" y="294.0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7A" text-anchor="middle">1080p, 60 fps</text><line x1="795" y1="250" x2="795" y2="222" stroke="#B8601C" stroke-width="1.4"/><circle cx="795" cy="214" r="9" fill="none" stroke="#B8601C" stroke-width="1.4"/><path d="M795 214 L470 96 L470 300 Z" fill="#B8601C" fill-opacity="0.07" stroke="#B8601C" stroke-width="1" stroke-dasharray="5 4"/><text x="795" y="340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A6B7A" text-anchor="middle" font-weight="400">tripod, 2 m to the side</text><line x1="795" y1="312" x2="770" y2="330" stroke="#B8601C" stroke-width="1.4"/><line x1="795" y1="312" x2="820" y2="330" stroke="#B8601C" stroke-width="1.4"/><rect x="470" y="96" width="50" height="204" fill="#16202B" fill-opacity="0.06"/><rect x="432" y="60" width="130" height="18" fill="#FDFCFA"/><text x="495" y="74" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#16202B" text-anchor="middle" font-weight="700">shared view</text><ellipse cx="495" cy="322" rx="70" ry="10" fill="none" stroke="#16202B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="495" y="366" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A6B7A" text-anchor="middle" font-weight="400">scored landing zone</text><text x="40" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400">Both cameras see the same landing zone. The reference clip is hand-labelled,</text><text x="40" y="52" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400">then compared frame by frame against the device log.</text></svg>