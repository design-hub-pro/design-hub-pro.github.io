<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#fff;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#fff;position:absolute;top:0;left:0;right:0;z-index:10}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.hero{height:52%;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0) 30%,rgba(255,255,255,0) 60%,#fff 100%)}
.content{position:absolute;bottom:0;left:0;right:0;padding:0 28px 40px;background:#fff}
.icon-chip{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,#2DD4BF,#0D9488);box-shadow:0 10px 24px rgba(13,148,136,0.35)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="hero">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789830837525-image-1.png">
    <div class="hero-fade"></div>
  </div>
  <div class="content">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#2DD4BF,#0D9488)"><i class="fas fa-shield-heart text-sm"></i></div>
      <span class="text-sm font-black text-gray-900 tracking-tight">DoseGuard</span>
    </div>
    <h1 class="text-3xl font-black text-gray-900 leading-tight">Your medication,<br>watched over.</h1>
    <p class="text-sm text-gray-500 mt-2 leading-relaxed">Pairs with your DoseGuard dispenser in under 2 minutes.</p>

    <div class="flex gap-3 mt-5">
      <div class="flex-1 text-center">
        <div class="icon-chip mx-auto" style="background:linear-gradient(135deg,#FCA5A5,#DC2626)"><i class="fas fa-triangle-exclamation"></i></div>
        <p class="text-[10px] font-semibold text-gray-600 mt-1.5 leading-tight">Missed-dose<br>alerts</p>
      </div>
      <div class="flex-1 text-center">
        <div class="icon-chip mx-auto" style="background:linear-gradient(135deg,#93C5FD,#2563EB)"><i class="fas fa-shield-check"></i></div>
        <p class="text-[10px] font-semibold text-gray-600 mt-1.5 leading-tight">Wrong pill/time<br>lockout</p>
      </div>
      <div class="flex-1 text-center">
        <div class="icon-chip mx-auto" style="background:linear-gradient(135deg,#FCD34D,#D97706)"><i class="fas fa-box-open"></i></div>
        <p class="text-[10px] font-semibold text-gray-600 mt-1.5 leading-tight">Smart refill<br>forecast</p>
      </div>
    </div>

    <button class="btn-primary w-full text-white font-bold text-sm py-4 rounded-2xl mt-6">Pair My Dispenser</button>
    <p class="text-center text-xs text-gray-400 font-semibold mt-3">Set up later</p>
  </div>
</div>
</body>
</html>
