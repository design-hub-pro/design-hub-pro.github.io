<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Medication</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F3F8F7;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#0F172A}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 92px);overflow-y:auto;padding:0 28px 20px}
.footer-bar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #E6F0EE;padding:14px 28px}
.field-label{font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px}
.field{background:white;border-radius:16px;padding:13px 14px;font-size:14px;font-weight:600;color:#0F172A;box-shadow:0 2px 10px rgba(15,118,110,0.05)}
.slot-btn{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:white;color:#94A3B8;box-shadow:0 2px 10px rgba(15,118,110,0.05)}
.slot-btn.selected{background:linear-gradient(135deg,#2DD4BF,#0D9488);color:white}
.slot-btn.taken{background:#F1F5F9;color:#CBD5E1}
.day-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:white;color:#94A3B8;box-shadow:0 2px 10px rgba(15,118,110,0.05)}
.day-btn.selected{background:#0D9488;color:white}
.toggle{width:44px;height:26px;border-radius:13px;position:relative}
.toggle.on{background:#0D9488}
.toggle-dot{width:20px;height:20px;border-radius:50%;background:white;position:absolute;top:3px;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-4">
      <i class="fas fa-arrow-left text-gray-700"></i>
      <h1 class="text-base font-bold text-gray-900">Add Medication</h1>
      <span class="text-xs w-6"></span>
    </div>

    <div class="flex flex-col items-center mb-5">
      <div class="w-20 h-20 rounded-2xl border-2 border-dashed border-teal-300 flex flex-col items-center justify-center bg-teal-50/50">
        <i class="fas fa-camera text-teal-500 text-lg"></i>
        <span class="text-[9px] font-bold text-teal-600 mt-1">Scan bottle</span>
      </div>
    </div>

    <p class="field-label">Medication name</p>
    <div class="field mb-4">Metformin</div>

    <p class="field-label">Dosage</p>
    <div class="field mb-4">500 mg</div>

    <p class="field-label">Assign to compartment</p>
    <div class="grid grid-cols-6 gap-2 mb-4">
      <div class="slot-btn taken">1</div>
      <div class="slot-btn taken">2</div>
      <div class="slot-btn selected">3</div>
      <div class="slot-btn taken">4</div>
      <div class="slot-btn taken">5</div>
      <div class="slot-btn">6</div>
    </div>

    <p class="field-label">Schedule</p>
    <div class="flex gap-2 mb-4">
      <div class="field flex-1 flex items-center justify-between">
        <span>8:00 AM</span><i class="fas fa-xmark text-gray-300 text-xs"></i>
      </div>
      <div class="field flex-1 flex items-center justify-between">
        <span>8:00 PM</span><i class="fas fa-xmark text-gray-300 text-xs"></i>
      </div>
    </div>
    <div class="flex items-center gap-2 text-teal-600 text-xs font-bold mb-5">
      <i class="fas fa-circle-plus"></i> Add time
    </div>

    <p class="field-label">Repeats</p>
    <div class="flex gap-1.5 mb-5">
      <div class="day-btn selected">M</div>
      <div class="day-btn selected">T</div>
      <div class="day-btn selected">W</div>
      <div class="day-btn selected">T</div>
      <div class="day-btn selected">F</div>
      <div class="day-btn selected">S</div>
      <div class="day-btn selected">S</div>
    </div>

    <div class="flex items-center justify-between py-3 border-t border-gray-200/70">
      <div>
        <p class="text-sm font-bold text-gray-900">Wrong-time lock</p>
        <p class="text-[11px] text-gray-500">Alert if opened outside window</p>
      </div>
      <div class="toggle on"><div class="toggle-dot" style="right:3px"></div></div>
    </div>
    <div class="flex items-center justify-between py-3 border-t border-gray-200/70">
      <div>
        <p class="text-sm font-bold text-gray-900">Low-stock alerts</p>
        <p class="text-[11px] text-gray-500">Notify before it runs out</p>
      </div>
      <div class="toggle on"><div class="toggle-dot" style="right:3px"></div></div>
    </div>
  </div>
  <div class="footer-bar">
    <button class="w-full text-white font-bold text-sm py-3.5 rounded-2xl" style="background:linear-gradient(135deg,#2DD4BF,#0D9488);box-shadow:0 10px 24px rgba(13,148,136,0.3)">Save Medication</button>
  </div>
</div>
</body>
</html>
