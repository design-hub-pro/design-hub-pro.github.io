<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaneGuard - Live Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .lane-line {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .speed-ring {
            background: conic-gradient(from 180deg, #22c55e 0deg, #22c55e 240deg, #374151 240deg, #374151 360deg);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen overflow-x-hidden">
    <!-- Status Bar -->
    <div class="px-5 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-medium">9:41</span>
        <div class="w-28 h-7 bg-black rounded-full"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="px-5 pt-2 pb-3">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold">Live Monitoring</h1>
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-green-400 text-sm font-medium">LIVE</span>
            </div>
        </div>
    </div>

    <!-- Camera View Simulation -->
    <div class="px-5 py-2">
        <div class="relative rounded-2xl overflow-hidden h-48 bg-gradient-to-b from-gray-700 to-gray-900">
            <!-- Road simulation -->
            <div class="absolute inset-0 flex items-end justify-center pb-4">
                <!-- Road surface -->
                <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-gray-600 to-gray-700"></div>
                <!-- Lane lines -->
                <div class="lane-line absolute bottom-4 left-1/4 w-1 h-20 bg-white transform -skew-x-6"></div>
                <div class="lane-line absolute bottom-4 right-1/4 w-1 h-20 bg-white transform skew-x-6"></div>
                <!-- Center dashed line -->
                <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 space-y-2">
                    <div class="w-1 h-4 bg-yellow-400"></div>
                    <div class="w-1 h-4 bg-yellow-400"></div>
                    <div class="w-1 h-4 bg-yellow-400"></div>
                </div>
                <!-- Detection overlay -->
                <div class="absolute top-3 right-3 bg-green-500/20 border border-green-500 rounded-lg px-2 py-1">
                    <span class="text-green-400 text-xs font-medium">Lane Detected</span>
                </div>
            </div>
            <!-- Camera frame -->
            <div class="absolute top-3 left-3 flex items-center space-x-2">
                <i class="fas fa-video text-white/60 text-sm"></i>
                <span class="text-white/60 text-xs">Front Camera</span>
            </div>
        </div>
    </div>

    <!-- Speed & Lane Status -->
    <div class="px-5 py-3">
        <div class="grid grid-cols-2 gap-4">
            <!-- Speed Gauge -->
            <div class="bg-gray-900 rounded-2xl p-4 flex flex-col items-center">
                <div class="relative w-24 h-24 mb-2">
                    <div class="speed-ring absolute inset-0 rounded-full"></div>
                    <div class="absolute inset-2 bg-gray-900 rounded-full flex items-center justify-center">
                        <div class="text-center">
                            <span class="text-3xl font-bold text-white">67</span>
                            <p class="text-xs text-gray-400">km/h</p>
                        </div>
                    </div>
                </div>
                <p class="text-sm text-gray-400">Current Speed</p>
                <div class="flex items-center space-x-1 mt-1">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-xs text-green-400">Within Limit</span>
                </div>
            </div>

            <!-- Lane Position -->
            <div class="bg-gray-900 rounded-2xl p-4">
                <div class="flex flex-col items-center">
                    <div class="relative w-24 h-20 mb-2">
                        <!-- Lane visualization -->
                        <div class="absolute left-2 top-0 bottom-0 w-0.5 bg-white/30"></div>
                        <div class="absolute right-2 top-0 bottom-0 w-0.5 bg-white/30"></div>
                        <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
                            <div class="w-8 h-14 bg-blue-500 rounded-md flex items-center justify-center">
                                <i class="fas fa-car text-white text-xs"></i>
                            </div>
                        </div>
                        <!-- Center indicator -->
                        <div class="absolute left-1/2 top-0 bottom-0 w-px bg-green-500 transform -translate-x-1/2"></div>
                    </div>
                    <p class="text-sm text-gray-400">Lane Position</p>
                    <div class="flex items-center space-x-1 mt-1">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-xs text-green-400">Centered</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Real-time Stats -->
    <div class="px-5 py-2">
        <h2 class="text-sm font-semibold text-gray-400 mb-3">REAL-TIME METRICS</h2>
        <div class="space-y-3">
            <div class="bg-gray-900 rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-eye text-blue-400"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium">Driver Attention</p>
                        <p class="text-xs text-gray-500">Eyes on road</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-green-400 font-semibold">98%</span>
                    <i class="fas fa-check-circle text-green-400"></i>
                </div>
            </div>

            <div class="bg-gray-900 rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-purple-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-ruler text-purple-400"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium">Following Distance</p>
                        <p class="text-xs text-gray-500">Safe distance</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-green-400 font-semibold">3.2s</span>
                    <i class="fas fa-check-circle text-green-400"></i>
                </div>
            </div>

            <div class="bg-gray-900 rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-orange-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sun text-orange-400"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium">Visibility</p>
                        <p class="text-xs text-gray-500">Weather clear</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-green-400 font-semibold">Good</span>
                    <i class="fas fa-check-circle text-green-400"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-xl border-t border-gray-800 px-6 py-2 pb-7">
        <div class="flex justify-between items-center">
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-home text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center">
                    <i class="fas fa-video text-white"></i>
                </div>
                <span class="text-xs text-blue-400 mt-1">Monitor</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-clock text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">History</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-cog text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">Settings</span>
            </div>
        </div>
    </div>

    <!-- Home Indicator -->
    <div class="fixed bottom-1 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-gray-600 rounded-full"></div>
</body>
</html>
