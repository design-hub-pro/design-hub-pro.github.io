<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaneGuard - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .diagram-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .diagram-title h1 {
            font-size: 24px;
            color: #1a365d;
            margin-bottom: 5px;
        }
        .diagram-title p {
            color: #64748b;
            font-size: 14px;
        }
        svg {
            width: 100%;
            height: 750px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <div class="diagram-title">
            <h1>LaneGuard System - Use Case Diagram</h1>
            <p>LaneGuard系统 - 用例图</p>
        </div>
        <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
                </filter>
                <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- System Boundary -->
            <rect x="280" y="30" width="640" height="640" rx="20" fill="url(#systemGrad)" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5" filter="url(#shadow)"/>
            <text x="600" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">LaneGuard Smart Driving System</text>
            <text x="600" y="85" text-anchor="middle" font-size="12" fill="#3b82f6">智能驾驶安全系统</text>

            <!-- Actor: Driver (Left) -->
            <g transform="translate(100, 200)">
                <circle cx="40" cy="25" r="25" fill="#10b981" stroke="#059669" stroke-width="3" filter="url(#softShadow)"/>
                <line x1="40" y1="50" x2="40" y2="100" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="10" y2="85" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="70" y2="85" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="15" y2="140" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="65" y2="140" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <text x="40" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#064e3b">Driver</text>
                <text x="40" y="180" text-anchor="middle" font-size="11" fill="#059669">驾驶员</text>
            </g>

            <!-- Actor: Admin/Fleet Manager (Right) -->
            <g transform="translate(1020, 200)">
                <circle cx="40" cy="25" r="25" fill="#8b5cf6" stroke="#7c3aed" stroke-width="3" filter="url(#softShadow)"/>
                <line x1="40" y1="50" x2="40" y2="100" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="10" y2="85" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="70" y2="85" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="15" y2="140" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="65" y2="140" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <text x="40" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Fleet Manager</text>
                <text x="40" y="180" text-anchor="middle" font-size="11" fill="#7c3aed">车队管理员</text>
            </g>

            <!-- Actor: Emergency Services (Bottom Right) -->
            <g transform="translate(1020, 450)">
                <circle cx="40" cy="25" r="25" fill="#ef4444" stroke="#dc2626" stroke-width="3" filter="url(#softShadow)"/>
                <line x1="40" y1="50" x2="40" y2="100" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="10" y2="85" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="60" x2="70" y2="85" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="15" y2="140" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="100" x2="65" y2="140" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <text x="40" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Emergency</text>
                <text x="40" y="180" text-anchor="middle" font-size="11" fill="#dc2626">紧急服务</text>
            </g>

            <!-- Use Cases -->
            <!-- UC1: Real-time Lane Detection -->
            <ellipse cx="450" cy="130" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#0ea5e9" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Real-time Lane Detection</text>
            <text x="450" y="142" text-anchor="middle" font-size="10" fill="#0369a1">实时车道检测</text>

            <!-- UC2: Lane Departure Warning -->
            <ellipse cx="750" cy="130" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="750" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Lane Departure Warning</text>
            <text x="750" y="142" text-anchor="middle" font-size="10" fill="#b45309">车道偏离预警</text>

            <!-- UC3: Driver Fatigue Monitoring -->
            <ellipse cx="450" cy="230" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="450" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">Driver Fatigue Monitoring</text>
            <text x="450" y="242" text-anchor="middle" font-size="10" fill="#047857">驾驶员疲劳监测</text>

            <!-- UC4: Speed & Distance Alert -->
            <ellipse cx="750" cy="230" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#8b5cf6" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="750" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Speed & Distance Alert</text>
            <text x="750" y="242" text-anchor="middle" font-size="10" fill="#6d28d9">速度距离警报</text>

            <!-- UC5: View Trip History -->
            <ellipse cx="450" cy="330" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#06b6d4" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="450" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#164e63">View Trip History</text>
            <text x="450" y="342" text-anchor="middle" font-size="10" fill="#0891b2">查看行程历史</text>

            <!-- UC6: Driving Score Analytics -->
            <ellipse cx="750" cy="330" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#ec4899" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="750" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Driving Score Analytics</text>
            <text x="750" y="342" text-anchor="middle" font-size="10" fill="#be185d">驾驶评分分析</text>

            <!-- UC7: Device Configuration -->
            <ellipse cx="450" cy="430" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#64748b" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="450" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Device Configuration</text>
            <text x="450" y="442" text-anchor="middle" font-size="10" fill="#475569">设备配置</text>

            <!-- UC8: Emergency SOS -->
            <ellipse cx="750" cy="430" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#ef4444" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="750" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Emergency SOS Alert</text>
            <text x="750" y="442" text-anchor="middle" font-size="10" fill="#dc2626">紧急SOS警报</text>

            <!-- UC9: Fleet Monitoring -->
            <ellipse cx="750" cy="530" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#8b5cf6" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="750" y="525" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Fleet Monitoring</text>
            <text x="750" y="542" text-anchor="middle" font-size="10" fill="#6d28d9">车队监控</text>

            <!-- UC10: Cloud Data Sync -->
            <ellipse cx="450" cy="530" rx="130" ry="40" fill="url(#useCaseGrad)" stroke="#0ea5e9" stroke-width="2.5" filter="url(#softShadow)"/>
            <text x="450" y="525" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Cloud Data Sync</text>
            <text x="450" y="542" text-anchor="middle" font-size="10" fill="#0369a1">云端数据同步</text>

            <!-- Connection Lines - Driver -->
            <line x1="180" y1="280" x2="320" y2="140" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="300" x2="320" y2="230" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="320" x2="320" y2="330" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="340" x2="320" y2="430" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="350" x2="320" y2="530" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="300" x2="620" y2="140" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="180" y1="310" x2="620" y2="230" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="180" y1="330" x2="620" y2="330" stroke="#10b981" stroke-width="2"/>
            <line x1="180" y1="340" x2="620" y2="430" stroke="#10b981" stroke-width="2"/>

            <!-- Connection Lines - Fleet Manager -->
            <line x1="1020" y1="280" x2="880" y2="330" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="1020" y1="290" x2="880" y2="430" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="1020" y1="300" x2="880" y2="530" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="1020" y1="270" x2="880" y2="230" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>

            <!-- Connection Lines - Emergency -->
            <line x1="1020" y1="480" x2="880" y2="440" stroke="#ef4444" stroke-width="2"/>

            <!-- Include/Extend relationships -->
            <line x1="620" y1="130" x2="660" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
            <text x="600" y="115" text-anchor="middle" font-size="9" fill="#64748b">«extends»</text>

            <line x1="580" y1="230" x2="620" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
            <text x="600" y="215" text-anchor="middle" font-size="9" fill="#64748b">«includes»</text>

            <line x1="580" y1="430" x2="620" y2="430" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
            <text x="600" y="415" text-anchor="middle" font-size="9" fill="#64748b">«extends»</text>

            <!-- Legend -->
            <g transform="translate(300, 600)">
                <rect x="0" y="0" width="600" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#softShadow)"/>
                <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Legend / 图例</text>

                <!-- Actor -->
                <circle cx="50" cy="45" r="10" fill="#10b981" stroke="#059669" stroke-width="2"/>
                <text x="70" y="50" font-size="11" fill="#374151">Actor 参与者</text>

                <!-- Use Case -->
                <ellipse cx="180" cy="45" rx="30" ry="12" fill="url(#useCaseGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
                <text x="220" y="50" font-size="11" fill="#374151">Use Case 用例</text>

                <!-- Association -->
                <line x1="320" y1="45" x2="360" y2="45" stroke="#10b981" stroke-width="2"/>
                <text x="370" y="50" font-size="11" fill="#374151">Association 关联</text>

                <!-- Include/Extend -->
                <line x1="470" y1="45" x2="510" y2="45" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="520" y="50" font-size="11" fill="#374151">Include/Extend 包含/扩展</text>
            </g>
        </svg>
    </div>
</body>
</html>
