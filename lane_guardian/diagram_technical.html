<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaneGuard - Technical System Architecture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            background: white;
            border: 2px solid #000;
            padding: 30px;
        }
        .diagram-title {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }
        .diagram-title h1 {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }
        svg {
            width: 100%;
            height: 900px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <div class="diagram-title">
            <h1>FIG. 1 - LANEGUARD SMART DEVICE SYSTEM ARCHITECTURE</h1>
        </div>
        <svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
            <!-- Patent-style black and white diagram -->
            <defs>
                <pattern id="hatch" patternUnits="userSpaceOnUse" width="4" height="4">
                    <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#666" stroke-width="0.5"/>
                </pattern>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="arrowhead-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#000"/>
                </marker>
            </defs>

            <!-- Main Device Housing (100) -->
            <rect x="350" y="50" width="500" height="350" fill="none" stroke="#000" stroke-width="3"/>
            <text x="600" y="35" text-anchor="middle" font-family="Times New Roman" font-size="14" font-weight="bold">LANEGUARD SMART DEVICE (100)</text>

            <!-- Camera Module (110) -->
            <rect x="380" y="80" width="140" height="90" fill="url(#hatch)" stroke="#000" stroke-width="2"/>
            <circle cx="450" cy="125" r="30" fill="white" stroke="#000" stroke-width="2"/>
            <circle cx="450" cy="125" r="20" fill="none" stroke="#000" stroke-width="1.5"/>
            <circle cx="450" cy="125" r="8" fill="#000"/>
            <text x="450" y="185" text-anchor="middle" font-family="Times New Roman" font-size="11">CAMERA MODULE</text>
            <text x="450" y="198" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">(110)</text>
            <text x="450" y="211" text-anchor="middle" font-family="Times New Roman" font-size="9">4K HDR 120° FOV</text>

            <!-- IR Sensor Array (115) -->
            <rect x="540" y="80" width="100" height="60" fill="none" stroke="#000" stroke-width="2"/>
            <line x1="555" y1="95" x2="555" y2="125" stroke="#000" stroke-width="1"/>
            <line x1="575" y1="95" x2="575" y2="125" stroke="#000" stroke-width="1"/>
            <line x1="595" y1="95" x2="595" y2="125" stroke="#000" stroke-width="1"/>
            <line x1="615" y1="95" x2="615" y2="125" stroke="#000" stroke-width="1"/>
            <text x="590" y="155" text-anchor="middle" font-family="Times New Roman" font-size="10">IR SENSOR ARRAY (115)</text>

            <!-- Neural Processing Unit (120) -->
            <rect x="660" y="80" width="160" height="100" fill="none" stroke="#000" stroke-width="2"/>
            <rect x="680" y="100" width="120" height="60" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="3,2"/>
            <text x="740" y="125" text-anchor="middle" font-family="Times New Roman" font-size="10">NPU CORE</text>
            <text x="740" y="140" text-anchor="middle" font-family="Times New Roman" font-size="9">8 TOPS</text>
            <text x="740" y="195" text-anchor="middle" font-family="Times New Roman" font-size="11">NEURAL PROCESSING</text>
            <text x="740" y="208" text-anchor="middle" font-family="Times New Roman" font-size="11">UNIT (120)</text>

            <!-- Main Processor (130) -->
            <rect x="380" y="230" width="180" height="80" fill="none" stroke="#000" stroke-width="2"/>
            <rect x="400" y="245" width="60" height="40" fill="none" stroke="#000" stroke-width="1"/>
            <text x="430" y="270" text-anchor="middle" font-family="Times New Roman" font-size="9">ARM</text>
            <text x="430" y="282" text-anchor="middle" font-family="Times New Roman" font-size="8">A78</text>
            <rect x="480" y="245" width="60" height="40" fill="none" stroke="#000" stroke-width="1"/>
            <text x="510" y="270" text-anchor="middle" font-family="Times New Roman" font-size="9">GPU</text>
            <text x="510" y="282" text-anchor="middle" font-family="Times New Roman" font-size="8">MALI</text>
            <text x="470" y="325" text-anchor="middle" font-family="Times New Roman" font-size="11">MAIN PROCESSOR (130)</text>

            <!-- Memory & Storage (140) -->
            <rect x="580" y="230" width="120" height="80" fill="none" stroke="#000" stroke-width="2"/>
            <rect x="595" y="245" width="40" height="25" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
            <text x="615" y="262" text-anchor="middle" font-family="Times New Roman" font-size="7">RAM</text>
            <rect x="645" y="245" width="40" height="25" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
            <text x="665" y="262" text-anchor="middle" font-family="Times New Roman" font-size="7">eMMC</text>
            <text x="640" y="295" text-anchor="middle" font-family="Times New Roman" font-size="9">4GB + 32GB</text>
            <text x="640" y="325" text-anchor="middle" font-family="Times New Roman" font-size="11">MEMORY (140)</text>

            <!-- Communication Module (150) -->
            <rect x="720" y="230" width="100" height="80" fill="none" stroke="#000" stroke-width="2"/>
            <path d="M745,250 L770,250 L770,260 L745,260 Z" fill="none" stroke="#000" stroke-width="1"/>
            <path d="M755,240 L760,250" stroke="#000" stroke-width="1"/>
            <path d="M760,240 L765,250" stroke="#000" stroke-width="1"/>
            <text x="770" y="280" text-anchor="middle" font-family="Times New Roman" font-size="8">BT 5.2</text>
            <text x="770" y="292" text-anchor="middle" font-family="Times New Roman" font-size="8">WiFi 6</text>
            <text x="770" y="304" text-anchor="middle" font-family="Times New Roman" font-size="8">4G LTE</text>
            <text x="770" y="325" text-anchor="middle" font-family="Times New Roman" font-size="10">COMM (150)</text>

            <!-- Power Management (160) -->
            <rect x="380" y="340" width="140" height="50" fill="none" stroke="#000" stroke-width="2"/>
            <text x="450" y="365" text-anchor="middle" font-family="Times New Roman" font-size="10">POWER MGMT (160)</text>
            <text x="450" y="380" text-anchor="middle" font-family="Times New Roman" font-size="9">12V DC / Battery</text>

            <!-- Audio Output (170) -->
            <rect x="540" y="340" width="100" height="50" fill="none" stroke="#000" stroke-width="2"/>
            <circle cx="590" cy="358" r="12" fill="none" stroke="#000" stroke-width="1"/>
            <text x="590" y="385" text-anchor="middle" font-family="Times New Roman" font-size="9">SPEAKER (170)</text>

            <!-- LED Indicators (175) -->
            <rect x="660" y="340" width="80" height="50" fill="none" stroke="#000" stroke-width="2"/>
            <circle cx="685" cy="358" r="6" fill="none" stroke="#000" stroke-width="1"/>
            <circle cx="705" cy="358" r="6" fill="none" stroke="#000" stroke-width="1"/>
            <circle cx="725" cy="358" r="6" fill="none" stroke="#000" stroke-width="1"/>
            <text x="705" y="385" text-anchor="middle" font-family="Times New Roman" font-size="9">LED (175)</text>

            <!-- Internal Connections -->
            <line x1="450" y1="170" x2="450" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <line x1="590" y1="140" x2="590" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <line x1="520" y1="110" x2="540" y2="110" stroke="#000" stroke-width="1.5"/>
            <line x1="640" y1="130" x2="660" y2="130" stroke="#000" stroke-width="1.5"/>
            <line x1="560" y1="270" x2="580" y2="270" stroke="#000" stroke-width="1.5"/>
            <line x1="700" y1="270" x2="720" y2="270" stroke="#000" stroke-width="1.5"/>
            <line x1="740" y1="180" x2="740" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- Data Bus -->
            <rect x="395" y="315" width="415" height="8" fill="#000"/>
            <text x="600" y="335" text-anchor="middle" font-family="Times New Roman" font-size="8">SYSTEM DATA BUS</text>

            <!-- Mobile App (200) -->
            <rect x="50" y="450" width="200" height="280" rx="20" fill="none" stroke="#000" stroke-width="2"/>
            <rect x="70" y="470" width="160" height="230" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="500" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">MOBILE APP (200)</text>

            <rect x="85" y="520" width="130" height="25" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="537" text-anchor="middle" font-family="Times New Roman" font-size="9">Dashboard (210)</text>

            <rect x="85" y="555" width="130" height="25" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="572" text-anchor="middle" font-family="Times New Roman" font-size="9">Real-time Monitor (220)</text>

            <rect x="85" y="590" width="130" height="25" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="607" text-anchor="middle" font-family="Times New Roman" font-size="9">Alerts & History (230)</text>

            <rect x="85" y="625" width="130" height="25" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="642" text-anchor="middle" font-family="Times New Roman" font-size="9">Analytics (240)</text>

            <rect x="85" y="660" width="130" height="25" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="677" text-anchor="middle" font-family="Times New Roman" font-size="9">Settings (250)</text>

            <circle cx="150" cy="715" r="15" fill="none" stroke="#000" stroke-width="1"/>
            <text x="150" y="745" text-anchor="middle" font-family="Times New Roman" font-size="10">SMARTPHONE (205)</text>

            <!-- Cloud Server (300) -->
            <ellipse cx="600" cy="520" rx="150" ry="50" fill="none" stroke="#000" stroke-width="2"/>
            <path d="M490,520 Q490,480 530,480 Q540,460 580,460 Q610,460 620,480 Q660,470 680,490 Q720,490 720,520" fill="none" stroke="#000" stroke-width="1.5"/>
            <text x="600" y="515" text-anchor="middle" font-family="Times New Roman" font-size="12" font-weight="bold">CLOUD SERVER (300)</text>
            <text x="600" y="535" text-anchor="middle" font-family="Times New Roman" font-size="10">Data Storage & Analytics</text>

            <!-- Cloud Components -->
            <rect x="470" y="590" width="80" height="40" fill="none" stroke="#000" stroke-width="1"/>
            <text x="510" y="612" text-anchor="middle" font-family="Times New Roman" font-size="8">DATABASE</text>
            <text x="510" y="624" text-anchor="middle" font-family="Times New Roman" font-size="8">(310)</text>

            <rect x="560" y="590" width="80" height="40" fill="none" stroke="#000" stroke-width="1"/>
            <text x="600" y="612" text-anchor="middle" font-family="Times New Roman" font-size="8">ML ENGINE</text>
            <text x="600" y="624" text-anchor="middle" font-family="Times New Roman" font-size="8">(320)</text>

            <rect x="650" y="590" width="80" height="40" fill="none" stroke="#000" stroke-width="1"/>
            <text x="690" y="612" text-anchor="middle" font-family="Times New Roman" font-size="8">API SERVER</text>
            <text x="690" y="624" text-anchor="middle" font-family="Times New Roman" font-size="8">(330)</text>

            <!-- Emergency Services (400) -->
            <rect x="900" y="460" width="180" height="100" fill="none" stroke="#000" stroke-width="2"/>
            <text x="990" y="495" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">EMERGENCY</text>
            <text x="990" y="510" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">SERVICES (400)</text>
            <text x="990" y="535" text-anchor="middle" font-family="Times New Roman" font-size="9">Police / Ambulance</text>
            <text x="990" y="548" text-anchor="middle" font-family="Times New Roman" font-size="9">GPS Location</text>

            <!-- Fleet Management (500) -->
            <rect x="900" y="600" width="180" height="100" fill="none" stroke="#000" stroke-width="2"/>
            <text x="990" y="635" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">FLEET MGMT</text>
            <text x="990" y="650" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">PORTAL (500)</text>
            <text x="990" y="680" text-anchor="middle" font-family="Times New Roman" font-size="9">Multi-vehicle Tracking</text>

            <!-- Vehicle CAN Bus (600) -->
            <rect x="350" y="450" width="150" height="60" fill="none" stroke="#000" stroke-width="2"/>
            <text x="425" y="475" text-anchor="middle" font-family="Times New Roman" font-size="10">VEHICLE OBD-II</text>
            <text x="425" y="490" text-anchor="middle" font-family="Times New Roman" font-size="10">INTERFACE (600)</text>
            <text x="425" y="505" text-anchor="middle" font-family="Times New Roman" font-size="8">Speed / RPM Data</text>

            <!-- Data Flow Arrows -->
            <!-- Device to Cloud -->
            <path d="M770,400 L770,430 Q770,450 750,470 L600,485" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="700" y="440" font-family="Times New Roman" font-size="8">4G/WiFi</text>

            <!-- Cloud to Mobile -->
            <line x1="450" y1="510" x2="250" y2="510" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>
            <text x="350" y="500" font-family="Times New Roman" font-size="8">API/WebSocket</text>

            <!-- Mobile to Device (Bluetooth) -->
            <path d="M250,580 L300,580 Q340,580 340,520 L340,400 L380,400" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
            <text x="280" y="530" font-family="Times New Roman" font-size="8">BT 5.2</text>

            <!-- Cloud to Emergency -->
            <line x1="750" y1="510" x2="900" y2="510" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="825" y="500" font-family="Times New Roman" font-size="8">SOS Alert</text>

            <!-- Cloud to Fleet -->
            <line x1="730" y1="550" x2="900" y2="620" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="820" y="575" font-family="Times New Roman" font-size="8">Analytics</text>

            <!-- Vehicle to Device -->
            <line x1="425" y1="450" x2="425" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- Cloud internal connections -->
            <line x1="510" y1="570" x2="510" y2="590" stroke="#000" stroke-width="1"/>
            <line x1="600" y1="570" x2="600" y2="590" stroke="#000" stroke-width="1"/>
            <line x1="690" y1="570" x2="690" y2="590" stroke="#000" stroke-width="1"/>

            <!-- Legend Box -->
            <rect x="50" y="780" width="500" height="60" fill="none" stroke="#000" stroke-width="1"/>
            <text x="300" y="800" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">REFERENCE NUMERALS</text>
            <text x="100" y="825" font-family="Times New Roman" font-size="9">100: Smart Device</text>
            <text x="200" y="825" font-family="Times New Roman" font-size="9">110-175: Device Components</text>
            <text x="340" y="825" font-family="Times New Roman" font-size="9">200-250: Mobile App</text>
            <text x="460" y="825" font-family="Times New Roman" font-size="9">300-330: Cloud</text>

            <!-- Data Flow Legend -->
            <rect x="570" y="780" width="300" height="60" fill="none" stroke="#000" stroke-width="1"/>
            <text x="720" y="800" text-anchor="middle" font-family="Times New Roman" font-size="11" font-weight="bold">DATA FLOW</text>
            <line x1="590" y1="820" x2="640" y2="820" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="680" y="824" font-family="Times New Roman" font-size="9">Wired/Primary</text>
            <line x1="750" y1="820" x2="800" y2="820" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
            <text x="840" y="824" font-family="Times New Roman" font-size="9">Wireless</text>

            <!-- Patent Info -->
            <text x="1100" y="840" text-anchor="end" font-family="Times New Roman" font-size="10">Sheet 1 of 1</text>
        </svg>
    </div>
</body>
</html>
