<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaneGuard - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .glass-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .status-glow {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen overflow-x-hidden">
    <!-- Status Bar -->
    <div class="px-5 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-medium">9:41</span>
        <div class="w-28 h-7 bg-black rounded-full"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="px-5 pt-4 pb-3">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-gray-400 text-sm">Good Morning</p>
                <h1 class="text-2xl font-bold">LaneGuard</h1>
            </div>
            <div class="w-11 h-11 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                <i class="fas fa-user text-white"></i>
            </div>
        </div>
    </div>

    <!-- Main Status Card -->
    <div class="px-5 py-4">
        <div class="bg-gradient-to-br from-green-500 to-emerald-600 rounded-3xl p-5 status-glow">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-car text-2xl text-white"></i>
                    </div>
                    <div>
                        <p class="text-white/80 text-sm">Device Status</p>
                        <p class="text-white font-semibold text-lg">Connected</p>
                    </div>
                </div>
                <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white/10 rounded-xl p-3 text-center">
                    <p class="text-white/70 text-xs mb-1">Lane</p>
                    <p class="text-white font-bold text-lg">OK</p>
                </div>
                <div class="bg-white/10 rounded-xl p-3 text-center">
                    <p class="text-white/70 text-xs mb-1">Speed</p>
                    <p class="text-white font-bold text-lg">45</p>
                </div>
                <div class="bg-white/10 rounded-xl p-3 text-center">
                    <p class="text-white/70 text-xs mb-1">Score</p>
                    <p class="text-white font-bold text-lg">94</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="px-5 py-2">
        <h2 class="text-lg font-semibold mb-3">Quick Actions</h2>
        <div class="grid grid-cols-4 gap-3">
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-blue-500/20 rounded-2xl flex items-center justify-center mb-2">
                    <i class="fas fa-play text-blue-400 text-lg"></i>
                </div>
                <span class="text-xs text-gray-400">Start Trip</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-purple-500/20 rounded-2xl flex items-center justify-center mb-2">
                    <i class="fas fa-history text-purple-400 text-lg"></i>
                </div>
                <span class="text-xs text-gray-400">History</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-orange-500/20 rounded-2xl flex items-center justify-center mb-2">
                    <i class="fas fa-chart-line text-orange-400 text-lg"></i>
                </div>
                <span class="text-xs text-gray-400">Analytics</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-red-500/20 rounded-2xl flex items-center justify-center mb-2">
                    <i class="fas fa-exclamation-triangle text-red-400 text-lg"></i>
                </div>
                <span class="text-xs text-gray-400">Alerts</span>
            </div>
        </div>
    </div>

    <!-- Today's Summary -->
    <div class="px-5 py-4">
        <h2 class="text-lg font-semibold mb-3">Today's Summary</h2>
        <div class="glass-card rounded-2xl p-4">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-road text-blue-400"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-sm">Distance Driven</p>
                        <p class="font-semibold">28.5 km</p>
                    </div>
                </div>
                <span class="text-green-400 text-sm">+12%</span>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-yellow-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-yellow-400"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-sm">Warnings</p>
                        <p class="font-semibold">2 alerts</p>
                    </div>
                </div>
                <span class="text-yellow-400 text-sm">-50%</span>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-xl border-t border-gray-800 px-6 py-2 pb-7">
        <div class="flex justify-between items-center">
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center">
                    <i class="fas fa-home text-white"></i>
                </div>
                <span class="text-xs text-blue-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-video text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">Monitor</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-clock text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">History</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-cog text-gray-500 text-lg"></i>
                </div>
                <span class="text-xs text-gray-500 mt-1">Settings</span>
            </div>
        </div>
    </div>

    <!-- Home Indicator -->
    <div class="fixed bottom-1 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-gray-600 rounded-full"></div>
</body>
</html>
