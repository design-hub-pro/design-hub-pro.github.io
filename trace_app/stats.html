<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--ink:#0B0F14;--muted:#6E7887;--border:#E7EAEF;--surface:#F5F6F8;--card:#fff;--brand:#0FAE5C;--brandsoft:#E3F9EC;--speed:#FF7A1A;--speedsoft:#FFEDDE;--bball:#FF7A1A;--soccer:#2E90FA}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface)}
.body{height:100%;overflow-y:auto;padding-bottom:118px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
h1{font-size:28px;font-weight:800;letter-spacing:-1px}
.meta{font-size:11.5px;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;background:#EAEDF1;border-radius:14px;padding:4px;margin-top:4px}
.seg span{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13px;font-weight:750;color:var(--muted)}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(13,18,24,.1)}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 12px 26px -18px rgba(13,18,24,.3)}
.recs{display:flex;gap:12px;overflow-x:auto;padding:2px 0 4px}
.rec{flex-shrink:0;width:126px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 10px 20px -18px rgba(13,18,24,.3)}
.rec .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.rec b{font-size:19px;font-weight:800;letter-spacing:-.5px;display:block}
.rec span{font-size:10.5px;color:var(--muted);font-weight:650;display:block;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.cal i{display:block;aspect-ratio:1;border-radius:3px;background:#E7EAEF}
.tab{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:13px;z-index:20}
.tab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#A6B1BC;font-size:10px;font-weight:680;letter-spacing:.3px}
.tab a i{font-size:18px}
.tab a.on{color:var(--ink)}
.recb{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--speed)!important;display:flex;align-items:center;justify-content:center;margin-top:-19px;box-shadow:0 12px 22px -10px rgba(11,15,20,.5)}
.recb i{font-size:19px}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px"><h1>Stats</h1>
  <div class="seg" style="margin-top:12px"><span class="on"><i class="fa-solid fa-basketball" style="margin-right:5px;color:var(--bball)"></i>Basketball</span><span><i class="fa-solid fa-futbol" style="margin-right:5px"></i>Soccer</span></div>
</div>

<div class="px" style="margin-top:18px"><div class="card" style="padding:20px 20px 16px">
  <div style="display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div class="meta" style="font-size:10.5px">Season shooting %</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px">
        <span style="font-size:48px;font-weight:800;letter-spacing:-2.5px;line-height:.9">64<span style="font-size:20px">%</span></span>
        <span style="font-size:13px;font-weight:750;color:var(--brand)"><i class="fa-solid fa-arrow-up" style="font-size:9px"></i> 5 mo</span>
      </div>
    </div>
  </div>
  <svg width="100%" height="90" viewBox="0 0 380 90" style="margin-top:10px">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0FAE5C" stop-opacity=".2"/><stop offset="1" stop-color="#0FAE5C" stop-opacity="0"/></linearGradient></defs>
    <path d="M4 68 L54 60 L104 64 L154 48 L204 50 L254 34 L304 30 L376 12 L376 88 L4 88 Z" fill="url(#fg)"/>
    <path d="M4 68 L54 60 L104 64 L154 48 L204 50 L254 34 L304 30 L376 12" fill="none" stroke="#0FAE5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="376" cy="12" r="4.5" fill="#0FAE5C" stroke="#fff" stroke-width="2.5"/>
  </svg>
</div></div>

<div class="px" style="margin-top:22px">
  <div class="meta" style="margin-bottom:11px">Personal records</div>
  <div class="recs">
    <div class="rec"><div class="ic" style="background:var(--speedsoft)"><i class="fa-solid fa-satellite-dish" style="color:var(--speed);font-size:13px"></i></div><b>26<span style="font-size:12px">mph</span></b><span>TOP SPEED</span></div>
    <div class="rec"><div class="ic" style="background:var(--brandsoft)"><i class="fa-solid fa-percent" style="color:var(--brand);font-size:13px"></i></div><b>88%</b><span>BEST SESSION</span></div>
    <div class="rec"><div class="ic" style="background:#FFEDDE"><i class="fa-solid fa-fire" style="color:#FF7A1A;font-size:13px"></i></div><b>12</b><span>LONGEST STREAK</span></div>
    <div class="rec"><div class="ic" style="background:#E7F1FF"><i class="fa-solid fa-basketball" style="color:var(--soccer);font-size:13px"></i></div><b>64</b><span>MOST SHOTS</span></div>
  </div>
</div>

<div class="px" style="margin-top:22px">
  <a href="leaderboard.html" style="text-decoration:none"><div class="card" style="padding:16px 18px;display:flex;align-items:center;gap:14px">
    <div style="width:44px;height:44px;border-radius:14px;background:var(--speedsoft);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-trophy" style="color:var(--speed)"></i></div>
    <div style="flex:1"><b style="font-size:14.5px;font-weight:720;display:block">You're #14 on the speed leaderboard</b><span style="font-size:12px;color:var(--muted);font-weight:600">See where you rank against friends</span></div>
    <i class="fa-solid fa-chevron-right" style="font-size:12px;color:#B7C1CC"></i>
  </div></a>
</div>

<div class="px" style="margin-top:22px">
  <div class="meta" style="margin-bottom:11px">Avg speed trend</div>
  <div class="card" style="padding:18px">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><b style="font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--speed)">18mph</b><span style="font-size:12.5px;color:var(--muted);font-weight:650">this month</span></div>
    <svg width="100%" height="46" viewBox="0 0 380 46">
      <path d="M4 30 L54 26 L104 34 L154 20 L204 24 L254 14 L304 18 L376 8" fill="none" stroke="#FF7A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div class="px" style="margin-top:22px">
  <div class="meta" style="margin-bottom:11px">Last 8 weeks</div>
  <div class="card" style="padding:18px">
    <div class="cal">
      <i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i>
      <i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brand)"></i>
      <i style="background:#E7EAEF"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brand)"></i><i style="background:var(--brandsoft)"></i><i style="background:var(--brand)"></i><i style="background:#E7EAEF"></i><i style="background:var(--brand)"></i><i style="background:var(--brand)"></i>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">
      <span style="font-size:12px;color:var(--muted);font-weight:600">Less</span>
      <span style="font-size:12px;color:var(--muted);font-weight:600">More</span>
    </div>
  </div>
</div>

</div>
<div class="tab">
  <a href="home.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="drills.html"><i class="fa-solid fa-dumbbell"></i>Drills</a>
  <a href="live-session.html"><span class="recb"><i class="fa-solid fa-video"></i></span></a>
  <a href="stats.html" class="on"><i class="fa-solid fa-chart-simple"></i>Stats</a>
  <a href="profile.html"><i class="fa-regular fa-user"></i>Profile</a>
</div>
</div></body></html>
