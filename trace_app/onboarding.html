<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--ink:#0B0F14;--muted:#6E7887;--border:#E7EAEF;--surface:#F5F6F8;--brand:#0FAE5C;--brandsoft:#E3F9EC;--bball:#FF7A1A;--bballsoft:#FFEDDE;--soccer:#2E90FA;--soccersoft:#E7F1FF;--lime:#D6FF3D}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#fff;color:var(--ink)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.hero{height:552px;position:relative;flex-shrink:0}
.hero img{width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,10,.5) 0%,rgba(4,7,10,.05) 40%,rgba(4,7,10,.98) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;color:#fff;z-index:3}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.mark{position:absolute;left:28px;right:28px;bottom:36px;z-index:3;color:#fff}
.logo{width:52px;height:52px;border-radius:16px;background:var(--lime);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 12px 26px -10px rgba(214,255,61,.6)}
.logo i{color:var(--ink);font-size:21px}
.mark h1{font-size:38px;font-weight:800;letter-spacing:-1.5px}
.mark p{font-size:14.5px;color:rgba(255,255,255,.82);margin-top:8px;font-weight:500;max-width:300px}
.sheet{flex:1;background:#fff;border-radius:32px 32px 0 0;margin-top:-32px;position:relative;z-index:4;padding:26px 28px 30px;display:flex;flex-direction:column}
.meta{font-size:11.5px;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.sports{display:flex;gap:12px}
.sp{flex:1;border:2px solid var(--border);border-radius:20px;padding:16px 14px;position:relative}
.sp.on{border-color:var(--brand);background:var(--brandsoft)}
.sp .chip{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.sp b{display:block;font-size:15.5px;font-weight:750;letter-spacing:-.2px}
.sp span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
.btn{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:19px;background:var(--brand);color:#fff;font-size:16.5px;font-weight:750;letter-spacing:-.3px;box-shadow:0 16px 30px -15px rgba(15,174,92,.6);text-decoration:none;border:none}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;font-weight:600}
</style></head><body>
<div class="screen">
  <div class="hero">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788805301905-image-1.png" alt="">
    <div class="scrim"></div>
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
    <div class="mark">
      <div class="logo"><i class="fa-solid fa-bullseye"></i></div>
      <h1>Trace</h1>
      <p>Point your camera at the hoop or the goal. Every shot gets logged, mapped, and clocked.</p>
    </div>
  </div>
  <div class="sheet">
    <div class="meta">Choose your sport</div>
    <div class="sports">
      <div class="sp on"><div class="check"><i class="fa-solid fa-check"></i></div><div class="chip" style="background:var(--bballsoft)"><i class="fa-solid fa-basketball" style="color:var(--bball);font-size:16px"></i></div><b>Basketball</b><span>Hoop &amp; 3PT lines</span></div>
      <div class="sp"><div class="chip" style="background:var(--soccersoft)"><i class="fa-solid fa-futbol" style="color:var(--soccer);font-size:16px"></i></div><b>Soccer</b><span>Goal &amp; corners</span></div>
    </div>
    <a href="live-session.html" class="btn">Set up camera<i class="fa-solid fa-arrow-right" style="font-size:13px"></i></a>
    <div class="sub">You can switch sports anytime</div>
  </div>
</div>
</body></html>
