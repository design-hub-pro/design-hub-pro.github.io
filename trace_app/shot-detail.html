<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--ink:#0B0F14;--muted:#6E7887;--border:#E7EAEF;--surface:#F5F6F8;--card:#fff;--brand:#0FAE5C;--brandsoft:#E3F9EC;--speed:#FF7A1A;--speedsoft:#FFEDDE;--miss:#F14C4C}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface)}
.body{height:100%;overflow-y:auto;padding-bottom:36px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.ibtn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;text-decoration:none}
.title{font-size:16px;font-weight:750;letter-spacing:-.2px}
.meta{font-size:11.5px;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.replay{position:relative;height:280px;border-radius:24px;overflow:hidden;box-shadow:0 20px 38px -20px rgba(13,18,24,.5)}
.replay img{width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.badge{position:absolute;top:14px;left:14px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:7px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.speedtag{position:absolute;background:rgba(4,7,10,.6);backdrop-filter:blur(6px);border:1px solid rgba(214,255,61,.5);color:#D6FF3D;font-size:12px;font-weight:800;padding:5px 10px;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mtile{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 10px 20px -18px rgba(13,18,24,.3)}
.mtile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px}
.mtile span{display:block;font-size:11px;color:var(--muted);font-weight:650;margin-top:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:19px;background:var(--brand);color:#fff;font-size:16px;font-weight:750;letter-spacing:-.3px;box-shadow:0 16px 30px -15px rgba(15,174,92,.55);text-decoration:none}
.link{display:block;text-align:center;font-size:13.5px;font-weight:700;color:var(--miss);margin-top:14px;text-decoration:none}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px"><div class="topbar">
  <a href="session-summary.html" class="ibtn"><i class="fa-solid fa-chevron-left"></i></a>
  <span class="title">Strike #11</span>
  <a href="session-summary.html" class="ibtn"><i class="fa-solid fa-trash"></i></a>
</div></div>

<div class="px"><div class="replay">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788805325877-image-1.png" alt="">
  <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 380 280" preserveAspectRatio="xMidYMid slice">
    <path d="M60 260 Q 150 170 260 70" fill="none" stroke="#D6FF3D" stroke-width="2.5" stroke-dasharray="2 8" opacity=".85"/>
    <rect x="200" y="30" width="130" height="90" rx="10" fill="none" stroke="#D6FF3D" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="260" cy="70" r="7" fill="#D6FF3D" stroke="#04070A" stroke-width="2"/>
  </svg>
  <div class="badge"><i class="fa-solid fa-check"></i>GOAL</div>
  <div class="speedtag" style="top:44px;right:16px">61 mph</div>
</div></div>

<div class="px" style="margin-top:16px">
  <div class="meta" style="margin-bottom:10px">Strike metrics</div>
  <div class="grid2">
    <div class="mtile"><b style="color:var(--speed)">61<span style="font-size:13px;color:var(--muted)">mph</span></b><span>SPEED</span></div>
    <div class="mtile"><b>24<span style="font-size:13px;color:var(--muted)">yd</span></b><span>DISTANCE</span></div>
    <div class="mtile"><b>9<span style="font-size:13px;color:var(--muted)">in</span></b><span>FROM POST</span></div>
    <div class="mtile"><b style="font-size:17px">Top-Right</b><span>CORNER</span></div>
  </div>
</div>

<div class="px" style="margin-top:20px">
  <div class="card" style="background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 10px 20px -18px rgba(13,18,24,.3);display:flex;align-items:center;gap:12px">
    <i class="fa-regular fa-clock" style="color:var(--muted)"></i>
    <span style="font-size:13px;color:var(--ink);font-weight:650">Long-Range Strike &middot; Today, 7:18 PM</span>
  </div>
</div>

<div class="px" style="margin-top:22px">
  <a href="session-summary.html" class="btn"><i class="fa-solid fa-share-nodes" style="font-size:14px"></i>Share Replay</a>
  <a href="session-summary.html" class="link">Delete shot</a>
</div>

</div></div></body></html>
