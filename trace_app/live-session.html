<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--lime:#D6FF3D;--make:#3DDC84;--miss:#FF6B6B}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#04070A;color:#fff;font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#04070A}
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,6,.62) 0%,rgba(2,4,6,.05) 22%,rgba(2,4,6,.1) 60%,rgba(2,4,6,.9) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:5}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.hud{position:absolute;top:70px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.18)}
.sportchip{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);padding:8px 15px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1.4px;display:flex;align-items:center;gap:6px}
.overlay{position:absolute;inset:0;z-index:3}
.speedcard{position:absolute;top:126px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(10,14,18,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px 26px;text-align:center}
.speedcard .lbl{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.6);font-weight:800;text-transform:uppercase}
.speedcard .num{font-size:44px;font-weight:800;letter-spacing:-2px;color:var(--lime);line-height:1.05;margin-top:2px}
.speedcard .num small{font-size:16px;font-weight:700;color:rgba(255,255,255,.75);margin-left:2px}
.speedcard .sub{font-size:10.5px;color:rgba(255,255,255,.55);font-weight:600;margin-top:3px}
.zone{position:absolute;top:322px;left:50%;transform:translateX(-50%);background:rgba(214,255,61,.16);border:1px solid rgba(214,255,61,.6);color:var(--lime);font-size:10px;font-weight:800;letter-spacing:1.5px;padding:5px 10px;border-radius:14px;z-index:4}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(8,11,14,.72);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.12);border-radius:28px 28px 0 0;padding:16px 26px 30px}
.toast{display:flex;align-items:center;gap:8px;background:rgba(61,220,132,.16);border:1px solid rgba(61,220,132,.4);border-radius:14px;padding:9px 13px;margin-bottom:14px}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--make);flex-shrink:0}
.toast b{font-size:12.5px;font-weight:750;color:#fff}
.toast span{font-size:11.5px;color:rgba(255,255,255,.6);margin-left:auto;font-weight:600}
.stats3{display:flex;text-align:center}
.stats3 div{flex:1}
.stats3 b{display:block;font-size:21px;font-weight:800;letter-spacing:-.6px}
.stats3 span{display:block;font-size:10.5px;color:rgba(255,255,255,.55);font-weight:700;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:18px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-decoration:none}
.cbtn.end{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.5);color:var(--miss)}
.recbtn{width:72px;height:72px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;color:#04070A;font-size:26px;text-decoration:none;box-shadow:0 0 0 6px rgba(214,255,61,.18),0 16px 30px -10px rgba(214,255,61,.5)}
</style></head><body>
<div class="screen">
  <div class="bg"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788805325635-image-1.png" alt=""></div>
  <div class="scrim"></div>

  <svg class="overlay" viewBox="0 0 460 980" preserveAspectRatio="xMidYMid slice">
    <path d="M120 700 Q 150 480 235 300" fill="none" stroke="#D6FF3D" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".85"/>
    <circle cx="120" cy="700" r="5" fill="#D6FF3D" opacity=".35"/>
    <circle cx="140" cy="600" r="5" fill="#D6FF3D" opacity=".5"/>
    <circle cx="163" cy="500" r="5.5" fill="#D6FF3D" opacity=".68"/>
    <circle cx="196" cy="400" r="6" fill="#D6FF3D" opacity=".85"/>
    <circle cx="235" cy="300" r="8" fill="#D6FF3D" stroke="#04070A" stroke-width="2"/>
    <circle cx="235" cy="300" r="16" fill="none" stroke="#D6FF3D" stroke-width="1.5" opacity=".6"/>
    <rect x="150" y="228" width="164" height="118" rx="14" fill="none" stroke="#D6FF3D" stroke-width="1.6" stroke-dasharray="6 6" opacity=".9"/>
  </svg>
  <div class="zone" style="top:214px">HOOP LOCKED</div>
  <div class="zone" style="top:678px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff">18 FT</div>

  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="hud">
    <a href="home.html" class="hbtn"><i class="fa-solid fa-xmark"></i></a>
    <div class="sportchip"><i class="fa-solid fa-basketball" style="color:#FF7A1A;font-size:10px"></i>BASKETBALL</div>
    <a href="live-session.html" class="hbtn"><i class="fa-solid fa-camera-rotate"></i></a>
  </div>

  <div class="speedcard">
    <div class="lbl">Last shot speed</div>
    <div class="num">38<small>mph</small></div>
    <div class="sub"><i class="fa-solid fa-satellite-dish" style="margin-right:4px"></i>locked in 0.4s</div>
  </div>

  <div class="panel">
    <div class="toast"><span class="d"></span><b>MADE &middot; 3PT</b><span>36 mph &middot; right wing</span></div>
    <div class="stats3">
      <div><b>14</b><span>Shots</span></div>
      <div><b style="color:var(--make)">9</b><span>Makes</span></div>
      <div><b style="color:#FF7A1A">3</b><span>Streak</span></div>
    </div>
    <div class="ctrls">
      <a href="live-session.html" class="cbtn"><i class="fa-solid fa-image"></i></a>
      <a href="session-summary.html" class="recbtn"><i class="fa-solid fa-pause"></i></a>
      <a href="session-summary.html" class="cbtn end"><i class="fa-solid fa-stop"></i></a>
    </div>
  </div>
</div>
</body></html>
