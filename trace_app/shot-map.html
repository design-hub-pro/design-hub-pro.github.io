<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--ink:#0B0F14;--muted:#6E7887;--border:#E7EAEF;--surface:#F5F6F8;--card:#fff;--brand:#0FAE5C;--make:#0FAE5C;--miss:#F14C4C;--speed:#FF7A1A;--speedsoft:#FFEDDE;--soccer:#2E90FA}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface)}
.body{height:100%;overflow-y:auto;padding-bottom:36px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.ibtn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;text-decoration:none}
.title{font-size:16px;font-weight:750;letter-spacing:-.2px}
.chips{display:flex;gap:9px;overflow-x:auto}
.chip{flex-shrink:0;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 12px 26px -18px rgba(13,18,24,.3)}
.meta{font-size:11.5px;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.legend{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:650}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.zonewrap{display:flex;gap:12px;overflow-x:auto;padding:2px 0}
.zone{flex-shrink:0;width:126px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 10px 20px -18px rgba(13,18,24,.3)}
.zone b{font-size:22px;font-weight:800;letter-spacing:-.6px;display:block}
.zone span{font-size:11px;color:var(--muted);font-weight:650;display:block;margin-top:2px}
.bar{height:6px;background:#EEF1F4;border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--soccer);border-radius:4px}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px"><div class="topbar">
  <a href="stats.html" class="ibtn"><i class="fa-solid fa-chevron-left"></i></a>
  <span class="title">Goal Map</span>
  <a href="shot-map.html" class="ibtn"><i class="fa-solid fa-sliders"></i></a>
</div></div>

<div class="px"><div class="chips">
  <span class="chip on">All time</span><span class="chip">This week</span><span class="chip">This month</span><span class="chip">By drill</span>
</div></div>

<div class="px" style="margin-top:16px"><div class="card" style="padding:20px 18px 16px">
  <svg width="100%" height="240" viewBox="0 0 340 240">
    <rect x="10" y="10" width="320" height="210" fill="none" stroke="#0B0F14" stroke-width="4"/>
    <line x1="116.6" y1="10" x2="116.6" y2="220" stroke="#E7EAEF" stroke-width="2"/>
    <line x1="223.3" y1="10" x2="223.3" y2="220" stroke="#E7EAEF" stroke-width="2"/>
    <line x1="10" y1="80" x2="330" y2="80" stroke="#E7EAEF" stroke-width="2"/>
    <line x1="10" y1="150" x2="330" y2="150" stroke="#E7EAEF" stroke-width="2"/>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0 L10 10 M10 0 L0 10" stroke="#EEF1F4" stroke-width="1"/></pattern>
    <rect x="12" y="12" width="316" height="206" fill="url(#net)" opacity=".5"/>

    <circle cx="255" cy="42" r="10" fill="#0FAE5C"/>
    <circle cx="65" cy="40" r="10" fill="#F14C4C"/>
    <circle cx="270" cy="115" r="9" fill="#0FAE5C"/>
    <circle cx="170" cy="45" r="9" fill="#0FAE5C"/>
    <circle cx="55" cy="185" r="9" fill="#0FAE5C"/>
    <circle cx="175" cy="185" r="9" fill="#F14C4C"/>
    <circle cx="255" cy="185" r="10" fill="#0FAE5C"/>
    <circle cx="90" cy="115" r="8" fill="#F14C4C"/>
    <circle cx="190" cy="115" r="8" fill="#0FAE5C"/>
    <circle cx="300" cy="45" r="8" fill="#0FAE5C"/>
  </svg>
  <div class="legend">
    <span><i style="background:#0FAE5C"></i>Goal</span>
    <span><i style="background:#F14C4C"></i>Off target</span>
    <span><i style="background:#D6E200;width:14px;height:14px;border-radius:50%;opacity:.4"></i>Size = speed</span>
  </div>
</div></div>

<div class="px" style="margin-top:18px"><div class="card" style="padding:16px 18px;display:flex;align-items:center;gap:14px;background:linear-gradient(155deg,#0B0F14,#182233)">
  <div style="width:44px;height:44px;border-radius:14px;background:rgba(214,255,61,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-bolt" style="color:#D6FF3D"></i></div>
  <div style="flex:1;color:#fff"><b style="font-size:14.5px;font-weight:720;display:block">61 mph top-right was your fastest goal</b><span style="font-size:12px;color:rgba(255,255,255,.6);font-weight:600">Top corners average 12mph faster than center</span></div>
</div></div>

<div class="px" style="margin-top:22px">
  <div class="meta" style="margin-bottom:11px">By zone</div>
  <div class="zonewrap">
    <div class="zone"><b>78%</b><span>TOP CORNERS</span><div class="bar"><i style="width:78%"></i></div></div>
    <div class="zone"><b>61%</b><span>CENTER</span><div class="bar"><i style="width:61%"></i></div></div>
    <div class="zone"><b>54%</b><span>BOTTOM CORNERS</span><div class="bar"><i style="width:54%"></i></div></div>
    <div class="zone"><b>44%</b><span>FAR POST</span><div class="bar"><i style="width:44%"></i></div></div>
  </div>
</div>

<div class="px" style="margin-top:22px">
  <a href="leaderboard.html" style="text-decoration:none"><div class="card" style="padding:18px;display:flex;align-items:center;gap:14px">
    <div style="width:44px;height:44px;border-radius:14px;background:var(--speedsoft);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-trophy" style="color:var(--speed)"></i></div>
    <div style="flex:1"><b style="font-size:14.5px;font-weight:720;display:block">See how 61 mph ranks</b><span style="font-size:12px;color:var(--muted);font-weight:600">Open the speed leaderboard</span></div>
    <i class="fa-solid fa-chevron-right" style="font-size:12px;color:#B7C1CC"></i>
  </div></a>
</div>

</div></div></body></html>
