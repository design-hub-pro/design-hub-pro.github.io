<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--ink:#0B0F14;--muted:#6E7887;--border:#E7EAEF;--surface:#F5F6F8;--card:#fff;--brand:#0FAE5C;--brandsoft:#E3F9EC;--speed:#FF7A1A;--miss:#F14C4C}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface)}
.body{height:100%;overflow-y:auto;padding-bottom:118px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.meta{font-size:11.5px;letter-spacing:1.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(13,18,24,.04),0 12px 26px -18px rgba(13,18,24,.3)}
.badges{display:flex;gap:16px;overflow-x:auto;padding:4px 0}
.badge{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:66px}
.bicon{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.badge span{font-size:10.5px;font-weight:700;color:var(--ink);text-align:center;line-height:1.2}
.badge.lock .bicon{background:#E7EAEF!important;color:#B3BDC7}
.badge.lock span{color:#B3BDC7}
.bar{height:8px;background:#EEF1F4;border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.ric{width:34px;height:34px;border-radius:10px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;color:var(--ink2,#28323C);font-size:13px;flex-shrink:0}
.row b{font-size:14.5px;font-weight:650}
.tab{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:13px;z-index:20}
.tab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#A6B1BC;font-size:10px;font-weight:680;letter-spacing:.3px}
.tab a i{font-size:18px}
.tab a.on{color:var(--ink)}
.recb{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--speed)!important;display:flex;align-items:center;justify-content:center;margin-top:-19px;box-shadow:0 12px 22px -10px rgba(11,15,20,.5)}
.recb i{font-size:19px}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px" style="display:flex;align-items:center;gap:16px;margin:8px 0 22px">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788805326172-image-1.png" alt="" style="width:68px;height:68px;border-radius:22px;object-fit:cover">
  <div style="flex:1">
    <div style="font-size:22px;font-weight:800;letter-spacing:-.7px">Jordan Lee</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600"><i class="fa-solid fa-basketball" style="color:var(--speed);font-size:10px;margin-right:4px"></i>Basketball &middot; Advanced</div>
  </div>
  <a href="profile.html" style="width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:12px;text-decoration:none"><i class="fa-solid fa-pen"></i></a>
</div>

<div class="px">
  <div class="meta" style="margin-bottom:11px">Achievements</div>
  <div class="badges">
    <div class="badge"><div class="bicon" style="background:linear-gradient(160deg,#0FAE5C,#0B8A48)"><i class="fa-solid fa-basketball"></i></div><span>50 Club</span></div>
    <div class="badge"><div class="bicon" style="background:linear-gradient(160deg,#FF7A1A,#E05F00)"><i class="fa-solid fa-bullseye"></i></div><span>Sharp&shy;shooter</span></div>
    <div class="badge"><div class="bicon" style="background:linear-gradient(160deg,#D6FF3D,#9FCC00);color:#0B0F14"><i class="fa-solid fa-satellite-dish"></i></div><span>Speed Demon</span></div>
    <div class="badge lock"><div class="bicon"><i class="fa-solid fa-lock"></i></div><span>Iron Streak</span></div>
    <div class="badge lock"><div class="bicon"><i class="fa-solid fa-lock"></i></div><span>Century</span></div>
  </div>
</div>

<div class="px" style="margin-top:22px"><div class="card" style="padding:18px 20px">
  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <span style="font-size:14.5px;font-weight:720">Weekly goal</span>
    <span style="font-size:13px;color:var(--muted);font-weight:650">180 / 250 shots</span>
  </div>
  <div class="bar"><i style="width:72%"></i></div>
</div></div>

<div class="px" style="margin-top:22px">
  <div class="meta" style="margin-bottom:6px">Settings</div>
  <div class="card" style="padding:2px 18px">
    <div class="row"><div class="ric"><i class="fa-solid fa-ruler"></i></div><b style="flex:1">Speed units</b><span style="font-size:13px;color:var(--muted);font-weight:650">mph</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
    <div class="row"><div class="ric"><i class="fa-solid fa-camera"></i></div><b style="flex:1">Camera calibration</b><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
    <div class="row"><div class="ric"><i class="fa-solid fa-location-dot"></i></div><b style="flex:1">Court &amp; goal presets</b><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
    <div class="row"><div class="ric"><i class="fa-solid fa-bell"></i></div><b style="flex:1">Notifications</b><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
    <div class="row"><div class="ric"><i class="fa-solid fa-shield-halved"></i></div><b style="flex:1">Privacy</b><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
    <div class="row"><div class="ric"><i class="fa-solid fa-circle-question"></i></div><b style="flex:1">Help &amp; support</b><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#C3CBD3"></i></div>
  </div>
</div>

<div class="px" style="margin-top:18px">
  <a href="onboarding.html" style="display:block;text-align:center;font-size:13.5px;font-weight:700;color:var(--miss);text-decoration:none;padding:6px">Sign out</a>
</div>

</div>
<div class="tab">
  <a href="home.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="drills.html"><i class="fa-solid fa-dumbbell"></i>Drills</a>
  <a href="live-session.html"><span class="recb"><i class="fa-solid fa-video"></i></span></a>
  <a href="stats.html"><i class="fa-solid fa-chart-simple"></i>Stats</a>
  <a href="profile.html" class="on"><i class="fa-regular fa-user"></i>Profile</a>
</div>
</div></body></html>
