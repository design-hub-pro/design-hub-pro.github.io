<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--lime:#D6FF3D;--make:#3DDC84;--miss:#FF6B6B;--soccer:#5EB3FF}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#04070A;color:#fff;font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#04070A}
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,6,.66) 0%,rgba(2,4,6,.08) 24%,rgba(2,4,6,.12) 58%,rgba(2,4,6,.92) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:5}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.hud{position:absolute;top:70px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.18)}
.sportchip{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);padding:8px 15px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1.4px;display:flex;align-items:center;gap:6px;text-decoration:none;color:#fff}
.overlay{position:absolute;inset:0;z-index:3}
.speedcard{position:absolute;top:120px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(10,14,18,.5);backdrop-filter:blur(14px);border:1px solid rgba(214,255,61,.35);border-radius:24px;padding:16px 30px;text-align:center;box-shadow:0 0 40px -12px rgba(214,255,61,.35)}
.speedcard .lbl{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.6);font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px}
.speedcard .num{font-size:58px;font-weight:800;letter-spacing:-3px;color:var(--lime);line-height:1;margin-top:3px}
.speedcard .num small{font-size:18px;font-weight:700;color:rgba(255,255,255,.75);margin-left:2px}
.speedcard .sub{font-size:11px;color:var(--lime);font-weight:700;margin-top:5px}
.zone{position:absolute;top:322px;left:50%;transform:translateX(-50%);background:rgba(94,179,255,.18);border:1px solid rgba(94,179,255,.6);color:var(--soccer);font-size:10px;font-weight:800;letter-spacing:1.5px;padding:5px 10px;border-radius:14px;z-index:4}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(8,11,14,.72);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.12);border-radius:28px 28px 0 0;padding:16px 26px 30px}
.toast{display:flex;align-items:center;gap:8px;background:rgba(61,220,132,.16);border:1px solid rgba(61,220,132,.4);border-radius:14px;padding:9px 13px;margin-bottom:14px}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--make);flex-shrink:0}
.toast b{font-size:12.5px;font-weight:750;color:#fff}
.toast span{font-size:11.5px;color:rgba(255,255,255,.6);margin-left:auto;font-weight:600}
.stats3{display:flex;text-align:center}
.stats3 div{flex:1}
.stats3 b{display:block;font-size:21px;font-weight:800;letter-spacing:-.6px}
.stats3 span{display:block;font-size:10.5px;color:rgba(255,255,255,.55);font-weight:700;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:18px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-decoration:none}
.cbtn.end{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.5);color:var(--miss)}
.recbtn{width:72px;height:72px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;color:#04070A;font-size:26px;text-decoration:none;box-shadow:0 0 0 6px rgba(214,255,61,.18),0 16px 30px -10px rgba(214,255,61,.5)}
</style></head><body>
<div class="screen">
  <div class="bg"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788805325877-image-1.png" alt=""></div>
  <div class="scrim"></div>

  <svg class="overlay" viewBox="0 0 460 980" preserveAspectRatio="xMidYMid slice">
    <path d="M110 720 Q 200 500 330 260" fill="none" stroke="#D6FF3D" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".85"/>
    <circle cx="110" cy="720" r="5" fill="#D6FF3D" opacity=".3"/>
    <circle cx="150" cy="610" r="5" fill="#D6FF3D" opacity=".48"/>
    <circle cx="205" cy="500" r="5.5" fill="#D6FF3D" opacity=".65"/>
    <circle cx="270" cy="390" r="6" fill="#D6FF3D" opacity=".82"/>
    <circle cx="330" cy="260" r="8" fill="#D6FF3D" stroke="#04070A" stroke-width="2"/>
    <circle cx="330" cy="260" r="16" fill="none" stroke="#D6FF3D" stroke-width="1.5" opacity=".6"/>
    <rect x="120" y="150" width="290" height="180" rx="10" fill="none" stroke="#5EB3FF" stroke-width="1.6" stroke-dasharray="6 6" opacity=".9"/>
    <rect x="300" y="170" width="90" height="80" rx="8" fill="none" stroke="#D6FF3D" stroke-width="1.4" stroke-dasharray="4 5" opacity=".8"/>
  </svg>
  <div class="zone" style="top:130px">GOAL LOCKED &middot; TOP-RIGHT</div>
  <div class="zone" style="top:700px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff">24 YD</div>

  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="hud">
    <a href="home.html" class="hbtn"><i class="fa-solid fa-xmark"></i></a>
    <a href="live-session.html" class="sportchip"><i class="fa-solid fa-futbol" style="color:#5EB3FF;font-size:10px"></i>SOCCER<i class="fa-solid fa-chevron-down" style="font-size:8px;opacity:.6;margin-left:1px"></i></a>
    <a href="live-session-soccer.html" class="hbtn"><i class="fa-solid fa-camera-rotate"></i></a>
  </div>

  <div class="speedcard">
    <div class="lbl"><i class="fa-solid fa-bolt"></i>Last strike speed</div>
    <div class="num">54<small>mph</small></div>
    <div class="sub">Faster than 82% of your strikes</div>
  </div>

  <div class="panel">
    <div class="toast"><span class="d"></span><b>GOAL &middot; TOP CORNER</b><span>54 mph &middot; 24 yd out</span></div>
    <div class="stats3">
      <div><b>11</b><span>Strikes</span></div>
      <div><b style="color:var(--make)">7</b><span>Goals</span></div>
      <div><b style="color:var(--lime)">61</b><span style="color:rgba(255,255,255,.75)">Top mph</span></div>
    </div>
    <div class="ctrls">
      <a href="live-session-soccer.html" class="cbtn"><i class="fa-solid fa-image"></i></a>
      <a href="session-summary-soccer.html" class="recbtn"><i class="fa-solid fa-pause"></i></a>
      <a href="session-summary-soccer.html" class="cbtn end"><i class="fa-solid fa-stop"></i></a>
    </div>
  </div>
</div>
</body></html>
