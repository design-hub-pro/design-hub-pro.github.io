<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoberStart App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  html, body { background: #ffffff; }
  body { font-family: 'Inter', sans-serif; color: #0F172A; margin: 0; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  .phone { width: 460px; height: 980px; background: #0B0B14; border-radius: 62px; padding: 12px; box-shadow: 0 40px 80px -24px rgba(15,23,42,.28), 0 12px 24px -10px rgba(15,23,42,.16); }
  .phone-screen { width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #fff; }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 460px); gap: 56px; justify-content: center; }
  @media (max-width: 1540px) { .grid-3 { grid-template-columns: repeat(2, 460px); } }
  @media (max-width: 1020px) { .grid-3 { grid-template-columns: 460px; } }
</style>
</head>
<body>
<header class="text-center pt-16 pb-14 px-6">
  <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F59E0B 55%,#B45309)">
    <i class="fas fa-car-on text-white text-2xl"></i>
  </div>
  <h1 class="text-5xl font-black tracking-tight mt-6">SoberStart</h1>
  <p class="text-lg text-slate-500 mt-3">A breath, eye and reaction check before a teen's car starts, with alerts for parents.</p>
  <div class="flex justify-center gap-2 mt-5">
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-amber-50 text-amber-700">Teen Driving</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Start-Lock</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Parent Alerts</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Safety</span>
  </div>
</header>
<main class="grid-3 pb-24 px-6">
  <div class="phone"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="check.html" scrolling="no" title="check"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="locked.html" scrolling="no" title="locked"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="alerts.html" scrolling="no" title="alerts"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="drive.html" scrolling="no" title="drive"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="trips.html" scrolling="no" title="trips"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="insights.html" scrolling="no" title="insights"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="device.html" scrolling="no" title="device"></iframe></div></div>
</main>
</body>
</html>
