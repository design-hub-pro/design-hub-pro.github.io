<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>SoberStart · Welcome</title></head><body><div class="screen">
<div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=1000&q=80" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,18,32,.55) 0%,rgba(11,18,32,.25) 30%,rgba(11,18,32,.92) 62%,#0B1220 100%)"></div>
<div class="absolute inset-0 px text-white flex flex-col" style="padding-top:59px;padding-bottom:44px">
 <div class="flex items-center gap-3 mt-5">
  <div class="w-11 h-11 rounded-[14px] grad-amber flex items-center justify-center"><i class="fas fa-car-on text-white text-lg"></i></div>
  <span class="text-[20px] font-extrabold tracking-tight">SoberStart</span>
 </div>
 <div class="flex-1"></div>
 <span class="lbl text-amber-300">For teen drivers</span>
 <h1 class="text-[42px] leading-[1.04] font-black tracking-tight mt-3">Three checks.<br>Then the<br>engine starts.</h1>
 <p class="text-[15.5px] text-white/70 mt-4 leading-snug">About 20 seconds before every drive. Parents hear about it only when something is off.</p>
 <div class="grid grid-cols-3 gap-3 mt-7">
  <div class="glass p-4"><div class="icon-tile grad-sky"><i class="fas fa-wind"></i></div><div class="text-[15px] font-bold mt-3">Breath</div><div class="text-[12px] text-white/55 mt-0.5">Alcohol</div></div>
  <div class="glass p-4"><div class="icon-tile grad-violet"><i class="fas fa-eye"></i></div><div class="text-[15px] font-bold mt-3">Eyes</div><div class="text-[12px] text-white/55 mt-0.5">Drowsiness</div></div>
  <div class="glass p-4"><div class="icon-tile grad-amber"><i class="fas fa-bolt"></i></div><div class="text-[15px] font-bold mt-3">Reaction</div><div class="text-[12px] text-white/55 mt-0.5">5-second test</div></div>
 </div>
 <div class="flex justify-center gap-2 mt-7"><span class="w-6 h-1.5 rounded-full bg-amber-400"></span><span class="w-1.5 h-1.5 rounded-full bg-white/30"></span><span class="w-1.5 h-1.5 rounded-full bg-white/30"></span></div>
 <button class="mt-6 h-[58px] rounded-[20px] grad-amber text-[#0B1220] text-[16.5px] font-extrabold flex items-center justify-center gap-2.5"><i class="fab fa-bluetooth-b"></i>Pair your SoberStart</button>
 <div class="text-center text-[14px] text-white/60 mt-4 mb-3">Teen driver? <span class="text-white font-semibold">Join with a family code</span></div>
</div>
<div class="home-ind light"></div>
</div></body></html>
