<div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

   <div class="lbl text-[#0B1220]/70 mt-1" style="font-size:10.5px">Press on flash</div>
  </div>
 </div>

 <div class="glass p-4 mt-7">
