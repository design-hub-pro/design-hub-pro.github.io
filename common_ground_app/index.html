<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Common Ground</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#10201D;-webkit-font-smoothing:antialiased;}

  .hero{text-align:center;padding:86px 40px 56px;}
  .app-icon{width:80px;height:80px;border-radius:24px;background:linear-gradient(145deg,#14A48C,#0B5A50);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 16px 42px rgba(11,90,80,.34);}
  .app-icon i{font-size:33px;color:#fff;}
  .app-name{font-size:52px;font-weight:900;letter-spacing:-2.2px;background:linear-gradient(135deg,#14A48C,#0B5A50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .tagline{font-size:20px;color:#5E6A67;font-weight:400;margin-top:14px;}
  .tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .tag{font-size:12px;font-weight:600;padding:7px 15px;border-radius:50px;background:#E6F3F0;color:#0B5A50;}
  .tag.b{background:#EEF1FB;color:#38477F;}
  .tag.o{background:#FBF0E4;color:#96541A;}

  .screens{padding:0 40px 96px;max-width:1600px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px;justify-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;}
  .label{font-size:13px;font-weight:700;color:#9AA5A2;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
  .phone-frame{width:460px;height:980px;border-radius:62px;background:#0B0E0D;padding:12px;box-shadow:0 26px 80px rgba(16,40,36,.19),0 0 0 1px rgba(0,0,0,.05);}
  .phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#0B0E0D;}
  .phone-screen iframe{width:100%;height:100%;border:none;border-radius:52px;}
</style>
</head>
<body>
  <div class="hero">
    <div class="app-icon"><i class="fas fa-layer-group"></i></div>
    <div class="app-name">Common Ground</div>
    <div class="tagline">Mail the cards nobody keeps. They come back as decks a kid can actually win with.</div>
    <div class="tags">
      <span class="tag">Donation</span>
      <span class="tag b">Card scan</span>
      <span class="tag o">Kids</span>
      <span class="tag">Accessibility</span>
    </div>
  </div>

  <div class="screens">
    <div class="grid">
      <div class="item"><div class="label">Your pile</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Today</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Reading a pile</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="scan.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Pile read</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="pile.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Your boxes</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="boxes.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">You</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no"></iframe></div></div></div>
    </div>
  </div>
</body>
</html>
