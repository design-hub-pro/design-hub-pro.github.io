<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Rewards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.buddy{height:250px;border-radius:32px;background:linear-gradient(160deg,#C9F4EC 0%,#BAE6FD 100%);position:relative;overflow:hidden;margin-top:18px}
.badge2{width:94px;flex:none;text-align:center}
.badge2 .b{width:78px;height:78px;border-radius:26px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 12px 22px -12px rgba(14,27,43,.5)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk .d{height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb "><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="h1">Rewards</div><span class="pill" style="background:#FFF4CC;color:#9A6400;font-size:15px;padding:9px 14px"><i class="fa-solid fa-coins" style="color:#FFB020"></i><span class="num">1,240</span></span></div>

  <div class="buddy">
    <div class="absolute" style="left:50%;top:34px;transform:translateX(-50%);width:150px;height:170px">
      <svg viewBox="0 0 150 170" width="150" height="170"><path d="M20 40 C20 8 60 6 75 22 C90 6 130 8 130 40 C130 80 118 120 108 158 C104 170 92 168 90 156 L82 118 C80 108 70 108 68 118 L60 156 C58 168 46 170 42 158 C32 120 20 80 20 40Z" fill="#fff" stroke="#0E1B2B" stroke-width="4"/><circle cx="56" cy="58" r="8" fill="#0E1B2B"/><circle cx="94" cy="58" r="8" fill="#0E1B2B"/><circle cx="59" cy="55" r="2.6" fill="#fff"/><circle cx="97" cy="55" r="2.6" fill="#fff"/><path d="M58 80 Q75 96 92 80" stroke="#0E1B2B" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="42" cy="78" r="7" fill="#FF9A8B" opacity=".6"/><circle cx="108" cy="78" r="7" fill="#FF9A8B" opacity=".6"/><path d="M48 12 L58 0 L68 12 L75 2 L82 12 L92 0 L102 12" stroke="#FFB020" stroke-width="6" fill="none" stroke-linejoin="round"/></svg>
    </div>
    <div class="absolute left-5 bottom-5 right-5 flex items-end justify-between">
      <div><div class="meta" style="color:#0E7C72">Level 6</div><div class="font-black text-[22px] tracking-tight">King Molar</div></div>
      <div class="text-right"><div class="text-[12px] font-bold text-[color:var(--ink2)]">160 to Level 7</div><div class="bar mt-1.5" style="width:130px;background:rgba(255,255,255,.6)"><i style="width:72%"></i></div></div>
    </div>
  </div>

  <div class="sec"><div class="h2">This week</div><span class="act num">12 / 14</span></div>
  <div class="wk">
    <div class="d g-green text-white"><i class="fa-solid fa-check"></i>M</div>
    <div class="d g-green text-white"><i class="fa-solid fa-check"></i>T</div>
    <div class="d g-green text-white"><i class="fa-solid fa-check"></i>W</div>
    <div class="d g-sun"><i class="fa-solid fa-star-half-stroke"></i>T</div>
    <div class="d g-green text-white"><i class="fa-solid fa-check"></i>F</div>
    <div class="d g-green text-white"><i class="fa-solid fa-check"></i>S</div>
    <div class="d" style="background:#fff;border:2px dashed var(--border);color:var(--faint)"><i class="fa-regular fa-moon"></i>S</div>
  </div>

  <div class="sec"><div class="h2">Badges</div><span class="act">All 24</span></div>
  <div class="hscroll">
    <div class="badge2"><div class="b g-sun"><i class="fa-solid fa-fire"></i></div><div class="font-black text-[12.5px] mt-2">14 nights</div></div>
    <div class="badge2"><div class="b g-teal"><i class="fa-solid fa-tooth"></i></div><div class="font-black text-[12.5px] mt-2">All 12</div></div>
    <div class="badge2"><div class="b g-violet"><i class="fa-solid fa-feather"></i></div><div class="font-black text-[12.5px] mt-2">Soft hands</div></div>
    <div class="badge2"><div class="b" style="background:#E3EAF1;color:#A9B4C4;box-shadow:none"><i class="fa-solid fa-lock"></i></div><div class="font-black text-[12.5px] mt-2 text-[color:var(--faint)]">Back molar</div></div>
  </div>

  <div class="card mt-5 p-4 flex items-center gap-4">
    <div class="gicon g-hot" style="width:52px;height:52px;border-radius:17px;font-size:20px"><i class="fa-solid fa-gift"></i></div>
    <div class="flex-1"><div class="font-black text-[15.5px]">Pick Friday's movie</div><div class="bar mt-2"><i style="width:80%;background:var(--gradHot)"></i></div></div>
    <span class="font-black num text-[14px]">8/10</span>
  </div>
</div>
</div>
<div class="tabbar">
  <div class="tab "><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab "><i class="fa-solid fa-tooth"></i>Mouth map</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
  <div class="tab on"><i class="fa-solid fa-star"></i>Rewards</div>
  <div class="tab "><i class="fa-solid fa-user-shield"></i>Parent</div>
</div>
<div class="homebar"></div>
</div></body></html>
