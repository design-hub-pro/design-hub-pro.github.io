<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.hero{position:absolute;left:0;right:0;top:0;height:610px;background-image:url(img/hero.jpg);background-size:cover;background-position:center 30%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,21,33,.35) 0%,rgba(7,21,33,0) 30%,rgba(7,21,33,.15) 60%,rgba(245,249,251,1) 100%)}
.float{position:absolute;z-index:5;background:rgba(255,255,255,.94);border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 18px 30px -16px rgba(14,27,43,.45);font-weight:800;font-size:13.5px}
</style></head>
<body><div class="screen">
<div class="hero"></div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="float" style="top:150px;left:24px"><span class="dot" style="background:var(--green);width:11px;height:11px"></span>11 of 12 zones</div>
<div class="float" style="top:236px;right:22px"><span class="gicon g-hot" style="width:30px;height:30px;border-radius:10px;font-size:13px"><i class="fa-solid fa-hand"></i></span>Softer, please</div>
<div class="float" style="top:330px;left:40px"><span class="gicon g-sun" style="width:30px;height:30px;border-radius:10px;font-size:13px"><i class="fa-solid fa-fire"></i></span><span class="num">14</span>-night streak</div>
<div class="absolute left-0 right-0 pad" style="top:540px;z-index:6">
  <div class="flex items-center gap-2.5"><div class="gicon g-teal" style="width:40px;height:40px;border-radius:13px;font-size:17px"><i class="fa-solid fa-tooth"></i></div><span class="font-black text-[19px] tracking-tight">BrushBuddy</span></div>
  <div class="text-[40px] font-black tracking-[-1.4px] leading-[1.02] mt-5">Every tooth.<br>Every night.</div>
  <div class="sub mt-3 text-[16px]">A sleeve on their brush. A mouth that lights up as they clean.</div>
  <div class="flex gap-2 mt-6">
    <span class="w-6 h-2 rounded-full" style="background:var(--teal)"></span><span class="w-2 h-2 rounded-full bg-slate-300"></span><span class="w-2 h-2 rounded-full bg-slate-300"></span>
  </div>
  <div class="btn mt-7"><i class="fa-brands fa-bluetooth-b"></i>Set up the sleeve</div>
  <div class="text-center text-[14.5px] font-bold mt-5 text-[color:var(--muted)]">I already have an account · <span style="color:var(--teal)">Sign in</span></div>
</div>
<div class="homebar"></div>
</div></body></html>
