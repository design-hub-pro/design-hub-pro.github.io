<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
body{font-family:'Nunito',sans-serif;color:#0E1B2B;margin:0}
*::-webkit-scrollbar{display:none} *{scrollbar-width:none}
.grid3{display:grid;grid-template-columns:repeat(3,460px);gap:56px 44px;justify-content:center}
@media (max-width:1560px){.grid3{grid-template-columns:repeat(2,460px)}}
@media (max-width:1020px){.grid3{grid-template-columns:460px}}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0E1B2B;box-shadow:0 40px 80px -40px rgba(14,27,43,.45),0 0 0 1px rgba(14,27,43,.08);box-sizing:border-box}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;overflow:hidden}
</style></head>
<body>
<div class="px-10 pt-20 pb-28">
  <div class="text-center">
    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-2xl text-white" style="background:linear-gradient(135deg,#2DD4BF 0%,#0EA5E9 100%)"><i class="fa-solid fa-tooth"></i></div>
    <h1 class="text-5xl font-black tracking-tight mt-6">BrushBuddy</h1>
    <p class="text-lg text-slate-500 font-semibold mt-3">A toothbrush sleeve that lights up cleaned, missed and over-scrubbed zones on a live mouth map.</p>
    <div class="flex gap-2 justify-center mt-5 flex-wrap">
      <span class="text-xs font-bold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Kids 6–10</span>
      <span class="text-xs font-bold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Oral health</span>
      <span class="text-xs font-bold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">IMU hardware</span>
      <span class="text-xs font-bold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Parent app</span>
    </div>
  </div>

  <div class="grid3 mt-20">
    <div class="frame"><iframe src="welcome.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="pair.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="calibrate.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="live.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="result.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="map.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="rewards.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="parent.html" scrolling="no"></iframe></div>
  </div>
</div>
</body></html>
