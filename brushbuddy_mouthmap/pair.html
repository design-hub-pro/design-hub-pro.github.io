<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Pair</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.prod{height:330px;border-radius:32px;background-image:url(img/sleeve.jpg);background-position:center}
.radar{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:rad 2s infinite}
@keyframes rad{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.step{display:flex;align-items:center;gap:14px;padding:14px 0}
.step+.step{border-top:1px solid var(--border)}
.ck{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb "><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="meta">Step 1 of 3</span><div class="w-11"></div></div>
  <div class="h1 mt-5">Wake the sleeve</div>
  <div class="sub mt-2">Slide it on the handle. Give it two shakes.</div>
  <div class="prod img mt-6 flex items-center justify-center">
    <div class="radar"></div><div class="radar" style="animation-delay:1s"></div>
    <span class="pill dark absolute" style="top:16px;left:16px;z-index:3"><span class="dot pulse" style="background:#2DD4BF"></span>Searching</span>
  </div>
  <div class="card mt-5 p-4 flex items-center gap-4">
    <div class="gicon g-teal" style="width:54px;height:54px;border-radius:18px;font-size:22px"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div class="flex-1"><div class="font-black text-[17px] tracking-tight">BrushBuddy · Teal</div><div class="flex items-center gap-3 mt-1 text-[12.5px] font-bold text-[color:var(--muted)]"><span><i class="fa-solid fa-battery-full mr-1" style="color:var(--green)"></i>92%</span><span><i class="fa-solid fa-signal mr-1" style="color:var(--teal)"></i>Strong</span><span>IMU 6-axis</span></div></div>
    <div class="px-4 h-10 rounded-[14px] flex items-center font-black text-[14px] text-white" style="background:var(--ink)">Pair</div>
  </div>
  <div class="card mt-4 px-4 py-1">
    <div class="step"><div class="ck g-green text-white"><i class="fa-solid fa-check"></i></div><span class="font-bold text-[15px] flex-1">Bluetooth on</span></div>
    <div class="step"><div class="ck" style="background:var(--mint);color:var(--teal)"><i class="fa-solid fa-spinner fa-spin"></i></div><span class="font-bold text-[15px] flex-1">Find sleeve</span></div>
    <div class="step"><div class="ck" style="background:var(--surface);color:var(--faint)">3</div><span class="font-bold text-[15px] flex-1 text-[color:var(--faint)]">Learn Mia's brushing</span></div>
  </div>
</div>
</div>
<div class="homebar"></div>
</div></body></html>
