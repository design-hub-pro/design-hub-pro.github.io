<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Calibrate</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.wave{height:70px}
.zone{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb "><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="meta">Step 3 of 3</span><div class="iconbtn"><i class="fa-solid fa-xmark"></i></div></div>
  <div class="h1 mt-5">Learning Mia's brush</div>
  <div class="sub mt-2">Three normal brushes. No scores yet, just listening.</div>

  <div class="card mt-6 p-5">
    <div class="flex items-center justify-between"><span class="meta">Brush 2 of 3</span><span class="pill soft"><span class="dot" style="background:var(--teal)"></span>Recording</span></div>
    <svg id="m" class="w-full mt-2" style="height:250px"></svg>
    <div class="legend justify-center"><span><span class="dot" style="background:var(--teal)"></span>Learned</span><span><span class="dot" style="background:#CBD5E1"></span>Still learning</span></div>
  </div>

  <div class="grid grid-cols-3 gap-2.5 mt-4">
    <div class="card p-3 text-center"><div class="text-[26px] font-black num">9<span class="text-[15px] text-[color:var(--faint)]">/12</span></div><div class="text-[11.5px] font-bold text-[color:var(--muted)]">Zones mapped</div></div>
    <div class="card p-3 text-center"><div class="text-[26px] font-black num" style="color:var(--teal)">R</div><div class="text-[11.5px] font-bold text-[color:var(--muted)]">Right-handed</div></div>
    <div class="card p-3 text-center"><div class="text-[26px] font-black num">1.4<span class="text-[13px] text-[color:var(--faint)]">N</span></div><div class="text-[11.5px] font-bold text-[color:var(--muted)]">Usual press</div></div>
  </div>

  <div class="card mt-4 p-4">
    <div class="flex items-center justify-between"><span class="font-black text-[14.5px]">Motion signal</span><span class="text-[12px] font-bold text-[color:var(--muted)]">gyro · 100 Hz</span></div>
    <svg class="wave w-full mt-2" viewBox="0 0 340 70" preserveAspectRatio="none"><path d="M0 35 C15 10 25 60 40 35 S65 8 80 35 S105 62 120 35 S140 14 155 35 S175 58 190 35 S210 6 225 35 S250 64 265 35 S285 18 300 35 S325 52 340 35" stroke="#0FB5A6" stroke-width="3" fill="none"/><path d="M0 40 C20 30 30 50 50 40 S80 28 100 40 S130 50 150 40 S180 30 200 40 S230 52 250 40 S290 30 340 40" stroke="#8B7CF6" stroke-width="2" fill="none" opacity=".6"/></svg>
  </div>
  <div class="btn ghost mt-5" style="height:56px"><div class="bar flex-1 mx-2" style="max-width:220px"><i style="width:66%"></i></div><span class="text-[14px] num">2 / 3</span></div>
</div>
</div>
<div class="homebar"></div>
<script>drawMouth('m',['l','l','l','l','l','n'],['l','l','l','n','n','l']);</script>
</div></body></html>
