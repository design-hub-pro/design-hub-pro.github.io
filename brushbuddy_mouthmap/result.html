<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Result</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.top{background:var(--grad);border-radius:0 0 40px 40px;padding-bottom:26px;color:#fff;position:relative;overflow:hidden}
.conf{position:absolute;width:10px;height:16px;border-radius:3px}
.fix{display:flex;align-items:center;gap:14px;padding:14px 16px}
.fix+.fix{border-top:1px solid var(--border)}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="top">
  <i class="conf" style="background:#FFE066;left:40px;top:90px;transform:rotate(20deg)"></i><i class="conf" style="background:#fff;left:120px;top:150px;transform:rotate(-30deg);opacity:.7"></i><i class="conf" style="background:#FF9A8B;right:60px;top:100px;transform:rotate(45deg)"></i><i class="conf" style="background:#FFE066;right:110px;top:180px;transform:rotate(-12deg)"></i>
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad text-center relative">
    <div class="flex justify-between mt-3"><div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div><div class="iconbtn glass"><i class="fa-solid fa-share-nodes"></i></div></div>
    <div class="flex justify-center gap-1.5 text-[30px] mt-1" style="color:#FFE066"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star" style="font-size:40px;margin-top:-8px"></i><i class="fa-solid fa-star"></i></div>
    <div class="text-[76px] font-black num tracking-[-3px] leading-none mt-2">92</div>
    <div class="text-[17px] font-black opacity-95">Super brush, Mia!</div>
    <div class="flex justify-center gap-2 mt-4"><span class="pill glass num"><i class="fa-regular fa-clock"></i>2:06</span><span class="pill glass num"><i class="fa-solid fa-tooth"></i>11/12 zones</span><span class="pill glass"><i class="fa-solid fa-coins" style="color:#FFE066"></i>+30</span></div>
  </div>
</div>
<div class="pad">
  <div class="card p-5 mt-5">
    <div class="flex justify-between items-center"><span class="h2">Tonight's mouth</span><span class="text-[12px] font-bold text-[color:var(--muted)]">tap a zone</span></div>
    <svg id="m" class="w-full mt-1" style="height:240px"></svg>
    <div class="legend justify-center"><span><span class="dot" style="background:var(--green)"></span>Clean</span><span><span class="dot" style="background:var(--amber)"></span>Missed</span><span><span class="dot" style="background:var(--coral)"></span>Too hard</span></div>
  </div>
  <div class="card mt-4">
    <div class="fix"><div class="gicon g-sun"><i class="fa-solid fa-eye-slash"></i></div><div class="flex-1"><div class="font-black text-[15px]">Bottom-left, inside</div><div class="text-[12.5px] font-bold text-[color:var(--muted)]">3 sec · needs about 10</div></div><span class="dot" style="background:var(--amber)"></span></div>
    <div class="fix"><div class="gicon g-hot"><i class="fa-solid fa-hand"></i></div><div class="flex-1"><div class="font-black text-[15px]">Top-right, outside</div><div class="text-[12.5px] font-bold text-[color:var(--muted)]">Pressed hard for 14 sec</div></div><span class="dot" style="background:var(--coral)"></span></div>
  </div>
</div>
</div>
<div class="homebar"></div>
<script>drawMouth('m',['c','c','c','c','o','c'],['m','c','c','c','c','c']);</script>
</div></body></html>
