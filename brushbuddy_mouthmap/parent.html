<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Parent</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.ph{height:180px;border-radius:30px;background-image:url(img/parent.jpg);background-position:center 35%;margin-top:18px}
.grid7{display:grid;grid-template-columns:44px repeat(7,1fr);gap:7px;align-items:center}
.grid7 .c{height:22px;border-radius:7px}
.chart{height:110px;display:flex;align-items:flex-end;gap:10px}
.chart i{flex:1;border-radius:8px 8px 4px 4px;display:block}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="ph img shade absolute left-0 right-0 top-0" style="height:250px;margin:0;border-radius:0 0 34px 34px"></div>
<div class="pad relative" style="z-index:5">
  <div class="flex items-center justify-between mt-3 text-white">
    <div class="flex items-center"><img src="img/kid.jpg" class="av" style="width:40px;height:40px"><div class="av flex items-center justify-center text-[13px] font-black" style="width:40px;height:40px;background:var(--violet);color:#fff">Leo</div><div class="av flex items-center justify-center" style="width:40px;height:40px;background:rgba(255,255,255,.25);backdrop-filter:blur(10px)"><i class="fa-solid fa-plus text-[13px]"></i></div></div>
    <div class="iconbtn glass"><i class="fa-solid fa-bell"></i><span class="badge" style="border-color:transparent">2</span></div>
  </div>
  <div class="text-white mt-12"><div class="meta" style="color:rgba(255,255,255,.75)">Parent view · Mia, 8</div><div class="text-[30px] font-black tracking-tight leading-tight">Good week</div></div>

  <div class="grid grid-cols-3 gap-2.5 mt-7">
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none">12<span class="text-[14px] text-[color:var(--faint)]">/14</span></div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Brushes</div></div>
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none" style="color:var(--green)">94<span class="text-[14px]">%</span></div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Coverage</div></div>
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none" style="color:var(--coral)">3</div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Too hard</div></div>
  </div>

  <div class="card p-4 mt-4">
    <div class="flex justify-between items-center mb-3"><span class="font-black text-[15px]">Morning and night</span><span class="text-[12px] font-bold text-[color:var(--muted)]">M T W T F S S</span></div>
    <div class="grid7">
      <span class="text-[12px] font-black text-[color:var(--muted)]"><i class="fa-solid fa-sun mr-1" style="color:var(--amber)"></i>AM</span>
      <i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--amber)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:#E3EAF1"></i><i class="c" style="background:var(--green)"></i>
      <span class="text-[12px] font-black text-[color:var(--muted)]"><i class="fa-solid fa-moon mr-1" style="color:var(--violet)"></i>PM</span>
      <i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--coral)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:var(--green)"></i><i class="c" style="background:#E3EAF1;border:2px dashed #CBD5E1"></i>
    </div>
  </div>

  <div class="card p-4 mt-4">
    <div class="flex justify-between items-center"><span class="font-black text-[15px]">Coverage, 4 weeks</span><span class="pill" style="background:#DCFCE7;color:#15803D"><i class="fa-solid fa-arrow-trend-up"></i>+18 pts</span></div>
    <div class="chart mt-4"><i style="height:52%;background:#E3EAF1"></i><i style="height:66%;background:#BAE6FD"></i><i style="height:81%;background:#7DD3FC"></i><i style="height:94%;background:var(--grad)"></i></div>
    <div class="flex justify-between text-[11px] font-bold text-[color:var(--faint)] mt-2 px-3"><span>Oct 5</span><span>Oct 12</span><span>Oct 19</span><span>Now</span></div>
  </div>

  <div class="card p-4 mt-4 flex items-center gap-4">
    <div class="gicon g-hot"><i class="fa-solid fa-gauge-high"></i></div>
    <div class="flex-1"><div class="font-black text-[15px]">Pressure alert level</div><div class="text-[12.5px] font-bold text-[color:var(--muted)]">Tuned to Mia: buzz above 2.2 N</div></div>
    <i class="fa-solid fa-chevron-right text-[color:var(--faint)]"></i>
  </div>
</div>
</div>
<div class="tabbar">
  <div class="tab "><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab "><i class="fa-solid fa-tooth"></i>Mouth map</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
  <div class="tab "><i class="fa-solid fa-star"></i>Rewards</div>
  <div class="tab on"><i class="fa-solid fa-user-shield"></i>Parent</div>
</div>
<div class="homebar"></div>
</div></body></html>
