<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Mouth map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.heat rect{transition:none}
.vid{height:150px;border-radius:24px;background-image:url(img/dentist.jpg);background-position:center 35%}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb "><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div><div class="meta">Last 14 brushes</div><div class="h1 mt-1.5">Mia's pattern</div></div><div class="iconbtn"><i class="fa-solid fa-sliders"></i></div></div>
  <div class="flex gap-2 mt-5"><span class="chip on">Missed</span><span class="chip">Too hard</span><span class="chip">Time</span></div>

  <div class="card p-5 mt-4">
    <svg id="m" class="w-full" style="height:250px"></svg>
    <div class="flex items-center gap-3 mt-2"><span class="text-[11.5px] font-bold text-[color:var(--muted)]">Rarely</span><div class="flex-1 h-2.5 rounded-full" style="background:linear-gradient(90deg,#DCFCE7,#FFE8B3,#FFB020)"></div><span class="text-[11.5px] font-bold text-[color:var(--muted)]">Often</span></div>
  </div>

  <div class="card mt-4 p-4 flex items-center gap-4">
    <div class="ring" style="width:62px;height:62px"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" stroke="#EEF4F7" stroke-width="7" fill="none"/><circle cx="31" cy="31" r="26" stroke="#FFB020" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="70"/></svg><span class="font-black text-[16px] num">57%</span></div>
    <div class="flex-1"><div class="font-black text-[15.5px] tracking-tight">Bottom-left, inside</div><div class="text-[12.5px] font-bold text-[color:var(--muted)] mt-0.5">Missed in 8 of 14. Her right hand skips it.</div></div>
  </div>
  <div class="card mt-3 p-4 flex items-center gap-4">
    <div class="gicon g-teal" style="width:52px;height:52px;border-radius:17px;font-size:20px"><i class="fa-solid fa-route"></i></div>
    <div class="flex-1"><div class="font-black text-[15.5px] tracking-tight">New route: start there</div><div class="text-[12.5px] font-bold text-[color:var(--muted)] mt-0.5">Buddy now begins each brush on that zone</div></div>
    <div class="w-12 h-7 rounded-full relative" style="background:var(--teal)"><span class="absolute right-1 top-1 w-5 h-5 rounded-full bg-white"></span></div>
  </div>

  <div class="sec"><div class="h2">Learn the move</div><span class="act">3 clips</span></div>
  <div class="vid img shade flex items-end p-4">
    <div class="absolute inset-0 flex items-center justify-center" style="z-index:3"><div class="play"><i class="fa-solid fa-play"></i></div></div>
    <div class="text-white font-black text-[16px]">Tilt the brush for the inside</div><span class="dur">0:45</span>
  </div>
</div>
</div>
<div class="tabbar">
  <div class="tab "><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab on"><i class="fa-solid fa-tooth"></i>Mouth map</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
  <div class="tab "><i class="fa-solid fa-star"></i>Rewards</div>
  <div class="tab "><i class="fa-solid fa-user-shield"></i>Parent</div>
</div>
<div class="homebar"></div>
<script>
drawMouth('m',['c','c','c','c','c','c'],['c','c','c','c','c','c']);
var heat=[0,1,0,0,2,0, 3,1,0,0,0,2];var cols=[['#DCFCE7','#22C55E'],['#FFF7E0','#FFCB5C'],['#FFE8B3','#FFB020'],['#FFD27A','#E08A00']];
document.querySelectorAll('#m g').forEach(function(g,i){var k=i<12?heat[Math.floor(i/2)]:heat[6+Math.floor((i-12)/2)];var r=g.querySelector('rect');r.setAttribute('fill',cols[k][0]);r.setAttribute('stroke',cols[k][1]);});
</script>
</div></body></html>
