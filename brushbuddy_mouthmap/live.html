<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.glow{position:absolute;width:420px;height:420px;border-radius:50%;left:50%;top:260px;transform:translateX(-50%);background:radial-gradient(circle,rgba(45,212,191,.22) 0%,rgba(45,212,191,0) 65%)}
.gauge{height:14px;border-radius:10px;background:linear-gradient(90deg,#22C55E 0%,#22C55E 55%,#FFB020 70%,#FF5B6E 100%);position:relative}
.knob{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--amber);transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(255,176,32,.25)}
.tile{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:22px}
</style></head>
<body><div class="screen dark">
<div class="glow"></div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad relative">
  <div class="flex items-center justify-between mt-3">
    <div class="iconbtn glass"><i class="fa-solid fa-pause"></i></div>
    <span class="pill glass"><span class="dot pulse" style="background:#2DD4BF"></span>Live · sleeve connected</span>
    <div class="iconbtn glass"><i class="fa-solid fa-volume-high"></i></div>
  </div>

  <div class="text-center mt-7">
    <div class="text-[64px] font-black num tracking-[-2px] leading-none">1:12</div>
    <div class="text-[14px] font-bold text-white/60 mt-1">of 2:00</div>
  </div>

  <div class="relative mt-2">
    <svg id="m" class="w-full" style="height:340px"></svg>
    <div class="absolute" style="left:-6px;top:236px"><span class="pill" style="background:#0FB5A6;color:#fff"><i class="fa-solid fa-hand-point-right"></i>Here now</span></div>
  </div>

  <div class="tile p-4 mt-1">
    <div class="flex items-center justify-between"><span class="font-black text-[15px]"><i class="fa-solid fa-hand mr-2" style="color:var(--amber)"></i>Pressure</span><span class="font-black text-[14px]" style="color:var(--amber)">A bit hard</span></div>
    <div class="gauge mt-4"><div class="knob" style="left:68%"></div></div>
    <div class="flex justify-between text-[11px] font-bold text-white/45 mt-2.5"><span>Gentle</span><span>Mia's normal</span><span>Too hard</span></div>
  </div>

  <div class="grid grid-cols-2 gap-3 mt-3">
    <div class="tile p-4 flex items-center gap-3"><div class="gicon g-green" style="width:40px;height:40px;border-radius:13px;font-size:16px"><i class="fa-solid fa-check"></i></div><div><div class="text-[24px] font-black num leading-none">7<span class="text-[14px] text-white/50">/12</span></div><div class="text-[11.5px] font-bold text-white/55 mt-1">Zones clean</div></div></div>
    <div class="tile p-4 flex items-center gap-3"><div class="gicon g-violet" style="width:40px;height:40px;border-radius:13px;font-size:16px"><i class="fa-solid fa-rotate"></i></div><div><div class="text-[16px] font-black leading-tight">Small circles</div><div class="text-[11.5px] font-bold text-white/55 mt-0.5">Nice rhythm</div></div></div>
  </div>
</div>
<div class="homebar"></div>
<script>drawMouth('m',['c','c','c','c','o','c'],['a','c','n','n','n','n'],true);</script>
</div></body></html>
