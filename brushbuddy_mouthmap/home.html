<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="mouth.js"></script>
<style>
.hero{border-radius:32px;background:var(--grad);margin-top:18px;padding:22px;color:#fff;position:relative;overflow:hidden}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.mini{width:132px;flex:none}
.mini svg{width:132px;height:122px}
</style></head>
<body><div class="screen">
<div class="scroll">
<div class="sb "><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3">
    <div class="flex items-center gap-3"><img src="img/kid.jpg" class="w-12 h-12 rounded-[16px] object-cover"><div><div class="meta">Tuesday night</div><div class="text-[26px] font-black tracking-tight leading-tight">Hi, Mia!</div></div></div>
    <div class="flex gap-2.5"><div class="iconbtn"><i class="fa-solid fa-fire" style="color:#FF8A1F"></i><span class="badge" style="background:#FF8A1F">14</span></div><div class="iconbtn"><i class="fa-solid fa-battery-three-quarters" style="color:var(--green)"></i></div></div>
  </div>

  <div class="hero">
    <div class="blob" style="width:220px;height:220px;right:-70px;top:-80px"></div><div class="blob" style="width:120px;height:120px;right:60px;bottom:-60px"></div>
    <div class="relative flex justify-between items-start">
      <div>
        <span class="pill glass"><i class="fa-solid fa-moon"></i>Bedtime brush</span>
        <div class="text-[30px] font-black tracking-tight leading-[1.05] mt-4">Light up all<br>12 zones</div>
        <div class="text-[14px] font-bold opacity-90 mt-2"><i class="fa-regular fa-clock mr-1"></i>2 min · sleeve ready</div>
      </div>
      <svg id="hm" style="width:130px;height:130px;margin-right:-6px"></svg>
    </div>
    <div class="relative btn sun mt-5"><i class="fa-solid fa-play"></i>Start brushing</div>
  </div>

  <div class="card flex items-center gap-4 p-4 mt-4">
    <div class="gicon g-sun" style="width:52px;height:52px;border-radius:17px;font-size:20px"><i class="fa-solid fa-bullseye"></i></div>
    <div class="flex-1"><div class="meta" style="font-size:10.5px;color:#D98A00">Tonight's mission</div><div class="font-black text-[15.5px] tracking-tight mt-0.5">Bottom-left, inside</div><div class="text-[12.5px] font-bold text-[color:var(--muted)]">Missed 4 of the last 7 nights</div></div>
    <i class="fa-solid fa-chevron-right text-[color:var(--faint)]"></i>
  </div>

  <div class="grid grid-cols-3 gap-2.5 mt-4">
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none">94<span class="text-[14px]">%</span></div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Coverage · 7d</div></div>
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none">2:04</div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Avg time</div></div>
    <div class="card p-3.5"><div class="text-[28px] font-black num leading-none" style="color:var(--coral)">3</div><div class="text-[11.5px] font-bold text-[color:var(--muted)] mt-1.5">Too-hard alerts</div></div>
  </div>

  <div class="sec"><div class="h2">Last brushes</div><span class="act">See all</span></div>
  <div class="hscroll">
    <div class="mini card p-2.5"><svg id="s1"></svg><div class="flex items-center justify-between px-1 mt-1"><span class="font-black text-[13px]">This AM</span><span class="dot" style="background:var(--green)"></span></div></div>
    <div class="mini card p-2.5"><svg id="s2"></svg><div class="flex items-center justify-between px-1 mt-1"><span class="font-black text-[13px]">Mon PM</span><span class="dot" style="background:var(--amber)"></span></div></div>
    <div class="mini card p-2.5"><svg id="s3"></svg><div class="flex items-center justify-between px-1 mt-1"><span class="font-black text-[13px]">Mon AM</span><span class="dot" style="background:var(--coral)"></span></div></div>
  </div>
</div>
</div>
<div class="tabbar">
  <div class="tab on"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab "><i class="fa-solid fa-tooth"></i>Mouth map</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
  <div class="tab "><i class="fa-solid fa-star"></i>Rewards</div>
  <div class="tab "><i class="fa-solid fa-user-shield"></i>Parent</div>
</div>
<div class="homebar"></div>
<script>
drawMouth('hm',['n','n','n','n','n','n'],['n','n','n','n','n','n'],true);
document.querySelectorAll('#hm rect').forEach(function(r){r.setAttribute('fill','rgba(255,255,255,.22)');r.setAttribute('stroke','rgba(255,255,255,.85)')});
drawMouth('s1',['c','c','c','c','c','c'],['c','c','c','c','c','c']);
drawMouth('s2',['c','c','c','c','c','c'],['m','c','c','c','c','c']);
drawMouth('s3',['c','o','c','c','c','c'],['m','c','c','c','o','c']);
</script>
</div></body></html>
