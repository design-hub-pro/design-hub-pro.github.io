<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitCrew · Mentor thread</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.hd{background:rgba(255,255,255,.94);border-bottom:1px solid var(--border)}
.msg{max-width:300px;border-radius:22px;padding:12px 15px;font-size:14.5px;font-weight:500;line-height:1.42}
.them{background:#fff;border:1px solid var(--border);border-bottom-left-radius:7px}
.me{background:var(--ink);color:#fff;border-bottom-right-radius:7px;margin-left:auto}
.anno{width:286px;height:190px;border-radius:22px;background:url(img/hero.jpg) 40% 30%/cover;position:relative;overflow:hidden}
.anno svg{position:absolute;inset:0;z-index:3}
.wave{display:flex;align-items:center;gap:2.5px;height:28px}
.wave i{width:3px;border-radius:2px;background:#FF5A1F}
.input{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:rgba(255,255,255,.95);border-top:1px solid var(--border);z-index:40;backdrop-filter:blur(18px)}
.solved{border-radius:22px;background:linear-gradient(135deg,#E3F7F4,#F2FBF9);border:1px solid #BDEDE5;padding:14px;display:flex;align-items:center;gap:12px}
</style></head>
<body><div class="screen">
  <div class="hd relative z-30">
    <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
    <div class="pad flex items-center gap-3 py-3">
      <i class="fa-solid fa-chevron-left text-[18px] text-[color:var(--ink2)]"></i>
      <div class="relative"><img src="img/mentor.jpg" class="w-11 h-11 rounded-[15px] object-cover"><span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-[#16A34A] border-2 border-white"></span></div>
      <div class="flex-1"><div class="font-bold text-[16px]">Darren Lim</div><div class="text-[12px] font-semibold text-[color:var(--muted)]">Mentor · Claw · #pneumatics</div></div>
      <div class="iconbtn !w-10 !h-10 !rounded-xl"><i class="fa-solid fa-video"></i></div>
    </div>
  </div>

  <div class="pad pt-5 space-y-3.5">
    <div class="text-center"><span class="tag t-gray !text-[11px]">Question posted · 9:12 AM</span></div>

    <div class="msg them">Watched it. Look at 0:03. Your tube pinches right where the arm bends.</div>

    <div class="anno">
      <svg viewBox="0 0 286 190"><circle cx="138" cy="86" r="34" fill="none" stroke="#FF5A1F" stroke-width="4" stroke-dasharray="8 6"/><path d="M190 46 C 178 56, 172 62, 166 70" fill="none" stroke="#FFA41B" stroke-width="4" stroke-linecap="round"/><path d="M160 66 L167 70 L 168 61" fill="none" stroke="#FFA41B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="pill dark absolute left-3 bottom-3 z-10 mono">0:03.1</span>
      <span class="pill absolute right-3 top-3 z-10" style="background:#FF5A1F;color:#fff">Kink here</span>
    </div>

    <div class="msg them !py-2.5 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full g-orange flex items-center justify-center flex-none"><i class="fa-solid fa-play text-white text-[12px] ml-0.5"></i></div>
      <div class="wave"><i style="height:10px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:28px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:16px"></i><i style="height:24px"></i><i style="height:10px;background:#D7DBE3"></i><i style="height:18px;background:#D7DBE3"></i><i style="height:12px;background:#D7DBE3"></i><i style="height:20px;background:#D7DBE3"></i><i style="height:8px;background:#D7DBE3"></i></div>
      <span class="text-[12px] font-bold text-[color:var(--muted)] mono">0:38</span>
    </div>

    <div class="msg me">Added a slack loop. Re-filmed it. 5 for 5 lifts!</div>

    <div class="solved">
      <div class="gicon g-teal !w-11 !h-11 !rounded-xl"><i class="fa-solid fa-check"></i></div>
      <div class="flex-1"><div class="font-bold text-[14.5px]">Fixed in <span class="num">38</span> min</div><div class="text-[12px] font-semibold text-[color:#0B8579]">Re-film confirmed · added to Playbook</div></div>
      <div class="avs"><img src="img/student.jpg"><img src="img/mentor.jpg"></div>
    </div>
  </div>

  <div class="input">
    <div class="flex gap-2 mb-3">
      <span class="chip !py-2 !text-[12.5px]"><i class="fa-solid fa-star text-[#FFA41B]"></i>Thank Darren</span>
      <span class="chip !py-2 !text-[12.5px]"><i class="fa-solid fa-share-nodes"></i>Share fix</span>
    </div>
    <div class="flex items-center gap-2.5">
      <div class="iconbtn !rounded-full"><i class="fa-solid fa-video" style="color:#FF5A1F"></i></div>
      <div class="flex-1 h-11 rounded-full bg-[color:var(--surface)] px-4 flex items-center text-[14px] text-[color:var(--faint)] font-medium">Message</div>
      <div class="w-11 h-11 rounded-full g-orange flex items-center justify-center text-white"><i class="fa-solid fa-microphone"></i></div>
    </div>
  </div>
  <div class="homebar"></div>
</div></body></html>
