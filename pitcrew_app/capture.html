<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitCrew · Capture</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.view{position:absolute;inset:0;background:url(img/hero.jpg) center 45%/cover}
.view:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,14,.55) 0%,rgba(7,9,14,0) 20%,rgba(7,9,14,0) 58%,rgba(7,9,14,.92) 82%)}
.grid3x3{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:33.33% 33.33%;z-index:2}
.shutter{width:86px;height:86px;position:relative}
.shutter .core{position:absolute;inset:18px;border-radius:10px;background:#FF3B30}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.25)}
.seg i.f{background:#FF5A1F}
.mode{font-size:13px;font-weight:700;color:rgba(255,255,255,.5)}
.mode.on{color:#FFA41B}
</style></head>
<body><div class="screen dark">
  <div class="view"></div>
  <div class="grid3x3"></div>
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

  <div class="pad relative z-10 mt-3">
    <div class="seg"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></div>
    <div class="flex items-center justify-between mt-4">
      <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
      <span class="pill dark !text-[14px] !px-4 !py-2"><span class="live rec"></span><span class="num mono">00:07</span></span>
      <div class="iconbtn glass"><i class="fa-solid fa-bolt"></i></div>
    </div>
  </div>

  <!-- live detection -->
  <div class="box o" style="left:120px;top:300px;width:150px;height:150px"><b><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Claw · tracking</b></div>
  <div class="absolute z-10" style="left:180px;top:466px">
    <span class="pill dark"><i class="fa-solid fa-gauge-high text-[#FFA41B]"></i>Grip loosening</span>
  </div>

  <div class="absolute left-0 right-0 z-10 pad" style="bottom:250px">
    <div class="flex gap-2 justify-center">
      <span class="pill glass"><i class="fa-solid fa-crosshairs"></i>Keep robot in frame</span>
      <span class="pill glass"><i class="fa-solid fa-sun"></i>Light OK</span>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-0 z-10 pad pb-12">
    <div class="meta !text-white/50 text-center mb-3">What should we watch?</div>
    <div class="hscroll justify-center !mx-0 !px-0">
      <span class="chip !bg-white/10 !border-white/20 !text-white/80"><i class="fa-solid fa-wand-magic-sparkles"></i>Auto</span>
      <span class="chip on !bg-white !text-[color:var(--ink)]"><i class="fa-solid fa-hand-holding"></i>Claw</span>
      <span class="chip !bg-white/10 !border-white/20 !text-white/80"><i class="fa-solid fa-car-side"></i>Drive</span>
      <span class="chip !bg-white/10 !border-white/20 !text-white/80"><i class="fa-solid fa-arrow-up"></i>Lift</span>
    </div>
    <div class="flex items-center justify-between mt-7 px-3">
      <div class="w-[54px] h-[54px] rounded-[16px] img border-2 border-white/70" style="background-image:url(img/drive.jpg)"></div>
      <div class="shutter ring">
        <svg viewBox="0 0 86 86" width="86" height="86"><circle cx="43" cy="43" r="39" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="5"/><circle cx="43" cy="43" r="39" fill="none" stroke="#FF5A1F" stroke-width="5" stroke-linecap="round" stroke-dasharray="245" stroke-dashoffset="73.5"/></svg>
        <div class="core"></div>
      </div>
      <div class="iconbtn glass !w-[54px] !h-[54px] !rounded-full"><i class="fa-solid fa-camera-rotate"></i></div>
    </div>
    <div class="flex justify-center gap-6 mt-5"><span class="mode">Upload</span><span class="mode on">10s clip</span><span class="mode">Slo-mo</span></div>
  </div>
  <div class="homebar light"></div>
</div></body></html>
