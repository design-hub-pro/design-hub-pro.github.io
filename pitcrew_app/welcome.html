<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitCrew · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.bgimg{position:absolute;inset:0;background:url(img/hero.jpg) center 40%/cover}
.bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,14,.35) 0%,rgba(7,9,14,0) 22%,rgba(7,9,14,.25) 45%,rgba(7,9,14,.94) 72%,#07090E 100%)}
.scan{position:absolute;left:96px;top:210px;width:250px;height:330px;z-index:3}
.corner{position:absolute;width:30px;height:30px;border:3px solid #FF5A1F}
.c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.line{position:absolute;left:8px;right:8px;top:46%;height:2px;background:linear-gradient(90deg,transparent,#FFA41B,transparent);box-shadow:0 0 14px #FF5A1F}
.code{display:flex;gap:8px}
.code div{flex:1;height:58px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
.code div.f{border-color:#FF5A1F;box-shadow:0 0 0 4px rgba(255,90,31,.22)}
</style></head>
<body><div class="screen dark">
  <div class="bgimg"></div>
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

  <div class="pad relative z-10 flex items-center gap-2.5 mt-4">
    <div class="w-10 h-10 rounded-xl g-orange flex items-center justify-center"><i class="fa-solid fa-screwdriver-wrench text-white"></i></div>
    <span class="text-white text-[20px] font-extrabold tracking-tight">PitCrew</span>
  </div>

  <div class="scan">
    <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
    <div class="line"></div>
    <span class="pill dark absolute -top-4 left-1/2 -translate-x-1/2"><span class="live rec"></span><span class="num">0:07</span> / 0:10</span>
  </div>
  <div class="box o" style="left:130px;top:268px;width:100px;height:96px"><b>Claw</b></div>
  <div class="box b" style="left:112px;top:470px;width:200px;height:72px"><b>Drivetrain</b></div>

  <div class="absolute left-0 right-0 bottom-0 pad pb-12 z-10 text-white">
    <div class="text-[40px] font-extrabold tracking-[-1.6px] leading-[1.02]">Film it for 10s.<br><span style="background:var(--grad);-webkit-background-clip:text;color:transparent">We'll find the fix.</span></div>
    <p class="text-[15.5px] text-white/70 font-medium mt-3.5">AI spots the subsystem, the community has the playbook, a mentor finishes the job.</p>

    <div class="meta !text-white/50 mt-7 mb-2.5">Your VEX team number</div>
    <div class="code mono">
      <div>8</div><div>1</div><div>0</div><div>2</div><div>4</div><div class="f text-[#FFA41B]">A</div>
    </div>

    <div class="btn mt-5">Join your pit crew<i class="fa-solid fa-arrow-right"></i></div>
    <div class="flex items-center justify-center gap-3 mt-5">
      <div class="avs"><img src="img/mentor.jpg"><img src="img/student.jpg"><img src="img/team.jpg"></div>
      <span class="text-[13px] text-white/60 font-semibold">I'm a mentor instead</span>
    </div>
  </div>
  <div class="homebar light"></div>
</div></body></html>
