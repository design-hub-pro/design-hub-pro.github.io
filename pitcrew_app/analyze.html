<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitCrew · Analyzing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.frame{height:372px;border-radius:28px;background:url(img/hero.jpg) center 55%/cover;position:relative;overflow:hidden;margin-top:16px}
.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,14,.25),rgba(7,9,14,0) 30%,rgba(7,9,14,0) 70%,rgba(7,9,14,.6))}
.sweep{position:absolute;top:0;bottom:0;left:62%;width:3px;background:#FFA41B;box-shadow:0 0 18px 4px rgba(255,90,31,.7);z-index:5}
.tl{position:relative;height:56px;border-radius:14px;overflow:hidden;display:flex}
.tl div{flex:1;background-size:cover;background-position:center}
.tl:after{content:"";position:absolute;inset:0;background:rgba(16,21,33,.35)}
.flag{position:absolute;top:-6px;bottom:-6px;width:3px;border-radius:2px;z-index:3}
.step{display:flex;align-items:center;gap:13px;padding:13px 0}
.step + .step{border-top:1px solid var(--border)}
.ck{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <span class="pill" style="background:#FFF0E8;color:#D9440F"><i class="fa-solid fa-wand-magic-sparkles"></i>AI is watching</span>
      <div class="iconbtn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>

    <div class="frame">
      <div class="sweep"></div>
      <div class="box o" style="left:150px;top:88px;width:120px;height:112px"><b>Claw · 91%</b></div>
      <div class="box b" style="left:155px;top:240px;width:215px;height:95px"><b>Drivetrain · 96%</b></div>
      <div class="box t" style="left:212px;top:22px;width:92px;height:250px;border-style:dashed"><b>Lift · 88%</b></div>
      <div class="absolute left-4 bottom-4 z-10 flex gap-2">
        <span class="pill dark mono"><span class="num">0:06.2</span></span>
        <span class="pill dark"><i class="fa-solid fa-cubes"></i>3 subsystems</span>
      </div>
    </div>

    <div class="mt-5">
      <div class="flex justify-between items-end mb-2.5">
        <div class="h2">Moments flagged</div>
        <span class="text-[13px] font-bold text-[color:var(--muted)] mono num">10.0s</span>
      </div>
      <div class="relative">
        <div class="tl"><div style="background-image:url(img/hero.jpg)"></div><div style="background-image:url(img/lift.jpg)"></div><div style="background-image:url(img/intake.jpg)"></div><div style="background-image:url(img/hero.jpg)"></div><div style="background-image:url(img/lift.jpg)"></div><div style="background-image:url(img/drive.jpg)"></div></div>
        <span class="flag" style="left:31%;background:#FF5A1F"></span>
        <span class="flag" style="left:68%;background:#FF5A1F"></span>
        <span class="flag" style="left:84%;background:#FFA41B"></span>
        <span class="flag" style="left:62%;background:#fff;width:2px;top:-10px;bottom:-10px;box-shadow:0 0 0 2px var(--ink)"></span>
      </div>
      <div class="flex gap-4 mt-3.5">
        <span class="flex items-center gap-1.5 text-[12.5px] font-semibold text-[color:var(--muted)]"><span class="dot" style="background:#FF5A1F"></span>Claw slips</span>
        <span class="flex items-center gap-1.5 text-[12.5px] font-semibold text-[color:var(--muted)]"><span class="dot" style="background:#FFA41B"></span>Arm sags</span>
      </div>
    </div>

    <div class="card px-5 py-1.5 mt-5">
      <div class="step"><div class="ck g-teal"><i class="fa-solid fa-check text-white"></i></div><span class="font-semibold text-[15px] flex-1">Found the subsystems</span><span class="text-[12.5px] font-bold text-[color:var(--muted)] num">1.2s</span></div>
      <div class="step"><div class="ck g-teal"><i class="fa-solid fa-check text-white"></i></div><span class="font-semibold text-[15px] flex-1">Tracked motion frame by frame</span><span class="text-[12.5px] font-bold text-[color:var(--muted)] num">3.8s</span></div>
      <div class="step"><div class="ck" style="background:#FFF0E8"><i class="fa-solid fa-circle-notch fa-spin" style="color:#FF5A1F"></i></div><span class="font-semibold text-[15px] flex-1">Matching 2,140 playbook fixes</span><span class="text-[12.5px] font-bold" style="color:#FF5A1F">62%</span></div>
      <div class="step opacity-40"><div class="ck" style="background:var(--surface)"><i class="fa-solid fa-user-graduate text-[color:var(--muted)]"></i></div><span class="font-semibold text-[15px] flex-1">Drafting your mentor question</span></div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
