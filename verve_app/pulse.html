<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verve — Pulse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  *::-webkit-scrollbar{display:none;}
  html,body{height:100%;}
  body{background:#000;color:#fff;scrollbar-width:none;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden;}
  .statusbar{position:absolute;top:0;left:0;right:0;z-index:40;height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#fff;}
  .statusbar .time{font-size:15px;font-weight:700;}
  .statusbar .icons{display:flex;gap:7px;font-size:14px;}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:35px;background:#000;border-radius:20px;}
  .reel{position:absolute;inset:0;}
  .tabbar{position:absolute;bottom:0;left:0;right:0;z-index:40;height:92px;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);display:flex;justify-content:space-around;align-items:flex-start;padding-top:14px;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:rgba(255,255,255,0.55);width:56px;}
  .tab i{font-size:19px;}
  .tab.active{color:#fff;}
  .tab-center{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;}
  .tab-center .fab{width:50px;height:50px;border-radius:18px;background:linear-gradient(135deg,#FF5A3C,#FF8A3D);display:flex;align-items:center;justify-content:center;margin-top:-14px;box-shadow:0 8px 24px rgba(255,90,60,0.6);}
  .tab-center .fab i{font-size:20px;color:#fff;}
  .tab-center span{font-size:10px;font-weight:700;color:#fff;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .disc{animation:spin 5s linear infinite;}
</style>
</head>
<body>
<!-- Full-bleed video -->
<div class="reel">
  <img src="https://images.unsplash.com/photo-1483721310020-03333e577078?w=900&h=1600&fit=crop" class="w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(to top,rgba(0,0,0,0.85) 2%,rgba(0,0,0,0.05) 38%,rgba(0,0,0,0.1) 70%,rgba(0,0,0,0.45));"></div>
</div>

<!-- Status bar -->
<div class="statusbar">
  <span class="time">9:41</span>
  <div class="island"></div>
  <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
</div>

<!-- Top toggle -->
<div class="absolute top-[64px] left-0 right-0 z-30 flex items-center justify-center gap-6">
  <span class="text-white/60 text-[15px] font-semibold">Following</span>
  <span class="text-white text-[15px] font-extrabold relative">For You<span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-6 h-0.5 bg-white rounded-full"></span></span>
  <i class="fas fa-magnifying-glass absolute right-7 text-white text-lg"></i>
</div>

<!-- Right action rail -->
<div class="absolute right-4 bottom-[150px] z-30 flex flex-col items-center gap-6">
  <div class="relative mb-1">
    <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=120&h=120&fit=crop&crop=face" class="w-12 h-12 rounded-full object-cover border-2 border-white">
    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FF5A3C,#FF8A3D);"><i class="fas fa-plus text-white text-[10px]"></i></div>
  </div>
  <button class="flex flex-col items-center gap-1"><i class="fas fa-heart text-3xl" style="color:#FF3D6E;"></i><span class="text-xs font-semibold">24.5k</span></button>
  <button class="flex flex-col items-center gap-1"><i class="fas fa-comment-dots text-3xl"></i><span class="text-xs font-semibold">312</span></button>
  <button class="flex flex-col items-center gap-1"><i class="fas fa-bookmark text-3xl"></i><span class="text-xs font-semibold">Save</span></button>
  <button class="flex flex-col items-center gap-1"><i class="fas fa-share text-3xl"></i><span class="text-xs font-semibold">1.2k</span></button>
  <div class="w-11 h-11 rounded-full disc flex items-center justify-center" style="background:linear-gradient(135deg,#2A1E3A,#000);border:3px solid #111;"><img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=60&h=60&fit=crop&crop=face" class="w-6 h-6 rounded-full object-cover"></div>
</div>

<!-- Bottom info -->
<div class="absolute left-0 right-0 bottom-[104px] z-30 px-7" style="padding-right:90px;">
  <span class="inline-flex items-center gap-1.5 bg-white/15 backdrop-blur px-3 py-1 rounded-full text-[11px] font-bold mb-3"><i class="fas fa-fire text-orange-400"></i> Tough Love</span>
  <div class="flex items-center gap-2 mb-2">
    <span class="font-extrabold text-[16px]">@coach_reyes</span>
    <span class="w-5 h-5 rounded-full bg-sky-500 flex items-center justify-center"><i class="fas fa-check text-[9px]"></i></span>
  </div>
  <p class="text-[15px] font-semibold leading-snug mb-2">Day 12. Didn't want to. Did it anyway. That's the whole secret. 🔥</p>
  <p class="text-white/70 text-[13px] mb-3">#ToughLove #Day12 #NoExcuses #ShowUp</p>
  <div class="flex items-center gap-2 text-[13px]"><i class="fas fa-music text-xs"></i><span class="font-medium">Original sound — Verve Pulse</span></div>
</div>

<!-- swipe hint -->
<div class="absolute right-6 bottom-[122px] z-20 text-white/40 text-[10px] flex flex-col items-center gap-1"><i class="fas fa-chevron-up"></i></div>

<!-- progress -->
<div class="absolute bottom-[100px] left-0 right-0 z-40 px-2"><div class="h-0.5 bg-white/25 rounded-full"><div class="h-full w-2/5 bg-white rounded-full"></div></div></div>

<!-- Tab bar -->
<div class="tabbar">
  <div class="tab"><i class="fas fa-bolt"></i><span>Today</span></div>
  <div class="tab"><i class="fas fa-person-running"></i><span>Move</span></div>
  <div class="tab-center"><div class="fab"><i class="fas fa-fire"></i></div><span>Pulse</span></div>
  <div class="tab"><i class="fas fa-utensils"></i><span>Fuel</span></div>
  <div class="tab"><i class="fas fa-users"></i><span>Circle</span></div>
</div>
</body>
</html>
