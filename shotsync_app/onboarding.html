<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotSync - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <div class="w-full h-full relative overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=900&h=1600&fit=crop" class="w-full h-full object-cover" alt="Basketball Court">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-black/20"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative z-10 flex justify-between items-center px-7 pt-4" style="height:59px;">
            <span class="text-white text-sm font-semibold">9:41</span>
            <div class="w-28 h-7 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-white text-xs"></i>
                <i class="fas fa-wifi text-white text-xs"></i>
                <i class="fas fa-battery-full text-white text-xs"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="relative z-10 flex flex-col h-full px-7" style="padding-top: 140px;">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center shadow-lg shadow-orange-500/30">
                    <i class="fas fa-basketball text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-white text-3xl font-black tracking-tight">ShotSync</h1>
                    <p class="text-orange-400 text-xs font-semibold tracking-widest uppercase">AI Shooting Coach</p>
                </div>
            </div>

            <!-- Tagline -->
            <h2 class="text-white text-4xl font-extrabold leading-tight mt-4">
                Track Every<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">Shot.</span><br>
                Elevate Your<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">Game.</span>
            </h2>

            <p class="text-gray-400 text-base mt-5 leading-relaxed">
                Computer vision powered shooting analysis. Real-time tracking, instant feedback, smarter training.
            </p>

            <!-- Stats Preview -->
            <div class="flex gap-6 mt-8">
                <div>
                    <p class="text-white text-2xl font-bold">98%</p>
                    <p class="text-gray-500 text-xs">Tracking Accuracy</p>
                </div>
                <div class="w-px bg-gray-700"></div>
                <div>
                    <p class="text-white text-2xl font-bold">50K+</p>
                    <p class="text-gray-500 text-xs">Shots Analyzed</p>
                </div>
                <div class="w-px bg-gray-700"></div>
                <div>
                    <p class="text-white text-2xl font-bold">AI</p>
                    <p class="text-gray-500 text-xs">Smart Coaching</p>
                </div>
            </div>

            <!-- Spacer -->
            <div class="flex-1"></div>

            <!-- CTA Buttons -->
            <div class="pb-12">
                <button class="w-full py-4 rounded-2xl bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold text-lg shadow-lg shadow-orange-500/30 mb-3">
                    Get Started
                </button>
                <button class="w-full py-4 rounded-2xl border border-gray-700 text-gray-300 font-semibold text-base">
                    I Already Have an Account
                </button>
            </div>
        </div>
    </div>
</body>
</html>
