<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotSync MVP - Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; background: #0a0a0a; }
        @keyframes check-pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="w-full min-h-full relative pb-10">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-7 pt-4" style="height:59px;">
            <span class="text-white text-sm font-semibold">9:41</span>
            <div class="w-28 h-7 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-white text-xs"></i>
                <i class="fas fa-wifi text-white text-xs"></i>
                <i class="fas fa-battery-full text-white text-xs"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="px-7 pt-4 pb-2">
            <div class="flex items-center justify-between">
                <button class="text-gray-400"><i class="fas fa-arrow-left text-lg"></i></button>
                <h2 class="text-white text-base font-bold">Share & Export</h2>
                <button class="text-gray-400"><i class="fas fa-times text-lg"></i></button>
            </div>
        </div>

        <!-- Success State -->
        <div class="flex flex-col items-center mt-6 px-7">
            <div class="w-20 h-20 rounded-full bg-green-500/20 border-2 border-green-500/30 flex items-center justify-center" style="animation: check-pop 0.5s ease-out;">
                <i class="fas fa-check text-green-500 text-3xl"></i>
            </div>
            <h2 class="text-white text-xl font-bold mt-4">Reel Ready!</h2>
            <p class="text-gray-500 text-sm mt-1">32 seconds · 6 clips · 720p</p>
        </div>

        <!-- Preview -->
        <div class="px-7 mt-6">
            <div class="relative rounded-2xl overflow-hidden h-44">
                <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800&h=400&fit=crop" class="w-full h-full object-cover" alt="Reel Preview">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center border border-white/30">
                        <i class="fas fa-play text-white text-lg ml-0.5"></i>
                    </div>
                </div>
                <!-- Stats overlay -->
                <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="bg-orange-500 px-2 py-0.5 rounded-full">
                            <span class="text-white text-[9px] font-bold">71% ACC</span>
                        </div>
                        <div class="bg-black/60 px-2 py-0.5 rounded-full">
                            <span class="text-white text-[9px] font-semibold">13/18</span>
                        </div>
                    </div>
                    <div class="bg-black/60 px-2 py-0.5 rounded-full">
                        <span class="text-white text-[9px] font-semibold">0:32</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Share Options -->
        <div class="px-7 mt-6">
            <h3 class="text-white text-sm font-bold mb-3">Share To</h3>
            <div class="grid grid-cols-4 gap-4">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center">
                        <i class="fab fa-instagram text-white text-xl"></i>
                    </div>
                    <span class="text-gray-400 text-[10px]">Reels</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 rounded-2xl bg-black border border-gray-700 flex items-center justify-center">
                        <i class="fab fa-tiktok text-white text-xl"></i>
                    </div>
                    <span class="text-gray-400 text-[10px]">TikTok</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
                        <i class="fab fa-twitter text-white text-xl"></i>
                    </div>
                    <span class="text-gray-400 text-[10px]">Twitter</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 rounded-2xl bg-green-600 flex items-center justify-center">
                        <i class="fab fa-whatsapp text-white text-xl"></i>
                    </div>
                    <span class="text-gray-400 text-[10px]">WhatsApp</span>
                </div>
            </div>
        </div>

        <!-- Export Options -->
        <div class="px-7 mt-6">
            <h3 class="text-white text-sm font-bold mb-3">Export</h3>
            <div class="space-y-3">
                <button class="w-full bg-gray-900 rounded-2xl p-4 border border-gray-800 flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-blue-500/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-download text-blue-400 text-sm"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-white text-sm font-semibold">Save to Camera Roll</p>
                        <p class="text-gray-500 text-xs">720p MP4 · 4.2 MB</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </button>

                <button class="w-full bg-gray-900 rounded-2xl p-4 border border-gray-800 flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-purple-500/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-link text-purple-400 text-sm"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-white text-sm font-semibold">Copy Share Link</p>
                        <p class="text-gray-500 text-xs">Anyone with link can view</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </button>

                <button class="w-full bg-gray-900 rounded-2xl p-4 border border-gray-800 flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-green-500/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-file-export text-green-400 text-sm"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-white text-sm font-semibold">Export Individual Clips</p>
                        <p class="text-gray-500 text-xs">6 separate clips · ZIP download</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-600 text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Stats Card for Sharing -->
        <div class="px-7 mt-6">
            <div class="bg-gradient-to-br from-orange-500/10 to-red-600/10 rounded-2xl p-4 border border-orange-500/20">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-image text-orange-500 text-sm"></i>
                    <span class="text-white text-sm font-bold">Share Stats Card</span>
                </div>
                <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center">
                            <i class="fas fa-basketball text-white text-xs"></i>
                        </div>
                        <div>
                            <p class="text-white text-xs font-bold">ShotSync Session</p>
                            <p class="text-gray-500 text-[10px]">Today · 8 min</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div>
                            <p class="text-lg font-black text-orange-500">71%</p>
                            <p class="text-gray-600 text-[9px]">Accuracy</p>
                        </div>
                        <div>
                            <p class="text-lg font-black text-white">13/18</p>
                            <p class="text-gray-600 text-[9px]">Makes</p>
                        </div>
                        <div>
                            <p class="text-lg font-black text-green-500">5</p>
                            <p class="text-gray-600 text-[9px]">Streak</p>
                        </div>
                    </div>
                </div>
                <button class="w-full mt-3 py-2.5 rounded-xl border border-orange-500/30 text-orange-500 text-xs font-semibold">
                    <i class="fas fa-share mr-1"></i> Share Stats Image
                </button>
            </div>
        </div>

        <!-- Done -->
        <div class="px-7 mt-6 pb-6">
            <button class="w-full py-3.5 rounded-2xl bg-gray-800 text-white font-semibold text-sm flex items-center justify-center gap-2">
                <i class="fas fa-home"></i> Back to Home
            </button>
        </div>
    </div>
</body>
</html>
