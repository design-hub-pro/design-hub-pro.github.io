<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotSync MVP - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; background: #0a0a0a; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
            50% { box-shadow: 0 0 40px rgba(249, 115, 22, 0.6); }
        }
    </style>
</head>
<body>
    <div class="w-full min-h-full relative pb-24">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-7 pt-4" style="height:59px;">
            <span class="text-white text-sm font-semibold">9:41</span>
            <div class="w-28 h-7 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-white text-xs"></i>
                <i class="fas fa-wifi text-white text-xs"></i>
                <i class="fas fa-battery-full text-white text-xs"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="px-7 pt-4 pb-3">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-500 text-sm">Good Morning</p>
                    <h1 class="text-white text-2xl font-bold">Marcus</h1>
                </div>
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop&crop=face" class="w-10 h-10 rounded-full object-cover ring-2 ring-orange-500" alt="Profile">
            </div>
        </div>

        <!-- Big Record Button -->
        <div class="px-7 mt-6 flex flex-col items-center">
            <div class="relative">
                <button class="w-40 h-40 rounded-full bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center" style="animation: pulse-glow 2s ease-in-out infinite;">
                    <i class="fas fa-video text-white text-4xl"></i>
                </button>
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-black/80 backdrop-blur px-4 py-1.5 rounded-full border border-gray-700">
                    <span class="text-white text-xs font-semibold">Tap to Record</span>
                </div>
            </div>
            <p class="text-gray-500 text-sm mt-8">Point your phone at the hoop & start shooting</p>
        </div>

        <!-- Last Session Card -->
        <div class="px-7 mt-10">
            <h3 class="text-white text-base font-bold mb-3">Last Session</h3>
            <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <p class="text-white text-sm font-semibold">Three-Point Practice</p>
                        <p class="text-gray-500 text-xs mt-0.5">Today, 8:30 AM · 25 min</p>
                    </div>
                    <div class="bg-green-500/10 border border-green-500/20 rounded-xl px-3 py-1.5">
                        <p class="text-green-500 text-lg font-black">71%</p>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="text-center">
                        <p class="text-2xl font-black text-white">48</p>
                        <p class="text-gray-500 text-[10px] uppercase tracking-wider">Shots</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-black text-green-500">34</p>
                        <p class="text-gray-500 text-[10px] uppercase tracking-wider">Makes</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-black text-orange-500">6</p>
                        <p class="text-gray-500 text-[10px] uppercase tracking-wider">Streak</p>
                    </div>
                </div>
                <!-- Mini highlight strip -->
                <div class="mt-4 flex items-center gap-2">
                    <div class="flex-1 h-px bg-gray-800"></div>
                    <span class="text-gray-600 text-[10px] uppercase tracking-wider">Highlights Ready</span>
                    <div class="flex-1 h-px bg-gray-800"></div>
                </div>
                <div class="flex gap-2 mt-3">
                    <div class="flex-1 h-16 rounded-lg overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?w=200&h=120&fit=crop" class="w-full h-full object-cover" alt="Clip">
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                            <i class="fas fa-play text-white text-[8px]"></i>
                        </div>
                    </div>
                    <div class="flex-1 h-16 rounded-lg overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1519861531473-9200262188bf?w=200&h=120&fit=crop" class="w-full h-full object-cover" alt="Clip">
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                            <i class="fas fa-play text-white text-[8px]"></i>
                        </div>
                    </div>
                    <div class="flex-1 h-16 rounded-lg overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1515523110800-9415d13b84a8?w=200&h=120&fit=crop" class="w-full h-full object-cover" alt="Clip">
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                            <i class="fas fa-play text-white text-[8px]"></i>
                        </div>
                    </div>
                    <div class="w-16 h-16 rounded-lg bg-gray-800 flex items-center justify-center">
                        <span class="text-gray-400 text-xs font-bold">+5</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="px-7 mt-6">
            <h3 class="text-white text-base font-bold mb-3">This Week</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-900 rounded-2xl p-4 border border-gray-800">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-orange-500/20 flex items-center justify-center">
                            <i class="fas fa-basketball text-orange-500 text-xs"></i>
                        </div>
                        <span class="text-gray-400 text-xs">Total Shots</span>
                    </div>
                    <p class="text-2xl font-black text-white">186</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-4 border border-gray-800">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-green-500/20 flex items-center justify-center">
                            <i class="fas fa-bullseye text-green-500 text-xs"></i>
                        </div>
                        <span class="text-gray-400 text-xs">Avg Accuracy</span>
                    </div>
                    <p class="text-2xl font-black text-white">67%</p>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-xl border-t border-gray-800 px-4 py-2 pb-7">
            <div class="flex justify-around items-center">
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-home text-orange-500 text-lg"></i>
                    <span class="text-orange-500 text-[10px] font-semibold">Home</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-chart-bar text-gray-600 text-lg"></i>
                    <span class="text-gray-600 text-[10px]">Stats</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-clapperboard text-gray-600 text-lg"></i>
                    <span class="text-gray-600 text-[10px]">Highlights</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
