<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotSync - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow: hidden; background: #000; }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        @keyframes scan-line {
            0% { top: 20%; }
            50% { top: 70%; }
            100% { top: 20%; }
        }
        .tracking-box {
            border: 2px solid #f97316;
            border-radius: 8px;
            position: absolute;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }
        .tracking-box::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px;
            width: 12px; height: 12px;
            border-top: 3px solid #f97316;
            border-left: 3px solid #f97316;
            border-radius: 2px 0 0 0;
        }
        .tracking-box::after {
            content: '';
            position: absolute;
            top: -6px; right: -6px;
            width: 12px; height: 12px;
            border-top: 3px solid #f97316;
            border-right: 3px solid #f97316;
            border-radius: 0 2px 0 0;
        }
    </style>
</head>
<body>
    <div class="w-full h-full relative overflow-hidden">
        <!-- Camera View Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1519861531473-9200262188bf?w=900&h=1600&fit=crop" class="w-full h-full object-cover" alt="Basketball">
            <div class="absolute inset-0 bg-black/20"></div>
        </div>

        <!-- CV Scan Line -->
        <div class="absolute left-0 right-0 h-px bg-gradient-to-r from-transparent via-orange-500 to-transparent opacity-60" style="animation: scan-line 3s ease-in-out infinite; top: 40%;">
        </div>

        <!-- Tracking Boxes -->
        <!-- Hoop tracking -->
        <div class="tracking-box" style="top: 22%; left: 28%; width: 100px; height: 60px;">
            <span class="absolute -top-5 left-0 text-orange-400 text-[10px] font-bold bg-black/60 px-1.5 py-0.5 rounded">HOOP</span>
        </div>
        <!-- Ball tracking -->
        <div class="tracking-box" style="top: 42%; left: 52%; width: 50px; height: 50px; border-color: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);">
            <span class="absolute -top-5 left-0 text-green-400 text-[10px] font-bold bg-black/60 px-1.5 py-0.5 rounded">BALL</span>
        </div>
        <!-- Player tracking -->
        <div class="tracking-box" style="top: 35%; left: 38%; width: 80px; height: 160px; border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);">
            <span class="absolute -top-5 left-0 text-blue-400 text-[10px] font-bold bg-black/60 px-1.5 py-0.5 rounded">PLAYER</span>
        </div>

        <!-- Status Bar -->
        <div class="relative z-10 flex justify-between items-center px-7 pt-4" style="height:59px;">
            <span class="text-white text-sm font-semibold">9:41</span>
            <div class="w-28 h-7 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-white text-xs"></i>
                <i class="fas fa-wifi text-white text-xs"></i>
                <i class="fas fa-battery-full text-white text-xs"></i>
            </div>
        </div>

        <!-- Top Controls -->
        <div class="relative z-10 px-7 mt-2 flex items-center justify-between">
            <button class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center">
                <i class="fas fa-arrow-left text-white text-sm"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="bg-red-600 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-white rounded-full" style="animation: pulse-ring 1.5s ease infinite;"></div>
                    <span class="text-white text-xs font-bold">REC</span>
                </div>
                <span class="text-white text-sm font-mono bg-black/50 backdrop-blur px-3 py-1.5 rounded-full">12:34</span>
            </div>
            <button class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center">
                <i class="fas fa-cog text-white text-sm"></i>
            </button>
        </div>

        <!-- Live Stats Overlay -->
        <div class="absolute z-10 top-28 left-7 right-7">
            <div class="bg-black/60 backdrop-blur-xl rounded-2xl p-4 border border-white/10">
                <div class="flex justify-between items-center">
                    <div class="text-center flex-1">
                        <p class="text-3xl font-black text-white">24</p>
                        <p class="text-gray-400 text-[10px] uppercase tracking-wider">Shots</p>
                    </div>
                    <div class="w-px h-10 bg-gray-700"></div>
                    <div class="text-center flex-1">
                        <p class="text-3xl font-black text-green-500">17</p>
                        <p class="text-gray-400 text-[10px] uppercase tracking-wider">Makes</p>
                    </div>
                    <div class="w-px h-10 bg-gray-700"></div>
                    <div class="text-center flex-1">
                        <p class="text-3xl font-black text-orange-500">71%</p>
                        <p class="text-gray-400 text-[10px] uppercase tracking-wider">Accuracy</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shot Result Toast -->
        <div class="absolute z-10 top-52 left-1/2 -translate-x-1/2">
            <div class="bg-green-500/90 backdrop-blur px-6 py-2 rounded-full flex items-center gap-2 shadow-lg shadow-green-500/30">
                <i class="fas fa-check-circle text-white"></i>
                <span class="text-white font-bold text-sm">SWISH!</span>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="absolute z-10 bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent pt-16 pb-8 px-7">
            <!-- Shot Chart Mini -->
            <div class="flex items-center gap-1.5 justify-center mb-5">
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-center gap-8">
                <button class="w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
                    <i class="fas fa-pause text-white text-lg"></i>
                </button>
                <button class="w-20 h-20 rounded-full bg-gradient-to-b from-red-500 to-red-700 flex items-center justify-center shadow-lg shadow-red-500/40 border-4 border-red-400/30">
                    <i class="fas fa-stop text-white text-2xl"></i>
                </button>
                <button class="w-14 h-14 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center">
                    <i class="fas fa-camera-rotate text-white text-lg"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
