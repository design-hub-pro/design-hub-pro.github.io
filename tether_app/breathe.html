<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tether — Breathe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen g-night" style="overflow:hidden">
  <div class="status-bar on-dark">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="blob" style="width:260px;height:260px;background:#6C63F2;top:200px;left:-70px;opacity:0.4"></div>
  <div class="blob" style="width:220px;height:220px;background:#5DD6C4;bottom:120px;right:-60px;opacity:0.3"></div>

  <div class="content pt-1 relative" style="z-index:5">
    <!-- top bar -->
    <div class="flex items-center justify-between mb-7">
      <div class="w-10 h-10 rounded-full glass flex items-center justify-center text-white"><i class="fa-solid fa-chevron-down text-[14px]"></i></div>
      <div class="text-center">
        <p class="text-white font-display font-bold text-[15px]">4 · 7 · 8 Breath</p>
        <p class="text-white/50 text-[11px]">Calms a racing heart</p>
      </div>
      <div class="w-10 h-10 rounded-full glass flex items-center justify-center text-white"><i class="fa-solid fa-gear text-[13px]"></i></div>
    </div>

    <!-- pattern chips -->
    <div class="flex gap-2 justify-center mb-9">
      <span class="chip active">4·7·8 Relax</span>
      <span class="chip" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2)">Box</span>
      <span class="chip" style="background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2)">Coherent</span>
    </div>

    <!-- breathing orb -->
    <div class="relative flex items-center justify-center mb-9" style="height:300px">
      <div class="pulse-ring absolute rounded-full" style="width:240px;height:240px;border:1px solid rgba(108,99,242,0.5)"></div>
      <div class="breath-ring r2 absolute" style="width:248px;height:248px"></div>
      <div class="breath-ring absolute" style="width:196px;height:196px"></div>
      <div class="breath-orb flex items-center justify-center" style="width:160px;height:160px">
        <div class="text-center">
          <p class="text-white font-display font-bold text-[30px] leading-none">Inhale</p>
          <p class="text-white/70 text-[13px] mt-1">through your nose</p>
        </div>
      </div>
    </div>

    <!-- live heart -->
    <div class="flex items-center justify-center gap-6 mb-8">
      <div class="text-center">
        <p class="font-display text-[30px] font-bold text-white">04</p>
        <p class="text-white/45 text-[11px] uppercase tracking-wider">Count</p>
      </div>
      <div class="w-px h-9 bg-white/15"></div>
      <div class="text-center flex flex-col items-center">
        <p class="font-display text-[30px] font-bold text-[#FF8A6B] flex items-center gap-1.5"><i class="fa-solid fa-heart heartbeat text-[18px]"></i>74</p>
        <p class="text-white/45 text-[11px] uppercase tracking-wider">BPM · falling</p>
      </div>
      <div class="w-px h-9 bg-white/15"></div>
      <div class="text-center">
        <p class="font-display text-[30px] font-bold text-white">3<span class="text-[15px] text-white/50">/4</span></p>
        <p class="text-white/45 text-[11px] uppercase tracking-wider">Cycles</p>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pb-12 pt-6 flex items-center justify-center gap-7" style="z-index:6">
    <div class="w-12 h-12 rounded-full glass flex items-center justify-center text-white"><i class="fa-solid fa-volume-high text-[16px]"></i></div>
    <div class="w-[72px] h-[72px] rounded-full bg-white flex items-center justify-center shadow-glow"><i class="fa-solid fa-pause text-[#4F3BC9] text-[24px]"></i></div>
    <div class="w-12 h-12 rounded-full glass flex items-center justify-center text-white"><i class="fa-solid fa-forward-step text-[16px]"></i></div>
  </div>
</div>
</body>
</html>
