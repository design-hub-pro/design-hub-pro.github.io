<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tether — Body Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
<style>
  .body-hot{filter:drop-shadow(0 0 14px rgba(255,138,107,0.9))}
  @keyframes scanmove{0%,100%{top:18%}50%{top:62%}}
  .scan-sweep{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#5DD6C4,transparent);box-shadow:0 0 14px #5DD6C4;animation:scanmove 4s ease-in-out infinite}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="content pt-1">
    <!-- header -->
    <div class="flex items-center justify-between mb-5">
      <div class="w-10 h-10 rounded-full bg-white border border-[#1C1B2E]/8 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[15px]"></i></div>
      <div class="text-center"><p class="font-display font-bold text-[15px]">Body Scan</p><p class="text-[11px] text-[#7A788F]">Find & release tension</p></div>
      <div class="w-10 h-10 rounded-full bg-white border border-[#1C1B2E]/8 flex items-center justify-center"><i class="fa-regular fa-bookmark text-[14px]"></i></div>
    </div>

    <!-- body map -->
    <div class="relative rounded-[28px] overflow-hidden mb-5 g-night" style="height:330px">
      <div class="blob" style="width:200px;height:200px;background:#6C63F2;top:30px;left:50%;transform:translateX(-50%);opacity:0.45"></div>
      <div class="scan-sweep" style="z-index:3"></div>
      <!-- silhouette -->
      <div class="absolute inset-0 flex items-center justify-center" style="z-index:2">
        <svg width="120" height="300" viewBox="0 0 120 300">
          <g fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.35)" stroke-width="1">
            <circle cx="60" cy="34" r="22"/>
            <rect x="44" y="56" width="32" height="14" rx="6"/>
            <rect x="34" y="70" width="52" height="84" rx="22"/>
            <rect x="18" y="74" width="18" height="78" rx="9"/>
            <rect x="84" y="74" width="18" height="78" rx="9"/>
            <rect x="40" y="150" width="18" height="100" rx="9"/>
            <rect x="62" y="150" width="18" height="100" rx="9"/>
          </g>
        </svg>
      </div>
      <!-- hotspots -->
      <div class="absolute body-hot" style="top:48px;left:50%;transform:translateX(-50%);z-index:4"><span class="dot dot-coral heartbeat" style="width:14px;height:14px"></span></div>
      <div class="absolute body-hot" style="top:120px;left:50%;transform:translateX(-50%);z-index:4"><span class="dot dot-coral heartbeat" style="width:18px;height:18px"></span></div>
      <!-- labels -->
      <div class="absolute top-4 left-4 telemetry" style="z-index:5;background:rgba(0,0,0,0.4);border-radius:12px;padding:8px 11px"><p class="text-white/60 text-[10px] uppercase tracking-wider">Scanning</p><p class="text-white font-bold text-[13px]">Chest · shoulders</p></div>
      <div class="absolute bottom-4 right-4 telemetry" style="z-index:5;background:rgba(0,0,0,0.4);border-radius:12px;padding:8px 11px"><p class="text-[#FF8A6B] font-bold text-[13px]"><span class="dot dot-coral"></span> 2 tight zones</p></div>
    </div>

    <!-- now playing -->
    <div class="card !p-4 mb-4">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-12 h-12 rounded-2xl g-coral flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-person-rays"></i></div>
        <div class="flex-1">
          <p class="font-semibold text-[14px]">Releasing your chest</p>
          <p class="text-[12px] text-[#7A788F]">Soften where you hold anxiety</p>
        </div>
        <span class="tag tag-coral">Step 3/6</span>
      </div>
      <div class="bar mb-2"><div class="g-coral" style="width:46%"></div></div>
      <div class="flex justify-between text-[11px] text-[#7A788F] font-mono"><span>3:42</span><span>8:00</span></div>
    </div>

    <!-- controls -->
    <div class="flex items-center justify-center gap-6 mb-6">
      <i class="fa-solid fa-backward text-[#7A788F] text-[20px]"></i>
      <div class="w-16 h-16 rounded-full g-coral shadow-coral flex items-center justify-center text-white text-[22px]"><i class="fa-solid fa-pause"></i></div>
      <i class="fa-solid fa-forward text-[#7A788F] text-[20px]"></i>
    </div>

    <!-- segments -->
    <p class="text-[12px] font-semibold uppercase tracking-widest text-[#7A788F] mb-3">Journey through the body</p>
    <div class="space-y-2.5">
      <div class="card !p-3 flex items-center gap-3 opacity-50"><div class="w-8 h-8 rounded-lg bg-[#5DD6C4]/15 flex items-center justify-center text-[#0E9E8A]"><i class="fa-solid fa-check text-[12px]"></i></div><span class="flex-1 text-[13px] font-semibold">Feet & legs</span><span class="text-[11px] text-[#7A788F]">2:00</span></div>
      <div class="card !p-3 flex items-center gap-3 opacity-50"><div class="w-8 h-8 rounded-lg bg-[#5DD6C4]/15 flex items-center justify-center text-[#0E9E8A]"><i class="fa-solid fa-check text-[12px]"></i></div><span class="flex-1 text-[13px] font-semibold">Belly & breath</span><span class="text-[11px] text-[#7A788F]">1:30</span></div>
      <div class="card !p-3 flex items-center gap-3 border-2 border-[#FF8A6B]/40"><div class="w-8 h-8 rounded-lg g-coral flex items-center justify-center text-white"><i class="fa-solid fa-volume-high text-[12px]"></i></div><span class="flex-1 text-[13px] font-bold">Chest & shoulders</span><span class="text-[11px] text-[#FF8A6B] font-bold">now</span></div>
      <div class="card !p-3 flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-[#1C1B2E]/6 flex items-center justify-center text-[#7A788F]"><i class="fa-solid fa-lock text-[11px]"></i></div><span class="flex-1 text-[13px] font-semibold">Jaw & face</span><span class="text-[11px] text-[#7A788F]">1:30</span></div>
    </div>
  </div>
</div>
</body>
</html>
