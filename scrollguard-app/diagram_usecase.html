<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollGuard - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            height: 750px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
                <!-- Gradients -->
                <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea"/>
                    <stop offset="100%" style="stop-color:#764ba2"/>
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f093fb"/>
                    <stop offset="100%" style="stop-color:#f5576c"/>
                </linearGradient>
                <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#4facfe"/>
                    <stop offset="100%" style="stop-color:#00f2fe"/>
                </linearGradient>
                <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#43e97b"/>
                    <stop offset="100%" style="stop-color:#38f9d7"/>
                </linearGradient>
                <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fa709a"/>
                    <stop offset="100%" style="stop-color:#fee140"/>
                </linearGradient>

                <!-- Shadow filter -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
                </filter>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Title -->
            <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">
                ScrollGuard System - Use Case Diagram
            </text>
            <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
                Wearable-Based Scroll Behavior Detection and Digital Wellbeing Management
            </text>

            <!-- System Boundary -->
            <rect x="280" y="85" width="640" height="530" rx="20" fill="#f8f9ff" stroke="#667eea" stroke-width="2" stroke-dasharray="8,4" filter="url(#softShadow)"/>
            <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea">
                ScrollGuard System
            </text>

            <!-- User Actor (Left) -->
            <g transform="translate(100, 280)">
                <circle cx="40" cy="20" r="22" fill="url(#userGrad)" filter="url(#shadow)"/>
                <line x1="40" y1="42" x2="40" y2="85" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="55" x2="15" y2="75" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="55" x2="65" y2="75" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="85" x2="20" y2="120" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="85" x2="60" y2="120" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                <text x="40" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">User</text>
                <text x="40" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(Phone Owner)</text>
            </g>

            <!-- Wearable Device Actor (Bottom Left) -->
            <g transform="translate(100, 500)">
                <rect x="10" y="0" width="60" height="40" rx="8" fill="url(#deviceGrad)" filter="url(#shadow)"/>
                <rect x="18" y="8" width="44" height="24" rx="4" fill="#fff" opacity="0.9"/>
                <circle cx="28" cy="20" r="4" fill="#4facfe"/>
                <rect x="36" y="16" width="20" height="3" rx="1" fill="#4facfe"/>
                <rect x="36" y="22" width="14" height="2" rx="1" fill="#87CEEB"/>
                <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Wearable</text>
                <text x="40" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(Smart Band/Sensor)</text>
            </g>

            <!-- Cloud Service Actor (Right) -->
            <g transform="translate(1000, 280)">
                <ellipse cx="50" cy="30" rx="45" ry="28" fill="url(#cloudGrad)" filter="url(#shadow)"/>
                <ellipse cx="30" cy="38" rx="25" ry="18" fill="url(#cloudGrad)"/>
                <ellipse cx="70" cy="38" rx="25" ry="18" fill="url(#cloudGrad)"/>
                <ellipse cx="50" cy="45" rx="35" ry="20" fill="url(#cloudGrad)"/>
                <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Cloud</text>
                <text x="50" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(Analytics Server)</text>
            </g>

            <!-- Use Cases -->
            <!-- UC1: Detect Scroll Activity -->
            <ellipse cx="450" cy="170" rx="110" ry="35" fill="#fff" stroke="url(#systemGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Detect Scroll</text>
            <text x="450" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Activity</text>

            <!-- UC2: Monitor Screen Time -->
            <ellipse cx="700" cy="170" rx="110" ry="35" fill="#fff" stroke="url(#deviceGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="700" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Monitor</text>
            <text x="700" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Screen Time</text>

            <!-- UC3: Send Haptic Alert -->
            <ellipse cx="380" cy="270" rx="100" ry="35" fill="#fff" stroke="url(#alertGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="380" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Send Haptic</text>
            <text x="380" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Alert</text>

            <!-- UC4: View Usage Statistics -->
            <ellipse cx="600" cy="270" rx="100" ry="35" fill="#fff" stroke="url(#userGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">View Usage</text>
            <text x="600" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Statistics</text>

            <!-- UC5: Configure Reminder Settings -->
            <ellipse cx="810" cy="270" rx="100" ry="35" fill="#fff" stroke="url(#cloudGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="810" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Configure</text>
            <text x="810" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Reminder Settings</text>

            <!-- UC6: Set Daily Goals -->
            <ellipse cx="420" cy="370" rx="100" ry="35" fill="#fff" stroke="url(#userGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Set Daily</text>
            <text x="420" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Usage Goals</text>

            <!-- UC7: Generate Wellness Report -->
            <ellipse cx="650" cy="370" rx="110" ry="35" fill="#fff" stroke="url(#cloudGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="650" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Generate Wellness</text>
            <text x="650" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Report</text>

            <!-- UC8: Sync with Cloud -->
            <ellipse cx="530" cy="470" rx="100" ry="35" fill="#fff" stroke="url(#deviceGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="530" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Sync Data</text>
            <text x="530" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">with Cloud</text>

            <!-- UC9: App Blocking -->
            <ellipse cx="760" cy="470" rx="100" ry="35" fill="#fff" stroke="url(#systemGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="760" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Trigger App</text>
            <text x="760" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Blocking</text>

            <!-- UC10: Focus Mode -->
            <ellipse cx="530" cy="555" rx="100" ry="35" fill="#fff" stroke="url(#alertGrad)" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="530" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Activate</text>
            <text x="530" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Focus Mode</text>

            <!-- Connection Lines - User -->
            <line x1="180" y1="320" x2="340" y2="170" stroke="#667eea" stroke-width="1.5"/>
            <line x1="180" y1="340" x2="285" y2="270" stroke="#667eea" stroke-width="1.5"/>
            <line x1="180" y1="350" x2="500" y2="270" stroke="#667eea" stroke-width="1.5"/>
            <line x1="180" y1="360" x2="320" y2="370" stroke="#667eea" stroke-width="1.5"/>
            <line x1="180" y1="380" x2="710" y2="270" stroke="#667eea" stroke-width="1.5"/>
            <line x1="180" y1="390" x2="430" y2="555" stroke="#667eea" stroke-width="1.5"/>

            <!-- Connection Lines - Wearable -->
            <line x1="170" y1="520" x2="350" y2="185" stroke="#4facfe" stroke-width="1.5"/>
            <line x1="170" y1="530" x2="290" y2="280" stroke="#4facfe" stroke-width="1.5"/>
            <line x1="170" y1="540" x2="430" y2="470" stroke="#4facfe" stroke-width="1.5"/>

            <!-- Connection Lines - Cloud -->
            <line x1="1000" y1="300" x2="760" y2="370" stroke="#43e97b" stroke-width="1.5"/>
            <line x1="1000" y1="320" x2="630" y2="470" stroke="#43e97b" stroke-width="1.5"/>
            <line x1="1000" y1="310" x2="810" y2="170" stroke="#43e97b" stroke-width="1.5"/>

            <!-- Include/Extend relationships -->
            <line x1="450" y1="205" x2="380" y2="235" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
            <text x="395" y="218" font-family="Arial, sans-serif" font-size="10" fill="#666">«include»</text>

            <line x1="600" y1="305" x2="650" y2="335" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
            <text x="640" y="318" font-family="Arial, sans-serif" font-size="10" fill="#666">«extend»</text>

            <line x1="760" y1="435" x2="380" y2="300" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"/>
            <text x="550" y="355" font-family="Arial, sans-serif" font-size="10" fill="#666">«extend»</text>

            <!-- Legend -->
            <rect x="50" y="620" width="300" height="70" rx="10" fill="#f8f9ff" stroke="#ddd" stroke-width="1"/>
            <text x="70" y="645" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Legend:</text>

            <circle cx="85" cy="665" r="6" fill="url(#userGrad)"/>
            <text x="100" y="669" font-family="Arial, sans-serif" font-size="11" fill="#555">User Interaction</text>

            <circle cx="200" cy="665" r="6" fill="url(#deviceGrad)"/>
            <text x="215" y="669" font-family="Arial, sans-serif" font-size="11" fill="#555">Device Function</text>

            <circle cx="310" cy="665" r="6" fill="url(#cloudGrad)"/>
            <text x="325" y="669" font-family="Arial, sans-serif" font-size="11" fill="#555">Cloud Service</text>

            <!-- Version info -->
            <text x="1150" y="680" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#999">
                v1.0 | ScrollGuard System
            </text>
        </svg>
    </div>
</body>
</html>
