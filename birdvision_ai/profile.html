<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdVision AI - Profile</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif;
    background: #FAFBFC;
  }

  .status-bar {
    height: 59px; padding: 0 28px; display: flex; align-items: flex-end;
    justify-content: space-between; padding-bottom: 12px; background: #FAFBFC;
    position: sticky; top: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island {
    width: 126px; height: 37px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  }

  .content { padding: 0 28px 120px; }

  .profile-header {
    text-align: center; margin-top: 12px;
  }
  .avatar {
    width: 88px; height: 88px; border-radius: 28px; overflow: hidden;
    margin: 0 auto; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-size: 22px; font-weight: 800; color: #1C1C1E; margin-top: 12px; }
  .profile-handle { font-size: 14px; color: #8E8E93; margin-top: 2px; }
  .profile-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, #34C759, #30D158);
    color: #fff; padding: 4px 12px; border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-top: 8px;
  }

  .stats-bar {
    display: flex; justify-content: space-around; margin-top: 24px;
    background: #fff; border-radius: 20px; padding: 18px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .stat-item { text-align: center; }
  .stat-item-num { font-size: 24px; font-weight: 800; color: #1C1C1E; }
  .stat-item-label { font-size: 11px; color: #8E8E93; margin-top: 2px; }
  .stats-divider { width: 1px; background: #F2F2F7; }

  .streak-card {
    margin-top: 20px; background: linear-gradient(135deg, #FF9500, #FF6B00);
    border-radius: 20px; padding: 18px; display: flex;
    align-items: center; gap: 14px;
  }
  .streak-icon {
    width: 48px; height: 48px; background: rgba(255,255,255,0.2);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
  }
  .streak-icon i { color: #fff; font-size: 22px; }
  .streak-info h3 { color: #fff; font-size: 16px; font-weight: 700; }
  .streak-info p { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 2px; }
  .streak-days {
    display: flex; gap: 5px; margin-top: 8px;
  }
  .streak-day {
    width: 28px; height: 28px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 9px;
    font-weight: 600; color: #fff;
  }
  .streak-day.done { background: rgba(255,255,255,0.3); }
  .streak-day.today { background: #fff; color: #FF9500; }
  .streak-day.future { background: rgba(255,255,255,0.1); }

  .activity-section { margin-top: 24px; }
  .activity-title { font-size: 16px; font-weight: 700; color: #1C1C1E; margin-bottom: 12px; }
  .activity-chart {
    background: #fff; border-radius: 18px; padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .chart-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .chart-header span { font-size: 13px; font-weight: 600; color: #1C1C1E; }
  .chart-period {
    font-size: 12px; color: #34C759; font-weight: 600;
    background: #E8F9ED; padding: 4px 10px; border-radius: 8px;
  }
  .chart-bars {
    display: flex; align-items: flex-end; justify-content: space-between;
    height: 100px; gap: 6px;
  }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart-bar {
    width: 100%; border-radius: 6px 6px 0 0;
    background: linear-gradient(to top, #34C759, #30D158);
  }
  .chart-bar.low {
    background: linear-gradient(to top, #E8F9ED, #C2F0D0);
  }
  .chart-label { font-size: 10px; color: #8E8E93; }

  .settings-list {
    margin-top: 24px; display: flex; flex-direction: column; gap: 2px;
  }
  .settings-item {
    background: #fff; padding: 14px 16px; display: flex;
    align-items: center; gap: 12px;
  }
  .settings-item:first-child { border-radius: 16px 16px 0 0; }
  .settings-item:last-child { border-radius: 0 0 16px 16px; }
  .settings-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .settings-label { font-size: 15px; color: #1C1C1E; flex: 1; }
  .settings-arrow { color: #C7C7CC; font-size: 13px; }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 90px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding-top: 10px; border-top: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #8E8E93; font-weight: 500;
  }
  .tab-item.active { color: #34C759; }
  .tab-item i { font-size: 22px; }
  .tab-center {
    width: 52px; height: 52px; background: linear-gradient(135deg, #34C759, #30D158);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-top: -20px; box-shadow: 0 4px 16px rgba(52,199,89,0.4);
  }
  .tab-center i { color: #fff; font-size: 22px; }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <div class="profile-header">
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1535930749574-1399327ce78f?w=200&q=80" alt="User">
      </div>
      <div class="profile-name">Sarah Chen</div>
      <div class="profile-handle">@birdwatcher_sarah</div>
      <div class="profile-badge"><i class="fas fa-crown"></i> Pro Birder</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-item-num">47</div>
        <div class="stat-item-label">Species</div>
      </div>
      <div class="stats-divider"></div>
      <div class="stat-item">
        <div class="stat-item-num">128</div>
        <div class="stat-item-label">Scans</div>
      </div>
      <div class="stats-divider"></div>
      <div class="stat-item">
        <div class="stat-item-num">14</div>
        <div class="stat-item-label">Day Streak</div>
      </div>
    </div>

    <div class="streak-card">
      <div class="streak-icon"><i class="fas fa-fire-flame-curved"></i></div>
      <div>
        <div class="streak-info">
          <h3>14 Day Streak!</h3>
          <p>You're on fire! Keep it going</p>
        </div>
        <div class="streak-days">
          <div class="streak-day done">M</div>
          <div class="streak-day done">T</div>
          <div class="streak-day done">W</div>
          <div class="streak-day done">T</div>
          <div class="streak-day today">F</div>
          <div class="streak-day future">S</div>
          <div class="streak-day future">S</div>
        </div>
      </div>
    </div>

    <div class="activity-section">
      <div class="activity-title">Weekly Activity</div>
      <div class="activity-chart">
        <div class="chart-header">
          <span>Scans per day</span>
          <div class="chart-period">This Week</div>
        </div>
        <div class="chart-bars">
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="height:60px"></div>
            <div class="chart-label">Mon</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="height:85px"></div>
            <div class="chart-label">Tue</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar low" style="height:35px"></div>
            <div class="chart-label">Wed</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="height:70px"></div>
            <div class="chart-label">Thu</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="height:95px"></div>
            <div class="chart-label">Fri</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar low" style="height:20px"></div>
            <div class="chart-label">Sat</div>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar low" style="height:10px"></div>
            <div class="chart-label">Sun</div>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-list">
      <div class="settings-item">
        <div class="settings-icon" style="background:#E8F9ED;color:#34C759;">
          <i class="fas fa-bell"></i>
        </div>
        <span class="settings-label">Notifications</span>
        <i class="fas fa-chevron-right settings-arrow"></i>
      </div>
      <div class="settings-item">
        <div class="settings-icon" style="background:#E8F0FE;color:#007AFF;">
          <i class="fas fa-download"></i>
        </div>
        <span class="settings-label">Offline Mode</span>
        <i class="fas fa-chevron-right settings-arrow"></i>
      </div>
      <div class="settings-item">
        <div class="settings-icon" style="background:#FFF3E0;color:#FF9500;">
          <i class="fas fa-share-nodes"></i>
        </div>
        <span class="settings-label">Share Profile</span>
        <i class="fas fa-chevron-right settings-arrow"></i>
      </div>
      <div class="settings-item">
        <div class="settings-icon" style="background:#F2F2F7;color:#8E8E93;">
          <i class="fas fa-gear"></i>
        </div>
        <span class="settings-label">Settings</span>
        <i class="fas fa-chevron-right settings-arrow"></i>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <i class="fas fa-house"></i>
      <span>Home</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-compass"></i>
      <span>Explore</span>
    </div>
    <div class="tab-center">
      <i class="fas fa-plus"></i>
    </div>
    <div class="tab-item">
      <i class="fas fa-book-open"></i>
      <span>Collection</span>
    </div>
    <div class="tab-item active">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </div>
  </div>
</body>
</html>
