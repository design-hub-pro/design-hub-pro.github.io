<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canyons Hub - Profile</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #F5F7FA; width: 100%; height: 100%; overflow-x: hidden; scrollbar-width: none; position: relative; }

  .status-bar { width: 100%; height: 59px; padding: 0 28px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 10px; background: #F5F7FA; position: sticky; top: 0; z-index: 100; }
  .status-time { font-size: 16px; font-weight: 600; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 22px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }

  .content { padding: 0 28px 60px; }

  .page-head { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .back-btn { width: 34px; height: 34px; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(15,45,70,0.05); color: #0B2338; font-size: 13px; }
  .page-title { font-size: 17px; font-weight: 800; color: #0B2338; }

  .id-card { margin-top: 20px; border-radius: 24px; background: linear-gradient(135deg, #0B3954, #1B6FA8); padding: 22px; color: #fff; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
  .id-glow { position: absolute; top: -40px; right: -30px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(79,169,224,0.5), transparent 70%); }
  .id-avatar { width: 58px; height: 58px; border-radius: 18px; object-fit: cover; position: relative; border: 2px solid rgba(255,255,255,0.4); }
  .id-info { position: relative; }
  .id-name { font-size: 18px; font-weight: 800; }
  .id-meta { font-size: 12px; opacity: 0.8; margin-top: 3px; }

  .section-title { font-size: 13px; font-weight: 700; color: #8A96A3; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 24px; margin-bottom: 12px; }

  .conn-card { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 20px; padding: 13px 16px; margin-bottom: 9px; box-shadow: 0 2px 10px rgba(15,45,70,0.05); }
  .conn-icon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; flex-shrink: 0; }
  .conn-info { flex: 1; }
  .conn-name { font-size: 14.5px; font-weight: 700; color: #0B2338; }
  .conn-desc { font-size: 11.5px; color: #1FAE5A; font-weight: 600; margin-top: 2px; }
  .conn-desc.warn { color: #D9541F; }

  .setting-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 18px; padding: 14px 16px; margin-bottom: 9px; box-shadow: 0 2px 10px rgba(15,45,70,0.05); }
  .setting-left { display: flex; align-items: center; gap: 12px; }
  .setting-icon { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; }
  .setting-label { font-size: 14px; font-weight: 600; color: #0B2338; }
  .toggle { width: 44px; height: 26px; border-radius: 14px; background: #1B6FA8; position: relative; }
  .toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .toggle.off { background: #E4E9EF; }
  .toggle.off::after { right: auto; left: 3px; }

  .signout { text-align: center; font-size: 14px; font-weight: 700; color: #E4572E; margin-top: 20px; padding: 14px; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="content">
  <div class="page-head">
    <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
    <div class="page-title">Profile</div>
    <div class="back-btn"><i class="fas fa-gear"></i></div>
  </div>

  <div class="id-card">
    <div class="id-glow"></div>
    <img class="id-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&q=80" alt="">
    <div class="id-info">
      <div class="id-name">Maya Ramirez</div>
      <div class="id-meta">Alta High · Class of 2027 · ID 40218</div>
    </div>
  </div>

  <div class="section-title">Connected Systems</div>

  <div class="conn-card">
    <div class="conn-icon" style="background:#E4572E;"><i class="fas fa-book-open"></i></div>
    <div class="conn-info"><div class="conn-name">Canvas</div><div class="conn-desc"><i class="fas fa-circle-check"></i> Connected</div></div>
  </div>
  <div class="conn-card">
    <div class="conn-icon" style="background:#2E5B8A;"><i class="fas fa-chart-simple"></i></div>
    <div class="conn-info"><div class="conn-name">Skyward</div><div class="conn-desc"><i class="fas fa-circle-check"></i> Connected</div></div>
  </div>
  <div class="conn-card">
    <div class="conn-icon" style="background:#00A99D;"><i class="fas fa-bullhorn"></i></div>
    <div class="conn-info"><div class="conn-name">ParentSquare</div><div class="conn-desc"><i class="fas fa-circle-check"></i> Connected</div></div>
  </div>
  <div class="conn-card">
    <div class="conn-icon" style="background:#00AEEF;"><i class="fas fa-comments"></i></div>
    <div class="conn-info"><div class="conn-name">GroupMe</div><div class="conn-desc"><i class="fas fa-circle-check"></i> Connected</div></div>
  </div>
  <div class="conn-card">
    <div class="conn-icon" style="background:#7B4FA0;"><i class="fas fa-people-group"></i></div>
    <div class="conn-info"><div class="conn-name">School Clubs Site</div><div class="conn-desc warn"><i class="fas fa-triangle-exclamation"></i> Sign-in expired</div></div>
  </div>
  <div class="conn-card">
    <div class="conn-icon" style="background:#D9541F;"><i class="fas fa-newspaper"></i></div>
    <div class="conn-info"><div class="conn-name">The Utah View</div><div class="conn-desc"><i class="fas fa-circle-check"></i> Connected</div></div>
  </div>

  <div class="section-title">Preferences</div>

  <div class="setting-row">
    <div class="setting-left">
      <div class="setting-icon" style="background:#1B6FA8;"><i class="fas fa-bell"></i></div>
      <div class="setting-label">Push Notifications</div>
    </div>
    <div class="toggle"></div>
  </div>
  <div class="setting-row">
    <div class="setting-left">
      <div class="setting-icon" style="background:#1FAE5A;"><i class="fas fa-moon"></i></div>
      <div class="setting-label">Dark Mode</div>
    </div>
    <div class="toggle off"></div>
  </div>
  <div class="setting-row">
    <div class="setting-left">
      <div class="setting-icon" style="background:#7B4FA0;"><i class="fas fa-users"></i></div>
      <div class="setting-label">Family / Parent Access</div>
    </div>
    <i class="fas fa-chevron-right" style="color:#B0B9C2; font-size:12px;"></i>
  </div>

  <div class="signout">Sign Out</div>
</div>

</body>
</html>
