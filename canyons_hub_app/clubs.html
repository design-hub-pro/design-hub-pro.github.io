<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canyons Hub - Clubs</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #F5F7FA; width: 100%; height: 100%; overflow-x: hidden; scrollbar-width: none; position: relative; }

  .status-bar { width: 100%; height: 59px; padding: 0 28px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 10px; background: #F5F7FA; position: sticky; top: 0; z-index: 100; }
  .status-time { font-size: 16px; font-weight: 600; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 22px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }

  .content { padding: 0 28px 130px; }

  .page-head { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .back-btn { width: 34px; height: 34px; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(15,45,70,0.05); color: #0B2338; font-size: 13px; }
  .page-title { font-size: 19px; font-weight: 800; color: #0B2338; }

  .my-clubs { margin-top: 16px; }
  .section-title { font-size: 13px; font-weight: 700; color: #8A96A3; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 22px; margin-bottom: 12px; }

  .cat-scroll { display: flex; gap: 8px; overflow-x: auto; margin: 14px -28px 0; padding: 0 28px; }
  .cat-chip { flex: 0 0 auto; padding: 9px 15px; border-radius: 14px; background: #fff; font-size: 12px; font-weight: 700; color: #6B7B8C; box-shadow: 0 2px 10px rgba(15,45,70,0.05); white-space: nowrap; }
  .cat-chip.sel { background: linear-gradient(135deg,#7B4FA0,#9B6DC7); color: #fff; }

  .club-card { border-radius: 22px; overflow: hidden; position: relative; height: 130px; margin-bottom: 14px; }
  .club-card img { width: 100%; height: 100%; object-fit: cover; }
  .club-grad { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,35,56,0.85), rgba(11,35,56,0.15)); }
  .club-text { position: absolute; left: 16px; top: 14px; right: 16px; color: #fff; }
  .club-name { font-size: 16px; font-weight: 800; }
  .club-meta { font-size: 11.5px; opacity: 0.85; margin-top: 4px; }
  .club-bottom { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .club-avatars { display: flex; }
  .club-avatars img { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #0B2338; object-fit: cover; margin-left: -8px; }
  .club-avatars img:first-child { margin-left: 0; }
  .club-btn { font-size: 11px; font-weight: 700; color: #0B2338; background: #fff; padding: 6px 14px; border-radius: 12px; }
  .club-btn.joined { background: rgba(255,255,255,0.2); color: #fff; }

  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 88px; background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(0,0,0,0.08); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; z-index: 100; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #8A96A3; }
  .tab-item.active { color: #1B6FA8; }
  .tab-item i { font-size: 21px; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="content">
  <div class="page-head">
    <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
    <div class="page-title">Clubs &amp; Activities</div>
    <div class="back-btn"><i class="fas fa-magnifying-glass"></i></div>
  </div>

  <div class="cat-scroll">
    <div class="cat-chip sel">All</div>
    <div class="cat-chip">STEM</div>
    <div class="cat-chip">Arts</div>
    <div class="cat-chip">Service</div>
    <div class="cat-chip">Sports</div>
  </div>

  <div class="section-title">Your Clubs</div>

  <div class="club-card">
    <img src="https://images.unsplash.com/photo-1581090464777-f3220bbe1b8b?w=600&q=80" alt="">
    <div class="club-grad"></div>
    <div class="club-text">
      <div class="club-name">Robotics Team</div>
      <div class="club-meta"><i class="fas fa-comments"></i> GroupMe · Tue/Thu 3:30pm</div>
    </div>
    <div class="club-bottom">
      <div class="club-avatars">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=100&q=80" alt="">
      </div>
      <span class="club-btn joined"><i class="fas fa-check"></i> Joined</span>
    </div>
  </div>

  <div class="club-card">
    <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&q=80" alt="">
    <div class="club-grad"></div>
    <div class="club-text">
      <div class="club-name">Drama Club</div>
      <div class="club-meta"><i class="fas fa-comments"></i> GroupMe · Mon/Wed 4:00pm</div>
    </div>
    <div class="club-bottom">
      <div class="club-avatars">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=100&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&q=80" alt="">
      </div>
      <span class="club-btn joined"><i class="fas fa-check"></i> Joined</span>
    </div>
  </div>

  <div class="section-title">Discover</div>

  <div class="club-card">
    <img src="https://images.unsplash.com/photo-1529390079861-591de354faf5?w=600&q=80" alt="">
    <div class="club-grad"></div>
    <div class="club-text">
      <div class="club-name">Student Council</div>
      <div class="club-meta">124 members · Fri 7:30am</div>
    </div>
    <div class="club-bottom">
      <div class="club-avatars">
        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=100&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80" alt="">
      </div>
      <span class="club-btn">Join</span>
    </div>
  </div>

  <div class="club-card">
    <img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&q=80" alt="">
    <div class="club-grad"></div>
    <div class="club-text">
      <div class="club-name">Ultimate Frisbee</div>
      <div class="club-meta">38 members · Tue/Thu 4:15pm</div>
    </div>
    <div class="club-bottom">
      <div class="club-avatars">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80" alt="">
      </div>
      <span class="club-btn">Join</span>
    </div>
  </div>

</div>

<div class="tab-bar">
  <div class="tab-item">
    <i class="fas fa-house"></i>
    <span>Home</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-calendar-days"></i>
    <span>Schedule</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-chart-simple"></i>
    <span>Grades</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-inbox"></i>
    <span>Inbox</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-newspaper"></i>
    <span>News</span>
  </div>
</div>

</body>
</html>
