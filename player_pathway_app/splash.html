<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Pathway - Splash</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0F172A; color: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  .splash-screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22C55E;
    opacity: 0;
    animation: particleFloat 4s ease-in-out infinite;
  }
  .particle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { top: 25%; right: 15%; animation-delay: 0.5s; }
  .particle:nth-child(3) { top: 60%; left: 12%; animation-delay: 1s; }
  .particle:nth-child(4) { top: 70%; right: 20%; animation-delay: 1.5s; }
  .particle:nth-child(5) { top: 40%; left: 8%; animation-delay: 2s; width: 4px; height: 4px; }
  .particle:nth-child(6) { top: 50%; right: 10%; animation-delay: 2.5s; width: 4px; height: 4px; }
  .particle:nth-child(7) { top: 80%; left: 30%; animation-delay: 3s; width: 5px; height: 5px; }
  .particle:nth-child(8) { top: 20%; right: 30%; animation-delay: 3.5s; width: 5px; height: 5px; }

  @keyframes particleFloat {
    0% { opacity: 0; transform: translateY(20px) scale(0.5); }
    30% { opacity: 0.6; }
    70% { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
  }

  /* Logo container */
  .logo-container {
    position: relative;
    margin-bottom: 32px;
  }

  /* Glow rings */
  .glow-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1.5px solid rgba(34, 197, 94, 0.15);
    animation: glowPulse 3s ease-in-out infinite;
  }
  .glow-ring:nth-child(1) {
    width: 160px; height: 160px;
    animation-delay: 0s;
  }
  .glow-ring:nth-child(2) {
    width: 210px; height: 210px;
    animation-delay: 0.5s;
    border-color: rgba(34, 197, 94, 0.08);
  }
  .glow-ring:nth-child(3) {
    width: 260px; height: 260px;
    animation-delay: 1s;
    border-color: rgba(34, 197, 94, 0.04);
  }

  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.5; }
  }

  /* Logo icon */
  .logo-icon {
    width: 120px; height: 120px;
    background: linear-gradient(135deg, #22C55E 0%, #16A34A 50%, #15803D 100%);
    border-radius: 32px;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
    box-shadow: 0 16px 60px rgba(34, 197, 94, 0.4), 0 0 80px rgba(34, 197, 94, 0.15);
    animation: logoBounce 2s ease-in-out infinite;
  }
  .logo-icon i {
    font-size: 52px; color: #ffffff;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
  }

  @keyframes logoBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* App name */
  .app-name {
    font-size: 36px; font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(180deg, #ffffff 20%, #4ADE80 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    text-align: center;
  }

  .tagline {
    font-size: 15px; color: rgba(255,255,255,0.4);
    font-weight: 400;
    margin-bottom: 48px;
  }

  /* Loading bar */
  .loading-container {
    width: 180px; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 80px;
  }
  .loading-fill {
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg, #22C55E, #4ADE80);
    border-radius: 2px;
    animation: loadProgress 2.5s ease-in-out infinite;
  }

  @keyframes loadProgress {
    0% { width: 0%; opacity: 0.6; }
    50% { width: 75%; opacity: 1; }
    100% { width: 100%; opacity: 0.8; }
  }

  /* Version */
  .version {
    position: absolute;
    bottom: 48px;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <div class="splash-screen">
    <!-- Floating particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <!-- Logo with glow rings -->
    <div class="logo-container">
      <div class="glow-ring"></div>
      <div class="glow-ring"></div>
      <div class="glow-ring"></div>
      <div class="logo-icon">
        <i class="fas fa-futbol"></i>
      </div>
    </div>

    <!-- App name -->
    <div class="app-name">Player Pathway</div>
    <div class="tagline">Ready to play? &#9917;</div>

    <!-- Loading bar -->
    <div class="loading-container">
      <div class="loading-fill"></div>
    </div>

    <!-- Version -->
    <div class="version">v1.0</div>
  </div>

</body>
</html>
