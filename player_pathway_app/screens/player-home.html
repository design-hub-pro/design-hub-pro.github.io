<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>Player Home - Player Pathway</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="dynamic-island"></div>
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0;">
                <div>
                    <p style="font-size: 15px; color: #64748B;">Good morning</p>
                    <h1 style="font-size: 32px; font-weight: 700; color: #0F172A;">Alex</h1>
                </div>
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop&crop=face"
                     alt="Profile" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #6366F1; object-fit: cover;">
            </div>

            <!-- Hero Video Card -->
            <div style="position: relative; border-radius: 24px; overflow: hidden; margin-top: 8px;">
                <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&h=400&fit=crop"
                     alt="Training" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);"></div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;">
                    <span style="background: #6366F1; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">TODAY'S FOCUS</span>
                    <h3 style="color: white; font-size: 22px; font-weight: 700; margin-top: 10px;">First Touch Control</h3>
                    <div style="display: flex; align-items: center; gap: 16px; margin-top: 8px;">
                        <span style="color: rgba(255,255,255,0.9); font-size: 14px;"><i class="fas fa-tasks" style="margin-right: 6px;"></i>3 tasks</span>
                    </div>
                </div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
                    <i class="fas fa-play" style="color: #6366F1; font-size: 24px; margin-left: 4px;"></i>
                </div>
            </div>

            <!-- Quick Actions -->
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 24px;">
                <div style="background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); border-radius: 20px; padding: 20px; color: white;">
                    <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                        <i class="fas fa-book-open" style="font-size: 22px;"></i>
                    </div>
                    <p style="font-size: 17px; font-weight: 600;">Learn</p>
                    <p style="font-size: 13px; opacity: 0.85;">12 modules</p>
                </div>
                <div style="background: linear-gradient(135deg, #10B981 0%, #34D399 100%); border-radius: 20px; padding: 20px; color: white;">
                    <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                        <i class="fas fa-brain" style="font-size: 22px;"></i>
                    </div>
                    <p style="font-size: 17px; font-weight: 600;">Mental</p>
                    <p style="font-size: 13px; opacity: 0.85;">Check-in</p>
                </div>
            </div>

            <!-- Continue Learning -->
            <div class="section-header">
                <h2 class="section-title">Continue</h2>
                <a href="#" class="section-link">See All</a>
            </div>

            <div style="display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; -ms-overflow-style: none;">
                <div style="flex-shrink: 0; width: 160px; background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=320&h=200&fit=crop" style="width: 100%; height: 100px; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px;">3:24</div>
                    </div>
                    <div style="padding: 12px;">
                        <p style="font-size: 13px; font-weight: 600; color: #0F172A;">Ball Control</p>
                        <div style="height: 4px; background: #E2E8F0; border-radius: 2px; margin-top: 8px;">
                            <div style="height: 100%; width: 65%; background: #6366F1; border-radius: 2px;"></div>
                        </div>
                    </div>
                </div>
                <div style="flex-shrink: 0; width: 160px; background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=320&h=200&fit=crop" style="width: 100%; height: 100px; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px;">4:15</div>
                    </div>
                    <div style="padding: 12px;">
                        <p style="font-size: 13px; font-weight: 600; color: #0F172A;">Passing</p>
                        <div style="height: 4px; background: #E2E8F0; border-radius: 2px; margin-top: 8px;">
                            <div style="height: 100%; width: 30%; background: #6366F1; border-radius: 2px;"></div>
                        </div>
                    </div>
                </div>
                <div style="flex-shrink: 0; width: 160px; background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1551958219-acbc608c6377?w=320&h=200&fit=crop" style="width: 100%; height: 100px; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px;">2:45</div>
                    </div>
                    <div style="padding: 12px;">
                        <p style="font-size: 13px; font-weight: 600; color: #0F172A;">Focus Drills</p>
                        <div style="height: 4px; background: #E2E8F0; border-radius: 2px; margin-top: 8px;">
                            <div style="height: 100%; width: 0%; background: #6366F1; border-radius: 2px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- This Week Stats -->
            <div class="section-header">
                <h2 class="section-title">This Week</h2>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                <div style="background: white; border-radius: 18px; padding: 18px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 32px; font-weight: 700; color: #6366F1;">5</div>
                    <p style="font-size: 12px; color: #64748B; margin-top: 4px;">Tasks</p>
                </div>
                <div style="background: white; border-radius: 18px; padding: 18px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 32px; font-weight: 700; color: #10B981;">2</div>
                    <p style="font-size: 12px; color: #64748B; margin-top: 4px;">Skills</p>
                </div>
                <div style="background: white; border-radius: 18px; padding: 18px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 32px; font-weight: 700; color: #8B5CF6;">3</div>
                    <p style="font-size: 12px; color: #64748B; margin-top: 4px;">Reflects</p>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-play-circle"></i>
                <span>Learn</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-clipboard-check"></i>
                <span>Practice</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-chart-line"></i>
                <span>Growth</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
