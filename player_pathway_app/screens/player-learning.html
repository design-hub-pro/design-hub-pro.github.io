<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>Learning Library - Player Pathway</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="dynamic-island"></div>
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div style="padding: 16px 0;">
                <h1 style="font-size: 32px; font-weight: 700; color: #0F172A;">Learn</h1>
            </div>

            <!-- Search -->
            <div style="display: flex; align-items: center; background: white; border-radius: 16px; padding: 14px 18px; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                <i class="fas fa-search" style="color: #94A3B8; font-size: 18px;"></i>
                <input type="text" placeholder="Search modules..." style="flex: 1; border: none; outline: none; font-size: 16px; background: transparent;">
            </div>

            <!-- Filter -->
            <div style="display: flex; gap: 10px; margin-top: 18px; overflow-x: auto; padding-bottom: 4px;">
                <span style="background: #6366F1; color: white; padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap;">All</span>
                <span style="background: white; color: #64748B; padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap;">Technical</span>
                <span style="background: white; color: #64748B; padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap;">Tactical</span>
                <span style="background: white; color: #64748B; padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 500; white-space: nowrap;">Mental</span>
            </div>

            <!-- Featured Video -->
            <div style="position: relative; border-radius: 24px; overflow: hidden; margin-top: 24px;">
                <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=800&h=450&fit=crop"
                     alt="Featured" style="width: 100%; height: 220px; object-fit: cover;">
                <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);"></div>
                <div style="position: absolute; top: 16px; left: 16px;">
                    <span style="background: #F59E0B; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;">FEATURED</span>
                </div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;">
                    <h3 style="color: white; font-size: 20px; font-weight: 700;">Understanding Space</h3>
                    <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                        <span style="color: rgba(255,255,255,0.85); font-size: 13px;"><i class="fas fa-clock" style="margin-right: 5px;"></i>4 min</span>
                        <span style="color: rgba(255,255,255,0.85); font-size: 13px;"><i class="fas fa-signal" style="margin-right: 5px;"></i>Tactical</span>
                    </div>
                </div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
                    <i class="fas fa-play" style="color: #6366F1; font-size: 22px; margin-left: 3px;"></i>
                </div>
            </div>

            <!-- Video Grid -->
            <div class="section-header">
                <h2 class="section-title">Technical</h2>
                <a href="#" class="section-link">See All</a>
            </div>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;">
                <div style="background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=400&h=240&fit=crop" style="width: 100%; height: 110px; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.75); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px;">3:24</div>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-play" style="color: #6366F1; font-size: 14px; margin-left: 2px;"></i>
                        </div>
                    </div>
                    <div style="padding: 14px;">
                        <p style="font-size: 14px; font-weight: 600; color: #0F172A;">First Touch</p>
                        <p style="font-size: 12px; color: #64748B; margin-top: 4px;">Ball control basics</p>
                    </div>
                </div>
                <div style="background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=400&h=240&fit=crop" style="width: 100%; height: 110px; object-fit: cover;">
                        <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.75); color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px;">4:15</div>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-play" style="color: #6366F1; font-size: 14px; margin-left: 2px;"></i>
                        </div>
                    </div>
                    <div style="padding: 14px;">
                        <p style="font-size: 14px; font-weight: 600; color: #0F172A;">Passing</p>
                        <p style="font-size: 12px; color: #64748B; margin-top: 4px;">Accuracy drills</p>
                    </div>
                </div>
            </div>

            <!-- Mental Section -->
            <div class="section-header">
                <h2 class="section-title">Mental</h2>
                <a href="#" class="section-link">See All</a>
            </div>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;">
                <div style="background: linear-gradient(135deg, #10B981 0%, #34D399 100%); border-radius: 18px; padding: 18px; color: white;">
                    <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-brain" style="font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600;">Focus & Calm</p>
                    <p style="font-size: 12px; opacity: 0.85; margin-top: 4px;">5 min</p>
                </div>
                <div style="background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%); border-radius: 18px; padding: 18px; color: white;">
                    <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-comments" style="font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600;">Feedback</p>
                    <p style="font-size: 12px; opacity: 0.85; margin-top: 4px;">3 min</p>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item active">
                <i class="fas fa-play-circle"></i>
                <span>Learn</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-clipboard-check"></i>
                <span>Practice</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-chart-line"></i>
                <span>Growth</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
