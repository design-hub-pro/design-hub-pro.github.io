<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>Family Portal - Player Pathway</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen" style="background: #F0FDF4;">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="dynamic-island"></div>
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0;">
                <div>
                    <p style="font-size: 15px; color: #64748B;">Family Portal</p>
                    <h1 style="font-size: 32px; font-weight: 700; color: #0F172A;">Alex's Journey</h1>
                </div>
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop&crop=face"
                     alt="Profile" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #10B981; object-fit: cover;">
            </div>

            <!-- Week's Focus Hero -->
            <div style="position: relative; border-radius: 24px; overflow: hidden; margin-top: 8px;">
                <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&h=400&fit=crop"
                     alt="Training" style="width: 100%; height: 180px; object-fit: cover;">
                <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(16,185,129,0.95) 0%, rgba(16,185,129,0.3) 50%, transparent 100%);"></div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;">
                    <span style="background: white; color: #10B981; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">THIS WEEK</span>
                    <h3 style="color: white; font-size: 20px; font-weight: 700; margin-top: 10px;">First Touch Control</h3>
                    <p style="color: rgba(255,255,255,0.9); font-size: 14px; margin-top: 6px;">Celebrate small improvements!</p>
                </div>
            </div>

            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px;">
                <div style="background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 36px; font-weight: 700; color: #10B981;">5</div>
                    <p style="font-size: 13px; color: #64748B; margin-top: 4px;">Tasks</p>
                </div>
                <div style="background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 36px; font-weight: 700; color: #8B5CF6;">3</div>
                    <p style="font-size: 13px; color: #64748B; margin-top: 4px;">Reflects</p>
                </div>
                <div style="background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="font-size: 36px; font-weight: 700; color: #0EA5E9;">2</div>
                    <p style="font-size: 13px; color: #64748B; margin-top: 4px;">Skills</p>
                </div>
            </div>

            <!-- Focus Areas -->
            <div class="section-header">
                <h2 class="section-title">Focus Areas</h2>
            </div>

            <div style="display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; -ms-overflow-style: none;">
                <div style="flex-shrink: 0; width: 140px; background: white; border-radius: 18px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="width: 48px; height: 48px; background: #ECFDF5; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-futbol" style="color: #10B981; font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600; color: #0F172A;">Ball Control</p>
                    <span style="display: inline-block; margin-top: 8px; background: #ECFDF5; color: #10B981; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;">Strong</span>
                </div>
                <div style="flex-shrink: 0; width: 140px; background: white; border-radius: 18px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="width: 48px; height: 48px; background: #FEF3C7; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-hand" style="color: #D97706; font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600; color: #0F172A;">First Touch</p>
                    <span style="display: inline-block; margin-top: 8px; background: #FEF3C7; color: #D97706; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;">Growing</span>
                </div>
                <div style="flex-shrink: 0; width: 140px; background: white; border-radius: 18px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="width: 48px; height: 48px; background: #EEF2FF; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-brain" style="color: #6366F1; font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600; color: #0F172A;">Mental</p>
                    <span style="display: inline-block; margin-top: 8px; background: #ECFDF5; color: #10B981; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;">Strong</span>
                </div>
            </div>

            <!-- Resources -->
            <div class="section-header">
                <h2 class="section-title">For Parents</h2>
            </div>

            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;">
                <div style="background: linear-gradient(135deg, #10B981 0%, #34D399 100%); border-radius: 18px; padding: 18px; color: white;">
                    <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-book" style="font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600;">Language Guide</p>
                </div>
                <div style="background: linear-gradient(135deg, #0EA5E9 0%, #38BDF8 100%); border-radius: 18px; padding: 18px; color: white;">
                    <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <i class="fas fa-car" style="font-size: 20px;"></i>
                    </div>
                    <p style="font-size: 14px; font-weight: 600;">Car Ride Tips</p>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item active" style="color: #10B981;">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-chart-line"></i>
                <span>Progress</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-book-open"></i>
                <span>Learn</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-envelope"></i>
                <span>Messages</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
