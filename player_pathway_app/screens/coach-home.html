<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>Coach Studio - Player Pathway</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="screen" style="background: #F0F9FF;">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="dynamic-island"></div>
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0;">
                <div>
                    <p style="font-size: 15px; color: #64748B;">Coach Studio</p>
                    <h1 style="font-size: 32px; font-weight: 700; color: #0F172A;">Coach Mike</h1>
                </div>
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=face"
                     alt="Profile" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid #0EA5E9; object-fit: cover;">
            </div>

            <!-- Today's Session Hero -->
            <div style="position: relative; border-radius: 24px; overflow: hidden; margin-top: 8px;">
                <img src="https://images.unsplash.com/photo-1526232761682-d26e03ac148e?w=800&h=400&fit=crop"
                     alt="Training Session" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,165,233,0.95) 0%, rgba(14,165,233,0.4) 50%, transparent 100%);"></div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;">
                    <span style="background: white; color: #0EA5E9; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">TODAY 4:00 PM</span>
                    <h3 style="color: white; font-size: 22px; font-weight: 700; margin-top: 10px;">U14 Technical Training</h3>
                    <div style="display: flex; align-items: center; gap: 16px; margin-top: 8px;">
                        <span style="color: rgba(255,255,255,0.95); font-size: 14px;"><i class="fas fa-users" style="margin-right: 6px;"></i>12 players</span>
                        <span style="color: rgba(255,255,255,0.95); font-size: 14px;"><i class="fas fa-map-marker-alt" style="margin-right: 6px;"></i>Main Field</span>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 24px;">
                <div style="background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #0EA5E9 0%, #06B6D4 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                        <i class="fas fa-calendar-plus" style="font-size: 20px; color: white;"></i>
                    </div>
                    <p style="font-size: 16px; font-weight: 600; color: #0F172A;">Plan Session</p>
                </div>
                <div style="background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                    <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #10B981 0%, #34D399 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                        <i class="fas fa-dumbbell" style="font-size: 20px; color: white;"></i>
                    </div>
                    <p style="font-size: 16px; font-weight: 600; color: #0F172A;">Drills</p>
                </div>
            </div>

            <!-- Team -->
            <div class="section-header">
                <h2 class="section-title">Team</h2>
                <a href="#" class="section-link" style="color: #0EA5E9;">View All</a>
            </div>

            <div style="background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                <div style="display: flex; gap: 4px; margin-bottom: 16px;">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=60&h=60&fit=crop&crop=face" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; object-fit: cover;">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=60&h=60&fit=crop&crop=face" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; margin-left: -12px; object-fit: cover;">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=60&h=60&fit=crop&crop=face" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; margin-left: -12px; object-fit: cover;">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=60&h=60&fit=crop&crop=face" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; margin-left: -12px; object-fit: cover;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: #E0F2FE; display: flex; align-items: center; justify-content: center; margin-left: -12px; font-size: 13px; font-weight: 600; color: #0EA5E9;">+8</div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                    <div style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: #0EA5E9;">12</div>
                        <p style="font-size: 12px; color: #64748B;">Players</p>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: #10B981;">8</div>
                        <p style="font-size: 12px; color: #64748B;">Active</p>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: #8B5CF6;">24</div>
                        <p style="font-size: 12px; color: #64748B;">Reflects</p>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="section-header">
                <h2 class="section-title">Activity</h2>
            </div>

            <div style="background: white; border-radius: 20px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);">
                <div style="display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #F1F5F9;">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=60&h=60&fit=crop&crop=face" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;">
                    <div style="flex: 1;">
                        <p style="font-size: 14px; font-weight: 500; color: #0F172A;">Alex completed 3 tasks</p>
                        <p style="font-size: 12px; color: #64748B;">2h ago</p>
                    </div>
                    <div style="width: 8px; height: 8px; background: #10B981; border-radius: 50%;"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 14px; padding: 10px 0;">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=60&h=60&fit=crop&crop=face" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;">
                    <div style="flex: 1;">
                        <p style="font-size: 14px; font-weight: 500; color: #0F172A;">Marcus added reflection</p>
                        <p style="font-size: 12px; color: #64748B;">4h ago</p>
                    </div>
                    <div style="width: 8px; height: 8px; background: #8B5CF6; border-radius: 50%;"></div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <a href="#" class="tab-item active" style="color: #0EA5E9;">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-calendar"></i>
                <span>Sessions</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-dumbbell"></i>
                <span>Drills</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-users"></i>
                <span>Team</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
