<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Pathway - Coach Feedback</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0F172A; color: #ffffff;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Status Bar */
  .status-bar {
    height: 59px; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100; background: #0F172A;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .dynamic-island {
    width: 120px; height: 36px; background: #000000;
    border-radius: 20px; position: absolute;
    left: 50%; transform: translateX(-50%); top: 10px;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Header Nav */
  .header-nav {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 28px 14px;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #60A5FA; font-size: 15px; cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(59,130,246,0.12); }
  .header-title {
    font-size: 20px; font-weight: 800; letter-spacing: -0.3px;
    flex: 1;
  }
  .player-name-pill {
    background: rgba(59,130,246,0.12);
    color: #60A5FA; font-size: 12px; font-weight: 700;
    padding: 4px 12px; border-radius: 10px;
    flex-shrink: 0;
  }

  /* Scrollable Content */
  .content-scroll {
    position: absolute; top: 110px; bottom: 0;
    left: 0; right: 0; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 28px 120px;
  }
  .content-scroll::-webkit-scrollbar { display: none; }

  /* Section Headers */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .section-label {
    font-size: 15px; font-weight: 700; letter-spacing: -0.2px;
    color: #94A3B8;
  }

  /* Player Context Card */
  .player-context {
    display: flex; align-items: center; gap: 14px;
    background: #1E293B;
    border: 1px solid rgba(59,130,246,0.15);
    border-radius: 16px; padding: 14px 16px;
    margin-bottom: 24px;
  }
  .context-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0;
    border: 2px solid rgba(59,130,246,0.3);
  }
  .context-info { flex: 1; min-width: 0; }
  .context-name { font-size: 16px; font-weight: 700; color: #F8FAFC; }
  .context-level { font-size: 13px; font-weight: 600; color: #60A5FA; margin-top: 2px; }
  .context-status {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22C55E; box-shadow: 0 0 8px rgba(34,197,94,0.4);
    flex-shrink: 0;
  }

  /* Star Rating */
  .star-rating {
    display: flex; align-items: center; gap: 6px;
    background: #1E293B;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; padding: 16px 20px;
    margin-bottom: 24px;
  }
  .star {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: rgba(255,255,255,0.12);
    cursor: pointer; transition: all 0.15s;
  }
  .star.active { color: #FBBF24; }
  .star.active i { filter: drop-shadow(0 0 6px rgba(251,191,36,0.4)); }
  .rating-label {
    margin-left: auto;
    font-size: 15px; font-weight: 700; color: #FBBF24;
  }

  /* Skill Tags */
  .skill-tags {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 24px;
  }
  .skill-tag {
    padding: 8px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .skill-tag.active.green {
    background: rgba(34,197,94,0.12);
    border-color: rgba(34,197,94,0.3);
    color: #4ADE80;
  }
  .skill-tag.active.blue {
    background: rgba(59,130,246,0.12);
    border-color: rgba(59,130,246,0.3);
    color: #60A5FA;
  }
  .skill-tag.active.orange {
    background: rgba(245,158,11,0.12);
    border-color: rgba(245,158,11,0.3);
    color: #FBBF24;
  }
  .skill-tag.active.red {
    background: rgba(239,68,68,0.12);
    border-color: rgba(239,68,68,0.3);
    color: #F87171;
  }

  /* Category Selector */
  .category-selector {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .cat-pill {
    padding: 8px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.45);
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .cat-pill.active {
    background: rgba(59,130,246,0.15);
    border-color: rgba(59,130,246,0.3);
    color: #60A5FA;
  }

  /* Textarea */
  .textarea-wrap { margin-bottom: 24px; }
  .feedback-textarea {
    width: 100%; min-height: 120px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px; font-weight: 500; color: #F1F5F9;
    font-family: inherit; outline: none;
    resize: none; line-height: 1.5;
    transition: border-color 0.2s;
  }
  .feedback-textarea::placeholder { color: rgba(255,255,255,0.25); }
  .feedback-textarea:focus { border-color: rgba(59,130,246,0.4); }

  /* Audio Card */
  .audio-card {
    background: #1E293B;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; padding: 16px;
    margin-bottom: 32px;
  }
  .audio-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
  }
  .mic-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #EF4444, #DC2626);
    border: none;
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(239,68,68,0.35);
    animation: pulse-mic 1.5s ease-in-out infinite;
    transition: all 0.15s;
  }
  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 4px 16px rgba(239,68,68,0.35); }
    50% { box-shadow: 0 4px 24px rgba(239,68,68,0.6); }
  }
  .audio-info { flex: 1; }
  .audio-status {
    font-size: 14px; font-weight: 600; color: #F87171;
    display: flex; align-items: center; gap: 8px;
  }
  .recording-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #EF4444;
    animation: blink-dot 1s ease-in-out infinite;
  }
  @keyframes blink-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .audio-time {
    font-size: 12px; font-weight: 600; color: #94A3B8; margin-top: 2px;
  }
  .waveform {
    display: flex; align-items: center; justify-content: center;
    gap: 3px; height: 40px;
  }
  .wave-bar {
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, #3B82F6, #60A5FA);
    animation: wave-pulse 0.8s ease-in-out infinite alternate;
    opacity: 0.7;
  }
  .wave-bar:nth-child(odd) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3n) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4n) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5n) { animation-delay: 0.05s; }
  .wave-bar:nth-child(7n) { animation-delay: 0.15s; }
  .wave-bar:nth-child(11n) { animation-delay: 0.25s; }
  @keyframes wave-pulse {
    0% { transform: scaleY(0.4); opacity: 0.4; }
    100% { transform: scaleY(1); opacity: 0.9; }
  }

  /* Submit Button */
  .submit-btn {
    width: 100%;
    height: 56px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    border: none; border-radius: 16px;
    color: #fff;
    font-size: 17px; font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(59,130,246,0.35), 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.2px;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(59,130,246,0.5), 0 4px 12px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Header Nav -->
  <div class="header-nav">
    <div class="back-btn"><i class="fas fa-arrow-left"></i></div>
    <span class="header-title">Add Feedback</span>
    <span class="player-name-pill">Alex Kim</span>
  </div>

  <!-- Scrollable Content Area -->
  <div class="content-scroll">

    <!-- Player Context Card -->
    <div class="player-context">
      <div class="context-avatar" style="background: linear-gradient(135deg, #EF4444, #F87171);">AK</div>
      <div class="context-info">
        <div class="context-name">Alex Kim</div>
        <div class="context-level">⭐ Level 3 — Controller</div>
      </div>
      <div class="context-status"></div>
    </div>

    <!-- Session Rating -->
    <div class="section-header">
      <span class="section-label">Session Rating</span>
    </div>
    <div class="star-rating">
      <div class="star active"><i class="fas fa-star"></i></div>
      <div class="star active"><i class="fas fa-star"></i></div>
      <div class="star active"><i class="fas fa-star"></i></div>
      <div class="star active"><i class="fas fa-star"></i></div>
      <div class="star"><i class="far fa-star"></i></div>
      <span class="rating-label">4 / 5</span>
    </div>

    <!-- Skills Observed -->
    <div class="section-header">
      <span class="section-label">Skills Observed</span>
    </div>
    <div class="skill-tags">
      <button class="skill-tag active green">⚽ Ball Mastery</button>
      <button class="skill-tag active blue">🏃 Speed</button>
      <button class="skill-tag">🤸 1v1 Moves</button>
      <button class="skill-tag active red">🎯 Shooting</button>
    </div>

    <!-- Category -->
    <div class="section-header">
      <span class="section-label">Category</span>
    </div>
    <div class="category-selector">
      <button class="cat-pill active">🏟️ Field</button>
      <button class="cat-pill">⚽ Drill</button>
      <button class="cat-pill">💡 General</button>
    </div>

    <!-- Notes -->
    <div class="section-header">
      <span class="section-label">Notes</span>
    </div>
    <div class="textarea-wrap">
      <textarea class="feedback-textarea" placeholder="Detailed feedback on today's session...">Great first touch today, needs to look up more when receiving the ball under pressure. Really improving on ball control drills — hit 42 consecutive touches in the juggling challenge.</textarea>
    </div>

    <!-- Voice Note -->
    <div class="section-header">
      <span class="section-label">Voice Note</span>
    </div>
    <div class="audio-card">
      <div class="audio-row">
        <button class="mic-btn">
          <i class="fas fa-microphone"></i>
        </button>
        <div class="audio-info">
          <div class="audio-status">
            <span class="recording-dot"></span>
            Recording...
          </div>
          <div class="audio-time">0:12</div>
        </div>
      </div>
      <div class="waveform">
        <div class="wave-bar" style="height: 12px;"></div>
        <div class="wave-bar" style="height: 24px;"></div>
        <div class="wave-bar" style="height: 18px;"></div>
        <div class="wave-bar" style="height: 32px;"></div>
        <div class="wave-bar" style="height: 14px;"></div>
        <div class="wave-bar" style="height: 28px;"></div>
        <div class="wave-bar" style="height: 20px;"></div>
        <div class="wave-bar" style="height: 36px;"></div>
        <div class="wave-bar" style="height: 16px;"></div>
        <div class="wave-bar" style="height: 26px;"></div>
        <div class="wave-bar" style="height: 10px;"></div>
        <div class="wave-bar" style="height: 30px;"></div>
        <div class="wave-bar" style="height: 22px;"></div>
        <div class="wave-bar" style="height: 18px;"></div>
        <div class="wave-bar" style="height: 34px;"></div>
        <div class="wave-bar" style="height: 14px;"></div>
        <div class="wave-bar" style="height: 24px;"></div>
        <div class="wave-bar" style="height: 20px;"></div>
        <div class="wave-bar" style="height: 28px;"></div>
        <div class="wave-bar" style="height: 16px;"></div>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="submit-btn">Save Feedback ✅</button>

  </div>

</body>
</html>
