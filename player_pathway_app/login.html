<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Pathway - Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0F172A; color: #ffffff;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Status Bar */
  .status-bar {
    height: 59px; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100; background: #0F172A;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .dynamic-island {
    width: 120px; height: 36px; background: #000000;
    border-radius: 20px; position: absolute;
    left: 50%; transform: translateX(-50%); top: 10px;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Content */
  .content {
    position: absolute; top: 59px; bottom: 0;
    left: 0; right: 0; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 28px;
    display: flex; flex-direction: column;
    align-items: center;
  }
  .content::-webkit-scrollbar { display: none; }

  /* Logo */
  .logo {
    width: 88px; height: 88px;
    background: linear-gradient(135deg, #22C55E 0%, #16A34A 50%, #15803D 100%);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 32px; margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(34, 197, 94, 0.3);
  }
  .logo i { font-size: 38px; color: #ffffff; }

  .welcome-title {
    font-size: 28px; font-weight: 800;
    letter-spacing: -0.5px; margin-bottom: 6px;
    text-align: center;
  }
  .welcome-sub {
    font-size: 14px; color: rgba(255,255,255,0.4);
    margin-bottom: 36px; text-align: center;
  }

  /* Form */
  .form-group {
    width: 100%; margin-bottom: 16px;
  }
  .form-label {
    font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px; display: block;
  }
  .form-input {
    width: 100%; height: 56px;
    background: #1E293B;
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 0 18px; padding-left: 48px;
    font-size: 16px; font-weight: 500;
    color: #ffffff;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.25); }
  .form-input:focus { border-color: #22C55E; }

  .input-wrapper {
    position: relative;
  }
  .input-icon {
    position: absolute;
    left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: rgba(255,255,255,0.25);
  }

  /* CTA Button */
  .cta-btn {
    width: 100%; height: 56px;
    background: linear-gradient(135deg, #22C55E, #16A34A);
    border: none; border-radius: 16px;
    font-size: 17px; font-weight: 700;
    color: #ffffff; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35);
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }
  .cta-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 40px rgba(34, 197, 94, 0.45);
  }

  /* Divider */
  .divider {
    display: flex; align-items: center;
    width: 100%; margin: 24px 0;
    gap: 16px;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .divider-text {
    font-size: 13px; color: rgba(255,255,255,0.3);
    font-weight: 500;
  }

  /* Social buttons */
  .social-row {
    display: flex; gap: 14px; width: 100%;
  }
  .social-btn {
    flex: 1; height: 54px;
    background: #1E293B;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    font-size: 15px; font-weight: 600;
    color: #ffffff; cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .social-btn:hover {
    border-color: rgba(255,255,255,0.15);
    background: #253347;
  }
  .social-btn i { font-size: 18px; }

  /* Sign up link */
  .signup-link {
    margin-top: 32px;
    font-size: 14px; color: rgba(255,255,255,0.4);
    text-align: center;
    padding-bottom: 40px;
  }
  .signup-link span {
    color: #22C55E; font-weight: 600;
    cursor: pointer;
  }

  /* Forgot password */
  .forgot {
    width: 100%; text-align: right;
    margin-bottom: 8px;
  }
  .forgot span {
    font-size: 13px; color: #22C55E;
    font-weight: 500; cursor: pointer;
  }
</style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Logo -->
    <div class="logo">
      <i class="fas fa-futbol"></i>
    </div>

    <div class="welcome-title">Welcome Back! &#9917;</div>
    <div class="welcome-sub">Sign in to keep your streak going</div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label">Email or Username</label>
      <div class="input-wrapper">
        <i class="fas fa-user input-icon"></i>
        <input type="text" class="form-input" placeholder="alex@example.com" value="alex_thunder11">
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" class="form-input" placeholder="Your password" value="••••••••">
      </div>
    </div>

    <!-- Forgot password -->
    <div class="forgot">
      <span>Forgot password?</span>
    </div>

    <!-- Sign In button -->
    <button class="cta-btn">Sign In &#9917;</button>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <!-- Social login -->
    <div class="social-row">
      <button class="social-btn">
        <i class="fab fa-google"></i>
        Google
      </button>
      <button class="social-btn">
        <i class="fab fa-apple"></i>
        Apple
      </button>
    </div>

    <!-- Sign up link -->
    <div class="signup-link">
      New player? <span>Sign Up</span>
    </div>

  </div>

</body>
</html>
