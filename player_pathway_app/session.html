<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>Active Training Session - Player Pathway</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0F172A;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
        }

        .screen {
            width: 100%;
            height: 100%;
            min-height: 932px;
            background: #0F172A;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            height: 59px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 28px 12px;
            position: relative;
            flex-shrink: 0;
        }

        .dynamic-island {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 38px;
            background: #000;
            border-radius: 24px;
        }

        .status-bar-time {
            font-size: 17px;
            font-weight: 600;
            color: #FFFFFF;
        }

        .status-bar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar-icons i {
            font-size: 16px;
            color: #FFFFFF;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 28px 12px;
            flex-shrink: 0;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .session-title {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.2px;
        }

        .drill-counter {
            font-size: 14px;
            font-weight: 600;
            color: #4ADE80;
            background: rgba(74, 222, 128, 0.12);
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* Session Progress */
        .progress-section {
            padding: 4px 28px 0;
            flex-shrink: 0;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #22C55E, #4ADE80);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Drill Indicator Dots */
        .drill-indicators {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 14px 28px 6px;
            flex-shrink: 0;
        }

        .drill-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            position: relative;
        }

        .drill-dot.completed {
            background: #22C55E;
            color: #FFFFFF;
        }

        .drill-dot.current {
            background: transparent;
            border: 2.5px solid #22C55E;
            color: #22C55E;
            animation: pulse-ring 2s ease-in-out infinite;
        }

        .drill-dot.current::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid rgba(34, 197, 94, 0.3);
            animation: pulse-outer 2s ease-in-out infinite;
        }

        .drill-dot.upcoming {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.3);
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
        }

        @keyframes pulse-outer {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        /* Scrollable Content */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 28px;
        }

        /* Current Drill Card */
        .drill-card {
            background: linear-gradient(145deg, #1E293B 0%, #162032 100%);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .drill-thumbnail {
            position: relative;
            width: 100%;
            height: 170px;
            overflow: hidden;
        }

        .drill-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drill-thumbnail::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(30, 41, 59, 1) 0%, rgba(30, 41, 59, 0.3) 40%, transparent 70%);
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .play-overlay i {
            color: #22C55E;
            font-size: 20px;
            margin-left: 3px;
        }

        .drill-info {
            padding: 14px 18px 18px;
        }

        .drill-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ADE80;
            margin-bottom: 6px;
        }

        .drill-name {
            font-size: 26px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.12);
            color: #4ADE80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Timer Section */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0 18px;
        }

        .timer-ring-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .timer-ring-bg {
            position: absolute;
            inset: 0;
        }

        .timer-ring-bg circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 8;
        }

        .timer-ring-progress {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .timer-ring-progress circle {
            fill: none;
            stroke: url(#timerGradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 245.04;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.4));
        }

        .timer-display {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-time {
            font-size: 56px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-total {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Glow effect behind timer */
        .timer-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 6px 28px 16px;
            flex-shrink: 0;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: none;
            background: none;
            cursor: pointer;
        }

        .control-btn-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .control-btn.secondary .control-btn-circle {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
        }

        .control-btn.primary .control-btn-circle {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            color: #FFFFFF;
            font-size: 24px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35), 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .control-btn.primary .control-btn-label {
            color: #4ADE80;
            font-weight: 600;
        }

        /* Up Next Card */
        .up-next {
            margin: 0 28px 32px;
            background: linear-gradient(145deg, #1E293B 0%, #172033 100%);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .up-next-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(74, 222, 128, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ADE80;
            font-size: 18px;
            flex-shrink: 0;
        }

        .up-next-content {
            flex: 1;
            min-width: 0;
        }

        .up-next-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 3px;
        }

        .up-next-title {
            font-size: 15px;
            font-weight: 600;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .up-next-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .up-next-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Connector lines between drill dots */
        .drill-connector {
            width: 24px;
            height: 2px;
            border-radius: 1px;
        }

        .drill-connector.done {
            background: #22C55E;
        }

        .drill-connector.pending {
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="dynamic-island"></div>
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Bar -->
        <div class="top-bar">
            <button class="close-btn">
                <i class="fas fa-xmark"></i>
            </button>
            <span class="session-title">2+2 Session</span>
            <span class="drill-counter">2/4</span>
        </div>

        <!-- Session Progress Bar -->
        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Drill Indicators -->
        <div class="drill-indicators">
            <div class="drill-dot completed">
                <i class="fas fa-check" style="font-size: 12px;"></i>
            </div>
            <div class="drill-connector done"></div>
            <div class="drill-dot completed">
                <i class="fas fa-check" style="font-size: 12px;"></i>
            </div>
            <div class="drill-connector done"></div>
            <div class="drill-dot current">
                <span style="font-size: 12px; font-weight: 700;">3</span>
            </div>
            <div class="drill-connector pending"></div>
            <div class="drill-dot upcoming">
                <span style="font-size: 12px; font-weight: 600;">4</span>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="content-scroll">
            <!-- Current Drill Card -->
            <div class="drill-card">
                <div class="drill-thumbnail">
                    <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=800" alt="Scissors Drill">
                    <div class="play-overlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <div class="drill-info">
                    <div class="drill-label">Drill 3 of 4</div>
                    <div class="drill-name">Scissors</div>
                    <div class="category-pill">
                        <i class="fas fa-futbol"></i>
                        Game Move
                    </div>
                </div>
            </div>

            <!-- Timer Section -->
            <div class="timer-section">
                <div class="timer-ring-container">
                    <!-- Background ring -->
                    <svg class="timer-ring-bg" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" />
                    </svg>
                    <!-- Progress ring -->
                    <svg class="timer-ring-progress" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#22C55E" />
                                <stop offset="100%" stop-color="#4ADE80" />
                            </linearGradient>
                        </defs>
                        <circle cx="100" cy="100" r="90" />
                    </svg>
                    <!-- Glow -->
                    <div class="timer-glow"></div>
                    <!-- Time Display -->
                    <div class="timer-display">
                        <div class="timer-time">1:42</div>
                        <div class="timer-total">3:00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="controls">
            <button class="control-btn secondary">
                <div class="control-btn-circle">
                    <i class="fas fa-rotate-left"></i>
                </div>
                <span class="control-btn-label">Restart</span>
            </button>
            <button class="control-btn primary">
                <div class="control-btn-circle">
                    <i class="fas fa-pause"></i>
                </div>
                <span class="control-btn-label">Pause</span>
            </button>
            <button class="control-btn secondary">
                <div class="control-btn-circle">
                    <i class="fas fa-forward-step"></i>
                </div>
                <span class="control-btn-label">Skip</span>
            </button>
        </div>

        <!-- Up Next -->
        <div class="up-next">
            <div class="up-next-icon">
                <i class="fas fa-forward"></i>
            </div>
            <div class="up-next-content">
                <div class="up-next-label">Up Next</div>
                <div class="up-next-title">Quick Feet</div>
                <div class="up-next-meta">Speed Drill &middot; 3 min</div>
            </div>
            <div class="up-next-arrow">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
    </div>
</body>
</html>
