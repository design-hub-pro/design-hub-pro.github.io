<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Pathway - Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0F172A; color: #ffffff;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Status Bar */
  .status-bar {
    height: 59px; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100; background: #0F172A;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .dynamic-island {
    width: 120px; height: 36px; background: #000000;
    border-radius: 20px; position: absolute;
    left: 50%; transform: translateX(-50%); top: 10px;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Content */
  .content {
    position: absolute; top: 59px; bottom: 0;
    left: 0; right: 0; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 0 28px 40px;
  }
  .content::-webkit-scrollbar { display: none; }

  /* Step dots */
  .step-dots {
    display: flex; justify-content: center;
    gap: 8px; padding: 16px 0 28px;
  }
  .dot {
    height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.12);
    transition: all 0.3s;
  }
  .dot.inactive { width: 6px; }
  .dot.active {
    width: 24px;
    background: linear-gradient(90deg, #22C55E, #4ADE80);
  }
  .dot.done {
    width: 6px;
    background: #22C55E;
  }

  /* Heading */
  .heading {
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px;
    text-align: center;
    margin-bottom: 24px;
  }

  /* Avatar Grid */
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .avatar-option {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    cursor: pointer;
  }
  .avatar-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    border: 3px solid transparent;
    transition: all 0.3s;
    position: relative;
  }
  .avatar-circle.lion { background: rgba(245, 158, 11, 0.15); }
  .avatar-circle.wolf { background: rgba(100, 116, 139, 0.2); }
  .avatar-circle.eagle { background: rgba(59, 130, 246, 0.15); }
  .avatar-circle.dragon { background: rgba(239, 68, 68, 0.15); }
  .avatar-circle.thunder { background: rgba(168, 85, 247, 0.15); }
  .avatar-circle.fire { background: rgba(249, 115, 22, 0.15); }

  .avatar-circle.selected {
    border-color: #22C55E;
    box-shadow: 0 0 24px rgba(34, 197, 94, 0.35), 0 0 48px rgba(34, 197, 94, 0.15);
  }
  .avatar-circle:not(.selected) {
    animation: avatarFloat 3s ease-in-out infinite;
  }
  .avatar-option:nth-child(2) .avatar-circle:not(.selected) { animation-delay: 0.3s; }
  .avatar-option:nth-child(3) .avatar-circle:not(.selected) { animation-delay: 0.6s; }
  .avatar-option:nth-child(4) .avatar-circle:not(.selected) { animation-delay: 0.9s; }
  .avatar-option:nth-child(5) .avatar-circle:not(.selected) { animation-delay: 1.2s; }
  .avatar-option:nth-child(6) .avatar-circle:not(.selected) { animation-delay: 1.5s; }

  @keyframes avatarFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .avatar-circle .check {
    position: absolute;
    bottom: -2px; right: -2px;
    width: 22px; height: 22px;
    background: #22C55E;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: white;
    border: 2px solid #0F172A;
  }

  .avatar-label {
    font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
  .avatar-option .avatar-label.selected-label {
    color: #4ADE80;
  }

  /* Name input */
  .section-label {
    font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
  }
  .name-input {
    width: 100%; height: 54px;
    background: #1E293B;
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 0 18px;
    font-size: 17px; font-weight: 600;
    color: #ffffff;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 28px;
  }
  .name-input:focus { border-color: #22C55E; }

  /* Level selector */
  .level-options {
    display: flex; flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }
  .level-option {
    display: flex; align-items: center;
    padding: 16px 18px;
    background: #1E293B;
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    gap: 14px;
  }
  .level-option.selected {
    border-color: #22C55E;
    background: rgba(34, 197, 94, 0.08);
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.12);
  }
  .level-stars {
    font-size: 16px; min-width: 60px;
  }
  .level-name {
    font-size: 16px; font-weight: 700;
    flex: 1;
  }
  .level-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .level-option.selected .level-check {
    background: #22C55E;
    border-color: #22C55E;
  }
  .level-option.selected .level-check i {
    font-size: 11px; color: white;
  }

  /* CTA Button */
  .cta-btn {
    width: 100%; height: 56px;
    background: linear-gradient(135deg, #22C55E, #16A34A);
    border: none; border-radius: 16px;
    font-size: 17px; font-weight: 700;
    color: #ffffff; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .cta-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 40px rgba(34, 197, 94, 0.45);
  }
</style>
</head>
<body>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Step indicator -->
    <div class="step-dots">
      <div class="dot done"></div>
      <div class="dot active"></div>
      <div class="dot inactive"></div>
    </div>

    <!-- Heading -->
    <div class="heading">Pick Your Avatar! &#127917;</div>

    <!-- Avatar grid -->
    <div class="avatar-grid">
      <div class="avatar-option">
        <div class="avatar-circle lion">&#129409;</div>
        <span class="avatar-label">Lion</span>
      </div>
      <div class="avatar-option">
        <div class="avatar-circle wolf selected">
          &#128058;
          <div class="check"><i class="fas fa-check"></i></div>
        </div>
        <span class="avatar-label selected-label">Wolf</span>
      </div>
      <div class="avatar-option">
        <div class="avatar-circle eagle">&#129413;</div>
        <span class="avatar-label">Eagle</span>
      </div>
      <div class="avatar-option">
        <div class="avatar-circle dragon">&#128009;</div>
        <span class="avatar-label">Dragon</span>
      </div>
      <div class="avatar-option">
        <div class="avatar-circle thunder">&#9889;</div>
        <span class="avatar-label">Thunder</span>
      </div>
      <div class="avatar-option">
        <div class="avatar-circle fire">&#128293;</div>
        <span class="avatar-label">Fire</span>
      </div>
    </div>

    <!-- Player name -->
    <div class="section-label">Your Player Name</div>
    <input type="text" class="name-input" value="Alex">

    <!-- Level selector -->
    <div class="section-label">What's your level?</div>
    <div class="level-options">
      <div class="level-option">
        <div class="level-stars">&#11088;</div>
        <div class="level-name">Beginner</div>
        <div class="level-check"></div>
      </div>
      <div class="level-option selected">
        <div class="level-stars">&#11088;&#11088;</div>
        <div class="level-name">Intermediate</div>
        <div class="level-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="level-option">
        <div class="level-stars">&#11088;&#11088;&#11088;</div>
        <div class="level-name">Advanced</div>
        <div class="level-check"></div>
      </div>
    </div>

    <!-- CTA -->
    <button class="cta-btn">Let's Go! &#128640;</button>

  </div>

</body>
</html>
