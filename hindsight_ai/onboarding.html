<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindsight - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #ffffff; }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
    </style>
</head>
<body class="bg-white">
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2 bg-white">
        <span class="text-sm font-semibold">9:41</span>
        <div class="w-32 h-[34px] bg-black rounded-full mt-3"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Progress -->
    <div class="content-area pt-3 flex items-center gap-2">
        <div class="h-1.5 flex-1 bg-gradient-to-r from-orange-500 to-rose-600 rounded-full"></div>
        <div class="h-1.5 flex-1 bg-gray-100 rounded-full"></div>
        <div class="h-1.5 flex-1 bg-gray-100 rounded-full"></div>
    </div>

    <!-- Intro -->
    <div class="content-area mt-6">
        <div class="w-14 h-14 bg-gradient-to-br from-orange-500 to-rose-600 rounded-2xl flex items-center justify-center shadow-lg shadow-rose-200 mb-4">
            <i class="fas fa-clock-rotate-left text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 leading-tight">What are you<br>navigating right now?</h1>
        <p class="text-sm text-gray-400 mt-2">We'll tailor answers from people in the same chapter.</p>
    </div>

    <!-- Life stage grid -->
    <div class="content-area mt-6">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gradient-to-br from-orange-500 to-rose-600 rounded-2xl p-4 relative overflow-hidden ring-2 ring-rose-300">
                <i class="fas fa-graduation-cap text-white text-xl mb-6"></i>
                <p class="text-white text-sm font-bold">High School</p>
                <div class="absolute top-3 right-3 w-5 h-5 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-rose-600 text-[10px]"></i>
                </div>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                <i class="fas fa-building-columns text-gray-400 text-xl mb-6"></i>
                <p class="text-gray-700 text-sm font-bold">College</p>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                <i class="fas fa-briefcase text-gray-400 text-xl mb-6"></i>
                <p class="text-gray-700 text-sm font-bold">First Job</p>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                <i class="fas fa-arrow-right-arrow-left text-gray-400 text-xl mb-6"></i>
                <p class="text-gray-700 text-sm font-bold">Career Change</p>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                <i class="fas fa-seedling text-gray-400 text-xl mb-6"></i>
                <p class="text-gray-700 text-sm font-bold">Parenting</p>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4">
                <i class="fas fa-umbrella-beach text-gray-400 text-xl mb-6"></i>
                <p class="text-gray-700 text-sm font-bold">Retirement</p>
            </div>
        </div>
    </div>

    <!-- Bottom -->
    <div class="tab-bar bg-white content-area py-4">
        <button class="w-full bg-gray-900 text-white text-sm font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2">
            Continue
            <i class="fas fa-arrow-right text-xs"></i>
        </button>
        <p class="text-center text-xs text-gray-400 font-medium mt-3">Skip for now</p>
    </div>
</body>
</html>
