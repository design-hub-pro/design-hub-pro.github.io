<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataKitchen — Smart Kitchen Measurement Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 14px #1a1a1a, 0 0 0 16px #333;
            background: #1a1a1a;
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #1a1a1a;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 10;
        }
        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 44px;
        }
        .screen-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 16px;
            font-size: 14px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <header class="py-16 px-8 text-center">
        <div class="flex items-center justify-center space-x-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-utensils text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-3">DataKitchen</h1>
        <p class="text-xl text-gray-500 max-w-xl mx-auto">
            Smart kitchen measurement decisions under uncertainty
        </p>
    </header>

    <!-- Screenshots Grid -->
    <main class="mx-auto px-8 pb-24">
        <!-- Row 1: Home & Smart Conversion -->
        <div class="flex flex-wrap justify-center gap-10 mb-12">
            <!-- Home Screen -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Home</p>
                <div class="phone-frame">
                    <iframe src="home.html"></iframe>
                </div>
            </div>

            <!-- Smart Conversion -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Smart Conversion</p>
                <div class="phone-frame">
                    <iframe src="conversion.html"></iframe>
                </div>
            </div>
        </div>

        <!-- Row 2: Estimation (Gesture, Amount, Photo) -->
        <div class="flex flex-wrap justify-center gap-10 mb-12">
            <!-- Hand Estimation: Gesture to Amount -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Gesture → Amount</p>
                <div class="phone-frame">
                    <iframe src="estimation.html"></iframe>
                </div>
            </div>

            <!-- Hand Estimation: Amount to Gesture -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Amount → Gesture</p>
                <div class="phone-frame">
                    <iframe src="estimation-reverse.html"></iframe>
                </div>
            </div>

            <!-- Photo Estimation -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Photo Estimate</p>
                <div class="phone-frame">
                    <iframe src="photo.html"></iframe>
                </div>
            </div>
        </div>

        <!-- Row 3: Recipes -->
        <div class="flex flex-wrap justify-center gap-10 mb-12">
            <!-- Recipe List -->
            <div class="flex flex-col items-center">
                <p class="screen-label">My Recipes</p>
                <div class="phone-frame">
                    <iframe src="recipe-list.html"></iframe>
                </div>
            </div>

            <!-- Recipe Scale -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Recipe Scale</p>
                <div class="phone-frame">
                    <iframe src="recipe.html"></iframe>
                </div>
            </div>
        </div>

        <!-- Row 4: Group Meal Planning -->
        <div class="flex flex-wrap justify-center gap-10">
            <!-- Group Meal Setup -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Meal Setup</p>
                <div class="phone-frame">
                    <iframe src="planning-setup.html"></iframe>
                </div>
            </div>

            <!-- Group Meal Planning -->
            <div class="flex flex-col items-center">
                <p class="screen-label">Meal Plan</p>
                <div class="phone-frame">
                    <iframe src="planning.html"></iframe>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
