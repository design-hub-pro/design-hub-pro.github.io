<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataKitchen - Plan Group Meal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #be185d;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- iOS Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-medium">9:41</span>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header with Back -->
    <div class="bg-white px-4 py-4 flex items-center border-b border-gray-100">
        <button class="w-10 h-10 flex items-center justify-center">
            <i class="fas fa-chevron-left text-gray-700"></i>
        </button>
        <h1 class="flex-1 text-center text-lg font-semibold text-gray-900">Plan Group Meal</h1>
        <button class="w-10 h-10 flex items-center justify-center">
            <i class="fas fa-redo text-gray-400"></i>
        </button>
    </div>

    <!-- Main Content -->
    <div class="px-5 py-6 pb-32">
        <!-- Event Name -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-2 block">Event Name</label>
            <input type="text" value="Church Potluck" class="w-full bg-gray-100 rounded-xl px-4 py-3 text-lg font-medium focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>

        <!-- People Count -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <div class="flex items-center justify-between mb-4">
                <label class="text-sm text-gray-500">Number of People</label>
                <span class="text-2xl font-bold text-rose-600">75</span>
            </div>
            <input type="range" min="10" max="200" value="75" class="w-full bg-rose-100">
            <div class="flex justify-between text-xs text-gray-400 mt-2">
                <span>10</span>
                <span>50</span>
                <span>100</span>
                <span>150</span>
                <span>200</span>
            </div>
        </div>

        <!-- Age Distribution -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-3 block">Age Distribution</label>
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-child text-blue-500 text-sm"></i>
                        </div>
                        <span class="text-sm text-gray-700">Children (under 12)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-minus text-gray-500 text-xs"></i>
                        </button>
                        <span class="w-8 text-center font-semibold">15</span>
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-plus text-gray-500 text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-user text-emerald-500 text-sm"></i>
                        </div>
                        <span class="text-sm text-gray-700">Adults (12-60)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-minus text-gray-500 text-xs"></i>
                        </button>
                        <span class="w-8 text-center font-semibold">48</span>
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-plus text-gray-500 text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-user-tie text-purple-500 text-sm"></i>
                        </div>
                        <span class="text-sm text-gray-700">Seniors (60+)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-minus text-gray-500 text-xs"></i>
                        </button>
                        <span class="w-8 text-center font-semibold">12</span>
                        <button class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-plus text-gray-500 text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Budget Range -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-3 block">Budget Range</label>
            <div class="flex space-x-3">
                <div class="flex-1">
                    <p class="text-xs text-gray-400 mb-1">Min</p>
                    <div class="flex items-center bg-gray-100 rounded-xl px-3 py-2">
                        <span class="text-gray-500">$</span>
                        <input type="number" value="300" class="w-full bg-transparent text-lg font-semibold focus:outline-none ml-1">
                    </div>
                </div>
                <div class="flex items-end pb-2">
                    <span class="text-gray-400">—</span>
                </div>
                <div class="flex-1">
                    <p class="text-xs text-gray-400 mb-1">Max</p>
                    <div class="flex items-center bg-gray-100 rounded-xl px-3 py-2">
                        <span class="text-gray-500">$</span>
                        <input type="number" value="400" class="w-full bg-transparent text-lg font-semibold focus:outline-none ml-1">
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-400 mt-2 text-center">~$4.00 - $5.33 per person</p>
        </div>

        <!-- Nutrition Goals -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-3 block">Nutrition Goals</label>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-rose-50 border-2 border-rose-300 rounded-xl p-3 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 bg-rose-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-drumstick-bite text-rose-500"></i>
                    </div>
                    <p class="text-sm font-medium text-gray-900">High Protein</p>
                    <p class="text-xs text-gray-500">25g+ per serving</p>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-3 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-balance-scale text-gray-400"></i>
                    </div>
                    <p class="text-sm font-medium text-gray-900">Balanced</p>
                    <p class="text-xs text-gray-500">Standard portions</p>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-3 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-leaf text-gray-400"></i>
                    </div>
                    <p class="text-sm font-medium text-gray-900">Low Carb</p>
                    <p class="text-xs text-gray-500">Reduced starches</p>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-3 text-center">
                    <div class="w-10 h-10 mx-auto mb-2 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-seedling text-gray-400"></i>
                    </div>
                    <p class="text-sm font-medium text-gray-900">Vegetarian</p>
                    <p class="text-xs text-gray-500">No meat</p>
                </div>
            </div>
        </div>

        <!-- Meal Type -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <label class="text-sm text-gray-500 mb-3 block">Meal Type</label>
            <div class="flex space-x-2">
                <button class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 font-medium text-sm">Breakfast</button>
                <button class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 font-medium text-sm">Lunch</button>
                <button class="flex-1 bg-rose-500 text-white rounded-xl py-3 font-medium text-sm">Dinner</button>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Button -->
    <div class="fixed bottom-20 left-0 right-0 px-5">
        <button class="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white rounded-2xl py-4 font-semibold text-lg shadow-lg flex items-center justify-center space-x-2">
            <span>Generate Plan</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-around items-center">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-history text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">History</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-bookmark text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Saved</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-cog text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Settings</span>
        </div>
    </div>
</body>
</html>
