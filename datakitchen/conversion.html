<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataKitchen - Smart Conversion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- iOS Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-medium">9:41</span>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header with Back -->
    <div class="bg-white px-4 py-4 flex items-center border-b border-gray-100">
        <button class="w-10 h-10 flex items-center justify-center">
            <i class="fas fa-chevron-left text-gray-700"></i>
        </button>
        <h1 class="flex-1 text-center text-lg font-semibold text-gray-900">Smart Conversion</h1>
        <button class="w-10 h-10 flex items-center justify-center">
            <i class="fas fa-info-circle text-gray-400"></i>
        </button>
    </div>

    <!-- Main Content -->
    <div class="px-5 py-6 pb-24">
        <!-- Input Section -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-2 block">Amount</label>
            <div class="flex items-center space-x-3">
                <input type="number" value="2" class="w-20 bg-gray-100 rounded-xl px-4 py-3 text-2xl font-semibold text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select class="flex-1 bg-gray-100 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                    <option>cups</option>
                    <option>tablespoons</option>
                    <option>teaspoons</option>
                    <option>ml</option>
                    <option>oz (fluid)</option>
                </select>
            </div>
        </div>

        <!-- Ingredient Selection -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
            <label class="text-sm text-gray-500 mb-3 block">Ingredient</label>
            <div class="flex items-center space-x-3 bg-blue-50 rounded-xl p-3 border-2 border-blue-200">
                <div class="w-12 h-12 rounded-lg overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=100&h=100&fit=crop" alt="Flour" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900">All-Purpose Flour</p>
                    <p class="text-sm text-gray-500">Density varies by packing</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>

            <!-- Quick Select -->
            <div class="flex flex-wrap gap-2 mt-4">
                <span class="bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">Sugar</span>
                <span class="bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">Butter</span>
                <span class="bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">Rice</span>
                <span class="bg-gray-100 px-3 py-1.5 rounded-full text-sm text-gray-600">Oil</span>
            </div>
        </div>

        <!-- Convert To -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
            <label class="text-sm text-gray-500 mb-2 block">Convert to</label>
            <div class="flex space-x-2">
                <button class="flex-1 bg-blue-500 text-white rounded-xl py-3 font-medium">Grams</button>
                <button class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 font-medium">Ounces</button>
                <button class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-3 font-medium">Pounds</button>
            </div>
        </div>

        <!-- Result Card -->
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 shadow-lg">
            <div class="text-center mb-4">
                <p class="text-blue-100 text-sm">Recommended</p>
                <p class="text-white text-4xl font-bold mt-1">250g</p>
            </div>

            <!-- Range Visualization -->
            <div class="bg-white/20 rounded-xl p-4 mb-4">
                <div class="flex justify-between text-white text-sm mb-2">
                    <span>Likely Range</span>
                    <span>240g - 260g</span>
                </div>
                <div class="h-2 bg-white/30 rounded-full overflow-hidden">
                    <div class="h-full bg-white rounded-full" style="width: 70%; margin-left: 15%"></div>
                </div>
                <div class="flex justify-between text-blue-100 text-xs mt-2">
                    <span>Loose scooped</span>
                    <span>Packed</span>
                </div>
            </div>

            <!-- Why the range -->
            <div class="flex items-start space-x-3">
                <div class="bg-white/20 rounded-full p-2 mt-0.5">
                    <i class="fas fa-info text-white text-xs"></i>
                </div>
                <p class="text-blue-100 text-sm leading-relaxed">
                    Flour density varies by how you scoop. Spooned flour is lighter than scooped and packed.
                </p>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-around items-center">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-history text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">History</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-bookmark text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Saved</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-cog text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400 mt-1">Settings</span>
        </div>
    </div>
</body>
</html>
