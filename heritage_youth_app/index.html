<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Alive - Youth ICH Platform</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
  min-height: 100vh;
}

/* Hero Section */
.hero {
  text-align: center;
  padding: 80px 40px 50px;
  max-width: 900px;
  margin: 0 auto;
}
.app-icon {
  width: 80px;
  height: 80px;
  border-radius: 22px;
  background: linear-gradient(135deg, #FF6B35, #F7931E);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
}
.app-icon i { font-size: 36px; color: #fff; }
.hero h1 {
  font-size: 48px;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #1a1a1a, #444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero .tagline {
  font-size: 20px;
  color: #888;
  font-weight: 400;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.5;
}

/* Screenshots Grid */
.screenshots-section {
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 40px 80px;
}

.section-label {
  text-align: center;
  margin-bottom: 50px;
}
.section-label h2 {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: #FF6B35;
  margin-bottom: 8px;
}
.section-label p {
  font-size: 16px;
  color: #999;
}

.phone-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
  justify-items: center;
  max-width: 1560px;
  margin: 0 auto;
}

.phone-wrapper {
  text-align: center;
}

.phone-frame {
  width: 460px;
  height: 980px;
  border-radius: 62px;
  background: #1a1a1a;
  padding: 12px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15), 0 4px 20px rgba(0, 0, 0, 0.08);
  position: relative;
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 52px;
  overflow: hidden;
  background: #000;
}

.phone-screen iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.phone-label {
  margin-top: 20px;
  font-size: 15px;
  font-weight: 600;
  color: #666;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <div class="app-icon">
    <i class="fas fa-fire-flame-curved"></i>
  </div>
  <h1>Heritage Alive</h1>
  <p class="tagline">A youth-led platform for discovering, learning, creating, and preserving intangible cultural heritage through short videos, courses, and community.</p>
</div>

<!-- Screenshots -->
<div class="screenshots-section">
  <div class="section-label">
    <h2>App Design</h2>
    <p>High-fidelity prototype screens</p>
  </div>

  <div class="phone-grid">
    <!-- Row 1 -->
    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="discover.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Discover</div>
    </div>

    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="video_player.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Video Player</div>
    </div>

    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="learn.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Learn</div>
    </div>

    <!-- Row 2 -->
    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="course_detail.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Course Detail</div>
    </div>

    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="create.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Create</div>
    </div>

    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="connect.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Connect</div>
    </div>

    <!-- Row 3 -->
    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="master_profile.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Master Profile</div>
    </div>

    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="profile.html" scrolling="no"></iframe>
        </div>
      </div>
      <div class="phone-label">Profile</div>
    </div>
  </div>
</div>

</body>
</html>
