<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 - 遗火相传</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body { font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif; background: #000; color: #fff; width: 100%; height: 100%; overflow-x: hidden; }
html { width: 100%; height: 100%; }

.status-bar {
  height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px 28px; position: sticky; top: 0; z-index: 100; background: #000;
}
.status-time { font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

.content { padding: 0 28px 120px 28px; }

.profile-header { text-align: center; margin-bottom: 24px; }
.profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #FF6B35; margin-bottom: 12px; }
.profile-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.profile-handle { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 6px; font-family: 'Inter', sans-serif; }
.profile-bio { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.4; max-width: 260px; margin: 0 auto 16px; }
.profile-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 20px; }
.profile-stat { text-align: center; }
.profile-stat-num { font-size: 22px; font-weight: 800; font-family: 'Inter', sans-serif; }
.profile-stat-label { font-size: 11px; color: rgba(255,255,255,0.35); }
.edit-btn { display: inline-block; padding: 8px 32px; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; margin-top: 24px; }
.section-title { font-size: 20px; font-weight: 700; }
.see-all { font-size: 13px; color: #FF6B35; font-weight: 600; }

.badges-row { display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; }
.badge-mini {
  width: 52px; height: 52px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  flex-shrink: 0; background: linear-gradient(135deg, #FF6B35, #F7931E);
}

.achievement-card {
  background: linear-gradient(135deg, rgba(255,107,53,0.12), rgba(175,82,222,0.08));
  border-radius: 20px; padding: 20px; margin-bottom: 24px;
  border: 1px solid rgba(255,107,53,0.1);
}
.achievement-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.achievement-icon {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, #FF6B35, #F7931E);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.achievement-header h4 { font-size: 16px; font-weight: 700; }
.achievement-header p { font-size: 11px; color: rgba(255,255,255,0.4); }
.achievement-progress { height: 6px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
.achievement-fill { height: 100%; background: linear-gradient(90deg, #FF6B35, #AF52DE); border-radius: 6px; }
.achievement-text { font-size: 11px; color: rgba(255,255,255,0.35); }

.portfolio-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.portfolio-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.3); }
.portfolio-tab.active { color: #fff; border-bottom: 2px solid #FF6B35; }

.portfolio-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-bottom: 24px; }
.portfolio-item { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; }
.portfolio-item img { width: 100%; height: 100%; object-fit: cover; }
.portfolio-item .vid-icon { position: absolute; top: 6px; right: 6px; font-size: 12px; color: rgba(255,255,255,0.8); }

.settings-list { display: flex; flex-direction: column; gap: 2px; }
.settings-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
.settings-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); flex-shrink: 0;
}
.settings-item span { font-size: 14px; font-weight: 500; flex: 1; }
.settings-item .arrow { font-size: 14px; color: rgba(255,255,255,0.15); }

.tab-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(20px);
  display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
  border-top: 0.5px solid rgba(255,255,255,0.08);
}
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.35); }
.tab-item.active { color: #FF6B35; }
.tab-item i { font-size: 22px; }
.tab-item.create-tab i { background: linear-gradient(135deg, #FF6B35, #F7931E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
</div>

<div class="content">
  <div class="profile-header">
    <img class="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80" alt="">
    <div class="profile-name">张美琳</div>
    <div class="profile-handle">@meilin_heritage</div>
    <div class="profile-bio">热爱非遗的青少年创作者，用现代视角探索传统工艺之美。</div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="profile-stat-num">24</div><div class="profile-stat-label">作品</div></div>
      <div class="profile-stat"><div class="profile-stat-num">1.2K</div><div class="profile-stat-label">粉丝</div></div>
      <div class="profile-stat"><div class="profile-stat-num">86</div><div class="profile-stat-label">关注</div></div>
    </div>
    <div class="edit-btn">编辑资料</div>
  </div>

  <div class="section-header"><div class="section-title">徽章</div><span class="see-all">已获得 4 枚</span></div>
  <div class="badges-row">
    <div class="badge-mini"><i class="fas fa-cut"></i></div>
    <div class="badge-mini"><i class="fas fa-camera"></i></div>
    <div class="badge-mini"><i class="fas fa-palette"></i></div>
    <div class="badge-mini"><i class="fas fa-fire"></i></div>
  </div>

  <div class="achievement-card">
    <div class="achievement-header">
      <div class="achievement-icon"><i class="fas fa-trophy"></i></div>
      <div><h4>非遗探索家</h4><p>完成 10 个非遗类别的探索</p></div>
    </div>
    <div class="achievement-progress"><div class="achievement-fill" style="width: 70%;"></div></div>
    <div class="achievement-text">已探索 7 / 10 个类别</div>
  </div>

  <div class="portfolio-tabs">
    <div class="portfolio-tab active"><i class="fas fa-th"></i> &nbsp;作品</div>
    <div class="portfolio-tab"><i class="fas fa-heart"></i> &nbsp;点赞</div>
    <div class="portfolio-tab"><i class="fas fa-bookmark"></i> &nbsp;收藏</div>
  </div>
  <div class="portfolio-grid">
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=300&q=80" alt=""><span class="vid-icon"><i class="fas fa-play"></i></span></div>
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=300&q=80" alt=""></div>
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1582738411706-bfc8e691d1c2?w=300&q=80" alt=""><span class="vid-icon"><i class="fas fa-play"></i></span></div>
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=300&q=80" alt=""></div>
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300&q=80" alt=""><span class="vid-icon"><i class="fas fa-play"></i></span></div>
    <div class="portfolio-item"><img src="https://images.unsplash.com/photo-1528396518501-b53b655eb9b3?w=300&q=80" alt=""></div>
  </div>

  <div class="settings-list">
    <div class="settings-item"><div class="settings-icon"><i class="fas fa-cog"></i></div><span>设置</span><i class="fas fa-chevron-right arrow"></i></div>
    <div class="settings-item"><div class="settings-icon"><i class="fas fa-globe"></i></div><span>语言</span><i class="fas fa-chevron-right arrow"></i></div>
    <div class="settings-item"><div class="settings-icon"><i class="fas fa-question-circle"></i></div><span>帮助与反馈</span><i class="fas fa-chevron-right arrow"></i></div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-item"><i class="fas fa-compass"></i><span>发现</span></div>
  <div class="tab-item"><i class="fas fa-book-open"></i><span>学习</span></div>
  <div class="tab-item create-tab"><i class="fas fa-plus-circle"></i><span style="background: linear-gradient(135deg, #FF6B35, #F7931E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">创作</span></div>
  <div class="tab-item"><i class="fas fa-users"></i><span>社区</span></div>
  <div class="tab-item active"><i class="fas fa-user"></i><span>我的</span></div>
</div>

</body>
</html>
