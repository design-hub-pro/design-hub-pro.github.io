<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创作 - 遗火相传</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body { font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif; background: #000; color: #fff; width: 100%; height: 100%; overflow-x: hidden; }
html { width: 100%; height: 100%; }

.status-bar {
  height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px 28px; position: sticky; top: 0; z-index: 100; background: #000;
}
.status-time { font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

.content { padding: 0 28px 120px 28px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { font-size: 28px; font-weight: 800; }

.create-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.create-option {
  padding: 24px 16px; border-radius: 20px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.create-option i { font-size: 32px; }
.create-option h4 { font-size: 14px; font-weight: 700; }
.create-option p { font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.3; }
.opt-video { background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,107,53,0.05)); }
.opt-photo { background: linear-gradient(135deg, rgba(0,122,255,0.2), rgba(0,122,255,0.05)); }
.opt-doc { background: linear-gradient(135deg, rgba(52,199,89,0.2), rgba(52,199,89,0.05)); }
.opt-remix { background: linear-gradient(135deg, rgba(175,82,222,0.2), rgba(175,82,222,0.05)); }
.opt-video i { color: #FF6B35; }
.opt-photo i { color: #007AFF; }
.opt-doc i { color: #34C759; }
.opt-remix i { color: #AF52DE; }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-title { font-size: 20px; font-weight: 700; }
.see-all { font-size: 13px; color: #FF6B35; font-weight: 600; }

.ai-tools {
  display: flex; gap: 12px; overflow-x: auto; margin-bottom: 28px;
  margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px;
}
.ai-tool { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(255,255,255,0.04); border-radius: 14px; flex-shrink: 0; }
.ai-tool-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.ai-tool h5 { font-size: 13px; font-weight: 600; white-space: nowrap; }
.ai-tool p { font-size: 10px; color: rgba(255,255,255,0.35); white-space: nowrap; }

.template-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
.template-item { position: relative; border-radius: 14px; overflow: hidden; height: 150px; }
.template-item img { width: 100%; height: 100%; object-fit: cover; }
.template-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
.template-overlay span { font-size: 11px; font-weight: 600; }
.template-use {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
  border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
}

.trending-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.tag { padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,0.04); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5); }
.tag.hot { background: rgba(255,107,53,0.1); color: #FF6B35; }

.section-header-with-filter { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.filter-pills { display: flex; gap: 8px; }
.filter-pill { padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
.filter-pill.active { background: rgba(255,107,53,0.15); color: #FF6B35; }

.works-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.work-item { border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.04); }
.work-img { position: relative; height: 140px; }
.work-img img { width: 100%; height: 100%; object-fit: cover; }
.work-status { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; }
.status-published { background: rgba(52,199,89,0.8); }
.status-draft { background: rgba(255,159,10,0.8); }
.work-body { padding: 10px 12px; }
.work-body h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.work-stats { display: flex; gap: 10px; font-size: 11px; color: rgba(255,255,255,0.3); }

.tab-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(20px);
  display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
  border-top: 0.5px solid rgba(255,255,255,0.08);
}
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.35); }
.tab-item.active { color: #FF6B35; }
.tab-item i { font-size: 22px; }
.tab-item.create-tab i { background: linear-gradient(135deg, #FF6B35, #F7931E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
</div>

<div class="content">
  <div class="header">
    <h1>创作</h1>
    <i class="fas fa-folder-open" style="font-size: 20px; opacity: 0.5;"></i>
  </div>

  <div class="create-options">
    <div class="create-option opt-video"><i class="fas fa-video"></i><h4>视频</h4><p>拍摄或剪辑非遗视频</p></div>
    <div class="create-option opt-photo"><i class="fas fa-camera"></i><h4>图文故事</h4><p>用图片记录非遗</p></div>
    <div class="create-option opt-doc"><i class="fas fa-file-alt"></i><h4>过程记录</h4><p>逐步记录创作过程</p></div>
    <div class="create-option opt-remix"><i class="fas fa-magic"></i><h4>再创作</h4><p>传统与现代的融合</p></div>
  </div>

  <div class="section-header"><div class="section-title">AI 助手</div></div>
  <div class="ai-tools">
    <div class="ai-tool">
      <div class="ai-tool-icon" style="background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(247,147,30,0.1));"><i class="fas fa-closed-captioning" style="color: #FF6B35;"></i></div>
      <div><h5>自动字幕</h5><p>中英双语生成</p></div>
    </div>
    <div class="ai-tool">
      <div class="ai-tool-icon" style="background: linear-gradient(135deg, rgba(0,122,255,0.2), rgba(0,122,255,0.1));"><i class="fas fa-cut" style="color: #007AFF;"></i></div>
      <div><h5>智能剪辑</h5><p>一键美化视频</p></div>
    </div>
    <div class="ai-tool">
      <div class="ai-tool-icon" style="background: linear-gradient(135deg, rgba(52,199,89,0.2), rgba(52,199,89,0.1));"><i class="fas fa-book" style="color: #34C759;"></i></div>
      <div><h5>非遗词典</h5><p>术语自动解释</p></div>
    </div>
  </div>

  <div class="section-header"><div class="section-title">模板</div><span class="see-all">查看全部</span></div>
  <div class="template-grid">
    <div class="template-item">
      <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=300&q=80" alt="">
      <div class="template-use"><i class="fas fa-plus"></i></div>
      <div class="template-overlay"><span>工艺流程</span></div>
    </div>
    <div class="template-item">
      <img src="https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=300&q=80" alt="">
      <div class="template-use"><i class="fas fa-plus"></i></div>
      <div class="template-overlay"><span>表演记录</span></div>
    </div>
    <div class="template-item">
      <img src="https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=300&q=80" alt="">
      <div class="template-use"><i class="fas fa-plus"></i></div>
      <div class="template-overlay"><span>人物访谈</span></div>
    </div>
  </div>

  <div class="section-header"><div class="section-title">热门标签</div></div>
  <div class="trending-tags">
    <div class="tag hot">#非遗再创作</div>
    <div class="tag hot">#青年视角</div>
    <div class="tag">#传统×现代</div>
    <div class="tag">#大师课堂</div>
    <div class="tag">#家乡非遗</div>
    <div class="tag">#手作故事</div>
  </div>

  <div class="section-header-with-filter">
    <div class="section-title">我的作品</div>
    <div class="filter-pills"><div class="filter-pill active">全部</div><div class="filter-pill">草稿</div></div>
  </div>
  <div class="works-grid">
    <div class="work-item">
      <div class="work-img">
        <img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=400&q=80" alt="">
        <div class="work-status status-published">已发布</div>
      </div>
      <div class="work-body"><h4>我的第一件木雕</h4><div class="work-stats"><span><i class="fas fa-eye"></i> 342</span><span><i class="fas fa-heart"></i> 56</span></div></div>
    </div>
    <div class="work-item">
      <div class="work-img">
        <img src="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=400&q=80" alt="">
        <div class="work-status status-draft">草稿</div>
      </div>
      <div class="work-body"><h4>陶艺之旅</h4><div class="work-stats"><span><i class="fas fa-edit"></i> 编辑中</span></div></div>
    </div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-item"><i class="fas fa-compass"></i><span>发现</span></div>
  <div class="tab-item"><i class="fas fa-book-open"></i><span>学习</span></div>
  <div class="tab-item create-tab active"><i class="fas fa-plus-circle"></i><span style="background: linear-gradient(135deg, #FF6B35, #F7931E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">创作</span></div>
  <div class="tab-item"><i class="fas fa-users"></i><span>社区</span></div>
  <div class="tab-item"><i class="fas fa-user"></i><span>我的</span></div>
</div>

</body>
</html>
