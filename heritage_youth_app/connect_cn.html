<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区 - 遗火相传</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body { font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif; background: #000; color: #fff; width: 100%; height: 100%; overflow-x: hidden; }
html { width: 100%; height: 100%; }

.status-bar {
  height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px 28px; position: sticky; top: 0; z-index: 100; background: #000;
}
.status-time { font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

.content { padding: 0 28px 120px 28px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { font-size: 28px; font-weight: 800; }
.header-icons { display: flex; gap: 14px; }
.header-icons i { font-size: 20px; opacity: 0.5; }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-title { font-size: 20px; font-weight: 700; }
.see-all { font-size: 13px; color: #FF6B35; font-weight: 600; }

.challenge-banner { position: relative; border-radius: 24px; overflow: hidden; margin-bottom: 28px; height: 180px; }
.challenge-banner img { width: 100%; height: 100%; object-fit: cover; }
.challenge-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,107,53,0.85), rgba(175,82,222,0.7));
  display: flex; flex-direction: column; justify-content: center; padding: 24px;
}
.challenge-label {
  display: inline-block; padding: 4px 10px; background: rgba(255,255,255,0.2);
  border-radius: 8px; font-size: 11px; font-weight: 700; width: fit-content;
  margin-bottom: 10px; letter-spacing: 0.5px;
}
.challenge-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; line-height: 1.2; }
.challenge-meta { font-size: 12px; opacity: 0.8; margin-bottom: 12px; }
.challenge-avatars { display: flex; align-items: center; gap: 4px; }
.challenge-avatars img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; margin-left: -8px; }
.challenge-avatars img:first-child { margin-left: 0; }
.challenge-avatars span { font-size: 11px; margin-left: 6px; opacity: 0.8; }

.masters-scroll {
  display: flex; gap: 14px; overflow-x: auto; margin-bottom: 28px;
  margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px;
}
.master-card { width: 160px; flex-shrink: 0; background: rgba(255,255,255,0.04); border-radius: 20px; padding: 20px 16px; text-align: center; }
.master-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,107,53,0.3); margin-bottom: 10px; }
.master-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.master-craft { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
.master-stats { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; }
.master-stat { text-align: center; }
.master-stat-num { font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; }
.master-stat-label { font-size: 9px; color: rgba(255,255,255,0.3); }
.follow-btn { display: inline-block; padding: 6px 20px; background: linear-gradient(135deg, #FF6B35, #F7931E); border-radius: 10px; font-size: 12px; font-weight: 600; }

.feed-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
.feed-item { background: rgba(255,255,255,0.04); border-radius: 20px; overflow: hidden; }
.feed-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0 16px; }
.feed-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.feed-user h4 { font-size: 14px; font-weight: 600; }
.feed-user span { font-size: 11px; color: rgba(255,255,255,0.3); }
.feed-img { width: 100%; height: 200px; object-fit: cover; margin-top: 12px; }
.feed-actions { display: flex; gap: 20px; padding: 12px 16px; font-size: 13px; color: rgba(255,255,255,0.4); }
.feed-actions span { display: flex; align-items: center; gap: 6px; }

.events-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.event-item { display: flex; gap: 14px; padding: 14px; background: rgba(255,255,255,0.04); border-radius: 16px; align-items: center; }
.event-date {
  width: 52px; height: 52px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,107,53,0.15), rgba(247,147,30,0.08));
  display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
}
.event-date .month { font-size: 10px; color: #FF6B35; font-weight: 600; }
.event-date .day { font-size: 20px; font-weight: 800; color: #FF6B35; font-family: 'Inter', sans-serif; }
.event-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.event-info p { font-size: 11px; color: rgba(255,255,255,0.35); }
.event-live { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #FF3B30; }
.event-live .dot { width: 6px; height: 6px; border-radius: 50%; background: #FF3B30; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.tab-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(20px);
  display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
  border-top: 0.5px solid rgba(255,255,255,0.08);
}
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.35); }
.tab-item.active { color: #FF6B35; }
.tab-item i { font-size: 22px; }
.tab-item.create-tab i { background: linear-gradient(135deg, #FF6B35, #F7931E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
</style>
</head>
<body>

  <div class="section-header"><div class="section-title">社区动态</div><span class="see-all">最新</span></div>

<div class="tab-bar">
  <div class="tab-item"><i class="fas fa-compass"></i><span>发现</span></div>

  <div class="tab-item active"><i class="fas fa-users"></i><span>社区</span></div>
  <div class="tab-item"><i class="fas fa-user"></i><span>我的</span></div>
</div>

</body>
</html>
