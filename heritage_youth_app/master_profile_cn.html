<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传承人主页 - 遗火相传</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body { font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif; background: #000; color: #fff; width: 100%; height: 100%; overflow-x: hidden; }
html { width: 100%; height: 100%; }

.status-bar {
  height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 8px 28px; position: absolute; top: 0; left: 0; right: 0; z-index: 100;
}
.status-time { font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

.cover { position: relative; height: 220px; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(transparent, #000); }
.back-btn {
  position: absolute; top: 68px; left: 20px;
  width: 36px; height: 36px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
  border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 50;
}
.back-btn i { font-size: 16px; }

.content { padding: 0 28px 40px 28px; }

.master-header {
  display: flex; align-items: flex-end; gap: 16px;
  margin-top: -50px; margin-bottom: 20px; position: relative; z-index: 10;
}
.master-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid #000; flex-shrink: 0; }
.master-info { flex: 1; padding-bottom: 6px; }
.master-name { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
.master-craft { font-size: 13px; color: rgba(255,255,255,0.4); }
.verified-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; background: rgba(255,107,53,0.15); border-radius: 6px;
  font-size: 10px; font-weight: 600; color: #FF6B35; margin-top: 6px;
}

.master-stats {
  display: flex; justify-content: space-around; margin-bottom: 20px;
  padding: 16px; background: rgba(255,255,255,0.03); border-radius: 18px;
}
.master-stat { text-align: center; }
.master-stat-num { font-size: 24px; font-weight: 800; font-family: 'Inter', sans-serif; }
.master-stat-label { font-size: 11px; color: rgba(255,255,255,0.35); }

.action-btns { display: flex; gap: 10px; margin-bottom: 28px; }
.btn-follow {
  flex: 1; padding: 12px;
  background: linear-gradient(135deg, #FF6B35, #F7931E); border-radius: 14px;
  text-align: center; font-size: 14px; font-weight: 700;
}
.btn-message {
  width: 48px; height: 48px; background: rgba(255,255,255,0.06); border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: 18px; color: rgba(255,255,255,0.5);
}

.section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }

.featured-video { position: relative; border-radius: 20px; overflow: hidden; height: 200px; margin-bottom: 24px; }
.featured-video img { width: 100%; height: 100%; object-fit: cover; }
.featured-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 56px; height: 56px; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.featured-play i { font-size: 22px; margin-left: 3px; }
.featured-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.85));
}
.featured-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.featured-meta { font-size: 11px; color: rgba(255,255,255,0.5); }

.videos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
.vid-item { position: relative; border-radius: 14px; overflow: hidden; height: 130px; }
.vid-item img { width: 100%; height: 100%; object-fit: cover; }
.vid-item-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
.vid-item-overlay span { font-size: 11px; font-weight: 600; }
.vid-duration {
  position: absolute; top: 8px; right: 8px;
  padding: 2px 6px; background: rgba(0,0,0,0.6); border-radius: 4px;
  font-size: 10px; font-weight: 600; font-family: 'Inter', sans-serif;
}

.student-works {
  display: flex; gap: 12px; overflow-x: auto;
  margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; margin-bottom: 28px;
}
.student-work { width: 140px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.04); }
.student-work img { width: 100%; height: 100px; object-fit: cover; }
.student-work-body { padding: 10px; }
.student-work-body h5 { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.student-work-body p { font-size: 10px; color: rgba(255,255,255,0.3); }

.qa-section { margin-bottom: 20px; }
.qa-item { padding: 14px; background: rgba(255,255,255,0.04); border-radius: 14px; margin-bottom: 10px; }
.qa-question { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.qa-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.qa-text h5 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.qa-text p { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.3; }
.qa-answer {
  margin-left: 38px; padding: 10px;
  background: rgba(255,107,53,0.06); border-radius: 10px; border-left: 3px solid #FF6B35;
}
.qa-answer p { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.3; }
.qa-answer .master-tag { font-size: 10px; font-weight: 700; color: #FF6B35; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="cover">
  <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=800&q=80" alt="">
  <div class="cover-gradient"></div>
  <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
</div>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
</div>

<div class="content">
  <div class="master-header">
    <img class="master-avatar" src="https://images.unsplash.com/photo-1566753323558-f4e0952af115?w=200&q=80" alt="">
    <div class="master-info">
      <div class="master-name">王飞大师</div>
      <div class="master-craft">剪纸艺术 · 陕西省</div>
      <div class="verified-badge"><i class="fas fa-check-circle"></i> 非遗传承人</div>
    </div>
  </div>

  <div class="master-stats">
    <div class="master-stat"><div class="master-stat-num">48</div><div class="master-stat-label">视频</div></div>
    <div class="master-stat"><div class="master-stat-num">2.1K</div><div class="master-stat-label">学员</div></div>
    <div class="master-stat"><div class="master-stat-num">35</div><div class="master-stat-label">年从艺</div></div>
  </div>

  <div class="action-btns">
    <div class="btn-follow">关注并学习</div>
    <div class="btn-message"><i class="fas fa-comment"></i></div>
  </div>

  <div class="section-title">精选作品</div>
  <div class="featured-video">
    <img src="https://images.unsplash.com/photo-1596367407372-96cb88503db6?w=600&q=80" alt="">
    <div class="featured-play"><i class="fas fa-play"></i></div>
    <div class="featured-overlay">
      <div class="featured-title">纸之魂：我的 35 年剪纸之路</div>
      <div class="featured-meta"><i class="fas fa-play"></i> 2.4万次观看</div>
    </div>
  </div>

  <div class="section-title">技法教学</div>
  <div class="videos-grid">
    <div class="vid-item">
      <img src="https://images.unsplash.com/photo-1582738411706-bfc8e691d1c2?w=300&q=80" alt="">
      <div class="vid-duration">2:15</div>
      <div class="vid-item-overlay"><span>折叠技法</span></div>
    </div>
    <div class="vid-item">
      <img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=300&q=80" alt="">
      <div class="vid-duration">1:48</div>
      <div class="vid-item-overlay"><span>细节剪裁</span></div>
    </div>
    <div class="vid-item">
      <img src="https://images.unsplash.com/photo-1509909756405-be0199881695?w=300&q=80" alt="">
      <div class="vid-duration">3:02</div>
      <div class="vid-item-overlay"><span>配色选择</span></div>
    </div>
    <div class="vid-item">
      <img src="https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=300&q=80" alt="">
      <div class="vid-duration">1:35</div>
      <div class="vid-item-overlay"><span>图案设计</span></div>
    </div>
  </div>

  <div class="section-title">学员作品</div>
  <div class="student-works">
    <div class="student-work">
      <img src="https://images.unsplash.com/photo-1528396518501-b53b655eb9b3?w=300&q=80" alt="">
      <div class="student-work-body"><h5>春节窗花</h5><p>作者 @陈思琪</p></div>
    </div>
    <div class="student-work">
      <img src="https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=300&q=80" alt="">
      <div class="student-work-body"><h5>现代龙纹</h5><p>作者 @吴昊</p></div>
    </div>
    <div class="student-work">
      <img src="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=300&q=80" alt="">
      <div class="student-work-body"><h5>自然系列</h5><p>作者 @莉莉</p></div>
    </div>
  </div>

  <div class="section-title">问答互动</div>
  <div class="qa-section">
    <div class="qa-item">
      <div class="qa-question">
        <img class="qa-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=60&q=80" alt="">
        <div class="qa-text"><h5>陈思琪</h5><p>初学者用什么样的剪刀比较合适？</p></div>
      </div>
      <div class="qa-answer">
        <div class="master-tag">王飞大师</div>
        <p>建议选用薄刃小巧的尖头剪刀，品质比价格更重要，手感顺滑的最好。</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
