<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Capture — Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { width: 380px; min-height: 600px; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .action-tile { transition: all 0.2s; }
        .action-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.15); }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="gradient-bg px-5 py-4 text-white">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center">
                    <i class="fas fa-universal-access text-white text-lg"></i>
                </div>
                <div>
                    <div class="text-base font-bold">Accessible Capture</div>
                    <div class="text-xs text-indigo-100">Ready on this page</div>
                </div>
            </div>
            <button class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center hover:bg-white/30">
                <i class="fas fa-cog text-sm"></i>
            </button>
        </div>
        <div class="bg-white/15 backdrop-blur rounded-lg px-3 py-2 flex items-center gap-2">
            <i class="fas fa-globe text-xs text-indigo-100"></i>
            <span class="text-xs text-white truncate">en.wikipedia.org/wiki/Photosynthesis</span>
            <span class="ml-auto text-[10px] bg-emerald-400/30 text-emerald-50 px-1.5 py-0.5 rounded">Readable</span>
        </div>
    </div>

    <!-- Profile Banner -->
    <div class="px-5 py-3 bg-amber-50 border-b border-amber-100 flex items-center gap-2">
        <i class="fas fa-eye text-amber-600 text-sm"></i>
        <span class="text-xs text-amber-800 font-medium">Low Vision profile active</span>
        <button class="ml-auto text-[10px] text-amber-700 underline">Switch</button>
    </div>

    <!-- Quick Actions -->
    <div class="px-5 py-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Capture</div>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button class="action-tile bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-xl p-4 text-left">
                <i class="fas fa-magnifying-glass-plus text-xl mb-2"></i>
                <div class="text-sm font-bold">Smart Capture</div>
                <div class="text-[10px] text-indigo-100 mt-0.5">Auto-detect regions</div>
            </button>
            <button class="action-tile bg-white border border-gray-200 rounded-xl p-4 text-left">
                <i class="fas fa-crop-simple text-xl mb-2 text-indigo-600"></i>
                <div class="text-sm font-bold text-gray-900">Manual Crop</div>
                <div class="text-[10px] text-gray-500 mt-0.5">Snap to edges</div>
            </button>
            <button class="action-tile bg-white border border-gray-200 rounded-xl p-4 text-left">
                <i class="fas fa-file-lines text-xl mb-2 text-emerald-600"></i>
                <div class="text-sm font-bold text-gray-900">Full Page</div>
                <div class="text-[10px] text-gray-500 mt-0.5">Reader-mode</div>
            </button>
            <button class="action-tile bg-white border border-gray-200 rounded-xl p-4 text-left">
                <i class="fas fa-volume-high text-xl mb-2 text-rose-600"></i>
                <div class="text-sm font-bold text-gray-900">Read Aloud</div>
                <div class="text-[10px] text-gray-500 mt-0.5">Selection or page</div>
            </button>
        </div>

        <!-- Auto-detected items -->
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">On this page</div>
        <div class="space-y-2 mb-4">
            <div class="flex items-center gap-3 p-2.5 bg-indigo-50 rounded-lg border border-indigo-100">
                <div class="w-8 h-8 bg-indigo-100 rounded-md flex items-center justify-center">
                    <i class="fas fa-table text-indigo-600 text-xs"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-xs font-semibold text-gray-900">3 tables detected</div>
                    <div class="text-[10px] text-gray-500">Reaction rate, Wavelengths, Pigments</div>
                </div>
                <button class="text-[10px] bg-indigo-600 text-white px-2 py-1 rounded">Capture</button>
            </div>
            <div class="flex items-center gap-3 p-2.5 bg-purple-50 rounded-lg border border-purple-100">
                <div class="w-8 h-8 bg-purple-100 rounded-md flex items-center justify-center">
                    <i class="fas fa-square-root-variable text-purple-600 text-xs"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-xs font-semibold text-gray-900">2 formulas detected</div>
                    <div class="text-[10px] text-gray-500">Calvin cycle, Light reaction</div>
                </div>
                <button class="text-[10px] bg-purple-600 text-white px-2 py-1 rounded">Capture</button>
            </div>
            <div class="flex items-center gap-3 p-2.5 bg-emerald-50 rounded-lg border border-emerald-100">
                <div class="w-8 h-8 bg-emerald-100 rounded-md flex items-center justify-center">
                    <i class="fas fa-image text-emerald-600 text-xs"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-xs font-semibold text-gray-900">5 figures detected</div>
                    <div class="text-[10px] text-gray-500">Diagrams + chloroplast image</div>
                </div>
                <button class="text-[10px] bg-emerald-600 text-white px-2 py-1 rounded">Capture</button>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="flex gap-2 pt-3 border-t border-gray-100">
            <button class="flex-1 flex items-center justify-center gap-1.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">
                <i class="fas fa-book-open"></i> Library
            </button>
            <button class="flex-1 flex items-center justify-center gap-1.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium">
                <i class="fas fa-keyboard"></i> Shortcuts
            </button>
        </div>
    </div>
</body>
</html>
