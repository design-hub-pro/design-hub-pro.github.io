<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SheSync — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #FBF8F3;
    color: #2D2D3D;
    overflow: hidden;
  }
  .serif { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .screen { width: 100%; height: 100%; position: relative; background: linear-gradient(180deg, #F5EFE6 0%, #EAD9D2 55%, #D7C5DC 100%); }
  .status-bar {
    height: 59px; padding: 20px 28px 0; display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 15px; color: #2D2D3D;
  }
  .dynamic-island {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 34px; background: #0a0a0a; border-radius: 20px;
  }
  .hero-art {
    position: relative; margin: 4px 28px 0; height: 400px; border-radius: 32px;
    background: radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,0.7) 0%, transparent 60%), linear-gradient(150deg, #C7B5DD 0%, #E2BFB0 50%, #F2D5C4 100%);
    overflow: hidden; box-shadow: 0 18px 40px -16px rgba(139, 111, 184, 0.4);
  }
  .glow-ring {
    position: absolute; border-radius: 999px; border: 1.5px dashed rgba(255,255,255,0.55);
  }
  .glow-ring.r1 { width: 280px; height: 280px; top: 60px; left: 50%; transform: translateX(-50%); }
  .glow-ring.r2 { width: 200px; height: 200px; top: 100px; left: 50%; transform: translateX(-50%); border-style: solid; border-color: rgba(255,255,255,0.35); }
  .heart-orb {
    position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 140px; border-radius: 999px;
    background: linear-gradient(160deg, #B49AD7 0%, #8267B4 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 30px -10px rgba(98, 71, 153, 0.6), inset -10px -14px 30px rgba(0,0,0,0.12), inset 8px 8px 20px rgba(255,255,255,0.3);
  }
  .heart-orb i { color: #fff; font-size: 50px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
  .floating-chip {
    position: absolute; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
    border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: #2D2D3D; box-shadow: 0 8px 20px -6px rgba(0,0,0,0.18);
  }
  .chip-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
  .content {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent 0%, #FBF8F3 18%);
    padding: 40px 28px 110px;
  }
  .progress-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 22px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(139, 111, 184, 0.25); }
  .dot.active { width: 24px; background: #8B6FB8; }
  .cta {
    background: linear-gradient(135deg, #8B6FB8 0%, #6B5BC1 100%);
    color: #fff; border-radius: 999px; padding: 18px 22px;
    font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 14px 28px -10px rgba(107, 91, 193, 0.55);
  }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 135px; height: 5px; background: #2D2D3D; border-radius: 999px; }
</style>
</head>
<body>
<div class="screen">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div class="flex items-center gap-1.5 text-xs">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero-art">
    <div class="glow-ring r1"></div>
    <div class="glow-ring r2"></div>
    <div class="heart-orb">
      <i class="fas fa-heart"></i>
    </div>

    <!-- Floating chips -->
    <div class="floating-chip" style="top: 60px; left: 22px;">
      <div class="chip-icon" style="background:#5B7CB7;"><i class="fas fa-school"></i></div>
      <span>Soccer 4 PM</span>
    </div>
    <div class="floating-chip" style="top: 110px; right: 18px;">
      <div class="chip-icon" style="background:#E8A85C;"><i class="fas fa-utensils"></i></div>
      <span>Dinner</span>
      <i class="fas fa-lock text-[10px] text-[#8B6FB8]"></i>
    </div>
    <div class="floating-chip" style="bottom: 80px; left: 32px;">
      <div class="chip-icon" style="background:#E07B9C;"><i class="fas fa-envelope"></i></div>
      <span>3 new captured</span>
    </div>
    <div class="floating-chip" style="bottom: 50px; right: 28px;">
      <div class="chip-icon" style="background:#7BB89F;"><i class="fas fa-spa"></i></div>
      <span>Recovery 8:30</span>
    </div>

    <!-- Brand badge -->
    <div style="position:absolute; top: 22px; left:50%; transform:translateX(-50%); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: 999px; padding: 8px 14px; display:flex; align-items:center; gap:8px; font-weight: 700; font-size: 13px;">
      <div style="width:20px; height:20px; border-radius:999px; background: linear-gradient(135deg,#8B6FB8,#6B5BC1); display:flex; align-items:center; justify-content:center;">
        <i class="fas fa-spa text-white text-[10px]"></i>
      </div>
      <span class="serif" style="color:#2D2D3D;">SheSync</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="progress-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <h1 class="serif text-[34px] leading-[1.05] font-bold text-center mb-3" style="color:#2D2D3D;">
      Your day,<br/>quietly protected.
    </h1>
    <p class="text-center text-[15px] leading-[1.5] mb-7" style="color:#6B6B7B;">
      SheSync captures care commitments from your messages and shields the moments that matter most.
    </p>

    <div class="cta">
      <span>Begin with one calm day</span>
      <i class="fas fa-arrow-right text-sm"></i>
    </div>

    <p class="text-center text-[13px] mt-5" style="color:#8B8B9B;">
      Already with us? <span style="color:#8B6FB8; font-weight:600;">Sign in</span>
    </p>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
