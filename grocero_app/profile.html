<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fafafa}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 140px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content">
    <h1 class="text-[26px] font-bold text-gray-900 pt-2 pb-5">Profile</h1>

    <!-- User card -->
    <div class="bg-gradient-to-br from-emerald-500 to-green-700 rounded-3xl p-5 text-white mb-6">
      <div class="flex items-center gap-4">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=300&auto=format&fit=crop" class="w-16 h-16 rounded-full object-cover border-[3px] border-white/40" alt="">
        <div class="flex-1">
          <p class="text-[20px] font-bold">María Pérez</p>
          <p class="text-[13px] opacity-80">+58 424 555 0192</p>
        </div>
        <span class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center"><i class="fas fa-pen text-[13px]"></i></span>
      </div>
      <div class="flex mt-5 pt-4 border-t border-white/20">
        <div class="flex-1 text-center">
          <p class="text-[24px] font-bold leading-none">32</p>
          <p class="text-[11px] opacity-75 mt-1">Orders</p>
        </div>
        <div class="flex-1 text-center border-x border-white/20">
          <p class="text-[24px] font-bold leading-none">$41</p>
          <p class="text-[11px] opacity-75 mt-1">Saved</p>
        </div>
        <div class="flex-1 text-center">
          <p class="text-[24px] font-bold leading-none">280</p>
          <p class="text-[11px] opacity-75 mt-1">Points</p>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 divide-y divide-gray-50 mb-5">
      <div class="flex items-center gap-4 p-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center text-white"><i class="fas fa-location-dot"></i></div>
        <span class="flex-1 text-[15px] font-semibold text-gray-900">Addresses</span>
        <span class="text-[12px] text-gray-400 mr-2">2 saved</span>
        <i class="fas fa-chevron-right text-gray-300 text-[13px]"></i>
      </div>
      <div class="flex items-center gap-4 p-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white"><i class="fas fa-wallet"></i></div>
        <span class="flex-1 text-[15px] font-semibold text-gray-900">Payment methods</span>
        <span class="text-[12px] text-gray-400 mr-2">Cash, Pago Móvil</span>
        <i class="fas fa-chevron-right text-gray-300 text-[13px]"></i>
      </div>
      <div class="flex items-center gap-4 p-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white"><i class="fas fa-language"></i></div>
        <span class="flex-1 text-[15px] font-semibold text-gray-900">Language</span>
        <span class="text-[12px] text-gray-400 mr-2">Español</span>
        <i class="fas fa-chevron-right text-gray-300 text-[13px]"></i>
      </div>
      <div class="flex items-center gap-4 p-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-400 to-purple-600 flex items-center justify-center text-white"><i class="fas fa-headset"></i></div>
        <span class="flex-1 text-[15px] font-semibold text-gray-900">Help &amp; support</span>
        <i class="fas fa-chevron-right text-gray-300 text-[13px]"></i>
      </div>
    </div>

    <!-- Partner CTA -->
    <div class="relative rounded-3xl overflow-hidden h-28 mb-5">
      <img src="https://images.unsplash.com/photo-1534723452862-4c874018d66d?q=80&w=800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
      <div class="absolute inset-0 bg-gradient-to-r from-gray-900/90 to-gray-900/30"></div>
      <div class="absolute inset-0 p-5 flex flex-col justify-center">
        <p class="text-white text-[16px] font-bold">Own a supermarket?</p>
        <p class="text-white/70 text-[12px] mt-[2px]">Sell on Grocero <i class="fas fa-arrow-right ml-1"></i></p>
      </div>
    </div>

    <button class="w-full bg-white border border-gray-200 text-red-500 text-[15px] font-semibold py-[14px] rounded-2xl">Sign out</button>
  </div>

  <!-- Tab bar -->
  <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-gray-100 pt-3 pb-8 px-9 flex justify-between items-center z-40" style="position:absolute">
    <div class="flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-house text-[20px]"></i><span class="text-[10px] font-medium">Home</span></div>
    <div class="flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-store text-[20px]"></i><span class="text-[10px] font-medium">Stores</span></div>
    <div class="-mt-9 w-14 h-14 rounded-full bg-gradient-to-br from-emerald-400 to-green-600 shadow-lg shadow-emerald-500/40 flex items-center justify-center text-white"><i class="fas fa-basket-shopping text-[20px]"></i></div>
    <div class="flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-receipt text-[20px]"></i><span class="text-[10px] font-medium">Orders</span></div>
    <div class="flex flex-col items-center gap-1 text-emerald-600"><i class="fas fa-user text-[20px]"></i><span class="text-[10px] font-semibold">Profile</span></div>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50"></div>
</div>
</body>
</html>
