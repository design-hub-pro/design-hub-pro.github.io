<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fafafa}
.status-bar{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:40}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding-bottom:130px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:0 28px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content">
    <!-- Hero -->
    <div class="relative h-60">
      <img src="https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=900&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
      <div class="absolute inset-0 bg-gradient-to-b from-black/40 to-transparent"></div>
      <div class="absolute top-[70px] left-7 w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-800"><i class="fas fa-arrow-left"></i></div>
      <div class="absolute top-[70px] right-7 w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-gray-800"><i class="fas fa-magnifying-glass"></i></div>
    </div>

    <!-- Store card -->
    <div class="mx-7 -mt-12 relative bg-white rounded-3xl p-5 shadow-lg shadow-gray-200/60 mb-5">
      <div class="flex items-center justify-between">
        <h1 class="text-[22px] font-bold text-gray-900">Supermercado Central</h1>
        <span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-3 py-1 rounded-full">OPEN</span>
      </div>
      <div class="flex items-center gap-4 mt-3">
        <span class="flex items-center gap-1 text-[13px] font-semibold text-gray-700"><i class="fas fa-star text-amber-400"></i> 4.8</span>
        <span class="flex items-center gap-1 text-[13px] text-gray-500"><i class="fas fa-clock text-emerald-500"></i> 35–50 min</span>
        <span class="flex items-center gap-1 text-[13px] text-gray-500"><i class="fas fa-moped text-emerald-500"></i> $1.00</span>
      </div>
    </div>

    <!-- Category chips -->
    <div class="chips mb-5">
      <span class="flex-shrink-0 bg-emerald-500 text-white text-[13px] font-semibold px-5 py-[10px] rounded-full">All</span>
      <span class="flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-[13px] font-medium px-5 py-[10px] rounded-full">Produce</span>
      <span class="flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-[13px] font-medium px-5 py-[10px] rounded-full">Pantry</span>
      <span class="flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-[13px] font-medium px-5 py-[10px] rounded-full">Dairy</span>
      <span class="flex-shrink-0 bg-white border border-gray-200 text-gray-600 text-[13px] font-medium px-5 py-[10px] rounded-full">Drinks</span>
    </div>

    <!-- Product grid -->
    <div class="grid grid-cols-2 gap-4 px-7">
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
          <span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-[2px] rounded-full">-15%</span>
        </div>
        <p class="text-[14px] font-semibold text-gray-900">Rice 1 kg</p>
        <p class="text-[11px] text-gray-400">Bs 198</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$1.20</span>
          <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[13px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
        <p class="text-[14px] font-semibold text-gray-900">Pan de sandwich</p>
        <p class="text-[11px] text-gray-400">Bs 280</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$1.70</span>
          <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[13px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1563636619-e9143da7973b?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
        <p class="text-[14px] font-semibold text-gray-900">Milk 1 L</p>
        <p class="text-[11px] text-gray-400">Bs 239</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$1.45</span>
          <div class="flex items-center gap-2 bg-emerald-50 rounded-full px-2 py-1">
            <span class="w-6 h-6 bg-white rounded-full flex items-center justify-center text-emerald-600 text-[11px] shadow-sm"><i class="fas fa-minus"></i></span>
            <span class="text-[14px] font-bold text-gray-900">2</span>
            <span class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[11px]"><i class="fas fa-plus"></i></span>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
        <p class="text-[14px] font-semibold text-gray-900">Tomatoes 1 kg</p>
        <p class="text-[11px] text-gray-400">Bs 165</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$1.00</span>
          <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[13px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
        <p class="text-[14px] font-semibold text-gray-900">Eggs ×30</p>
        <p class="text-[11px] text-gray-400">Bs 570</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$3.45</span>
          <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[13px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?q=80&w=400&auto=format&fit=crop" class="w-full h-28 rounded-xl object-cover mb-2" alt="">
        <p class="text-[14px] font-semibold text-gray-900">Coffee 500 g</p>
        <p class="text-[11px] text-gray-400">Bs 660</p>
        <div class="flex items-center justify-between mt-2">
          <span class="text-[16px] font-bold text-emerald-600">$4.00</span>
          <span class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[13px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart bar -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pb-10 pt-4 bg-gradient-to-t from-white via-white to-transparent z-40">
    <button class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-2xl py-[16px] px-5 flex items-center justify-between shadow-lg shadow-emerald-500/40">
      <span class="w-7 h-7 bg-white/25 rounded-full flex items-center justify-center text-[13px] font-bold">3</span>
      <span class="text-[17px] font-semibold">View cart</span>
      <span class="text-[17px] font-bold">$5.35</span>
    </button>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50"></div>
</div>
</body>
</html>
