<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grocero — Grocery delivery for rural Venezuela</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none;-webkit-tap-highlight-color:transparent}
body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif}
.phone{width:460px;height:980px;background:#1b1b1d;border-radius:62px;padding:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.3),0 0 0 2px rgba(0,0,0,0.06)}
.phone iframe{width:100%;height:100%;border:none;border-radius:52px;background:#fff}
</style>
</head>
<body>
<div class="max-w-[1500px] mx-auto px-8 py-16">

  <div class="flex flex-col items-center text-center mb-14">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-xl shadow-emerald-500/25 mb-5">
      <i class="fas fa-basket-shopping text-white text-2xl"></i>
    </div>
    <h1 class="text-5xl font-bold text-gray-900 tracking-tight mb-3">Grocero</h1>
    <p class="text-lg text-gray-500 mb-5">Grocery delivery connecting rural Venezuela with local supermarkets.</p>
    <div class="flex gap-2">
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Grocery Delivery</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Live Tracking</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Cash on Delivery</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Merchant Tools</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-12 justify-items-center">
    <div class="phone"><iframe src="onboarding.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="store.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="cart.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="checkout.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="tracking.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="orders.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="merchant.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="profile.html" scrolling="no"></iframe></div>
  </div>

</div>
</body>
</html>
