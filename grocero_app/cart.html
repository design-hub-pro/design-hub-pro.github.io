<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fafafa}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 190px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 shadow-sm border border-gray-100"><i class="fas fa-arrow-left"></i></div>
      <h1 class="text-[20px] font-bold text-gray-900">My Cart</h1>
      <span class="text-[13px] font-semibold text-red-400">Clear</span>
    </div>

    <!-- Store row -->
    <div class="flex items-center gap-3 bg-emerald-50 border border-emerald-100 rounded-2xl p-3 mb-5">
      <img src="https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=200&auto=format&fit=crop" class="w-10 h-10 rounded-xl object-cover" alt="">
      <div class="flex-1">
        <p class="text-[14px] font-bold text-gray-900">Supermercado Central</p>
        <p class="text-[12px] text-emerald-700">Delivers in 35–50 min</p>
      </div>
      <i class="fas fa-chevron-right text-emerald-600 text-[13px]"></i>
    </div>

    <!-- Items -->
    <div class="space-y-3 mb-6">
      <div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=300&auto=format&fit=crop" class="w-16 h-16 rounded-xl object-cover" alt="">
        <div class="flex-1">
          <p class="text-[15px] font-semibold text-gray-900">Rice 1 kg</p>
          <p class="text-[15px] font-bold text-emerald-600 mt-1">$1.20</p>
        </div>
        <div class="flex items-center gap-2 bg-gray-50 rounded-full px-2 py-1">
          <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-gray-500 text-[12px] shadow-sm"><i class="fas fa-minus"></i></span>
          <span class="text-[15px] font-bold text-gray-900 w-4 text-center">2</span>
          <span class="w-7 h-7 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[12px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1563636619-e9143da7973b?q=80&w=300&auto=format&fit=crop" class="w-16 h-16 rounded-xl object-cover" alt="">
        <div class="flex-1">
          <p class="text-[15px] font-semibold text-gray-900">Milk 1 L</p>
          <p class="text-[15px] font-bold text-emerald-600 mt-1">$1.45</p>
        </div>
        <div class="flex items-center gap-2 bg-gray-50 rounded-full px-2 py-1">
          <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-gray-500 text-[12px] shadow-sm"><i class="fas fa-minus"></i></span>
          <span class="text-[15px] font-bold text-gray-900 w-4 text-center">1</span>
          <span class="w-7 h-7 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[12px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
      <div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
        <img src="https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?q=80&w=300&auto=format&fit=crop" class="w-16 h-16 rounded-xl object-cover" alt="">
        <div class="flex-1">
          <p class="text-[15px] font-semibold text-gray-900">Eggs ×30</p>
          <p class="text-[15px] font-bold text-emerald-600 mt-1">$3.45</p>
        </div>
        <div class="flex items-center gap-2 bg-gray-50 rounded-full px-2 py-1">
          <span class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-gray-500 text-[12px] shadow-sm"><i class="fas fa-minus"></i></span>
          <span class="text-[15px] font-bold text-gray-900 w-4 text-center">1</span>
          <span class="w-7 h-7 bg-emerald-500 rounded-full flex items-center justify-center text-white text-[12px]"><i class="fas fa-plus"></i></span>
        </div>
      </div>
    </div>

    <!-- Delivery window -->
    <h2 class="text-[17px] font-bold text-gray-900 mb-3">Delivery window</h2>
    <div class="flex gap-3 mb-6">
      <div class="flex-1 bg-emerald-500 text-white rounded-2xl p-3 text-center">
        <p class="text-[13px] font-bold">Today</p>
        <p class="text-[12px] opacity-90">2–4 PM</p>
      </div>
      <div class="flex-1 bg-white border border-gray-200 text-gray-600 rounded-2xl p-3 text-center">
        <p class="text-[13px] font-bold">Today</p>
        <p class="text-[12px] text-gray-400">4–6 PM</p>
      </div>
      <div class="flex-1 bg-white border border-gray-200 text-gray-600 rounded-2xl p-3 text-center">
        <p class="text-[13px] font-bold">Tomorrow</p>
        <p class="text-[12px] text-gray-400">8–10 AM</p>
      </div>
    </div>

    <!-- Summary -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2">
      <div class="flex justify-between text-[14px] text-gray-500"><span>Subtotal</span><span class="font-semibold text-gray-800">$7.30</span></div>
      <div class="flex justify-between text-[14px] text-gray-500"><span>Delivery</span><span class="font-semibold text-gray-800">$1.00</span></div>
      <div class="border-t border-dashed border-gray-200 pt-2 flex justify-between items-center">
        <span class="text-[15px] font-bold text-gray-900">Total</span>
        <div class="text-right">
          <span class="text-[22px] font-bold text-emerald-600">$8.30</span>
          <p class="text-[11px] text-gray-400">≈ Bs 1,370</p>
        </div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-10 pt-4 bg-gradient-to-t from-white via-white to-transparent z-40">
    <button class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white text-[18px] font-semibold py-[17px] rounded-2xl shadow-lg shadow-emerald-500/40">Checkout · $8.30</button>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50"></div>
</div>
</body>
</html>
