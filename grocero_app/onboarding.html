<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#000}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:40}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
</style>
</head>
<body>
<div class="screen">
  <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/10 to-black/95"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-14 z-10">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-xl shadow-emerald-500/30 mb-6">
      <i class="fas fa-basket-shopping text-white text-2xl"></i>
    </div>
    <h1 class="text-white text-[42px] font-bold leading-tight tracking-tight">Grocero</h1>
    <p class="text-white/80 text-[19px] leading-snug mt-3 mb-8">Supermarket delivery for rural Venezuela. Order from local stores, pay cash or Pago Móvil.</p>

    <div class="flex gap-2 mb-8">
      <div class="w-8 h-[5px] bg-emerald-400 rounded-full"></div>
      <div class="w-[5px] h-[5px] bg-white/40 rounded-full"></div>
      <div class="w-[5px] h-[5px] bg-white/40 rounded-full"></div>
    </div>

    <button class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white text-[18px] font-semibold py-[18px] rounded-2xl shadow-lg shadow-emerald-500/40">Get Started</button>
    <button class="w-full text-white/70 text-[16px] font-medium py-4">Continuar en Español</button>
  </div>

  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-white rounded-full z-50"></div>
</div>
</body>
</html>
