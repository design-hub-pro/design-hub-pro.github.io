<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fafafa}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 170px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 shadow-sm border border-gray-100"><i class="fas fa-arrow-left"></i></div>
      <h1 class="text-[20px] font-bold text-gray-900">Checkout</h1>
      <div class="w-10"></div>
    </div>

    <!-- Address -->
    <h2 class="text-[17px] font-bold text-gray-900 mb-3">Deliver to</h2>
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-4 mb-6">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center text-white"><i class="fas fa-house"></i></div>
      <div class="flex-1">
        <p class="text-[15px] font-bold text-gray-900">Home</p>
        <p class="text-[13px] text-gray-400 leading-snug">Calle Bolívar 14, El Tigre,<br>Anzoátegui</p>
      </div>
      <span class="text-[13px] font-semibold text-emerald-600">Change</span>
    </div>

    <!-- Payment -->
    <h2 class="text-[17px] font-bold text-gray-900 mb-3">Payment method</h2>
    <div class="space-y-3 mb-6">
      <div class="bg-white rounded-2xl p-4 border-2 border-emerald-500 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center text-white"><i class="fas fa-money-bill-wave"></i></div>
        <div class="flex-1">
          <p class="text-[15px] font-bold text-gray-900">Cash on delivery</p>
          <p class="text-[12px] text-gray-400">Pay in USD or bolívares</p>
        </div>
        <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[11px]"><i class="fas fa-check"></i></div>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white"><i class="fas fa-mobile-screen-button"></i></div>
        <div class="flex-1">
          <p class="text-[15px] font-bold text-gray-900">Pago Móvil</p>
          <p class="text-[12px] text-gray-400">Instant bank transfer</p>
        </div>
        <div class="w-6 h-6 rounded-full border-2 border-gray-200"></div>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-400 to-purple-600 flex items-center justify-center text-white"><i class="fas fa-dollar-sign"></i></div>
        <div class="flex-1">
          <p class="text-[15px] font-bold text-gray-900">Zelle</p>
          <p class="text-[12px] text-gray-400">USD transfer</p>
        </div>
        <div class="w-6 h-6 rounded-full border-2 border-gray-200"></div>
      </div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-slate-400 to-gray-600 flex items-center justify-center text-white"><i class="fas fa-credit-card"></i></div>
        <div class="flex-1">
          <p class="text-[15px] font-bold text-gray-900">Debit card</p>
          <p class="text-[12px] text-gray-400">Punto de venta on arrival</p>
        </div>
        <div class="w-6 h-6 rounded-full border-2 border-gray-200"></div>
      </div>
    </div>

    <!-- Summary -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2">
      <div class="flex justify-between text-[14px] text-gray-500"><span>Items (4)</span><span class="font-semibold text-gray-800">$7.30</span></div>
      <div class="flex justify-between text-[14px] text-gray-500"><span>Delivery · 6.2 km</span><span class="font-semibold text-gray-800">$1.00</span></div>
      <div class="border-t border-dashed border-gray-200 pt-2 flex justify-between items-center">
        <span class="text-[15px] font-bold text-gray-900">Total</span>
        <div class="text-right">
          <span class="text-[24px] font-bold text-emerald-600">$8.30</span>
          <p class="text-[11px] text-gray-400">≈ Bs 1,370</p>
        </div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-10 pt-4 bg-gradient-to-t from-white via-white to-transparent z-40">
    <button class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white text-[18px] font-semibold py-[17px] rounded-2xl shadow-lg shadow-emerald-500/40"><i class="fas fa-lock mr-2 text-[14px]"></i>Place Order</button>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50"></div>
</div>
</body>
</html>
