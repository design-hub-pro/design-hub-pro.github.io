<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:#e8efe9}
.status-bar{position:absolute;top:0;left:0;right:0;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;z-index:40}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
</style>
</head>
<body>
<div class="screen">
  <!-- Map -->
  <svg class="absolute inset-0 w-full h-full" viewBox="0 0 460 980" preserveAspectRatio="xMidYMid slice">
    <rect width="460" height="980" fill="#eaf1ea"/>
    <rect x="0" y="120" width="460" height="3" fill="#dde7dd"/>
    <path d="M0 200 H460 M0 340 H460 M0 480 H460 M0 620 H460" stroke="#fff" stroke-width="22"/>
    <path d="M90 0 V980 M240 0 V980 M380 0 V980" stroke="#fff" stroke-width="26"/>
    <path d="M0 200 H460 M0 340 H460 M0 480 H460 M0 620 H460" stroke="#d8e2d8" stroke-width="1"/>
    <rect x="110" y="225" width="100" height="85" rx="10" fill="#d7e4d4"/>
    <rect x="260" y="360" width="95" height="90" rx="10" fill="#d7e4d4"/>
    <rect x="110" y="505" width="105" height="85" rx="10" fill="#dce6dc"/>
    <rect x="265" y="640" width="90" height="80" rx="10" fill="#d7e4d4"/>
    <rect x="20" y="370" width="50" height="220" rx="12" fill="#c4dcc0"/>
    <path d="M380 150 Q240 150 240 340 T240 480 Q240 620 120 620" stroke="#10b981" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1 14"/>
    <circle cx="380" cy="150" r="10" fill="#10b981" stroke="#fff" stroke-width="4"/>
  </svg>

  <!-- Destination pin -->
  <div class="absolute left-[92px] top-[576px] flex flex-col items-center z-10">
    <div class="w-12 h-12 bg-gray-900 rounded-full flex items-center justify-center text-white shadow-xl border-4 border-white"><i class="fas fa-house text-[15px]"></i></div>
    <div class="w-[3px] h-3 bg-gray-900"></div>
  </div>
  <!-- Courier marker -->
  <div class="absolute left-[208px] top-[400px] z-10">
    <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-2xl shadow-emerald-600/50 border-4 border-white"><i class="fas fa-motorcycle text-[20px]"></i></div>
    <div class="absolute inset-0 rounded-full bg-emerald-400/40 animate-ping"></div>
  </div>

  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="absolute top-[70px] left-7 w-11 h-11 bg-white rounded-full flex items-center justify-center text-gray-800 shadow-lg z-20"><i class="fas fa-arrow-left"></i></div>
  <div class="absolute top-[70px] right-7 bg-white rounded-full px-4 h-11 flex items-center gap-2 shadow-lg z-20">
    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
    <span class="text-[13px] font-bold text-gray-900">Live</span>
  </div>

  <!-- Bottom sheet -->
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[36px] px-7 pt-3 pb-12 shadow-[0_-10px_40px_rgba(0,0,0,0.12)] z-30">
    <div class="w-10 h-[5px] bg-gray-200 rounded-full mx-auto mb-5"></div>

    <div class="flex items-end justify-between mb-5">
      <div>
        <p class="text-[13px] text-gray-400 font-medium">Arriving in</p>
        <p class="text-[36px] font-bold text-gray-900 leading-none mt-1">18 min</p>
      </div>
      <span class="bg-emerald-100 text-emerald-700 text-[12px] font-bold px-3 py-[6px] rounded-full mb-1">On the way</span>
    </div>

    <!-- Progress steps -->
    <div class="flex items-center mb-6">
      <div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[13px]"><i class="fas fa-check"></i></div>
      <div class="flex-1 h-[4px] bg-emerald-500"></div>
      <div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[13px]"><i class="fas fa-box"></i></div>
      <div class="flex-1 h-[4px] bg-emerald-500"></div>
      <div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[13px] ring-4 ring-emerald-100"><i class="fas fa-motorcycle"></i></div>
      <div class="flex-1 h-[4px] bg-gray-200"></div>
      <div class="w-9 h-9 rounded-full bg-gray-200 flex items-center justify-center text-gray-400 text-[13px]"><i class="fas fa-house"></i></div>
    </div>

    <!-- Courier card -->
    <div class="flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" class="w-14 h-14 rounded-full object-cover" alt="">
      <div class="flex-1">
        <p class="text-[16px] font-bold text-gray-900">José Medina</p>
        <p class="text-[13px] text-gray-400"><i class="fas fa-star text-amber-400 text-[11px]"></i> 4.9 · Motorcycle</p>
      </div>
      <div class="w-11 h-11 bg-white rounded-full flex items-center justify-center text-emerald-600 shadow-sm"><i class="fas fa-comment"></i></div>
      <div class="w-11 h-11 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-sm"><i class="fas fa-phone"></i></div>
    </div>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] bg-black rounded-full z-50"></div>
</div>
</body>
</html>
