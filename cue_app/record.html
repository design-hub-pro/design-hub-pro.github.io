<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cue · Recording</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--lime:#D6FF3D;--warn:#FF5A36;--accent:#4E82FF}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#07090C;color:#fff;font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#07090C}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;color:#fff}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px;letter-spacing:.2px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:5}
.px{padding-left:28px;padding-right:28px}
.top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-top:2px}
.ic{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.cam{position:relative;height:540px;margin:8px 12px 0;border-radius:28px;overflow:hidden;background:#12161C}
.cam .inner{position:absolute;left:-52px;top:0;width:540px;height:540px}
.cam .inner img{width:540px;height:540px;display:block;filter:contrast(1.04) saturate(.85)}
.cam .inner svg{position:absolute;left:0;top:0;width:540px;height:540px}
.ov{position:absolute;z-index:4}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(9,12,16,.68);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 12px;font-size:11px;font-weight:750;letter-spacing:1.2px}
.cue{margin:12px 12px 0;background:#FF5A36;border-radius:20px;padding:13px 15px;display:flex;gap:13px;align-items:center;box-shadow:0 18px 34px -18px rgba(255,90,54,.95)}
.cue .ci{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.cue b{font-size:16.5px;font-weight:770;letter-spacing:-.35px;display:block;line-height:1.2}
.cue span{font-size:11.5px;font-weight:650;letter-spacing:1px;opacity:.85;display:block;margin-bottom:3px}
.depth{position:absolute;right:14px;top:120px;width:12px;height:230px;border-radius:8px;background:rgba(255,255,255,.16);z-index:5;overflow:hidden}
.depth i{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(180deg,var(--lime),#8FD400);border-radius:8px}
.depth b{position:absolute;left:-3px;right:-3px;height:2px;background:#fff;bottom:78%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.dl{position:absolute;right:32px;top:116px;font-size:9.5px;font-weight:780;letter-spacing:1.2px;color:rgba(255,255,255,.72);z-index:5;text-align:right}
.stats{display:flex;padding:16px 28px 0}
.stats div{flex:1}
.stats b{font-size:27px;font-weight:790;letter-spacing:-1.1px;line-height:1;display:block}
.stats s{text-decoration:none;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:700;display:block;margin-top:5px}
.ctrl{position:absolute;bottom:0;left:0;right:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 40px 22px}
.shut{width:76px;height:76px;border-radius:50%;border:4px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.shut i{width:30px;height:30px;border-radius:8px;background:var(--warn);display:block}
.side{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8.5px;font-weight:750;letter-spacing:.6px;color:rgba(255,255,255,.8);text-decoration:none}
.side i.fa-solid,.side i.fa-regular{font-size:15px;color:#fff}
</style></head><body>
<div class="screen">
<div class="island"></div>
<div class="sb"><span class="t">6:56</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px top">
  <a href="plan.html" class="ic"><i class="fa-solid fa-xmark"></i></a>
  <div style="text-align:center">
    <div style="font-size:15.5px;font-weight:730;letter-spacing:-.3px">Overhead squat</div>
    <div style="font-size:11px;color:rgba(255,255,255,.5);font-weight:600;margin-top:2px">Set 2 of 3 &middot; front on</div>
  </div>
  <div class="ic"><i class="fa-solid fa-camera-rotate"></i></div>
</div>

<div class="cam">
  <div class="inner">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1787960844428-image-1.png" alt="">
  <svg viewBox="0 0 1024 1024">
    <g stroke="#D6FF3D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".96">
      <path d="M452 455 L578 452"/>
      <path d="M452 455 L392 285 L338 200"/>
      <path d="M578 452 L642 282 L688 196"/>
      <path d="M452 455 L455 682"/><path d="M578 452 L578 680"/><path d="M455 682 L578 680"/>
      <path d="M455 682 L408 760"/><path d="M578 680 L637 756"/>
      <path d="M512 400 L515 453"/>
    </g>
    <g stroke="#FF5A36" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M408 760 L390 894"/><path d="M637 756 L646 890"/>
      <path d="M390 894 L366 928"/><path d="M646 890 L672 924"/>
    </g>
    <circle cx="512" cy="372" r="54" fill="none" stroke="#D6FF3D" stroke-width="5" opacity=".85"/>
    <g fill="#0B0E12" stroke="#D6FF3D" stroke-width="5">
      <circle cx="452" cy="455" r="11"/><circle cx="578" cy="452" r="11"/>
      <circle cx="392" cy="285" r="9"/><circle cx="642" cy="282" r="9"/>
      <circle cx="338" cy="200" r="9"/><circle cx="688" cy="196" r="9"/>
      <circle cx="455" cy="682" r="11"/><circle cx="578" cy="680" r="11"/>
      <circle cx="408" cy="760" r="11"/><circle cx="637" cy="756" r="11"/>
    </g>
    <g fill="#0B0E12" stroke="#FF5A36" stroke-width="7"><circle cx="390" cy="894" r="14"/><circle cx="646" cy="890" r="14"/></g>
    <path d="M390 894 m-58 0 a58 58 0 0 1 44 -55" fill="none" stroke="#FF5A36" stroke-width="6"/>
    <rect x="196" y="856" width="112" height="44" rx="14" fill="#FF5A36"/>
    <text x="252" y="886" font-family="Inter" font-size="27" font-weight="800" fill="#fff" text-anchor="middle">24&#176;</text>
    <rect x="676" y="700" width="132" height="42" rx="13" fill="rgba(9,12,16,.72)"/>
    <text x="742" y="729" font-family="Inter" font-size="24" font-weight="750" fill="#D6FF3D" text-anchor="middle">HIP 96&#176;</text>
  </svg>
  </div>

  <div class="ov" style="left:14px;top:14px;display:flex;gap:7px">
    <span class="pill"><i class="fa-solid fa-circle" style="font-size:7px;color:#FF3B30"></i>00:14</span>
    <span class="pill" style="color:var(--lime)"><i class="fa-solid fa-check" style="font-size:9px"></i>FULL BODY</span>
  </div>
  <div class="ov" style="right:14px;top:14px"><span class="pill">30 FPS &middot; ON DEVICE</span></div>

  <div class="dl">DEPTH</div>
  <div class="depth"><i></i><b></b></div>

</div>

<div class="cue">
  <div class="ci"><i class="fa-solid fa-volume-high"></i></div>
  <div><span>REP 6 &middot; HEELS LIFTING</span><b>Sit back. Weight into the middle of the foot.</b></div>
</div>

<div class="stats">
  <div><b>6<span style="color:rgba(255,255,255,.4);font-size:16px">/8</span></b><s>Reps</s></div>
  <div><b style="color:var(--lime)">2.9<span style="font-size:15px">s</span></b><s>Down tempo</s></div>
  <div><b style="color:var(--warn)">4</b><s>Flagged</s></div>
  <div><b>96<span style="font-size:15px">%</span></b><s>Left / right</s></div>
</div>

<div class="ctrl">
  <a href="library.html" class="side"><i class="fa-regular fa-images"></i>GUIDE</a>
  <a href="report.html" class="shut"><i></i></a>
  <div class="side" style="background:rgba(214,255,61,.16)"><i class="fa-solid fa-volume-high" style="color:var(--lime)"></i><span style="color:var(--lime)">CUES</span></div>
</div>
</div></body></html>
