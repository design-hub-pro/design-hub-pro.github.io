<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Swarm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="scroll">
    <div class="island"></div>
    <div class="sb"><span class="t">14:27</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <span class="font-bold text-[16px]">Swarm link</span>
      <div class="iconbtn"><i class="fa-solid fa-sliders"></i></div>
    </div>

    <!-- mesh graph -->
    <div class="pad mt-5">
      <div class="rounded-[28px] h-[300px] relative overflow-hidden" style="background:radial-gradient(90% 80% at 50% 45%,#2C2420 0%,#16120F 100%)">
        <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 380 300">
          <g stroke="rgba(255,255,255,.22)" stroke-width="1.5">
            <line x1="190" y1="150" x2="90" y2="80"/><line x1="190" y1="150" x2="290" y2="70"/><line x1="190" y1="150" x2="310" y2="190"/><line x1="190" y1="150" x2="80" y2="210"/><line x1="190" y1="150" x2="200" y2="260"/>
            <line x1="90" y1="80" x2="290" y2="70"/><line x1="290" y1="70" x2="310" y2="190"/><line x1="80" y1="210" x2="200" y2="260"/><line x1="200" y1="260" x2="310" y2="190"/><line x1="90" y1="80" x2="80" y2="210"/>
          </g>
          <line x1="290" y1="70" x2="340" y2="30" stroke="#F79009" stroke-width="2" stroke-dasharray="4 5"/>
          <g stroke="#FF5A1F" stroke-width="3"><line x1="190" y1="150" x2="290" y2="70"/><line x1="290" y1="70" x2="310" y2="190"/></g>
          <circle cx="190" cy="150" r="28" fill="rgba(255,90,31,.18)"/>
        </svg>
        <div class="absolute left-[166px] top-[126px] w-12 h-12 rounded-2xl g-ember flex items-center justify-center text-white border-2 border-white"><i class="fa-solid fa-truck"></i></div>
        <div class="drone s" style="left:77px;top:67px"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="drone s" style="left:277px;top:57px"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="drone h" style="left:297px;top:177px"><i class="fa-solid fa-fire-extinguisher"></i></div>
        <div class="drone s" style="left:67px;top:197px"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="drone h" style="left:187px;top:247px"><i class="fa-solid fa-fire-extinguisher"></i></div>
        <div class="drone s !bg-[#F79009]" style="left:327px;top:17px"><i class="fa-solid fa-satellite-dish"></i></div>
        <span class="pill glassd absolute left-3 top-3"><span class="ok"></span>Mesh healthy</span>
        <span class="pill glassd absolute left-3 bottom-3 num"><i class="fa-solid fa-signal"></i>38 ms</span>
        <span class="pill absolute right-3 bottom-3 text-white" style="background:#FF5A1F">Relay path H-02</span>
      </div>
    </div>

    <!-- autonomy -->
    <div class="pad">
      <div class="sec"><span class="h2">Autonomy</span></div>
      <div class="grid grid-cols-3 gap-2.5">
        <div class="card p-3.5 text-center"><i class="fa-solid fa-hand text-[var(--faint)] text-[20px]"></i><div class="font-bold text-[13px] mt-2">Manual</div></div>
        <div class="rounded-[22px] p-3.5 text-center text-white" style="background:#16120F"><i class="fa-solid fa-wand-magic-sparkles text-[#FFB020] text-[20px]"></i><div class="font-bold text-[13px] mt-2">Auto + OK</div></div>
        <div class="card p-3.5 text-center opacity-50"><i class="fa-solid fa-lock text-[var(--faint)] text-[20px]"></i><div class="font-bold text-[13px] mt-2">Full auto</div></div>
      </div>
      <p class="sub !text-[12.5px] mt-3">Drones scout, map and route on their own. Every drop waits for a commander.</p>
    </div>

    <!-- who does what -->
    <div class="pad">
      <div class="sec"><span class="h2">Who does what</span><span class="sub !text-[12px]">auto-assigned</span></div>
      <div class="card divide-y divide-[var(--border)]">
        <div class="flex items-center gap-3 p-3.5"><div class="gicon g-sky !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-border-all"></i></div><span class="flex-1 font-bold text-[14px]">Grid search</span><span class="font-extrabold num text-[15px]">4</span></div>
        <div class="flex items-center gap-3 p-3.5"><div class="gicon g-amber !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-eye"></i></div><span class="flex-1 font-bold text-[14px]">Watch hotspots</span><span class="font-extrabold num text-[15px]">2</span></div>
        <div class="flex items-center gap-3 p-3.5"><div class="gicon g-violet !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-tower-cell"></i></div><span class="flex-1 font-bold text-[14px]">Radio relay</span><span class="font-extrabold num text-[15px]">1</span></div>
        <div class="flex items-center gap-3 p-3.5"><div class="gicon g-red !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-fire-extinguisher"></i></div><span class="flex-1 font-bold text-[14px]">Drop runs</span><span class="font-extrabold num text-[15px]">3</span></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Ops</div>
    <div class="tab"><i class="fa-solid fa-map-location-dot"></i>Map</div>
    <div class="tab mid"><div class="fab"><i class="fa-solid fa-fire-extinguisher"></i></div><span>Dispatch</span></div>
    <div class="tab on"><i class="fa-solid fa-helicopter"></i>Fleet</div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
