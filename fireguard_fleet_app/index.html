<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
body{font-family:'Inter',sans-serif;color:#16120F;margin:0}
*::-webkit-scrollbar{display:none} *{scrollbar-width:none}
.grid3{display:grid;grid-template-columns:repeat(3,460px);gap:56px 44px;justify-content:center}
@media (max-width:1560px){.grid3{grid-template-columns:repeat(2,460px)}}
@media (max-width:1020px){.grid3{grid-template-columns:460px}}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#16120F;box-shadow:0 40px 80px -40px rgba(22,18,15,.45),0 0 0 1px rgba(22,18,15,.08);box-sizing:border-box}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;overflow:hidden}
</style></head>
<body>
<div class="px-10 pt-20 pb-28">
  <div class="text-center">
    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl" style="background:linear-gradient(135deg,#FFB020 0%,#FF5A1F 55%,#E5243B 100%)"><i class="fa-solid fa-fire-flame-curved"></i></div>
    <h1 class="text-5xl font-extrabold tracking-tight mt-6">FireGuard</h1>
    <p class="text-lg text-slate-500 font-medium mt-3">Fire crews spot wildfires from drones, map safe exits, and approve suppression drops from one phone.</p>
    <div class="flex gap-2 justify-center mt-5 flex-wrap">
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Drone fleets</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Wildfire</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Evacuation maps</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Emergency services</span>
    </div>
  </div>

  <div class="grid3 mt-20">
    <div class="frame"><iframe src="welcome.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="detect.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="feed.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="map.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="evaluate.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="evac.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="dispatch.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="mission.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="fleet.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="swarm.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="report.html" scrolling="no"></iframe></div>
  </div>
</div>
</body></html>
