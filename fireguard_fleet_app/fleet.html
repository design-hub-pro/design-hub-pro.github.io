<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Fleet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="scroll">
    <div class="island"></div>
    <div class="sb"><span class="t">14:25</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div><div class="meta">12 drones · 2 fleets</div><div class="h1 mt-1">Fleet</div></div>
      <div class="iconbtn"><i class="fa-solid fa-plus"></i></div>
    </div>

    <div class="pad mt-5"><div class="flex rounded-2xl bg-[var(--surface)] p-1 text-[14px] font-bold">
      <span class="flex-1 text-center py-2.5 rounded-xl bg-white shadow-sm"><i class="fa-solid fa-satellite-dish text-[#1570EF] mr-1.5"></i>Scout 8</span>
      <span class="flex-1 text-center py-2.5 text-[var(--muted)]"><i class="fa-solid fa-fire-extinguisher mr-1.5"></i>Suppress 4</span>
    </div></div>

    <!-- base hero -->
    <div class="pad mt-4">
      <div class="img shade rounded-[28px] h-[180px] p-[18px] flex flex-col justify-between overflow-hidden" style="background-image:url(img/scout.jpg)">
        <div class="flex justify-between"><span class="pill glass"><i class="fa-solid fa-truck"></i>Base Trailer 2</span><span class="pill glass"><i class="fa-solid fa-bolt"></i>3 charging</span></div>
        <div class="flex items-end justify-between text-white">
          <div><div class="text-[13px] font-semibold text-white/70">Next swap</div><div class="text-[26px] font-extrabold num leading-none mt-1">6 min</div></div>
          <div class="avs"><img src="img/crew2.jpg"><img src="img/crew1.jpg"><img src="img/chief.jpg"></div>
        </div>
      </div>
    </div>

    <!-- status summary -->
    <div class="pad mt-4 flex gap-4 text-[13px] font-semibold text-[var(--ink2)]">
      <span><span class="dot mr-1.5" style="background:#12B76A"></span>5 flying</span>
      <span><span class="dot mr-1.5" style="background:#2E90FA"></span>2 charging</span>
      <span><span class="dot mr-1.5" style="background:#F79009"></span>1 low</span>
    </div>

    <!-- list -->
    <div class="pad mt-3 flex flex-col gap-2.5">
      <div class="card p-4 flex items-center gap-3.5">
        <div class="gicon g-sky"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="flex-1"><div class="flex items-center gap-2"><span class="font-bold text-[15px]">S-03</span><span class="dot" style="background:#12B76A"></span></div><div class="sub !text-[12.5px]">Watching NE flank</div></div>
        <div class="w-[78px]"><div class="text-right font-extrabold text-[15px] num">68%</div><div class="bar mt-1.5 !h-1.5"><i style="width:68%;background:#12B76A"></i></div></div>
      </div>
      <div class="card p-4 flex items-center gap-3.5">
        <div class="gicon g-sky"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="flex-1"><div class="flex items-center gap-2"><span class="font-bold text-[15px]">S-05</span><span class="dot" style="background:#12B76A"></span></div><div class="sub !text-[12.5px]">Mapping west line</div></div>
        <div class="w-[78px]"><div class="text-right font-extrabold text-[15px] num">54%</div><div class="bar mt-1.5 !h-1.5"><i style="width:54%;background:#12B76A"></i></div></div>
      </div>
      <div class="card p-4 flex items-center gap-3.5">
        <div class="gicon g-sky"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="flex-1"><div class="flex items-center gap-2"><span class="font-bold text-[15px]">S-07</span><span class="dot" style="background:#F79009"></span></div><div class="sub !text-[12.5px]">Heading home</div></div>
        <div class="w-[78px]"><div class="text-right font-extrabold text-[15px] num" style="color:#F79009">19%</div><div class="bar mt-1.5 !h-1.5"><i style="width:19%;background:#F79009"></i></div></div>
      </div>
      <div class="card p-4 flex items-center gap-3.5">
        <div class="gicon g-sky"><i class="fa-solid fa-satellite-dish"></i></div>
        <div class="flex-1"><div class="flex items-center gap-2"><span class="font-bold text-[15px]">S-02</span><span class="dot" style="background:#2E90FA"></span></div><div class="sub !text-[12.5px]">On pad, ready 14:31</div></div>
        <div class="w-[78px]"><div class="text-right font-extrabold text-[15px] num" style="color:#1570EF">82%</div><div class="bar mt-1.5 !h-1.5"><i style="width:82%;background:#2E90FA"></i></div></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Ops</div>
    <div class="tab"><i class="fa-solid fa-map-location-dot"></i>Map</div>
    <div class="tab mid"><div class="fab"><i class="fa-solid fa-fire-extinguisher"></i></div><span>Dispatch</span></div>
    <div class="tab on"><i class="fa-solid fa-helicopter"></i>Fleet</div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
