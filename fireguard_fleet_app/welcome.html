<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="absolute inset-0 img" style="background-image:url(img/hero.jpg);background-position:50% 40%"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,11,9,.55) 0%,rgba(14,11,9,0) 28%,rgba(14,11,9,.2) 48%,#0E0B09 78%)"></div>
  <div class="island"></div>
  <div class="sb light"><span class="t">05:42</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

  <div class="pad relative z-10 mt-4 flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-[13px] flex items-center justify-center g-ember text-white"><i class="fa-solid fa-fire-flame-curved"></i></div>
    <span class="font-extrabold text-[19px] tracking-tight">FireGuard</span>
    <span class="pill glass ml-auto"><span class="ok"></span>12 drones ready</span>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[44px] z-10">
    <div class="meta !text-[#FFB020]">Command app for fire agencies</div>
    <h1 class="text-[40px] font-extrabold leading-[1.02] tracking-[-1.6px] mt-3">See fire first.<br>Send drones in<br>minutes.</h1>

    <div class="grid grid-cols-3 gap-2.5 mt-7">
      <div class="rounded-2xl bg-white/[.07] border border-white/10 p-3.5"><i class="fa-solid fa-satellite-dish text-[#53B1FD]"></i><div class="text-[13px] font-bold mt-2">Detect</div></div>
      <div class="rounded-2xl bg-white/[.07] border border-white/10 p-3.5"><i class="fa-solid fa-route text-[#32D583]"></i><div class="text-[13px] font-bold mt-2">Map exits</div></div>
      <div class="rounded-2xl bg-white/[.07] border border-white/10 p-3.5"><i class="fa-solid fa-fire-extinguisher text-[#FF8A5B]"></i><div class="text-[13px] font-bold mt-2">Suppress</div></div>
    </div>

    <div class="btn emb mt-7"><i class="fa-solid fa-id-badge"></i>Sign in with agency ID</div>
    <div class="btn mt-3 bg-white/10 border border-white/15 text-white text-[15px]"><i class="fa-solid fa-qrcode"></i>Join an incident by code</div>
    <p class="text-center text-white/40 text-[12px] font-medium mt-4"><i class="fa-solid fa-lock mr-1"></i>Drops always need a commander's approval</p>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
