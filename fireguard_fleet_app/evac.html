<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Evacuation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="scroll">
    <div class="island"></div>
    <div class="sb"><span class="t">14:16</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div><div class="meta">Cedar Ridge</div><div class="h1 mt-1">Evacuation</div></div>
      <div class="iconbtn"><i class="fa-solid fa-share-nodes"></i></div>
    </div>

    <!-- route hero -->
    <div class="pad mt-5">
      <div class="img rounded-[28px] h-[200px] overflow-hidden" style="background-image:url(img/terrain.jpg);background-position:30% 70%">
        <div class="absolute inset-0 bg-black/10"></div>
        <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 380 200" preserveAspectRatio="none">
          <path d="M300 20 C 340 30, 360 70, 330 90 C 300 110, 260 80, 270 50 C 275 32, 285 22, 300 20Z" fill="rgba(229,36,59,.5)" stroke="#E5243B" stroke-width="2.5"/>
          <path d="M200 110 C 160 130, 110 150, 50 170" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M200 110 C 160 130, 110 150, 50 170" stroke="#12B76A" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="200" cy="110" r="7" fill="#fff" stroke="#16120F" stroke-width="3"/>
          <circle cx="50" cy="170" r="14" fill="rgba(18,183,106,.35)" stroke="#12B76A" stroke-width="3"/>
        </svg>
        <span class="pill glassd absolute left-3 top-3"><i class="fa-solid fa-route"></i>Route 2 · Hwy 50 W</span>
        <span class="pill text-white absolute right-3 bottom-3" style="background:#039855"><i class="fa-solid fa-clock"></i>12 min to Safe A</span>
      </div>
    </div>

    <!-- totals -->
    <div class="pad mt-4"><div class="card p-4">
      <div class="flex justify-between items-baseline"><span class="font-bold text-[15px]">People out</span><span class="text-[13px] font-semibold text-[var(--muted)] num">1,284 / 1,910</span></div>
      <div class="text-[36px] font-extrabold num leading-none mt-2">67<span class="text-[18px]">%</span></div>
      <div class="bar mt-3 !h-3"><i style="width:67%;background:var(--gradGreen)"></i></div>
    </div></div>

    <!-- zones -->
    <div class="pad">
      <div class="sec"><span class="h2">Zones</span><span class="act">Map</span></div>
      <div class="flex flex-col gap-2.5">
        <div class="card p-4 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold text-[18px] text-white" style="background:#E5243B">A</div>
          <div class="flex-1"><div class="font-bold text-[15px]">Pine Hollow</div><div class="bar mt-2"><i style="width:92%;background:#E5243B"></i></div></div>
          <div class="text-right"><div class="font-extrabold text-[17px] num">92%</div><div class="text-[11px] font-bold" style="color:#E5243B">GO NOW</div></div>
        </div>
        <div class="card p-4 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold text-[18px] text-white" style="background:#F79009">B</div>
          <div class="flex-1"><div class="font-bold text-[15px]">Cedar Flats</div><div class="bar mt-2"><i style="width:48%;background:#F79009"></i></div></div>
          <div class="text-right"><div class="font-extrabold text-[17px] num">48%</div><div class="text-[11px] font-bold" style="color:#F79009">GET SET</div></div>
        </div>
        <div class="card p-4 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-extrabold text-[18px] text-white" style="background:#EAAA08">C</div>
          <div class="flex-1"><div class="font-bold text-[15px]">Lakeview</div><div class="bar mt-2"><i style="width:8%;background:#EAAA08"></i></div></div>
          <div class="text-right"><div class="font-extrabold text-[17px] num">8%</div><div class="text-[11px] font-bold" style="color:#B54708">READY</div></div>
        </div>
      </div>
    </div>

    <!-- shelters -->
    <div class="pad">
      <div class="sec"><span class="h2">Shelters</span></div>
      <div class="hscroll">
        <div class="card p-4 w-[178px]"><div class="flex items-center justify-between"><div class="gicon g-green"><i class="fa-solid fa-school"></i></div><span class="ok"></span></div><div class="font-bold text-[15px] mt-3">Placer High</div><div class="sub !text-[12px]">212 / 400 beds</div></div>
        <div class="card p-4 w-[178px]"><div class="flex items-center justify-between"><div class="gicon g-sky"><i class="fa-solid fa-building"></i></div><span class="ok"></span></div><div class="font-bold text-[15px] mt-3">Fairgrounds</div><div class="sub !text-[12px]">Pets, trailers</div></div>
      </div>
    </div>

    <div class="pad mt-6"><div class="btn emb"><i class="fa-solid fa-tower-broadcast"></i>Send alert to Zone B</div></div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Ops</div>
    <div class="tab on"><i class="fa-solid fa-map-location-dot"></i>Map</div>
    <div class="tab mid"><div class="fab"><i class="fa-solid fa-fire-extinguisher"></i></div><span>Dispatch</span></div>
    <div class="tab"><i class="fa-solid fa-helicopter"></i>Fleet</div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
