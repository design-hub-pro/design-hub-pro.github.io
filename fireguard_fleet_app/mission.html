<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Drop in progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="absolute inset-x-0 top-0 h-[470px] img" style="background-image:url(img/heavy.jpg);background-position:50% 45%"></div>
  <div class="absolute inset-x-0 top-0 h-[470px]" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 25%,rgba(14,11,9,.1) 60%,#0E0B09 100%)"></div>
  <div class="island"></div>
  <div class="sb light"><span class="t">14:22</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad relative z-10 mt-3 flex items-center justify-between">
    <div class="iconbtn d"><i class="fa-solid fa-chevron-down"></i></div>
    <div class="flex items-center gap-2 rounded-full glassd px-4 py-2.5 text-[14px] font-bold"><span class="live"></span>Mission M-08</div>
    <div class="iconbtn d"><i class="fa-solid fa-video"></i></div>
  </div>

  <div class="pad absolute left-0 right-0 top-[330px] z-10">
    <div class="meta !text-[#FFB020]">Dropping on NE-4</div>
    <div class="flex items-end gap-2 mt-1"><span class="text-[64px] font-extrabold num leading-none tracking-[-2px]">14</span><span class="text-[24px] font-bold text-white/50 mb-1.5 num">/ 22 balls</span></div>
    <div class="h-3 rounded-full bg-white/10 overflow-hidden mt-3"><i class="block h-full rounded-full" style="width:64%;background:var(--gradEmber)"></i></div>
  </div>

  <!-- per-drone -->
  <div class="pad absolute left-0 right-0 top-[490px] z-10 flex flex-col gap-2.5">
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5 flex items-center gap-3">
      <div class="gicon g-red !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-fire-extinguisher"></i></div>
      <div class="flex-1"><div class="font-bold text-[14px]">H-01</div><div class="h-1.5 rounded-full bg-white/10 mt-1.5"><i class="block h-full rounded-full bg-[#32D583]" style="width:100%"></i></div></div>
      <span class="text-[13px] font-bold text-[#32D583] w-[74px] text-right">Returning</span>
    </div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5 flex items-center gap-3">
      <div class="gicon g-red !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-fire-extinguisher"></i></div>
      <div class="flex-1"><div class="font-bold text-[14px]">H-02</div><div class="h-1.5 rounded-full bg-white/10 mt-1.5"><i class="block h-full rounded-full bg-[#FF5A1F]" style="width:75%"></i></div></div>
      <span class="text-[13px] font-bold text-[#FF8A5B] w-[74px] text-right">Dropping</span>
    </div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5 flex items-center gap-3">
      <div class="gicon g-red !w-10 !h-10 !rounded-xl !text-[15px]"><i class="fa-solid fa-fire-extinguisher"></i></div>
      <div class="flex-1"><div class="font-bold text-[14px]">H-04</div><div class="h-1.5 rounded-full bg-white/10 mt-1.5"><i class="block h-full rounded-full bg-white/40" style="width:0%"></i></div></div>
      <span class="text-[13px] font-bold text-white/60 w-[74px] text-right num">In 0:40</span>
    </div>
  </div>

  <!-- effect -->
  <div class="pad absolute left-0 right-0 top-[726px] z-10 grid grid-cols-2 gap-2.5">
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="flex items-center gap-2"><span class="text-[26px] font-extrabold num leading-none">388°</span><i class="fa-solid fa-arrow-down text-[#32D583]"></i></div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Was 612°C</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none">0.2<span class="text-[14px]"> ac</span></div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Active area</div></div>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[40px] z-10 grid grid-cols-[1fr_1fr] gap-3">
    <div class="btn bg-white/10 border border-white/15 text-white text-[15px]"><i class="fa-solid fa-pause"></i>Hold</div>
    <div class="btn text-[15px]" style="background:var(--gradRed)"><i class="fa-solid fa-house"></i>Abort, return</div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
