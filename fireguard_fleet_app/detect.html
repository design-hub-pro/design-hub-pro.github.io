<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · New detection</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="island"></div>
  <div class="sb light"><span class="t">14:09</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad mt-3 flex items-center justify-between">
    <div class="iconbtn d"><i class="fa-solid fa-xmark"></i></div>
    <span class="pill text-white" style="background:#E5243B"><span class="w-1.5 h-1.5 rounded-full bg-white"></span>NEW DETECTION</span>
    <div class="iconbtn d"><i class="fa-solid fa-share-nodes"></i></div>
  </div>

  <!-- thermal capture -->
  <div class="pad mt-5">
    <div class="img rounded-[28px] h-[330px] overflow-hidden" style="background-image:url(img/thermal.jpg)">
      <div class="absolute left-[34%] top-[30%] w-[120px] h-[110px] rounded-xl border-2 border-white/90" style="box-shadow:0 0 0 999px rgba(0,0,0,.18)"></div>
      <span class="pill glassd absolute left-[34%] top-[calc(30%-34px)]"><i class="fa-solid fa-crosshairs"></i>Hotspot</span>
      <div class="absolute right-3 top-3 w-[96px] h-[96px] rounded-2xl border-2 border-white/80 img" style="background-image:url(img/smoke.jpg)"></div>
      <span class="pill glassd absolute right-3 top-[110px] !text-[11px]">RGB</span>
      <div class="absolute left-3 bottom-3 right-3 flex justify-between">
        <span class="pill glassd"><i class="fa-solid fa-satellite-dish"></i>Scout S-03 · 120 m</span>
        <span class="pill glassd num">14:07:52</span>
      </div>
    </div>
  </div>

  <!-- confidence + readings -->
  <div class="pad mt-5 flex items-center gap-5">
    <div class="relative w-[104px] h-[104px] flex-none">
      <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90"><circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,.1)" stroke-width="9" fill="none"/><circle cx="50" cy="50" r="42" stroke="url(#g)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="16"/><defs><linearGradient id="g"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#E5243B"/></linearGradient></defs></svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-[30px] font-extrabold num leading-none">94<span class="text-[15px]">%</span></div><div class="text-white/50 text-[11px] font-semibold mt-1">Fire</div></div>
    </div>
    <div class="flex-1">
      <div class="text-[22px] font-extrabold tracking-tight leading-tight">Spot fire, NE flank</div>
      <div class="text-white/55 text-[13px] font-medium mt-1">38.912 N, 120.441 W</div>
      <div class="flex gap-2 mt-3">
        <span class="pill bg-white/10"><span class="dot" style="background:#53B1FD"></span>Camera</span>
        <span class="pill bg-white/10"><span class="dot" style="background:#FF5A1F"></span>Heat</span>
        <span class="pill bg-white/10"><span class="dot" style="background:#32D583"></span>S-05</span>
      </div>
    </div>
  </div>

  <div class="pad mt-5 grid grid-cols-3 gap-2.5">
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none text-[#FF8A5B]">612°</div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Peak C</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none">0.3</div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Acres</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none">2.1<span class="text-[14px]">km</span></div><div class="text-white/50 text-[12px] font-semibold mt-1.5">To homes</div></div>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[42px] grid grid-cols-[1fr_1.5fr] gap-3">
    <div class="btn bg-white/10 border border-white/15 text-white"><i class="fa-solid fa-ban"></i>False alarm</div>
    <div class="btn emb"><i class="fa-solid fa-check"></i>Confirm fire</div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
