<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Live feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="absolute inset-x-0 top-0 h-[620px] img" style="background-image:url(img/thermal.jpg);background-position:40% 50%"></div>
  <div class="absolute inset-x-0 top-0 h-[620px]" style="background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,#0E0B09 100%)"></div>
  <!-- HUD -->
  <svg class="absolute left-1/2 top-[300px] -translate-x-1/2 -translate-y-1/2" width="120" height="120" viewBox="0 0 120 120"><path d="M10 34V10h24M86 10h24v24M110 86v24H86M34 110H10V86" stroke="#fff" stroke-width="3" fill="none"/><circle cx="60" cy="60" r="4" fill="#fff"/></svg>
  <span class="pill glassd absolute left-1/2 top-[372px] -translate-x-1/2 num"><i class="fa-solid fa-temperature-high text-[#FF8A5B]"></i>588°C</span>
  <!-- temp scale -->
  <div class="absolute right-[28px] top-[150px] w-3 h-[200px] rounded-full" style="background:linear-gradient(180deg,#fff,#FFE066,#FF5A1F,#8B1E8F,#1B0B3A)"></div>
  <div class="absolute right-[46px] top-[146px] text-[11px] font-bold text-white/80 num">650°</div>
  <div class="absolute right-[46px] top-[340px] text-[11px] font-bold text-white/60 num">20°</div>

  <div class="island"></div>
  <div class="sb light"><span class="t">14:12</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad relative z-10 mt-3 flex items-center justify-between">
    <div class="iconbtn d"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="flex items-center gap-2 rounded-full glassd px-4 py-2.5 text-[14px] font-bold"><span class="live"></span>S-03 · LIVE</div>
    <div class="iconbtn d"><i class="fa-solid fa-expand"></i></div>
  </div>

  <div class="pad absolute left-0 right-0 top-[470px] z-10 flex justify-between items-end">
    <div class="flex rounded-full glassd p-1 text-[13px] font-bold">
      <span class="px-4 py-2 rounded-full bg-white text-[#16120F]">Thermal</span><span class="px-4 py-2">Camera</span><span class="px-4 py-2">Split</span>
    </div>
    <div class="w-12 h-12 rounded-full g-red flex items-center justify-center text-white"><i class="fa-solid fa-circle-dot"></i></div>
  </div>

  <!-- telemetry -->
  <div class="pad absolute left-0 right-0 top-[548px] z-10 grid grid-cols-4 gap-2">
    <div class="rounded-2xl bg-white/[.06] border border-white/10 py-3 text-center"><div class="text-[20px] font-extrabold num">120</div><div class="text-white/45 text-[11px] font-semibold">Alt m</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 py-3 text-center"><div class="text-[20px] font-extrabold num">68%</div><div class="text-white/45 text-[11px] font-semibold">Battery</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 py-3 text-center"><div class="text-[20px] font-extrabold num">14</div><div class="text-white/45 text-[11px] font-semibold">km/h</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 py-3 text-center"><div class="text-[20px] font-extrabold num">-61</div><div class="text-white/45 text-[11px] font-semibold">Link dBm</div></div>
  </div>

  <!-- other feeds -->
  <div class="pad absolute left-0 right-0 top-[650px] z-10">
    <div class="flex justify-between items-baseline mb-3"><span class="font-bold text-[17px]">Other feeds</span><span class="text-white/50 text-[13px] font-semibold">10 live</span></div>
    <div class="hscroll">
      <div class="w-[150px]"><div class="img rounded-2xl h-[100px] overflow-hidden" style="background-image:url(img/smoke.jpg)"><span class="pill glassd absolute left-2 top-2 !text-[10px] !py-1"><span class="live" style="width:6px;height:6px"></span>S-05</span><div class="absolute right-2 bottom-2 w-7 h-7 rounded-full bg-white/90 text-[#16120F] flex items-center justify-center text-[10px]"><i class="fa-solid fa-play"></i></div></div><div class="text-[13px] font-semibold mt-2 text-white/80">West line</div></div>
      <div class="w-[150px]"><div class="img rounded-2xl h-[100px] overflow-hidden" style="background-image:url(img/heavy.jpg)"><span class="pill glassd absolute left-2 top-2 !text-[10px] !py-1"><span class="live" style="width:6px;height:6px"></span>H-02</span><div class="absolute right-2 bottom-2 w-7 h-7 rounded-full bg-white/90 text-[#16120F] flex items-center justify-center text-[10px]"><i class="fa-solid fa-play"></i></div></div><div class="text-[13px] font-semibold mt-2 text-white/80">Drop run</div></div>
      <div class="w-[150px]"><div class="img rounded-2xl h-[100px] overflow-hidden" style="background-image:url(img/evac.jpg)"><span class="pill glassd absolute left-2 top-2 !text-[10px] !py-1"><span class="live" style="width:6px;height:6px"></span>S-07</span><div class="absolute right-2 bottom-2 w-7 h-7 rounded-full bg-white/90 text-[#16120F] flex items-center justify-center text-[10px]"><i class="fa-solid fa-play"></i></div></div><div class="text-[13px] font-semibold mt-2 text-white/80">Hwy 50</div></div>
    </div>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[42px] z-10 grid grid-cols-[1fr_1fr] gap-3">
    <div class="btn bg-white/10 border border-white/15 text-white text-[15px]"><i class="fa-solid fa-location-crosshairs"></i>Mark spot</div>
    <div class="btn emb text-[15px]"><i class="fa-solid fa-fire-extinguisher"></i>Plan drop</div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
