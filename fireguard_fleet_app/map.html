<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Safety map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <!-- map -->
  <div class="absolute inset-0 img" style="background-image:url(img/terrain.jpg);background-size:auto 100%;background-position:center"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,11,9,.45) 0%,rgba(14,11,9,0) 18%)"></div>
  <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 436 956" preserveAspectRatio="none">
    <!-- predicted 1h spread -->
    <path d="M232 168 C 300 150, 352 196, 344 268 C 338 330, 296 366, 248 362 C 200 358, 176 316, 180 262 C 184 210, 196 178, 232 168Z" fill="rgba(255,176,32,.18)" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="7 6"/>
    <!-- current perimeter -->
    <path d="M238 196 C 286 186, 318 222, 312 268 C 306 306, 278 326, 250 322 C 220 318, 206 292, 208 258 C 210 226, 218 202, 238 196Z" fill="rgba(229,36,59,.42)" stroke="#E5243B" stroke-width="3"/>
    <!-- evac routes -->
    <path d="M150 470 C 120 520, 90 560, 60 640" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M150 470 C 120 520, 90 560, 60 640" stroke="#12B76A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M170 450 C 220 470, 300 520, 380 600" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M170 450 C 220 470, 300 520, 380 600" stroke="#12B76A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- closed road -->
    <path d="M190 430 C 210 380, 230 360, 240 340" stroke="#E5243B" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 7"/>
    <!-- safe zone -->
    <circle cx="70" cy="660" r="30" fill="rgba(18,183,106,.3)" stroke="#12B76A" stroke-width="3"/>
    <circle cx="384" cy="612" r="26" fill="rgba(18,183,106,.3)" stroke="#12B76A" stroke-width="3"/>
  </svg>
  <!-- markers -->
  <div class="drone s" style="left:182px;top:176px"><i class="fa-solid fa-satellite-dish"></i></div>
  <div class="drone s" style="left:322px;top:230px"><i class="fa-solid fa-satellite-dish"></i></div>
  <div class="drone s" style="left:268px;top:356px"><i class="fa-solid fa-satellite-dish"></i></div>
  <div class="drone h" style="left:296px;top:196px"><i class="fa-solid fa-fire-extinguisher"></i></div>
  <div class="drone h" style="left:232px;top:290px"><i class="fa-solid fa-fire-extinguisher"></i></div>
  <div class="absolute" style="left:57px;top:654px"><span class="pill text-white !text-[11px]" style="background:#039855"><i class="fa-solid fa-shield-heart"></i>Safe A</span></div>
  <div class="absolute" style="left:356px;top:606px"><span class="pill text-white !text-[11px]" style="background:#039855">Safe B</span></div>

  <div class="island"></div>
  <div class="sb light"><span class="t">14:11</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad relative z-10 mt-3 flex items-center gap-2.5">
    <div class="flex-1 h-12 rounded-2xl bg-white/95 flex items-center gap-2.5 px-4 shadow-lg"><span class="live"></span><span class="font-bold text-[15px]">Cedar Ridge</span><span class="sub !text-[13px] ml-auto">Live · 8 s ago</span></div>
    <div class="iconbtn !w-12 !h-12 shadow-lg"><i class="fa-solid fa-layer-group"></i></div>
  </div>
  <div class="absolute right-[28px] top-[140px] z-10 flex flex-col gap-2">
    <span class="pill glassd"><i class="fa-solid fa-wind"></i>SW 24 km/h</span>
  </div>

  <!-- bottom sheet -->
  <div class="absolute left-0 right-0 bottom-[96px] z-20 bg-white rounded-t-[30px] pt-2.5 pb-5 shadow-[0_-12px_30px_rgba(0,0,0,.18)]">
    <div class="w-10 h-1.5 rounded-full bg-[var(--border)] mx-auto"></div>
    <div class="pad mt-4 flex gap-2 overflow-x-auto">
      <span class="chip on"><span class="dot" style="background:#E5243B"></span>Fire</span>
      <span class="chip"><span class="dot" style="background:#FFB020"></span>+1 h</span>
      <span class="chip"><span class="dot" style="background:#12B76A"></span>Exits</span>
      <span class="chip"><i class="fa-solid fa-satellite-dish text-[#1570EF]"></i>Drones</span>
    </div>
    <div class="pad mt-4 grid grid-cols-3 gap-2.5">
      <div class="rounded-2xl bg-[var(--bg)] p-3"><div class="text-[26px] font-extrabold num leading-none" style="color:#E5243B">142</div><div class="sub !text-[12px] mt-1">Acres now</div></div>
      <div class="rounded-2xl bg-[var(--bg)] p-3"><div class="text-[26px] font-extrabold num leading-none" style="color:#F79009">210</div><div class="sub !text-[12px] mt-1">In 1 hour</div></div>
      <div class="rounded-2xl bg-[var(--bg)] p-3"><div class="text-[26px] font-extrabold num leading-none" style="color:#039855">2/3</div><div class="sub !text-[12px] mt-1">Roads open</div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Ops</div>
    <div class="tab on"><i class="fa-solid fa-map-location-dot"></i>Map</div>
    <div class="tab mid"><div class="fab"><i class="fa-solid fa-fire-extinguisher"></i></div><span>Dispatch</span></div>
    <div class="tab"><i class="fa-solid fa-helicopter"></i>Fleet</div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
