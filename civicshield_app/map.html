<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicShield — Safety Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
  .screen { position: relative; width: 100%; height: 100%; background: #DBEAFE; color: #0B1220; overflow: hidden; }
  .status-bar { height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; color: #0B1220; position: relative; z-index: 30; }
  .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 18px; z-index: 60; }
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-top: 1px solid rgba(15,23,42,0.06); display: flex; padding: 12px 12px 26px; z-index: 50; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size: 10px; font-weight: 600; color: #94A3B8; }
  .tab.active { color: #1D4ED8; }
  .pulse-ring { animation: pr 2s ease-out infinite; }
  @keyframes pr { 0% { transform: scale(1); opacity:0.65;} 100% { transform: scale(1.6); opacity: 0;} }
  .map-bg {
    background: #E0EAF5;
    background-image:
      linear-gradient(rgba(15,23,42,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
  }
</style>
</head>
<body>
<div class="screen">
  <!-- Map background fills entire screen -->
  <div class="absolute inset-0 map-bg"></div>

  <!-- Mock streets (SVG) -->
  <svg viewBox="0 0 460 980" class="absolute inset-0 w-full h-full">
    <!-- Main streets -->
    <path d="M -20 200 Q 100 180 230 220 T 480 240" stroke="#fff" stroke-width="38" fill="none"/>
    <path d="M 60 -20 Q 80 200 110 480 T 140 1000" stroke="#fff" stroke-width="32" fill="none"/>
    <path d="M -20 540 Q 100 500 230 540 T 480 560" stroke="#fff" stroke-width="34" fill="none"/>
    <path d="M 320 -20 Q 340 240 360 540 T 380 1000" stroke="#fff" stroke-width="30" fill="none"/>
    <!-- Secondary -->
    <path d="M -20 360 L 480 380" stroke="#F1F5F9" stroke-width="14" fill="none"/>
    <path d="M -20 700 L 480 720" stroke="#F1F5F9" stroke-width="14" fill="none"/>
    <path d="M 220 -20 L 240 1000" stroke="#F1F5F9" stroke-width="12" fill="none"/>

    <!-- Park / green zone -->
    <path d="M 30 600 Q 50 580 200 590 Q 230 600 230 700 Q 230 730 100 730 Q 30 720 30 600 Z" fill="#BBF7D0" opacity="0.9"/>
    <text x="80" y="670" font-family="Inter" font-weight="800" font-size="13" fill="#15803D" letter-spacing="0.08em">CIVIC PARK</text>

    <!-- Safe corridor highlight -->
    <path d="M 60 -20 Q 80 200 110 480 T 140 1000" stroke="rgba(16,185,129,0.35)" stroke-width="44" fill="none"/>
  </svg>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-xs"></i>
    </span>
  </div>

  <!-- Top floating bar -->
  <div class="absolute top-[68px] left-7 right-7 z-30 flex items-center gap-2">
    <div class="flex-1 h-12 rounded-2xl bg-white shadow-lg flex items-center px-4 gap-2.5">
      <i class="fas fa-magnifying-glass text-slate-400 text-sm"></i>
      <input class="flex-1 bg-transparent text-[13px] outline-none" placeholder="Maple Heights · Beat 4">
      <i class="fas fa-microphone text-slate-400 text-sm"></i>
    </div>
    <button class="w-12 h-12 rounded-2xl bg-white shadow-lg flex items-center justify-center"><i class="fas fa-layer-group text-slate-700 text-sm"></i></button>
  </div>

  <!-- Filter chips -->
  <div class="absolute top-[128px] left-7 right-7 z-30 flex gap-2 overflow-x-auto">
    <button class="px-3 py-1.5 rounded-full text-[10px] font-extrabold flex-shrink-0 text-white shadow flex items-center gap-1.5" style="background: linear-gradient(135deg, #1E3A8A, #1D4ED8);">
      <i class="fas fa-shield-halved text-[9px]"></i> All
    </button>
    <button class="px-3 py-1.5 rounded-full text-[10px] font-bold flex-shrink-0 bg-white text-slate-700 shadow flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span> Patrols</button>
    <button class="px-3 py-1.5 rounded-full text-[10px] font-bold flex-shrink-0 bg-white text-slate-700 shadow flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span> Cadets</button>
    <button class="px-3 py-1.5 rounded-full text-[10px] font-bold flex-shrink-0 bg-white text-slate-700 shadow flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Alerts</button>
    <button class="px-3 py-1.5 rounded-full text-[10px] font-bold flex-shrink-0 bg-white text-slate-700 shadow flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Safe routes</button>
  </div>

  <!-- Pins -->
  <!-- Patrol car -->
  <div class="absolute z-20" style="top: 245px; left: 80px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <span class="absolute inset-0 rounded-full pulse-ring" style="background: rgba(29, 78, 216, 0.4);"></span>
      <div class="w-11 h-11 rounded-full ring-4 ring-white shadow-lg flex items-center justify-center" style="background: linear-gradient(135deg, #1E3A8A, #1D4ED8);">
        <i class="fas fa-car-side text-white text-sm"></i>
      </div>
      <div class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 ring-2 ring-white"></div>
    </div>
  </div>

  <!-- Cadet 1 -->
  <div class="absolute z-20" style="top: 350px; left: 280px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=120&q=80" class="w-10 h-10 rounded-full object-cover ring-4 ring-white shadow-lg">
      <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full ring-2 ring-white text-white text-[8px] font-extrabold flex items-center justify-center" style="background: linear-gradient(135deg,#38BDF8,#1D4ED8);"><i class="fas fa-shield-halved text-[8px]"></i></div>
    </div>
  </div>

  <!-- Cadet 2 -->
  <div class="absolute z-20" style="top: 480px; left: 165px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=120&q=80" class="w-10 h-10 rounded-full object-cover ring-4 ring-white shadow-lg">
      <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full ring-2 ring-white text-white text-[8px] font-extrabold flex items-center justify-center" style="background: linear-gradient(135deg,#38BDF8,#1D4ED8);"><i class="fas fa-shield-halved text-[8px]"></i></div>
    </div>
  </div>

  <!-- Alert pin -->
  <div class="absolute z-20" style="top: 220px; left: 340px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <span class="absolute inset-0 rounded-full pulse-ring" style="background: rgba(245, 158, 11, 0.45);"></span>
      <div class="w-10 h-10 rounded-full ring-4 ring-white shadow-lg flex items-center justify-center" style="background: linear-gradient(135deg, #F59E0B, #D97706);">
        <i class="fas fa-triangle-exclamation text-white text-xs"></i>
      </div>
    </div>
  </div>

  <!-- Patrol 2 -->
  <div class="absolute z-20" style="top: 760px; left: 360px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <div class="w-11 h-11 rounded-full ring-4 ring-white shadow-lg flex items-center justify-center" style="background: linear-gradient(135deg, #1E3A8A, #1D4ED8);">
        <i class="fas fa-car-side text-white text-sm"></i>
      </div>
      <div class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-500 ring-2 ring-white"></div>
    </div>
  </div>

  <!-- YOU pin -->
  <div class="absolute z-20" style="top: 545px; left: 240px;">
    <div class="relative -translate-x-1/2 -translate-y-1/2">
      <span class="absolute inset-0 rounded-full pulse-ring" style="background: rgba(245, 158, 11, 0.5);"></span>
      <div class="w-12 h-12 rounded-full ring-4 ring-white shadow-xl flex items-center justify-center" style="background: linear-gradient(135deg, #F59E0B, #D97706);">
        <i class="fas fa-house-user text-white text-sm"></i>
      </div>
      <div class="absolute top-14 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded-md text-[9px] font-bold whitespace-nowrap shadow" style="background: white; color: #1E3A8A;">YOUR HOME</div>
    </div>
  </div>

  <!-- Resolved (green check) -->
  <div class="absolute z-20" style="top: 660px; left: 90px;">
    <div class="w-9 h-9 rounded-full ring-4 ring-white shadow flex items-center justify-center -translate-x-1/2 -translate-y-1/2" style="background: linear-gradient(135deg, #34D399, #059669);">
      <i class="fas fa-check text-white text-xs"></i>
    </div>
  </div>

  <!-- Bottom card -->
  <div class="absolute bottom-[100px] left-5 right-5 z-30 rounded-3xl p-4 shadow-2xl" style="background: white;">
    <div class="flex items-center justify-center mb-3"><div class="w-10 h-1 rounded-full bg-slate-200"></div></div>
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[10px] tracking-wider text-slate-500 font-bold">RIGHT NOW · MAPLE HTS</div>
        <div class="text-[20px] font-extrabold leading-tight tracking-tight mt-0.5">14 friendlies nearby</div>
      </div>
      <div class="flex -space-x-2">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=120&q=80" class="w-8 h-8 rounded-full ring-2 ring-white object-cover">
        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=120&q=80" class="w-8 h-8 rounded-full ring-2 ring-white object-cover">
        <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=120&q=80" class="w-8 h-8 rounded-full ring-2 ring-white object-cover">
        <div class="w-8 h-8 rounded-full ring-2 ring-white bg-blue-100 text-[9px] flex items-center justify-center font-extrabold text-blue-700">+11</div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2.5 mt-3 pt-3 border-t border-slate-100">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#DBEAFE;"><i class="fas fa-car-side text-blue-700 text-xs"></i></div>
        <div>
          <div class="text-[9.5px] text-slate-500 font-medium">Patrols</div>
          <div class="text-[14px] font-extrabold leading-none">2</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#E0F2FE;"><i class="fas fa-shield-halved text-sky-700 text-xs"></i></div>
        <div>
          <div class="text-[9.5px] text-slate-500 font-medium">Cadets</div>
          <div class="text-[14px] font-extrabold leading-none">12</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#FEF3C7;"><i class="fas fa-triangle-exclamation text-amber-700 text-xs"></i></div>
        <div>
          <div class="text-[9.5px] text-slate-500 font-medium">Alerts</div>
          <div class="text-[14px] font-extrabold leading-none">1</div>
        </div>
      </div>
    </div>

    <button class="mt-3 w-full h-11 rounded-2xl text-[13px] font-bold text-white flex items-center justify-center gap-2" style="background: linear-gradient(135deg, #1E3A8A, #1D4ED8);">
      <i class="fas fa-route text-xs"></i> Walk me home — safe route
    </button>
  </div>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <a class="tab"><i class="fas fa-house text-base"></i><span>Home</span></a>
    <a class="tab active"><i class="fas fa-map-location-dot text-base"></i><span>Map</span></a>
    <a class="tab"><i class="fas fa-people-group text-base"></i><span>Network</span></a>
    <a class="tab"><i class="fas fa-graduation-cap text-base"></i><span>Academy</span></a>
    <a class="tab"><i class="far fa-user text-base"></i><span>Profile</span></a>
  </nav>
</div>
</body>
</html>
