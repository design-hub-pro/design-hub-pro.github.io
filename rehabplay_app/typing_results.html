<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RehabPlay - Game Results</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  body { width: 100%; height: 100%; margin: 0; padding: 0; background: #0F172A; overflow-x: hidden; }
  .status-bar { height: 59px; }
  .content-area { padding-left: 28px; padding-right: 28px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; margin: 0 auto; margin-top: 14px; }
  .confetti { animation: confetti 2s ease-out forwards; }
  @keyframes confetti { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(80px) rotate(360deg); } }
  .score-reveal { animation: scoreReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes scoreReveal { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .star-glow { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)); }
</style>
</head>
<body class="bg-[#0F172A]">
  <!-- Status Bar -->
  <div class="status-bar bg-[#0F172A] flex items-end justify-between px-8 pb-2">
    <div class="dynamic-island"></div>
  </div>
  <div class="flex justify-between items-center px-7 pt-1 pb-2">
    <span class="text-xs font-medium text-gray-400">9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-gray-400"></i>
      <i class="fas fa-wifi text-xs text-gray-400"></i>
      <i class="fas fa-battery-full text-xs text-gray-400"></i>
    </div>
  </div>

  <!-- Close button -->
  <div class="content-area flex justify-end pt-2 pb-2">
    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
      <i class="fas fa-times text-white text-sm"></i>
    </div>
  </div>

  <!-- Stars & Score -->
  <div class="content-area text-center pt-4 mb-6">
    <!-- Stars -->
    <div class="flex justify-center gap-3 mb-5">
      <div class="star-glow"><i class="fas fa-star text-amber-400 text-3xl"></i></div>
      <div class="star-glow -mt-3"><i class="fas fa-star text-amber-400 text-4xl"></i></div>
      <div class="star-glow"><i class="fas fa-star text-amber-400 text-3xl"></i></div>
    </div>

    <h1 class="text-white text-2xl font-extrabold mb-1">Great Job!</h1>
    <p class="text-gray-400 text-sm mb-6">You've completed the typing challenge</p>

    <!-- Big Score -->
    <div class="score-reveal">
      <div class="relative inline-block">
        <svg class="w-40 h-40" viewBox="0 0 160 160" style="transform: rotate(-90deg)">
          <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>
          <circle cx="80" cy="80" r="68" fill="none" stroke="url(#resultGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="427.3" stroke-dashoffset="42.7"/>
          <defs>
            <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#34D399"/>
              <stop offset="100%" style="stop-color:#06B6D4"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-5xl font-extrabold text-white">847</span>
          <span class="text-xs text-gray-500 font-medium mt-1">POINTS</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="content-area mb-6">
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white/5 rounded-2xl p-4 border border-white/5 text-center">
        <i class="fas fa-tachometer-alt text-emerald-400 text-lg mb-2"></i>
        <p class="text-2xl font-extrabold text-white">32</p>
        <p class="text-[10px] text-gray-500">WPM</p>
        <div class="flex items-center justify-center gap-1 mt-1.5">
          <div class="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded-full">Personal Best!</div>
        </div>
      </div>
      <div class="bg-white/5 rounded-2xl p-4 border border-white/5 text-center">
        <i class="fas fa-bullseye text-blue-400 text-lg mb-2"></i>
        <p class="text-2xl font-extrabold text-white">94%</p>
        <p class="text-[10px] text-gray-500">Accuracy</p>
        <div class="flex items-center justify-center gap-1 mt-1.5">
          <i class="fas fa-arrow-up text-emerald-400 text-[10px]"></i>
          <span class="text-[10px] text-emerald-400 font-medium">+3%</span>
        </div>
      </div>
      <div class="bg-white/5 rounded-2xl p-4 border border-white/5 text-center">
        <i class="fas fa-clock text-amber-400 text-lg mb-2"></i>
        <p class="text-2xl font-extrabold text-white">1:00</p>
        <p class="text-[10px] text-gray-500">Duration</p>
      </div>
      <div class="bg-white/5 rounded-2xl p-4 border border-white/5 text-center">
        <i class="fas fa-fire text-orange-400 text-lg mb-2"></i>
        <p class="text-2xl font-extrabold text-white">x2.5</p>
        <p class="text-[10px] text-gray-500">Max Combo</p>
      </div>
    </div>
  </div>

  <!-- Motor Insights -->
  <div class="content-area mb-6">
    <div class="bg-gradient-to-r from-emerald-500/10 to-cyan-500/10 rounded-2xl p-4 border border-emerald-500/20">
      <div class="flex items-center gap-2 mb-2">
        <i class="fas fa-brain text-emerald-400 text-sm"></i>
        <span class="text-emerald-400 font-semibold text-sm">Motor Insight</span>
      </div>
      <p class="text-gray-300 text-xs leading-relaxed">Your left hand reaction improved by 15%. Key press consistency is above average for your level.</p>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="content-area pb-12">
    <div class="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-2xl py-4 text-center mb-3 shadow-lg shadow-emerald-500/20">
      <span class="text-white font-bold text-base">Play Again</span>
    </div>
    <div class="bg-white/5 rounded-2xl py-4 text-center border border-white/10">
      <span class="text-white/70 font-medium text-sm">Back to Home</span>
    </div>
  </div>
</body>
</html>
