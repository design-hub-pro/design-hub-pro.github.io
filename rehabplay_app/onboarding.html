<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RehabPlay - Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  body { width: 100%; height: 100%; margin: 0; padding: 0; background: #F8F7FC; overflow-x: hidden; }
  .status-bar { height: 59px; }
  .content-area { padding-left: 28px; padding-right: 28px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; margin: 0 auto; margin-top: 14px; }
  .float-1 { animation: float1 4s ease-in-out infinite; }
  .float-2 { animation: float2 5s ease-in-out infinite; }
  .float-3 { animation: float3 3.5s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  @keyframes float2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-2deg); } }
  @keyframes float3 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body class="bg-[#F8F7FC]">
  <!-- Status Bar -->
  <div class="status-bar bg-[#F8F7FC] flex items-end justify-between px-8 pb-2">
    <div class="dynamic-island"></div>
  </div>
  <div class="flex justify-between items-center px-7 pt-1 pb-2">
    <span class="text-xs font-medium text-gray-500">9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-gray-500"></i>
      <i class="fas fa-wifi text-xs text-gray-500"></i>
      <i class="fas fa-battery-full text-xs text-gray-500"></i>
    </div>
  </div>

  <!-- Skip -->
  <div class="content-area flex justify-end pt-2 pb-4">
    <span class="text-sm text-gray-400 font-medium">Skip</span>
  </div>

  <!-- Illustration Area -->
  <div class="content-area flex flex-col items-center justify-center py-8" style="min-height: 380px;">
    <div class="relative w-64 h-64 mb-8">
      <!-- Background circles -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-52 h-52 rounded-full bg-violet-100/50"></div>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-40 h-40 rounded-full bg-violet-200/50"></div>
      </div>

      <!-- Floating icons -->
      <div class="absolute top-4 left-8 float-1">
        <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200/50">
          <i class="fas fa-keyboard text-white text-2xl"></i>
        </div>
      </div>
      <div class="absolute top-8 right-6 float-2">
        <div class="w-16 h-16 bg-gradient-to-br from-violet-400 to-purple-500 rounded-2xl flex items-center justify-center shadow-lg shadow-violet-200/50">
          <i class="fas fa-music text-white text-2xl"></i>
        </div>
      </div>
      <div class="absolute bottom-12 left-1/2 -translate-x-1/2 float-3">
        <div class="w-20 h-20 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-200/50">
          <i class="fas fa-brain text-white text-3xl"></i>
        </div>
      </div>

      <!-- Connecting lines -->
      <div class="absolute top-20 left-24 w-16 border-t-2 border-dashed border-violet-200" style="transform: rotate(25deg)"></div>
      <div class="absolute top-20 right-20 w-16 border-t-2 border-dashed border-violet-200" style="transform: rotate(-25deg)"></div>
    </div>

    <!-- Text -->
    <div class="text-center content-area">
      <h1 class="text-3xl font-extrabold text-gray-900 mb-3">Play Your Way<br>to Recovery</h1>
      <p class="text-sm text-gray-400 leading-relaxed">Fun typing & piano games designed<br>to track and improve your motor skills</p>
    </div>
  </div>

  <!-- Page Dots -->
  <div class="flex justify-center gap-2 mb-8">
    <div class="w-8 h-2 bg-violet-600 rounded-full"></div>
    <div class="w-2 h-2 bg-gray-200 rounded-full"></div>
    <div class="w-2 h-2 bg-gray-200 rounded-full"></div>
  </div>

  <!-- CTA Button -->
  <div class="content-area pb-12">
    <div class="bg-gradient-to-r from-violet-600 to-indigo-600 rounded-2xl py-4 text-center shadow-lg shadow-violet-300/30">
      <span class="text-white font-bold text-base">Get Started</span>
    </div>
    <p class="text-center text-xs text-gray-400 mt-3">Recommended by 500+ neurologists</p>
    <div class="flex justify-center items-center gap-1 mt-1">
      <div class="flex -space-x-2">
        <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=30&h=30&fit=crop&crop=face" class="w-6 h-6 rounded-full border-2 border-white object-cover">
        <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=30&h=30&fit=crop&crop=face" class="w-6 h-6 rounded-full border-2 border-white object-cover">
        <img src="https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=30&h=30&fit=crop&crop=face" class="w-6 h-6 rounded-full border-2 border-white object-cover">
      </div>
      <div class="flex gap-0.5 ml-1">
        <i class="fas fa-star text-amber-400 text-[10px]"></i>
        <i class="fas fa-star text-amber-400 text-[10px]"></i>
        <i class="fas fa-star text-amber-400 text-[10px]"></i>
        <i class="fas fa-star text-amber-400 text-[10px]"></i>
        <i class="fas fa-star text-amber-400 text-[10px]"></i>
      </div>
    </div>
  </div>
</body>
</html>
