<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RehabPlay - Typing Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  body { width: 100%; height: 100%; margin: 0; padding: 0; background: #0F172A; overflow-x: hidden; }
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
  .status-bar { height: 59px; }
  .content-area { padding-left: 28px; padding-right: 28px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; margin: 0 auto; margin-top: 14px; }
  .key { transition: all 0.15s; }
  .key:active { transform: scale(0.92); }
  .key-active { background: linear-gradient(135deg, #34D399, #10B981); color: white; transform: scale(1.05); box-shadow: 0 0 15px rgba(52, 211, 153, 0.5); }
  .key-error { background: linear-gradient(135deg, #F87171, #EF4444); color: white; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .pulse-cursor { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .word-float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
</style>
</head>
<body class="bg-[#0F172A]">
  <!-- Status Bar -->
  <div class="status-bar bg-[#0F172A] flex items-end justify-between px-8 pb-2">
    <div class="dynamic-island"></div>
  </div>
  <div class="flex justify-between items-center px-7 pt-1 pb-2">
    <span class="text-xs font-medium text-gray-400">9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-gray-400"></i>
      <i class="fas fa-wifi text-xs text-gray-400"></i>
      <i class="fas fa-battery-full text-xs text-gray-400"></i>
    </div>
  </div>

  <!-- Top Nav -->
  <div class="content-area flex items-center justify-between pt-1 pb-3">
    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
      <i class="fas fa-arrow-left text-white text-sm"></i>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 bg-emerald-500/20 px-3 py-1.5 rounded-full">
        <i class="fas fa-fire text-orange-400 text-xs"></i>
        <span class="text-emerald-400 text-xs font-bold">Level 5</span>
      </div>
    </div>
    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
      <i class="fas fa-pause text-white text-sm"></i>
    </div>
  </div>

  <!-- Score & Timer -->
  <div class="content-area flex items-center justify-between mb-5">
    <div class="text-center">
      <p class="text-3xl font-extrabold text-white">847</p>
      <p class="text-[10px] text-gray-500 font-medium">SCORE</p>
    </div>
    <div class="relative">
      <svg class="w-20 h-20" viewBox="0 0 80 80" style="transform: rotate(-90deg)">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="85.4"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-xl font-bold text-white">0:42</span>
        <span class="text-[10px] text-gray-500">LEFT</span>
      </div>
    </div>
    <div class="text-center">
      <p class="text-3xl font-extrabold text-white">94<span class="text-lg text-gray-500">%</span></p>
      <p class="text-[10px] text-gray-500 font-medium">ACCURACY</p>
    </div>
  </div>

  <!-- Word Display Area -->
  <div class="content-area mb-6">
    <div class="bg-white/5 backdrop-blur rounded-2xl p-6 border border-white/10">
      <!-- Completed words -->
      <div class="flex flex-wrap gap-x-2 gap-y-1 mb-3">
        <span class="text-emerald-400/50 text-lg font-medium">gentle</span>
        <span class="text-emerald-400/50 text-lg font-medium">breeze</span>
        <span class="text-emerald-400/50 text-lg font-medium">flows</span>
      </div>
      <!-- Current word -->
      <div class="word-float mb-3">
        <span class="text-emerald-400 text-3xl font-bold">sun</span><span class="pulse-cursor text-white text-3xl font-bold">|</span><span class="text-white/30 text-3xl font-bold">light</span>
      </div>
      <!-- Upcoming words -->
      <div class="flex flex-wrap gap-x-2 gap-y-1">
        <span class="text-white/20 text-lg font-medium">through</span>
        <span class="text-white/20 text-lg font-medium">morning</span>
        <span class="text-white/20 text-lg font-medium">trees</span>
      </div>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="content-area flex gap-3 mb-5">
    <div class="flex-1 bg-white/5 rounded-xl p-3 text-center border border-white/5">
      <p class="text-lg font-bold text-white">32</p>
      <p class="text-[10px] text-gray-500">WPM</p>
    </div>
    <div class="flex-1 bg-white/5 rounded-xl p-3 text-center border border-white/5">
      <p class="text-lg font-bold text-emerald-400">7</p>
      <p class="text-[10px] text-gray-500">Combo</p>
    </div>
    <div class="flex-1 bg-white/5 rounded-xl p-3 text-center border border-white/5">
      <p class="text-lg font-bold text-amber-400">x2.5</p>
      <p class="text-[10px] text-gray-500">Multi</p>
    </div>
  </div>

  <!-- Keyboard -->
  <div class="content-area pb-6">
    <div class="bg-white/5 backdrop-blur rounded-2xl p-3 border border-white/10">
      <!-- Row 1 -->
      <div class="flex gap-1.5 justify-center mb-1.5">
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">Q</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">W</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">E</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">R</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">T</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">Y</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">U</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">I</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">O</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">P</div>
      </div>
      <!-- Row 2 -->
      <div class="flex gap-1.5 justify-center mb-1.5 px-[4%]">
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">A</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">S</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">D</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">F</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">G</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">H</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">J</div>
        <div class="key w-[9.8%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">K</div>
        <div class="key key-active w-[9.8%] aspect-square rounded-lg flex items-center justify-center text-sm font-medium">L</div>
      </div>
      <!-- Row 3 -->
      <div class="flex gap-1.5 justify-center mb-1.5">
        <div class="key w-[13%] aspect-[1.5/1] bg-white/10 rounded-lg flex items-center justify-center text-white text-xs font-medium"><i class="fas fa-arrow-up"></i></div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">Z</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">X</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">C</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">V</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">B</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">N</div>
        <div class="key w-[9%] aspect-square bg-white/10 rounded-lg flex items-center justify-center text-white text-sm font-medium">M</div>
        <div class="key w-[13%] aspect-[1.5/1] bg-white/10 rounded-lg flex items-center justify-center text-white text-xs font-medium"><i class="fas fa-backspace"></i></div>
      </div>
      <!-- Row 4 - Space -->
      <div class="flex gap-1.5 justify-center">
        <div class="key w-[18%] aspect-[2/1] bg-white/10 rounded-lg flex items-center justify-center text-white text-xs font-medium">123</div>
        <div class="key flex-1 h-10 bg-white/15 rounded-lg flex items-center justify-center text-white text-sm font-medium">space</div>
        <div class="key w-[18%] aspect-[2/1] bg-emerald-500 rounded-lg flex items-center justify-center text-white text-xs font-bold">Go</div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar bg-[#0F172A]/95 backdrop-blur-xl border-t border-white/5 px-6 pb-8 pt-3">
    <div class="flex justify-around items-center">
      <div class="flex flex-col items-center gap-1">
        <i class="fas fa-home text-gray-500 text-xl"></i>
        <span class="text-[10px] font-medium text-gray-500">Home</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <i class="fas fa-gamepad text-emerald-400 text-xl"></i>
        <span class="text-[10px] font-semibold text-emerald-400">Games</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <i class="fas fa-chart-line text-gray-500 text-xl"></i>
        <span class="text-[10px] font-medium text-gray-500">Progress</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <i class="fas fa-user text-gray-500 text-xl"></i>
        <span class="text-[10px] font-medium text-gray-500">Profile</span>
      </div>
    </div>
  </div>
</body>
</html>
