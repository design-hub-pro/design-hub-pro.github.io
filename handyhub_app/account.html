<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandyHub - Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #F2F2F7; }
        .menu-item { transition: background 0.2s; }
        .menu-item:active { background: #F3F4F6; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full min-h-screen bg-gray-50">
        <!-- Status Bar -->
        <div class="bg-white px-6 pt-3 pb-1 flex justify-between items-center">
            <span class="text-sm font-semibold">9:41</span>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="bg-white px-5 pt-4 pb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Profile</h1>

            <!-- Profile Card -->
            <div class="flex items-center">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop&crop=face" alt="Profile" class="w-20 h-20 rounded-full object-cover">
                    <div class="absolute bottom-0 right-0 w-7 h-7 bg-orange-500 rounded-full flex items-center justify-center border-2 border-white">
                        <i class="fas fa-camera text-white text-xs"></i>
                    </div>
                </div>
                <div class="ml-4">
                    <h2 class="text-xl font-semibold text-gray-900">John Parker</h2>
                    <p class="text-gray-500 text-sm">john.parker@email.com</p>
                    <div class="flex items-center mt-1">
                        <i class="fas fa-map-marker-alt text-orange-500 text-xs"></i>
                        <span class="text-gray-500 text-sm ml-1">San Francisco, CA</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="px-5 py-4 bg-white mt-2">
            <div class="flex justify-between">
                <div class="text-center flex-1">
                    <p class="text-2xl font-bold text-orange-500">12</p>
                    <p class="text-gray-500 text-xs">Bookings</p>
                </div>
                <div class="w-px bg-gray-200"></div>
                <div class="text-center flex-1">
                    <p class="text-2xl font-bold text-orange-500">8</p>
                    <p class="text-gray-500 text-xs">Favorites</p>
                </div>
                <div class="w-px bg-gray-200"></div>
                <div class="text-center flex-1">
                    <p class="text-2xl font-bold text-orange-500">5</p>
                    <p class="text-gray-500 text-xs">Reviews</p>
                </div>
            </div>
        </div>

        <!-- Menu Section -->
        <div class="mt-2 bg-white">
            <div class="menu-item flex items-center px-5 py-4 border-b border-gray-100">
                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-history text-blue-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Booking History</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
            <div class="menu-item flex items-center px-5 py-4 border-b border-gray-100">
                <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-heart text-red-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Saved Pros</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
            <div class="menu-item flex items-center px-5 py-4 border-b border-gray-100">
                <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-credit-card text-green-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Payment Methods</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
            <div class="menu-item flex items-center px-5 py-4">
                <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-map-marker-alt text-purple-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Saved Addresses</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <!-- Settings Section -->
        <div class="mt-2 bg-white">
            <div class="menu-item flex items-center px-5 py-4 border-b border-gray-100">
                <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bell text-gray-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Notifications</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
            <div class="menu-item flex items-center px-5 py-4 border-b border-gray-100">
                <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shield-alt text-gray-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Privacy & Security</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
            <div class="menu-item flex items-center px-5 py-4">
                <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-question-circle text-gray-500"></i>
                </div>
                <span class="ml-4 flex-1 text-gray-900 font-medium">Help & Support</span>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <!-- Logout -->
        <div class="mt-2 bg-white mb-28">
            <div class="menu-item flex items-center justify-center px-5 py-4">
                <i class="fas fa-sign-out-alt text-red-500 mr-2"></i>
                <span class="text-red-500 font-medium">Log Out</span>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-2 pb-6">
            <div class="flex justify-around items-center">
                <div class="flex flex-col items-center">
                    <i class="fas fa-home text-gray-400 text-xl"></i>
                    <span class="text-xs text-gray-400 mt-1">Home</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-search text-gray-400 text-xl"></i>
                    <span class="text-xs text-gray-400 mt-1">Search</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-calendar-alt text-gray-400 text-xl"></i>
                    <span class="text-xs text-gray-400 mt-1">Bookings</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-comment-dots text-gray-400 text-xl"></i>
                    <span class="text-xs text-gray-400 mt-1">Messages</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-user text-orange-500 text-xl"></i>
                    <span class="text-xs text-orange-500 mt-1 font-medium">Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
