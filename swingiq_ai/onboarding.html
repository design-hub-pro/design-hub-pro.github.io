<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingIQ — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: #0a0f0d; }
.status-bar { height: 59px; padding: 0 28px; display:flex; align-items: flex-end; justify-content: space-between; padding-bottom: 8px; color: white; }
.dynamic-island { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 20px; z-index: 50; }
.hero-bg { background-image: url('https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=900'); background-size: cover; background-position: center; }
.gradient-overlay { background: linear-gradient(180deg, rgba(10,15,13,0) 0%, rgba(10,15,13,0.4) 40%, rgba(10,15,13,0.95) 75%, rgba(10,15,13,1) 100%); }
.glow-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45); }
.feature-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.dot.active { width: 22px; background: #10b981; border-radius: 3px; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <!-- Hero image full bleed -->
  <div class="absolute inset-0 hero-bg"></div>
  <div class="absolute inset-0 gradient-overlay"></div>

  <!-- Status bar -->
  <div class="status-bar relative z-10">
    <span class="text-sm font-semibold">9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-xs"></i>
    </div>
  </div>

  <!-- Logo top right -->
  <div class="absolute top-20 right-7 z-10 flex items-center gap-2">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-lg">
      <i class="fas fa-golf-ball-tee text-white text-sm"></i>
    </div>
    <span class="text-white font-bold text-lg tracking-tight">SwingIQ</span>
  </div>

  <!-- Floating stat card -->
  <div class="absolute z-10" style="top: 200px; left: 28px;">
    <div class="feature-pill rounded-2xl px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center">
        <i class="fas fa-bolt text-emerald-400 text-sm"></i>
      </div>
      <div>
        <div class="text-white text-xs font-semibold">Swing Speed</div>
        <div class="text-emerald-400 text-lg font-bold leading-none">112 <span class="text-xs text-white/60 font-medium">mph</span></div>
      </div>
    </div>
  </div>

  <div class="absolute z-10" style="top: 280px; right: 28px;">
    <div class="feature-pill rounded-2xl px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-amber-500/20 flex items-center justify-center">
        <i class="fas fa-bullseye text-amber-400 text-sm"></i>
      </div>
      <div>
        <div class="text-white text-xs font-semibold">Carry</div>
        <div class="text-amber-400 text-lg font-bold leading-none">248 <span class="text-xs text-white/60 font-medium">yd</span></div>
      </div>
    </div>
  </div>

  <!-- Bottom content -->
  <div class="absolute bottom-0 left-0 right-0 z-10 px-7 pb-12">
    <div class="mb-5 flex items-center gap-2">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <h1 class="text-white font-black leading-tight mb-3" style="font-size: 38px; letter-spacing: -0.02em;">
      Your AI Caddie<br>for a Better Swing
    </h1>
    <p class="text-white/60 text-sm leading-relaxed mb-7" style="max-width: 320px;">
      Capture, analyze, and refine every shot. Pose AI + ball tracking, personalized to you.
    </p>

    <!-- Mini feature row -->
    <div class="flex gap-2 mb-6">
      <div class="feature-pill rounded-xl px-3 py-2 flex items-center gap-2">
        <i class="fas fa-video text-emerald-400 text-xs"></i>
        <span class="text-white text-xs font-medium">Capture</span>
      </div>
      <div class="feature-pill rounded-xl px-3 py-2 flex items-center gap-2">
        <i class="fas fa-person-running text-emerald-400 text-xs"></i>
        <span class="text-white text-xs font-medium">Pose AI</span>
      </div>
      <div class="feature-pill rounded-xl px-3 py-2 flex items-center gap-2">
        <i class="fas fa-route text-emerald-400 text-xs"></i>
        <span class="text-white text-xs font-medium">Ball Trace</span>
      </div>
    </div>

    <button class="glow-btn w-full text-white font-bold py-4 rounded-2xl text-base flex items-center justify-center gap-2">
      Start Free Trial
      <i class="fas fa-arrow-right text-sm"></i>
    </button>

    <p class="text-center text-white/40 text-xs mt-4">Already a member? <span class="text-emerald-400 font-semibold">Sign in</span></p>
  </div>
</div>
</body>
</html>
