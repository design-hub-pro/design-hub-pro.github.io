<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuckTrack Mobile - Hockey Goal Highlights</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;margin:0;padding:0;box-sizing:border-box;}
body{background:#ffffff;min-height:100vh;}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#000;box-shadow:0 25px 80px rgba(0,0,0,0.15);}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#0a0b10;}
.phone-screen iframe{width:100%;height:100%;border:none;}
.grid-container{display:grid;grid-template-columns:repeat(3,460px);gap:48px;justify-content:center;padding:0 48px;}
</style>
</head>
<body>
<!-- Header -->
<div class="max-w-[1560px] mx-auto px-12 pt-16 pb-12 text-center">
    <div class="flex items-center justify-center gap-3 mb-5">
        <div class="w-14 h-14 bg-gradient-to-br from-[#00a8ff] to-[#0066ff] rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fas fa-hockey-puck text-white text-2xl"></i>
        </div>
    </div>
    <h1 class="text-4xl font-black text-gray-900 tracking-tight mb-2">PuckTrack Mobile</h1>
    <p class="text-lg text-gray-500 max-w-xl mx-auto">Watch hockey goal highlights and connect with the community</p>
</div>

<!-- Phone Screenshots Grid -->
<div class="grid-container pb-20">
    <!-- Home -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">Home Feed</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="home.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <!-- Explore -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">Explore</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="explore.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <!-- My Reels -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">My Reels</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="reels.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <!-- Community -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">Community</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="community.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <!-- Video Player -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">Highlight Player</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="player.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <!-- Profile -->
    <div>
        <div class="text-center mb-4">
            <span class="text-sm font-semibold text-gray-800">Profile</span>
        </div>
        <div class="phone-frame">
            <div class="phone-screen">
                <iframe src="profile.html" scrolling="no"></iframe>
            </div>
        </div>
    </div>
</div>
</body>
</html>
