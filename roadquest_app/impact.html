<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Impact</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.hero{border-radius:28px;padding:22px;background:linear-gradient(140deg,#0F7A55 0%,#16A34A 55%,#5BCB7E 100%);color:#fff;position:relative;overflow:hidden;margin-top:18px}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:3px;margin-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tiles .card{padding:16px}
.biz{width:168px;flex:none;border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--border)}
.biz .ph{height:110px}
.bars{display:flex;align-items:flex-end;gap:9px;height:84px}
.bars i{flex:1;border-radius:7px 7px 3px 3px;background:#DCF3E4}
.bars i.on{background:var(--gradLocal)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">8:15</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3"><div class="h1">Your impact</div><div class="iconbtn"><i class="fa-solid fa-arrow-up-from-bracket"></i></div></div>

    <div class="hero">
      <div class="text-[12px] font-bold tracking-widest opacity-80">SPENT WITH LOCALS · THIS TRIP</div>
      <div class="text-[46px] font-black tracking-tight leading-none mt-3 num">$186</div>
      <div class="split">
        <i style="flex:52;background:#fff"></i><i style="flex:30;background:rgba(255,255,255,.65)"></i><i style="flex:18;background:rgba(255,255,255,.35)"></i>
      </div>
      <div class="flex gap-4 mt-3 text-[12px] font-semibold">
        <span class="flex items-center gap-1.5"><span class="dot bg-white"></span>Food</span>
        <span class="flex items-center gap-1.5"><span class="dot" style="background:rgba(255,255,255,.65)"></span>Farm</span>
        <span class="flex items-center gap-1.5"><span class="dot" style="background:rgba(255,255,255,.35)"></span>Museums</span>
      </div>
    </div>

    <div class="tiles">
      <div class="card"><span class="gicon g-sun" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-house-chimney"></i></span><div class="big num mt-3">7</div><div class="text-[12.5px] font-semibold text-slate-500 mt-1">Family-owned stops</div></div>
      <div class="card"><span class="gicon g-teal" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-signs-post"></i></span><div class="big num mt-3">4</div><div class="text-[12.5px] font-semibold text-slate-500 mt-1">Towns under 2,000</div></div>
    </div>

    <div class="sec"><div class="h2">Places you backed</div></div>
    <div class="hscroll">
      <div class="biz"><div class="ph img" style="background-image:url(img/diner.jpg)"></div><div class="p-3"><div class="font-bold text-[14px]">Rosie's Diner</div><div class="text-[12px] font-semibold text-slate-400 mt-0.5 num">Since 1962</div></div></div>
      <div class="biz"><div class="ph img" style="background-image:url(img/orchard.jpg)"></div><div class="p-3"><div class="font-bold text-[14px]">Miller Farm</div><div class="text-[12px] font-semibold text-slate-400 mt-0.5 num">4th generation</div></div></div>
      <div class="biz"><div class="ph img" style="background-image:url(img/museum.jpg)"></div><div class="p-3"><div class="font-bold text-[14px]">Pioneer Museum</div><div class="text-[12px] font-semibold text-slate-400 mt-0.5">Volunteer run</div></div></div>
    </div>

    <div class="card p-5 mt-5">
      <div class="flex items-center justify-between"><div class="font-bold text-[15px]">Every RoadQuest trip</div><span class="pill" style="background:#E7F7EC;color:var(--local)">Sample data</span></div>
      <div class="bars mt-4"><i style="height:30%"></i><i style="height:42%"></i><i style="height:38%"></i><i style="height:55%"></i><i style="height:64%"></i><i style="height:72%"></i><i class="on" style="height:100%"></i></div>
      <div class="flex justify-between text-[11px] font-semibold text-slate-400 mt-2"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-route"></i>Route</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-puzzle-piece"></i></div></div>
  <div class="tab on"><i class="fa-solid fa-hand-holding-heart"></i>Impact</div>
  <div class="tab"><i class="fa-regular fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
