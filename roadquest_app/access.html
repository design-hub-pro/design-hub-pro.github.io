<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Access check</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.scan{height:330px;border-radius:28px;background-image:url(img/boardwalk.jpg);margin-top:18px}
.box{position:absolute;border:2.5px solid;border-radius:12px;z-index:4}
.box span{position:absolute;top:-30px;left:-2px;white-space:nowrap;font-size:11.5px;font-weight:700;color:#fff;padding:4px 8px;border-radius:8px}
.sweep{position:absolute;left:0;right:0;top:58%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px 4px rgba(255,255,255,.6);z-index:4}
.chk{display:flex;align-items:center;gap:14px;padding:13px 0}
.chk + .chk{border-top:1px solid var(--border)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;letter-spacing:-1px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">11:09</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="font-bold text-[16px]">Access check</div>
      <div class="iconbtn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>

    <div class="scan img">
      <div class="box" style="left:34%;top:48%;width:56px;height:70px;border-color:#4ADE80"><span style="background:var(--local)">Wheelchair · ok</span></div>
      <div class="box" style="left:8%;top:72%;width:84%;height:22%;border-color:#6AA8FF"><span style="background:var(--access)">Path 6 ft wide</span></div>
      <div class="box" style="left:62%;top:30%;width:30%;height:34%;border-color:#FFB547;border-style:dashed"><span style="background:var(--amber)">No rail</span></div>
      <div class="sweep"></div>
      <span class="pill glass absolute left-4 bottom-4" style="z-index:5"><i class="fa-solid fa-camera"></i>38 visitor photos</span>
    </div>

    <div class="card flex items-center gap-5 p-5 mt-5">
      <div class="ring">
        <svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="#E8EEF7" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="#2F7CF6" stroke-width="10" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="28" transform="rotate(-90 48 48)"/></svg>
        <b class="num" style="color:var(--access)">89</b>
      </div>
      <div class="flex-1">
        <div class="font-bold text-[17px] tracking-tight">Good for Grandpa</div>
        <div class="flex items-center gap-2 mt-2.5">
          <div class="avs"><img src="https://images.unsplash.com/photo-1552058544-f2b08422138a?w=120&h=120&fit=crop"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&h=120&fit=crop"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop"></div>
          <span class="text-[12.5px] font-semibold text-slate-500">14 riders confirmed</span>
        </div>
      </div>
    </div>

    <div class="sec"><div class="h2">What we found</div></div>
    <div class="card px-4 py-1">
      <div class="chk"><span class="gicon g-access" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-road"></i></span><div class="flex-1 font-semibold text-[15px]">Flat, firm path</div><span class="dot" style="background:var(--local);width:10px;height:10px"></span></div>
      <div class="chk"><span class="gicon g-teal" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-restroom"></i></span><div class="flex-1 font-semibold text-[15px]">Accessible restroom</div><span class="dot" style="background:var(--local);width:10px;height:10px"></span></div>
      <div class="chk"><span class="gicon g-sun" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-hand"></i></span><div class="flex-1 font-semibold text-[15px]">Handrails</div><span class="dot" style="background:var(--amber);width:10px;height:10px"></span></div>
      <div class="chk"><span class="gicon g-quest" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-baby-carriage"></i></span><div class="flex-1 font-semibold text-[15px]">Stroller ok</div><span class="dot" style="background:var(--local);width:10px;height:10px"></span></div>
    </div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 pad pb-9 pt-5 z-40" style="background:linear-gradient(180deg,rgba(250,249,247,0),var(--bg) 35%)">
  <div class="btn dark"><i class="fa-solid fa-camera"></i>Add a photo, help the next family</div>
</div>
<div class="homebar"></div>
</div></body></html>
