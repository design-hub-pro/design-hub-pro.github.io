<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Plan a trip</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.route{padding:6px 18px;position:relative}
.route .row{display:flex;align-items:center;gap:14px;height:58px}
.route .row + .row{border-top:1px solid var(--border)}
.route .line{position:absolute;left:31px;top:38px;bottom:38px;border-left:2px dashed #D9DEE3}
.who{width:96px;flex:none;border-radius:22px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);position:relative}
.who img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.who .need{position:absolute;top:50px;right:18px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;border:2.5px solid #fff}
.who b{font-size:12.5px;font-weight:700}
.who.add{border-style:dashed;justify-content:center;color:var(--faint)}
.slider{height:8px;border-radius:6px;background:#EEE9E4;position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:6px;background:var(--grad)}
.slider s{position:absolute;left:62%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(20,32,42,.25)}
.tile{flex:1;border-radius:18px;padding:14px 0;text-align:center;background:#fff;border:1px solid var(--border);font-weight:700;font-size:15px}
.tile.on{border-color:var(--sun);background:#FFF4EE;color:var(--sun)}
</style></head>
<body><div class="screen">
<div class="scroll" style="padding-bottom:120px">
  <div class="sb"><span class="t num">8:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-xmark"></i></div>
      <div class="flex gap-1.5"><span class="w-6 h-1.5 rounded-full" style="background:var(--sun)"></span><span class="w-6 h-1.5 rounded-full" style="background:var(--sun)"></span><span class="w-6 h-1.5 rounded-full bg-slate-200"></span></div>
      <div class="w-11"></div>
    </div>
    <div class="h1 mt-6">Plan a trip</div>
    <div class="sub mt-2">Tell us who's coming. We'll find the stops.</div>

    <div class="card route mt-6">
      <div class="line"></div>
      <div class="row"><span class="w-7 h-7 rounded-full flex items-center justify-center bg-white border-[3px]" style="border-color:var(--teal)"></span><div class="flex-1"><div class="text-[11px] font-bold text-slate-400 tracking-wider">FROM</div><div class="text-[16px] font-bold">Portland, OR</div></div><i class="fa-solid fa-location-crosshairs text-slate-300"></i></div>
      <div class="row"><span class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px]" style="background:var(--sun)"><i class="fa-solid fa-flag-checkered"></i></span><div class="flex-1"><div class="text-[11px] font-bold text-slate-400 tracking-wider">TO</div><div class="text-[16px] font-bold">San Francisco, CA</div></div><i class="fa-solid fa-arrow-right-arrow-left text-slate-300 rotate-90"></i></div>
    </div>

    <div class="sec"><div class="h2">Who's riding</div><span class="pill" style="background:#EAF2FF;color:var(--access)"><i class="fa-solid fa-universal-access"></i>2 needs</span></div>
    <div class="hscroll">
      <div class="who"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop"><b>Dana</b></div>
      <div class="who"><img src="https://images.unsplash.com/photo-1552058544-f2b08422138a?w=120&h=120&fit=crop"><span class="need g-access"><i class="fa-solid fa-wheelchair"></i></span><b>Grandpa</b></div>
      <div class="who"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=120&h=120&fit=crop"><b>Lily, 14</b></div>
      <div class="who"><div class="w-[52px] h-[52px] rounded-full g-sun flex items-center justify-center text-white text-xl"><i class="fa-solid fa-baby"></i></div><span class="need g-teal"><i class="fa-solid fa-baby-carriage"></i></span><b>Max, 3</b></div>
      <div class="who add"><i class="fa-solid fa-plus text-xl"></i><b class="text-slate-400">Add</b></div>
    </div>

    <div class="sec"><div class="h2">Into</div></div>
    <div class="flex flex-wrap gap-2.5">
      <span class="chip on"><i class="fa-solid fa-mountain-sun"></i>Scenic</span>
      <span class="chip on"><i class="fa-solid fa-landmark"></i>History</span>
      <span class="chip"><i class="fa-solid fa-utensils"></i>Local food</span>
      <span class="chip on"><i class="fa-solid fa-child-reaching"></i>Kid-friendly</span>
      <span class="chip"><i class="fa-solid fa-paw"></i>Wildlife</span>
      <span class="chip"><i class="fa-solid fa-palette"></i>Art</span>
    </div>

    <div class="sec"><div class="h2">Extra time</div><div class="text-[22px] font-extrabold tracking-tight num" style="color:var(--sun)">+2h 30m</div></div>
    <div class="slider"><i></i><s></s></div>
    <div class="flex justify-between mt-2.5 text-[12px] font-semibold text-slate-400"><span>Fastest</span><span>Full day</span></div>

    <div class="sec"><div class="h2">Budget</div></div>
    <div class="flex gap-2.5"><div class="tile">$</div><div class="tile on">$$</div><div class="tile">$$$</div></div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 pad pb-9 pt-5 z-40" style="background:linear-gradient(180deg,rgba(250,249,247,0),var(--bg) 35%)">
  <div class="btn"><i class="fa-solid fa-wand-magic-sparkles"></i>Build my route</div>
</div>
<div class="homebar"></div>
</div></body></html>
