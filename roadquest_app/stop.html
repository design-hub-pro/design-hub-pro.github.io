<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Stop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.top{height:420px;background-image:url(img/lighthouse.jpg);background-position:center 40%}
.top:after{background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(10,16,22,.75) 100%)}
.body{margin-top:-28px;background:var(--bg);border-radius:30px 30px 0 0;position:relative;z-index:5;padding-top:24px}
.acc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.acc div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center;position:relative}
.acc .gicon{width:54px;height:54px;border-radius:18px;font-size:20px}
.acc .ok{position:absolute;top:-3px;right:10px;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--bg)}
.stat b{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat span{font-size:11.5px;font-weight:600;color:var(--muted)}
</style></head>
<body><div class="screen">
<div class="scroll" style="padding-bottom:120px">
  <div class="top img shade">
    <div class="sb light"><span class="t num">11:02</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
    <div class="pad flex justify-between mt-3"><div class="iconbtn glass"><i class="fa-solid fa-chevron-left"></i></div><div class="flex gap-2.5"><div class="iconbtn glass"><i class="fa-regular fa-heart"></i></div><div class="iconbtn glass"><i class="fa-solid fa-arrow-up-from-bracket"></i></div></div></div>
    <div class="pad absolute bottom-12 left-0 right-0 text-white">
      <div class="flex gap-2"><span class="pill glass"><i class="fa-solid fa-route"></i>+14 min</span><span class="pill glass"><i class="fa-solid fa-star" style="color:var(--amber)"></i>4.8</span></div>
      <div class="text-[30px] font-extrabold tracking-tight leading-tight mt-3">Cape Hollow Light</div>
    </div>
  </div>
  <div class="body pad">
    <div class="flex justify-between stat">
      <div><b class="num">0.4<small class="text-[14px] text-slate-400"> mi</small></b><br><span>Flat path</span></div>
      <div><b class="num">40<small class="text-[14px] text-slate-400"> min</small></b><br><span>Typical visit</span></div>
      <div><b class="num" style="color:var(--local)">Free</b><br><span>Entry</span></div>
    </div>

    <div class="sec"><div class="h2">Works for your crew</div><span class="pill" style="background:#EAF2FF;color:var(--access)"><i class="fa-solid fa-camera"></i>AI checked</span></div>
    <div class="acc">
      <div><span class="gicon g-access"><i class="fa-solid fa-wheelchair"></i></span><span class="ok" style="background:var(--local)"></span>Step-free</div>
      <div><span class="gicon g-teal"><i class="fa-solid fa-restroom"></i></span><span class="ok" style="background:var(--local)"></span>Restroom</div>
      <div><span class="gicon g-sun"><i class="fa-solid fa-square-parking"></i></span><span class="ok" style="background:var(--local)"></span>Near parking</div>
      <div><span class="gicon g-gray"><i class="fa-solid fa-chair"></i></span><span class="ok" style="background:var(--amber)"></span>Few benches</div>
    </div>

    <div class="sec"><div class="h2">Before you go</div></div>
    <div class="img shade rounded-[22px] h-[170px]" style="background-image:url(img/boardwalk.jpg)">
      <div class="absolute inset-0 flex items-center justify-center" style="z-index:3"><div class="play"><i class="fa-solid fa-play"></i></div></div>
      <div class="absolute left-4 bottom-3.5 text-white font-bold text-[15px]">Ride the path with us</div><span class="dur">0:45</span>
    </div>

    <div class="card flex items-center gap-3.5 p-4 mt-4">
      <span class="gicon g-quest"><i class="fa-solid fa-puzzle-piece"></i></span>
      <div class="flex-1"><div class="font-bold text-[15px] tracking-tight">Count the keeper's steps</div><div class="text-[12.5px] text-slate-400 font-medium">Quest · +120 XP</div></div>
      <i class="fa-solid fa-chevron-right text-slate-300"></i>
    </div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 pad pb-9 pt-5 z-40 flex gap-3" style="background:linear-gradient(180deg,rgba(250,249,247,0),var(--bg) 35%)">
  <div class="btn ghost" style="width:58px;flex:none"><i class="fa-solid fa-diamond-turn-right"></i></div>
  <div class="btn flex-1"><i class="fa-solid fa-plus"></i>Add to route</div>
</div>
<div class="homebar"></div>
</div></body></html>
