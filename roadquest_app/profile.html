<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Me</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cover{height:210px;background-image:url(img/canyon.jpg);background-position:center 60%}
.cover:after{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 40%)}
.av{width:104px;height:104px;border-radius:34px;object-fit:cover;border:5px solid var(--bg);margin-top:-56px;position:relative;z-index:5}
.lvl{position:absolute;left:84px;top:30px;z-index:6;width:34px;height:34px;border-radius:12px;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
.stats div{text-align:center}
.stats div + div{border-left:1px solid var(--border)}
.stats b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px}
.stats span{font-size:12px;font-weight:600;color:var(--muted)}
.trip{width:210px;height:150px;flex:none;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.set{display:flex;align-items:center;gap:14px;padding:12px 0}
.set + .set{border-top:1px solid var(--border)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="cover img shade">
    <div class="sb light"><span class="t num">9:30</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
    <div class="pad flex justify-end mt-3"><div class="iconbtn glass"><i class="fa-solid fa-gear"></i></div></div>
  </div>
  <div class="pad relative">
    <img class="av" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=220&h=220&fit=crop">
    <span class="lvl g-sun num">12</span>
    <div class="flex items-end justify-between mt-3">
      <div><div class="text-[26px] font-extrabold tracking-tight">Dana Lee</div><div class="sub mt-0.5">Lee Crew · Portland</div></div>
      <div class="avs"><img src="https://images.unsplash.com/photo-1552058544-f2b08422138a?w=120&h=120&fit=crop"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=120&h=120&fit=crop"><span class="g-sun" style="color:#fff"><i class="fa-solid fa-baby"></i></span></div>
    </div>
    <div class="mt-4"><div class="flex justify-between text-[12.5px] font-bold"><span class="text-slate-500">Level 13</span><span class="num" style="color:var(--sun)">2,940 / 3,500 XP</span></div><div class="bar mt-2"><i style="width:84%"></i></div></div>

    <div class="stats card py-4">
      <div><b class="num">9</b><span>Trips</span></div>
      <div><b class="num">2.8k</b><span>Miles</span></div>
      <div><b class="num" style="color:var(--local)">31</b><span>Local stops</span></div>
    </div>

    <div class="sec"><div class="h2">Past trips</div><span class="act">All</span></div>
    <div class="hscroll">
      <div class="trip img shade" style="background-image:url(img/canyon.jpg)"><div class="text-white font-bold text-[15px]">Red Rock Loop</div><div class="text-white/75 text-[12px] font-semibold num">6 stops · 3 quests</div></div>
      <div class="trip img shade" style="background-image:url(img/overlook.jpg)"><div class="text-white font-bold text-[15px]">Cascade Weekend</div><div class="text-white/75 text-[12px] font-semibold num">4 stops · 2 quests</div></div>
    </div>

    <div class="card px-4 py-1 mt-5">
      <div class="set"><span class="gicon g-access" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-universal-access"></i></span><div class="flex-1 font-semibold text-[15px]">Access needs</div><span class="text-[13px] font-semibold text-slate-400">2 set</span><i class="fa-solid fa-chevron-right text-slate-300 text-sm"></i></div>
      <div class="set"><span class="gicon g-quest" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-puzzle-piece"></i></span><div class="flex-1 font-semibold text-[15px]">Quest difficulty</div><span class="text-[13px] font-semibold text-slate-400">Ages 3–14</span><i class="fa-solid fa-chevron-right text-slate-300 text-sm"></i></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-route"></i>Route</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-puzzle-piece"></i></div></div>
  <div class="tab"><i class="fa-solid fa-hand-holding-heart"></i>Impact</div>
  <div class="tab on"><i class="fa-solid fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
