<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Quest</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.top{height:360px;background-image:url(img/bridge.jpg)}
.top:after{background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,0) 30%,rgba(26,14,50,.85) 100%)}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
.m{display:flex;align-items:center;gap:14px;padding:13px 0;position:relative}
.m .gicon{width:48px;height:48px;border-radius:16px}
.m.done .gicon{background:var(--gradLocal)}
.m.lock{opacity:.45}
.now{border-radius:24px;padding:18px;background:linear-gradient(135deg,#F4EFFF,#FFF2EB);border:1px solid #E7DDFF;margin-top:6px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="top img shade">
    <div class="sb light"><span class="t num">2:16</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
    <div class="pad flex justify-between mt-3"><div class="iconbtn glass"><i class="fa-solid fa-chevron-left"></i></div><div class="iconbtn glass"><i class="fa-solid fa-trophy"></i></div></div>
    <div class="pad absolute bottom-7 left-0 right-0 flex items-end justify-between">
      <div class="text-white"><span class="pill glass"><i class="fa-solid fa-wand-magic-sparkles"></i>Made for Lily & Max</span><div class="text-[30px] font-extrabold tracking-tight leading-tight mt-3">Covered Bridge<br>Hunt</div></div>
      <div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="35" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle cx="42" cy="42" r="35" fill="none" stroke="#FFB547" stroke-width="8" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="88" transform="rotate(-90 42 42)"/></svg><b class="num">3/5</b></div>
    </div>
  </div>
  <div class="pad">
    <div class="now mt-5">
      <div class="flex items-center gap-2 text-[12px] font-bold tracking-wider" style="color:var(--quest)"><span class="live" style="background:var(--quest)"></span>YOU'RE HERE</div>
      <div class="text-[20px] font-extrabold tracking-tight mt-2">Find the year carved over the door</div>
      <div class="flex items-center gap-3 mt-4">
        <div class="btn flex-1" style="height:52px;background:var(--gradQuest);box-shadow:0 14px 26px -12px rgba(124,77,255,.7)"><i class="fa-solid fa-camera"></i>Snap it</div>
        <div class="btn ghost" style="height:52px;width:52px"><i class="fa-regular fa-lightbulb" style="color:var(--amber)"></i></div>
      </div>
    </div>

    <div class="sec"><div class="h2">Missions</div><span class="text-[14px] font-bold num" style="color:var(--quest)">360 / 600 XP</span></div>
    <div class="m done"><span class="gicon"><i class="fa-solid fa-check"></i></span><div class="flex-1"><div class="font-bold text-[15px]">Spot 3 red barns</div><div class="text-[12.5px] text-slate-400 font-medium">Road game</div></div><span class="text-[13px] font-bold text-slate-400 num">+100</span></div>
    <div class="m done"><span class="gicon"><i class="fa-solid fa-check"></i></span><div class="flex-1"><div class="font-bold text-[15px]">Keeper's 114 steps</div><div class="text-[12.5px] text-slate-400 font-medium">Cape Hollow Light</div></div><span class="text-[13px] font-bold text-slate-400 num">+120</span></div>
    <div class="m done"><span class="gicon"><i class="fa-solid fa-check"></i></span><div class="flex-1"><div class="font-bold text-[15px]">Ask Rosie her pie secret</div><div class="text-[12.5px] text-slate-400 font-medium">Rosie's Diner</div></div><span class="text-[13px] font-bold text-slate-400 num">+140</span></div>
    <div class="m lock"><span class="gicon g-gray"><i class="fa-solid fa-lock"></i></span><div class="flex-1"><div class="font-bold text-[15px]">Gold road quiz</div><div class="text-[12.5px] text-slate-400 font-medium">Pioneer Museum</div></div><span class="text-[13px] font-bold text-slate-400 num">+120</span></div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-route"></i>Route</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-puzzle-piece"></i></div></div>
  <div class="tab"><i class="fa-solid fa-hand-holding-heart"></i>Impact</div>
  <div class="tab"><i class="fa-regular fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
