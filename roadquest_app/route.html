<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Route</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.map{position:absolute;inset:0;bottom:auto;height:560px}
.pin{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(20,32,42,.3)}
.pin b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.sheet{position:absolute;left:0;right:0;bottom:0;top:470px;background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -12px 40px -10px rgba(20,32,42,.22);z-index:20;padding-top:12px}
.mix{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mix div{border-radius:16px;padding:11px 0 10px;text-align:center;background:var(--surface)}
.mix b{display:block;font-size:20px;font-weight:800;letter-spacing:-.6px}
.mix span{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.stop{display:flex;align-items:center;gap:13px;padding:11px 0}
.stop + .stop{border-top:1px solid var(--border)}
.stop .th{width:52px;height:52px;border-radius:15px;background-size:cover;background-position:center;flex:none}
</style></head>
<body><div class="screen">
<svg class="map" viewBox="0 0 436 560" preserveAspectRatio="xMidYMid slice">
  <rect width="436" height="560" fill="#EEF0E6"/>
  <path d="M0 0 H120 C100 80 140 140 110 210 C80 280 120 340 96 420 C80 480 100 530 90 560 H0Z" fill="#CFE6F2"/>
  <path d="M260 0 C300 90 250 160 330 220 C400 270 380 380 436 420 V0Z" fill="#E1EAD3"/>
  <path d="M170 300 C220 280 260 330 300 320 C340 310 360 360 340 410 C300 430 230 420 190 380 Z" fill="#DCE8CC"/>
  <path d="M10 0 L436 560" stroke="#fff" stroke-width="5" opacity=".7"/>
  <path d="M436 120 L150 560" stroke="#fff" stroke-width="4" opacity=".7"/>
  <path d="M180 0 C200 120 260 200 240 300 C230 360 280 430 260 560" stroke="#C8CDD3" stroke-width="7" fill="none" stroke-dasharray="1 0"/>
  <path d="M150 -10 C140 70 175 120 160 190 C148 245 190 270 210 320 C228 365 200 420 228 470 C240 500 236 540 232 570" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M150 -10 C140 70 175 120 160 190 C148 245 190 270 210 320 C228 365 200 420 228 470 C240 500 236 540 232 570" stroke="url(#rg)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M160 190 C130 200 112 214 104 232" stroke="#FF6B3D" stroke-width="4" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/>
  <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".5" stop-color="#FF6B3D"/><stop offset="1" stop-color="#E8457C"/></linearGradient></defs>
</svg>
<div class="pin" style="left:80px;top:212px;background-image:url(img/lighthouse.jpg)"><b class="g-sun">1</b></div>
<div class="pin" style="left:186px;top:296px;background-image:url(img/diner.jpg)"><b class="g-local">2</b></div>
<div class="pin" style="left:206px;top:404px;background-image:url(img/bridge.jpg)"><b class="g-quest">3</b></div>
<div class="absolute" style="left:146px;top:168px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(47,124,246,.18);display:flex;align-items:center;justify-content:center;z-index:5"><span style="width:14px;height:14px;border-radius:50%;background:var(--access)"></span></div>

<div class="relative z-10">
  <div class="sb"><span class="t num">10:31</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad flex gap-2.5 mt-3">
    <div class="flex-1 h-[50px] rounded-[17px] bg-white flex items-center gap-3 px-4 shadow-lg shadow-slate-900/10"><i class="fa-solid fa-magnifying-glass text-slate-400"></i><span class="text-[15px] font-medium text-slate-400">Ask: "quiet lunch, step-free"</span></div>
    <div class="iconbtn shadow-lg shadow-slate-900/10" style="height:50px;width:50px;border:0"><i class="fa-solid fa-microphone" style="color:var(--sun)"></i></div>
  </div>
  <div class="pad mt-3"><span class="pill bg-white shadow-md shadow-slate-900/10"><i class="fa-solid fa-clock" style="color:var(--local)"></i>Arrive 6:40 PM · 20 min spare</span></div>
</div>

<div class="sheet">
  <div class="w-10 h-1.5 rounded-full bg-slate-200 mx-auto"></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-4">
      <div class="h2">Today's mix</div>
      <span class="pill" style="background:#FFF1EA;color:var(--sun)"><i class="fa-solid fa-sliders"></i>Tune</span>
    </div>
    <div class="mix mt-3.5">
      <div><b class="num" style="color:var(--sun)">+38<small class="text-[11px]">m</small></b><span>DETOUR</span></div>
      <div><b class="num" style="color:var(--quest)">92</b><span>FUN</span></div>
      <div><b class="num" style="color:var(--access)">100<small class="text-[11px]">%</small></b><span>ACCESS</span></div>
      <div><b class="num" style="color:var(--local)">3</b><span>LOCAL</span></div>
    </div>
    <div class="mt-3">
      <div class="stop"><div class="th" style="background-image:url(img/lighthouse.jpg)"></div><div class="flex-1"><div class="font-bold text-[15px] tracking-tight">Cape Hollow Light</div><div class="text-[12.5px] text-slate-400 font-medium mt-0.5 num">11:05 · 40 min</div></div><span class="dot" style="background:var(--access)"></span><span class="dot" style="background:var(--quest)"></span></div>
      <div class="stop"><div class="th" style="background-image:url(img/diner.jpg)"></div><div class="flex-1"><div class="font-bold text-[15px] tracking-tight">Rosie's Diner</div><div class="text-[12.5px] text-slate-400 font-medium mt-0.5 num">12:30 · 1 h</div></div><span class="dot" style="background:var(--access)"></span><span class="dot" style="background:var(--local)"></span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab on"><i class="fa-solid fa-route"></i>Route</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-puzzle-piece"></i></div></div>
  <div class="tab"><i class="fa-solid fa-hand-holding-heart"></i>Impact</div>
  <div class="tab"><i class="fa-regular fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
