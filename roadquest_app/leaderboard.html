<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadQuest · Leaderboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.seg{display:flex;background:var(--surface);border-radius:15px;padding:4px}
.seg div{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,32,42,.08)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:26px}
.pd{width:118px;display:flex;flex-direction:column;align-items:center}
.pd img{border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 20px -6px rgba(20,32,42,.35)}
.pd .crown{color:var(--amber);font-size:22px;margin-bottom:4px}
.pd .blk{width:100%;margin-top:12px;border-radius:20px 20px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;color:#fff}
.pd .blk b{font-size:28px;font-weight:900;line-height:1}
.pd .blk span{font-size:12px;font-weight:700;opacity:.85;margin-top:4px}
.row{display:flex;align-items:center;gap:13px;padding:12px 0}
.row + .row{border-top:1px solid var(--border)}
.row img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.me{background:linear-gradient(90deg,#FFF1EA,#FFF7F2);border:1px solid #FFD9C7;border-radius:20px;padding:12px 14px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">7:02</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3"><div class="h1">Leaderboard</div><div class="iconbtn"><i class="fa-solid fa-user-group"></i></div></div>
    <div class="seg mt-5"><div class="on">This week</div><div>Highway 101</div><div>Friends</div></div>

    <div class="podium">
      <div class="pd"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=160&h=160&fit=crop" style="width:64px;height:64px"><div class="font-bold text-[14px] mt-2">Okafors</div><div class="blk" style="height:96px;background:linear-gradient(180deg,#B8C2CC,#8C98A4)"><b>2</b><span class="num">4,180</span></div></div>
      <div class="pd"><div class="crown"><i class="fa-solid fa-crown"></i></div><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=160&h=160&fit=crop" style="width:80px;height:80px"><div class="font-bold text-[14px] mt-2">Team Reyes</div><div class="blk" style="height:128px;background:var(--grad)"><b>1</b><span class="num">5,020</span></div></div>
      <div class="pd"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=160&h=160&fit=crop" style="width:64px;height:64px"><div class="font-bold text-[14px] mt-2">Park Fam</div><div class="blk" style="height:76px;background:linear-gradient(180deg,#E3A877,#C47A45)"><b>3</b><span class="num">3,760</span></div></div>
    </div>

    <div class="me flex items-center gap-3 mt-6">
      <span class="text-[15px] font-extrabold w-6 text-center num" style="color:var(--sun)">7</span>
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><div class="font-bold text-[15px]">You · Lee Crew</div><div class="text-[12.5px] font-semibold text-slate-500"><i class="fa-solid fa-arrow-trend-up" style="color:var(--local)"></i> up 4 today</div></div>
      <div class="text-[20px] font-extrabold tracking-tight num">2,940</div>
    </div>

    <div class="mt-3">
      <div class="row"><span class="text-[14px] font-bold text-slate-400 w-6 text-center num">4</span><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&h=120&fit=crop"><div class="flex-1 font-bold text-[15px]">Grandma June</div><span class="font-bold text-[15px] num">3,510</span></div>
      <div class="row"><span class="text-[14px] font-bold text-slate-400 w-6 text-center num">5</span><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop"><div class="flex-1 font-bold text-[15px]">The Nguyens</div><span class="font-bold text-[15px] num">3,300</span></div>
      <div class="row"><span class="text-[14px] font-bold text-slate-400 w-6 text-center num">6</span><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=120&h=120&fit=crop"><div class="flex-1 font-bold text-[15px]">Road Owls</div><span class="font-bold text-[15px] num">3,060</span></div>
    </div>

    <div class="sec"><div class="h2">Badges this trip</div><span class="act">All 24</span></div>
    <div class="flex gap-3">
      <span class="gicon g-sun" style="width:62px;height:62px;border-radius:20px;font-size:24px"><i class="fa-solid fa-tower-observation"></i></span>
      <span class="gicon g-quest" style="width:62px;height:62px;border-radius:20px;font-size:24px"><i class="fa-solid fa-landmark"></i></span>
      <span class="gicon g-local" style="width:62px;height:62px;border-radius:20px;font-size:24px"><i class="fa-solid fa-store"></i></span>
      <span class="gicon g-access" style="width:62px;height:62px;border-radius:20px;font-size:24px"><i class="fa-solid fa-universal-access"></i></span>
      <span class="gicon g-gray" style="width:62px;height:62px;border-radius:20px;font-size:24px"><i class="fa-solid fa-lock"></i></span>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-route"></i>Route</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-puzzle-piece"></i></div></div>
  <div class="tab"><i class="fa-solid fa-hand-holding-heart"></i>Impact</div>
  <div class="tab"><i class="fa-regular fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
