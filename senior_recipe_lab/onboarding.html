<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Recipe Lab - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #fff; }
        .condition-card { transition: all 0.2s ease; }
        .condition-card.selected { border-color: #10b981; background: #ecfdf5; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2 bg-white">
        <span class="text-sm font-semibold">9:41</span>
        <div class="w-[125px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px;" class="pb-8">
        <!-- Progress -->
        <div class="flex gap-2 mt-4 mb-6">
            <div class="h-1 flex-1 bg-emerald-500 rounded-full"></div>
            <div class="h-1 flex-1 bg-emerald-500 rounded-full"></div>
            <div class="h-1 flex-1 bg-gray-200 rounded-full"></div>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Health Profile</h1>
        <p class="text-sm text-gray-500 mb-6">Select conditions that apply to personalize recipe modifications.</p>

        <!-- Condition Cards Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="condition-card selected border-2 border-emerald-400 rounded-2xl p-4 bg-emerald-50">
                <div class="w-10 h-10 bg-gradient-to-br from-red-400 to-pink-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-droplet text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Diabetes</span>
                <div class="mt-2">
                    <i class="fas fa-check-circle text-emerald-500 text-lg"></i>
                </div>
            </div>

            <div class="condition-card selected border-2 border-emerald-400 rounded-2xl p-4 bg-emerald-50">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-indigo-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-heart-pulse text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Hypertension</span>
                <div class="mt-2">
                    <i class="fas fa-check-circle text-emerald-500 text-lg"></i>
                </div>
            </div>

            <div class="condition-card border-2 border-gray-200 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-vial text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">High Cholesterol</span>
                <div class="mt-2">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                </div>
            </div>

            <div class="condition-card selected border-2 border-emerald-400 rounded-2xl p-4 bg-emerald-50">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-400 to-violet-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-tooth text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Dental Issues</span>
                <div class="mt-2">
                    <i class="fas fa-check-circle text-emerald-500 text-lg"></i>
                </div>
            </div>

            <div class="condition-card border-2 border-gray-200 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-utensils text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Swallowing Difficulty</span>
                <div class="mt-2">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                </div>
            </div>

            <div class="condition-card border-2 border-gray-200 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-emerald-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-dumbbell text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Low Protein</span>
                <div class="mt-2">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                </div>
            </div>

            <div class="condition-card border-2 border-gray-200 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gradient-to-br from-rose-400 to-red-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-kidney text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Kidney Concern</span>
                <div class="mt-2">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                </div>
            </div>

            <div class="condition-card border-2 border-gray-200 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-wallet text-white text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-900">Budget Limited</span>
                <div class="mt-2">
                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Continue Button -->
        <button class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold py-4 rounded-2xl text-base">
            Continue <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>
</body>
</html>
