<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Recipe Lab - Fridge Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #fff; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2">
        <span class="text-sm font-semibold">9:41</span>
        <div class="w-[125px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px;" class="pb-8 pt-3">
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
            <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600"></i>
            </button>
            <h2 class="text-lg font-bold text-gray-900">Fridge Scan</h2>
            <div class="w-10"></div>
        </div>

        <!-- Camera View Simulation -->
        <div class="relative rounded-3xl overflow-hidden h-[260px] mb-5">
            <img src="https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=500&h=400&fit=crop" class="w-full h-full object-cover" alt="fridge contents">
            <!-- Scan overlay -->
            <div class="absolute inset-0 border-4 border-emerald-400/60 rounded-3xl"></div>
            <!-- Corner brackets -->
            <div class="absolute top-3 left-3 w-8 h-8 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
            <div class="absolute top-3 right-3 w-8 h-8 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
            <div class="absolute bottom-3 left-3 w-8 h-8 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
            <div class="absolute bottom-3 right-3 w-8 h-8 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>
            <!-- AI scanning indicator -->
            <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-sm text-white text-xs font-medium px-4 py-2 rounded-full flex items-center gap-2">
                <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                AI detecting ingredients...
            </div>
            <!-- Detected item tags -->
            <div class="absolute bottom-4 left-4 right-4 flex flex-wrap gap-1.5">
                <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Eggs ✓</span>
                <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Spinach ✓</span>
                <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Greek Yogurt ✓</span>
                <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Carrots ✓</span>
                <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Oat Milk ✓</span>
                <span class="text-[10px] bg-emerald-500/70 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">Mushrooms ✓</span>
            </div>
        </div>

        <!-- Detected Ingredients -->
        <div class="flex items-center justify-between mb-3">
            <h4 class="text-sm font-bold text-gray-900">Detected Ingredients</h4>
            <span class="text-xs text-emerald-600 font-medium">8 items found</span>
        </div>

        <div class="flex flex-wrap gap-2 mb-5">
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🥚</span>
                <span class="text-xs font-medium text-gray-700">Eggs</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🥬</span>
                <span class="text-xs font-medium text-gray-700">Spinach</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🥛</span>
                <span class="text-xs font-medium text-gray-700">Greek Yogurt</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🥕</span>
                <span class="text-xs font-medium text-gray-700">Carrots</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🍄</span>
                <span class="text-xs font-medium text-gray-700">Mushrooms</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
            <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                <span class="text-base">🥜</span>
                <span class="text-xs font-medium text-gray-700">Almonds</span>
                <div class="w-4 h-4 bg-emerald-100 rounded-full flex items-center justify-center ml-1">
                    <i class="fas fa-check text-emerald-600 text-[7px]"></i>
                </div>
            </div>
        </div>

        <!-- Health Filter -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-2xl p-3.5 mb-5">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-shield-heart text-blue-500 text-sm"></i>
                <span class="text-xs font-bold text-gray-800">Your Health Filters Active</span>
            </div>
            <div class="flex flex-wrap gap-1.5">
                <span class="text-[10px] bg-white text-red-600 px-2 py-0.5 rounded-full border border-red-100">Low Sugar (C₆ &lt;25g)</span>
                <span class="text-[10px] bg-white text-blue-600 px-2 py-0.5 rounded-full border border-blue-100">Low Na⁺ (&lt;400mg)</span>
                <span class="text-[10px] bg-white text-purple-600 px-2 py-0.5 rounded-full border border-purple-100">Soft Texture</span>
            </div>
        </div>

        <!-- Generate Button -->
        <button class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold py-4 rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 relative overflow-hidden">
            <svg class="absolute left-4 w-8 h-8 opacity-20" viewBox="0 0 40 40">
                <circle cx="12" cy="20" r="5" fill="white"/>
                <circle cx="28" cy="14" r="4" fill="white"/>
                <circle cx="30" cy="30" r="3" fill="white"/>
                <line x1="12" y1="20" x2="28" y2="14" stroke="white" stroke-width="1.5"/>
                <line x1="28" y1="14" x2="30" y2="30" stroke="white" stroke-width="1.5"/>
            </svg>
            <i class="fas fa-wand-magic-sparkles"></i> Generate Healthy Recipes
        </button>
    </div>
</body>
</html>
