<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Recipe Lab - Scan Recipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #fff; }
        .scan-border {
            background: conic-gradient(from 0deg, #10b981, #06b6d4, #8b5cf6, #10b981);
            padding: 3px;
            border-radius: 24px;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2">
        <span class="text-sm font-semibold">9:41</span>
        <div class="w-[125px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px;" class="pb-8">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-5">
            <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600"></i>
            </button>
            <h2 class="text-lg font-bold text-gray-900">Input Recipe</h2>
            <div class="w-10"></div>
        </div>

        <!-- Scan Zone - Big visual area -->
        <div class="scan-border mb-5">
            <div class="bg-white rounded-[21px] p-6 text-center relative overflow-hidden">
                <!-- Background molecules -->
                <svg class="absolute inset-0 w-full h-full opacity-[0.04]" viewBox="0 0 300 200">
                    <circle cx="50" cy="40" r="8" fill="#10b981"/>
                    <circle cx="100" cy="30" r="5" fill="#10b981"/>
                    <circle cx="80" cy="80" r="10" fill="#10b981"/>
                    <circle cx="200" cy="50" r="7" fill="#10b981"/>
                    <circle cx="250" cy="100" r="12" fill="#10b981"/>
                    <circle cx="150" cy="150" r="6" fill="#10b981"/>
                    <line x1="50" y1="40" x2="100" y2="30" stroke="#10b981" stroke-width="2"/>
                    <line x1="50" y1="40" x2="80" y2="80" stroke="#10b981" stroke-width="2"/>
                    <line x1="200" y1="50" x2="250" y2="100" stroke="#10b981" stroke-width="2"/>
                </svg>
                <div class="relative">
                    <div class="w-20 h-20 bg-gradient-to-br from-emerald-100 to-teal-100 rounded-3xl flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera text-emerald-600 text-2xl"></i>
                    </div>
                    <p class="text-sm font-semibold text-gray-900 mb-1">Scan a Recipe</p>
                    <p class="text-xs text-gray-500">Take a photo of any cookbook page or recipe card</p>
                </div>
            </div>
        </div>

        <!-- Other Input Methods -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-4 text-center relative overflow-hidden">
                <svg class="absolute top-0 right-0 w-16 h-16 opacity-10" viewBox="0 0 60 60">
                    <circle cx="30" cy="30" r="15" fill="white"/>
                    <circle cx="45" cy="15" r="8" fill="white"/>
                    <line x1="30" y1="30" x2="45" y2="15" stroke="white" stroke-width="2"/>
                </svg>
                <div class="w-11 h-11 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-link text-white text-base"></i>
                </div>
                <p class="text-white font-semibold text-xs">Paste URL</p>
            </div>
            <div class="bg-gradient-to-br from-purple-500 to-violet-600 rounded-2xl p-4 text-center relative overflow-hidden">
                <svg class="absolute top-0 right-0 w-16 h-16 opacity-10" viewBox="0 0 60 60">
                    <circle cx="20" cy="40" r="10" fill="white"/>
                    <circle cx="45" cy="25" r="7" fill="white"/>
                    <line x1="20" y1="40" x2="45" y2="25" stroke="white" stroke-width="2"/>
                </svg>
                <div class="w-11 h-11 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-microphone text-white text-base"></i>
                </div>
                <p class="text-white font-semibold text-xs">Voice Input</p>
            </div>
        </div>

        <!-- Or Divider -->
        <div class="flex items-center gap-3 mb-4">
            <div class="h-px flex-1 bg-gray-200"></div>
            <span class="text-[10px] text-gray-400 uppercase tracking-wider">or type ingredients</span>
            <div class="h-px flex-1 bg-gray-200"></div>
        </div>

        <!-- Recipe Input -->
        <div class="mb-4">
            <input type="text" placeholder="Recipe name..." class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400 bg-gray-50" value="Grandma's Chocolate Chip Cookies">
        </div>

        <div class="mb-4">
            <div class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 min-h-[100px]">
                <p class="text-gray-700 text-xs leading-relaxed">1 cup butter, softened<br>¾ cup white sugar<br>¾ cup brown sugar<br>2 large eggs<br>2¼ cups all-purpose flour<br>1 tsp baking soda<br>1 tsp salt...</p>
            </div>
        </div>

        <!-- Analyze Button with molecule -->
        <button class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold py-4 rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 relative overflow-hidden">
            <svg class="absolute left-4 w-8 h-8 opacity-20" viewBox="0 0 40 40">
                <circle cx="12" cy="20" r="5" fill="white"/>
                <circle cx="28" cy="14" r="4" fill="white"/>
                <circle cx="30" cy="30" r="3" fill="white"/>
                <line x1="12" y1="20" x2="28" y2="14" stroke="white" stroke-width="1.5"/>
                <line x1="28" y1="14" x2="30" y2="30" stroke="white" stroke-width="1.5"/>
            </svg>
            <i class="fas fa-atom"></i> Analyze Chemistry
        </button>
    </div>
</body>
</html>
