<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Recipe Lab - Scan Recipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #fff; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2">
        <span class="text-sm font-semibold">9:41</span>
        <div class="w-[125px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px;" class="pb-8">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-6">
            <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600"></i>
            </button>
            <h2 class="text-lg font-bold text-gray-900">Input Recipe</h2>
            <div class="w-10"></div>
        </div>

        <!-- Input Methods -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-5 text-center">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-camera text-white text-xl"></i>
                </div>
                <p class="text-white font-semibold text-sm">Scan Photo</p>
                <p class="text-white/70 text-xs mt-1">From cookbook</p>
            </div>
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-5 text-center">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-link text-white text-xl"></i>
                </div>
                <p class="text-white font-semibold text-sm">Paste URL</p>
                <p class="text-white/70 text-xs mt-1">From website</p>
            </div>
        </div>

        <!-- Or Divider -->
        <div class="flex items-center gap-3 mb-5">
            <div class="h-px flex-1 bg-gray-200"></div>
            <span class="text-xs text-gray-400">or type it in</span>
            <div class="h-px flex-1 bg-gray-200"></div>
        </div>

        <!-- Recipe Input -->
        <div class="mb-4">
            <label class="text-sm font-semibold text-gray-700 mb-2 block">Recipe Name</label>
            <input type="text" placeholder="e.g., Classic Banana Bread" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400" value="Grandma's Chocolate Chip Cookies">
        </div>

        <div class="mb-4">
            <label class="text-sm font-semibold text-gray-700 mb-2 block">Ingredients</label>
            <div class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 min-h-[120px]">
                <p class="text-gray-700">1 cup butter, softened</p>
                <p class="text-gray-700">¾ cup white sugar</p>
                <p class="text-gray-700">¾ cup brown sugar</p>
                <p class="text-gray-700">2 large eggs</p>
                <p class="text-gray-700">2¼ cups all-purpose flour</p>
                <p class="text-gray-700">1 tsp baking soda</p>
                <p class="text-gray-700">1 tsp salt</p>
                <p class="text-gray-400">...</p>
            </div>
        </div>

        <!-- Analyze Button -->
        <button class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold py-4 rounded-2xl text-base flex items-center justify-center gap-2 mt-4">
            <i class="fas fa-flask"></i> Analyze & Modify
        </button>

        <p class="text-center text-xs text-gray-400 mt-3">AI-powered food chemistry analysis</p>
    </div>
</body>
</html>
