<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Compass — Welcome</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
html,body{height:100%;}
body{font-family:'Inter',-apple-system,sans-serif;background:#0E1229;color:#171A2B;width:100%;overflow:hidden;scrollbar-width:none;}
.fd{font-family:'Plus Jakarta Sans',sans-serif;}
</style>
</head>
<body>

<div style="position:relative;width:100%;height:100%;">

  <!-- Hero photo -->
  <div style="position:absolute;top:0;left:0;right:0;height:560px;overflow:hidden;">
    <img src="https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=900&q=85" style="width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,41,0.15) 0%,rgba(14,18,41,0.25) 45%,rgba(14,18,41,0.98) 92%);"></div>
  </div>

  <!-- Status bar -->
  <div style="position:relative;height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;z-index:30;">
    <span style="font-size:15px;font-weight:600;color:#fff;">9:41</span>
    <div style="width:126px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px;"></div>
    <div style="display:flex;gap:6px;align-items:center;color:#fff;"><i class="fas fa-signal" style="font-size:13px;"></i><i class="fas fa-wifi" style="font-size:14px;"></i><i class="fas fa-battery-full" style="font-size:15px;"></i></div>
  </div>

  <!-- Brand mark over photo -->
  <div style="position:relative;padding:28px 28px 0;display:flex;align-items:center;justify-content:space-between;z-index:5;">
    <div style="display:flex;align-items:center;gap:9px;">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4F46E5,#14B8A6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(79,70,229,0.4);"><i class="fas fa-compass" style="font-size:15px;color:#fff;"></i></div>
      <span class="fd" style="font-size:17px;font-weight:800;color:#fff;letter-spacing:-0.3px;">Compass</span>
    </div>
    <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.75);">Log in</span>
  </div>

  <!-- Content sheet -->
  <div style="position:absolute;bottom:0;left:0;right:0;padding:0 28px 42px;z-index:10;">
    <div style="font-size:11px;font-weight:800;letter-spacing:1.6px;color:#8FE9D9;margin-bottom:10px;">NEW AT LINCOLN HIGH?</div>
    <h1 class="fd" style="font-size:34px;font-weight:800;color:#fff;letter-spacing:-0.9px;line-height:1.08;margin-bottom:12px;">You've got this.</h1>
    <p style="font-size:14.5px;color:rgba(255,255,255,0.72);line-height:1.55;max-width:340px;margin-bottom:22px;">Compass helps you settle into a new school in your first 30 days — courses, campus norms, and people, in one place.</p>

    <div style="display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap;">
      <div style="padding:9px 14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.14);border-radius:20px;display:flex;align-items:center;gap:7px;"><i class="fas fa-route" style="font-size:11px;color:#8B93FF;"></i><span style="font-size:12px;font-weight:600;color:#fff;">Pathway</span></div>
      <div style="padding:9px 14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.14);border-radius:20px;display:flex;align-items:center;gap:7px;"><i class="fas fa-map-location-dot" style="font-size:11px;color:#5EEAD4;"></i><span style="font-size:12px;font-weight:600;color:#fff;">Campus Guide</span></div>
      <div style="padding:9px 14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.14);border-radius:20px;display:flex;align-items:center;gap:7px;"><i class="fas fa-user-group" style="font-size:11px;color:#FFB870;"></i><span style="font-size:12px;font-weight:600;color:#fff;">Buddy Match</span></div>
    </div>

    <button style="width:100%;height:56px;border:none;border-radius:18px;background:linear-gradient(135deg,#4F46E5,#4338CA);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 34px rgba(79,70,229,0.45);margin-bottom:16px;">
      <span style="font-size:15.5px;font-weight:700;color:#fff;">Get Started</span>
      <i class="fas fa-arrow-right" style="font-size:14px;color:#fff;"></i>
    </button>

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <div style="display:flex;">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=60&h=60&fit=crop&crop=faces" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #0E1229;margin-right:-8px;">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=60&h=60&fit=crop&crop=faces" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #0E1229;margin-right:-8px;">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=60&h=60&fit=crop&crop=faces" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #0E1229;">
      </div>
      <span style="font-size:12px;color:rgba(255,255,255,0.6);">12,400 students already found their way</span>
    </div>
  </div>

</div>

</body>
</html>
