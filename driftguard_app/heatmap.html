<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriftGuard - Heatmap</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#F0F2FF;width:100%;height:100vh;overflow:hidden;position:relative}
  .content{position:absolute;top:0;left:0;right:0;bottom:88px;overflow-y:auto;overflow-x:hidden}
  .status-bar{height:59px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;position:relative}
  .dynamic-island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
  .tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.06);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#94A3B8;font-size:10px;font-weight:500}
  .tab-item i{font-size:22px}.tab-item.active{color:#6366F1}
  .sp{padding:0 28px}
  .period-btn{padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all 0.2s}
  .period-btn.active{background:#6366F1;color:#fff}
  .period-btn:not(.active){background:transparent;color:#94A3B8}
</style>
</head>
<body>
<div class="content">
  <div class="status-bar">
    <span style="font-size:16px;font-weight:600;letter-spacing:-0.3px">9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:5px;align-items:center">
      <i class="fas fa-signal" style="font-size:13px"></i>
      <i class="fas fa-wifi" style="font-size:14px"></i>
      <i class="fas fa-battery-full" style="font-size:15px"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="sp" style="padding-top:6px;padding-bottom:18px">
    <h1 style="font-size:28px;font-weight:800;color:#0F172A;letter-spacing:-0.8px">Habit Heatmap</h1>
    <p style="font-size:13px;color:#94A3B8;font-weight:500;margin-top:2px">Visualize your behavior patterns</p>
  </div>

  <!-- Period Selector -->
  <div class="sp" style="padding-bottom:18px">
    <div style="background:#fff;border-radius:14px;padding:4px;display:flex;box-shadow:0 2px 12px rgba(99,102,241,0.05)">
      <button class="period-btn active" style="flex:1">Day</button>
      <button class="period-btn" style="flex:1">Week</button>
      <button class="period-btn" style="flex:1">Month</button>
    </div>
  </div>

  <!-- Heatmap Grid -->
  <div class="sp" style="padding-bottom:22px">
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:0 2px 16px rgba(99,102,241,0.06)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:15px;font-weight:700;color:#0F172A">February 2026</span>
        <div style="display:flex;gap:8px">
          <i class="fas fa-chevron-left" style="color:#94A3B8;font-size:14px;cursor:pointer"></i>
          <i class="fas fa-chevron-right" style="color:#6366F1;font-size:14px;cursor:pointer"></i>
        </div>
      </div>

      <!-- Time labels + grid -->
      <div style="display:flex;gap:8px">
        <div style="display:flex;flex-direction:column;gap:4px;justify-content:space-between;padding:2px 0">
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">12a</span>
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">4a</span>
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">8a</span>
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">12p</span>
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">4p</span>
          <span style="font-size:9px;color:#94A3B8;height:20px;display:flex;align-items:center">8p</span>
        </div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,20px);gap:4px">
          <!-- Week 1 data (Mon-Sun x 6 time blocks) -->
          <div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#C7D2FE"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#C7D2FE"></div><div style="border-radius:4px;background:#E8EBF7"></div>
          <div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div><div style="border-radius:4px;background:#E8EBF7"></div>
          <div style="border-radius:4px;background:#C7D2FE"></div><div style="border-radius:4px;background:#A5B4FC"></div><div style="border-radius:4px;background:#818CF8"></div><div style="border-radius:4px;background:#A5B4FC"></div><div style="border-radius:4px;background:#C7D2FE"></div><div style="border-radius:4px;background:#A5B4FC"></div><div style="border-radius:4px;background:#818CF8"></div>
          <div style="border-radius:4px;background:#A5B4FC"></div><div style="border-radius:4px;background:#818CF8"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#818CF8"></div><div style="border-radius:4px;background:#A5B4FC"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#818CF8"></div>
          <div style="border-radius:4px;background:#818CF8"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#4338CA"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#818CF8"></div><div style="border-radius:4px;background:#4338CA"></div><div style="border-radius:4px;background:#6366F1"></div>
          <div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#4338CA"></div><div style="border-radius:4px;background:#4338CA"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#4338CA"></div><div style="border-radius:4px;background:#6366F1"></div><div style="border-radius:4px;background:#4338CA"></div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-around;margin-top:8px;margin-left:30px">
        <span style="font-size:10px;color:#94A3B8;font-weight:500">M</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">T</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">W</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">T</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">F</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">S</span>
        <span style="font-size:10px;color:#94A3B8;font-weight:500">S</span>
      </div>

      <div style="display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:flex-end">
        <span style="font-size:9px;color:#94A3B8">Low</span>
        <div style="width:14px;height:14px;border-radius:3px;background:#E8EBF7"></div>
        <div style="width:14px;height:14px;border-radius:3px;background:#C7D2FE"></div>
        <div style="width:14px;height:14px;border-radius:3px;background:#A5B4FC"></div>
        <div style="width:14px;height:14px;border-radius:3px;background:#6366F1"></div>
        <div style="width:14px;height:14px;border-radius:3px;background:#4338CA"></div>
        <span style="font-size:9px;color:#94A3B8">High</span>
      </div>
    </div>
  </div>

  <!-- Top Triggers -->
  <div class="sp" style="padding-bottom:22px">
    <h2 style="font-size:18px;font-weight:700;color:#0F172A;margin-bottom:12px">Top Triggers</h2>

    <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(99,102,241,0.05);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="fas fa-calculator" style="color:#D97706;font-size:15px"></i>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:14px;font-weight:600;color:#0F172A">Math Homework</span>
            <span style="font-size:13px;font-weight:700;color:#4338CA">42%</span>
          </div>
        </div>
      </div>
      <div style="height:6px;background:#E8EBF7;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:42%;background:linear-gradient(90deg,#6366F1,#4338CA);border-radius:3px"></div>
      </div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(99,102,241,0.05);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#DBEAFE,#BFDBFE);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="fas fa-moon" style="color:#3B82F6;font-size:15px"></i>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:14px;font-weight:600;color:#0F172A">Late-Night Study</span>
            <span style="font-size:13px;font-weight:700;color:#4338CA">31%</span>
          </div>
        </div>
      </div>
      <div style="height:6px;background:#E8EBF7;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:31%;background:linear-gradient(90deg,#6366F1,#4338CA);border-radius:3px"></div>
      </div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(99,102,241,0.05)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FCE7F3,#FBCFE8);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="fas fa-video" style="color:#EC4899;font-size:15px"></i>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:14px;font-weight:600;color:#0F172A">Screen Time</span>
            <span style="font-size:13px;font-weight:700;color:#4338CA">18%</span>
          </div>
        </div>
      </div>
      <div style="height:6px;background:#E8EBF7;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:18%;background:linear-gradient(90deg,#6366F1,#4338CA);border-radius:3px"></div>
      </div>
    </div>
  </div>

  <!-- Peak Times -->
  <div class="sp" style="padding-bottom:30px">
    <h2 style="font-size:18px;font-weight:700;color:#0F172A;margin-bottom:12px">Peak Times</h2>
    <div style="display:flex;gap:10px;overflow-x:auto">
      <div style="background:linear-gradient(135deg,#4338CA,#6366F1);border-radius:16px;padding:16px 20px;color:#fff;min-width:120px;text-align:center">
        <i class="fas fa-moon" style="font-size:20px;margin-bottom:8px;opacity:0.8"></i>
        <p style="font-size:18px;font-weight:800">10 PM</p>
        <p style="font-size:11px;opacity:0.7;margin-top:2px">Highest</p>
      </div>
      <div style="background:linear-gradient(135deg,#6366F1,#818CF8);border-radius:16px;padding:16px 20px;color:#fff;min-width:120px;text-align:center">
        <i class="fas fa-cloud-moon" style="font-size:20px;margin-bottom:8px;opacity:0.8"></i>
        <p style="font-size:18px;font-weight:800">11 PM</p>
        <p style="font-size:11px;opacity:0.7;margin-top:2px">2nd Peak</p>
      </div>
      <div style="background:linear-gradient(135deg,#818CF8,#A5B4FC);border-radius:16px;padding:16px 20px;color:#fff;min-width:120px;text-align:center">
        <i class="fas fa-sun" style="font-size:20px;margin-bottom:8px;opacity:0.8"></i>
        <p style="font-size:18px;font-weight:800">3 PM</p>
        <p style="font-size:11px;opacity:0.7;margin-top:2px">3rd Peak</p>
      </div>
    </div>
  </div>
</div>

<div class="tab-bar">
  <a class="tab-item"><i class="fas fa-house"></i><span>Home</span></a>
  <a class="tab-item active"><i class="fas fa-chart-simple"></i><span>Heatmap</span></a>
  <a class="tab-item"><i class="fas fa-brain"></i><span>Calibrate</span></a>
  <a class="tab-item"><i class="fas fa-shield-halved"></i><span>Train</span></a>
  <a class="tab-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>
</body>
</html>
