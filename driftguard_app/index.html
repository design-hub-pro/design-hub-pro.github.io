<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriftGuard - Behavioral Analytics Suite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#ffffff;min-height:100vh}

  .phone-frame{
    width:460px;height:980px;border-radius:62px;
    background:#000;padding:12px;
    box-shadow:0 25px 60px rgba(0,0,0,0.12),0 8px 20px rgba(0,0,0,0.08);
    flex-shrink:0;
  }
  .phone-screen{
    width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F0F2FF;
  }
  .phone-screen iframe{
    width:100%;height:100%;border:none;border-radius:52px;
  }
  .screen-label{
    text-align:center;margin-top:16px;font-size:15px;font-weight:600;color:#64748B;letter-spacing:-0.2px;
  }
</style>
</head>
<body>

<!-- Header -->
<div style="text-align:center;padding:60px 40px 20px">
  <div style="display:inline-flex;align-items:center;gap:14px;margin-bottom:16px">
    <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6366F1,#4338CA);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(99,102,241,0.3)">
      <i class="fas fa-shield-halved" style="color:#fff;font-size:26px"></i>
    </div>
    <h1 style="font-size:42px;font-weight:900;letter-spacing:-1.5px;color:#0F172A">DriftGuard</h1>
  </div>
  <p style="font-size:18px;color:#64748B;font-weight:500;max-width:700px;margin:0 auto;line-height:1.6">Behavioral Analytics Suite — Wristband companion app for habit tracking, neural gesture calibration, gamified focus streaks, and fencing performance analytics</p>
</div>

<!-- Screenshots Grid -->
<div style="max-width:1600px;margin:0 auto;padding:40px 40px 80px">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px;justify-items:center">

    <!-- Screen 1: Home -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="home.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Home Dashboard</p>
    </div>

    <!-- Screen 2: Heatmap -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="heatmap.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Habit Heatmap</p>
    </div>

    <!-- Screen 3: Calibration -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="calibration.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Neural Calibration</p>
    </div>

    <!-- Screen 4: Streaks -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="streaks.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Focus Streaks</p>
    </div>

    <!-- Screen 5: Performance -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="performance.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Performance Mode</p>
    </div>

    <!-- Screen 6: Reports -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="reports.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Clinician Export</p>
    </div>

    <!-- Screen 7: Profile -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="profile.html" scrolling="no"></iframe>
        </div>
      </div>
      <p class="screen-label">Profile & Settings</p>
    </div>

  </div>
</div>

</body>
</html>
