<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Ride summary</title></head><body>
<div class="screen"><div class="scroll">
  <div class="relative h-[360px]">
    <img src="assets/river.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="px-c pt-2 flex items-center justify-between text-white">
      <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
      <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
    </div>
    <div class="absolute bottom-5 left-[28px] right-[28px] text-white">
      <p class="text-white/70 text-[13px] font-semibold"><i class="fa-solid fa-flag-checkered mr-1"></i>Ride finished · Today 8:34 AM</p>
      <h1 class="font-display font-extrabold text-[34px] leading-tight">River loop commute</h1>
    </div>
  </div>

  <!-- Safety score -->
  <div class="mx-[28px] -mt-7 card p-5 relative flex items-center gap-5">
    <svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" stroke="#EEF0F3" stroke-width="10" fill="none"/><circle cx="52" cy="52" r="44" stroke="url(#g)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="39" transform="rotate(-90 52 52)"/><defs><linearGradient id="g"><stop offset="0" stop-color="#34C38F"/><stop offset="1" stop-color="#138A5C"/></linearGradient></defs><text x="52" y="60" text-anchor="middle" fill="#15171A" font-size="26" font-weight="800" font-family="Manrope">86</text></svg>
    <div class="flex-1"><p class="text-[12px] text-gray-500 font-semibold uppercase tracking-wider">Safety score</p><p class="font-display font-extrabold text-[24px] leading-tight">Calm ride</p><p class="text-[13px] text-emerald-600 font-semibold mt-1"><i class="fa-solid fa-arrow-up mr-1"></i>+8 vs your average</p></div>
  </div>

  <div class="px-c mt-5 grid grid-cols-4 gap-2 text-center">
    <div class="card py-4"><p class="font-display font-extrabold text-[22px] leading-none">12.4</p><p class="text-[11px] text-gray-500 font-semibold mt-1">km</p></div>
    <div class="card py-4"><p class="font-display font-extrabold text-[22px] leading-none">38</p><p class="text-[11px] text-gray-500 font-semibold mt-1">min</p></div>
    <div class="card py-4"><p class="font-display font-extrabold text-[22px] leading-none">21</p><p class="text-[11px] text-gray-500 font-semibold mt-1">km/h avg</p></div>
    <div class="card py-4"><p class="font-display font-extrabold text-[22px] leading-none text-red-500">2</p><p class="text-[11px] text-gray-500 font-semibold mt-1">alerts</p></div>
  </div>

  <!-- Events timeline -->
  <div class="px-c mt-7 flex items-center justify-between"><h2 class="font-display font-bold text-[20px]">What the unit saw</h2><span class="text-[13px] font-semibold text-gray-400">38 vehicles</span></div>
  <div class="mx-[28px] mt-3 card p-5">
    <div class="relative h-14">
      <div class="absolute left-0 right-0 top-6 h-2 rounded-full bg-gray-100"></div>
      <div class="absolute top-6 h-2 rounded-full bg-amber-300" style="left:34%;width:14%"></div>
      <div class="absolute top-6 h-2 rounded-full bg-amber-300" style="left:70%;width:9%"></div>
      <div class="absolute top-3 w-8 h-8 rounded-full grad-red text-white flex items-center justify-center ring-4 ring-white shadow" style="left:22%"><i class="fa-solid fa-car text-[12px]"></i></div>
      <div class="absolute top-3 w-8 h-8 rounded-full grad-red text-white flex items-center justify-center ring-4 ring-white shadow" style="left:61%"><i class="fa-solid fa-car text-[12px]"></i></div>
      <div class="absolute top-4 w-6 h-6 rounded-full grad-amber text-white flex items-center justify-center ring-4 ring-white shadow" style="left:40%"><i class="fa-solid fa-circle-exclamation text-[10px]"></i></div>
      <span class="absolute left-0 bottom-0 text-[11px] text-gray-400 font-semibold">7:56</span><span class="absolute right-0 bottom-0 text-[11px] text-gray-400 font-semibold">8:34</span>
    </div>
    <div class="flex items-center gap-4 mt-2 text-[12px] font-semibold text-gray-500"><span><span class="dot bg-red-500 mr-1.5"></span>Close pass</span><span><span class="dot bg-amber-400 mr-1.5"></span>Rough road</span></div>
  </div>

  <div class="hscroll mt-4 pb-2">
    <div class="w-[220px] rounded-3xl overflow-hidden relative h-[150px]"><img src="assets/camera.jpg" class="absolute inset-0 w-full h-full object-cover scale-[1.35]"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
      <span class="absolute top-3 left-3 chip bg-red-500 text-white">0.6 m · 8:12</span>
      <div class="absolute inset-0 flex items-center justify-center"><div class="w-11 h-11 rounded-full bg-white/90 flex items-center justify-center"><i class="fa-solid fa-play text-[#15171A] ml-0.5"></i></div></div>
      <span class="absolute bottom-3 right-3 bg-black/50 text-white text-[12px] font-semibold px-2 py-0.5 rounded">0:12</span></div>
    <div class="w-[220px] rounded-3xl overflow-hidden relative h-[150px]"><img src="assets/pothole.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
      <span class="absolute top-3 left-3 chip bg-amber-500 text-white">Pothole · 8:19</span>
      <div class="absolute inset-0 flex items-center justify-center"><div class="w-11 h-11 rounded-full bg-white/90 flex items-center justify-center"><i class="fa-solid fa-play text-[#15171A] ml-0.5"></i></div></div>
      <span class="absolute bottom-3 right-3 bg-black/50 text-white text-[12px] font-semibold px-2 py-0.5 rounded">0:08</span></div>
  </div>
  <div class="mx-[28px] mt-4 btn bg-[#15171A] text-white"><i class="fa-solid fa-flag"></i>Report close pass to city</div>
</div></div>
</body></html>
