<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Road</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:0">
  <div class="absolute inset-0"><img src="assets/map.jpg" class="w-full h-full object-cover" style="object-position:40% 30%"></div>
  <div class="absolute inset-x-0 top-0 h-[150px]" style="background:linear-gradient(180deg,rgba(244,245,247,.95) 40%,rgba(244,245,247,0))"></div>
  <!-- route trace -->
  <svg class="absolute inset-0" width="436" height="956" viewBox="0 0 436 956">
    <path d="M60 760 C 110 700, 150 690, 180 620 S 230 520, 280 470 S 330 380, 400 330" fill="none" stroke="#34C38F" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <path d="M180 620 S 230 520, 280 470" fill="none" stroke="#FFC042" stroke-width="9" stroke-linecap="round"/>
    <path d="M225 560 S 250 520, 268 485" fill="none" stroke="#FF5A5F" stroke-width="9" stroke-linecap="round"/>
    <circle cx="60" cy="760" r="9" fill="#15171A" stroke="#fff" stroke-width="3"/>
  </svg>
  <!-- hazard pins -->
  <div class="absolute" style="left:236px;top:506px"><div class="relative"><span class="absolute -inset-3 rounded-full bg-red-500/30 pulse"></span><div class="w-11 h-11 rounded-full grad-red text-white flex items-center justify-center ring-4 ring-white shadow-lg"><i class="fa-solid fa-circle-exclamation"></i></div></div></div>
  <div class="absolute" style="left:300px;top:420px"><div class="w-9 h-9 rounded-full grad-amber text-white flex items-center justify-center ring-4 ring-white shadow"><i class="fa-solid fa-water text-[13px]"></i></div></div>
  <div class="absolute" style="left:132px;top:650px"><div class="w-9 h-9 rounded-full grad-amber text-white flex items-center justify-center ring-4 ring-white shadow"><i class="fa-solid fa-train-tram text-[13px]"></i></div></div>
  <!-- current position -->
  <div class="absolute" style="left:382px;top:312px"><div class="relative"><span class="absolute -inset-4 rounded-full bg-orange-500/30 pulse"></span><div class="w-9 h-9 rounded-full grad-orange text-white flex items-center justify-center ring-4 ring-white shadow-lg"><i class="fa-solid fa-location-arrow text-[13px]"></i></div></div></div>

  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 relative z-10 flex items-center justify-between">
    <h1 class="font-display font-extrabold text-[28px]">Road quality</h1>
    <div class="w-11 h-11 rounded-full bg-white shadow flex items-center justify-center"><i class="fa-solid fa-layer-group text-gray-600"></i></div>
  </div>
  <div class="px-c mt-3 relative z-10 flex gap-2">
    <span class="chip bg-[#15171A] text-white">Last ride</span>
    <span class="chip bg-white text-gray-700 shadow-sm">Community</span>
    <span class="chip bg-white text-gray-700 shadow-sm"><span class="dot bg-emerald-500"></span><span class="dot bg-amber-400 -ml-1"></span><span class="dot bg-red-500 -ml-1"></span>Legend</span>
  </div>

  <!-- Bottom sheet -->
  <div class="absolute left-0 right-0 bottom-0 bg-white rounded-t-[32px] pt-3 pb-[112px]" style="box-shadow:0 -12px 40px rgba(0,0,0,.12)">
    <div class="mx-auto w-10 h-1.5 rounded-full bg-gray-200"></div>
    <div class="px-c mt-4 flex items-center gap-4">
      <div class="w-[112px] h-[84px] rounded-2xl overflow-hidden flex-shrink-0 relative"><img src="assets/pothole.jpg" class="w-full h-full object-cover"><span class="absolute top-2 left-2 chip bg-red-500 text-white px-2 py-0.5 text-[10px]">Severe</span></div>
      <div class="flex-1"><p class="font-bold text-[17px]">Pothole, Elm St bike lane</p><p class="text-[13px] text-gray-500 mt-0.5">Felt by 14 riders this week</p>
        <div class="flex items-center gap-2 mt-2 text-[12px] font-semibold"><span class="chip bg-gray-100 text-gray-700 px-2 py-1"><i class="fa-solid fa-wave-square text-red-500"></i>4.8 g</span><span class="chip bg-gray-100 text-gray-700 px-2 py-1"><i class="fa-solid fa-camera text-amber-500"></i>Clip</span></div></div>
    </div>
    <div class="px-c mt-5 grid grid-cols-3 gap-3 text-center">
      <div class="rounded-2xl bg-emerald-50 py-3"><p class="font-display font-extrabold text-[26px] text-emerald-600 leading-none">71%</p><p class="text-[12px] text-gray-500 font-semibold mt-1">Smooth</p></div>
      <div class="rounded-2xl bg-amber-50 py-3"><p class="font-display font-extrabold text-[26px] text-amber-600 leading-none">22%</p><p class="text-[12px] text-gray-500 font-semibold mt-1">Rough</p></div>
      <div class="rounded-2xl bg-red-50 py-3"><p class="font-display font-extrabold text-[26px] text-red-500 leading-none">3</p><p class="text-[12px] text-gray-500 font-semibold mt-1">Hazards</p></div>
    </div>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-clock-rotate-left"></i>Rides</div>
<div class="tab go"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
<div class="tab on"><i class="fa-solid fa-map"></i>Road</div>
<div class="tab"><i class="fa-solid fa-microchip"></i>Unit</div>
</nav></div>
</body></html>
