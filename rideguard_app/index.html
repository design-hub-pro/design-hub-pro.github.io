<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideGuard · Bike safety app</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Inter',sans-serif;color:#15171A}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2d31,#0b0c0d);box-shadow:0 50px 80px -30px rgba(20,20,30,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F5F7}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FF7A33,#E8420F)"><i class="fa-solid fa-shield-halved text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:Manrope">RideGuard</h1>
  <p class="mt-3 text-[19px] text-gray-500">Bike-mounted sensors watch traffic and the road. Your handlebar warns you first.</p>
  <div class="mt-6 flex gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-700">Cycling Safety</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Rear Camera</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Ultrasound</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Road Sensing</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="pair.html" scrolling="no" title="pair"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="ride.html" scrolling="no" title="ride"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="alert.html" scrolling="no" title="alert"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="camera.html" scrolling="no" title="camera"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="road.html" scrolling="no" title="road"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="summary.html" scrolling="no" title="summary"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="history.html" scrolling="no" title="history"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="device.html" scrolling="no" title="device"></iframe></div></div>
</div></main>
</body></html>
