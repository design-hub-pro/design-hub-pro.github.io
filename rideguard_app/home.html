<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Home</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div><p class="text-[13px] text-gray-500 font-medium"><span class="dot bg-emerald-500 mr-1.5"></span>Unit connected</p>
    <h1 class="font-display font-extrabold text-[28px] mt-0.5">Morning, Maya</h1></div>
    <div class="relative"><img src="assets/avatar.jpg" class="w-12 h-12 rounded-full object-cover ring-2 ring-white"></div>
  </div>

  <!-- Unit hero -->
  <div class="mx-[28px] mt-5 rounded-[28px] overflow-hidden relative h-[290px]" style="background:#1B1E23">
    <img src="assets/device.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:center 40%">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82) 100%)"></div>
    <span class="absolute top-4 left-4 chip bg-white/90 text-[#15171A]"><span class="dot bg-emerald-500"></span>All sensors ready</span>
    <span class="absolute top-4 right-4 chip bg-black/40 text-white backdrop-blur"><i class="fa-solid fa-battery-three-quarters"></i>78%</span>
    <div class="absolute bottom-5 left-5 right-5 text-white flex items-end justify-between">
      <div><p class="text-white/70 text-[13px] font-semibold uppercase tracking-wider">Ride time left</p>
        <div class="flex items-baseline gap-1"><span class="font-display font-extrabold text-[56px] leading-none">6.5</span><span class="text-white/60 text-[18px] font-semibold">hrs</span></div></div>
      <div class="flex gap-2">
        <div class="w-11 h-11 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-camera text-emerald-300"></i></div>
        <div class="w-11 h-11 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-wave-square text-emerald-300"></i></div>
        <div class="w-11 h-11 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-road text-emerald-300"></i></div>
      </div>
    </div>
  </div>

  <div class="mx-[28px] mt-4 btn grad-orange text-white"><i class="fa-solid fa-play"></i>Start ride</div>

  <!-- This week -->
  <div class="px-c mt-7 flex items-center justify-between"><h2 class="font-display font-bold text-[20px]">This week</h2><span class="text-[13px] font-semibold text-orange-600">All rides</span></div>
  <div class="px-c mt-3 grid grid-cols-3 gap-3">
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-sky flex items-center justify-center text-white"><i class="fa-solid fa-route"></i></div><p class="text-[12px] text-gray-500 mt-3 font-semibold">Distance</p><p class="font-display font-extrabold text-[28px] leading-tight">48<span class="text-[13px] text-gray-400 ml-0.5">km</span></p></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-red flex items-center justify-center text-white"><i class="fa-solid fa-car-side"></i></div><p class="text-[12px] text-gray-500 mt-3 font-semibold">Close passes</p><p class="font-display font-extrabold text-[28px] leading-tight">7</p></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-amber flex items-center justify-center text-white"><i class="fa-solid fa-triangle-exclamation"></i></div><p class="text-[12px] text-gray-500 mt-3 font-semibold">Road hazards</p><p class="font-display font-extrabold text-[28px] leading-tight">12</p></div>
  </div>

  <!-- Recent clips -->
  <div class="px-c mt-7 flex items-center justify-between"><h2 class="font-display font-bold text-[20px]">Saved clips</h2><span class="text-[13px] font-semibold text-gray-400">3 new</span></div>
  <div class="hscroll mt-3 pb-2">
    <div class="w-[250px] rounded-3xl overflow-hidden relative h-[170px]"><img src="assets/camera.jpg" class="absolute inset-0 w-full h-full object-cover scale-[1.35]"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
      <span class="absolute top-3 left-3 chip bg-red-500 text-white">Close pass · 0.6 m</span>
      <div class="absolute inset-0 flex items-center justify-center"><div class="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center"><i class="fa-solid fa-play text-[#15171A] ml-0.5"></i></div></div>
      <div class="absolute bottom-3 left-4 right-4 text-white flex justify-between text-[12px] font-semibold"><span>Today · 8:12 AM</span><span class="bg-black/50 px-2 py-0.5 rounded">0:12</span></div></div>
    <div class="w-[250px] rounded-3xl overflow-hidden relative h-[170px]"><img src="assets/downtown.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
      <span class="absolute top-3 left-3 chip bg-amber-500 text-white">Sudden stop</span>
      <div class="absolute inset-0 flex items-center justify-center"><div class="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center"><i class="fa-solid fa-play text-[#15171A] ml-0.5"></i></div></div>
      <div class="absolute bottom-3 left-4 right-4 text-white flex justify-between text-[12px] font-semibold"><span>Yesterday · 6:40 PM</span><span class="bg-black/50 px-2 py-0.5 rounded">0:09</span></div></div>
  </div>
</div>
<nav class="tabbar">
<div class="tab on"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-clock-rotate-left"></i>Rides</div>
<div class="tab go"><div class="fab"><i class="fa-solid fa-play"></i></div></div>
<div class="tab"><i class="fa-solid fa-map"></i>Road</div>
<div class="tab"><i class="fa-solid fa-microchip"></i>Unit</div>
</nav></div>
</body></html>
