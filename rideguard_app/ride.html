<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Live ride</title></head><body>
<div class="screen text-white" style="background:#0E1014">
  <div class="scroll" style="padding-bottom:0">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <span class="chip bg-white/10 text-white"><span class="dot bg-emerald-400"></span>Recording</span>
    <span class="font-display font-bold text-[18px] tabular-nums">00:23:41</span>
    <span class="chip bg-white/10 text-white"><i class="fa-solid fa-battery-three-quarters"></i>76%</span>
  </div>

  <!-- Radar -->
  <div class="relative mx-auto mt-6" style="width:404px;height:404px">
    <svg viewBox="0 0 404 404" width="404" height="404">
      <defs><radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1E2329"/><stop offset="1" stop-color="#0E1014"/></radialGradient>
      <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A33" stop-opacity="0"/><stop offset="1" stop-color="#FF7A33" stop-opacity=".35"/></linearGradient></defs>
      <circle cx="202" cy="202" r="200" fill="url(#rg)"/>
      <circle cx="202" cy="202" r="200" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
      <circle cx="202" cy="202" r="150" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1" stroke-dasharray="4 6"/>
      <circle cx="202" cy="202" r="100" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1" stroke-dasharray="4 6"/>
      <circle cx="202" cy="202" r="50" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1" stroke-dasharray="4 6"/>
      <path d="M202 202 L92 392 A200 200 0 0 0 312 392 Z" fill="url(#cone)"/>
      <line x1="202" y1="202" x2="202" y2="402" stroke="rgba(255,255,255,.1)"/>
      <text x="212" y="258" fill="rgba(255,255,255,.4)" font-size="11" font-family="Inter" font-weight="600">2 m</text>
      <text x="212" y="308" fill="rgba(255,255,255,.4)" font-size="11" font-family="Inter" font-weight="600">4 m</text>
      <text x="212" y="358" fill="rgba(255,255,255,.4)" font-size="11" font-family="Inter" font-weight="600">6 m</text>
      <!-- vehicle 1: close, right rear -->
      <g transform="translate(262,330)"><circle r="26" fill="#FF5A5F" opacity=".18"/><circle r="15" fill="#FF5A5F"/></g>
      <!-- vehicle 2: far, center -->
      <g transform="translate(190,384)"><circle r="11" fill="#FFC042"/></g>
      <!-- bike -->
      <circle cx="202" cy="202" r="30" fill="#F0541C" opacity=".2"/><circle cx="202" cy="202" r="18" fill="#F0541C"/>
    </svg>
    <div class="absolute" style="left:202px;top:202px;transform:translate(-50%,-50%)"><i class="fa-solid fa-bicycle text-white text-[16px]"></i></div>
    <div class="absolute" style="left:262px;top:330px;transform:translate(-50%,-50%)"><i class="fa-solid fa-car text-white text-[13px]"></i></div>
    <div class="absolute" style="left:190px;top:384px;transform:translate(-50%,-50%)"><i class="fa-solid fa-truck text-[#15171A] text-[10px]"></i></div>
    <div class="absolute top-2 left-1/2 -translate-x-1/2 text-center"><p class="text-white/50 text-[12px] font-semibold uppercase tracking-wider">Speed</p><p class="font-display font-extrabold text-[54px] leading-none">24<span class="text-[16px] text-white/50 ml-1">km/h</span></p></div>
  </div>

  <!-- Nearest vehicle -->
  <div class="mx-[28px] -mt-2 rounded-[24px] p-4 flex items-center gap-4" style="background:#1B1E23">
    <div class="w-12 h-12 rounded-2xl grad-red flex items-center justify-center"><i class="fa-solid fa-car text-[20px]"></i></div>
    <div class="flex-1"><p class="font-bold text-[16px]">Car closing, right side</p><p class="text-white/55 text-[13px]"><span class="dot bg-red-400 mr-1.5"></span>Handlebar buzzing · 2 pulses</p></div>
    <div class="text-right"><p class="font-display font-extrabold text-[30px] leading-none">3.1<span class="text-[13px] text-white/50 ml-0.5">m</span></p><p class="text-[12px] text-red-300 font-semibold mt-1">+11 km/h</p></div>
  </div>

  <!-- Road + camera row -->
  <div class="px-c mt-3 grid grid-cols-2 gap-3">
    <div class="rounded-[24px] p-4" style="background:#1B1E23">
      <div class="flex items-center justify-between"><span class="text-white/55 text-[12px] font-semibold uppercase tracking-wider">Road</span><span class="dot bg-amber-400"></span></div>
      <p class="font-display font-extrabold text-[26px] mt-1 leading-tight">Rough</p>
      <div class="flex items-end gap-[3px] h-9 mt-2">
        <span class="w-2 bg-emerald-400/70 rounded-sm" style="height:30%"></span><span class="w-2 bg-emerald-400/70 rounded-sm" style="height:40%"></span><span class="w-2 bg-emerald-400/70 rounded-sm" style="height:25%"></span><span class="w-2 bg-amber-400 rounded-sm" style="height:70%"></span><span class="w-2 bg-amber-400 rounded-sm" style="height:95%"></span><span class="w-2 bg-amber-400 rounded-sm" style="height:60%"></span><span class="w-2 bg-emerald-400/70 rounded-sm" style="height:35%"></span><span class="w-2 bg-amber-400 rounded-sm" style="height:80%"></span><span class="w-2 bg-amber-400 rounded-sm" style="height:55%"></span><span class="w-2 bg-emerald-400/70 rounded-sm" style="height:30%"></span><span class="w-2 bg-emerald-400/70 rounded-sm" style="height:20%"></span>
      </div>
    </div>
    <div class="rounded-[24px] overflow-hidden relative h-[118px]"><img src="assets/camera.jpg" class="absolute inset-0 w-full h-full object-cover scale-[1.4]"><div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
      <span class="absolute top-3 left-3 chip bg-black/50 text-white backdrop-blur"><span class="dot bg-red-500"></span>Rear cam</span>
      <div class="absolute top-[38px] left-[46px] w-[76px] h-[48px] border-2 border-red-400 rounded-md"></div>
      <span class="absolute bottom-3 left-3 text-[12px] font-semibold">Tap to expand</span></div>
  </div>

  <div class="px-c mt-4 flex gap-3">
    <div class="btn flex-1 text-white" style="background:#1B1E23"><i class="fa-solid fa-pause"></i>Pause</div>
    <div class="btn w-[58px] grad-red text-white"><i class="fa-solid fa-stop"></i></div>
  </div>
  </div>
</div>
</body></html>
