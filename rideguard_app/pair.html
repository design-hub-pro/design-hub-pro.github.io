<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Pair</title></head><body>
<div class="screen" style="background:#15171A">
  <img src="assets/hero.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:60% center">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(21,23,26,.15) 0%,rgba(21,23,26,.1) 35%,rgba(21,23,26,.92) 68%,#15171A 100%)"></div>
  <div class="scroll" style="padding-bottom:0">
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="px-c pt-3 flex items-center gap-2 text-white">
      <div class="w-9 h-9 rounded-xl grad-orange flex items-center justify-center"><i class="fa-solid fa-shield-halved text-[15px]"></i></div>
      <span class="font-display font-extrabold text-[18px]">RideGuard</span>
    </div>
    <div class="absolute left-0 right-0 bottom-0 px-c pb-10 text-white">
      <div class="flex items-center gap-2 mb-4">
        <span class="chip bg-white/15 backdrop-blur text-white"><i class="fa-solid fa-camera"></i>Camera</span>
        <span class="chip bg-white/15 backdrop-blur text-white"><i class="fa-solid fa-wave-square"></i>Ultrasound</span>
        <span class="chip bg-white/15 backdrop-blur text-white"><i class="fa-solid fa-road"></i>Road</span>
      </div>
      <h1 class="font-display font-extrabold text-[44px] leading-[1.02]">See what is<br>behind you.</h1>
      <p class="text-white/70 text-[16px] mt-3 leading-snug">Sensors on the bike watch traffic and the road. The handlebar buzzes before you need to look.</p>
      <div class="mt-7 card p-4 flex items-center gap-4" style="background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.12)">
        <div class="relative w-14 h-14 rounded-2xl overflow-hidden flex-shrink-0"><img src="assets/device.jpg" class="w-full h-full object-cover"></div>
        <div class="flex-1"><p class="font-bold text-[15px]">RideGuard Unit</p><p class="text-white/60 text-[13px]"><span class="dot bg-emerald-400 mr-1.5"></span>Found nearby · RG-2C41</p></div>
        <div class="relative w-10 h-10 flex items-center justify-center"><span class="absolute w-10 h-10 rounded-full bg-emerald-400/40 pulse"></span><i class="fa-brands fa-bluetooth-b text-emerald-300 text-[18px] relative"></i></div>
      </div>
      <div class="btn grad-orange text-white mt-4"><i class="fa-solid fa-link"></i>Pair this unit</div>
      <p class="text-center text-white/50 text-[13px] mt-4 font-medium">Hold the unit button for 3 seconds</p>
      <div class="mx-auto mt-6 w-[134px] h-[5px] rounded-full bg-white/60"></div>
    </div>
  </div>
</div>
</body></html>
