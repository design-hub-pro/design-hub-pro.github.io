<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Rear camera</title></head><body>
<div class="screen text-white" style="background:#0E1014">
  <div class="scroll" style="padding-bottom:0">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <span class="font-display font-bold text-[18px]">Rear camera</span>
    <span class="chip bg-red-500 text-white"><span class="dot bg-white"></span>LIVE</span>
  </div>

  <!-- Camera frame -->
  <div class="mx-[16px] mt-4 rounded-[28px] overflow-hidden relative" style="height:560px">
    <img src="assets/camera.jpg" class="absolute inset-0 w-full h-full object-cover scale-[1.45]" style="object-position:center 48%">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 70%,rgba(0,0,0,.7) 100%)"></div>
    <!-- detections -->
    <div class="absolute" style="left:118px;top:188px;width:200px;height:150px">
      <div class="absolute inset-0 border-[3px] border-red-400 rounded-lg"></div>
      <span class="absolute -top-8 left-0 chip bg-red-500 text-white">Car · 3.1 m · closing</span>
    </div>
    <div class="absolute" style="left:270px;top:160px;width:84px;height:66px">
      <div class="absolute inset-0 border-2 border-amber-400 rounded-md"></div>
      <span class="absolute -top-7 left-0 chip bg-amber-400 text-[#15171A] px-2 py-1 text-[11px]">Van · 9 m</span>
    </div>
    <!-- lane marker -->
    <div class="absolute left-4 top-4 flex items-center gap-2 text-[12px] font-semibold text-white/80"><i class="fa-solid fa-video"></i>1080p · 30 fps</div>
    <div class="absolute right-4 top-4 text-[12px] font-semibold text-white/80">08:12:44</div>
    <!-- bottom bar -->
    <div class="absolute bottom-0 left-0 right-0 p-5">
      <div class="flex items-center justify-between">
        <div><p class="text-white/60 text-[12px] font-semibold uppercase tracking-wider">Detected</p><p class="font-display font-extrabold text-[30px] leading-none mt-0.5">2 <span class="text-[15px] text-white/60 font-semibold">vehicles</span></p></div>
        <div class="flex gap-2">
          <div class="w-12 h-12 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-camera"></i></div>
          <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-red-500"><i class="fa-solid fa-circle text-[22px]"></i></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Threat strip -->
  <div class="px-c mt-4 flex gap-3">
    <div class="flex-1 rounded-[20px] p-4" style="background:#1B1E23"><p class="text-white/55 text-[12px] font-semibold">Closing speed</p><p class="font-display font-extrabold text-[24px] leading-tight text-red-300">+11<span class="text-[12px] text-white/50 ml-0.5">km/h</span></p></div>
    <div class="flex-1 rounded-[20px] p-4" style="background:#1B1E23"><p class="text-white/55 text-[12px] font-semibold">Pass gap</p><p class="font-display font-extrabold text-[24px] leading-tight">0.9<span class="text-[12px] text-white/50 ml-0.5">m</span></p></div>
    <div class="flex-1 rounded-[20px] p-4" style="background:#1B1E23"><p class="text-white/55 text-[12px] font-semibold">Clips today</p><p class="font-display font-extrabold text-[24px] leading-tight">3</p></div>
  </div>
  <p class="text-center text-white/40 text-[12px] mt-5 font-medium">Clips save automatically on every close pass</p>
  </div>
</div>
</body></html>
