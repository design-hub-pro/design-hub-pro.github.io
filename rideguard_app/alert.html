<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>RideGuard · Alert</title></head><body>
<div class="screen text-white" style="background:linear-gradient(180deg,#8E1020 0%,#C81E36 45%,#5A0A14 100%)">
  <div class="scroll" style="padding-bottom:0">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <span class="chip bg-white/15 text-white"><span class="dot bg-white"></span>Recording</span>
    <span class="font-display font-bold text-[18px] tabular-nums">00:24:08</span>
    <span class="chip bg-white/15 text-white"><i class="fa-solid fa-volume-high"></i></span>
  </div>

  <div class="relative mx-auto mt-10 flex items-center justify-center" style="width:300px;height:300px">
    <span class="absolute w-[300px] h-[300px] rounded-full bg-white/10 pulse"></span>
    <span class="absolute w-[300px] h-[300px] rounded-full bg-white/10 pulse" style="animation-delay:.8s"></span>
    <div class="relative w-[240px] h-[240px] rounded-full bg-white flex flex-col items-center justify-center text-[#C81E36]">
      <i class="fa-solid fa-car text-[48px]"></i>
      <p class="font-display font-extrabold text-[72px] leading-none mt-1">1.2<span class="text-[22px] ml-1">m</span></p>
      <p class="text-[14px] font-bold uppercase tracking-wider mt-1 text-[#C81E36]/70">Behind, right</p>
    </div>
  </div>

  <div class="text-center mt-8 px-c">
    <h1 class="font-display font-extrabold text-[40px] leading-[1.05]">Hold your line</h1>
    <p class="text-white/80 text-[17px] mt-2">Vehicle passing at <b class="text-white">41 km/h</b>. Do not swerve.</p>
  </div>

  <!-- haptic pattern -->
  <div class="mx-[28px] mt-8 rounded-[24px] p-5 bg-black/25 backdrop-blur">
    <div class="flex items-center justify-between"><span class="text-white/70 text-[12px] font-semibold uppercase tracking-wider">Handlebar</span><span class="text-[12px] font-semibold text-white"><i class="fa-solid fa-wave-square mr-1"></i>Strong · 3 pulses</span></div>
    <div class="flex items-center gap-2 mt-4 h-10">
      <span class="h-10 w-9 rounded-md bg-white"></span><span class="h-2 w-4 rounded bg-white/30"></span><span class="h-10 w-9 rounded-md bg-white"></span><span class="h-2 w-4 rounded bg-white/30"></span><span class="h-10 w-9 rounded-md bg-white"></span><span class="h-2 flex-1 rounded bg-white/20"></span><span class="h-6 w-6 rounded bg-white/40"></span><span class="h-2 w-4 rounded bg-white/30"></span><span class="h-6 w-6 rounded bg-white/40"></span>
    </div>
  </div>

  <div class="px-c mt-6 grid grid-cols-2 gap-3 text-center">
    <div class="rounded-2xl bg-black/25 py-3"><p class="text-white/60 text-[12px] font-semibold">Clip</p><p class="font-bold text-[15px]"><span class="dot bg-white mr-1.5"></span>Saving 20 s</p></div>
    <div class="rounded-2xl bg-black/25 py-3"><p class="text-white/60 text-[12px] font-semibold">Ultrasound · Camera</p><p class="font-bold text-[15px]">Both agree</p></div>
  </div>
  <p class="text-center text-white/50 text-[13px] mt-8 font-medium">Alert clears when the lane is empty</p>
  </div>
</div>
</body></html>
