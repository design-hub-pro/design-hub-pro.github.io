<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitForm AI - Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0A0E1A; color: #fff; }

  .status-bar { height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; position: absolute; top: 0; left: 0; right: 0; z-index: 100; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 12px; }

  .onboard-container { width: 100%; height: 100%; display: flex; flex-direction: column; }

  .hero-area { flex: 1; position: relative; overflow: hidden; }
  .hero-area img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
  .hero-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,26,0.3) 0%, rgba(10,14,26,0.9) 60%, #0A0E1A 100%); }

  .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 28px; }
  .app-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #00E5A0, #00B4D8); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; }
  .logo-text { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-text span { background: linear-gradient(135deg, #00E5A0, #00B4D8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .hero-content h1 { font-size: 32px; font-weight: 800; line-height: 1.15; letter-spacing: -1px; }
  .hero-content h1 span { color: #00E5A0; }
  .hero-content p { font-size: 15px; color: #9ca3af; margin-top: 10px; line-height: 1.5; }

  .features { display: flex; gap: 20px; margin-top: 24px; }
  .feature-item { display: flex; align-items: center; gap: 8px; }
  .feature-dot { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .feature-item span { font-size: 12px; font-weight: 600; color: #d1d5db; }

  .bottom-section { padding: 28px; }
  .cta-btn {
    width: 100%; padding: 18px; border-radius: 18px; border: none; font-size: 17px; font-weight: 700;
    background: linear-gradient(135deg, #00E5A0, #00B4D8); color: #000; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .signin-link { text-align: center; margin-top: 16px; font-size: 14px; color: #6b7280; }
  .signin-link a { color: #00E5A0; text-decoration: none; font-weight: 600; }

  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #374151; }
  .dot.active { width: 24px; border-radius: 4px; background: linear-gradient(90deg, #00E5A0, #00B4D8); }
</style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal" style="font-size:14px"></i>
      <i class="fas fa-wifi" style="font-size:14px"></i>
      <i class="fas fa-battery-full" style="font-size:14px"></i>
    </div>
  </div>

  <div class="onboard-container">
    <div class="hero-area">
      <img src="https://images.unsplash.com/photo-1549060279-7e168fcee0c2?w=800&q=80" alt="fitness">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="app-logo">
          <div class="logo-icon"><i class="fas fa-person-running"></i></div>
          <div class="logo-text">Fit<span>Form</span> AI</div>
        </div>
        <h1>Train Smarter with<br><span>AI Pose Correction</span></h1>
        <p>Personalized workout plans with real-time camera-based form analysis and feedback</p>
        <div class="features">
          <div class="feature-item">
            <div class="feature-dot" style="background: rgba(0,229,160,0.15); color: #00E5A0;"><i class="fas fa-camera"></i></div>
            <span>AI Coach</span>
          </div>
          <div class="feature-item">
            <div class="feature-dot" style="background: rgba(0,180,216,0.15); color: #00B4D8;"><i class="fas fa-dumbbell"></i></div>
            <span>Custom Plans</span>
          </div>
          <div class="feature-item">
            <div class="feature-dot" style="background: rgba(139,92,246,0.15); color: #8B5CF6;"><i class="fas fa-chart-line"></i></div>
            <span>Analytics</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-section">
      <button class="cta-btn"><i class="fas fa-bolt"></i> Get Started</button>
      <div class="signin-link">Already have an account? <a href="#">Sign In</a></div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
