<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusLens - Extension Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 380px; background: #f8fafc; }
    </style>
</head>
<body>

    <!-- Popup Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center">
                    <i class="fas fa-brain text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-base">FocusLens AI</h1>
                    <p class="text-indigo-200 text-xs">Chrome Extension v1.2.0</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse"></div>
                <span class="text-green-200 text-xs font-medium">Active</span>
            </div>
        </div>
    </div>

    <!-- Focus Score Ring -->
    <div class="bg-white mx-4 -mt-1 rounded-2xl shadow-sm border border-gray-100 p-5">
        <div class="flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0">
                <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#E5E7EB" stroke-width="8"/>
                    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#scoreGrad)" stroke-width="8" stroke-linecap="round"
                        stroke-dasharray="264" stroke-dashoffset="58"/>
                    <defs>
                        <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#6366F1"/>
                            <stop offset="100%" stop-color="#8B5CF6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="text-3xl font-extrabold text-gray-900">78</span>
                    <span class="text-xs text-gray-400 -mt-0.5">/ 100</span>
                </div>
            </div>
            <div class="flex-1">
                <p class="text-sm text-gray-500 mb-1">Current Focus Score</p>
                <p class="text-lg font-bold text-gray-900 mb-2">Good Focus</p>
                <div class="flex items-center gap-1.5">
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium"><i class="fas fa-arrow-up text-xs mr-0.5"></i>+5</span>
                    <span class="text-xs text-gray-400">vs. yesterday</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Current Session -->
    <div class="mx-4 mt-3">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <i class="fas fa-clock text-indigo-500 text-sm"></i>
                    <span class="text-sm font-semibold text-gray-900">Current Session</span>
                </div>
                <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-medium">47 min</span>
            </div>
            <div class="flex items-center gap-2 mb-3">
                <img src="https://www.google.com/s2/favicons?domain=khanacademy.org&sz=32" class="w-5 h-5 rounded" alt="">
                <span class="text-sm text-gray-700">Khan Academy — AP Biology Ch.7</span>
            </div>
            <!-- Mini activity bars -->
            <div class="flex gap-0.5 h-6 items-end">
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 70%"></div>
                <div class="flex-1 bg-green-500 rounded-sm" style="height: 85%"></div>
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 55%"></div>
                <div class="flex-1 bg-amber-400 rounded-sm" style="height: 35%"></div>
                <div class="flex-1 bg-green-500 rounded-sm" style="height: 90%"></div>
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 75%"></div>
                <div class="flex-1 bg-green-500 rounded-sm" style="height: 80%"></div>
                <div class="flex-1 bg-amber-400 rounded-sm" style="height: 40%"></div>
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 65%"></div>
                <div class="flex-1 bg-green-500 rounded-sm" style="height: 95%"></div>
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 72%"></div>
                <div class="flex-1 bg-green-500 rounded-sm" style="height: 88%"></div>
                <div class="flex-1 bg-amber-300 rounded-sm" style="height: 30%"></div>
                <div class="flex-1 bg-green-400 rounded-sm" style="height: 60%"></div>
                <div class="flex-1 bg-indigo-400 rounded-sm" style="height: 50%"></div>
            </div>
            <div class="flex justify-between mt-1 px-0.5">
                <span class="text-xs text-gray-300">0m</span>
                <span class="text-xs text-gray-300">47m</span>
            </div>
        </div>
    </div>

    <!-- Quick Stats -->
    <div class="mx-4 mt-3 grid grid-cols-3 gap-2">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 text-center">
            <div class="w-7 h-7 bg-blue-100 rounded-lg flex items-center justify-center mx-auto mb-1.5">
                <i class="fas fa-keyboard text-blue-600 text-xs"></i>
            </div>
            <p class="text-lg font-bold text-gray-900">62</p>
            <p class="text-xs text-gray-400">WPM</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 text-center">
            <div class="w-7 h-7 bg-purple-100 rounded-lg flex items-center justify-center mx-auto mb-1.5">
                <i class="fas fa-mouse-pointer text-purple-600 text-xs"></i>
            </div>
            <p class="text-lg font-bold text-gray-900">71%</p>
            <p class="text-xs text-gray-400">Stability</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 text-center">
            <div class="w-7 h-7 bg-amber-100 rounded-lg flex items-center justify-center mx-auto mb-1.5">
                <i class="fas fa-window-restore text-amber-600 text-xs"></i>
            </div>
            <p class="text-lg font-bold text-gray-900">3</p>
            <p class="text-xs text-gray-400">Tab Swaps</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="mx-4 mt-3 mb-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3">
            <div class="grid grid-cols-2 gap-2">
                <button class="flex items-center justify-center gap-2 bg-indigo-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-indigo-700 transition">
                    <i class="fas fa-shield-halved text-xs"></i>
                    Focus Mode
                </button>
                <button class="flex items-center justify-center gap-2 bg-gray-100 text-gray-700 rounded-xl py-2.5 text-sm font-semibold hover:bg-gray-200 transition">
                    <i class="fas fa-pause text-xs"></i>
                    Pause Tracking
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="bg-gray-50 border-t border-gray-100 px-5 py-2.5 flex items-center justify-between">
        <span class="text-xs text-gray-400"><i class="fas fa-lock mr-1"></i>All data processed locally</span>
        <a href="#" class="text-xs text-indigo-600 font-medium">Open Dashboard <i class="fas fa-arrow-right ml-0.5"></i></a>
    </div>

</body>
</html>
