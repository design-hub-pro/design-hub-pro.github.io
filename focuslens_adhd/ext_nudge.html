<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusLens - Nudge Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 860px;
            height: 540px;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ecf8 100%);
            overflow: hidden;
            position: relative;
        }
        .backdrop-blur {
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- Simulated Browser Page Background -->
    <div class="absolute inset-0 p-6 opacity-40">
        <!-- Fake article content -->
        <div class="max-w-2xl mx-auto">
            <div class="h-4 bg-gray-300 rounded w-3/4 mb-3"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-5/6 mb-4"></div>
            <div class="h-32 bg-gray-200 rounded-lg mb-4"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-4/5 mb-4"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-3/4 mb-4"></div>
            <div class="h-24 bg-gray-200 rounded-lg mb-4"></div>
            <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
            <div class="h-3 bg-gray-200 rounded w-5/6 mb-2"></div>
        </div>
    </div>

    <!-- Dim overlay -->
    <div class="absolute inset-0 bg-black/10 backdrop-blur"></div>

    <!-- Nudge Notification - Bottom Right -->
    <div class="absolute bottom-6 right-6 w-96">
        <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
            <!-- Nudge Header -->
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-5 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-brain text-white text-sm"></i>
                    </div>
                    <span class="text-white font-semibold text-sm">FocusLens AI</span>
                </div>
                <button class="text-white/70 hover:text-white">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <!-- Nudge Body -->
            <div class="p-5">
                <div class="flex items-start gap-3 mb-4">
                    <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center flex-shrink-0 mt-0.5">
                        <i class="fas fa-hand text-amber-600 text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-gray-900 mb-1">Time for a Gentle Break</h3>
                        <p class="text-sm text-gray-600 leading-relaxed">You've been studying for <strong>48 minutes</strong> and your typing speed has dropped 30%. A 5-minute break could help you refocus.</p>
                    </div>
                </div>

                <!-- Detection Details -->
                <div class="bg-gray-50 rounded-xl p-3.5 mb-4">
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">What we noticed</p>
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-amber-400"></div>
                            <span class="text-sm text-gray-600">Typing speed dropped from 62 → 43 WPM</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-red-400"></div>
                            <span class="text-sm text-gray-600">8 tab switches in the last 3 minutes</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-amber-400"></div>
                            <span class="text-sm text-gray-600">Mouse movement became erratic</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2">
                    <button class="flex-1 bg-indigo-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                        <i class="fas fa-mug-hot text-xs"></i>
                        Take a Break
                    </button>
                    <button class="flex-1 bg-gray-100 text-gray-700 rounded-xl py-2.5 text-sm font-semibold hover:bg-gray-200 transition flex items-center justify-center gap-2">
                        <i class="fas fa-arrow-right text-xs"></i>
                        Keep Going
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini floating indicator - Top Right (always visible) -->
    <div class="absolute top-4 right-6">
        <div class="bg-white rounded-full shadow-lg border border-gray-200 px-3 py-1.5 flex items-center gap-2">
            <div class="w-6 h-6 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                <i class="fas fa-brain text-white text-xs"></i>
            </div>
            <span class="text-sm font-bold text-amber-600">48m</span>
            <div class="w-1.5 h-1.5 bg-amber-400 rounded-full animate-pulse"></div>
        </div>
    </div>

</body>
</html>
