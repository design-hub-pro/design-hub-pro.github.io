<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusLens - Focus Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 860px;
            height: 540px;
            background: #0f172a;
            overflow: hidden;
            position: relative;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .breathe-ring {
            animation: breathe 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- Background glow effects -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-purple-600/10 rounded-full blur-3xl"></div>

    <!-- Blocked Page Overlay Content -->
    <div class="relative z-10 text-center max-w-lg mx-auto">
        <!-- Focus Ring -->
        <div class="relative w-44 h-44 mx-auto mb-8">
            <div class="absolute inset-0 rounded-full border-2 border-indigo-400/20 breathe-ring"></div>
            <div class="absolute inset-3 rounded-full border-2 border-indigo-400/10 breathe-ring" style="animation-delay: 1s;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-28 h-28 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-full flex flex-col items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-shield-halved text-white text-2xl mb-1"></i>
                    <span class="text-white text-xs font-medium">Focus Mode</span>
                </div>
            </div>
        </div>

        <!-- Message -->
        <h1 class="text-2xl font-bold text-white mb-3">Focus Mode Active</h1>
        <p class="text-gray-400 text-base mb-2 leading-relaxed">
            <strong class="text-indigo-300">twitter.com</strong> is blocked during your study session.
        </p>
        <p class="text-gray-500 text-sm mb-8">You're doing great — you've maintained focus for 23 minutes. Keep it up!</p>

        <!-- Session Stats -->
        <div class="flex items-center justify-center gap-6 mb-8">
            <div class="text-center">
                <div class="w-14 h-14 bg-white/5 rounded-2xl flex items-center justify-center mb-2 mx-auto border border-white/10">
                    <i class="fas fa-clock text-indigo-400 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-white">23m</p>
                <p class="text-xs text-gray-500">Focused</p>
            </div>
            <div class="w-px h-16 bg-white/10"></div>
            <div class="text-center">
                <div class="w-14 h-14 bg-white/5 rounded-2xl flex items-center justify-center mb-2 mx-auto border border-white/10">
                    <i class="fas fa-fire text-amber-400 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-white">84</p>
                <p class="text-xs text-gray-500">Focus Score</p>
            </div>
            <div class="w-px h-16 bg-white/10"></div>
            <div class="text-center">
                <div class="w-14 h-14 bg-white/5 rounded-2xl flex items-center justify-center mb-2 mx-auto border border-white/10">
                    <i class="fas fa-ban text-red-400 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-white">3</p>
                <p class="text-xs text-gray-500">Blocked</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-center gap-3">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                <i class="fas fa-arrow-left text-xs"></i>
                Return to Study
            </button>
            <button class="bg-white/10 hover:bg-white/15 text-gray-300 px-6 py-2.5 rounded-xl text-sm font-semibold transition border border-white/10 flex items-center gap-2">
                <i class="fas fa-clock text-xs"></i>
                5-min Override
            </button>
        </div>

        <!-- Blocked sites list -->
        <div class="mt-6 flex items-center justify-center gap-2 flex-wrap">
            <span class="text-xs bg-red-500/20 text-red-300 px-3 py-1 rounded-full border border-red-500/20">
                <i class="fas fa-ban text-xs mr-1"></i>twitter.com
            </span>
            <span class="text-xs bg-white/5 text-gray-400 px-3 py-1 rounded-full border border-white/5">
                <i class="fas fa-ban text-xs mr-1"></i>reddit.com
            </span>
            <span class="text-xs bg-white/5 text-gray-400 px-3 py-1 rounded-full border border-white/5">
                <i class="fas fa-ban text-xs mr-1"></i>youtube.com
            </span>
        </div>
    </div>

    <!-- FocusLens branding - bottom -->
    <div class="absolute bottom-4 left-0 right-0 text-center">
        <div class="flex items-center justify-center gap-2">
            <div class="w-5 h-5 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-md flex items-center justify-center">
                <i class="fas fa-brain text-white text-xs"></i>
            </div>
            <span class="text-gray-600 text-xs font-medium">FocusLens AI</span>
            <span class="text-gray-700 text-xs">•</span>
            <span class="text-gray-600 text-xs">Protecting your focus</span>
        </div>
    </div>

</body>
</html>
