<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrthoMotion AI - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow-y: auto; overflow-x: hidden; background: #F8FAFB; }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
    </style>
</head>
<body>
    <div class="w-full min-h-screen relative pb-24">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-7 pt-4 pb-2" style="height: 59px;">
            <span class="text-gray-900 text-sm font-semibold">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-gray-900 text-xs"></i>
                <i class="fas fa-wifi text-gray-900 text-xs"></i>
                <i class="fas fa-battery-full text-gray-900 text-xs"></i>
            </div>
        </div>

        <!-- Profile Header -->
        <div class="px-7 pt-4 pb-6 text-center">
            <div class="relative inline-block mb-3">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-lg" alt="avatar">
                <div class="absolute bottom-0 right-0 w-6 h-6 bg-teal-500 rounded-full border-2 border-white flex items-center justify-center">
                    <i class="fas fa-check text-white" style="font-size: 8px;"></i>
                </div>
            </div>
            <h1 class="text-gray-900 text-lg font-bold">Alex Chen</h1>
            <p class="text-gray-400 text-sm">Member since Jan 2026</p>
        </div>

        <!-- Health Profile Card -->
        <div class="px-7 mb-5">
            <div class="bg-white rounded-2xl p-5 shadow-sm">
                <h3 class="text-gray-900 font-bold text-sm mb-3">Health Profile</h3>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <p class="text-gray-400 text-xs mb-1">Condition</p>
                        <p class="text-gray-900 font-bold text-sm">Mild AIS</p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs mb-1">Cobb Angle</p>
                        <p class="text-gray-900 font-bold text-sm">8.5°</p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs mb-1">Since</p>
                        <p class="text-gray-900 font-bold text-sm">2024</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Achievement Badges -->
        <div class="px-7 mb-5">
            <h2 class="text-gray-900 font-bold text-base mb-3">Achievements</h2>
            <div class="flex gap-3 overflow-x-auto">
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center">
                        <i class="fas fa-fire text-white text-xl"></i>
                    </div>
                    <span class="text-gray-600 text-xs">12-Day</span>
                </div>
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center">
                        <i class="fas fa-camera text-white text-xl"></i>
                    </div>
                    <span class="text-gray-600 text-xs">20 Scans</span>
                </div>
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center">
                        <i class="fas fa-trophy text-white text-xl"></i>
                    </div>
                    <span class="text-gray-600 text-xs">Top 10%</span>
                </div>
                <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center">
                        <i class="fas fa-heart text-white text-xl"></i>
                    </div>
                    <span class="text-gray-600 text-xs">Healthy</span>
                </div>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="px-7 mb-5">
            <h2 class="text-gray-900 font-bold text-base mb-3">Settings</h2>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="flex items-center gap-3 px-4 py-3.5 border-b border-gray-50">
                    <div class="w-9 h-9 rounded-lg bg-teal-50 flex items-center justify-center">
                        <i class="fas fa-user-md text-teal-600 text-sm"></i>
                    </div>
                    <span class="text-gray-900 text-sm flex-1">My Providers</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-3 px-4 py-3.5 border-b border-gray-50">
                    <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center">
                        <i class="fas fa-file-medical text-indigo-600 text-sm"></i>
                    </div>
                    <span class="text-gray-900 text-sm flex-1">Medical Records</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-3 px-4 py-3.5 border-b border-gray-50">
                    <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center">
                        <i class="fas fa-bell text-amber-600 text-sm"></i>
                    </div>
                    <span class="text-gray-900 text-sm flex-1">Reminders</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-3 px-4 py-3.5 border-b border-gray-50">
                    <div class="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center">
                        <i class="fas fa-share-alt text-emerald-600 text-sm"></i>
                    </div>
                    <span class="text-gray-900 text-sm flex-1">Share with Doctor</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-3 px-4 py-3.5">
                    <div class="w-9 h-9 rounded-lg bg-gray-50 flex items-center justify-center">
                        <i class="fas fa-cog text-gray-600 text-sm"></i>
                    </div>
                    <span class="text-gray-900 text-sm flex-1">App Settings</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar bg-white border-t border-gray-100 px-7 py-3">
            <div class="flex items-center justify-between">
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-home text-gray-400"></i>
                    <span class="text-xs text-gray-400">Home</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-camera text-gray-400"></i>
                    <span class="text-xs text-gray-400">Scan</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-dumbbell text-gray-400"></i>
                    <span class="text-xs text-gray-400">Rehab</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-chart-line text-gray-400"></i>
                    <span class="text-xs text-gray-400">Progress</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-user text-teal-600"></i>
                    <span class="text-xs text-teal-600 font-medium">Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
