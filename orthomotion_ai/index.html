<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrthoMotion AI - AI-Powered Spine Health & Rehabilitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.25), 0 30px 60px -30px rgba(0,0,0,0.3);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #000;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 48px;
            max-width: 1600px;
            margin: 0 auto;
            justify-items: center;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="text-center pt-16 pb-12 px-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center shadow-lg shadow-teal-500/20">
                <i class="fas fa-bone text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-gray-900">OrthoMotion AI</h1>
        </div>
        <p class="text-gray-500 text-lg max-w-2xl mx-auto">AI-powered pose estimation for scoliosis screening, orthopedic rehabilitation, and smart healthcare resource matching</p>
    </div>

    <!-- Screens -->
    <div class="px-8 pb-20">
        <div class="screens-grid">
            <!-- Onboarding -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Onboarding</p>
            </div>

            <!-- Home -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Home Dashboard</p>
            </div>

            <!-- AI Scan -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="scan.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">AI Pose Estimation</p>
            </div>

            <!-- Rehab -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="rehab.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Rehabilitation</p>
            </div>

            <!-- Progress -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="progress.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Progress Tracking</p>
            </div>

            <!-- Resources -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="resources.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-500 mt-4 font-medium">Healthcare Resources</p>
            </div>
        </div>
    </div>
</body>
</html>
