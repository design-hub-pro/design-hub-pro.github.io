<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideGuard — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-amber-400 to-orange-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-bicycle text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">RideGuard</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A bike-mounted sensor kit that spots obstacles, watches traffic behind you and warns you through handlebar vibration.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Cycling Safety</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Ultrasound</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Camera</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Embedded</span>
        </div>
    </div>

    <!-- Shots: all 8, two per row -->
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257854707-image-1.png" alt="RideGuard — cyclist riding in a bike lane with the rear sensor pod and handlebar unit fitted"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257861228-image-1.png" alt="RideGuard — rear sensor pod and handlebar control unit beside a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257867725-image-1.png" alt="RideGuard — sensor pod clamped to the seatpost facing rearward"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257874319-image-1.png" alt="RideGuard — hands strapping the vibration alert unit to the handlebar"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257938124-image-1.png" alt="RideGuard — signal path from camera, ultrasound and motion sensor to processor, decision and alerts"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257943914-image-1.png" alt="RideGuard — exploded view of the rear sensor pod: shell, camera, ultrasonic transducers, boards, battery, clamp"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257894214-image-1.png" alt="RideGuard — bench test of the sensor pod against a target along a tape measure"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792257949742-image-1.png" alt="RideGuard — power and wiring concept from battery through regulator to sensors, processor and motor"></div>
        </div>
    </div>
</body>
</html>
