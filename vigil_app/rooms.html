<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F5F6FB;width:100%;height:100%;margin:0;overflow:hidden;color:#0F1330}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 20px}
.content.full{height:calc(100% - 59px)}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid #E7E9F5;display:flex;justify-content:space-around;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A5C4;font-size:10px;font-weight:500}.tab.active{color:#4F46E5}.tab i{font-size:22px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 20px rgba(79,70,229,.07)}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.g-ind{background:linear-gradient(135deg,#818CF8,#4F46E5)}.g-grn{background:linear-gradient(135deg,#34D399,#059669)}.g-amb{background:linear-gradient(135deg,#FBBF24,#F59E0B)}.g-red{background:linear-gradient(135deg,#FB7185,#E11D48)}.g-vio{background:linear-gradient(135deg,#C084FC,#7C3AED)}.g-sky{background:linear-gradient(135deg,#38BDF8,#0284C7)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sw{width:46px;height:28px;border-radius:14px;background:#4F46E5;position:relative;flex-shrink:0}.sw::after{content:'';position:absolute;right:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%}.sw.off{background:#D5D8EA}.sw.off::after{right:auto;left:3px}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}.ping{animation:ping 2.4s infinite}</style></head><body><div class="screen" style="color:#0F1330">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span></div>
<div class="content" style="color:#0F1330">
<div class="flex items-center justify-between mt-2 mb-4"><h1 class="text-2xl font-bold">Live view</h1><span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full"><span class="dot bg-emerald-500 mr-1.5"></span>Real time</span></div>
<div class="flex gap-2 mb-4">
 <span class="px-4 py-2 rounded-full text-xs font-bold text-white g-ind">Kitchen</span><span class="px-4 py-2 rounded-full text-xs font-bold bg-white text-slate-500">Bedroom</span><span class="px-4 py-2 rounded-full text-xs font-bold bg-white text-slate-500">Living</span><span class="px-4 py-2 rounded-full text-xs font-bold bg-white text-slate-500">Bath</span>
</div>
<div class="rounded-[28px] relative overflow-hidden" style="height:330px;background:#0F1330">
 <svg viewBox="0 0 370 330" class="absolute inset-0 w-full h-full">
  <defs><radialGradient id="c" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#818CF8" stop-opacity=".55"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient></defs>
  <path d="M185 8 L20 300 A190 190 0 0 0 350 300 Z" fill="url(#c)"/>
  <g fill="none" stroke="#818CF8" stroke-opacity=".35"><circle cx="185" cy="8" r="90"/><circle cx="185" cy="8" r="170"/><circle cx="185" cy="8" r="250"/></g>
  <g fill="#A5B4FC" opacity=".8"><circle cx="90" cy="230" r="2.5"/><circle cx="96" cy="236" r="2"/><circle cx="84" cy="240" r="2"/><circle cx="300" cy="200" r="2.5"/><circle cx="306" cy="208" r="2"/><circle cx="294" cy="212" r="2"/><circle cx="310" cy="220" r="2"/></g>
  <g fill="#34D399"><circle cx="210" cy="150" r="5"/><circle cx="205" cy="160" r="4"/><circle cx="215" cy="163" r="4"/><circle cx="208" cy="172" r="4"/><circle cx="212" cy="140" r="4"/><circle cx="200" cy="150" r="3"/><circle cx="220" cy="152" r="3"/><circle cx="207" cy="185" r="3"/><circle cx="214" cy="186" r="3"/></g>
  <circle cx="210" cy="160" r="30" fill="none" stroke="#34D399" stroke-opacity=".6" stroke-width="1.5"><animate attributeName="r" values="22;40" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".7;0" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="185" cy="8" r="9" fill="#4F46E5" stroke="#fff" stroke-width="2"/>
 </svg>
 <div class="absolute top-3 left-4 text-white/80 text-[11px] font-semibold"><i class="fas fa-shield-halved mr-1"></i>Point cloud only. No image is captured.</div>
 <div class="absolute bottom-3 left-4 right-4 flex justify-between text-[11px] text-white/70 font-semibold"><span>Sensor on north wall</span><span>4.2 m range</span></div>
</div>
<div class="grid grid-cols-3 gap-3 mt-4">
 <div class="card !p-3 text-center"><i class="fas fa-person-walking text-emerald-500 text-xl"></i><p class="text-lg font-black mt-1">Walking</p><p class="text-[10px] text-slate-500">Posture</p></div>
 <div class="card !p-3 text-center"><i class="fas fa-gauge-high text-indigo-500 text-xl"></i><p class="text-lg font-black mt-1">0.9 m/s</p><p class="text-[10px] text-slate-500">Gait speed</p></div>
 <div class="card !p-3 text-center"><i class="fas fa-lungs text-sky-500 text-xl"></i><p class="text-lg font-black mt-1">1 person</p><p class="text-[10px] text-slate-500">Detected</p></div>
</div>
<div class="card mt-3 flex items-center gap-3"><div class="tile g-grn"><i class="fas fa-check"></i></div><p class="text-sm font-semibold flex-1">Fall watch active, response under 3 seconds</p></div>
</div>
<div class="tab-bar"><div class="tab"><i class="fas fa-house"></i><span>Home</span></div><div class="tab active"><i class="fas fa-tower-broadcast"></i><span>Live</span></div><div class="tab"><i class="fas fa-chart-simple"></i><span>Activity</span></div><div class="tab"><i class="fas fa-user-group"></i><span>Circle</span></div><div class="tab"><i class="fas fa-shield-halved"></i><span>Privacy</span></div></div>
</div></body></html>
