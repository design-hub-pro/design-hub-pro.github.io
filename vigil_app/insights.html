<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insights</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F5F6FB;width:100%;height:100%;margin:0;overflow:hidden;color:#0F1330}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 20px}
.content.full{height:calc(100% - 59px)}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid #E7E9F5;display:flex;justify-content:space-around;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A5C4;font-size:10px;font-weight:500}.tab.active{color:#4F46E5}.tab i{font-size:22px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 20px rgba(79,70,229,.07)}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.g-ind{background:linear-gradient(135deg,#818CF8,#4F46E5)}.g-grn{background:linear-gradient(135deg,#34D399,#059669)}.g-amb{background:linear-gradient(135deg,#FBBF24,#F59E0B)}.g-red{background:linear-gradient(135deg,#FB7185,#E11D48)}.g-vio{background:linear-gradient(135deg,#C084FC,#7C3AED)}.g-sky{background:linear-gradient(135deg,#38BDF8,#0284C7)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sw{width:46px;height:28px;border-radius:14px;background:#4F46E5;position:relative;flex-shrink:0}.sw::after{content:'';position:absolute;right:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%}.sw.off{background:#D5D8EA}.sw.off::after{right:auto;left:3px}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}.ping{animation:ping 2.4s infinite}</style></head><body><div class="screen" style="color:#0F1330">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span></div>
<div class="content" style="color:#0F1330">
<div class="mt-2 mb-4"><h1 class="text-2xl font-bold">Trends</h1><p class="text-xs text-slate-500">Changes worth a phone call</p></div>
<div class="rounded-[26px] p-5 text-white relative overflow-hidden" style="background:linear-gradient(135deg,#FBBF24,#F59E0B 60%,#D97706)">
 <div class="absolute rounded-full bg-white/15" style="width:150px;height:150px;top:-50px;right:-30px"></div>
 <span class="bg-white/25 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase relative">Unusual pattern</span>
 <p class="text-[40px] font-black leading-none mt-3 relative">3x<span class="text-lg font-bold"> night bathroom trips</span></p>
 <p class="text-sm opacity-95 mt-1.5 relative">Linked with UTI in older adults. Consider a check-in.</p>
</div>
<div class="card mt-4">
 <div class="flex justify-between items-center"><p class="font-bold text-sm">Night bathroom trips</p><span class="text-[11px] text-slate-400 font-semibold">7 days</span></div>
 <div class="flex items-end gap-2 mt-4" style="height:110px"><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:9px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">M</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:9px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">T</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:18px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">W</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:9px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">T</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:18px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">F</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:27px;background:#F59E0B"></div><span class="text-[10px] text-slate-400 font-semibold">S</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg" style="height:27px;background:#C7CBF3"></div><span class="text-[10px] text-slate-400 font-semibold">S</span></div></div>
</div>
<div class="grid grid-cols-2 gap-3 mt-3">
 <div class="card"><div class="tile g-grn !w-9 !h-9 !text-sm mb-2"><i class="fas fa-gauge-high"></i></div><p class="text-[28px] font-black leading-none">0.9<span class="text-sm text-slate-400"> m/s</span></p><p class="text-[11px] text-slate-500 mt-1"><span class="dot bg-emerald-500 mr-1"></span>Gait speed, steady</p></div>
 <div class="card"><div class="tile g-vio !w-9 !h-9 !text-sm mb-2"><i class="fas fa-bed"></i></div><p class="text-[28px] font-black leading-none">7.2<span class="text-sm text-slate-400"> h</span></p><p class="text-[11px] text-slate-500 mt-1"><span class="dot bg-emerald-500 mr-1"></span>Sleep, normal</p></div>
</div>
<div class="card mt-3 flex items-center gap-3"><div class="tile g-ind"><i class="fas fa-brain"></i></div><div class="flex-1"><p class="text-sm font-bold">Learning baseline</p><div class="h-2 bg-slate-100 rounded-full mt-2"><div class="h-2 rounded-full g-ind" style="width:86%"></div></div></div><span class="text-sm font-black text-indigo-600">86%</span></div>
</div>
<div class="tab-bar"><div class="tab"><i class="fas fa-house"></i><span>Home</span></div><div class="tab"><i class="fas fa-tower-broadcast"></i><span>Live</span></div><div class="tab active"><i class="fas fa-chart-simple"></i><span>Activity</span></div><div class="tab"><i class="fas fa-user-group"></i><span>Circle</span></div><div class="tab"><i class="fas fa-shield-halved"></i><span>Privacy</span></div></div>
</div></body></html>
