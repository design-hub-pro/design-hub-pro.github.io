<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fall Alert</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F5F6FB;width:100%;height:100%;margin:0;overflow:hidden;color:#0F1330}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 20px}
.content.full{height:calc(100% - 59px)}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid #E7E9F5;display:flex;justify-content:space-around;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A5C4;font-size:10px;font-weight:500}.tab.active{color:#4F46E5}.tab i{font-size:22px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 20px rgba(79,70,229,.07)}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.g-ind{background:linear-gradient(135deg,#818CF8,#4F46E5)}.g-grn{background:linear-gradient(135deg,#34D399,#059669)}.g-amb{background:linear-gradient(135deg,#FBBF24,#F59E0B)}.g-red{background:linear-gradient(135deg,#FB7185,#E11D48)}.g-vio{background:linear-gradient(135deg,#C084FC,#7C3AED)}.g-sky{background:linear-gradient(135deg,#38BDF8,#0284C7)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sw{width:46px;height:28px;border-radius:14px;background:#4F46E5;position:relative;flex-shrink:0}.sw::after{content:'';position:absolute;right:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%}.sw.off{background:#D5D8EA}.sw.off::after{right:auto;left:3px}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}.ping{animation:ping 2.4s infinite}body{background:linear-gradient(180deg,#3B0F2A,#1B0F1E 70%)!important}body{background:linear-gradient(180deg,#3B0F2A,#1B0F1E 70%)}</style></head><body><div class="screen" style="color:#fff">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span></div>
<div class="content full" style="color:#fff">
<div class="text-center mt-2">
 <div class="relative mx-auto" style="width:150px;height:150px">
  <div class="absolute inset-0 rounded-full bg-rose-500/30 ping"></div><div class="absolute rounded-full bg-rose-500/30 ping" style="inset:20px;animation-delay:.6s"></div>
  <img src="https://randomuser.me/api/portraits/women/68.jpg" class="absolute rounded-full object-cover border-4 border-white" style="inset:28px;width:94px;height:94px">
  <div class="absolute bottom-3 right-3 w-11 h-11 rounded-full g-red flex items-center justify-center text-white border-4 border-[#1B0F1E]"><i class="fas fa-person-falling"></i></div>
 </div>
 <span class="inline-block bg-rose-500 text-white text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wide mt-1">Fall detected</span>
 <h1 class="text-[34px] font-black leading-tight mt-3">Margaret may<br>need help</h1>
 <p class="text-sm text-white/70 mt-2">Bathroom &middot; 9:38 AM &middot; 3 min ago</p>
</div>
<div class="grid grid-cols-3 gap-2 mt-6">
 <div class="rounded-2xl bg-white/10 p-3 text-center"><p class="text-2xl font-black">0.4s</p><p class="text-[10px] text-white/60 mt-0.5">Sudden drop</p></div>
 <div class="rounded-2xl bg-white/10 p-3 text-center"><p class="text-2xl font-black">45s</p><p class="text-[10px] text-white/60 mt-0.5">No movement</p></div>
 <div class="rounded-2xl bg-white/10 p-3 text-center"><p class="text-2xl font-black">Low</p><p class="text-[10px] text-white/60 mt-0.5">Height on floor</p></div>
</div>
<div class="rounded-2xl bg-white/10 p-3.5 mt-3 flex items-center gap-3">
 <div class="flex"><img src="https://randomuser.me/api/portraits/men/45.jpg" style="width:34px;height:34px;border:2px solid #2A1530" class="rounded-full object-cover -ml-2 first:ml-0"><img src="https://randomuser.me/api/portraits/women/44.jpg" style="width:34px;height:34px;border:2px solid #2A1530" class="rounded-full object-cover -ml-2 first:ml-0"><img src="https://randomuser.me/api/portraits/women/65.jpg" style="width:34px;height:34px;border:2px solid #2A1530" class="rounded-full object-cover -ml-2 first:ml-0"></div>
 <div class="flex-1"><p class="text-sm font-bold">Circle notified</p><p class="text-[11px] text-white/60">Dan is calling now</p></div>
 <span class="dot bg-emerald-400"></span>
</div>
<button class="w-full mt-5 py-4 rounded-2xl text-white font-bold text-base g-red shadow-lg"><i class="fas fa-phone mr-2"></i>Call Margaret</button>
<div class="grid grid-cols-2 gap-3 mt-3">
 <button class="py-3.5 rounded-2xl bg-white text-rose-600 font-bold text-sm"><i class="fas fa-truck-medical mr-2"></i>Call 911</button>
 <button class="py-3.5 rounded-2xl bg-white/15 text-white font-bold text-sm"><i class="fas fa-check mr-2"></i>I'm on my way</button>
</div>
<p class="text-center text-[11px] text-white/50 mt-4">False alarm? Margaret can say "I'm OK" or tap her pendant.</p>
</div>

</div></body></html>
