<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentora — Lesson</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
<style>
  .lesson-screen{background:#0F0E1F;color:#fff}
  .lesson-screen .status-bar .time,.lesson-screen .status-bar .icons{color:#fff}
  .glass-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:24px}
</style>
</head>
<body>
<div class="screen lesson-screen">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="content pt-2 pb-8">
    <!-- Top nav -->
    <div class="flex items-center justify-between mb-4">
      <button class="w-10 h-10 rounded-full glass-card flex items-center justify-center">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </button>
      <div class="text-center">
        <p class="text-[10px] uppercase tracking-widest text-white/60">SAT Math · Lesson 3 of 7</p>
        <p class="text-[13px] font-semibold">Quadratic functions</p>
      </div>
      <button class="w-10 h-10 rounded-full glass-card flex items-center justify-center">
        <i class="fa-solid fa-ellipsis text-[14px]"></i>
      </button>
    </div>

    <!-- Progress -->
    <div class="flex items-center gap-1 mb-5">
      <div class="flex-1 h-1 rounded-full bg-white"></div>
      <div class="flex-1 h-1 rounded-full bg-white"></div>
      <div class="flex-1 h-1 rounded-full bg-white"></div>
      <div class="flex-1 h-1 rounded-full" style="background:linear-gradient(90deg,#fff 60%,rgba(255,255,255,0.2) 60%)"></div>
      <div class="flex-1 h-1 rounded-full bg-white/20"></div>
      <div class="flex-1 h-1 rounded-full bg-white/20"></div>
      <div class="flex-1 h-1 rounded-full bg-white/20"></div>
    </div>

    <!-- Concept callout -->
    <div class="mb-4">
      <p class="text-[11px] uppercase tracking-widest text-[#8B7DFF] mb-2">Concept · Visual mode</p>
      <h1 class="font-display text-[26px] leading-tight font-extrabold mb-2">
        Where does the parabola turn?
      </h1>
      <p class="text-[13px] text-white/70 leading-relaxed">
        The <span class="text-[#FFB547] font-semibold">vertex</span> is the highest or lowest point. Watch how changing <span class="font-mono text-[#5BC0FF]">h</span> shifts it.
      </p>
    </div>

    <!-- Visual graph -->
    <div class="rounded-3xl overflow-hidden mb-4 relative" style="background:linear-gradient(135deg,#1E1B3A 0%,#0F0E1F 100%);height:260px">
      <!-- Graph SVG -->
      <svg viewBox="0 0 400 280" class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="parabola" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FB7185"/>
            <stop offset="100%" stop-color="#4F3FFF"/>
          </linearGradient>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="400" height="280" fill="url(#grid)"/>
        <!-- axes -->
        <line x1="0" y1="180" x2="400" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <line x1="200" y1="0" x2="200" y2="280" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <!-- parabola -->
        <path d="M 40 30 Q 200 380 360 30" stroke="url(#parabola)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- vertex point -->
        <circle cx="200" cy="220" r="9" fill="#FFB547"/>
        <circle cx="200" cy="220" r="14" fill="none" stroke="#FFB547" stroke-width="2" opacity="0.4"/>
        <!-- vertex label -->
        <g transform="translate(200,220)">
          <rect x="14" y="-18" rx="6" width="84" height="22" fill="#FFB547"/>
          <text x="56" y="-3" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#1A1A2E" text-anchor="middle">vertex (h,k)</text>
        </g>
        <!-- formula -->
        <g transform="translate(28,40)">
          <rect rx="10" width="140" height="34" fill="rgba(91,192,255,0.18)" stroke="rgba(91,192,255,0.5)"/>
          <text x="70" y="22" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#5BC0FF" text-anchor="middle">y = a(x−h)² + k</text>
        </g>
      </svg>
      <!-- top right play button -->
      <button class="absolute top-3 right-3 glass-card w-9 h-9 rounded-full flex items-center justify-center text-white text-[12px]">
        <i class="fa-solid fa-expand"></i>
      </button>
      <!-- bottom slider -->
      <div class="absolute bottom-3 left-4 right-4">
        <p class="text-[10px] text-white/60 mb-1.5 font-mono">h = 2.0</p>
        <div class="bar !bg-white/15"><div class="bg-[#FFB547]" style="width:60%"></div></div>
      </div>
    </div>

    <!-- Mode toggle -->
    <div class="flex gap-2 mb-4">
      <button class="flex-1 h-12 rounded-2xl bg-white text-[#1A1A2E] flex items-center justify-center gap-2 text-[12px] font-bold">
        <i class="fa-solid fa-eye text-[#4F3FFF]"></i> Visual
      </button>
      <button class="flex-1 h-12 rounded-2xl glass-card flex items-center justify-center gap-2 text-[12px] font-semibold">
        <i class="fa-solid fa-headphones text-[#FF6B6B]"></i> Audio
      </button>
      <button class="flex-1 h-12 rounded-2xl glass-card flex items-center justify-center gap-2 text-[12px] font-semibold">
        <i class="fa-solid fa-book-open text-[#22C495]"></i> Read
      </button>
    </div>

    <!-- AI Narrator -->
    <div class="glass-card p-4 mb-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full gradient-coral flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-wand-magic-sparkles text-white text-[15px]"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] text-white/60 mb-1">Mentora · narrating</p>
          <div class="flex items-center gap-1 text-[#FB7185]">
            <div class="wave"><span style="height:6px"></span><span style="height:14px"></span><span style="height:20px"></span><span style="height:10px"></span><span style="height:18px"></span><span style="height:6px"></span><span style="height:14px"></span><span style="height:8px"></span><span style="height:20px"></span><span style="height:12px"></span><span style="height:6px"></span><span style="height:16px"></span></div>
          </div>
        </div>
        <button class="w-10 h-10 rounded-full bg-white text-[#1A1A2E] flex items-center justify-center">
          <i class="fa-solid fa-pause text-[12px]"></i>
        </button>
      </div>
    </div>

    <!-- CTA -->
    <button class="w-full h-[58px] rounded-full text-white font-display font-bold text-[15px] flex items-center justify-center gap-3 gradient-primary shadow-glow">
      Try it yourself
      <span class="w-7 h-7 rounded-full bg-white flex items-center justify-center">
        <i class="fa-solid fa-arrow-right text-[#4F3FFF] text-[11px]"></i>
      </span>
    </button>
  </div>
</div>
</body>
</html>
