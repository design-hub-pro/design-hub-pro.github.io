<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentora — Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="content pt-1">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center border border-[#1A1A2E]/8">
        <i class="fa-solid fa-xmark text-[14px]"></i>
      </button>
      <div class="text-center">
        <p class="text-[10px] uppercase tracking-widest text-[#6B6F7A]">Sprint quiz</p>
        <p class="font-display text-[13px] font-bold">Question 4 of 12</p>
      </div>
      <div class="flex items-center gap-1.5 bg-[#1A1A2E] text-white rounded-full px-3 h-10">
        <i class="fa-regular fa-clock text-[11px] text-[#FFB547]"></i>
        <span class="text-[12px] font-bold">14:32</span>
      </div>
    </div>

    <!-- Question progress -->
    <div class="flex gap-1 mb-5">
      <div class="flex-1 h-1.5 rounded-full bg-[#22C495]"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#22C495]"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#FB7185]"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#4F3FFF]"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
      <div class="flex-1 h-1.5 rounded-full bg-[#1A1A2E]/10"></div>
    </div>

    <!-- Topic tag -->
    <div class="flex items-center gap-2 mb-3">
      <span class="tag"><i class="fa-solid fa-square-root-variable"></i> Algebra II</span>
      <span class="tag" style="background:rgba(251,113,133,0.15);color:#FB7185"><i class="fa-solid fa-fire"></i> Weak area</span>
    </div>

    <!-- Question -->
    <h2 class="font-display text-[20px] leading-tight font-bold mb-4">
      If <span class="font-mono text-[#4F3FFF]">f(x) = 2x² − 4x + 1</span>, what is the <span class="underline decoration-[#FFB547] decoration-4 underline-offset-4">vertex</span> of the parabola?
    </h2>

    <!-- Visual aid -->
    <div class="rounded-2xl overflow-hidden mb-5 relative" style="background:#1A1A2E;height:160px">
      <svg viewBox="0 0 400 200" class="absolute inset-0 w-full h-full">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F3FFF"/>
            <stop offset="100%" stop-color="#FB7185"/>
          </linearGradient>
          <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="400" height="200" fill="url(#grid2)"/>
        <line x1="0" y1="140" x2="400" y2="140" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <line x1="200" y1="0" x2="200" y2="200" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <path d="M 80 20 Q 230 320 380 20" stroke="url(#g1)" stroke-width="4" fill="none"/>
        <circle cx="230" cy="155" r="8" fill="#FFB547"/>
        <text x="245" y="148" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#FFB547">?</text>
      </svg>
    </div>

    <!-- Answer options -->
    <div class="space-y-2.5 mb-5">
      <div class="card !p-3 flex items-center gap-3 border-2 border-[#1A1A2E]/8">
        <div class="w-8 h-8 rounded-full bg-[#F6F1E8] flex items-center justify-center font-bold text-[12px]">A</div>
        <p class="font-mono text-[14px] flex-1">(1, −1)</p>
      </div>
      <div class="card !p-3 flex items-center gap-3 border-2" style="border-color:#4F3FFF;background:linear-gradient(135deg,#fff,#EEEBFF)">
        <div class="w-8 h-8 rounded-full gradient-primary text-white flex items-center justify-center font-bold text-[12px]">B</div>
        <p class="font-mono text-[14px] flex-1 font-bold text-[#4F3FFF]">(1, −1)</p>
        <i class="fa-solid fa-circle-check text-[#4F3FFF] text-[18px]"></i>
      </div>
      <div class="card !p-3 flex items-center gap-3 border-2 border-[#1A1A2E]/8">
        <div class="w-8 h-8 rounded-full bg-[#F6F1E8] flex items-center justify-center font-bold text-[12px]">C</div>
        <p class="font-mono text-[14px] flex-1">(2, 1)</p>
      </div>
      <div class="card !p-3 flex items-center gap-3 border-2 border-[#1A1A2E]/8">
        <div class="w-8 h-8 rounded-full bg-[#F6F1E8] flex items-center justify-center font-bold text-[12px]">D</div>
        <p class="font-mono text-[14px] flex-1">(−1, 7)</p>
      </div>
    </div>

    <!-- Hint card from Mentora -->
    <div class="card !p-3 mb-5 flex items-start gap-3" style="background:linear-gradient(135deg,#FFF6E6,#FFE4D6)">
      <div class="w-9 h-9 rounded-full gradient-amber flex items-center justify-center flex-shrink-0 text-white">
        <i class="fa-solid fa-lightbulb text-[14px]"></i>
      </div>
      <div class="flex-1">
        <p class="text-[11px] font-bold text-[#FF6B6B] mb-0.5">Mentora · guiding</p>
        <p class="text-[12px] leading-snug text-[#1A1A2E]">
          Try completing the square. What value of <span class="font-mono">h</span> makes the inside a perfect square?
        </p>
      </div>
    </div>

    <!-- Bottom action -->
    <div class="flex gap-2">
      <button class="w-14 h-[56px] rounded-full bg-white border border-[#1A1A2E]/8 flex items-center justify-center">
        <i class="fa-solid fa-lightbulb text-[#FFB547] text-[16px]"></i>
      </button>
      <button class="flex-1 h-[56px] rounded-full bg-[#1A1A2E] text-white font-display font-bold text-[14px] flex items-center justify-center gap-3">
        Check answer
        <span class="w-6 h-6 rounded-full bg-white flex items-center justify-center">
          <i class="fa-solid fa-arrow-right text-[#1A1A2E] text-[10px]"></i>
        </span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
