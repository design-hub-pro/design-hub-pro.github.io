<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyUp — Find Players</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; background: #f5f5f4; overflow: hidden; }
.status-bar { height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; position: relative; }
.dynamic-island { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 124px; height: 36px; background: black; border-radius: 20px; }
.tab-bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.05);
  display: flex; padding: 14px 28px 28px;
}
.player-card {
  position: absolute; left: 28px; right: 28px; top: 18px;
  height: 480px;
  border-radius: 32px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.18);
}
.card-img-1 { background-image: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.85) 100%), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=900&q=80'); background-size: cover; background-position: center; }
.card-img-2 { background-image: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85) 100%), url('https://images.unsplash.com/photo-1551958219-acbc608c6377?w=900&q=80'); background-size: cover; background-position: center; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="screen">
  <!-- Status bar -->
  <div class="status-bar bg-stone-100">
    <span class="text-sm font-semibold text-zinc-900">9:41</span>
    <div class="dynamic-island"></div>
    <div class="flex items-center gap-1.5 text-zinc-900">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-sm"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="px-7 pt-2 pb-4 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full bg-white border border-zinc-200 flex items-center justify-center">
      <i class="fas fa-chevron-left text-zinc-700 text-sm"></i>
    </button>
    <div class="text-center">
      <p class="text-[10px] uppercase tracking-wider font-bold text-zinc-500">Tennis • Within 5 mi</p>
      <p class="text-[15px] font-black text-zinc-900">Find players</p>
    </div>
    <button class="w-10 h-10 rounded-full bg-white border border-zinc-200 flex items-center justify-center">
      <i class="fas fa-sliders text-zinc-700 text-sm"></i>
    </button>
  </div>

  <!-- Card stack area -->
  <div class="relative" style="height: 540px;">
    <!-- Background card 2 -->
    <div class="player-card card-img-2" style="transform: scale(0.94) translateY(8px); opacity: 0.5;">
    </div>

    <!-- Foreground card 1 -->
    <div class="player-card card-img-1">
      <!-- Top tags -->
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between">
        <div class="flex items-center gap-2 bg-white/15 backdrop-blur-md rounded-full px-3 py-1.5">
          <span class="w-1.5 h-1.5 bg-lime-400 rounded-full animate-pulse"></span>
          <span class="text-[10px] font-bold uppercase tracking-wider text-white">Online now</span>
        </div>
        <span class="bg-lime-400 text-zinc-900 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-full">93% match</span>
      </div>

      <!-- Bottom info -->
      <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
        <div class="flex items-end justify-between mb-3">
          <div>
            <h2 class="text-[28px] font-black leading-tight">Maya, 28</h2>
            <p class="text-sm text-white/80 mt-0.5"><i class="fas fa-location-dot text-lime-400 mr-1"></i> 0.8 mi away</p>
          </div>
          <span class="bg-white/15 backdrop-blur-md rounded-full px-3 py-2 text-[11px] font-bold flex items-center gap-1">
            <i class="fas fa-star text-yellow-400"></i> 4.9
          </span>
        </div>
        <!-- Skill row -->
        <div class="grid grid-cols-3 gap-2 mb-3">
          <div class="bg-white/10 backdrop-blur-md rounded-xl p-2 text-center">
            <p class="text-[9px] uppercase tracking-wider opacity-70 font-bold">Skill</p>
            <p class="text-[16px] font-black text-lime-400">B+</p>
          </div>
          <div class="bg-white/10 backdrop-blur-md rounded-xl p-2 text-center">
            <p class="text-[9px] uppercase tracking-wider opacity-70 font-bold">Plays</p>
            <p class="text-[16px] font-black">4×/wk</p>
          </div>
          <div class="bg-white/10 backdrop-blur-md rounded-xl p-2 text-center">
            <p class="text-[9px] uppercase tracking-wider opacity-70 font-bold">Win</p>
            <p class="text-[16px] font-black">73%</p>
          </div>
        </div>
        <!-- Sport tags -->
        <div class="flex flex-wrap gap-1.5">
          <span class="bg-white/15 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fas fa-table-tennis-paddle-ball text-yellow-400 mr-1"></i> Tennis</span>
          <span class="bg-white/15 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fas fa-baseball-bat-ball text-blue-400 mr-1"></i> Pickleball</span>
          <span class="bg-white/15 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fas fa-person-running text-orange-400 mr-1"></i> Running</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="absolute left-0 right-0 px-7 flex items-center justify-center gap-4" style="bottom: 130px;">
    <button class="w-14 h-14 rounded-full bg-white border border-zinc-200 flex items-center justify-center shadow-md">
      <i class="fas fa-xmark text-zinc-400 text-xl"></i>
    </button>
    <button class="w-16 h-16 rounded-full bg-lime-400 flex items-center justify-center shadow-xl shadow-lime-400/40">
      <i class="fas fa-handshake text-zinc-900 text-2xl"></i>
    </button>
    <button class="w-14 h-14 rounded-full bg-white border border-zinc-200 flex items-center justify-center shadow-md">
      <i class="fas fa-bolt text-orange-500 text-xl"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="flex-1 flex flex-col items-center gap-1">
      <i class="fas fa-house text-zinc-400 text-[18px]"></i>
      <span class="text-[10px] font-medium text-zinc-400">Home</span>
    </button>
    <button class="flex-1 flex flex-col items-center gap-1">
      <i class="fas fa-map-location-dot text-zinc-400 text-[18px]"></i>
      <span class="text-[10px] font-medium text-zinc-400">Map</span>
    </button>
    <button class="flex-1 flex items-center justify-center">
      <div class="w-12 h-12 rounded-full bg-lime-400 flex items-center justify-center -mt-3 shadow-lg shadow-lime-400/40">
        <i class="fas fa-plus text-zinc-900 text-lg"></i>
      </div>
    </button>
    <button class="flex-1 flex flex-col items-center gap-1">
      <i class="fas fa-trophy text-zinc-400 text-[18px]"></i>
      <span class="text-[10px] font-medium text-zinc-400">Tournaments</span>
    </button>
    <button class="flex-1 flex flex-col items-center gap-1">
      <i class="fas fa-user text-zinc-400 text-[18px]"></i>
      <span class="text-[10px] font-medium text-zinc-400">Profile</span>
    </button>
  </div>
</div>
</body>
</html>
