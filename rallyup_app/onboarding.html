<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyUp — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; background: #0a0a0a; color: white; overflow: hidden; }
.status-bar { height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; position: relative; z-index: 10; }
.dynamic-island { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 124px; height: 36px; background: black; border-radius: 20px; }
.hero-bg {
  position: absolute; inset: 0;
  background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?w=900&q=80') center/cover;
}
.hero-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.5) 40%, rgba(10,10,10,0.95) 75%, #0a0a0a 100%);
}
.glow { box-shadow: 0 0 40px rgba(163, 230, 53, 0.5); }
.sport-chip {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
}
.sport-chip.active {
  background: #a3e635;
  border-color: #a3e635;
  color: #0a0a0a;
}
</style>
</head>
<body>
<div class="screen">
  <!-- Hero background -->
  <div class="hero-bg"></div>

  <!-- Status bar -->
  <div class="status-bar relative">
    <span class="text-sm font-semibold text-white">9:41</span>
    <div class="dynamic-island"></div>
    <div class="flex items-center gap-1.5 text-white">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-sm"></i>
    </div>
  </div>

  <!-- Content -->
  <div class="relative z-10 px-7 pt-10">
    <!-- Logo -->
    <div class="flex items-center gap-2.5 mb-8">
      <div class="w-10 h-10 rounded-xl bg-lime-400 flex items-center justify-center glow">
        <i class="fas fa-bolt text-zinc-900 text-lg"></i>
      </div>
      <span class="text-xl font-black tracking-tight">RallyUp</span>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="absolute left-0 right-0 bottom-0 z-10 px-7 pb-10">
    <div class="mb-2 inline-flex items-center gap-2 bg-lime-400/15 border border-lime-400/30 rounded-full px-3 py-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-lime-400 animate-pulse"></span>
      <span class="text-[11px] font-semibold text-lime-400 uppercase tracking-wider">2,481 games today</span>
    </div>
    <h1 class="text-[42px] leading-[1.05] font-black tracking-tight mb-3">
      Find your<br/>game. Anytime.
    </h1>
    <p class="text-zinc-400 text-[15px] leading-relaxed mb-7">
      Match with players nearby, schedule pickup games, join tournaments. The community sports app.
    </p>

    <!-- Pick sports -->
    <div class="mb-6">
      <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-3">Pick what you play</p>
      <div class="flex flex-wrap gap-2">
        <button class="sport-chip active rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5">
          <i class="fas fa-basketball"></i> Basketball
        </button>
        <button class="sport-chip rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5 text-white">
          <i class="fas fa-futbol"></i> Soccer
        </button>
        <button class="sport-chip active rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5">
          <i class="fas fa-table-tennis-paddle-ball"></i> Tennis
        </button>
        <button class="sport-chip rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5 text-white">
          <i class="fas fa-volleyball"></i> Volleyball
        </button>
        <button class="sport-chip active rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5">
          <i class="fas fa-baseball-bat-ball"></i> Pickleball
        </button>
        <button class="sport-chip rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5 text-white">
          <i class="fas fa-person-running"></i> Running
        </button>
        <button class="sport-chip rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5 text-white">
          <i class="fas fa-person-biking"></i> Cycling
        </button>
        <button class="sport-chip rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-1.5 text-white">
          <i class="fas fa-plus"></i> 12 more
        </button>
      </div>
    </div>

    <!-- CTA -->
    <button class="w-full bg-lime-400 text-zinc-900 font-bold text-[16px] py-4 rounded-2xl flex items-center justify-center gap-2 glow">
      Get Started <i class="fas fa-arrow-right text-sm"></i>
    </button>
    <p class="text-center text-xs text-zinc-500 mt-4">Already have an account? <span class="text-white font-semibold">Sign in</span></p>
  </div>
</div>
</body>
</html>
