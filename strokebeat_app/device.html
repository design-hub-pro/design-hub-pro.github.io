<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>StrokeBeat</title></head><body><div class="screen">
<div class="status"><span>6:24</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<div class="scroll">
 <div class="flex items-center justify-between mt-3">
  <h1 class="text-[28px] font-black tracking-tight">Device</h1>
  <div class="navbtn"><i class="fas fa-plus"></i></div>
 </div>

 <div class="relative rounded-[28px] overflow-hidden mt-4 h-[236px] text-white">
  <img src="assets/mount.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:60% 62%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,26,46,.45) 0%,rgba(7,26,46,0) 40%,rgba(7,26,46,.9) 100%)"></div>
  <div class="relative p-5 h-full flex flex-col justify-between">
   <span class="self-start px-3 py-1.5 rounded-full bg-white/20 backdrop-blur text-[11.5px] font-bold flex items-center gap-2"><span class="dot bg-emerald-400"></span>CONNECTED</span>
   <div class="flex items-end justify-between">
    <div><div class="text-[24px] font-black tracking-tight leading-none">StrokeBox 01</div><div class="text-[12.5px] text-white/75 font-medium mt-1.5">Clipped to the footplate deck</div></div>
    <div class="flex items-center gap-1.5 text-[15px] font-black num"><i class="fas fa-battery-three-quarters text-emerald-400"></i>86%</div>
   </div>
  </div>
 </div>

 <div class="seg mt-4"><div><i class="fas fa-mobile-screen"></i>Phone sensors</div><div class="on"><i class="fas fa-microchip text-teal-600"></i>StrokeBox</div></div>

 <div class="grid grid-cols-3 gap-3 mt-4">
  <div class="card p-4"><div class="flex items-baseline gap-1"><span class="text-[28px] font-black num leading-none">100</span><span class="text-[12px] font-bold text-slate-400">Hz</span></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">sample rate</div></div>
  <div class="card p-4"><div class="flex items-baseline gap-1"><span class="text-[28px] font-black num leading-none">6</span><span class="text-[12px] font-bold text-slate-400">axis</span></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">accel + gyro</div></div>
  <div class="card p-4"><div class="flex items-baseline gap-1"><span class="text-[28px] font-black num leading-none">14</span><span class="text-[12px] font-bold text-slate-400">files</span></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">synced</div></div>
 </div>

 <div class="section-h"><h3>Mount check</h3><span><i class="fas fa-rotate mr-1"></i>Recalibrate</span></div>
 <div class="card p-5 flex items-center gap-5">
  <div class="relative w-[104px] h-[104px] rounded-full flex-shrink-0" style="background:radial-gradient(circle,#F0FDFA 0%,#CCFBF1 100%)">
   <div class="absolute inset-[22px] rounded-full border-2 border-dashed border-teal-600/40"></div>
   <div class="absolute left-1/2 top-0 bottom-0 w-px bg-teal-600/20"></div><div class="absolute top-1/2 left-0 right-0 h-px bg-teal-600/20"></div>
   <div class="absolute w-[26px] h-[26px] rounded-full grad-teal" style="left:44px;top:35px;box-shadow:0 6px 12px -4px rgba(13,148,136,.7)"></div>
  </div>
  <div class="flex-1 space-y-3">
   <div class="flex items-center justify-between text-[13.5px] font-semibold"><span class="flex items-center gap-2"><span class="dot bg-emerald-500"></span>Level</span><b class="num">1.2°</b></div>
   <div class="flex items-center justify-between text-[13.5px] font-semibold"><span class="flex items-center gap-2"><span class="dot bg-emerald-500"></span>Points to bow</span><b class="num">3° off</b></div>
   <div class="flex items-center justify-between text-[13.5px] font-semibold"><span class="flex items-center gap-2"><span class="dot bg-amber-400"></span>Strap</span><b>Tighten</b></div>
  </div>
 </div>

 <div class="card p-4 mt-3.5 flex items-center gap-3.5">
  <div class="icon-tile grad-navy"><i class="fas fa-file-csv"></i></div>
  <div class="flex-1"><div class="text-[15px] font-extrabold">Export raw data</div><div class="text-[12px] text-slate-500 font-medium">Acceleration, stroke times, cue labels</div></div>
  <span class="px-3.5 py-2 rounded-full bg-teal-50 text-teal-700 text-[12.5px] font-bold">CSV</span>
 </div>
</div>
<div class="tabbar"><div class="tab"><i class="fas fa-house"></i>Home</div><div class="tab"><i class="fas fa-chart-simple"></i>Tests</div><div class="tab"><div class="fab"><i class="fas fa-play"></i></div></div><div class="tab"><i class="fas fa-people-group"></i>Squad</div><div class="tab on"><i class="fas fa-microchip"></i>Device</div></div><div class="home-ind"></div>
</div></body></html>
