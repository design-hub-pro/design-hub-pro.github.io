<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrokeBeat App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  html, body { background: #ffffff; }
  body { font-family: 'Inter', sans-serif; color: #0A2540; margin: 0; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  .phone { width: 460px; height: 980px; background: #0B0B14; border-radius: 62px; padding: 12px; box-shadow: 0 40px 80px -24px rgba(15,23,42,.28), 0 12px 24px -10px rgba(15,23,42,.16); }
  .phone-screen { width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #fff; }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 460px); gap: 56px; justify-content: center; }
  @media (max-width: 1540px) { .grid-3 { grid-template-columns: repeat(2, 460px); } }
  @media (max-width: 1020px) { .grid-3 { grid-template-columns: 460px; } }
</style>
</head>
<body>
<header class="text-center pt-16 pb-14 px-6">
  <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center" style="background:linear-gradient(135deg,#2DD4BF,#0D9488 60%,#0F5F66)">
    <i class="fas fa-wave-square text-white text-2xl"></i>
  </div>
  <h1 class="text-5xl font-black tracking-tight mt-6">StrokeBeat</h1>
  <p class="text-lg text-slate-500 mt-3">Row to silence, a metronome and music, then see which one keeps a junior rower's stroke steadiest.</p>
  <div class="flex justify-center gap-2 mt-5">
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-teal-50 text-teal-700">Rowing</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Audio Cues</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Sensor Data</span>
    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Coaching</span>
  </div>
</header>
<main class="grid-3 pb-24 px-6">
  <div class="phone"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="setup.html" scrolling="no" title="setup"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="cues.html" scrolling="no" title="cues"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="live.html" scrolling="no" title="live"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="result.html" scrolling="no" title="result"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="stroke.html" scrolling="no" title="stroke"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="squad.html" scrolling="no" title="squad"></iframe></div></div>
  <div class="phone"><div class="phone-screen"><iframe src="device.html" scrolling="no" title="device"></iframe></div></div>
</main>
</body>
</html>
