<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>StrokeBeat</title></head><body><div class="screen">
<div class="status light"><span>6:24</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<img src="assets/hero.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:55% 50%">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,37,64,.5) 0%,rgba(10,37,64,0) 26%,rgba(10,37,64,.15) 46%,rgba(7,26,46,.94) 74%,#071A2E 100%)"></div>
<div class="absolute left-0 right-0 top-[84px] px-7 flex items-center gap-3 text-white">
 <div class="w-11 h-11 rounded-[14px] grad-teal flex items-center justify-center"><i class="fas fa-wave-square text-[18px]"></i></div>
 <div class="text-[20px] font-extrabold tracking-tight">StrokeBeat</div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-7 pb-[52px] text-white">
 <div class="eyebrow text-teal-300">On-boat rhythm coach</div>
 <h1 class="text-[40px] leading-[1.04] font-black tracking-tight mt-3">Find the beat that steadies your stroke.</h1>
 <p class="text-[15.5px] text-white/70 mt-4 leading-snug">Row three pieces. One in silence, one to a metronome, one to music. See which keeps your timing tightest.</p>
 <div class="flex gap-2.5 mt-6">
  <div class="flex-1 h-[74px] rounded-[20px] bg-white/10 backdrop-blur border border-white/15 flex flex-col items-center justify-center gap-1.5"><i class="fas fa-volume-xmark text-slate-200 text-[18px]"></i><span class="text-[12px] font-bold">Silence</span></div>
  <div class="flex-1 h-[74px] rounded-[20px] bg-white/10 backdrop-blur border border-teal-300/60 flex flex-col items-center justify-center gap-1.5"><i class="fas fa-wave-square text-teal-300 text-[18px]"></i><span class="text-[12px] font-bold">Metronome</span></div>
  <div class="flex-1 h-[74px] rounded-[20px] bg-white/10 backdrop-blur border border-white/15 flex flex-col items-center justify-center gap-1.5"><i class="fas fa-music text-orange-300 text-[18px]"></i><span class="text-[12px] font-bold">Music</span></div>
 </div>
 <button class="mt-6 h-[58px] w-full rounded-[20px] grad-teal font-extrabold text-[17px] flex items-center justify-center gap-2.5">Set up my first test<i class="fas fa-arrow-right text-[14px]"></i></button>
 <div class="text-center text-[13.5px] text-white/60 font-semibold mt-4">I'm a coach &nbsp;<span class="text-white">Add my squad</span></div>
</div>
<div class="home-ind light"></div>
</div></body></html>
