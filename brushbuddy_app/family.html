<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>20:20</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:4px">
      <div class="h1">Family</div>
      <div class="iconbtn"><i class="fas fa-gear"></i></div>
    </div>

    <div class="px" style="margin-top:16px">
      <div class="card" style="padding:18px">
        <div class="row" style="gap:14px">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431771-image-1.png" style="width:62px;height:62px;border-radius:20px;object-fit:cover">
          <div style="flex:1"><div style="font-weight:900;font-size:19px">Leo, 8</div><div class="row xs" style="gap:10px;font-weight:800;margin-top:4px;color:#4A6470"><span><i class="fas fa-tooth" style="color:#14B8A6"></i> BB-4F2A</span><span><i class="fas fa-battery-three-quarters" style="color:#16A34A"></i> 86%</span></div></div>
          <span class="dot c-clean"></span>
        </div>
        <div style="margin-top:16px;padding:14px;border-radius:18px;background:#F0FBF9">
          <div class="row between small" style="font-weight:900"><span><i class="fas fa-wand-magic-sparkles" style="color:#0E9F9A"></i> Buddy knows Leo's mouth</span><span style="color:#0E9F9A">Done</span></div>
          <div class="bar" style="margin-top:8px;background:#D3F2EC"><span style="width:100%;background:#14B8A6"></span></div>
          <div class="xs muted" style="font-weight:700;margin-top:6px">Zone model tuned from 10 sessions</div>
        </div>
      </div>
    </div>

    <div class="px" style="margin-top:12px">
      <div class="card" style="padding:18px">
        <div class="row" style="gap:14px">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431942-image-1.png" style="width:62px;height:62px;border-radius:20px;object-fit:cover">
          <div style="flex:1"><div style="font-weight:900;font-size:19px">Mia, 6</div><div class="row xs" style="gap:10px;font-weight:800;margin-top:4px;color:#4A6470"><span><i class="fas fa-tooth" style="color:#F43F5E"></i> BB-77D1</span><span><i class="fas fa-battery-quarter" style="color:#F59E0B"></i> 22%</span></div></div>
          <span class="dot c-miss"></span>
        </div>
        <div style="margin-top:16px;padding:14px;border-radius:18px;background:#FFF8E6">
          <div class="row between small" style="font-weight:900"><span><i class="fas fa-wand-magic-sparkles" style="color:#D97706"></i> Learning Mia's style</span><span style="color:#D97706">4 / 10</span></div>
          <div class="bar" style="margin-top:8px;background:#FDECC0"><span style="width:40%;background:#F59E0B"></span></div>
          <div class="xs muted" style="font-weight:700;margin-top:6px">Zone hints get sharper each brush</div>
        </div>
      </div>
    </div>

    <div class="px row" style="gap:12px;margin-top:12px">
      <div class="card" style="flex:1;padding:16px;border:2px dashed #BFD3DA;box-shadow:none;background:transparent;text-align:center"><div style="font-size:22px;color:#0E9F9A"><i class="fas fa-user-plus"></i></div><div style="font-weight:900;margin-top:6px">Add child</div></div>
      <div class="card" style="flex:1;padding:16px;text-align:center"><div style="font-size:22px;color:#2563EB"><i class="fas fa-user-doctor"></i></div><div style="font-weight:900;margin-top:6px">Share with dentist</div></div>
    </div>

    <div class="px" style="margin-top:12px">
      <div class="card row" style="padding:14px 18px;gap:14px">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431340-image-1.png" class="av" style="width:44px;height:44px">
        <div style="flex:1"><div style="font-weight:900">Parent account</div><div class="xs muted" style="font-weight:700">PIN locks settings</div></div>
        <span class="pill" style="background:#EEE9FF;color:#6D28D9"><i class="fas fa-lock"></i>Secured</span>
      </div>
    </div>
  </div>
  <div class="tabbar"><div class="tab"><i class="fas fa-house"></i>Home</div><div class="tab"><i class="fas fa-chart-simple"></i>Progress</div><div class="tab"><div class="fab"><i class="fas fa-tooth"></i></div></div><div class="tab"><i class="fas fa-star"></i>Rewards</div><div class="tab on"><i class="fas fa-user-group"></i>Family</div></div>
</div>
</body>
</html>
