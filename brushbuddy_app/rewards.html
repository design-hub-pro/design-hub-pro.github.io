<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>18:02</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:4px">
      <div class="h1">Rewards</div>
      <span class="pill" style="background:#FEF9C3;color:#A16207;font-size:16px;padding:9px 14px"><i class="fas fa-coins"></i>420</span>
    </div>

    <div class="px" style="margin-top:16px">
      <div style="position:relative;height:300px;border-radius:30px;overflow:hidden;background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431697-image-1.png) center/cover">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(6,60,72,.85))"></div>
        <span class="pill" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92);color:#0B8C80">Level 7</span>
        <div style="position:absolute;left:20px;right:20px;bottom:18px;color:#fff">
          <div style="font-size:28px;font-weight:900">Chompy</div>
          <div class="row between xs" style="font-weight:800;opacity:.9;margin-top:6px"><span>Grows with every clean brush</span><span>340 / 500</span></div>
          <div class="bar" style="background:rgba(255,255,255,.25);margin-top:8px"><span style="width:68%;background:#FDE047"></span></div>
        </div>
      </div>
    </div>

    <div class="px row between" style="margin-top:22px"><div class="h2">Sticker book</div><span class="small muted" style="font-weight:800">6 / 24</span></div>
    <div class="px" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px"><div style="aspect-ratio:1;border-radius:22px;background:#14B8A6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #14B8A640"><i class="fas fa-tooth"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#7C3AED;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #7C3AED40"><i class="fas fa-rocket"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#F59E0B;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #F59E0B40"><i class="fas fa-crown"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#16A34A;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #16A34A40"><i class="fas fa-dragon"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#F43F5E;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #F43F5E40"><i class="fas fa-feather"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#2563EB;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 18px #2563EB40"><i class="fas fa-moon"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#E6EEF1;display:flex;align-items:center;justify-content:center;color:#A6B8BF;font-size:26px;box-shadow:none"><i class="fas fa-lock"></i></div><div style="aspect-ratio:1;border-radius:22px;background:#E6EEF1;display:flex;align-items:center;justify-content:center;color:#A6B8BF;font-size:26px;box-shadow:none"><i class="fas fa-lock"></i></div></div>

    <div class="px row between" style="margin-top:22px"><div class="h2">Shop</div></div>
    <div class="hscroll" style="margin-top:12px">
      <div class="card" style="min-width:132px;padding:14px;text-align:center"><div style="font-size:34px;color:#7C3AED"><i class="fas fa-hat-wizard"></i></div><div style="font-weight:900;margin-top:6px">Wizard hat</div><div class="pill" style="background:#FEF9C3;color:#A16207;margin-top:8px"><i class="fas fa-coins"></i>150</div></div>
      <div class="card" style="min-width:132px;padding:14px;text-align:center"><div style="font-size:34px;color:#F43F5E"><i class="fas fa-mask"></i></div><div style="font-weight:900;margin-top:6px">Hero mask</div><div class="pill" style="background:#FEF9C3;color:#A16207;margin-top:8px"><i class="fas fa-coins"></i>220</div></div>
      <div class="card" style="min-width:132px;padding:14px;text-align:center"><div style="font-size:34px;color:#0891B2"><i class="fas fa-music"></i></div><div style="font-weight:900;margin-top:6px">Brush song</div><div class="pill" style="background:#FEF9C3;color:#A16207;margin-top:8px"><i class="fas fa-coins"></i>300</div></div>
    </div>
  </div>
  <div class="tabbar"><div class="tab"><i class="fas fa-house"></i>Home</div><div class="tab"><i class="fas fa-chart-simple"></i>Progress</div><div class="tab"><div class="fab"><i class="fas fa-tooth"></i></div></div><div class="tab on"><i class="fas fa-star"></i>Rewards</div><div class="tab"><i class="fas fa-user-group"></i>Family</div></div>
</div>
</body>
</html>
