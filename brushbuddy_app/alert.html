<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen" style="background:linear-gradient(180deg,#BE123C 0%,#881337 100%)">
  <div class="scroll" style="padding-bottom:30px">
    <div class="status light"><span>7:45</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:4px;color:#fff">
      <div class="iconbtn" style="background:rgba(255,255,255,.14);color:#fff;box-shadow:none"><i class="fas fa-pause"></i></div>
      <span class="pill" style="background:rgba(255,255,255,.18);color:#fff"><i class="fas fa-mobile-screen-button"></i>Sleeve buzzing</span>
      <div style="width:44px;color:#fff;font-weight:900;font-size:18px;text-align:right">1:31</div>
    </div>

    <div style="text-align:center;margin-top:26px;color:#fff">
      <div style="position:relative;width:130px;height:130px;margin:0 auto">
        <div class="pulse" style="position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.16)"></div>
        <div style="position:absolute;inset:18px;border-radius:50%;background:#fff;color:#E11D48;display:flex;align-items:center;justify-content:center;font-size:42px"><i class="fas fa-feather-pointed"></i></div>
      </div>
      <div style="font-size:36px;font-weight:900;letter-spacing:-1px;margin-top:18px">Easy, gentle!</div>
      <div style="font-size:17px;font-weight:700;opacity:.88;margin-top:4px">Bottom front · outside</div>
    </div>

    <div style="margin-top:16px">
      <svg viewBox="0 0 300 280" width="300" style="display:block;margin:0 auto;overflow:visible"><defs><filter id="glowa" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#F43F5E" stroke-width="46" fill="none" stroke-linecap="round" filter="url(#glowa)" class="pulse"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#F43F5E" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#DCE6EA" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/></svg>
    </div>

    <div class="px row" style="gap:12px;margin-top:18px">
      <div style="flex:1;border-radius:22px;padding:16px;background:rgba(255,255,255,.13);color:#fff">
        <div class="xs" style="opacity:.75;font-weight:800">Pressure</div>
        <div class="row" style="align-items:baseline;gap:4px"><span style="font-size:32px;font-weight:900">2.9</span><span style="font-weight:800;opacity:.75">N</span></div>
        <div class="bar" style="background:rgba(255,255,255,.2);margin-top:8px"><span style="width:92%;background:#fff"></span></div>
        <div class="xs" style="opacity:.75;font-weight:800;margin-top:6px">Leo's limit 2.0 N</div>
      </div>
      <div style="flex:1;border-radius:22px;padding:16px;background:rgba(255,255,255,.13);color:#fff">
        <div class="xs" style="opacity:.75;font-weight:800">Scrub speed</div>
        <div class="row" style="align-items:baseline;gap:4px"><span style="font-size:32px;font-weight:900">5.4</span><span style="font-weight:800;opacity:.75">/s</span></div>
        <div class="bar" style="background:rgba(255,255,255,.2);margin-top:8px"><span style="width:86%;background:#FDE047"></span></div>
        <div class="xs" style="opacity:.75;font-weight:800;margin-top:6px">Aim for 3</div>
      </div>
    </div>

    <div class="px" style="margin-top:14px">
      <div class="row" style="gap:14px;border-radius:22px;padding:14px 16px;background:#fff">
        <div class="ico" style="background:#FFE4E8;color:#E11D48"><i class="fas fa-rotate"></i></div>
        <div style="flex:1"><div style="font-weight:900">Tiny circles</div><div class="xs muted" style="font-weight:700">Like polishing a pebble</div></div>
        <div class="row" style="gap:4px"><span class="dot c-over"></span><span class="dot c-over" style="opacity:.5"></span><span class="dot c-over" style="opacity:.25"></span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
