<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen" style="background:#fff">
  <div style="position:absolute;left:0;right:0;top:0;height:470px;background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431621-image-1.png) center/cover"></div>
  <div style="position:absolute;left:0;right:0;top:250px;height:220px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)"></div>
  <div class="scroll" style="padding-bottom:30px">
    <div class="status"><span>7:38</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px">
      <span class="pill" style="background:rgba(255,255,255,.9);color:#0F2A33"><i class="fab fa-bluetooth-b" style="color:#2563EB"></i>Searching</span>
      <span class="pill" style="background:rgba(255,255,255,.9);color:#0F2A33">Step 1 of 3</span>
    </div>
    <div style="height:300px"></div>
    <div class="px">
      <div class="h1" style="font-size:32px">Meet your Buddy</div>
      <div class="muted" style="font-size:16px;margin-top:6px;font-weight:600">Hold the button for 3 seconds until the ring glows blue.</div>
    </div>
    <div class="px" style="margin-top:22px">
      <div class="card" style="padding:18px;border:2px solid #14B8A6">
        <div class="row" style="gap:14px">
          <div class="ico grad-teal" style="width:56px;height:56px;border-radius:18px;font-size:24px"><i class="fas fa-tooth"></i></div>
          <div style="flex:1">
            <div style="font-weight:900;font-size:17px">BrushBuddy Sleeve</div>
            <div class="xs muted" style="font-weight:700">BB-4F2A · 0.4 m away</div>
          </div>
          <div style="width:30px;height:30px;border-radius:50%;background:#14B8A6;color:#fff;display:flex;align-items:center;justify-content:center"><i class="fas fa-check" style="font-size:13px"></i></div>
        </div>
        <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">
          <span class="pill ok"><i class="fas fa-battery-full"></i>86%</span>
          <span class="pill info"><i class="fas fa-signal"></i>Strong</span>
          <span class="pill" style="background:#EEE9FF;color:#6D28D9"><i class="fas fa-lock"></i>Encrypted pairing</span>
        </div>
      </div>
      <div class="card row" style="padding:14px 18px;margin-top:12px;gap:14px;opacity:.6">
        <div class="ico" style="background:#E6EEF1;color:#66808A"><i class="fas fa-tooth"></i></div>
        <div style="flex:1"><div style="font-weight:800">BrushBuddy Sleeve</div><div class="xs muted" style="font-weight:700">BB-91C0 · in use by another family</div></div>
        <i class="fas fa-lock muted"></i>
      </div>
    </div>
    <div class="px row" style="gap:8px;justify-content:center;margin-top:24px">
      <span style="width:26px;height:8px;border-radius:9px;background:#14B8A6"></span><span style="width:8px;height:8px;border-radius:9px;background:#D5E0E4"></span><span style="width:8px;height:8px;border-radius:9px;background:#D5E0E4"></span>
    </div>
    <div class="px" style="margin-top:20px"><div class="btn primary"><i class="fas fa-link"></i>Pair with Leo's brush</div></div>
  </div>
</div>
</body>
</html>
