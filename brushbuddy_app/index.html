<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy · Smart toothbrush sleeve for kids</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', -apple-system, sans-serif; background: #ffffff; color: #0F2A33; -webkit-font-smoothing: antialiased; }
  .hero { text-align: center; padding: 64px 20px 36px; }
  .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 1rem; background: linear-gradient(135deg, #14B8A6, #0891B2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; box-shadow: 0 12px 28px rgba(8,145,178,.3); }
  h1 { font-size: 48px; font-weight: 900; letter-spacing: -1.5px; }
  .tagline { font-size: 18px; color: #66808A; margin-top: 10px; font-weight: 600; }
  .tags { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .tags span { font-size: 13px; font-weight: 700; color: #4A6470; background: #F0F5F7; padding: 6px 14px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(3, 460px); gap: 48px 40px; justify-content: center; padding: 20px 40px 80px; }
  @media (max-width: 1540px) { .grid { grid-template-columns: repeat(2, 460px); } }
  @media (max-width: 1020px) { .grid { grid-template-columns: 460px; } }
  .phone { width: 460px; height: 980px; border-radius: 62px; padding: 12px; background: #0B0B0F; box-shadow: 0 0 0 2px #2A2A31 inset, 0 30px 70px rgba(15,42,51,.18), 0 10px 24px rgba(15,42,51,.10); }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 52px; display: block; background: #F3F8F9; }
</style>
</head>
<body>
  <header class="hero">
    <div class="logo"><i class="fas fa-tooth"></i></div>
    <h1>BrushBuddy</h1>
    <p class="tagline">A toothbrush sleeve that shows kids which teeth they missed or scrubbed too hard, live.</p>
    <div class="tags"><span>Kids Health</span><span>Bluetooth IoT</span><span>Motion Sensing</span><span>Gamification</span></div>
  </header>
  <main class="grid">
    <div class="phone"><iframe src="pair.html" scrolling="no" title="Pair sleeve"></iframe></div>
    <div class="phone"><iframe src="home.html" scrolling="no" title="Home"></iframe></div>
    <div class="phone"><iframe src="live.html" scrolling="no" title="Live brushing"></iframe></div>
    <div class="phone"><iframe src="alert.html" scrolling="no" title="Too-hard alert"></iframe></div>
    <div class="phone"><iframe src="result.html" scrolling="no" title="Session result"></iframe></div>
    <div class="phone"><iframe src="progress.html" scrolling="no" title="Parent progress"></iframe></div>
    <div class="phone"><iframe src="rewards.html" scrolling="no" title="Rewards"></iframe></div>
    <div class="phone"><iframe src="family.html" scrolling="no" title="Family"></iframe></div>
    <div class="phone"><iframe src="settings.html" scrolling="no" title="Feedback settings"></iframe></div>
  </main>
</body>
</html>
