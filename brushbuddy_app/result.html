<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<div class="screen" style="background:#fff">

    <div class="px row between" style="margin-top:4px">
      <div class="iconbtn"><i class="fas fa-xmark"></i></div>
      <span class="pill ok" style="font-size:14px"><i class="fas fa-fire"></i>7 day streak</span>
      <div class="iconbtn"><i class="fas fa-share-nodes"></i></div>
    </div>
    <div style="text-align:center;margin-top:16px">
      <div class="xs muted" style="font-weight:800;letter-spacing:.5px">MORNING BRUSH · 2:04</div>
      <div style="font-size:32px;font-weight:900;letter-spacing:-.8px;margin-top:2px">Sparkly, Leo!</div>
    </div>
    <div style="position:relative;margin-top:8px">
      <svg viewBox="0 0 300 280" width="290" style="display:block;margin:0 auto;overflow:visible"><defs><filter id="glowr" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#FBBF24" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2     <div class="px row" style="gap:12px;margin-top:20px">
      <div class="card" style="flex:1;padding:14px;text-align:center"><div class="big" style="color:#0E9F9A">10</div><div class="xs muted" style="font-weight:800;margin-top:4px">Clean zones</div></div>
      <div class="card" style="flex:1;padding:14px;text-align:center"><div class="big" style="color:#D97706">1</div><div class="xs muted" style="font-weight:800;margin-top:4px">Missed</div></div>
      <div class="card" style="flex:1;padding:14px;text-align:center"><div class="big" style="color:#E11D48">1</div><div class="xs muted" style="font-weight:800;margin-top:4px">Too hard</div></div>
    </div>

    <div class="px" style="margin-top:14px">
      <div style="position:relative;height:150px;border-radius:24px;overflow:hidden;background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806432152-image-1.png) center/cover">
        <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,42,51,.85),rgba(15,42,51,.1))"></div>
        <div style="position:absolute;left:18px;top:20px;color:#fff;max-width:200px">
          <span class="pill" style="background:#FBBF24;color:#0F2A33">Tip for you</span>

        <span style="position:absolute;right:14px;bottom:12px;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px">0:45</span>
      </div>
    </div>

    <div class="px" style="margin-top:16px"><div class="btn primary"><i class="fas fa-coins" style="color:#FDE047"></i>Collect +30 coins</div></div>
