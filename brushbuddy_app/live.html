<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen" style="background:linear-gradient(180deg,#0E7490 0%,#0B4F63 100%)">
  <div class="scroll" style="padding-bottom:30px">
    <div class="status light"><span>7:44</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:4px;color:#fff">
      <div class="iconbtn" style="background:rgba(255,255,255,.14);color:#fff;box-shadow:none"><i class="fas fa-xmark"></i></div>
      <span class="pill" style="background:rgba(255,255,255,.14);color:#fff"><i class="fab fa-bluetooth-b"></i>Live · 50 Hz</span>
      <div class="iconbtn" style="background:rgba(255,255,255,.14);color:#fff;box-shadow:none"><i class="fas fa-volume-high"></i></div>
    </div>

    <div class="px row between" style="margin-top:22px;color:#fff">
      <div>
        <div style="font-size:14px;font-weight:800;opacity:.75">Now brushing</div>
        <div style="font-size:30px;font-weight:900;letter-spacing:-.6px;line-height:1.1">Top left<br>inside</div>
      </div>
      <div style="position:relative;width:108px;height:108px">
        <svg viewBox="0 0 108 108" width="108" height="108"><circle cx="54" cy="54" r="46" stroke="rgba(255,255,255,.15)" stroke-width="10" fill="none"/><circle cx="54" cy="54" r="46" stroke="#FDE047" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="173.4 289.0" transform="rotate(-90 54 54)"/></svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff"><div style="font-size:26px;font-weight:900">1:12</div><div class="xs" style="opacity:.7;font-weight:800">of 2:00</div></div>
      </div>
    </div>

    <div style="margin-top:20px;position:relative">
      <svg viewBox="0 0 300 280" width="360" style="display:block;margin:0 auto;overflow:visible"><defs><filter id="glowl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#3B82F6" stroke-width="35" fill="none" stroke-linecap="round" filter="url(#glowl)" class="pulse"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#3B82F6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#DCE6EA" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#DCE6EA" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><g transform="translate(150 140)"><circle r="26" fill="rgba(255,255,255,.12)"/><text text-anchor="middle" y="7" font-size="20" font-weight="900" fill="#fff" font-family="Nunito">7/12</text></g></svg>
    </div>
    <div style="margin-top:14px"><div class="row" style="justify-content:center;gap:16px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.85)"><span class="row" style="gap:6px"><span class="dot c-clean"></span>Clean</span><span class="row" style="gap:6px"><span class="dot c-miss"></span>Missed</span><span class="row" style="gap:6px"><span class="dot c-over"></span>Too hard</span></div></div>

    <div class="px" style="margin-top:22px">
      <div style="border-radius:24px;padding:18px;background:rgba(255,255,255,.1);color:#fff">
        <div class="row between"><div style="font-weight:900"><i class="fas fa-hand"></i> Pressure</div><span class="pill" style="background:#14B8A6;color:#fff">Just right</span></div>
        <div style="position:relative;margin-top:16px;height:14px;border-radius:99px;background:linear-gradient(90deg,#60A5FA 0%,#14B8A6 35%,#14B8A6 62%,#FBBF24 78%,#F43F5E 100%)">
          <div style="position:absolute;left:48%;top:-6px;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #0B4F63;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>
        </div>
        <div class="row between xs" style="margin-top:10px;font-weight:800;opacity:.7"><span>Soft</span><span>Good</span><span>Too hard</span></div>
      </div>
    </div>

    <div class="px row" style="gap:12px;margin-top:14px">
      <div style="flex:1;border-radius:20px;padding:14px;background:rgba(255,255,255,.1);color:#fff"><div class="xs" style="opacity:.7;font-weight:800">Strokes / sec</div><div style="font-size:26px;font-weight:900">3.2</div></div>
      <div style="flex:1;border-radius:20px;padding:14px;background:rgba(255,255,255,.1);color:#fff"><div class="xs" style="opacity:.7;font-weight:800">Brush angle</div><div style="font-size:26px;font-weight:900">44°</div></div>
      <div style="flex:1;border-radius:20px;padding:14px;background:rgba(255,255,255,.1);color:#fff"><div class="xs" style="opacity:.7;font-weight:800">Next zone</div><div style="font-size:26px;font-weight:900"><i class="fas fa-arrow-right"></i></div></div>
    </div>
  </div>
</div>
</body>
</html>
