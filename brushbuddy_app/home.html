<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>7:42</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:4px">
      <div class="row" style="gap:12px">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806431771-image-1.png" class="av" style="width:48px;height:48px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.08)">
        <div><div class="xs muted" style="font-weight:800">Good morning</div><div class="h2" style="font-size:22px">Leo</div></div>
      </div>
      <div class="row" style="gap:10px">
        <span class="pill" style="background:#FFF4E0;color:#C2410C;font-size:15px;padding:8px 13px"><i class="fas fa-fire"></i>6</span>
        <span class="pill" style="background:#FEF9C3;color:#A16207;font-size:15px;padding:8px 13px"><i class="fas fa-coins"></i>420</span>
      </div>
    </div>

    <div class="px" style="margin-top:20px">
      <div style="position:relative;height:330px;border-radius:30px;overflow:hidden;background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806432215-image-1.png) center/cover">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,80,90,0) 30%,rgba(6,60,72,.88))"></div>
        <span class="pill" style="position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);color:#0B8C80"><span class="dot c-clean pulse"></span>Sleeve ready · 86%</span>
        <div style="position:absolute;left:22px;right:22px;bottom:22px;color:#fff">
          <div style="font-size:14px;font-weight:800;opacity:.85">Morning brush</div>
          <div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.05">Clean all 12 zones</div>
          <div class="row between" style="margin-top:16px">
            <div class="row" style="gap:14px;font-weight:800;font-size:14px"><span><i class="fas fa-stopwatch"></i> 2:00</span><span><i class="fas fa-coins" style="color:#FDE047"></i> +30</span></div>
            <div style="height:50px;padding:0 22px;border-radius:18px;background:#fff;color:#0891B2;font-weight:900;display:flex;align-items:center;gap:8px"><i class="fas fa-play"></i>Start</div>
          </div>
        </div>
      </div>
    </div>

    <div class="px" style="margin-top:18px">
      <div class="card row" style="padding:16px 18px;gap:16px">
        <div style="width:118px;flex-shrink:0"><svg viewBox="0 0 300 280" width="118" style="display:block;margin:0 auto;overflow:visible"><defs><filter id="glowh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 119.3 A112 100 0 0 1 85.8 46.1" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 39.7 A112 100 0 0 1 202.6 39.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 46.1 A112 100 0 0 1 261.6 119.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 122.6 A74 62 0 0 1 107.6 77.2" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 73.3 A74 62 0 0 1 184.7 73.3" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#FBBF24" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 77.2 A74 62 0 0 1 223.7 122.6" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M38.4 160.7 A112 100 0 0 0 85.8 233.9" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#F43F5E" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M97.4 240.3 A112 100 0 0 0 202.6 240.3" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#14B8A6" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M214.2 233.9 A112 100 0 0 0 261.6 160.7" stroke="#fff" stroke-opacity=".75" stroke-width="32" fill="none" stroke-dasharray="2 14"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M76.3 157.4 A74 62 0 0 0 107.6 202.8" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M115.3 206.7 A74 62 0 0 0 184.7 206.7" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#14B8A6" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M192.4 202.8 A74 62 0 0 0 223.7 157.4" stroke="#fff" stroke-opacity=".75" stroke-width="21" fill="none" stroke-dasharray="2 10"/></svg></div>
        <div style="flex:1">
          <div class="xs muted" style="font-weight:800">Last night</div>
          <div class="row" style="gap:8px;align-items:baseline"><span class="big">92</span><span class="pill ok">+6</span></div>
          <div class="row" style="gap:12px;margin-top:10px;font-size:12.5px;font-weight:800">
            <span class="row" style="gap:5px"><span class="dot c-clean"></span>10</span>
            <span class="row" style="gap:5px"><span class="dot c-miss"></span>1</span>
            <span class="row" style="gap:5px"><span class="dot c-over"></span>1</span>
          </div>
        </div>
      </div>
    </div>

    <div class="px row between" style="margin-top:24px"><div class="h2">Today's missions</div><span class="small" style="color:#0E9F9A;font-weight:800">All</span></div>
    <div class="hscroll" style="margin-top:12px">
      <div class="card" style="min-width:170px;padding:16px">
        <div class="ico grad-sun"><i class="fas fa-shield-halved"></i></div>
        <div style="font-weight:900;margin-top:12px">Back-teeth hero</div>
        <div class="bar" style="margin-top:10px"><span style="width:66%;background:#F59E0B"></span></div>
        <div class="xs muted" style="font-weight:800;margin-top:6px">2 of 3</div>
      </div>
      <div class="card" style="min-width:170px;padding:16px">
        <div class="ico grad-teal"><i class="fas fa-feather"></i></div>
        <div style="font-weight:900;margin-top:12px">Feather touch</div>
        <div class="bar" style="margin-top:10px"><span style="width:40%;background:#14B8A6"></span></div>
        <div class="xs muted" style="font-weight:800;margin-top:6px">No hard scrubs</div>
      </div>
      <div class="card" style="min-width:170px;padding:16px">
        <div class="ico grad-violet"><i class="fas fa-moon"></i></div>
        <div style="font-weight:900;margin-top:12px">Night owl</div>
        <div class="bar" style="margin-top:10px"><span style="width:85%;background:#7C3AED"></span></div>
        <div class="xs muted" style="font-weight:800;margin-top:6px">6 of 7 nights</div>
      </div>
    </div>
  </div>
  <div class="tabbar"><div class="tab on"><i class="fas fa-house"></i>Home</div><div class="tab"><i class="fas fa-chart-simple"></i>Progress</div><div class="tab"><div class="fab"><i class="fas fa-tooth"></i></div></div><div class="tab"><i class="fas fa-star"></i>Rewards</div><div class="tab"><i class="fas fa-user-group"></i>Family</div></div>
</div>
</body>
</html>
