<!DOCTYPE html><html><body style="margin:0">
<pre id="out" style="font:13px monospace;padding:20px">measuring...</pre>
<div id="host" style="position:absolute;left:-9999px;top:0"></div>
<script>
const files=['landing.html','dashboard.html','ai-usage.html','web-content.html','music.html','settings.html','blocked.html','popup.html'];
const host=document.getElementById('host');const out=[];
(async()=>{
 for(const f of files){
  const w=(f==='popup.html')?380:1440;
  const fr=document.createElement('iframe');
  fr.style.cssText='width:'+w+'px;height:200px;border:0';
  fr.src=f;host.appendChild(fr);
  await new Promise(r=>fr.onload=r);
  await new Promise(r=>setTimeout(r,900));
  const d=fr.contentDocument;
  out.push(f+' @'+w+' => '+d.documentElement.scrollHeight);
  host.removeChild(fr);
 }
 document.getElementById('out').textContent=out.join('\n');
 window.__done=out.join('\n');
})();
</script></body></html>
