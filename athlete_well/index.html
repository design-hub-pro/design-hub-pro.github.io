<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthleteWell - AI Mental Health & Rehabilitation for Athletes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #ffffff; }

        /* iPhone 17 Pro dimensions - wider screen */
        .phone-frame {
            width: 375px;
            height: 780px;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 50px 100px -20px rgba(0, 0, 0, 0.25),
                0 30px 60px -30px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
        }

        /* Dynamic Island */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 36px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 46px;
            overflow: hidden;
            background: #1a1a2e;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: top left;
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #14b8a6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-top: 20px;
            text-align: center;
        }

        /* Responsive grid for multiple rows - 3 per row */
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-items: center;
            max-width: 1320px;
            margin: 0 auto;
        }

        @media (max-width: 1300px) {
            .screens-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 900px;
            }
        }

        @media (max-width: 850px) {
            .screens-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .phone-frame {
                width: 340px;
                height: 708px;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-white">
    <!-- Header -->
    <header class="pt-16 pb-12 px-8 text-center">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-heart-pulse text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-gray-900">AthleteWell</h1>
        </div>
        <p class="text-xl text-gray-600 max-w-2xl mx-auto leading-relaxed">
            AI-Driven Mental Health & Rehabilitation for Athletes
        </p>
        <div class="flex items-center justify-center gap-6 mt-6 text-sm text-gray-500">
            <span class="flex items-center gap-2">
                <i class="fas fa-brain text-emerald-500"></i>
                Machine Learning
            </span>
            <span class="flex items-center gap-2">
                <i class="fas fa-heart text-emerald-500"></i>
                Mental Wellness
            </span>
            <span class="flex items-center gap-2">
                <i class="fas fa-running text-emerald-500"></i>
                Rehabilitation
            </span>
        </div>
    </header>

    <!-- Phone Screens Grid -->
    <main class="px-8 pb-20">
        <div class="screens-grid">

            <!-- Row 1: Onboarding Flow -->

            <!-- Welcome Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" title="Welcome"></iframe>
                    </div>
                </div>
                <p class="screen-label">Welcome</p>
            </div>

            <!-- Sports Profile Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="sports_profile.html" title="Sports Profile"></iframe>
                    </div>
                </div>
                <p class="screen-label">Sports Profile Setup</p>
            </div>

            <!-- Home Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" title="Home"></iframe>
                    </div>
                </div>
                <p class="screen-label">Home Dashboard</p>
            </div>

            <!-- Row 2: Core Features -->

            <!-- Check-in Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="checkin.html" title="Check-in"></iframe>
                    </div>
                </div>
                <p class="screen-label">Daily Check-in</p>
            </div>

            <!-- Insights Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="insights.html" title="Insights"></iframe>
                    </div>
                </div>
                <p class="screen-label">AI Insights</p>
            </div>

            <!-- Rehabilitation Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="rehabilitation.html" title="Rehabilitation"></iframe>
                    </div>
                </div>
                <p class="screen-label">Rehabilitation</p>
            </div>

            <!-- Row 3: Support Features -->

            <!-- Exercise Guide Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="exercise_guide.html" title="Exercise Guide"></iframe>
                    </div>
                </div>
                <p class="screen-label">Exercise Guide</p>
            </div>

            <!-- Resources Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="resources.html" title="Resources"></iframe>
                    </div>
                </div>
                <p class="screen-label">Resources</p>
            </div>

            <!-- Profile Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" title="Profile"></iframe>
                    </div>
                </div>
                <p class="screen-label">Profile</p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 border-t border-gray-100">
        <p class="text-gray-400 text-sm">AthleteWell &copy; 2025 | Designed for YC Demo</p>
    </footer>
</body>
</html>
