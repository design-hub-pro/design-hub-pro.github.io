<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentryPack — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-emerald-600 to-amber-500 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-person-hiking text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">SentryPack</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A strap-mounted pod that weighs your load, checks the air, logs your route and alerts your phone.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Wearable</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Air Quality</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">GPS</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Outdoor Safety</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="hero.jpg" alt="SentryPack: pod clipped to a hiker's pack on a mountain trail"></div>
            <div class="shot-frame"><img src="object.jpg" alt="SentryPack: sensor pod beside a ruler for scale"></div>
            <div class="shot-frame"><img src="fitted.jpg" alt="SentryPack: pod on the shoulder strap with lead to the hip-belt load pad"></div>
            <div class="shot-frame"><img src="setup.jpg" alt="SentryPack: hands sliding the pod onto the strap mount"></div>
            <div class="shot-frame"><img src="signal-path.jpg" alt="SentryPack: signal path from load, air and GPS sensors to phone alert and route log"></div>
            <div class="shot-frame"><img src="exploded.jpg" alt="SentryPack: exploded stack of shell, particle sensor, GPS antenna, board, battery and clip"></div>
            <div class="shot-frame"><img src="validation.jpg" alt="SentryPack: bench check against reference weights and a reference air monitor"></div>
            <div class="shot-frame"><img src="wiring.jpg" alt="SentryPack: power concept from battery to regulator, controller, fan and radios"></div>
        </div>
    </div>
</body>
</html>
