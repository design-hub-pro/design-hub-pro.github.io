<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strata — Identify</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0C0A09;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.corner{position:absolute;width:34px;height:34px;border-color:#F59E0B;border-style:solid;border-width:0}
@keyframes scan{0%{top:6%}100%{top:94%}}
.scanline{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#F59E0B,transparent);animation:scan 2.4s ease-in-out infinite alternate;box-shadow:0 0 14px #F59E0B}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <!-- Camera feed -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782244713444-image-1.png" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0" style="background:radial-gradient(circle at 50% 42%,transparent 40%,rgba(12,10,9,.55) 100%)"></div>

  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top controls -->
  <div class="absolute top-[72px] left-0 right-0 px-7 flex items-center justify-between z-20">
    <a href="home.html" class="w-10 h-10 rounded-full bg-black/45 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark text-white"></i></a>
    <div class="bg-black/45 backdrop-blur rounded-full px-4 py-2"><span class="text-[13px] font-semibold">Identify fossil</span></div>
    <button class="w-10 h-10 rounded-full bg-black/45 backdrop-blur flex items-center justify-center"><i class="fas fa-bolt text-white"></i></button>
  </div>

  <!-- Focus frame -->
  <div class="absolute z-10" style="top:24%;left:12%;right:12%;height:44%">
    <div class="corner" style="top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:14px"></div>
    <div class="corner" style="top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:14px"></div>
    <div class="corner" style="bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:14px"></div>
    <div class="corner" style="bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:14px"></div>
    <div class="scanline"></div>
  </div>

  <!-- Hint chips -->
  <div class="absolute z-20 left-0 right-0 flex flex-col items-center gap-2" style="top:70%">
    <div class="inline-flex items-center gap-2 bg-black/55 backdrop-blur rounded-full px-3.5 py-2">
      <i class="fas fa-wand-magic-sparkles text-amber-400 text-[11px]"></i><span class="text-[12px] font-medium">Specimen detected · centering…</span>
    </div>
    <div class="inline-flex items-center gap-2 bg-black/40 backdrop-blur rounded-full px-3.5 py-1.5">
      <i class="fas fa-ruler text-white/70 text-[10px]"></i><span class="text-[11px] text-white/80">Tip: include a coin or scale bar for size</span>
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="absolute bottom-0 left-0 right-0 pb-9 pt-6 z-20" style="background:linear-gradient(180deg,transparent,rgba(12,10,9,.92))">
    <div class="flex items-center justify-center gap-8 mb-7">
      <span class="text-white/45 text-[13px] font-semibold">Library</span>
      <span class="text-amber-400 text-[13px] font-bold border-b-2 border-amber-400 pb-1">Photo</span>
      <span class="text-white/45 text-[13px] font-semibold">Live ID</span>
    </div>
    <div class="flex items-center justify-around px-10">
      <div class="w-12 h-12 rounded-xl bg-white/15 bg-cover bg-center backdrop-blur border border-white/20" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782244715657-image-1.png')"></div>
      <a href="result.html" class="w-[76px] h-[76px] rounded-full border-4 border-white flex items-center justify-center">
        <div class="w-[58px] h-[58px] rounded-full" style="background:linear-gradient(135deg,#F59E0B,#B45309)"></div>
      </a>
      <button class="w-12 h-12 rounded-xl bg-white/15 backdrop-blur border border-white/20 flex items-center justify-center"><i class="fas fa-rotate text-white"></i></button>
    </div>
  </div>
</div>
</body>
</html>
