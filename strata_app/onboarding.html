<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strata — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden;background:#000}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}
.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <!-- Background -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782244712984-image-1.png" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(28,25,23,.35) 0%,rgba(28,25,23,.1) 35%,rgba(28,25,23,.85) 72%,#1C1917 100%)"></div>

  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Wordmark -->
  <div class="absolute top-[80px] left-0 right-0 flex items-center justify-center gap-2 z-20">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,#F59E0B,#B45309)"><i class="fas fa-layer-group text-white text-sm"></i></div>
    <span class="text-white text-xl font-bold tracking-tight">Strata</span>
  </div>

  <!-- Bottom content -->
  <div class="absolute left-0 right-0 bottom-0 px-7 pb-9 z-20">
    <div class="inline-flex items-center gap-2 bg-white/10 border border-white/20 rounded-full px-3 py-1.5 mb-5 backdrop-blur">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      <span class="text-white/90 text-[11px] font-semibold tracking-wide">THE PALEONTOLOGY FIELD COMPANION</span>
    </div>
    <h1 class="display text-white text-[40px] leading-[1.05] font-700 mb-3" style="font-weight:600">Read the record<br>of life on Earth.</h1>
    <p class="text-white/70 text-[15px] leading-relaxed mb-6 pr-4">Identify any fossil from a photo, decode the literature, and find where to dig — and where it's on display.</p>

    <div class="flex gap-2 mb-7">
      <div class="flex items-center gap-2 bg-white/10 border border-white/15 rounded-xl px-3 py-2 backdrop-blur"><i class="fas fa-camera text-amber-400 text-xs"></i><span class="text-white text-[11px] font-semibold">Identify</span></div>
      <div class="flex items-center gap-2 bg-white/10 border border-white/15 rounded-xl px-3 py-2 backdrop-blur"><i class="fas fa-earth-americas text-amber-400 text-xs"></i><span class="text-white text-[11px] font-semibold">Dig Map</span></div>
      <div class="flex items-center gap-2 bg-white/10 border border-white/15 rounded-xl px-3 py-2 backdrop-blur"><i class="fas fa-clock-rotate-left text-amber-400 text-xs"></i><span class="text-white text-[11px] font-semibold">Deep Time</span></div>
    </div>

    <a href="home.html" class="flex items-center justify-center gap-2 w-full py-4 rounded-2xl text-white font-bold text-[16px] mb-3" style="background:linear-gradient(135deg,#F59E0B,#B45309);box-shadow:0 14px 30px rgba(180,83,9,.45)">
      Get Started <i class="fas fa-arrow-right text-sm"></i>
    </a>
    <p class="text-center text-white/55 text-[13px]">Already have an account? <span class="text-white font-semibold">Sign in</span></p>
  </div>
</div>
</body>
</html>
