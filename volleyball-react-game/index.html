<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Volleyball Reaction Training Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap');
        .game-font { font-family: 'Orbitron', sans-serif; }
        .ui-font { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 375px;
            height: 812px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5),
                        0 30px 60px -30px rgba(0, 245, 255, 0.3),
                        inset 0 0 0 2px rgba(0, 245, 255, 0.2);
            background: #000;
            position: relative;
        }

        .phone-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0,245,255,0.4), rgba(0,245,255,0.1), rgba(139,92,246,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 50px;
        }

        .neon-text {
            text-shadow: 0 0 10px #00f5ff, 0 0 20px #00f5ff, 0 0 40px #00f5ff;
        }

        .screen-label {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-weight: 600;
            color: #9ca3af;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #111827 50%, #0a0a0a 100%);
        }

        .glow-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f5ff, transparent);
        }
    </style>
</head>
<body class="min-h-screen ui-font">
    <!-- Header -->
    <header class="pt-16 pb-12 px-8">
        <div class="max-w-7xl mx-auto text-center">
            <div class="flex items-center justify-center gap-4 mb-6">
                <div class="w-20 h-20 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <i class="fas fa-volleyball text-white text-3xl"></i>
                </div>
            </div>
            <h1 class="game-font text-5xl font-bold mb-4">
                <span class="text-cyan-400 neon-text">VOLLEY</span><span class="text-white">REACT</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto">
                Volleyball Reaction Training Game with Real-Time Pose Estimation
            </p>

            <!-- Key Features -->
            <div class="flex flex-wrap justify-center gap-4 mt-8">
                <div class="flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 px-4 py-2 rounded-full">
                    <i class="fas fa-bolt text-yellow-400"></i>
                    <span class="text-gray-300 text-sm">Reaction Training</span>
                </div>
                <div class="flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 px-4 py-2 rounded-full">
                    <i class="fas fa-user-check text-green-400"></i>
                    <span class="text-gray-300 text-sm">Pose Estimation</span>
                </div>
                <div class="flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 px-4 py-2 rounded-full">
                    <i class="fas fa-gamepad text-purple-400"></i>
                    <span class="text-gray-300 text-sm">Game Scenarios</span>
                </div>
                <div class="flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 px-4 py-2 rounded-full">
                    <i class="fas fa-trophy text-orange-400"></i>
                    <span class="text-gray-300 text-sm">Competitive Ranks</span>
                </div>
            </div>
        </div>
    </header>

    <div class="glow-line max-w-4xl mx-auto mb-12"></div>

    <!-- Screens Showcase -->
    <section class="pb-24 px-8">
        <div class="max-w-[1600px] mx-auto">
            <!-- Row 1 -->
            <div class="flex flex-wrap justify-center gap-16 mb-24">
                <!-- Home -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="home.html"></iframe>
                    </div>
                    <div class="screen-label">Game Home</div>
                </div>

                <!-- Countdown -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="countdown.html"></iframe>
                    </div>
                    <div class="screen-label">Get Ready</div>
                </div>

                <!-- Gameplay Serve Receive -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="gameplay.html"></iframe>
                    </div>
                    <div class="screen-label">Serve Receive Scenario</div>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="flex flex-wrap justify-center gap-16">
                <!-- Gameplay Block -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="gameplay-block.html"></iframe>
                    </div>
                    <div class="screen-label">Block Training</div>
                </div>

                <!-- Success -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="reaction-success.html"></iframe>
                    </div>
                    <div class="screen-label">Reaction Success</div>
                </div>

                <!-- Results -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="results.html"></iframe>
                    </div>
                    <div class="screen-label">Session Results</div>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="flex flex-wrap justify-center gap-16 mt-24">
                <!-- Leaderboard -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="leaderboard.html"></iframe>
                    </div>
                    <div class="screen-label">Leaderboard</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 border-t border-cyan-500/20">
        <div class="max-w-7xl mx-auto px-8 text-center">
            <p class="text-gray-500 text-sm">VolleyReact - High-Fidelity Game Prototype</p>
        </div>
    </footer>
</body>
</html>
