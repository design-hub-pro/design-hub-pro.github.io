<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        .game-font { font-family: 'Orbitron', sans-serif; }
        .ui-font { font-family: 'Inter', sans-serif; }

        .success-burst {
            animation: burst 0.5s ease-out forwards;
        }
        @keyframes burst {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .score-pop {
            animation: score-pop 0.6s ease-out forwards;
        }
        @keyframes score-pop {
            0% { transform: translateY(20px) scale(0.5); opacity: 0; }
            50% { transform: translateY(-10px) scale(1.1); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .confetti {
            animation: fall 2s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100px) rotate(360deg); opacity: 0; }
        }
        .skeleton-success {
            animation: skeleton-glow 0.5s ease-in-out infinite alternate;
        }
        @keyframes skeleton-glow {
            from { filter: drop-shadow(0 0 5px #22c55e); }
            to { filter: drop-shadow(0 0 15px #22c55e); }
        }
        .ring-expand {
            animation: ring-expand 0.8s ease-out forwards;
        }
        @keyframes ring-expand {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Camera Feed with Success Overlay -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&h=900&fit=crop" alt="Player" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-green-900/40 via-green-900/20 to-black/70"></div>
        </div>

        <!-- Confetti Effects -->
        <div class="absolute inset-0 overflow-hidden z-10 pointer-events-none">
            <div class="confetti absolute top-0 left-[10%] w-3 h-3 bg-yellow-400 rounded-sm" style="animation-delay: 0s;"></div>
            <div class="confetti absolute top-0 left-[30%] w-2 h-4 bg-cyan-400" style="animation-delay: 0.2s;"></div>
            <div class="confetti absolute top-0 left-[50%] w-3 h-3 bg-green-400 rounded-full" style="animation-delay: 0.4s;"></div>
            <div class="confetti absolute top-0 left-[70%] w-4 h-2 bg-pink-400" style="animation-delay: 0.1s;"></div>
            <div class="confetti absolute top-0 left-[90%] w-3 h-3 bg-purple-400 rounded-sm" style="animation-delay: 0.3s;"></div>
        </div>

        <!-- Success Ring Burst -->
        <div class="absolute top-[40%] left-1/2 z-5">
            <div class="w-40 h-40 rounded-full border-4 border-green-400 ring-expand"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative px-6 pt-3 pb-2 flex justify-between items-center z-20">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Pose Skeleton Overlay - Correct Position -->
        <div class="absolute inset-0 flex items-center justify-center z-10">
            <svg class="w-64 h-96 skeleton-success" viewBox="0 0 100 150">
                <!-- Pass ready position with platform -->
                <circle cx="50" cy="20" r="10" fill="none" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="30" x2="50" y2="70" stroke="#22c55e" stroke-width="3"/>
                <!-- Arms forming platform -->
                <line x1="50" y1="45" x2="25" y2="55" stroke="#22c55e" stroke-width="3"/>
                <line x1="25" y1="55" x2="15" y2="70" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="45" x2="75" y2="55" stroke="#22c55e" stroke-width="3"/>
                <line x1="75" y1="55" x2="85" y2="70" stroke="#22c55e" stroke-width="3"/>
                <!-- Platform line -->
                <line x1="15" y1="70" x2="85" y2="70" stroke="#22c55e" stroke-width="4"/>
                <!-- Legs in ready stance -->
                <line x1="50" y1="70" x2="35" y2="105" stroke="#22c55e" stroke-width="3"/>
                <line x1="35" y1="105" x2="30" y2="135" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="70" x2="65" y2="105" stroke="#22c55e" stroke-width="3"/>
                <line x1="65" y1="105" x2="70" y2="135" stroke="#22c55e" stroke-width="3"/>
                <!-- Joint highlights -->
                <circle cx="50" cy="45" r="4" fill="#22c55e"/>
                <circle cx="25" cy="55" r="4" fill="#22c55e"/>
                <circle cx="75" cy="55" r="4" fill="#22c55e"/>
                <circle cx="35" cy="105" r="4" fill="#22c55e"/>
                <circle cx="65" cy="105" r="4" fill="#22c55e"/>
            </svg>
        </div>

        <!-- Success Message -->
        <div class="absolute top-[15%] left-0 right-0 text-center z-20 success-burst">
            <div class="inline-flex items-center gap-3 bg-green-500/90 backdrop-blur-lg rounded-2xl px-6 py-4">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-green-500 text-2xl"></i>
                </div>
                <div class="text-left">
                    <p class="text-white/80 text-sm ui-font">PERFECT!</p>
                    <h2 class="game-font text-2xl text-white font-bold">GREAT DIG!</h2>
                </div>
            </div>
        </div>

        <!-- Score Popup -->
        <div class="absolute top-[30%] left-1/2 -translate-x-1/2 z-20 score-pop">
            <div class="text-center">
                <p class="game-font text-5xl text-yellow-400 font-bold" style="text-shadow: 0 0 20px rgba(250, 204, 21, 0.8);">+350</p>
                <p class="text-yellow-300 text-sm ui-font mt-1">COMBO x5</p>
            </div>
        </div>

        <!-- Reaction Time Card -->
        <div class="absolute bottom-44 left-0 right-0 px-5 z-20">
            <div class="bg-black/80 backdrop-blur-lg rounded-2xl p-5 border border-green-500/50">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-white font-semibold ui-font">Reaction Analysis</h3>
                    <div class="flex items-center gap-1 bg-green-500/20 px-3 py-1 rounded-full">
                        <i class="fas fa-bolt text-green-400 text-sm"></i>
                        <span class="text-green-400 text-sm game-font">FAST</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <div class="w-14 h-14 mx-auto bg-gradient-to-br from-green-500/30 to-green-600/30 rounded-xl flex items-center justify-center mb-2 border border-green-500/50">
                            <span class="game-font text-xl text-green-400">287</span>
                        </div>
                        <p class="text-gray-400 text-[10px] ui-font">Reaction (ms)</p>
                        <p class="text-green-400 text-xs font-medium">Excellent</p>
                    </div>

                    <div class="text-center">
                        <div class="w-14 h-14 mx-auto bg-gradient-to-br from-cyan-500/30 to-cyan-600/30 rounded-xl flex items-center justify-center mb-2 border border-cyan-500/50">
                            <span class="game-font text-xl text-cyan-400">94%</span>
                        </div>
                        <p class="text-gray-400 text-[10px] ui-font">Position</p>
                        <p class="text-cyan-400 text-xs font-medium">On Target</p>
                    </div>

                    <div class="text-center">
                        <div class="w-14 h-14 mx-auto bg-gradient-to-br from-purple-500/30 to-purple-600/30 rounded-xl flex items-center justify-center mb-2 border border-purple-500/50">
                            <span class="game-font text-xl text-purple-400">88°</span>
                        </div>
                        <p class="text-gray-400 text-[10px] ui-font">Platform</p>
                        <p class="text-purple-400 text-xs font-medium">Good angle</p>
                    </div>
                </div>

                <!-- Progress to next -->
                <div class="mt-4 pt-4 border-t border-white/10">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-400 ui-font">Next scenario in</span>
                        <span class="game-font text-cyan-400">1.5s</span>
                    </div>
                    <div class="h-2 bg-gray-700 rounded-full mt-2 overflow-hidden">
                        <div class="h-full w-[60%] bg-gradient-to-r from-cyan-400 to-green-400 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-30"></div>
    </div>
</body>
</html>
