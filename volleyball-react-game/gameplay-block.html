<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Block Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        .game-font { font-family: 'Orbitron', sans-serif; }
        .ui-font { font-family: 'Inter', sans-serif; }

        .attacker-highlight {
            animation: attacker-glow 0.5s ease-in-out infinite alternate;
        }
        @keyframes attacker-glow {
            from { box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
            to { box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); }
        }
        .jump-indicator {
            animation: jump-bounce 0.3s ease-in-out infinite;
        }
        @keyframes jump-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .net-line {
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 5px,
                rgba(255,255,255,0.3) 5px,
                rgba(255,255,255,0.3) 10px
            );
        }
        .zone-flash {
            animation: zone-flash 0.4s ease-in-out infinite;
        }
        @keyframes zone-flash {
            0%, 100% { background-color: rgba(59, 130, 246, 0.3); }
            50% { background-color: rgba(59, 130, 246, 0.6); }
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Court View - Net perspective -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=400&h=900&fit=crop" alt="Net View" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-black/70"></div>
        </div>

        <!-- Net Line -->
        <div class="absolute top-[40%] left-0 right-0 h-2 net-line z-10"></div>

        <!-- Status Bar -->
        <div class="relative px-6 pt-3 pb-2 flex justify-between items-center z-20">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Top HUD -->
        <div class="relative z-20 px-4 pt-2">
            <div class="flex items-center justify-between">
                <div class="bg-black/70 backdrop-blur-lg rounded-xl px-4 py-2 border border-cyan-500/30">
                    <p class="text-gray-400 text-[10px] ui-font">BLOCKS</p>
                    <p class="game-font text-2xl text-cyan-400">7/10</p>
                </div>

                <div class="bg-black/70 backdrop-blur-lg rounded-full px-5 py-3 border border-green-500/50">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-shield text-green-400"></i>
                        <span class="game-font text-xl text-green-400">BLOCK MODE</span>
                    </div>
                </div>

                <div class="bg-black/70 backdrop-blur-lg rounded-xl px-4 py-2 border border-yellow-500/30">
                    <p class="text-gray-400 text-[10px] ui-font">STREAK</p>
                    <p class="game-font text-2xl text-yellow-400">x3</p>
                </div>
            </div>
        </div>

        <!-- Opponent Side - Setter & Attackers -->
        <div class="absolute top-[15%] left-0 right-0 px-4 z-10">
            <!-- Setter indicator -->
            <div class="absolute left-[45%] top-0">
                <div class="bg-yellow-500/80 backdrop-blur-sm rounded-lg px-3 py-1">
                    <p class="text-black text-xs font-bold ui-font">SETTER</p>
                </div>
                <div class="w-0 h-0 border-l-8 border-r-8 border-t-8 border-transparent border-t-yellow-500/80 mx-auto"></div>
            </div>

            <!-- Attacker zones -->
            <div class="flex justify-between mt-12">
                <!-- Left Attacker -->
                <div class="text-center">
                    <div class="w-16 h-16 rounded-full border-2 border-dashed border-white/30 flex items-center justify-center">
                        <i class="fas fa-user text-white/50 text-xl"></i>
                    </div>
                    <p class="text-white/50 text-[10px] mt-1">Zone 4</p>
                </div>

                <!-- Middle Attacker - ACTIVE -->
                <div class="text-center attacker-highlight rounded-2xl p-2">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full border-4 border-red-500 bg-red-500/30 flex items-center justify-center">
                            <i class="fas fa-user text-red-400 text-2xl"></i>
                        </div>
                        <div class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full game-font">
                            ATTACK!
                        </div>
                    </div>
                    <p class="text-red-400 text-xs mt-1 font-bold">Zone 3</p>
                </div>

                <!-- Right Attacker -->
                <div class="text-center">
                    <div class="w-16 h-16 rounded-full border-2 border-dashed border-white/30 flex items-center justify-center">
                        <i class="fas fa-user text-white/50 text-xl"></i>
                    </div>
                    <p class="text-white/50 text-[10px] mt-1">Zone 2</p>
                </div>
            </div>
        </div>

        <!-- Your blocking position -->
        <div class="absolute bottom-[35%] left-0 right-0 px-4 z-10">
            <div class="flex justify-center gap-4">
                <!-- Left block position -->
                <div class="w-20 h-24 rounded-xl border-2 border-dashed border-white/30 flex flex-col items-center justify-center">
                    <i class="fas fa-hand-paper text-white/30 text-2xl rotate-180"></i>
                    <p class="text-white/30 text-[10px] mt-1">Left</p>
                </div>

                <!-- Center block position - TARGET -->
                <div class="w-24 h-28 rounded-xl border-4 border-blue-400 zone-flash flex flex-col items-center justify-center relative">
                    <div class="jump-indicator">
                        <i class="fas fa-hand-paper text-blue-400 text-3xl rotate-180"></i>
                        <i class="fas fa-hand-paper text-blue-400 text-3xl rotate-180 -ml-2"></i>
                    </div>
                    <p class="text-blue-400 text-xs mt-2 font-bold">JUMP HERE</p>
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-500 text-white text-[10px] px-3 py-1 rounded-full game-font">
                        <i class="fas fa-arrow-up mr-1"></i>BLOCK
                    </div>
                </div>

                <!-- Right block position -->
                <div class="w-20 h-24 rounded-xl border-2 border-dashed border-white/30 flex flex-col items-center justify-center">
                    <i class="fas fa-hand-paper text-white/30 text-2xl rotate-180"></i>
                    <p class="text-white/30 text-[10px] mt-1">Right</p>
                </div>
            </div>
        </div>

        <!-- Action Prompt -->
        <div class="absolute bottom-44 left-0 right-0 px-5 z-20">
            <div class="bg-gradient-to-r from-blue-500/90 to-indigo-600/90 backdrop-blur-lg rounded-2xl p-4 border border-blue-400/50">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-hand-paper text-white text-2xl rotate-180"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-white/80 text-xs ui-font">MIDDLE ATTACK</p>
                        <h3 class="text-white font-bold text-lg game-font">JUMP & BLOCK!</h3>
                        <p class="text-white/70 text-xs ui-font mt-1">Penetrate hands over net</p>
                    </div>
                    <div class="text-right">
                        <p class="text-white/60 text-[10px] ui-font">Jump in</p>
                        <p class="text-white text-2xl game-font font-bold">0.4s</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Pose Status -->
        <div class="absolute bottom-24 left-0 right-0 px-5 z-20">
            <div class="bg-black/70 backdrop-blur-lg rounded-xl p-3 border border-blue-500/30">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-green-400 text-sm ui-font">Ready to jump</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-center">
                            <p class="text-gray-500 text-[10px]">ARMS</p>
                            <p class="text-green-400 text-sm game-font">UP</p>
                        </div>
                        <div class="text-center">
                            <p class="text-gray-500 text-[10px]">TIMING</p>
                            <p class="text-yellow-400 text-sm game-font">WAIT</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-30"></div>
    </div>
</body>
</html>
