<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Get Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        .game-font { font-family: 'Orbitron', sans-serif; }
        .ui-font { font-family: 'Inter', sans-serif; }

        .countdown-glow {
            text-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff, 0 0 80px #00f5ff;
            animation: pulse-glow 1s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .ring-progress {
            stroke-dasharray: 440;
            stroke-dashoffset: 110;
            animation: ring-fill 3s linear forwards;
        }
        @keyframes ring-fill {
            from { stroke-dashoffset: 440; }
            to { stroke-dashoffset: 0; }
        }
        .pose-outline {
            animation: pose-flash 0.5s ease-in-out infinite alternate;
        }
        @keyframes pose-flash {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Camera Feed Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&h=900&fit=crop" alt="Player Ready" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative px-6 pt-3 pb-2 flex justify-between items-center z-10">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Pose Detection Active -->
        <div class="relative z-10 px-5 pt-4">
            <div class="bg-green-500/90 backdrop-blur-lg rounded-xl px-4 py-3 flex items-center gap-3">
                <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-check text-white"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-medium text-sm ui-font">Pose Detection Active</p>
                    <p class="text-white/70 text-xs ui-font">Stand in ready position</p>
                </div>
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Pose Guide Overlay -->
        <div class="absolute inset-0 flex items-center justify-center z-5">
            <svg class="w-56 h-80 pose-outline" viewBox="0 0 100 140">
                <!-- Ready stance silhouette -->
                <circle cx="50" cy="15" r="10" fill="none" stroke="#00f5ff" stroke-width="2"/>
                <line x1="50" y1="25" x2="50" y2="65" stroke="#00f5ff" stroke-width="2"/>
                <!-- Arms bent ready -->
                <line x1="50" y1="35" x2="25" y2="50" stroke="#00f5ff" stroke-width="2"/>
                <line x1="25" y1="50" x2="30" y2="65" stroke="#00f5ff" stroke-width="2"/>
                <line x1="50" y1="35" x2="75" y2="50" stroke="#00f5ff" stroke-width="2"/>
                <line x1="75" y1="50" x2="70" y2="65" stroke="#00f5ff" stroke-width="2"/>
                <!-- Legs bent ready -->
                <line x1="50" y1="65" x2="35" y2="100" stroke="#00f5ff" stroke-width="2"/>
                <line x1="35" y1="100" x2="30" y2="130" stroke="#00f5ff" stroke-width="2"/>
                <line x1="50" y1="65" x2="65" y2="100" stroke="#00f5ff" stroke-width="2"/>
                <line x1="65" y1="100" x2="70" y2="130" stroke="#00f5ff" stroke-width="2"/>
                <!-- Joint dots -->
                <circle cx="50" cy="35" r="3" fill="#00f5ff"/>
                <circle cx="25" cy="50" r="3" fill="#00f5ff"/>
                <circle cx="75" cy="50" r="3" fill="#00f5ff"/>
                <circle cx="50" cy="65" r="3" fill="#00f5ff"/>
                <circle cx="35" cy="100" r="3" fill="#00f5ff"/>
                <circle cx="65" cy="100" r="3" fill="#00f5ff"/>
            </svg>
        </div>

        <!-- Countdown Center -->
        <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
            <!-- Countdown Ring -->
            <div class="relative w-48 h-48">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 150 150">
                    <circle cx="75" cy="75" r="70" fill="none" stroke="rgba(0,245,255,0.2)" stroke-width="6"/>
                    <circle cx="75" cy="75" r="70" fill="none" stroke="#00f5ff" stroke-width="6" class="ring-progress" stroke-linecap="round"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="game-font text-8xl font-bold text-cyan-400 countdown-glow">3</span>
                </div>
            </div>

            <!-- Game Mode -->
            <div class="mt-8 text-center">
                <p class="text-gray-400 ui-font text-sm">Starting</p>
                <h2 class="game-font text-2xl text-white mt-1">SERVE RECEIVE</h2>
            </div>
        </div>

        <!-- Bottom Instructions -->
        <div class="absolute bottom-24 left-0 right-0 px-5 z-10">
            <div class="bg-black/60 backdrop-blur-lg rounded-2xl p-4 border border-cyan-500/30">
                <h3 class="text-cyan-400 font-semibold ui-font mb-3 flex items-center gap-2">
                    <i class="fas fa-info-circle"></i>
                    Get Ready
                </h3>
                <div class="space-y-2">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-cyan-500/20 rounded-full flex items-center justify-center">
                            <span class="text-cyan-400 text-xs game-font">1</span>
                        </div>
                        <p class="text-white text-sm ui-font">Stand in athletic ready position</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-cyan-500/20 rounded-full flex items-center justify-center">
                            <span class="text-cyan-400 text-xs game-font">2</span>
                        </div>
                        <p class="text-white text-sm ui-font">Watch the screen for incoming ball</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 bg-cyan-500/20 rounded-full flex items-center justify-center">
                            <span class="text-cyan-400 text-xs game-font">3</span>
                        </div>
                        <p class="text-white text-sm ui-font">React and move to correct position</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-20"></div>
    </div>
</body>
</html>
