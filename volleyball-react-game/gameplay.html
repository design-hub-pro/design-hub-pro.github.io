<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Gameplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        .game-font { font-family: 'Orbitron', sans-serif; }
        .ui-font { font-family: 'Inter', sans-serif; }

        .ball-incoming {
            animation: ball-fly 0.8s ease-out forwards;
        }
        @keyframes ball-fly {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .target-pulse {
            animation: target-pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes target-pulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            to { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        .arrow-flash {
            animation: arrow-flash 0.3s ease-in-out infinite alternate;
        }
        @keyframes arrow-flash {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        .trajectory-line {
            stroke-dasharray: 10;
            animation: dash 0.5s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
        .timer-urgent {
            animation: timer-flash 0.5s ease-in-out infinite;
        }
        @keyframes timer-flash {
            0%, 100% { color: #ef4444; }
            50% { color: #fbbf24; }
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Game Court View (First-person volleyball court) -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1592656094267-764a45160876?w=400&h=900&fit=crop" alt="Court View" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative px-6 pt-3 pb-2 flex justify-between items-center z-20">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Top HUD -->
        <div class="relative z-20 px-4 pt-2">
            <div class="flex items-center justify-between">
                <!-- Score -->
                <div class="bg-black/70 backdrop-blur-lg rounded-xl px-4 py-2 border border-cyan-500/30">
                    <p class="text-gray-400 text-[10px] ui-font">SCORE</p>
                    <p class="game-font text-2xl text-cyan-400">2,450</p>
                </div>

                <!-- Timer -->
                <div class="bg-black/70 backdrop-blur-lg rounded-full px-5 py-3 border border-red-500/50">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-clock text-red-400"></i>
                        <span class="game-font text-xl text-red-400 timer-urgent">0:18</span>
                    </div>
                </div>

                <!-- Combo -->
                <div class="bg-black/70 backdrop-blur-lg rounded-xl px-4 py-2 border border-yellow-500/30">
                    <p class="text-gray-400 text-[10px] ui-font">COMBO</p>
                    <p class="game-font text-2xl text-yellow-400">x5</p>
                </div>
            </div>
        </div>

        <!-- Ball Trajectory & Target Zone -->
        <div class="absolute inset-0 z-10">
            <!-- Trajectory prediction line -->
            <svg class="absolute inset-0 w-full h-full">
                <defs>
                    <linearGradient id="trajGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0" />
                        <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M 100 150 Q 200 300 280 520" stroke="url(#trajGrad)" stroke-width="3" fill="none" class="trajectory-line"/>
            </svg>

            <!-- Incoming Ball -->
            <div class="absolute top-[25%] left-[30%] ball-incoming" style="transform: translate(-50%, -50%);">
                <div class="relative">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-white via-yellow-100 to-yellow-200 shadow-lg shadow-yellow-400/50 flex items-center justify-center">
                        <div class="w-14 h-14 rounded-full border-2 border-dashed border-blue-400/50"></div>
                    </div>
                    <!-- Speed indicator -->
                    <div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-red-500 text-white text-xs px-2 py-1 rounded-full game-font whitespace-nowrap">
                        <i class="fas fa-bolt mr-1"></i>75 km/h
                    </div>
                </div>
            </div>

            <!-- Target Zone (Where player should move) -->
            <div class="absolute bottom-[30%] right-[25%] target-pulse" style="transform: translate(-50%, -50%);">
                <div class="relative">
                    <!-- Outer ring -->
                    <div class="w-32 h-32 rounded-full border-4 border-dashed border-cyan-400 opacity-50"></div>
                    <!-- Inner target -->
                    <div class="absolute inset-4 rounded-full border-4 border-cyan-400 flex items-center justify-center">
                        <div class="w-8 h-8 bg-cyan-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-crosshairs text-black"></i>
                        </div>
                    </div>
                    <!-- Label -->
                    <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-cyan-500 text-black text-xs px-3 py-1 rounded-full game-font whitespace-nowrap font-bold">
                        MOVE HERE
                    </div>
                </div>
            </div>

            <!-- Direction Arrow -->
            <div class="absolute bottom-[45%] left-[35%] arrow-flash">
                <svg width="80" height="40" viewBox="0 0 80 40">
                    <defs>
                        <linearGradient id="arrowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                            <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0" />
                            <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M 0 20 L 50 20 L 50 10 L 75 20 L 50 30 L 50 20" fill="url(#arrowGrad)"/>
                </svg>
            </div>
        </div>

        <!-- Action Prompt -->
        <div class="absolute bottom-44 left-0 right-0 px-5 z-20">
            <div class="bg-gradient-to-r from-orange-500/90 to-red-500/90 backdrop-blur-lg rounded-2xl p-4 border border-orange-400/50">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-running text-white text-2xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-white/80 text-xs ui-font">INCOMING SERVE</p>
                        <h3 class="text-white font-bold text-lg game-font">MOVE RIGHT!</h3>
                        <p class="text-white/70 text-xs ui-font mt-1">Get to position for pass</p>
                    </div>
                    <div class="text-right">
                        <p class="text-white/60 text-[10px] ui-font">React in</p>
                        <p class="text-white text-2xl game-font font-bold">0.8s</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Pose Status -->
        <div class="absolute bottom-24 left-0 right-0 px-5 z-20">
            <div class="bg-black/70 backdrop-blur-lg rounded-xl p-3 border border-cyan-500/30">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></div>
                        <span class="text-yellow-400 text-sm ui-font">Detecting movement...</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-center">
                            <p class="text-gray-500 text-[10px]">POSITION</p>
                            <p class="text-yellow-400 text-sm game-font">65%</p>
                        </div>
                        <div class="text-center">
                            <p class="text-gray-500 text-[10px]">STANCE</p>
                            <p class="text-green-400 text-sm game-font">OK</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-30"></div>
    </div>
</body>
</html>
