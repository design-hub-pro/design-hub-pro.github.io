<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>PulseCoach</title></head><body><div class="screen" style="background:#fff">
<div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>
<div class="absolute inset-x-0 top-0 h-[470px]">
 <img src="https://images.unsplash.com/photo-1622115837997-90c89ae689f9?w=900&q=80" class="w-full h-full object-cover">
 <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(15,23,42,.55) 0%,rgba(159,18,57,.35) 55%,#fff 100%)"></div>
</div>
<div class="absolute inset-x-0 top-[150px] flex justify-center">
 <div class="relative w-[210px] h-[210px] flex items-center justify-center">
  <div class="absolute inset-0 rounded-full border-2 border-white/30"></div>
  <div class="absolute inset-[22px] rounded-full border-2 border-white/50"></div>
  <div class="absolute inset-[48px] rounded-full bg-white/20 backdrop-blur"></div>
  <div class="relative w-[96px] h-[96px] rounded-[30px] grad-rose flex items-center justify-center shadow-2xl ring-4 ring-white/70">
   <i class="fas fa-heart-pulse text-white text-[40px]"></i>
  </div>
  <div class="absolute -right-2 top-8 bg-white rounded-full px-3 py-1.5 text-[12px] font-bold text-emerald-600 shadow-lg flex items-center gap-1.5"><span class="dot bg-emerald-500"></span>Found</div>
 </div>
</div>
<div class="absolute inset-x-0 top-[430px] px">
 <div class="text-[12px] font-bold tracking-[.18em] text-rose-600">STEP 2 OF 3</div>
 <h1 class="text-[34px] leading-[1.08] font-black tracking-tight mt-2">Pair your band.<br>Then press.</h1>
 <p class="text-slate-500 text-[15px] mt-3 leading-relaxed">Wear it on your bottom hand. It feels depth, tempo and release, and buzzes when you drift.</p>
 <div class="card p-4 mt-6 flex items-center gap-4">
  <div class="icon-tile grad-rose"><i class="fas fa-ring"></i></div>
  <div class="flex-1">
   <div class="font-bold text-[16px]">PulseCoach Band</div>
   <div class="text-[12.5px] text-slate-500 flex items-center gap-2 mt-0.5"><i class="fas fa-battery-three-quarters text-emerald-500"></i>82% <span class="text-slate-300">|</span> PC-04A7</div>
  </div>
  <div class="flex gap-0.5 items-end h-5"><span class="w-1 h-2 bg-rose-500 rounded"></span><span class="w-1 h-3 bg-rose-500 rounded"></span><span class="w-1 h-4 bg-rose-500 rounded"></span><span class="w-1 h-5 bg-slate-200 rounded"></span></div>
 </div>
 <div class="grid grid-cols-3 gap-3 mt-4">
  <div class="rounded-2xl bg-emerald-50 p-3 text-center"><i class="fas fa-check-circle text-emerald-500 text-[18px]"></i><div class="text-[11.5px] font-semibold mt-1.5 text-emerald-700">Wear</div></div>
  <div class="rounded-2xl bg-rose-50 p-3 text-center ring-2 ring-rose-400"><i class="fab fa-bluetooth-b text-rose-600 text-[18px]"></i><div class="text-[11.5px] font-semibold mt-1.5 text-rose-700">Pair</div></div>
  <div class="rounded-2xl bg-slate-50 p-3 text-center"><i class="fas fa-crosshairs text-slate-400 text-[18px]"></i><div class="text-[11.5px] font-semibold mt-1.5 text-slate-500">Calibrate</div></div>
 </div>
</div>
<div class="absolute inset-x-0 bottom-[46px] px">
 <button class="w-full h-[58px] rounded-[20px] grad-rose text-white font-bold text-[17px] shadow-[0_14px_28px_-10px_rgba(225,29,72,.7)]">Pair &amp; calibrate</button>
 <div class="text-center text-[13px] text-slate-400 mt-4 font-medium">Practice only. Not a medical device.</div>
</div>
<div class="home-ind"></div>
</div></body></html>
