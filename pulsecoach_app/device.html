<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>PulseCoach</title></head><body><div class="screen">
<div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>
<div class="scroll" style="padding-bottom:60px">
 <div class="flex items-center justify-between mt-3"><div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fas fa-chevron-left text-[14px]"></i></div><div class="text-[16px] font-bold">My band</div><div class="w-10"></div></div>

 <div class="card p-5 mt-5 flex items-center gap-5">
  <div class="relative w-[96px] h-[96px] rounded-[30px] grad-rose flex items-center justify-center shadow-[0_14px_28px_-10px_rgba(225,29,72,.7)]"><i class="fas fa-heart-pulse text-white text-[38px]"></i><span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 ring-4 ring-white"></span></div>
  <div class="flex-1">
   <div class="font-black text-[20px]">PulseCoach Band</div>
   <div class="text-[12.5px] text-slate-500 font-medium">PC-04A7 · v1.3.2</div>
   <div class="flex gap-4 mt-3"><div><div class="text-[22px] font-black num leading-none">82%</div><div class="text-[11px] text-slate-400 font-semibold mt-1">battery</div></div><div><div class="text-[22px] font-black num leading-none">~6h</div><div class="text-[11px] text-slate-400 font-semibold mt-1">practice left</div></div></div>
  </div>
 </div>

 <div class="section-h"><h3>Live sensors</h3><span class="flex items-center gap-1.5 text-[12px] font-bold text-emerald-600"><span class="dot bg-emerald-500 animate-pulse"></span>Streaming</span></div>
 <div class="grid grid-cols-2 gap-3">
  <div class="card p-4"><div class="flex items-center gap-2 text-[12px] font-bold text-slate-400"><i class="fas fa-up-down text-sky-500"></i>ACCEL</div><svg viewBox="0 0 150 40" class="w-full h-10 mt-2"><polyline fill="none" stroke="#0EA5E9" stroke-width="2" points="0,20 10,20 18,6 26,34 34,20 50,20 58,8 66,32 74,20 90,20 98,6 106,34 114,20 130,20 138,9 146,31 150,20"/></svg><div class="text-[20px] font-black num">1.02 <span class="text-[12px] text-slate-400">g</span></div></div>
  <div class="card p-4"><div class="flex items-center gap-2 text-[12px] font-bold text-slate-400"><i class="fas fa-compass-drafting text-violet-500"></i>HAND ANGLE</div><div class="flex items-center justify-center h-12 mt-1"><div class="w-24 h-12 overflow-hidden relative"><div class="w-24 h-24 rounded-full border-[6px] border-slate-100 absolute"></div><div class="absolute left-1/2 bottom-0 w-1 h-11 bg-violet-500 rounded origin-bottom" style="transform:translateX(-50%) rotate(4deg)"></div></div></div><div class="text-[20px] font-black num">4° <span class="text-[12px] text-emerald-600 font-bold">upright</span></div></div>
 </div>

 <div class="section-h"><h3>Practice surface</h3></div>
 <div class="grid grid-cols-3 gap-3">
  <div class="rounded-[20px] bg-rose-50 ring-2 ring-rose-500 p-3 text-center"><div class="icon-tile grad-rose mx-auto"><i class="fas fa-person"></i></div><div class="text-[12.5px] font-bold mt-2">Manikin</div></div>
  <div class="rounded-[20px] card p-3 text-center"><div class="icon-tile grad-sky mx-auto"><i class="fas fa-bed"></i></div><div class="text-[12.5px] font-bold mt-2">Soft mat</div></div>
  <div class="rounded-[20px] card p-3 text-center"><div class="icon-tile grad-teal mx-auto"><i class="fas fa-border-all"></i></div><div class="text-[12.5px] font-bold mt-2">Floor pad</div></div>
 </div>

 <div class="card mt-5 divide-y divide-slate-100">
  <div class="p-4"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="icon-tile grad-amber !w-9 !h-9 !rounded-xl text-[14px]"><i class="fas fa-wave-square"></i></div><span class="font-bold text-[15px]">Buzz strength</span></div><span class="text-[13px] font-bold text-slate-500">Strong</span></div><div class="relative h-2 rounded-full bg-slate-100 mt-4"><div class="absolute inset-y-0 left-0 w-[72%] rounded-full grad-amber"></div><div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white shadow-md border border-slate-200" style="left:calc(72% - 12px)"></div></div></div>
  <div class="p-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="icon-tile grad-sky !w-9 !h-9 !rounded-xl text-[14px]"><i class="fas fa-shield-halved"></i></div><span class="font-bold text-[15px]">Bounce filter</span></div><div class="w-[52px] h-[32px] rounded-full bg-emerald-500 relative"><span class="absolute right-[3px] top-[3px] w-[26px] h-[26px] rounded-full bg-white shadow"></span></div></div>
  <div class="p-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="icon-tile grad-violet !w-9 !h-9 !rounded-xl text-[14px]"><i class="fas fa-crosshairs"></i></div><span class="font-bold text-[15px]">Recalibrate</span></div><span class="text-[12.5px] text-slate-400 font-medium">2 days ago <i class="fas fa-chevron-right ml-1 text-slate-300"></i></span></div>
 </div>
</div>
<div class="home-ind"></div>
</div></body></html>
