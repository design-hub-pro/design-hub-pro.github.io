<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyRead - Motion-Adaptive Reading App</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: #1a1a2e;
    min-height: 100vh;
  }

  /* Header Section */
  .hero {
    text-align: center;
    padding: 70px 40px 50px 40px;
    position: relative;
  }

  .app-icon {
    width: 80px; height: 80px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px auto;
    box-shadow: 0 12px 40px rgba(108, 92, 231, 0.3);
  }
  .app-icon i { font-size: 36px; color: #fff; }

  .hero-title {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;
    margin-bottom: 12px;
    line-height: 1.1;
  }
  .hero-title .highlight {
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-subtitle {
    font-size: 18px;
    color: #666;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.5;
    font-weight: 400;
  }

  /* Screens Showcase Grid */
  .screens-section {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 60px 80px 60px;
  }

  .screen-group-title {
    font-size: 14px;
    font-weight: 700;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 40px;
    margin-top: 50px;
  }

  .screens-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 44px;
    justify-items: center;
    max-width: 1560px;
    margin: 0 auto;
  }

  /* Phone Frame */
  .phone-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .phone-frame {
    width: 460px;
    height: 980px;
    border-radius: 62px;
    background: #000;
    padding: 12px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.1),
      0 20px 60px rgba(0, 0, 0, 0.15),
      0 4px 20px rgba(0, 0, 0, 0.08);
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 52px;
    overflow: hidden;
    background: #0a0e27;
  }

  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 52px;
  }

  .screen-label {
    font-size: 15px;
    font-weight: 600;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

  <!-- Hero Section -->
  <div class="hero">
    <div class="app-icon">
      <i class="fas fa-book-reader"></i>
    </div>
    <h1 class="hero-title"><span class="highlight">Steady</span>Read</h1>
    <p class="hero-subtitle">Motion-adaptive reading that adjusts to your journey. Read comfortably in any moving vehicle.</p>
  </div>

  <!-- Screens Showcase -->
  <div class="screens-section">
    <div class="screen-group-title">App Screens</div>

    <div class="screens-grid">

      <!-- Onboarding -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="onboarding.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Onboarding</div>
      </div>

      <!-- Home -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="home.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Home Dashboard</div>
      </div>

      <!-- Library -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="library.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Library</div>
      </div>

      <!-- Reader -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="reader.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Reader - Normal Mode</div>
      </div>

      <!-- Reader Comfort -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="reader_comfort.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Reader - Comfort Mode</div>
      </div>

      <!-- Listen Mode -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="listen.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Listen Mode</div>
      </div>

      <!-- Analytics -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="analytics.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Motion Analytics</div>
      </div>

      <!-- Profile -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="profile.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Profile</div>
      </div>

      <!-- Settings -->
      <div class="phone-wrapper">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="settings.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Settings</div>
      </div>

    </div>
  </div>

</body>
</html>
