<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyRead - Onboarding</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-scrollbar: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; }

  .screen {
    width: 100%; height: 100%;
    background: linear-gradient(165deg, #0a0e27 0%, #1a1040 35%, #2d1b69 65%, #1a1040 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Status Bar */
  .status-bar {
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 8px 28px;
    position: relative;
    z-index: 10;
  }
  .status-time { font-size: 17px; font-weight: 600; color: #fff; }
  .status-icons { display: flex; gap: 6px; align-items: center; color: #fff; font-size: 14px; }
  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
  }

  /* Content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    position: relative;
  }

  /* Animated background elements */
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    animation: float 8s ease-in-out infinite;
  }
  .bg-orb-1 { width: 300px; height: 300px; background: #6c5ce7; top: 10%; left: -20%; animation-delay: 0s; }
  .bg-orb-2 { width: 250px; height: 250px; background: #00cec9; bottom: 15%; right: -15%; animation-delay: -3s; }
  .bg-orb-3 { width: 200px; height: 200px; background: #fd79a8; top: 50%; left: 30%; animation-delay: -5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  /* Motion wave animation */
  .motion-visual {
    width: 220px;
    height: 220px;
    position: relative;
    margin-bottom: 50px;
  }

  .wave-ring {
    position: absolute;
    border: 2px solid rgba(108, 92, 231, 0.3);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse-ring 3s ease-out infinite;
  }
  .wave-ring:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
  .wave-ring:nth-child(2) { width: 150px; height: 150px; animation-delay: 0.5s; }
  .wave-ring:nth-child(3) { width: 200px; height: 200px; animation-delay: 1s; }
  .wave-ring:nth-child(4) { width: 250px; height: 250px; animation-delay: 1.5s; }

  @keyframes pulse-ring {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; border-color: rgba(108, 92, 231, 0.6); }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; border-color: rgba(0, 206, 201, 0.1); }
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #fff;
    box-shadow: 0 8px 32px rgba(108, 92, 231, 0.4);
  }

  .app-title {
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: -1px;
  }
  .app-title span {
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .app-subtitle {
    font-size: 17px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 60px;
    max-width: 300px;
  }

  /* Feature pills */
  .feature-pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 50px;
  }
  .pill {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 500;
    backdrop-filter: blur(10px);
  }

  /* CTA Button */
  .cta-btn {
    width: 100%;
    max-width: 340px;
    height: 58px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35);
    letter-spacing: 0.3px;
  }

  .page-dots {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.2); }
  .dot.active { width: 24px; background: linear-gradient(135deg, #6c5ce7, #00cec9); }

  /* Home indicator */
  .home-indicator {
    width: 140px; height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    margin: 0 auto 10px;
  }
</style>
</head>
<body>
<div class="screen">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal" style="font-size:15px"></i>
      <i class="fas fa-wifi" style="font-size:15px"></i>
      <i class="fas fa-battery-full" style="font-size:17px"></i>
    </div>
  </div>

  <!-- Background orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="content">
    <!-- Motion visual -->
    <div class="motion-visual">
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="center-icon">
        <i class="fas fa-book-reader"></i>
      </div>
    </div>

    <div class="app-title"><span>Steady</span>Read</div>
    <p class="app-subtitle">Read comfortably anywhere. Motion-adaptive reading that moves with you.</p>

    <div class="feature-pills">
      <div class="pill"><i class="fas fa-wave-square" style="margin-right:6px; color:#6c5ce7"></i>Motion Detect</div>
      <div class="pill"><i class="fas fa-eye" style="margin-right:6px; color:#00cec9"></i>Comfort Mode</div>
      <div class="pill"><i class="fas fa-headphones" style="margin-right:6px; color:#fd79a8"></i>Listen Mode</div>
    </div>

    <button class="cta-btn">
      Get Started
      <i class="fas fa-arrow-right"></i>
    </button>

    <div class="page-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
