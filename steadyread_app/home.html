<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteadyRead - Home</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0e27; color: #fff; }

  .screen { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }

  /* Status Bar */
  .status-bar {
    height: 59px; display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 28px 8px 28px; position: relative; z-index: 10; flex-shrink: 0;
  }
  .status-time { font-size: 17px; font-weight: 600; color: #fff; }
  .status-icons { display: flex; gap: 6px; align-items: center; color: #fff; font-size: 14px; }
  .dynamic-island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; }

  /* Scrollable content */
  .scroll-content { flex: 1; overflow-y: auto; padding: 0 28px 100px 28px; scrollbar-width: none; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 8px; }
  .greeting { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 400; }
  .greeting-name { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(108, 92, 231, 0.5);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* Motion Status Card */
  .motion-card {
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.15));
    border: 1px solid rgba(108, 92, 231, 0.25);
    border-radius: 24px;
    padding: 22px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .motion-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(108, 92, 231, 0.15) 0%, transparent 70%);
    border-radius: 50%;
  }
  .motion-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: relative; }
  .motion-label { font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .motion-status {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(0, 206, 201, 0.15);
    border: 1px solid rgba(0, 206, 201, 0.3);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00cec9; animation: blink 2s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-text { font-size: 13px; color: #00cec9; font-weight: 600; }

  .motion-visual-row { display: flex; align-items: center; gap: 20px; position: relative; }
  .motion-gauge {
    width: 90px; height: 90px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .gauge-ring {
    position: absolute; width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.06);
  }
  .gauge-progress {
    position: absolute; width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: #00cec9;
    border-right-color: #00cec9;
    transform: rotate(-45deg);
  }
  .gauge-value { font-size: 28px; font-weight: 800; color: #00cec9; }
  .gauge-unit { font-size: 11px; color: rgba(255,255,255,0.4); display: block; text-align: center; }

  .motion-bars { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { font-size: 12px; color: rgba(255,255,255,0.4); width: 32px; font-weight: 500; }
  .bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-fill.x { width: 35%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); }
  .bar-fill.y { width: 20%; background: linear-gradient(90deg, #00cec9, #81ecec); }
  .bar-fill.z { width: 15%; background: linear-gradient(90deg, #fd79a8, #fab1a0); }

  /* Continue Reading */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-title { font-size: 20px; font-weight: 700; }
  .see-all { font-size: 13px; color: #6c5ce7; font-weight: 600; }

  .reading-card {
    display: flex; gap: 16px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px; padding: 16px;
    margin-bottom: 14px;
  }
  .book-cover {
    width: 80px; height: 110px; border-radius: 14px; overflow: hidden; flex-shrink: 0;
    position: relative;
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .book-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
  .book-author { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #6c5ce7, #00cec9); border-radius: 3px; }
  .progress-text { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; }

  /* Quick Actions */
  .quick-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 28px; margin-top: 28px;
  }
  .action-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .action-icon {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
  }
  .action-icon.purple { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
  .action-icon.teal { background: linear-gradient(135deg, #00cec9, #81ecec); }
  .action-icon.pink { background: linear-gradient(135deg, #fd79a8, #fab1a0); }
  .action-icon.blue { background: linear-gradient(135deg, #0984e3, #74b9ff); }
  .action-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); }

  /* Today Stats */
  .stats-row {
    display: flex; gap: 12px; margin-bottom: 28px;
  }
  .stat-card {
    flex: 1; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 18px 14px;
    text-align: center;
  }
  .stat-value { font-size: 30px; font-weight: 800; }
  .stat-value.purple { color: #a29bfe; }
  .stat-value.teal { color: #00cec9; }
  .stat-value.pink { color: #fd79a8; }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 88px;
    background: rgba(10, 14, 39, 0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding-top: 12px;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tab-icon { font-size: 22px; color: rgba(255,255,255,0.3); }
  .tab-icon.active { color: #6c5ce7; }
  .tab-label { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 500; }
  .tab-label.active { color: #6c5ce7; }
</style>
</head>
<body>
<div class="screen">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal" style="font-size:15px"></i>
      <i class="fas fa-wifi" style="font-size:15px"></i>
      <i class="fas fa-battery-full" style="font-size:17px"></i>
    </div>
  </div>

  <div class="scroll-content">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="greeting">Good morning</div>
        <div class="greeting-name">Alex</div>
      </div>
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face" alt="avatar">
      </div>
    </div>

    <!-- Motion Status Card -->
    <div class="motion-card">
      <div class="motion-header">
        <span class="motion-label">Motion Level</span>
        <div class="motion-status">
          <div class="status-dot"></div>
          <span class="status-text">Low</span>
        </div>
      </div>
      <div class="motion-visual-row">
        <div class="motion-gauge">
          <div class="gauge-ring"></div>
          <div class="gauge-progress"></div>
          <div>
            <span class="gauge-value">1.2</span>
            <span class="gauge-unit">m/s²</span>
          </div>
        </div>
        <div class="motion-bars">
          <div class="bar-row">
            <span class="bar-label">X</span>
            <div class="bar-track"><div class="bar-fill x"></div></div>
          </div>
          <div class="bar-row">
            <span class="bar-label">Y</span>
            <div class="bar-track"><div class="bar-fill y"></div></div>
          </div>
          <div class="bar-row">
            <span class="bar-label">Z</span>
            <div class="bar-track"><div class="bar-fill z"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Today Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value purple">47</div>
        <div class="stat-label">Min Read</div>
      </div>
      <div class="stat-card">
        <div class="stat-value teal">12</div>
        <div class="stat-label">Pages</div>
      </div>
      <div class="stat-card">
        <div class="stat-value pink">92%</div>
        <div class="stat-label">Comfort</div>
      </div>
    </div>

    <!-- Continue Reading -->
    <div class="section-header">
      <span class="section-title">Continue Reading</span>
      <span class="see-all">See All</span>
    </div>

    <div class="reading-card">
      <div class="book-cover">
        <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=200&h=280&fit=crop" alt="book">
      </div>
      <div class="book-info">
        <div class="book-title">Atomic Habits</div>
        <div class="book-author">James Clear</div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" style="width:68%"></div></div>
          <span class="progress-text">68%</span>
        </div>
      </div>
    </div>

    <div class="reading-card">
      <div class="book-cover">
        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=200&h=280&fit=crop" alt="book">
      </div>
      <div class="book-info">
        <div class="book-title">Deep Work</div>
        <div class="book-author">Cal Newport</div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" style="width:34%"></div></div>
          <span class="progress-text">34%</span>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="section-header" style="margin-top:8px">
      <span class="section-title">Quick Start</span>
    </div>
    <div class="quick-actions">
      <div class="action-card">
        <div class="action-icon purple"><i class="fas fa-book-open"></i></div>
        <span class="action-label">Read Now</span>
      </div>
      <div class="action-card">
        <div class="action-icon teal"><i class="fas fa-headphones-alt"></i></div>
        <span class="action-label">Listen Mode</span>
      </div>
      <div class="action-card">
        <div class="action-icon pink"><i class="fas fa-file-import"></i></div>
        <span class="action-label">Import File</span>
      </div>
      <div class="action-card">
        <div class="action-icon blue"><i class="fas fa-chart-line"></i></div>
        <span class="action-label">Analytics</span>
      </div>
    </div>

  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item">
      <i class="fas fa-home tab-icon active"></i>
      <span class="tab-label active">Home</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-book tab-icon"></i>
      <span class="tab-label">Library</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-wave-square tab-icon"></i>
      <span class="tab-label">Motion</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-user tab-icon"></i>
      <span class="tab-label">Profile</span>
    </div>
  </div>
</div>
</body>
</html>
