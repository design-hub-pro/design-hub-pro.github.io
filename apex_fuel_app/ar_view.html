<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ApexFuel — AR Glasses View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0A0A0A; color:#fff; scrollbar-width:none; }
  .screen { width:100%; height:100%; position:relative; overflow:hidden; }

  .ar-bg { position:absolute; inset:0; background-image:url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=900&q=80'); background-size:cover; background-position:center; }
  .ar-tint { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,30,10,0.35), rgba(10,10,10,0.55)); }
  .ar-vignette { position:absolute; inset:0; box-shadow: inset 0 0 180px rgba(0,0,0,0.75); }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; color:#fff; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; color:#fff; }

  /* Top HUD */
  .hud-top { position:absolute; top:80px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; z-index:20; }
  .glass-badge { display:flex; align-items:center; gap:8px; background:rgba(10,10,10,0.65); backdrop-filter:blur(14px); border:1px solid rgba(184,255,30,0.35); padding:8px 14px; border-radius:16px; }
  .glass-badge .live-dot { width:8px; height:8px; border-radius:50%; background:#B8FF1E; box-shadow:0 0 12px #B8FF1E; animation:blink 1.5s infinite; }
  .glass-badge i { font-size:13px; color:#B8FF1E; }
  .glass-badge span { font-size:11px; font-weight:800; color:#B8FF1E; letter-spacing:0.5px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hud-right { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .hud-chip { background:rgba(10,10,10,0.65); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.1); padding:7px 12px; border-radius:14px; font-size:10px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
  .hud-chip i { color:#B8FF1E; font-size:11px; }

  /* Corner reticle */
  .reticle { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:220px; height:220px; pointer-events:none; z-index:10; }
  .r-corner { position:absolute; width:32px; height:32px; border:3px solid #B8FF1E; }
  .r-corner.tl { top:0; left:0; border-right:none; border-bottom:none; }
  .r-corner.tr { top:0; right:0; border-left:none; border-bottom:none; }
  .r-corner.bl { bottom:0; left:0; border-right:none; border-top:none; }
  .r-corner.br { bottom:0; right:0; border-left:none; border-top:none; }

  /* Floating labels */
  .ar-label { position:absolute; z-index:15; background:rgba(10,10,10,0.85); backdrop-filter:blur(12px); border:1px solid rgba(184,255,30,0.45); border-radius:14px; padding:10px 12px; }
  .ar-label::before { content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:10px; height:10px; background:#B8FF1E; border-radius:50%; box-shadow:0 0 14px #B8FF1E; }
  .ar-label-name { font-size:12px; font-weight:800; color:#fff; }
  .ar-label-stats { font-size:10px; color:#B8FF1E; font-weight:700; margin-top:2px; }

  /* Center bottom nutrition card */
  .nutri-panel {
    position:absolute; bottom:130px; left:20px; right:20px; z-index:20;
    background:rgba(10,10,10,0.85); backdrop-filter:blur(18px);
    border:1px solid rgba(184,255,30,0.3); border-radius:24px; padding:18px 20px;
  }
  .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .panel-label { font-size:10px; color:#B8FF1E; font-weight:800; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .panel-conf { font-size:10px; font-weight:800; color:#0A0A0A; background:#B8FF1E; padding:3px 8px; border-radius:8px; }
  .panel-title { font-size:22px; font-weight:900; color:#fff; letter-spacing:-0.5px; }
  .panel-meta { font-size:11px; color:#888; margin-top:2px; }
  .panel-stats { display:flex; gap:8px; margin-top:14px; }
  .panel-stat { flex:1; text-align:center; background:rgba(255,255,255,0.05); border-radius:12px; padding:10px 4px; }
  .panel-stat-val { font-size:15px; font-weight:900; color:#fff; }
  .panel-stat-val.kcal { color:#B8FF1E; }
  .panel-stat-lbl { font-size:9px; color:#888; font-weight:700; letter-spacing:0.3px; text-transform:uppercase; margin-top:2px; }

  /* AI Feedback Alert */
  .ai-alert {
    position:absolute; top:140px; left:50%; transform:translateX(-50%); z-index:20;
    background:linear-gradient(135deg,#B8FF1E,#8BE000); color:#0A0A0A; padding:10px 18px; border-radius:18px;
    display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(184,255,30,0.35);
    white-space:nowrap;
  }
  .ai-alert i { font-size:13px; }
  .ai-alert span { font-size:11px; font-weight:800; letter-spacing:0.2px; }

  /* Bottom controls */
  .controls { position:absolute; bottom:28px; left:0; right:0; z-index:25; display:flex; justify-content:center; gap:14px; padding:0 20px; }
  .ctrl-btn { width:52px; height:52px; border-radius:18px; background:rgba(10,10,10,0.7); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
  .ctrl-btn i { color:#fff; font-size:17px; }
  .ctrl-primary { width:62px; height:62px; border-radius:22px; background:linear-gradient(135deg,#B8FF1E,#8BE000); box-shadow:0 10px 30px rgba(184,255,30,0.4); }
  .ctrl-primary i { color:#0A0A0A; font-size:22px; }
</style>
</head>
<body>
<div class="screen">
  <div class="ar-bg"></div>
  <div class="ar-tint"></div>
  <div class="ar-vignette"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="hud-top">
    <div class="glass-badge">
      <div class="live-dot"></div>
      <i class="fas fa-glasses"></i>
      <span>AR GLASS LIVE</span>
    </div>
    <div class="hud-right">
      <div class="hud-chip"><i class="fas fa-battery-three-quarters"></i> Glass 78%</div>
      <div class="hud-chip"><i class="fas fa-wifi"></i> Synced</div>
    </div>
  </div>

  <div class="ai-alert">
    <i class="fas fa-wand-magic-sparkles"></i>
    <span>PERFECT PRE-GAME FUEL ✓</span>
  </div>

  <div class="reticle">
    <div class="r-corner tl"></div>
    <div class="r-corner tr"></div>
    <div class="r-corner bl"></div>
    <div class="r-corner br"></div>
  </div>

  <div class="ar-label" style="top:230px; left:60px">
    <div class="ar-label-name">Grilled Salmon</div>
    <div class="ar-label-stats">420 kcal · 38g P</div>
  </div>

  <div class="ar-label" style="top:330px; right:40px">
    <div class="ar-label-name">Quinoa</div>
    <div class="ar-label-stats">180 kcal · 48g C</div>
  </div>

  <div class="ar-label" style="top:430px; left:80px">
    <div class="ar-label-name">Avocado</div>
    <div class="ar-label-stats">160 kcal · 15g F</div>
  </div>

  <div class="nutri-panel">
    <div class="panel-head">
      <div class="panel-label"><i class="fas fa-eye"></i> AR Detection · Live</div>
      <div class="panel-conf">97% MATCH</div>
    </div>
    <div class="panel-title">Recovery Power Plate</div>
    <div class="panel-meta">3 ingredients · Estimated in real-time</div>
    <div class="panel-stats">
      <div class="panel-stat"><div class="panel-stat-val kcal">760</div><div class="panel-stat-lbl">kcal</div></div>
      <div class="panel-stat"><div class="panel-stat-val">52g</div><div class="panel-stat-lbl">Protein</div></div>
      <div class="panel-stat"><div class="panel-stat-val">58g</div><div class="panel-stat-lbl">Carbs</div></div>
      <div class="panel-stat"><div class="panel-stat-val">28g</div><div class="panel-stat-lbl">Fats</div></div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-btn"><i class="fas fa-microphone"></i></div>
    <div class="ctrl-btn ctrl-primary"><i class="fas fa-check"></i></div>
    <div class="ctrl-btn"><i class="fas fa-xmark"></i></div>
  </div>
</div>
</body>
</html>
