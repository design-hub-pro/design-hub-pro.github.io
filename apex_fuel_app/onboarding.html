<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ApexFuel — Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0A0A0A; color:#fff; scrollbar-width:none; }
  .screen { width:100%; height:100%; position:relative; overflow:hidden; }

  .bg-hero {
    position:absolute; inset:0; background-image:url('https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=900&q=80');
    background-size:cover; background-position:center;
  }
  .bg-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.6) 40%, rgba(10,10,10,0.98) 80%); }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; color:#fff; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; color:#fff; }

  .content { position:absolute; bottom:0; left:0; right:0; padding:0 28px 40px; z-index:10; }

  .logo-row { display:flex; align-items:center; gap:10px; margin-bottom:auto; }
  .logo-mark { width:40px; height:40px; border-radius:12px; background:#B8FF1E; display:flex; align-items:center; justify-content:center; }
  .logo-mark i { color:#0A0A0A; font-size:18px; }
  .logo-name { font-size:17px; font-weight:900; letter-spacing:-0.3px; }

  .top-area { position:absolute; top:80px; left:28px; z-index:10; }

  .progress-dots { display:flex; gap:6px; margin-bottom:20px; }
  .dot { width:28px; height:4px; border-radius:2px; background:rgba(255,255,255,0.2); }
  .dot.active { background:#B8FF1E; }

  .step-label { font-size:11px; color:#B8FF1E; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; }
  .headline { font-size:36px; font-weight:900; line-height:1.05; letter-spacing:-1.2px; margin-bottom:10px; }
  .headline span { color:#B8FF1E; }
  .sub { font-size:14px; color:rgba(255,255,255,0.6); line-height:1.5; margin-bottom:22px; }

  /* Sport grid */
  .sport-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:22px; }
  .sport-btn {
    aspect-ratio:1; border-radius:18px; background:rgba(255,255,255,0.08); backdrop-filter:blur(12px);
    border:1.5px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .sport-btn i { font-size:22px; color:rgba(255,255,255,0.7); }
  .sport-btn span { font-size:10px; color:rgba(255,255,255,0.7); font-weight:700; }
  .sport-btn.selected { background:#B8FF1E; border-color:#B8FF1E; }
  .sport-btn.selected i, .sport-btn.selected span { color:#0A0A0A; }

  .cta { width:100%; height:58px; border-radius:20px; background:#B8FF1E; color:#0A0A0A; font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 10px 30px rgba(184,255,30,0.3); }
  .cta i { font-size:14px; }
  .skip { text-align:center; margin-top:14px; font-size:12px; color:rgba(255,255,255,0.5); font-weight:600; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-hero"></div>
  <div class="bg-overlay"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="top-area">
    <div class="logo-row">
      <div class="logo-mark"><i class="fas fa-bolt"></i></div>
      <div class="logo-name">ApexFuel</div>
    </div>
  </div>

  <div class="content">
    <div class="progress-dots">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="step-label">Step 2 of 4</div>
    <div class="headline">What's your<br><span>primary sport?</span></div>
    <div class="sub">We'll tune your calories, macros & fueling windows to match your sport demands.</div>

    <div class="sport-grid">
      <div class="sport-btn selected"><i class="fas fa-futbol"></i><span>Soccer</span></div>
      <div class="sport-btn"><i class="fas fa-basketball"></i><span>Basketball</span></div>
      <div class="sport-btn"><i class="fas fa-football"></i><span>Football</span></div>
      <div class="sport-btn"><i class="fas fa-running"></i><span>Track</span></div>
      <div class="sport-btn"><i class="fas fa-swimmer"></i><span>Swim</span></div>
      <div class="sport-btn"><i class="fas fa-baseball"></i><span>Baseball</span></div>
    </div>

    <div class="cta">Continue <i class="fas fa-arrow-right"></i></div>
    <div class="skip">Not now — Explore first</div>
  </div>
</div>
</body>
</html>
