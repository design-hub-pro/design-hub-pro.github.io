<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ApexFuel — 首页</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Noto Sans SC','Inter',sans-serif; background:#0A0A0A; color:#fff; scrollbar-width:none; }

  .screen { width:100%; height:100%; position:relative; overflow-y:auto; padding-bottom:100px; background:#0A0A0A; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; color:#fff; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; color:#fff; }

  .header { padding:10px 28px 18px; display:flex; align-items:center; justify-content:space-between; }
  .greeting-label { font-size:13px; color:#888; font-weight:500; }
  .greeting-name { font-size:24px; font-weight:800; color:#fff; letter-spacing:-0.5px; margin-top:2px; }
  .avatar { width:44px; height:44px; border-radius:14px; object-fit:cover; border:2px solid #B8FF1E; }

  .hero-card {
    margin:0 28px; border-radius:28px; overflow:hidden; position:relative;
    background:linear-gradient(135deg, #B8FF1E 0%, #8BE000 100%);
    padding:24px; color:#0A0A0A; min-height:200px;
  }
  .hero-card::before { content:''; position:absolute; right:-40px; top:-40px; width:180px; height:180px; background:radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%); }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:2; }
  .hero-label { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:0.7; }
  .hero-kcal { font-size:48px; font-weight:900; letter-spacing:-2px; line-height:1; margin-top:6px; }
  .hero-kcal span { font-size:18px; font-weight:700; opacity:0.6; }
  .hero-sport-pill { background:#0A0A0A; color:#B8FF1E; padding:6px 12px; border-radius:14px; font-size:11px; font-weight:700; display:flex; align-items:center; gap:6px; }

  .macro-bars { margin-top:20px; display:flex; gap:12px; position:relative; z-index:2; }
  .macro { flex:1; }
  .macro-name { font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; opacity:0.6; }
  .macro-val { font-size:15px; font-weight:800; margin-top:2px; }
  .macro-val span { font-size:10px; font-weight:600; opacity:0.5; }
  .macro-bar-bg { height:4px; background:rgba(10,10,10,0.15); border-radius:4px; margin-top:6px; overflow:hidden; }
  .macro-bar-fill { height:100%; background:#0A0A0A; border-radius:4px; }

  .training-banner {
    margin:18px 28px 0; background:#151515; border-radius:24px; padding:18px; display:flex; align-items:center; gap:14px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .training-icon { width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg,#FF6B1E,#FF3B00); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .training-icon i { font-size:22px; color:#fff; }
  .training-info { flex:1; }
  .training-label { font-size:10px; color:#FF6B1E; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .training-title { font-size:15px; font-weight:700; color:#fff; margin-top:2px; }
  .training-time { font-size:12px; color:#888; margin-top:2px; }
  .training-dot { width:10px; height:10px; border-radius:50%; background:#FF6B1E; box-shadow:0 0 16px #FF6B1E; }

  .section-header { padding:24px 28px 12px; display:flex; justify-content:space-between; align-items:center; }
  .section-title { font-size:17px; font-weight:800; color:#fff; letter-spacing:-0.3px; }
  .section-link { font-size:12px; color:#B8FF1E; font-weight:600; }

  .meals-scroll { display:flex; gap:14px; padding:0 28px; overflow-x:auto; }
  .meal-card { min-width:180px; background:#151515; border-radius:22px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); }
  .meal-img { width:100%; height:120px; object-fit:cover; }
  .meal-img-wrap { position:relative; }
  .meal-time { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); padding:4px 10px; border-radius:10px; font-size:10px; font-weight:700; color:#fff; }
  .meal-check { position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background:#B8FF1E; display:flex; align-items:center; justify-content:center; }
  .meal-check i { font-size:11px; color:#0A0A0A; }
  .meal-pending { position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.15); backdrop-filter:blur(8px); border:1.5px dashed rgba(255,255,255,0.5); }
  .meal-body { padding:12px 14px 14px; }
  .meal-name { font-size:13px; font-weight:700; color:#fff; }
  .meal-kcal { font-size:11px; color:#888; margin-top:2px; }

  .hydration { margin:20px 28px 0; background:linear-gradient(135deg, #00C2FF 0%, #0085FF 100%); border-radius:24px; padding:18px; display:flex; align-items:center; gap:14px; }
  .hydration-icon { width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
  .hydration-icon i { font-size:20px; color:#fff; }
  .hydration-info { flex:1; }
  .hydration-title { font-size:13px; font-weight:700; color:#fff; }
  .hydration-val { font-size:20px; font-weight:900; color:#fff; letter-spacing:-0.5px; }
  .hydration-val span { font-size:12px; font-weight:600; opacity:0.7; }

  .tab-bar {
    position:absolute; bottom:0; left:0; right:0; height:92px;
    background:rgba(10,10,10,0.92); backdrop-filter:blur(20px);
    display:flex; justify-content:space-around; align-items:flex-start; padding-top:12px;
    border-top:0.5px solid rgba(255,255,255,0.08);
  }
  .tab-item { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:56px; }
  .tab-item i { font-size:20px; color:rgba(255,255,255,0.35); }
  .tab-item span { font-size:10px; color:rgba(255,255,255,0.35); font-weight:600; }
  .tab-item.active i, .tab-item.active span { color:#B8FF1E; }
  .tab-scan-btn { width:56px; height:56px; border-radius:20px; background:linear-gradient(135deg,#B8FF1E,#8BE000); display:flex; align-items:center; justify-content:center; margin-top:-14px; box-shadow:0 8px 24px rgba(184,255,30,0.4); }
  .tab-scan-btn i { font-size:22px; color:#0A0A0A; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="header">
    <div>
      <div class="greeting-label">早上好</div>
      <div class="greeting-name">Angela 👋</div>
    </div>
    <img class="avatar" src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=200&q=80" alt="">
  </div>

  <div style="margin:0 28px 14px; display:flex; align-items:center; gap:8px; background:rgba(0,194,255,0.08); border:1px solid rgba(0,194,255,0.25); padding:9px 14px; border-radius:14px;">
    <i class="fas fa-school" style="color:#00C2FF; font-size:12px"></i>
    <span style="font-size:11px; font-weight:700; color:#00C2FF; flex:1">林肯高中网球计划</span>
    <span style="font-size:9px; color:#0A0A0A; font-weight:800; background:#00C2FF; padding:3px 8px; border-radius:6px;">免费</span>
  </div>

  <div class="hero-card">
    <div class="hero-top">
      <div>
        <div class="hero-label">今日能量</div>
        <div class="hero-kcal">2,840<span>/3,200 千卡</span></div>
      </div>
      <div class="hero-sport-pill"><i class="fas fa-table-tennis-paddle-ball"></i> 网球</div>
    </div>
    <div class="macro-bars">
      <div class="macro">
        <div class="macro-name">蛋白质</div>
        <div class="macro-val">142g <span>/180</span></div>
        <div class="macro-bar-bg"><div class="macro-bar-fill" style="width:78%"></div></div>
      </div>
      <div class="macro">
        <div class="macro-name">碳水</div>
        <div class="macro-val">385g <span>/440</span></div>
        <div class="macro-bar-bg"><div class="macro-bar-fill" style="width:87%"></div></div>
      </div>
      <div class="macro">
        <div class="macro-name">脂肪</div>
        <div class="macro-val">72g <span>/90</span></div>
        <div class="macro-bar-bg"><div class="macro-bar-fill" style="width:80%"></div></div>
      </div>
    </div>
  </div>

  <div class="training-banner">
    <div class="training-icon"><i class="fas fa-table-tennis-paddle-ball"></i></div>
    <div class="training-info">
      <div class="training-label">下一训练</div>
      <div class="training-title">发球与对打训练</div>
      <div class="training-time">今天 · 下午 4:30 · 2小时后补充碳水</div>
    </div>
    <div class="training-dot"></div>
  </div>

  <div class="section-header">
    <div class="section-title">今日饮食计划</div>
    <div class="section-link">查看全部</div>
  </div>
  <div class="meals-scroll">
    <div class="meal-card">
      <div class="meal-img-wrap">
        <img class="meal-img" src="https://images.unsplash.com/photo-1494390248081-4e521a5940db?w=500&q=80">
        <div class="meal-time">早餐</div>
        <div class="meal-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="meal-body">
        <div class="meal-name">能量燕麦碗</div>
        <div class="meal-kcal">620 千卡 · 32g 蛋白质</div>
      </div>
    </div>
    <div class="meal-card">
      <div class="meal-img-wrap">
        <img class="meal-img" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80">
        <div class="meal-time">午餐</div>
        <div class="meal-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="meal-body">
        <div class="meal-name">鸡肉能量碗</div>
        <div class="meal-kcal">780 千卡 · 48g 蛋白质</div>
      </div>
    </div>
    <div class="meal-card">
      <div class="meal-img-wrap">
        <img class="meal-img" src="https://images.unsplash.com/photo-1559847844-5315695dadae?w=500&q=80">
        <div class="meal-time">赛前</div>
        <div class="meal-pending"></div>
      </div>
      <div class="meal-body">
        <div class="meal-name">香蕉 + 杏仁</div>
        <div class="meal-kcal">340 千卡 · 10g 蛋白质</div>
      </div>
    </div>
  </div>

  <div class="hydration" style="margin-top:20px">
    <div class="hydration-icon"><i class="fas fa-tint"></i></div>
    <div class="hydration-info">
      <div class="hydration-title">饮水量</div>
      <div class="hydration-val">2.4L<span> / 3.5L 目标</span></div>
    </div>
    <div style="display:flex;gap:4px;">
      <div style="width:8px;height:28px;border-radius:4px;background:#fff;"></div>
      <div style="width:8px;height:28px;border-radius:4px;background:#fff;"></div>
      <div style="width:8px;height:28px;border-radius:4px;background:rgba(255,255,255,0.3);"></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active"><i class="fas fa-home"></i><span>首页</span></div>
    <div class="tab-item"><i class="fas fa-utensils"></i><span>饮食</span></div>
    <div class="tab-item"><button class="tab-scan-btn"><i class="fas fa-camera"></i></button></div>
    <div class="tab-item"><i class="fas fa-calendar-alt"></i><span>日程</span></div>
    <div class="tab-item"><i class="fas fa-user"></i><span>我的</span></div>
  </div>
</div>
</body>
</html>
