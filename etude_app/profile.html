<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etude - Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; margin:0; padding:0; box-sizing:border-box; }
    .serif { font-family: 'Fraunces', serif; }
    *::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }
    body { width:100%; height:100%; background:#FBF7EF; overflow-y:auto; }
</style>
</head>
<body>
<div class="relative w-full min-h-full" style="background:#FBF7EF;">
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-7" style="height:59px; padding-top:16px;">
        <span class="text-[15px] font-semibold" style="color:#2B2119;">9:41</span>
        <div class="w-28 h-7 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-[11px]" style="color:#2B2119;"></i>
            <i class="fas fa-wifi text-[11px]" style="color:#2B2119;"></i>
            <i class="fas fa-battery-full text-[11px]" style="color:#2B2119;"></i>
        </div>
    </div>

    <div class="px-7 pb-32" style="padding-top:4px;">
        <!-- Header -->
        <div class="flex items-center gap-4 mb-6">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=160&h=160&fit=crop&crop=face" class="w-16 h-16 rounded-full object-cover" style="border:2px solid #fff; box-shadow:0 0 0 1px #EDE2D3;" />
            <div>
                <h1 class="serif text-[20px] font-semibold" style="color:#2B2119;">Maya Chen</h1>
                <p class="text-[12px]" style="color:#8A7B6E;">Violin · Piano · student since 2024</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="text-center bg-white rounded-2xl py-4" style="border:1px solid #EDE2D3;">
                <p class="text-[22px] font-extrabold" style="color:#2B2119;">24</p>
                <p class="text-[10px] font-medium" style="color:#8A7B6E;">Lessons</p>
            </div>
            <div class="text-center bg-white rounded-2xl py-4" style="border:1px solid #EDE2D3;">
                <p class="text-[22px] font-extrabold" style="color:#2B2119;">12</p>
                <p class="text-[10px] font-medium" style="color:#8A7B6E;">Day streak</p>
            </div>
            <div class="text-center bg-white rounded-2xl py-4" style="border:1px solid #EDE2D3;">
                <p class="text-[22px] font-extrabold" style="color:#2B2119;">38h</p>
                <p class="text-[10px] font-medium" style="color:#8A7B6E;">Logged</p>
            </div>
        </div>

        <!-- Teacher card -->
        <p class="text-[11.5px] font-semibold uppercase tracking-wide mb-2.5" style="color:#8A7B6E;">Your Teacher</p>
        <div class="flex items-center gap-3.5 bg-white rounded-2xl p-3.5 mb-6" style="border:1px solid #EDE2D3;">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop&crop=face" class="w-11 h-11 rounded-full object-cover" />
            <div class="flex-1">
                <p class="text-[13px] font-bold" style="color:#2B2119;">David Kim</p>
                <p class="text-[11px]" style="color:#8A7B6E;">Violin · Tue & Fri, 4:30 PM</p>
            </div>
            <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#F7EEE0;">
                <i class="fas fa-message text-[12px]" style="color:#7C5A2A;"></i>
            </div>
        </div>

        <!-- Settings -->
        <p class="text-[11.5px] font-semibold uppercase tracking-wide mb-2.5" style="color:#8A7B6E;">Settings</p>
        <div class="bg-white rounded-2xl overflow-hidden" style="border:1px solid #EDE2D3;">
            <div class="flex items-center gap-3.5 p-4" style="border-bottom:1px solid #F1E7D8;">
                <i class="fas fa-bell w-4 text-[14px]" style="color:#7C2A3B;"></i>
                <span class="text-[13.5px] font-medium flex-1" style="color:#2B2119;">Notifications</span>
                <i class="fas fa-chevron-right text-[11px]" style="color:#C7BBA9;"></i>
            </div>
            <div class="flex items-center gap-3.5 p-4" style="border-bottom:1px solid #F1E7D8;">
                <i class="fas fa-music w-4 text-[14px]" style="color:#7C2A3B;"></i>
                <span class="text-[13.5px] font-medium flex-1" style="color:#2B2119;">Instruments & Teachers</span>
                <i class="fas fa-chevron-right text-[11px]" style="color:#C7BBA9;"></i>
            </div>
            <div class="flex items-center gap-3.5 p-4" style="border-bottom:1px solid #F1E7D8;">
                <i class="fas fa-microphone w-4 text-[14px]" style="color:#7C2A3B;"></i>
                <span class="text-[13.5px] font-medium flex-1" style="color:#2B2119;">Recording Quality</span>
                <span class="text-[12px] mr-1" style="color:#8A7B6E;">High</span>
                <i class="fas fa-chevron-right text-[11px]" style="color:#C7BBA9;"></i>
            </div>
            <div class="flex items-center gap-3.5 p-4" style="border-bottom:1px solid #F1E7D8;">
                <i class="fas fa-file-export w-4 text-[14px]" style="color:#7C2A3B;"></i>
                <span class="text-[13.5px] font-medium flex-1" style="color:#2B2119;">Export Lesson Notes</span>
                <i class="fas fa-chevron-right text-[11px]" style="color:#C7BBA9;"></i>
            </div>
            <div class="flex items-center gap-3.5 p-4">
                <i class="fas fa-lock w-4 text-[14px]" style="color:#7C2A3B;"></i>
                <span class="text-[13.5px] font-medium flex-1" style="color:#2B2119;">Privacy & Storage</span>
                <i class="fas fa-chevron-right text-[11px]" style="color:#C7BBA9;"></i>
            </div>
        </div>

        <button class="w-full py-3.5 rounded-2xl text-[13.5px] font-semibold mt-6" style="background:#F7EEE0; color:#A6362F;">
            Sign Out
        </button>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl px-4 pt-2.5 pb-8" style="border-top:1px solid #EDE2D3;">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-house text-[17px]" style="color:#C7BBA9;"></i>
                <span class="text-[10px] font-medium" style="color:#C7BBA9;">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-calendar-week text-[17px]" style="color:#C7BBA9;"></i>
                <span class="text-[10px] font-medium" style="color:#C7BBA9;">Plan</span>
            </div>
            <div class="flex flex-col items-center justify-center -mt-7">
                <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#8C3347,#5E1E2C); box-shadow:0 8px 20px rgba(110,36,57,0.35);">
                    <i class="fas fa-microphone text-white text-[17px]"></i>
                </div>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-clock-rotate-left text-[17px]" style="color:#C7BBA9;"></i>
                <span class="text-[10px] font-medium" style="color:#C7BBA9;">History</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-user text-[17px]" style="color:#7C2A3B;"></i>
                <span class="text-[10px] font-bold" style="color:#7C2A3B;">Profile</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
