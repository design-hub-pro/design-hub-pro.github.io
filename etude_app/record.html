<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etude - Recording</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; margin:0; padding:0; box-sizing:border-box; }
    .serif { font-family: 'Fraunces', serif; }
    *::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }
    html, body { width:100%; height:100%; background:#000; }

    @keyframes bar1 { 0%,100%{height:8px;} 50%{height:22px;} }
    @keyframes bar2 { 0%,100%{height:15px;} 50%{height:6px;} }
    @keyframes bar3 { 0%,100%{height:24px;} 50%{height:10px;} }
    @keyframes bar4 { 0%,100%{height:9px;} 50%{height:19px;} }
    @keyframes pulse-ring { 0%{transform:scale(0.96); opacity:1;} 50%{transform:scale(1.06); opacity:0.6;} 100%{transform:scale(0.96); opacity:1;} }
    .pulse-dot { animation: pulse-ring 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="fixed inset-0 overflow-hidden">
    <!-- Camera feed -->
    <img src="https://images.unsplash.com/photo-1465821185615-20b3c2fbf41b?w=900&h=1400&fit=crop" class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0" style="background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 22%, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.85) 100%);"></div>

    <!-- Framing guide corners -->
    <div class="absolute" style="top:150px; left:24px; width:26px; height:26px; border-top:2px solid rgba(255,255,255,0.55); border-left:2px solid rgba(255,255,255,0.55); border-radius:6px 0 0 0;"></div>
    <div class="absolute" style="top:150px; right:24px; width:26px; height:26px; border-top:2px solid rgba(255,255,255,0.55); border-right:2px solid rgba(255,255,255,0.55); border-radius:0 6px 0 0;"></div>
    <div class="absolute" style="bottom:340px; left:24px; width:26px; height:26px; border-bottom:2px solid rgba(255,255,255,0.55); border-left:2px solid rgba(255,255,255,0.55); border-radius:0 0 0 6px;"></div>
    <div class="absolute" style="bottom:340px; right:24px; width:26px; height:26px; border-bottom:2px solid rgba(255,255,255,0.55); border-right:2px solid rgba(255,255,255,0.55); border-radius:0 0 6px 0;"></div>

    <div class="relative z-10 w-full h-full flex flex-col">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-7" style="height:59px; padding-top:16px;">
            <span class="text-[15px] font-semibold text-white">9:41</span>
            <div class="w-28 h-7 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-[11px] text-white"></i>
                <i class="fas fa-wifi text-[11px] text-white"></i>
                <i class="fas fa-battery-full text-[11px] text-white"></i>
            </div>
        </div>

        <!-- Top controls -->
        <div class="px-7 mt-3 flex items-center justify-between">
            <button class="w-9 h-9 rounded-full flex items-center justify-center" style="background:rgba(0,0,0,0.35);">
                <i class="fas fa-chevron-down text-white text-[14px]"></i>
            </button>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(225,88,80,0.25); border:1px solid rgba(225,88,80,0.4);">
                <div class="pulse-dot w-2 h-2 rounded-full" style="background:#E15850;"></div>
                <span class="text-[11px] font-bold tracking-wide text-white">REC · 24:18</span>
            </div>
            <button class="w-9 h-9 rounded-full flex items-center justify-center" style="background:rgba(0,0,0,0.35);">
                <i class="fas fa-camera-rotate text-white text-[14px]"></i>
            </button>
        </div>

        <div class="flex-1"></div>

        <!-- Bottom panel -->
        <div class="px-7 pb-9">
            <!-- Tags row -->
            <div class="flex items-center justify-center gap-2 mb-4">
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15);">
                    <i class="fas fa-music text-[10px]" style="color:#D4A94A;"></i>
                    <span class="text-[11.5px] font-semibold text-white">Violin · Mr. Kim</span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15);">
                    <i class="fas fa-video text-[10px] text-white"></i>
                    <span class="text-[11.5px] font-semibold text-white">1080p</span>
                </div>
            </div>

            <!-- Live transcript -->
            <div class="rounded-2xl p-3.5 mb-5" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1);">
                <div class="flex items-center gap-1.5 mb-1.5">
                    <i class="fas fa-closed-captioning text-[10px]" style="color:#D8C8B8;"></i>
                    <span class="text-[10px] font-semibold tracking-wide uppercase" style="color:#D8C8B8;">Live transcript</span>
                </div>
                <p class="text-[12.5px] leading-relaxed text-white">"&hellip;now let's work on the shift into third position. Keep your elbow under the violin&hellip;"</p>
            </div>

            <!-- Audio level -->
            <div class="flex items-end justify-center gap-[4px] mb-6" style="height:26px;">
                <div style="width:3px; border-radius:2px; background:#D4A94A; animation: bar2 1.1s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#E7C88A; animation: bar4 1.3s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#D4A94A; animation: bar1 0.9s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#F2A29C; animation: bar3 1.4s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#D4A94A; animation: bar2 1.0s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#E7C88A; animation: bar1 1.2s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#D4A94A; animation: bar4 0.8s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#F2A29C; animation: bar3 1.5s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#D4A94A; animation: bar2 1.1s ease-in-out infinite;"></div>
                <div style="width:3px; border-radius:2px; background:#E7C88A; animation: bar1 0.9s ease-in-out infinite;"></div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-6">
                <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.2);">
                    <i class="fas fa-pause text-white text-[16px]"></i>
                </button>
                <button class="w-20 h-20 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#E15850,#A6362F); box-shadow:0 10px 26px rgba(193,68,59,0.45);">
                    <i class="fas fa-stop text-white text-[22px]"></i>
                </button>
                <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.2);">
                    <i class="fas fa-bolt text-white text-[16px]"></i>
                </button>
            </div>
            <p class="text-center text-[11px] mt-4" style="color:#D8C8B8;">Etude will find topics & cut clips when you stop</p>
        </div>
    </div>
</div>
</body>
</html>
