<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etude - Recording</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; margin:0; padding:0; box-sizing:border-box; }
    .serif { font-family: 'Fraunces', serif; }
    *::-webkit-scrollbar { display:none; }
    * { scrollbar-width:none; }
    body { width:100%; height:100%; background:#241219; }

    @keyframes bar1 { 0%,100%{height:14px;} 50%{height:52px;} }
    @keyframes bar2 { 0%,100%{height:34px;} 50%{height:14px;} }
    @keyframes bar3 { 0%,100%{height:60px;} 50%{height:24px;} }
    @keyframes bar4 { 0%,100%{height:20px;} 50%{height:48px;} }
    @keyframes bar5 { 0%,100%{height:44px;} 50%{height:16px;} }
    @keyframes pulse-ring { 0%{transform:scale(0.96); opacity:1;} 50%{transform:scale(1.06); opacity:0.6;} 100%{transform:scale(0.96); opacity:1;} }
    .pulse-dot { animation: pulse-ring 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="relative w-full h-full" style="background:radial-gradient(120% 80% at 50% 0%, #3A1B26 0%, #241219 60%);">
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-7" style="height:59px; padding-top:16px;">
        <span class="text-[15px] font-semibold text-white">9:41</span>
        <div class="w-28 h-7 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-[11px] text-white"></i>
            <i class="fas fa-wifi text-[11px] text-white"></i>
            <i class="fas fa-battery-full text-[11px] text-white"></i>
        </div>
    </div>

    <div class="px-7 pt-3">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <i class="fas fa-chevron-down text-[16px]" style="color:#C7A7AE;"></i>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(193,68,59,0.18);">
                <div class="pulse-dot w-2 h-2 rounded-full" style="background:#E15850;"></div>
                <span class="text-[11px] font-bold tracking-wide" style="color:#F2A29C;">RECORDING</span>
            </div>
            <i class="fas fa-ellipsis" style="color:#C7A7AE;"></i>
        </div>

        <!-- Lesson tag -->
        <div class="flex justify-center mb-3">
            <div class="flex items-center gap-2 px-4 py-2 rounded-full" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);">
                <i class="fas fa-music text-[11px]" style="color:#D4A94A;"></i>
                <span class="text-[12px] font-semibold text-white">Violin · Mr. Kim</span>
            </div>
        </div>

        <!-- Timer -->
        <p class="text-center serif text-white font-semibold" style="font-size:56px; letter-spacing:-1px;">24:18</p>
        <p class="text-center text-[12.5px] mt-1" style="color:#B49BA1;">Lesson #25 · started 4:31 PM</p>

        <!-- Waveform -->
        <div class="flex items-end justify-center gap-[5px] mt-10 mb-10" style="height:64px;">
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar2 1.1s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#E7C88A; animation: bar4 1.3s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar1 0.9s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#F2A29C; animation: bar3 1.4s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar5 1.0s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#E7C88A; animation: bar2 1.2s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar4 0.8s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#F2A29C; animation: bar1 1.5s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar3 1.1s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#E7C88A; animation: bar5 0.9s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar2 1.3s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#F2A29C; animation: bar4 1.0s ease-in-out infinite;"></div>
            <div style="width:4px; border-radius:3px; background:#D4A94A; animation: bar1 1.2s ease-in-out infinite;"></div>
        </div>

        <!-- Live transcript -->
        <div class="rounded-2xl p-4 mb-8" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);">
            <div class="flex items-center gap-1.5 mb-2">
                <i class="fas fa-closed-captioning text-[11px]" style="color:#B49BA1;"></i>
                <span class="text-[10.5px] font-semibold tracking-wide uppercase" style="color:#B49BA1;">Live transcript</span>
            </div>
            <p class="text-[13px] leading-relaxed" style="color:#EDE1E4;">"&hellip;good, now let's work on the shift into third position. Keep your elbow under the violin, and land the finger softly&hellip;"</p>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-6">
            <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-pause text-white text-[16px]"></i>
            </button>
            <button class="w-20 h-20 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#E15850,#A6362F); box-shadow:0 10px 26px rgba(193,68,59,0.4);">
                <i class="fas fa-stop text-white text-[22px]"></i>
            </button>
            <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);">
                <i class="fas fa-microphone-lines text-white text-[16px]"></i>
            </button>
        </div>
        <p class="text-center text-[11.5px] mt-5" style="color:#8C7278;">Etude will auto-generate a summary when you stop</p>
    </div>
</div>
</body>
</html>
