<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etude - Private Lesson Companion</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .serif { font-family: 'Fraunces', serif; }
    *::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    .phone-frame {
        width: 460px;
        height: 980px;
        border-radius: 62px;
        padding: 12px;
        background: #2B2119;
        box-shadow: 0 25px 60px rgba(43,33,25,0.18), inset 0 0 0 2px rgba(255,255,255,0.06);
        flex-shrink: 0;
    }
    .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 52px;
        overflow: hidden;
        background: #FBF7EF;
    }
    .phone-screen iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <div class="text-center py-16 px-6">
        <div class="flex items-center justify-center gap-4 mb-4">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#8C3347,#5E1E2C);">
                <i class="fas fa-music text-white text-2xl"></i>
            </div>
            <h1 class="serif text-5xl font-bold text-gray-900">Etude</h1>
        </div>
        <p class="text-gray-500 text-lg max-w-xl mx-auto">Private instrument lesson recorder & practice companion</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1500px] mx-auto px-8 pb-24">
        <div class="grid grid-cols-3 gap-10 justify-items-center">
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Onboarding</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Home</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="record.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Record Lesson (Video)</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="clip-editor.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Cut Clips</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="summary.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">AI Lesson Summary</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="plan.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Practice Plan</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="history.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Lesson History</p>
            </div>
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Profile</p>
            </div>
        </div>
    </div>
</body>
</html>
