<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidMind - AI-Powered Video Knowledge Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #ffffff; }
        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a2e;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255,255,255,0.05) inset;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #0a0a1a;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="text-center py-16 px-6">
        <div class="flex items-center justify-center gap-4 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-purple-600 to-indigo-700 rounded-2xl flex items-center justify-center shadow-lg shadow-purple-200">
                <i class="fas fa-brain text-white text-2xl"></i>
            </div>
            <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight">VidMind</h1>
        </div>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed">AI-Powered Video Knowledge Retrieval Engine</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1520px] mx-auto px-8 pb-20">
        <div class="grid grid-cols-3 gap-10 justify-items-center">

            <!-- Home -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">Home</p>
            </div>

            <!-- Search Results -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="search.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">AI Search</p>
            </div>

            <!-- Video Detail -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="video.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">Video Detail</p>
            </div>

            <!-- Library -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="library.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">Library</p>
            </div>

            <!-- Explore -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="explore.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">Explore</p>
            </div>

            <!-- Profile -->
            <div class="text-center">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-sm font-semibold text-gray-700">Profile</p>
            </div>

        </div>
    </div>

</body>
</html>
