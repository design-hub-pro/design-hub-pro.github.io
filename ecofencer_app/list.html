<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco-Fencer - List Item</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #fff; width: 100%; height: 100%; overflow-x: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    background: #fff; position: sticky; top: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

  .content { padding: 0 28px 120px; background: #fff; min-height: 100vh; }

  .page-title { font-size: 32px; font-weight: 800; color: #1C1C1E; padding: 14px 0 6px; }
  .page-sub { font-size: 14px; color: #8E8E93; margin-bottom: 24px; }

  /* Photo Upload */
  .photo-upload {
    display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto;
  }
  .photo-main {
    width: 160px; height: 160px; border-radius: 24px; background: linear-gradient(135deg, #E8F5E9, #F0FFF4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 2px dashed #34C759; flex-shrink: 0;
  }
  .photo-main i { font-size: 32px; color: #34C759; }
  .photo-main span { font-size: 12px; color: #34C759; font-weight: 600; }
  .photo-thumb {
    width: 76px; height: 76px; border-radius: 16px; overflow: hidden; flex-shrink: 0; position: relative;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-remove {
    position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
    background: #FF3B30; color: #fff; font-size: 10px; display: flex; align-items: center;
    justify-content: center; border: 2px solid #fff;
  }

  /* Type Selector */
  .type-selector { display: flex; gap: 10px; margin-bottom: 24px; }
  .type-option {
    flex: 1; padding: 16px 12px; border-radius: 18px; text-align: center;
    border: 2px solid #E5E5EA; background: #fff; transition: all 0.2s;
  }
  .type-option.active { border-color: #34C759; background: #F0FFF4; }
  .type-option i { font-size: 24px; margin-bottom: 6px; display: block; }
  .type-option.active i { color: #34C759; }
  .type-option span { font-size: 13px; font-weight: 600; color: #3C3C43; display: block; }
  .type-option .type-desc { font-size: 11px; color: #8E8E93; margin-top: 2px; display: block; }

  /* Form Fields */
  .form-group { margin-bottom: 20px; }
  .form-label { font-size: 13px; font-weight: 600; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .form-input {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #E5E5EA;
    font-size: 16px; font-family: 'Inter', sans-serif; color: #1C1C1E; background: #F9F9FB;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: #34C759; background: #fff; }
  .form-input::placeholder { color: #C7C7CC; }

  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  /* Condition Slider */
  .condition-visual { display: flex; gap: 8px; margin-top: 8px; }
  .condition-step {
    flex: 1; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; border: 1.5px solid #E5E5EA; color: #8E8E93; background: #F9F9FB;
  }
  .condition-step.active { border-color: #34C759; background: #E8F5E9; color: #34C759; }

  /* Price Section */
  .price-section {
    background: #F9F9FB; border-radius: 20px; padding: 18px; margin-bottom: 24px;
  }
  .price-row { display: flex; align-items: center; gap: 12px; }
  .price-symbol { font-size: 28px; font-weight: 800; color: #34C759; }
  .price-input {
    flex: 1; border: none; background: none; font-size: 36px; font-weight: 800; color: #1C1C1E;
    font-family: 'Inter', sans-serif; outline: none;
  }
  .price-input::placeholder { color: #D1D1D6; }
  .price-suggestion { font-size: 12px; color: #8E8E93; margin-top: 8px; }
  .price-suggestion strong { color: #34C759; }

  /* Submit Button */
  .submit-btn {
    width: 100%; height: 56px; border-radius: 16px; border: none; font-size: 17px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #34C759, #30D158); display: flex;
    align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
    box-shadow: 0 4px 20px rgba(52,199,89,0.3);
  }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: none; }
  .tab-item i { font-size: 22px; color: #8E8E93; }
  .tab-item span { font-size: 10px; color: #8E8E93; font-weight: 500; }
  .tab-item.active i { color: #34C759; }
  .tab-item.active span { color: #34C759; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="content">
  <div class="page-title">List Gear</div>
  <div class="page-sub">Sell or donate your equipment</div>

  <!-- Photo Upload -->
  <div class="photo-upload">
    <div class="photo-main">
      <i class="fas fa-camera-retro"></i>
      <span>Add Photos</span>
    </div>
    <div class="photo-thumb">
      <img src="https://images.pexels.com/photos/6538992/pexels-photo-6538992.jpeg?auto=compress&cs=tinysrgb&w=200" alt="">
      <div class="photo-remove"><i class="fas fa-xmark"></i></div>
    </div>
    <div class="photo-thumb">
      <img src="https://images.pexels.com/photos/6832427/pexels-photo-6832427.jpeg?auto=compress&cs=tinysrgb&w=200" alt="">
      <div class="photo-remove"><i class="fas fa-xmark"></i></div>
    </div>
  </div>

  <!-- Type Selector -->
  <div class="type-selector">
    <div class="type-option active">
      <i class="fas fa-tag"></i>
      <span>Sell</span>
      <span class="type-desc">Set a price</span>
    </div>
    <div class="type-option">
      <i class="fas fa-gift"></i>
      <span>Donate</span>
      <span class="type-desc">Give free</span>
    </div>
    <div class="type-option">
      <i class="fas fa-arrows-rotate"></i>
      <span>Trade</span>
      <span class="type-desc">Swap gear</span>
    </div>
  </div>

  <!-- Form -->
  <div class="form-group">
    <div class="form-label">Item Name</div>
    <input class="form-input" type="text" placeholder="e.g. Uhlmann Foil Mask" value="FIE Foil Mask 1600N">
  </div>

  <div class="form-row">
    <div class="form-group">
      <div class="form-label">Category</div>
      <input class="form-input" type="text" value="Masks">
    </div>
    <div class="form-group">
      <div class="form-label">Discipline</div>
      <input class="form-input" type="text" value="Foil">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <div class="form-label">Size</div>
      <input class="form-input" type="text" value="Medium">
    </div>
    <div class="form-group">
      <div class="form-label">Brand</div>
      <input class="form-input" type="text" value="Uhlmann">
    </div>
  </div>

  <!-- Condition -->
  <div class="form-group">
    <div class="form-label">Condition</div>
    <div class="condition-visual">
      <div class="condition-step">Fair</div>
      <div class="condition-step">Good</div>
      <div class="condition-step active">Excellent</div>
      <div class="condition-step">Like New</div>
    </div>
  </div>

  <!-- Price -->
  <div class="price-section">
    <div class="form-label">Your Price</div>
    <div class="price-row">
      <span class="price-symbol">$</span>
      <input class="price-input" type="text" placeholder="0" value="45">
    </div>
    <div class="price-suggestion">Suggested: <strong>$40 – $55</strong> based on condition</div>
  </div>

  <button class="submit-btn">
    <i class="fas fa-rocket"></i> Publish Listing
  </button>
</div>

<div class="tab-bar">
  <div class="tab-item">
    <i class="fas fa-house"></i>
    <span>Home</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-magnifying-glass"></i>
    <span>Browse</span>
  </div>
  <div class="tab-item active">
    <i class="fas fa-circle-plus"></i>
    <span>List</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-comment-dots"></i>
    <span>Messages</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-user"></i>
    <span>Profile</span>
  </div>
</div>

</body>
</html>
