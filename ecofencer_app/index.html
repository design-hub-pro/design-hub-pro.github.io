<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco-Fencer — Fencing Equipment Marketplace</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #ffffff;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 80px 40px 60px;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px;
  }
  .logo-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, #34C759, #2E7D32);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff;
  }
  .logo-text {
    font-size: 42px; font-weight: 900; letter-spacing: -1.5px; color: #1C1C1E;
  }
  .logo-text span { color: #34C759; }
  .subtitle {
    font-size: 18px; color: #8E8E93; font-weight: 400; max-width: 520px; margin: 0 auto; line-height: 1.5;
  }

  /* Screenshots Section */
  .screenshots-section {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 60px 80px;
  }

  .phone-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px;
    justify-items: center;
    max-width: 1560px;
    margin: 0 auto;
  }

  /* Phone Frame */
  .phone-wrapper {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .phone-label {
    font-size: 14px; font-weight: 600; color: #8E8E93; text-transform: uppercase; letter-spacing: 1px;
  }
  .phone-frame {
    width: 460px;
    height: 980px;
    border-radius: 62px;
    background: #000;
    padding: 12px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.1),
      0 20px 60px rgba(0,0,0,0.15),
      0 8px 20px rgba(0,0,0,0.08),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 52px;
    overflow: hidden;
    background: #fff;
  }
  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 40px;
    color: #C7C7CC;
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo-row">
    <div class="logo-icon"><i class="fas fa-person-running"></i></div>
    <div class="logo-text">Eco<span>-Fencer</span></div>
  </div>
  <p class="subtitle">Sustainable fencing equipment marketplace for Southern California clubs — buy, sell, donate, and reduce waste.</p>
</div>

<!-- Screenshots -->
<div class="screenshots-section">
  <div class="phone-grid">

    <div class="phone-wrapper">
      <span class="phone-label">Home</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="home.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Browse</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="browse.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Item Detail</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="detail.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">List Gear</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="list.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Messages</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="messages.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Chat</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="chat.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Profile</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="profile.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <div class="phone-wrapper">
      <span class="phone-label">Donation Center</span>
      <div class="phone-frame">
        <div class="phone-screen">
          <iframe src="donate.html" scrolling="no"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<div class="footer">
  Eco-Fencer &copy; 2026 — Sustainable Fencing Equipment Marketplace
</div>

</body>
</html>
