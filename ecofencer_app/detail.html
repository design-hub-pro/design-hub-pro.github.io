<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco-Fencer - Detail</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #fff; width: 100%; height: 100%; overflow-x: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    background: #fff; position: sticky; top: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }

  .content { padding: 0 0 120px; background: #fff; }

  /* Nav Bar */
  .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 28px 12px; }
  .nav-back { font-size: 20px; color: #34C759; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 12px; }
  .nav-actions { display: flex; gap: 10px; }
  .nav-action { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #F2F2F7; border-radius: 12px; font-size: 18px; color: #3C3C43; }

  /* Image Gallery */
  .gallery { width: 100%; height: 320px; position: relative; overflow: hidden; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .gallery-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
  .gallery-dot.active { background: #fff; width: 24px; border-radius: 4px; }
  .gallery-badge {
    position: absolute; top: 16px; right: 16px; background: #34C759; color: #fff;
    padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: 700;
  }

  .detail-content { padding: 20px 28px; }

  /* Title Section */
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .detail-title { font-size: 24px; font-weight: 800; color: #1C1C1E; line-height: 1.2; flex: 1; }
  .detail-price { font-size: 28px; font-weight: 800; color: #34C759; }

  .detail-subtitle { font-size: 14px; color: #8E8E93; margin-top: 6px; }

  /* Condition Bar */
  .condition-bar { margin: 20px 0; }
  .condition-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .condition-title { font-size: 14px; font-weight: 600; color: #1C1C1E; }
  .condition-value { font-size: 14px; font-weight: 700; color: #34C759; }
  .condition-track { height: 8px; background: #F2F2F7; border-radius: 4px; overflow: hidden; }
  .condition-fill { height: 100%; width: 85%; background: linear-gradient(90deg, #34C759, #30D158); border-radius: 4px; }

  /* Specs Grid */
  .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .spec-card {
    background: #F9F9FB; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px;
  }
  .spec-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .spec-label { font-size: 11px; color: #8E8E93; font-weight: 500; }
  .spec-value { font-size: 14px; font-weight: 700; color: #1C1C1E; margin-top: 1px; }

  /* Seller Card */
  .seller-card {
    display: flex; align-items: center; gap: 14px; padding: 16px; background: #F9F9FB;
    border-radius: 20px; margin: 20px 0;
  }
  .seller-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .seller-info { flex: 1; }
  .seller-name { font-size: 16px; font-weight: 700; color: #1C1C1E; }
  .seller-meta { font-size: 12px; color: #8E8E93; margin-top: 2px; }
  .seller-rating { display: flex; align-items: center; gap: 3px; margin-top: 3px; }
  .seller-rating i { font-size: 11px; color: #FF9500; }
  .seller-rating span { font-size: 12px; color: #8E8E93; font-weight: 500; }
  .seller-btn {
    width: 44px; height: 44px; border-radius: 14px; background: #34C759; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; border: none;
  }

  /* Eco Impact */
  .eco-card {
    background: linear-gradient(135deg, #E8F5E9, #F0FFF4); border-radius: 20px; padding: 18px; margin: 16px 0;
    display: flex; align-items: center; gap: 14px;
  }
  .eco-icon { width: 48px; height: 48px; border-radius: 16px; background: #34C759; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .eco-text { flex: 1; }
  .eco-title { font-size: 15px; font-weight: 700; color: #1C1C1E; }
  .eco-desc { font-size: 12px; color: #6D6D72; margin-top: 2px; }

  /* Action Buttons */
  .action-row {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .btn-primary {
    flex: 1; height: 54px; border-radius: 16px; background: #34C759; color: #fff;
    font-size: 16px; font-weight: 700; border: none; display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .btn-secondary {
    width: 54px; height: 54px; border-radius: 16px; background: #F2F2F7; color: #3C3C43;
    font-size: 20px; border: none; display: flex; align-items: center; justify-content: center;
  }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: none; }
  .tab-item i { font-size: 22px; color: #8E8E93; }
  .tab-item span { font-size: 10px; color: #8E8E93; font-weight: 500; }
  .tab-item.active i { color: #34C759; }
  .tab-item.active span { color: #34C759; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="content">
  <div class="nav-bar">
    <div class="nav-back"><i class="fas fa-chevron-left"></i></div>
    <div class="nav-actions">
      <div class="nav-action"><i class="far fa-heart"></i></div>
      <div class="nav-action"><i class="fas fa-share-from-square"></i></div>
    </div>
  </div>

  <div class="gallery">
    <img src="https://images.pexels.com/photos/6538992/pexels-photo-6538992.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Fencing Mask">
    <span class="gallery-badge"><i class="fas fa-camera"></i> 1/4</span>
    <div class="gallery-dots">
      <span class="gallery-dot active"></span>
      <span class="gallery-dot"></span>
      <span class="gallery-dot"></span>
      <span class="gallery-dot"></span>
    </div>
  </div>

  <div class="detail-content">
    <div class="detail-header">
      <div>
        <div class="detail-title">Uhlmann FIE Foil Mask</div>
        <div class="detail-subtitle">1600N · CE Certified · Size Medium</div>
      </div>
      <div class="detail-price">$45</div>
    </div>

    <!-- Condition -->
    <div class="condition-bar">
      <div class="condition-label">
        <span class="condition-title">Condition</span>
        <span class="condition-value">Excellent (85%)</span>
      </div>
      <div class="condition-track">
        <div class="condition-fill"></div>
      </div>
    </div>

    <!-- Specs -->
    <div class="specs-grid">
      <div class="spec-card">
        <div class="spec-icon" style="background: linear-gradient(135deg, #FFE5E5, #FFD6D6); color: #FF3B30;">
          <i class="fas fa-ruler"></i>
        </div>
        <div>
          <div class="spec-label">Size</div>
          <div class="spec-value">Medium</div>
        </div>
      </div>
      <div class="spec-card">
        <div class="spec-icon" style="background: linear-gradient(135deg, #E5F0FF, #D6E8FF); color: #007AFF;">
          <i class="fas fa-shield-halved"></i>
        </div>
        <div>
          <div class="spec-label">Type</div>
          <div class="spec-value">Foil</div>
        </div>
      </div>
      <div class="spec-card">
        <div class="spec-icon" style="background: linear-gradient(135deg, #FFF5E5, #FFECD6); color: #FF9500;">
          <i class="fas fa-calendar"></i>
        </div>
        <div>
          <div class="spec-label">Used</div>
          <div class="spec-value">8 months</div>
        </div>
      </div>
      <div class="spec-card">
        <div class="spec-icon" style="background: linear-gradient(135deg, #E5FFE9, #D6FFD6); color: #34C759;">
          <i class="fas fa-tag"></i>
        </div>
        <div>
          <div class="spec-label">Retail</div>
          <div class="spec-value">$120</div>
        </div>
      </div>
    </div>

    <!-- Seller -->
    <div class="seller-card">
      <img class="seller-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80" alt="">
      <div class="seller-info">
        <div class="seller-name">Sarah Chen</div>
        <div class="seller-meta">Irvine Fencing Center</div>
        <div class="seller-rating">
          <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
          <span>4.8 (23 sales)</span>
        </div>
      </div>
      <button class="seller-btn"><i class="fas fa-comment"></i></button>
    </div>

    <!-- Eco Impact -->
    <div class="eco-card">
      <div class="eco-icon"><i class="fas fa-leaf"></i></div>
      <div class="eco-text">
        <div class="eco-title">Saves 2.4 kg CO₂</div>
        <div class="eco-desc">Buying used saves resources & reduces waste</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="btn-secondary"><i class="fas fa-comment-dots"></i></button>
      <button class="btn-primary"><i class="fas fa-bag-shopping"></i> Buy Now · $45</button>
    </div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-item">
    <i class="fas fa-house"></i>
    <span>Home</span>
  </div>
  <div class="tab-item active">
    <i class="fas fa-magnifying-glass"></i>
    <span>Browse</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-circle-plus"></i>
    <span>List</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-comment-dots"></i>
    <span>Messages</span>
  </div>
  <div class="tab-item">
    <i class="fas fa-user"></i>
    <span>Profile</span>
  </div>
</div>

</body>
</html>
