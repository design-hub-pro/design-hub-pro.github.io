<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0E9B8E;--accent2:#45C9B0;--ink:#0D1A1B;--muted:#6E8081;--faint:#9BABAC;--border:#E3EBEA}
body{font-family:'Inter',sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1620px;margin:0 auto;padding:80px 40px 100px}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:14px}
.icon{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;box-shadow:0 16px 30px -14px rgba(14,155,142,.9)}
.hero h1{font-size:46px;font-weight:800;letter-spacing:-1.8px}
.hero p{font-size:17px;color:var(--muted);font-weight:500;margin-top:6px}
.tags{display:flex;gap:9px;margin:22px 0 56px}
.tag{padding:7px 14px;border-radius:11px;background:#F1FAF8;color:#0B7F72;font-size:12px;font-weight:700;letter-spacing:.3px;border:1px solid #D9EEE9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:58px 40px;justify-items:center}
.item{width:460px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0D1A1B;box-shadow:0 40px 80px -34px rgba(13,26,27,.55),0 0 0 1px rgba(13,26,27,.06)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#fff}
.cap{display:flex;align-items:baseline;gap:10px;margin-top:20px;padding-left:6px}
.cap b{font-size:17px;font-weight:700;letter-spacing:-.3px}
.cap span{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:1.4px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon"><i class="fa-solid fa-face-smile"></i></div>
    <div>
      <h1>Mirra</h1>
      <p>Film your face, see which muscles lag, and train them back.</p>
    </div>
  </div>
  <div class="tags">
    <span class="tag">Facial rehab</span>
    <span class="tag">Computer vision</span>
    <span class="tag">Recovery tracking</span>
    <span class="tag">Guided training</span>
  </div>

  <div class="grid">
    <div class="item"><div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div><div class="cap"><b>Baseline setup</b><span>01</span></div></div>
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="cap"><b>Today</b><span>02</span></div></div>
    <div class="item"><div class="frame"><iframe src="scan.html" scrolling="no"></iframe></div><div class="cap"><b>Face scan</b><span>03</span></div></div>
    <div class="item"><div class="frame"><iframe src="result.html" scrolling="no"></iframe></div><div class="cap"><b>Scan report</b><span>04</span></div></div>
    <div class="item"><div class="frame"><iframe src="train.html" scrolling="no"></iframe></div><div class="cap"><b>Guided session</b><span>05</span></div></div>
    <div class="item"><div class="frame"><iframe src="progress.html" scrolling="no"></iframe></div><div class="cap"><b>Progress</b><span>06</span></div></div>
  </div>
</div>
</body>
</html>
