<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirra · Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%;scrollbar-width:none}
:root{--accent:#0E9B8E;--accent2:#45C9B0;--ink:#F2F7F6;--muted:#8FA3A3;--faint:#61787A;--line:rgba(255,255,255,.12);--rose:#F0604A}
body{font-family:'Inter',sans-serif;background:#08110F;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#08110F}
.num{font-variant-numeric:tabular-nums}
.status{position:relative;height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:9}
.st-time{font-size:15px;font-weight:700}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:116px;height:34px;border-radius:20px;background:#000}
.st-ic{display:flex;gap:6px;font-size:13px}
.pad{padding:0 28px}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-top:4px;position:relative;z-index:9}
.rnd{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-size:14px}
.pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.09);border-radius:12px;padding:8px 14px}
.pill .meta{color:#fff}
.rec{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--rose)}
.rec i{width:7px;height:7px;border-radius:50%;background:var(--rose);display:block}
/* viewfinder */
.vf{position:relative;margin:18px 20px 0;height:472px;border-radius:30px;overflow:hidden;background:#0C1614}
.vf img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:saturate(.72) contrast(1.05) brightness(.78)}
.vf .tint{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,rgba(8,17,15,0) 40%,rgba(8,17,15,.86) 100%)}
.vf svg.mesh{position:absolute;inset:0;width:100%;height:100%}
.br{position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.8);border-radius:4px}
.br.tl{top:18px;left:18px;border-right:0;border-bottom:0}
.br.tr{top:18px;right:18px;border-left:0;border-bottom:0}
.br.bl{bottom:18px;left:18px;border-right:0;border-top:0}
.br.brr{bottom:18px;right:18px;border-left:0;border-top:0}
.cue{position:absolute;top:26px;left:0;right:0;text-align:center}
.cue h2{font-size:27px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cue p{font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.6);margin-top:6px}
.hold{position:absolute;top:22px;right:26px;width:56px;height:56px}
.hold .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
/* side readouts */
.side{position:absolute;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end}
.sd{background:rgba(9,20,18,.62);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:104px}
.sd .k{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}
.sd .v{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.sd .v small{font-size:11px;font-weight:700;color:var(--muted);margin-left:3px}
.sd.weak .v{color:#F4B63F}
.delta{background:rgba(9,20,18,.62);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:9px 14px;text-align:center}
.delta .k{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}
.delta .v{font-size:16px;font-weight:800;color:var(--accent2);margin-top:2px}
/* strip */
.strip{display:flex;gap:8px;padding:20px 28px 0;overflow-x:auto}
.fr{flex:none;width:52px}
.fr .box{height:52px;border-radius:13px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--faint);border:1.5px solid transparent}
.fr.done .box{background:rgba(14,155,142,.18);color:var(--accent2)}
.fr.act .box{border-color:var(--accent2);background:linear-gradient(135deg,rgba(14,155,142,.35),rgba(69,201,176,.2));color:#fff}
.fr span{display:block;text-align:center;font-size:9px;font-weight:700;color:var(--faint);margin-top:6px;letter-spacing:.4px}
.fr.act span{color:#fff}
/* shutter */
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px 46px 0}
.shbtn{position:relative;width:78px;height:78px}
.shbtn .core{position:absolute;inset:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;box-shadow:0 10px 24px -8px rgba(14,155,142,.9)}
.ghost{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
.foot{text-align:center;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.3px;margin-top:16px}
</style>
</head>
<body>
<div class="screen">
  <div class="status"><div class="st-time num">9:41</div><div class="island"></div>
    <div class="st-ic"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>

  <div class="pad">
    <div class="top">
      <div class="rnd"><i class="fa-solid fa-xmark"></i></div>
      <div class="pill"><span class="meta num">Expression 3 / 8</span><span class="rec"><i></i><span class="num">00:24</span></span></div>
      <div class="rnd"><i class="fa-solid fa-bolt"></i></div>
    </div>
  </div>

  <div class="vf">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1787436325029-image-1.png" alt="">
    <div class="tint"></div>
    <svg class="mesh" viewBox="0 0 396 472" preserveAspectRatio="none">
      <line x1="198" y1="96" x2="198" y2="418" stroke="#45C9B0" stroke-width="1.4" stroke-dasharray="6 7" opacity=".85"/>
      <g fill="#7FE7D2" opacity=".9">
        <circle cx="132" cy="168" r="2.6"/><circle cx="152" cy="158" r="2.6"/><circle cx="172" cy="156" r="2.6"/>
        <circle cx="224" cy="152" r="2.6"/><circle cx="244" cy="150" r="2.6"/><circle cx="264" cy="158" r="2.6"/>
        <circle cx="140" cy="212" r="2.6"/><circle cx="164" cy="206" r="2.6"/><circle cx="232" cy="203" r="2.6"/><circle cx="256" cy="209" r="2.6"/>
        <circle cx="198" cy="252" r="2.6"/><circle cx="180" cy="286" r="2.6"/><circle cx="216" cy="286" r="2.6"/>
        <circle cx="156" cy="318" r="2.6"/><circle cx="198" cy="326" r="2.6"/><circle cx="240" cy="318" r="2.6"/>
        <circle cx="168" cy="352" r="2.6"/><circle cx="198" cy="360" r="2.6"/><circle cx="228" cy="352" r="2.6"/>
        <circle cx="122" cy="262" r="2.6"/><circle cx="274" cy="262" r="2.6"/>
      </g>
      <g stroke="#45C9B0" stroke-width="1.1" fill="none" opacity=".55">
        <path d="M132 168 L152 158 L172 156"/><path d="M224 152 L244 150 L264 158"/>
        <path d="M140 212 L164 206"/><path d="M232 203 L256 209"/>
        <path d="M156 318 L198 326 L240 318"/><path d="M168 352 L198 360 L228 352"/>
        <path d="M122 262 L156 318"/><path d="M274 262 L240 318"/>
        <path d="M198 252 L180 286 L216 286 Z"/>
      </g>
      <g stroke="#F4B63F" stroke-width="1.6" fill="none" opacity=".95">
        <path d="M224 152 L244 150 L264 158"/>
      </g>
    </svg>
    <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
    <div class="cue"><h2>Raise brows</h2><p>HOLD STILL</p></div>
    <div class="hold">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="rgba(9,20,18,.55)" stroke="rgba(255,255,255,.16)" stroke-width="3"/>
        <circle cx="28" cy="28" r="24" fill="none" stroke="#45C9B0" stroke-width="3" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="50" transform="rotate(-90 28 28)"/>
      </svg>
      <div class="n num">2</div>
    </div>
    <div class="side">
      <div class="sd"><div class="k">LEFT BROW</div><div class="v num">14.2<small>mm</small></div></div>
      <div class="delta"><div class="k">MATCH</div><div class="v num">63%</div></div>
      <div class="sd weak" style="text-align:right"><div class="k">RIGHT BROW</div><div class="v num">8.9<small>mm</small></div></div>
    </div>
  </div>

  <div class="strip">
    <div class="fr done"><div class="box"><i class="fa-solid fa-face-meh"></i></div><span>REST</span></div>
    <div class="fr done"><div class="box"><i class="fa-solid fa-eye-slash"></i></div><span>CLOSE</span></div>
    <div class="fr act"><div class="box"><i class="fa-solid fa-arrows-up-down"></i></div><span>BROW</span></div>
    <div class="fr"><div class="box"><i class="fa-solid fa-face-smile"></i></div><span>SMILE</span></div>
    <div class="fr"><div class="box"><i class="fa-solid fa-face-kiss"></i></div><span>PUCKER</span></div>
    <div class="fr"><div class="box"><i class="fa-solid fa-wind"></i></div><span>PUFF</span></div>
    <div class="fr"><div class="box"><i class="fa-solid fa-face-frown"></i></div><span>FROWN</span></div>
    <div class="fr"><div class="box"><i class="fa-solid fa-teeth"></i></div><span>SNARL</span></div>
  </div>

  <div class="sh">
    <div class="ghost"><i class="fa-solid fa-rotate"></i></div>
    <div class="shbtn">
      <svg width="78" height="78" viewBox="0 0 78 78" style="position:absolute;inset:0">
        <circle cx="39" cy="39" r="36" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="4"/>
        <circle cx="39" cy="39" r="36" fill="none" stroke="#45C9B0" stroke-width="4" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="141" transform="rotate(-90 39 39)"/>
      </svg>
      <div class="core"><i class="fa-solid fa-pause"></i></div>
    </div>
    <div class="ghost"><i class="fa-solid fa-forward-step"></i></div>
  </div>
  <div class="foot num">37% captured · 54 s left · 62 landmarks tracked</div>
</div>
</body>
</html>
