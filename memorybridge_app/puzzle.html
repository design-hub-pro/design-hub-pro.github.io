<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Photo puzzle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#231B13;--mut:#6D5D4D;--bd:#E8DFD2;--surf:#FDFAF4;--play:#6A4B8C}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--surf)}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 20px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.board{width:380px;height:380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;background:#EDE6DA;border-radius:24px;padding:5px;box-shadow:inset 0 2px 6px rgba(35,27,19,.08)}
.pc{border-radius:16px;background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646376-image-1.png');background-size:380px 380px;background-repeat:no-repeat;box-shadow:0 4px 12px rgba(35,27,19,.18)}
.slot{border-radius:16px;border:3px dashed #C9BCA8;background:#F6F1E7;display:flex;align-items:center;justify-content:center;color:#B7A795;font-size:30px}
.bigbtn{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;gap:14px;margin:4px 0 14px">
      <div data-goto="together.html" style="width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:17px"><i class="fas fa-xmark"></i></div>
      <div style="flex:1">
        <div style="font-size:17px;font-weight:700;color:var(--play)">The rose by the back door</div>
        <div class="num" style="font-size:14px;color:var(--mut);font-weight:600;margin-top:2px">3 of 4 pieces placed</div>
      </div>
      <div style="width:58px;height:58px;border-radius:14px;overflow:hidden;border:2px solid #fff;box-shadow:0 4px 12px rgba(35,27,19,.18)"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646376-image-1.png" style="width:100%;height:100%;object-fit:cover" alt=""></div>
    </div>

    <div class="board">
      <div class="pc" style="background-position:0 0"></div>
      <div class="pc" style="background-position:-190px 0"></div>
      <div class="pc" style="background-position:0 -190px"></div>
      <div class="slot"><i class="fas fa-hand-pointer"></i></div>
    </div>

    <div style="display:flex;align-items:center;gap:18px;margin-top:22px;padding:16px;border-radius:24px;background:#fff;border:1px solid var(--bd);box-shadow:0 8px 22px rgba(35,27,19,.06)">
      <div class="pc" style="width:108px;height:108px;flex:0 0 108px;background-position:-190px -190px;background-size:216px 216px;transform:rotate(-3deg)"></div>
      <div style="flex:1">
        <div class="serif" style="font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.2">One piece left</div>
        <div style="font-size:15.5px;color:var(--mut);margin-top:5px;line-height:1.4">Tap the piece, then tap the empty square. It snaps in on its own.</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:11px;margin-top:18px">
      <div class="bigbtn" style="background:var(--play);color:#fff;box-shadow:0 12px 26px rgba(106,75,140,.28)"><i class="fas fa-location-crosshairs"></i>Show me where it goes</div>
      <div class="bigbtn" data-goto="match.html" style="background:#fff;border:1.5px solid var(--bd);color:var(--ink)"><i class="fas fa-image" style="color:var(--play)"></i>See the whole photo</div>
    </div>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
