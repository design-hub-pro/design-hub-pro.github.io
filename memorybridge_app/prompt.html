<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Talk Together</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#231B13;--mut:#6D5D4D;--bd:#E8DFD2;--surf:#FDFAF4;--listen:#0E6B74;--talk:#9E4521}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--surf)}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 20px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.bigbtn{height:72px;border-radius:22px;display:flex;align-items:center;gap:16px;padding:0 24px;font-size:20px;font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:26</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;gap:14px;margin:4px 0 16px">
      <div style="width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:17px"><i class="fas fa-xmark"></i></div>
      <div style="flex:1;font-size:17px;font-weight:700;color:var(--talk)">Talk Together</div>
      <div class="num" style="font-size:15px;font-weight:600;color:var(--mut)">3 of 5</div>
    </div>

    <div style="position:relative;height:376px;border-radius:28px;overflow:hidden;box-shadow:0 16px 36px rgba(35,27,19,.2)">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057647312-image-1.png" style="width:100%;height:100%;object-fit:cover" alt="">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(26,18,12,.6),transparent 42%)"></div>
      <div style="position:absolute;left:22px;right:22px;bottom:18px">
        <div class="num" style="font-size:14px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.72)">ELM ROAD &middot; ABOUT 1968</div>
        <div class="serif" style="font-size:22px;font-weight:600;color:#fff;margin-top:4px">Tom and Michael</div>
      </div>
    </div>

    <div class="serif" style="font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.24;margin-top:22px">Who taught these two to ride?</div>

    <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px">
      <div class="bigbtn" style="background:var(--talk);color:#fff;box-shadow:0 12px 26px rgba(158,69,33,.3)">
        <div style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px"><i class="fas fa-microphone"></i></div>
        <span style="flex:1">Tell the story</span>
        <i class="fas fa-chevron-right" style="font-size:16px;opacity:.7"></i>
      </div>
      <div class="bigbtn" style="background:#fff;border:1.5px solid var(--bd);color:var(--ink)">
        <div style="width:46px;height:46px;border-radius:50%;background:#DCEAEB;color:var(--listen);display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-volume-high"></i></div>
        <span style="flex:1">Read it to me</span>
      </div>
      <div class="bigbtn" style="background:transparent;color:var(--mut);justify-content:center;gap:11px;font-size:19px;height:60px">
        <i class="fas fa-arrow-right"></i>Show me another
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:11px;margin-top:6px;padding:14px 18px;border-radius:18px;background:#F2EDE3">
      <i class="fas fa-circle-info" style="color:var(--mut);font-size:15px"></i>
      <div style="font-size:14px;line-height:1.45;color:#5A4B3C">Nothing records until you press <strong>Tell the story</strong>. Skipping is always fine.</div>
    </div>
  </div>
</div>
</body>
</html>
