<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Picture matching</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#231B13;--mut:#6D5D4D;--bd:#E8DFD2;--surf:#FDFAF4;--play:#6A4B8C;--pos:#3F7E55}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--surf)}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 20px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.opt{position:relative;height:184px;border-radius:22px;overflow:hidden;background:#EDE6DA;box-shadow:0 6px 16px rgba(35,27,19,.1)}
.opt img{width:100%;height:100%;object-fit:cover}
.bigbtn{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:52</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;gap:14px;margin:4px 0 16px">
      <div data-goto="together.html" style="width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:17px"><i class="fas fa-xmark"></i></div>
      <div style="flex:1;font-size:17px;font-weight:700;color:var(--play)">Things from the house</div>
      <div style="display:flex;gap:5px">
        <span style="width:9px;height:9px;border-radius:50%;background:var(--play)"></span>
        <span style="width:9px;height:9px;border-radius:50%;background:var(--play)"></span>
        <span style="width:9px;height:9px;border-radius:50%;background:#DCD3C4"></span>
        <span style="width:9px;height:9px;border-radius:50%;background:#DCD3C4"></span>
      </div>
    </div>

    <div class="serif" style="font-size:29px;font-weight:600;letter-spacing:-.6px;line-height:1.25">Which one sat on<br>Joan&rsquo;s stove?</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px">
      <div class="opt" style="box-shadow:0 0 0 4px var(--pos),0 10px 22px rgba(63,126,85,.26)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646459-image-1.png" alt="">
        <div style="position:absolute;top:11px;right:11px;width:36px;height:36px;border-radius:50%;background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px"><i class="fas fa-check"></i></div>
      </div>
      <div class="opt">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057648968-image-1.png" alt="">
      </div>
      <div class="opt">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646376-image-1.png" alt="">
      </div>
      <div class="opt">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646493-image-1.png" alt="">
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin-top:18px;padding:17px 20px;border-radius:22px;background:#EDF6EF;border:1px solid #C9E3D1">
      <div style="width:42px;height:42px;border-radius:50%;background:var(--pos);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 42px"><i class="fas fa-check"></i></div>
      <div style="flex:1">
        <div class="serif" style="font-size:21px;font-weight:600;letter-spacing:-.3px">That&rsquo;s the one</div>
        <div style="font-size:15px;color:#3F6149;margin-top:3px">The brown teapot. Pat says it is still in the cupboard.</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:11px;margin-top:16px">
      <div class="bigbtn" data-goto="match.html" style="background:var(--play);color:#fff;box-shadow:0 12px 26px rgba(106,75,140,.28)">Next picture<i class="fas fa-arrow-right" style="font-size:16px"></i></div>
      <div class="bigbtn" data-goto="memory.html" style="background:transparent;color:var(--mut);font-size:18px;height:54px"><i class="fas fa-ear-listen"></i>Hear the story about it</div>
    </div>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
