<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Narrated slideshow</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--listen:#2C9AA5}
html,body{width:100%;height:100%}
body{background:#17100B;color:#fff;overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:#17100B}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:absolute;top:0;left:0;right:0;z-index:5;font-size:15px;font-weight:600;color:#fff}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.big{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sm{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px}
.wave{display:flex;align-items:center;gap:3px;height:20px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--listen)}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:11</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div style="position:relative;height:556px;flex:0 0 556px">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057648149-image-1.png" style="width:100%;height:100%;object-fit:cover" alt="">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(23,16,11,.6) 0%,rgba(23,16,11,0) 26%,rgba(23,16,11,0) 62%,rgba(23,16,11,.95) 100%)"></div>

    <div style="position:absolute;top:72px;left:28px;right:28px;display:flex;align-items:center;gap:12px">
      <div style="width:46px;height:46px;border-radius:50%;background:rgba(23,16,11,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px"><i class="fas fa-xmark"></i></div>
      <div style="flex:1">
        <div class="serif" style="font-size:16px;color:rgba(255,255,255,.9);font-weight:500">The Elm Road Years</div>
        <div style="display:flex;gap:4px;margin-top:8px">
          <span style="flex:1;height:4px;border-radius:2px;background:#fff"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:#fff"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:#fff"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.95);position:relative;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;width:62%;background:#fff;display:block"></i></span>
          <span style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"></span>
          <span style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"></span>
        </div>
      </div>
      <span class="num" style="font-size:14px;font-weight:700;color:rgba(255,255,255,.7)">4 / 18</span>
    </div>

    <div style="position:absolute;left:28px;right:28px;bottom:22px">
      <div class="num" style="font-size:14px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.6)">SUMMER 1979</div>
      <div class="serif" style="font-size:33px;font-weight:600;letter-spacing:-.7px;line-height:1.16;margin-top:7px">This is you holding<br>Ellie&rsquo;s mum</div>
    </div>
  </div>

  <div style="flex:1;padding:20px 28px 0">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:#6A4B8C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">PW</div>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:600;color:rgba(255,255,255,.95)">Pat is reading this one</div>
        <div class="wave" style="margin-top:7px">
          <i style="height:6px"></i><i style="height:13px"></i><i style="height:19px"></i><i style="height:9px"></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:11px"></i><i style="height:7px"></i><i style="height:17px"></i><i style="height:14px"></i><i style="height:20px"></i><i style="height:8px"></i><i style="height:15px"></i><i style="height:12px"></i><i style="height:18px"></i><i style="height:6px;opacity:.3"></i><i style="height:14px;opacity:.3"></i><i style="height:10px;opacity:.3"></i><i style="height:19px;opacity:.3"></i><i style="height:8px;opacity:.3"></i><i style="height:16px;opacity:.3"></i><i style="height:12px;opacity:.3"></i><i style="height:20px;opacity:.3"></i><i style="height:7px;opacity:.3"></i>
        </div>
      </div>
      <span class="num" style="font-size:14px;font-weight:700;color:rgba(255,255,255,.5)">0:22</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:26px">
      <div class="sm"><i class="fas fa-backward-step"></i></div>
      <div class="big" style="background:#fff;color:#17100B;font-size:28px;box-shadow:0 10px 26px rgba(0,0,0,.4)"><i class="fas fa-pause"></i></div>
      <div class="sm"><i class="fas fa-forward-step"></i></div>
    </div>

    <div style="display:flex;gap:11px;margin-top:24px">
      <div style="flex:1;height:54px;border-radius:17px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;color:#fff"><i class="fas fa-volume-high" style="font-size:15px"></i>Louder</div>
      <div style="flex:1;height:54px;border-radius:17px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;color:#fff"><i class="fas fa-rotate-left" style="font-size:14px"></i>Again</div>
    </div>
  </div>
</div>
</body>
</html>
