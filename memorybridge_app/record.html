<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Recording a story</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#231B13;--mut:#6D5D4D;--bd:#E8DFD2;--surf:#FDFAF4;--talk:#9E4521;--pos:#3F7E55}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--surf)}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 20px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:88px}
.wave i{display:block;width:5px;border-radius:3px;background:var(--talk)}
.bigbtn{height:66px;border-radius:21px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:33</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-microphone" style="color:#C0392B"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;gap:11px;margin:6px 0 18px;padding:12px 16px;border-radius:999px;background:#FBEAE6;border:1px solid #F0CFC7;width:fit-content">
      <span style="width:11px;height:11px;border-radius:50%;background:#C0392B"></span>
      <span style="font-size:15px;font-weight:700;color:#8C2F20">Recording</span>
      <span class="num" style="font-size:15px;font-weight:700;color:#8C2F20">1:24</span>
    </div>

    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:98px;height:98px;border-radius:22px;overflow:hidden;flex:0 0 98px;box-shadow:0 8px 20px rgba(35,27,19,.18)"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057647312-image-1.png" style="width:100%;height:100%;object-fit:cover" alt=""></div>
      <div style="flex:1">
        <div class="serif" style="font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.2">Who taught these two to ride?</div>
      </div>
    </div>

    <div class="wave" style="margin-top:34px">
      <i style="height:18px"></i><i style="height:34px"></i><i style="height:52px"></i><i style="height:26px"></i><i style="height:66px"></i><i style="height:44px"></i><i style="height:20px"></i><i style="height:58px"></i><i style="height:80px"></i><i style="height:38px"></i><i style="height:62px"></i><i style="height:24px"></i><i style="height:48px"></i><i style="height:72px"></i><i style="height:32px"></i><i style="height:56px"></i><i style="height:22px"></i><i style="height:42px"></i><i style="height:68px"></i><i style="height:30px"></i><i style="height:50px"></i><i style="height:36px"></i><i style="height:76px"></i><i style="height:28px"></i><i style="height:54px"></i><i style="height:40px"></i><i style="height:16px"></i><i style="height:46px"></i><i style="height:60px"></i><i style="height:25px"></i>
    </div>

    <div class="serif" style="text-align:center;font-size:22px;font-weight:500;color:var(--mut);line-height:1.45;margin-top:14px;font-style:italic">&ldquo;Their father, on the green at the top of the road&hellip;&rdquo;</div>

    <div style="display:flex;align-items:center;justify-content:center;margin-top:32px">
      <div style="width:104px;height:104px;border-radius:50%;background:#C0392B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 14px 32px rgba(192,57,43,.38)"><i class="fas fa-stop"></i></div>
    </div>
    <div style="text-align:center;font-size:17px;font-weight:600;color:var(--mut);margin-top:14px">Tap when Joan has finished</div>

    <div style="display:flex;gap:11px;margin-top:26px">
      <div class="bigbtn" style="flex:1;background:#fff;border:1.5px solid var(--bd);color:var(--mut);font-size:18px"><i class="fas fa-trash-can" style="font-size:16px"></i>Delete</div>
      <div class="bigbtn" style="flex:1.4;background:var(--pos);color:#fff;box-shadow:0 12px 26px rgba(63,126,85,.26)"><i class="fas fa-check"></i>Keep this</div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:16px;padding:15px 18px;border-radius:20px;background:#F2EDE3">
      <i class="fas fa-user-shield" style="color:var(--mut);font-size:16px"></i>
      <div style="font-size:14px;line-height:1.45;color:#5A4B3C">Ellie listens to this before anyone else sees it. Joan can ask for it to be deleted at any time.</div>
    </div>
  </div>
</div>
</body>
</html>
