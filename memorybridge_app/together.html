<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryBridge — Together</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#231B13;--mut:#6D5D4D;--bd:#E8DFD2;--surf:#FDFAF4;--listen:#0E6B74;--talk:#9E4521;--play:#6A4B8C}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--surf)}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 24px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Lora',Georgia,serif}
.door{position:relative;height:208px;border-radius:28px;overflow:hidden;box-shadow:0 14px 30px rgba(35,27,19,.16)}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.door .ov{position:absolute;inset:0}
.door .in{position:relative;height:100%;padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between}
.ic{width:58px;height:58px;border-radius:19px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.dt{font-size:33px;font-weight:600;color:#fff;letter-spacing:-.6px;line-height:1.1}
.ds{font-size:17px;color:rgba(255,255,255,.82);font-weight:500;margin-top:6px}
.go{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">3:04</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;gap:14px;margin:6px 0 20px">
      <div style="width:56px;height:56px;border-radius:50%;overflow:hidden;flex:0 0 56px;border:2px solid #fff;box-shadow:0 4px 12px rgba(35,27,19,.15)"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057647043-image-1.png" style="width:100%;height:100%;object-fit:cover" alt=""></div>
      <div style="flex:1">
        <div class="serif" style="font-size:31px;font-weight:600;letter-spacing:-.7px;line-height:1.1">Hello, Joan</div>
        <div style="font-size:16px;color:var(--mut);font-weight:500;margin-top:4px">Thursday afternoon</div>
      </div>
    </div>

    <div class="door">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057648068-image-1.png" alt="">
      <div class="ov" style="background:linear-gradient(115deg,rgba(11,47,54,.93) 0%,rgba(14,107,116,.82) 55%,rgba(14,107,116,.52) 100%)"></div>
      <div class="in">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div class="ic"><i class="fas fa-headphones"></i></div>
          <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);padding:7px 13px;border-radius:999px">
            <span style="width:8px;height:8px;border-radius:50%;background:#8FE3B4"></span>
            <span class="num" style="color:#fff;font-size:13px;font-weight:700">6 new</span>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div>
            <div class="serif dt">Watch &amp; Listen</div>
            <div class="ds">Photos with the stories read out</div>
          </div>
          <div class="go" style="color:var(--listen)"><i class="fas fa-play"></i></div>
        </div>
      </div>
    </div>

    <div class="door" style="margin-top:14px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646779-image-1.png" alt="">
      <div class="ov" style="background:linear-gradient(115deg,rgba(90,34,13,.93) 0%,rgba(158,69,33,.82) 55%,rgba(158,69,33,.5) 100%)"></div>
      <div class="in">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div class="ic"><i class="fas fa-comments"></i></div>
          <div style="display:flex;align-items:center;gap:-8px">
            <div style="display:flex">
              <div style="width:34px;height:34px;border-radius:50%;background:#6A4B8C;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.9)">EW</div>
              <div style="width:34px;height:34px;border-radius:50%;background:#3F7E55;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.9);margin-left:-10px">MW</div>
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div>
            <div class="serif dt">Talk Together</div>
            <div class="ds">One question at a time</div>
          </div>
          <div class="go" style="color:var(--talk)"><i class="fas fa-arrow-right"></i></div>
        </div>
      </div>
    </div>

    <div class="door" style="margin-top:14px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791057646376-image-1.png" alt="">
      <div class="ov" style="background:linear-gradient(115deg,rgba(55,33,82,.93) 0%,rgba(106,75,140,.82) 55%,rgba(106,75,140,.5) 100%)"></div>
      <div class="in">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div class="ic"><i class="fas fa-puzzle-piece"></i></div>
          <div style="background:rgba(255,255,255,.18);padding:7px 13px;border-radius:999px;color:#fff;font-size:13px;font-weight:700">No timers</div>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div>
            <div class="serif dt">Play Together</div>
            <div class="ds">Puzzles and picture matching</div>
          </div>
          <div class="go" style="color:var(--play)"><i class="fas fa-arrow-right"></i></div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:13px;margin-top:18px;padding:16px 18px;border-radius:22px;background:#fff;border:1px solid var(--bd)">
      <div style="width:40px;height:40px;border-radius:50%;background:#9E4521;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800">EW</div>
      <div style="flex:1;font-size:16px;font-weight:600;color:var(--ink)">Ellie set this up for you</div>
      <i class="fas fa-circle-question" style="color:#B7A795;font-size:22px"></i>
    </div>
  </div>
</div>
</body>
</html>
