<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentari — Live Session</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow-x: hidden; background: #0a0820; color: #fff; position: relative; }

    .bg-img { position: absolute; inset: 0; z-index: 0; }
    .bg-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; }
    .bg-img::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10,8,32,0.7) 0%, rgba(10,8,32,0.5) 40%, rgba(10,8,32,0.95) 100%);
    }

    .container { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

    .status-bar { height: 59px; padding: 0 28px 12px; display: flex; align-items: flex-end; justify-content: space-between; }
    .status-time { font-size: 16px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 130px; height: 36px; background: #000; border-radius: 20px; }

    .top-row { padding: 0 28px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .close-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; }
    .session-name { font-size: 13px; font-weight: 600; opacity: 0.85; }

    .timer-section { text-align: center; padding: 20px 28px 0; }
    .timer-label { font-size: 11px; font-weight: 600; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .timer-time { font-size: 26px; font-weight: 700; opacity: 0.9; }

    .breath-area {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 28px; min-height: 380px; position: relative;
    }
    .breath-instruction { font-size: 14px; opacity: 0.8; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
    .breath-orb {
        width: 240px; height: 240px; border-radius: 50%; position: relative;
        background: radial-gradient(circle, rgba(255,94,156,0.55) 0%, rgba(107,76,245,0.4) 50%, transparent 80%);
        display: flex; align-items: center; justify-content: center;
        animation: breathe 8s infinite ease-in-out;
    }
    .breath-orb::before {
        content: ''; position: absolute; inset: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff5e9c, #6b4cf5);
        box-shadow: 0 0 60px rgba(255,94,156,0.6);
    }
    .breath-orb span {
        font-size: 28px; font-weight: 800; color: #fff; position: relative; z-index: 2;
    }
    @keyframes breathe {
        0%, 100% { transform: scale(0.85); }
        50% { transform: scale(1.05); }
    }
    .breath-action { margin-top: 20px; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }

    .live-vitals {
        display: flex; gap: 10px; padding: 0 28px; margin-bottom: 20px;
    }
    .vital-pill {
        flex: 1; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
        padding: 12px; text-align: center;
    }
    .vp-icon { font-size: 14px; margin-bottom: 4px; }
    .vp-icon.heart { color: #ff5e9c; }
    .vp-icon.temp { color: #ff8c5e; }
    .vp-icon.hrv { color: #5eecc7; }
    .vp-val { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .vp-val .u { font-size: 10px; opacity: 0.7; font-weight: 500; }
    .vp-trend { font-size: 10px; color: #5eecc7; margin-top: 2px; }
    .vp-trend.warm { color: #ff8c5e; }

    .progress-section { padding: 0 28px 24px; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; width: 55%; background: linear-gradient(90deg, #ff5e9c, #6b4cf5); border-radius: 2px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 28px; }
    .ctrl { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .ctrl.main { width: 68px; height: 68px; background: linear-gradient(135deg, #ff5e9c, #6b4cf5); box-shadow: 0 8px 30px rgba(255,94,156,0.5); }
    .ctrl.main i { font-size: 20px; }
</style>
</head>
<body>
<div class="bg-img"><img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600&h=900&fit=crop" alt=""></div>

<div class="container">
    <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
    </div>

    <div class="top-row">
        <div class="close-btn"><i class="fas fa-chevron-down" style="font-size:12px"></i></div>
        <div class="session-name">4–4–8 Breathing</div>
        <div class="close-btn"><i class="fas fa-ellipsis" style="font-size:12px"></i></div>
    </div>

    <div class="timer-section">
        <div class="timer-label">Time remaining</div>
        <div class="timer-time">02:14</div>
    </div>

    <div class="breath-area">
        <div class="breath-instruction">Hold</div>
        <div class="breath-orb"><span>4</span></div>
        <div class="breath-action">Inhale</div>
    </div>

    <div class="live-vitals">
        <div class="vital-pill">
            <div class="vp-icon heart"><i class="fas fa-heart-pulse"></i></div>
            <div class="vp-val">81<span class="u">bpm</span></div>
            <div class="vp-trend">↓ 13 since start</div>
        </div>
        <div class="vital-pill">
            <div class="vp-icon temp"><i class="fas fa-temperature-half"></i></div>
            <div class="vp-val">36.8<span class="u">°</span></div>
            <div class="vp-trend warm">Cooling</div>
        </div>
        <div class="vital-pill">
            <div class="vp-icon hrv"><i class="fas fa-wave-square"></i></div>
            <div class="vp-val">58<span class="u">ms</span></div>
            <div class="vp-trend">↑ Recovering</div>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="controls">
            <div class="ctrl"><i class="fas fa-backward"></i></div>
            <div class="ctrl main"><i class="fas fa-pause"></i></div>
            <div class="ctrl"><i class="fas fa-forward"></i></div>
        </div>
    </div>
</div>
</body>
</html>
