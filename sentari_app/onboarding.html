<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentari — Pair Band</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow-x: hidden; background: #0a0820; color: #fff; }

    .status-bar { height: 59px; padding: 0 28px 12px; display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 10; }
    .status-time { font-size: 16px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .dynamic-island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 130px; height: 36px; background: #000; border-radius: 20px; }

    .bg-aura {
        position: absolute; top: 0; left: 0; right: 0; height: 600px; z-index: 0;
        background: radial-gradient(ellipse at 50% 20%, rgba(255,94,156,0.35) 0%, rgba(107,76,245,0.2) 40%, transparent 70%);
    }
    .bg-orb {
        position: absolute; width: 320px; height: 320px; border-radius: 50%;
        background: linear-gradient(135deg, #ff5e9c, #6b4cf5);
        filter: blur(80px); opacity: 0.35; top: 120px; left: 50%; transform: translateX(-50%); z-index: 0;
    }

    .content { padding: 0 28px 100px; position: relative; z-index: 1; }

    .band-hero {
        height: 360px; display: flex; align-items: center; justify-content: center;
        position: relative; margin-top: 20px;
    }
    .band-img {
        width: 280px; height: 280px; border-radius: 50%; object-fit: cover;
        border: 2px solid rgba(255,255,255,0.15);
        box-shadow: 0 20px 80px rgba(255,94,156,0.4);
    }
    .pulse-ring {
        position: absolute; width: 320px; height: 320px; border-radius: 50%;
        border: 2px solid rgba(255,94,156,0.4); animation: pulse 2s infinite;
    }
    .pulse-ring.r2 { width: 360px; height: 360px; border-color: rgba(107,76,245,0.3); animation-delay: 0.7s; }
    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 1; }
        100% { transform: scale(1.15); opacity: 0; }
    }

    .badge {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
        background: rgba(94,236,199,0.15); border: 1px solid rgba(94,236,199,0.35);
        border-radius: 20px; font-size: 11px; font-weight: 600; color: #5eecc7;
        margin-bottom: 16px;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #5eecc7; box-shadow: 0 0 8px #5eecc7; }

    .title {
        font-size: 38px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05;
        margin-bottom: 12px;
    }
    .title .grad {
        background: linear-gradient(135deg, #ff5e9c, #6b4cf5);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 15px; color: #a39ec0; line-height: 1.5; margin-bottom: 28px; }

    .stat-row { display: flex; gap: 10px; margin-bottom: 28px; }
    .stat-mini {
        flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px; padding: 12px;
    }
    .stat-mini-label { font-size: 10px; color: #7a738f; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .stat-mini-val { font-size: 18px; font-weight: 700; }
    .stat-mini-val .u { font-size: 11px; color: #a39ec0; font-weight: 500; }

    .cta {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        background: linear-gradient(135deg, #ff5e9c, #6b4cf5); color: #fff;
        padding: 18px; border-radius: 18px; font-size: 16px; font-weight: 700;
        box-shadow: 0 12px 40px rgba(255,94,156,0.35);
        margin-bottom: 12px;
    }
    .cta-secondary {
        text-align: center; padding: 14px; font-size: 13px; color: #a39ec0; font-weight: 500;
    }

    .page-dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
    .page-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .page-dot.active { width: 22px; background: #ff5e9c; border-radius: 3px; }
</style>
</head>
<body>
    <div class="bg-aura"></div>
    <div class="bg-orb"></div>

    <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
    </div>

    <div class="content">
        <div class="band-hero">
            <div class="pulse-ring r2"></div>
            <div class="pulse-ring"></div>
            <img class="band-img" src="https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=600&h=600&fit=crop" alt="band">
        </div>

        <div class="badge"><span class="dot"></span> Band connected · Signal strong</div>

        <h1 class="title">Feel before <br>you <span class="grad">break.</span></h1>
        <p class="subtitle">Your Sentari band reads pulse and skin temperature 24/7. Our AI predicts emotional state — and guides recovery before stress takes hold.</p>

        <div class="stat-row">
            <div class="stat-mini">
                <div class="stat-mini-label"><i class="fas fa-heart" style="color:#ff5e9c"></i> Pulse</div>
                <div class="stat-mini-val">72 <span class="u">bpm</span></div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-label"><i class="fas fa-temperature-half" style="color:#ff8c5e"></i> Skin</div>
                <div class="stat-mini-val">36.4 <span class="u">°C</span></div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-label"><i class="fas fa-battery-three-quarters" style="color:#5eecc7"></i> Battery</div>
                <div class="stat-mini-val">82 <span class="u">%</span></div>
            </div>
        </div>

        <div class="cta">Continue Setup <i class="fas fa-arrow-right"></i></div>
        <div class="cta-secondary">I'll pair my band later</div>

        <div class="page-dots">
            <div class="page-dot"></div>
            <div class="page-dot active"></div>
            <div class="page-dot"></div>
            <div class="page-dot"></div>
        </div>
    </div>
</body>
</html>
