<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrokeBeat — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-cyan-400 to-blue-700 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-wave-square text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">StrokeBeat</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A waterproof sensor box on the rowing shell. It times every stroke while the rower follows silence, a metronome or music.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Sensor</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Rowing</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Audio</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Research</span>
        </div>
    </div>

    <!-- Shots: all 8, two per row -->
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472844480-image-1.png" alt="StrokeBeat — on the water with a junior rower"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472870420-image-1.png" alt="StrokeBeat — the sensor box with a rule for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472843226-image-1.png" alt="StrokeBeat — mounted on the deck of the shell"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472843228-image-1.png" alt="StrokeBeat — strapping the box on at the dock"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472872364-image-1.png" alt="StrokeBeat — signal path from boat motion to audio cue and log"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472844877-image-1.png" alt="StrokeBeat — exploded stack of the build"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472843281-image-1.png" alt="StrokeBeat — bench check against a camera and metronome"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795472876560-image-1.png" alt="StrokeBeat — wiring and power concept"></div>
        </div>
    </div>
</body>
</html>
