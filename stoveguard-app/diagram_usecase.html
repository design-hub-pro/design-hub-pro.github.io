<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoveGuard AI - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            height: 750px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1400 750" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.15" />
                </linearGradient>
                <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
                </filter>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Background Rectangle -->
            <rect width="1400" height="750" fill="url(#bgGrad)" rx="16"/>

            <!-- Title -->
            <text x="700" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">StoveGuard AI - Use Case Diagram</text>
            <text x="700" y="72" text-anchor="middle" font-size="14" fill="#64748b">Smart Stove Safety System / 智能炉灶安全系统</text>

            <!-- System Boundary -->
            <rect x="280" y="100" width="840" height="540" fill="url(#systemGrad)" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5" rx="20" filter="url(#softShadow)"/>
            <text x="700" y="130" text-anchor="middle" font-size="18" font-weight="600" fill="#1e40af">StoveGuard AI System</text>

            <!-- Actor 1: Home User (Left) -->
            <g transform="translate(100, 280)">
                <!-- Actor Circle Head -->
                <circle cx="50" cy="20" r="22" fill="url(#actorGrad)" filter="url(#shadow)"/>
                <!-- Actor Body -->
                <line x1="50" y1="42" x2="50" y2="90" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
                <!-- Actor Arms -->
                <line x1="20" y1="60" x2="80" y2="60" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
                <!-- Actor Legs -->
                <line x1="50" y1="90" x2="25" y2="130" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="75" y2="130" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
                <!-- Label -->
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Home User</text>
                <text x="50" y="178" text-anchor="middle" font-size="12" fill="#64748b">家庭用户</text>
            </g>

            <!-- Actor 2: Emergency Services (Right) -->
            <g transform="translate(1150, 180)">
                <circle cx="50" cy="20" r="22" fill="#dc2626" filter="url(#shadow)"/>
                <line x1="50" y1="42" x2="50" y2="90" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="60" x2="80" y2="60" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="25" y2="130" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="75" y2="130" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Emergency</text>
                <text x="50" y="178" text-anchor="middle" font-size="12" fill="#64748b">紧急服务</text>
            </g>

            <!-- Actor 3: Family Member (Right Bottom) -->
            <g transform="translate(1150, 420)">
                <circle cx="50" cy="20" r="22" fill="#0891b2" filter="url(#shadow)"/>
                <line x1="50" y1="42" x2="50" y2="90" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="60" x2="80" y2="60" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="25" y2="130" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="75" y2="130" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Family Member</text>
                <text x="50" y="178" text-anchor="middle" font-size="12" fill="#64748b">家庭成员</text>
            </g>

            <!-- Use Case 1: Monitor Stove Status -->
            <ellipse cx="450" cy="200" rx="120" ry="45" fill="url(#useCaseGrad1)" filter="url(#shadow)"/>
            <text x="450" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="white">Monitor Stove</text>
            <text x="450" y="212" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">实时监控炉灶</text>

            <!-- Use Case 2: Receive Alerts -->
            <ellipse cx="700" cy="200" rx="120" ry="45" fill="url(#useCaseGrad2)" filter="url(#shadow)"/>
            <text x="700" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="white">Receive Alerts</text>
            <text x="700" y="212" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">接收警报通知</text>

            <!-- Use Case 3: Auto Shutoff -->
            <ellipse cx="950" cy="200" rx="120" ry="45" fill="url(#useCaseGrad3)" filter="url(#shadow)"/>
            <text x="950" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="white">Auto Emergency</text>
            <text x="950" y="212" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">自动紧急关闭</text>

            <!-- Use Case 4: Remote Control -->
            <ellipse cx="450" cy="340" rx="120" ry="45" fill="url(#useCaseGrad4)" filter="url(#shadow)"/>
            <text x="450" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="white">Remote Control</text>
            <text x="450" y="352" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">远程控制炉灶</text>

            <!-- Use Case 5: View History -->
            <ellipse cx="700" cy="340" rx="120" ry="45" fill="url(#useCaseGrad1)" filter="url(#shadow)"/>
            <text x="700" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="white">View History</text>
            <text x="700" y="352" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">查看使用历史</text>

            <!-- Use Case 6: Configure Settings -->
            <ellipse cx="950" cy="340" rx="120" ry="45" fill="url(#useCaseGrad4)" filter="url(#shadow)"/>
            <text x="950" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="white">Configure Settings</text>
            <text x="950" y="352" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">配置系统设置</text>

            <!-- Use Case 7: Detect Hazards -->
            <ellipse cx="550" cy="480" rx="120" ry="45" fill="url(#useCaseGrad3)" filter="url(#shadow)"/>
            <text x="550" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="white">Detect Hazards</text>
            <text x="550" y="492" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">检测危险情况</text>

            <!-- Use Case 8: Share Access -->
            <ellipse cx="850" cy="480" rx="120" ry="45" fill="url(#useCaseGrad2)" filter="url(#shadow)"/>
            <text x="850" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="white">Share Access</text>
            <text x="850" y="492" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">共享设备权限</text>

            <!-- Connection Lines - Home User -->
            <line x1="180" y1="340" x2="330" y2="200" stroke="#4f46e5" stroke-width="2"/>
            <line x1="180" y1="360" x2="330" y2="340" stroke="#4f46e5" stroke-width="2"/>
            <line x1="180" y1="380" x2="580" y2="340" stroke="#4f46e5" stroke-width="2"/>
            <line x1="180" y1="400" x2="430" y2="480" stroke="#4f46e5" stroke-width="2"/>
            <line x1="180" y1="350" x2="580" y2="200" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="180" y1="370" x2="830" y2="340" stroke="#4f46e5" stroke-width="2"/>

            <!-- Connection Lines - Emergency Services -->
            <line x1="1150" y1="280" x2="1070" y2="200" stroke="#dc2626" stroke-width="2"/>
            <line x1="1150" y1="300" x2="820" y2="200" stroke="#dc2626" stroke-width="2"/>

            <!-- Connection Lines - Family Member -->
            <line x1="1150" y1="480" x2="970" y2="480" stroke="#0891b2" stroke-width="2"/>
            <line x1="1150" y1="500" x2="820" y2="340" stroke="#0891b2" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="1150" y1="460" x2="820" y2="200" stroke="#0891b2" stroke-width="2"/>

            <!-- Include/Extend relationships -->
            <!-- Include: Monitor -> Detect Hazards -->
            <line x1="450" y1="245" x2="520" y2="435" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="420" y="350" font-size="11" fill="#64748b" transform="rotate(60, 420, 350)">«include»</text>

            <!-- Extend: Auto Shutoff -> Detect Hazards -->
            <line x1="920" y1="245" x2="600" y2="435" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="780" y="360" font-size="11" fill="#64748b" transform="rotate(-30, 780, 360)">«extend»</text>

            <!-- Legend -->
            <g transform="translate(40, 640)">
                <rect x="0" y="0" width="320" height="90" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#softShadow)"/>
                <text x="15" y="25" font-size="14" font-weight="600" fill="#1e293b">Legend / 图例</text>

                <!-- Actor -->
                <circle cx="30" cy="50" r="8" fill="url(#actorGrad)"/>
                <text x="50" y="54" font-size="11" fill="#475569">Actor / 参与者</text>

                <!-- Use Case -->
                <ellipse cx="150" cy="50" rx="25" ry="12" fill="url(#useCaseGrad1)"/>
                <text x="185" y="54" font-size="11" fill="#475569">Use Case / 用例</text>

                <!-- Association -->
                <line x1="15" y1="75" x2="55" y2="75" stroke="#4f46e5" stroke-width="2"/>
                <text x="65" y="79" font-size="11" fill="#475569">Association</text>

                <!-- Include/Extend -->
                <line x1="155" y1="75" x2="195" y2="75" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="205" y="79" font-size="11" fill="#475569">Include/Extend</text>
            </g>

            <!-- Feature Highlights -->
            <g transform="translate(1040, 640)">
                <rect x="0" y="0" width="320" height="90" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#softShadow)"/>
                <text x="15" y="25" font-size="14" font-weight="600" fill="#1e293b">Key Features / 核心特性</text>
                <circle cx="25" cy="48" r="6" fill="#10b981"/>
                <text x="40" y="52" font-size="11" fill="#475569">Real-time Monitoring</text>
                <circle cx="165" cy="48" r="6" fill="#ef4444"/>
                <text x="180" y="52" font-size="11" fill="#475569">Auto Safety</text>
                <circle cx="25" cy="73" r="6" fill="#8b5cf6"/>
                <text x="40" y="77" font-size="11" fill="#475569">Remote Control</text>
                <circle cx="165" cy="73" r="6" fill="#f59e0b"/>
                <text x="180" y="77" font-size="11" fill="#475569">Smart Alerts</text>
            </g>
        </svg>
    </div>
</body>
</html>
