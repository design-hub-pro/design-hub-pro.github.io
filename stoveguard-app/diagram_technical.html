<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>StoveGuard AI - Technical System Architecture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            height: 900px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">

            <!-- White Background -->

            <text x="210" y="208" text-anchor="middle" font-size="11">(110)</text>
            <text x="210" y="228" text-anchor="middle" font-size="10">ARM Cortex-M4</text>
            <text x="210" y="242" text-anchor="middle" font-size="10">Edge Computing</text>

            <text x="330" y="545" text-anchor="middle" font-size="10">Flash Memory (161) | SRAM (162) | EEPROM (163)</text>

            <rect x="700" y="620" width="120" height="60" fill="none" stroke="black" stroke-width="2"/>
            <text x="760" y="655" text-anchor="middle" font-size="12" font-weight="bold">USER (400)</text>

            <!-- Emergency Contact (410) -->
            <rect x="880" y="620" width="120" height="60" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
            <text x="940" y="645" text-anchor="middle" font-size="11" font-weight="bold">EMERGENCY</text>
            <text x="940" y="665" text-anchor="middle" font-size="11">(410)</text>

            <!-- Processor to Sensors -->
            <line x1="300" y1="200" x2="340" y2="200" stroke="black" stroke-width="1.5"/>
            <polygon points="335,196 345,200 335,204" fill="black"/>

            <line x1="210" y1="250" x2="210" y2="270" stroke="black" stroke-width="1.5"/>
            <polygon points="206,265 210,275 214,265" fill="black"/>

            <!-- Processor to Motor -->
            <line x1="180" y1="250" x2="180" y2="390" stroke="black" stroke-width="1.5"/>
            <polygon points="176,385 180,395 184,385" fill="black"/>

            <line x1="340" y1="240" x2="300" y2="240" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>

            <line x1="440" y1="350" x2="440" y2="320" stroke="black" stroke-width="1"/>

            <line x1="180" y1="480" x2="180" y2="600" stroke="black" stroke-width="1.5"/>

            <line x1="180" y1="680" x2="180" y2="700" stroke="black" stroke-width="1.5"/>

            <path d="M300 320 Q500 280 700 180" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="500" y="260" text-anchor="middle" font-size="10">Wi-Fi</text>

            <!-- Communication to App (BLE) -->
            <path d="M300 350 Q500 400 700 460" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="500" y="420" text-anchor="middle" font-size="10">BLE</text>

            <line x1="850" y1="300" x2="850" y2="340" stroke="black" stroke-width="1.5"/>
            <polygon points="846,335 850,345 854,335" fill="black"/>

            <line x1="760" y1="580" x2="760" y2="620" stroke="black" stroke-width="1.5"/>
            <polygon points="756,615 760,625 764,615" fill="black"/>

            <line x1="920" y1="300" x2="940" y2="620" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
            <text x="950" y="450" text-anchor="start" font-size="9">Alert</text>

            <text x="1200" y="130" text-anchor="middle" font-size="14" font-weight="bold">COMPONENT INDEX</text>

            <text x="1070" y="180" font-size="10">100 - Main Device Housing</text>
            <text x="1070" y="195" font-size="10">110 - Processing Unit (MCU)</text>
            <text x="1070" y="210" font-size="10">120 - Sensor Array Module</text>
            <text x="1070" y="225" font-size="10">  121 - Temperature Sensor</text>
            <text x="1070" y="240" font-size="10">  122 - Smoke Detector</text>
            <text x="1070" y="255" font-size="10">  123 - Gas Sensor</text>
            <text x="1070" y="270" font-size="10">  124 - Proximity Sensor</text>
            <text x="1070" y="285" font-size="10">130 - Communication Module</text>
            <text x="1070" y="300" font-size="10">140 - Motor Control Unit</text>
            <text x="1070" y="315" font-size="10">150 - Power Management</text>
            <text x="1070" y="330" font-size="10">160 - Memory/Storage</text>
            <text x="1070" y="345" font-size="10">170 - Knob Mount Interface</text>
            <text x="1070" y="360" font-size="10">180 - External Stove</text>
