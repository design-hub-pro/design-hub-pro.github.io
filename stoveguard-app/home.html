<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoveGuard AI - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .status-ring { animation: pulse-ring 2s ease-out infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .temp-gradient { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full min-h-screen bg-gradient-to-b from-slate-900 to-slate-800">
        <!-- iOS Status Bar -->
        <div class="bg-slate-900 px-6 pt-3 pb-2">
            <div class="flex justify-between items-center text-white text-sm">
                <span class="font-semibold">9:41</span>
                <div class="w-32 h-8 bg-black rounded-full mx-auto"></div>
                <div class="flex items-center gap-1.5">
                    <i class="fas fa-signal text-xs"></i>
                    <i class="fas fa-wifi text-xs"></i>
                    <i class="fas fa-battery-full text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="px-5 pt-4 pb-3">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-sm">Good Morning</p>
                    <h1 class="text-white text-xl font-bold">Kitchen Safety</h1>
                </div>
                <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-red-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-white text-sm"></i>
                </div>
            </div>
        </div>

        <!-- Main Status Card -->
        <div class="px-5 py-4">
            <div class="bg-gradient-to-br from-slate-800 to-slate-700 rounded-3xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-green-500/20 rounded-full flex items-center justify-center status-ring">
                            <i class="fas fa-shield-halved text-green-400 text-lg"></i>
                        </div>
                        <div>
                            <p class="text-gray-400 text-xs">Current Status</p>
                            <p class="text-white font-semibold">All Safe</p>
                        </div>
                    </div>
                    <div class="bg-green-500/20 px-3 py-1 rounded-full">
                        <span class="text-green-400 text-xs font-medium">● Active</span>
                    </div>
                </div>

                <!-- Stove Visual -->
                <div class="relative bg-slate-900/50 rounded-2xl p-4 mb-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="aspect-square bg-slate-800 rounded-xl flex flex-col items-center justify-center border border-slate-700">
                            <div class="w-10 h-10 rounded-full bg-gray-700 border-2 border-gray-600 mb-1"></div>
                            <span class="text-gray-500 text-xs">OFF</span>
                        </div>
                        <div class="aspect-square bg-slate-800 rounded-xl flex flex-col items-center justify-center border border-orange-500/30">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-red-500 mb-1 animate-pulse"></div>
                            <span class="text-orange-400 text-xs">LOW</span>
                        </div>
                        <div class="aspect-square bg-slate-800 rounded-xl flex flex-col items-center justify-center border border-slate-700">
                            <div class="w-10 h-10 rounded-full bg-gray-700 border-2 border-gray-600 mb-1"></div>
                            <span class="text-gray-500 text-xs">OFF</span>
                        </div>
                        <div class="aspect-square bg-slate-800 rounded-xl flex flex-col items-center justify-center border border-slate-700">
                            <div class="w-10 h-10 rounded-full bg-gray-700 border-2 border-gray-600 mb-1"></div>
                            <span class="text-gray-500 text-xs">OFF</span>
                        </div>
                    </div>
                    <div class="absolute -top-2 -right-2 bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full font-medium">
                        1 Active
                    </div>
                </div>

                <!-- Quick Stats -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-900/50 rounded-xl p-3 text-center">
                        <i class="fas fa-temperature-half text-orange-400 mb-1"></i>
                        <p class="text-white font-bold text-lg">185°</p>
                        <p class="text-gray-500 text-xs">Temp</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-xl p-3 text-center">
                        <i class="fas fa-clock text-blue-400 mb-1"></i>
                        <p class="text-white font-bold text-lg">12m</p>
                        <p class="text-gray-500 text-xs">Active</p>
                    </div>
                    <div class="bg-slate-900/50 rounded-xl p-3 text-center">
                        <i class="fas fa-wind text-green-400 mb-1"></i>
                        <p class="text-white font-bold text-lg">OK</p>
                        <p class="text-gray-500 text-xs">Air</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="px-5 py-2">
            <h3 class="text-gray-400 text-sm mb-3 font-medium">Quick Actions</h3>
            <div class="flex gap-3">
                <button class="flex-1 bg-red-500/20 border border-red-500/30 rounded-2xl p-4 flex flex-col items-center">
                    <div class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-power-off text-white"></i>
                    </div>
                    <span class="text-red-400 text-xs font-medium">Turn Off</span>
                </button>
                <button class="flex-1 bg-blue-500/20 border border-blue-500/30 rounded-2xl p-4 flex flex-col items-center">
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-bell text-white"></i>
                    </div>
                    <span class="text-blue-400 text-xs font-medium">Set Timer</span>
                </button>
                <button class="flex-1 bg-purple-500/20 border border-purple-500/30 rounded-2xl p-4 flex flex-col items-center">
                    <div class="w-10 h-10 bg-purple-500 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-chart-line text-white"></i>
                    </div>
                    <span class="text-purple-400 text-xs font-medium">Analytics</span>
                </button>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="px-5 py-3">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-gray-400 text-sm font-medium">Recent Activity</h3>
                <span class="text-blue-400 text-xs">See All</span>
            </div>
            <div class="bg-slate-800/50 rounded-2xl p-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-500/20 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-green-400 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-white text-sm">Cooking completed safely</p>
                        <p class="text-gray-500 text-xs">2 hours ago</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Tab Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-700">
            <div class="flex justify-around items-center py-3 px-6">
                <div class="flex flex-col items-center">
                    <i class="fas fa-home text-orange-400 text-lg"></i>
                    <span class="text-orange-400 text-xs mt-1">Home</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-gauge-high text-gray-500 text-lg"></i>
                    <span class="text-gray-500 text-xs mt-1">Monitor</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-bell text-gray-500 text-lg"></i>
                    <span class="text-gray-500 text-xs mt-1">Alerts</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-clock-rotate-left text-gray-500 text-lg"></i>
                    <span class="text-gray-500 text-xs mt-1">History</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-gear text-gray-500 text-lg"></i>
                    <span class="text-gray-500 text-xs mt-1">Settings</span>
                </div>
            </div>
            <div class="w-32 h-1 bg-white rounded-full mx-auto mb-2"></div>
        </div>
    </div>
</body>
</html>
