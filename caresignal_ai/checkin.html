<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CareSignal AI - Daily Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
        }
        .emoji-btn {
            transition: all 0.2s ease;
        }
        .emoji-btn.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.3);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="px-6 py-3 flex justify-between items-center text-lg font-semibold">
        <span>9:41</span>
        <div class="flex items-center gap-2">
            <i class="fas fa-signal text-base"></i>
            <i class="fas fa-wifi text-base"></i>
            <i class="fas fa-battery-full text-base"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-4 pb-8">
        <!-- Header with Progress -->
        <div class="flex items-center justify-between mb-6">
            <button class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                <i class="fas fa-times text-gray-400 text-xl"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="flex gap-2">
                    <div class="w-10 h-2 bg-teal-500 rounded-full"></div>
                    <div class="w-10 h-2 bg-teal-500 rounded-full"></div>
                    <div class="w-10 h-2 bg-gray-200 rounded-full"></div>
                </div>
                <span class="text-lg text-gray-500 font-medium">2/3</span>
            </div>
            <div class="w-12"></div>
        </div>

        <!-- Question Card -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fas fa-bolt text-white text-4xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-3">How's your energy?</h1>
            <p class="text-xl text-gray-500">Tap to select</p>
        </div>

        <!-- Emoji Selection - Visual & Quick -->
        <div class="grid grid-cols-3 gap-5 mb-10">
            <button class="emoji-btn bg-white rounded-3xl p-6 flex flex-col items-center border-2 border-gray-100 shadow-sm">
                <span class="text-6xl mb-3">😫</span>
                <span class="text-lg font-semibold text-gray-700">Exhausted</span>
            </button>
            <button class="emoji-btn bg-white rounded-3xl p-6 flex flex-col items-center border-2 border-gray-100 shadow-sm">
                <span class="text-6xl mb-3">😐</span>
                <span class="text-lg font-semibold text-gray-700">Okay</span>
            </button>
            <button class="emoji-btn selected bg-white rounded-3xl p-6 flex flex-col items-center border-2 border-teal-400 shadow-sm">
                <span class="text-6xl mb-3">😊</span>
                <span class="text-lg font-semibold text-teal-600">Good</span>
            </button>
        </div>

        <!-- Optional: Quick Note -->
        <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm mb-8">
            <div class="flex items-center gap-3 mb-3">
                <i class="fas fa-comment-dots text-gray-400 text-xl"></i>
                <span class="text-lg text-gray-500">Add a quick note (optional)</span>
            </div>
            <p class="text-lg text-gray-400 italic pl-8">e.g., "Didn't sleep well"</p>
        </div>

        <!-- Continue Button -->
        <button class="w-full py-5 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-2xl text-xl font-bold shadow-lg mb-6">
            Continue <i class="fas fa-arrow-right ml-2"></i>
        </button>

        <!-- Time Indicator -->
        <div class="flex items-center justify-center gap-3">
            <i class="fas fa-clock text-gray-300 text-lg"></i>
            <span class="text-lg text-gray-400">~10 seconds left</span>
        </div>
    </div>

    <!-- Bottom: Family Check-in Status -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-5 pb-10">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-lg text-gray-500">Today's check-ins:</span>
            </div>
            <div class="flex -space-x-3">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=40&h=40&fit=crop&crop=face"
                     class="w-10 h-10 rounded-full object-cover border-2 border-white">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=40&h=40&fit=crop&crop=face"
                     class="w-10 h-10 rounded-full object-cover border-2 border-white">
                <div class="w-10 h-10 rounded-full bg-gray-100 border-2 border-white flex items-center justify-center">
                    <span class="text-base font-semibold text-gray-500">+2</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
