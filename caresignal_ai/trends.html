<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CareSignal AI - Trends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-lg font-semibold">
        <span>9:41</span>
        <div class="flex items-center gap-2">
            <i class="fas fa-signal text-base"></i>
            <i class="fas fa-wifi text-base"></i>
            <i class="fas fa-battery-full text-base"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-5 pb-32 overflow-y-auto" style="height: calc(932px - 52px);">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Trends</h1>
            <div class="flex bg-gray-100 rounded-2xl p-1.5">
                <button class="px-5 py-2.5 bg-white rounded-xl text-lg font-semibold text-gray-900 shadow-sm">Week</button>
                <button class="px-5 py-2.5 text-lg font-medium text-gray-400">Month</button>
            </div>
        </div>

        <!-- Wellness Trend Chart -->
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm mb-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900">Wellness Index</h3>
                <div class="flex items-center gap-2 bg-emerald-50 px-4 py-2 rounded-full">
                    <i class="fas fa-arrow-trend-up text-emerald-600"></i>
                    <span class="text-lg font-semibold text-emerald-600">+8%</span>
                </div>
            </div>
            <!-- Visual Chart -->
            <div class="flex items-end justify-between h-44 mb-4">
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-400 to-teal-300 rounded-xl" style="height: 55%"></div>
                    <span class="text-base text-gray-400 font-medium">M</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-400 to-teal-300 rounded-xl" style="height: 50%"></div>
                    <span class="text-base text-gray-400 font-medium">T</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-amber-400 to-amber-300 rounded-xl" style="height: 40%"></div>
                    <span class="text-base text-gray-400 font-medium">W</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-400 to-teal-300 rounded-xl" style="height: 60%"></div>
                    <span class="text-base text-gray-400 font-medium">T</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-400 to-teal-300 rounded-xl" style="height: 70%"></div>
                    <span class="text-base text-gray-400 font-medium">F</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-500 to-teal-400 rounded-xl" style="height: 80%"></div>
                    <span class="text-base text-gray-400 font-medium">S</span>
                </div>
                <div class="flex flex-col items-center gap-3 flex-1">
                    <div class="w-10 bg-gradient-to-t from-teal-500 to-cyan-400 rounded-xl" style="height: 85%"></div>
                    <span class="text-base text-gray-900 font-bold">S</span>
                </div>
            </div>
        </div>

        <!-- Member Wellness Comparison -->
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm mb-6">
            <h3 class="text-xl font-bold text-gray-900 mb-5">Member Wellness</h3>
            <div class="space-y-5">
                <div class="flex items-center gap-4">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=60&h=60&fit=crop&crop=face"
                         class="w-12 h-12 rounded-full object-cover">
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-lg font-semibold text-gray-900">Sarah (You)</span>
                            <span class="text-xl font-bold text-emerald-600">78</span>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 rounded-full" style="width: 78%"></div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&h=60&fit=crop&crop=face"
                         class="w-12 h-12 rounded-full object-cover">
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-lg font-semibold text-gray-900">David</span>
                            <span class="text-xl font-bold text-amber-600">62</span>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-amber-400 to-amber-500 rounded-full" style="width: 62%"></div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=60&h=60&fit=crop&crop=face"
                         class="w-12 h-12 rounded-full object-cover">
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-lg font-semibold text-gray-900">Emma</span>
                            <span class="text-xl font-bold text-emerald-600">81</span>
                        </div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 rounded-full" style="width: 81%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Alert Card -->
        <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl p-6 border border-amber-200 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-robot text-amber-600 text-2xl"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-gray-900">AI Alert</p>
                    <p class="text-lg text-amber-700">Pattern Detected</p>
                </div>
            </div>
            <div class="bg-white/80 rounded-2xl p-4">
                <div class="flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-amber-500 text-xl"></i>
                    <p class="text-lg text-gray-700">David's stress elevated for 5 days</p>
                </div>
            </div>
        </div>

        <!-- Top Stress Sources -->
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
            <h3 class="text-xl font-bold text-gray-900 mb-5">Stress Sources</h3>
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-hospital text-red-500 text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-lg font-semibold text-gray-900">Medical</p>
                    </div>
                    <div class="w-20 h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-red-400 rounded-full" style="width: 85%"></div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-clock text-amber-500 text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-lg font-semibold text-gray-900">Time</p>
                    </div>
                    <div class="w-20 h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-amber-400 rounded-full" style="width: 60%"></div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-wallet text-blue-500 text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-lg font-semibold text-gray-900">Financial</p>
                    </div>
                    <div class="w-20 h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-400 rounded-full" style="width: 35%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-4 pb-10">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-teal-600 text-2xl"></i>
                <span class="text-base text-teal-600 font-semibold mt-1">Trends</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Support</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-lightbulb text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Insights</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
