<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CareSignal AI - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-lg font-semibold">
        <span>9:41</span>
        <div class="flex items-center gap-2">
            <i class="fas fa-signal text-base"></i>
            <i class="fas fa-wifi text-base"></i>
            <i class="fas fa-battery-full text-base"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-5 pb-32 overflow-y-auto" style="height: calc(932px - 52px);">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face"
                     class="w-14 h-14 rounded-full object-cover border-3 border-teal-200">
                <div>
                    <p class="text-lg text-gray-500">Good morning</p>
                    <p class="text-2xl font-bold text-gray-900">Sarah</p>
                </div>
            </div>
            <div class="w-12 h-12 bg-teal-50 rounded-full flex items-center justify-center">
                <i class="fas fa-bell text-teal-600 text-xl"></i>
            </div>
        </div>

        <!-- Family Wellness Score - More Visual -->
        <div class="bg-gradient-to-br from-teal-500 to-cyan-600 rounded-3xl p-6 mb-8 shadow-xl">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-teal-100 text-lg mb-2">Family Wellness</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-6xl font-bold text-white">72</span>
                        <span class="text-2xl text-teal-100">/100</span>
                    </div>
                </div>
                <div class="relative">
                    <svg class="w-28 h-28 transform -rotate-90">
                        <circle cx="56" cy="56" r="48" stroke="#ffffff30" stroke-width="10" fill="none"/>
                        <circle cx="56" cy="56" r="48" stroke="#ffffff" stroke-width="10" fill="none"
                                stroke-dasharray="301.6" stroke-dashoffset="84" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <i class="fas fa-heart text-white text-3xl"></i>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 mt-4 bg-white/20 rounded-2xl px-5 py-3">
                <i class="fas fa-arrow-trend-up text-emerald-200 text-xl"></i>
                <span class="text-white text-lg font-medium">+5 from last week</span>
            </div>
        </div>

        <!-- Quick Stats - Visual Cards -->
        <div class="grid grid-cols-2 gap-5 mb-8">
            <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm">
                <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center mb-4">
                    <i class="fas fa-users text-amber-600 text-2xl"></i>
                </div>
                <p class="text-4xl font-bold text-gray-900">4</p>
                <p class="text-lg text-gray-500 mt-1">Members Active</p>
            </div>
            <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm">
                <div class="w-14 h-14 bg-purple-100 rounded-2xl flex items-center justify-center mb-4">
                    <i class="fas fa-fire text-purple-600 text-2xl"></i>
                </div>
                <p class="text-4xl font-bold text-gray-900">14</p>
                <p class="text-lg text-gray-500 mt-1">Day Streak</p>
            </div>
        </div>

        <!-- Today's Check-in CTA -->
        <div class="bg-gradient-to-r from-purple-500 to-indigo-600 rounded-3xl p-6 mb-8 shadow-lg">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-hand-pointer text-white text-2xl"></i>
                </div>
                <div>
                    <p class="text-white text-xl font-bold">Daily Check-in</p>
                    <p class="text-purple-200 text-lg">Takes only 30 seconds</p>
                </div>
            </div>
            <button class="w-full py-4 bg-white text-purple-600 rounded-2xl text-xl font-bold shadow-lg">
                Start Now <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- Family Members - Visual Status -->
        <div class="mb-6">
            <h3 class="text-xl font-bold text-gray-900 mb-5">Family Status</h3>
            <div class="flex justify-between">
                <div class="text-center">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop&crop=face"
                             class="w-16 h-16 rounded-full object-cover border-3 border-amber-400">
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-amber-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-minus text-white text-xs"></i>
                        </div>
                    </div>
                    <p class="text-lg font-semibold text-gray-900 mt-2">David</p>
                    <p class="text-base text-amber-600">Moderate</p>
                </div>
                <div class="text-center">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=80&h=80&fit=crop&crop=face"
                             class="w-16 h-16 rounded-full object-cover border-3 border-emerald-400">
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                    <p class="text-lg font-semibold text-gray-900 mt-2">Emma</p>
                    <p class="text-base text-emerald-600">Good</p>
                </div>
                <div class="text-center">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=80&h=80&fit=crop&crop=face"
                             class="w-16 h-16 rounded-full object-cover border-3 border-teal-400">
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-teal-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                    <p class="text-lg font-semibold text-gray-900 mt-2">Jake</p>
                    <p class="text-base text-teal-600">Stable</p>
                </div>
                <div class="text-center">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face"
                             class="w-16 h-16 rounded-full object-cover border-3 border-emerald-400">
                        <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                    <p class="text-lg font-semibold text-gray-900 mt-2">You</p>
                    <p class="text-base text-emerald-600">Good</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-4 pb-10">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-teal-600 text-2xl"></i>
                <span class="text-base text-teal-600 font-semibold mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Trends</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Support</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-lightbulb text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Insights</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
