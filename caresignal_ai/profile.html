<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CareSignal AI - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-lg font-semibold">
        <span>9:41</span>
        <div class="flex items-center gap-2">
            <i class="fas fa-signal text-base"></i>
            <i class="fas fa-wifi text-base"></i>
            <i class="fas fa-battery-full text-base"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-5 pb-32 overflow-y-auto" style="height: calc(932px - 52px);">
        <!-- Profile Header -->
        <div class="text-center mb-8">
            <div class="relative inline-block">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=face"
                     class="w-28 h-28 rounded-full object-cover border-4 border-teal-200">
                <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-full flex items-center justify-center border-3 border-white">
                    <i class="fas fa-check text-white text-lg"></i>
                </div>
            </div>
            <h2 class="text-3xl font-bold text-gray-900 mt-5">Sarah Chen</h2>
            <p class="text-lg text-gray-500 mt-1">Family Admin</p>
            <div class="flex items-center justify-center gap-2 mt-3">
                <span class="bg-teal-100 text-teal-700 px-4 py-2 rounded-full text-lg font-semibold">
                    <i class="fas fa-fire mr-2"></i>14 Day Streak
                </span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-3xl p-4 border border-gray-100 text-center">
                <p class="text-3xl font-bold text-teal-600">42</p>
                <p class="text-base text-gray-500 mt-1">Check-ins</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-gray-100 text-center">
                <p class="text-3xl font-bold text-purple-600">4</p>
                <p class="text-base text-gray-500 mt-1">Members</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-gray-100 text-center">
                <p class="text-3xl font-bold text-amber-600">6</p>
                <p class="text-base text-gray-500 mt-1">Weeks</p>
            </div>
        </div>

        <!-- Family Members -->
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm mb-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-xl font-bold text-gray-900">Family</h3>
                <button class="text-teal-600 text-lg font-semibold">+ Add</button>
            </div>
            <div class="flex justify-between">
                <div class="text-center">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&h=60&fit=crop&crop=face"
                         class="w-14 h-14 rounded-full object-cover mx-auto border-2 border-emerald-300">
                    <p class="text-base font-semibold text-gray-900 mt-2">David</p>
                </div>
                <div class="text-center">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=60&h=60&fit=crop&crop=face"
                         class="w-14 h-14 rounded-full object-cover mx-auto border-2 border-emerald-300">
                    <p class="text-base font-semibold text-gray-900 mt-2">Emma</p>
                </div>
                <div class="text-center">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=60&h=60&fit=crop&crop=face"
                         class="w-14 h-14 rounded-full object-cover mx-auto border-2 border-gray-200">
                    <p class="text-base font-semibold text-gray-900 mt-2">Jake</p>
                </div>
                <div class="text-center">
                    <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center mx-auto">
                        <i class="fas fa-plus text-gray-400 text-xl"></i>
                    </div>
                    <p class="text-base text-gray-400 mt-2">Add</p>
                </div>
            </div>
        </div>

        <!-- Privacy Settings -->
        <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm mb-6">
            <h3 class="text-xl font-bold text-gray-900 mb-5">Privacy</h3>
            <div class="space-y-5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-teal-100 rounded-2xl flex items-center justify-center">
                            <i class="fas fa-share-alt text-teal-600 text-xl"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-900">Share Trends</p>
                    </div>
                    <div class="w-14 h-8 bg-teal-500 rounded-full p-1">
                        <div class="w-6 h-6 bg-white rounded-full shadow transform translate-x-6"></div>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-purple-100 rounded-2xl flex items-center justify-center">
                            <i class="fas fa-bell text-purple-600 text-xl"></i>
                        </div>
                        <p class="text-lg font-semibold text-gray-900">Risk Alerts</p>
                    </div>
                    <div class="w-14 h-8 bg-teal-500 rounded-full p-1">
                        <div class="w-6 h-6 bg-white rounded-full shadow transform translate-x-6"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Menu -->
        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden mb-6">
            <div class="flex items-center justify-between px-6 py-5 border-b border-gray-50">
                <div class="flex items-center gap-4">
                    <i class="fas fa-download text-gray-400 text-xl"></i>
                    <span class="text-lg font-semibold text-gray-900">Export Data</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="flex items-center justify-between px-6 py-5 border-b border-gray-50">
                <div class="flex items-center gap-4">
                    <i class="fas fa-question-circle text-gray-400 text-xl"></i>
                    <span class="text-lg font-semibold text-gray-900">Help</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="flex items-center justify-between px-6 py-5">
                <div class="flex items-center gap-4">
                    <i class="fas fa-sign-out-alt text-red-400 text-xl"></i>
                    <span class="text-lg font-semibold text-red-500">Sign Out</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>

        <!-- Privacy Note -->
        <div class="bg-teal-50 rounded-2xl p-4 flex items-center gap-3">
            <i class="fas fa-shield-alt text-teal-500 text-xl"></i>
            <p class="text-base text-teal-700">Your data is private. You control what's shared.</p>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-4 pb-10">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Trends</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Support</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-lightbulb text-gray-400 text-2xl"></i>
                <span class="text-base text-gray-400 mt-1">Insights</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-teal-600 text-2xl"></i>
                <span class="text-base text-teal-600 font-semibold mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
