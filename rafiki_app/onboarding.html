<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafiki — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
* { font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased; }
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:#1B120C;color:#fff;}
.status-bar{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:30;}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:40;}
.grad{background:linear-gradient(135deg,#F5883B,#E4572E);}
.chip{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.16);backdrop-filter:blur(6px);}
.chip.on{background:#fff;border-color:#fff;color:#E4572E;}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>

  <!-- Hero image -->
  <div class="absolute inset-0">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782871266725-image-1.png" class="w-full h-full object-cover" alt=""/>
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(27,18,12,0.25) 0%,rgba(27,18,12,0.55) 45%,rgba(27,18,12,0.96) 82%);"></div>
  </div>

  <div class="relative z-10 h-full flex flex-col">
    <div class="status-bar">
      <span class="text-[15px] font-semibold">9:41</span>
      <div class="flex items-center gap-1.5 text-[13px]">
        <i class="fas fa-signal text-[12px]"></i><i class="fas fa-wifi text-[12px]"></i><i class="fas fa-battery-full text-[14px]"></i>
      </div>
    </div>

    <!-- Brand -->
    <div class="px-8 mt-6 flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl grad flex items-center justify-center shadow-lg">
        <i class="fas fa-sun text-white text-[18px]"></i>
      </div>
      <span class="text-[19px] font-extrabold tracking-tight">Rafiki</span>
    </div>

    <div class="flex-1"></div>

    <!-- Copy -->
    <div class="px-8">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-4" style="background:rgba(245,166,35,0.18);border:1px solid rgba(245,166,35,0.3);">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span>
        <span class="text-amber-200 text-[10px] font-bold tracking-widest uppercase">Bidibidi Settlement · Uganda</span>
      </div>
      <h1 class="text-[38px] font-extrabold leading-[1.05] tracking-tight">A friend in the<br/>settlement.</h1>
      <p class="text-white/70 text-[15px] mt-3 leading-relaxed">Rations, water, health and jobs in one place — with an AI helper that answers in your own language, even offline.</p>
    </div>

    <!-- Language -->
    <div class="px-8 mt-6">
      <div class="text-white/55 text-[11px] font-bold tracking-widest uppercase mb-3">Choose your language</div>
      <div class="flex flex-wrap gap-2.5">
        <span class="chip on px-4 py-2.5 rounded-full text-[14px] font-bold">English</span>
        <span class="chip px-4 py-2.5 rounded-full text-[14px] font-semibold">Kiswahili</span>
        <span class="chip px-4 py-2.5 rounded-full text-[14px] font-semibold">Juba Arabic</span>
        <span class="chip px-4 py-2.5 rounded-full text-[14px] font-semibold">Lugbara</span>
        <span class="chip px-4 py-2.5 rounded-full text-[14px] font-semibold">Français</span>
        <span class="chip px-4 py-2.5 rounded-full text-[14px] font-semibold">Kinyarwanda</span>
      </div>
    </div>

    <!-- CTA -->
    <div class="px-8 mt-7 pb-10">
      <button class="w-full grad rounded-2xl py-4 flex items-center justify-center gap-2.5 shadow-xl" style="box-shadow:0 16px 32px -10px rgba(228,87,46,0.6);">
        <span class="text-white text-[16px] font-bold">Continue</span>
        <i class="fas fa-arrow-right text-white text-[14px]"></i>
      </button>
      <div class="flex items-center justify-center gap-6 mt-4 text-white/55 text-[12px]">
        <span class="flex items-center gap-1.5"><i class="fas fa-wifi-slash text-emerald-400"></i> Works offline</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-shield-heart text-rose-300"></i> Free &amp; private</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
