<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alternatives</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="nav"><div class="ib"><i class="fas fa-chevron-left"></i></div><h1 class="font-bold text-[17px]">Safer colors</h1><div class="ib"><i class="fas fa-rotate"></i></div></div>

    <div class="card !p-4 flex items-center gap-3">
      <div class="w-14 h-14 rounded-2xl relative" style="background:#C2453B"><span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-[#1E1B24] text-white text-[10px] flex items-center justify-center border-2 border-white"><i class="fas fa-lock"></i></span></div>
      <div class="flex-1"><p class="label">Locked</p><p class="font-bold text-[16px]">Red team · Brick <span class="mono text-[12px] muted">CM-041</span></p></div>
    </div>

    <p class="label mt-5 mb-2">Change green team to</p>
    <div class="space-y-3">
      <div class="card !p-4 ring-[3px] ring-[#3B3FCF]">
        <div class="flex items-center gap-3">
          <div class="flex"><div class="w-12 h-12 rounded-l-xl" style="background:#C2453B"></div><div class="w-12 h-12 rounded-r-xl" style="background:#2E5A88"></div></div>
          <div class="flex-1"><p class="font-bold text-[15px]">Cobalt Bay <span class="mono text-[12px] muted">CM-230</span></p><p class="text-[12px] muted">Clear in all 4 views</p></div>
          <span class="w-7 h-7 rounded-full bg-[#3B3FCF] text-white flex items-center justify-center text-[12px]"><i class="fas fa-check"></i></span>
        </div>
        <div class="grid grid-cols-4 gap-1.5 mt-3">
          <div><div class="h-6 rounded-md flex overflow-hidden"><div class="flex-1" style="background:#C2453B"></div><div class="flex-1" style="background:#2E5A88"></div></div><p class="text-[10px] muted font-semibold mt-1 text-center">Typical</p></div>
          <div><div class="h-6 rounded-md flex overflow-hidden"><div class="flex-1" style="background:#8C7E3D"></div><div class="flex-1" style="background:#3E5B8A"></div></div><p class="text-[10px] muted font-semibold mt-1 text-center">Red-green</p></div>
          <div><div class="h-6 rounded-md flex overflow-hidden"><div class="flex-1" style="background:#C24A55"></div><div class="flex-1" style="background:#2F6B70"></div></div><p class="text-[10px] muted font-semibold mt-1 text-center">Blue-yel.</p></div>
          <div><div class="h-6 rounded-md flex overflow-hidden"><div class="flex-1" style="background:#6E6E6E"></div><div class="flex-1" style="background:#4F4F4F"></div></div><p class="text-[10px] muted font-semibold mt-1 text-center">Gray</p></div>
        </div>
      </div>
      <div class="card !p-4 flex items-center gap-3">
        <div class="flex"><div class="w-11 h-11 rounded-l-xl" style="background:#C2453B"></div><div class="w-11 h-11 rounded-r-xl" style="background:#9DC3E0"></div></div>
        <div class="flex-1"><p class="font-bold text-[14px]">Pale Sky <span class="mono text-[12px] muted">CM-236</span></p><p class="text-[12px] muted">Clear in 3 of 4 views</p></div>
        <span class="dot bg-[#F5B83D]"></span>
      </div>
    </div>

    <p class="label mt-5 mb-2">Also add a mark</p>
    <div class="grid grid-cols-3 gap-3">
      <div class="card !p-3 text-center ring-2 ring-[#3B3FCF]"><div class="h-14 rounded-xl stripes" style="background-color:#2E5A88"></div><p class="text-[12px] font-bold mt-2">Stripes</p></div>
      <div class="card !p-3 text-center"><div class="h-14 rounded-xl dots" style="background-color:#2E5A88"></div><p class="text-[12px] font-bold mt-2">Dots</p></div>
      <div class="card !p-3 text-center"><div class="h-14 rounded-xl flex items-center justify-center text-white text-[22px]" style="background:#2E5A88"><i class="fas fa-star"></i></div><p class="text-[12px] font-bold mt-2">Symbol</p></div>
    </div>

    <div class="btn primary mt-5"><i class="fas fa-flask"></i>Formula for Cobalt Bay</div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i>Studio</div>
    <div class="tab"><i class="fas fa-eye-dropper"></i>Pick</div>
    <div class="tab-mix"><span><i class="fas fa-flask"></i></span></div>
    <div class="tab active"><i class="fas fa-circle-half-stroke"></i>Check</div>
    <div class="tab"><i class="fas fa-layer-group"></i>Cards</div>
  </div>
</div>
</body>
</html>
