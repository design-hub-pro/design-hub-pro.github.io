<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorMix</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#1E1B24}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2d2b33,#0c0b10);box-shadow:0 50px 80px -30px rgba(40,30,70,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F7F4EE}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:conic-gradient(from 200deg,#E5484D,#F5B83D,#3DB87A,#2F8FD8,#6E4BD8,#E5484D)"><i class="fa-solid fa-palette text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-semibold tracking-tight" style="font-family:'Fraunces',Georgia,serif">ColorMix</h1>
  <p class="mt-3 text-[19px] text-gray-500">Pick any color and get a real paint formula in grams, with every step readable and spoken.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-800">Art</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Accessibility</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Education</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">AI</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pick.html" scrolling="no" title="pick"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="palette.html" scrolling="no" title="palette"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="formula.html" scrolling="no" title="formula"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="compare.html" scrolling="no" title="compare"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="mix.html" scrolling="no" title="mix"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="adjust.html" scrolling="no" title="adjust"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="confuse.html" scrolling="no" title="confuse"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="alternatives.html" scrolling="no" title="alternatives"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="card.html" scrolling="no" title="card"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="shelf.html" scrolling="no" title="shelf"></iframe></div></div>
</div></main>
</body></html>
