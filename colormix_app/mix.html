<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix step</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full">
    <div class="nav"><div class="ib"><i class="fas fa-xmark"></i></div><div class="text-center"><p class="text-[12px] muted font-semibold">Harbor Teal · 20 g</p><p class="font-bold text-[15px]">Step 3 of 6</p></div><div class="ib"><i class="fas fa-ellipsis"></i></div></div>
    <div class="flex gap-1.5"><div class="flex-1 h-1.5 rounded-full bg-[#3B3FCF]"></div><div class="flex-1 h-1.5 rounded-full bg-[#3B3FCF]"></div><div class="flex-1 h-1.5 rounded-full bg-[#3B3FCF]/40"></div><div class="flex-1 h-1.5 rounded-full bg-[#E3DCD0]"></div><div class="flex-1 h-1.5 rounded-full bg-[#E3DCD0]"></div><div class="flex-1 h-1.5 rounded-full bg-[#E3DCD0]"></div></div>

    <div class="flex items-center gap-3 mt-6">
      <div class="w-[72px] h-[72px] rounded-[22px] flex items-center justify-center text-[34px] font-extrabold" style="background:#E9C531">3</div>
      <div><p class="label">Bottle 3</p><p class="serif text-[26px] font-semibold leading-tight">Hansa Yellow</p></div>
    </div>

    <p class="text-[17px] muted font-semibold mt-6">Weigh</p>
    <p class="num font-extrabold leading-none text-[84px] tracking-tight">4.40<span class="text-[34px] ml-1">g</span></p>

    <div class="card mt-6 !p-4 flex items-center gap-4">
      <div class="relative w-[104px] h-[104px] flex-shrink-0">
        <svg viewBox="0 0 120 120" class="w-full h-full" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="50" fill="none" stroke="#F1ECE3" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="#E9C531" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="34"/></svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="num text-[24px] font-bold leading-none">3.92</span><span class="text-[10px] muted font-bold mt-0.5">ON SCALE</span></div>
      </div>
      <div class="flex-1">
        <p class="font-bold text-[16px]">0.48 g to go</p>
        <p class="text-[13px] muted mt-0.5">Add slowly. A small drop is about 0.05 g.</p>
        <p class="text-[12px] font-semibold mt-2 flex items-center gap-1.5"><span class="dot bg-[#3DB87A]"></span>Scale connected</p>
      </div>
    </div>

    <div class="hero h-[118px] mt-4 !rounded-[22px]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794499492880-image-1.png" alt="Paint cup on a kitchen scale"><div class="absolute inset-0 bg-gradient-to-r from-black/60 to-transparent"></div><p class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-[14px] font-semibold w-[170px]">Next: stir 45 s until no streaks</p></div>

    <div class="grid grid-cols-[auto_auto_1fr] gap-3 mt-5">
      <div class="btn ghost !w-[60px]"><i class="fas fa-rotate-left"></i></div>
      <div class="btn ghost !w-[60px]"><i class="fas fa-magnifying-glass-plus"></i></div>
      <div class="btn primary">Done, next step<i class="fas fa-arrow-right text-sm"></i></div>
    </div>
    <p class="text-center text-[12px] muted mt-3"><i class="fas fa-volume-high mr-1"></i>Say "repeat" or "next" any time</p>
  </div>
</div>
</body>
</html>
