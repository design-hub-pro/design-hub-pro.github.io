<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="nav"><div class="ib"><i class="fas fa-chevron-left"></i></div><h1 class="font-bold text-[17px]">Color card</h1><div class="ib"><i class="fas fa-ellipsis"></i></div></div>

    <div class="flex gap-1 bg-[#ECE6DC] rounded-2xl p-1 text-[13px] font-bold text-center">
      <span class="flex-1 py-2 rounded-xl bg-white shadow-sm">Color</span><span class="flex-1 py-2 rounded-xl muted">Black & white</span><span class="flex-1 py-2 rounded-xl muted">Text only</span>
    </div>

    <div class="bg-white rounded-[26px] mt-4 overflow-hidden shadow-[0_18px_40px_rgba(40,30,20,.12)]">
      <div class="h-[150px] relative" style="background:#2F7F7C">
        <div class="absolute bottom-4 left-5 text-white"><p class="mono text-[12px] opacity-80">CM-214 · #2F7F7C</p><p class="serif text-[30px] font-semibold leading-tight">Harbor Teal</p></div>
        <div class="absolute top-4 right-4 w-14 h-14 bg-white rounded-xl p-1.5"><div class="w-full h-full" style="background:repeating-conic-gradient(#1E1B24 0 25%,#fff 0 50%) 0 0/8px 8px"></div></div>
      </div>
      <div class="px-5 py-3 divide-y divide-[#F1ECE3]">
        <div class="flex items-center gap-3 py-2.5"><div class="bottle !w-8 !h-8 !text-[13px]" style="background:#F4F2EC;color:#1E1B24">1</div><span class="flex-1 font-semibold text-[14px]">Titanium White</span><span class="num font-bold text-[16px]">11.70 g</span></div>
        <div class="flex items-center gap-3 py-2.5"><div class="bottle !w-8 !h-8 !text-[13px]" style="background:#E9C531;color:#1E1B24">3</div><span class="flex-1 font-semibold text-[14px]">Hansa Yellow</span><span class="num font-bold text-[16px]">4.40 g</span></div>
        <div class="flex items-center gap-3 py-2.5"><div class="bottle !w-8 !h-8 !text-[13px]" style="background:#0F4C81">2</div><span class="flex-1 font-semibold text-[14px]">Phthalo Blue</span><span class="num font-bold text-[16px]">3.60 g</span></div>
        <div class="flex items-center gap-3 py-2.5"><div class="bottle !w-8 !h-8 !text-[13px]" style="background:#8A3E22">4</div><span class="flex-1 font-semibold text-[14px]">Burnt Sienna</span><span class="num font-bold text-[16px]">0.60 g</span></div>
      </div>
      <div class="px-5 pb-4 flex items-center justify-between text-[12px] muted font-semibold"><span>Batch 20.30 g · 2 rounds</span><span class="flex items-center gap-1.5"><span class="dot bg-[#3DB87A]"></span>ΔE 1.2 final</span></div>
    </div>

    <div class="flex items-center gap-3 mt-5">
      <div class="flex stack"><img class="w-9 h-9 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794499492977-image-1.png" alt=""><img class="w-9 h-9 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794499493240-image-1.png" alt=""><span class="w-9 h-9 rounded-full bg-[#1E1B24] text-white text-[11px] font-bold flex items-center justify-center -ml-2.5 border-2 border-white">+22</span></div>
      <p class="text-[13px] font-semibold flex-1">Room 12 · Mural group</p><span class="text-[13px] ink font-bold">Shared</span>
    </div>

    <div class="grid grid-cols-4 gap-3 mt-5 text-center">
      <div><div class="gi g-ink mx-auto !w-14 !h-14 !rounded-[18px]"><i class="fas fa-print"></i></div><p class="text-[12px] font-semibold mt-1.5">Print</p></div>
      <div><div class="gi g-teal mx-auto !w-14 !h-14 !rounded-[18px]"><i class="fas fa-align-left"></i></div><p class="text-[12px] font-semibold mt-1.5">Copy text</p></div>
      <div><div class="gi g-sun mx-auto !w-14 !h-14 !rounded-[18px]"><i class="fas fa-rotate-right"></i></div><p class="text-[12px] font-semibold mt-1.5">Mix again</p></div>
      <div><div class="gi g-plum mx-auto !w-14 !h-14 !rounded-[18px]"><i class="fas fa-share-from-square"></i></div><p class="text-[12px] font-semibold mt-1.5">Send</p></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i>Studio</div>
    <div class="tab"><i class="fas fa-eye-dropper"></i>Pick</div>
    <div class="tab-mix"><span><i class="fas fa-flask"></i></span></div>
    <div class="tab"><i class="fas fa-circle-half-stroke"></i>Check</div>
    <div class="tab active"><i class="fas fa-layer-group"></i>Cards</div>
  </div>
</div>
</body>
</html>
