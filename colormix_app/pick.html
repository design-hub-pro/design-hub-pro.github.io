<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick from photo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute inset-0"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794499493672-image-1.png" class="w-full h-full object-cover" style="transform:scale(1.15)" alt="Coastal reference photo"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 22%)"></div></div>
  <div class="relative z-10 px-7 flex items-center justify-between mt-2">
    <div class="ib !bg-white/85 backdrop-blur"><i class="fas fa-chevron-left"></i></div>
    <div class="flex gap-1 bg-white/85 backdrop-blur rounded-full p-1 text-[12px] font-bold"><span class="px-3 py-1.5 rounded-full">1×</span><span class="px-3 py-1.5 rounded-full bg-[#1E1B24] text-white">4×</span><span class="px-3 py-1.5 rounded-full">8×</span></div>
    <div class="ib !bg-white/85 backdrop-blur"><i class="fas fa-image"></i></div>
  </div>

  <!-- loupe -->
  <div class="absolute z-10" style="left:150px;top:250px">
    <div class="w-[140px] h-[140px] rounded-full border-[5px] border-white overflow-hidden shadow-2xl relative" style="background:#2F7F7C">
      <div class="absolute inset-0 grid grid-cols-7 grid-rows-7 opacity-90">
        <div style="background:#2C7A78"></div><div style="background:#2F7F7C"></div><div style="background:#33847F"></div><div style="background:#2F7F7C"></div><div style="background:#2A7774"></div><div style="background:#2F7F7C"></div><div style="background:#34857F"></div>
        <div style="background:#31817D"></div><div style="background:#2F7F7C"></div><div style="background:#2C7A78"></div><div style="background:#2F7F7C"></div><div style="background:#33847F"></div><div style="background:#2F7F7C"></div><div style="background:#2A7774"></div>
      </div>
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-5 h-5 border-2 border-white rounded-[4px] shadow"></div>
    </div>
    <div class="w-[2px] h-6 bg-white mx-auto"></div>
    <div class="w-3 h-3 rounded-full bg-white mx-auto shadow"></div>
  </div>

  <div class="absolute z-20 inset-x-0 bottom-[90px] bg-white rounded-t-[30px] px-7 pt-3 pb-5 shadow-[0_-10px_30px_rgba(0,0,0,.12)]">
    <div class="w-10 h-1.5 rounded-full bg-[#E3DCD0] mx-auto mb-4"></div>
    <div class="flex items-center gap-4">
      <div class="sw w-[76px] h-[76px] !rounded-[22px]" style="background:#2F7F7C"></div>
      <div class="flex-1">
        <p class="label">Picked color</p>
        <p class="serif text-[24px] font-semibold leading-tight">Harbor Teal</p>
        <div class="flex gap-1.5 mt-1"><span class="tag mono">CM-214</span><span class="tag mono">#2F7F7C</span></div>
      </div>
      <div class="speak !w-12 !h-12 !text-[16px]"><i class="fas fa-volume-high"></i></div>
    </div>
    <p class="text-[13px] muted mt-3"><i class="fas fa-closed-captioning mr-1"></i>"Medium blue-green, a little gray. Like shallow sea water."</p>
    <div class="flex gap-2 mt-4 mb-1">
      <span class="chip !bg-[#F7F4EE]"><span class="dot" style="background:#C9824A"></span>Cliff Ochre</span>
      <span class="chip !bg-[#F7F4EE]"><span class="dot" style="background:#E8B7AE"></span>Dusk Pink</span>
      <span class="chip !bg-[#F7F4EE]"><i class="fas fa-plus text-[10px]"></i>Add</span>
    </div>
    <div class="btn primary mt-4"><i class="fas fa-flask"></i>Get formula</div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i>Studio</div>
    <div class="tab active"><i class="fas fa-eye-dropper"></i>Pick</div>
    <div class="tab-mix"><span><i class="fas fa-flask"></i></span></div>
    <div class="tab"><i class="fas fa-circle-half-stroke"></i>Check</div>
    <div class="tab"><i class="fas fa-layer-group"></i>Cards</div>
  </div>
</div>
</body>
</html>
