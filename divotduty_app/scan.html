<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Live sweep</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen" style="background:#08100C">
<!-- camera feed -->
<div class="absolute left-0 right-0 top-0 h-[600px] overflow-hidden">
  <img src="img/turf.jpg" class="absolute max-w-none" style="width:760px;height:760px;left:-150px;top:-60px">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.55) 0%,rgba(8,16,12,0) 22%,rgba(8,16,12,0) 80%,#08100C 100%)"></div>
  <div class="scanline"></div>
  <!-- detections -->
  <div class="det b-divot" style="left:85px;top:415px;width:110px;height:100px"><b class="c-divot">Divot 0.94</b></div>
  <div class="det b-divot" style="left:172px;top:522px;width:112px;height:70px"><b class="c-divot">Divot 0.91</b></div>
  <div class="det b-ball" style="left:299px;top:364px;width:48px;height:48px"><b class="c-ball">Ball 0.98</b></div>
  <div class="det b-divot" style="left:42px;top:330px;width:72px;height:62px;border-style:dashed"><b class="c-divot" style="opacity:.8">Divot 0.62</b></div>
</div>

<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="relative z-10 px-7 mt-3 flex items-center justify-between text-white">
  <div class="chip glass"><span class="relative flex w-2.5 h-2.5"><span class="absolute inset-0 rounded-full bg-rose-500 ping"></span><span class="relative w-2.5 h-2.5 rounded-full bg-rose-500"></span></span>REC <span class="num">06:42</span></div>
  <div class="chip glass"><i class="fa-solid fa-gauge-simple text-white/60"></i><span class="num">1.1 m/s</span></div>
  <div class="chip glass">Lane <span class="num">4/9</span></div>
</div>

<!-- slow-down hint -->
<div class="absolute z-10 top-[150px] left-1/2 -translate-x-1/2 chip bg-[#4ADE80] text-[#08100C] shadow-lg"><i class="fa-solid fa-check"></i>Good pace</div>

<!-- bottom panel -->
<div class="absolute left-0 right-0 bottom-0 px-7 pb-10 text-white z-10">
  <div class="grid grid-cols-4 gap-2">
    <div class="rounded-2xl glass py-3 text-center"><div class="num text-[28px] font-bold leading-none t-divot">96</div><div class="text-[11px] text-white/60 mt-1.5 font-semibold">Divots</div></div>
    <div class="rounded-2xl glass py-3 text-center"><div class="num text-[28px] font-bold leading-none text-[#FACC15]">6</div><div class="text-[11px] text-white/60 mt-1.5 font-semibold">Bare</div></div>
    <div class="rounded-2xl glass py-3 text-center"><div class="num text-[28px] font-bold leading-none text-[#60A5FA]">31</div><div class="text-[11px] text-white/60 mt-1.5 font-semibold">Balls</div></div>
    <div class="rounded-2xl glass py-3 text-center"><div class="num text-[28px] font-bold leading-none text-[#FB7185]">5</div><div class="text-[11px] text-white/60 mt-1.5 font-semibold">Litter</div></div>
  </div>

  <!-- lane coverage -->
  <div class="mt-4 rounded-2xl glass p-4">
    <div class="flex items-center justify-between"><span class="text-[13px] font-semibold text-white/70">Range covered</span><span class="num text-[15px] font-bold">44%</span></div>
    <div class="mt-3 flex gap-1.5 h-[46px]">
      <div class="flex-1 rounded-md bg-[#22C55E]"></div><div class="flex-1 rounded-md bg-[#22C55E]"></div><div class="flex-1 rounded-md bg-[#22C55E]"></div>
      <div class="flex-1 rounded-md bg-white/10 relative overflow-hidden"><div class="absolute bottom-0 left-0 right-0 h-[60%] bg-[#22C55E]"></div><div class="absolute left-1/2 -translate-x-1/2 top-[34%] w-3 h-3 rounded-full bg-white border-2 border-[#22C55E]"></div></div>
      <div class="flex-1 rounded-md bg-white/10"></div><div class="flex-1 rounded-md bg-white/10"></div><div class="flex-1 rounded-md bg-white/10"></div><div class="flex-1 rounded-md bg-white/10"></div><div class="flex-1 rounded-md bg-white/10"></div>
    </div>
  </div>

  <div class="mt-5 flex items-center justify-center gap-8">
    <div class="w-14 h-14 rounded-full glass flex items-center justify-center text-[18px]"><i class="fa-solid fa-flag"></i></div>
    <div class="w-[76px] h-[76px] rounded-full border-4 border-white/80 flex items-center justify-center"><div class="w-8 h-8 rounded-lg bg-rose-500"></div></div>
    <div class="w-14 h-14 rounded-full glass flex items-center justify-center text-[18px]"><i class="fa-solid fa-pause"></i></div>
  </div>
</div>
<div class="home-ind light"></div>
</div></body></html>
