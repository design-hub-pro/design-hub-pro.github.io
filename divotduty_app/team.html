<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Crew</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="absolute left-0 right-0 top-0 h-[360px] overflow-hidden">
  <img src="img/team.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 35%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.5) 0%,rgba(8,16,12,0) 30%,rgba(8,16,12,.15) 55%,rgba(8,16,12,.9) 100%)"></div>
</div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="relative z-10 px-7 mt-2 flex items-center justify-between text-white">
  <div class="chip glass"><i class="fa-solid fa-users"></i>Westbrook HS Golf</div>
  <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-user-plus text-[14px]"></i></div>
</div>
<div class="absolute z-10 left-7 right-7 top-[250px] text-white flex items-end justify-between">
  <div><div class="text-[13px] font-semibold text-white/65">This month</div><div class="text-[28px] font-extrabold tracking-tight leading-tight">Crew hours</div></div>
  <div class="num text-[44px] font-bold leading-none">31.5</div>
</div>

<div class="absolute left-0 right-0 top-[360px] bottom-[90px] overflow-y-auto px-7 pt-5 pb-6">
  <!-- goal -->
  <div class="card p-5">
    <div class="flex items-center justify-between"><div class="label">Team goal · 2,000 fills</div><span class="num text-[14px] font-bold">64%</span></div>
    <div class="bar !h-3 mt-3"><span class="grad-brand" style="width:64%"></span></div>
    <div class="mt-3 flex items-center gap-2 text-[12px] text-gray-500"><i class="fa-solid fa-certificate t-brand"></i>Service hours export to school office</div>
  </div>

  <!-- leaderboard -->
  <div class="mt-5 text-[18px] font-bold">Leaderboard</div>
  <div class="mt-3 card divide-y divide-gray-100">
    <div class="p-4 flex items-center gap-3"><span class="num w-5 text-[15px] font-bold text-amber-500">1</span><img src="img/av2.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Priya N.</div><div class="flex gap-2 mt-1 text-[11px] text-gray-500"><span><span class="dot c-divot mr-1"></span><span class="num">412</span></span><span><span class="dot c-ball mr-1"></span><span class="num">88</span></span><span><span class="dot c-litter mr-1"></span><span class="num">14</span></span></div></div><div class="num text-[20px] font-bold">9.0<span class="text-[11px] text-gray-400"> h</span></div></div>
    <div class="p-4 flex items-center gap-3"><span class="num w-5 text-[15px] font-bold text-gray-400">2</span><img src="img/av1.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Jordan L.</div><div class="flex gap-2 mt-1 text-[11px] text-gray-500"><span><span class="dot c-divot mr-1"></span><span class="num">366</span></span><span><span class="dot c-ball mr-1"></span><span class="num">102</span></span><span><span class="dot c-litter mr-1"></span><span class="num">9</span></span></div></div><div class="num text-[20px] font-bold">8.5<span class="text-[11px] text-gray-400"> h</span></div></div>
    <div class="p-4 flex items-center gap-3"><span class="num w-5 text-[15px] font-bold text-orange-400">3</span><img src="img/golfer.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Sam T.</div><div class="flex gap-2 mt-1 text-[11px] text-gray-500"><span><span class="dot c-divot mr-1"></span><span class="num">281</span></span><span><span class="dot c-ball mr-1"></span><span class="num">164</span></span><span><span class="dot c-litter mr-1"></span><span class="num">31</span></span></div></div><div class="num text-[20px] font-bold">7.5<span class="text-[11px] text-gray-400"> h</span></div></div>
    <div class="p-4 flex items-center gap-3"><span class="num w-5 text-[15px] font-bold text-gray-400">4</span><img src="img/maya.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Maya R.</div><div class="flex gap-2 mt-1 text-[11px] text-gray-500"><span><span class="dot c-divot mr-1"></span><span class="num">225</span></span><span><span class="dot c-ball mr-1"></span><span class="num">58</span></span><span><span class="dot c-litter mr-1"></span><span class="num">14</span></span></div></div><div class="num text-[20px] font-bold">6.5<span class="text-[11px] text-gray-400"> h</span></div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab"><i class="fa-solid fa-route"></i>Route</div><div class="tab active"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
