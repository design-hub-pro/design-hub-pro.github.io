<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen bg-black">
<img src="img/cart.jpg" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.35) 0%,rgba(8,16,12,0) 28%,rgba(8,16,12,.55) 52%,rgba(8,16,12,.97) 78%)"></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="relative z-10 px-7 mt-3 flex items-center gap-2 text-white">
  <div class="w-9 h-9 rounded-xl grad-brand flex items-center justify-center"><i class="fa-solid fa-map-location-dot text-[15px]"></i></div>
  <span class="font-extrabold text-[18px] tracking-tight">DivotDuty</span>
</div>

<!-- floating detection chips over photo -->
<div class="absolute top-[250px] left-[36px] chip glass text-white z-10"><span class="dot c-divot"></span>Divot <span class="num text-white/60">0.94</span></div>
<div class="absolute top-[318px] right-[34px] chip glass text-white z-10"><span class="dot c-ball"></span>Ball <span class="num text-white/60">0.98</span></div>
<div class="absolute top-[386px] left-[92px] chip glass text-white z-10"><span class="dot c-litter"></span>Litter <span class="num text-white/60">0.88</span></div>

<div class="absolute bottom-0 left-0 right-0 px-7 pb-12 text-white z-10">
  <div class="flex gap-2 mb-5">
    <span class="w-7 h-[5px] rounded-full bg-[#4ADE80]"></span><span class="w-[5px] h-[5px] rounded-full bg-white/30"></span><span class="w-[5px] h-[5px] rounded-full bg-white/30"></span>
  </div>
  <h1 class="text-[40px] leading-[1.05] font-extrabold tracking-tight">Push the cart.<br>Get the <span class="text-[#4ADE80]">repair route.</span></h1>
  <p class="mt-4 text-[16px] text-white/65 leading-relaxed">Your phone films the turf. Every divot, bare patch, ball and wrapper becomes a task on one map.</p>

  <div class="mt-7 grid grid-cols-4 gap-2">
    <div class="rounded-2xl glass p-3 text-center"><div class="w-9 h-9 mx-auto rounded-xl grad-divot flex items-center justify-center"><i class="fa-solid fa-shoe-prints text-[14px]"></i></div><div class="text-[11px] mt-2 font-semibold text-white/80">Divots</div></div>
    <div class="rounded-2xl glass p-3 text-center"><div class="w-9 h-9 mx-auto rounded-xl grad-bare flex items-center justify-center"><i class="fa-solid fa-seedling text-[14px]"></i></div><div class="text-[11px] mt-2 font-semibold text-white/80">Bare turf</div></div>
    <div class="rounded-2xl glass p-3 text-center"><div class="w-9 h-9 mx-auto rounded-xl grad-ball flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-[14px]"></i></div><div class="text-[11px] mt-2 font-semibold text-white/80">Balls</div></div>
    <div class="rounded-2xl glass p-3 text-center"><div class="w-9 h-9 mx-auto rounded-xl grad-litter flex items-center justify-center"><i class="fa-solid fa-bottle-water text-[14px]"></i></div><div class="text-[11px] mt-2 font-semibold text-white/80">Litter</div></div>
  </div>

  <div class="mt-7 btn grad-brand text-white shadow-[0_14px_30px_-10px_rgba(34,197,94,.7)]">Set up my range <i class="fa-solid fa-arrow-right"></i></div>
  <div class="mt-4 text-center text-[14px] text-white/55">Joining a crew? <span class="text-white font-semibold">Enter team code</span></div>
</div>
<div class="home-ind light"></div>
</div></body></html>
