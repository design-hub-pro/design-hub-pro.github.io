<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Range map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<!-- full-bleed map -->
<div class="absolute inset-0">
  <img src="img/aerial.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 100%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(243,244,238,.9) 0%,rgba(243,244,238,0) 20%)"></div>
  <!-- heat glow over tee line -->
  <div class="absolute rounded-full" style="left:40px;top:560px;width:360px;height:150px;background:radial-gradient(closest-side,rgba(242,113,28,.55),rgba(242,113,28,0));"></div>
  <!-- clusters -->
  <div class="cluster grad-divot" style="left:120px;top:625px;width:58px;height:58px">48</div>
  <div class="cluster grad-divot" style="left:226px;top:600px;width:66px;height:66px">71</div>
  <div class="cluster grad-divot" style="left:330px;top:640px;width:50px;height:50px">45</div>
  <div class="cluster grad-bare" style="left:118px;top:300px;width:40px;height:40px">4</div>
  <div class="cluster grad-bare" style="left:338px;top:275px;width:40px;height:40px">7</div>
  <!-- loose pins -->
  <span class="pin c-ball" style="left:180px;top:420px"></span><span class="pin c-ball" style="left:205px;top:455px"></span><span class="pin c-ball" style="left:262px;top:380px"></span><span class="pin c-ball" style="left:300px;top:470px"></span><span class="pin c-ball" style="left:150px;top:500px"></span><span class="pin c-ball" style="left:240px;top:330px"></span><span class="pin c-ball" style="left:320px;top:360px"></span>
  <span class="pin c-litter" style="left:58px;top:470px"></span><span class="pin c-litter" style="left:395px;top:520px"></span><span class="pin c-litter" style="left:92px;top:230px"></span>
  <!-- selected -->
  <div class="absolute" style="left:226px;top:600px;transform:translate(-50%,-50%)"><div class="w-[96px] h-[96px] rounded-full border-[3px] border-white/90 border-dashed"></div></div>
  <div class="absolute flex flex-col items-center" style="left:226px;top:528px;transform:translateX(-50%)"><div class="chip bg-[#13201A] text-white shadow-lg">Zone B · Bay 6–9</div><div class="w-2 h-2 bg-[#13201A] rotate-45 -mt-1"></div></div>
</div>

<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="relative z-10 px-7 mt-2">
  <div class="flex items-center justify-between">
    <h1 class="text-[28px] font-extrabold tracking-tight">Range map</h1>
    <div class="flex gap-2"><div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-layer-group text-[15px]"></i></div><div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-location-arrow text-[15px] t-brand"></i></div></div>
  </div>
  <div class="mt-3 flex gap-2 overflow-x-auto -mx-7 px-7">
    <div class="chip bg-[#13201A] text-white shrink-0">All <span class="num text-white/60">231</span></div>
    <div class="chip bg-white card !shadow-none shrink-0"><span class="dot c-divot"></span>Divots <span class="num text-gray-400">164</span></div>
    <div class="chip bg-white card !shadow-none shrink-0"><span class="dot c-bare"></span>Bare <span class="num text-gray-400">11</span></div>
    <div class="chip bg-white card !shadow-none shrink-0"><span class="dot c-ball"></span>Balls <span class="num text-gray-400">47</span></div>
    <div class="chip bg-white card !shadow-none shrink-0"><span class="dot c-litter"></span>Litter <span class="num text-gray-400">9</span></div>
  </div>
</div>

<!-- bottom sheet -->
<div class="absolute z-20 left-3 right-3 bottom-[100px] card p-5">
  <div class="w-10 h-1 rounded-full bg-gray-200 mx-auto -mt-2 mb-3"></div>
  <div class="flex items-center gap-4">
    <img src="img/turf.jpg" class="w-[68px] h-[68px] rounded-2xl object-cover">
    <div class="flex-1">
      <div class="text-[17px] font-bold">Zone B · Bays 6–9</div>
      <div class="text-[13px] text-gray-500 mt-0.5"><span class="num">71</span> divots · <span class="num">2.1</span> bottles sand-seed</div>
    </div>
    <div class="w-12 h-12 rounded-2xl grad-brand text-white flex items-center justify-center"><i class="fa-solid fa-route"></i></div>
  </div>
  <div class="mt-4 flex items-center gap-2 text-[12px] text-gray-500"><span class="font-semibold text-gray-700">Density</span><div class="bar flex-1"><span class="grad-divot" style="width:86%"></span></div><span class="num font-semibold text-gray-700">High</span></div>
</div>

<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab active"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab"><i class="fa-solid fa-route"></i>Route</div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
