<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <h1 class="text-[28px] font-extrabold tracking-tight">Turf report</h1>
    <div class="flex bg-white card !shadow-none border border-gray-200 rounded-full p-1 text-[13px] font-semibold"><span class="px-3 py-1 rounded-full text-gray-400">Week</span><span class="px-3 py-1 rounded-full bg-[#13201A] text-white">Month</span></div>
  </div>

  <!-- hero stat + chart -->
  <div class="mt-4 card p-5">
    <div class="flex items-start justify-between">
      <div><div class="label">Divots repaired</div><div class="num text-[44px] font-bold leading-none mt-2">1,284</div></div>
      <div class="text-right"><div class="label">Fix rate</div><div class="num text-[28px] font-bold leading-none mt-2 t-brand">86%</div></div>
    </div>
    <svg viewBox="0 0 330 140" class="mt-4 w-full h-[140px]">
      <g stroke="#EEF0EA" stroke-width="1"><line x1="0" y1="20" x2="330" y2="20"/><line x1="0" y1="60" x2="330" y2="60"/><line x1="0" y1="100" x2="330" y2="100"/></g>
      <!-- bars: found (light) vs fixed (green), 4 weeks -->
      <g>
        <rect x="18" y="34" width="26" height="86" rx="7" fill="#FDE3D0"/><rect x="48" y="58" width="26" height="62" rx="7" fill="#22C55E"/>
        <rect x="100" y="28" width="26" height="92" rx="7" fill="#FDE3D0"/><rect x="130" y="44" width="26" height="76" rx="7" fill="#22C55E"/>
        <rect x="182" y="40" width="26" height="80" rx="7" fill="#FDE3D0"/><rect x="212" y="46" width="26" height="74" rx="7" fill="#22C55E"/>
        <rect x="264" y="30" width="26" height="90" rx="7" fill="#FDE3D0"/><rect x="294" y="36" width="26" height="84" rx="7" fill="#22C55E"/>
      </g>
      <g font-size="11" fill="#8E978F" font-family="Inter" font-weight="600"><text x="34" y="136">Oct 20</text><text x="116" y="136">Oct 27</text><text x="200" y="136">Nov 3</text><text x="280" y="136">Nov 10</text></g>
    </svg>
    <div class="mt-2 flex items-center gap-4 text-[12px] text-gray-500"><span><span class="dot mr-1.5" style="background:#FDE3D0"></span>Found</span><span><span class="dot c-ok mr-1.5"></span>Filled</span><span class="ml-auto text-gray-400">Sample data</span></div>
  </div>

  <!-- secondary stats -->
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-4"><div class="w-9 h-9 rounded-xl grad-bare text-white flex items-center justify-center"><i class="fa-solid fa-seedling text-[13px]"></i></div><div class="num text-[26px] font-bold leading-none mt-3">-3.1<span class="text-[12px] text-gray-400"> m²</span></div><div class="text-[12px] text-gray-500 mt-1">Bare turf</div></div>
    <div class="card p-4"><div class="w-9 h-9 rounded-xl grad-ball text-white flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-[13px]"></i></div><div class="num text-[26px] font-bold leading-none mt-3">412</div><div class="text-[12px] text-gray-500 mt-1">Balls back</div></div>
    <div class="card p-4"><div class="w-9 h-9 rounded-xl grad-litter text-white flex items-center justify-center"><i class="fa-solid fa-bottle-water text-[13px]"></i></div><div class="num text-[26px] font-bold leading-none mt-3">68</div><div class="text-[12px] text-gray-500 mt-1">Litter out</div></div>
  </div>

  <!-- worst bays -->
  <div class="mt-5 flex items-center justify-between"><div class="text-[18px] font-bold">Hardest-hit bays</div><div class="text-[13px] font-semibold t-brand">Rotate tees</div></div>
  <div class="mt-3 card p-5 space-y-4">
    <div class="flex items-center gap-3"><span class="num w-14 text-[14px] font-bold">Bay 7</span><div class="bar flex-1 !h-2.5"><span class="grad-divot" style="width:92%"></span></div><span class="num text-[13px] font-semibold text-gray-500 w-8 text-right">212</span></div>
    <div class="flex items-center gap-3"><span class="num w-14 text-[14px] font-bold">Bay 8</span><div class="bar flex-1 !h-2.5"><span class="grad-divot" style="width:74%"></span></div><span class="num text-[13px] font-semibold text-gray-500 w-8 text-right">171</span></div>
    <div class="flex items-center gap-3"><span class="num w-14 text-[14px] font-bold">Bay 3</span><div class="bar flex-1 !h-2.5"><span class="grad-divot" style="width:51%"></span></div><span class="num text-[13px] font-semibold text-gray-500 w-8 text-right">118</span></div>
  </div>

  <div class="mt-4 card p-4 flex items-center gap-3">
    <div class="w-11 h-11 rounded-2xl grad-ink text-white flex items-center justify-center"><i class="fa-solid fa-file-pdf"></i></div>
    <div class="flex-1"><div class="font-bold text-[15px]">Superintendent PDF</div><div class="text-[12px] text-gray-500">Map, counts, sand used</div></div>
    <i class="fa-solid fa-arrow-up-from-bracket text-gray-400"></i>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab"><i class="fa-solid fa-route"></i>Route</div><div class="tab active"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
