<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Fill stop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<!-- hero photo -->
<div class="absolute left-0 right-0 top-0 h-[430px] overflow-hidden">
  <img src="img/fill.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.55) 0%,rgba(8,16,12,0) 30%,rgba(8,16,12,0) 60%,rgba(8,16,12,.85) 100%)"></div>
</div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="relative z-10 px-7 mt-2 flex items-center justify-between text-white">
  <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[15px]"></i></div>
  <div class="chip glass"><span class="dot c-divot"></span>Stop B of 6</div>
  <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-ellipsis"></i></div>
</div>
<div class="absolute z-10 left-7 right-7 top-[318px] text-white">
  <div class="text-[13px] font-semibold text-white/65">Zone B · Bays 6–9</div>
  <div class="flex items-end justify-between">
    <div class="text-[30px] font-extrabold tracking-tight leading-tight">Fill divots</div>
    <div class="num text-[34px] font-bold leading-none">52<span class="text-[18px] text-white/50">/71</span></div>
  </div>
</div>

<div class="absolute left-0 right-0 top-[430px] bottom-0 px-7 pt-5 pb-10 flex flex-col">
  <div class="bar !h-2.5"><span class="grad-brand" style="width:73%"></span></div>

  <!-- next divot finder -->
  <div class="mt-5 card p-5 flex items-center gap-5">
    <div class="relative w-[96px] h-[96px] shrink-0 rounded-full bg-[#F3F4EE] flex items-center justify-center">
      <div class="absolute inset-2 rounded-full border-2 border-dashed border-gray-300"></div>
      <div class="absolute inset-[26px] rounded-full border-2 border-gray-200"></div>
      <i class="fa-solid fa-location-arrow text-[30px] t-brand" style="transform:rotate(-12deg)"></i>
      <span class="absolute w-3.5 h-3.5 rounded-full c-divot border-2 border-white" style="top:12px;left:44px"></span>
    </div>
    <div>
      <div class="label">Next divot</div>
      <div class="num text-[36px] font-bold leading-none mt-1">3<span class="text-[16px] text-gray-400 ml-1">m ahead</span></div>
      <div class="text-[13px] text-gray-500 mt-1.5">Large · about 1 scoop</div>
    </div>
  </div>

  <!-- before / after -->
  <div class="mt-4 grid grid-cols-2 gap-3">
    <div class="relative rounded-2xl overflow-hidden h-[112px]"><img src="img/turf.jpg" class="w-full h-full object-cover" style="object-position:30% 80%"><span class="absolute top-2 left-2 chip bg-black/60 text-white !text-[11px] !py-1">Before</span></div>
    <div class="relative rounded-2xl overflow-hidden h-[112px]"><img src="img/fill.jpg" class="w-full h-full object-cover" style="object-position:50% 70%"><span class="absolute top-2 left-2 chip bg-black/60 text-white !text-[11px] !py-1">After</span><span class="absolute bottom-2 right-2 w-7 h-7 rounded-full bg-[#22C55E] text-white flex items-center justify-center text-[12px]"><i class="fa-solid fa-check"></i></span></div>
  </div>

  <div class="mt-auto flex gap-3">
    <div class="btn bg-white card !shadow-none border border-gray-200 w-[96px] text-gray-500"><i class="fa-solid fa-forward"></i>Skip</div>
    <div class="btn grad-brand text-white flex-1"><i class="fa-solid fa-fill-drip"></i>Filled</div>
  </div>
</div>
<div class="home-ind"></div>
</div></body></html>
