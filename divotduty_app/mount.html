<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Mount check</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full bg-white card !shadow-none border border-gray-200 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[15px]"></i></div>
    <div class="text-[13px] font-semibold text-gray-400">Step <span class="num text-gray-900">2</span> of 3</div>
    <div class="w-10"></div>
  </div>
  <h1 class="mt-4 text-[30px] font-extrabold tracking-tight leading-tight">Aim the camera<br>at the turf</h1>

  <!-- camera preview -->
  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[360px] bg-black">
    <img src="img/turf.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 70%">
    <div class="absolute inset-0 bg-black/10"></div>
    <!-- capture window -->
    <div class="absolute left-[34px] right-[34px] top-[52px] bottom-[64px] rounded-2xl border-2 border-dashed border-white/80"></div>
    <div class="absolute left-[34px] top-[52px] w-6 h-6 border-t-4 border-l-4 border-[#4ADE80] rounded-tl-2xl"></div>
    <div class="absolute right-[34px] top-[52px] w-6 h-6 border-t-4 border-r-4 border-[#4ADE80] rounded-tr-2xl"></div>
    <div class="absolute left-[34px] bottom-[64px] w-6 h-6 border-b-4 border-l-4 border-[#4ADE80] rounded-bl-2xl"></div>
    <div class="absolute right-[34px] bottom-[64px] w-6 h-6 border-b-4 border-r-4 border-[#4ADE80] rounded-br-2xl"></div>
    <div class="absolute top-4 left-1/2 -translate-x-1/2 chip glass text-white"><span class="dot c-ok"></span>Ground in frame</div>
    <div class="absolute bottom-4 left-4 right-4 flex justify-between text-white">
      <div class="chip glass"><i class="fa-solid fa-ruler-horizontal text-white/60"></i><span class="num">1.6 m</span> swath</div>
      <div class="chip glass"><i class="fa-solid fa-sun text-amber-300"></i>Light OK</div>
    </div>
  </div>

  <!-- tilt gauge -->
  <div class="mt-4 card p-5 flex items-center gap-5">
    <div class="relative w-[92px] h-[92px] shrink-0">
      <svg viewBox="0 0 100 100" class="w-full h-full">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#E6E9E0" stroke-width="8"/>
        <path d="M50 6 A44 44 0 0 1 88 28" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>
        <line x1="50" y1="50" x2="78" y2="20" stroke="#13201A" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="6" fill="#13201A"/>
      </svg>
    </div>
    <div class="flex-1">
      <div class="label">Tilt to ground</div>
      <div class="flex items-end gap-1 mt-1"><span class="num text-[36px] font-bold leading-none">42°</span><span class="text-[13px] text-emerald-600 font-semibold mb-1 ml-2"><i class="fa-solid fa-check"></i> in range</span></div>
      <div class="text-[13px] text-gray-500 mt-1">Target 35° to 50°</div>
    </div>
  </div>

  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-4 text-center"><div class="w-10 h-10 mx-auto rounded-xl grad-brand text-white flex items-center justify-center"><i class="fa-solid fa-mobile-screen"></i></div><div class="text-[12px] font-semibold mt-2">Clamp</div><span class="dot c-ok mt-1"></span></div>
    <div class="card p-4 text-center"><div class="w-10 h-10 mx-auto rounded-xl grad-brand text-white flex items-center justify-center"><i class="fa-solid fa-location-crosshairs"></i></div><div class="text-[12px] font-semibold mt-2">GPS <span class="num text-gray-400">±2 m</span></div><span class="dot c-ok mt-1"></span></div>
    <div class="card p-4 text-center"><div class="w-10 h-10 mx-auto rounded-xl grad-bare text-white flex items-center justify-center"><i class="fa-solid fa-battery-half"></i></div><div class="text-[12px] font-semibold mt-2">Battery <span class="num text-gray-400">58%</span></div><span class="dot c-bare mt-1"></span></div>
  </div>

  <div class="mt-6 btn grad-brand text-white">Looks good, next <i class="fa-solid fa-arrow-right"></i></div>
</div>
<div class="home-ind"></div>
</div></body></html>
