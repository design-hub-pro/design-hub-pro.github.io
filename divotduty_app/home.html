<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Tue, Nov 17 · <i class="fa-solid fa-sun text-amber-400"></i> 58°F</div><h1 class="text-[28px] font-extrabold tracking-tight">Westbrook Range</h1></div>
    <img src="img/coach.jpg" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow">
  </div>

  <!-- range health hero -->
  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[300px]">
    <img src="img/aerial.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 60%">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.1) 20%,rgba(8,16,12,.92))"></div>
    <!-- mini pins -->
    <span class="pin c-divot" style="left:30%;top:58%"></span><span class="pin c-divot" style="left:36%;top:52%"></span><span class="pin c-divot" style="left:62%;top:48%"></span>
    <span class="pin c-bare" style="left:48%;top:38%"></span><span class="pin c-ball" style="left:70%;top:30%"></span><span class="pin c-litter" style="left:22%;top:34%"></span><span class="pin c-divot" style="left:55%;top:60%"></span>
    <div class="absolute top-4 left-4 chip glass text-white"><span class="dot c-bare"></span>Last sweep 2 days ago</div>
    <div class="absolute bottom-5 left-5 right-5 text-white flex items-end justify-between">
      <div>
        <div class="text-[13px] text-white/60 font-semibold">Turf score</div>
        <div class="flex items-end gap-2"><span class="num text-[54px] font-bold leading-none">74</span><span class="text-[14px] text-rose-300 font-semibold mb-2"><i class="fa-solid fa-arrow-down"></i> 6</span></div>
      </div>
      <div class="flex flex-col items-center gap-1">
        <div class="relative w-16 h-16"><span class="absolute inset-0 rounded-full bg-[#22C55E] ping"></span><div class="relative w-16 h-16 rounded-full grad-brand flex items-center justify-center text-[22px] shadow-xl"><i class="fa-solid fa-video"></i></div></div>
        <span class="text-[12px] font-semibold text-white/80">Start sweep</span>
      </div>
    </div>
  </div>

  <!-- open tasks -->
  <div class="mt-6 flex items-center justify-between"><div class="text-[18px] font-bold">Open tasks</div><div class="num text-[14px] font-semibold text-gray-400">231 total</div></div>
  <div class="mt-3 grid grid-cols-2 gap-3">
    <div class="card p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grad-divot text-white flex items-center justify-center"><i class="fa-solid fa-shoe-prints"></i></div><div><div class="num text-[28px] font-bold leading-none">164</div><div class="text-[12px] text-gray-500 mt-1">Divots</div></div></div>
    <div class="card p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grad-bare text-white flex items-center justify-center"><i class="fa-solid fa-seedling"></i></div><div><div class="num text-[28px] font-bold leading-none">11</div><div class="text-[12px] text-gray-500 mt-1">Bare · <span class="num">7.4 m²</span></div></div></div>
    <div class="card p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grad-ball text-white flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee"></i></div><div><div class="num text-[28px] font-bold leading-none">47</div><div class="text-[12px] text-gray-500 mt-1">Stray balls</div></div></div>
    <div class="card p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grad-litter text-white flex items-center justify-center"><i class="fa-solid fa-bottle-water"></i></div><div><div class="num text-[28px] font-bold leading-none">9</div><div class="text-[12px] text-gray-500 mt-1">Litter</div></div></div>
  </div>

  <!-- today's crew -->
  <div class="mt-4 card p-5">
    <div class="flex items-center justify-between">
      <div><div class="label">Today's crew · 3:30 PM</div><div class="text-[17px] font-bold mt-1">Varsity repair shift</div></div>
      <div class="flex -space-x-2"><img src="img/av1.jpg" class="w-9 h-9 rounded-full border-2 border-white object-cover"><img src="img/av2.jpg" class="w-9 h-9 rounded-full border-2 border-white object-cover"><img src="img/golfer.jpg" class="w-9 h-9 rounded-full border-2 border-white object-cover"><div class="w-9 h-9 rounded-full border-2 border-white bg-gray-100 text-[12px] font-bold flex items-center justify-center num">+2</div></div>
    </div>
    <div class="mt-4 flex items-center gap-3"><div class="bar flex-1"><span class="grad-brand" style="width:0%"></span></div><span class="num text-[13px] font-semibold text-gray-400">Route ready · 38 min</span></div>
  </div>
</div>
<div class="tab-bar"><div class="tab active"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab"><i class="fa-solid fa-route"></i>Route</div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
