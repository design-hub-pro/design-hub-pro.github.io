<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Repair route</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <h1 class="text-[28px] font-extrabold tracking-tight">Repair route</h1>
    <div class="chip bg-white card !shadow-none border border-gray-200"><i class="fa-solid fa-wand-magic-sparkles t-brand"></i>Auto-split</div>
  </div>

  <!-- route map -->
  <div class="mt-4 rounded-[28px] overflow-hidden relative h-[318px]">
    <img src="img/aerial.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 85%">
    <div class="absolute inset-0 bg-[#08100C]/25"></div>
    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 380 318" fill="none">
      <!-- crew 1 green -->
      <path d="M40 290 C70 270 80 250 96 236 S150 220 170 240" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
      <path d="M40 290 C70 270 80 250 96 236 S150 220 170 240" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" opacity=".35"/>
      <!-- crew 2 sky -->
      <path d="M170 240 C200 256 250 262 300 236 S330 200 320 180" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <!-- crew 3 white (balls/litter loop) -->
      <path d="M320 180 C290 140 230 110 180 120 S90 120 70 80" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
    </svg>
    <!-- stops -->
    <div class="cluster grad-divot" style="left:96px;top:236px;width:36px;height:36px">A</div>
    <div class="cluster grad-divot" style="left:170px;top:240px;width:36px;height:36px">B</div>
    <div class="cluster grad-divot" style="left:300px;top:236px;width:36px;height:36px">C</div>
    <div class="cluster grad-bare" style="left:320px;top:180px;width:36px;height:36px">D</div>
    <div class="cluster grad-ball" style="left:180px;top:120px;width:36px;height:36px">E</div>
    <div class="cluster grad-litter" style="left:70px;top:80px;width:36px;height:36px">F</div>
    <div class="absolute" style="left:40px;top:290px;transform:translate(-50%,-50%)"><div class="w-6 h-6 rounded-full bg-white flex items-center justify-center shadow"><i class="fa-solid fa-warehouse text-[10px] t-brand"></i></div></div>
    <div class="absolute top-4 left-4 chip glass text-white"><span class="dot c-ok"></span>6 stops · 3 crews</div>
  </div>

  <!-- stats -->
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-4"><div class="label">Time</div><div class="num text-[30px] font-bold leading-none mt-2">38<span class="text-[14px] text-gray-400 ml-0.5">min</span></div></div>
    <div class="card p-4"><div class="label">Walk</div><div class="num text-[30px] font-bold leading-none mt-2">1.4<span class="text-[14px] text-gray-400 ml-0.5">km</span></div></div>
    <div class="card p-4"><div class="label">Sand mix</div><div class="num text-[30px] font-bold leading-none mt-2">5<span class="text-[14px] text-gray-400 ml-0.5">btl</span></div></div>
  </div>

  <!-- crew split -->
  <div class="mt-5 text-[18px] font-bold">Who goes where</div>
  <div class="mt-3 space-y-3">
    <div class="card p-4 flex items-center gap-3">
      <div class="relative"><img src="img/av1.jpg" class="w-12 h-12 rounded-full object-cover"><span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#4ADE80] border-2 border-white"></span></div>
      <div class="flex-1"><div class="font-bold">Jordan</div><div class="flex gap-1.5 mt-1"><span class="chip !py-0.5 !px-2 bg-orange-50 t-divot">A</span><span class="chip !py-0.5 !px-2 bg-orange-50 t-divot">B</span><span class="text-[12px] text-gray-400 self-center ml-1"><span class="num">119</span> divots</span></div></div>
      <div class="num text-[15px] font-bold">14<span class="text-[11px] text-gray-400"> min</span></div>
    </div>
    <div class="card p-4 flex items-center gap-3">
      <div class="relative"><img src="img/av2.jpg" class="w-12 h-12 rounded-full object-cover"><span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#7DD3FC] border-2 border-white"></span></div>
      <div class="flex-1"><div class="font-bold">Priya</div><div class="flex gap-1.5 mt-1"><span class="chip !py-0.5 !px-2 bg-orange-50 t-divot">C</span><span class="chip !py-0.5 !px-2 bg-yellow-50 t-bare">D</span><span class="text-[12px] text-gray-400 self-center ml-1"><span class="num">45</span> + <span class="num">11</span> bare</span></div></div>
      <div class="num text-[15px] font-bold">12<span class="text-[11px] text-gray-400"> min</span></div>
    </div>
    <div class="card p-4 flex items-center gap-3">
      <div class="relative"><img src="img/golfer.jpg" class="w-12 h-12 rounded-full object-cover"><span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-gray-300 border-2 border-white"></span></div>
      <div class="flex-1"><div class="font-bold">Sam</div><div class="flex gap-1.5 mt-1"><span class="chip !py-0.5 !px-2 bg-blue-50 t-ball">E</span><span class="chip !py-0.5 !px-2 bg-rose-50 t-litter">F</span><span class="text-[12px] text-gray-400 self-center ml-1"><span class="num">47</span> balls · <span class="num">9</span> litter</span></div></div>
      <div class="num text-[15px] font-bold">12<span class="text-[11px] text-gray-400"> min</span></div>
    </div>
  </div>
  <div class="mt-5 btn grad-brand text-white"><i class="fa-solid fa-paper-plane"></i>Send to crew</div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab active"><i class="fa-solid fa-route"></i>Route</div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
