<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivotDuty · Check detections</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Sweep finished · 14:08</div><h1 class="text-[28px] font-extrabold tracking-tight">Check 12 unsure</h1></div>
    <div class="relative w-[58px] h-[58px]">
      <svg viewBox="0 0 36 36" class="w-full h-full -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#E6E9E0" stroke-width="4"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#22C55E" stroke-width="4" stroke-dasharray="58 100" stroke-linecap="round"/></svg>
      <div class="absolute inset-0 flex items-center justify-center num text-[15px] font-bold">7/12</div>
    </div>
  </div>

  <!-- big card being reviewed -->
  <div class="mt-4 rounded-[28px] overflow-hidden relative h-[330px] card">
    <img src="img/litter.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,0) 55%,rgba(8,16,12,.85))"></div>
    <div class="det b-litter" style="left:15%;top:35%;width:56%;height:31%"><b class="c-litter">Litter? 0.58</b></div>
    <div class="absolute top-4 right-4 chip glass text-white"><i class="fa-solid fa-location-dot"></i>Bay 11 · 62 m</div>
    <div class="absolute bottom-4 left-5 right-5 flex items-center justify-between text-white">
      <div><div class="text-[13px] text-white/60 font-semibold">Model guess</div><div class="text-[22px] font-bold">Plastic bottle</div></div>
      <div class="flex -space-x-1"><span class="w-7 h-7 rounded-full grad-litter border-2 border-black/30"></span><span class="w-7 h-7 rounded-full grad-ball border-2 border-black/30 opacity-50"></span></div>
    </div>
  </div>

  <!-- relabel -->
  <div class="mt-4 grid grid-cols-4 gap-2">
    <div class="card py-3 text-center opacity-60"><div class="w-9 h-9 mx-auto rounded-xl grad-divot text-white flex items-center justify-center"><i class="fa-solid fa-shoe-prints text-[13px]"></i></div><div class="text-[11px] font-semibold mt-1.5">Divot</div></div>
    <div class="card py-3 text-center opacity-60"><div class="w-9 h-9 mx-auto rounded-xl grad-bare text-white flex items-center justify-center"><i class="fa-solid fa-seedling text-[13px]"></i></div><div class="text-[11px] font-semibold mt-1.5">Bare</div></div>
    <div class="card py-3 text-center opacity-60"><div class="w-9 h-9 mx-auto rounded-xl grad-ball text-white flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-[13px]"></i></div><div class="text-[11px] font-semibold mt-1.5">Ball</div></div>
    <div class="card py-3 text-center ring-2 ring-[#E11D48]"><div class="w-9 h-9 mx-auto rounded-xl grad-litter text-white flex items-center justify-center"><i class="fa-solid fa-bottle-water text-[13px]"></i></div><div class="text-[11px] font-semibold mt-1.5">Litter</div></div>
  </div>

  <div class="mt-4 flex gap-3">
    <div class="btn flex-1 bg-white card !shadow-none border border-gray-200 text-rose-600"><i class="fa-solid fa-xmark"></i>Not a task</div>
    <div class="btn flex-1 grad-brand text-white"><i class="fa-solid fa-check"></i>Confirm</div>
  </div>

  <!-- queue -->
  <div class="mt-5 flex items-center justify-between"><div class="text-[16px] font-bold">Up next</div><div class="text-[13px] text-gray-400">Lowest confidence first</div></div>
  <div class="mt-3 hscroll pb-2">
    <div class="w-[104px] shrink-0 relative rounded-2xl overflow-hidden h-[104px]"><img src="img/bare.jpg" class="w-full h-full object-cover"><span class="absolute bottom-2 left-2 chip bg-black/60 text-white !text-[11px] !py-0.5 !px-2"><span class="dot c-bare"></span><span class="num">0.61</span></span></div>
    <div class="w-[104px] shrink-0 relative rounded-2xl overflow-hidden h-[104px]"><img src="img/balls.jpg" class="w-full h-full object-cover"><span class="absolute bottom-2 left-2 chip bg-black/60 text-white !text-[11px] !py-0.5 !px-2"><span class="dot c-ball"></span><span class="num">0.64</span></span></div>
    <div class="w-[104px] shrink-0 relative rounded-2xl overflow-hidden h-[104px]"><img src="img/turf.jpg" class="w-full h-full object-cover" style="object-position:90% 40%"><span class="absolute bottom-2 left-2 chip bg-black/60 text-white !text-[11px] !py-0.5 !px-2"><span class="dot c-divot"></span><span class="num">0.66</span></span></div>
    <div class="w-[104px] shrink-0 relative rounded-2xl overflow-hidden h-[104px]"><img src="img/litter.jpg" class="w-full h-full object-cover" style="object-position:80% 60%"><span class="absolute bottom-2 left-2 chip bg-black/60 text-white !text-[11px] !py-0.5 !px-2"><span class="dot c-litter"></span><span class="num">0.69</span></span></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab active"><i class="fa-solid fa-map"></i>Map</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-video"></i></div></div><div class="tab"><i class="fa-solid fa-route"></i>Route</div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Report</div></div><div class="home-ind"></div>
</div></body></html>
