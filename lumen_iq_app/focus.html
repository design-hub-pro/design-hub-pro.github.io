<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen · Focus Session</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{ -webkit-font-smoothing:antialiased; box-sizing:border-box; scrollbar-width:none; }
*::-webkit-scrollbar{ display:none; }
html,body{ width:100%; height:100%; margin:0; font-family:'Inter',sans-serif; background:#06061A; color:#fff; }
.screen{ position:relative; width:100%; height:100%; overflow:hidden;
  background:
    radial-gradient(80% 60% at 50% 35%, rgba(99,102,241,0.4) 0%, rgba(99,102,241,0) 60%),
    radial-gradient(80% 60% at 50% 90%, rgba(6,214,224,0.25) 0%, rgba(6,214,224,0) 60%),
    linear-gradient(180deg, #050513 0%, #0A0420 100%); }
.status-bar{ height:59px; padding:20px 28px 0; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:600; z-index:10; position:relative; }
.island{ position:absolute; left:50%; top:14px; transform:translateX(-50%); width:200px; height:36px; background:#000; border-radius:24px; z-index:31; display:flex; align-items:center; justify-content:space-between; padding:0 12px; }
.font-display{ font-family:'Space Grotesk', sans-serif; letter-spacing:-0.03em; }
.mono{ font-family:'JetBrains Mono', monospace; }
.glass{ background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(20px); border-radius:24px; }
.section-padding{ padding-left:28px; padding-right:28px; }
.brand-gradient{ background:linear-gradient(135deg, #67E8F9 0%, #C4B5FD 50%, #F0ABFC 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.home-indicator{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:140px; height:5px; background:#fff; border-radius:3px; opacity:0.95; }

/* Massive timer ring */
.timer-wrap{ position:relative; width:340px; height:340px; margin:0 auto; }
.timer-orb{
  position:absolute; inset:40px; border-radius:50%;
  background:
    radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18) 0%, rgba(99,102,241,0.05) 40%, rgba(15,7,38,0.95) 80%),
    radial-gradient(circle at 65% 65%, rgba(236,72,153,0.25) 0%, rgba(15,7,38,0) 50%);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 -40px 80px rgba(99,102,241,0.3), inset 0 30px 60px rgba(236,72,153,0.15);
}
.brain-pulse{ position:absolute; inset:0; border-radius:50%; border:1px dashed rgba(196,181,253,0.18); }
.brain-pulse.p2{ inset:-20px; border-color:rgba(103,232,249,0.12); }

.bio-pill{ display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:99px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); font-size:11px; font-weight:600;}
.bio-pill .dot{ width:6px; height:6px; border-radius:50%; }

.control-btn{ width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); }
.control-btn.primary{ width:80px; height:80px; background:linear-gradient(135deg,#8B5CF6,#EC4899,#06D6E0); border:none; box-shadow:0 18px 40px rgba(139,92,246,0.55); }
</style>
</head>
<body>
<div class="screen">
  <div class="island">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-pink-400 animate-pulse"></span>
      <span class="text-white text-[10px] font-bold tracking-wider">FOCUS · 23:47</span>
    </div>
    <span class="text-[10px] text-cyan-300 font-bold">DEEP</span>
  </div>
  <div class="status-bar" style="padding-top:20px;">
    <span class="opacity-0">9:41</span>
    <div class="flex items-center gap-1.5 opacity-0">
      <i class="fa-solid fa-signal text-xs"></i>
    </div>
  </div>

  <!-- header -->
  <div class="section-padding flex items-center justify-between">
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-down text-white text-sm"></i></div>
    <div class="text-center">
      <div class="text-[11px] tracking-widest font-bold uppercase text-cyan-200">Calc · Chapter 7</div>
      <div class="text-[13px] text-slate-300 mt-0.5">Session 3 of 4 today</div>
    </div>
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-music text-purple-300 text-sm"></i></div>
  </div>

  <!-- Big timer -->
  <div class="mt-7 flex justify-center">
    <div class="timer-wrap">
      <div class="brain-pulse p2"></div>
      <div class="brain-pulse"></div>
      <svg viewBox="0 0 340 340" class="absolute inset-0 -rotate-90">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#06D6E0"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
          </linearGradient>
        </defs>
        <circle cx="170" cy="170" r="148" stroke="rgba(255,255,255,0.05)" stroke-width="10" fill="none"/>
        <circle cx="170" cy="170" r="148" stroke="url(#ringGrad)" stroke-width="10" fill="none"
                stroke-linecap="round" stroke-dasharray="930" stroke-dashoffset="280"/>
        <circle cx="170" cy="22" r="9" fill="#fff" stroke="#EC4899" stroke-width="2"/>
      </svg>
      <div class="timer-orb"></div>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="text-[11px] tracking-[0.18em] font-bold text-cyan-200 mb-3">DEEP FOCUS</div>
        <div class="mono font-bold text-[68px] leading-none" style="letter-spacing:-0.04em;">23<span class="text-purple-300">:</span>47</div>
        <div class="text-[12px] text-slate-300 mt-3">of 45:00 · 53% complete</div>
        <div class="mt-4 flex items-center gap-1.5">
          <div class="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider mono" style="background:rgba(74,222,128,0.15); color:#86EFAC; border:1px solid rgba(74,222,128,0.3);">FLOW · 87%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live bio pills -->
  <div class="section-padding mt-5 flex justify-center gap-2 flex-wrap">
    <div class="bio-pill"><span class="dot bg-pink-400"></span><span class="text-pink-200">HR 68 bpm</span></div>
    <div class="bio-pill"><span class="dot bg-cyan-400"></span><span class="text-cyan-200">Phone face-down · 23m</span></div>
    <div class="bio-pill"><span class="dot bg-emerald-400"></span><span class="text-emerald-200">0 interruptions</span></div>
  </div>

  <!-- Today's focus chart -->
  <div class="section-padding mt-6">
    <div class="glass p-4">
      <div class="flex items-center justify-between mb-3">
        <div>
          <div class="text-[11px] tracking-widest font-bold uppercase text-purple-200">Focus minutes · Today</div>
          <div class="font-display font-bold text-[20px] mt-1">134 <span class="text-slate-400 text-[14px] font-medium">/ 150 goal</span></div>
        </div>
        <div class="flex items-center gap-1 px-2 py-1 rounded-full bg-emerald-400/15 border border-emerald-400/30">
          <i class="fa-solid fa-fire text-emerald-300 text-[10px]"></i>
          <span class="text-emerald-200 text-[10px] font-bold tracking-wider">14-day streak</span>
        </div>
      </div>
      <div class="flex items-end gap-1.5 h-16">
        <div class="flex-1 rounded-md" style="height:35%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md" style="height:60%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md" style="height:45%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md" style="height:75%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md" style="height:85%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md" style="height:55%; background:linear-gradient(180deg,#06D6E0,#6366F1);"></div>
        <div class="flex-1 rounded-md ring-2 ring-pink-400" style="height:95%; background:linear-gradient(180deg,#F472B6,#8B5CF6);"></div>
      </div>
      <div class="flex justify-between text-[10px] text-slate-500 font-semibold mt-2">
        <span>Sa</span><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span class="text-pink-300">Fr</span>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="absolute left-0 right-0 bottom-12 flex justify-center items-center gap-6">
    <button class="control-btn">
      <i class="fa-solid fa-pause text-white"></i>
    </button>
    <button class="control-btn primary">
      <i class="fa-solid fa-flag-checkered text-white text-xl"></i>
    </button>
    <button class="control-btn">
      <i class="fa-solid fa-forward text-white"></i>
    </button>
  </div>
  <div class="absolute left-0 right-0 bottom-6 text-center text-[11px] text-slate-400 font-semibold">Tap circle to log a thought</div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
