<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Guided Editing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-card)}
  .num{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--dim);flex:none;margin-top:1px}
  .cut-row{display:grid;grid-template-columns:62px 56px 1fr 120px 70px;align-items:center;gap:10px;height:40px;padding:0 10px}
</style>
</head>
<body data-title="Guided Editing" data-nav="projects" data-status="Plan synced with CapCut timeline">

<template id="main">
  <div class="row" style="height:48px;flex:none;padding:0 20px;border-bottom:1px solid var(--line);gap:12px">
    <div>
      <div style="font-weight:600;font-size:14px;white-space:nowrap">60-second basketball highlight</div>
    </div>
    <span class="tag ai" style="white-space:nowrap"><i class="fa-solid fa-wand-magic-sparkles"></i>Plan by Copilot, edited by you</span>
    <div class="row" style="margin-left:auto;gap:10px">
      <span class="dim" style="font-size:12px;white-space:nowrap">3 of 6 done</span>
      <div class="progress" style="width:100px"><i style="width:50%"></i></div>
      <span class="btn sm"><i class="fa-solid fa-eye-slash"></i>Focus mode</span>
      <span class="btn sm"><i class="fa-regular fa-window-restore"></i>Floating</span>
    </div>
  </div>

  <div style="flex:1;display:flex;min-height:0">
    <!-- checklist -->
    <div style="width:300px;flex:none;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px">
      <div class="step"><span class="done-check"><i class="fa-solid fa-check"></i></span><div><div>Import video footage</div><div class="dim" style="font-size:11.5px">214 clips · 38.6 GB</div></div><span class="dim" style="margin-left:auto;font-size:11px">Nov 9</span></div>
      <div class="step"><span class="done-check"><i class="fa-solid fa-check"></i></span><div><div>Organize clips into scenes</div><div class="dim" style="font-size:11.5px">6 stacks, 3 renamed by you</div></div><span class="dim" style="margin-left:auto;font-size:11px">Nov 10</span></div>
      <div class="step"><span class="done-check"><i class="fa-solid fa-check"></i></span><div><div>Select background music</div><div class="dim" style="font-size:11.5px">Run It Back.mp3 · 122 BPM</div></div><span class="dim" style="margin-left:auto;font-size:11px">Today</span></div>
      <div class="step" style="background:var(--ai-bg);border:1px solid var(--ai-line)"><span class="num" style="border-color:var(--ai2);color:#fff;background:var(--ai)">4</span><div><div style="font-weight:600">Sync video with music</div><div style="font-size:11.5px;color:var(--ai2)">In progress · 5 of 14 cuts placed</div></div></div>
      <div class="step"><span class="num">5</span><div><div class="sub">Add captions</div><div class="dim" style="font-size:11.5px">Interview only, about 40 words</div></div></div>
      <div class="step"><span class="num">6</span><div><div class="sub">Export final video</div><div class="dim" style="font-size:11.5px">1080×1920 for Reels, 1:00</div></div></div>

      <div style="margin-top:auto" class="card">
        <div style="padding:10px 12px">
          <div class="h3">TARGET</div>
          <div class="row" style="margin-top:6px;gap:8px"><span class="mono" style="font-size:18px;font-weight:600;color:var(--text)">0:41</span><span class="dim">of 1:00 on the timeline</span></div>
          <div style="position:relative;height:8px;border-radius:4px;background:var(--raised);margin-top:8px;overflow:hidden">
            <i style="position:absolute;left:0;width:68%;top:0;bottom:0;background:var(--ok)"></i>
          </div>
          <div class="dim" style="font-size:11px;margin-top:6px">Placed in CapCut, read from your last screenshot</div>
        </div>
      </div>
    </div>

    <!-- current step detail -->
    <div style="flex:1;min-width:0;padding:16px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
      <div>
        <div class="dim" style="font-size:11.5px">STEP 4 OF 6</div>
        <div class="h1" style="margin-top:2px">Sync video with music</div>
        <div class="sub" style="margin-top:4px;max-width:640px">Change clips on the beat so the edit feels fast. Put a new clip on each strong beat, and hold your best plays through a whole bar (4 beats, about 2 seconds).</div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div class="card row" style="padding:9px 11px;gap:9px"><i class="fa-solid fa-wave-square" style="color:var(--beat)"></i><div><div style="font-weight:500">Beat Studio</div><div class="dim" style="font-size:11px">See all 31 cut points</div></div></div>
        <div class="card row" style="padding:9px 11px;gap:9px"><i class="fa-solid fa-camera" style="color:var(--ai2)"></i><div><div style="font-weight:500">Check my timeline</div><div class="dim" style="font-size:11px">Screenshot CapCut <span class="kbd">⌘⇧2</span></div></div></div>
        <div class="card row" style="padding:9px 11px;gap:9px"><i class="fa-solid fa-graduation-cap" style="color:var(--ok)"></i><div><div style="font-weight:500">Lesson · 4 min</div><div class="dim" style="font-size:11px">Cutting on the beat</div></div></div>
      </div>

      <!-- AI-suggested cuts -->
      <div class="suggest" style="padding:0;overflow:hidden">
        <div class="row" style="padding:10px 12px;gap:8px;border-bottom:1px dashed var(--ai-line)">
          <span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span>
          <b style="font-weight:600;white-space:nowrap">Beat-matched cut list</b>
          <span class="dim" style="font-size:11.5px;white-space:nowrap">You place each cut in CapCut. Then it turns green.</span>
          <span class="btn sm" style="margin-left:auto"><i class="fa-regular fa-copy"></i>Copy all</span>
        </div>
        <div class="cut-row dim" style="height:28px;font-size:11px"><span>BEAT</span><span>TIME</span><span>CLIP</span><span>STACK</span><span>STATUS</span></div>
        <div class="cut-row hair"><span class="mono" style="color:var(--beat)">Bar 1</span><span class="mono">0:00.0</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png">crowd_cheer_04.mov</span><span class="dim">Crowd &amp; Bench</span><span class="tag ok"><i class="fa-solid fa-check"></i>Placed</span></div>
        <div class="cut-row hair"><span class="mono" style="color:var(--beat)">Bar 3</span><span class="mono">0:03.9</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png">timeout_whiteboard.mov</span><span class="dim">B-Roll</span><span class="tag ok"><i class="fa-solid fa-check"></i>Placed</span></div>
        <div class="cut-row hair"><span class="mono" style="color:var(--beat)">Drop 1</span><span class="mono">0:07.9</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">Q4_three_0211.mov</span><span class="dim">Scoring</span><span class="tag ok"><i class="fa-solid fa-check"></i>Placed</span></div>
        <div class="cut-row hair" style="background:rgba(139,124,246,.08)"><span class="mono" style="color:var(--beat)">Bar 7</span><span class="mono">0:11.8</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">block_rim_0318.mov</span><span class="dim">Defense</span><span class="tag ai">Next</span></div>
        <div class="cut-row hair"><span class="mono" style="color:var(--beat-weak)">Bar 8</span><span class="mono">0:13.8</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png">bench_reaction_02.mov</span><span class="dim">Crowd &amp; Bench</span><span class="tag">Waiting</span></div>
        <div class="cut-row hair"><span class="mono" style="color:var(--beat)">Drop 2</span><span class="mono">0:15.7</span><span class="row" style="gap:8px"><img class="thumb" style="width:44px;height:26px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">fastbreak_layup.mov</span><span class="dim">Scoring</span><span class="tag">Waiting</span></div>
        <div class="row hair" style="padding:8px 12px;gap:6px;font-size:11.5px"><span class="dim">+ 8 more through 0:58.0</span><span class="btn sm ghost" style="margin-left:auto">Swap a clip</span><span class="btn sm ghost">Regenerate</span></div>
      </div>

      <div class="row card" style="padding:10px 12px;gap:10px">
        <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
        <div style="flex:1"><b style="font-weight:600">Next cut:</b> drag <span class="mono">block_rim_0318.mov</span> to <span class="mono">0:11.8</span> in CapCut. I'll check it when you take a screenshot.</div>
        <span class="btn sm"><i class="fa-solid fa-camera"></i>I placed it</span>
        <span class="btn sm primary">Next step<i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
