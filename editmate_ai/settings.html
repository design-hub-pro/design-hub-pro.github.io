<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .ghost-app{position:absolute;left:80px;top:62px;width:1280px;height:800px;border-radius:var(--r-win);background:#18181c;opacity:.55;box-shadow:var(--shadow-win);overflow:hidden;filter:blur(1.5px)}
  .prefs{position:absolute;left:290px;top:140px;width:860px;height:600px;border-radius:var(--r-win);background:#1d1d22;box-shadow:var(--shadow-win);display:flex;flex-direction:column;overflow:hidden}
  .ptabs{display:flex;justify-content:center;gap:2px;padding:4px 0 8px;border-bottom:1px solid var(--line);background:#222228}
  .ptab{width:84px;height:50px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11.5px}
  .ptab i{font-size:17px}
  .ptab.on{background:var(--hover);color:var(--text)}
  .ptab.on i{color:var(--ai2)}
  .grp{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line)}
  .gr{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px}
  .gr+.gr{border-top:1px solid var(--line)}
  .lab{width:180px;text-align:right;color:var(--muted);flex:none}
  .ed-ic{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex:none}
  .pop{height:24px;padding:0 8px 0 10px;border-radius:5px;background:var(--raised);border:1px solid var(--line2);display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
</style>
</head>
<body data-shell="none" data-tray="on">

<template id="overlay">
  <!-- dimmed hint of the main window behind -->
  <div class="ghost-app">
    <div style="height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px"><span style="width:12px;height:12px;border-radius:50%;background:#555"></span><span style="width:12px;height:12px;border-radius:50%;background:#555"></span><span style="width:12px;height:12px;border-radius:50%;background:#555"></span><span style="margin-left:60px;width:180px;height:10px;border-radius:5px;background:#2c2c33"></span></div>
    <div style="display:flex;height:100%">
      <div style="width:212px;border-right:1px solid var(--line);padding:14px"><div style="height:10px;width:120px;background:#2c2c33;border-radius:5px;margin-bottom:14px"></div><div style="height:10px;width:100px;background:#2c2c33;border-radius:5px;margin-bottom:14px"></div><div style="height:10px;width:130px;background:#2c2c33;border-radius:5px;margin-bottom:14px"></div><div style="height:10px;width:90px;background:#2c2c33;border-radius:5px"></div></div>
      <div style="flex:1;padding:24px"><div style="height:16px;width:260px;background:#2c2c33;border-radius:5px"></div><div style="height:90px;margin-top:18px;background:#22222a;border-radius:8px"></div><div style="display:flex;gap:12px;margin-top:18px"><div style="flex:1.5;height:180px;background:#22222a;border-radius:8px"></div><div style="flex:1;height:180px;background:#22222a;border-radius:8px"></div><div style="flex:1;height:180px;background:#22222a;border-radius:8px"></div></div></div>
    </div>
  </div>

  <div class="prefs">
    <div style="height:30px;display:flex;align-items:center;padding:0 12px;background:#222228;position:relative">
      <div class="lights"><i></i><i></i><i></i></div>
      <div style="position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:13px;pointer-events:none">Editors</div>
    </div>
    <div class="ptabs">
      <div class="ptab"><i class="fa-solid fa-gear"></i>General</div>
      <div class="ptab on"><i class="fa-solid fa-film"></i>Editors</div>
      <div class="ptab"><i class="fa-solid fa-wand-magic-sparkles"></i>Copilot</div>
      <div class="ptab"><i class="fa-solid fa-universal-access"></i>Accessibility</div>
      <div class="ptab"><i class="fa-solid fa-circle-half-stroke"></i>Appearance</div>
      <div class="ptab"><i class="fa-solid fa-hand"></i>Privacy</div>
      <div class="ptab"><i class="fa-regular fa-keyboard"></i>Shortcuts</div>
    </div>

    <div style="flex:1;padding:16px 26px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
      <div>
        <div class="h3" style="margin-bottom:6px">EDITING APPS ON THIS MAC</div>
        <div class="grp">
          <div class="gr" style="min-height:48px">
            <span class="ed-ic" style="background:#111;border:1px solid #333">CC</span>
            <div style="flex:1"><div style="font-weight:600">CapCut <span class="dim" style="font-weight:400">5.2.1</span></div><div class="dim" style="font-size:11.5px">/Applications/CapCut.app · screen guidance tuned for this version</div></div>
            <span class="tag ok"><i class="fa-solid fa-check"></i>Connected</span>
            <span class="tag ai">Default</span>
          </div>
          <div class="gr" style="min-height:48px">
            <span class="ed-ic" style="background:#2a0f4a;color:#c9a8ff">Pr</span>
            <div style="flex:1"><div style="font-weight:600">Adobe Premiere Pro <span class="dim" style="font-weight:400">2026 (26.1)</span></div><div class="dim" style="font-size:11.5px">Detected · guidance in beta</div></div>
            <span class="btn sm">Connect</span>
          </div>
          <div class="gr" style="min-height:48px">
            <span class="ed-ic" style="background:#2b2b30;color:#888"><i class="fa-solid fa-circle-half-stroke"></i></span>
            <div style="flex:1"><div style="font-weight:600;color:var(--muted)">DaVinci Resolve 20</div><div class="dim" style="font-size:11.5px">Not installed</div></div>
            <span class="btn sm ghost">Notify me when supported</span>
          </div>
        </div>
      </div>

      <div class="grp">
        <div class="gr"><span class="lab">Default editor</span><span class="pop">CapCut<i class="fa-solid fa-chevron-down" style="font-size:9px;color:var(--dim)"></i></span><span class="dim" style="font-size:11.5px">Used for new projects and tutorials</span></div>
        <div class="gr"><span class="lab">Screen recording</span><span class="tag ok"><i class="fa-solid fa-check"></i>Granted</span><span class="dim" style="font-size:11.5px">Captures only when you press the capture key</span><span class="btn sm" style="margin-left:auto">Open System Settings</span></div>
        <div class="gr"><span class="lab">Floating Copilot</span><span class="kbd" style="font-size:12px;padding:1px 6px">⌥ Space</span><span class="dim" style="font-size:11.5px">Show or hide next to your editor</span></div>
        <div class="gr"><span class="lab">Capture and ask</span><span class="kbd" style="font-size:12px;padding:1px 6px">⌘ ⇧ 2</span><span class="dim" style="font-size:11.5px">Screenshot the editor window and send it to Copilot</span></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="grp">
          <div class="gr"><span style="flex:1">Appearance</span><div class="seg"><span class="on">Dark</span><span>Light</span><span>Auto</span></div></div>
          <div class="gr"><span style="flex:1">Keep Floating Copilot above other windows</span><span class="sw-t on"></span></div>
        </div>
        <div class="grp">
          <div class="gr"><span style="flex:1">Read Copilot steps aloud</span><span class="sw-t on"></span></div>
          <div class="gr"><span style="flex:1">Larger text (140%)</span><span class="sw-t"></span></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
