<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Project Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px}
  .tabs span{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted);font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs span.on{color:var(--text);border-color:var(--ai)}
  .tabs .n{font-size:10.5px;color:var(--dim)}
  .step{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;border-top:1px solid var(--line)}
  .step .num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);flex:none}
  .step.cur{background:var(--ai-bg)}
  .step.cur .num{border-color:var(--ai);color:var(--ai2)}
  .mini{padding:10px 12px}
  .tl{display:flex;gap:9px;font-size:12px;position:relative;padding-bottom:9px}
  .tl::before{content:"";position:absolute;left:4px;top:12px;bottom:0;width:1px;background:var(--line2)}
  .tl:last-child::before{display:none}
  .tl i.b{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px;position:relative;z-index:1}
</style>
</head>
<body data-title="Project" data-nav="projects" data-status="Editing plan v2 saved · 12 min ago">

<template id="main">
  <!-- project header -->
  <div class="row" style="padding:16px 20px 14px;gap:14px">
    <img class="thumb" style="width:88px;height:56px;border-radius:7px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
    <div style="flex:1;min-width:0">
      <div class="row" style="gap:8px"><span class="h1">Basketball Highlights</span><span class="tag warn">In progress</span></div>
      <div class="dim" style="font-size:12px;margin-top:3px">Season-ending highlight reel for the Lincoln Lions banquet · 60-second cut for Instagram and the school screen</div>
      <div class="row" style="gap:14px;margin-top:6px;font-size:11.5px;color:var(--muted)">
        <span class="row" style="gap:5px"><span class="dot"></span>CapCut 5.2</span>
        <span><i class="fa-regular fa-calendar"></i>&nbsp; Created Nov 9</span>
        <span><i class="fa-regular fa-clock"></i>&nbsp; Target 1:00</span>
        <span><i class="fa-regular fa-folder-open"></i>&nbsp; ~/Movies/Basketball 2026</span>
      </div>
    </div>
    <div class="row" style="gap:8px">
      <span class="btn sm"><i class="fa-solid fa-share-nodes"></i>Share</span>
      <span class="btn sm primary"><i class="fa-regular fa-window-restore"></i>Continue in CapCut</span>
    </div>
  </div>
  <div class="tabs">
    <span class="on"><i class="fa-solid fa-chart-simple"></i>Overview</span>
    <span>Media <span class="n">214</span></span>
    <span>Music <span class="n">1</span></span>
    <span>Subtitles <span class="n">312</span></span>
    <span>Plans <span class="n">2</span></span>
    <span>Conversations <span class="n">7</span></span>
  </div>

  <div style="flex:1;padding:14px 20px 0;display:grid;grid-template-columns:1.45fr 1fr;gap:14px;overflow:hidden;min-height:0">
    <!-- LEFT: plan (most important) -->
    <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
      <div class="card" style="overflow:hidden">
        <div class="row" style="padding:12px 14px;gap:12px">
          <div style="flex:1">
            <div class="row" style="gap:8px"><span class="h2" style="font-size:15px">Editing plan v2</span><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Drafted by Copilot, edited by you</span></div>
            <div class="dim" style="font-size:11.5px;margin-top:2px">60-second structure built from 48 scoring clips and "Run It Back.mp3"</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:24px;font-weight:700;letter-spacing:-.02em">58%</div>
            <div class="dim" style="font-size:11px">3 of 6 steps · 0:41 cut</div>
          </div>
        </div>
        <div style="padding:0 14px 12px">
          <div class="progress" style="height:6px"><i style="width:58%"></i></div>
          <div class="row mono dim" style="justify-content:space-between;font-size:10px;margin-top:4px"><span>0:00</span><span>0:15</span><span>0:30</span><span>0:45</span><span>1:00</span></div>
        </div>
        <div class="step"><span class="done-check" style="width:22px;height:22px;font-size:10px"><i class="fa-solid fa-check"></i></span><div style="flex:1"><div>Import footage</div><div class="dim" style="font-size:11px">214 clips · Nov 9</div></div><span class="tag ok">Completed</span></div>
        <div class="step"><span class="done-check" style="width:22px;height:22px;font-size:10px"><i class="fa-solid fa-check"></i></span><div style="flex:1"><div>Organize clips into scenes</div><div class="dim" style="font-size:11px">6 stacks, 2 renamed by you</div></div><span class="tag ok">Completed</span></div>
        <div class="step"><span class="done-check" style="width:22px;height:22px;font-size:10px"><i class="fa-solid fa-check"></i></span><div style="flex:1"><div>Select background music</div><div class="dim" style="font-size:11px">Run It Back.mp3 · 122 BPM</div></div><span class="tag ok">Completed</span></div>
        <div class="step cur"><span class="num">4</span><div style="flex:1"><div style="font-weight:600">Synchronize video with music</div><div style="font-size:11px;color:var(--ai2)">12 of 18 cut points placed in CapCut</div></div><span class="btn sm primary">Guide me<i class="fa-solid fa-arrow-right"></i></span></div>
        <div class="step"><span class="num">5</span><div style="flex:1"><div>Add captions</div><div class="dim" style="font-size:11px">Interview subtitles ready to import</div></div><span class="tag">Upcoming</span></div>
        <div class="step"><span class="num">6</span><div style="flex:1"><div>Export final video</div><div class="dim" style="font-size:11px">1080×1920 and 1920×1080</div></div><span class="tag">Upcoming</span></div>
      </div>

      <!-- conversations -->
      <div class="card" style="flex:1;min-height:0;overflow:hidden">
        <div class="row" style="padding:9px 12px;justify-content:space-between"><span class="h3">RECENT CONVERSATIONS</span><span class="dim" style="font-size:11.5px">7 saved</span></div>
        <div class="row hair" style="padding:8px 12px;gap:9px"><span class="ai-avatar"><i class="fa-regular fa-comment"></i></span><div style="flex:1;min-width:0"><div>How do I make the music quieter while Coach talks?</div><div class="dim" style="font-size:11px">Floating Copilot · 3 steps with screenshots · 12 min ago</div></div></div>
        <div class="row hair" style="padding:8px 12px;gap:9px"><span class="ai-avatar"><i class="fa-regular fa-comment"></i></span><div style="flex:1;min-width:0"><div>Recommend a 60-second highlight structure</div><div class="dim" style="font-size:11px">Created editing plan v1 · yesterday</div></div></div>
      </div>
    </div>

    <!-- RIGHT: saved assets -->
    <div style="display:flex;flex-direction:column;gap:10px;min-height:0">
      <div class="card mini">
        <div class="row" style="justify-content:space-between"><span class="h3">MEDIA STACKS</span><span class="dim" style="font-size:11.5px">214 clips · 38.6 GB</span></div>
        <div class="row" style="gap:6px;margin-top:8px">
          <img class="thumb" style="flex:1;width:0;height:40px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">
          <img class="thumb" style="flex:1;width:0;height:40px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">
          <img class="thumb" style="flex:1;width:0;height:40px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png">
          <img class="thumb" style="flex:1;width:0;height:40px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png">
        </div>
        <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;gap:2px">
          <i style="flex:48;background:#f97316"></i><i style="flex:31;background:#60a5fa"></i><i style="flex:22;background:var(--ok)"></i><i style="flex:14;background:var(--ai)"></i><i style="flex:37;background:#fb7185"></i><i style="flex:62;background:var(--beat-weak)"></i>
        </div>
        <div class="dim" style="font-size:11px;margin-top:5px">Scoring 48 · Defense 31 · Celebrations 22 · Interviews 14 · Crowd 37 · B-Roll 62</div>
      </div>

      <div class="card mini">
        <div class="row" style="justify-content:space-between"><span class="h3">MUSIC ANALYSIS</span><span class="tag ok"><i class="fa-solid fa-check"></i>Saved</span></div>
        <div class="row" style="gap:10px;margin-top:7px">
          <i class="fa-solid fa-wave-square" style="color:var(--beat)"></i>
          <div style="flex:1"><div style="font-weight:500">Run It Back.mp3</div><div class="dim" style="font-size:11px">122 BPM · F minor · 1:04 · 6 strong drops · 18 cuts</div></div>
        </div>
        <svg viewBox="0 0 300 26" preserveAspectRatio="none" style="width:100%;height:26px;margin-top:6px">
          <polyline fill="none" stroke="#8b7cf6" stroke-width="1.5" points="0,22 30,20 60,16 75,10 90,6 120,5 150,7 170,6 175,18 185,17 190,5 230,4 255,6 260,12 300,22"/>
          <g fill="#f5b544"><rect x="35" y="0" width="3" height="3"/><rect x="72" y="0" width="3" height="3"/><rect x="110" y="0" width="3" height="3"/><rect x="146" y="0" width="3" height="3"/><rect x="183" y="0" width="3" height="3"/><rect x="220" y="0" width="3" height="3"/></g>
        </svg>
      </div>

      <div class="card mini">
        <div class="row" style="justify-content:space-between"><span class="h3">SUBTITLES</span><span class="tag warn">2 need review</span></div>
        <div class="row" style="gap:10px;margin-top:7px">
          <i class="fa-regular fa-closed-captioning" style="color:var(--cut)"></i>
          <div style="flex:1"><div style="font-weight:500">Interviews.srt</div><div class="dim" style="font-size:11px">312 lines · English · 97% confidence</div></div>
          <span class="btn sm">Review</span>
        </div>
      </div>

      <div class="card mini" style="flex:1;min-height:0;overflow:hidden">
        <div class="h3">ACTIVITY</div>
        <div style="margin-top:9px">
          <div class="tl"><i class="b" style="background:var(--ai)"></i><div><div>Copilot guided 3 steps in CapCut</div><div class="dim" style="font-size:11px">Audio ducking · 12 min ago</div></div></div>
          <div class="tl"><i class="b" style="background:var(--ok)"></i><div><div>You placed 12 cuts on beats</div><div class="dim" style="font-size:11px">Today 3:58 PM</div></div></div>
          <div class="tl"><i class="b" style="background:var(--cut)"></i><div><div>Subtitles generated for 14 interviews</div><div class="dim" style="font-size:11px">Today 2:10 PM</div></div></div>
          <div class="tl"><i class="b" style="background:var(--beat)"></i><div><div>Beat analysis saved</div><div class="dim" style="font-size:11px">Yesterday</div></div></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
