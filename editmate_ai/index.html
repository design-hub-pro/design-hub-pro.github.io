<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditMate AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  html, body { background: #ffffff; }
  body { margin: 0; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #111118; }
  header { text-align: center; padding: 64px 16px 40px; }
  .icon { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(145deg, #a99cff 0%, #6d5ce8 55%, #3b82c4 100%);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(0,0,0,.18), 0 10px 24px rgba(80,60,200,.28); }
  .icon i { color: #fff; font-size: 38px; }
  h1 { font-size: 44px; font-weight: 750; letter-spacing: -.02em; margin: 0; }
  .desc { font-size: 18px; color: #555562; margin: 12px 0 0; }
  .tags { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .tags span { font-size: 12.5px; color: #555562; border: 1px solid #e4e4ea; border-radius: 999px; padding: 3px 11px; }
  main { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 0 16px 80px; }
  .frame { display: block; width: min(1200px, 100%); aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden;
           border: 1px solid #e4e4ea; box-shadow: 0 18px 50px rgba(20,20,40,.14); position: relative; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
  <h1>EditMate AI</h1>
  <p class="desc">A desktop copilot that works beside CapCut to organize footage, find the beat and guide every edit.</p>
  <div class="tags"><span>macOS</span><span>Video</span><span>AI Copilot</span><span>Accessibility</span></div>
</header>
<main>
  <a class="frame" href="dashboard.html" target="_blank"><iframe src="dashboard.html" scrolling="no" title="Dashboard"></iframe></a>
  <a class="frame" href="floating.html" target="_blank"><iframe src="floating.html" scrolling="no" title="Floating Copilot"></iframe></a>
  <a class="frame" href="screenshot.html" target="_blank"><iframe src="screenshot.html" scrolling="no" title="Screenshot Guidance"></iframe></a>
  <a class="frame" href="copilot.html" target="_blank"><iframe src="copilot.html" scrolling="no" title="AI Copilot"></iframe></a>
  <a class="frame" href="media.html" target="_blank"><iframe src="media.html" scrolling="no" title="Media Organizer"></iframe></a>
  <a class="frame" href="music.html" target="_blank"><iframe src="music.html" scrolling="no" title="Music and Beat Studio"></iframe></a>
  <a class="frame" href="guided.html" target="_blank"><iframe src="guided.html" scrolling="no" title="Guided Editing"></iframe></a>
  <a class="frame" href="tools.html" target="_blank"><iframe src="tools.html" scrolling="no" title="AI Editing Tools"></iframe></a>
  <a class="frame" href="project.html" target="_blank"><iframe src="project.html" scrolling="no" title="Project Workspace"></iframe></a>
  <a class="frame" href="learning.html" target="_blank"><iframe src="learning.html" scrolling="no" title="Learning Hub"></iframe></a>
  <a class="frame" href="accessibility.html" target="_blank"><iframe src="accessibility.html" scrolling="no" title="Accessibility Studio"></iframe></a>
  <a class="frame" href="settings.html" target="_blank"><iframe src="settings.html" scrolling="no" title="Settings"></iframe></a>
</main>
<script>
  function fit() {
    document.querySelectorAll('.frame').forEach(f => {
      f.querySelector('iframe').style.transform = 'scale(' + (f.clientWidth / 1440) + ')';
    });
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
