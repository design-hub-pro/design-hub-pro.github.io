<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — AI Editing Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .tool{display:flex;gap:10px;padding:8px 10px;border-radius:var(--r-card);align-items:flex-start}
  .tool .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
  .tool.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
  .tool .t{font-weight:600;font-size:12.5px}
  .tool .d{font-size:11px;color:var(--dim);line-height:1.35}
  table.pz{width:100%;border-collapse:collapse;font-size:12px}
  table.pz th{font-weight:500;color:var(--dim);text-align:left;font-size:11px;padding:5px 8px;border-bottom:1px solid var(--line)}
  table.pz td{padding:0 8px;height:29px;border-bottom:1px solid var(--line)}
  table.pz tr.skip td{color:var(--dim)}
  table.pz tr.focus td{background:var(--ai-bg)}
</style>
</head>
<body data-title="AI Editing Tools" data-nav="tools" data-status="Silence &amp; Pause Detector · finished in 6s">

<template id="main">
  <div style="flex:1;display:flex;min-height:0">
    <!-- tool gallery -->
    <div style="width:286px;flex:none;border-right:1px solid var(--line);padding:14px 10px;overflow:hidden">
      <div class="row" style="padding:0 6px;justify-content:space-between"><span class="h2">Tools</span><span class="dim" style="font-size:11.5px">8 available</span></div>
      <div style="display:flex;flex-direction:column;gap:2px;margin-top:10px">
        <div class="tool"><span class="ic" style="background:rgba(251,113,133,.15);color:#fb7185"><i class="fa-solid fa-fire"></i></span><div><div class="t">Smart Highlight Finder</div><div class="d">Best moments in long videos</div></div></div>
        <div class="tool on"><span class="ic" style="background:var(--ai-bg);color:var(--ai2)"><i class="fa-solid fa-volume-xmark"></i></span><div><div class="t">Silence &amp; Pause Detector</div><div class="d">Find dead air and suggest cuts</div></div></div>
        <div class="tool"><span class="ic" style="background:rgba(52,209,191,.14);color:var(--cut)"><i class="fa-regular fa-closed-captioning"></i></span><div><div class="t">AI Subtitle Generator</div><div class="d">Editable captions with timing</div></div></div>
        <div class="tool"><span class="ic" style="background:rgba(96,165,250,.15);color:#60a5fa"><i class="fa-solid fa-magnifying-glass"></i></span><div><div class="t">Smart Scene Search</div><div class="d">Describe a moment, get the clip</div></div></div>
        <div class="tool"><span class="ic" style="background:rgba(245,181,68,.14);color:var(--beat)"><i class="fa-solid fa-diagram-project"></i></span><div><div class="t">AI Story Planner</div><div class="d">Scenes, order and pacing</div></div></div>
        <div class="tool"><span class="ic" style="background:var(--ok-bg);color:var(--ok)"><i class="fa-solid fa-clipboard-check"></i></span><div><div class="t">Video Quality Checker</div><div class="d">Black frames, audio jumps, gaps</div></div></div>
        <div class="tool"><span class="ic" style="background:rgba(192,132,252,.15);color:#c084fc"><i class="fa-solid fa-audio-description"></i></span><div><div class="t">Audio Description Generator</div><div class="d">Narrate what is on screen</div></div></div>
        <div class="tool"><span class="ic" style="background:rgba(244,114,182,.14);color:#f472b6"><i class="fa-solid fa-pen-nib"></i></span><div><div class="t">AI Creative Assistant</div><div class="d">Titles, hooks, script outlines</div></div></div>
      </div>
      <div class="card" style="margin:14px 6px 0;padding:10px">
        <div class="h3" style="font-size:11px">RECENT RUNS</div>
        <div class="row" style="gap:7px;margin-top:6px;font-size:12px"><span class="done-check"><i class="fa-solid fa-check"></i></span>Subtitles · Interviews<span class="dim" style="margin-left:auto">2h</span></div>
        <div class="row" style="gap:7px;margin-top:5px;font-size:12px"><span class="done-check"><i class="fa-solid fa-check"></i></span>Highlights · Game 3<span class="dim" style="margin-left:auto">Mon</span></div>
      </div>
    </div>

    <!-- active tool -->
    <div style="flex:1;min-width:0;padding:16px 20px 0;display:flex;flex-direction:column;overflow:hidden">
      <div class="row" style="gap:10px">
        <span class="ic" style="width:34px;height:34px;border-radius:8px;background:var(--ai-bg);color:var(--ai2);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-volume-xmark"></i></span>
        <div><div class="h1" style="font-size:17px">Silence &amp; Pause Detector</div><div class="dim" style="font-size:12px">Finds long pauses in speech and proposes cuts. Nothing is cut until you approve it.</div></div>
      </div>

      <!-- input -->
      <div class="row card" style="margin-top:14px;padding:9px 12px;gap:12px">
        <img class="thumb" style="width:64px;height:38px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png">
        <div><div style="font-weight:600">Coach Rivera interview.mov</div><div class="dim" style="font-size:11.5px">4:38 · Interviews stack · 1080p 30fps</div></div>
        <div class="row" style="margin-left:auto;gap:16px;font-size:12px">
          <div><div class="dim" style="font-size:10.5px">MIN PAUSE</div><div class="row" style="gap:6px">1.5 s<i class="fa-solid fa-chevron-down dim" style="font-size:9px"></i></div></div>
          <div><div class="dim" style="font-size:10.5px">KEEP PADDING</div><div class="row" style="gap:6px">0.25 s<i class="fa-solid fa-chevron-down dim" style="font-size:9px"></i></div></div>
          <div><div class="dim" style="font-size:10.5px">SENSITIVITY</div><div class="row" style="gap:6px">−38 dB<i class="fa-solid fa-chevron-down dim" style="font-size:9px"></i></div></div>
          <span class="btn sm"><i class="fa-solid fa-rotate"></i>Re-run</span>
        </div>
      </div>

      <!-- waveform -->
      <div class="card" style="margin-top:10px;padding:10px 12px 8px">
        <div class="row" style="justify-content:space-between;font-size:11.5px">
          <span class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>9 pauses found</span><span class="dim">Highlighted regions are proposed cuts</span></span>
          <span class="mono dim">0:00 — 4:38</span>
        </div>
        <svg id="pw" viewBox="0 0 1000 86" preserveAspectRatio="none" style="width:100%;height:86px;display:block;margin-top:8px"></svg>
        <div class="row mono dim" style="justify-content:space-between;font-size:10px;margin-top:3px"><span>0:00</span><span>1:00</span><span>2:00</span><span>3:00</span><span>4:00</span><span>4:38</span></div>
      </div>

      <!-- results -->
      <div style="display:grid;grid-template-columns:1fr 228px;gap:12px;margin-top:10px;flex:1;min-height:0">
        <div class="card" style="overflow:hidden">
          <table class="pz">
            <thead><tr><th style="width:30px">#</th><th>Starts</th><th>Length</th><th>Context</th><th style="text-align:right">Cut</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="card" style="padding:12px">
            <div class="dim" style="font-size:11px">IF YOU APPLY 8 OF 9</div>
            <div style="font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ok);margin-top:2px">−22 s</div>
            <div class="dim" style="font-size:12px">4:38 → 4:16 runtime</div>
            <div class="progress" style="margin-top:8px"><i style="width:92%;background:var(--ok)"></i></div>
          </div>
          <div class="suggest" style="padding:10px 11px;font-size:12px">
            <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span></div>
            <div style="margin-top:6px">Keep pause 6. Coach Rivera stops before "that's when they believed", and the beat lands better with it.</div>
          </div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:12px">
            <span class="btn primary" style="justify-content:center"><i class="fa-solid fa-check"></i>Apply 8 cuts</span>
            <span class="btn" style="justify-content:center"><i class="fa-solid fa-file-export"></i>Export cut list (EDL)</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
<script>
(function(){
  let s = 46380; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const DUR = 278, X = t => t / DUR * 1000;
  const P = [[14.2,1.8,'"…we were down eleven at the half."',1],[38.9,2.4,'After "so the plan was"',1],[61.0,1.6,'Before the second question',1],[97.5,3.6,'Coach looks at the bench',1],[124.3,1.9,'"…and honestly" (trails off)',1],[151.8,2.2,'Before "that\'s when they believed"',0],[188.4,3.1,'Interviewer re-asks',1],[226.0,1.7,'Mid-sentence breath',1],[262.7,5.6,'After final answer',1]];
  let svg = '';
  for (let i = 0; i < 330; i++) {
    const t = i / 330 * DUR; const inP = P.some(p => t >= p[0] && t <= p[0] + p[1]);
    const h = inP ? 1.5 : (8 + 30 * r() * (0.6 + 0.4 * Math.sin(i / 7)));
    svg += `<rect x="${i*1000/330}" y="${43-h}" width="1.9" height="${h*2}" fill="#5d6a85"/>`;
  }
  P.forEach((p, i) => {
    const on = p[3]; const w = Math.max(6, X(p[1]) * 1.6);
    svg += `<rect x="${X(p[0])}" y="2" width="${w}" height="82" rx="2" fill="${on ? 'rgba(139,124,246,.28)' : 'rgba(255,255,255,.06)'}" stroke="${on ? '#8b7cf6' : '#6c6c78'}" stroke-dasharray="3 2"/>`;
    svg += `<text x="${X(p[0]) + w/2}" y="14" fill="${on ? '#a99cff' : '#6c6c78'}" font-size="10" text-anchor="middle" font-family="-apple-system">${i+1}</text>`;
  });
  document.getElementById('pw').innerHTML = svg;
  const fmt = t => `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
  document.getElementById('rows').innerHTML = P.map((p, i) => `
    <tr class="${p[3] ? '' : 'skip'} ${i === 3 ? 'focus' : ''}">
      <td class="dim">${i+1}</td><td class="mono">${fmt(p[0])}</td><td class="mono">${p[1].toFixed(1)} s</td>
      <td>${p[2]}</td>
      <td style="text-align:right"><span class="row" style="justify-content:flex-end;gap:8px"><span class="dim" style="font-size:11px">${p[3] ? 'Cut' : 'Keep'}</span><span class="sw-t ${p[3] ? 'on' : ''}"></span></span></td>
    </tr>`).join('');
})();
</script>
</body>
</html>
