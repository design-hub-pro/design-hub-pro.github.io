<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Screenshot Guidance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .ed{background:#0e0e11;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--line2);font-size:10px;color:#b9b9c4}
  .ed .bar{height:22px;background:#17171b;display:flex;align-items:center;gap:10px;padding:0 8px;border-bottom:1px solid #26262c}
  .ed .pane{background:#141418}
  .ed .tab{padding:3px 5px;border-radius:3px;white-space:nowrap}
  .ed .tab.on{background:#2a2a31;color:#fff}
  .ann{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--ai);color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(139,124,246,.35)}
  .ring{position:absolute;border:2px solid var(--ai);border-radius:6px;box-shadow:0 0 0 4px rgba(139,124,246,.18)}
  .ring.cur{border-color:var(--ai2);box-shadow:0 0 0 5px rgba(139,124,246,.35),0 0 24px rgba(139,124,246,.55)}
  .ring.done{border-color:var(--ok);box-shadow:none;border-style:solid}
  .clip{position:absolute;top:3px;bottom:3px;border-radius:3px;overflow:hidden;background-size:cover;background-position:center}
</style>
</head>
<body data-title="Screenshot Guidance" data-nav="copilot" data-copilot="1" data-status="Screenshot analyzed in 1.8s">

<template id="main">
  <div class="row" style="height:40px;flex:none;padding:0 18px;border-bottom:1px solid var(--line);gap:10px">
    <i class="fa-solid fa-camera" style="color:var(--ai2)"></i>
    <b style="font-weight:600">Capture 4:39 PM</b>
    <span class="dim" style="font-size:11.5px">CapCut window · 2560 × 1600 · stays on this Mac</span>
    <div class="row" style="margin-left:auto;gap:6px">
      <div class="seg"><span class="on">Annotated</span><span>Original</span></div>
      <span class="tb-btn"><i class="fa-solid fa-magnifying-glass-plus"></i></span>
      <span class="tb-btn"><i class="fa-solid fa-trash-can"></i></span>
    </div>
  </div>

  <div style="flex:1;padding:14px 18px 0;overflow:hidden">
    <div class="msg-user" style="margin-left:auto;width:fit-content">I want to add a fade-in transition, but I don't know where to click.</div>

    <!-- generic editor capture -->
    <div class="ed" style="margin-top:12px;height:470px">
      <div class="bar"><span style="display:flex;gap:4px"><i style="width:7px;height:7px;border-radius:50%;background:#555;display:block"></i><i style="width:7px;height:7px;border-radius:50%;background:#555;display:block"></i><i style="width:7px;height:7px;border-radius:50%;background:#555;display:block"></i></span><span>Media</span><span>Audio</span><span>Text</span><span>Stickers</span><span>Effects</span><span>Transitions</span><span style="margin-left:auto">Basketball Highlights</span><span style="background:#2b6cf6;color:#fff;padding:1px 8px;border-radius:3px">Export</span></div>
      <div style="display:flex;height:300px">
        <div class="pane" style="width:170px;padding:6px;border-right:1px solid #26262c">
          <div style="margin-bottom:5px">Imported · 214</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png">
            <img class="thumb" style="height:40px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png">
          </div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0b0d;padding:8px">
          <img style="width:340px;height:220px;object-fit:cover;border-radius:2px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">
          <div style="margin-top:6px;display:flex;gap:12px;align-items:center"><span class="mono" style="font-size:9.5px">00:02:10 / 00:41:06</span><i class="fa-solid fa-play"></i><span>Full</span></div>
        </div>
        <div class="pane" style="width:210px;padding:8px;border-left:1px solid #26262c">
          <div style="display:flex;gap:2px"><span class="tab">Video</span><span class="tab on" id="t-anim">Animation</span><span class="tab">Audio</span><span class="tab">Speed</span></div>
          <div style="display:flex;gap:2px;margin-top:6px"><span class="tab on">In</span><span class="tab">Out</span><span class="tab">Combo</span></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px">
            <div style="height:38px;border-radius:3px;background:#22222a;display:flex;align-items:end;padding:2px 3px">None</div>
            <div id="t-fade" style="height:38px;border-radius:3px;background:linear-gradient(90deg,#000,#5a5a68);display:flex;align-items:end;padding:2px 3px;color:#fff">Fade in</div>
            <div style="height:38px;border-radius:3px;background:#22222a;display:flex;align-items:end;padding:2px 3px">Zoom</div>
            <div style="height:38px;border-radius:3px;background:#22222a;display:flex;align-items:end;padding:2px 3px">Slide</div>
            <div style="height:38px;border-radius:3px;background:#22222a;display:flex;align-items:end;padding:2px 3px">Spin</div>
            <div style="height:38px;border-radius:3px;background:#22222a;display:flex;align-items:end;padding:2px 3px">Drop</div>
          </div>
          <div id="t-dur"><div style="margin-top:12px">Duration</div>
          <div style="display:flex;align-items:center;gap:5px;margin-top:4px"><div style="flex:1;height:3px;background:#2a2a31;border-radius:2px;position:relative"><i style="position:absolute;left:0;width:30%;height:3px;background:#8a8a96;display:block"></i><i style="position:absolute;left:30%;top:-3px;width:9px;height:9px;border-radius:50%;background:#ddd;display:block"></i></div><span class="mono" style="font-size:9.5px">0.5s</span></div></div>
        </div>
      </div>
      <!-- timeline -->
      <div style="height:138px;border-top:1px solid #26262c;background:#121215;position:relative;padding:4px 8px">
        <div style="display:flex;gap:40px;font-size:9px" class="mono"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span><span>00:20</span><span>00:25</span><span>00:30</span><span>00:35</span><span>00:40</span></div>
        <div style="position:absolute;left:8px;right:8px;top:22px;height:36px">
          <div class="clip" style="left:0;width:11%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png)"></div>
          <div class="clip" style="left:11.3%;width:16%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png);outline:2px solid #fff" id="t-clip"></div>
          <div class="clip" style="left:27.6%;width:12%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png)"></div>
          <div class="clip" style="left:39.9%;width:14%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png)"></div>
          <div class="clip" style="left:54.2%;width:18%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png)"></div>
          <div class="clip" style="left:72.5%;width:13%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png)"></div>
        </div>
        <div style="position:absolute;left:8px;right:8px;top:64px;height:22px;background:#1d3b33;border-radius:3px;overflow:hidden">
          <div style="height:100%;background:repeating-linear-gradient(90deg,#2d6b5a 0 2px,transparent 2px 5px);opacity:.8"></div>
        </div>
        <div style="position:absolute;left:12px;top:68px;color:#cde;font-size:9px">Run It Back.mp3</div>
        <div style="position:absolute;left:calc(8px + 14%);top:18px;bottom:8px;width:1px;background:#fff"></div>
      </div>

      <!-- annotations (positioned from target rects) -->
      <div class="ring done" data-t="t-clip" data-pad="3"></div>
      <div class="ann" data-t="t-clip" data-n="ok" style="background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.3)"><i class="fa-solid fa-check" style="font-size:9px"></i></div>
      <div class="ring cur" data-t="t-anim" data-pad="3"></div>
      <div class="ann" data-t="t-anim">2</div>
      <div class="ring" data-t="t-fade" data-pad="3" style="border-style:dashed"></div>
      <div class="ann" data-t="t-fade" style="opacity:.8">3</div>
      <div class="ring" data-t="t-dur" data-pad="4" style="border-style:dashed"></div>
      <div class="ann" data-t="t-dur" style="opacity:.8">4</div>
      <div class="popover" id="tip" style="position:absolute;padding:7px 10px;font-size:11.5px;color:var(--text);width:184px">
        <b style="font-weight:600">Click "Animation"</b><div class="dim" style="font-size:11px">Right panel, second tab. Your clip is already selected.</div>
      </div>
    </div>

    <div class="row" style="gap:16px;margin-top:10px;font-size:11.5px">
      <span class="row" style="gap:6px"><span style="width:12px;height:12px;border:2px solid var(--ok);border-radius:3px"></span><span class="sub">Done</span></span>
      <span class="row" style="gap:6px"><span style="width:12px;height:12px;border:2px solid var(--ai2);border-radius:3px;box-shadow:0 0 6px var(--ai)"></span><span class="sub">Click now</span></span>
      <span class="row" style="gap:6px"><span style="width:12px;height:12px;border:2px dashed var(--ai);border-radius:3px"></span><span class="sub">Coming up</span></span>
      <span class="dim" style="margin-left:auto">Detected: CapCut 5.2 · Edit workspace · clip "Q4_three_0211.mov" selected</span>
    </div>
  </div>
</template>

<template id="copilot">
  <div class="row" style="height:40px;padding:0 12px;border-bottom:1px solid var(--line);gap:8px">
    <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span><b style="font-weight:600">Add a fade-in</b>
    <span class="dim" style="margin-left:auto;font-size:11px">Step 2 of 4</span>
  </div>
  <div style="flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div>You're in CapCut's <b style="font-weight:600">edit workspace</b> with the buzzer-beater clip selected. Four steps:</div>
    <div class="progress"><i style="width:37%"></i></div>

    <div class="row" style="gap:9px;align-items:flex-start;opacity:.75"><span class="done-check" style="margin-top:2px"><i class="fa-solid fa-check"></i></span><div><div style="text-decoration:line-through;color:var(--muted)">Select the video clip</div><div class="dim" style="font-size:11px">Confirmed from your screenshot</div></div></div>

    <div class="card" style="padding:10px;border-color:var(--ai-line);background:var(--ai-bg)">
      <div class="row" style="gap:9px"><span class="ann" style="position:static;width:18px;height:18px;font-size:10px;box-shadow:none">2</span><b style="font-weight:600">Open the Animation panel</b></div>
      <div class="sub" style="margin-top:6px;font-size:12.5px">In the right-hand panel, click the <b style="color:var(--text)">Animation</b> tab, then make sure <b style="color:var(--text)">In</b> is selected. "In" effects play at the start of a clip.</div>
      <div class="row" style="gap:6px;margin-top:8px"><span class="tag"><i class="fa-regular fa-keyboard"></i>No shortcut in CapCut</span></div>
    </div>

    <div class="row" style="gap:9px"><span class="tag" style="width:18px;height:18px;border-radius:50%;justify-content:center">3</span><span class="sub">Choose the <b>Fade in</b> effect</span></div>
    <div class="row" style="gap:9px"><span class="tag" style="width:18px;height:18px;border-radius:50%;justify-content:center">4</span><span class="sub">Set the duration to about 0.5s</span></div>

    <div class="suggest" style="padding:9px 10px;margin-top:4px">
      <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span></div>
      <div style="margin-top:5px;font-size:12.5px">0.5s equals one beat at 122 BPM, so the fade finishes right on the first kick.</div>
    </div>

    <div style="margin-top:auto" class="card">
      <div class="row" style="gap:8px;padding:8px 10px"><i class="fa-solid fa-graduation-cap dim"></i><span style="font-size:12.5px">Lesson: Transitions vs. animations</span><span class="dim" style="margin-left:auto;font-size:11px">3 min</span></div>
    </div>
  </div>
  <div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px">
    <span class="btn primary" style="justify-content:center">Next step<i class="fa-solid fa-arrow-right"></i></span>
    <div class="row" style="gap:6px">
      <span class="btn sm" style="flex:1;justify-content:center"><i class="fa-solid fa-camera"></i>Capture again<span class="kbd">⌘⇧2</span></span>
      <span class="btn sm ghost"><i class="fa-solid fa-volume-high"></i>Read aloud</span>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
<script>
(function(){const ed=document.querySelector('.ed');const E=ed.getBoundingClientRect();
 document.querySelectorAll('.ed [data-t]').forEach(el=>{const r=document.getElementById(el.dataset.t).getBoundingClientRect();
  const x=r.left-E.left,y=r.top-E.top;
  if(el.classList.contains('ring')){const p=+el.dataset.pad;Object.assign(el.style,{left:x-p+'px',top:y-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px'});}
  else{Object.assign(el.style,{left:x-14+'px',top:y-14+'px'});}});
 const a=document.getElementById('t-anim').getBoundingClientRect(),tip=document.getElementById('tip');
 Object.assign(tip.style,{left:a.left-E.left-250+'px',top:a.top-E.top+18+'px'});})();
</script>
</body>
</html>
