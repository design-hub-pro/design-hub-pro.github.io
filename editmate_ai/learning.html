<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Learning Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .lesson{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:var(--r);color:var(--muted);font-size:12.5px}
  .lesson.on{background:var(--ai-bg);color:var(--text)}
  .lesson .st{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:8px}
  .lesson .st.ok{background:var(--ok);border-color:transparent;color:#0d1a13}
  .lesson .st.cur{border-color:var(--ai);box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 10px var(--ai)}
  .lesson .t{margin-left:auto;font-size:11px;color:var(--dim)}
  .step{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
  .num{width:20px;height:20px;border-radius:50%;background:var(--raised);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
  .chk{display:flex;align-items:center;gap:9px;height:26px}
  .box{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);flex:none}
</style>
</head>
<body data-title="Learning Hub" data-nav="learn" data-status="Lesson progress synced">

<template id="main">
  <div style="display:flex;flex:1;min-height:0">
    <!-- paths column -->
    <div style="width:272px;flex:none;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:hidden">
      <div class="h3" style="padding:0 8px">LEARNING FOR</div>
      <div class="seg" style="margin:6px 4px 12px;display:flex">
        <span class="on" style="flex:1;justify-content:center">CapCut</span><span style="flex:1;justify-content:center">Premiere</span><span style="flex:1;justify-content:center">Resolve</span>
      </div>

      <div class="row" style="padding:0 8px;justify-content:space-between"><b style="font-weight:600">Beginner</b><span class="dim" style="font-size:11.5px">5 of 6</span></div>
      <div class="progress" style="margin:6px 8px 6px"><i style="width:83%;background:var(--ok)"></i></div>
      <div class="lesson"><span class="st ok"><i class="fa-solid fa-check"></i></span>Intro to video editing<span class="t">8m</span></div>
      <div class="lesson"><span class="st ok"><i class="fa-solid fa-check"></i></span>Importing and organizing<span class="t">6m</span></div>
      <div class="lesson"><span class="st ok"><i class="fa-solid fa-check"></i></span>Basic cutting and trimming<span class="t">9m</span></div>
      <div class="lesson"><span class="st ok"><i class="fa-solid fa-check"></i></span>Adding music<span class="t">5m</span></div>
      <div class="lesson"><span class="st ok"><i class="fa-solid fa-check"></i></span>Adding captions<span class="t">7m</span></div>
      <div class="lesson"><span class="st"></span>Exporting videos<span class="t">4m</span></div>

      <div class="row" style="padding:0 8px;justify-content:space-between;margin-top:12px"><b style="font-weight:600">Intermediate</b><span class="dim" style="font-size:11.5px">0 of 5</span></div>
      <div class="progress" style="margin:6px 8px 6px"><i style="width:6%"></i></div>
      <div class="lesson on"><span class="st cur"></span>Music beat sync<span class="t">12m</span></div>
      <div class="lesson"><span class="st"></span>Smooth transitions<span class="t">10m</span></div>
      <div class="lesson"><span class="st"></span>Storytelling through editing<span class="t">14m</span></div>
      <div class="lesson"><span class="st"></span>Audio mixing<span class="t">11m</span></div>
      <div class="lesson"><span class="st"></span>Color correction<span class="t">13m</span></div>

      <div class="row" style="padding:0 8px;justify-content:space-between;margin-top:12px"><b style="font-weight:600;color:var(--muted)">Advanced</b><span class="dim" style="font-size:11.5px"><i class="fa-solid fa-lock" style="font-size:10px"></i>&nbsp; 4 lessons</span></div>
      <div class="dim" style="font-size:11.5px;padding:4px 8px">Documentary editing, cinematic storytelling, A/V sync, pro workflows</div>
    </div>

    <!-- featured lesson -->
    <div style="flex:1;min-width:0;padding:18px 24px;overflow:hidden">
      <div class="row" style="gap:8px">
        <span class="tag">Intermediate</span><span class="tag">CapCut 5.2</span><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Uses your project</span>
        <span class="dim" style="margin-left:auto;font-size:12px"><i class="fa-regular fa-clock"></i>&nbsp; 12 min · Lesson 1 of 5</span>
      </div>
      <div class="h1" style="margin-top:8px;font-size:22px">Cutting on the beat in CapCut</div>
      <div class="sub" style="margin-top:2px">By the end you will have the opening 20 seconds of Basketball Highlights cut to the music.</div>

      <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:14px">
        <div>
          <div style="position:relative;height:250px;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line)">
            <img class="thumb" style="width:100%;height:100%;border-radius:0" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png">
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7))"></div>
            <span style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fa-solid fa-play" style="margin-left:3px"></i></span>
            <div style="position:absolute;left:12px;right:12px;bottom:10px">
              <div class="row" style="gap:8px;font-size:11.5px;color:#ddd"><span class="mono">1:12</span><div class="progress" style="flex:1;background:rgba(255,255,255,.25)"><i style="width:28%;background:#fff"></i></div><span class="mono">4:10</span><i class="fa-regular fa-closed-captioning"></i><span>1.0×</span></div>
            </div>
          </div>
          <div class="h3" style="margin-top:14px">YOU WILL LEARN TO</div>
          <div style="margin-top:6px;display:grid;gap:5px">
            <div class="row" style="gap:8px"><i class="fa-solid fa-circle-dot" style="color:var(--ai2);font-size:10px"></i>Read beat markers on CapCut's audio track</div>
            <div class="row" style="gap:8px"><i class="fa-solid fa-circle-dot" style="color:var(--ai2);font-size:10px"></i>Split a clip exactly on a strong beat (⌘B)</div>
            <div class="row" style="gap:8px"><i class="fa-solid fa-circle-dot" style="color:var(--ai2);font-size:10px"></i>Choose which beats deserve a cut and which do not</div>
          </div>

          <div class="h3" style="margin-top:14px">SCREENSHOT WALKTHROUGH</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">
            <div class="card" style="padding:6px">
              <div style="height:62px;border-radius:4px;background:#101014;position:relative;overflow:hidden">
                <div style="position:absolute;left:6px;right:6px;bottom:8px;height:12px;background:#2b2e3d;border-radius:2px"></div>
                <div style="position:absolute;left:6px;right:6px;bottom:24px;height:12px;background:#3a3150;border-radius:2px"></div>
                <div style="position:absolute;left:28%;bottom:4px;width:34px;height:20px;border:2px solid var(--ai);border-radius:4px"></div>
              </div>
              <div style="font-size:11.5px;margin-top:5px"><b>1</b>&nbsp; Select the music track</div>
            </div>
            <div class="card" style="padding:6px">
              <div style="height:62px;border-radius:4px;background:#101014;position:relative;overflow:hidden">
                <div style="position:absolute;left:6px;right:6px;top:6px;height:14px;background:#22232b;border-radius:2px"></div>
                <div style="position:absolute;right:30%;top:3px;width:26px;height:20px;border:2px solid var(--ai);border-radius:4px"></div>
                <div style="position:absolute;left:6px;right:6px;bottom:10px;height:12px;background:#2b2e3d;border-radius:2px"></div>
              </div>
              <div style="font-size:11.5px;margin-top:5px"><b>2</b>&nbsp; Click Beat, then Auto</div>
            </div>
            <div class="card" style="padding:6px">
              <div style="height:62px;border-radius:4px;background:#101014;position:relative;overflow:hidden">
                <div style="position:absolute;left:6px;right:6px;bottom:10px;height:12px;background:#2b2e3d;border-radius:2px"></div>
                <div style="position:absolute;left:20%;bottom:6px;width:2px;height:22px;background:var(--beat)"></div>
                <div style="position:absolute;left:46%;bottom:6px;width:2px;height:22px;background:var(--beat)"></div>
                <div style="position:absolute;left:71%;bottom:6px;width:2px;height:22px;background:var(--beat)"></div>
              </div>
              <div style="font-size:11.5px;margin-top:5px"><b>3</b>&nbsp; Split at yellow dots</div>
            </div>
          </div>
        </div>

        <!-- practice -->
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="card" style="padding:12px 14px">
            <div class="row" style="gap:8px"><i class="fa-solid fa-dumbbell" style="color:var(--beat)"></i><b style="font-weight:600">Practice task</b><span class="tag" style="margin-left:auto">Your footage</span></div>
            <div style="margin-top:6px;font-size:13.5px">Cut 8 clips to the drops in <b>Run It Back.mp3</b></div>
            <div class="row" style="gap:5px;margin-top:9px">
              <img class="thumb" style="width:44px;height:30px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">
              <img class="thumb" style="width:44px;height:30px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
              <img class="thumb" style="width:44px;height:30px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">
              <img class="thumb" style="width:44px;height:30px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png">
              <span class="dim" style="font-size:11.5px;margin-left:4px">+4 from Scoring</span>
            </div>
            <div class="hair" style="margin-top:10px;padding-top:8px">
              <div class="chk"><span class="done-check"><i class="fa-solid fa-check"></i></span>Imported 8 clips into CapCut</div>
              <div class="chk"><span class="done-check"><i class="fa-solid fa-check"></i></span>Turned on Auto beat for the music track</div>
              <div class="chk"><span class="box" style="border-color:var(--ai)"></span><span>Split clips on drops 1 to 8 <span class="dim">(3 of 8)</span></span></div>
              <div class="chk"><span class="box"></span><span class="sub">Play back and check the rhythm</span></div>
            </div>
            <div class="row" style="gap:6px;margin-top:10px">
              <span class="btn sm primary"><i class="fa-solid fa-camera"></i>Check my timeline<span class="kbd" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)">⌘⇧2</span></span>
              <span class="btn sm"><i class="fa-regular fa-window-restore"></i>Practice in CapCut</span>
            </div>
          </div>

          <div class="suggest" style="padding:11px 13px">
            <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span><span class="dim" style="font-size:11px">from your last screenshot · 2 min ago</span></div>
            <div style="margin-top:7px">Cuts 1 to 3 land on the beat. Cut 3 is at <span class="mono">0:09.2</span>, about 0.3s after the drop at <span class="mono">0:08.9</span>. Drag its edge left until it snaps to the yellow dot.</div>
            <div class="row" style="gap:6px;margin-top:9px"><span class="btn sm">Show me where</span><span class="btn sm ghost">Explain simpler</span></div>
          </div>

          <div class="card" style="padding:10px 12px">
            <div class="h3">UP NEXT IN THIS PATH</div>
            <div class="row" style="gap:10px;margin-top:8px">
              <div style="position:relative"><img class="thumb" style="width:62px;height:38px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span class="dur">10:05</span></div>
              <div><div style="font-weight:500">Smooth transitions</div><div class="dim" style="font-size:11.5px">Opens after this practice task</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
