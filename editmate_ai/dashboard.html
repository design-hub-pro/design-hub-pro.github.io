<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-title="Dashboard" data-nav="dashboard" data-copilot="1" data-status="Beat analysis cached · 2 min ago">

<template id="main">
  <div style="padding:22px 26px 0;overflow:hidden;flex:1">
    <!-- greeting + ask -->
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="dim" style="font-size:12px">Wednesday, November 11</div>
        <div class="h1" style="margin-top:2px">Good afternoon, Marcus</div>
      </div>
      <div class="row" style="gap:8px">
        <span class="btn"><i class="fa-solid fa-file-import"></i>Import footage<span class="kbd">⌘I</span></span>
        <span class="btn primary"><i class="fa-solid fa-plus"></i>New project<span class="kbd" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)">⌘N</span></span>
      </div>
    </div>

    <div class="card" style="margin-top:16px;padding:14px 16px;border-color:var(--ai-line);background:linear-gradient(180deg,rgba(139,124,246,.10),rgba(139,124,246,.03))">
      <div class="row" style="gap:10px">
        <span class="ai-avatar" style="width:28px;height:28px;border-radius:8px;font-size:13px"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
        <div style="font-size:15px;color:var(--muted);flex:1">What are you trying to create today?</div>
        <span class="tb-btn"><i class="fa-solid fa-microphone"></i></span>
        <span class="tb-btn"><i class="fa-solid fa-camera"></i></span>
        <span class="btn primary sm"><i class="fa-solid fa-arrow-up"></i></span>
      </div>
      <div class="row" style="gap:6px;margin-top:12px;flex-wrap:wrap">
        <span class="pill" style="background:transparent">Help me make a 60-second travel vlog</span>
        <span class="pill" style="background:transparent">Organize my interview footage</span>
        <span class="pill" style="background:transparent">Find the best beats for my basketball highlights</span>
        <span class="pill" style="background:transparent">Teach me smooth transitions in CapCut</span>
      </div>
    </div>

    <!-- continue: big hero project + recents -->
    <div class="row" style="margin-top:18px;justify-content:space-between">
      <div class="h2">Pick up where you left off</div>
      <a class="dim" style="font-size:12px">All projects&nbsp;<i class="fa-solid fa-chevron-right" style="font-size:9px"></i></a>
    </div>
    <div style="display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:12px;margin-top:10px">
      <div class="card" style="overflow:hidden">
        <div style="position:relative;height:150px">
          <img class="thumb" style="width:100%;height:100%;border-radius:0" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75))"></div>
          <div style="position:absolute;left:12px;bottom:10px">
            <div style="font-size:15px;font-weight:650">Basketball Highlights</div>
            <div style="font-size:11.5px;color:#cfcfd8">Edited 12 min ago · CapCut · 0:41 of 1:00 planned</div>
          </div>
          <span class="tag" style="position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff"><i class="fa-solid fa-scissors"></i> Step 4 of 6</span>
        </div>
        <div style="padding:10px 12px" class="row">
          <div style="flex:1">
            <div class="progress"><i style="width:58%"></i></div>
            <div class="dim" style="font-size:11.5px;margin-top:5px">Next: sync clips to the 6 strong beats</div>
          </div>
          <span class="btn sm primary" style="margin-left:12px">Continue<i class="fa-solid fa-arrow-right"></i></span>
        </div>
      </div>
      <div class="card" style="overflow:hidden">
        <img class="thumb" style="width:100%;height:110px;border-radius:0" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833066-image-1.png">
        <div style="padding:10px 12px">
          <div style="font-weight:600">Volunteer Day Doc</div>
          <div class="dim" style="font-size:11.5px">Yesterday · Premiere Pro</div>
          <div class="row" style="margin-top:8px;gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Storyboard ready</span></div>
        </div>
      </div>
      <div class="card" style="overflow:hidden">
        <img class="thumb" style="width:100%;height:110px;border-radius:0" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832675-image-1.png">
        <div style="padding:10px 12px">
          <div style="font-weight:600">Yosemite Travel Vlog</div>
          <div class="dim" style="font-size:11.5px">Nov 4 · CapCut</div>
          <div class="row" style="margin-top:8px;gap:6px"><span class="tag ok"><i class="fa-solid fa-check"></i>Exported 1:02</span></div>
        </div>
      </div>
    </div>

    <!-- tools + learning -->
    <div style="display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-top:20px">
      <div>
        <div class="h2">Quick AI tools</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px">
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-regular fa-images" style="color:#60a5fa;width:16px"></i><b style="font-weight:600">Organize my media</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">Sort clips into stacks</span></div>
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-solid fa-wave-square" style="color:var(--beat);width:16px"></i><b style="font-weight:600">Analyze music beats</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">BPM and cut points</span></div>
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-solid fa-fire" style="color:#fb7185;width:16px"></i><b style="font-weight:600">Find highlights</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">Best moments in long takes</span></div>
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-regular fa-closed-captioning" style="color:var(--cut);width:16px"></i><b style="font-weight:600">Generate subtitles</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">Editable SRT in minutes</span></div>
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-solid fa-camera" style="color:var(--ai2);width:16px"></i><b style="font-weight:600">Analyze my screen</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">Ask about any button</span></div>
          <div class="card" style="padding:8px 11px"><div class="row" style="gap:9px"><i class="fa-solid fa-list-check" style="color:var(--ok);width:16px"></i><b style="font-weight:600">Start guided editing</b></div><span class="dim" style="font-size:11.5px;margin-left:auto">Step-by-step plan</span></div>
        </div>
      </div>
      <div>
        <div class="h2">Recommended lessons</div>
        <div class="card" style="margin-top:10px">
          <div class="row" style="gap:10px;padding:9px 12px">
            <div style="position:relative"><img class="thumb" style="width:64px;height:38px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png"><span class="dur">4:10</span></div>
            <div style="flex:1"><div style="font-weight:500">Cutting on the beat in CapCut</div><div class="dim" style="font-size:11.5px">Intermediate · fits your current step</div></div>
          </div>
          <div class="row hair" style="gap:10px;padding:9px 12px">
            <div style="position:relative"><img class="thumb" style="width:64px;height:38px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png"><span class="dur">6:25</span></div>
            <div style="flex:1"><div style="font-weight:500">Ducking music under interviews</div><div class="dim" style="font-size:11.5px">Beginner · you asked about this twice</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="copilot">
  <div class="row" style="height:40px;padding:0 12px;border-bottom:1px solid var(--line);gap:8px">
    <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span><b style="font-weight:600">Copilot</b>
    <span class="tag" style="margin-left:4px">Basketball Highlights</span>
    <span class="tb-btn" style="margin-left:auto"><i class="fa-regular fa-window-restore"></i></span>
  </div>
  <div style="flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div class="h3">WHILE YOU WERE AWAY</div>
    <div class="row" style="gap:9px;align-items:flex-start"><span class="done-check"><i class="fa-solid fa-check"></i></span><div><div>Sorted 214 clips into 6 stacks</div><div class="dim" style="font-size:11.5px">Scoring 48 · Defense 31 · Celebrations 22 · …</div></div></div>
    <div class="row" style="gap:9px;align-items:flex-start"><span class="done-check"><i class="fa-solid fa-check"></i></span><div><div>Analyzed "Run It Back.mp3"</div><div class="dim" style="font-size:11.5px">122 BPM · 1:04 · 6 strong drops</div></div></div>

    <div class="h3" style="margin-top:6px">SUGGESTED NEXT</div>
    <div class="suggest" style="padding:10px 11px">
      <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span><span class="dim" style="font-size:11px">not applied yet</span></div>
      <div style="margin-top:6px">Open with the buzzer-beater three at <span class="mono">00:02.10</span>, then cut on the first drop at <span class="mono">0:07.9</span>.</div>
      <div class="row" style="gap:6px;margin-top:9px"><span class="btn sm primary">Add to plan</span><span class="btn sm ghost">Why?</span></div>
    </div>
    <div class="suggest" style="padding:10px 11px">
      <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span></div>
      <div style="margin-top:6px">Coach Rivera's interview has 9 pauses over 1.5s. Trim them to save about 22 seconds.</div>
      <div class="row" style="gap:6px;margin-top:9px"><span class="btn sm">Review pauses</span></div>
    </div>
  </div>
  <div style="padding:10px 12px;border-top:1px solid var(--line)">
    <div class="composer">
      <div class="dim">Ask about your project or CapCut…</div>
      <div class="row" style="margin-top:8px;gap:4px">
        <span class="tb-btn"><i class="fa-solid fa-paperclip"></i></span><span class="tb-btn"><i class="fa-solid fa-camera"></i></span><span class="tb-btn"><i class="fa-solid fa-microphone"></i></span>
        <span class="btn primary sm" style="margin-left:auto"><i class="fa-solid fa-arrow-up"></i></span>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
