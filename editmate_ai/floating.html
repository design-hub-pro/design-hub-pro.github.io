<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Floating Copilot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .ed{position:absolute;background:#0e0e11;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-win);font-size:11px;color:#b9b9c4;display:flex;flex-direction:column}
  .ed .bar{height:38px;background:#17171b;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #26262c;flex:none}
  .ed .pane{background:#141418}
  .ed .tab{padding:3px 8px;border-radius:4px;white-space:nowrap}
  .ed .tab.on{background:#2a2a31;color:#fff}
  .clip{position:absolute;top:3px;bottom:3px;border-radius:4px;overflow:hidden;background-size:cover;background-position:center}
  .fl{position:absolute;background:rgba(28,28,33,.94);backdrop-filter:blur(30px);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.18);overflow:hidden;display:flex;flex-direction:column}
  .stp{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
  .num{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--dim);flex:none;margin-top:1px}
</style>
</head>
<body data-shell="none" data-tray="on">

<template id="overlay">
  <!-- ===== generic video editor (the user's app) ===== -->
  <div class="ed" style="left:28px;top:44px;width:1030px;height:790px">
    <div class="bar">
      <span style="display:flex;gap:7px"><i style="width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#febc2e;display:block"></i><i style="width:12px;height:12px;border-radius:50%;background:#28c840;display:block"></i></span>
      <span style="color:#fff;font-weight:600;font-size:12px;margin-left:8px">CapCut — Basketball Highlights</span>
      <span style="margin-left:auto">Media</span><span>Audio</span><span>Text</span><span>Effects</span><span>Transitions</span>
      <span style="background:#2b6cf6;color:#fff;padding:3px 12px;border-radius:4px">Export</span>
    </div>
    <div style="display:flex;height:460px;flex:none">
      <div class="pane" style="width:220px;padding:10px;border-right:1px solid #26262c">
        <div style="margin-bottom:8px">Imported · 214</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png">
          <img class="thumb" style="height:58px;width:100%;outline:2px solid #fff" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png">
          <img class="thumb" style="height:58px;width:100%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png">
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0b0d">
        <img style="width:520px;height:330px;object-fit:cover;border-radius:2px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png">
        <div style="margin-top:10px;display:flex;gap:16px;align-items:center"><span class="mono" style="font-size:10.5px">00:41:12 / 00:58:20</span><i class="fa-solid fa-play"></i><span>Full</span></div>
      </div>
      <div class="pane" style="width:230px;padding:10px;border-left:1px solid #26262c">
        <div style="display:flex;gap:3px"><span class="tab">Video</span><span class="tab">Animation</span><span class="tab on">Audio</span><span class="tab">Speed</span></div>
        <div style="margin-top:16px">Volume</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px"><div style="flex:1;height:3px;background:#2a2a31;border-radius:2px;position:relative"><i style="position:absolute;left:0;width:72%;height:3px;background:#8a8a96;display:block"></i><i style="position:absolute;left:72%;top:-4px;width:11px;height:11px;border-radius:50%;background:#ddd;display:block"></i></div><span class="mono" style="font-size:10px">0.0dB</span></div>
        <div style="margin-top:16px">Fade in / Fade out</div>
        <div style="display:flex;gap:6px;margin-top:6px"><span class="tab on">0.0s</span><span class="tab on">0.0s</span></div>
        <div style="margin-top:16px">Enhance</div>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Reduce noise</span><span style="width:22px;height:12px;border-radius:6px;background:#2b6cf6;display:inline-block"></span></div>
      </div>
    </div>
    <div style="flex:1;border-top:1px solid #26262c;background:#121215;position:relative;padding:8px 12px">
      <div style="display:flex;justify-content:space-between;font-size:10px;width:960px" class="mono"><span>00:00</span><span>00:10</span><span>00:20</span><span>00:30</span><span>00:40</span><span>00:50</span><span>01:00</span></div>
      <div style="position:absolute;left:12px;right:46px;top:34px;height:52px">
        <div class="clip" style="left:0;width:7%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png)"></div>
        <div class="clip" style="left:7.2%;width:6%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png)"></div>
        <div class="clip" style="left:13.4%;width:7%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png)"></div>
        <div class="clip" style="left:20.6%;width:6%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png)"></div>
        <div class="clip" style="left:26.8%;width:8%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png)"></div>
        <div class="clip" style="left:35%;width:8%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png)"></div>
        <div class="clip" style="left:43.2%;width:9%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png)"></div>
        <div class="clip" style="left:52.4%;width:6%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png)"></div>
        <div class="clip" style="left:68%;width:19%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png);outline:2px solid #fff"></div>
        <div class="clip" style="left:58.6%;width:9.2%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png)"></div>
        <div class="clip" style="left:87.2%;width:12%;background-image:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png)"></div>
      </div>
      <div style="position:absolute;left:12px;right:46px;top:96px;height:36px;display:flex;gap:2px">
        <div style="width:68%;background:#1d3b33;border-radius:4px;overflow:hidden;position:relative"><div style="height:100%;background:repeating-linear-gradient(90deg,#2d6b5a 0 2px,transparent 2px 5px);opacity:.8"></div><span style="position:absolute;left:6px;top:3px;color:#cde;font-size:10px">Run It Back.mp3</span></div>
        <div style="width:19%;background:#1d3b33;border-radius:4px;overflow:hidden;position:relative"><div style="height:100%;background:repeating-linear-gradient(90deg,#2d6b5a 0 2px,transparent 2px 5px);opacity:.8"></div></div>
        <div style="flex:1;background:#1d3b33;border-radius:4px;overflow:hidden"><div style="height:100%;background:repeating-linear-gradient(90deg,#2d6b5a 0 2px,transparent 2px 5px);opacity:.8"></div></div>
      </div>
      <div style="position:absolute;left:12px;right:46px;top:140px;height:24px">
        <div style="position:absolute;left:68%;width:19%;top:0;bottom:0;background:#3a2f1a;border-radius:4px;overflow:hidden"><div style="height:100%;background:repeating-linear-gradient(90deg,#8a6a2a 0 1px,transparent 1px 4px);opacity:.8"></div></div>
      </div>
      <div style="position:absolute;left:calc(12px + 68.6%);top:26px;bottom:10px;width:1px;background:#fff"></div>
    </div>
  </div>

  <!-- ===== macOS notification ===== -->
  <div class="popover row" style="position:absolute;right:14px;top:36px;width:344px;padding:11px 12px;gap:11px;align-items:flex-start;border-radius:14px">
    <span class="ai-avatar" style="width:30px;height:30px;border-radius:8px;font-size:14px"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
    <div style="flex:1;min-width:0">
      <div class="row"><b style="font-weight:600">EditMate AI</b><span class="dim" style="margin-left:auto;font-size:11px">now</span></div>
      <div style="font-size:12.5px">Step 2 done — select the music track next.</div>
      <div class="dim" style="font-size:11.5px">Checked from your 4:41 PM screenshot</div>
    </div>
  </div>

  <!-- ===== Floating Copilot · expanded ===== -->
  <div class="fl" style="left:1050px;top:120px;width:370px;height:596px">
    <div class="row" style="height:38px;padding:0 10px;gap:8px;border-bottom:1px solid var(--line);flex:none">
      <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <b style="font-weight:600">Copilot</b>
      <div class="seg" style="margin-left:6px"><span>Compact</span><span class="on">Expanded</span></div>
      <span class="tb-btn" style="margin-left:auto;min-width:24px;height:24px"><i class="fa-solid fa-thumbtack"></i></span>
      <span class="tb-btn" style="min-width:24px;height:24px"><i class="fa-regular fa-window-maximize"></i></span>
      <span class="tb-btn" style="min-width:24px;height:24px"><i class="fa-solid fa-xmark"></i></span>
    </div>
    <div class="row" style="padding:7px 12px;gap:8px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);font-size:11.5px;flex:none">
      <span class="dot"></span><span class="sub" style="white-space:nowrap">Watching CapCut</span><span class="dim">·</span><span class="sub" style="white-space:nowrap">Basketball Highlights</span>
      <div class="progress" style="width:60px;margin-left:auto"><i style="width:58%"></i></div>
    </div>

    <div style="flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden">
      <div class="msg-user" style="font-size:12.5px">How do I make the background music quieter while someone is speaking?</div>
      <div style="font-size:12.5px">Lower "Run It Back" only under Coach Rivera, from <span class="mono">0:41</span> to <span class="mono">0:52</span>. You already split it there.</div>

      <!-- annotated mini screenshot -->
      <div style="position:relative;border-radius:7px;overflow:hidden;border:1px solid var(--line2);height:104px;background:#121215">
        <div style="position:absolute;left:8px;right:8px;top:12px;height:30px;display:flex;gap:2px">
          <div style="width:62%;background:#1d3b33;border-radius:3px"></div>
          <div style="width:24%;background:#1d3b33;border-radius:3px;position:relative"></div>
          <div style="flex:1;background:#1d3b33;border-radius:3px"></div>
        </div>
        <div style="position:absolute;left:calc(8px + 62% + 0px);width:24%;top:8px;height:38px;border:2px solid var(--ai2);border-radius:5px;box-shadow:0 0 0 4px rgba(139,124,246,.3),0 0 16px rgba(139,124,246,.6)"></div>
        <div style="position:absolute;left:calc(8px + 62% - 10px);top:-1px;width:18px;height:18px;border-radius:50%;background:var(--ai);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">3</div>
        <div style="position:absolute;left:8px;right:8px;top:56px;height:20px">
          <div style="position:absolute;left:62%;width:24%;top:0;bottom:0;background:#3a2f1a;border-radius:3px"></div>
        </div>
        <div style="position:absolute;left:10px;bottom:6px;font-size:10.5px" class="dim">Timeline · music track, middle section</div>
        <span class="tag" style="position:absolute;right:6px;bottom:5px"><i class="fa-solid fa-expand"></i></span>
      </div>

      <div>
        <div class="stp"><span class="done-check"><i class="fa-solid fa-check"></i></span><span class="dim" style="text-decoration:line-through">Find Coach Rivera's clip at 0:41</span></div>
        <div class="stp"><span class="done-check"><i class="fa-solid fa-check"></i></span><span class="dim" style="text-decoration:line-through">Split the music at 0:41 and 0:52</span></div>
        <div class="stp" style="background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:6px;padding:6px 8px;margin:2px -8px"><span class="num" style="border-color:var(--ai2);background:var(--ai);color:#fff">3</span><div><div style="font-weight:600">Click the middle music piece</div><div class="sub" style="font-size:11.5px">Green track, under the interview</div></div></div>
        <div class="stp"><span class="num">4</span><span class="sub">Audio tab: set Volume to <span class="mono" style="white-space:nowrap">-12 dB</span></span></div>
        <div class="stp"><span class="num">5</span><span class="sub">Play from 0:39 to check</span></div>
      </div>

      <div class="row" style="gap:6px;flex-wrap:wrap">
        <span class="pill" style="height:22px"><i class="fa-solid fa-camera"></i>Check my screen ⌘⇧2</span>
        <span class="pill" style="height:22px"><i class="fa-solid fa-wave-square"></i>Beats</span>
        <span class="pill" style="height:22px"><i class="fa-regular fa-closed-captioning"></i>Captions</span>
        <span class="pill" style="height:22px"><i class="fa-solid fa-graduation-cap"></i>Lesson: ducking</span>
      </div>
    </div>

    <div style="padding:8px 10px;border-top:1px solid var(--line);flex:none">
      <div class="row composer" style="padding:6px 8px;gap:4px">
        <span class="dim" style="flex:1;font-size:12.5px">Ask, or hold fn to talk…</span>
        <span class="tb-btn" style="height:24px;min-width:24px"><i class="fa-solid fa-camera"></i></span>
        <span class="tb-btn" style="height:24px;min-width:24px;color:var(--ai2)"><i class="fa-solid fa-microphone"></i></span>
        <span class="btn primary sm" style="padding:0 7px"><i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </div>
  </div>

  <!-- ===== compact-mode variant ===== -->
  <div class="fl row" style="left:1070px;top:752px;width:330px;height:46px;flex-direction:row;padding:0 8px;gap:8px;border-radius:23px">
    <span class="ai-avatar" style="border-radius:50%;width:28px;height:28px"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
    <div style="flex:1;min-width:0"><div style="font-size:11px" class="dim">Step 3 of 5</div><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Click the middle music piece</div></div>
    <span class="tb-btn" style="height:26px;min-width:26px"><i class="fa-solid fa-camera"></i></span>
    <span class="tb-btn" style="height:26px;min-width:26px"><i class="fa-solid fa-microphone"></i></span>
    <span class="tb-btn" style="height:26px;min-width:26px"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></span>
  </div>
  <div style="position:absolute;left:1070px;top:806px;width:330px;text-align:center;font-size:11px;color:rgba(255,255,255,.65)">Compact mode · drag anywhere · ⌥Space to expand</div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
