<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Accessibility Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .sec-h{display:flex;align-items:center;gap:8px}
  .sec-h .ic{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .opt{display:flex;align-items:center;gap:10px;height:32px}
  .opt .lbl{flex:1}
  .desc-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .ev{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font:11px "SF Mono",Menlo,monospace;background:var(--raised);color:var(--text)}
</style>
</head>
<body data-title="Accessibility" data-nav="access" data-status="Profile: Low vision + Focus">

<template id="main">
  <div style="padding:16px 22px 0;flex:1;overflow:hidden;display:flex;flex-direction:column">
    <!-- profile bar -->
    <div class="row" style="gap:12px">
      <div>
        <div class="h1">Accessibility Studio</div>
        <div class="sub" style="font-size:12px">Settings here apply in every screen and in Floating Copilot.</div>
      </div>
      <div class="row" style="margin-left:auto;gap:8px">
        <span class="dim" style="font-size:12px">My profile</span>
        <span class="btn" style="border-color:var(--ai-line)"><i class="fa-solid fa-universal-access" style="color:var(--ai2)"></i>Low vision + Focus<i class="fa-solid fa-chevron-down" style="font-size:9px;color:var(--dim)"></i></span>
        <div class="seg"><span><i class="fa-solid fa-ear-deaf"></i>Hearing</span><span class="on"><i class="fa-solid fa-eye-low-vision"></i>Vision</span><span class="on"><i class="fa-solid fa-brain"></i>Focus</span></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px;flex:1;min-height:0">
      <!-- LEFT: vision (active, dominant) + AI content -->
      <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
        <div class="card" style="padding:14px 16px;border-color:var(--ai-line)">
          <div class="sec-h">
            <span class="ic" style="background:var(--ai-bg);color:var(--ai2)"><i class="fa-solid fa-eye-low-vision"></i></span>
            <b style="font-weight:600;font-size:14px">Vision</b><span class="tag ok">In your profile</span>
            <span class="tag" style="margin-left:auto"><i class="fa-brands fa-apple"></i>&nbsp;VoiceOver compatible</span>
          </div>

          <!-- voice navigation -->
          <div class="row" style="gap:12px;margin-top:12px;padding:10px 12px;border-radius:var(--r-card);background:var(--raised)">
            <span style="width:38px;height:38px;border-radius:50%;background:var(--ai);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(139,124,246,.18),0 0 0 12px rgba(139,124,246,.08)"><i class="fa-solid fa-microphone" style="color:#fff"></i></span>
            <div style="flex:1">
              <div style="font-weight:600">Listening<span class="dim" style="font-weight:400">&nbsp; · Say "next clip" or "describe this"</span></div>
              <div class="row" style="gap:3px;margin-top:6px;height:16px;align-items:center">
                <i style="width:3px;height:6px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:12px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:16px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:9px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:14px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:5px;background:var(--ai2);border-radius:2px"></i><i style="width:3px;height:11px;background:var(--ai2);border-radius:2px"></i>
                <span class="mono" style="margin-left:10px;color:var(--text)">"describe clip 14"</span>
              </div>
            </div>
            <span class="btn sm">Hold <span class="kbd">fn</span> to talk</span>
          </div>

          <!-- scene descriptions -->
          <div class="row" style="margin-top:12px;justify-content:space-between"><div class="h3">AI SCENE DESCRIPTIONS · SCORING STACK</div><span class="dim" style="font-size:11.5px">Read aloud at 1.2×</span></div>
          <div style="margin-top:6px">
            <div class="desc-row" style="border-top:0">
              <div style="position:relative;flex:none"><img class="thumb" style="width:84px;height:50px;outline:2px solid var(--ai);outline-offset:1px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png"><span class="dur">0:06</span></div>
              <div style="flex:1"><div class="row" style="gap:6px"><b style="font-weight:600">Clip 14</b><span class="tag ai"><i class="fa-solid fa-volume-high"></i>Speaking</span></div><div class="sub" style="margin-top:2px">Number 12 in white drives past a defender in red and lays the ball in with his right hand. Crowd stands behind the baseline.</div></div>
            </div>
            <div class="desc-row">
              <div style="position:relative;flex:none"><img class="thumb" style="width:84px;height:50px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png"><span class="dur">0:04</span></div>
              <div style="flex:1"><b style="font-weight:600">Clip 15</b><div class="sub" style="margin-top:2px">Wide shot from the sideline. A three-point attempt from the left wing, ball at the top of its arc.</div></div>
            </div>
            <div class="desc-row">
              <div style="position:relative;flex:none"><img class="thumb" style="width:84px;height:50px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png"><span class="dur">0:02</span></div>
              <div style="flex:1"><b style="font-weight:600">Clip 16</b><div class="sub" style="margin-top:2px">Close-up of the ball dropping through the net. Good for a beat drop.</div></div>
            </div>
          </div>
          <div class="row hair" style="gap:14px;padding-top:9px;margin-top:2px;font-size:11.5px;color:var(--muted)">
            <i class="fa-regular fa-keyboard"></i>
            <span><span class="kbd">J</span> <span class="kbd">L</span> prev / next clip</span>
            <span><span class="kbd">D</span> describe</span>
            <span><span class="kbd">⌘↵</span> add to plan</span>
            <span><span class="kbd">⌘+</span> text size 140%</span>
          </div>
        </div>

        <!-- AI-assisted content -->
        <div class="card" style="padding:12px 16px">
          <div class="sec-h"><span class="ic" style="background:var(--raised);color:var(--muted)"><i class="fa-solid fa-wand-magic-sparkles"></i></span><b style="font-weight:600">AI-assisted content</b><span class="dim" style="font-size:11.5px">Nothing is added to your video until you approve it</span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <div class="suggest" style="padding:9px 11px">
              <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span><b style="font-weight:600;font-size:12px">Audio description draft</b></div>
              <div class="sub" style="margin-top:5px;font-size:12px">"0:12 Coach Rivera draws a play on a whiteboard as players lean in."</div>
              <div class="row" style="gap:5px;margin-top:8px"><span class="btn sm"><i class="fa-solid fa-play"></i>Preview</span><span class="btn sm primary">Approve</span><span class="btn sm ghost">Edit</span></div>
            </div>
            <div class="suggest" style="padding:9px 11px">
              <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span><b style="font-weight:600;font-size:12px">Narration from script</b></div>
              <div class="sub" style="margin-top:5px;font-size:12px">Intro voice-over, 14s, voice "Calm 2". Script: 41 words.</div>
              <div class="row" style="gap:5px;margin-top:8px"><span class="btn sm"><i class="fa-solid fa-play"></i>Preview</span><span class="btn sm primary">Approve</span><span class="btn sm ghost">Edit</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: focus (active) + hearing (available) -->
      <div style="display:flex;flex-direction:column;gap:12px;min-height:0">
        <div class="card" style="padding:14px 16px;border-color:var(--ai-line)">
          <div class="sec-h"><span class="ic" style="background:var(--ai-bg);color:var(--ai2)"><i class="fa-solid fa-brain"></i></span><b style="font-weight:600;font-size:14px">Focus</b><span class="tag ok">In your profile</span></div>
          <div style="margin-top:8px">
            <div class="opt"><span class="lbl">Simplified interface<div class="dim" style="font-size:11px;margin-top:-2px">Hides advanced tools and panels</div></span><span class="sw-t on"></span></div>
            <div class="opt" style="margin-top:6px"><span class="lbl">Focus Mode: one task at a time</span><span class="sw-t on"></span></div>
            <div class="opt"><span class="lbl">Plain-language explanations</span><span class="sw-t on"></span></div>
            <div class="opt"><span class="lbl">Reduce motion and color</span><span class="sw-t"></span></div>
          </div>
          <div class="h3" style="margin-top:10px">FOCUS MODE PREVIEW</div>
          <div style="margin-top:6px;border-radius:var(--r-card);background:#121216;border:1px solid var(--line);padding:12px">
            <div class="dim" style="font-size:11px">Step 4 of 6</div>
            <div style="font-size:15px;font-weight:600;margin-top:2px">Line up clips with the music</div>
            <div class="sub" style="margin-top:4px">Put one clip between each pair of yellow dots. That is all for now.</div>
            <div class="progress" style="margin-top:10px"><i style="width:58%"></i></div>
            <div class="row" style="margin-top:10px;gap:6px"><span class="btn sm primary" style="flex:1;justify-content:center">I did it, next step</span><span class="btn sm">Help</span></div>
          </div>
        </div>

        <div class="card" style="padding:12px 16px;flex:1">
          <div class="sec-h"><span class="ic" style="background:var(--raised);color:var(--muted)"><i class="fa-solid fa-ear-deaf"></i></span><b style="font-weight:600">Hearing</b><span class="tag">Available</span><span class="btn sm ghost" style="margin-left:auto">Add to profile</span></div>
          <div class="h3" style="margin-top:10px">VISUAL BEATS · RUN IT BACK.MP3</div>
          <div class="row" style="gap:3px;margin-top:6px;height:24px;align-items:flex-end">
            <i style="flex:1;height:22px;background:var(--beat);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:22px;background:var(--beat);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:13px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:22px;background:var(--beat);border-radius:2px;outline:2px solid #fff"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:9px;background:var(--beat-weak);border-radius:2px"></i><i style="flex:1;height:13px;background:var(--beat-weak);border-radius:2px"></i>
          </div>
          <div class="row" style="gap:8px;margin-top:10px">
            <span class="dim" style="font-size:11.5px;width:58px">Intensity</span>
            <div style="flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#34d1bf,#f5b544 70%,#f06a6a)"></div>
            <span class="mono dim">-8 dB</span>
          </div>
          <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">
            <span class="ev">[crowd cheering]</span><span class="ev">[buzzer]</span><span class="ev">[whistle]</span><span class="ev">[sneakers squeak]</span>
          </div>
          <div class="opt" style="margin-top:6px"><span class="lbl">Captions on for all clips</span><span class="sw-t on"></span></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
