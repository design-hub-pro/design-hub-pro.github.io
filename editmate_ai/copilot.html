<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — AI Copilot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-title="AI Copilot" data-nav="copilot" data-copilot="1" data-status="Copilot reading project context">

<template id="main">
  <div class="row" style="height:40px;flex:none;padding:0 18px;border-bottom:1px solid var(--line);gap:10px">
    <b style="font-weight:600">Cutting to the music</b>
    <span class="dim" style="font-size:11.5px">Started 4:31 PM · 6 messages</span>
    <div class="row" style="margin-left:auto;gap:4px">
      <span class="tb-btn"><i class="fa-solid fa-clock-rotate-left"></i>History</span>
      <span class="tb-btn"><i class="fa-solid fa-plus"></i>New chat</span>
    </div>
  </div>

  <div style="flex:1;overflow:hidden;padding:16px 26px 0;display:flex;flex-direction:column;gap:14px">
    <!-- user Q1 -->
    <div class="msg-user">Where should I cut the video to match the music?</div>

    <!-- AI answer 1 -->
    <div class="row msg-ai" style="gap:10px;align-items:flex-start">
      <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <div style="flex:1;min-width:0">
        <div>"Run It Back.mp3" runs at <b>122 BPM</b>, so a beat lands every 0.49s. For a 60-second montage, cut on the <span style="color:var(--beat)">strong beats</span> and save the drops for your best plays.</div>

        <!-- mini beat strip -->
        <div class="card" style="margin-top:10px;padding:10px 12px">
          <div class="row" style="justify-content:space-between;font-size:11px" ><span class="dim mono">0:00</span><span class="row dim" style="gap:12px"><span><i class="fa-solid fa-circle" style="color:var(--beat);font-size:7px"></i> strong beat</span><span><i class="fa-solid fa-circle" style="color:var(--beat-weak);font-size:7px"></i> weak beat</span><span><i class="fa-solid fa-square" style="color:var(--cut);font-size:7px"></i> suggested cut</span></span><span class="dim mono">0:20</span></div>
          <div id="strip" style="position:relative;height:44px;margin-top:6px"></div>
        </div>

        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
          <div class="row" style="gap:8px"><span class="mono" style="color:var(--cut);width:48px">0:00.0</span><span>Open on the crowd for 2 beats to set the mood</span>
            <span class="pill" style="margin-left:auto;height:22px;padding:0 6px 0 2px"><img class="thumb" style="width:26px;height:16px;border-radius:999px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png">crowd_cheer_04.mov</span></div>
          <div class="row" style="gap:8px"><span class="mono" style="color:var(--cut);width:48px">0:07.9</span><span>First drop: the buzzer-beater three</span>
            <span class="pill" style="margin-left:auto;height:22px;padding:0 6px 0 2px"><img class="thumb" style="width:26px;height:16px;border-radius:999px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png">Q4_three_0211.mov</span></div>
          <div class="row" style="gap:8px"><span class="mono" style="color:var(--cut);width:48px">0:11.8</span><span>Fast cuts every 2 beats through Defense</span>
            <span class="pill" style="margin-left:auto;height:22px;padding:0 6px 0 2px"><img class="thumb" style="width:26px;height:16px;border-radius:999px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png">Defense · 8 clips</span></div>
        </div>

        <div class="row" style="gap:6px;margin-top:10px">
          <span class="btn sm primary"><i class="fa-solid fa-list-check"></i>Add 14 cut points to plan</span>
          <span class="btn sm"><i class="fa-regular fa-copy"></i>Copy timestamps</span>
          <span class="btn sm"><i class="fa-solid fa-wave-square"></i>Open in Beat Studio</span>
          <span class="tag ai" style="margin-left:4px"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested, not applied</span>
        </div>
      </div>
    </div>

    <!-- user Q2 -->
    <div class="msg-user">How do I remove background noise from Coach Rivera's interview in CapCut?</div>

    <!-- AI answer 2 -->
    <div class="row msg-ai" style="gap:10px;align-items:flex-start">
      <span class="ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <div style="flex:1;min-width:0">
        <div>The gym fan hum sits around 120 Hz. CapCut 5.2 can remove most of it in two clicks:</div>
        <div class="card" style="margin-top:8px">
          <div class="row" style="gap:10px;padding:7px 12px"><span class="tag" style="width:18px;justify-content:center">1</span>Select <span class="mono">coach_rivera_int.mov</span> on the timeline</div>
          <div class="row hair" style="gap:10px;padding:7px 12px"><span class="tag" style="width:18px;justify-content:center">2</span>Open <b style="font-weight:600">Audio</b> in the right panel, then <b style="font-weight:600">Enhance</b></div>
          <div class="row hair" style="gap:10px;padding:7px 12px"><span class="tag" style="width:18px;justify-content:center">3</span>Turn on <b style="font-weight:600">Reduce noise</b> and play 5 seconds to check</div>
        </div>
        <div class="row" style="gap:6px;margin-top:9px">
          <span class="btn sm primary"><i class="fa-solid fa-camera"></i>Show me on my screen</span>
          <span class="btn sm"><i class="fa-regular fa-window-restore"></i>Guide me in Floating mode</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:10px 26px 14px;flex:none">
    <div class="composer">
      <div class="row" style="gap:6px;margin-bottom:8px">
        <span class="tag"><i class="fa-solid fa-film"></i>Basketball Highlights</span>
        <span class="tag"><i class="fa-solid fa-music"></i>Run It Back.mp3</span>
        <span class="tag"><i class="fa-solid fa-display"></i>CapCut window</span>
      </div>
      <div class="dim">Ask a follow-up, or press ⌘⇧2 to send a screenshot…</div>
      <div class="row" style="margin-top:8px;gap:4px">
        <span class="tb-btn"><i class="fa-solid fa-paperclip"></i></span><span class="tb-btn"><i class="fa-solid fa-camera"></i></span><span class="tb-btn"><i class="fa-solid fa-microphone"></i></span>
        <span class="dim" style="font-size:11px;margin-left:8px">Plain language</span><span class="sw-t on" style="margin-left:6px"></span>
        <span class="btn primary sm" style="margin-left:auto"><i class="fa-solid fa-arrow-up"></i></span>
      </div>
    </div>
  </div>
</template>

<template id="copilot">
  <div class="row" style="height:40px;padding:0 12px;border-bottom:1px solid var(--line);gap:8px">
    <b style="font-weight:600">Project context</b>
    <span class="dim" style="font-size:11px;margin-left:auto">What Copilot can see</span>
  </div>
  <div style="flex:1;padding:12px;display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <div>
      <div class="h3">CURRENT STEP</div>
      <div class="card" style="padding:9px 10px;margin-top:6px">
        <div class="row" style="justify-content:space-between"><b style="font-weight:600">4 · Sync clips to beats</b><span class="dim" style="font-size:11px">4 of 6</span></div>
        <div class="progress" style="margin-top:7px"><i style="width:58%"></i></div>
      </div>
    </div>
    <div>
      <div class="h3">MEDIA STACKS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png"><span style="font-size:12px">Scoring</span><span class="dim" style="font-size:11px;margin-left:auto">48</span></div>
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png"><span style="font-size:12px">Defense</span><span class="dim" style="font-size:11px;margin-left:auto">31</span></div>
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span style="font-size:12px">Celebrations</span><span class="dim" style="font-size:11px;margin-left:auto">22</span></div>
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png"><span style="font-size:12px">Interviews</span><span class="dim" style="font-size:11px;margin-left:auto">14</span></div>
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png"><span style="font-size:12px">Crowd &amp; Bench</span><span class="dim" style="font-size:11px;margin-left:auto">37</span></div>
        <div class="row" style="gap:7px"><img class="thumb" style="width:30px;height:20px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png"><span style="font-size:12px">B-Roll</span><span class="dim" style="font-size:11px;margin-left:auto">62</span></div>
      </div>
    </div>
    <div>
      <div class="h3">MUSIC</div>
      <div class="card row" style="padding:8px 10px;margin-top:6px;gap:10px">
        <span style="width:30px;height:30px;border-radius:6px;background:var(--warn-bg);color:var(--beat);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-music"></i></span>
        <div style="flex:1"><div style="font-weight:500">Run It Back.mp3</div><div class="dim" style="font-size:11px">122 BPM · 1:04 · 6 drops · 31 cut points</div></div>
      </div>
    </div>
    <div>
      <div class="h3">EARLIER CONVERSATIONS</div>
      <div style="margin-top:4px">
        <div class="row" style="height:28px;gap:8px;font-size:12.5px"><i class="fa-regular fa-comment dim"></i>Opening 10 seconds ideas<span class="dim" style="margin-left:auto;font-size:11px">2:10 PM</span></div>
        <div class="row" style="height:28px;gap:8px;font-size:12.5px"><i class="fa-regular fa-comment dim"></i>Which clips feature #12?<span class="dim" style="margin-left:auto;font-size:11px">Yesterday</span></div>
        <div class="row" style="height:28px;gap:8px;font-size:12.5px"><i class="fa-regular fa-comment dim"></i>Exporting for Instagram Reels<span class="dim" style="margin-left:auto;font-size:11px">Nov 8</span></div>
        <div class="row" style="height:28px;gap:8px;font-size:12.5px"><i class="fa-regular fa-comment dim"></i>Speed ramp on the dunk<span class="dim" style="margin-left:auto;font-size:11px">Nov 7</span></div>
      </div>
    </div>
  </div>
  <div class="row" style="padding:9px 12px;border-top:1px solid var(--line);gap:8px;font-size:11.5px" ><i class="fa-solid fa-lock dim"></i><span class="dim">Screenshots stay on this Mac unless you send them.</span></div>
</template>

<script src="assets/shell.js"></script>
<script>
// draw mini beat strip: 41 beats over 20s
(function(){const s=document.getElementById('strip');if(!s)return;let h='';
 for(let i=0;i<120;i++){const a=Math.abs(Math.sin(i*.37)*.6+Math.sin(i*.11)*.4);h+=`<i style="position:absolute;left:${i/120*100}%;bottom:${22-a*16}px;width:2px;height:${6+a*32}px;background:var(--wave);border-radius:1px"></i>`;}
 for(let b=0;b<41;b++){const strong=b%4===0;h+=`<i style="position:absolute;left:${b/41*100}%;top:0;width:${strong?3:2}px;height:${strong?44:12}px;background:${strong?'var(--beat)':'var(--beat-weak)'};opacity:${strong?.9:.7};border-radius:1px"></i>`;}
 [0,16,24,28,32].forEach(b=>{h+=`<i style="position:absolute;left:calc(${b/41*100}% - 3px);bottom:-2px;width:8px;height:8px;background:var(--cut);transform:rotate(45deg)"></i>`});
 s.innerHTML=h;})();
</script>
</body>
</html>
