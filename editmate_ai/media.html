<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>EditMate AI — Media Organizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  .stack{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .clip{position:relative}
  .clip img{width:100%;height:50px}
  .clip.match{outline:2px solid var(--ai);outline-offset:1px;border-radius:5px}
  .clip.sel{outline:2px solid #fff;outline-offset:1px;border-radius:5px}
</style>
</head>
<body data-title="Media Organizer" data-nav="media" data-copilot="1" data-status="Stacks updated · 214 of 214 clips analyzed">

<template id="main">
  <!-- toolbar -->
  <div class="row" style="height:48px;padding:0 18px;gap:10px;border-bottom:1px solid var(--line)">
    <div class="input" style="flex:1;border-color:var(--ai-line);color:var(--text);background:var(--ai-bg)">
      <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--ai2);font-size:12px"></i>
      Find clips where people are smiling
      <span class="tag ai" style="margin-left:auto">17 matches</span>
      <i class="fa-solid fa-xmark dim"></i>
    </div>
    <div class="seg"><span class="on"><i class="fa-solid fa-layer-group"></i>Stacks</span><span><i class="fa-solid fa-table-cells"></i>Library</span><span><i class="fa-solid fa-film"></i>Storyboard</span></div>
    <span class="tb-btn"><i class="fa-solid fa-sliders"></i></span>
  </div>

  <div style="padding:14px 18px 0;flex:1;overflow:hidden">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="h2">AI stacks <span class="dim" style="font-weight:400">· 6 groups from 214 clips</span></div>
        <div class="dim" style="font-size:11.5px;margin-top:2px">Sorted by what happens in each shot. Rename, merge or drag clips between stacks.</div>
      </div>
      <span class="btn sm"><i class="fa-solid fa-plus"></i>New stack</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <!-- Scoring -->
      <div class="stack">
        <div class="row" style="gap:8px"><span class="sw" style="width:8px;height:8px;border-radius:2px;background:#f97316;display:inline-block"></span><b style="font-weight:600">Scoring</b><span class="dim">48 clips · 9:42</span><span class="tag ai" style="margin-left:auto">6 smiling</span></div>
        <div class="grid4">
          <div class="clip match"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png" style="object-position:50% 30%"><span class="dur">0:12</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831638-image-1.png"><span class="dur">0:08</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png"><span class="dur">0:04</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--raised);border-radius:5px;color:var(--muted);font-size:12px">+45</div>
        </div>
      </div>
      <!-- Defense (context menu) -->
      <div class="stack" style="border-color:var(--line2);background:var(--raised)">
        <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:#60a5fa;display:inline-block"></span><b style="font-weight:600">Defense</b><span class="dim">31 clips · 5:18</span></div>
        <div class="grid4">
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png"><span class="dur">0:06</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833052-image-1.png" style="object-position:20% 80%"><span class="dur">0:09</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png" style="object-position:90% 60%"><span class="dur">0:05</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--hover);border-radius:5px;color:var(--muted);font-size:12px">+28</div>
        </div>
      </div>
      <!-- Celebrations -->
      <div class="stack">
        <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--ok);display:inline-block"></span><b style="font-weight:600">Team Celebrations</b><span class="dim">22 clips · 3:51</span><span class="tag ai" style="margin-left:auto">9 smiling</span></div>
        <div class="grid4">
          <div class="clip sel"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span class="dur">0:12</span></div>
          <div class="clip match"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png" style="object-position:80% 40%"><span class="dur">0:07</span></div>
          <div class="clip match"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png" style="object-position:30% 50%"><span class="dur">0:10</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--raised);border-radius:5px;color:var(--muted);font-size:12px">+19</div>
        </div>
      </div>
      <!-- Interviews -->
      <div class="stack">
        <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--ai);display:inline-block"></span><b style="font-weight:600">Interviews</b><span class="dim">14 clips · 18:07</span><span class="tag ai" style="margin-left:auto">2 smiling</span></div>
        <div class="grid4">
          <div class="clip match"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png"><span class="dur">4:38</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png"><span class="dur">2:15</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png" style="object-position:20% 30%"><span class="dur">1:42</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--raised);border-radius:5px;color:var(--muted);font-size:12px">+11</div>
        </div>
      </div>
      <!-- Crowd & Bench -->
      <div class="stack">
        <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:#fb7185;display:inline-block"></span><b style="font-weight:600">Crowd &amp; Bench</b><span class="dim">37 clips · 6:20</span></div>
        <div class="grid4">
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png"><span class="dur">0:15</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png"><span class="dur">0:09</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png" style="object-position:80% 50%"><span class="dur">0:11</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--raised);border-radius:5px;color:var(--muted);font-size:12px">+34</div>
        </div>
      </div>
      <!-- B-Roll -->
      <div class="stack">
        <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:2px;background:var(--beat-weak);display:inline-block"></span><b style="font-weight:600">B-Roll</b><span class="dim">62 clips · 11:03</span></div>
        <div class="grid4">
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831574-image-1.png" style="object-position:50% 20%"><span class="dur">0:06</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png" style="object-position:90% 20%"><span class="dur">0:14</span></div>
          <div class="clip"><img class="thumb" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831627-image-1.png" style="object-position:80% 80%"><span class="dur">0:05</span></div>
          <div class="clip" style="display:flex;align-items:center;justify-content:center;height:50px;background:var(--raised);border-radius:5px;color:var(--muted);font-size:12px">+59</div>
        </div>
      </div>
    </div>

    <!-- drop target -->
    <div class="row" style="margin-top:12px;height:58px;border:1.5px dashed var(--line2);border-radius:var(--r-card);justify-content:center;gap:10px;color:var(--muted)">
      
      <i class="fa-solid fa-cloud-arrow-up" style="font-size:16px"></i>
      <span>Drop footage or a folder to add it to this project</span>
      <span class="dim" style="font-size:11.5px">· MOV, MP4, WAV, MP3, JPG · stays on this Mac</span>
    </div>
    <!-- search results -->
    <div style="margin-top:14px">
      <div class="row" style="gap:8px"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--ai2);font-size:11px"></i><span class="h2">"people are smiling"</span><span class="dim">17 matches across 4 stacks · showing best 8</span><span class="btn sm ghost" style="margin-left:auto">Show all 17</span><span class="btn sm"><i class="fa-solid fa-layer-group"></i>Save as stack</span></div>
      <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:9px"><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:50% 50%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span class="dur">0:12</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Celebrations</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:85% 40%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span class="dur">0:07</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Celebrations</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:30% 50%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png"><span class="dur">0:10</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Crowd</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:50% 30%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832803-image-1.png"><span class="dur">0:12</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Scoring</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:50% 40%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410832467-image-1.png"><span class="dur">4:38</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Interviews</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:80% 30%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410833114-image-1.png"><span class="dur">0:09</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Crowd</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:20% 60%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png"><span class="dur">0:05</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Celebrations</div></div><div><div style="position:relative"><img class="thumb" style="width:100%;height:62px;object-position:60% 40%" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831669-image-1.png"><span class="dur">0:11</span></div><div class="dim" style="font-size:10.5px;margin-top:3px">Bench</div></div></div>
    </div>
  </div>
</template>

<template id="copilot">
  <div class="row" style="height:40px;padding:0 12px;border-bottom:1px solid var(--line);gap:8px">
    <i class="fa-solid fa-circle-info dim"></i><b style="font-weight:600">Clip inspector</b>
    <span class="tb-btn" style="margin-left:auto"><i class="fa-solid fa-xmark"></i></span>
  </div>
  <div style="flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div style="position:relative">
      <img class="thumb" style="width:100%;height:160px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794410831946-image-1.png">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-play" style="font-size:13px;margin-left:2px"></i></span>
      <span class="dur">0:12</span>
    </div>
    <div>
      <div class="mono" style="font-size:12.5px;color:var(--text)">IMG_4471.MOV</div>
      <div class="dim" style="font-size:11.5px;margin-top:2px">0:12 · 3840×2160 · 4K 60fps · HEVC · 312 MB</div>
      <div class="dim" style="font-size:11.5px">Recorded Nov 8, 8:47 PM · iPhone 15 Pro</div>
    </div>
    <div>
      <div class="h3">AI TAGS</div>
      <div class="row" style="gap:5px;flex-wrap:wrap;margin-top:6px">
        <span class="tag ai">Celebration</span><span class="tag ai">Smiling</span><span class="tag ai">Group hug</span><span class="tag ai">Final buzzer</span><span class="tag">+ Add tag</span>
      </div>
    </div>
    <div>
      <div class="h3">PEOPLE DETECTED</div>
      <div class="row" style="gap:6px;margin-top:6px">
        <img class="avatar" style="width:24px;height:24px" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=60&h=60&fit=crop">
        <img class="avatar" style="width:24px;height:24px" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=60&h=60&fit=crop">
        <img class="avatar" style="width:24px;height:24px" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=60&h=60&fit=crop">
        <span class="dim" style="font-size:11.5px">#12 Devin, #4 Jamal +5 unnamed</span>
      </div>
    </div>
    <div class="suggest" style="padding:10px 11px">
      <div class="row" style="gap:6px"><span class="tag ai"><i class="fa-solid fa-wand-magic-sparkles"></i>Suggested</span><span class="dim" style="font-size:11px">Why this stack</span></div>
      <div style="margin-top:6px;font-size:12.5px">Seven players are jumping with arms raised within 2s of the scoreboard reaching 0:00. Good closing shot.</div>
      <div class="row" style="gap:6px;margin-top:8px"><span class="btn sm primary">Keep here</span><span class="btn sm ghost">Move…</span></div>
    </div>
    <div class="row" style="gap:6px;margin-top:auto">
      <span class="btn sm" style="flex:1;justify-content:center"><i class="fa-solid fa-film"></i>Add to storyboard</span>
      <span class="btn sm"><i class="fa-solid fa-arrow-up-right-from-square"></i>Open in CapCut</span>
    </div>
  </div>
</template>

<template id="overlay">
  <div class="popover menu" style="position:absolute;left:820px;top:296px;width:236px;z-index:5">
    <div><i class="fa-solid fa-pen" style="width:14px"></i>Rename stack<span class="k">↩</span></div>
    <div class="sel"><i class="fa-solid fa-object-group" style="width:14px"></i>Merge with…<span class="k">⌘M</span></div>
    <div><i class="fa-solid fa-film" style="width:14px"></i>Move to storyboard<span class="k">⌘⇧S</span></div>
    <div><i class="fa-solid fa-wand-magic-sparkles" style="width:14px"></i>Split by player</div>
    <hr>
    <div><i class="fa-solid fa-arrow-up-right-from-square" style="width:14px"></i>Send to CapCut</div>
    <div><i class="fa-regular fa-folder-open" style="width:14px"></i>Show in Finder<span class="k">⌥⌘R</span></div>
    <hr>
    <div style="color:var(--bad)"><i class="fa-solid fa-trash" style="width:14px"></i>Remove stack<span class="k">⌫</span></div>
  </div>
</template>

<script src="assets/shell.js"></script>
</body>
</html>
