<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: #fff; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0; height: 59px; position: relative; z-index: 10; }
  .status-bar-time { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-bar-icons { display: flex; gap: 6px; align-items: center; font-size: 15px; }
  .status-bar-icons i { font-size: 14px; }

  .screen { width: 100%; height: 100%; position: relative; overflow: hidden; }

  .bg-gradient {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(88,92,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 70%, rgba(0,210,180,0.1) 0%, transparent 50%),
                #0a0a1a;
  }

  .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; height: calc(100% - 59px); padding: 0 28px; }

  .illustration {
    margin-top: 40px;
    width: 280px; height: 280px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  .pad-visual {
    width: 200px; height: 180px;
    background: linear-gradient(135deg, rgba(88,92,255,0.3), rgba(0,210,180,0.3));
    border-radius: 40px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(88,92,255,0.4);
  }

  .pad-visual::before {
    content: '';
    position: absolute; width: 240px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88,92,255,0.08) 0%, transparent 70%);
    animation: pulse-ring 3s ease-in-out infinite;
  }

  @keyframes pulse-ring { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 1; } }

  .sensor-dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; }
  .sensor-dot {
    width: 18px; height: 18px; border-radius: 50%;
    animation: sensor-glow 2s ease-in-out infinite;
  }
  .sensor-dot:nth-child(1) { background: #585cff; animation-delay: 0s; }
  .sensor-dot:nth-child(2) { background: #00d2b4; animation-delay: 0.3s; }
  .sensor-dot:nth-child(3) { background: #585cff; animation-delay: 0.6s; }
  .sensor-dot:nth-child(4) { background: #00d2b4; animation-delay: 0.9s; }
  .sensor-dot:nth-child(5) { background: #00d2b4; animation-delay: 0.2s; }
  .sensor-dot:nth-child(6) { background: #585cff; animation-delay: 0.5s; }
  .sensor-dot:nth-child(7) { background: #00d2b4; animation-delay: 0.8s; }
  .sensor-dot:nth-child(8) { background: #585cff; animation-delay: 1.1s; }

  @keyframes sensor-glow {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px currentColor; }
  }

  .text-area { text-align: center; margin-top: 48px; }
  .text-area h1 { font-size: 32px; font-weight: 800; margin-bottom: 14px; line-height: 1.2; }
  .text-area h1 span { background: linear-gradient(135deg, #585cff, #00d2b4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .text-area p { font-size: 16px; color: rgba(255,255,255,0.55); line-height: 1.6; max-width: 320px; margin: 0 auto; }

  .page-dots { display: flex; gap: 8px; margin-top: 40px; }
  .page-dots .dot { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.2); }
  .page-dots .dot.active { width: 24px; background: linear-gradient(135deg, #585cff, #00d2b4); }

  .bottom-area { position: absolute; bottom: 48px; left: 28px; right: 28px; z-index: 5; }
  .btn-connect {
    width: 100%; height: 58px;
    background: linear-gradient(135deg, #585cff, #00d2b4);
    border: none; border-radius: 18px;
    color: #fff; font-size: 17px; font-weight: 700;
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(88,92,255,0.35);
  }
  .btn-skip { text-align: center; margin-top: 16px; color: rgba(255,255,255,0.4); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-gradient"></div>
  <div class="status-bar">
    <div class="status-bar-time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="status-bar-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>
  <div class="content">
    <div class="illustration">
      <div class="pad-visual">
        <div class="sensor-dots">
          <div class="sensor-dot"></div><div class="sensor-dot"></div>
          <div class="sensor-dot"></div><div class="sensor-dot"></div>
          <div class="sensor-dot"></div><div class="sensor-dot"></div>
          <div class="sensor-dot"></div><div class="sensor-dot"></div>
        </div>
      </div>
    </div>
    <div class="text-area">
      <h1>Sit Smarter with<br><span>PosturePad</span></h1>
      <p>Your AI-powered sitting companion that monitors posture and guides you to healthier habits.</p>
    </div>
    <div class="page-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <div class="bottom-area">
    <button class="btn-connect"><i class="fas fa-bluetooth-b"></i> Connect Your Pad</button>
    <div class="btn-skip">Skip for now</div>
  </div>
</div>
</body>
</html>
