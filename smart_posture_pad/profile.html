<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: #fff; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0; height: 59px; position: relative; z-index: 10; }
  .status-bar-time { font-size: 17px; font-weight: 600; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-bar-icons { display: flex; gap: 6px; align-items: center; }
  .status-bar-icons i { font-size: 14px; }

  .screen { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .content { flex: 1; overflow-y: auto; padding: 0 28px 100px; }

  .page-header { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 24px; }
  .page-title { font-size: 22px; font-weight: 700; }
  .settings-icon { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .profile-hero { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 28px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #585cff, #00d2b4);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #fff;
    box-shadow: 0 8px 24px rgba(88,92,255,0.3);
  }
  .profile-name { font-size: 22px; font-weight: 700; }
  .profile-email { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

  .streak-card {
    background: linear-gradient(145deg, rgba(255,159,67,0.12), rgba(255,107,149,0.08));
    border: 1px solid rgba(255,159,67,0.2);
    border-radius: 24px; padding: 22px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .streak-fire { font-size: 40px; }
  .streak-info { flex: 1; }
  .streak-val { font-size: 28px; font-weight: 800; color: #ff9f43; }
  .streak-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .streak-days { display: flex; gap: 6px; margin-top: 10px; }
  .streak-day {
    width: 28px; height: 28px; border-radius: 8px; font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .streak-day.done { background: rgba(255,159,67,0.2); color: #ff9f43; }
  .streak-day.today { background: linear-gradient(135deg, #ff9f43, #ff6b95); color: #fff; }
  .streak-day.future { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.25); }

  .goals-section { margin-bottom: 24px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .goal-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 18px; margin-bottom: 10px;
  }
  .goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .goal-info { display: flex; align-items: center; gap: 10px; }
  .goal-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .goal-icon.purple { background: rgba(88,92,255,0.15); color: #585cff; }
  .goal-icon.teal { background: rgba(0,210,180,0.15); color: #00d2b4; }
  .goal-icon.orange { background: rgba(255,159,67,0.15); color: #ff9f43; }
  .goal-name { font-size: 14px; font-weight: 600; }
  .goal-val { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.6); }
  .goal-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .goal-bar-fill { height: 100%; border-radius: 3px; }
  .goal-bar-fill.purple { background: linear-gradient(to right, #585cff, #7b7fff); width: 72%; }
  .goal-bar-fill.teal { background: linear-gradient(to right, #00d2b4, #4de8d0); width: 85%; }
  .goal-bar-fill.orange { background: linear-gradient(to right, #ff9f43, #ffbf80); width: 60%; }

  .achievements { margin-bottom: 24px; }
  .badge-row { display: flex; gap: 12px; }
  .badge {
    flex: 1; text-align: center; padding: 18px 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
  }
  .badge-icon { font-size: 28px; margin-bottom: 8px; }
  .badge-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
    background: rgba(10,10,26,0.95); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: 10px; z-index: 20;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.35); }
  .tab-item i { font-size: 22px; }
  .tab-item.active { color: #585cff; }
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <div class="status-bar-time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="status-bar-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>
  <div class="content">
    <div class="page-header">
      <div class="page-title">Profile</div>
      <div class="settings-icon"><i class="fas fa-gear"></i></div>
    </div>

    <div class="profile-hero">
      <div class="avatar">A</div>
      <div class="profile-name">Alex Johnson</div>
      <div class="profile-email">alex@posturepad.com</div>
    </div>

    <div class="streak-card">
      <div class="streak-fire">🔥</div>
      <div class="streak-info">
        <div class="streak-val">14 Days</div>
        <div class="streak-label">Posture Streak</div>
        <div class="streak-days">
          <div class="streak-day done">M</div>
          <div class="streak-day done">T</div>
          <div class="streak-day done">W</div>
          <div class="streak-day done">T</div>
          <div class="streak-day done">F</div>
          <div class="streak-day today">S</div>
          <div class="streak-day future">S</div>
        </div>
      </div>
    </div>

    <div class="goals-section">
      <div class="section-title">Daily Goals</div>
      <div class="goal-card">
        <div class="goal-top">
          <div class="goal-info">
            <div class="goal-icon purple"><i class="fas fa-bullseye"></i></div>
            <div class="goal-name">Posture Score > 80</div>
          </div>
          <div class="goal-val">72/80</div>
        </div>
        <div class="goal-bar"><div class="goal-bar-fill purple"></div></div>
      </div>
      <div class="goal-card">
        <div class="goal-top">
          <div class="goal-info">
            <div class="goal-icon teal"><i class="fas fa-person-walking"></i></div>
            <div class="goal-name">Take 6 Breaks</div>
          </div>
          <div class="goal-val">5/6</div>
        </div>
        <div class="goal-bar"><div class="goal-bar-fill teal"></div></div>
      </div>
      <div class="goal-card">
        <div class="goal-top">
          <div class="goal-info">
            <div class="goal-icon orange"><i class="fas fa-spa"></i></div>
            <div class="goal-name">3 Stretch Sessions</div>
          </div>
          <div class="goal-val">2/3</div>
        </div>
        <div class="goal-bar"><div class="goal-bar-fill orange"></div></div>
      </div>
    </div>

    <div class="achievements">
      <div class="section-title">Achievements</div>
      <div class="badge-row">
        <div class="badge">
          <div class="badge-icon">🏆</div>
          <div class="badge-name">Perfect Week</div>
        </div>
        <div class="badge">
          <div class="badge-icon">💎</div>
          <div class="badge-name">14-Day Streak</div>
        </div>
        <div class="badge">
          <div class="badge-icon">⚡</div>
          <div class="badge-name">Early Riser</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item"><i class="fas fa-fire"></i><span>Posture</span></div>
    <div class="tab-item"><i class="fas fa-spa"></i><span>Rest</span></div>
    <div class="tab-item"><i class="fas fa-chart-simple"></i><span>Insights</span></div>
    <div class="tab-item active"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
