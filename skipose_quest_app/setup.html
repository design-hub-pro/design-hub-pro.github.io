<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Camera setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cam{position:absolute;left:0;right:0;top:0;height:600px;background:url(img/living.jpg) 50% 60%/cover;border-radius:0 0 34px 34px;overflow:hidden}
.cam:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,51,.55) 0%,rgba(11,27,51,0) 22%,rgba(11,27,51,0) 80%,rgba(11,27,51,.4))}
.frm{position:absolute;left:96px;right:96px;top:150px;bottom:40px;z-index:3}
.frm i{position:absolute;width:34px;height:34px;border-color:#4ADE80;border-style:solid}
.frm .a{top:0;left:0;border-width:5px 0 0 5px;border-radius:14px 0 0 0}
.frm .b{top:0;right:0;border-width:5px 5px 0 0;border-radius:0 14px 0 0}
.frm .c{bottom:0;left:0;border-width:0 0 5px 5px;border-radius:0 0 0 14px}
.frm .d{bottom:0;right:0;border-width:0 5px 5px 0;border-radius:0 0 14px 0}
.chk{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:0}
.tick{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none}
</style></head>
<body><div class="screen">
<div class="cam"></div>
<div class="frm"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i>
  <span class="pill absolute -top-12 left-1/2 -translate-x-1/2 whitespace-nowrap" style="background:#22C55E;color:#fff"><i class="fa-solid fa-person"></i>Whole body found</span>
</div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad relative z-10 mt-3 flex items-center justify-between">
  <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
  <span class="pill glass"><i class="fa-solid fa-camera-rotate"></i>Front camera</span>
  <div class="iconbtn glass"><i class="fa-solid fa-volume-high"></i></div>
</div>

<div class="absolute left-0 right-0 bottom-0 z-10 pad pb-12">
  <div class="flex items-end justify-between">
    <div><div class="meta">Step 1 of 2</div><div class="h1 mt-1.5">Get in frame</div></div>
    <div class="ring"><svg width="62" height="62"><circle cx="31" cy="31" r="26" stroke="#E6EDF5" stroke-width="7" fill="none"/><circle cx="31" cy="31" r="26" stroke="#22C55E" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="41"/></svg><div class="v text-[15px] font-extrabold num">3/4</div></div>
  </div>
  <div class="card px-4 mt-4">
    <div class="chk"><div class="tick" style="background:#22C55E"><i class="fa-solid fa-check"></i></div><div class="flex-1 text-[14.5px] font-bold">Head to toes visible</div><span class="text-[12.5px] font-bold text-slate-400">17 joints</span></div>
    <div class="chk"><div class="tick" style="background:#22C55E"><i class="fa-solid fa-check"></i></div><div class="flex-1 text-[14.5px] font-bold">About 2.5 m from phone</div><span class="text-[12.5px] font-bold text-slate-400 num">2.4 m</span></div>
    <div class="chk"><div class="tick" style="background:#22C55E"><i class="fa-solid fa-check"></i></div><div class="flex-1 text-[14.5px] font-bold">Bright enough</div><span class="dot" style="background:#22C55E"></span></div>
    <div class="chk"><div class="tick" style="background:#F59E0B"><i class="fa-solid fa-exclamation"></i></div><div class="flex-1 text-[14.5px] font-bold">Clear space to the left</div><span class="text-[12.5px] font-bold" style="color:#D97706">Move sofa?</span></div>
  </div>
  <div class="btn mt-4"><i class="fa-solid fa-hand"></i>Raise a hand to start</div>
</div>
<div class="homebar"></div>
</div></body></html>
