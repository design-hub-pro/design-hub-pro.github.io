<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Live play</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cam{position:absolute;inset:0;background:url(img/living.jpg) center/cover}
.cam:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,51,.6) 0%,rgba(11,27,51,0) 20%,rgba(11,27,51,0) 58%,rgba(11,27,51,.92) 82%)}
.bone{stroke:#38BDF8;stroke-width:11;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 10px rgba(56,189,248,.95))}
.bone.warn{stroke:#FB923C;filter:drop-shadow(0 0 10px rgba(251,146,60,.95))}
.ghost{stroke:rgba(255,255,255,.85);stroke-width:7;stroke-dasharray:4 14;stroke-linecap:round;fill:none}
.jt{fill:#fff;stroke:#0EA5E9;stroke-width:6}
.jt.warn{stroke:#F97316}
.pip{width:104px;height:138px;border-radius:20px;background:url(img/coach.jpg) center 35%/cover;border:3px solid rgba(255,255,255,.9);position:relative;overflow:hidden}
.seg{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.22);position:relative}
.seg.d{background:#38BDF8}
.seg.c{background:linear-gradient(90deg,#38BDF8 55%,rgba(255,255,255,.22) 55%)}
.cp{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;border:2.5px solid #0B1B33}
.mt{flex:1;padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tip{animation:bob 1.6s ease-in-out infinite}
</style></head>
<body><div class="screen" style="background:#0B1B33">
<div class="cam"></div>
<svg class="absolute inset-0 w-full h-full z-[4]" viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
  <!-- coach target (ghost) -->
  <g class="ghost">
    <polyline points="500,722 462,808 415,866"/><polyline points="580,722 612,808 665,870"/>
    <line x1="500" y1="722" x2="580" y2="722"/>
  </g>
  <!-- player skeleton -->
  <g class="bone">
    <line x1="537" y1="522" x2="540" y2="700"/>
    <polyline points="355,630 410,595 470,550 610,550 665,600 715,640"/>
    <line x1="500" y1="700" x2="580" y2="700"/>
    <polyline points="500,700 450,790 415,865"/>
  </g>
  <g class="bone warn"><polyline points="580,700 625,785 665,870"/></g>
  <circle cx="535" cy="462" r="20" class="jt"/>
  <g class="jt"><circle cx="470" cy="550" r="11"/><circle cx="610" cy="550" r="11"/><circle cx="410" cy="595" r="10"/><circle cx="665" cy="600" r="10"/><circle cx="355" cy="630" r="10"/><circle cx="715" cy="640" r="10"/><circle cx="500" cy="700" r="11"/><circle cx="580" cy="700" r="11"/><circle cx="450" cy="790" r="11"/><circle cx="415" cy="865" r="10"/></g>
  <g class="jt warn"><circle cx="625" cy="785" r="14"/><circle cx="665" cy="870" r="10"/></g>
</svg>

<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

<div class="pad relative z-10 mt-3 flex items-start justify-between text-white">
  <div>
    <div class="flex items-center gap-2"><span class="live"></span><span class="text-[12px] font-extrabold tracking-[1.6px] uppercase opacity-85">Pizza Stop · Rep 2/3</span></div>
    <div class="text-[44px] font-extrabold tracking-[-2px] num leading-none mt-2">1,240</div>
    <span class="pill mt-2.5" style="background:var(--gradSun);color:#fff"><i class="fa-solid fa-bolt"></i>Combo x3</span>
  </div>
  <div class="pip"><span class="absolute left-2 bottom-2 pill glass" style="padding:3px 8px;font-size:10.5px">Coach</span></div>
</div>

<div class="tip absolute z-10 left-[292px] top-[606px]">
  <div class="rounded-[16px] px-3.5 py-2.5 text-white text-[13.5px] font-extrabold flex items-center gap-2" style="background:#F97316;box-shadow:0 10px 22px -8px rgba(249,115,22,.8)"><i class="fa-solid fa-arrow-down"></i>Bend knee</div>
</div>

<div class="absolute left-0 right-0 bottom-0 z-10 pad pb-11 text-white">
  <div class="flex items-center justify-between">
    <div class="text-[22px] font-extrabold tracking-tight">Press the wedge</div>
    <div class="text-[13px] font-bold opacity-75 num">0:07 / 0:12</div>
  </div>
  <div class="flex gap-1.5 mt-3.5 relative">
    <div class="seg d"><span class="cp" style="left:100%;background:#4ADE80"></span></div>
    <div class="seg d"><span class="cp" style="left:100%;background:#4ADE80"></span></div>
    <div class="seg c"><span class="cp" style="left:100%;background:#fff"></span></div>
    <div class="seg"></div>
  </div>
  <div class="flex justify-between text-[11px] font-bold opacity-65 mt-2.5"><span>Glide</span><span>Wedge</span><span>Press</span><span>Stop</span></div>

  <div class="flex gap-2 mt-5">
    <div class="mt"><div class="flex items-center gap-1.5 text-[11.5px] font-bold opacity-75"><span class="dot" style="background:#F97316"></span>Stance</div><div class="text-[24px] font-extrabold num mt-1">72</div></div>
    <div class="mt"><div class="flex items-center gap-1.5 text-[11.5px] font-bold opacity-75"><span class="dot" style="background:#4ADE80"></span>Balance</div><div class="text-[24px] font-extrabold num mt-1">91</div></div>
    <div class="mt"><div class="flex items-center gap-1.5 text-[11.5px] font-bold opacity-75"><span class="dot" style="background:#4ADE80"></span>Timing</div><div class="text-[24px] font-extrabold num mt-1">88</div></div>
  </div>
</div>
<div class="homebar light"></div>
</div></body></html>
