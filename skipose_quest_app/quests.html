<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Quest map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.mapbg{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(180deg,#DBEFFF 0%,#F6F9FC 38%)}
.mt{position:absolute;left:0;right:0;top:120px;height:240px;background:url(img/slope.jpg) center 35%/cover;opacity:.9;-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);mask-image:linear-gradient(180deg,#000 40%,transparent)}
.node{position:absolute;width:76px;height:76px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;border:5px solid #fff;box-shadow:0 14px 26px -12px rgba(11,27,51,.5)}
.node.done{background:linear-gradient(135deg,#34D399,#059669)}
.node.now{background:var(--gradQuest);width:92px;height:92px;border-radius:30px;font-size:34px;box-shadow:0 0 0 10px rgba(56,189,248,.22),0 18px 30px -12px rgba(37,99,235,.7)}
.node.lock{background:#E2E8F0;color:#94A3B8}
.lab{position:absolute;font-size:13.5px;font-weight:800;white-space:nowrap}
.lab small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.st i{font-size:10px;color:#FBBF24}.st i.o{color:#CBD5E1}
</style></head>
<body><div class="screen">
<div class="mapbg"></div>
<div class="mt"></div>
<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad relative z-10 mt-3 flex items-center justify-between">
  <div><div class="meta" style="color:#1E40AF">World 1</div><div class="h1 mt-1.5">Bunny Hill</div></div>
  <span class="pill bg-white" style="color:#CA8A04;box-shadow:0 6px 16px -8px rgba(11,27,51,.3)"><i class="fa-solid fa-star"></i><span class="num">8 / 15</span></span>
</div>

<svg class="absolute left-0 top-0 w-full h-full z-[1]" viewBox="0 0 436 956" preserveAspectRatio="none">
  <path d="M110,820 C250,800 340,760 320,680 C300,600 120,610 120,530 C120,450 300,450 310,380 C320,310 170,290 140,250" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <path d="M110,820 C250,800 340,760 320,680 C300,600 120,610 120,530" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round"/>
  <path d="M120,530 C120,450 300,450 310,380 C320,310 170,290 140,250" fill="none" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14"/>
</svg>

<div class="absolute inset-0 z-[2]">
  <div class="node done" style="left:72px;top:782px"><i class="fa-solid fa-person"></i></div>
  <div class="lab" style="left:160px;top:796px">Ready Stance<small class="st"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></small></div>

  <div class="node done" style="left:282px;top:642px"><i class="fa-solid fa-shoe-prints"></i></div>
  <div class="lab text-right" style="right:166px;top:656px">Duck Walk<small class="st"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></small></div>

  <div class="node now" style="left:74px;top:484px"><i class="fa-solid fa-pizza-slice"></i></div>
  <div class="lab" style="left:184px;top:494px"><span style="color:var(--blue)">Pizza Stop</span><small class="st"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star o"></i> &nbsp;1 star to go</small></div>
  <div class="absolute" style="left:184px;top:540px"><div class="h-9 px-4 rounded-[13px] flex items-center gap-2 text-white text-[13px] font-extrabold" style="background:var(--grad)"><i class="fa-solid fa-play text-[11px]"></i>Play</div></div>

  <div class="node lock" style="left:272px;top:342px"><i class="fa-solid fa-scale-unbalanced"></i></div>
  <div class="lab text-right" style="right:176px;top:356px;color:#94A3B8">Weight Shift<small>Locked</small></div>

  <div class="node lock" style="left:100px;top:212px"><i class="fa-solid fa-route"></i></div>
  <div class="lab" style="left:190px;top:226px;color:#475569">Wedge Turn<small>Locked</small></div>
</div>

<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab on"><i class="fa-solid fa-map"></i>Quests</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div></div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Progress</div>
  <div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
