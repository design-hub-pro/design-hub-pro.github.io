<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Coach studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.vid{height:330px;border-radius:30px;margin-top:18px;background:url(img/coach.jpg) center/cover;position:relative;overflow:hidden}
.vid:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,51,.35) 0%,rgba(11,27,51,0) 30%,rgba(11,27,51,0) 70%,rgba(11,27,51,.6))}
.vid svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.bn{stroke:#FBBF24;stroke-width:9;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 8px rgba(251,191,36,.9))}
.jt{fill:#fff;stroke:#F59E0B;stroke-width:5}
.track{position:relative;height:56px;border-radius:16px;background:var(--surface);overflow:hidden;display:flex}
.track span{flex:1;border-right:2px solid #fff;display:flex;align-items:flex-end;padding:0 0 7px 9px;font-size:11px;font-weight:800;color:var(--muted)}
.dia{position:absolute;top:12px;width:16px;height:16px;transform:translateX(-50%) rotate(45deg);border-radius:4px;background:var(--orange);border:3px solid #fff;box-shadow:0 3px 8px rgba(251,123,60,.5)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.tol{height:6px;border-radius:4px;background:#E6EDF5;position:relative;width:86px}
.tol i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--orange)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div><div class="meta">Coach studio</div><div class="h1 mt-1.5">Pizza Stop v3</div></div>
      <div class="iconbtn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>

    <div class="vid">
      <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
        <g class="bn"><line x1="552" y1="425" x2="552" y2="640"/><polyline points="505,505 420,500 475,425 630,425 700,500 600,505"/><polyline points="505,645 405,770 315,905"/><polyline points="600,645 700,775 785,910"/><line x1="505" y1="645" x2="600" y2="645"/></g>
        <g class="jt"><circle cx="475" cy="425" r="11"/><circle cx="630" cy="425" r="11"/><circle cx="420" cy="500" r="10"/><circle cx="700" cy="500" r="10"/><circle cx="505" cy="645" r="11"/><circle cx="600" cy="645" r="11"/><circle cx="405" cy="770" r="12"/><circle cx="700" cy="775" r="12"/><circle cx="315" cy="905" r="10"/><circle cx="785" cy="910" r="10"/></g>
      </svg>
      <div class="absolute top-4 left-4 right-4 z-[3] flex justify-between"><span class="pill glass"><span class="live"></span>REC 0:09</span><span class="pill glass"><i class="fa-solid fa-person-rays"></i>17 joints</span></div>
      <div class="absolute bottom-4 left-4 right-4 z-[3] flex justify-between items-center text-white"><span class="text-[13px] font-bold opacity-90">Take 3 of 3</span><span class="pill" style="background:#22C55E;color:#fff"><i class="fa-solid fa-check"></i>Clean take</span></div>
    </div>

    <div class="sec" style="margin-top:22px"><div class="h2">Sequence</div><span class="text-[13px] font-bold text-slate-400 num">12.0 s</span></div>
    <div class="track"><span>Glide</span><span>Wedge</span><span>Press</span><span>Stop</span>
      <i class="dia" style="left:18%"></i><i class="dia" style="left:42%"></i><i class="dia" style="left:63%"></i><i class="dia" style="left:88%"></i>
      <i class="absolute top-0 bottom-0 w-[3px] rounded" style="left:70%;background:var(--ink)"></i>
    </div>

    <div class="sec"><div class="h2">Control points</div><span class="act"><i class="fa-solid fa-plus"></i> Add</span></div>
    <div class="card px-4 py-0.5">
      <div class="row"><div class="gicon g-sky" style="width:38px;height:38px;border-radius:12px;font-size:14px"><i class="fa-solid fa-person"></i></div><div class="flex-1"><div class="text-[14px] font-extrabold">Knee bend 124°</div><div class="text-[12px] font-semibold text-slate-400">Stance</div></div><div class="tol"><i style="left:30%;right:30%"></i></div><span class="text-[12px] font-bold text-slate-500 w-9 text-right num">±10°</span></div>
      <div class="row"><div class="gicon g-mint" style="width:38px;height:38px;border-radius:12px;font-size:14px"><i class="fa-solid fa-scale-balanced"></i></div><div class="flex-1"><div class="text-[14px] font-extrabold">Hips over feet</div><div class="text-[12px] font-semibold text-slate-400">Balance</div></div><div class="tol"><i style="left:36%;right:36%"></i></div><span class="text-[12px] font-bold text-slate-500 w-9 text-right num">±4 cm</span></div>
      <div class="row"><div class="gicon g-sun" style="width:38px;height:38px;border-radius:12px;font-size:14px"><i class="fa-solid fa-stopwatch"></i></div><div class="flex-1"><div class="text-[14px] font-extrabold">Hold stop 2 s</div><div class="text-[12px] font-semibold text-slate-400">Timing</div></div><div class="tol"><i style="left:25%;right:25%"></i></div><span class="text-[12px] font-bold text-slate-500 w-9 text-right num">±0.3s</span></div>
    </div>

    <div class="flex items-center gap-3 mt-5">
      <div class="avs"><img src="img/kid2.jpg"><img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=80&h=80&fit=crop"><img src="https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=80&h=80&fit=crop"><span>+9</span></div>
      <div class="btn flex-1"><i class="fa-solid fa-paper-plane"></i>Publish to class</div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
