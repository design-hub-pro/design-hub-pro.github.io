<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
body{font-family:'Plus Jakarta Sans',sans-serif;color:#0B1B33;margin:0}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
.grid3{display:grid;grid-template-columns:repeat(3,460px);gap:56px 44px;justify-content:center}
@media (max-width:1560px){.grid3{grid-template-columns:repeat(2,460px)}}
@media (max-width:1020px){.grid3{grid-template-columns:460px}}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1B33;box-shadow:0 40px 80px -40px rgba(11,27,51,.45),0 0 0 1px rgba(11,27,51,.08);box-sizing:border-box}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;overflow:hidden}
</style></head>
<body>
<div class="px-10 pt-20 pb-28">
  <div class="text-center">
    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl" style="background:linear-gradient(135deg,#2563EB 0%,#38BDF8 55%,#FB923C 100%)"><i class="fa-solid fa-person-skiing"></i></div>
    <h1 class="text-5xl font-extrabold tracking-tight mt-6">SkiPose Quest</h1>
    <p class="text-lg text-slate-500 font-medium mt-3">Kids copy a coach's ski moves at home while the camera scores stance, balance and timing.</p>
    <div class="flex gap-2 justify-center mt-5">
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Pose estimation</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Kids</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Ski safety</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Game</span>
    </div>
  </div>

  <div class="grid3 mt-20">
    <div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="setup.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="play.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="results.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="compare.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="quests.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="coach.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="progress.html" scrolling="no"></iframe></div>
  </div>
</div>
</body></html>
