<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Results</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.top{position:absolute;left:0;right:0;top:0;height:420px;background:radial-gradient(120% 90% at 50% 0%,#38BDF8 0%,#2563EB 55%,#1E3A8A 100%);border-radius:0 0 40px 40px;overflow:hidden}
.top:before{content:"";position:absolute;inset:0;background:url(img/slope.jpg) center/cover;opacity:.16;mix-blend-mode:luminosity}
.bigstar{font-size:38px;color:#FBBF24;filter:drop-shadow(0 6px 10px rgba(251,191,36,.5))}
.bigstar.off{color:rgba(255,255,255,.28);filter:none}
.cpr{display:flex;align-items:center;gap:12px;padding:12px 0}
</style></head>
<body><div class="screen">
<div class="top"></div>
<div class="scroll">
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad relative text-white">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
      <span class="pill glass"><i class="fa-solid fa-trophy"></i>New best</span>
      <div class="iconbtn glass"><i class="fa-solid fa-share-nodes"></i></div>
    </div>
    <div class="flex justify-center items-end gap-3 mt-5">
      <i class="fa-solid fa-star bigstar" style="transform:rotate(-14deg) translateY(4px)"></i>
      <i class="fa-solid fa-star bigstar" style="font-size:52px"></i>
      <i class="fa-solid fa-star bigstar off" style="transform:rotate(14deg) translateY(4px)"></i>
    </div>
    <div class="text-center mt-3">
      <div class="text-[78px] font-extrabold tracking-[-4px] num leading-none">86</div>
      <div class="text-[16px] font-bold opacity-85 mt-1">Pizza Stop · Great control</div>
    </div>
  </div>

  <div class="pad relative mt-9">
    <div class="card p-5">
      <div class="flex justify-between">
        <div class="text-center"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="35" stroke="#FFEDD5" stroke-width="9" fill="none"/><circle cx="42" cy="42" r="35" stroke="#F97316" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="62"/></svg><div class="v text-[22px] font-extrabold num">72</div></div><div class="text-[13px] font-bold mt-2">Stance</div></div>
        <div class="text-center"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="35" stroke="#D1FAE5" stroke-width="9" fill="none"/><circle cx="42" cy="42" r="35" stroke="#10B981" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="18"/></svg><div class="v text-[22px] font-extrabold num">92</div></div><div class="text-[13px] font-bold mt-2">Balance</div></div>
        <div class="text-center"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="35" stroke="#DBEAFE" stroke-width="9" fill="none"/><circle cx="42" cy="42" r="35" stroke="#2563EB" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="22"/></svg><div class="v text-[22px] font-extrabold num">90</div></div><div class="text-[13px] font-bold mt-2">Timing</div></div>
      </div>
    </div>

    <div class="sec"><div class="h2">Control points</div><span class="text-[13px] font-bold text-slate-400 num">3 of 4 hit</span></div>
    <div class="card px-4 py-1">
      <div class="cpr border-b border-slate-100"><span class="dot" style="background:#10B981;width:10px;height:10px"></span><span class="flex-1 text-[14.5px] font-bold">Knees soft</span><span class="text-[12.5px] font-bold text-slate-400 num">on beat</span></div>
      <div class="cpr border-b border-slate-100"><span class="dot" style="background:#10B981;width:10px;height:10px"></span><span class="flex-1 text-[14.5px] font-bold">Tips together</span><span class="text-[12.5px] font-bold text-slate-400 num">+0.1 s</span></div>
      <div class="cpr border-b border-slate-100"><span class="dot" style="background:#F97316;width:10px;height:10px"></span><span class="flex-1 text-[14.5px] font-bold">Push heels out</span><span class="text-[12.5px] font-bold num" style="color:#EA580C">right knee 18° high</span></div>
      <div class="cpr"><span class="dot" style="background:#10B981;width:10px;height:10px"></span><span class="flex-1 text-[14.5px] font-bold">Hold the stop</span><span class="text-[12.5px] font-bold text-slate-400 num">2.1 s</span></div>
    </div>

    <div class="flex gap-2.5 mt-5">
      <div class="btn ghost flex-1"><i class="fa-solid fa-clone"></i>Compare</div>
      <div class="btn flex-1"><i class="fa-solid fa-rotate-right"></i>Try again</div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
