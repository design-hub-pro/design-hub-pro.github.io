<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.bgimg{position:absolute;inset:0;background:url(img/living.jpg) 48% center/cover}
.bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,51,.15) 0%,rgba(11,27,51,0) 30%,rgba(11,27,51,.55) 55%,rgba(11,27,51,.96) 78%)}
.bone{stroke:#7DD3FC;stroke-width:9;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 8px rgba(56,189,248,.9))}
.jt{fill:#fff;stroke:#38BDF8;stroke-width:5}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35)}
.dots i.on{width:26px;background:#fff}
</style></head>
<body><div class="screen" style="background:#0B1B33">
<div class="bgimg"></div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

<div class="pad relative z-10 mt-4 flex items-center justify-between">
  <div class="flex items-center gap-2.5 text-white">
    <div class="w-10 h-10 rounded-[13px] flex items-center justify-center" style="background:var(--gradQuest)"><i class="fa-solid fa-person-skiing"></i></div>
    <span class="text-[17px] font-extrabold tracking-tight">SkiPose Quest</span>
  </div>
  <span class="pill glass">Skip</span>
</div>

<div class="absolute left-0 right-0 bottom-0 z-10 pad pb-12 text-white">
  <span class="pill" style="background:rgba(56,189,248,.22);color:#BAE6FD;border:1px solid rgba(125,211,252,.35)"><span class="dot" style="background:#38BDF8"></span>Ages 5 to 12</span>
  <div class="text-[40px] font-extrabold tracking-[-1.6px] leading-[1.02] mt-4">Learn to stop<br>before the slope.</div>
  <div class="text-[16px] font-medium opacity-75 mt-3.5 leading-snug">Copy a real coach on your living room rug. The camera checks your stance, balance and timing.</div>

  <div class="flex gap-2.5 mt-6">
    <div class="flex-1 rounded-[20px] p-3.5" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)"><i class="fa-solid fa-camera text-sky-300"></i><div class="text-[13px] font-bold mt-2">Phone camera</div></div>
    <div class="flex-1 rounded-[20px] p-3.5" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)"><i class="fa-solid fa-user-tie text-amber-300"></i><div class="text-[13px] font-bold mt-2">Coach moves</div></div>
    <div class="flex-1 rounded-[20px] p-3.5" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)"><i class="fa-solid fa-star text-orange-300"></i><div class="text-[13px] font-bold mt-2">Earn stars</div></div>
  </div>

  <div class="dots flex gap-1.5 mt-7"><i class="on"></i><i></i><i></i></div>
  <div class="btn sun mt-5">Set up my skier<i class="fa-solid fa-arrow-right"></i></div>
  <div class="text-center text-[13.5px] font-semibold opacity-70 mt-4">Parent or coach? <span class="text-white opacity-100 font-bold">Sign in</span></div>
</div>
<div class="homebar light"></div>
</div></body></html>
