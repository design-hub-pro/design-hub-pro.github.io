<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Compare with coach</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.pane{flex:1;height:300px;border-radius:26px;position:relative;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#1E3A8A 0%,#0B1B33 100%)}
.pane:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.pane svg{position:absolute;left:0;right:0;top:14px;bottom:44px;width:100%;height:calc(100% - 58px);z-index:2}
.jn circle{fill:#fff}
.pane .lb{position:absolute;left:12px;bottom:12px;z-index:3}
.b1{stroke:#38BDF8;filter:drop-shadow(0 0 5px rgba(56,189,248,.8))}
.b2{stroke:#FBBF24;filter:drop-shadow(0 0 5px rgba(251,191,36,.7))}
.bw{stroke:#F97316;stroke-width:5}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="text-[16px] font-extrabold">Rep 2 replay</div>
      <div class="iconbtn"><i class="fa-solid fa-gauge-simple"></i></div>
    </div>

    <div class="flex gap-2.5 mt-5">
      <div class="pane">
        <svg viewBox="0 0 100 150"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" class="b1"><circle cx="50" cy="22" r="9"/><line x1="50" y1="32" x2="50" y2="78"/><polyline points="22,72 28,58 38,40 62,40 72,58 78,72"/><line x1="42" y1="78" x2="58" y2="78"/><polyline points="42,78 34,104 24,132"/><polyline class="bw" points="58,78 63,104 72,134"/><circle cx="63" cy="104" r="4.5" fill="#fff" stroke="#F97316" stroke-width="3"/><path d="M63,94 A10,10 0 0 1 70,98" stroke="#F97316" stroke-width="2"/></g><g class="jn"><circle cx="38" cy="40" r="3"/><circle cx="62" cy="40" r="3"/><circle cx="42" cy="78" r="3"/><circle cx="58" cy="78" r="3"/><circle cx="34" cy="104" r="3"/></g></svg>
        <div class="lb flex items-center gap-2"><img src="img/kid2.jpg" class="w-8 h-8 rounded-full object-cover border-2 border-white"><span class="pill" style="background:#38BDF8;color:#fff">You</span></div>
        <span class="absolute top-3 right-3 z-[3] pill" style="background:#F97316;color:#fff">142°</span>
      </div>
      <div class="pane">
        <svg viewBox="0 0 100 150"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" class="b2"><circle cx="50" cy="22" r="9"/><line x1="50" y1="32" x2="50" y2="78"/><polyline points="22,72 28,58 38,40 62,40 72,58 78,72"/><line x1="42" y1="78" x2="58" y2="78"/><polyline points="42,78 34,104 24,132"/><polyline points="58,78 66,104 76,132"/></g><g class="jn"><circle cx="38" cy="40" r="3"/><circle cx="62" cy="40" r="3"/><circle cx="42" cy="78" r="3"/><circle cx="58" cy="78" r="3"/><circle cx="34" cy="104" r="3"/></g></svg>
        <div class="lb flex items-center gap-2"><img src="img/coach.jpg" class="w-8 h-8 rounded-full object-cover border-2 border-white" style="object-position:50% 30%"><span class="pill" style="background:#FBBF24;color:#0B1B33">Coach</span></div>
        <span class="absolute top-3 right-3 z-[3] pill glass">124°</span>
      </div>
    </div>

    <div class="card p-4 mt-4">
      <div class="flex items-center justify-between">
        <div class="text-[14px] font-extrabold">Right knee bend</div>
        <div class="flex gap-3 text-[11.5px] font-bold text-slate-500"><span class="flex items-center gap-1.5"><span class="dot" style="background:#38BDF8"></span>You</span><span class="flex items-center gap-1.5"><span class="dot" style="background:#FBBF24"></span>Coach</span></div>
      </div>
      <svg viewBox="0 0 360 120" class="w-full mt-3" style="height:120px">
        <rect x="190" y="0" width="80" height="104" rx="8" fill="#FFF7ED"/>
        <line x1="0" y1="104" x2="360" y2="104" stroke="#E3EAF3" stroke-width="2"/>
        <path d="M0,88 C40,84 70,60 110,46 C150,32 180,30 220,30 C260,30 290,40 360,70" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
        <path d="M0,90 C40,88 75,66 115,54 C150,46 185,52 220,56 C255,58 295,52 360,74" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
        <line x1="230" y1="0" x2="230" y2="104" stroke="#0B1B33" stroke-width="2.5"/>
        <circle cx="230" cy="56" r="6" fill="#fff" stroke="#38BDF8" stroke-width="3"/><circle cx="230" cy="30" r="6" fill="#fff" stroke="#FBBF24" stroke-width="3"/>
              </svg>
      <div class="flex justify-between text-[11px] font-bold text-slate-400 mt-1"><span>Glide</span><span>Wedge</span><span style="color:#EA580C">Press</span><span>Stop</span></div>
      <div class="text-[10.5px] font-semibold text-slate-400 mt-2">Illustrative data for this mockup</div>
    </div>

    <div class="card p-4 mt-4 flex items-center gap-3.5" style="background:#FFF7ED;border-color:#FED7AA">
      <div class="gicon g-sun"><i class="fa-solid fa-lightbulb"></i></div>
      <div class="flex-1">
        <div class="text-[15px] font-extrabold">Make a bigger pizza slice</div>
        <div class="text-[13px] font-semibold text-slate-500 mt-0.5">Push your right heel out and sink 2 cm lower.</div>
      </div>
      <div class="w-14 h-14 rounded-[16px] relative overflow-hidden flex-none" style="background:url(img/boot.jpg) center/cover"><div class="absolute inset-0 bg-black/25 flex items-center justify-center text-white text-[13px]"><i class="fa-solid fa-play"></i></div></div>
    </div>

    <div class="flex items-center gap-3 mt-5">
      <div class="w-[58px] h-[58px] rounded-[19px] flex items-center justify-center text-white text-[18px] flex-none" style="background:var(--ink)"><i class="fa-solid fa-pause"></i></div>
      <div class="flex-1"><div class="bar"><i style="width:62%"></i></div><div class="flex justify-between text-[11.5px] font-bold text-slate-400 mt-2 num"><span>0:07</span><span>0.5x slow-mo</span><span>0:12</span></div></div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
