<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPose Quest · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.today{height:318px;border-radius:30px;margin-top:20px;background-image:url(img/coach.jpg);background-position:center 30%}
.mv{flex:none;width:172px}
.mv .th{height:200px;border-radius:24px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.mv .th:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,27,51,0) 45%,rgba(11,27,51,.75))}
.mv .lk{position:absolute;inset:0;z-index:3;background:rgba(11,27,51,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.stars i{font-size:11px;color:#FBBF24}
.stars i.off{color:rgba(255,255,255,.35)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="flex items-center gap-3">
        <img src="img/kid2.jpg" class="w-12 h-12 rounded-[16px] object-cover" style="object-position:center 30%">
        <div><div class="meta">Level 4 · Snow Fox</div><div class="text-[24px] font-extrabold tracking-tight leading-none mt-1">Hi, Maya</div></div>
      </div>
      <div class="flex gap-2">
        <div class="h-11 px-3.5 rounded-[15px] flex items-center gap-1.5 font-extrabold text-[15px]" style="background:#FFF4E5;color:#EA580C"><i class="fa-solid fa-fire"></i><span class="num">6</span></div>
        <div class="h-11 px-3.5 rounded-[15px] flex items-center gap-1.5 font-extrabold text-[15px]" style="background:#FEF9C3;color:#CA8A04"><i class="fa-solid fa-star"></i><span class="num">48</span></div>
      </div>
    </div>

    <div class="hero today">
      <div class="p-5 h-full flex flex-col justify-between text-white">
        <div class="flex items-center justify-between"><span class="pill glass"><i class="fa-solid fa-bullseye"></i>Today's move</span><span class="pill glass"><i class="fa-regular fa-clock"></i>4 min</span></div>
        <div>
          <div class="text-[13px] font-bold opacity-80">Coach Lena · Quest 2</div>
          <div class="text-[30px] font-extrabold tracking-[-1px] leading-tight mt-0.5">Pizza Stop</div>
          <div class="flex items-center gap-3 mt-3">
            <div class="flex-1 h-[7px] rounded-full bg-white/25 overflow-hidden"><i class="block h-full rounded-full" style="width:66%;background:var(--gradSun)"></i></div>
            <span class="text-[12.5px] font-bold num">2 / 3 stars</span>
          </div>
          <div class="flex gap-2.5 mt-4">
            <div class="flex-1 h-[52px] rounded-[17px] bg-white text-[15px] font-extrabold flex items-center justify-center gap-2" style="color:var(--blue)"><i class="fa-solid fa-play"></i>Play</div>
            <div class="w-[52px] h-[52px] rounded-[17px] flex items-center justify-center" style="background:rgba(255,255,255,.2);backdrop-filter:blur(8px)"><i class="fa-solid fa-film"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2.5 mt-4">
      <div class="card p-3.5"><div class="text-[11.5px] font-bold text-slate-400">Best score</div><div class="text-[28px] font-extrabold tracking-tight num mt-1 leading-none">86</div><div class="text-[11.5px] font-bold mt-1.5" style="color:var(--ok)"><i class="fa-solid fa-arrow-up text-[10px]"></i> 12</div></div>
      <div class="card p-3.5"><div class="text-[11.5px] font-bold text-slate-400">Practice</div><div class="text-[28px] font-extrabold tracking-tight num mt-1 leading-none">42<span class="text-[14px] text-slate-400 ml-0.5">m</span></div><div class="text-[11.5px] font-bold text-slate-400 mt-1.5">this week</div></div>
      <div class="card p-3.5"><div class="text-[11.5px] font-bold text-slate-400">Slope ready</div><div class="text-[28px] font-extrabold tracking-tight num mt-1 leading-none">3<span class="text-[14px] text-slate-400">/5</span></div><div class="flex gap-1 mt-2"><span class="dot" style="background:var(--ok)"></span><span class="dot" style="background:var(--ok)"></span><span class="dot" style="background:var(--ok)"></span><span class="dot" style="background:#E2E8F0"></span><span class="dot" style="background:#E2E8F0"></span></div></div>
    </div>

    <div class="sec"><div class="h2">Moves to master</div><span class="act">Quest map</span></div>
    <div class="hscroll">
      <div class="mv"><div class="th" style="background-image:url(img/boot.jpg)"><div class="absolute left-3 bottom-3 right-3 z-[2] text-white"><div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div><div class="text-[15px] font-extrabold mt-1">Ready Stance</div></div><span class="absolute top-3 left-3 z-[3] w-7 h-7 rounded-full bg-white flex items-center justify-center text-[12px]" style="color:var(--ok)"><i class="fa-solid fa-check"></i></span></div></div>
      <div class="mv"><div class="th" style="background-image:url(img/coach.jpg)"><div class="absolute left-3 bottom-3 right-3 z-[2] text-white"><div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star off"></i></div><div class="text-[15px] font-extrabold mt-1">Pizza Stop</div></div></div></div>
      <div class="mv"><div class="th" style="background-image:url(img/weight.jpg)"><div class="lk"><i class="fa-solid fa-lock"></i></div><div class="absolute left-3 bottom-3 right-3 z-[4] text-white"><div class="text-[12px] font-bold opacity-80">Unlocks at 3 stars</div><div class="text-[15px] font-extrabold mt-0.5">Weight Shift</div></div></div></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab on"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-map"></i>Quests</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div></div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Progress</div>
  <div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
