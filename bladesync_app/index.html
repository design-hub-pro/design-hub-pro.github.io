<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BladeSync - Dual-Boot Kinetic Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a2e;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #0a0e1a;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <div class="text-center py-16 px-6">
        <div class="flex items-center justify-center gap-4 mb-4">
            <div class="w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fas fa-skating text-white text-2xl"></i>
            </div>
            <h1 class="text-5xl font-black text-gray-900">BladeSync</h1>
        </div>
        <p class="text-gray-500 text-lg max-w-xl mx-auto">Dual-Boot Kinetic Tracker Companion App</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1500px] mx-auto px-8 pb-20">
        <div class="grid grid-cols-3 gap-10 justify-items-center">
            <!-- Screen 1: Dashboard -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="dashboard.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Live Dashboard</p>
            </div>
            <!-- Screen 2: Session Report -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="session.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Session Report</p>
            </div>
            <!-- Screen 3: Jump Analysis -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="jumps.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Jump Analysis</p>
            </div>
            <!-- Screen 4: Symmetry -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="symmetry.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Symmetry Analysis</p>
            </div>
            <!-- Screen 5: Speed & Flow -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="speed.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Speed & Flow</p>
            </div>
            <!-- Screen 6: History -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="history.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-5 text-gray-700 font-semibold text-sm">Session History</p>
            </div>
        </div>
    </div>
</body>
</html>
