<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodTune - Sleep Mode</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow: hidden; background: #080714; color: #fff; }

    .bg-stars {
        position: absolute; inset: 0; overflow: hidden;
    }
    .star {
        position: absolute; width: 2px; height: 2px; border-radius: 50%;
        background: rgba(255,255,255,0.3); animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.8; }
    }

    .container {
        position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
    }

    .status-bar {
        height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between;
        padding-bottom: 12px;
    }
    .status-time { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.5); }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; color: rgba(255,255,255,0.5); }
    .dynamic-island {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 130px; height: 36px; background: #000; border-radius: 20px;
    }

    .nav-bar {
        display: flex; align-items: center; justify-content: space-between; padding: 8px 28px 12px;
    }
    .nav-close { font-size: 20px; color: rgba(255,255,255,0.4); }
    .sleep-badge {
        display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
        color: #a78bfa; background: rgba(124,92,252,0.1); padding: 6px 14px;
        border-radius: 20px;
    }
    .sleep-badge i { font-size: 10px; }
    .nav-settings { font-size: 18px; color: rgba(255,255,255,0.4); }

    .sleep-main {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 0 28px;
    }

    .moon-icon {
        font-size: 64px; margin-bottom: 20px; opacity: 0.9;
        animation: moon-glow 4s ease-in-out infinite;
    }
    @keyframes moon-glow {
        0%, 100% { filter: drop-shadow(0 0 20px rgba(167,139,250,0.3)); }
        50% { filter: drop-shadow(0 0 40px rgba(167,139,250,0.5)); }
    }

    .sleep-title { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; color: #e0d5ff; }
    .sleep-sub { font-size: 14px; color: rgba(255,255,255,0.35); margin-bottom: 36px; }

    .timer-display { text-align: center; margin-bottom: 36px; }
    .timer-label { font-size: 12px; color: rgba(255,255,255,0.3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
    .timer-value {
        font-size: 56px; font-weight: 800; letter-spacing: -0.03em;
        background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(167,139,250,0.6));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .timer-progress {
        width: 200px; height: 4px; border-radius: 2px;
        background: rgba(255,255,255,0.06); margin: 12px auto 0;
    }
    .timer-fill {
        width: 65%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, #7c5cfc, #a78bfa);
    }

    .timer-options {
        display: flex; gap: 10px; margin-bottom: 32px;
    }
    .timer-opt {
        padding: 10px 18px; border-radius: 14px; font-size: 13px; font-weight: 600;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.4);
    }
    .timer-opt.active {
        background: rgba(124,92,252,0.15); border-color: rgba(124,92,252,0.3);
        color: #c4b5fd;
    }

    .now-playing {
        width: 100%; max-width: 340px; padding: 16px 20px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px; display: flex; align-items: center; gap: 14px;
        margin-bottom: 20px;
    }
    .np-art { width: 48px; height: 48px; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
    .np-art img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
    .np-info { flex: 1; min-width: 0; }
    .np-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7); }
    .np-artist { font-size: 12px; color: rgba(255,255,255,0.3); }
    .np-controls { display: flex; gap: 14px; }
    .np-controls i { font-size: 18px; color: rgba(255,255,255,0.3); }
    .np-controls .active { color: #7c5cfc; }

    .volume-row {
        display: flex; align-items: center; gap: 12px; width: 100%; max-width: 300px;
        margin-bottom: 16px;
    }
    .volume-row i { font-size: 14px; color: rgba(255,255,255,0.2); }
    .vol-track {
        flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06);
        position: relative;
    }
    .vol-fill { width: 30%; height: 100%; border-radius: 2px; background: rgba(167,139,250,0.5); }

    .fade-info {
        font-size: 12px; color: rgba(255,255,255,0.2); text-align: center;
        display: flex; align-items: center; gap: 6px;
    }
    .fade-info i { font-size: 10px; }

    .bottom-pad { padding-bottom: 50px; }
</style>
</head>
<body>
    <div class="bg-stars">
        <div class="star" style="top: 8%; left: 15%; animation-delay: 0s;"></div>
        <div class="star" style="top: 12%; left: 65%; animation-delay: 0.5s;"></div>
        <div class="star" style="top: 25%; left: 85%; animation-delay: 1s;"></div>
        <div class="star" style="top: 35%; left: 25%; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 45%; left: 75%; animation-delay: 0.3s;"></div>
        <div class="star" style="top: 55%; left: 10%; animation-delay: 0.8s;"></div>
        <div class="star" style="top: 65%; left: 50%; animation-delay: 1.2s;"></div>
        <div class="star" style="top: 72%; left: 90%; animation-delay: 0.7s;"></div>
        <div class="star" style="top: 80%; left: 35%; animation-delay: 1.8s;"></div>
        <div class="star" style="top: 88%; left: 70%; animation-delay: 0.4s;"></div>
        <div class="star" style="top: 18%; left: 42%; animation-delay: 2s;"></div>
        <div class="star" style="top: 52%; left: 58%; animation-delay: 1.4s;"></div>
    </div>

    <div class="container">
        <div class="status-bar">
            <span class="status-time">11:42</span>
            <div class="dynamic-island"></div>
            <div class="status-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <i class="fas fa-xmark nav-close"></i>
            <div class="sleep-badge"><i class="fas fa-moon"></i> Sleep Mode</div>
            <i class="fas fa-gear nav-settings"></i>
        </div>

        <div class="sleep-main">
            <div class="moon-icon">🌙</div>
            <div class="sleep-title">Sweet Dreams</div>
            <div class="sleep-sub">Music will fade out gradually</div>

            <div class="timer-display">
                <div class="timer-label">Timer remaining</div>
                <div class="timer-value">21:34</div>
                <div class="timer-progress">
                    <div class="timer-fill"></div>
                </div>
            </div>

            <div class="timer-options">
                <div class="timer-opt">15m</div>
                <div class="timer-opt active">30m</div>
                <div class="timer-opt">45m</div>
                <div class="timer-opt">60m</div>
            </div>

            <div class="now-playing">
                <div class="np-art">
                    <img src="https://images.unsplash.com/photo-1528722828814-77b9b83aafb2?w=100&h=100&fit=crop" alt="">
                </div>
                <div class="np-info">
                    <div class="np-name">Ocean Whispers</div>
                    <div class="np-artist">Sleep Better Playlist</div>
                </div>
                <div class="np-controls">
                    <i class="fas fa-backward-step"></i>
                    <i class="fas fa-pause active"></i>
                    <i class="fas fa-forward-step"></i>
                </div>
            </div>

            <div class="volume-row">
                <i class="fas fa-volume-low"></i>
                <div class="vol-track">
                    <div class="vol-fill"></div>
                </div>
                <i class="fas fa-volume-high"></i>
            </div>

            <div class="fade-info">
                <i class="fas fa-circle-info"></i>
                Volume will fade to 0% over the last 5 minutes
            </div>
        </div>

        <div class="bottom-pad"></div>
    </div>
</body>
</html>
