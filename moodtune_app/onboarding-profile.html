<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodTune - Setup Profile</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow: hidden; background: #0f0e1a; color: #fff; }

    .status-bar {
        height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between;
        padding-bottom: 12px; position: relative; z-index: 100;
    }
    .status-time { font-size: 16px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .dynamic-island {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 130px; height: 36px; background: #000; border-radius: 20px;
    }

    .container {
        height: calc(100% - 59px); display: flex; flex-direction: column; padding: 0 28px;
    }

    .progress-bar {
        display: flex; gap: 6px; margin-bottom: 32px;
    }
    .progress-dot {
        flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1);
    }
    .progress-dot.active { background: linear-gradient(90deg, #7c5cfc, #5b9aff); }
    .progress-dot.done { background: #7c5cfc; }

    .step-label { font-size: 13px; color: #7c5cfc; font-weight: 600; margin-bottom: 8px; }
    .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
    .page-sub { font-size: 14px; color: #a0a0b8; margin-bottom: 32px; line-height: 1.5; }

    .avatar-upload {
        width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 28px;
        background: rgba(124,92,252,0.15); border: 2px dashed rgba(124,92,252,0.4);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px; cursor: pointer;
    }
    .avatar-upload i { font-size: 24px; color: #7c5cfc; }
    .avatar-upload span { font-size: 11px; color: #a0a0b8; }

    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 13px; font-weight: 600; color: #a0a0b8; margin-bottom: 8px; display: block; }
    .form-input {
        width: 100%; height: 52px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05); padding: 0 18px; font-size: 15px; color: #fff;
        font-family: 'Inter', sans-serif;
    }
    .form-input::placeholder { color: #444; }
    .form-input.filled { border-color: rgba(124,92,252,0.3); }

    .select-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .select-chip {
        padding: 12px 20px; border-radius: 16px; font-size: 14px; font-weight: 500;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
        color: #a0a0b8; cursor: pointer;
    }
    .select-chip.selected {
        background: rgba(124,92,252,0.2); border-color: #7c5cfc; color: #c4b5fd;
    }

    .bottom { margin-top: auto; padding-bottom: 50px; }
    .continue-btn {
        width: 100%; height: 56px; border-radius: 18px; border: none;
        background: linear-gradient(135deg, #7c5cfc, #5b9aff);
        color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
        box-shadow: 0 10px 30px rgba(124,92,252,0.3);
    }
    .skip-text { text-align: center; margin-top: 14px; font-size: 14px; color: #a0a0b8; }
</style>
</head>
<body>
    <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <div class="container">
        <div class="progress-bar">
            <div class="progress-dot active"></div>
            <div class="progress-dot"></div>
            <div class="progress-dot"></div>
        </div>

        <div class="step-label">STEP 1 OF 3</div>
        <div class="page-title">About You</div>
        <div class="page-sub">Help us personalize your experience</div>

        <div class="avatar-upload">
            <i class="fas fa-camera"></i>
            <span>Add Photo</span>
        </div>

        <div class="form-group">
            <label class="form-label">What should we call you?</label>
            <input class="form-input filled" type="text" placeholder="Your name" value="Alex">
        </div>

        <div class="form-group">
            <label class="form-label">Your school year</label>
            <div class="select-group">
                <div class="select-chip">Freshman</div>
                <div class="select-chip selected">Sophomore</div>
                <div class="select-chip">Junior</div>
                <div class="select-chip">Senior</div>
                <div class="select-chip">Grad</div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">What's been on your mind?</label>
            <div class="select-group">
                <div class="select-chip selected">📚 Academics</div>
                <div class="select-chip">💼 Career</div>
                <div class="select-chip selected">😴 Sleep</div>
                <div class="select-chip">👥 Social</div>
                <div class="select-chip">💰 Finances</div>
                <div class="select-chip">❤️ Relationships</div>
            </div>
        </div>

        <div class="bottom">
            <button class="continue-btn">Continue</button>
            <div class="skip-text">Skip for now</div>
        </div>
    </div>
</body>
</html>
