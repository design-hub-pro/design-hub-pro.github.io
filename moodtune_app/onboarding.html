<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodTune - Welcome</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow-x: hidden; background: #0f0e1a; color: #fff; }

    .status-bar {
        height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between;
        padding-bottom: 12px; position: relative; z-index: 100;
    }
    .status-time { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .dynamic-island {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 130px; height: 36px; background: #000; border-radius: 20px;
    }

    .onboarding-container {
        height: calc(100% - 59px); display: flex; flex-direction: column;
        padding: 0 28px; position: relative; overflow: hidden;
    }

    .hero-section {
        flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center; position: relative; z-index: 2;
    }

    .logo-icon {
        width: 100px; height: 100px; border-radius: 28px;
        background: linear-gradient(135deg, #7c5cfc, #5b9aff, #ff6b8a);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 32px; box-shadow: 0 20px 60px rgba(124,92,252,0.4);
        animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .logo-icon i { font-size: 44px; color: #fff; }

    .app-title {
        font-size: 40px; font-weight: 800; letter-spacing: -0.03em;
        background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #93c5fd 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
    }
    .app-tagline {
        font-size: 17px; color: #a0a0b8; line-height: 1.5; max-width: 300px;
        font-weight: 400;
    }

    .mood-preview {
        display: flex; gap: 16px; margin-top: 40px; justify-content: center;
    }
    .mood-bubble {
        width: 56px; height: 56px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        animation: pulse-mood 2s ease-in-out infinite;
    }
    .mood-bubble:nth-child(2) { animation-delay: 0.3s; }
    .mood-bubble:nth-child(3) { animation-delay: 0.6s; }
    .mood-bubble:nth-child(4) { animation-delay: 0.9s; }
    .mood-bubble:nth-child(5) { animation-delay: 1.2s; }
    @keyframes pulse-mood {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .bottom-section {
        padding-bottom: 50px;
    }

    .get-started-btn {
        width: 100%; height: 58px; border-radius: 18px; border: none;
        background: linear-gradient(135deg, #7c5cfc, #5b9aff);
        color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
        letter-spacing: -0.01em; box-shadow: 0 12px 40px rgba(124,92,252,0.4);
        margin-bottom: 16px;
    }
    .sign-in-link {
        text-align: center; font-size: 14px; color: #a0a0b8;
    }
    .sign-in-link span { color: #7c5cfc; font-weight: 600; }

    .bg-glow {
        position: absolute; width: 300px; height: 300px; border-radius: 50%;
        filter: blur(100px); opacity: 0.15; pointer-events: none;
    }
    .glow-1 { background: #7c5cfc; top: 10%; left: -20%; }
    .glow-2 { background: #5b9aff; bottom: 20%; right: -20%; }
    .glow-3 { background: #ff6b8a; top: 40%; right: -10%; }

    .wave-viz {
        display: flex; align-items: center; gap: 3px; margin-top: 32px; justify-content: center;
    }
    .wave-bar {
        width: 4px; border-radius: 4px; background: linear-gradient(180deg, #7c5cfc, #5b9aff);
        animation: wave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { height: 16px; animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 28px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 36px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 24px; animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { height: 32px; animation-delay: 0.5s; }
    .wave-bar:nth-child(7) { height: 18px; animation-delay: 0.6s; }
    .wave-bar:nth-child(8) { height: 28px; animation-delay: 0.7s; }
    .wave-bar:nth-child(9) { height: 14px; animation-delay: 0.8s; }
    .wave-bar:nth-child(10) { height: 22px; animation-delay: 0.9s; }
    @keyframes wave {
        0%, 100% { transform: scaleY(1); opacity: 0.6; }
        50% { transform: scaleY(1.6); opacity: 1; }
    }
</style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <div class="onboarding-container">
        <div class="hero-section">
            <div class="logo-icon">
                <i class="fas fa-headphones"></i>
            </div>
            <div class="app-title">MoodTune</div>
            <p class="app-tagline">Your music. Your mood. Personalized healing through sound.</p>

            <div class="mood-preview">
                <div class="mood-bubble">😌</div>
                <div class="mood-bubble">😊</div>
                <div class="mood-bubble">🎵</div>
                <div class="mood-bubble">💜</div>
                <div class="mood-bubble">✨</div>
            </div>

            <div class="wave-viz">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <div class="bottom-section">
            <button class="get-started-btn">Get Started</button>
            <div class="sign-in-link">Already have an account? <span>Sign In</span></div>
        </div>
    </div>
</body>
</html>
