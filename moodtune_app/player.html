<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodTune - Player</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    *::-webkit-scrollbar { display: none; }
    html, body { scrollbar-width: none; font-family: 'Inter', sans-serif; width: 100%; height: 100%; overflow: hidden; background: #0f0e1a; color: #fff; }

    .player-bg {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    }
    .player-bg img {
        width: 100%; height: 100%; object-fit: cover; filter: blur(60px) brightness(0.3);
        transform: scale(1.2);
    }

    .player-container {
        position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
    }

    .status-bar {
        height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between;
        padding-bottom: 12px;
    }
    .status-time { font-size: 16px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .dynamic-island {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 130px; height: 36px; background: #000; border-radius: 20px;
    }

    .nav-bar {
        display: flex; align-items: center; justify-content: space-between; padding: 8px 28px 12px;
    }
    .nav-btn { font-size: 18px; color: rgba(255,255,255,0.8); width: 36px; }
    .nav-label { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

    .album-art-section {
        flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 40px;
    }
    .album-art {
        width: 320px; height: 320px; border-radius: 28px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        animation: art-float 4s ease-in-out infinite;
    }
    @keyframes art-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.01); }
    }
    .album-art img { width: 100%; height: 100%; object-fit: cover; }

    .track-info { padding: 0 28px; margin-bottom: 24px; }
    .track-row { display: flex; align-items: center; justify-content: space-between; }
    .track-name { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .track-artist { font-size: 15px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .track-actions { display: flex; gap: 16px; }
    .track-actions i { font-size: 22px; color: rgba(255,255,255,0.6); }
    .track-actions .liked { color: #ff6b8a; }

    .progress-section { padding: 0 28px; margin-bottom: 20px; }
    .progress-bar { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); position: relative; }
    .progress-fill { width: 35%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #7c5cfc, #5b9aff); position: relative; }
    .progress-dot {
        width: 14px; height: 14px; border-radius: 50%; background: #fff;
        position: absolute; right: -7px; top: -5px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .progress-times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.4); }

    .controls { padding: 0 28px; display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 20px; }
    .control-btn { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; }
    .control-btn i { font-size: 24px; }
    .play-btn {
        width: 68px; height: 68px; border-radius: 50%;
        background: linear-gradient(135deg, #7c5cfc, #5b9aff);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 40px rgba(124,92,252,0.4);
        border: none; cursor: pointer;
    }
    .play-btn i { font-size: 26px; color: #fff; margin-left: 3px; }

    .feedback-section {
        padding: 0 28px; padding-bottom: 50px;
    }
    .feedback-prompt {
        text-align: center; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 12px;
    }
    .feedback-btns { display: flex; gap: 10px; justify-content: center; }
    .fb-btn {
        padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
        border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 6px;
        cursor: pointer;
    }
    .fb-btn.active { background: rgba(124,92,252,0.2); border-color: #7c5cfc; color: #c4b5fd; }
</style>
</head>
<body>
    <div class="player-bg">
        <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=800&h=800&fit=crop" alt="">
    </div>

    <div class="player-container">
        <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="dynamic-island"></div>
            <div class="status-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <div class="nav-bar">
            <i class="fas fa-chevron-down nav-btn"></i>
            <span class="nav-label">Playing from • Deep Calm</span>
            <i class="fas fa-ellipsis nav-btn" style="text-align: right;"></i>
        </div>

        <div class="album-art-section">
            <div class="album-art">
                <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=640&h=640&fit=crop" alt="">
            </div>
        </div>

        <div class="track-info">
            <div class="track-row">
                <div>
                    <div class="track-name">Weightless</div>
                    <div class="track-artist">Marconi Union</div>
                </div>
                <div class="track-actions">
                    <i class="fas fa-heart liked"></i>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill">
                    <div class="progress-dot"></div>
                </div>
            </div>
            <div class="progress-times">
                <span>1:42</span>
                <span>4:56</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn"><i class="fas fa-shuffle"></i></button>
            <button class="control-btn"><i class="fas fa-backward-step"></i></button>
            <button class="play-btn"><i class="fas fa-pause"></i></button>
            <button class="control-btn"><i class="fas fa-forward-step"></i></button>
            <button class="control-btn"><i class="fas fa-repeat"></i></button>
        </div>

        <div class="feedback-section">
            <div class="feedback-prompt">How does this track make you feel?</div>
            <div class="feedback-btns">
                <div class="fb-btn"><span>😌</span> Calm</div>
                <div class="fb-btn active"><span>💜</span> Better</div>
                <div class="fb-btn"><span>😐</span> Same</div>
                <div class="fb-btn"><span>👎</span> Skip</div>
            </div>
        </div>
    </div>
</body>
</html>
