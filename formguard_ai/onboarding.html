<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormGuard AI — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;font-family:'Inter',sans-serif}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{width:100%;height:100%;background:#0A0A0F;color:#fff;overflow:hidden}
.hero{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=900&q=80');background-size:cover;background-position:center}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,.35) 0%,rgba(10,10,15,.85) 55%,#0A0A0F 100%)}
.status-bar{height:59px;padding:18px 28px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:37px;background:#000;border-radius:20px}
.status-bar .time{font-size:15px;font-weight:600;color:#fff}
.status-bar .indicators{display:flex;gap:6px;font-size:14px;color:#fff;align-items:center}
.content{position:relative;z-index:20;padding:0 28px;height:calc(100% - 59px);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:48px}
.logo-row{position:absolute;top:90px;left:28px;display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:#C5FF3C;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(197,255,60,.45)}
.logo-mark i{color:#0A0A0F;font-size:17px}
.logo-text{font-weight:800;letter-spacing:-.02em;font-size:17px}
.pose-overlay{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);z-index:15;opacity:.9}
.kpis{display:flex;gap:8px;margin-bottom:24px}
.kpi{flex:1;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);padding:12px 12px 14px;border-radius:16px}
.kpi .n{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#C5FF3C}
.kpi .l{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.title{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-bottom:14px}
.title .accent{color:#C5FF3C}
.sub{font-size:15px;color:rgba(255,255,255,.62);line-height:1.5;margin-bottom:28px;max-width:330px}
.cta{height:58px;width:100%;border-radius:18px;background:#C5FF3C;color:#0A0A0F;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 32px rgba(197,255,60,.32)}
.signin{margin-top:14px;text-align:center;font-size:13px;color:rgba(255,255,255,.5)}
.signin span{color:#fff;font-weight:600}
.dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.dot.active{width:22px;background:#C5FF3C}
</style>
</head>
<body>
<div class="hero"></div>

<div class="status-bar">
  <div class="time">9:41</div>
  <div class="dynamic-island"></div>
  <div class="indicators">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="logo-row">
  <div class="logo-mark"><i class="fas fa-bolt"></i></div>
  <div class="logo-text">FormGuard <span style="color:#C5FF3C">AI</span></div>
</div>

<!-- pose skeleton overlay -->
<svg class="pose-overlay" width="180" height="240" viewBox="0 0 180 240">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g stroke="#C5FF3C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="90" y1="40" x2="90" y2="85"/>
    <line x1="90" y1="85" x2="55" y2="105"/>
    <line x1="90" y1="85" x2="125" y2="105"/>
    <line x1="55" y1="105" x2="48" y2="145"/>
    <line x1="125" y1="105" x2="132" y2="145"/>
    <line x1="90" y1="85" x2="90" y2="140"/>
    <line x1="90" y1="140" x2="65" y2="180"/>
    <line x1="90" y1="140" x2="115" y2="180"/>
    <line x1="65" y1="180" x2="62" y2="220"/>
    <line x1="115" y1="180" x2="118" y2="220"/>
  </g>
  <g fill="#C5FF3C">
    <circle cx="90" cy="40" r="5"/>
    <circle cx="90" cy="85" r="4"/>
    <circle cx="55" cy="105" r="4"/>
    <circle cx="125" cy="105" r="4"/>
    <circle cx="48" cy="145" r="4"/>
    <circle cx="132" cy="145" r="4"/>
    <circle cx="90" cy="140" r="4"/>
    <circle cx="65" cy="180" r="4"/>
    <circle cx="115" cy="180" r="4"/>
    <circle cx="62" cy="220" r="4"/>
    <circle cx="118" cy="220" r="4"/>
  </g>
</svg>

<div class="content">
  <div class="kpis">
    <div class="kpi"><div class="n">98%</div><div class="l">Form Acc.</div></div>
    <div class="kpi"><div class="n">200+</div><div class="l">Movements</div></div>
    <div class="kpi"><div class="n">33</div><div class="l">Joints Tracked</div></div>
  </div>
  <div class="title">Train smarter.<br><span class="accent">Move safer.</span></div>
  <div class="sub">Real-time AI form analysis with biomechanical feedback. Prevent injury before it happens.</div>
  <button class="cta">Get Started <i class="fas fa-arrow-right" style="font-size:13px"></i></button>
  <div class="signin">Already have an account? <span>Sign in</span></div>
  <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body>
</html>
