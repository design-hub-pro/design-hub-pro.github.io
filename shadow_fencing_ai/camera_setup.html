<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Camera Setup</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: white; overflow: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Camera View */
  .camera-view {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #1a1a2e 0%, #0d1117 100%);
  }
  .camera-feed {
    width: 100%; height: 100%; object-fit: cover; opacity: 0.3;
  }

  /* Pose skeleton overlay */
  .skeleton-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 200px; height: 400px;
  }
  .skeleton-line {
    position: absolute; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, #00d4ff, #8b5cf6);
    box-shadow: 0 0 8px rgba(0,212,255,0.5);
  }
  /* Head */
  .sk-head { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #00d4ff; position: absolute; top: 30px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 12px rgba(0,212,255,0.4); }
  /* Spine */
  .sk-spine { width: 3px; height: 100px; left: 50%; top: 73px; transform: translateX(-50%); }
  /* Left arm */
  .sk-larm { width: 80px; top: 90px; left: 20px; transform: rotate(-35deg); }
  /* Right arm - extended (fencing stance) */
  .sk-rarm { width: 95px; top: 85px; right: 5px; transform: rotate(10deg); }
  /* Left leg */
  .sk-lleg { width: 3px; height: 110px; top: 175px; left: 65px; transform: rotate(15deg); }
  /* Right leg */
  .sk-rleg { width: 3px; height: 110px; top: 175px; right: 55px; transform: rotate(-15deg); }
  /* Joint dots */
  .joint {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.6);
  }
  .j-head { top: 25px; left: 50%; transform: translateX(-50%); }
  .j-lshoulder { top: 80px; left: 55px; }
  .j-rshoulder { top: 80px; right: 55px; }
  .j-lelbow { top: 105px; left: 20px; }
  .j-relbow { top: 78px; right: 15px; }
  .j-lhand { top: 128px; left: 2px; background: #a78bfa; }
  .j-rhand { top: 75px; right: -20px; background: #ff6b4a; box-shadow: 0 0 15px rgba(255,107,74,0.6); width: 14px; height: 14px; }
  .j-hip { top: 173px; left: 50%; transform: translateX(-50%); }
  .j-lknee { top: 240px; left: 55px; }
  .j-rknee { top: 240px; right: 45px; }
  .j-lfoot { top: 300px; left: 45px; }
  .j-rfoot { top: 300px; right: 35px; }

  @keyframes skeletonPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }
  .skeleton-overlay { animation: skeletonPulse 2s ease-in-out infinite; }

  /* Guide frame */
  .guide-frame {
    position: absolute; top: 15%; left: 15%; right: 15%; bottom: 25%;
    border: 2px dashed rgba(0,212,255,0.3); border-radius: 20px;
  }
  .guide-corner { position: absolute; width: 24px; height: 24px; }
  .guide-corner::before, .guide-corner::after {
    content: ''; position: absolute; background: #00d4ff;
  }
  .guide-corner.tl { top: -2px; left: -2px; }
  .guide-corner.tl::before { width: 24px; height: 3px; top: 0; left: 0; }
  .guide-corner.tl::after { width: 3px; height: 24px; top: 0; left: 0; }
  .guide-corner.tr { top: -2px; right: -2px; }
  .guide-corner.tr::before { width: 24px; height: 3px; top: 0; right: 0; }
  .guide-corner.tr::after { width: 3px; height: 24px; top: 0; right: 0; }
  .guide-corner.bl { bottom: -2px; left: -2px; }
  .guide-corner.bl::before { width: 24px; height: 3px; bottom: 0; left: 0; }
  .guide-corner.bl::after { width: 3px; height: 24px; bottom: 0; left: 0; }
  .guide-corner.br { bottom: -2px; right: -2px; }
  .guide-corner.br::before { width: 24px; height: 3px; bottom: 0; right: 0; }
  .guide-corner.br::after { width: 3px; height: 24px; bottom: 0; right: 0; }

  /* Top bar */
  .nav-top {
    position: absolute; top: 59px; left: 28px; right: 28px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; z-index: 10;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .back-btn i { font-size: 16px; }
  .nav-title { font-size: 17px; font-weight: 700; }
  .flip-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .flip-btn i { font-size: 16px; }

  /* Detection status */
  .detection-status {
    position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 30px;
    border: 1px solid rgba(52,199,89,0.3);
    z-index: 10;
  }
  .detect-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #34c759;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .detect-text { font-size: 13px; font-weight: 600; color: #34c759; }

  /* Bottom panel */
  .bottom-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.95); backdrop-filter: blur(30px);
    border-top-left-radius: 32px; border-top-right-radius: 32px;
    padding: 28px; z-index: 10;
  }
  .panel-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; text-align: center; }
  .panel-subtitle { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 24px; }

  .checklist { margin-bottom: 24px; }
  .check-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .check-icon {
    width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .check-icon.done { background: rgba(52,199,89,0.2); color: #34c759; }
  .check-icon.pending { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); }
  .check-label { font-size: 14px; font-weight: 500; }
  .check-label.done { color: rgba(255,255,255,0.9); }
  .check-label.pending { color: rgba(255,255,255,0.35); }

  .start-btn {
    width: 100%; padding: 18px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    color: white; font-size: 17px; font-weight: 700;
    box-shadow: 0 8px 32px rgba(0,212,255,0.25);
  }
</style>
</head>
<body>
  <div class="camera-view">
    <img class="camera-feed" src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=500&h=900&fit=crop" alt="Camera">
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-top">
    <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
    <div class="nav-title">Camera Setup</div>
    <div class="flip-btn"><i class="fas fa-camera-rotate"></i></div>
  </div>

  <div class="detection-status">
    <div class="detect-dot"></div>
    <span class="detect-text">Pose Detected</span>
  </div>

  <!-- Guide Frame -->
  <div class="guide-frame">
    <div class="guide-corner tl"></div>
    <div class="guide-corner tr"></div>
    <div class="guide-corner bl"></div>
    <div class="guide-corner br"></div>
  </div>

  <!-- Skeleton -->
  <div class="skeleton-overlay">
    <div class="sk-head"></div>
    <div class="skeleton-line sk-spine"></div>
    <div class="skeleton-line sk-larm"></div>
    <div class="skeleton-line sk-rarm"></div>
    <div class="skeleton-line sk-lleg"></div>
    <div class="skeleton-line sk-rleg"></div>
    <div class="joint j-lshoulder"></div>
    <div class="joint j-rshoulder"></div>
    <div class="joint j-lelbow"></div>
    <div class="joint j-relbow"></div>
    <div class="joint j-lhand"></div>
    <div class="joint j-rhand"></div>
    <div class="joint j-hip"></div>
    <div class="joint j-lknee"></div>
    <div class="joint j-rknee"></div>
    <div class="joint j-lfoot"></div>
    <div class="joint j-rfoot"></div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="panel-title">Ready to Train</div>
    <div class="panel-subtitle">Position yourself within the frame</div>
    <div class="checklist">
      <div class="check-item">
        <div class="check-icon done"><i class="fas fa-check"></i></div>
        <span class="check-label done">Full body visible</span>
      </div>
      <div class="check-item">
        <div class="check-icon done"><i class="fas fa-check"></i></div>
        <span class="check-label done">Good lighting detected</span>
      </div>
      <div class="check-item">
        <div class="check-icon done"><i class="fas fa-check"></i></div>
        <span class="check-label done">Enough space around you</span>
      </div>
    </div>
    <button class="start-btn">Start Training <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
  </div>
</body>
</html>
