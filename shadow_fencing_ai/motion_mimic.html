<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Motion Mimic</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: white; overflow: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  body { display: flex; flex-direction: column; }

  /* Top section - Reference */
  .top-section {
    flex: 0 0 auto; margin-top: 59px; padding: 16px 28px;
  }
  .section-label {
    font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label .dot { width: 6px; height: 6px; border-radius: 50%; background: #00d4ff; }

  .reference-card {
    background: rgba(0,212,255,0.05); border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(0,212,255,0.15); position: relative; height: 220px;
  }
  .ref-visual {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* Parry 4 demonstration - stylized silhouette */
  .demo-figure {
    width: 120px; height: 220px; position: relative;
  }
  .demo-body { width: 50px; height: 120px; border: 2px solid rgba(0,212,255,0.5); border-radius: 25px 25px 10px 10px; position: absolute; top: 55px; left: 50%; transform: translateX(-50%); }
  .demo-head { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,212,255,0.5); position: absolute; top: 15px; left: 50%; transform: translateX(-50%); }
  /* Parry 4 - blade across body left side */
  .demo-arm-r {
    position: absolute; width: 80px; height: 3px; background: rgba(0,212,255,0.6);
    top: 80px; left: -15px; transform: rotate(-40deg); transform-origin: right center;
    border-radius: 2px; box-shadow: 0 0 10px rgba(0,212,255,0.3);
  }
  .demo-arm-l {
    position: absolute; width: 50px; height: 3px; background: rgba(0,212,255,0.4);
    top: 90px; right: -5px; transform: rotate(30deg); transform-origin: left center;
    border-radius: 2px;
  }
  /* Sword */
  .demo-sword {
    position: absolute; width: 3px; height: 90px;
    background: linear-gradient(180deg, #00d4ff, rgba(0,212,255,0.2));
    top: 20px; left: -35px; transform: rotate(-50deg);
    border-radius: 2px; box-shadow: 0 0 15px rgba(0,212,255,0.4);
  }
  .demo-legs-l { position: absolute; width: 3px; height: 60px; background: rgba(0,212,255,0.4); bottom: 5px; left: 30px; transform: rotate(10deg); border-radius: 2px; }
  .demo-legs-r { position: absolute; width: 3px; height: 60px; background: rgba(0,212,255,0.4); bottom: 5px; right: 25px; transform: rotate(-10deg); border-radius: 2px; }

  .move-label {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 700;
    border: 1px solid rgba(0,212,255,0.2); white-space: nowrap;
  }

  .arrow-indicators {
    position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .arrow-dot { width: 8px; height: 8px; border-radius: 50%; }
  .arrow-dot.active { background: #00d4ff; }
  .arrow-dot.inactive { background: rgba(255,255,255,0.15); }

  /* Similarity score ring */
  .score-ring {
    position: absolute; top: 16px; right: 16px;
    width: 70px; height: 70px; display: flex; align-items: center; justify-content: center;
  }
  .score-ring svg { position: absolute; transform: rotate(-90deg); }
  .score-val { font-size: 22px; font-weight: 800; color: #34c759; }
  .score-pct { font-size: 10px; color: rgba(255,255,255,0.4); }

  /* Middle section - Live feed */
  .live-section {
    flex: 1; padding: 12px 28px; position: relative;
  }
  .live-card {
    background: rgba(255,255,255,0.03); border-radius: 24px; height: 100%;
    border: 1px solid rgba(255,255,255,0.06); position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* User's skeleton overlay */
  .user-skeleton {
    width: 100px; height: 200px; position: relative; opacity: 0.9;
  }
  .us-body { width: 40px; height: 95px; border: 2px solid rgba(139,92,246,0.6); border-radius: 20px 20px 8px 8px; position: absolute; top: 45px; left: 50%; transform: translateX(-50%); }
  .us-head { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(139,92,246,0.6); position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
  .us-arm-r { position: absolute; width: 65px; height: 3px; background: rgba(139,92,246,0.6); top: 65px; left: -8px; transform: rotate(-35deg); transform-origin: right center; border-radius: 2px; }
  .us-arm-l { position: absolute; width: 40px; height: 3px; background: rgba(139,92,246,0.5); top: 72px; right: 0; transform: rotate(25deg); transform-origin: left center; border-radius: 2px; }
  .us-sword { position: absolute; width: 3px; height: 70px; background: linear-gradient(180deg, #8b5cf6, rgba(139,92,246,0.2)); top: 18px; left: -25px; transform: rotate(-45deg); border-radius: 2px; box-shadow: 0 0 12px rgba(139,92,246,0.3); }
  .us-leg-l { position: absolute; width: 3px; height: 48px; background: rgba(139,92,246,0.5); bottom: 5px; left: 25px; transform: rotate(8deg); border-radius: 2px; }
  .us-leg-r { position: absolute; width: 3px; height: 48px; background: rgba(139,92,246,0.5); bottom: 5px; right: 20px; transform: rotate(-12deg); border-radius: 2px; }

  .live-badge {
    position: absolute; top: 12px; left: 12px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 14px;
    font-size: 11px; font-weight: 600;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3b30; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .feedback-chip {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(52,199,89,0.15); border: 1px solid rgba(52,199,89,0.3);
    padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #34c759;
    display: flex; align-items: center; gap: 6px;
  }

  /* Bottom panel */
  .bottom-panel {
    flex: 0 0 auto; padding: 16px 28px 40px;
  }
  .move-steps { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; }
  .step-card {
    flex: 0 0 auto; width: 80px; text-align: center;
    background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px 8px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .step-card.active { border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.08); }
  .step-card.done { border-color: rgba(52,199,89,0.3); }
  .step-num { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .step-card.active .step-num { color: #00d4ff; }
  .step-card.done .step-num { color: #34c759; }
  .step-card:not(.active):not(.done) .step-num { color: rgba(255,255,255,0.2); }
  .step-name { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .step-card.done .step-name { color: rgba(52,199,89,0.6); }

  .action-row { display: flex; gap: 12px; }
  .skip-btn {
    flex: 0 0 56px; height: 56px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5);
  }
  .next-btn {
    flex: 1; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,212,255,0.25);
  }
</style>
</head>
<body>
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:43</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Reference Section -->
  <div class="top-section">
    <div class="section-label"><div class="dot"></div>Reference Move</div>
    <div class="reference-card">
      <div class="ref-visual">
        <div class="demo-figure">
          <div class="demo-head"></div>
          <div class="demo-body"></div>
          <div class="demo-arm-r"></div>
          <div class="demo-arm-l"></div>
          <div class="demo-sword"></div>
          <div class="demo-legs-l"></div>
          <div class="demo-legs-r"></div>
        </div>
      </div>
      <div class="move-label"><i class="fas fa-shield-halved" style="margin-right: 6px; color: #00d4ff;"></i>Parry 4</div>
      <div class="arrow-indicators">
        <div class="arrow-dot active"></div>
        <div class="arrow-dot active"></div>
        <div class="arrow-dot inactive"></div>
        <div class="arrow-dot inactive"></div>
      </div>
      <div class="score-ring">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="28" stroke="rgba(255,255,255,0.06)" stroke-width="4" fill="none"/>
          <circle cx="35" cy="35" r="28" stroke="#34c759" stroke-width="4" fill="none" stroke-dasharray="176" stroke-dashoffset="30" stroke-linecap="round"/>
        </svg>
        <div style="text-align: center;">
          <div class="score-val">83</div>
          <div class="score-pct">%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Section -->
  <div class="live-section">
    <div class="section-label"><div class="dot" style="background: #8b5cf6;"></div>Your Move</div>
    <div class="live-card">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div class="user-skeleton">
        <div class="us-head"></div>
        <div class="us-body"></div>
        <div class="us-arm-r"></div>
        <div class="us-arm-l"></div>
        <div class="us-sword"></div>
        <div class="us-leg-l"></div>
        <div class="us-leg-r"></div>
      </div>
      <div class="feedback-chip"><i class="fas fa-check-circle"></i> Good form!</div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="move-steps">
      <div class="step-card done">
        <div class="step-num"><i class="fas fa-check" style="font-size: 14px;"></i></div>
        <div class="step-name">En Garde</div>
      </div>
      <div class="step-card active">
        <div class="step-num">2</div>
        <div class="step-name">Parry 4</div>
      </div>
      <div class="step-card">
        <div class="step-num">3</div>
        <div class="step-name">Parry 6</div>
      </div>
      <div class="step-card">
        <div class="step-num">4</div>
        <div class="step-name">Riposte</div>
      </div>
    </div>
    <div class="action-row">
      <div class="skip-btn"><i class="fas fa-forward"></i></div>
      <div class="next-btn">Next Move <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></div>
    </div>
  </div>
</body>
</html>
