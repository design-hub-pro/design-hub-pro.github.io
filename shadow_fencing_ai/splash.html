<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Splash</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-scrollbar: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; }

  body {
    background: linear-gradient(165deg, #0a0a1a 0%, #0d1b2a 30%, #1b2838 60%, #0a0a1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }

  .particles {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
  }
  .particle {
    position: absolute; border-radius: 50%; animation: float 6s ease-in-out infinite;
  }
  .particle:nth-child(1) { width: 4px; height: 4px; background: rgba(0,212,255,0.4); top: 20%; left: 15%; animation-delay: 0s; }
  .particle:nth-child(2) { width: 3px; height: 3px; background: rgba(139,92,246,0.4); top: 60%; left: 80%; animation-delay: 1s; }
  .particle:nth-child(3) { width: 5px; height: 5px; background: rgba(0,212,255,0.3); top: 40%; left: 50%; animation-delay: 2s; }
  .particle:nth-child(4) { width: 3px; height: 3px; background: rgba(139,92,246,0.3); top: 75%; left: 25%; animation-delay: 3s; }
  .particle:nth-child(5) { width: 4px; height: 4px; background: rgba(0,212,255,0.3); top: 15%; left: 70%; animation-delay: 4s; }
  .particle:nth-child(6) { width: 2px; height: 2px; background: rgba(255,255,255,0.2); top: 85%; left: 60%; animation-delay: 1.5s; }
  .particle:nth-child(7) { width: 3px; height: 3px; background: rgba(0,212,255,0.2); top: 50%; left: 10%; animation-delay: 2.5s; }
  .particle:nth-child(8) { width: 4px; height: 4px; background: rgba(139,92,246,0.2); top: 30%; left: 90%; animation-delay: 3.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 0.8; }
  }

  .glow-ring {
    position: absolute; width: 340px; height: 340px; border-radius: 50%;
    border: 1px solid rgba(0,212,255,0.1);
    animation: pulseRing 4s ease-in-out infinite;
  }
  .glow-ring:nth-child(2) { width: 420px; height: 420px; animation-delay: 1s; border-color: rgba(139,92,246,0.08); }
  .glow-ring:nth-child(3) { width: 500px; height: 500px; animation-delay: 2s; border-color: rgba(0,212,255,0.05); }

  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  .logo-container {
    position: relative; z-index: 2; text-align: center;
    animation: fadeInUp 1.2s ease-out;
  }

  .logo-icon {
    width: 120px; height: 120px; margin: 0 auto 32px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(139,92,246,0.15));
    border-radius: 32px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0,212,255,0.2);
    box-shadow: 0 0 60px rgba(0,212,255,0.15), 0 0 120px rgba(139,92,246,0.1);
    position: relative;
  }
  .logo-icon::before {
    content: ''; position: absolute; inset: -2px; border-radius: 34px;
    background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(139,92,246,0.3));
    z-index: -1; filter: blur(8px);
  }
  .logo-icon i { font-size: 52px; background: linear-gradient(135deg, #00d4ff, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .app-name {
    font-size: 34px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #c4b5fd 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 15px; color: rgba(255,255,255,0.45); font-weight: 400; letter-spacing: 3px; text-transform: uppercase;
  }

  .start-btn {
    margin-top: 60px; padding: 18px 64px; border: none; border-radius: 50px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    color: white; font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; position: relative; z-index: 2;
    box-shadow: 0 8px 32px rgba(0,212,255,0.3), 0 4px 16px rgba(139,92,246,0.2);
    animation: fadeInUp 1.2s ease-out 0.3s both;
  }
  .start-btn:active { transform: scale(0.97); }

  .version {
    position: absolute; bottom: 50px; color: rgba(255,255,255,0.2);
    font-size: 12px; z-index: 2; letter-spacing: 1px;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Sword slash effect */
  .slash {
    position: absolute; width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.6), transparent);
    transform: rotate(-30deg); top: 35%; left: 10%;
    animation: slashGlow 3s ease-in-out infinite;
  }
  .slash:nth-child(2) {
    transform: rotate(25deg); top: 55%; left: 55%; animation-delay: 1.5s;
    background: linear-gradient(90deg, transparent, rgba(139,92,246,0.4), transparent);
  }
  @keyframes slashGlow {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>
  <div class="slash"></div><div class="slash"></div>
  <div class="glow-ring"></div><div class="glow-ring"></div><div class="glow-ring"></div>

  <div class="logo-container">
    <div class="logo-icon">
      <i class="fas fa-bolt"></i>
    </div>
    <div class="app-name">Shadow Fencing</div>
    <div class="tagline">AI-Powered Training</div>
    <button class="start-btn">Get Started</button>
  </div>

  <div class="version">v1.0.0</div>
</body>
</html>
