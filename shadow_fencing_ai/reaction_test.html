<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Reaction Strike</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: white; overflow: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Game area background */
  .game-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%);
  }

  /* Grid lines */
  .grid-overlay {
    position: absolute; inset: 0; opacity: 0.05;
    background-image:
      linear-gradient(rgba(0,212,255,1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,1) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Top HUD */
  .hud-top {
    position: absolute; top: 65px; left: 28px; right: 28px; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .hud-score {
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 12px 18px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .hud-score-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .hud-score-value { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #00d4ff, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .hud-timer {
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 12px 18px; text-align: center;
    border: 1px solid rgba(255,59,48,0.3);
  }
  .hud-timer-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .hud-timer-value { font-size: 32px; font-weight: 800; color: #ff3b30; }

  /* Combo display */
  .combo {
    position: absolute; top: 140px; left: 50%; transform: translateX(-50%); z-index: 10;
    text-align: center;
  }
  .combo-count { font-size: 48px; font-weight: 900; color: #ff9500; text-shadow: 0 0 30px rgba(255,149,0,0.5); }
  .combo-label { font-size: 12px; font-weight: 700; color: #ff9500; text-transform: uppercase; letter-spacing: 3px; }

  /* Target area - virtual opponent silhouette */
  .opponent-area {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 260px; height: 420px;
  }

  /* Body outline */
  .body-outline {
    width: 160px; height: 350px; margin: 0 auto; position: relative;
    border: 2px solid rgba(255,255,255,0.08); border-radius: 80px 80px 20px 20px;
    background: rgba(255,255,255,0.02);
  }
  .body-head {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.02);
  }

  /* Target points */
  .target {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .target-active {
    width: 64px; height: 64px;
    background: radial-gradient(circle, rgba(255,59,48,0.8), rgba(255,59,48,0.2));
    border: 3px solid #ff3b30;
    box-shadow: 0 0 30px rgba(255,59,48,0.5), 0 0 60px rgba(255,59,48,0.2);
    animation: targetPulse 0.8s ease-in-out infinite;
  }
  .target-active::before {
    content: ''; width: 20px; height: 20px; border-radius: 50%;
    background: #ff3b30;
  }
  .target-hit {
    width: 52px; height: 52px;
    background: rgba(52,199,89,0.2);
    border: 2px solid rgba(52,199,89,0.5);
  }
  .target-hit i { color: #34c759; font-size: 18px; }

  @keyframes targetPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Active target positioned at chest */
  .t1 { top: 80px; left: 20px; }
  /* Hit targets */
  .t2 { top: 30px; right: 35px; }
  .t3 { top: 170px; left: 50%; transform: translateX(-50%); }
  .t4 { top: 230px; right: 25px; }

  /* Strike lines */
  .strike-line {
    position: absolute; width: 2px; height: 80px;
    background: linear-gradient(180deg, rgba(52,199,89,0.6), transparent);
    transform: rotate(-20deg);
  }
  .sl1 { top: 15px; right: 55px; opacity: 0.5; }
  .sl2 { top: 155px; left: 90px; transform: rotate(15deg); opacity: 0.3; }

  /* Bottom HUD */
  .hud-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.9); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 20px 28px 44px; z-index: 10;
  }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .progress-label { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 600; }
  .progress-count { font-size: 14px; font-weight: 700; }
  .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 18px; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #00d4ff, #8b5cf6); width: 60%; }

  .hud-stats { display: flex; gap: 12px; }
  .hud-stat {
    flex: 1; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .hud-stat-val { font-size: 20px; font-weight: 800; }
  .hud-stat-val.speed { color: #00d4ff; }
  .hud-stat-val.accuracy { color: #34c759; }
  .hud-stat-val.miss { color: #ff3b30; }
  .hud-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

  /* Pause button */
  .pause-btn {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1); z-index: 10;
  }
  .pause-btn i { font-size: 12px; }
</style>
</head>
<body>
  <div class="game-bg"></div>
  <div class="grid-overlay"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:42</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-score">
      <div class="hud-score-label">Score</div>
      <div class="hud-score-value">1,240</div>
    </div>
    <div class="hud-timer">
      <div class="hud-timer-label">Time</div>
      <div class="hud-timer-value">0:18</div>
    </div>
  </div>

  <!-- Combo -->
  <div class="combo">
    <div class="combo-count">5x</div>
    <div class="combo-label">Combo</div>
  </div>

  <!-- Opponent Area -->
  <div class="opponent-area">
    <div class="body-outline">
      <div class="body-head"></div>
      <!-- Active target -->
      <div class="target target-active t1"></div>
      <!-- Hit targets -->
      <div class="target target-hit t2"><i class="fas fa-check"></i></div>
      <div class="target target-hit t3"><i class="fas fa-check"></i></div>
      <div class="target target-hit t4"><i class="fas fa-check"></i></div>
      <!-- Strike lines -->
      <div class="strike-line sl1"></div>
      <div class="strike-line sl2"></div>
    </div>
  </div>

  <!-- Bottom HUD -->
  <div class="hud-bottom">
    <div class="progress-row">
      <span class="progress-label">Targets Cleared</span>
      <span class="progress-count">12 / 20</span>
    </div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="hud-stats">
      <div class="hud-stat">
        <div class="hud-stat-val speed">0.3s</div>
        <div class="hud-stat-lbl">Avg Speed</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-val accuracy">92%</div>
        <div class="hud-stat-lbl">Accuracy</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-val miss">1</div>
        <div class="hud-stat-lbl">Missed</div>
      </div>
    </div>
  </div>
</body>
</html>
