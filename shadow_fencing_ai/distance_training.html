<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Distance Control</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: white; overflow: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-time { font-size: 16px; font-weight: 600; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  /* Background */
  .bg-gradient {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(139,92,246,0.12), transparent 70%);
  }

  /* Top Nav */
  .nav-top {
    position: absolute; top: 59px; left: 28px; right: 28px;
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0; z-index: 10;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
  }
  .back-btn i { font-size: 16px; }
  .nav-title { font-size: 17px; font-weight: 700; }
  .info-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
  }
  .info-btn i { font-size: 16px; }

  /* Distance visualization */
  .distance-viz {
    position: absolute; top: 140px; left: 28px; right: 28px; bottom: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  /* Distance zones */
  .zone-track {
    width: 100%; height: 320px; position: relative;
    display: flex; flex-direction: column;
  }
  .zone {
    flex: 1; border-radius: 16px; margin: 4px 0; display: flex; align-items: center;
    padding: 0 20px; position: relative; overflow: hidden;
  }
  .zone-far {
    background: linear-gradient(90deg, rgba(52,199,89,0.08), rgba(52,199,89,0.03));
    border: 1px solid rgba(52,199,89,0.15);
  }
  .zone-mid {
    background: linear-gradient(90deg, rgba(255,149,0,0.08), rgba(255,149,0,0.03));
    border: 1px solid rgba(255,149,0,0.15);
  }
  .zone-close {
    background: linear-gradient(90deg, rgba(255,59,48,0.12), rgba(255,59,48,0.03));
    border: 1px solid rgba(255,59,48,0.2);
  }
  .zone-active {
    border-width: 2px;
  }
  .zone-close.zone-active {
    box-shadow: 0 0 30px rgba(255,59,48,0.15);
    border-color: rgba(255,59,48,0.5);
  }

  .zone-label { font-size: 13px; font-weight: 700; flex: 1; }
  .zone-far .zone-label { color: #34c759; }
  .zone-mid .zone-label { color: #ff9500; }
  .zone-close .zone-label { color: #ff3b30; }

  .zone-dist { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.3); }

  .zone-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 14px; }
  .zone-far .zone-icon { background: rgba(52,199,89,0.15); color: #34c759; }
  .zone-mid .zone-icon { background: rgba(255,149,0,0.15); color: #ff9500; }
  .zone-close .zone-icon { background: rgba(255,59,48,0.15); color: #ff3b30; }

  /* Current position indicator */
  .position-indicator {
    position: absolute; right: -8px; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center; z-index: 5;
  }
  .pos-dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff3b30; box-shadow: 0 0 20px rgba(255,59,48,0.6);
    animation: posPulse 1.5s ease-in-out infinite;
  }
  .pos-ring {
    position: absolute; width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid rgba(255,59,48,0.3);
    animation: posPulse 1.5s ease-in-out infinite;
  }
  @keyframes posPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.6; } }

  /* Command display */
  .command-display {
    position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 10;
  }
  .command-text {
    font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
    color: #ff3b30; text-shadow: 0 0 30px rgba(255,59,48,0.4);
    animation: commandFlash 1s ease-in-out infinite;
  }
  .command-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }
  @keyframes commandFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

  /* Distance meter */
  .distance-meter {
    position: absolute; left: 14px; top: 140px; bottom: 280px;
    width: 40px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 10;
  }
  .meter-track {
    width: 6px; height: 200px; background: rgba(255,255,255,0.06); border-radius: 3px;
    position: relative;
  }
  .meter-fill {
    position: absolute; bottom: 0; width: 100%; border-radius: 3px;
    background: linear-gradient(180deg, #ff3b30, #ff9500, #34c759);
    height: 75%;
  }
  .meter-thumb {
    position: absolute; bottom: 72%; left: 50%; transform: translate(-50%, 50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: white; box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .meter-label-top { font-size: 9px; color: rgba(255,255,255,0.3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .meter-label-bot { font-size: 9px; color: rgba(255,255,255,0.3); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

  /* Bottom panel */
  .bottom-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.95); backdrop-filter: blur(30px);
    border-top-left-radius: 32px; border-top-right-radius: 32px;
    padding: 24px 28px 44px; z-index: 10;
  }

  .drill-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .drill-round { font-size: 20px; font-weight: 800; }
  .drill-progress { font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 600; }

  .drill-stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .drill-stat {
    flex: 1; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 14px 12px;
    text-align: center; border: 1px solid rgba(255,255,255,0.06);
  }
  .drill-stat-val { font-size: 22px; font-weight: 800; }
  .drill-stat-val.good { color: #34c759; }
  .drill-stat-val.avg { color: #ff9500; }
  .drill-stat-val.time { color: #00d4ff; }
  .drill-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

  .drill-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; }
  .drill-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8b5cf6, #a855f7); width: 50%; }
</style>
</head>
<body>
  <div class="bg-gradient"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:44</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-top">
    <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
    <div class="nav-title">Distance Control</div>
    <div class="info-btn"><i class="fas fa-question"></i></div>
  </div>

  <!-- Command -->
  <div class="command-display">
    <div class="command-text">Advance!</div>
    <div class="command-sub">Move closer to the target zone</div>
  </div>

  <!-- Distance Meter -->
  <div class="distance-meter">
    <div class="meter-label-top">Near</div>
    <div class="meter-track">
      <div class="meter-fill"></div>
      <div class="meter-thumb"></div>
    </div>
    <div class="meter-label-bot">Far</div>
  </div>

  <!-- Zone Track -->
  <div class="distance-viz">
    <div class="zone-track">
      <div class="zone zone-far">
        <div class="zone-icon"><i class="fas fa-shield-halved"></i></div>
        <div class="zone-label">Safe Zone</div>
        <div class="zone-dist">Far</div>
      </div>
      <div class="zone zone-mid">
        <div class="zone-icon"><i class="fas fa-crosshairs"></i></div>
        <div class="zone-label">Prep Zone</div>
        <div class="zone-dist">Medium</div>
      </div>
      <div class="zone zone-close zone-active" style="position: relative;">
        <div class="zone-icon"><i class="fas fa-bolt"></i></div>
        <div class="zone-label">Strike Zone</div>
        <div class="zone-dist">Close</div>
        <div class="position-indicator" style="top: 50%; transform: translateY(-50%);">
          <div class="pos-ring"></div>
          <div class="pos-dot"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="drill-info">
      <div class="drill-round">Round 5 / 10</div>
      <div class="drill-progress">50%</div>
    </div>
    <div class="drill-bar" style="margin-bottom: 20px;"><div class="drill-bar-fill"></div></div>
    <div class="drill-stats">
      <div class="drill-stat">
        <div class="drill-stat-val good">8</div>
        <div class="drill-stat-lbl">Correct</div>
      </div>
      <div class="drill-stat">
        <div class="drill-stat-val avg">0.8s</div>
        <div class="drill-stat-lbl">React</div>
      </div>
      <div class="drill-stat">
        <div class="drill-stat-val time">2:15</div>
        <div class="drill-stat-lbl">Elapsed</div>
      </div>
    </div>
  </div>
</body>
</html>
