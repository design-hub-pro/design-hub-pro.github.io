<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Fencing AI - Results</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: white; overflow-x: hidden; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100; background: rgba(10,10,26,0.9); backdrop-filter: blur(20px);
  }
  .status-time { font-size: 16px; font-weight: 600; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }

  .content { padding: 20px 28px 120px; }

  /* Celebration header */
  .celebration {
    text-align: center; padding: 20px 0 30px; position: relative;
  }
  .trophy-circle {
    width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px;
    background: linear-gradient(135deg, rgba(255,214,0,0.15), rgba(255,149,0,0.15));
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,214,0,0.3);
    box-shadow: 0 0 40px rgba(255,214,0,0.15);
  }
  .trophy-circle i { font-size: 42px; color: #ffd600; }
  .result-title { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
  .result-subtitle { font-size: 14px; color: rgba(255,255,255,0.45); }

  /* Score ring */
  .score-section { text-align: center; margin-bottom: 32px; }
  .big-score-ring {
    width: 160px; height: 160px; margin: 0 auto 16px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .big-score-ring svg { position: absolute; transform: rotate(-90deg); }
  .big-score-val { font-size: 52px; font-weight: 900; line-height: 1; }
  .big-score-max { font-size: 16px; color: rgba(255,255,255,0.3); font-weight: 600; }
  .score-grade {
    display: inline-block; padding: 6px 20px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(52,199,89,0.15), rgba(52,199,89,0.05));
    border: 1px solid rgba(52,199,89,0.3);
    font-size: 14px; font-weight: 700; color: #34c759;
  }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .stat-item {
    background: rgba(255,255,255,0.04); border-radius: 18px; padding: 18px 16px;
    border: 1px solid rgba(255,255,255,0.06); text-align: center;
  }
  .stat-icon { font-size: 22px; margin-bottom: 8px; }
  .stat-val { font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

  /* Performance chart */
  .chart-section { margin-bottom: 28px; }
  .chart-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .chart-container {
    background: rgba(255,255,255,0.03); border-radius: 18px; padding: 20px;
    border: 1px solid rgba(255,255,255,0.06); height: 140px; position: relative;
  }
  .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 90px; gap: 10px; padding: 0 8px; }
  .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .chart-bar {
    width: 100%; border-radius: 6px 6px 2px 2px; min-height: 8px;
    background: linear-gradient(180deg, #00d4ff, rgba(0,212,255,0.4));
  }
  .chart-bar.best { background: linear-gradient(180deg, #34c759, rgba(52,199,89,0.4)); }
  .chart-label { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 600; }

  /* Achievements */
  .achievements { margin-bottom: 28px; }
  .ach-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .ach-row { display: flex; gap: 12px; overflow-x: auto; }
  .ach-card {
    flex: 0 0 auto; width: 100px; text-align: center; padding: 18px 12px;
    background: rgba(255,255,255,0.04); border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .ach-icon {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .ach-icon.gold { background: rgba(255,214,0,0.15); color: #ffd600; }
  .ach-icon.blue { background: rgba(0,212,255,0.15); color: #00d4ff; }
  .ach-icon.purple { background: rgba(139,92,246,0.15); color: #a78bfa; }
  .ach-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.7); }

  /* Action buttons */
  .actions { display: flex; gap: 12px; }
  .retry-btn {
    flex: 0 0 60px; height: 56px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6);
    font-size: 20px;
  }
  .done-btn {
    flex: 1; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,212,255,0.25);
  }
  .share-btn {
    flex: 0 0 60px; height: 56px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6);
    font-size: 20px;
  }
</style>
</head>
<body>
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:46</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <!-- Celebration -->
    <div class="celebration">
      <div class="trophy-circle"><i class="fas fa-trophy"></i></div>
      <div class="result-title">Session Complete!</div>
      <div class="result-subtitle">Reaction Strike - Speed Challenge</div>
    </div>

    <!-- Big Score -->
    <div class="score-section">
      <div class="big-score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="68" stroke="rgba(255,255,255,0.06)" stroke-width="8" fill="none"/>
          <circle cx="80" cy="80" r="68" stroke="url(#grad)" stroke-width="8" fill="none" stroke-dasharray="427" stroke-dashoffset="55" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00d4ff"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <div class="big-score-val">87</div>
          <div class="big-score-max">/ 100</div>
        </div>
      </div>
      <div class="score-grade"><i class="fas fa-star" style="margin-right: 4px;"></i> Excellent</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-icon" style="color: #00d4ff;">&#9889;</div>
        <div class="stat-val" style="color: #00d4ff;">0.31s</div>
        <div class="stat-lbl">Avg Reaction</div>
      </div>
      <div class="stat-item">
        <div class="stat-icon" style="color: #34c759;">&#127919;</div>
        <div class="stat-val" style="color: #34c759;">92%</div>
        <div class="stat-lbl">Accuracy</div>
      </div>
      <div class="stat-item">
        <div class="stat-icon" style="color: #ff9500;">&#128293;</div>
        <div class="stat-val" style="color: #ff9500;">8x</div>
        <div class="stat-lbl">Best Combo</div>
      </div>
      <div class="stat-item">
        <div class="stat-icon" style="color: #a78bfa;">&#9200;</div>
        <div class="stat-val" style="color: #a78bfa;">2:34</div>
        <div class="stat-lbl">Duration</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="chart-section">
      <div class="chart-title">Reaction Times</div>
      <div class="chart-container">
        <div class="chart-bars">
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:65%;"></div><div class="chart-label">R1</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:50%;"></div><div class="chart-label">R2</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:75%;"></div><div class="chart-label">R3</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar best" style="height:90%;"></div><div class="chart-label">R4</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:60%;"></div><div class="chart-label">R5</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:80%;"></div><div class="chart-label">R6</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:55%;"></div><div class="chart-label">R7</div></div>
          <div class="chart-bar-wrap"><div class="chart-bar best" style="height:85%;"></div><div class="chart-label">R8</div></div>
        </div>
      </div>
    </div>

    <!-- Achievements -->
    <div class="achievements">
      <div class="ach-title">Earned</div>
      <div class="ach-row">
        <div class="ach-card">
          <div class="ach-icon gold"><i class="fas fa-bolt"></i></div>
          <div class="ach-name">Quick Draw</div>
        </div>
        <div class="ach-card">
          <div class="ach-icon blue"><i class="fas fa-crosshairs"></i></div>
          <div class="ach-name">Sharpshooter</div>
        </div>
        <div class="ach-card">
          <div class="ach-icon purple"><i class="fas fa-fire"></i></div>
          <div class="ach-name">On Fire</div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <div class="retry-btn"><i class="fas fa-redo"></i></div>
      <div class="done-btn">Done</div>
      <div class="share-btn"><i class="fas fa-share-nodes"></i></div>
    </div>
  </div>
</body>
</html>
