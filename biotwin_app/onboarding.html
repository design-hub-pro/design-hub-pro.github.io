<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioTwin - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end pb-2 justify-between">
        <span class="text-white text-sm font-semibold">9:41</span>
        <div class="flex items-center gap-1">
            <div class="w-[75px] h-[32px] bg-black rounded-full mx-auto"></div>
        </div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-white text-xs"></i>
            <i class="fas fa-wifi text-white text-xs"></i>
            <i class="fas fa-battery-full text-white text-xs"></i>
        </div>
    </div>

    <!-- Hero Image -->
    <div class="relative" style="height: calc(100% - 59px);">
        <div class="absolute inset-0">
            <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1777152158874-image-1.png" class="w-full h-full object-cover" alt="BioTwin Hero">
            <div class="absolute inset-0" style="background: linear-gradient(to top, #0a0e1a 0%, #0a0e1a 25%, transparent 60%);"></div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 px-7 pb-12">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-600 flex items-center justify-center">
                    <i class="fas fa-dna text-white text-xl"></i>
                </div>
                <span class="text-white text-2xl font-bold">BioTwin</span>
            </div>

            <h1 class="text-white text-3xl font-black leading-tight mb-3">Your Digital<br>Health Twin</h1>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">Upload health reports. Visualize results on your interactive body model. Understand your health like never before.</p>

            <!-- Dots -->
            <div class="flex items-center gap-2 mb-6">
                <div class="w-6 h-2 rounded-full bg-teal-400"></div>
                <div class="w-2 h-2 rounded-full bg-gray-600"></div>
                <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            </div>

            <!-- CTA Button -->
            <button class="w-full py-4 rounded-2xl bg-gradient-to-r from-teal-400 to-cyan-500 text-white font-bold text-base">
                Get Started
            </button>
            <p class="text-center text-gray-500 text-xs mt-4">Already have an account? <span class="text-teal-400">Sign In</span></p>
        </div>
    </div>
</body>
</html>
