<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpiSim - Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0f0f1a; }
        .glow-text { text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        .chart-bar { transition: height 0.5s ease; }
    </style>
</head>
<body class="min-h-screen text-white">
    <!-- Status Bar -->
    <div class="px-6 py-2 flex justify-between items-center text-base font-medium text-white/80">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="px-5 pt-2 pb-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white/10 rounded-lg flex items-center justify-center">
                    <i class="fas fa-arrow-left text-white"></i>
                </div>
                <div>
                    <p class="text-purple-300 text-sm">Level 3</p>
                    <h1 class="text-lg font-bold">Resource Crisis</h1>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-white/10 rounded-full px-3 py-1.5">
                <i class="fas fa-clock text-purple-400 text-sm"></i>
                <span class="text-base font-medium">Day 45</span>
            </div>
        </div>
    </div>

    <!-- Live Stats Dashboard -->
    <div class="px-5 mb-4">
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-gradient-to-b from-red-900/50 to-red-900/20 rounded-xl p-3 border border-red-500/30">
                <div class="flex items-center gap-1 mb-1">
                    <i class="fas fa-virus text-red-400 text-sm"></i>
                    <span class="text-red-300 text-xs">Infected</span>
                </div>
                <p class="text-xl font-bold text-red-400">24,580</p>
                <p class="text-xs text-red-300/70"><i class="fas fa-arrow-up"></i> +1,240</p>
            </div>
            <div class="bg-gradient-to-b from-gray-800/50 to-gray-800/20 rounded-xl p-3 border border-gray-500/30">
                <div class="flex items-center gap-1 mb-1">
                    <i class="fas fa-skull text-gray-400 text-sm"></i>
                    <span class="text-gray-300 text-xs">Deaths</span>
                </div>
                <p class="text-xl font-bold text-gray-300">892</p>
                <p class="text-xs text-gray-400"><i class="fas fa-arrow-up"></i> +28</p>
            </div>
            <div class="bg-gradient-to-b from-green-900/50 to-green-900/20 rounded-xl p-3 border border-green-500/30">
                <div class="flex items-center gap-1 mb-1">
                    <i class="fas fa-heart text-green-400 text-sm"></i>
                    <span class="text-green-300 text-xs">Recovered</span>
                </div>
                <p class="text-xl font-bold text-green-400">18,340</p>
                <p class="text-xs text-green-300/70"><i class="fas fa-arrow-up"></i> +920</p>
            </div>
        </div>
    </div>

    <!-- Transmission Rate Chart -->
    <div class="px-5 mb-4">
        <div class="bg-white/5 rounded-2xl p-4 border border-white/10">
            <div class="flex justify-between items-center mb-3">
                <span class="text-base font-semibold">Effective R (Transmission)</span>
                <div class="flex items-center gap-2">
                    <span class="text-2xl font-bold text-amber-400 glow-text">1.4</span>
                    <span class="text-xs text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded">Spreading</span>
                </div>
            </div>
            <!-- Mini Chart -->
            <div class="flex items-end gap-1 h-16 mt-2">
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 40%"></div>
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 55%"></div>
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 70%"></div>
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 85%"></div>
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 65%"></div>
                <div class="flex-1 bg-purple-600/60 rounded-t chart-bar" style="height: 50%"></div>
                <div class="flex-1 bg-amber-500 rounded-t chart-bar" style="height: 60%"></div>
            </div>
            <div class="flex justify-between text-xs text-white/40 mt-1">
                <span>Day 39</span>
                <span>Day 45</span>
            </div>
        </div>
    </div>

    <!-- Available Resources -->
    <div class="px-5 mb-4">
        <h3 class="text-base font-semibold mb-3">Resources Available</h3>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-coins text-yellow-400"></i>
                    <span class="text-sm text-white/70">Budget</span>
                </div>
                <p class="text-lg font-bold">$2.4M</p>
                <div class="h-1.5 bg-white/10 rounded-full mt-2 overflow-hidden">
                    <div class="h-full bg-yellow-400 rounded-full" style="width: 35%"></div>
                </div>
            </div>
            <div class="bg-white/5 rounded-xl p-3 border border-white/10">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-hospital text-blue-400"></i>
                    <span class="text-sm text-white/70">Hospital</span>
                </div>
                <p class="text-lg font-bold">78%</p>
                <div class="h-1.5 bg-white/10 rounded-full mt-2 overflow-hidden">
                    <div class="h-full bg-blue-400 rounded-full" style="width: 78%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Policy Actions -->
    <div class="px-5 mb-4">
        <h3 class="text-base font-semibold mb-3">Choose Your Action</h3>
        <div class="space-y-2">
            <button class="w-full bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/50 rounded-xl p-3 flex items-center gap-3 transition">
                <div class="w-10 h-10 bg-purple-500/30 rounded-lg flex items-center justify-center">
                    <i class="fas fa-mask-face text-purple-300"></i>
                </div>
                <div class="flex-1 text-left">
                    <p class="font-semibold text-base">Mask Mandate</p>
                    <p class="text-sm text-white/50">-15% transmission, -5% approval</p>
                </div>
                <span class="text-sm text-yellow-400">$200K</span>
            </button>

            <button class="w-full bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 rounded-xl p-3 flex items-center gap-3 transition">
                <div class="w-10 h-10 bg-blue-500/30 rounded-lg flex items-center justify-center">
                    <i class="fas fa-syringe text-blue-300"></i>
                </div>
                <div class="flex-1 text-left">
                    <p class="font-semibold text-base">Vaccine Push</p>
                    <p class="text-sm text-white/50">+5% immunity/week</p>
                </div>
                <span class="text-sm text-yellow-400">$800K</span>
            </button>

            <button class="w-full bg-red-600/30 hover:bg-red-600/50 border border-red-500/50 rounded-xl p-3 flex items-center gap-3 transition">
                <div class="w-10 h-10 bg-red-500/30 rounded-lg flex items-center justify-center">
                    <i class="fas fa-house-chimney text-red-300"></i>
                </div>
                <div class="flex-1 text-left">
                    <p class="font-semibold text-base">Lockdown</p>
                    <p class="text-sm text-white/50">-40% transmission, -20% approval</p>
                </div>
                <span class="text-sm text-yellow-400">$1.2M</span>
            </button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-white/10 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-white/40 text-2xl"></i>
                <span class="text-sm text-white/40 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-gamepad text-purple-400 text-2xl"></i>
                <span class="text-sm text-purple-400 font-medium mt-1">Play</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-white/40 text-2xl"></i>
                <span class="text-sm text-white/40 mt-1">Stats</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-book text-white/40 text-2xl"></i>
                <span class="text-sm text-white/40 mt-1">Learn</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-white/40 text-2xl"></i>
                <span class="text-sm text-white/40 mt-1">Profile</span>
            </div>
        </div>
    </div>

    <div class="h-24"></div>
</body>
</html>
