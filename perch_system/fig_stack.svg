<text x="24" y="658" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#16202B">Overall depth 96 mm, footprint 168 x 190 mm. Nothing at mains voltage sits inside this stack.</text>
