<text x="884" y="406" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#16202B" text-anchor="middle">Mean within 5 percent of a 6 g target</text>
<text x="884" y="422" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A6B7A" text-anchor="middle">no dispense under 4 g or over 9 g, 20 trials</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202B"/></marker></defs>
<text x="24" y="458" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7A">The two camera checks are not bench work. They run against 300 hand-labelled clips and 200 recorded door closes.</text>
