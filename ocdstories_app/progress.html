<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>OCD Stories - Progress</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px mt-2"><div class="lbl">Ari · Week 2</div><div class="h1 mt-1">Your progress</div></div>

    <div class="px mt-5">
      <div class="card p-5 flex items-center gap-5">
        <div class="relative w-[128px] h-[128px] flex-shrink-0">
          <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#E9E4DA" stroke-width="12"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#2F6B55" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="63"/>
            <circle cx="60" cy="60" r="34" fill="none" stroke="#E9E4DA" stroke-width="10"/>
            <circle cx="60" cy="60" r="34" fill="none" stroke="#5B6FD6" stroke-width="10" stroke-linecap="round" stroke-dasharray="214" stroke-dashoffset="54"/>
          </svg>
          <div class="absolute inset-0 flex items-center justify-center"><i class="fas fa-brain text-xl text-[#1E2440]"></i></div>
        </div>
        <div class="flex-1 space-y-4">
          <div><div class="flex items-center gap-2"><span class="dot" style="background:#2F6B55"></span><span class="text-xs font-semibold muted">Explain compulsions</span></div><div class="text-[28px] font-extrabold tracking-tight">4<span class="text-base muted">/5</span></div></div>
          <div><div class="flex items-center gap-2"><span class="dot b"></span><span class="text-xs font-semibold muted">Name help steps</span></div><div class="text-[28px] font-extrabold tracking-tight">3<span class="text-base muted">/4</span></div></div>
        </div>
      </div>
    </div>

    <div class="px mt-6 flex items-center justify-between"><div class="h2">Stories</div></div>
    <div class="px mt-3 space-y-3">
      <div class="card p-3 flex items-center gap-3">
        <img src="img/dev.jpg" class="w-16 h-16 rounded-2xl object-cover">
        <div class="flex-1"><div class="font-bold">Clean Slate</div><div class="bar mt-2"><div class="g" style="width:100%"></div></div><div class="text-[11px] muted mt-1.5">6 of 6 choices · card saved</div></div>
        <i class="fas fa-circle-check text-[#3E9A72] text-xl"></i>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <img src="img/maya.jpg" class="w-16 h-16 rounded-2xl object-cover">
        <div class="flex-1"><div class="font-bold">Lock, Check, Repeat</div><div class="bar mt-2"><div class="a" style="width:57%"></div></div><div class="text-[11px] muted mt-1.5">Scene 4 of 7</div></div>
        <i class="fas fa-circle-play text-[#D8902A] text-xl"></i>
      </div>
    </div>

    <div class="px mt-6"><div class="h2">Paths you've seen</div></div>
    <div class="px mt-3">
      <div class="card p-5">
        <div class="flex items-end gap-3 h-[110px]">
          <div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-xl gr-ink" style="height:84px"></div><span class="text-[11px] font-semibold muted">Check in</span></div>
          <div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-xl gr-sage" style="height:56px"></div><span class="text-[11px] font-semibold muted">Get adult</span></div>
          <div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-xl gr-gold" style="height:28px"></div><span class="text-[11px] font-semibold muted">Do it for</span></div>
          <div class="flex-1 flex flex-col items-center gap-2"><div class="w-full rounded-xl gr-coral" style="height:14px"></div><span class="text-[11px] font-semibold muted">Dismiss</span></div>
        </div>
      </div>
    </div>

    <div class="px mt-6"><div class="h2">Badges</div></div>
    <div class="hscroll mt-3">
      <div class="card p-4 w-[120px] flex-shrink-0 text-center"><div class="ico gr-sage mx-auto !w-12 !h-12 !rounded-full"><i class="fas fa-ear-listen"></i></div><div class="text-xs font-bold mt-2">Good listener</div></div>
      <div class="card p-4 w-[120px] flex-shrink-0 text-center"><div class="ico gr-ink mx-auto !w-12 !h-12 !rounded-full"><i class="fas fa-rotate"></i></div><div class="text-xs font-bold mt-2">Loop spotter</div></div>
      <div class="card p-4 w-[120px] flex-shrink-0 text-center"><div class="ico gr-gold mx-auto !w-12 !h-12 !rounded-full"><i class="fas fa-route"></i></div><div class="text-xs font-bold mt-2">All paths</div></div>
      <div class="card p-4 w-[120px] flex-shrink-0 text-center opacity-50"><div class="ico bg-[#D9D2C3] mx-auto !w-12 !h-12 !rounded-full"><i class="fas fa-lock"></i></div><div class="text-xs font-bold mt-2">Both sides</div></div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-book-open"></i>Stories</div><div class="tab"><i class="fas fa-layer-group"></i>Cards</div><div class="tab"><div class="help"><i class="fas fa-life-ring"></i></div>Help</div><div class="tab on"><i class="fas fa-chart-simple"></i>Progress</div><div class="tab"><i class="fas fa-user"></i>Me</div></nav><div class="homebar"></div>
</div>
</body>
</html>
