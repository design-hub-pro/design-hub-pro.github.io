<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCD Stories - Interactive campus stories about OCD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: #ffffff; }
  body { font-family:'Inter',-apple-system,sans-serif; color:#1E2440; -webkit-font-smoothing:antialiased; }
  .hero { text-align:center; padding:64px 40px 40px; }
  .hero-icon { width:64px; height:64px; border-radius:1rem; margin:0 auto 22px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#2F6B55,#4F9A7A 55%,#E07A5F); }
  .hero-icon i { color:#fff; font-size:28px; }
  .hero h1 { font-size:44px; font-weight:800; letter-spacing:-1.5px; }
  .hero p { font-size:18px; color:#6B6F84; margin-top:10px; }
  .tags { display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .tags span { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500; background:#f3f4f6; color:#6B6F84; }
  .grid { display:grid; grid-template-columns:repeat(3, 460px); gap:48px; justify-content:center; padding:20px 40px 80px; }
  @media (max-width:1560px) { .grid { grid-template-columns:repeat(2, 460px); } }
  @media (max-width:1040px) { .grid { grid-template-columns:460px; } }
  .phone-frame { width:460px; height:980px; border-radius:62px; padding:12px; background:#111; box-shadow:0 20px 60px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06); }
  .phone-screen { width:100%; height:100%; border-radius:52px; overflow:hidden; background:#000; }
  .phone-screen iframe { width:100%; height:100%; border:0; display:block; }
  *::-webkit-scrollbar { display:none; }
  * { scrollbar-width:none; }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-icon"><i class="fas fa-book-open-reader"></i></div>
    <h1>OCD Stories</h1>
    <p>Choose-your-path campus stories that show teens what OCD looks like and how to get help.</p>
    <div class="tags"><span>Mental Health</span><span>Education</span><span>Interactive Story</span><span>High School</span></div>
  </header>
  <main class="grid">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" title="Welcome" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" title="Stories" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="story.html" title="Story intro" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="scene.html" title="Scene" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="choice.html" title="Choice" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="outcome.html" title="Outcome" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="check.html" title="Quick check" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="review.html" title="Review card" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="help.html" title="Get help" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="progress.html" title="Progress" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="studio.html" title="Story studio" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="school.html" title="School pack" scrolling="no"></iframe></div></div>
  </main>
</body>
</html>
