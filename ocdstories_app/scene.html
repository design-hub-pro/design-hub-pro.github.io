<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>OCD Stories - Scene</title>
</head>
<body>
<div class="screen" style="background:#1E2440">
  <div class="absolute top-0 left-0 w-full h-[520px]">
    <img src="img/lab.jpg" class="w-full h-full object-cover" style="object-position:50% 35%">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(30,36,64,.55) 0%,rgba(30,36,64,0) 22%,rgba(30,36,64,0) 60%,#1E2440 100%)"></div>
  </div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
  <div class="px relative z-10 mt-1">
    <div class="flex gap-1.5"><div class="flex-1 h-1 rounded-full bg-white"></div><div class="flex-1 h-1 rounded-full bg-white"></div><div class="flex-1 h-1 rounded-full bg-white"></div><div class="flex-1 h-1 rounded-full bg-white/40"><div class="h-full w-1/2 rounded-full bg-white"></div></div><div class="flex-1 h-1 rounded-full bg-white/40"></div><div class="flex-1 h-1 rounded-full bg-white/40"></div><div class="flex-1 h-1 rounded-full bg-white/40"></div></div>
    <div class="flex items-center justify-between mt-4 text-white">
      <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark"></i></div>
      <div class="text-sm font-semibold">Scene 4 · Chem Lab</div>
      <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fas fa-volume-high"></i></div>
    </div>
  </div>
  <div class="absolute left-0 right-0 bottom-0 px pb-12 text-white">
    <p class="serif text-[21px] leading-snug opacity-95">Dev hovers a step back from the bench. His sleeves are pulled over his hands. Again.</p>
    <div class="mt-6 space-y-3">
      <div class="flex items-end gap-2">
        <img src="img/dev.jpg" class="w-9 h-9 rounded-full object-cover" style="object-position:62% 20%">
        <div class="bubble bg-white text-[#1E2440] rounded-bl-md"><div class="text-[11px] font-bold text-[#5B6FD6] mb-0.5">Dev</div>Can you pour? I'll write everything down.</div>
      </div>
      <div class="flex items-end gap-2">
        <img src="img/dev.jpg" class="w-9 h-9 rounded-full object-cover opacity-0" style="object-position:62% 20%">
        <div class="bubble bg-white/10 border border-white/15 rounded-bl-md italic text-[14px]"><i class="fas fa-cloud mr-1.5 text-white/60"></i>Somebody else's period touched this bench.</div>
      </div>
      <div class="flex justify-end">
        <div class="bubble rounded-br-md" style="background:#5B6FD6"><div class="text-[11px] font-bold opacity-80 mb-0.5">You · Priya</div>Third lab in a row, Dev.</div>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-7">
      <div class="btn flex-1 bg-white text-[#1E2440]">Continue <i class="fas fa-arrow-right"></i></div>
      <div class="w-14 h-14 rounded-[18px] bg-white/10 flex items-center justify-center"><i class="fas fa-pause"></i></div>
    </div>
  </div>
  <div class="homebar light"></div>
</div>
</body>
</html>
