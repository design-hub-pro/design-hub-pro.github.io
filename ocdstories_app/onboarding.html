<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>OCD Stories - Welcome</title>
</head>
<body>
<div class="screen">
  <img src="img/hallway.jpg" class="absolute top-0 left-0 w-full h-[600px] object-cover">
  <div class="absolute top-0 left-0 w-full h-[600px]" style="background:linear-gradient(180deg,rgba(30,36,64,.35) 0%,rgba(30,36,64,0) 30%,rgba(246,242,234,0) 60%,#F6F2EA 100%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
  <div class="px relative z-10 mt-3 flex items-center gap-2 text-white">
    <div class="w-9 h-9 rounded-xl gr-sage flex items-center justify-center"><i class="fas fa-book-open text-sm"></i></div>
    <span class="font-bold text-lg tracking-tight">OCD Stories</span>
  </div>
  <div class="absolute left-0 right-0 bottom-0 px pb-12">
    <div class="flex gap-2 mb-5">
      <span class="chip shadow-sm"><span class="dot g"></span>2 stories</span>
      <span class="chip shadow-sm"><i class="fas fa-clock text-[#2F6B55]"></i>12 min each</span>
      <span class="chip shadow-sm"><i class="fas fa-user-shield text-[#2F6B55]"></i>Clinician reviewed</span>
    </div>
    <h1 class="serif text-[40px] leading-[1.05] font-semibold tracking-tight">See what OCD looks like at school.</h1>
    <p class="muted text-[16px] mt-3 leading-relaxed">Step into a campus story. Make the call. Learn what to say next.</p>
    <div class="grid grid-cols-3 gap-3 mt-7">
      <div class="card p-4 text-center"><div class="ico gr-ink mx-auto"><i class="fas fa-code-branch"></i></div><div class="text-[13px] font-bold mt-2.5">Choose</div></div>
      <div class="card p-4 text-center"><div class="ico gr-coral mx-auto"><i class="fas fa-heart-pulse"></i></div><div class="text-[13px] font-bold mt-2.5">Feel it</div></div>
      <div class="card p-4 text-center"><div class="ico gr-sage mx-auto"><i class="fas fa-hand-holding-heart"></i></div><div class="text-[13px] font-bold mt-2.5">Get help</div></div>
    </div>
    <div class="btn pri mt-7">Start a story <i class="fas fa-arrow-right"></i></div>
    <div class="text-center text-sm font-semibold mt-4 text-[#2F6B55]">I'm a counselor or teacher</div>
    <div class="text-center text-[11px] muted mt-4"><i class="fas fa-circle-info mr-1"></i>Fiction for learning. Not a diagnosis tool.</div>
  </div>
  <div class="homebar"></div>
</div>
</body>
</html>
