<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyGuardian - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow-x: hidden; background: #F8F7F4; position: relative; }
        .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #F3F4F6; }
        .menu-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center; position: relative;">
        <span style="font-size: 16px; font-weight: 600;">9:41</span>
        <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
        <div style="display: flex; gap: 5px; align-items: center;">
            <i class="fas fa-signal" style="font-size: 13px;"></i>
            <i class="fas fa-wifi" style="font-size: 13px;"></i>
            <i class="fas fa-battery-full" style="font-size: 13px;"></i>
        </div>
    </div>

    <!-- Scrollable Content -->
    <div class="scroll-area" style="position: absolute; top: 59px; bottom: 83px; left: 0; right: 0; padding: 8px 28px 20px;">

        <!-- Header -->
        <h1 style="font-size: 28px; font-weight: 800; color: #1A1A2E; margin-bottom: 24px;">Profile</h1>

        <!-- Profile Card -->
        <div style="background: #fff; border-radius: 20px; padding: 24px; text-align: center; margin-bottom: 20px; box-shadow: 0 1px 10px rgba(0,0,0,0.04);">
            <div style="position: relative; display: inline-block; margin-bottom: 14px;">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #E8F5E9;">
                <div style="position: absolute; bottom: 2px; right: 2px; width: 24px; height: 24px; background: #1B6B3A; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff;">
                    <i class="fas fa-check" style="font-size: 10px; color: #fff;"></i>
                </div>
            </div>
            <h2 style="font-size: 20px; font-weight: 800; color: #1A1A2E;">Sarah Johnson</h2>
            <p style="font-size: 13px; color: #9CA3AF; margin-top: 4px;">Guardian since January 2024</p>

            <!-- Stats -->
            <div style="display: flex; justify-content: space-around; margin-top: 20px; padding-top: 18px; border-top: 1px solid #F3F4F6;">
                <div style="text-align: center;">
                    <div style="font-size: 22px; font-weight: 800; color: #1A1A2E;">3</div>
                    <div style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">Monkeys</div>
                </div>
                <div style="width: 1px; background: #F3F4F6;"></div>
                <div style="text-align: center;">
                    <div style="font-size: 22px; font-weight: 800; color: #1A1A2E;">$450</div>
                    <div style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">Donated</div>
                </div>
                <div style="width: 1px; background: #F3F4F6;"></div>
                <div style="text-align: center;">
                    <div style="font-size: 22px; font-weight: 800; color: #1A1A2E;">127</div>
                    <div style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">Updates</div>
                </div>
            </div>
        </div>

        <!-- Badges -->
        <h3 style="font-size: 16px; font-weight: 700; color: #1A1A2E; margin-bottom: 14px;">Your Badges</h3>
        <div style="display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px;">
            <div style="text-align: center; flex-shrink: 0;">
                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #E8F5E9, #C8E6C9); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;">
                    <i class="fas fa-seedling" style="font-size: 22px; color: #1B6B3A;"></i>
                </div>
                <div style="font-size: 10px; color: #6B7280; font-weight: 600;">First<br>Adopt</div>
            </div>
            <div style="text-align: center; flex-shrink: 0;">
                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #FFF8E7, #FDEAB6); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;">
                    <i class="fas fa-star" style="font-size: 22px; color: #D4A24E;"></i>
                </div>
                <div style="font-size: 10px; color: #6B7280; font-weight: 600;">6 Month<br>Guardian</div>
            </div>
            <div style="text-align: center; flex-shrink: 0;">
                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #EDE9FE, #DDD6FE); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;">
                    <i class="fas fa-trophy" style="font-size: 22px; color: #7C3AED;"></i>
                </div>
                <div style="font-size: 10px; color: #6B7280; font-weight: 600;">Top<br>Donor</div>
            </div>
            <div style="text-align: center; flex-shrink: 0;">
                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #FEE2E2, #FECACA); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;">
                    <i class="fas fa-heart" style="font-size: 22px; color: #EF4444;"></i>
                </div>
                <div style="font-size: 10px; color: #6B7280; font-weight: 600;">Community<br>Star</div>
            </div>
            <div style="text-align: center; flex-shrink: 0;">
                <div style="width: 60px; height: 60px; background: #F3F4F6; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; border: 2px dashed #D1D5DB;">
                    <i class="fas fa-lock" style="font-size: 18px; color: #D1D5DB;"></i>
                </div>
                <div style="font-size: 10px; color: #D1D5DB; font-weight: 600;">1 Year<br>Hero</div>
            </div>
        </div>

        <!-- Menu -->
        <div style="background: #fff; border-radius: 18px; padding: 4px 18px; margin-bottom: 16px; box-shadow: 0 1px 8px rgba(0,0,0,0.04);">
            <div class="menu-item">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #E8F5E9; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-receipt" style="font-size: 14px; color: #1B6B3A;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #1A1A2E;">Donation History</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #D1D5DB;"></i>
            </div>
            <div class="menu-item">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #FFF8E7; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-certificate" style="font-size: 14px; color: #D4A24E;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #1A1A2E;">Certificates</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #D1D5DB;"></i>
            </div>
            <div class="menu-item">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #EDE9FE; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user-plus" style="font-size: 14px; color: #7C3AED;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #1A1A2E;">Invite Friends</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #D1D5DB;"></i>
            </div>
        </div>

        <div style="background: #fff; border-radius: 18px; padding: 4px 18px; margin-bottom: 20px; box-shadow: 0 1px 8px rgba(0,0,0,0.04);">
            <div class="menu-item">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #F3F4F6; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-cog" style="font-size: 14px; color: #6B7280;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #1A1A2E;">Settings</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #D1D5DB;"></i>
            </div>
            <div class="menu-item">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #F3F4F6; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-question-circle" style="font-size: 14px; color: #6B7280;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #1A1A2E;">Help & Support</span>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #D1D5DB;"></i>
            </div>
            <div class="menu-item" style="border-bottom: none;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: #FEE2E2; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-sign-out-alt" style="font-size: 14px; color: #EF4444;"></i>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #EF4444;">Log Out</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 83px; background: rgba(255,255,255,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid rgba(0,0,0,0.06); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <i class="fas fa-home" style="font-size: 21px; color: #9CA3AF;"></i>
            <span style="font-size: 10px; color: #9CA3AF;">Home</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <i class="fas fa-compass" style="font-size: 21px; color: #9CA3AF;"></i>
            <span style="font-size: 10px; color: #9CA3AF;">Explore</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <i class="fas fa-heart" style="font-size: 21px; color: #9CA3AF;"></i>
            <span style="font-size: 10px; color: #9CA3AF;">My Family</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <i class="fas fa-bell" style="font-size: 21px; color: #9CA3AF;"></i>
            <span style="font-size: 10px; color: #9CA3AF;">Updates</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <i class="fas fa-user" style="font-size: 21px; color: #1B6B3A;"></i>
            <span style="font-size: 10px; font-weight: 600; color: #1B6B3A;">Profile</span>
        </div>
    </div>
</body>
</html>
