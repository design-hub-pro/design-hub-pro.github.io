<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevé - Session Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #1a1028; }
        .status-bar { height: 59px; padding: 0 28px; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.6; }
        }
        .breathe-ring { animation: breathe 4s ease-in-out infinite; }
        .breathe-ring-2 { animation: breathe 4s ease-in-out infinite 1s; }
        .breathe-ring-3 { animation: breathe 4s ease-in-out infinite 2s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white/60">9:41</span>
        </div>
        <div class="w-[126px] h-[37px] bg-black rounded-full relative -top-0.5 border border-white/10"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-white/60"></i>
            <i class="fas fa-wifi text-xs text-white/60"></i>
            <i class="fas fa-battery-full text-sm text-white/60"></i>
        </div>
    </div>

    <div class="px-7">
        <!-- Close -->
        <div class="flex items-center justify-between mt-2 mb-8">
            <button class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-xmark text-white/60 text-sm"></i>
            </button>
            <span class="text-white/40 text-xs font-medium">GUIDED SESSION</span>
            <div class="w-9"></div>
        </div>

        <!-- Session Info -->
        <div class="text-center mb-10">
            <span class="bg-violet-500/30 text-violet-300 text-[10px] font-semibold px-3 py-1 rounded-full">Acceptance</span>
            <h1 class="text-white text-[22px] font-bold mt-3 leading-tight">It's Okay to Not<br>Dance Today</h1>
            <p class="text-white/30 text-xs mt-2">with Coach Alicia Reyes</p>
        </div>

        <!-- Breathing Visual -->
        <div class="flex items-center justify-center mb-10 relative" style="height: 200px;">
            <div class="absolute w-48 h-48 rounded-full border border-violet-400/20 breathe-ring"></div>
            <div class="absolute w-36 h-36 rounded-full border border-violet-400/30 breathe-ring-2"></div>
            <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-violet-500/40 to-pink-500/40 breathe-ring-3"></div>
            <div class="relative w-16 h-16 bg-gradient-to-br from-violet-500 to-pink-500 rounded-full flex items-center justify-center">
                <i class="fas fa-wind text-white text-lg"></i>
            </div>
        </div>

        <!-- Instruction -->
        <div class="text-center mb-10">
            <p class="text-white/80 text-lg font-medium">Breathe in slowly...</p>
            <p class="text-white/30 text-xs mt-2">Let go of the need to perform</p>
        </div>

        <!-- Progress -->
        <div class="mb-4">
            <div class="w-full bg-white/10 rounded-full h-1">
                <div class="bg-gradient-to-r from-violet-400 to-pink-400 h-1 rounded-full" style="width: 35%"></div>
            </div>
            <div class="flex justify-between mt-2">
                <span class="text-white/30 text-[10px]">4:12</span>
                <span class="text-white/30 text-[10px]">12:00</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-8 mt-6">
            <button class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-backward text-white/60 text-sm"></i>
            </button>
            <button class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg shadow-white/20">
                <i class="fas fa-pause text-gray-800 text-xl"></i>
            </button>
            <button class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-forward text-white/60 text-sm"></i>
            </button>
        </div>

        <!-- Bottom actions -->
        <div class="flex items-center justify-center gap-8 mt-8">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-moon text-white/30 text-sm"></i>
                <span class="text-white/20 text-[9px]">Sleep Timer</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-music text-white/30 text-sm"></i>
                <span class="text-white/20 text-[9px]">Background</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-heart text-violet-400 text-sm"></i>
                <span class="text-white/20 text-[9px]">Saved</span>
            </div>
        </div>
    </div>
</body>
</html>
