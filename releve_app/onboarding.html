<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevé - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
        .status-bar { height: 59px; padding: 0 28px; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white/80">9:41</span>
        </div>
        <div class="w-[126px] h-[37px] bg-black rounded-full relative -top-0.5 border border-white/10"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-white/80"></i>
            <i class="fas fa-wifi text-xs text-white/80"></i>
            <i class="fas fa-battery-full text-sm text-white/80"></i>
        </div>
    </div>

    <!-- Full Screen Hero -->
    <div class="relative" style="height: calc(100vh - 59px);">
        <img src="https://images.unsplash.com/photo-1518834107812-67b0b7c58434?w=900&q=80" class="w-full h-full object-cover" alt="dancer silhouette">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>

        <!-- Content -->
        <div class="absolute bottom-0 left-0 right-0 px-8 pb-14">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-5">
                <div class="w-12 h-12 bg-gradient-to-br from-rose-400 to-pink-600 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-shoe-prints text-white text-lg"></i>
                </div>
                <span class="text-white text-2xl font-bold">Relevé</span>
            </div>

            <h1 class="text-white text-[32px] font-bold leading-tight mb-3">Rise again.<br>Stronger than before.</h1>
            <p class="text-white/50 text-sm leading-relaxed mb-8">Personalized recovery built by dancers, for dancers. Heal your body and mind — together.</p>

            <!-- CTA -->
            <button class="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white font-semibold py-4 rounded-2xl text-base mb-3 shadow-lg shadow-rose-500/30">
                Get Started
            </button>
            <button class="w-full bg-white/10 text-white/80 font-medium py-4 rounded-2xl text-base backdrop-blur-sm">
                I already have an account
            </button>

            <!-- Dots -->
            <div class="flex items-center justify-center gap-2 mt-6">
                <div class="w-6 h-1.5 rounded-full bg-rose-500"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/30"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/30"></div>
            </div>
        </div>
    </div>
</body>
</html>
