<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevé - Dancer Recovery Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        body {
            background: #ffffff;
        }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.25), 0 30px 60px -30px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #faf9f7;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 460px);
            gap: 48px;
            justify-content: center;
            padding: 0 48px;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="text-center pt-20 pb-16">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-rose-400 to-pink-600 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-shoe-prints text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-6xl font-bold text-gray-900 tracking-tight mb-4">Relevé</h1>
        <p class="text-xl text-gray-400 max-w-xl mx-auto leading-relaxed">Personalized recovery companion for injured dancers — body and mind.</p>
    </div>

    <!-- Phone Screenshots -->
    <div class="screens-grid pb-24">
        <!-- Home -->
        <div>
            <div class="phone-frame mx-auto">
                <div class="phone-screen">
                    <iframe src="home.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="text-center text-sm font-semibold text-gray-400 mt-5">Home</p>
        </div>

        <!-- Recovery -->
        <div>
            <div class="phone-frame mx-auto">
                <div class="phone-screen">
                    <iframe src="recovery.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="text-center text-sm font-semibold text-gray-400 mt-5">Recovery Plan</p>
        </div>

        <!-- Mindset -->
        <div>
            <div class="phone-frame mx-auto">
                <div class="phone-screen">
                    <iframe src="mindset.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="text-center text-sm font-semibold text-gray-400 mt-5">Mindset</p>
        </div>

        <!-- Community -->
        <div>
            <div class="phone-frame mx-auto">
                <div class="phone-screen">
                    <iframe src="community.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="text-center text-sm font-semibold text-gray-400 mt-5">Community</p>
        </div>

        <!-- Profile -->
        <div>
            <div class="phone-frame mx-auto">
                <div class="phone-screen">
                    <iframe src="profile.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="text-center text-sm font-semibold text-gray-400 mt-5">Profile</p>
        </div>
    </div>
</body>
</html>
