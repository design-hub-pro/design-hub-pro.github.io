<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatherJoy - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; margin-top: 12px; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#E86A33', secondary: '#14B8A6', accent: '#7C3AED' } } }
        }
    </script>
</head>
<body class="relative" style="min-height: 980px;">
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="content-area mt-4">
        <!-- Logo -->
        <div class="text-center mt-4">
            <div class="w-16 h-16 bg-gradient-to-br from-primary to-orange-400 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-orange-200">
                <i class="fas fa-hand-holding-heart text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mt-4">Join GatherJoy</h1>
            <p class="text-sm text-gray-400 mt-1">Bring joy to senior communities</p>
        </div>

        <!-- Role Selection -->
        <div class="mt-8">
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-3">I am a...</p>

            <!-- Provider Card - Selected -->
            <div class="bg-orange-50 border-2 border-primary rounded-2xl p-4 mb-3 relative">
                <div class="absolute top-3 right-3 w-6 h-6 bg-primary rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white" style="font-size: 10px;"></i>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-br from-primary to-orange-400 rounded-xl flex items-center justify-center">
                        <i class="fas fa-hand-sparkles text-white text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-900">Volunteer / Provider</h3>
                        <p class="text-[10px] text-gray-500 mt-0.5">I offer activities for senior centers</p>
                    </div>
                </div>
            </div>

            <!-- Center Card -->
            <div class="bg-white border-2 border-gray-100 rounded-2xl p-4 mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-building text-white text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-900">Senior Center</h3>
                        <p class="text-[10px] text-gray-500 mt-0.5">I'm looking for activities for our residents</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Basic Info Form -->
        <div class="mt-6">
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-3">Your Info</p>

            <div class="bg-gray-50 rounded-2xl p-4 mb-3">
                <label class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Name</label>
                <input type="text" value="Sarah Chen" class="w-full mt-1 text-sm font-medium text-gray-900 border-none outline-none bg-transparent">
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 mb-3">
                <label class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Email</label>
                <input type="email" value="sarah@artstudio.com" class="w-full mt-1 text-sm font-medium text-gray-900 border-none outline-none bg-transparent">
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 mb-3">
                <label class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Location</label>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-sm font-medium text-gray-900">Portland, OR</span>
                    <i class="fas fa-map-marker-alt text-primary text-sm"></i>
                </div>
            </div>

            <div class="bg-gray-50 rounded-2xl p-4 mb-3">
                <label class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Phone</label>
                <input type="tel" value="(503) 555-0142" class="w-full mt-1 text-sm font-medium text-gray-900 border-none outline-none bg-transparent">
            </div>
        </div>

        <!-- CTA -->
        <button class="w-full bg-gradient-to-r from-primary to-orange-400 text-white font-semibold py-4 rounded-2xl text-sm mt-4">
            Create Account
        </button>
        <p class="text-center text-xs text-gray-400 mt-3 mb-8">
            Already have an account? <span class="text-primary font-semibold">Sign In</span>
        </p>
    </div>
</body>
</html>
