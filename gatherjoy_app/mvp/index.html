<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatherJoy MVP - Senior Center Activity Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #000;
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #fff;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="text-center py-16 px-8">
        <div class="inline-flex items-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-orange-500 to-orange-400 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-200">
                <i class="fas fa-hand-holding-heart text-white text-xl"></i>
            </div>
        </div>
        <div class="flex items-center justify-center gap-3 mb-4">
            <h1 class="text-5xl font-bold text-gray-900">GatherJoy</h1>
            <span class="bg-orange-100 text-orange-600 text-sm font-bold px-3 py-1 rounded-full">MVP</span>
        </div>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto">Complete workflow: 10 screens covering sign-up, browsing, booking, posting, and impact tracking for both providers and senior centers.</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1500px] mx-auto px-8 pb-20">
        <div class="grid grid-cols-3 gap-8 justify-items-center">

            <!-- Screen 1: Sign Up -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="signup.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Sign Up</p>
            </div>

            <!-- Screen 2: Home -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Home</p>
            </div>

            <!-- Screen 3: Activity Detail -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="activity.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Activity Detail</p>
            </div>

            <!-- Screen 4: Booking Sent -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="booking.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Booking Sent</p>
            </div>

            <!-- Screen 5: Center Requests -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="requests.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Center Requests</p>
            </div>

            <!-- Screen 6: Offer to Help -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="offer.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Offer to Help</p>
            </div>

            <!-- Screen 7: Post Activity -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="post.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Post Activity</p>
            </div>

            <!-- Screen 8: Post Request -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="post_request.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Post Request</p>
            </div>

            <!-- Screen 9: Impact -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="impact.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Community Impact</p>
            </div>

            <!-- Screen 10: Profile -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Profile</p>
            </div>

        </div>
    </div>
</body>
</html>
