<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatherJoy - Senior Center Activity Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #000;
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #fff;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="text-center py-16 px-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-orange-400 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-200">
                <i class="fas fa-hand-holding-heart text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-bold text-gray-900 mb-4">GatherJoy</h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto">Connecting volunteers, groups, and activity providers with senior centers to organize meaningful community activities</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1500px] mx-auto px-8 pb-20">
        <div class="grid grid-cols-3 gap-8 justify-items-center">
            <!-- Screen 1: Onboarding -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Welcome</p>
            </div>

            <!-- Screen 2: Home -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Home</p>
            </div>

            <!-- Screen 3: Explore -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="explore.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Explore</p>
            </div>

            <!-- Screen 4: Activity Detail -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="activity.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Activity Detail</p>
            </div>

            <!-- Screen 5: Post Activity -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="post.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">List Activity</p>
            </div>

            <!-- Screen 6: Requests -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="requests.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Requests</p>
            </div>

            <!-- Screen 7: Schedule -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="schedule.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Schedule</p>
            </div>

            <!-- Screen 8: Messages -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="messages.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Messages</p>
            </div>

            <!-- Screen 9: Profile -->
            <div class="text-center">
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-500">Profile</p>
            </div>
        </div>
    </div>
</body>
</html>
