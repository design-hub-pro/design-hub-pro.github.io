<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatherJoy - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; margin-top: 12px; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#E86A33', secondary: '#14B8A6', accent: '#7C3AED' } } }
        }
    </script>
</head>
<body class="relative" style="height: 980px;">
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Hero Image -->
    <div class="relative h-[420px] mx-5 mt-2 rounded-3xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1559234938-b60fff04894d?w=800&h=800&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
        <!-- Floating Cards -->
        <div class="absolute top-6 right-4 bg-white/90 backdrop-blur rounded-2xl p-2.5 shadow-lg">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-primary to-orange-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-music text-white" style="font-size: 10px;"></i>
                </div>
                <div>
                    <p class="text-[10px] font-semibold text-gray-900">Live Music</p>
                    <p class="text-[8px] text-gray-400">12 providers</p>
                </div>
            </div>
        </div>
        <div class="absolute top-20 left-4 bg-white/90 backdrop-blur rounded-2xl p-2.5 shadow-lg">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-secondary to-teal-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-palette text-white" style="font-size: 10px;"></i>
                </div>
                <div>
                    <p class="text-[10px] font-semibold text-gray-900">Art Classes</p>
                    <p class="text-[8px] text-gray-400">28 available</p>
                </div>
            </div>
        </div>
        <div class="absolute bottom-6 left-4 right-4">
            <div class="flex -space-x-2 mb-2">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&h=60&fit=crop&crop=face" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=60&h=60&fit=crop&crop=face" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=60&h=60&fit=crop&crop=face" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=60&h=60&fit=crop&crop=face" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                <div class="w-8 h-8 rounded-full border-2 border-white bg-primary flex items-center justify-center">
                    <span class="text-white text-[8px] font-bold">+50</span>
                </div>
            </div>
            <p class="text-white/80 text-[10px]">Join 500+ centers & volunteers</p>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 mt-6">
        <h1 class="text-2xl font-bold text-gray-900 leading-tight">Bring Joy to<br>Senior Communities</h1>
        <p class="text-sm text-gray-400 mt-2 leading-relaxed">Connect volunteers, groups, and providers with senior centers to organize meaningful activities.</p>

        <!-- Dots -->
        <div class="flex items-center gap-1.5 mt-5">
            <div class="w-6 h-2 bg-primary rounded-full"></div>
            <div class="w-2 h-2 bg-gray-200 rounded-full"></div>
            <div class="w-2 h-2 bg-gray-200 rounded-full"></div>
        </div>
    </div>

    <!-- Bottom Buttons -->
    <div class="absolute bottom-10 left-0 right-0 px-7">
        <button class="w-full bg-gradient-to-r from-primary to-orange-400 text-white font-semibold py-4 rounded-2xl text-sm mb-3">
            Get Started
        </button>
        <button class="w-full text-gray-500 font-medium py-3 text-sm">
            Already have an account? <span class="text-primary font-semibold">Sign In</span>
        </button>
    </div>
</body>
</html>
