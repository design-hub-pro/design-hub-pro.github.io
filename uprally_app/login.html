<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UpRally — Log in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:#fff; }
  .display { font-family:'Plus Jakarta Sans','Inter',sans-serif; letter-spacing:-0.025em; }
  .screen { width:100%; height:100%; overflow-y:auto; background:#fff; position:relative; }
  .status-bar { height:59px; padding:22px 28px 0; display:flex; justify-content:space-between; align-items:center; }
  .island { width:122px; height:36px; border-radius:22px; background:#000; position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:40; }
  .brand-grad { background: linear-gradient(135deg, #84CC16 0%, #10B981 60%, #059669 100%); }
  .label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#64748B; }
  .input-wrap { display:flex; align-items:center; gap:10px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:16px; padding:14px 16px; }
  .input-wrap.focus { border-color:#10B981; box-shadow:0 0 0 4px #D1FAE5; background:#fff; }
  .input-wrap input { border:none; outline:none; background:transparent; flex:1; font-size:15px; font-weight:500; color:#0F172A; }
  .input-wrap input::placeholder { color:#94A3B8; font-weight:500; }
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <!-- Status -->
  <div class="status-bar">
    <span class="text-[15px] font-semibold text-slate-900">9:41</span>
    <div class="flex items-center gap-1.5 text-[12px] text-slate-900">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <div class="px-7 pt-2 pb-10">
    <!-- Back + brand -->
    <div class="flex items-center justify-between">
      <button class="w-11 h-11 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-center">
        <i class="fa-solid fa-chevron-left text-slate-700"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 brand-grad rounded-xl flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-arrow-trend-up text-white text-[13px]"></i>
        </div>
        <span class="display font-extrabold text-[16px] text-slate-900">UpRally</span>
      </div>
      <div class="w-11"></div>
    </div>

    <!-- Heading -->
    <div class="mt-8">
      <h1 class="display font-black text-[30px] text-slate-900 leading-tight">Welcome back</h1>
      <p class="text-[14px] text-slate-500 mt-2 leading-relaxed">Log in to confirm schedules and message heaters.</p>
    </div>

    <!-- Form -->
    <div class="mt-7 space-y-5">
      <!-- Email -->
      <div>
        <div class="label mb-2">Email</div>
        <div class="input-wrap focus">
          <i class="fa-solid fa-envelope text-emerald-500"></i>
          <input type="email" value="alex.park@gmail.com" />
          <i class="fa-solid fa-circle-check text-emerald-500 text-[15px]"></i>
        </div>
      </div>
      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="label">Password</div>
          <a class="text-[12px] font-bold text-emerald-600">Forgot?</a>
        </div>
        <div class="input-wrap">
          <i class="fa-solid fa-lock text-slate-400"></i>
          <input type="text" value="••••••••••" />
          <i class="fa-regular fa-eye-slash text-slate-400 text-[15px]"></i>
        </div>
      </div>
    </div>

    <!-- Log in -->
    <button class="w-full brand-grad text-white display font-extrabold text-[16px] py-4 rounded-2xl shadow-xl shadow-emerald-200 mt-7">
      Log in
    </button>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-[12px] font-semibold text-slate-400">or continue with</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <!-- Social -->
    <div class="grid grid-cols-2 gap-3">
      <button class="flex items-center justify-center gap-2 bg-slate-900 text-white font-bold text-[14px] py-3.5 rounded-2xl">
        <i class="fa-brands fa-apple text-[17px]"></i> Apple
      </button>
      <button class="flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-900 font-bold text-[14px] py-3.5 rounded-2xl">
        <i class="fa-brands fa-google text-[15px]" style="color:#EA4335"></i> Google
      </button>
    </div>

    <!-- Trust row -->
    <div class="mt-6 flex items-center justify-center gap-1.5 text-[11.5px] text-slate-400 font-medium">
      <i class="fa-solid fa-lock text-[10px] text-emerald-500"></i>
      Verified players only · ID-checked
    </div>

    <!-- Sign up -->
    <div class="text-center mt-7 text-[14px] text-slate-600">
      New to UpRally? <a class="font-extrabold text-emerald-600">Sign up</a>
    </div>
  </div>
</div>
</body>
</html>
