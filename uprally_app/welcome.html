<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UpRally — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:#0F172A; }
  .display { font-family:'Plus Jakarta Sans','Inter',sans-serif; letter-spacing:-0.025em; }
  .screen { width:100%; height:100%; overflow:hidden; background:#0F172A; position:relative; }
  .island { width:122px; height:36px; border-radius:22px; background:#000; position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:40; }
  .brand-grad { background: linear-gradient(135deg, #84CC16 0%, #10B981 60%, #059669 100%); }
  .text-grad { background: linear-gradient(135deg, #BEF264 0%, #6EE7B7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero-overlay { position:absolute; inset:0; background: linear-gradient(180deg, rgba(15,23,42,0.25) 0%, rgba(15,23,42,0.05) 22%, rgba(15,23,42,0.45) 58%, rgba(15,23,42,0.92) 82%, rgba(15,23,42,0.97) 100%); }
  .pill-glass { background: rgba(255,255,255,0.16); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,0.26); }
  .status-bar { height:59px; padding:22px 28px 0; display:flex; justify-content:space-between; align-items:center; position:absolute; top:0; left:0; right:0; z-index:30; color:white; }
</style>
</head>
<body>
<div class="screen">
  <!-- Hero image -->
  <img class="hero-img" src="https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?w=900&q=80" alt="tennis court aerial" />
  <div class="hero-overlay"></div>

  <!-- Status Bar -->
  <div class="island"></div>
  <div class="status-bar">
    <span class="text-[15px] font-semibold">9:41</span>
    <div class="flex items-center gap-1.5 text-[12px]">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Brand lockup -->
  <div class="absolute top-[74px] left-7 right-7 flex items-center justify-between z-20">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 brand-grad rounded-xl flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-arrow-trend-up text-white text-[15px]"></i>
      </div>
      <span class="text-white display font-extrabold text-[19px]">UpRally</span>
    </div>
    <!-- Live stat pill -->
    <div class="pill-glass rounded-full px-3 py-1.5 flex items-center gap-2 text-white text-[12px] font-bold">
      <span class="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></span>
      <span>1,284</span><span class="opacity-70 font-medium">rallying now</span>
    </div>
  </div>

  <!-- Bottom content -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pb-9 z-20">
    <!-- YC chip -->
    <div class="inline-flex items-center gap-2 pill-glass text-white rounded-full px-3 py-1.5 mb-4 text-[11px] font-semibold">
      <span class="bg-[#F26625] text-white text-[9px] font-black px-1.5 py-0.5 rounded">YC W26</span>
      <span class="opacity-90">Verified UTR marketplace</span>
    </div>

    <!-- Headline -->
    <h1 class="display font-black text-white text-[44px] leading-[1.0]">
      Practice with players <span class="text-grad">a level above</span> you.
    </h1>
    <p class="text-white/80 text-[14px] mt-3.5 leading-relaxed">
      Find verified higher-rated "heaters" near you — and improve <b class="text-lime-300">3× faster</b>.
    </p>

    <!-- Value props -->
    <div class="flex items-center gap-4 mt-5 mb-6">
      <div class="flex items-center gap-1.5 text-white/85 text-[11.5px] font-semibold">
        <i class="fa-solid fa-circle-check text-emerald-400 text-[12px]"></i> Verified UTR
      </div>
      <span class="w-1 h-1 rounded-full bg-white/30"></span>
      <div class="flex items-center gap-1.5 text-white/85 text-[11.5px] font-semibold">
        <i class="fa-solid fa-bullseye text-lime-300 text-[12px]"></i> Skill-matched
      </div>
      <span class="w-1 h-1 rounded-full bg-white/30"></span>
      <div class="flex items-center gap-1.5 text-white/85 text-[11.5px] font-semibold">
        <i class="fa-solid fa-bolt text-amber-300 text-[12px]"></i> Book in 12 min
      </div>
    </div>

    <!-- CTAs -->
    <button class="w-full brand-grad text-white display font-extrabold text-[16px] py-4 rounded-2xl shadow-xl shadow-emerald-900/40 flex items-center justify-center gap-2">
      Create account
      <i class="fa-solid fa-arrow-right text-[14px]"></i>
    </button>
    <button class="w-full mt-3 bg-white text-slate-900 display font-extrabold text-[16px] py-4 rounded-2xl">
      Log in
    </button>
    <div class="text-center mt-4">
      <a class="text-white/80 text-[13.5px] font-semibold">Continue as guest →</a>
    </div>

    <!-- Trust line -->
    <div class="text-center text-[11px] text-white/55 mt-5 flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-lock text-[10px]"></i> Free to browse · No card needed
    </div>
  </div>
</div>
</body>
</html>
