<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-gradient-to-r from-emerald-500 to-teal-500 px-6 py-2 flex justify-between items-center text-base font-medium text-white sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-emerald-500 to-teal-500 px-6 pt-4 pb-20">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Rewards</h1>
            <div class="flex items-center gap-2 bg-white/20 rounded-full px-4 py-2">
                <i class="fas fa-leaf text-white"></i>
                <span class="text-white font-bold text-lg">1,280</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 -mt-14 pb-32">
        <!-- Points Card -->
        <div class="bg-white rounded-3xl p-5 shadow-lg mb-6">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <p class="text-gray-400 text-base">Available Points</p>
                    <p class="text-4xl font-bold text-gray-900">1,280</p>
                </div>
                <button class="px-5 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-xl font-semibold text-base">
                    Redeem
                </button>
            </div>
            <div class="bg-gray-100 rounded-full h-3 mb-2">
                <div class="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full h-3 w-[64%]"></div>
            </div>
            <p class="text-gray-400 text-sm">720 more to Gold Volunteer</p>
        </div>

        <!-- Badges -->
        <h3 class="font-bold text-gray-900 text-lg mb-4">Your Badges</h3>
        <div class="flex gap-4 mb-6 overflow-x-auto pb-2">
            <div class="flex-shrink-0 w-20 text-center">
                <div class="w-16 h-16 mx-auto bg-gradient-to-br from-teal-400 to-cyan-500 rounded-2xl flex items-center justify-center mb-2 shadow-lg">
                    <i class="fas fa-wheelchair text-white text-2xl"></i>
                </div>
                <p class="text-xs font-medium text-gray-700">Pathfinder</p>
            </div>
            <div class="flex-shrink-0 w-20 text-center">
                <div class="w-16 h-16 mx-auto bg-gradient-to-br from-emerald-400 to-green-500 rounded-2xl flex items-center justify-center mb-2 shadow-lg">
                    <i class="fas fa-camera text-white text-2xl"></i>
                </div>
                <p class="text-xs font-medium text-gray-700">Mapper</p>
            </div>
            <div class="flex-shrink-0 w-20 text-center">
                <div class="w-16 h-16 mx-auto bg-gradient-to-br from-purple-400 to-indigo-500 rounded-2xl flex items-center justify-center mb-2 shadow-lg">
                    <i class="fas fa-hands-helping text-white text-2xl"></i>
                </div>
                <p class="text-xs font-medium text-gray-700">Helper</p>
            </div>
            <div class="flex-shrink-0 w-20 text-center">
                <div class="w-16 h-16 mx-auto bg-gray-200 rounded-2xl flex items-center justify-center mb-2">
                    <i class="fas fa-lock text-gray-400 text-xl"></i>
                </div>
                <p class="text-xs font-medium text-gray-400">Locked</p>
            </div>
        </div>

        <!-- Leaderboard -->
        <h3 class="font-bold text-gray-900 text-lg mb-4">Community Leaders</h3>
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 flex items-center gap-3 bg-gradient-to-r from-amber-50 to-yellow-50 border-b border-gray-100">
                <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold">1</div>
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face" class="w-12 h-12 rounded-full object-cover">
                <div class="flex-1">
                    <p class="font-semibold text-gray-900 text-base">David L.</p>
                    <p class="text-gray-400 text-sm">3,420 pts</p>
                </div>
                <i class="fas fa-crown text-amber-500 text-xl"></i>
            </div>

            <div class="p-4 flex items-center gap-3 border-b border-gray-100">
                <div class="w-10 h-10 bg-gray-400 rounded-full flex items-center justify-center text-white font-bold">2</div>
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=face" class="w-12 h-12 rounded-full object-cover">
                <div class="flex-1">
                    <p class="font-semibold text-gray-900 text-base">Emily W.</p>
                    <p class="text-gray-400 text-sm">2,890 pts</p>
                </div>
            </div>

            <div class="p-4 flex items-center gap-3 bg-teal-50">
                <div class="w-10 h-10 bg-teal-500 rounded-full flex items-center justify-center text-white font-bold">8</div>
                <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop&crop=face" class="w-12 h-12 rounded-full object-cover border-2 border-teal-400">
                <div class="flex-1">
                    <p class="font-semibold text-gray-900 text-base">You</p>
                    <p class="text-teal-600 text-sm font-medium">1,280 pts</p>
                </div>
                <span class="text-teal-600 text-sm font-medium">↑ 2</span>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-map-marked-alt text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Navigate</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hands-helping text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Volunteer</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-trophy text-teal-600 text-2xl"></i>
                <span class="text-sm text-teal-600 font-medium mt-1">Rewards</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
