<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Volunteer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 py-4 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900">Volunteer</h1>
        <p class="text-gray-400 text-base">Help improve accessibility data</p>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6 pb-32">
        <!-- Service Hours Card -->
        <div class="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-3xl p-5 text-white mb-6 shadow-lg">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-purple-100 text-base mb-1">Service Hours</p>
                    <p class="text-5xl font-bold">24.5</p>
                    <p class="text-purple-200 text-sm mt-1">This Month</p>
                </div>
                <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-award text-4xl"></i>
                </div>
            </div>
        </div>

        <!-- Contribution Options -->
        <h3 class="font-bold text-gray-900 text-lg mb-4">Contribute</h3>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 text-center">
                <div class="w-16 h-16 mx-auto bg-teal-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-camera text-teal-500 text-2xl"></i>
                </div>
                <h4 class="font-semibold text-gray-900 text-base">Photo Audit</h4>
                <p class="text-gray-400 text-sm mt-1">+0.5 hrs</p>
            </button>

            <button class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 text-center">
                <div class="w-16 h-16 mx-auto bg-blue-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-clipboard-check text-blue-500 text-2xl"></i>
                </div>
                <h4 class="font-semibold text-gray-900 text-base">Survey Route</h4>
                <p class="text-gray-400 text-sm mt-1">+1.0 hrs</p>
            </button>

            <button class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 text-center">
                <div class="w-16 h-16 mx-auto bg-amber-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-exclamation-triangle text-amber-500 text-2xl"></i>
                </div>
                <h4 class="font-semibold text-gray-900 text-base">Report Issue</h4>
                <p class="text-gray-400 text-sm mt-1">+0.25 hrs</p>
            </button>

            <button class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 text-center">
                <div class="w-16 h-16 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-tags text-emerald-500 text-2xl"></i>
                </div>
                <h4 class="font-semibold text-gray-900 text-base">Label Data</h4>
                <p class="text-gray-400 text-sm mt-1">+0.5 hrs</p>
            </button>
        </div>

        <!-- Recent Contributions -->
        <h3 class="font-bold text-gray-900 text-lg mb-4">Recent</h3>

        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-teal-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-camera text-teal-500 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">Orchard Rd Ramp</h4>
                    <p class="text-gray-400 text-sm">Photo submitted</p>
                </div>
                <span class="text-emerald-500 font-medium text-sm">+0.5 hrs</span>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-clipboard-check text-blue-500 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">Bugis Junction Route</h4>
                    <p class="text-gray-400 text-sm">Survey completed</p>
                </div>
                <span class="text-emerald-500 font-medium text-sm">+1.0 hrs</span>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-emerald-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-tags text-emerald-500 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">15 Images Labeled</h4>
                    <p class="text-gray-400 text-sm">AI training data</p>
                </div>
                <span class="text-emerald-500 font-medium text-sm">+0.5 hrs</span>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-map-marked-alt text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Navigate</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hands-helping text-teal-600 text-2xl"></i>
                <span class="text-sm text-teal-600 font-medium mt-1">Volunteer</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-trophy text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Rewards</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
