<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-4 pb-32">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop&crop=face"
                     class="w-14 h-14 rounded-full object-cover border-2 border-teal-200">
                <div>
                    <p class="text-gray-400 text-base">Hello,</p>
                    <h1 class="text-2xl font-bold text-gray-900">Sarah 👋</h1>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-emerald-100 rounded-full px-4 py-2">
                <i class="fas fa-leaf text-emerald-600"></i>
                <span class="text-emerald-700 font-bold text-lg">1,280</span>
            </div>
        </div>

        <!-- Climate Status Card -->
        <div class="bg-gradient-to-br from-teal-500 to-cyan-600 rounded-3xl p-6 text-white mb-6 shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <p class="text-teal-100 text-base mb-1">Today in Singapore</p>
                    <div class="flex items-center gap-3">
                        <span class="text-5xl font-bold">32°</span>
                        <div class="text-teal-100">
                            <p class="text-base">Partly Cloudy</p>
                            <p class="text-sm">UV Index: High</p>
                        </div>
                    </div>
                </div>
                <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-cloud-sun text-4xl"></i>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="flex-1 bg-white/15 rounded-xl p-3 text-center">
                    <i class="fas fa-temperature-high text-xl mb-1"></i>
                    <p class="text-sm">Heat: Moderate</p>
                </div>
                <div class="flex-1 bg-white/15 rounded-xl p-3 text-center">
                    <i class="fas fa-water text-xl mb-1"></i>
                    <p class="text-sm">Flood: Low</p>
                </div>
                <div class="flex-1 bg-white/15 rounded-xl p-3 text-center">
                    <i class="fas fa-tree text-xl mb-1"></i>
                    <p class="text-sm">Shade: Good</p>
                </div>
            </div>
        </div>

        <!-- Quick Navigate -->
        <button class="w-full bg-white rounded-3xl p-5 mb-6 shadow-sm border border-gray-100 flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-2xl flex items-center justify-center">
                <i class="fas fa-route text-white text-3xl"></i>
            </div>
            <div class="flex-1 text-left">
                <h3 class="font-bold text-gray-900 text-xl">Plan Route</h3>
                <p class="text-gray-400 text-base">Accessible & climate-safe</p>
            </div>
            <i class="fas fa-chevron-right text-gray-300 text-xl"></i>
        </button>

        <!-- Quick Stats -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-14 h-14 mx-auto bg-blue-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-wheelchair text-blue-500 text-2xl"></i>
                </div>
                <p class="text-3xl font-bold text-gray-900">24</p>
                <p class="text-gray-400 text-base">Routes Taken</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-14 h-14 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-cloud text-emerald-500 text-2xl"></i>
                </div>
                <p class="text-3xl font-bold text-gray-900">8.2kg</p>
                <p class="text-gray-400 text-base">CO₂ Saved</p>
            </div>
        </div>

        <!-- Recent Routes -->
        <h2 class="font-bold text-gray-900 text-lg mb-3">Recent Routes</h2>
        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-teal-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-building text-teal-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-lg">Marina Bay Sands</h4>
                    <p class="text-gray-400 text-sm">1.2 km • 15 min</p>
                </div>
                <div class="flex items-center gap-1 text-emerald-500">
                    <i class="fas fa-wheelchair text-lg"></i>
                    <i class="fas fa-check text-sm"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-purple-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-tree text-purple-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-lg">Gardens by the Bay</h4>
                    <p class="text-gray-400 text-sm">2.5 km • 30 min</p>
                </div>
                <div class="flex items-center gap-1 text-emerald-500">
                    <i class="fas fa-wheelchair text-lg"></i>
                    <i class="fas fa-check text-sm"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-teal-600 text-2xl"></i>
                <span class="text-sm text-teal-600 font-medium mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-map-marked-alt text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Navigate</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hands-helping text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Volunteer</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-trophy text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Rewards</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
