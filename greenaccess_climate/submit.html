<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Submit Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 py-4 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <button class="w-11 h-11 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">Submission Result</h1>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6 pb-32">
        <!-- Success Badge -->
        <div class="flex justify-center mb-6">
            <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center">
                <i class="fas fa-check-circle text-emerald-500 text-5xl"></i>
            </div>
        </div>

        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Photo Submitted!</h2>
            <p class="text-gray-500 text-base">AI analysis complete</p>
        </div>

        <!-- Photo Preview -->
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 mb-6">
            <div class="w-full h-48 bg-gradient-to-br from-teal-100 to-cyan-100 rounded-2xl flex items-center justify-center mb-4">
                <div class="text-center">
                    <i class="fas fa-image text-teal-400 text-5xl mb-2"></i>
                    <p class="text-teal-600 text-sm">Ramp Photo</p>
                </div>
            </div>

            <!-- Location -->
            <div class="flex items-center gap-3 mb-3">
                <i class="fas fa-map-marker-alt text-red-500"></i>
                <span class="text-gray-700 text-base">Orchard Road, near ION</span>
            </div>

            <!-- Tags -->
            <div class="flex flex-wrap gap-2">
                <span class="px-3 py-1 bg-teal-100 text-teal-700 rounded-full text-sm font-medium">Curb Ramp</span>
                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-sm font-medium">Accessible</span>
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">Good Condition</span>
            </div>
        </div>

        <!-- AI Analysis -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
            <h3 class="font-bold text-gray-900 text-lg mb-4">AI Analysis</h3>

            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-teal-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-wheelchair text-teal-500"></i>
                        </div>
                        <span class="text-gray-700">Wheelchair Access</span>
                    </div>
                    <span class="text-emerald-500 font-semibold">Yes</span>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-ruler text-blue-500"></i>
                        </div>
                        <span class="text-gray-700">Slope Grade</span>
                    </div>
                    <span class="text-gray-900 font-semibold">7.5%</span>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-ruler-horizontal text-amber-500"></i>
                        </div>
                        <span class="text-gray-700">Width</span>
                    </div>
                    <span class="text-gray-900 font-semibold">1.2m</span>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-road text-purple-500"></i>
                        </div>
                        <span class="text-gray-700">Surface</span>
                    </div>
                    <span class="text-gray-900 font-semibold">Concrete</span>
                </div>
            </div>
        </div>

        <!-- Rewards Earned -->
        <div class="bg-gradient-to-br from-purple-500 to-indigo-600 rounded-3xl p-5 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-purple-200 text-sm mb-1">You Earned</p>
                    <div class="flex items-center gap-3">
                        <span class="text-4xl font-bold">+0.5</span>
                        <span class="text-purple-200 text-lg">hrs</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-white/20 flex items-center justify-between">
                <span class="text-purple-200">Total Service Hours</span>
                <span class="font-bold text-lg">25.0 hrs</span>
            </div>
        </div>
    </div>

    <!-- Bottom Action -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-4 pb-8">
        <div class="flex gap-4">
            <button class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl font-semibold text-lg flex items-center justify-center gap-2">
                <i class="fas fa-camera"></i>
                New Photo
            </button>
            <button class="flex-1 py-4 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-2xl font-semibold text-lg flex items-center justify-center gap-2">
                <i class="fas fa-check"></i>
                Done
            </button>
        </div>
    </div>
</body>
</html>
