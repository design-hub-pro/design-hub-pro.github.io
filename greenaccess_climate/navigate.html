<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Navigate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Search Header -->
    <div class="bg-white px-6 py-4 shadow-sm">
        <div class="space-y-3">
            <div class="flex items-center gap-3 bg-gray-100 rounded-2xl px-4 py-3">
                <i class="fas fa-circle text-emerald-500 text-sm"></i>
                <input type="text" placeholder="Current Location" value="Orchard MRT" class="flex-1 bg-transparent text-gray-900 text-base outline-none">
            </div>
            <div class="flex items-center gap-3 bg-gray-100 rounded-2xl px-4 py-3">
                <i class="fas fa-map-marker-alt text-red-500 text-lg"></i>
                <input type="text" placeholder="Where to?" class="flex-1 bg-transparent text-gray-900 text-base outline-none">
            </div>
        </div>

        <!-- Quick Filters -->
        <div class="flex gap-2 mt-4 overflow-x-auto pb-1">
            <button class="flex-shrink-0 px-4 py-2 bg-teal-500 text-white rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-wheelchair"></i>
                Accessible
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-umbrella-beach"></i>
                Shaded
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-water"></i>
                Flood Safe
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-leaf"></i>
                Low Carbon
            </button>
        </div>
    </div>

    <!-- Map Area -->
    <div class="relative h-[400px] bg-gradient-to-b from-teal-100 to-cyan-100">
        <!-- Simulated Map -->
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="text-center">
                <div class="w-24 h-24 bg-white/80 rounded-full flex items-center justify-center mb-4 mx-auto shadow-lg">
                    <i class="fas fa-map-marked-alt text-teal-500 text-4xl"></i>
                </div>
                <p class="text-teal-700 font-medium text-lg">Interactive Map</p>
                <p class="text-teal-600 text-sm">Singapore</p>
            </div>
        </div>

        <!-- Map Controls -->
        <div class="absolute right-4 top-4 space-y-2">
            <button class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center">
                <i class="fas fa-layer-group text-gray-600 text-lg"></i>
            </button>
            <button class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center">
                <i class="fas fa-location-arrow text-teal-500 text-lg"></i>
            </button>
        </div>

        <!-- Legend -->
        <div class="absolute left-4 bottom-4 bg-white rounded-2xl p-3 shadow-lg">
            <div class="flex items-center gap-4 text-sm">
                <div class="flex items-center gap-1">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
                    <span class="text-gray-600">Safe</span>
                </div>
                <div class="flex items-center gap-1">
                    <div class="w-3 h-3 bg-amber-500 rounded-full"></div>
                    <span class="text-gray-600">Caution</span>
                </div>
                <div class="flex items-center gap-1">
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <span class="text-gray-600">Avoid</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Suggested Destinations -->
    <div class="px-6 py-4 pb-32 bg-white rounded-t-3xl -mt-6 relative z-10">
        <h3 class="font-bold text-gray-900 text-lg mb-4">Popular Accessible Places</h3>

        <div class="space-y-3">
            <button class="w-full bg-gray-50 rounded-2xl p-4 flex items-center gap-4 text-left">
                <div class="w-14 h-14 bg-teal-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-hospital text-teal-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">SGH Hospital</h4>
                    <p class="text-gray-400 text-sm">0.8 km • Fully Accessible</p>
                </div>
                <div class="text-emerald-500">
                    <i class="fas fa-wheelchair"></i>
                </div>
            </button>

            <button class="w-full bg-gray-50 rounded-2xl p-4 flex items-center gap-4 text-left">
                <div class="w-14 h-14 bg-purple-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shopping-bag text-purple-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">ION Orchard</h4>
                    <p class="text-gray-400 text-sm">0.3 km • Ramps Available</p>
                </div>
                <div class="text-emerald-500">
                    <i class="fas fa-wheelchair"></i>
                </div>
            </button>

            <button class="w-full bg-gray-50 rounded-2xl p-4 flex items-center gap-4 text-left">
                <div class="w-14 h-14 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-train text-blue-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">Dhoby Ghaut MRT</h4>
                    <p class="text-gray-400 text-sm">0.5 km • Elevator Access</p>
                </div>
                <div class="text-emerald-500">
                    <i class="fas fa-wheelchair"></i>
                </div>
            </button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-map-marked-alt text-teal-600 text-2xl"></i>
                <span class="text-sm text-teal-600 font-medium mt-1">Navigate</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hands-helping text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Volunteer</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-trophy text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Rewards</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
