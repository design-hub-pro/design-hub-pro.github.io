<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-900">
    <!-- Status Bar -->
    <div class="bg-gray-900 px-6 py-2 flex justify-between items-center text-base font-medium text-white sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-gray-900 px-6 py-4">
        <div class="flex items-center gap-4">
            <button class="w-11 h-11 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-white text-lg"></i>
            </button>
            <div class="flex-1">
                <h1 class="text-xl font-bold text-white">Photo Audit</h1>
                <p class="text-gray-400 text-sm">Capture accessibility feature</p>
            </div>
        </div>
    </div>

    <!-- Camera View -->
    <div class="relative h-[500px] bg-gradient-to-b from-gray-800 to-gray-900">
        <!-- Viewfinder -->
        <div class="absolute inset-6 border-2 border-white/30 rounded-3xl overflow-hidden">
            <!-- Corner guides -->
            <div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-teal-400 rounded-tl-3xl"></div>
            <div class="absolute top-0 right-0 w-16 h-16 border-t-4 border-r-4 border-teal-400 rounded-tr-3xl"></div>
            <div class="absolute bottom-0 left-0 w-16 h-16 border-b-4 border-l-4 border-teal-400 rounded-bl-3xl"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-teal-400 rounded-br-3xl"></div>

            <!-- Center guide -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="text-center">
                    <div class="w-20 h-20 border-2 border-dashed border-white/40 rounded-2xl flex items-center justify-center mb-3">
                        <i class="fas fa-wheelchair text-white/40 text-3xl"></i>
                    </div>
                    <p class="text-white/50 text-base">Align ramp or feature</p>
                </div>
            </div>
        </div>

        <!-- AI Detection Status -->
        <div class="absolute bottom-6 left-6 right-6">
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-4">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-teal-400 rounded-full pulse"></div>
                    <span class="text-white font-medium">AI detecting...</span>
                </div>
                <div class="mt-3 flex gap-2">
                    <span class="px-3 py-1 bg-teal-500/30 text-teal-300 rounded-full text-sm">Ramp detected</span>
                    <span class="px-3 py-1 bg-white/10 text-gray-300 rounded-full text-sm">Slope: ~8%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Capture Type Selection -->
    <div class="bg-gray-900 px-6 py-4">
        <div class="flex gap-3 overflow-x-auto pb-2">
            <button class="flex-shrink-0 px-4 py-2 bg-teal-500 text-white rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-wheelchair"></i>
                Ramp
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white/10 text-gray-300 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-elevator"></i>
                Elevator
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white/10 text-gray-300 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-road"></i>
                Sidewalk
            </button>
            <button class="flex-shrink-0 px-4 py-2 bg-white/10 text-gray-300 rounded-full font-medium flex items-center gap-2 text-sm">
                <i class="fas fa-door-open"></i>
                Door
            </button>
        </div>
    </div>

    <!-- Capture Controls -->
    <div class="bg-gray-900 px-6 py-6">
        <div class="flex items-center justify-center gap-8">
            <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-image text-white text-2xl"></i>
            </button>

            <button class="w-24 h-24 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-full flex items-center justify-center shadow-lg shadow-teal-500/30 border-4 border-white/20">
                <div class="w-16 h-16 bg-white rounded-full"></div>
            </button>

            <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-sync-alt text-white text-2xl"></i>
            </button>
        </div>

        <!-- Tip -->
        <div class="mt-6 bg-white/5 rounded-xl p-3 flex items-center gap-3">
            <i class="fas fa-lightbulb text-amber-400 text-lg"></i>
            <p class="text-gray-400 text-sm">Include full ramp and surrounding area for best AI analysis</p>
        </div>
    </div>
</body>
</html>
