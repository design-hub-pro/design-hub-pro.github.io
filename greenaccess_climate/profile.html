<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>GreenAccess Climate - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-gradient-to-r from-teal-500 to-cyan-500 px-6 py-2 flex justify-between items-center text-base font-medium text-white sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Profile Header -->
    <div class="bg-gradient-to-r from-teal-500 to-cyan-500 px-6 pt-6 pb-24">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Profile</h1>
            <button class="w-11 h-11 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fas fa-cog text-white text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="px-6 -mt-20 pb-32">
        <div class="bg-white rounded-3xl p-6 shadow-lg mb-6">
            <!-- Avatar & Name -->
            <div class="flex flex-col items-center mb-6">
                <div class="relative mb-3">
                    <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop&crop=face"
                         class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg">
                    <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-teal-500 rounded-full flex items-center justify-center border-2 border-white">
                        <i class="fas fa-wheelchair text-white text-sm"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Sarah Chen</h2>
                <span class="px-4 py-1 bg-teal-100 text-teal-700 rounded-full text-base font-medium mt-2">Girl Scout Volunteer</span>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-50 rounded-2xl p-4 text-center">
                    <i class="fas fa-route text-teal-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">24</p>
                    <p class="text-gray-400 text-sm">Routes</p>
                </div>
                <div class="bg-gray-50 rounded-2xl p-4 text-center">
                    <i class="fas fa-clock text-purple-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">24.5</p>
                    <p class="text-gray-400 text-sm">Hours</p>
                </div>
                <div class="bg-gray-50 rounded-2xl p-4 text-center">
                    <i class="fas fa-leaf text-emerald-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">1,280</p>
                    <p class="text-gray-400 text-sm">Points</p>
                </div>
            </div>
        </div>

        <!-- Accessibility Preferences -->
        <div class="bg-white rounded-3xl p-5 shadow-sm mb-6">
            <h3 class="font-bold text-gray-900 text-lg mb-4">Accessibility</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-wheelchair text-teal-500 text-xl w-6"></i>
                        <span class="text-gray-700 text-base">Wheelchair User</span>
                    </div>
                    <div class="w-12 h-7 bg-teal-500 rounded-full p-1 flex items-center justify-end">
                        <div class="w-5 h-5 bg-white rounded-full shadow"></div>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-umbrella-beach text-blue-500 text-xl w-6"></i>
                        <span class="text-gray-700 text-base">Prefer Shaded Routes</span>
                    </div>
                    <div class="w-12 h-7 bg-teal-500 rounded-full p-1 flex items-center justify-end">
                        <div class="w-5 h-5 bg-white rounded-full shadow"></div>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-mountain text-amber-500 text-xl w-6"></i>
                        <span class="text-gray-700 text-base">Avoid Steep Slopes</span>
                    </div>
                    <div class="w-12 h-7 bg-teal-500 rounded-full p-1 flex items-center justify-end">
                        <div class="w-5 h-5 bg-white rounded-full shadow"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu -->
        <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
            <button class="w-full p-5 flex items-center gap-4 border-b border-gray-50">
                <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-chart-line text-purple-500 text-xl"></i>
                </div>
                <span class="flex-1 text-left font-medium text-gray-900 text-lg">Impact Report</span>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>

            <button class="w-full p-5 flex items-center gap-4 border-b border-gray-50">
                <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shield-alt text-emerald-500 text-xl"></i>
                </div>
                <span class="flex-1 text-left font-medium text-gray-900 text-lg">Privacy</span>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>

            <button class="w-full p-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-question-circle text-gray-500 text-xl"></i>
                </div>
                <span class="flex-1 text-left font-medium text-gray-900 text-lg">Help</span>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-map-marked-alt text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Navigate</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-hands-helping text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Volunteer</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-trophy text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Rewards</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-teal-600 text-2xl"></i>
                <span class="text-sm text-teal-600 font-medium mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
