<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.cover{height:150px;margin:0 -28px;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,247,242,0) 40%,#FBF7F2 100%)}
.stat{background:white;border-radius:20px;padding:13px 6px;text-align:center;box-shadow:0 4px 14px rgba(60,40,20,0.06)}
.work{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1/1}
.work img{width:100%;height:100%;object-fit:cover}
.badge{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:white;font-size:20px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="cover"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381735-image-1.png"></div>
    <div class="flex items-end gap-3.5 -mt-12 relative">
      <img class="w-[84px] h-[84px] rounded-[26px] object-cover border-4 border-[#FBF7F2]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381324-image-1.png">
      <div class="flex-1 pb-1">
        <h1 class="serif text-[24px] font-bold leading-none">Ava Kim</h1>
        <p class="text-[12px] text-[#A3978A] mt-1">15 &middot; Lincoln High Art Club</p>
      </div>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm mb-1"><i class="fas fa-gear text-[#6B5F55]"></i></div>
    </div>

    <div class="grid grid-cols-3 gap-2.5 mt-5">
      <div class="stat"><p class="text-[28px] font-extrabold leading-none">23</p><p class="text-[10px] font-semibold text-[#A3978A] mt-1">artworks</p></div>
      <div class="stat"><p class="text-[28px] font-extrabold leading-none text-[#0D9488]">5</p><p class="text-[10px] font-semibold text-[#A3978A] mt-1">went home</p></div>
      <div class="stat"><p class="text-[28px] font-extrabold leading-none text-[#7C3AED]">18h</p><p class="text-[10px] font-semibold text-[#A3978A] mt-1">service</p></div>
    </div>

    <!-- service hours -->
    <div class="card mt-3 flex items-center gap-3">
      <div class="gi" style="background:linear-gradient(135deg,#FCD34D,#F59E0B)"><i class="fas fa-certificate"></i></div>
      <div class="flex-1">
        <p class="text-[13px] font-bold">Service hours, signed by shelters</p>
        <div class="progress-track mt-2"><div class="progress-fill" style="width:60%;background:linear-gradient(90deg,#FCD34D,#F59E0B)"></div></div>
        <p class="text-[10px] text-[#A3978A] mt-1">18 of 30 for school goal</p>
      </div>
      <i class="fas fa-file-arrow-down text-[#B3A89C]"></i>
    </div>

    <div class="flex items-center gap-2 mt-5 mb-3">
      <span class="chip active">Portfolio</span><span class="chip">Stories</span><span class="chip">Badges</span>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <div class="work"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381184-image-1.png"><span class="absolute top-1.5 left-1.5 text-[9px] font-bold text-white bg-[#0D9488] px-1.5 py-0.5 rounded-full"><i class="fas fa-house"></i> Home</span></div>
      <div class="work"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381033-image-1.png"></div>
      <div class="work"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380338-image-1.png"></div>
      <div class="work"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381735-image-1.png"><span class="absolute top-1.5 left-1.5 text-[9px] font-bold text-white bg-[#0D9488] px-1.5 py-0.5 rounded-full"><i class="fas fa-house"></i> Home</span></div>
      <div class="work"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381004-image-1.png"></div>
      <div class="work flex items-center justify-center" style="background:#F3EEFF"><i class="fas fa-plus text-[#7C3AED] text-xl"></i></div>
    </div>

    <p class="label mt-5 mb-2">Badges</p>
    <div class="flex gap-3">
      <div class="badge" style="background:linear-gradient(135deg,#FF8A5B,#E8417A)"><i class="fas fa-house"></i></div>
      <div class="badge" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-palette"></i></div>
      <div class="badge" style="background:linear-gradient(135deg,#5EEAD4,#0D9488)"><i class="fas fa-book-open"></i></div>
      <div class="badge" style="background:#EDE6DC;color:#C9BEB2"><i class="fas fa-lock"></i></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-magnifying-glass"></i><span>Discover</span></div>
    <div class="tab"><div class="tab-create"><i class="fas fa-paintbrush"></i></div></div>
    <div class="tab"><i class="fas fa-people-group"></i><span>Community</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
