<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawCanvas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#1F1A17}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2a33,#0c0b10);box-shadow:0 50px 80px -30px rgba(90,50,20,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#FBF7F2}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FF8A5B,#E8417A 55%,#7C3AED)"><i class="fa-solid fa-paw text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-bold tracking-tight" style="font-family:'Fraunces',serif">PawCanvas</h1>
  <p class="mt-3 text-[19px] text-gray-500">Find shelter animals near you, and make art and stories that help them get adopted.</p>
  <div class="mt-6 flex gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-600">Adoption</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Student Art</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Community</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Wellbeing</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="discover.html" scrolling="no" title="discover"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="animal.html" scrolling="no" title="animal"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="create.html" scrolling="no" title="create"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="story.html" scrolling="no" title="story"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="feed.html" scrolling="no" title="feed"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="challenge.html" scrolling="no" title="challenge"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="comfort.html" scrolling="no" title="comfort"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="visit.html" scrolling="no" title="visit"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="shelter.html" scrolling="no" title="shelter"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
</div></main>
</body></html>
