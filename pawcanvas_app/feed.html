<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.post{background:white;border-radius:26px;overflow:hidden;box-shadow:0 6px 20px rgba(60,40,20,0.07)}
.post img.media{width:100%;object-fit:cover;display:block}
.act{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#6B5F55}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,#FF8A5B,#E8417A,#7C3AED)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid #FBF7F2}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-3">
      <h1 class="serif text-[28px] font-bold">Community</h1>
      <div class="flex gap-2"><div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-bell text-[#6B5F55]"></i></div><div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-paper-plane text-[#6B5F55]"></i></div></div>
    </div>

    <!-- animal stories row -->
    <div class="hscroll mb-4">
      <div class="flex flex-col items-center gap-1"><div class="story-ring"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380044-image-1.png"></div><span class="text-[11px] font-semibold">Biscuit</span></div>
      <div class="flex flex-col items-center gap-1"><div class="story-ring"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094379461-image-1.png"></div><span class="text-[11px] font-semibold">Mochi</span></div>
      <div class="flex flex-col items-center gap-1"><div class="story-ring"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094379836-image-1.png"></div><span class="text-[11px] font-semibold">Duke</span></div>
      <div class="flex flex-col items-center gap-1"><div class="story-ring" style="background:#E5DCD0"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380992-image-1.png"></div><span class="text-[11px] font-semibold">Clover</span></div>
      <div class="flex flex-col items-center gap-1"><div class="story-ring" style="background:#E5DCD0"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380375-image-1.png"></div><span class="text-[11px] font-semibold">Luna</span></div>
    </div>

    <!-- adoption update -->
    <div class="post">
      <div class="relative">
        <img class="media" style="height:250px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381834-image-1.png">
        <span class="absolute top-3 left-3 text-[11px] font-bold text-white px-3 py-1.5 rounded-full" style="background:#0D9488"><i class="fas fa-house mr-1"></i>Adopted</span>
      </div>
      <div class="p-4">
        <div class="flex items-center gap-2.5">
          <div class="gi" style="width:34px;height:34px;font-size:13px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E)"><i class="fas fa-paw"></i></div>
          <div class="flex-1"><p class="text-[13px] font-bold">Sunny Paws Rescue</p><p class="text-[11px] text-[#A3978A]">2 h &middot; thanks 9 artists</p></div>
        </div>
        <p class="text-[14px] mt-2.5 leading-snug">Pepper went home with the Ortiz family. They found her through Maya's comic.</p>
        <div class="flex items-center gap-5 mt-3">
          <span class="act"><i class="fas fa-heart text-[#FF6B4A]"></i>1.2k</span>
          <span class="act"><i class="far fa-comment"></i>148</span>
          <span class="act"><i class="far fa-paper-plane"></i></span>
          <div class="flex items-center ml-auto"><img class="w-6 h-6 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381324-image-1.png"><img class="w-6 h-6 av -ml-2" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094382205-image-1.png"><img class="w-6 h-6 av -ml-2" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381046-image-1.png"><span class="text-[11px] font-bold text-[#A3978A] ml-1.5">+6</span></div>
        </div>
      </div>
    </div>

    <!-- art post -->
    <div class="post mt-4">
      <div class="p-4 pb-3 flex items-center gap-2.5">
        <img class="w-9 h-9 rounded-full object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381324-image-1.png">
        <div class="flex-1"><p class="text-[13px] font-bold">Ava Kim <span class="text-[10px] font-bold text-[#7C3AED] bg-[#F3EEFF] px-1.5 py-0.5 rounded ml-1">Artist</span></p><p class="text-[11px] text-[#A3978A]">for Mochi &middot; Eastside Shelter</p></div>
        <i class="fas fa-ellipsis text-[#B3A89C]"></i>
      </div>
      <img class="media" style="height:220px" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381033-image-1.png">
      <div class="p-4 flex items-center gap-5">
        <span class="act"><i class="far fa-heart"></i>342</span>
        <span class="act"><i class="far fa-comment"></i>28</span>
        <span class="ml-auto text-[12px] font-bold text-[#FF6B4A]">Meet Mochi</span>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-magnifying-glass"></i><span>Discover</span></div>
    <div class="tab"><div class="tab-create"><i class="fas fa-paintbrush"></i></div></div>
    <div class="tab active"><i class="fas fa-people-group"></i><span>Community</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
