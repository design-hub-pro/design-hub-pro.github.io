<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.hero{position:absolute;top:0;left:0;right:0;height:430px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 30%)}
.sheet{position:absolute;top:390px;left:0;right:0;bottom:0;background:#FBF7F2;border-radius:32px 32px 0 0;padding:22px 28px 120px;overflow-y:auto;z-index:5}
.art{min-width:104px;height:128px;background:white;padding:5px 5px 16px;border-radius:6px;box-shadow:0 8px 18px rgba(60,40,20,0.14)}
.art img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.trait{display:flex;flex-direction:column;align-items:center;gap:5px;background:white;border-radius:18px;padding:11px 4px;box-shadow:0 3px 12px rgba(60,40,20,0.05)}
.cta{position:absolute;left:0;right:0;bottom:0;height:104px;background:rgba(255,253,250,0.95);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;padding:14px 24px;display:flex;gap:10px;z-index:10}
.ibtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:white}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar" style="color:white">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="hero"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380044-image-1.png"></div>
  <div class="absolute left-0 right-0 px-6 flex justify-between" style="top:66px;z-index:6">
    <div class="ibtn"><i class="fas fa-arrow-left"></i></div>
    <div class="flex gap-2"><div class="ibtn"><i class="fas fa-share-nodes"></i></div><div class="ibtn"><i class="fas fa-heart text-[#FF8A7A]"></i></div></div>
  </div>
  <div class="absolute flex gap-1.5" style="top:360px;left:50%;transform:translateX(-50%);z-index:6"><span class="w-5 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/60"></span><span class="w-1.5 h-1.5 rounded-full bg-white/60"></span></div>

  <div class="sheet">
    <div class="flex items-start justify-between">
      <div>
        <h1 class="serif text-[36px] font-bold leading-none">Biscuit</h1>
        <p class="text-[13px] text-[#A3978A] font-medium mt-1.5"><i class="fas fa-location-dot text-[#FF6B4A]"></i> Sunny Paws Rescue &middot; 3 mi</p>
      </div>
      <span class="text-[11px] font-bold text-[#C2410C] bg-[#FFEDD5] px-2.5 py-1 rounded-full mt-1">214 days</span>
    </div>

    <div class="grid grid-cols-4 gap-2 mt-4">
      <div class="trait"><i class="fas fa-cake-candles text-[#FF6B4A]"></i><span class="text-[11px] font-bold">2 yr</span></div>
      <div class="trait"><i class="fas fa-weight-hanging text-[#7C3AED]"></i><span class="text-[11px] font-bold">28 lb</span></div>
      <div class="trait"><i class="fas fa-child-reaching text-[#0D9488]"></i><span class="text-[11px] font-bold">Kids ok</span></div>
      <div class="trait"><i class="fas fa-bolt text-[#F59E0B]"></i><span class="text-[11px] font-bold">Playful</span></div>
    </div>

    <div class="flex items-center justify-between mt-5 mb-2.5">
      <h2 class="serif text-[18px] font-bold">Made for Biscuit</h2>
      <span class="text-[12px] font-bold text-[#7C3AED]">12 works</span>
    </div>
    <div class="hscroll" style="padding-top:6px;padding-bottom:10px">
      <div class="art" style="transform:rotate(-3deg)"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381184-image-1.png"></div>
      <div class="art" style="transform:rotate(2deg)"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380338-image-1.png"></div>
      <div class="art flex flex-col items-center justify-center" style="transform:rotate(-1deg);padding:5px;background:#F3EEFF"><i class="fas fa-plus text-[#7C3AED] text-lg"></i><span class="text-[11px] font-bold text-[#7C3AED] mt-1">Add yours</span></div>
    </div>

    <div class="card mt-3">
      <div class="flex items-center gap-2"><i class="fas fa-book-open text-[#F59E0B]"></i><p class="text-[13px] font-bold">Featured story &middot; by Ava, 15</p></div>
      <p class="serif text-[15px] leading-snug mt-2 text-[#4A403A]">"Biscuit carries his ball to every visitor. He drops it at your feet, then waits like it is the most important thing in the world."</p>
    </div>
  </div>

  <div class="cta">
    <button class="w-[56px] rounded-2xl bg-white border border-[#EFE7DD] flex items-center justify-center"><i class="fas fa-comment text-[#6B5F55]"></i></button>
    <button class="flex-1 rounded-2xl font-bold text-[14px] bg-[#F3EEFF] text-[#7C3AED]">Book a visit</button>
    <button class="flex-1 rounded-2xl font-bold text-[14px] text-white" style="background:linear-gradient(135deg,#FF8A5B,#E8417A);box-shadow:0 10px 22px rgba(232,65,122,0.3)">Apply to adopt</button>
  </div>
</div>
</body>
</html>
