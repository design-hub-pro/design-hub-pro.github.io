<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.hero{position:absolute;top:0;left:0;right:0;height:520px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,247,242,0) 55%,#FBF7F2 100%)}
.polaroid{position:absolute;background:white;padding:6px 6px 18px;border-radius:6px;box-shadow:0 14px 30px rgba(60,40,20,0.25)}
.polaroid img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.role{display:flex;align-items:center;gap:10px;background:white;border-radius:18px;padding:11px 12px;box-shadow:0 4px 14px rgba(60,40,20,0.06);border:2px solid transparent}
.role.on{border-color:#FF6B4A;background:#FFF4EF}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="hero"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381735-image-1.png"></div>
  <div class="polaroid" style="top:300px;left:30px;width:118px;height:140px;transform:rotate(-8deg);z-index:3"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380044-image-1.png"></div>
  <div class="polaroid" style="top:318px;right:34px;width:118px;height:140px;transform:rotate(7deg);z-index:3"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381184-image-1.png"></div>

  <div class="absolute left-0 right-0 bottom-0 px-7 pb-10" style="z-index:5">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#FF8A5B,#E8417A)"><i class="fas fa-paw text-sm"></i></div>
      <span class="serif text-xl font-bold">PawCanvas</span>
    </div>
    <h1 class="serif text-[34px] font-bold leading-[1.08]">Every shelter animal deserves to be seen.</h1>
    <p class="text-[15px] text-[#6B5F55] mt-2">Find animals from every shelter near you. Make art that helps them get adopted.</p>

    <p class="label mt-5 mb-2">I'm here to</p>
    <div class="grid grid-cols-2 gap-2">
      <div class="role on"><div class="gi" style="width:34px;height:34px;font-size:14px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E)"><i class="fas fa-heart"></i></div><span class="text-[13px] font-bold">Adopt</span></div>
      <div class="role on"><div class="gi" style="width:34px;height:34px;font-size:14px;background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-palette"></i></div><span class="text-[13px] font-bold">Make art</span></div>
      <div class="role"><div class="gi" style="width:34px;height:34px;font-size:14px;background:linear-gradient(135deg,#5EEAD4,#0D9488)"><i class="fas fa-spa"></i></div><span class="text-[13px] font-bold">Feel calmer</span></div>
      <div class="role"><div class="gi" style="width:34px;height:34px;font-size:14px;background:linear-gradient(135deg,#FCD34D,#F59E0B)"><i class="fas fa-hand-holding-heart"></i></div><span class="text-[13px] font-bold">Volunteer</span></div>
    </div>

    <button class="w-full mt-5 py-4 rounded-2xl text-white font-bold text-[15px]" style="background:#1F1A17">Get started</button>
    <p class="text-center text-[12px] text-[#A3978A] mt-3">Run a shelter? <span class="font-bold text-[#FF6B4A]">Partner with us</span></p>
  </div>
</div>
</body>
</html>
