<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Visit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.day{width:52px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;background:white;box-shadow:0 3px 10px rgba(60,40,20,0.05)}
.day.on{background:#1F1A17;color:white}
.slot{padding:12px 0;border-radius:16px;text-align:center;font-size:13px;font-weight:700;background:white;box-shadow:0 3px 10px rgba(60,40,20,0.05)}
.slot.on{background:#FFF1EC;color:#E8417A;outline:2px solid #FF8A7A}
.slot.off{background:#F4EEE6;color:#C9BEB2;box-shadow:none;text-decoration:line-through}
.type{display:flex;align-items:center;gap:12px;background:white;border-radius:20px;padding:12px;box-shadow:0 4px 14px rgba(60,40,20,0.06);border:2px solid transparent}
.type.on{border-color:#FF8A7A}
.footer{position:absolute;left:0;right:0;bottom:0;height:104px;background:rgba(255,253,250,0.95);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;padding:14px 24px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content" style="height:calc(100% - 59px - 104px)">
    <div class="flex items-center justify-between mt-2 mb-4">
      <i class="fas fa-arrow-left text-[#6B5F55]"></i>
      <h1 class="text-[15px] font-bold">Book a visit</h1>
      <span class="w-4"></span>
    </div>

    <div class="flex items-center gap-3 card">
      <img class="w-16 h-16 rounded-2xl object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380044-image-1.png">
      <div class="flex-1">
        <p class="serif text-[20px] font-bold leading-none">Biscuit</p>
        <p class="text-[12px] text-[#A3978A] mt-1"><i class="fas fa-location-dot text-[#FF6B4A]"></i> Sunny Paws Rescue &middot; 3 mi</p>
      </div>
      <div class="flex items-center"><span class="dot bg-[#22C55E]"></span><span class="text-[11px] font-bold text-[#16A34A] ml-1">Open</span></div>
    </div>

    <p class="label mt-5 mb-2.5">What kind of visit</p>
    <div class="flex flex-col gap-2.5">
      <div class="type on"><div class="gi" style="background:linear-gradient(135deg,#FF8A5B,#E8417A)"><i class="fas fa-house"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Meet to adopt</p><p class="text-[11px] text-[#A3978A]">45 min &middot; with a staff member</p></div><i class="fas fa-circle-check text-[#E8417A] text-lg"></i></div>
      <div class="type"><div class="gi" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-palette"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Sketch session</p><p class="text-[11px] text-[#A3978A]">Draw from life &middot; 1 hr</p></div></div>
      <div class="type"><div class="gi" style="background:linear-gradient(135deg,#5EEAD4,#0D9488)"><i class="fas fa-book-open"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Read &amp; relax</p><p class="text-[11px] text-[#A3978A]">Quiet time with Biscuit &middot; 30 min</p></div></div>
    </div>

    <p class="label mt-5 mb-2.5">November</p>
    <div class="flex justify-between">
      <div class="day"><span class="text-[10px] font-semibold opacity-60">THU</span><span class="text-[17px] font-extrabold">12</span></div>
      <div class="day"><span class="text-[10px] font-semibold opacity-60">FRI</span><span class="text-[17px] font-extrabold">13</span></div>
      <div class="day on"><span class="text-[10px] font-semibold opacity-60">SAT</span><span class="text-[17px] font-extrabold">14</span></div>
      <div class="day"><span class="text-[10px] font-semibold opacity-60">SUN</span><span class="text-[17px] font-extrabold">15</span></div>
      <div class="day"><span class="text-[10px] font-semibold opacity-60">MON</span><span class="text-[17px] font-extrabold">16</span></div>
      <div class="day"><span class="text-[10px] font-semibold opacity-60">TUE</span><span class="text-[17px] font-extrabold">17</span></div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="slot off">10:00</div><div class="slot on">11:00</div><div class="slot">12:30</div>
      <div class="slot">2:00</div><div class="slot off">3:30</div><div class="slot">4:30</div>
    </div>
  </div>
  <div class="footer">
    <button class="w-full py-4 rounded-2xl text-white font-bold text-[15px]" style="background:linear-gradient(135deg,#FF8A5B,#E8417A);box-shadow:0 10px 22px rgba(232,65,122,0.3)">Confirm Sat, Nov 14 &middot; 11:00</button>
  </div>
</div>
</body>
</html>
