<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FBF7F2;color:#1F1A17;width:100%;height:100%;margin:0;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#1F1A17;position:relative;z-index:15}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 90px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:90px;background:rgba(255,253,250,0.94);backdrop-filter:blur(20px);border-top:1px solid #EFE7DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A89C;font-size:10px;font-weight:600;width:60px}
.tab.active{color:#FF6B4A}
.tab i{font-size:21px}
.tab-create{width:56px;height:56px;border-radius:20px;margin-top:-22px;background:linear-gradient(135deg,#FF8A5B,#FF5A4E 55%,#E8417A);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;box-shadow:0 12px 26px rgba(255,90,78,0.4);transform:rotate(-6deg)}
.card{background:white;border-radius:22px;padding:15px;box-shadow:0 6px 22px rgba(60,40,20,0.07)}
.label{font-size:12px;font-weight:700;color:#A3978A;text-transform:uppercase;letter-spacing:0.06em}
.chip{font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:white;color:#6B5F55;box-shadow:0 2px 8px rgba(60,40,20,0.06);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:#1F1A17;color:white}
.progress-track{height:7px;background:#F1E9DF;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.gi{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:white;flex-shrink:0}
.av{border-radius:50%;object-fit:cover;border:2px solid white}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -28px;padding:2px 28px 6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
body{background:#F4EFE8}
.canvas{position:relative;margin:0 20px;height:520px;background:white;border-radius:28px;box-shadow:0 14px 34px rgba(60,40,20,0.12);overflow:hidden}
.canvas>img{width:100%;height:100%;object-fit:cover}
.ref{position:absolute;top:14px;left:14px;width:92px;height:92px;border-radius:16px;overflow:hidden;border:3px solid white;box-shadow:0 8px 18px rgba(0,0,0,0.2)}
.ref img{width:100%;height:100%;object-fit:cover}
.tool{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#6B5F55;background:white}
.tool.on{background:#1F1A17;color:white}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.12)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="flex items-center justify-between px-6 mt-1 mb-3">
    <i class="fas fa-xmark text-lg text-[#6B5F55]"></i>
    <div class="flex bg-white rounded-full p-1 shadow-sm">
      <span class="px-4 py-1.5 rounded-full bg-[#1F1A17] text-white text-[12px] font-bold"><i class="fas fa-palette mr-1"></i>Draw</span>
      <span class="px-4 py-1.5 rounded-full text-[#6B5F55] text-[12px] font-bold"><i class="fas fa-feather mr-1"></i>Story</span>
      <span class="px-4 py-1.5 rounded-full text-[#6B5F55] text-[12px] font-bold"><i class="fas fa-camera mr-1"></i>Photo</span>
    </div>
    <i class="fas fa-rotate-left text-lg text-[#6B5F55]"></i>
  </div>

  <div class="canvas">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094381184-image-1.png">
    <div class="ref"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794094380044-image-1.png"></div>
    <span class="absolute top-[110px] left-[14px] text-[10px] font-bold bg-white px-2 py-0.5 rounded-full shadow-sm">Biscuit &middot; ref</span>
    <div class="absolute bottom-4 right-4 bg-white/95 rounded-2xl px-3 py-2 flex items-center gap-2 shadow">
      <i class="fas fa-layer-group text-[#7C3AED]"></i><span class="text-[11px] font-bold">Layer 3 of 4</span>
    </div>
  </div>

  <!-- brush + colors -->
  <div class="mx-5 mt-4 card" style="border-radius:24px">
    <div class="flex items-center justify-between">
      <div class="tool on"><i class="fas fa-paintbrush"></i></div>
      <div class="tool"><i class="fas fa-pencil"></i></div>
      <div class="tool"><i class="fas fa-droplet"></i></div>
      <div class="tool"><i class="fas fa-eraser"></i></div>
      <div class="tool"><i class="fas fa-shapes"></i></div>
    </div>
    <div class="flex items-center justify-between mt-4">
      <div class="sw" style="background:#C08A4E;outline:2px solid #1F1A17"></div>
      <div class="sw" style="background:#8A5A2B"></div>
      <div class="sw" style="background:#F2D3A2"></div>
      <div class="sw" style="background:#E8417A"></div>
      <div class="sw" style="background:#3B82F6"></div>
      <div class="sw" style="background:#1F1A17"></div>
      <div class="sw" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"></div>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-0 px-5 pb-9 flex gap-2.5">
    <button class="flex-1 py-4 rounded-2xl bg-white font-bold text-[14px] text-[#6B5F55] shadow-sm"><i class="fas fa-clock-rotate-left mr-1.5"></i>Timelapse</button>
    <button class="flex-[1.4] py-4 rounded-2xl text-white font-bold text-[14px]" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">Send to shelter review</button>
  </div>
</div>
</body>
</html>
