<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyQuest — Review</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0D0B1A; color:#fff; scrollbar-width:none; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; background:#0D0B1A; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; }

  .top { padding:6px 28px 10px; display:flex; align-items:center; gap:14px; }
  .top .close { width:34px; height:34px; border-radius:11px; background:#17142A; display:flex; align-items:center; justify-content:center; }
  .top .close i { color:#9B93C7; font-size:13px; }
  .progress-wrap { flex:1; }
  .progress-top { display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:#9B93C7; margin-bottom:6px; }
  .progress-top b { color:#fff; }
  .progress-bar { height:7px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .progress-fill { height:100%; width:33%; border-radius:6px; background:linear-gradient(90deg,#8B5CF6,#C8FF3D); }

  .deck-meta { display:flex; align-items:center; gap:8px; padding:14px 28px 0; }
  .deck-chip { display:flex; align-items:center; gap:7px; background:rgba(34,197,94,0.14); border:1px solid rgba(34,197,94,0.28); padding:6px 12px; border-radius:12px; }
  .deck-chip i { color:#22C55E; font-size:11px; }
  .deck-chip span { font-size:11px; font-weight:700; color:#22C55E; }
  .deck-chip2 { font-size:11px; font-weight:600; color:#9B93C7; }

  /* card */
  .card-area { padding:18px 28px; }
  .flash { background:#17142A; border:1px solid rgba(255,255,255,0.08); border-radius:28px; padding:28px 24px; min-height:380px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .flash::before { content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(139,92,246,0.18),transparent 70%); }
  .flash-tag { font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#A78BFA; position:relative; z-index:2; }
  .flash-q { font-size:24px; font-weight:800; line-height:1.3; margin-top:18px; letter-spacing:-0.5px; position:relative; z-index:2; }
  .flash-divider { margin:22px 0; height:1px; background:rgba(255,255,255,0.08); position:relative; z-index:2; }
  .flash-a-label { font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#C8FF3D; position:relative; z-index:2; }
  .flash-a { font-size:16px; color:#D9D4F0; line-height:1.55; margin-top:10px; position:relative; z-index:2; }
  .flash-img { margin-top:auto; border-radius:16px; overflow:hidden; height:110px; position:relative; z-index:2; }
  .flash-img img { width:100%; height:100%; object-fit:cover; }
  .flip-hint { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; font-size:12px; color:#6E6A8C; font-weight:600; }

  /* answer buttons */
  .rate-label { text-align:center; font-size:12px; color:#9B93C7; font-weight:600; padding:4px 28px 12px; }
  .rate { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 28px 30px; }
  .rate-btn { border:none; border-radius:16px; padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rate-btn i { font-size:16px; }
  .rate-btn b { font-size:12px; font-weight:800; }
  .rate-btn span { font-size:9px; font-weight:600; opacity:0.75; }
  .r-again { background:rgba(255,90,106,0.14); color:#FF5A6A; }
  .r-hard { background:rgba(255,176,32,0.14); color:#FFB020; }
  .r-good { background:rgba(56,189,248,0.14); color:#38BDF8; }
  .r-easy { background:rgba(34,197,94,0.14); color:#22C55E; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar"><span class="time">9:41</span><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div></div>

  <div class="top">
    <div class="close"><i class="fas fa-xmark"></i></div>
    <div class="progress-wrap">
      <div class="progress-top"><span>Card <b>4</b> of 12</span><span>~9 min left</span></div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
  </div>

  <div class="deck-meta">
    <div class="deck-chip"><i class="fas fa-dna"></i><span>Biology</span></div>
    <span class="deck-chip2">Cell Division · weak topic</span>
  </div>

  <div class="card-area">
    <div class="flash">
      <div class="flash-tag">Question</div>
      <div class="flash-q">During which phase do sister chromatids separate and move to opposite poles?</div>
      <div class="flash-divider"></div>
      <div class="flash-a-label">Answer</div>
      <div class="flash-a">Anaphase — the spindle fibers pull sister chromatids apart toward opposite poles of the cell.</div>
      <div class="flash-img"><img src="https://images.unsplash.com/photo-1554475901-4538ddfbccc2?w=600&q=80" alt=""></div>
    </div>
    <div class="flip-hint"><i class="fas fa-hand-pointer"></i> Tap card to flip</div>
  </div>

  <div class="rate-label">How well did you know it?</div>
  <div class="rate">
    <button class="rate-btn r-again"><i class="fas fa-rotate-left"></i><b>Again</b><span>&lt;1m</span></button>
    <button class="rate-btn r-hard"><i class="fas fa-face-frown"></i><b>Hard</b><span>10m</span></button>
    <button class="rate-btn r-good"><i class="fas fa-face-smile"></i><b>Good</b><span>1d</span></button>
    <button class="rate-btn r-easy"><i class="fas fa-face-grin-stars"></i><b>Easy</b><span>4d</span></button>
  </div>
</div>
</body>
</html>
