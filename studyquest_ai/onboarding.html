<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyQuest — Setup</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0D0B1A; color:#fff; scrollbar-width:none; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; padding-bottom:120px; background:#0D0B1A; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; }

  .steps { display:flex; gap:6px; padding:8px 28px 0; }
  .step { flex:1; height:5px; border-radius:4px; background:rgba(255,255,255,0.1); }
  .step.on { background:#C8FF3D; }

  .head { padding:24px 28px 8px; }
  .head .icon { width:60px; height:60px; border-radius:18px; background:linear-gradient(135deg,#8B5CF6,#6D28D9); display:flex; align-items:center; justify-content:center; margin-bottom:18px; box-shadow:0 10px 30px rgba(139,92,246,0.4); }
  .head .icon i { font-size:26px; color:#fff; }
  .head h1 { font-size:27px; font-weight:900; letter-spacing:-0.8px; line-height:1.15; }
  .head h1 span { color:#C8FF3D; }
  .head p { font-size:14px; color:#9B93C7; margin-top:10px; line-height:1.5; }

  .label { padding:24px 28px 12px; font-size:12px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; color:#9B93C7; }

  .subjects { padding:0 28px; display:flex; flex-direction:column; gap:12px; }
  .sub { background:#17142A; border:1px solid rgba(255,255,255,0.07); border-radius:18px; padding:15px; }
  .sub-top { display:flex; align-items:center; gap:12px; }
  .sub-ico { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sub-ico i { font-size:17px; color:#fff; }
  .sub-name { font-size:15px; font-weight:700; flex:1; }
  .sub-check { width:24px; height:24px; border-radius:50%; background:#C8FF3D; display:flex; align-items:center; justify-content:center; }
  .sub-check i { font-size:11px; color:#0D0B1A; }
  .conf-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .conf-lbl { font-size:11px; color:#9B93C7; font-weight:600; width:74px; }
  .conf-dots { display:flex; gap:6px; flex:1; }
  .cd { flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,0.1); }
  .conf-tag { font-size:10px; font-weight:800; padding:3px 9px; border-radius:8px; }

  .footer { position:absolute; bottom:0; left:0; right:0; padding:18px 28px 30px; background:linear-gradient(0deg,#0D0B1A 70%,transparent); }
  .next { width:100%; background:linear-gradient(135deg,#C8FF3D,#9FE000); border:none; border-radius:18px; padding:17px; font-size:15px; font-weight:800; color:#0D0B1A; display:flex; align-items:center; justify-content:center; gap:10px; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar"><span class="time">9:41</span><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div></div>

  <div class="steps">
    <div class="step on"></div>
    <div class="step on"></div>
    <div class="step"></div>
    <div class="step"></div>
  </div>

  <div class="head">
    <div class="icon"><i class="fas fa-graduation-cap"></i></div>
    <h1>Rate your <span>confidence</span><br>in each subject</h1>
    <p>StudyQuest uses this to decide what you should study first — and what can wait.</p>
  </div>

  <div class="label">Your Subjects</div>
  <div class="subjects">
    <div class="sub">
      <div class="sub-top">
        <div class="sub-ico" style="background:linear-gradient(135deg,#22C55E,#16A34A)"><i class="fas fa-dna"></i></div>
        <div class="sub-name">Biology</div>
        <div class="sub-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="conf-row">
        <span class="conf-lbl">Confidence</span>
        <div class="conf-dots">
          <span class="cd" style="background:#FF5A6A"></span><span class="cd" style="background:#FF5A6A"></span><span class="cd"></span><span class="cd"></span><span class="cd"></span>
        </div>
        <span class="conf-tag" style="background:rgba(255,90,106,0.16);color:#FF5A6A">Low</span>
      </div>
    </div>

    <div class="sub">
      <div class="sub-top">
        <div class="sub-ico" style="background:linear-gradient(135deg,#8B5CF6,#6D28D9)"><i class="fas fa-square-root-variable"></i></div>
        <div class="sub-name">Calculus</div>
        <div class="sub-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="conf-row">
        <span class="conf-lbl">Confidence</span>
        <div class="conf-dots">
          <span class="cd" style="background:#FFB020"></span><span class="cd" style="background:#FFB020"></span><span class="cd" style="background:#FFB020"></span><span class="cd"></span><span class="cd"></span>
        </div>
        <span class="conf-tag" style="background:rgba(255,176,32,0.16);color:#FFB020">Mid</span>
      </div>
    </div>

    <div class="sub">
      <div class="sub-top">
        <div class="sub-ico" style="background:linear-gradient(135deg,#38BDF8,#0EA5E9)"><i class="fas fa-flask"></i></div>
        <div class="sub-name">Chemistry</div>
        <div class="sub-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="conf-row">
        <span class="conf-lbl">Confidence</span>
        <div class="conf-dots">
          <span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd"></span>
        </div>
        <span class="conf-tag" style="background:rgba(34,197,94,0.16);color:#22C55E">High</span>
      </div>
    </div>

    <div class="sub">
      <div class="sub-top">
        <div class="sub-ico" style="background:linear-gradient(135deg,#FF5A6A,#E11D48)"><i class="fas fa-book-open"></i></div>
        <div class="sub-name">English</div>
        <div class="sub-check"><i class="fas fa-check"></i></div>
      </div>
      <div class="conf-row">
        <span class="conf-lbl">Confidence</span>
        <div class="conf-dots">
          <span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd" style="background:#22C55E"></span><span class="cd"></span>
        </div>
        <span class="conf-tag" style="background:rgba(34,197,94,0.16);color:#22C55E">High</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="next">Build my study plan <i class="fas fa-arrow-right"></i></button>
  </div>
</div>
</body>
</html>
