<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate - Capture Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #1a1625; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
        .mini-board { display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 16px; overflow: hidden; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; cursor: pointer; user-select: none; }
        .cl { background: #e8dcc8; }
        .cd { background: #b58863; }
        .target { position: relative; }
        .target::after { content: ''; position: absolute; inset: 6px; border: 3px solid #ef4444; border-radius: 50%; animation: targetPulse 1.5s ease-in-out infinite; }
        @keyframes targetPulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
        .captured { opacity: 0.2; }
        .player-glow { filter: drop-shadow(0 0 8px rgba(99,102,241,0.6)); }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 relative">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="content-area">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i class="fas fa-arrow-left text-white/60 text-sm"></i>
                <span class="text-white font-semibold text-sm">Mini Games</span>
            </div>
            <div class="bg-amber-500/20 rounded-full px-3 py-1 flex items-center gap-1.5">
                <i class="fas fa-star text-amber-400 text-xs"></i>
                <span class="text-amber-400 text-xs font-bold">Level 2</span>
            </div>
        </div>

        <!-- Game Title Card -->
        <div class="bg-gradient-to-r from-red-500/20 to-orange-500/10 rounded-2xl p-4 border border-red-500/20 mb-5">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-br from-red-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-crosshairs text-white text-xl"></i>
                </div>
                <div>
                    <h2 class="text-white font-bold text-lg">Capture Quest</h2>
                    <p class="text-white/50 text-xs mt-0.5">Use your Rook to capture all marked pieces</p>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-white/40 text-xs">Captured</span>
                <div class="flex gap-1">
                    <div class="w-6 h-6 rounded bg-emerald-500/30 flex items-center justify-center text-xs">♟</div>
                    <div class="w-6 h-6 rounded bg-emerald-500/30 flex items-center justify-center text-xs">♞</div>
                    <div class="w-6 h-6 rounded bg-white/10 flex items-center justify-center text-xs text-white/20">?</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-white/40 text-xs">Moves:</span>
                <span class="text-white font-bold text-sm">4 / 6</span>
            </div>
        </div>

        <!-- 5x5 Mini Board -->
        <div class="mini-board shadow-2xl mb-5">
            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>

            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd target">♝</div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>

            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl player-glow" style="background: rgba(99,102,241,0.25);">♖</div>
            <div class="cell cd"></div>
            <div class="cell cl captured">♟</div>

            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>

            <div class="cell cl captured">♞</div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
        </div>

        <!-- Hint Area -->
        <div class="bg-emerald-500/10 rounded-2xl p-4 border border-emerald-500/20 mb-5">
            <div class="flex items-start gap-3">
                <div class="w-9 h-9 bg-emerald-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-lightbulb text-emerald-400"></i>
                </div>
                <div>
                    <p class="text-emerald-400 text-xs font-semibold mb-1">Hint</p>
                    <p class="text-white/60 text-xs leading-relaxed">The Rook moves in straight lines — up, down, left, or right. Can you reach the Bishop?</p>
                </div>
            </div>
        </div>

        <!-- Cognitive Tracker -->
        <div class="bg-white/5 rounded-2xl p-4 mb-4 pb-28">
            <div class="flex items-center justify-between mb-2">
                <span class="text-white/40 text-xs">Cognitive Focus</span>
                <span class="text-indigo-400 text-xs font-semibold">Great</span>
            </div>
            <div class="flex gap-1">
                <div class="flex-1 h-2 rounded-full bg-indigo-500"></div>
                <div class="flex-1 h-2 rounded-full bg-indigo-500"></div>
                <div class="flex-1 h-2 rounded-full bg-indigo-500"></div>
                <div class="flex-1 h-2 rounded-full bg-indigo-500/40"></div>
                <div class="flex-1 h-2 rounded-full bg-white/10"></div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-home text-white/40"></i><span class="text-[10px] text-white/40">Home</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chess text-indigo-400"></i><span class="text-[10px] font-semibold text-indigo-400">Play</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chart-line text-white/40"></i><span class="text-[10px] text-white/40">Insights</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user-nurse text-white/40"></i><span class="text-[10px] text-white/40">Caregiver</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user text-white/40"></i><span class="text-[10px] text-white/40">Profile</span></div>
    </div>
</body>
</html>
