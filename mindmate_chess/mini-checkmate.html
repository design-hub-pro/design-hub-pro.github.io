<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate - One Move Mate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #1a1625; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
        .mini-board { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 16px; overflow: hidden; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 38px; position: relative; cursor: pointer; user-select: none; }
        .cl { background: #e8dcc8; }
        .cd { background: #b58863; }
        .move-target { position: relative; }
        .move-target::after { content: ''; position: absolute; width: 20px; height: 20px; background: rgba(99,102,241,0.5); border-radius: 50%; }
        .selected { background: rgba(99,102,241,0.3) !important; box-shadow: inset 0 0 0 3px rgba(99,102,241,0.6); }
        @keyframes crown { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .crown-anim { animation: crown 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 relative">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="content-area">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i class="fas fa-arrow-left text-white/60 text-sm"></i>
                <span class="text-white font-semibold text-sm">Mini Games</span>
            </div>
            <div class="bg-purple-500/20 rounded-full px-3 py-1 flex items-center gap-1.5">
                <i class="fas fa-star text-purple-400 text-xs"></i>
                <span class="text-purple-400 text-xs font-bold">Level 3</span>
            </div>
        </div>

        <!-- Game Title -->
        <div class="bg-gradient-to-r from-purple-500/20 to-indigo-500/10 rounded-2xl p-4 border border-purple-500/20 mb-5">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-chess-queen text-white text-xl crown-anim"></i>
                </div>
                <div>
                    <h2 class="text-white font-bold text-lg">One Move Mate</h2>
                    <p class="text-white/50 text-xs mt-0.5">Find the move that checkmates the black King</p>
                </div>
            </div>
        </div>

        <!-- Puzzle Info -->
        <div class="flex items-center gap-3 mb-4">
            <div class="bg-white/5 rounded-xl px-4 py-2 flex items-center gap-2 flex-1">
                <i class="fas fa-puzzle-piece text-indigo-400 text-sm"></i>
                <span class="text-white text-xs font-medium">Puzzle #12</span>
            </div>
            <div class="bg-white/5 rounded-xl px-4 py-2 flex items-center gap-2 flex-1">
                <i class="fas fa-clock text-amber-400 text-sm"></i>
                <span class="text-white text-xs font-medium">No time limit</span>
            </div>
        </div>

        <!-- Instruction -->
        <div class="bg-indigo-500/10 rounded-xl p-3 mb-4 border border-indigo-500/15">
            <p class="text-indigo-300 text-xs text-center font-medium">
                <i class="fas fa-hand-pointer mr-1"></i> Tap your Queen, then tap where to move her
            </p>
        </div>

        <!-- 4x4 Simplified Board -->
        <div class="mini-board shadow-2xl mb-5">
            <!-- Row 1 -->
            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd">♚</div>
            <!-- Row 2 -->
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd">♟</div>
            <div class="cell cl"></div>
            <!-- Row 3 -->
            <div class="cell cl"></div>
            <div class="cell cd move-target"></div>
            <div class="cell cl"></div>
            <div class="cell cd move-target"></div>
            <!-- Row 4 -->
            <div class="cell cd selected">♕</div>
            <div class="cell cl">♔</div>
            <div class="cell cd"></div>
            <div class="cell cl">♖</div>
        </div>

        <!-- Scoring -->
        <div class="bg-white/5 rounded-2xl p-4 mb-4">
            <div class="flex items-center justify-between mb-3">
                <span class="text-white font-semibold text-sm">Today's Puzzles</span>
                <span class="text-indigo-400 text-xs font-medium">4 / 6 completed</span>
            </div>
            <div class="flex gap-2">
                <div class="flex-1 h-2 rounded-full bg-emerald-500"></div>
                <div class="flex-1 h-2 rounded-full bg-emerald-500"></div>
                <div class="flex-1 h-2 rounded-full bg-emerald-500"></div>
                <div class="flex-1 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                <div class="flex-1 h-2 rounded-full bg-white/10"></div>
                <div class="flex-1 h-2 rounded-full bg-white/10"></div>
            </div>
        </div>

        <!-- Success Metrics -->
        <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="bg-white/5 rounded-xl p-3 text-center">
                <p class="text-emerald-400 text-xl font-bold">75%</p>
                <p class="text-white/30 text-[10px]">Success Rate</p>
            </div>
            <div class="bg-white/5 rounded-xl p-3 text-center">
                <p class="text-amber-400 text-xl font-bold">18s</p>
                <p class="text-white/30 text-[10px]">Avg Time</p>
            </div>
            <div class="bg-white/5 rounded-xl p-3 text-center">
                <p class="text-purple-400 text-xl font-bold">5</p>
                <p class="text-white/30 text-[10px]">Streak</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 pb-28">
            <button class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-semibold py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2">
                <i class="fas fa-lightbulb"></i> Show Hint
            </button>
            <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center">
                <i class="fas fa-undo text-white/60"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-home text-white/40"></i><span class="text-[10px] text-white/40">Home</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chess text-indigo-400"></i><span class="text-[10px] font-semibold text-indigo-400">Play</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chart-line text-white/40"></i><span class="text-[10px] text-white/40">Insights</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user-nurse text-white/40"></i><span class="text-[10px] text-white/40">Caregiver</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user text-white/40"></i><span class="text-[10px] text-white/40">Profile</span></div>
    </div>
</body>
</html>
