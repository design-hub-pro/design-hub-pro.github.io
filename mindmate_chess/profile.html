<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate Chess - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #f8f9fb; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: white; border-top: 1px solid #f0f0f0; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 bg-white relative">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Profile Header -->
    <div class="content-area bg-white pb-5 text-center">
        <h1 class="text-xl font-bold text-gray-900 mb-5">Profile</h1>
        <img src="https://images.unsplash.com/photo-1566616213894-2d4e1baee5d8?w=200&h=200&fit=crop&crop=face" class="w-20 h-20 rounded-full object-cover mx-auto border-4 border-indigo-100 shadow-lg" />
        <h2 class="font-bold text-gray-900 mt-3">Margaret Chen</h2>
        <p class="text-xs text-gray-400">Member since Jan 2026</p>

        <!-- Stats Row -->
        <div class="flex items-center justify-center gap-6 mt-4">
            <div class="text-center">
                <p class="text-2xl font-extrabold text-indigo-600">47</p>
                <p class="text-[10px] text-gray-400">Games</p>
            </div>
            <div class="w-px h-8 bg-gray-200"></div>
            <div class="text-center">
                <p class="text-2xl font-extrabold text-emerald-600">78</p>
                <p class="text-[10px] text-gray-400">Cog Score</p>
            </div>
            <div class="w-px h-8 bg-gray-200"></div>
            <div class="text-center">
                <p class="text-2xl font-extrabold text-amber-600">12</p>
                <p class="text-[10px] text-gray-400">Day Streak</p>
            </div>
        </div>
    </div>

    <!-- Achievements -->
    <div class="content-area mt-4">
        <h2 class="text-base font-bold text-gray-900 mb-3">Achievements</h2>
        <div class="grid grid-cols-4 gap-3">
            <div class="text-center">
                <div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center mx-auto shadow-md">
                    <i class="fas fa-fire text-white text-lg"></i>
                </div>
                <p class="text-[10px] text-gray-600 font-medium mt-1.5">10-Day</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-2xl flex items-center justify-center mx-auto shadow-md">
                    <i class="fas fa-chess-queen text-white text-lg"></i>
                </div>
                <p class="text-[10px] text-gray-600 font-medium mt-1.5">First Win</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl flex items-center justify-center mx-auto shadow-md">
                    <i class="fas fa-brain text-white text-lg"></i>
                </div>
                <p class="text-[10px] text-gray-600 font-medium mt-1.5">Sharp Mind</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 bg-gray-200 rounded-2xl flex items-center justify-center mx-auto">
                    <i class="fas fa-lock text-gray-400 text-lg"></i>
                </div>
                <p class="text-[10px] text-gray-400 font-medium mt-1.5">Locked</p>
            </div>
        </div>
    </div>

    <!-- Settings -->
    <div class="content-area mt-5">
        <h2 class="text-base font-bold text-gray-900 mb-3">Settings</h2>
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-indigo-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sliders-h text-indigo-600 text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-900">Difficulty Level</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400">Auto</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </div>
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-emerald-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-universal-access text-emerald-600 text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-900">Accessibility</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-amber-600 text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-900">Reminders</span>
                </div>
                <div class="w-10 h-6 bg-emerald-500 rounded-full relative">
                    <div class="w-5 h-5 bg-white rounded-full absolute right-0.5 top-0.5 shadow-sm"></div>
                </div>
            </div>
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-user-md text-purple-600 text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-900">Link Caregiver</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=40&h=40&fit=crop&crop=face" class="w-6 h-6 rounded-full border-2 border-white" />
                        <img src="https://images.unsplash.com/photo-1594824476967-48c8b964ac31?w=40&h=40&fit=crop&crop=face" class="w-6 h-6 rounded-full border-2 border-white" />
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-shield-alt text-gray-600 text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-900">Privacy & Data</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
            </div>
        </div>
    </div>

    <div class="content-area mt-4 pb-28">
        <button class="w-full bg-red-50 text-red-500 font-semibold py-3 rounded-2xl text-sm">
            Sign Out
        </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-home text-gray-400"></i>
            <span class="text-[10px] text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-chess text-gray-400"></i>
            <span class="text-[10px] text-gray-400">Play</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-chart-line text-gray-400"></i>
            <span class="text-[10px] text-gray-400">Insights</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-user-nurse text-gray-400"></i>
            <span class="text-[10px] text-gray-400">Caregiver</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-user text-indigo-600"></i>
            <span class="text-[10px] font-semibold text-indigo-600">Profile</span>
        </div>
    </div>
</body>
</html>
