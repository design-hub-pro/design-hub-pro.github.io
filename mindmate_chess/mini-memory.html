<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate - Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #1a1625; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
        .mini-board { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 16px; overflow: hidden; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 34px; position: relative; cursor: pointer; user-select: none; }
        .cl { background: #e8dcc8; }
        .cd { background: #b58863; }
        .placed-correct { box-shadow: inset 0 0 0 3px rgba(16,185,129,0.6); }
        .placed-wrong { box-shadow: inset 0 0 0 3px rgba(239,68,68,0.6); }
        .empty-slot { position: relative; }
        .empty-slot::after { content: '?'; position: absolute; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.15); }
        @keyframes memorize { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .memorize-phase { animation: memorize 1s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 relative">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="content-area">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <i class="fas fa-arrow-left text-white/60 text-sm"></i>
                <span class="text-white font-semibold text-sm">Mini Games</span>
            </div>
            <div class="bg-cyan-500/20 rounded-full px-3 py-1 flex items-center gap-1.5">
                <i class="fas fa-star text-cyan-400 text-xs"></i>
                <span class="text-cyan-400 text-xs font-bold">Level 2</span>
            </div>
        </div>

        <!-- Game Title -->
        <div class="bg-gradient-to-r from-cyan-500/20 to-blue-500/10 rounded-2xl p-4 border border-cyan-500/20 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-brain text-white text-xl"></i>
                </div>
                <div>
                    <h2 class="text-white font-bold text-lg">Memory Match</h2>
                    <p class="text-white/50 text-xs mt-0.5">Memorize the positions, then recreate them</p>
                </div>
            </div>
        </div>

        <!-- Phase Indicator -->
        <div class="bg-amber-500/15 rounded-xl p-3 mb-4 border border-amber-500/20">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-eye text-amber-400 memorize-phase"></i>
                    <span class="text-amber-300 text-sm font-semibold">Phase 2: Place Pieces</span>
                </div>
                <span class="text-white/40 text-xs">3 of 4 placed</span>
            </div>
        </div>

        <!-- Reference Board (small) -->
        <div class="mb-3">
            <p class="text-white/40 text-[10px] font-semibold uppercase tracking-wider mb-2">Original Pattern</p>
            <div class="grid grid-cols-4 gap-1 w-32 opacity-60">
                <div class="aspect-square rounded bg-[#e8dcc8] flex items-center justify-center text-sm">♔</div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
                <div class="aspect-square rounded bg-[#b58863] flex items-center justify-center text-sm">♗</div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8] flex items-center justify-center text-sm">♘</div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#b58863]"></div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
                <div class="aspect-square rounded bg-[#b58863] flex items-center justify-center text-sm">♖</div>
                <div class="aspect-square rounded bg-[#e8dcc8]"></div>
            </div>
        </div>

        <!-- Main Board (answer) -->
        <p class="text-white/40 text-[10px] font-semibold uppercase tracking-wider mb-2">Your Board</p>
        <div class="mini-board shadow-2xl mb-5">
            <div class="cell cl placed-correct">♔</div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd placed-correct">♗</div>

            <div class="cell cd"></div>
            <div class="cell cl placed-correct">♘</div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>

            <div class="cell cl"></div>
            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd"></div>

            <div class="cell cd"></div>
            <div class="cell cl"></div>
            <div class="cell cd empty-slot"></div>
            <div class="cell cl"></div>
        </div>

        <!-- Pieces to Place -->
        <div class="mb-5">
            <p class="text-white/40 text-[10px] font-semibold uppercase tracking-wider mb-2">Remaining Pieces</p>
            <div class="flex gap-3">
                <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-3xl border-2 border-indigo-500/50 shadow-lg shadow-indigo-500/10">
                    ♖
                </div>
            </div>
        </div>

        <!-- Score -->
        <div class="bg-white/5 rounded-2xl p-4 flex items-center justify-between pb-28">
            <div class="text-center flex-1">
                <p class="text-cyan-400 text-xl font-bold">85%</p>
                <p class="text-white/30 text-[10px]">Memory Score</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-amber-400 text-xl font-bold">12s</p>
                <p class="text-white/30 text-[10px]">Study Time</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-emerald-400 text-xl font-bold">3/4</p>
                <p class="text-white/30 text-[10px]">Correct</p>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-home text-white/40"></i><span class="text-[10px] text-white/40">Home</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chess text-indigo-400"></i><span class="text-[10px] font-semibold text-indigo-400">Play</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-chart-line text-white/40"></i><span class="text-[10px] text-white/40">Insights</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user-nurse text-white/40"></i><span class="text-[10px] text-white/40">Caregiver</span></div>
        <div class="flex flex-col items-center gap-0.5"><i class="fas fa-user text-white/40"></i><span class="text-[10px] text-white/40">Profile</span></div>
    </div>
</body>
</html>
