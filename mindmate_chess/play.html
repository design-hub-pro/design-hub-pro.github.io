<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate Chess - Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #1a1625; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; background: #1a1625; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
        .chess-board { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
        .cell-light { background: #e8dcc8; }
        .cell-dark { background: #b58863; }
        .cell-highlight { background: rgba(99, 102, 241, 0.4) !important; }
        .cell-hint { background: rgba(16, 185, 129, 0.35) !important; }
        .chess-piece { font-size: 22px; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; cursor: pointer; user-select: none; }
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 relative">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Game Header -->
    <div class="content-area">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <i class="fas fa-arrow-left text-white/60 text-sm"></i>
                <span class="text-white font-semibold text-sm">Game #47</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-white/10 rounded-full px-3 py-1.5 flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-red-500 rounded-full pulse-ring"></span>
                    <span class="text-white text-xs font-medium">Recording</span>
                </div>
                <i class="fas fa-cog text-white/60"></i>
            </div>
        </div>

        <!-- Opponent Info -->
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-robot text-white text-sm"></i>
                </div>
                <div>
                    <p class="text-white font-semibold text-sm">AI Companion</p>
                    <p class="text-white/40 text-xs">Level 3 · Adaptive</p>
                </div>
            </div>
            <div class="bg-white/10 rounded-xl px-3 py-2 text-center">
                <p class="text-white font-bold text-lg">12:45</p>
                <p class="text-white/40 text-[10px]">TIME</p>
            </div>
        </div>

        <!-- Chess Board -->
        <div class="chess-board shadow-2xl">
            <!-- Row 8 -->
            <div class="chess-piece cell-light">♜</div>
            <div class="chess-piece cell-dark">♞</div>
            <div class="chess-piece cell-light">♝</div>
            <div class="chess-piece cell-dark">♛</div>
            <div class="chess-piece cell-light">♚</div>
            <div class="chess-piece cell-dark">♝</div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark">♜</div>
            <!-- Row 7 -->
            <div class="chess-piece cell-dark">♟</div>
            <div class="chess-piece cell-light">♟</div>
            <div class="chess-piece cell-dark">♟</div>
            <div class="chess-piece cell-light">♟</div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light">♟</div>
            <div class="chess-piece cell-dark">♟</div>
            <div class="chess-piece cell-light">♟</div>
            <!-- Row 6 -->
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light">♞</div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <!-- Row 5 -->
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark cell-highlight">♟</div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <!-- Row 4 -->
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light cell-highlight">♙</div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark"></div>
            <!-- Row 3 -->
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark">♘</div>
            <div class="chess-piece cell-light cell-hint"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light cell-hint"></div>
            <div class="chess-piece cell-dark"></div>
            <div class="chess-piece cell-light"></div>
            <!-- Row 2 -->
            <div class="chess-piece cell-light">♙</div>
            <div class="chess-piece cell-dark">♙</div>
            <div class="chess-piece cell-light">♙</div>
            <div class="chess-piece cell-dark">♙</div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark">♙</div>
            <div class="chess-piece cell-light">♙</div>
            <div class="chess-piece cell-dark">♙</div>
            <!-- Row 1 -->
            <div class="chess-piece cell-dark">♖</div>
            <div class="chess-piece cell-light"></div>
            <div class="chess-piece cell-dark">♗</div>
            <div class="chess-piece cell-light">♕</div>
            <div class="chess-piece cell-dark">♔</div>
            <div class="chess-piece cell-light">♗</div>
            <div class="chess-piece cell-dark">♘</div>
            <div class="chess-piece cell-light">♖</div>
        </div>

        <!-- Player Info -->
        <div class="flex items-center justify-between mt-3">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1566616213894-2d4e1baee5d8?w=80&h=80&fit=crop&crop=face" class="w-10 h-10 rounded-xl object-cover" />
                <div>
                    <p class="text-white font-semibold text-sm">Margaret</p>
                    <p class="text-white/40 text-xs">White · Your turn</p>
                </div>
            </div>
            <div class="bg-white/10 rounded-xl px-3 py-2 text-center">
                <p class="text-white font-bold text-lg">15:20</p>
                <p class="text-white/40 text-[10px]">TIME</p>
            </div>
        </div>

        <!-- Live Metrics Bar -->
        <div class="mt-4 bg-white/5 rounded-2xl p-3 flex items-center justify-between">
            <div class="text-center flex-1">
                <p class="text-amber-400 text-lg font-bold">2.3s</p>
                <p class="text-white/30 text-[10px]">Avg Response</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-emerald-400 text-lg font-bold">92%</p>
                <p class="text-white/30 text-[10px]">Accuracy</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-indigo-400 text-lg font-bold">1</p>
                <p class="text-white/30 text-[10px]">Hints Left</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 mt-4 pb-28">
            <button class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-semibold py-3 rounded-2xl text-sm flex items-center justify-center gap-2">
                <i class="fas fa-lightbulb"></i> Get Hint
            </button>
            <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">
                <i class="fas fa-undo text-white/60"></i>
            </button>
            <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">
                <i class="fas fa-pause text-white/60"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-home text-white/40"></i>
            <span class="text-[10px] text-white/40">Home</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-chess text-indigo-400"></i>
            <span class="text-[10px] font-semibold text-indigo-400">Play</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-chart-line text-white/40"></i>
            <span class="text-[10px] text-white/40">Insights</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-user-nurse text-white/40"></i>
            <span class="text-[10px] text-white/40">Caregiver</span>
        </div>
        <div class="flex flex-col items-center gap-0.5">
            <i class="fas fa-user text-white/40"></i>
            <span class="text-[10px] text-white/40">Profile</span>
        </div>
    </div>
</body>
</html>
