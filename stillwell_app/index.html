<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillwell · Mindfulness Assessment and Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#fff;color:#0E1815}
.wrap{max-width:1560px;margin:0 auto;padding:88px 48px 110px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:76px}
.icon{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#1E7A6B,#57C2A3);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -18px rgba(30,122,107,.9);margin-bottom:26px}
.icon i{color:#fff;font-size:34px}
h1{font-size:52px;font-weight:800;letter-spacing:-2px}
.tag{font-size:19px;color:#5D6E68;margin-top:14px;max-width:700px;line-height:1.5}
.tags{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.tags span{font-size:12.5px;font-weight:600;color:#2C3B36;background:#F1F5F3;border:1px solid #E5EBE7;padding:8px 15px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:64px 40px;justify-items:center}
.item{display:flex;flex-direction:column;align-items:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(160deg,#25302C,#0D1411);box-shadow:0 40px 80px -40px rgba(12,22,18,.7),0 0 0 1px rgba(255,255,255,.06) inset}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;background:#F2F6F4;display:block}
.cap{margin-top:22px;text-align:center}
.cap b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.cap span{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#92A099;font-weight:650;margin-top:6px}
@media(max-width:1500px){.wrap{padding:64px 24px 90px}.frame{transform:scale(.86);transform-origin:top center}.item{height:900px}}

<div class="wrap">
  <div class="hero">
    <div class="icon"><i class="fa-solid fa-water"></i></div>
    <h1>Stillwell</h1>

    <div class="tags"><span>Mobile App</span><span>Mindfulness</span><span>Mental Health</span><span>Self Assessment</span></div>
  </div>
  <div class="grid">
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="cap"><b>Today</b><span>Home</span></div></div>

    <div class="item"><div class="frame"><iframe src="practice.html" scrolling="no"></iframe></div><div class="cap"><b>Guided session</b><span>Practice</span></div></div>
    <div class="item"><div class="frame"><iframe src="trend.html" scrolling="no"></iframe></div><div class="cap"><b>Steadiness over time</b><span>Trend</span></div></div>
    <div class="item"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="cap"><b>Baseline and streak</b><span>You</span></div></div>
  </div>
</div>
