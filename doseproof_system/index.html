<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoseProof · System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-teal-400 to-teal-700 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-pills text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">DoseProof</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A camp medication box that checks lid, weight, sound and camera before it counts a dose as real.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Medical Device</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Multi-Sensor</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Anti-Spoofing</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Pediatric</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805712752-image-1.png" alt="DoseProof: "></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805712711-image-1.png" alt="DoseProof: child opening the box at the camp health cabin"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805711709-image-1.png" alt="DoseProof: the box with ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805710792-image-1.png" alt="DoseProof: boxes docked at the nurse station"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805740080-image-1.png" alt="DoseProof: nurse loading a dose"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805709949-image-1.png" alt="DoseProof: signal path from lid, scale, mic and camera to reward"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805710127-image-1.png" alt="DoseProof: exploded build stack"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805739494-image-1.png" alt="DoseProof: bench validation against a lab scale"></div>
        </div>
    </div>
</body>
</html>
