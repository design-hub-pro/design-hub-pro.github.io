<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobLaunch - AI Job Prep for High School Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            border-radius: 55px;
            overflow: hidden;
            box-shadow:
                0 0 0 12px #1a1a1a,
                0 0 0 14px #333,
                0 25px 50px -12px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(0, 0, 0, 0.2);
            position: relative;
            background: #1a1a1a;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 1000;
        }
        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 45px;
        }
        .screen-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-top: 20px;
            text-align: center;
        }
        .screens-container {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            justify-content: center;
            padding: 60px 40px;
        }
        .screen-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <header class="py-12 px-8 text-center border-b border-gray-100">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-rocket text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-bold gradient-text">JobLaunch</h1>
        </div>
        <p class="text-gray-500 text-lg max-w-2xl mx-auto">AI-Powered Job Preparation Platform for High School Students</p>
    </header>

    <!-- Screens Grid -->
    <div class="screens-container">
        <!-- Home Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="home.html"></iframe>
            </div>
            <p class="screen-label">Home - For You</p>
        </div>

        <!-- Explore Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="explore.html"></iframe>
            </div>
            <p class="screen-label">Explore Jobs</p>
        </div>

        <!-- Assessment Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="assessment.html"></iframe>
            </div>
            <p class="screen-label">Skills Assessment</p>
        </div>

        <!-- Learning Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="learning.html"></iframe>
            </div>
            <p class="screen-label">Learning Path</p>
        </div>

        <!-- Job Detail Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="job-detail.html"></iframe>
            </div>
            <p class="screen-label">Job Details</p>
        </div>

        <!-- Profile Screen -->
        <div class="screen-wrapper">
            <div class="phone-frame">
                <iframe src="profile.html"></iframe>
            </div>
            <p class="screen-label">Profile</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 text-center border-t border-gray-100">
        <p class="text-gray-400 text-sm">JobLaunch © 2024 — Prototype Design</p>
    </footer>
</body>
</html>
