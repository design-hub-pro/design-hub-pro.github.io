<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BullCub — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;font-family:'Inter',sans-serif;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%;overflow:hidden}
.screen{width:100%;height:100%;background:linear-gradient(180deg,#0B1120 0%,#0F1626 60%,#0F1626 100%);position:relative;color:#fff;display:flex;flex-direction:column}
.status-bar{height:59px;padding:18px 28px 0;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;color:#fff;z-index:10}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:5}
.bull-glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:520px;height:520px;background:radial-gradient(circle,rgba(0,210,106,0.35) 0%,rgba(124,58,237,0.18) 40%,transparent 70%);filter:blur(20px);pointer-events:none}
.hero-img{width:280px;height:280px;border-radius:48px;object-fit:cover;box-shadow:0 30px 80px rgba(0,210,106,0.35),0 0 0 1px rgba(255,255,255,0.06)}
.cta-btn{background:linear-gradient(180deg,#00D26A 0%,#00A352 100%);box-shadow:0 14px 30px -10px rgba(0,210,106,0.6),inset 0 1px 0 rgba(255,255,255,0.25)}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.25)}
.dot.active{width:24px;background:#00D26A}
.coin-float{position:absolute;border-radius:50%;background:linear-gradient(135deg,#FFD86B,#FFB800);box-shadow:0 8px 20px rgba(255,184,0,0.5);display:flex;align-items:center;justify-content:center;color:#7C3A00;font-weight:800}
.tag{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(20px)}
</style>
</head>
<body>
<div class="screen">
  <div class="bull-glow"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5 text-[13px]">
      <i class="fas fa-signal"></i><i class="fas fa-wifi"></i>
      <span class="ml-1 px-1.5 py-0.5 rounded border border-white/40 text-[10px] font-bold leading-none">96</span>
    </div>
  </div>

  <div class="flex-1 flex flex-col items-center justify-start pt-6 px-7 relative">
    <!-- Floating coins -->
    <div class="coin-float" style="top:60px;left:30px;width:40px;height:40px"><i class="fas fa-dollar-sign text-sm"></i></div>
    <div class="coin-float" style="top:120px;right:24px;width:32px;height:32px;background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff"><i class="fas fa-robot text-xs"></i></div>
    <div class="coin-float" style="bottom:380px;left:42px;width:28px;height:28px"><i class="fas fa-chart-line text-[10px]"></i></div>

    <div class="relative">
      <img src="https://images.unsplash.com/photo-1551836022-deb4988cc6c0?w=600" class="hero-img" alt="">
      <div class="absolute -top-3 -right-3 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl px-3 py-2 flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-[#00D26A] animate-pulse"></div>
        <span class="text-xs font-semibold">Live Markets</span>
      </div>
      <div class="absolute -bottom-4 -left-4 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl px-3 py-2.5 flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#7C3AED] to-[#4F46E5] flex items-center justify-center"><i class="fas fa-bolt text-white text-xs"></i></div>
        <div>
          <div class="text-[10px] text-white/60 leading-none">AI Lab</div>
          <div class="text-xs font-bold leading-tight">+248% YTD</div>
        </div>
      </div>
    </div>

    <div class="mt-10 flex items-center gap-2">
      <span class="tag rounded-full px-3 py-1 text-[10px] font-semibold tracking-wide">FOR AGES 8–18</span>
      <span class="tag rounded-full px-3 py-1 text-[10px] font-semibold tracking-wide text-[#00D26A]"><i class="fas fa-graduation-cap mr-1"></i>K-12 CURRICULUM</span>
    </div>

    <h1 class="mt-5 text-center text-[34px] leading-[1.05] font-extrabold tracking-tight" style="font-family:'Plus Jakarta Sans'">
      Trade Like a Pro.<br>
      <span class="bg-gradient-to-r from-[#00D26A] via-[#5EEAD4] to-[#7C3AED] bg-clip-text text-transparent">Learn Like a Kid.</span>
    </h1>
    <p class="mt-3 text-center text-[14px] text-white/60 leading-relaxed px-4">
      Master Wall Street with $10,000 in virtual cash, daily quests, and your own AI trading bot.
    </p>

    <div class="flex items-center gap-2 mt-8">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="px-7 pb-10 pt-4">
    <button class="cta-btn w-full h-[56px] rounded-2xl text-white font-bold text-[16px] flex items-center justify-center gap-2">
      Get Started — It's Free
      <i class="fas fa-arrow-right"></i>
    </button>
    <div class="text-center mt-4 text-[13px] text-white/50">
      Already have an account? <span class="text-white font-semibold">Log in</span>
    </div>
  </div>
</div>
</body>
</html>
