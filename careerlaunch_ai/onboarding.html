<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerLaunch AI - Onboarding</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="screen" style="background: linear-gradient(180deg, #6366F1 0%, #8B5CF6 100%); color: white;">
    <!-- Status Bar -->
    <div class="status-bar" style="color: white;">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Content -->
    <div style="padding: 40px 24px; text-align: center; min-height: calc(100% - 50px); display: flex; flex-direction: column;">
      <!-- Logo & Illustration -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; backdrop-filter: blur(10px);">
          <i class="fas fa-rocket" style="font-size: 48px;"></i>
        </div>

        <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 12px;">CareerLaunch AI</h1>
        <p style="font-size: 16px; opacity: 0.9; line-height: 1.6; max-width: 260px;">Your AI-powered career coach for high school students</p>

        <!-- Feature highlights -->
        <div style="margin-top: 40px; text-align: left; width: 100%;">
          <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px; background: rgba(255,255,255,0.15); padding: 16px; border-radius: 16px;">
            <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
              <i class="fas fa-briefcase"></i>
            </div>
            <div>
              <div style="font-weight: 600; font-size: 14px;">Student Job Marketplace</div>
              <div style="font-size: 12px; opacity: 0.8;">Age-appropriate opportunities</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px; background: rgba(255,255,255,0.15); padding: 16px; border-radius: 16px;">
            <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
              <i class="fas fa-robot"></i>
            </div>
            <div>
              <div style="font-weight: 600; font-size: 14px;">AI Interview Simulator</div>
              <div style="font-size: 12px; opacity: 0.8;">Practice with real feedback</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.15); padding: 16px; border-radius: 16px;">
            <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
              <i class="fas fa-chart-line"></i>
            </div>
            <div>
              <div style="font-weight: 600; font-size: 14px;">Skills Development</div>
              <div style="font-size: 12px; opacity: 0.8;">Personalized coaching</div>
            </div>
          </div>
        </div>
      </div>

      <!-- CTA Button -->
      <div style="padding-bottom: 20px;">
        <button style="width: 100%; padding: 16px; background: white; color: #6366F1; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;">
          Get Started
        </button>
        <p style="margin-top: 16px; font-size: 13px; opacity: 0.8;">Already have an account? <span style="font-weight: 600;">Sign In</span></p>
      </div>
    </div>
  </div>
</body>
</html>
