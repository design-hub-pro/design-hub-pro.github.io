<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerLaunch AI - Interview Session</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="screen" style="background: #0F172A;">
    <!-- Status Bar -->
    <div class="status-bar" style="color: white;">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Header -->
    <div style="padding: 8px 16px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 8px; height: 8px; background: #EF4444; border-radius: 50%; animation: pulse 1.5s infinite;"></div>
        <span style="color: white; font-size: 13px; font-weight: 500;">Recording</span>
      </div>
      <div style="background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;">
        <span style="color: white; font-size: 12px; font-weight: 600;">Question 2 of 5</span>
      </div>
      <button style="color: white; background: rgba(255,255,255,0.1); border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;">
        End
      </button>
    </div>

    <!-- Camera View -->
    <div style="padding: 16px;">
      <div class="interview-camera">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=300&fit=crop&crop=face" alt="User Camera" style="width: 100%; height: 100%; object-fit: cover;">

        <!-- Camera controls overlay -->
        <div style="position: absolute; top: 12px; left: 12px; display: flex; gap: 8px;">
          <div style="background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
            <i class="fas fa-eye" style="color: #10B981; font-size: 12px;"></i>
            <span style="color: white; font-size: 11px;">Eye contact: Good</span>
          </div>
        </div>

        <!-- Self view -->
        <div style="position: absolute; bottom: 12px; right: 12px; width: 80px; height: 100px; background: #1E293B; border-radius: 12px; border: 2px solid white; overflow: hidden;">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&h=150&fit=crop&crop=face" alt="Self View" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
      </div>
    </div>

    <!-- AI Question -->
    <div style="padding: 0 16px;">
      <div style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 20px; padding: 20px; position: relative;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
          <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-robot" style="color: white; font-size: 16px;"></i>
          </div>
          <span style="color: white; font-weight: 600; font-size: 14px;">AI Interviewer</span>
        </div>

        <p style="color: white; font-size: 15px; line-height: 1.6; margin-bottom: 16px;">
          "Tell me about a time when you had to work with a difficult customer. How did you handle the situation?"
        </p>

        <!-- Waveform (AI speaking) -->
        <div class="waveform" style="opacity: 0.5;">
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
          <div class="waveform-bar" style="background: white;"></div>
        </div>
      </div>
    </div>

    <!-- Response Timer -->
    <div style="padding: 20px 16px; text-align: center;">
      <div style="color: #94A3B8; font-size: 12px; margin-bottom: 8px;">Your response time</div>
      <div style="color: white; font-size: 32px; font-weight: 700;">0:42</div>
      <div style="color: #64748B; font-size: 11px; margin-top: 4px;">Aim for 1-2 minutes</div>
    </div>

    <!-- Real-time Feedback -->
    <div style="padding: 0 16px;">
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <div style="background: rgba(16, 185, 129, 0.2); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px;">
          <i class="fas fa-volume-up" style="color: #10B981; font-size: 12px;"></i>
          <span style="color: #10B981; font-size: 12px; font-weight: 500;">Clear Voice</span>
        </div>
        <div style="background: rgba(245, 158, 11, 0.2); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px;">
          <i class="fas fa-tachometer-alt" style="color: #F59E0B; font-size: 12px;"></i>
          <span style="color: #F59E0B; font-size: 12px; font-weight: 500;">Slow Down</span>
        </div>
        <div style="background: rgba(16, 185, 129, 0.2); padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px;">
          <i class="fas fa-smile" style="color: #10B981; font-size: 12px;"></i>
          <span style="color: #10B981; font-size: 12px; font-weight: 500;">Good Expression</span>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 24px 16px 40px; display: flex; justify-content: center; align-items: center; gap: 24px;">
      <button style="width: 50px; height: 50px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: white; cursor: pointer;">
        <i class="fas fa-video"></i>
      </button>
      <button style="width: 70px; height: 70px; background: #EF4444; border: none; border-radius: 50%; color: white; cursor: pointer; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);">
        <i class="fas fa-stop" style="font-size: 24px;"></i>
      </button>
      <button style="width: 50px; height: 50px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: white; cursor: pointer;">
        <i class="fas fa-microphone"></i>
      </button>
    </div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</body>
</html>
