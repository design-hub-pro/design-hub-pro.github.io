<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · PlantPal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <!-- Video hero -->
  <div class="relative h-[400px] flex-shrink-0">
    <img src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(13,11,22,.85) 100%)"></div>
    <div class="dynamic-island"></div>
    <div class="status-bar text-white">
      <span class="text-[17px] font-semibold">9:41</span>
      <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
    </div>
    <div class="relative flex justify-between px-7 mt-2">
      <div class="w-11 h-11 rounded-full bg-black/30 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left"></i></div>
      <div class="w-11 h-11 rounded-full bg-black/30 backdrop-blur flex items-center justify-center text-white"><i class="far fa-heart"></i></div>
    </div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="play !w-[68px] !h-[68px]"><i class="fas fa-play text-[20px] ml-1"></i></div></div>
    <div class="absolute bottom-6 left-7 right-7 text-white">
      <div class="flex items-center gap-2 mb-2"><span class="chip bg-[#14b88a] text-white !py-1"><i class="fas fa-leaf text-[10px]"></i>Nature</span><span class="dur !static">3:05 demo</span></div>
      <h1 class="text-[36px] font-extrabold tracking-tight leading-none">PlantPal</h1>
      <p class="text-[15px] text-white/75 mt-2 font-medium">Snap a leaf. Know if it's sick.</p>
    </div>
  </div>

  <div class="content !pb-[120px] pt-5">
    <!-- Team -->
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="avatars">
          <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?q=80&w=120&auto=format&fit=crop" class="!w-10 !h-10" alt="">
          <img src="https://images.unsplash.com/photo-1503919545889-aef636e10ad4?q=80&w=120&auto=format&fit=crop" class="!w-10 !h-10" alt="">
          <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=120&auto=format&fit=crop" class="!w-10 !h-10" alt="">
        </div>
        <div><p class="text-[14px] font-bold">Maya, Leo &amp; Priya</p><p class="text-[12px] text-[#77738a] font-semibold">Ages 11–12 · Team 4</p></div>
      </div>
      <span class="chip bg-[#efeaff] text-[#6d4aff]">2:40 PM slot</span>
    </div>

    <!-- Model stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="rounded-[20px] p-4 grad-brand text-white"><p class="text-[30px] font-extrabold num leading-none">91<span class="text-[15px]">%</span></p><p class="text-[11px] font-bold text-white/75 mt-2">Accuracy</p></div>
      <div class="rounded-[20px] p-4 bg-white border border-[#ecebf2]"><p class="text-[30px] font-extrabold num leading-none">6</p><p class="text-[11px] font-bold text-[#77738a] mt-2">Diseases</p></div>
      <div class="rounded-[20px] p-4 bg-white border border-[#ecebf2]"><p class="text-[30px] font-extrabold num leading-none">0.4<span class="text-[15px]">s</span></p><p class="text-[11px] font-bold text-[#77738a] mt-2">Per photo</p></div>
    </div>

    <!-- How it works -->
    <h2 class="text-[19px] font-extrabold tracking-tight mb-3">How it works</h2>
    <div class="flex items-center justify-between mb-6">
      <div class="text-center"><div class="w-[64px] h-[64px] rounded-[20px] grad-sky mx-auto flex items-center justify-center"><i class="fas fa-camera text-white text-[22px]"></i></div><p class="text-[11px] font-bold mt-2">Snap</p></div>
      <i class="fas fa-chevron-right text-[#cfcbe0]"></i>
      <div class="text-center"><div class="w-[64px] h-[64px] rounded-[20px] grad-brand mx-auto flex items-center justify-center"><i class="fas fa-brain text-white text-[22px]"></i></div><p class="text-[11px] font-bold mt-2">Model</p></div>
      <i class="fas fa-chevron-right text-[#cfcbe0]"></i>
      <div class="text-center"><div class="w-[64px] h-[64px] rounded-[20px] grad-coral mx-auto flex items-center justify-center"><i class="fas fa-stethoscope text-white text-[22px]"></i></div><p class="text-[11px] font-bold mt-2">Diagnose</p></div>
      <i class="fas fa-chevron-right text-[#cfcbe0]"></i>
      <div class="text-center"><div class="w-[64px] h-[64px] rounded-[20px] grad-mint mx-auto flex items-center justify-center"><i class="fas fa-droplet text-white text-[22px]"></i></div><p class="text-[11px] font-bold mt-2">Fix tip</p></div>
    </div>

    <!-- Built with -->
    <h2 class="text-[19px] font-extrabold tracking-tight mb-3">Built with</h2>
    <div class="flex flex-wrap gap-2">
      <span class="chip bg-white border border-[#ecebf2]"><i class="fab fa-python text-[#3776ab]"></i>Python</span>
      <span class="chip bg-white border border-[#ecebf2]"><i class="fas fa-cube text-[#ff6a3d]"></i>Teachable Machine</span>
      <span class="chip bg-white border border-[#ecebf2]"><i class="fas fa-mobile-screen text-[#6d4aff]"></i>Web app</span>
    </div>
  </div>

  <!-- Action bar -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pt-4 pb-9 bg-white/90 backdrop-blur-xl border-t border-black/5 flex gap-3 z-50">
    <button class="w-[60px] h-[56px] rounded-2xl bg-[#f7f6fb] flex items-center justify-center"><i class="fas fa-share-from-square text-[18px]"></i></button>
    <button class="flex-1 h-[56px] rounded-2xl grad-coral text-white font-bold text-[16px] flex items-center justify-center gap-2"><i class="fas fa-hands-clapping"></i>Send a cheer</button>
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] rounded bg-[#14121f]"></div>
  </div>
</div>
</body>
</html>
