<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen dark">
  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content !px-0">
    <!-- Stream -->
    <div class="relative mx-4 h-[300px] rounded-[28px] overflow-hidden mt-1">
      <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)"></div>
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between">
        <span class="chip bg-[#ff3b30] text-white !py-1.5"><span class="w-1.5 h-1.5 rounded-full bg-white"></span>LIVE</span>
        <span class="chip bg-black/40 backdrop-blur text-white !py-1.5"><i class="fas fa-eye text-[11px]"></i>214</span>
      </div>
      <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between">
        <div>
          <p class="text-[12px] text-white/70 font-bold">Now presenting · Team 4</p>
          <p class="text-[24px] font-extrabold leading-tight">PlantPal</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-expand"></i></div>
      </div>
      <!-- floating cheers -->
      <div class="absolute right-6 bottom-20 flex flex-col items-center gap-2 opacity-90">
        <div class="w-8 h-8 rounded-full grad-coral flex items-center justify-center text-[12px]"><i class="fas fa-heart"></i></div>
        <div class="w-7 h-7 rounded-full grad-sun flex items-center justify-center text-[11px] -mr-6 opacity-70"><i class="fas fa-hands-clapping"></i></div>
        <div class="w-6 h-6 rounded-full grad-brand flex items-center justify-center text-[10px] opacity-50"><i class="fas fa-star"></i></div>
      </div>
    </div>

    <!-- Pitch timer -->
    <div class="mx-7 mt-5">
      <div class="flex items-center justify-between text-[13px] font-bold mb-2"><span class="text-white/60">Pitch time</span><span class="num">2:18 <span class="text-white/40">/ 4:00</span></span></div>
      <div class="h-2 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full" style="width:58%;background:linear-gradient(90deg,#7c5cff,#ff6a3d)"></div></div>
    </div>

    <!-- Cheer buttons -->
    <div class="grid grid-cols-4 gap-3 mx-7 mt-6">
      <div class="text-center"><div class="h-[66px] rounded-[20px] grad-coral flex items-center justify-center"><i class="fas fa-heart text-[24px]"></i></div><p class="text-[12px] font-extrabold num mt-2">1.4k</p></div>
      <div class="text-center"><div class="h-[66px] rounded-[20px] grad-sun flex items-center justify-center"><i class="fas fa-hands-clapping text-[24px]"></i></div><p class="text-[12px] font-extrabold num mt-2">862</p></div>
      <div class="text-center"><div class="h-[66px] rounded-[20px] grad-brand flex items-center justify-center"><i class="fas fa-star text-[24px]"></i></div><p class="text-[12px] font-extrabold num mt-2">530</p></div>
      <div class="text-center"><div class="h-[66px] rounded-[20px] grad-mint flex items-center justify-center"><i class="fas fa-lightbulb text-[24px]"></i></div><p class="text-[12px] font-extrabold num mt-2">311</p></div>
    </div>

    <!-- Comment stream -->
    <div class="mx-7 mt-6 space-y-3">
      <div class="flex items-center gap-3"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=120&auto=format&fit=crop" class="w-8 h-8 rounded-full object-cover" alt=""><p class="text-[14px]"><span class="font-bold">Grandma Rose</span> <span class="text-white/70">Watching from Ohio!</span></p></div>
      <div class="flex items-center gap-3"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=120&auto=format&fit=crop" class="w-8 h-8 rounded-full object-cover" alt=""><p class="text-[14px]"><span class="font-bold">Leo's dad</span> <span class="text-white/70">That demo worked first try</span></p></div>
    </div>

    <!-- Up next -->
    <div class="mx-7 mt-6 rounded-[22px] bg-white/[.06] border border-white/10 p-3 flex items-center gap-3">
      <img src="https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=300&auto=format&fit=crop" class="w-14 h-14 rounded-xl object-cover" alt="">
      <div class="flex-1"><p class="text-[11px] text-white/50 font-bold uppercase tracking-wider">Up next · 2:50</p><p class="text-[15px] font-bold">SortBot</p></div>
      <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="far fa-bell"></i></div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="journey.html"><i class="fas fa-route"></i>Journey</a>
    <a href="live.html" class="live-tab active"><span class="pill"><i class="fas fa-tower-broadcast"></i></span>Live</a>
    <a href="projects.html"><i class="fas fa-shapes"></i>Projects</a>
    <a href="moments.html"><i class="fas fa-images"></i>Moments</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
