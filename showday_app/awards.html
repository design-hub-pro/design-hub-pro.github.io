<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Awards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <div class="w-11 h-11 rounded-full bg-white border border-[#ecebf2] flex items-center justify-center"><i class="fas fa-chevron-left text-[15px]"></i></div>
      <h1 class="text-[18px] font-extrabold">Awards</h1>
      <div class="w-11 h-11 rounded-full bg-white border border-[#ecebf2] flex items-center justify-center"><i class="fas fa-share-nodes text-[15px]"></i></div>
    </div>

    <!-- Winner hero -->
    <div class="relative rounded-[30px] overflow-hidden mb-6 text-white text-center px-5 pt-7 pb-6" style="background:radial-gradient(120% 80% at 50% 0%,#8a6bff 0%,#5a3cf0 45%,#2a1d78 100%)">
      <div class="absolute inset-0 opacity-60">
        <span class="absolute left-8 top-10 w-2 h-4 rounded-sm bg-[#ffcb52] rotate-12"></span>
        <span class="absolute right-10 top-6 w-2 h-3 rounded-sm bg-[#ff7eb8] -rotate-12"></span>
        <span class="absolute left-16 top-28 w-1.5 h-3 rounded-sm bg-[#34d4a4] rotate-45"></span>
        <span class="absolute right-16 top-24 w-2 h-2 rounded-full bg-[#ffcb52]"></span>
        <span class="absolute left-28 top-4 w-2 h-2 rounded-full bg-white"></span>
        <span class="absolute right-28 top-36 w-1.5 h-4 rounded-sm bg-[#ff8a5b] rotate-12"></span>
      </div>
      <div class="relative w-[120px] h-[120px] mx-auto rounded-full p-1 grad-sun">
        <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?q=80&w=300&auto=format&fit=crop" class="w-full h-full rounded-full object-cover border-4 border-[#5a3cf0]" alt="">
        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-10 h-10 rounded-full grad-sun flex items-center justify-center border-4 border-[#4b31c9]"><i class="fas fa-trophy text-white text-[14px]"></i></div>
      </div>
      <p class="relative text-[12px] font-bold uppercase tracking-[0.2em] text-[#ffcb52] mt-6">Best Real-World Impact</p>
      <p class="relative text-[32px] font-extrabold tracking-tight leading-tight mt-1">PlantPal</p>
      <p class="relative text-[14px] text-white/70 font-semibold">Maya, Leo &amp; Priya</p>
      <button class="relative mt-5 h-12 px-6 rounded-2xl bg-white text-[#14121f] font-bold text-[15px] inline-flex items-center gap-2"><i class="fas fa-award text-[#6d4aff]"></i>View certificate</button>
    </div>

    <!-- Parents' Choice podium -->
    <h2 class="text-[19px] font-extrabold tracking-tight mb-4">Parents' Choice</h2>
    <div class="flex items-end justify-center gap-3 mb-6">
      <div class="flex-1 text-center">
        <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=200&auto=format&fit=crop" class="w-14 h-14 rounded-2xl object-cover mx-auto mb-2" alt="">
        <p class="text-[13px] font-bold">SignBridge</p>
        <div class="h-[86px] rounded-t-[18px] bg-[#e4e1ee] mt-2 flex flex-col items-center justify-center"><span class="text-[26px] font-extrabold num leading-none">2</span><span class="text-[11px] text-[#77738a] font-bold num mt-1">88 votes</span></div>
      </div>
      <div class="flex-1 text-center">
        <img src="https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=200&auto=format&fit=crop" class="w-16 h-16 rounded-2xl object-cover mx-auto mb-2 ring-4 ring-[#ffcb52]" alt="">
        <p class="text-[13px] font-bold">SortBot</p>
        <div class="h-[118px] rounded-t-[18px] grad-sun mt-2 flex flex-col items-center justify-center text-white"><i class="fas fa-crown text-[14px] mb-1"></i><span class="text-[30px] font-extrabold num leading-none">1</span><span class="text-[11px] text-white/85 font-bold num mt-1">104 votes</span></div>
      </div>
      <div class="flex-1 text-center">
        <img src="https://images.unsplash.com/photo-1450778869180-41d0601e046e?q=80&w=200&auto=format&fit=crop" class="w-14 h-14 rounded-2xl object-cover mx-auto mb-2" alt="">
        <p class="text-[13px] font-bold">PawTalk</p>
        <div class="h-[64px] rounded-t-[18px] bg-[#f0e3da] mt-2 flex flex-col items-center justify-center"><span class="text-[24px] font-extrabold num leading-none">3</span><span class="text-[11px] text-[#77738a] font-bold num mt-1">71 votes</span></div>
      </div>
    </div>

    <!-- Feedback for Maya -->
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl grad-coral flex items-center justify-center"><i class="fas fa-hands-clapping text-white text-[18px]"></i></div>
      <div class="flex-1"><p class="text-[26px] font-extrabold num leading-none">2,184</p><p class="text-[12px] text-[#77738a] font-bold mt-1">Cheers for PlantPal</p></div>
      <div class="avatars">
        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=120&auto=format&fit=crop" alt="">
        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=120&auto=format&fit=crop" alt="">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=120&auto=format&fit=crop" alt="">
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="journey.html"><i class="fas fa-route"></i>Journey</a>
    <a href="live.html" class="live-tab"><span class="pill"><i class="fas fa-tower-broadcast"></i></span>Live</a>
    <a href="projects.html" class="active"><i class="fas fa-shapes"></i>Projects</a>
    <a href="moments.html"><i class="fas fa-images"></i>Moments</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
