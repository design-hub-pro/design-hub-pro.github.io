<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Projects</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-4">
      <h1 class="text-[30px] font-extrabold tracking-tight">Projects</h1>
      <div class="w-11 h-11 rounded-full bg-white border border-[#ecebf2] flex items-center justify-center"><i class="fas fa-magnifying-glass text-[15px]"></i></div>
    </div>

    <!-- Vote banner -->
    <div class="rounded-[24px] p-4 mb-5 flex items-center gap-4 text-white" style="background:linear-gradient(135deg,#14121f,#2c2550)">
      <div class="w-12 h-12 rounded-2xl grad-pink flex items-center justify-center flex-shrink-0"><i class="fas fa-check-to-slot text-[18px]"></i></div>
      <div class="flex-1"><p class="text-[15px] font-bold">Parents' Choice</p><p class="text-[12px] text-white/60 font-semibold">Pick up to 3 · not your own</p></div>
      <div class="flex gap-1.5"><span class="w-3 h-3 rounded-full bg-[#ff7eb8]"></span><span class="w-3 h-3 rounded-full bg-[#ff7eb8]"></span><span class="w-3 h-3 rounded-full bg-white/20"></span></div>
    </div>

    <!-- Filters -->
    <div class="hscroll mb-5">
      <span class="chip bg-[#14121f] text-white flex-shrink-0">All 12</span>
      <span class="chip bg-white border border-[#ecebf2] flex-shrink-0"><span class="dot bg-[#14b88a]"></span>Planet</span>
      <span class="chip bg-white border border-[#ecebf2] flex-shrink-0"><span class="dot bg-[#2f80ed]"></span>Helping</span>
      <span class="chip bg-white border border-[#ecebf2] flex-shrink-0"><span class="dot bg-[#ffb020]"></span>Creative</span>
      <span class="chip bg-white border border-[#ecebf2] flex-shrink-0"><span class="dot bg-[#e84393]"></span>Health</span>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-2 gap-3">
      <div class="relative h-[230px] rounded-[24px] overflow-hidden">
        <img src="https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=500&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 shade"></div>
        <div class="absolute top-3 right-3 w-9 h-9 rounded-full bg-[#ff4f9a] flex items-center justify-center text-white"><i class="fas fa-check text-[13px]"></i></div>
        <span class="dur top-3 left-3">3:40</span>
        <div class="absolute bottom-3 left-3 right-3 text-white"><p class="text-[17px] font-extrabold">SortBot</p><div class="flex items-center gap-1.5 text-[11px] font-semibold text-white/75"><span class="dot bg-[#14b88a]"></span>Sorts recycling</div></div>
      </div>
      <div class="relative h-[230px] rounded-[24px] overflow-hidden">
        <img src="https://images.unsplash.com/photo-1450778869180-41d0601e046e?q=80&w=500&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 shade"></div>
        <div class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/25 backdrop-blur border border-white/40"></div>
        <span class="dur top-3 left-3">2:55</span>
        <div class="absolute bottom-3 left-3 right-3 text-white"><p class="text-[17px] font-extrabold">PawTalk</p><div class="flex items-center gap-1.5 text-[11px] font-semibold text-white/75"><span class="dot bg-[#ffb020]"></span>Reads dog moods</div></div>
      </div>
      <div class="relative h-[230px] rounded-[24px] overflow-hidden">
        <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=500&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 shade"></div>
        <div class="absolute top-3 right-3 w-9 h-9 rounded-full bg-[#ff4f9a] flex items-center justify-center text-white"><i class="fas fa-check text-[13px]"></i></div>
        <span class="dur top-3 left-3">4:00</span>
        <div class="absolute bottom-3 left-3 right-3 text-white"><p class="text-[17px] font-extrabold">SignBridge</p><div class="flex items-center gap-1.5 text-[11px] font-semibold text-white/75"><span class="dot bg-[#2f80ed]"></span>Signs to text</div></div>
      </div>
      <div class="relative h-[230px] rounded-[24px] overflow-hidden">
        <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=500&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 shade"></div>
        <div class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/25 backdrop-blur border border-white/40"></div>
        <span class="dur top-3 left-3">3:15</span>
        <div class="absolute bottom-3 left-3 right-3 text-white"><p class="text-[17px] font-extrabold">StoryForge</p><div class="flex items-center gap-1.5 text-[11px] font-semibold text-white/75"><span class="dot bg-[#ffb020]"></span>Co-writes picture books</div></div>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="journey.html"><i class="fas fa-route"></i>Journey</a>
    <a href="live.html" class="live-tab"><span class="pill"><i class="fas fa-tower-broadcast"></i></span>Live</a>
    <a href="projects.html" class="active"><i class="fas fa-shapes"></i>Projects</a>
    <a href="moments.html"><i class="fas fa-images"></i>Moments</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
