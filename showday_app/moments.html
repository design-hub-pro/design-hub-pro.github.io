<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Moments</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <h1 class="text-[30px] font-extrabold tracking-tight">Moments</h1>
      <div class="w-11 h-11 rounded-full grad-brand flex items-center justify-center text-white"><i class="fas fa-plus text-[15px]"></i></div>
    </div>

    <!-- Highlight reel -->
    <div class="relative h-[260px] rounded-[28px] overflow-hidden mb-5">
      <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
      <div class="absolute inset-0 shade"></div>
      <span class="chip absolute top-4 left-4 bg-white/90 text-[#6d4aff] !py-1.5"><i class="fas fa-wand-magic-sparkles text-[11px]"></i>Made for Maya</span>
      <div class="absolute inset-0 flex items-center justify-center"><div class="play"><i class="fas fa-play text-[17px] ml-1"></i></div></div>
      <div class="absolute bottom-4 left-5 right-5 flex items-end justify-between text-white">
        <div><p class="text-[22px] font-extrabold leading-tight">Maya's Demo Day</p><p class="text-[13px] text-white/70 font-semibold">Highlight reel</p></div>
        <span class="dur !static">1:30</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="card py-3 text-center"><p class="text-[28px] font-extrabold num leading-none">148</p><p class="text-[11px] text-[#77738a] font-bold mt-1">Photos</p></div>
      <div class="card py-3 text-center"><p class="text-[28px] font-extrabold num leading-none">12</p><p class="text-[11px] text-[#77738a] font-bold mt-1">Clips</p></div>
      <div class="card py-3 text-center"><p class="text-[28px] font-extrabold num leading-none">9</p><p class="text-[11px] text-[#77738a] font-bold mt-1">Of Maya</p></div>
    </div>

    <!-- Masonry -->
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[19px] font-extrabold tracking-tight">Shared by families</h2>
      <span class="chip bg-[#efeaff] text-[#6d4aff] !py-1"><i class="fas fa-user-check text-[10px]"></i>Maya</span>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?q=80&w=400&auto=format&fit=crop" class="col-span-2 row-span-2 w-full h-[216px] rounded-[18px] object-cover" alt="">
      <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=300&auto=format&fit=crop" class="w-full h-[104px] rounded-[18px] object-cover" alt="">
      <div class="relative">
        <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=300&auto=format&fit=crop" class="w-full h-[104px] rounded-[18px] object-cover" alt="">
        <div class="absolute inset-0 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-white/90 flex items-center justify-center"><i class="fas fa-play text-[10px] ml-0.5"></i></div></div>
      </div>
      <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?q=80&w=300&auto=format&fit=crop" class="w-full h-[104px] rounded-[18px] object-cover" alt="">
      <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=300&auto=format&fit=crop" class="w-full h-[104px] rounded-[18px] object-cover" alt="">
      <div class="relative">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=300&auto=format&fit=crop" class="w-full h-[104px] rounded-[18px] object-cover" alt="">
        <div class="absolute inset-0 rounded-[18px] bg-black/50 flex items-center justify-center text-white text-[18px] font-extrabold">+139</div>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="journey.html"><i class="fas fa-route"></i>Journey</a>
    <a href="live.html" class="live-tab"><span class="pill"><i class="fas fa-tower-broadcast"></i></span>Live</a>
    <a href="projects.html"><i class="fas fa-shapes"></i>Projects</a>
    <a href="moments.html" class="active"><i class="fas fa-images"></i>Moments</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
