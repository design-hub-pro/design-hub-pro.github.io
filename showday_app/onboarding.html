<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen dark">
  <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(13,11,22,.35) 0%,rgba(13,11,22,.1) 30%,rgba(13,11,22,.92) 62%,#0d0b16 100%)"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="relative flex-1 flex flex-col px-7 pb-12">
    <div class="flex items-center gap-2 mt-3">
      <div class="w-9 h-9 rounded-xl grad-coral flex items-center justify-center"><i class="fas fa-microphone-lines text-white text-[15px]"></i></div>
      <span class="text-[20px] font-extrabold tracking-tight">Showday</span>
    </div>

    <!-- Floating project chips over the photo -->
    <div class="relative mt-16 h-[190px]">
      <div class="absolute left-0 top-2 flex items-center gap-2 bg-white/15 backdrop-blur-md rounded-2xl pl-2 pr-4 py-2 border border-white/20">
        <div class="w-8 h-8 rounded-lg grad-mint flex items-center justify-center"><i class="fas fa-seedling text-white text-[13px]"></i></div>
        <span class="text-[13px] font-bold">PlantPal</span>
      </div>
      <div class="absolute right-0 top-16 flex items-center gap-2 bg-white/15 backdrop-blur-md rounded-2xl pl-2 pr-4 py-2 border border-white/20">
        <div class="w-8 h-8 rounded-lg grad-sky flex items-center justify-center"><i class="fas fa-recycle text-white text-[13px]"></i></div>
        <span class="text-[13px] font-bold">SortBot</span>
      </div>
      <div class="absolute left-10 bottom-0 flex items-center gap-2 bg-white/15 backdrop-blur-md rounded-2xl pl-2 pr-4 py-2 border border-white/20">
        <div class="w-8 h-8 rounded-lg grad-pink flex items-center justify-center"><i class="fas fa-hands text-white text-[13px]"></i></div>
        <span class="text-[13px] font-bold">SignBridge</span>
      </div>
    </div>

    <div class="mt-auto">
      <span class="chip bg-white/15 text-white border border-white/20"><span class="live-dot"></span>Demo Day · Nov 14</span>
      <h1 class="text-[40px] leading-[1.05] font-extrabold tracking-tight mt-5">Your kid built an AI.<br><span style="background:linear-gradient(90deg,#ffb38f,#ff6a3d);-webkit-background-clip:text;color:transparent">Watch them pitch it.</span></h1>
      <p class="text-[16px] text-white/65 mt-4 leading-relaxed">Follow the build, get your seat, cheer live.</p>

      <div class="flex items-center gap-3 mt-7">
        <div class="avatars">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=120&auto=format&fit=crop" style="border-color:#0d0b16" alt="">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=120&auto=format&fit=crop" style="border-color:#0d0b16" alt="">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=120&auto=format&fit=crop" style="border-color:#0d0b16" alt="">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=120&auto=format&fit=crop" style="border-color:#0d0b16" alt="">
        </div>
        <span class="text-[13px] text-white/70 font-semibold">38 families in Cohort 7</span>
      </div>

      <!-- Class code -->
      <div class="flex gap-2 mt-7">
        <div class="flex-1 h-[60px] rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center gap-2">
          <span class="text-[22px] font-extrabold tracking-[0.3em]">YB7</span><span class="text-[22px] font-extrabold tracking-[0.3em] text-white/30">·</span><span class="text-[22px] font-extrabold tracking-[0.3em]">AI26</span>
        </div>
        <div class="w-[60px] h-[60px] rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center"><i class="fas fa-qrcode text-[22px]"></i></div>
      </div>
      <button class="w-full h-[60px] rounded-2xl grad-coral text-white text-[17px] font-bold mt-3 flex items-center justify-center gap-2 shadow-[0_14px_30px_rgba(255,90,61,.35)]">Join class <i class="fas fa-arrow-right text-[14px]"></i></button>
      <p class="text-center text-[13px] text-white/45 mt-4">Code is on the invite from your teacher</p>
    </div>
  </div>
  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-[5px] rounded bg-white"></div>
</div>
</body>
</html>
