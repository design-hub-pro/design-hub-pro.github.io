<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showday · Journey</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <h1 class="text-[30px] font-extrabold tracking-tight">Maya's journey</h1>
      <div class="w-11 h-11 rounded-full bg-white border border-[#ecebf2] flex items-center justify-center"><i class="fas fa-share-nodes text-[15px]"></i></div>
    </div>

    <!-- Progress ring hero -->
    <div class="card p-5 flex items-center gap-5 mb-6">
      <div class="relative w-[120px] h-[120px] flex-shrink-0">
        <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#efeaff" stroke-width="13"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="13" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="79"/>
          <defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-[32px] font-extrabold num leading-none">9<span class="text-[16px] text-[#77738a]">/12</span></span><span class="text-[11px] font-bold text-[#77738a] mt-1">weeks</span></div>
      </div>
      <div class="flex-1 space-y-3">
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl grad-brand flex items-center justify-center"><i class="fas fa-book-open text-white text-[13px]"></i></div><div><p class="text-[20px] font-extrabold num leading-none">26</p><p class="text-[11px] text-[#77738a] font-bold">Lessons</p></div></div>
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl grad-sun flex items-center justify-center"><i class="fas fa-fire text-white text-[13px]"></i></div><div><p class="text-[20px] font-extrabold num leading-none">14</p><p class="text-[11px] text-[#77738a] font-bold">Day streak</p></div></div>
      </div>
    </div>

    <!-- Skills -->
    <h2 class="text-[19px] font-extrabold tracking-tight mb-3">Skills earned</h2>
    <div class="grid grid-cols-4 gap-3 mb-6">
      <div class="text-center"><div class="w-[72px] h-[72px] mx-auto rounded-[22px] grad-brand flex items-center justify-center shadow-lg shadow-violet-500/25"><i class="fab fa-python text-white text-[26px]"></i></div><p class="text-[11px] font-bold mt-2">Python</p></div>
      <div class="text-center"><div class="w-[72px] h-[72px] mx-auto rounded-[22px] grad-mint flex items-center justify-center shadow-lg shadow-emerald-500/25"><i class="fas fa-database text-white text-[24px]"></i></div><p class="text-[11px] font-bold mt-2">Datasets</p></div>
      <div class="text-center"><div class="w-[72px] h-[72px] mx-auto rounded-[22px] grad-sky flex items-center justify-center shadow-lg shadow-sky-500/25"><i class="fas fa-brain text-white text-[24px]"></i></div><p class="text-[11px] font-bold mt-2">Training</p></div>
      <div class="text-center"><div class="w-[72px] h-[72px] mx-auto rounded-[22px] bg-[#ecebf2] flex items-center justify-center relative"><i class="fas fa-microphone-lines text-[#a7a3b8] text-[24px]"></i><i class="fas fa-lock absolute -bottom-1 -right-1 text-[11px] bg-white rounded-full w-6 h-6 flex items-center justify-center text-[#a7a3b8] border border-[#ecebf2]"></i></div><p class="text-[11px] font-bold mt-2 text-[#a7a3b8]">Pitching</p></div>
    </div>

    <!-- Timeline -->
    <h2 class="text-[19px] font-extrabold tracking-tight mb-3">Milestones</h2>
    <div class="relative pl-8">
      <div class="absolute left-[11px] top-2 bottom-6 w-[2px] bg-[#ecebf2]"></div>
      <div class="absolute left-[11px] top-2 h-[62%] w-[2px] bg-[#6d4aff]"></div>

      <div class="relative mb-4">
        <div class="absolute -left-8 top-3 w-6 h-6 rounded-full bg-[#6d4aff] flex items-center justify-center"><i class="fas fa-check text-white text-[10px]"></i></div>
        <div class="card p-3 flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?q=80&w=300&auto=format&fit=crop" class="w-14 h-14 rounded-xl object-cover" alt="">
          <div class="flex-1"><p class="text-[15px] font-bold">Picked the problem</p><p class="text-[12px] text-[#77738a] font-semibold">Week 2</p></div>
        </div>
      </div>
      <div class="relative mb-4">
        <div class="absolute -left-8 top-3 w-6 h-6 rounded-full bg-[#6d4aff] flex items-center justify-center"><i class="fas fa-check text-white text-[10px]"></i></div>
        <div class="card p-3 flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1530587191325-3db32d826c18?q=80&w=300&auto=format&fit=crop" class="w-14 h-14 rounded-xl object-cover" alt="">
          <div class="flex-1"><p class="text-[15px] font-bold">Collected 1,200 leaf photos</p><p class="text-[12px] text-[#77738a] font-semibold">Week 5</p></div>
        </div>
      </div>
      <div class="relative mb-4">
        <div class="absolute -left-8 top-3 w-6 h-6 rounded-full bg-white border-[3px] border-[#6d4aff]"></div>
        <div class="card p-3 flex items-center gap-3 !border-[#6d4aff]/40" style="box-shadow:0 10px 24px rgba(109,74,255,.12)">
          <div class="w-14 h-14 rounded-xl grad-brand flex items-center justify-center"><i class="fas fa-microphone-lines text-white text-[18px]"></i></div>
          <div class="flex-1"><p class="text-[15px] font-bold">Pitch rehearsal</p><div class="flex items-center gap-2 mt-1"><div class="bar flex-1 !h-[6px]"><div class="grad-coral" style="width:60%"></div></div><span class="text-[12px] font-bold">3/5</span></div></div>
        </div>
      </div>
      <div class="relative">
        <div class="absolute -left-8 top-3 w-6 h-6 rounded-full bg-white border-2 border-[#ecebf2]"></div>
        <div class="card p-3 flex items-center gap-3 opacity-60">
          <div class="w-14 h-14 rounded-xl bg-[#f7f6fb] flex items-center justify-center"><i class="fas fa-trophy text-[#a7a3b8] text-[18px]"></i></div>
          <div class="flex-1"><p class="text-[15px] font-bold">Demo Day</p><p class="text-[12px] text-[#77738a] font-semibold">Nov 14</p></div>
        </div>
      </div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="journey.html" class="active"><i class="fas fa-route"></i>Journey</a>
    <a href="live.html" class="live-tab"><span class="pill"><i class="fas fa-tower-broadcast"></i></span>Live</a>
    <a href="projects.html"><i class="fas fa-shapes"></i>Projects</a>
    <a href="moments.html"><i class="fas fa-images"></i>Moments</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
