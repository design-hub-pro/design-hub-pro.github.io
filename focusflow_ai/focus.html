<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusFlow AI - Focus Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow: hidden; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 to-slate-800">
    <!-- Status Bar -->
    <div class="px-6 py-2 flex justify-between items-center text-base font-medium text-white">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="px-6 pt-4 pb-6">
        <div class="flex items-center justify-between">
            <button class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-times text-white"></i>
            </button>
            <h1 class="text-xl font-bold text-white">Focus Session</h1>
            <button class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-ellipsis-h text-white"></i>
            </button>
        </div>
    </div>

    <!-- Current Task -->
    <div class="px-6 mb-8">
        <div class="bg-white/10 backdrop-blur rounded-2xl p-5 border border-white/10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center">
                    <i class="fas fa-atom text-white text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-semibold text-white">Physics Problem Set</p>
                    <p class="text-base text-gray-400">Momentum & Collisions • Chapter 7</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Timer Circle -->
    <div class="flex flex-col items-center justify-center mb-8">
        <div class="relative">
            <!-- Outer Ring -->
            <div class="w-64 h-64 rounded-full bg-gradient-to-br from-teal-500/20 to-cyan-500/20 flex items-center justify-center pulse-ring">
                <!-- Inner Ring -->
                <div class="w-56 h-56 rounded-full bg-gradient-to-br from-teal-500/30 to-cyan-500/30 flex items-center justify-center">
                    <!-- Timer Display -->
                    <div class="w-48 h-48 rounded-full bg-slate-800 flex flex-col items-center justify-center shadow-2xl border border-teal-500/30">
                        <p class="text-6xl font-bold text-white tracking-tight">18:42</p>
                        <p class="text-base text-gray-400 mt-2">remaining</p>
                    </div>
                </div>
            </div>

            <!-- Progress Arc (SVG) -->
            <svg class="absolute inset-0 w-64 h-64 -rotate-90" viewBox="0 0 256 256">
                <circle cx="128" cy="128" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                <circle cx="128" cy="128" r="120" fill="none" stroke="url(#gradient)" stroke-width="8"
                    stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="250"/>
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#14b8a6"/>
                        <stop offset="100%" stop-color="#06b6d4"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Pomodoro Indicators -->
        <div class="flex items-center gap-3 mt-8">
            <div class="w-3 h-3 bg-teal-500 rounded-full"></div>
            <div class="w-3 h-3 bg-teal-500 rounded-full"></div>
            <div class="w-3 h-3 bg-teal-500 rounded-full"></div>
            <div class="w-3 h-3 bg-gray-600 rounded-full"></div>
            <p class="text-base text-gray-400 ml-2">Pomodoro 3 of 4</p>
        </div>
    </div>

    <!-- Phone Holder Status -->
    <div class="px-6 mb-8">
        <div class="bg-gradient-to-r from-green-500/20 to-emerald-500/20 rounded-2xl p-5 border border-green-500/30">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-mobile-alt text-white text-2xl"></i>
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                        <p class="text-lg font-semibold text-white">Phone Docked</p>
                    </div>
                    <p class="text-base text-green-300">Smart holder connected • Focus mode active</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Control Buttons -->
    <div class="px-6">
        <div class="flex items-center justify-center gap-6">
            <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-redo text-white text-xl"></i>
            </button>
            <button class="w-20 h-20 bg-gradient-to-br from-red-500 to-rose-600 rounded-full flex items-center justify-center shadow-lg shadow-red-500/30">
                <i class="fas fa-pause text-white text-3xl"></i>
            </button>
            <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-forward text-white text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Session Stats -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-white/10 px-6 py-4 pb-8">
        <div class="flex justify-around items-center">
            <div class="text-center">
                <p class="text-2xl font-bold text-white">67</p>
                <p class="text-sm text-gray-400">Focus Score</p>
            </div>
            <div class="w-px h-10 bg-white/10"></div>
            <div class="text-center">
                <p class="text-2xl font-bold text-white">0</p>
                <p class="text-sm text-gray-400">Distractions</p>
            </div>
            <div class="w-px h-10 bg-white/10"></div>
            <div class="text-center">
                <p class="text-2xl font-bold text-white">1h 12m</p>
                <p class="text-sm text-gray-400">Total Today</p>
            </div>
        </div>
    </div>
</body>
</html>
