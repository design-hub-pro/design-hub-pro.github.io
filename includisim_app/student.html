<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncludiSim · Leo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content" style="padding-bottom:40px">
    <div class="between" style="margin:4px 0 18px"><div class="back"><i class="fas fa-chevron-left"></i></div><span class="sim"><i class="fas fa-robot"></i>AI student</span><div class="back"><i class="fas fa-sliders"></i></div></div>
    <div style="text-align:center">
      <div style="position:relative;display:inline-block"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337285141-image-1.png" class="av" style="width:112px;height:112px;box-shadow:0 12px 28px rgba(14,165,233,.3)" alt=""><span style="position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:50%;background:var(--aut);border:4px solid var(--surf)"></span></div>
      <div class="h1" style="margin-top:12px">Leo, 12</div>
      <div class="row" style="gap:8px;justify-content:center;margin-top:8px"><span class="chip" style="color:var(--aut)"><span class="dot" style="background:var(--aut)"></span>Autism</span><span class="chip">Seat C4</span><span class="chip">Pod 3</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px">
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">52</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">Belonging</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">3</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">Peer ties</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--bad)">2</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">Exclusions</div></div>
    </div>
    <div class="h2" style="margin:22px 0 12px">Traits the model uses</div>
    <div class="card" style="padding:18px 18px 6px">
      <div style="margin-bottom:14px"><div class="between" style="font-size:13px;font-weight:700"><span>Noise sensitivity</span><span class="num" style="color:var(--faint)">85</span></div><div class="bar" style="margin-top:7px"><span style="width:85%;background:var(--aut)"></span></div></div><div style="margin-bottom:14px"><div class="between" style="font-size:13px;font-weight:700"><span>Prefers routine</span><span class="num" style="color:var(--faint)">90</span></div><div class="bar" style="margin-top:7px"><span style="width:90%;background:var(--aut)"></span></div></div><div style="margin-bottom:14px"><div class="between" style="font-size:13px;font-weight:700"><span>Social initiation</span><span class="num" style="color:var(--faint)">28</span></div><div class="bar" style="margin-top:7px"><span style="width:28%;background:var(--acc)"></span></div></div><div style="margin-bottom:14px"><div class="between" style="font-size:13px;font-weight:700"><span>Math confidence</span><span class="num" style="color:var(--faint)">76</span></div><div class="bar" style="margin-top:7px"><span style="width:76%;background:var(--good)"></span></div></div>
    </div>
    <div class="h2" style="margin:22px 0 12px">Who Leo talks to</div>
    <div class="card" style="padding:16px">
      <svg width="100%" height="150" viewBox="0 0 360 150">
        <line x1="180" y1="75" x2="70" y2="40" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <line x1="180" y1="75" x2="290" y2="45" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="180" y1="75" x2="95" y2="120" stroke="#C9C5DA" stroke-width="2" stroke-dasharray="4 5"/>
        <line x1="180" y1="75" x2="285" y2="118" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
        <defs><clipPath id="c0"><circle cx="180" cy="75" r="30"/></clipPath><clipPath id="c1"><circle cx="70" cy="40" r="20"/></clipPath><clipPath id="c2"><circle cx="290" cy="45" r="20"/></clipPath><clipPath id="c3"><circle cx="95" cy="120" r="18"/></clipPath><clipPath id="c4"><circle cx="285" cy="118" r="18"/></clipPath></defs>
        <image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337285141-image-1.png" x="150" y="45" width="60" height="60" clip-path="url(#c0)" preserveAspectRatio="xMidYMid slice"/><image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287739-image-1.png" x="50" y="20" width="40" height="40" clip-path="url(#c1)" preserveAspectRatio="xMidYMid slice"/><image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287315-image-4.png" x="270" y="25" width="40" height="40" clip-path="url(#c2)" preserveAspectRatio="xMidYMid slice"/><image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337289539-image-3.png" x="77" y="102" width="36" height="36" clip-path="url(#c3)" preserveAspectRatio="xMidYMid slice"/><image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287023-image-3.png" x="267" y="100" width="36" height="36" clip-path="url(#c4)" preserveAspectRatio="xMidYMid slice"/>
      </svg>
      <div class="row" style="gap:16px;justify-content:center;font-size:11.5px;font-weight:700;color:var(--mut)"><span class="row" style="gap:5px"><span class="dot" style="background:var(--good)"></span>Friendly</span><span class="row" style="gap:5px"><span class="dot" style="background:#C9C5DA"></span>Weak</span><span class="row" style="gap:5px"><span class="dot" style="background:var(--bad)"></span>Conflict</span></div>
    </div>
  </div>
  
</div>
</body>
</html>
