<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncludiSim · Results</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="between" style="margin:4px 0 16px"><div><div class="meta">Compare</div><div class="h1" style="margin-top:4px">Rows vs. Pods</div></div><div class="back"><i class="fas fa-arrow-up-from-bracket"></i></div></div>
    <div class="card" style="padding:18px">
      <div class="between"><span class="sim"><i class="fas fa-flask"></i>Simulated · 50 runs each</span></div>
      <div class="row" style="gap:24px;margin-top:14px">
        <div><div class="num" style="font-size:34px;font-weight:900;letter-spacing:-1.2px;color:var(--faint)">64</div><div class="row" style="gap:6px;font-size:12px;font-weight:700;color:var(--mut)"><span style="width:14px;height:3px;background:#C9C5DA;border-radius:2px"></span>Rows</div></div>
        <div><div class="num" style="font-size:34px;font-weight:900;letter-spacing:-1.2px;color:var(--acc)">78</div><div class="row" style="gap:6px;font-size:12px;font-weight:700;color:var(--mut)"><span style="width:14px;height:3px;background:var(--acc);border-radius:2px"></span>Pods + buddies</div></div>
      </div>
      <svg width="100%" height="170" viewBox="0 0 360 170" style="margin-top:8px">
        <line x1="20" y1="150" x2="340" y2="150" stroke="#ECEAF4"/><line x1="20" y1="100" x2="340" y2="100" stroke="#F3F2F8"/><line x1="20" y1="50" x2="340" y2="50" stroke="#F3F2F8"/>
        <polygon points="20,150 20,120 55,100 90,85 125,75 160,65 195,55 230,50 265,40 300,40 335,35 335,150" fill="rgba(91,76,224,.08)"/>
        <polyline points="20,125 55,120 90,110 125,115 160,105 195,110 230,100 265,105 300,105 335,105" fill="none" stroke="#C9C5DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="20,120 55,100 90,85 125,75 160,65 195,55 230,50 265,40 300,40 335,35" fill="none" stroke="#5B4CE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="335" cy="35" r="5" fill="#5B4CE0" stroke="#fff" stroke-width="2"/>
        <text x="20" y="166" font-size="10" fill="#9C99B0" font-weight="700" font-family="Inter">Day 1</text><text x="340" y="166" text-anchor="end" font-size="10" fill="#9C99B0" font-weight="700" font-family="Inter">Day 10</text>
      </svg>
    </div>
    <div class="h2" style="margin:20px 0 12px">Belonging by need</div>
    <div class="card" style="padding:16px 18px 6px"><div style="margin-bottom:12px"><div class="between" style="font-size:12.5px;font-weight:700"><span class="row" style="gap:6px"><span class="dot" style="background:var(--adhd)"></span>ADHD</span><span class="num"><span style="color:var(--faint)">58</span> <i class="fas fa-arrow-right" style="font-size:10px;color:var(--faint)"></i> 71</span></div>
        <div style="position:relative;height:8px;border-radius:4px;background:#ECEAF4;margin-top:7px"><span style="position:absolute;left:0;top:0;height:100%;width:71%;border-radius:4px;background:var(--adhd)"></span><span style="position:absolute;left:0;top:0;height:100%;width:58%;border-radius:4px;background:rgba(22,20,43,.18)"></span></div></div><div style="margin-bottom:12px"><div class="between" style="font-size:12.5px;font-weight:700"><span class="row" style="gap:6px"><span class="dot" style="background:var(--aut)"></span>Autism</span><span class="num"><span style="color:var(--faint)">49</span> <i class="fas fa-arrow-right" style="font-size:10px;color:var(--faint)"></i> 68</span></div>
        <div style="position:relative;height:8px;border-radius:4px;background:#ECEAF4;margin-top:7px"><span style="position:absolute;left:0;top:0;height:100%;width:68%;border-radius:4px;background:var(--aut)"></span><span style="position:absolute;left:0;top:0;height:100%;width:49%;border-radius:4px;background:rgba(22,20,43,.18)"></span></div></div><div style="margin-bottom:12px"><div class="between" style="font-size:12.5px;font-weight:700"><span class="row" style="gap:6px"><span class="dot" style="background:var(--dys)"></span>Dyslexia</span><span class="num"><span style="color:var(--faint)">62</span> <i class="fas fa-arrow-right" style="font-size:10px;color:var(--faint)"></i> 76</span></div>
        <div style="position:relative;height:8px;border-radius:4px;background:#ECEAF4;margin-top:7px"><span style="position:absolute;left:0;top:0;height:100%;width:76%;border-radius:4px;background:var(--dys)"></span><span style="position:absolute;left:0;top:0;height:100%;width:62%;border-radius:4px;background:rgba(22,20,43,.18)"></span></div></div><div style="margin-bottom:12px"><div class="between" style="font-size:12.5px;font-weight:700"><span class="row" style="gap:6px"><span class="dot" style="background:var(--anx)"></span>Anxiety</span><span class="num"><span style="color:var(--faint)">45</span> <i class="fas fa-arrow-right" style="font-size:10px;color:var(--faint)"></i> 69</span></div>
        <div style="position:relative;height:8px;border-radius:4px;background:#ECEAF4;margin-top:7px"><span style="position:absolute;left:0;top:0;height:100%;width:69%;border-radius:4px;background:var(--anx)"></span><span style="position:absolute;left:0;top:0;height:100%;width:45%;border-radius:4px;background:rgba(22,20,43,.18)"></span></div></div></div>
    <div class="h2" style="margin:20px 0 12px">Try next</div>
    <div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center">
      <div class="ico" style="background:linear-gradient(135deg,#8B7BFF,#5B4CE0)"><i class="fas fa-wand-magic-sparkles"></i></div>
      <div style="flex:1"><div style="font-size:14px;font-weight:800">Seat Priya with her buddy</div><div style="font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px">Model estimate: anxiety group +5</div></div>
      <i class="fas fa-chevron-right" style="color:var(--faint)"></i>
    </div>
    <div style="font-size:11.5px;color:var(--faint);font-weight:600;margin-top:12px;text-align:center">Estimates from a model, not predictions for real students.</div>
  </div>
  <div class="tabbar"><div class="tab"><i class="fas fa-flask"></i>Lab</div><div class="tab"><i class="fas fa-users"></i>Class</div><div class="tab add"><i class="fas fa-play"></i>Run</div><div class="tab on"><i class="fas fa-chart-line"></i>Results</div><div class="tab"><i class="fas fa-user"></i>Me</div></div>
</div>
</body>
</html>
