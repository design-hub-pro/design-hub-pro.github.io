<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncludiSim · Buddies</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="between" style="margin:4px 0 16px"><div class="back"><i class="fas fa-chevron-left"></i></div><div class="h2">Peer buddies</div><div class="toggle on"></div></div>
    <div class="hero" style="height:180px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337272575-image-1.png" alt=""><div class="scrim"></div>
      <div class="play" style="left:50%;top:50%;transform:translate(-50%,-70%)"><i class="fas fa-play"></i></div><span class="dur">2:40</span>
      <div style="position:absolute;left:18px;bottom:16px;color:#fff"><div style="font-size:12px;font-weight:700;opacity:.8">How buddies work</div><div style="font-size:18px;font-weight:800;letter-spacing:-.3px">Picking a good buddy</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px">
      <div class="card" style="padding:14px"><div class="num" style="font-size:28px;font-weight:900;letter-spacing:-1px">7</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">pairs</div></div>
      <div class="card" style="padding:14px"><div class="num" style="font-size:28px;font-weight:900;letter-spacing:-1px;color:var(--good)">-3</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">isolated</div></div>
      <div class="card" style="padding:14px"><div class="num" style="font-size:28px;font-weight:900;letter-spacing:-1px">2<span style="font-size:15px">wk</span></div><div style="font-size:11.5px;color:var(--faint);font-weight:700">rotation</div></div>
    </div>
    <div class="between" style="margin-bottom:12px"><div class="h2">Suggested pairs</div><span style="font-size:13px;font-weight:700;color:var(--acc)"><i class="fas fa-wand-magic-sparkles"></i> Re-match</span></div>
    <div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
      <div class="row"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337286672-image-2.png" class="av" style="width:44px;height:44px;border:3px solid var(--anx)" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287739-image-1.png" class="av" style="width:44px;height:44px;margin-left:-12px;border:3px solid #fff" alt=""></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:800">Maya + Jordan</div><div class="row" style="gap:6px;font-size:12px;color:var(--faint);font-weight:700;margin-top:3px"><span class="dot" style="background:var(--anx)"></span>Anxiety support</div></div>
      <div style="text-align:right"><div class="num" style="font-size:20px;font-weight:900;color:var(--good)">92%</div><div style="font-size:10.5px;color:var(--faint);font-weight:700">match</div></div>
    </div><div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
      <div class="row"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337285141-image-1.png" class="av" style="width:44px;height:44px;border:3px solid var(--aut)" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287315-image-4.png" class="av" style="width:44px;height:44px;margin-left:-12px;border:3px solid #fff" alt=""></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:800">Leo + Ava</div><div class="row" style="gap:6px;font-size:12px;color:var(--faint);font-weight:700;margin-top:3px"><span class="dot" style="background:var(--aut)"></span>Autism support</div></div>
      <div style="text-align:right"><div class="num" style="font-size:20px;font-weight:900;color:var(--good)">84%</div><div style="font-size:10.5px;color:var(--faint);font-weight:700">match</div></div>
    </div><div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
      <div class="row"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337289539-image-3.png" class="av" style="width:44px;height:44px;border:3px solid var(--adhd)" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337289725-image-4.png" class="av" style="width:44px;height:44px;margin-left:-12px;border:3px solid #fff" alt=""></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:800">Eli + Noor</div><div class="row" style="gap:6px;font-size:12px;color:var(--faint);font-weight:700;margin-top:3px"><span class="dot" style="background:var(--adhd)"></span>ADHD support</div></div>
      <div style="text-align:right"><div class="num" style="font-size:20px;font-weight:900;color:var(--ink)">71%</div><div style="font-size:10.5px;color:var(--faint);font-weight:700">match</div></div>
    </div><div class="card" style="padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
      <div class="row"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337289116-image-2.png" class="av" style="width:44px;height:44px;border:3px solid var(--anx)" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791337287023-image-3.png" class="av" style="width:44px;height:44px;margin-left:-12px;border:3px solid #fff" alt=""></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:800">Priya + Kai</div><div class="row" style="gap:6px;font-size:12px;color:var(--faint);font-weight:700;margin-top:3px"><span class="dot" style="background:var(--anx)"></span>Anxiety support</div></div>
      <div style="text-align:right"><div class="num" style="font-size:20px;font-weight:900;color:var(--ink)">66%</div><div style="font-size:10.5px;color:var(--faint);font-weight:700">match</div></div>
    </div>
  </div>
  
</div>
</body>
</html>
