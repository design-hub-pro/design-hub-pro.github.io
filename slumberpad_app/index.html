<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlumberPad - Smart Pillow Sensor Companion App</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #ffffff;
    color: #1a1a2e;
    min-height: 100vh;
  }

  .hero {
    text-align: center;
    padding: 80px 40px 40px;
  }
  .app-icon {
    width: 80px; height: 80px; border-radius: 22px; margin: 0 auto 24px;
    background: linear-gradient(135deg, #7c3aed, #3b82f6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(124,58,237,0.3);
  }
  .app-icon i { font-size: 36px; color: #fff; }
  .app-title {
    font-size: 48px; font-weight: 900; margin-bottom: 12px;
    background: linear-gradient(135deg, #1a1a2e, #7c3aed);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .app-subtitle {
    font-size: 18px; color: #6b7280; max-width: 500px; margin: 0 auto;
    line-height: 1.6; font-weight: 400;
  }

  .screens-section {
    padding: 40px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .screens-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    justify-items: center;
  }

  .phone-container {
    display: flex; flex-direction: column; align-items: center;
  }
  .phone-frame {
    width: 460px; height: 980px; border-radius: 62px;
    background: #1a1a2e;
    padding: 12px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.1);
    position: relative;
  }
  .phone-screen {
    width: 100%; height: 100%; border-radius: 52px; overflow: hidden;
    background: #0f0a2a;
  }
  .phone-screen iframe {
    width: 100%; height: 100%; border: none;
  }
  .screen-label {
    margin-top: 20px; font-size: 16px; font-weight: 600; color: #4b5563;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="app-icon"><i class="fas fa-moon"></i></div>
    <h1 class="app-title">SlumberPad</h1>
    <p class="app-subtitle">Smart pillow sensor companion app for sleep tracking, quality analysis, and gentle vibration wake-up</p>
  </div>

  <div class="screens-section">
    <div class="screens-grid">
      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="home.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Dashboard</div>
      </div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="sleep_detail.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Sleep Analysis</div>
      </div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="alarm.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Smart Alarm</div>
      </div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="trends.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Sleep Trends</div>
      </div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="device.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Device Management</div>
      </div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="profile.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Profile & Settings</div>
      </div>
    </div>
  </div>
</body>
</html>
