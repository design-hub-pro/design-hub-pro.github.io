<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WingIt - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #FAFAFA; }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
    </style>
</head>
<body class="bg-white">
    <!-- Status Bar -->
    <div class="status-bar flex items-end pb-2 justify-between bg-white">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-gray-900">9:41</span>
        </div>
        <div class="w-32 h-[34px] bg-black rounded-full mt-3"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-gray-900"></i>
            <i class="fas fa-wifi text-xs text-gray-900"></i>
            <i class="fas fa-battery-full text-sm text-gray-900"></i>
        </div>
    </div>

    <!-- Profile Header -->
    <div class="content-area pt-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
            <div class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-gear text-gray-500 text-sm"></i>
            </div>
        </div>
    </div>

    <!-- Avatar & Info -->
    <div class="content-area mt-5">
        <div class="flex items-center gap-4">
            <div class="relative">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120&h=120&fit=crop&crop=face" class="w-20 h-20 rounded-3xl object-cover" alt="Profile">
                <div class="absolute -bottom-1 -right-1 w-7 h-7 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center border-2 border-white">
                    <span class="text-white text-[9px] font-bold">72</span>
                </div>
            </div>
            <div>
                <h2 class="text-lg font-bold text-gray-900">Alex Chen</h2>
                <p class="text-xs text-gray-400 mt-0.5">Joined 3 months ago</p>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-[10px] bg-indigo-100 text-indigo-600 px-2.5 py-0.5 rounded-full font-semibold">Social Explorer</span>
                    <span class="text-[10px] bg-amber-100 text-amber-600 px-2.5 py-0.5 rounded-full font-semibold">7-Day Streak</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="content-area mt-6">
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-3.5 text-center border border-blue-100">
                <p class="text-2xl font-extrabold text-indigo-600">23</p>
                <p class="text-[10px] text-gray-500 mt-0.5 font-medium">Events<br>Attended</p>
            </div>
            <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-3.5 text-center border border-green-100">
                <p class="text-2xl font-extrabold text-green-600">156</p>
                <p class="text-[10px] text-gray-500 mt-0.5 font-medium">Conversations<br>Started</p>
            </div>
            <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-3.5 text-center border border-purple-100">
                <p class="text-2xl font-extrabold text-purple-600">12</p>
                <p class="text-[10px] text-gray-500 mt-0.5 font-medium">Courses<br>Completed</p>
            </div>
        </div>
    </div>

    <!-- Weekly Activity -->
    <div class="content-area mt-6">
        <h3 class="text-base font-bold text-gray-900 mb-3">Weekly Activity</h3>
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
            <div class="flex items-end justify-between gap-2 h-28">
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-100 rounded-lg" style="height: 30%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Mon</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-200 rounded-lg" style="height: 55%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Tue</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-300 rounded-lg" style="height: 40%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Wed</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-400 rounded-lg" style="height: 80%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Thu</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-500 rounded-lg" style="height: 65%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Fri</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-lg" style="height: 95%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Sat</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-200 rounded-lg" style="height: 25%"></div>
                    <span class="text-[9px] text-gray-400 font-medium">Sun</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Achievements -->
    <div class="content-area mt-6 mb-28">
        <h3 class="text-base font-bold text-gray-900 mb-3">Achievements</h3>
        <div class="grid grid-cols-4 gap-3">
            <div class="text-center">
                <div class="w-14 h-14 mx-auto bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-fire text-white text-lg"></i>
                </div>
                <p class="text-[9px] text-gray-500 mt-1.5 font-medium">7-Day<br>Streak</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 mx-auto bg-gradient-to-br from-blue-400 to-cyan-500 rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-ice-cream text-white text-lg"></i>
                </div>
                <p class="text-[9px] text-gray-500 mt-1.5 font-medium">Ice<br>Breaker</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 mx-auto bg-gradient-to-br from-green-400 to-emerald-500 rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-people-group text-white text-lg"></i>
                </div>
                <p class="text-[9px] text-gray-500 mt-1.5 font-medium">Party<br>Starter</p>
            </div>
            <div class="text-center">
                <div class="w-14 h-14 mx-auto bg-gray-200 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-lock text-gray-400 text-lg"></i>
                </div>
                <p class="text-[9px] text-gray-400 mt-1.5 font-medium">???</p>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar bg-white/95 backdrop-blur-xl border-t border-gray-100">
        <div class="flex items-center justify-around py-2 pb-6">
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-house text-gray-400 text-lg"></i>
                <span class="text-[10px] font-medium text-gray-400">Home</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-compass text-gray-400 text-lg"></i>
                <span class="text-[10px] font-medium text-gray-400">Discover</span>
            </div>
            <div class="flex flex-col items-center gap-0.5 relative -top-3">
                <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-bolt text-white text-xl"></i>
                </div>
                <span class="text-[10px] font-medium text-gray-400">Live</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-book-open text-gray-400 text-lg"></i>
                <span class="text-[10px] font-medium text-gray-400">Learn</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-user text-indigo-500 text-lg"></i>
                <span class="text-[10px] font-semibold text-indigo-500">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
