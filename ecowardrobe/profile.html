<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #F2F2F7; }
        .menu-item { transition: background 0.2s ease; }
        .menu-item:active { background: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 pt-2 pb-6">
        <div class="flex items-center justify-between mb-5">
            <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
            <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-cog text-gray-600"></i>
            </button>
        </div>

        <!-- Profile Card -->
        <div class="flex items-center space-x-4">
            <div class="w-20 h-20 rounded-full overflow-hidden ring-4 ring-green-100">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200"
                     class="w-full h-full object-cover" alt="Profile">
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Sarah Chen</h2>
                <p class="text-gray-500">Sustainable fashion enthusiast</p>
                <div class="flex items-center mt-1">
                    <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-medium">
                        <i class="fas fa-leaf mr-1"></i>Eco Champion
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="px-4 py-4">
        <!-- Sustainability Score -->
        <div class="bg-gradient-to-r from-green-700 to-emerald-600 rounded-2xl p-5 mb-5">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <p class="text-green-100 text-xs font-medium">SUSTAINABILITY SCORE</p>
                    <p class="text-white text-4xl font-bold">87</p>
                </div>
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-award text-3xl text-white"></i>
                </div>
            </div>
            <div class="bg-white/20 rounded-full h-2 mb-2">
                <div class="bg-white rounded-full h-2 w-[87%]"></div>
            </div>
            <p class="text-green-100 text-xs">13 points to next level: Eco Master</p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-3 gap-3 mb-5">
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-tshirt text-blue-600"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">127</p>
                <p class="text-xs text-gray-500">Total Items</p>
            </div>
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-recycle text-green-600"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">89%</p>
                <p class="text-xs text-gray-500">Utilization</p>
            </div>
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <div class="w-10 h-10 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-heart text-rose-600"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">23</p>
                <p class="text-xs text-gray-500">Donated</p>
            </div>
        </div>

        <!-- Environmental Impact -->
        <div class="bg-white rounded-2xl p-4 mb-5 shadow-sm">
            <h3 class="font-semibold text-gray-900 mb-3">Your Environmental Impact</h3>
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-water text-blue-600 text-sm"></i>
                        </div>
                        <span class="text-gray-700">Water Saved</span>
                    </div>
                    <span class="font-semibold text-gray-900">2,450 L</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-cloud text-green-600 text-sm"></i>
                        </div>
                        <span class="text-gray-700">CO2 Reduced</span>
                    </div>
                    <span class="font-semibold text-gray-900">156 kg</span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-bolt text-amber-600 text-sm"></i>
                        </div>
                        <span class="text-gray-700">Energy Saved</span>
                    </div>
                    <span class="font-semibold text-gray-900">89 kWh</span>
                </div>
            </div>
        </div>

        <!-- Menu Items -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
            <button class="w-full px-4 py-4 flex items-center justify-between menu-item border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-history text-gray-400 w-5"></i>
                    <span class="text-gray-900">Outfit History</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </button>
            <button class="w-full px-4 py-4 flex items-center justify-between menu-item border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-bell text-gray-400 w-5"></i>
                    <span class="text-gray-900">Notifications</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </button>
            <button class="w-full px-4 py-4 flex items-center justify-between menu-item">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-question-circle text-gray-400 w-5"></i>
                    <span class="text-gray-900">Help & Support</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 pb-6">
        <div class="flex justify-between items-center">
            <button class="flex flex-col items-center">
                <i class="fas fa-th-large text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Wardrobe</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-wand-magic-sparkles text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Outfits</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-leaf text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Discover</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Donate</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-user text-green-700 text-xl"></i>
                <span class="text-xs text-green-700 font-medium mt-1">Profile</span>
            </button>
        </div>
    </div>

    <!-- Spacer for bottom nav -->
    <div class="h-24"></div>
</body>
</html>
