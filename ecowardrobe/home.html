<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wardrobe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #F2F2F7; }
        .category-pill { transition: all 0.2s ease; }
        .category-pill.active { background: #2D5A27; color: white; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 pt-2 pb-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <p class="text-gray-500 text-sm">Good morning,</p>
                <h1 class="text-2xl font-bold text-gray-900">My Wardrobe</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center">
                    <i class="fas fa-search text-green-700"></i>
                </button>
                <button class="w-10 h-10 bg-green-700 rounded-full flex items-center justify-center">
                    <i class="fas fa-plus text-white"></i>
                </button>
            </div>
        </div>

        <!-- Stats Banner -->
        <div class="bg-gradient-to-r from-green-700 to-green-600 rounded-2xl p-4 mb-4">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-green-100 text-xs">Total Items</p>
                    <p class="text-white text-2xl font-bold">127</p>
                </div>
                <div class="h-10 w-px bg-green-500"></div>
                <div>
                    <p class="text-green-100 text-xs">Categories</p>
                    <p class="text-white text-2xl font-bold">8</p>
                </div>
                <div class="h-10 w-px bg-green-500"></div>
                <div>
                    <p class="text-green-100 text-xs">Unworn 30d</p>
                    <p class="text-white text-2xl font-bold">23</p>
                </div>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
            <button class="category-pill active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">All Items</button>
            <button class="category-pill bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Tops</button>
            <button class="category-pill bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Bottoms</button>
            <button class="category-pill bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Dresses</button>
            <button class="category-pill bg-gray-100 text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Outerwear</button>
        </div>
    </div>

    <!-- Clothing Grid -->
    <div class="px-4 py-4">
        <div class="grid grid-cols-2 gap-3">
            <!-- Item 1 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="aspect-square relative">
                    <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"
                         class="w-full h-full object-cover" alt="White blouse">
                    <div class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">Worn 12x</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Linen Blouse</p>
                    <p class="text-xs text-gray-500">Tops • White</p>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="aspect-square relative">
                    <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400"
                         class="w-full h-full object-cover" alt="Jeans">
                    <div class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">Worn 28x</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">High-Rise Jeans</p>
                    <p class="text-xs text-gray-500">Bottoms • Blue</p>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="aspect-square relative">
                    <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400"
                         class="w-full h-full object-cover" alt="Jacket">
                    <div class="absolute top-2 right-2 bg-orange-100 rounded-full px-2 py-1">
                        <span class="text-xs text-orange-600 font-medium">Unworn 45d</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Denim Jacket</p>
                    <p class="text-xs text-gray-500">Outerwear • Blue</p>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="aspect-square relative">
                    <img src="https://images.unsplash.com/photo-1583496661160-fb5886a0uj9a?w=400"
                         class="w-full h-full object-cover" alt="Dress"
                         onerror="this.src='https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400'">
                    <div class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">Worn 8x</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Midi Dress</p>
                    <p class="text-xs text-gray-500">Dresses • Black</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 pb-6">
        <div class="flex justify-between items-center">
            <button class="flex flex-col items-center">
                <i class="fas fa-th-large text-green-700 text-xl"></i>
                <span class="text-xs text-green-700 font-medium mt-1">Wardrobe</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-wand-magic-sparkles text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Outfits</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-leaf text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Discover</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Donate</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Profile</span>
            </button>
        </div>
    </div>

    <!-- Spacer for bottom nav -->
    <div class="h-24"></div>
</body>
</html>
