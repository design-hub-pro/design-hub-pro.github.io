<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Outfits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #F2F2F7; }
        .outfit-card { transition: transform 0.2s ease; }
        .outfit-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center">
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center space-x-1">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 pt-2 pb-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <p class="text-gray-500 text-sm">Tuesday, Jan 14</p>
                <h1 class="text-2xl font-bold text-gray-900">Today's Outfits</h1>
            </div>
            <button class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center">
                <i class="fas fa-sliders text-green-700"></i>
            </button>
        </div>

        <!-- Weather/Context Card -->
        <div class="bg-gradient-to-r from-blue-50 to-green-50 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-cloud-sun text-2xl text-yellow-500"></i>
                </div>
                <div>
                    <p class="font-semibold text-gray-900">68°F Partly Cloudy</p>
                    <p class="text-sm text-gray-500">Perfect for light layers</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500">Your Event</p>
                <p class="text-sm font-medium text-green-700">Office Day</p>
            </div>
        </div>
    </div>

    <!-- AI Recommendation Section -->
    <div class="px-4 py-4">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2">
                <div class="w-6 h-6 bg-gradient-to-r from-green-600 to-green-700 rounded-lg flex items-center justify-center">
                    <i class="fas fa-wand-magic-sparkles text-white text-xs"></i>
                </div>
                <h2 class="font-semibold text-gray-900">AI Picks for You</h2>
            </div>
            <button class="text-green-700 text-sm font-medium">Refresh <i class="fas fa-sync-alt ml-1"></i></button>
        </div>

        <!-- Featured Outfit -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm mb-4 outfit-card">
            <div class="relative">
                <div class="flex">
                    <div class="w-1/2 aspect-[3/4]">
                        <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400"
                             class="w-full h-full object-cover" alt="Top">
                    </div>
                    <div class="w-1/2 flex flex-col">
                        <div class="h-1/2">
                            <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400"
                                 class="w-full h-full object-cover" alt="Bottom">
                        </div>
                        <div class="h-1/2">
                            <img src="https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400"
                                 class="w-full h-full object-cover" alt="Shoes">
                        </div>
                    </div>
                </div>
                <div class="absolute top-3 left-3 bg-green-700 text-white px-3 py-1 rounded-full text-xs font-medium">
                    <i class="fas fa-star mr-1"></i> Best Match
                </div>
            </div>
            <div class="p-4">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h3 class="font-semibold text-gray-900">Casual Chic Office</h3>
                        <p class="text-sm text-gray-500">3 items from your wardrobe</p>
                    </div>
                    <div class="flex items-center space-x-1 bg-green-50 px-2 py-1 rounded-full">
                        <i class="fas fa-leaf text-green-600 text-xs"></i>
                        <span class="text-xs text-green-700 font-medium">98% Match</span>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button class="flex-1 bg-green-700 text-white py-3 rounded-xl font-medium">
                        <i class="fas fa-check mr-2"></i>Wear Today
                    </button>
                    <button class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bookmark text-gray-600"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- More Suggestions -->
        <h3 class="font-semibold text-gray-900 mb-3">More Suggestions</h3>
        <div class="flex space-x-3 overflow-x-auto pb-2">
            <!-- Outfit 2 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex-shrink-0 w-40 outfit-card">
                <div class="aspect-square relative">
                    <div class="grid grid-cols-2 h-full">
                        <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=200"
                             class="w-full h-full object-cover" alt="Sweater">
                        <img src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=200"
                             class="w-full h-full object-cover" alt="Pants">
                    </div>
                    <div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">92%</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Cozy Friday</p>
                    <p class="text-xs text-gray-500">2 items</p>
                </div>
            </div>

            <!-- Outfit 3 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex-shrink-0 w-40 outfit-card">
                <div class="aspect-square relative">
                    <div class="grid grid-cols-2 h-full">
                        <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=200"
                             class="w-full h-full object-cover" alt="Jacket">
                        <img src="https://images.unsplash.com/photo-1584370848010-d7fe6bc767ec?w=200"
                             class="w-full h-full object-cover" alt="Shirt">
                    </div>
                    <div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">87%</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Weekend Vibes</p>
                    <p class="text-xs text-gray-500">3 items</p>
                </div>
            </div>

            <!-- Outfit 4 -->
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex-shrink-0 w-40 outfit-card">
                <div class="aspect-square relative">
                    <div class="grid grid-cols-2 h-full">
                        <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200"
                             class="w-full h-full object-cover" alt="Dress">
                        <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=200"
                             class="w-full h-full object-cover" alt="Heels">
                    </div>
                    <div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm rounded-full px-2 py-1">
                        <span class="text-xs text-green-700 font-medium">85%</span>
                    </div>
                </div>
                <div class="p-3">
                    <p class="font-medium text-gray-900 text-sm">Date Night</p>
                    <p class="text-xs text-gray-500">2 items</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 pb-6">
        <div class="flex justify-between items-center">
            <button class="flex flex-col items-center">
                <i class="fas fa-th-large text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Wardrobe</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-wand-magic-sparkles text-green-700 text-xl"></i>
                <span class="text-xs text-green-700 font-medium mt-1">Outfits</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-leaf text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Discover</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-hand-holding-heart text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Donate</span>
            </button>
            <button class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Profile</span>
            </button>
        </div>
    </div>

    <!-- Spacer for bottom nav -->
    <div class="h-24"></div>
</body>
</html>
