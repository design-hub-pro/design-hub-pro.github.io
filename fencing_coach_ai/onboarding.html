<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FenceAI - Welcome</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #000; color: #fff;
  }

  .status-bar {
    height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px; position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-time { font-size: 17px; font-weight: 600; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 14px; }
  .dynamic-island {
    width: 126px; height: 37px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  }

  /* Background Image */
  .bg-image {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .bg-image img { width: 100%; height: 100%; object-fit: cover; }
  .bg-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.7) 60%, rgba(0,0,0,0.95) 80%);
  }

  /* Content */
  .welcome-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0 28px 60px; z-index: 10;
  }

  .app-logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .logo-icon {
    width: 48px; height: 48px; background: linear-gradient(135deg, #1a5cff, #7c3aed);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .logo-text { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
  .logo-ai { color: #1a5cff; }

  .welcome-title {
    font-size: 36px; font-weight: 900; line-height: 1.1; letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .welcome-title span { color: #1a5cff; }

  .welcome-sub {
    font-size: 15px; color: #999; line-height: 1.5; margin-bottom: 28px;
  }

  /* Feature Pills */
  .feature-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 500;
    backdrop-filter: blur(10px);
  }
  .pill i { color: #1a5cff; font-size: 12px; }

  /* CTA */
  .cta-btn {
    width: 100%; padding: 18px; border: none; border-radius: 18px;
    font-size: 17px; font-weight: 700; font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1a5cff, #7c3aed);
    color: #fff; cursor: pointer; margin-bottom: 14px;
    box-shadow: 0 8px 32px rgba(26,92,255,0.3);
  }
  .login-link {
    text-align: center; font-size: 14px; color: #666;
  }
  .login-link a { color: #1a5cff; text-decoration: none; font-weight: 600; }

  /* Dots */
  .page-dots {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 24px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
  .dot.active { width: 24px; border-radius: 4px; background: #1a5cff; }
</style>
</head>
<body>

<div class="bg-image">
  <img src="https://images.unsplash.com/photo-1636812028800-a0bfb6b4f0d9?w=900&h=1600&fit=crop" alt="fencer">
  <div class="bg-overlay"></div>
</div>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="welcome-content">
  <div class="app-logo">
    <div class="logo-icon"><i class="fas fa-crosshairs"></i></div>
    <div class="logo-text">Fence<span class="logo-ai">AI</span></div>
  </div>

  <div class="welcome-title">Your AI<br><span>Fencing Coach</span></div>

  <div class="welcome-sub">Computer vision-powered technique analysis. Get real-time feedback on every lunge, parry, and riposte.</div>

  <div class="feature-pills">
    <div class="pill"><i class="fas fa-video"></i> Real-time Analysis</div>
    <div class="pill"><i class="fas fa-brain"></i> AI Coaching</div>
    <div class="pill"><i class="fas fa-chart-line"></i> Progress Tracking</div>
    <div class="pill"><i class="fas fa-globe"></i> Free for All</div>
  </div>

  <div class="page-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
  </div>

  <button class="cta-btn">Get Started Free</button>
  <div class="login-link">Already have an account? <a href="#">Sign in</a></div>
</div>

</body>
</html>
