<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopIQ - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow-y: auto; background: #0B0B1A; color: #fff; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; position: sticky; top: 0; background: #0B0B1A; z-index: 50;">
        <span style="font-size: 16px; font-weight: 600; color: white;">9:41</span>
        <div style="width: 126px; height: 37px; background: #000; border-radius: 20px;"></div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <i class="fas fa-signal" style="font-size: 14px; color: white;"></i>
            <i class="fas fa-wifi" style="font-size: 14px; color: white;"></i>
            <i class="fas fa-battery-full" style="font-size: 14px; color: white;"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px; padding-bottom: 100px;">
        <!-- Profile Header -->
        <div style="text-align: center; margin-bottom: 24px; margin-top: 12px;">
            <div style="position: relative; display: inline-block; margin-bottom: 14px;">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face" style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid #FF6B35;">
                <div style="position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: linear-gradient(135deg, #FF6B35, #FF9F1C); border-radius: 50%; border: 3px solid #0B0B1A; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-pen" style="font-size: 9px; color: white;"></i>
                </div>
            </div>
            <div style="font-size: 22px; font-weight: 800;">Marcus Johnson</div>
            <div style="font-size: 13px; color: #8888A0; margin-top: 2px;">Shooting Guard · Intermediate</div>
            <!-- Level Badge -->
            <div style="display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(255,107,53,0.15), rgba(255,159,28,0.08)); border-radius: 20px; padding: 6px 14px; margin-top: 10px; border: 1px solid rgba(255,107,53,0.3);">
                <i class="fas fa-star" style="font-size: 12px; color: #FF9F1C;"></i>
                <span style="font-size: 12px; font-weight: 700; color: #FF9F1C;">Level 12 — Rising Star</span>
            </div>
        </div>

        <!-- Stats Row -->
        <div style="display: flex; gap: 8px; margin-bottom: 24px;">
            <div style="flex: 1; background: #151528; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <div style="font-size: 22px; font-weight: 800; color: #FF6B35;">6'2"</div>
                <div style="font-size: 10px; color: #8888A0; margin-top: 2px;">Height</div>
            </div>
            <div style="flex: 1; background: #151528; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <div style="font-size: 22px; font-weight: 800; color: #4ADE80;">185</div>
                <div style="font-size: 10px; color: #8888A0; margin-top: 2px;">lbs</div>
            </div>
            <div style="flex: 1; background: #151528; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <div style="font-size: 22px; font-weight: 800; color: #818CF8;">24</div>
                <div style="font-size: 10px; color: #8888A0; margin-top: 2px;">Age</div>
            </div>
        </div>

        <!-- Subscription Card -->
        <div style="background: linear-gradient(135deg, #FF6B35, #E85D04); border-radius: 18px; padding: 18px; margin-bottom: 24px; position: relative; overflow: hidden;">
            <div style="position: absolute; top: -15px; right: -15px; width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-radius: 50%;"></div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
                        <i class="fas fa-crown" style="font-size: 14px; color: #FFD700;"></i>
                        <span style="font-size: 14px; font-weight: 700;">HoopIQ Pro</span>
                    </div>
                    <div style="font-size: 11px; color: rgba(255,255,255,0.8);">Unlimited AI plans & analytics</div>
                </div>
                <div style="background: rgba(255,255,255,0.2); border-radius: 10px; padding: 8px 14px;">
                    <span style="font-size: 12px; font-weight: 700;">Active</span>
                </div>
            </div>
        </div>

        <!-- Menu Items -->
        <div style="background: #151528; border-radius: 18px; overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="width: 38px; height: 38px; background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,107,53,0.05)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-sliders" style="font-size: 14px; color: #FF6B35;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600;">Training Preferences</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="width: 38px; height: 38px; background: linear-gradient(135deg, rgba(74,222,128,0.2), rgba(74,222,128,0.05)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-apple-whole" style="font-size: 14px; color: #4ADE80;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600;">Diet & Allergies</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="width: 38px; height: 38px; background: linear-gradient(135deg, rgba(129,140,248,0.2), rgba(129,140,248,0.05)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-bell" style="font-size: 14px; color: #818CF8;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600;">Notifications</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px;">
                <div style="width: 38px; height: 38px; background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(56,189,248,0.05)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-gear" style="font-size: 14px; color: #38BDF8;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600;">App Settings</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
        </div>

        <!-- Secondary Menu -->
        <div style="background: #151528; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06);">
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="width: 38px; height: 38px; background: rgba(255,255,255,0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question-circle" style="font-size: 14px; color: #8888A0;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600; color: #8888A0;">Help & Support</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
            <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px;">
                <div style="width: 38px; height: 38px; background: rgba(255,255,255,0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-share-nodes" style="font-size: 14px; color: #8888A0;"></i>
                </div>
                <div style="flex: 1; font-size: 14px; font-weight: 600; color: #8888A0;">Share HoopIQ</div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 85px; background: #0B0B1A; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 50;">
        <div style="text-align: center;">
            <i class="fas fa-home" style="color: #555570; font-size: 22px;"></i>
            <div style="font-size: 10px; color: #555570; margin-top: 4px;">Home</div>
        </div>
        <div style="text-align: center;">
            <i class="fas fa-basketball" style="color: #555570; font-size: 22px;"></i>
            <div style="font-size: 10px; color: #555570; margin-top: 4px;">Training</div>
        </div>
        <div style="text-align: center;">
            <i class="fas fa-utensils" style="color: #555570; font-size: 22px;"></i>
            <div style="font-size: 10px; color: #555570; margin-top: 4px;">Nutrition</div>
        </div>
        <div style="text-align: center;">
            <i class="fas fa-chart-line" style="color: #555570; font-size: 22px;"></i>
            <div style="font-size: 10px; color: #555570; margin-top: 4px;">Progress</div>
        </div>
        <div style="text-align: center;">
            <i class="fas fa-user" style="color: #FF6B35; font-size: 22px;"></i>
            <div style="font-size: 10px; color: #FF6B35; margin-top: 4px; font-weight: 600;">Profile</div>
        </div>
    </div>
</body>
</html>
