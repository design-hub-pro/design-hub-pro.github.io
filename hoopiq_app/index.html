<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopIQ - AI Basketball Training & Nutrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #ffffff; }
    </style>
</head>
<body>
    <!-- Header -->
    <div style="text-align: center; padding: 60px 20px 20px;">
        <div style="display: inline-flex; align-items: center; gap: 14px; margin-bottom: 16px;">
            <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #FF6B35, #FF9F1C); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,107,53,0.3);">
                <i class="fas fa-basketball" style="font-size: 26px; color: white;"></i>
            </div>
            <div style="text-align: left;">
                <h1 style="font-size: 36px; font-weight: 900; color: #111; margin: 0; line-height: 1;">HoopIQ</h1>
                <p style="font-size: 14px; color: #888; margin: 0; font-weight: 500;">AI-Powered Basketball Training & Nutrition</p>
            </div>
        </div>
    </div>

    <!-- Screenshots Grid -->
    <div style="max-width: 1540px; margin: 0 auto; padding: 20px 40px 60px;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; justify-items: center;">

            <!-- Screen 1: Onboarding -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="onboarding.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Player Profile Setup</p>
            </div>

            <!-- Screen 2: Home -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="home.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Home Dashboard</p>
            </div>

            <!-- Screen 3: Training -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="training.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Training Plan</p>
            </div>

            <!-- Screen 4: Workout -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="workout.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Active Workout</p>
            </div>

            <!-- Screen 5: Nutrition -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="nutrition.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Nutrition Plan</p>
            </div>

            <!-- Screen 6: Progress -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="progress.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">Progress Tracking</p>
            </div>

            <!-- Screen 7: Profile -->
            <div style="text-align: center;">
                <div style="width: 460px; height: 980px; border-radius: 62px; background: #1a1a1a; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                    <div style="width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0B0B1A;">
                        <iframe src="profile.html" scrolling="no" style="width: 100%; height: 100%; border: none; overflow: hidden;"></iframe>
                    </div>
                </div>
                <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #333;">User Profile</p>
            </div>

        </div>
    </div>
</body>
</html>
