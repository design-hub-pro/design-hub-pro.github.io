<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopIQ - Active Workout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow-y: auto; background: #0B0B1A; color: #fff; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 10px; position: sticky; top: 0; background: #0B0B1A; z-index: 50;">
        <span style="font-size: 16px; font-weight: 600; color: white;">9:41</span>
        <div style="width: 126px; height: 37px; background: #000; border-radius: 20px;"></div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <i class="fas fa-signal" style="font-size: 14px; color: white;"></i>
            <i class="fas fa-wifi" style="font-size: 14px; color: white;"></i>
            <i class="fas fa-battery-full" style="font-size: 14px; color: white;"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 0; padding-bottom: 40px;">
        <!-- Video Area -->
        <div style="position: relative; width: 100%; height: 280px; overflow: hidden;">
            <img src="https://images.unsplash.com/photo-1627627256672-027a4613d028?w=800&h=500&fit=crop" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; inset: 0; background: linear-gradient(to top, #0B0B1A 5%, transparent 50%);"></div>
            <!-- Back button -->
            <div style="position: absolute; top: 12px; left: 28px;">
                <div style="width: 36px; height: 36px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-chevron-left" style="font-size: 14px; color: white;"></i>
                </div>
            </div>
            <!-- Drill counter -->
            <div style="position: absolute; top: 12px; right: 28px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 10px; padding: 6px 12px;">
                <span style="font-size: 12px; font-weight: 600;">Drill 4/10</span>
            </div>
            <!-- Play button overlay -->
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <div style="width: 64px; height: 64px; background: rgba(255,107,53,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-pause" style="font-size: 22px; color: white;"></i>
                </div>
            </div>
        </div>

        <div style="padding: 0 28px;">
            <!-- Drill Info -->
            <div style="margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <span style="font-size: 10px; color: #FF6B35; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">3-Point Shooting</span>
                </div>
                <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">Catch & Shoot — Corner 3</h2>
                <p style="font-size: 13px; color: #8888A0;">Quick release from the corner. Focus on footwork and follow-through.</p>
            </div>

            <!-- Timer -->
            <div style="background: #151528; border-radius: 20px; padding: 24px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.06);">
                <div style="font-size: 48px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(135deg, #FF6B35, #FF9F1C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;">02:34</div>
                <div style="font-size: 12px; color: #8888A0;">Time Remaining</div>
                <!-- Progress bar -->
                <div style="width: 100%; height: 4px; background: #1E1E35; border-radius: 2px; margin-top: 14px;">
                    <div style="width: 42%; height: 100%; background: linear-gradient(90deg, #FF6B35, #FF9F1C); border-radius: 2px;"></div>
                </div>
            </div>

            <!-- Sets/Reps -->
            <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                <div style="flex: 1; background: #151528; border-radius: 16px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                    <div style="font-size: 30px; font-weight: 800; color: #FF6B35;">3/5</div>
                    <div style="font-size: 11px; color: #8888A0; margin-top: 2px;">Sets</div>
                </div>
                <div style="flex: 1; background: #151528; border-radius: 16px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                    <div style="font-size: 30px; font-weight: 800; color: #4ADE80;">7/10</div>
                    <div style="font-size: 11px; color: #8888A0; margin-top: 2px;">Makes</div>
                </div>
                <div style="flex: 1; background: #151528; border-radius: 16px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                    <div style="font-size: 30px; font-weight: 800; color: #818CF8;">70%</div>
                    <div style="font-size: 11px; color: #8888A0; margin-top: 2px;">Accuracy</div>
                </div>
            </div>

            <!-- Next Up -->
            <div style="background: #151528; border-radius: 16px; padding: 14px 16px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; background: #1E1E35; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="fas fa-forward-step" style="font-size: 16px; color: #8888A0;"></i>
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 10px; color: #8888A0; text-transform: uppercase; letter-spacing: 0.5px;">Next Up</div>
                    <div style="font-size: 13px; font-weight: 600;">Wing 3-Pointer — Off Screen</div>
                </div>
                <i class="fas fa-chevron-right" style="font-size: 12px; color: #555570;"></i>
            </div>

            <!-- Controls -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                <div style="width: 52px; height: 52px; background: #151528; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.06);">
                    <i class="fas fa-backward-step" style="font-size: 18px; color: #8888A0;"></i>
                </div>
                <div style="width: 68px; height: 68px; background: linear-gradient(135deg, #FF6B35, #FF9F1C); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,107,53,0.4);">
                    <i class="fas fa-pause" style="font-size: 24px; color: white;"></i>
                </div>
                <div style="width: 52px; height: 52px; background: #151528; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.06);">
                    <i class="fas fa-forward-step" style="font-size: 18px; color: #8888A0;"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
