<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickForge — Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
.mono { font-family:'JetBrains Mono', monospace; }
.screen { width:100%; height:100%; position:relative; overflow:hidden; color:white; background:#000; }
.status-bar { height:59px; padding:0 28px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; position:relative; z-index:30; }
.dynamic-island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:20px; z-index:40; }
.grad-accent { background: linear-gradient(135deg,#FFB020,#FF4D2E); }
.cam { position:absolute; inset:0; background:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781766596-image-1.png'); background-size:cover; background-position:center; }
.scan-line { position:absolute; left:8%; right:8%; height:2px; background:linear-gradient(90deg,transparent,#FFC844,transparent); box-shadow:0 0 16px 2px rgba(255,200,68,0.7); animation:sweep 2.6s ease-in-out infinite; }
@keyframes sweep { 0%{top:24%;} 50%{top:62%;} 100%{top:24%;} }
.bbox { position:absolute; border:1.5px solid; border-radius:8px; }
.bbox-label { position:absolute; top:-9px; left:6px; font-size:9px; font-weight:700; padding:1px 6px; border-radius:6px; }
.corner { position:absolute; width:26px; height:26px; border-color:#FFC844; }
</style>
</head>
<body>
<div class="screen">
  <div class="cam"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.08) 22%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.92) 100%);"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar" style="z-index:30;">
    <span class="text-white text-[15px] font-semibold">9:41</span>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[12px]"></i><i class="fas fa-wifi text-[12px]"></i><i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- top controls -->
  <div class="relative z-20 px-7 flex items-center justify-between mt-1">
    <button class="w-10 h-10 rounded-full bg-black/35 backdrop-blur-md border border-white/15 flex items-center justify-center">
      <i class="fas fa-xmark text-white text-[15px]"></i>
    </button>
    <div class="flex items-center gap-2 px-3.5 py-2 rounded-full bg-black/40 backdrop-blur-md border border-white/15">
      <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
      <span class="text-white text-[12px] font-bold mono">DETECTING</span>
    </div>
    <button class="w-10 h-10 rounded-full bg-black/35 backdrop-blur-md border border-white/15 flex items-center justify-center">
      <i class="fas fa-bolt text-white text-[14px]"></i>
    </button>
  </div>

  <!-- detection overlay -->
  <div class="absolute inset-0 z-10">
    <div class="scan-line"></div>
    <!-- viewfinder corners -->
    <div class="corner" style="top:20%; left:8%; border-top:3px solid; border-left:3px solid; border-radius:10px 0 0 0;"></div>
    <div class="corner" style="top:20%; right:8%; border-top:3px solid; border-right:3px solid; border-radius:0 10px 0 0;"></div>
    <div class="corner" style="bottom:34%; left:8%; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 10px;"></div>
    <div class="corner" style="bottom:34%; right:8%; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 10px 0;"></div>

    <!-- bounding boxes -->
    <div class="bbox" style="top:30%; left:20%; width:80px; height:54px; border-color:#FF4D2E;">
      <span class="bbox-label" style="background:#FF4D2E; color:white;">2×4 Brick · Red</span>
    </div>
    <div class="bbox" style="top:44%; left:50%; width:66px; height:46px; border-color:#3B82F6;">
      <span class="bbox-label" style="background:#3B82F6; color:white;">2×2 · Blue</span>
    </div>
    <div class="bbox" style="top:36%; left:62%; width:52px; height:40px; border-color:#22C55E;">
      <span class="bbox-label" style="background:#22C55E; color:white;">1×2 · Green</span>
    </div>
    <div class="bbox" style="top:52%; left:26%; width:58px; height:38px; border-color:#FFC844;">
      <span class="bbox-label" style="background:#FFC844; color:#1a1a1a;">Plate · Yellow</span>
    </div>
  </div>

  <!-- bottom live panel -->
  <div class="absolute bottom-0 left-0 right-0 z-20 px-7 pb-9">
    <!-- live count chips -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i class="fas fa-wand-magic-sparkles text-amber-400 text-[12px]"></i>
        <span class="text-white text-[13px] font-bold">Recognized in real time</span>
      </div>
      <span class="text-amber-400 text-[12px] font-bold mono">+38 new</span>
    </div>

    <div class="rounded-3xl p-4 mb-5" style="background:rgba(12,12,20,0.7); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1);">
      <div class="flex items-center justify-between mb-3">
        <div>
          <div class="text-white/50 text-[10px] font-bold mono uppercase tracking-wider">Pieces this scan</div>
          <div class="flex items-end gap-1.5 mt-0.5">
            <span class="text-white text-[30px] font-black mono leading-none">147</span>
            <span class="text-emerald-400 text-[12px] font-bold mb-1 mono">live</span>
          </div>
        </div>
        <div class="flex -space-x-2">
          <div class="w-8 h-8 rounded-lg border-2 border-[#0c0c14]" style="background:#FF4D2E;"></div>
          <div class="w-8 h-8 rounded-lg border-2 border-[#0c0c14]" style="background:#3B82F6;"></div>
          <div class="w-8 h-8 rounded-lg border-2 border-[#0c0c14]" style="background:#22C55E;"></div>
          <div class="w-8 h-8 rounded-lg border-2 border-[#0c0c14]" style="background:#FFC844;"></div>
          <div class="w-8 h-8 rounded-lg border-2 border-[#0c0c14] bg-white/10 flex items-center justify-center"><span class="text-white text-[9px] font-bold">+34</span></div>
        </div>
      </div>
      <!-- recent detection rows -->
      <div class="flex gap-2 overflow-x-auto">
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-full bg-white/8 border border-white/10 flex-shrink-0">
          <span class="w-2.5 h-2.5 rounded-[3px]" style="background:#FF4D2E;"></span>
          <span class="text-white/85 text-[11px] font-semibold mono">2×4 ·12</span>
        </div>
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-full bg-white/8 border border-white/10 flex-shrink-0">
          <span class="w-2.5 h-2.5 rounded-[3px]" style="background:#3B82F6;"></span>
          <span class="text-white/85 text-[11px] font-semibold mono">2×2 ·9</span>
        </div>
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-full bg-white/8 border border-white/10 flex-shrink-0">
          <span class="w-2.5 h-2.5 rounded-[3px]" style="background:#22C55E;"></span>
          <span class="text-white/85 text-[11px] font-semibold mono">1×2 ·21</span>
        </div>
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-full bg-white/8 border border-white/10 flex-shrink-0">
          <span class="w-2.5 h-2.5 rounded-[3px]" style="background:#FFC844;"></span>
          <span class="text-white/85 text-[11px] font-semibold mono">Plate ·15</span>
        </div>
      </div>
    </div>

    <!-- capture controls -->
    <div class="flex items-center justify-between">
      <button class="w-12 h-12 rounded-2xl bg-white/8 backdrop-blur-md border border-white/12 flex items-center justify-center">
        <i class="fas fa-images text-white/80 text-[15px]"></i>
      </button>
      <button class="w-[74px] h-[74px] rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.15); border:3px solid white;">
        <div class="w-[58px] h-[58px] rounded-full grad-accent flex items-center justify-center" style="box-shadow:0 0 24px rgba(255,77,46,0.6);">
          <i class="fas fa-check text-white text-[22px]"></i>
        </div>
      </button>
      <button class="w-12 h-12 rounded-2xl bg-white/8 backdrop-blur-md border border-white/12 flex items-center justify-center">
        <i class="fas fa-cube text-white/80 text-[15px]"></i>
      </button>
    </div>
    <div class="text-center text-white/45 text-[11px] mt-3">Tap ✓ to add 147 pieces to your inventory</div>
  </div>
</div>
</body>
</html>
