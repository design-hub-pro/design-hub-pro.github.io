<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickForge — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
.mono { font-family:'JetBrains Mono', monospace; }
.screen { width:100%; height:100%; position:relative; overflow:hidden; color:white; background:#07080c; }
.status-bar { height:59px; padding:0 28px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; position:relative; z-index:30; }
.dynamic-island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:20px; z-index:40; }
.grad-accent { background: linear-gradient(135deg,#FFB020,#FF4D2E); }
.hero-img { position:absolute; inset:0; background:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781753743-image-1.png'); background-size:cover; background-position:center; }
.hero-fade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,8,12,0.2) 0%, rgba(7,8,12,0.55) 45%, rgba(7,8,12,0.96) 82%, #07080c 100%); }
</style>
</head>
<body>
<div class="screen">
  <div class="hero-img"></div>
  <div class="hero-fade"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar" style="position:relative; z-index:30;">
    <span class="text-white text-[15px] font-semibold">9:41</span>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[12px]"></i>
      <i class="fas fa-wifi text-[12px]"></i>
      <i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Brand mark -->
  <div class="relative z-20 px-7 mt-3 flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl grad-accent flex items-center justify-center" style="box-shadow:0 8px 24px -4px rgba(255,77,46,0.6);">
      <i class="fas fa-cubes text-white text-[15px]"></i>
    </div>
    <span class="text-white font-extrabold text-[19px] tracking-tight">BrickForge</span>
  </div>

  <!-- Bottom content -->
  <div class="absolute bottom-0 left-0 right-0 z-20 px-7 pb-12">
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/15 mb-5 backdrop-blur-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
      <span class="text-white/90 text-[11px] font-bold tracking-widest uppercase">AI Brick Studio</span>
    </div>

    <h1 class="text-[40px] font-black leading-[1.05] tracking-tight">
      Scan your bricks.<br/>
      <span style="background:linear-gradient(135deg,#FFC844,#FF5A38);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Build anything.</span>
    </h1>
    <p class="text-white/60 text-[15px] leading-relaxed mt-4 max-w-[330px]">
      Point your camera at any pile or set. We map every piece, then generate fresh build instructions from what you actually own.
    </p>

    <!-- mini steps -->
    <div class="flex items-center gap-3 mt-7">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-white/8 border border-white/10 flex items-center justify-center"><i class="fas fa-camera text-amber-400 text-[12px]"></i></div>
        <span class="text-white/55 text-[12px] font-medium">Scan</span>
      </div>
      <i class="fas fa-arrow-right text-white/20 text-[10px]"></i>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-white/8 border border-white/10 flex items-center justify-center"><i class="fas fa-cubes-stacked text-orange-400 text-[12px]"></i></div>
        <span class="text-white/55 text-[12px] font-medium">Inventory</span>
      </div>
      <i class="fas fa-arrow-right text-white/20 text-[10px]"></i>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-white/8 border border-white/10 flex items-center justify-center"><i class="fas fa-wand-magic-sparkles text-red-400 text-[12px]"></i></div>
        <span class="text-white/55 text-[12px] font-medium">Create</span>
      </div>
    </div>

    <button class="w-full mt-8 grad-accent rounded-2xl py-4 flex items-center justify-center gap-2 font-bold text-white text-[16px]" style="box-shadow:0 14px 36px -8px rgba(255,77,46,0.55);">
      <i class="fas fa-camera"></i> Scan Your Collection
    </button>
    <div class="flex items-center justify-center gap-2 mt-4">
      <span class="text-white/40 text-[13px]">Already have an account?</span>
      <span class="text-amber-400 text-[13px] font-semibold">Sign in</span>
    </div>
  </div>
</div>
</body>
</html>
