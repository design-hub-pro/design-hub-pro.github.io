<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickForge — Build</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
.mono { font-family:'JetBrains Mono', monospace; }
.screen { width:100%; height:100%; background: linear-gradient(180deg,#0e0f17 0%,#070810 100%); position:relative; overflow-y:auto; color:white; padding-bottom:110px; }
.status-bar { height:59px; padding:0 28px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; position:relative; z-index:30; }
.dynamic-island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:20px; z-index:40; }
.card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:20px; }
.grad-accent { background: linear-gradient(135deg,#FFB020,#FF4D2E); }
.tab-bar { position:absolute; bottom:0; left:0; right:0; background: rgba(10,10,18,0.9); backdrop-filter: blur(20px); border-top:1px solid rgba(255,255,255,0.06); height:88px; padding:10px 20px 24px; display:flex; justify-content:space-between; align-items:flex-start; z-index:50; }
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
.tab i { font-size:18px; color: rgba(255,255,255,0.4); }
.tab span { font-size:10px; color: rgba(255,255,255,0.4); font-weight:500; }
.tab.active i, .tab.active span { color:#FF8A3D; }
.brick { border-radius:4px; position:relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.20), 0 3px 8px rgba(0,0,0,0.35); display:flex; align-items:flex-start; justify-content:center; gap:4px; padding-top:4px; }
.stud { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.22); box-shadow: inset 0 1px 1px rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-white text-[15px] font-semibold">9:41</span>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[12px]"></i><i class="fas fa-wifi text-[12px]"></i><i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="px-7 mt-1 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full bg-white/6 border border-white/10 flex items-center justify-center">
      <i class="fas fa-arrow-left text-white/80 text-[14px]"></i>
    </button>
    <div class="text-center">
      <div class="text-white text-[15px] font-bold leading-tight">Star Cruiser X-9</div>
      <div class="text-white/40 text-[11px] mono">Instructions · 214 pcs</div>
    </div>
    <button class="w-10 h-10 rounded-full bg-white/6 border border-white/10 flex items-center justify-center">
      <i class="fas fa-ellipsis text-white/80 text-[14px]"></i>
    </button>
  </div>

  <!-- 3D viewer -->
  <div class="px-7 mt-4">
    <div class="rounded-3xl overflow-hidden relative" style="height:280px; background:radial-gradient(circle at 50% 40%, rgba(255,176,32,0.14), rgba(7,8,16,0.6));">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781759984-image-1.png" class="w-full h-full object-cover" alt=""/>
      <div class="absolute inset-0" style="background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 30%, rgba(0,0,0,0.5));"></div>
      <!-- step badge -->
      <div class="absolute top-3.5 left-3.5 px-3 py-1.5 rounded-full bg-black/45 backdrop-blur-md border border-white/12">
        <span class="text-white text-[12px] font-black mono">STEP 14 / 32</span>
      </div>
      <!-- 3D controls -->
      <div class="absolute top-3.5 right-3.5 flex flex-col gap-2">
        <button class="w-9 h-9 rounded-full bg-black/45 backdrop-blur-md border border-white/12 flex items-center justify-center"><i class="fas fa-rotate text-white text-[12px]"></i></button>
        <button class="w-9 h-9 rounded-full bg-black/45 backdrop-blur-md border border-white/12 flex items-center justify-center"><i class="fas fa-magnifying-glass-plus text-white text-[12px]"></i></button>
      </div>
      <!-- rotate hint -->
      <div class="absolute bottom-3.5 left-1/2 -translate-x-1/2 flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/45 backdrop-blur-md border border-white/12">
        <i class="fas fa-hand-pointer text-amber-400 text-[11px]"></i>
        <span class="text-white/80 text-[11px] font-medium">Drag to rotate 360°</span>
      </div>
    </div>
  </div>

  <!-- progress -->
  <div class="px-7 mt-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-white/55 text-[11px] font-bold tracking-widest uppercase">Build progress</span>
      <span class="text-amber-400 text-[12px] font-black mono">44%</span>
    </div>
    <div class="h-2 rounded-full bg-white/8 overflow-hidden">
      <div class="h-full rounded-full grad-accent" style="width:44%;"></div>
    </div>
  </div>

  <!-- this step pieces -->
  <div class="px-7 mt-5">
    <div class="card p-4">
      <div class="flex items-center justify-between mb-3.5">
        <span class="text-white text-[14px] font-bold">Add these pieces</span>
        <span class="text-white/40 text-[11px] mono">6 parts</span>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div class="flex flex-col items-center gap-2">
          <div class="h-9 flex items-center"><div class="brick" style="background:#9CA3AF; width:54px; height:24px;"><span class="stud"></span><span class="stud"></span><span class="stud"></span></div></div>
          <span class="text-white/60 text-[10px] mono">1×3 ·2</span>
        </div>
        <div class="flex flex-col items-center gap-2">
          <div class="h-9 flex items-center"><div class="brick" style="background:#3B82F6; width:30px; height:24px;"><span class="stud"></span></div></div>
          <span class="text-white/60 text-[10px] mono">1×1 ·2</span>
        </div>
        <div class="flex flex-col items-center gap-2">
          <div class="h-9 flex items-center"><div class="brick" style="background:#FFC844; width:54px; height:16px; padding-top:2px;"><span class="stud" style="width:8px;height:8px;"></span><span class="stud" style="width:8px;height:8px;"></span><span class="stud" style="width:8px;height:8px;"></span></div></div>
          <span class="text-white/60 text-[10px] mono">Plate ·2</span>
        </div>
      </div>
      <div class="mt-4 pt-3.5 border-t border-white/8 flex items-start gap-2.5">
        <i class="fas fa-circle-info text-amber-400 text-[12px] mt-0.5"></i>
        <span class="text-white/65 text-[12px] leading-snug">Attach the gray supports to the cockpit frame, then cap with the yellow accent plates.</span>
      </div>
    </div>
  </div>

  <!-- step thumbnails -->
  <div class="mt-5 pl-7">
    <div class="flex items-center justify-between pr-7 mb-3">
      <span class="text-white text-[14px] font-bold">All steps</span>
      <span class="text-white/40 text-[11px] mono">14 done</span>
    </div>
    <div class="flex gap-2.5 overflow-x-auto pr-7">
      <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-emerald-400/10 border border-emerald-400/30 flex items-center justify-center relative">
        <i class="fas fa-check text-emerald-400 text-[14px]"></i>
        <span class="absolute bottom-1 right-1.5 text-emerald-400/70 text-[8px] mono">12</span>
      </div>
      <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-emerald-400/10 border border-emerald-400/30 flex items-center justify-center relative">
        <i class="fas fa-check text-emerald-400 text-[14px]"></i>
        <span class="absolute bottom-1 right-1.5 text-emerald-400/70 text-[8px] mono">13</span>
      </div>
      <div class="flex-shrink-0 w-14 h-14 rounded-xl grad-accent flex items-center justify-center relative" style="box-shadow:0 8px 20px -6px rgba(255,77,46,0.6);">
        <i class="fas fa-screwdriver-wrench text-white text-[13px]"></i>
        <span class="absolute bottom-1 right-1.5 text-white/80 text-[8px] mono">14</span>
      </div>
      <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center relative">
        <span class="text-white/45 text-[14px] font-bold mono">15</span>
      </div>
      <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center relative">
        <span class="text-white/45 text-[14px] font-bold mono">16</span>
      </div>
      <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center relative">
        <span class="text-white/45 text-[14px] font-bold mono">17</span>
      </div>
    </div>
  </div>

  <!-- nav buttons -->
  <div class="px-7 mt-5 flex gap-3">
    <button class="w-14 h-14 rounded-2xl bg-white/6 border border-white/10 flex items-center justify-center flex-shrink-0">
      <i class="fas fa-arrow-left text-white/80 text-[15px]"></i>
    </button>
    <button class="flex-1 grad-accent rounded-2xl flex items-center justify-center gap-2 font-bold text-white text-[16px]" style="box-shadow:0 12px 28px -8px rgba(255,77,46,0.55);">
      Next step <i class="fas fa-arrow-right"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-cubes-stacked"></i><span>Bricks</span></div>
    <div class="tab" style="flex:1;">
      <div class="-mt-7 w-14 h-14 rounded-2xl grad-accent flex items-center justify-center" style="box-shadow:0 12px 30px -6px rgba(255,77,46,0.65);">
        <i class="fas fa-camera text-white text-[20px]"></i>
      </div>
    </div>
    <div class="tab active"><i class="fas fa-wand-magic-sparkles"></i><span>Create</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </nav>
</div>
</body>
</html>
