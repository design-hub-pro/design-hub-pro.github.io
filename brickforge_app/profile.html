<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickForge — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
.mono { font-family:'JetBrains Mono', monospace; }
.screen { width:100%; height:100%; background: linear-gradient(180deg,#0e0f17 0%,#070810 100%); position:relative; overflow-y:auto; color:white; padding-bottom:110px; }
.status-bar { height:59px; padding:0 28px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; position:relative; z-index:30; }
.dynamic-island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:20px; z-index:40; }
.card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:20px; }
.grad-accent { background: linear-gradient(135deg,#FFB020,#FF4D2E); }
.tab-bar { position:absolute; bottom:0; left:0; right:0; background: rgba(10,10,18,0.9); backdrop-filter: blur(20px); border-top:1px solid rgba(255,255,255,0.06); height:88px; padding:10px 20px 24px; display:flex; justify-content:space-between; align-items:flex-start; z-index:50; }
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
.tab i { font-size:18px; color: rgba(255,255,255,0.4); }
.tab span { font-size:10px; color: rgba(255,255,255,0.4); font-weight:500; }
.tab.active i, .tab.active span { color:#FF8A3D; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-white text-[15px] font-semibold">9:41</span>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[12px]"></i><i class="fas fa-wifi text-[12px]"></i><i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Header row -->
  <div class="px-7 mt-1 flex items-center justify-between">
    <span class="text-white text-[20px] font-bold tracking-tight">Profile</span>
    <button class="w-10 h-10 rounded-full bg-white/6 border border-white/10 flex items-center justify-center">
      <i class="fas fa-gear text-white/80 text-[14px]"></i>
    </button>
  </div>

  <!-- Profile card -->
  <div class="px-7 mt-4">
    <div class="card p-5 relative overflow-hidden">
      <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full" style="background:radial-gradient(circle, rgba(255,176,32,0.18), transparent 70%);"></div>
      <div class="relative flex items-center gap-4">
        <div class="relative">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80" class="w-[68px] h-[68px] rounded-2xl object-cover border-2 border-orange-400/50" alt=""/>
          <div class="absolute -bottom-1.5 -right-1.5 w-7 h-7 rounded-full grad-accent flex items-center justify-center border-2 border-[#0e0f17]">
            <i class="fas fa-bolt text-white text-[10px]"></i>
          </div>
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <span class="text-white text-[18px] font-bold">Leo Martins</span>
          </div>
          <div class="text-white/45 text-[12px]">@leobuilds</div>
          <div class="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full" style="background:rgba(255,176,32,0.12); border:1px solid rgba(255,176,32,0.25);">
            <i class="fas fa-crown text-amber-400 text-[10px]"></i>
            <span class="text-amber-300 text-[10px] font-bold">Master Builder · Lvl 12</span>
          </div>
        </div>
      </div>
      <!-- level progress -->
      <div class="mt-4">
        <div class="flex justify-between text-[10px] text-white/45 mb-1.5 mono"><span>2,840 XP</span><span>Lvl 13 · 660 to go</span></div>
        <div class="h-1.5 rounded-full bg-white/8 overflow-hidden"><div class="h-full rounded-full grad-accent" style="width:72%;"></div></div>
      </div>
    </div>
  </div>

  <!-- stats -->
  <div class="px-7 mt-4 grid grid-cols-3 gap-2.5">
    <div class="card p-3.5 text-center">
      <div class="text-white text-[24px] font-black mono leading-none">27</div>
      <div class="text-white/40 text-[10px] mt-1.5">Builds</div>
    </div>
    <div class="card p-3.5 text-center">
      <div class="text-white text-[24px] font-black mono leading-none">2.4k</div>
      <div class="text-white/40 text-[10px] mt-1.5">Bricks</div>
    </div>
    <div class="card p-3.5 text-center">
      <div class="text-white text-[24px] font-black mono leading-none">1.2k</div>
      <div class="text-white/40 text-[10px] mt-1.5">Followers</div>
    </div>
  </div>

  <!-- achievements -->
  <div class="px-7 mt-5">
    <div class="flex items-center justify-between mb-3">
      <span class="text-white text-[15px] font-bold">Badges</span>
      <span class="text-amber-400 text-[12px] font-semibold">8 of 24</span>
    </div>
    <div class="flex gap-3">
      <div class="flex-1 card p-3 flex flex-col items-center gap-1.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#FFB020,#FF4D2E);"><i class="fas fa-rocket text-white text-[15px]"></i></div>
        <span class="text-white/60 text-[9px] font-semibold text-center">First Build</span>
      </div>
      <div class="flex-1 card p-3 flex flex-col items-center gap-1.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#3B82F6,#6366F1);"><i class="fas fa-fire text-white text-[15px]"></i></div>
        <span class="text-white/60 text-[9px] font-semibold text-center">10 Day Streak</span>
      </div>
      <div class="flex-1 card p-3 flex flex-col items-center gap-1.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#22C55E,#10B981);"><i class="fas fa-recycle text-white text-[15px]"></i></div>
        <span class="text-white/60 text-[9px] font-semibold text-center">Zero Waste</span>
      </div>
      <div class="flex-1 card p-3 flex flex-col items-center gap-1.5 opacity-40">
        <div class="w-10 h-10 rounded-xl bg-white/8 flex items-center justify-center"><i class="fas fa-lock text-white/50 text-[14px]"></i></div>
        <span class="text-white/40 text-[9px] font-semibold text-center">Locked</span>
      </div>
    </div>
  </div>

  <!-- my creations gallery -->
  <div class="px-7 mt-5">
    <div class="flex items-center justify-between mb-3">
      <span class="text-white text-[15px] font-bold">My creations</span>
      <span class="text-amber-400 text-[12px] font-semibold">Grid</span>
    </div>
    <div class="grid grid-cols-3 gap-2.5">
      <div class="rounded-xl overflow-hidden" style="height:96px;"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781759984-image-1.png" class="w-full h-full object-cover" alt=""/></div>
      <div class="rounded-xl overflow-hidden" style="height:96px;"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781792086-image-1.png" class="w-full h-full object-cover" alt=""/></div>
      <div class="rounded-xl overflow-hidden" style="height:96px;"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781785599-image-1.png" class="w-full h-full object-cover" alt=""/></div>
      <div class="rounded-xl overflow-hidden" style="height:96px;"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781773035-image-1.png" class="w-full h-full object-cover" alt=""/></div>
      <div class="rounded-xl overflow-hidden" style="height:96px;"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782781753743-image-1.png" class="w-full h-full object-cover" alt=""/></div>
      <div class="rounded-xl overflow-hidden relative flex items-center justify-center" style="height:96px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
        <div class="text-center"><i class="fas fa-plus text-white/50 text-[16px]"></i><div class="text-white/40 text-[9px] mt-1">+22 more</div></div>
      </div>
    </div>
  </div>

  <!-- settings rows -->
  <div class="px-7 mt-5 mb-2">
    <div class="card divide-y divide-white/6">
      <div class="flex items-center gap-3.5 px-4 py-3.5">
        <div class="w-8 h-8 rounded-lg bg-blue-500/15 flex items-center justify-center"><i class="fas fa-cubes-stacked text-blue-400 text-[13px]"></i></div>
        <span class="text-white text-[14px] font-medium flex-1">Manage collection</span>
        <i class="fas fa-chevron-right text-white/25 text-[12px]"></i>
      </div>
      <div class="flex items-center gap-3.5 px-4 py-3.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/15 flex items-center justify-center"><i class="fas fa-bell text-amber-400 text-[13px]"></i></div>
        <span class="text-white text-[14px] font-medium flex-1">Notifications</span>
        <i class="fas fa-chevron-right text-white/25 text-[12px]"></i>
      </div>
      <div class="flex items-center gap-3.5 px-4 py-3.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center"><i class="fas fa-circle-question text-emerald-400 text-[13px]"></i></div>
        <span class="text-white text-[14px] font-medium flex-1">Help & feedback</span>
        <i class="fas fa-chevron-right text-white/25 text-[12px]"></i>
      </div>
    </div>
  </div>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-cubes-stacked"></i><span>Bricks</span></div>
    <div class="tab" style="flex:1;">
      <div class="-mt-7 w-14 h-14 rounded-2xl grad-accent flex items-center justify-center" style="box-shadow:0 12px 30px -6px rgba(255,77,46,0.65);">
        <i class="fas fa-camera text-white text-[20px]"></i>
      </div>
    </div>
    <div class="tab"><i class="fas fa-wand-magic-sparkles"></i><span>Create</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Profile</span></div>
  </nav>
</div>
</body>
</html>
