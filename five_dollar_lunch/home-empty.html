<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Dollar Lunch - Find Affordable Campus Meals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-utensils text-white text-lg"></i>
                </div>
                <span class="text-xl font-bold text-gray-900">5 Dollar Lunch</span>
            </div>
            <a href="admin-login.html" class="text-sm text-gray-500 hover:text-gray-700">
                <i class="fas fa-lock mr-1"></i>Admin
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <!-- Search Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Find lunch under your budget</h1>
            <p class="text-gray-500 mb-6">Set your max budget and discover affordable meals on campus</p>

            <!-- Budget Input -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Maximum Budget</label>
                <div class="flex items-center gap-4">
                    <div class="relative flex-1">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-lg font-medium">$</span>
                        <input
                            type="number"
                            id="budgetInput"
                            placeholder="5"
                            min="1"
                            max="20"
                            step="0.5"
                            class="w-full pl-8 pr-4 py-3 text-2xl font-bold text-gray-900 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none"
                        >
                    </div>
                    <button
                        class="px-6 py-3 bg-green-500 text-white font-semibold rounded-xl hover:bg-green-600 transition-colors flex items-center gap-2"
                    >
                        <i class="fas fa-search"></i>
                        Search
                    </button>
                </div>
            </div>

            <!-- Quick Budget Buttons -->
            <div class="flex gap-2 flex-wrap">
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium">$3</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium">$5</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium">$7</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium">$10</button>
            </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-16">
            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-search text-gray-300 text-4xl"></i>
            </div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2">Enter your budget to get started</h2>
            <p class="text-gray-500 max-w-sm mx-auto">
                Type in your maximum budget or use the quick buttons above to find meals you can afford.
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-3xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
        <p>© 2024 5 Dollar Lunch • Made for hungry students</p>
    </footer>
</body>
</html>
