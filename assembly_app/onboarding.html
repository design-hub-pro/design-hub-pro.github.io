<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F8F8FC;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#111827}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 108px);overflow-y:auto;padding:8px 28px 24px}
.step-dots{display:flex;gap:6px}
.dot{height:5px;border-radius:3px;background:#EEECFA}
.dot.active{background:#5B4CF5;width:26px}
.dot.done{background:#C9C3F7;width:16px}
.dot.todo{width:16px}
.tile{position:relative;border-radius:20px;overflow:hidden;height:108px}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75),rgba(0,0,0,0.05))}
.tile.selected{outline:3px solid #5B4CF5;outline-offset:-3px}
.tile .check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.3);border:1.5px solid white;display:flex;align-items:center;justify-content:center}
.tile.selected .check{background:#5B4CF5;border-color:#5B4CF5}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;height:108px;background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);border-top:1px solid #ECEBF6;display:flex;align-items:center;padding:0 28px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center gap-2 mt-2 mb-6">
      <i class="fas fa-arrow-left text-gray-400"></i>
      <div class="step-dots ml-2"><div class="dot done"></div><div class="dot active"></div><div class="dot todo"></div></div>
      <span class="text-xs text-gray-400 font-semibold ml-auto">Step 2 of 3</span>
    </div>

    <h1 class="text-2xl font-extrabold text-gray-900 leading-tight mb-1.5">What are you into?</h1>
    <p class="text-sm text-gray-400 mb-5">Pick a few. Assembly tunes clubs, jobs, and coaching to match.</p>

    <div class="grid grid-cols-2 gap-3">
      <div class="tile selected">
        <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"><i class="fas fa-check text-white text-[10px]"></i></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">STEM</span>
      </div>
      <div class="tile selected">
        <img src="https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"><i class="fas fa-check text-white text-[10px]"></i></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">Debate</span>
      </div>
      <div class="tile">
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">Business</span>
      </div>
      <div class="tile">
        <img src="https://images.unsplash.com/photo-1543269664-56d93c1b41a6?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">Arts</span>
      </div>
      <div class="tile">
        <img src="https://images.unsplash.com/photo-1556740738-b6a63e27c4df?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">Retail Jobs</span>
      </div>
      <div class="tile">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&h=300&fit=crop">
        <div class="scrim"></div>
        <div class="check"></div>
        <span class="absolute bottom-2.5 left-3 text-white text-sm font-bold">Food Service</span>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="w-full text-white font-bold text-sm rounded-2xl py-4" style="background:linear-gradient(135deg,#5B4CF5,#8B5CF6)">Continue · 2 selected</button>
  </div>
</div>
</body>
</html>
