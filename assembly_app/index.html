<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assembly — Clubs, Jobs & AI Coaching for High Schoolers</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#ffffff}
.phone{width:460px;height:980px;background:#1a1a1a;border-radius:62px;padding:12px;box-shadow:0 30px 80px rgba(91,76,245,0.16),0 10px 30px rgba(0,0,0,0.08)}
.screen{width:100%;height:100%;background:#F8F8FC;border-radius:52px;overflow:hidden;position:relative}
iframe{width:100%;height:100%;border:none;display:block}
.screen-label{text-align:center;font-size:14px;font-weight:600;color:#6B6690;margin-top:20px;letter-spacing:0.3px;text-transform:uppercase}
</style>
</head>
<body>
<div class="max-w-[1600px] mx-auto px-10 py-16">
  <!-- Header -->
  <div class="text-center mb-20">
    <div class="inline-flex items-center gap-2 bg-indigo-50 text-[#5B4CF5] px-4 py-1.5 rounded-full text-xs font-bold mb-5">
      <span class="w-2 h-2 rounded-full bg-[#5B4CF5] animate-pulse"></span>
      CLUBS · JOBS · AI COACHING
    </div>
    <h1 class="text-7xl font-black text-gray-900 tracking-tight">Assembly<span style="background:linear-gradient(135deg,#5B4CF5,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent">.</span></h1>
    <p class="text-xl text-gray-500 mt-4 max-w-2xl mx-auto">One hub where high schoolers find clubs, apply to jobs, and train with an AI coach to get ready for both.</p>
  </div>

  <!-- Phone grid -->
  <div class="grid grid-cols-3 gap-x-10 gap-y-16 justify-items-center">
    <div>
      <div class="phone"><div class="screen"><iframe src="onboarding.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">01 · Onboarding</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="home.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">02 · Home</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="discover.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">03 · Discover</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="club_detail.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">04 · Club Detail</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="job_detail.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">05 · Job Detail</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="ai_coach.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">06 · AI Coach</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="mock_interview.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">07 · Mock Interview</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="applications.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">08 · Applications</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="profile.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">09 · Profile</p>
    </div>
  </div>
</div>
</body>
</html>
