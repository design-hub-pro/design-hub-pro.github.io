<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Near You</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F8F8FC;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#111827}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px);overflow-y:auto;padding:0 28px 40px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:#F3F1FC;display:flex;align-items:center;justify-content:center}
.list-card{background:white;border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 3px 14px rgba(0,0,0,0.05)}
.tag-club{background:#EEF2FF;color:#5B4CF5}
.tag-job{background:#ECFDF5;color:#059669}
.tag-volunteer{background:#FFF7ED;color:#C2410C}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center gap-3 mt-2 mb-1">
      <div class="icon-btn"><i class="fas fa-arrow-left text-gray-700 text-sm"></i></div>
      <h1 class="text-xl font-extrabold text-gray-900">Near You</h1>
    </div>
    <div class="flex items-center gap-1.5 mb-4 ml-1">
      <i class="fas fa-location-dot text-xs" style="color:#5B4CF5"></i>
      <p class="text-xs font-semibold text-gray-500">Lincoln High · Riverside, CA</p>
      <i class="fas fa-chevron-down text-gray-300 text-[9px]"></i>
    </div>

    <!-- Map visual -->
    <div class="relative rounded-2xl overflow-hidden h-40 mb-5">
      <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=700&h=350&fit=crop" class="w-full h-full object-cover">
      <div class="absolute inset-0" style="background:rgba(91,76,245,0.18)"></div>
      <div class="absolute top-9 left-12 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md" style="outline:2px solid #5B4CF5">
        <i class="fas fa-people-group text-[10px]" style="color:#5B4CF5"></i>
      </div>
      <div class="absolute top-20 left-32 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md" style="outline:2px solid #059669">
        <i class="fas fa-briefcase text-[10px] text-emerald-600"></i>
      </div>
      <div class="absolute bottom-8 right-14 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md" style="outline:2px solid #C2410C">
        <i class="fas fa-heart text-[10px]" style="color:#C2410C"></i>
      </div>
      <span class="absolute top-3 right-3 bg-white/90 text-[9px] font-bold text-gray-800 px-2.5 py-1 rounded-full">14 nearby</span>
    </div>

    <h3 class="text-base font-extrabold text-gray-900 mb-3">Within 1 mile</h3>
    <div class="flex flex-col gap-3 mb-6">
      <div class="list-card">
        <img src="https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?w=200&h=200&fit=crop" class="w-14 h-14 rounded-xl object-cover">
        <div class="flex-1">
          <span class="text-[9px] font-bold px-2 py-0.5 rounded-full tag-volunteer">VOLUNTEER</span>
          <p class="text-sm font-bold text-gray-900 mt-1">Riverside Food Bank</p>
          <p class="text-[11px] text-gray-400">0.6 mi · Sat mornings</p>
        </div>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
      <div class="list-card">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200&h=200&fit=crop" class="w-14 h-14 rounded-xl object-cover">
        <div class="flex-1">
          <span class="text-[9px] font-bold px-2 py-0.5 rounded-full tag-job">JOB</span>
          <p class="text-sm font-bold text-gray-900 mt-1">Cafe Barista, PT</p>
          <p class="text-[11px] text-gray-400">0.8 mi · $16/hr</p>
        </div>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
    </div>

    <h3 class="text-base font-extrabold text-gray-900 mb-3">Classmates to talk to</h3>
    <div class="flex flex-col gap-3">
      <div class="list-card">
        <div class="relative flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop" class="w-12 h-12 rounded-full object-cover">
          <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-400 rounded-full border-2 border-white"></span>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-gray-900">Ethan · Robotics Team</p>
          <p class="text-[11px] text-gray-400">Same school · 2 years in</p>
        </div>
        <button class="text-white text-[11px] font-bold px-3.5 py-2 rounded-full flex-shrink-0" style="background:#111827">Message</button>
      </div>
      <div class="list-card">
        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=100&h=100&fit=crop" class="w-12 h-12 rounded-full object-cover flex-shrink-0">
        <div class="flex-1">
          <p class="text-sm font-bold text-gray-900">Mrs. Patel · Food Bank</p>
          <p class="text-[11px] text-gray-400">Volunteer coordinator</p>
        </div>
        <button class="bg-gray-100 text-gray-700 text-[11px] font-bold px-3.5 py-2 rounded-full flex-shrink-0">Message</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
