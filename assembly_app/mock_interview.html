<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mock Interview</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0F0B1E;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.stage{position:relative;height:100%}
.ai-tile{position:absolute;inset:0}
.ai-tile img{width:100%;height:100%;object-fit:cover}
.pip{position:absolute;top:64px;right:20px;width:92px;height:130px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.5);z-index:10}
.wave{display:flex;align-items:center;gap:2px}
.wave span{width:3px;background:#22D3EE;border-radius:2px;animation:w 1s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}.wave span:nth-child(4){animation-delay:.1s}.wave span:nth-child(5){animation-delay:.25s}
@keyframes w{0%,100%{height:6px}50%{height:16px}}
.q-card{position:absolute;top:70px;left:20px;right:130px;background:rgba(15,11,30,0.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:16px;z-index:10}
.feedback-chip{background:rgba(15,11,30,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:6px}
.controls{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;z-index:10}
.ctrl-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
.timer-ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(#22D3EE 0% 62%, rgba(255,255,255,0.15) 62% 100%);display:flex;align-items:center;justify-content:center}
.timer-inner{width:36px;height:36px;border-radius:50%;background:#0F0B1E;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:white}
</style>
</head>
<body>
<div class="screen">
  <div class="stage">
    <div class="ai-tile">
      <img src="https://images.unsplash.com/photo-1531384441138-2736e62e0919?w=800&h=1000&fit=crop">
      <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/70"></div>
    </div>
    <div class="dynamic-island"></div>

    <div class="absolute top-16 left-5 flex items-center gap-2 bg-black/40 backdrop-blur-sm rounded-full pl-1.5 pr-3 py-1.5 z-10">
      <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#7C3AED,#EC4899)"><i class="fas fa-wand-magic-sparkles text-white text-[10px]"></i></div>
      <span class="text-white text-xs font-bold">AI Interviewer</span>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="pip">
      <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e?w=300&h=400&fit=crop" class="w-full h-full object-cover">
    </div>

    <div class="q-card">
      <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-300">Question 3 of 6</p>
      <p class="text-white text-base font-bold leading-snug mt-1.5">"Tell me about a time you led a team through a challenge."</p>
    </div>

    <div class="absolute left-5 right-5 flex gap-2" style="bottom:172px">
      <div class="feedback-chip"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="text-white text-[11px] font-semibold">Pace: Good</span></div>
      <div class="feedback-chip"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="text-white text-[11px] font-semibold">Eye Contact 88%</span></div>
      <div class="feedback-chip"><span class="w-2 h-2 rounded-full bg-amber-400"></span><span class="text-white text-[11px] font-semibold">Filler: 2</span></div>
    </div>

    <div class="absolute left-5" style="bottom:172px" ></div>

    <div class="controls">
      <div class="ctrl-btn"><i class="fas fa-microphone"></i></div>
      <div class="timer-ring"><div class="timer-inner">0:42</div></div>
      <div class="ctrl-btn" style="background:#EF4444"><i class="fas fa-phone-slash"></i></div>
    </div>
  </div>
</div>
</body>
</html>
