<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F8F8FC;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.cover{height:150px;background:linear-gradient(135deg,#5B4CF5 0%,#8B5CF6 55%,#EC4899 100%);position:relative}
.content{height:calc(100% - 150px - 88px);overflow-y:auto;padding:0 28px 24px;margin-top:-40px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-top:1px solid #ECEBF6;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#B4B2C8;font-size:10px;font-weight:600}
.tab.active{color:#5B4CF5}
.tab i{font-size:21px}
.stat-tile{background:white;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 14px rgba(91,76,245,0.06)}
.stat-num{font-size:24px;font-weight:800;color:#111827;line-height:1}
.resume-card{background:white;border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.05);display:flex;align-items:center;gap:14px}
.ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(#5B4CF5 0% 82%, #EEECFA 82% 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-inner{width:42px;height:42px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#5B4CF5}
.badge{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>
<div class="screen">
  <div class="cover">
    <div class="dynamic-island"></div>
    <div class="absolute top-16 right-7"><i class="fas fa-gear text-white/90 text-lg"></i></div>
  </div>
  <div class="content">
    <div class="flex items-end gap-4 px-1 mb-4">
      <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e?w=200&h=200&fit=crop" class="w-20 h-20 rounded-3xl object-cover border-4 border-white shadow-lg">
      <div class="pb-1">
        <h1 class="text-xl font-extrabold text-gray-900">Maya Chen</h1>
        <p class="text-xs text-gray-400 font-semibold">Grade 11 · Lincoln High</p>
      </div>
    </div>

    <div class="grid grid-cols-4 gap-2.5 mb-5">
      <div class="stat-tile"><div class="stat-num">3</div><p class="text-[9px] text-gray-400 font-semibold mt-0.5">Clubs</p></div>
      <div class="stat-tile"><div class="stat-num">64</div><p class="text-[9px] text-gray-400 font-semibold mt-0.5">Hours</p></div>
      <div class="stat-tile"><div class="stat-num">12</div><p class="text-[9px] text-gray-400 font-semibold mt-0.5">Applied</p></div>
      <div class="stat-tile"><div class="stat-num">7</div><p class="text-[9px] text-gray-400 font-semibold mt-0.5">Badges</p></div>
    </div>

    <div class="resume-card mb-5">
      <div class="ring"><div class="ring-inner">82%</div></div>
      <div class="flex-1">
        <p class="text-sm font-bold text-gray-900">AI Resume</p>
        <p class="text-[11px] text-gray-400">Last updated 2 days ago</p>
      </div>
      <span class="text-xs font-bold text-[#5B4CF5]">Edit</span>
    </div>

    <h3 class="text-base font-extrabold text-gray-900 mb-3">Badges</h3>
    <div class="grid grid-cols-4 gap-2.5 mb-5">
      <div class="badge" style="background:#FEF3C7"><i class="fas fa-trophy text-amber-500"></i><span class="text-[8px] font-bold text-amber-700">Top 10%</span></div>
      <div class="badge" style="background:#EEF2FF"><i class="fas fa-comments text-[#5B4CF5]"></i><span class="text-[8px] font-bold text-[#5B4CF5]">Speaker</span></div>
      <div class="badge" style="background:#ECFDF5"><i class="fas fa-handshake text-emerald-500"></i><span class="text-[8px] font-bold text-emerald-700">1st Job</span></div>
      <div class="badge bg-gray-100"><i class="fas fa-lock text-gray-300"></i><span class="text-[8px] font-bold text-gray-300">Locked</span></div>
    </div>

    <h3 class="text-base font-extrabold text-gray-900 mb-3">Recent Activity</h3>
    <div class="flex flex-col gap-2.5">
      <div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#ECFDF5"><i class="fas fa-check text-emerald-500 text-xs"></i></div>
        <p class="text-xs text-gray-600"><span class="font-bold text-gray-900">Environmental Club</span> sent an offer</p>
      </div>
      <div class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-sm">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#F5F3FF"><i class="fas fa-wand-magic-sparkles text-[#7C3AED] text-xs"></i></div>
        <p class="text-xs text-gray-600">Completed <span class="font-bold text-gray-900">Mock Interview #7</span></p>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-compass"></i><span>Discover</span></div>
    <div class="tab"><i class="fas fa-wand-magic-sparkles"></i><span>AI Coach</span></div>
    <div class="tab"><i class="fas fa-inbox"></i><span>Applications</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
