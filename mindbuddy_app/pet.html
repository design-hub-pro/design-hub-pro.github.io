<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBuddy - Virtual Pet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100vh; overflow-y: auto; background: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes pulse-heart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .pet-float { animation: float 3s ease-in-out infinite; }
        .heart-pulse { animation: pulse-heart 1.5s ease-in-out infinite; }
        .action-btn { transition: all 0.2s; }
        .action-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-gray-900">9:41</span>
        </div>
        <div class="w-32 h-[34px] bg-black rounded-full mt-3"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-gray-900"></i>
            <i class="fas fa-wifi text-xs text-gray-900"></i>
            <i class="fas fa-battery-full text-xs text-gray-900"></i>
        </div>
    </div>

    <div class="pb-28" style="min-height: calc(100vh - 59px);">
        <!-- Header -->
        <div class="content-area pt-4 pb-2">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Mochi</h1>
                    <p class="text-sm text-gray-400">Your comfort buddy</p>
                </div>
                <div class="flex items-center gap-2">
                    <div class="bg-amber-100 px-3 py-1 rounded-full flex items-center gap-1">
                        <i class="fas fa-star text-amber-500 text-xs"></i>
                        <span class="text-xs font-bold text-amber-600">Lv.12</span>
                    </div>
                    <div class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-shirt text-gray-400 text-sm"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pet Display -->
        <div class="content-area my-4">
            <div class="bg-gradient-to-b from-pink-100 via-purple-50 to-blue-100 rounded-3xl p-6 relative overflow-hidden" style="min-height: 260px;">
                <!-- Background decorations -->
                <div class="absolute top-4 left-6 text-lg opacity-40">✨</div>
                <div class="absolute top-8 right-8 text-sm opacity-30">⭐</div>
                <div class="absolute bottom-16 left-8 text-sm opacity-30">💫</div>
                <div class="absolute bottom-20 right-6 text-lg opacity-40">🌸</div>

                <!-- Pet -->
                <div class="flex flex-col items-center justify-center pt-4">
                    <div class="pet-float text-8xl mb-2">🐱</div>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="heart-pulse text-red-400">❤️</span>
                        <span class="text-sm font-semibold text-gray-600">Happy!</span>
                    </div>
                </div>

                <!-- Speech Bubble -->
                <div class="absolute top-4 right-6 bg-white rounded-2xl rounded-br-md px-4 py-2 shadow-sm max-w-[160px]">
                    <p class="text-xs text-gray-700">You're doing amazing today! Keep it up! 💜</p>
                </div>

                <!-- Ground -->
                <div class="absolute bottom-0 left-0 right-0 h-12 bg-gradient-to-t from-green-200/50 to-transparent rounded-b-3xl"></div>
            </div>
        </div>

        <!-- Pet Stats -->
        <div class="content-area mb-5">
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-red-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-heart text-red-400 text-lg"></i>
                    <p class="text-xs font-semibold text-gray-700 mt-1">Happiness</p>
                    <div class="w-full bg-red-100 rounded-full h-2 mt-2">
                        <div class="bg-red-400 rounded-full h-2" style="width: 85%"></div>
                    </div>
                    <span class="text-xs text-red-400 font-bold">85%</span>
                </div>
                <div class="bg-amber-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-drumstick-bite text-amber-400 text-lg"></i>
                    <p class="text-xs font-semibold text-gray-700 mt-1">Hunger</p>
                    <div class="w-full bg-amber-100 rounded-full h-2 mt-2">
                        <div class="bg-amber-400 rounded-full h-2" style="width: 60%"></div>
                    </div>
                    <span class="text-xs text-amber-400 font-bold">60%</span>
                </div>
                <div class="bg-blue-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-bolt text-blue-400 text-lg"></i>
                    <p class="text-xs font-semibold text-gray-700 mt-1">Energy</p>
                    <div class="w-full bg-blue-100 rounded-full h-2 mt-2">
                        <div class="bg-blue-400 rounded-full h-2" style="width: 72%"></div>
                    </div>
                    <span class="text-xs text-blue-400 font-bold">72%</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="content-area mb-5">
            <p class="text-sm font-semibold text-gray-700 mb-3">Interact</p>
            <div class="grid grid-cols-4 gap-3">
                <button class="action-btn flex flex-col items-center gap-1.5 bg-pink-50 rounded-2xl py-3">
                    <div class="text-2xl">🍎</div>
                    <span class="text-xs font-medium text-gray-600">Feed</span>
                </button>
                <button class="action-btn flex flex-col items-center gap-1.5 bg-violet-50 rounded-2xl py-3">
                    <div class="text-2xl">🎾</div>
                    <span class="text-xs font-medium text-gray-600">Play</span>
                </button>
                <button class="action-btn flex flex-col items-center gap-1.5 bg-blue-50 rounded-2xl py-3">
                    <div class="text-2xl">🛁</div>
                    <span class="text-xs font-medium text-gray-600">Clean</span>
                </button>
                <button class="action-btn flex flex-col items-center gap-1.5 bg-amber-50 rounded-2xl py-3">
                    <div class="text-2xl">💤</div>
                    <span class="text-xs font-medium text-gray-600">Rest</span>
                </button>
            </div>
        </div>

        <!-- Daily Missions -->
        <div class="content-area mb-5">
            <p class="text-sm font-semibold text-gray-700 mb-3">Today's Missions</p>
            <div class="space-y-2">
                <div class="flex items-center gap-3 bg-green-50 rounded-xl p-3">
                    <div class="w-8 h-8 bg-green-400 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-white text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-700 line-through">Log your mood</p>
                    </div>
                    <span class="text-xs font-bold text-green-500">+10 XP</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                    <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">
                        <i class="fas fa-circle text-gray-300 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-700">Complete breathing exercise</p>
                    </div>
                    <span class="text-xs font-bold text-gray-400">+15 XP</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                    <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">
                        <i class="fas fa-circle text-gray-300 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-700">Chat with a friend</p>
                    </div>
                    <span class="text-xs font-bold text-gray-400">+20 XP</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar bg-white border-t border-gray-100 px-6 pt-2 pb-8">
        <div class="flex items-center justify-between">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-gray-300 text-xl"></i>
                <span class="text-xs text-gray-300">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-book text-gray-300 text-xl"></i>
                <span class="text-xs text-gray-300">Log</span>
            </div>
            <div class="flex flex-col items-center gap-1 relative">
                <div class="w-12 h-12 bg-gradient-to-br from-violet-500 to-purple-600 rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-violet-200">
                    <i class="fas fa-robot text-white text-lg"></i>
                </div>
                <span class="text-xs text-gray-300">AI</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-comments text-gray-300 text-xl"></i>
                <span class="text-xs text-gray-300">Chat</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-user text-gray-300 text-xl"></i>
                <span class="text-xs text-gray-300">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
