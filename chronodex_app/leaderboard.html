<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Leaderboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0B0E1F;color:#EDEAF7;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0B0E1F}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:96px}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
.card-surface{background:#141831;border:1px solid #1F2540}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="px-7 flex items-center justify-between mb-4">
      <a href="battle.html" class="w-9 h-9 rounded-full card-surface flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></a>
      <h1 class="display text-[20px] font-600">Arena Ranks</h1>
      <div class="w-9"></div>
    </div>

    <!-- Toggle -->
    <div class="px-7 mb-5">
      <div class="card-surface rounded-full p-1 flex text-[12.5px] font-semibold">
        <span class="flex-1 text-center py-2 rounded-full holo text-white">My class</span>
        <span class="flex-1 text-center py-2 text-slate-400">Global</span>
        <span class="flex-1 text-center py-2 text-slate-400">Friends</span>
      </div>
    </div>

    <!-- Podium -->
    <div class="px-7 mb-6 flex items-end justify-center gap-3">
      <!-- 2nd -->
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full bg-cover bg-center ring-2 ring-slate-400 mb-1" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585269273-image-1.png')"></div>
        <p class="text-[11px] font-bold">Aria</p>
        <p class="text-[10px] text-slate-400 mb-1">3,180</p>
        <div class="w-[72px] h-16 rounded-t-xl bg-slate-700/50 flex items-start justify-center pt-1.5"><span class="display text-[20px] font-600 text-slate-300">2</span></div>
      </div>
      <!-- 1st -->
      <div class="flex flex-col items-center">
        <i class="fas fa-crown text-amber-400 mb-1"></i>
        <div class="w-16 h-16 rounded-full holo ring-2 ring-amber-400 mb-1"></div>
        <p class="text-[12px] font-bold">Sofia K.</p>
        <p class="text-[10px] text-amber-400 mb-1">3,402</p>
        <div class="w-[78px] h-24 rounded-t-xl holo flex items-start justify-center pt-1.5"><span class="display text-[24px] font-600 text-white">1</span></div>
      </div>
      <!-- 3rd -->
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full bg-sky-500 ring-2 ring-sky-400 mb-1 flex items-center justify-center"><i class="fas fa-user text-white"></i></div>
        <p class="text-[11px] font-bold">Noah</p>
        <p class="text-[10px] text-slate-400 mb-1">2,940</p>
        <div class="w-[72px] h-12 rounded-t-xl bg-slate-700/50 flex items-start justify-center pt-1.5"><span class="display text-[20px] font-600 text-slate-300">3</span></div>
      </div>
    </div>

    <!-- List -->
    <div class="px-7 space-y-2.5">
      <div class="card-surface rounded-2xl p-3 flex items-center gap-3">
        <span class="display text-[16px] font-600 text-slate-400 w-6 text-center">4</span>
        <div class="w-9 h-9 rounded-full bg-rose-500/30 flex items-center justify-center"><i class="fas fa-user text-rose-300 text-xs"></i></div>
        <div class="flex-1"><p class="text-[13px] font-bold">Liam</p><p class="text-[11px] text-slate-500">14 win streak</p></div>
        <span class="text-[12px] font-bold text-slate-300">2,710</span>
      </div>
      <div class="card-surface rounded-2xl p-3 flex items-center gap-3">
        <span class="display text-[16px] font-600 text-slate-400 w-6 text-center">5</span>
        <div class="w-9 h-9 rounded-full bg-emerald-500/30 flex items-center justify-center"><i class="fas fa-user text-emerald-300 text-xs"></i></div>
        <div class="flex-1"><p class="text-[13px] font-bold">Emma</p><p class="text-[11px] text-slate-500">Master of Antiquity</p></div>
        <span class="text-[12px] font-bold text-slate-300">2,520</span>
      </div>
      <div class="card-surface rounded-2xl p-3 flex items-center gap-3">
        <span class="display text-[16px] font-600 text-slate-400 w-6 text-center">6</span>
        <div class="w-9 h-9 rounded-full bg-violet-500/30 flex items-center justify-center"><i class="fas fa-user text-violet-300 text-xs"></i></div>
        <div class="flex-1"><p class="text-[13px] font-bold">Kai</p><p class="text-[11px] text-slate-500">9 win streak</p></div>
        <span class="text-[12px] font-bold text-slate-300">2,330</span>
      </div>
      <!-- You highlighted -->
      <div class="rounded-2xl p-3 flex items-center gap-3" style="background:linear-gradient(90deg,rgba(245,196,81,.16),rgba(232,80,58,.1));border:1px solid rgba(245,196,81,.4)">
        <span class="display text-[16px] font-600 text-amber-400 w-6 text-center">7</span>
        <div class="w-9 h-9 rounded-full bg-cover bg-center ring-2 ring-amber-400" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585269273-image-1.png')"></div>
        <div class="flex-1"><p class="text-[13px] font-bold">You <span class="text-amber-400">↑2</span></p><p class="text-[11px] text-slate-400">Antiquity deck</p></div>
        <span class="text-[12px] font-bold text-amber-400">2,150</span>
      </div>
    </div>

    <!-- Reward banner -->
    <div class="px-7 mt-6">
      <div class="rounded-2xl p-4 flex items-center gap-3" style="background:rgba(155,93,229,.12);border:1px solid rgba(155,93,229,.3)">
        <div class="w-11 h-11 rounded-xl bg-violet-500/25 flex items-center justify-center shrink-0"><i class="fas fa-gift text-violet-300 text-lg"></i></div>
        <div class="flex-1"><p class="text-[13px] font-bold">Top 3 win a Legendary card pack</p><p class="text-[11.5px] text-slate-400 mt-0.5">Season ends in 3 days</p></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
