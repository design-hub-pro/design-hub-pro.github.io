<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#F5C451,transparent);box-shadow:0 0 14px 2px rgba(245,196,81,.7);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%{top:6%}50%{top:90%}100%{top:6%}}
.corner{position:absolute;width:30px;height:30px;border-color:#F5C451;border-style:solid;border-width:0}
</style>
</head>
<body>
<div class="screen">
  <!-- Camera feed -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585249105-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/35"></div>

  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top bar -->
  <div class="absolute top-[68px] inset-x-0 px-7 flex items-center justify-between z-20">
    <a href="home.html" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark text-white"></i></a>
    <span class="text-[13px] font-semibold bg-black/40 backdrop-blur px-4 py-2 rounded-full">Card Scanner</span>
    <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fas fa-bolt text-amber-400"></i></button>
  </div>

  <!-- Scan frame -->
  <div class="absolute left-1/2 top-[40%] -translate-x-1/2 -translate-y-1/2 w-[256px] h-[346px]">
    <div class="absolute inset-0 rounded-3xl overflow-hidden">
      <div class="scanline"></div>
    </div>
    <div class="corner top-0 left-0 border-t-[3px] border-l-[3px] rounded-tl-2xl"></div>
    <div class="corner top-0 right-0 border-t-[3px] border-r-[3px] rounded-tr-2xl"></div>
    <div class="corner bottom-0 left-0 border-b-[3px] border-l-[3px] rounded-bl-2xl"></div>
    <div class="corner bottom-0 right-0 border-b-[3px] border-r-[3px] rounded-br-2xl"></div>
  </div>

  <!-- Recognition pill -->
  <div class="absolute left-1/2 top-[40%] translate-y-[200px] -translate-x-1/2 z-20">
    <div class="inline-flex items-center gap-2 bg-emerald-500/90 backdrop-blur px-4 py-2 rounded-full">
      <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
      <span class="text-[12.5px] font-bold">Card detected · Ember-Wing</span>
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="absolute inset-x-0 bottom-0 pb-9 pt-16 z-20" style="background:linear-gradient(180deg,transparent,rgba(0,0,0,.85))">
    <p class="text-center text-[13px] text-slate-300 mb-5">Hold a card steady inside the frame</p>
    <div class="flex items-center justify-center gap-10">
      <a href="collection.html" class="flex flex-col items-center gap-1.5 text-slate-300">
        <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center"><i class="fas fa-images text-lg"></i></div>
        <span class="text-[10px]">Binder</span>
      </a>
      <a href="card-match.html" class="w-[78px] h-[78px] rounded-full border-[5px] border-white/90 flex items-center justify-center">
        <div class="w-[58px] h-[58px] rounded-full holo flex items-center justify-center"><i class="fas fa-bolt text-white text-xl"></i></div>
      </a>
      <a href="card-match.html" class="flex flex-col items-center gap-1.5 text-slate-300">
        <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center"><i class="fas fa-keyboard text-lg"></i></div>
        <span class="text-[10px]">Manual</span>
      </a>
    </div>
  </div>
</div>
</body>
</html>
