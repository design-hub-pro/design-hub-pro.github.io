<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Timeline</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0B0E1F;color:#EDEAF7;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0B0E1F}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:112px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:90px;background:rgba(13,16,32,.88);backdrop-filter:blur(20px);border-top:1px solid #1F2540;display:flex;align-items:flex-start;justify-content:space-around;padding:12px 14px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#5A6080;width:56px}
.tab i{font-size:19px}.tab.active{color:#F5C451}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#F5C451,#E8503A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 10px 26px rgba(232,80,58,.5);margin-top:-16px}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
.card-surface{background:#141831;border:1px solid #1F2540}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="px-7 flex items-center justify-between mb-4">
      <div>
        <h1 class="display text-[26px] font-600">Time Map</h1>
        <p class="text-[12.5px] text-slate-400 mt-0.5">Walk history, era by era</p>
      </div>
      <a href="home.html" class="w-9 h-9 rounded-full card-surface flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></a>
    </div>

    <!-- Era spine -->
    <div class="px-7 pb-2">
      <div class="relative">
        <div class="absolute left-[19px] top-2 bottom-2 w-[3px] holo rounded-full"></div>

        <!-- Antiquity -->
        <a href="lesson.html" class="relative flex gap-4 mb-4">
          <div class="z-10 w-10 h-10 rounded-full holo flex items-center justify-center shrink-0 ring-4 ring-[#0B0E1F]"><i class="fas fa-fire text-white text-sm"></i></div>
          <div class="flex-1 relative rounded-2xl overflow-hidden h-[112px]">
            <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585219490-image-1.png" class="w-full h-full object-cover">
            <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,14,31,.85),rgba(11,14,31,.15))"></div>
            <div class="absolute inset-0 p-3.5 flex flex-col justify-center">
              <p class="text-amber-300 text-[10px] font-bold">753 BC – 476 AD</p>
              <p class="text-white display text-[17px] font-600 leading-tight">Antiquity</p>
              <div class="mt-1.5 flex items-center gap-2"><div class="w-20 h-1.5 rounded-full bg-white/25 overflow-hidden"><div class="h-full bg-amber-400 rounded-full" style="width:75%"></div></div><span class="text-[10px] text-slate-300">12 cards</span></div>
            </div>
          </div>
        </a>

        <!-- Middle Ages -->
        <a href="lesson.html" class="relative flex gap-4 mb-4">
          <div class="z-10 w-10 h-10 rounded-full bg-sky-500 flex items-center justify-center shrink-0 ring-4 ring-[#0B0E1F]"><i class="fas fa-chess-rook text-white text-sm"></i></div>
          <div class="flex-1 relative rounded-2xl overflow-hidden h-[112px]">
            <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585280466-image-1.png" class="w-full h-full object-cover">
            <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,14,31,.85),rgba(11,14,31,.15))"></div>
            <div class="absolute inset-0 p-3.5 flex flex-col justify-center">
              <p class="text-sky-300 text-[10px] font-bold">476 – 1450 AD</p>
              <p class="text-white display text-[17px] font-600 leading-tight">Middle Ages</p>
              <div class="mt-1.5 flex items-center gap-2"><div class="w-20 h-1.5 rounded-full bg-white/25 overflow-hidden"><div class="h-full bg-sky-400 rounded-full" style="width:45%"></div></div><span class="text-[10px] text-slate-300">9 cards</span></div>
            </div>
          </div>
        </a>

        <!-- Edo Japan -->
        <a href="lesson.html" class="relative flex gap-4 mb-4">
          <div class="z-10 w-10 h-10 rounded-full bg-rose-500 flex items-center justify-center shrink-0 ring-4 ring-[#0B0E1F]"><i class="fas fa-fan text-white text-sm"></i></div>
          <div class="flex-1 relative rounded-2xl overflow-hidden h-[112px]">
            <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585262208-image-1.png" class="w-full h-full object-cover">
            <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,14,31,.85),rgba(11,14,31,.15))"></div>
            <div class="absolute inset-0 p-3.5 flex flex-col justify-center">
              <p class="text-rose-300 text-[10px] font-bold">1603 – 1868 AD</p>
              <p class="text-white display text-[17px] font-600 leading-tight">Edo Japan</p>
              <div class="mt-1.5 flex items-center gap-2"><div class="w-20 h-1.5 rounded-full bg-white/25 overflow-hidden"><div class="h-full bg-rose-400 rounded-full" style="width:20%"></div></div><span class="text-[10px] text-slate-300">3 cards</span></div>
            </div>
          </div>
        </a>

        <!-- Locked Modern -->
        <div class="relative flex gap-4">
          <div class="z-10 w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center shrink-0 ring-4 ring-[#0B0E1F]"><i class="fas fa-lock text-slate-400 text-xs"></i></div>
          <div class="flex-1 card-surface rounded-2xl h-[80px] flex items-center px-4 border-dashed">
            <div><p class="text-[14px] font-bold text-slate-300">Age of Exploration</p><p class="text-[11px] text-slate-500">Link a Water card to unlock</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <a href="home.html" class="tab"><i class="fas fa-house"></i>Home</a>
    <a href="collection.html" class="tab active"><i class="fas fa-layer-group"></i>Dex</a>
    <a href="scan.html" class="flex flex-col items-center"><div class="fab"><i class="fas fa-camera"></i></div></a>
    <a href="battle.html" class="tab"><i class="fas fa-bolt"></i>Battle</a>
    <a href="profile.html" class="tab"><i class="fas fa-user"></i>Me</a>
  </div>
</div>
</body>
</html>
