<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0B0E1F;color:#EDEAF7;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0B0E1F}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:32px}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
.card-surface{background:#141831;border:1px solid #1F2540}
.opt{background:#141831;border:1.5px solid #1F2540}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <!-- Top: progress + hearts -->
    <div class="px-7 flex items-center gap-3 mb-6">
      <a href="lesson.html" class="text-slate-400"><i class="fas fa-xmark text-lg"></i></a>
      <div class="flex-1 h-2.5 rounded-full bg-slate-700/60 overflow-hidden"><div class="h-full holo rounded-full" style="width:60%"></div></div>
      <div class="flex items-center gap-1 text-rose-400"><i class="fas fa-heart text-sm"></i><span class="text-[13px] font-bold">3</span></div>
    </div>

    <!-- Question meta -->
    <div class="px-7 mb-3 flex items-center justify-between">
      <span class="text-[11.5px] font-bold text-amber-400 tracking-wide uppercase">Question 3 of 5</span>
      <span class="text-[11.5px] text-slate-400"><i class="fas fa-link text-amber-400 mr-1"></i>Ember-Wing power-up</span>
    </div>

    <!-- Question -->
    <div class="px-7 mb-5">
      <h1 class="display text-[24px] font-600 leading-snug">In which year did Romans overthrow their kings and found the Republic?</h1>
    </div>

    <!-- Reference image -->
    <div class="px-7 mb-6">
      <div class="relative rounded-2xl overflow-hidden h-[120px]">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585219490-image-1.png" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/20"></div>
        <span class="absolute bottom-2 left-3 text-white text-[11px] font-semibold bg-black/40 px-2 py-0.5 rounded">The Roman Forum</span>
      </div>
    </div>

    <!-- Options -->
    <div class="px-7 space-y-3">
      <button class="opt w-full rounded-2xl p-4 flex items-center gap-3.5 text-left">
        <span class="w-8 h-8 rounded-xl bg-slate-700/50 flex items-center justify-center text-[13px] font-bold text-slate-300">A</span>
        <span class="text-[14.5px] font-semibold">753 BC</span>
      </button>
      <button class="w-full rounded-2xl p-4 flex items-center gap-3.5 text-left" style="background:rgba(16,185,129,.14);border:1.5px solid #10B981">
        <span class="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center text-[13px] font-bold text-white"><i class="fas fa-check"></i></span>
        <span class="text-[14.5px] font-semibold text-emerald-300">509 BC</span>
      </button>
      <button class="opt w-full rounded-2xl p-4 flex items-center gap-3.5 text-left">
        <span class="w-8 h-8 rounded-xl bg-slate-700/50 flex items-center justify-center text-[13px] font-bold text-slate-300">C</span>
        <span class="text-[14.5px] font-semibold">264 BC</span>
      </button>
      <button class="opt w-full rounded-2xl p-4 flex items-center gap-3.5 text-left">
        <span class="w-8 h-8 rounded-xl bg-slate-700/50 flex items-center justify-center text-[13px] font-bold text-slate-300">D</span>
        <span class="text-[14.5px] font-semibold">44 BC</span>
      </button>
    </div>

    <!-- Explanation toast -->
    <div class="px-7 mt-5">
      <div class="rounded-2xl p-4" style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)">
        <p class="text-[12.5px] font-bold text-emerald-300 mb-1"><i class="fas fa-circle-check mr-1.5"></i>Correct! +25 XP</p>
        <p class="text-[12.5px] text-slate-300 leading-relaxed">In 509 BC the last king, Tarquin the Proud, was expelled — Romans swore never to be ruled by a king again.</p>
      </div>
    </div>
  </div>

  <!-- Sticky next -->
  <div class="absolute left-0 right-0 bottom-0 px-7 py-5" style="background:linear-gradient(180deg,transparent,rgba(11,14,31,.95) 35%)">
    <a href="card-detail.html" class="block w-full holo text-white text-center font-bold text-[15px] py-4 rounded-2xl shadow-xl">Next question <i class="fas fa-arrow-right ml-1.5 text-[13px]"></i></a>
  </div>
</div>
</body>
</html>
