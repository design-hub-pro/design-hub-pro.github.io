<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0B0E1F;color:#EDEAF7;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0B0E1F}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:absolute;top:0;left:0;right:0;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:0;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:112px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:90px;background:rgba(13,16,32,.88);backdrop-filter:blur(20px);border-top:1px solid #1F2540;display:flex;align-items:flex-start;justify-content:space-around;padding:12px 14px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#5A6080;width:56px}
.tab i{font-size:19px}.tab.active{color:#F5C451}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#F5C451,#E8503A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 10px 26px rgba(232,80,58,.5);margin-top:-16px}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
.card-surface{background:#141831;border:1px solid #1F2540}
.hide-sb{overflow-x:auto;scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <!-- Header banner -->
    <div class="relative h-[176px]">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585195425-image-1.png" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,14,31,.25),rgba(11,14,31,.96))"></div>
      <div class="absolute top-[68px] right-7"><button class="w-9 h-9 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fas fa-gear text-sm"></i></button></div>
    </div>

    <!-- Avatar + name -->
    <div class="px-7 -mt-12 relative">
      <div class="w-24 h-24 rounded-3xl bg-cover bg-center ring-4 ring-[#0B0E1F] shadow-xl" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585269273-image-1.png')"></div>
      <div class="flex items-center gap-2 mt-3">
        <h1 class="display text-[24px] font-600">Leo Marsh</h1>
        <span class="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded-full">LVL 12</span>
      </div>
      <p class="text-[12.5px] text-slate-400">Curator of Antiquity · joined 2025</p>

      <!-- Level progress -->
      <div class="mt-4 card-surface rounded-2xl p-4">
        <div class="flex items-center justify-between mb-2"><p class="text-[12.5px] font-semibold">Level 12 → 13</p><p class="text-[12px] text-amber-400 font-bold">1,150 / 1,500 XP</p></div>
        <div class="h-2 rounded-full bg-slate-700/60 overflow-hidden"><div class="h-full holo rounded-full" style="width:77%"></div></div>
      </div>
    </div>

    <!-- Stat grid -->
    <div class="px-7 mt-5 grid grid-cols-3 gap-2.5">
      <div class="card-surface rounded-2xl p-3.5 text-center"><p class="display text-[28px] font-600 text-amber-400 leading-none">47</p><p class="text-[10.5px] text-slate-400 mt-1.5">Cards linked</p></div>
      <div class="card-surface rounded-2xl p-3.5 text-center"><p class="display text-[28px] font-600 text-sky-400 leading-none">31</p><p class="text-[10.5px] text-slate-400 mt-1.5">Duels won</p></div>
      <div class="card-surface rounded-2xl p-3.5 text-center"><p class="display text-[28px] font-600 text-rose-400 leading-none">15</p><p class="text-[10.5px] text-slate-400 mt-1.5">Day streak</p></div>
    </div>

    <!-- Badges -->
    <div class="flex items-center justify-between px-7 mt-6 mb-3">
      <h3 class="text-[16px] font-bold">Badges</h3>
      <span class="text-[12px] text-slate-500">9 of 24</span>
    </div>
    <div class="hide-sb flex gap-3 px-7 mb-6">
      <div class="shrink-0 flex flex-col items-center gap-1.5 w-[68px]">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#F5C451,#E8503A)"><i class="fas fa-fire text-white text-lg"></i></div>
        <span class="text-[10px] text-center text-slate-300 leading-tight">Rome Scholar</span>
      </div>
      <div class="shrink-0 flex flex-col items-center gap-1.5 w-[68px]">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#38BDF8,#3B82F6)"><i class="fas fa-compass text-white text-lg"></i></div>
        <span class="text-[10px] text-center text-slate-300 leading-tight">Explorer</span>
      </div>
      <div class="shrink-0 flex flex-col items-center gap-1.5 w-[68px]">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#9B5DE5,#7C3AED)"><i class="fas fa-bolt text-white text-lg"></i></div>
        <span class="text-[10px] text-center text-slate-300 leading-tight">Duel Master</span>
      </div>
      <div class="shrink-0 flex flex-col items-center gap-1.5 w-[68px]">
        <div class="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center"><i class="fas fa-lock text-slate-600"></i></div>
        <span class="text-[10px] text-center text-slate-600 leading-tight">Locked</span>
      </div>
    </div>

    <!-- Menu list -->
    <div class="px-7 space-y-2.5">
      <a href="timeline.html" class="card-surface rounded-2xl p-3.5 flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500/15 flex items-center justify-center"><i class="fas fa-map text-amber-400"></i></div>
        <span class="flex-1 text-[14px] font-semibold">My Time Map</span>
        <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
      </a>
      <a href="leaderboard.html" class="card-surface rounded-2xl p-3.5 flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-xl bg-sky-500/15 flex items-center justify-center"><i class="fas fa-ranking-star text-sky-400"></i></div>
        <span class="flex-1 text-[14px] font-semibold">Leaderboard rank</span>
        <span class="text-[12px] text-slate-500">#7</span>
        <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
      </a>
      <a href="collection.html" class="card-surface rounded-2xl p-3.5 flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-xl bg-rose-500/15 flex items-center justify-center"><i class="fas fa-users text-rose-400"></i></div>
        <span class="flex-1 text-[14px] font-semibold">Trade with friends</span>
        <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
      </a>
      <a href="onboarding.html" class="card-surface rounded-2xl p-3.5 flex items-center gap-3.5">
        <div class="w-9 h-9 rounded-xl bg-slate-500/15 flex items-center justify-center"><i class="fas fa-circle-question text-slate-300"></i></div>
        <span class="flex-1 text-[14px] font-semibold">For parents & teachers</span>
        <i class="fas fa-chevron-right text-slate-600 text-xs"></i>
      </a>
    </div>
  </div>

  <div class="tabbar">
    <a href="home.html" class="tab"><i class="fas fa-house"></i>Home</a>
    <a href="collection.html" class="tab"><i class="fas fa-layer-group"></i>Dex</a>
    <a href="scan.html" class="flex flex-col items-center"><div class="fab"><i class="fas fa-camera"></i></div></a>
    <a href="battle.html" class="tab"><i class="fas fa-bolt"></i>Battle</a>
    <a href="profile.html" class="tab active"><i class="fas fa-user"></i>Me</a>
  </div>
</div>
</body>
</html>
