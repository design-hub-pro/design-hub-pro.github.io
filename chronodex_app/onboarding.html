<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronodex — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#0B0E1F;color:#EDEAF7;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0B0E1F}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.holo{background:linear-gradient(120deg,#F5C451,#E8503A 35%,#9B5DE5 60%,#38BDF8 85%)}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>

  <!-- Full bleed hero -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585195425-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,14,31,.35),rgba(11,14,31,.78) 55%,rgba(11,14,31,.98))"></div>

  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="absolute inset-x-0 top-[88px] flex justify-center">
    <div class="inline-flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl holo flex items-center justify-center shadow-lg"><i class="fas fa-bolt text-white text-lg"></i></div>
      <span class="text-white text-[22px] font-extrabold tracking-tight">Chronodex</span>
    </div>
  </div>

  <!-- Bottom content -->
  <div class="absolute inset-x-0 bottom-0 px-7 pb-10">
    <div class="mb-7">
      <span class="inline-block text-[11px] font-bold text-amber-400 tracking-[0.22em] uppercase mb-3">Catch history, card by card</span>
      <h1 class="display text-white text-[40px] font-600 leading-[1.04]">Your cards are<br>portals to the<br><span class="italic text-amber-400">past.</span></h1>
      <p class="text-slate-300 text-[14px] leading-relaxed mt-4 max-w-[300px]">Scan any trading card and Chronodex links it to a real moment in history — then teaches you through quests, quizzes and duels.</p>
    </div>

    <!-- Feature chips -->
    <div class="grid grid-cols-3 gap-2.5 mb-7">
      <div class="rounded-2xl bg-white/8 border border-white/10 p-3 text-center">
        <i class="fas fa-camera text-amber-400 text-lg"></i>
        <p class="text-[11px] font-semibold text-white mt-1.5">Scan</p>
      </div>
      <div class="rounded-2xl bg-white/8 border border-white/10 p-3 text-center">
        <i class="fas fa-book-open text-sky-400 text-lg"></i>
        <p class="text-[11px] font-semibold text-white mt-1.5">Learn</p>
      </div>
      <div class="rounded-2xl bg-white/8 border border-white/10 p-3 text-center">
        <i class="fas fa-bolt text-rose-400 text-lg"></i>
        <p class="text-[11px] font-semibold text-white mt-1.5">Duel</p>
      </div>
    </div>

    <a href="home.html" class="block w-full holo text-white text-center font-bold text-[16px] py-4 rounded-2xl shadow-xl">Start your collection</a>
    <div class="flex items-center justify-center gap-3 mt-4">
      <div class="flex -space-x-2.5">
        <div class="w-7 h-7 rounded-full bg-cover bg-center ring-2 ring-[#0B0E1F]" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782585269273-image-1.png')"></div>
        <div class="w-7 h-7 rounded-full holo ring-2 ring-[#0B0E1F]"></div>
        <div class="w-7 h-7 rounded-full bg-sky-500 ring-2 ring-[#0B0E1F] flex items-center justify-center text-[9px] font-bold">+9</div>
      </div>
      <p class="text-slate-400 text-[12px]">Join <span class="text-white font-semibold">90k+</span> young historians</p>
    </div>
  </div>
</div>
</body>
</html>
