<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundGuard - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            height: 750px;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="alertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#fee2e2;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="locationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
                </filter>
            </defs>

            <!-- Background -->
            <rect width="1200" height="700" fill="url(#bgGrad)"/>

            <!-- Title -->
            <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e3a5f">SoundGuard System - Use Case Diagram</text>
            <text x="600" y="62" text-anchor="middle" font-size="14" fill="#64748b">Intelligent Multi-Device Sound Triangulation for Deaf Safety</text>

            <!-- System Boundary -->
            <rect x="280" y="85" width="640" height="530" rx="20" fill="url(#systemGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
            <text x="600" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">SoundGuard System</text>

            <!-- Primary User (Deaf User) -->
            <g transform="translate(100, 250)">
                <circle cx="40" cy="30" r="25" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
                <line x1="40" y1="55" x2="40" y2="100" stroke="#1e40af" stroke-width="3"/>
                <line x1="40" y1="70" x2="15" y2="90" stroke="#1e40af" stroke-width="3"/>
                <line x1="40" y1="70" x2="65" y2="90" stroke="#1e40af" stroke-width="3"/>
                <line x1="40" y1="100" x2="20" y2="135" stroke="#1e40af" stroke-width="3"/>
                <line x1="40" y1="100" x2="60" y2="135" stroke="#1e40af" stroke-width="3"/>
                <text x="40" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">Deaf/HoH User</text>
                <text x="40" y="175" text-anchor="middle" font-size="11" fill="#64748b">Primary Actor</text>
            </g>

            <!-- Secondary User (Caregiver) -->
            <g transform="translate(100, 450)">
                <circle cx="40" cy="30" r="22" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
                <line x1="40" y1="52" x2="40" y2="90" stroke="#6d28d9" stroke-width="2.5"/>
                <line x1="40" y1="65" x2="20" y2="82" stroke="#6d28d9" stroke-width="2.5"/>
                <line x1="40" y1="65" x2="60" y2="82" stroke="#6d28d9" stroke-width="2.5"/>
                <line x1="40" y1="90" x2="25" y2="118" stroke="#6d28d9" stroke-width="2.5"/>
                <line x1="40" y1="90" x2="55" y2="118" stroke="#6d28d9" stroke-width="2.5"/>
                <text x="40" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">Caregiver</text>
                <text x="40" y="155" text-anchor="middle" font-size="11" fill="#64748b">Secondary Actor</text>
            </g>

            <!-- External System (Emergency Services) -->
            <g transform="translate(1020, 300)">
                <rect x="0" y="0" width="100" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
                <text x="50" y="30" text-anchor="middle" font-size="11" fill="#92400e">Emergency</text>
                <text x="50" y="45" text-anchor="middle" font-size="11" fill="#92400e">Services</text>
                <text x="50" y="60" text-anchor="middle" font-size="10" fill="#b45309">«external»</text>
            </g>

            <!-- Cloud System -->
            <g transform="translate(1020, 420)">
                <rect x="0" y="0" width="100" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
                <text x="50" y="30" text-anchor="middle" font-size="11" fill="#1e40af">Cloud</text>
                <text x="50" y="45" text-anchor="middle" font-size="11" fill="#1e40af">Server</text>
                <text x="50" y="60" text-anchor="middle" font-size="10" fill="#2563eb">«system»</text>
            </g>

            <!-- Use Case 1: Sound Detection -->
            <ellipse cx="420" cy="180" rx="95" ry="40" fill="url(#useCaseGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
            <text x="420" y="175" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">Detect Dangerous</text>
            <text x="420" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">Sounds</text>

            <!-- Use Case 2: AI Classification -->
            <ellipse cx="700" cy="180" rx="95" ry="40" fill="url(#aiGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
            <text x="700" y="175" text-anchor="middle" font-size="12" font-weight="500" fill="#065f46">AI Sound</text>
            <text x="700" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#065f46">Classification</text>

            <!-- Use Case 3: Receive Alerts -->
            <ellipse cx="420" cy="290" rx="95" ry="40" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
            <text x="420" y="285" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Receive Haptic/</text>
            <text x="420" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Visual Alerts</text>

            <!-- Use Case 4: Triangulate Location -->
            <ellipse cx="700" cy="290" rx="95" ry="40" fill="url(#locationGrad)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
            <text x="700" y="285" text-anchor="middle" font-size="12" font-weight="500" fill="#3730a3">Triangulate Sound</text>
            <text x="700" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#3730a3">Location</text>

            <!-- Use Case 5: View Alert History -->
            <ellipse cx="420" cy="400" rx="95" ry="40" fill="url(#useCaseGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
            <text x="420" y="395" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">View Alert</text>
            <text x="420" y="412" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">History</text>

            <!-- Use Case 6: Configure Settings -->
            <ellipse cx="700" cy="400" rx="95" ry="40" fill="url(#useCaseGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
            <text x="700" y="395" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">Configure Device</text>
            <text x="700" y="412" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">Settings</text>

            <!-- Use Case 7: Emergency Contact -->
            <ellipse cx="560" cy="510" rx="95" ry="40" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
            <text x="560" y="505" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Contact Emergency</text>
            <text x="560" y="522" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Services</text>

            <!-- Connection lines from Deaf User -->
            <line x1="165" y1="280" x2="325" y2="200" stroke="#3b82f6" stroke-width="2"/>
            <line x1="165" y1="300" x2="325" y2="290" stroke="#3b82f6" stroke-width="2"/>
            <line x1="165" y1="320" x2="325" y2="390" stroke="#3b82f6" stroke-width="2"/>
            <line x1="165" y1="340" x2="465" y2="500" stroke="#3b82f6" stroke-width="2"/>
            <line x1="165" y1="300" x2="605" y2="390" stroke="#3b82f6" stroke-width="2"/>

            <!-- Connection lines from Caregiver -->
            <line x1="165" y1="495" x2="325" y2="410" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="165" y1="510" x2="465" y2="510" stroke="#8b5cf6" stroke-width="2"/>

            <!-- Include relationships -->
            <line x1="510" y1="180" x2="605" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4"/>
            <text x="558" y="170" text-anchor="middle" font-size="10" fill="#065f46">«include»</text>

            <line x1="510" y1="290" x2="605" y2="290" stroke="#6366f1" stroke-width="2" stroke-dasharray="8,4"/>
            <text x="558" y="280" text-anchor="middle" font-size="10" fill="#3730a3">«include»</text>

            <!-- Extend relationship -->
            <line x1="560" y1="470" x2="560" y2="340" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
            <text x="530" y="420" text-anchor="middle" font-size="10" fill="#991b1b">«extend»</text>

            <!-- Connection to External Systems -->
            <line x1="655" y1="510" x2="1020" y2="340" stroke="#f59e0b" stroke-width="2"/>
            <line x1="795" y1="400" x2="1020" y2="455" stroke="#3b82f6" stroke-width="2"/>
            <line x1="795" y1="290" x2="1020" y2="320" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>

            <!-- Legend -->
            <rect x="30" y="620" width="340" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
            <text x="50" y="642" font-size="12" font-weight="bold" fill="#1e3a5f">Legend:</text>

            <ellipse cx="70" cy="662" rx="20" ry="10" fill="url(#useCaseGrad)" stroke="#f59e0b" stroke-width="1"/>
            <text x="100" y="666" font-size="10" fill="#64748b">Use Case</text>

            <line x1="170" y1="662" x2="200" y2="662" stroke="#3b82f6" stroke-width="2"/>
            <text x="210" y="666" font-size="10" fill="#64748b">Association</text>

            <line x1="280" y1="662" x2="310" y2="662" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
            <text x="320" y="666" font-size="10" fill="#64748b">Include/Extend</text>

            <!-- Feature badges -->
            <rect x="850" y="620" width="320" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
            <text x="870" y="642" font-size="12" font-weight="bold" fill="#1e3a5f">Key Features:</text>

            <rect x="870" y="652" width="90" height="22" rx="11" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
            <text x="915" y="667" text-anchor="middle" font-size="9" fill="#166534">AI-Powered</text>

            <rect x="970" y="652" width="90" height="22" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
            <text x="1015" y="667" text-anchor="middle" font-size="9" fill="#1e40af">Multi-Device</text>

            <rect x="1070" y="652" width="90" height="22" rx="11" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
            <text x="1115" y="667" text-anchor="middle" font-size="9" fill="#991b1b">Real-Time</text>
        </svg>
    </div>
</body>
</html>
