<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFocus AI · Quest Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
<style>
.node{position:absolute;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.node.done{background:linear-gradient(135deg,#3fe0bf,#0fa88c)}
.node.lock{background:#c9cbe0;color:#8d91b0}
.node.now{width:90px;height:90px;background:linear-gradient(135deg,#ffd25a,#ff9f1a);color:#151a3a;box-shadow:0 8px 0 #c96f00,0 0 0 10px rgba(255,181,31,.3)}
.stars{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:11px;color:#ffb51f}
</style>
</head>
<body>
<div class="screen">
  <div class="absolute inset-0">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,16,48,.75) 0%,rgba(14,16,48,.2) 30%,rgba(14,16,48,.35) 75%,rgba(14,16,48,.8) 100%)"></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-bold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="relative px-[28px] pt-2 text-white z-10">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-[13px] font-extrabold text-white/70">World 3 of 6</p>
        <h1 class="text-[30px] font-black tracking-tight leading-tight">Fraction Forest</h1>
      </div>
      <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-earth-americas text-[18px]"></i></div>
    </div>
    <div class="flex gap-2 mt-3">
      <span class="chip bg-white/20 backdrop-blur text-white"><i class="fas fa-star text-[#ffb51f]"></i>17/33</span>
      <span class="chip bg-white/20 backdrop-blur text-white"><i class="fas fa-chart-simple text-[#3fe0bf]"></i>Level adapts</span>
    </div>
  </div>

  <!-- Path -->
  <div class="relative flex-1">
    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 436 700" preserveAspectRatio="none">
      <path d="M90 640 C 260 610, 320 560, 300 500 S 110 420, 140 340 S 330 260, 290 170 S 120 90, 160 20" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22"/>
    </svg>
    <div class="node done" style="left:54px;top:590px"><i class="fas fa-check"></i><div class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div></div>
    <div class="node done" style="left:268px;top:470px">5<div class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i></div></div>
    <div class="node done" style="left:82px;top:360px">6<div class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div></div>

    <!-- current -->
    <div class="node now" style="left:250px;top:206px">7</div>
    <div class="absolute left-[56px] top-[186px] bg-white rounded-[20px] p-3 w-[176px] shadow-xl">
      <p class="text-[15px] font-black">Share the berries</p>
      <p class="text-[12px] font-bold text-[#7a80a3]">Word problems · Fractions</p>
      <div class="flex items-center gap-1.5 mt-2"><span class="dot bg-[#16c2a3]"></span><span class="dot bg-[#16c2a3]"></span><span class="dot bg-[#d7d8ec]"></span><span class="text-[11px] font-extrabold text-[#7a80a3] ml-1">Medium</span></div>
      <span class="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-white rotate-45"></span>
    </div>

    <div class="node lock" style="left:112px;top:66px"><i class="fas fa-lock text-[20px]"></i></div>
    <div class="absolute right-[40px] top-[40px] w-[86px] h-[86px] rounded-[26px] grad-pink flex flex-col items-center justify-center text-white shadow-[0_7px_0_#a32a6c]">
      <i class="fas fa-dragon text-[28px]"></i><span class="text-[11px] font-black mt-1">BOSS</span>
    </div>
  </div>

  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="map.html" class="active"><i class="fas fa-map-location-dot"></i>Quests</a>
    <a href="mission.html" class="play-tab"><span class="pill"><i class="fas fa-play"></i></span>Play</a>
    <a href="rewards.html"><i class="fas fa-gem"></i>Rewards</a>
    <a href="parent.html"><i class="fas fa-user-group"></i>Grown-ups</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
