<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFocus AI · Rewards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-bold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="content">
    <!-- Mission complete -->
    <div class="relative rounded-[30px] overflow-hidden mt-2 mb-5 p-6 text-center text-white" style="background:linear-gradient(160deg,#7b7bff 0%,#4b45e8 60%,#2f2ab8 100%)">
      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-white/10"></div>
      <div class="absolute -bottom-16 -left-10 w-44 h-44 rounded-full bg-white/10"></div>
      <p class="relative text-[14px] font-extrabold text-white/70">Mission 7 complete</p>
      <div class="relative flex items-end justify-center gap-2 mt-3">
        <i class="fas fa-star text-[40px] text-[#ffd25a]"></i>
        <i class="fas fa-star text-[58px] text-[#ffd25a] -mb-1"></i>
        <i class="fas fa-star text-[40px] text-[#ffd25a]"></i>
      </div>
      <h1 class="relative text-[30px] font-black mt-3 leading-tight">Berry Master!</h1>
      <div class="relative inline-flex items-center gap-2 mt-3 bg-white rounded-full px-5 py-2.5 text-[#151a3a]">
        <i class="fas fa-gem text-[#ff9f1a] text-[18px]"></i><span class="text-[24px] font-black num">+120</span><span class="text-[12px] font-black text-[#5b5bf7] bg-[#ecebff] rounded-full px-2 py-0.5">x2 focus</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="card p-3 text-center">
        <div class="w-10 h-10 rounded-2xl grad-teal mx-auto flex items-center justify-center text-white"><i class="fas fa-bullseye"></i></div>
        <p class="text-[28px] font-black num leading-none mt-2">6<span class="text-[16px] text-[#7a80a3]">/7</span></p>
        <p class="text-[12px] font-extrabold text-[#7a80a3] mt-1">Correct</p>
      </div>
      <div class="card p-3 text-center">
        <div class="w-10 h-10 rounded-2xl grad-brand mx-auto flex items-center justify-center text-white"><i class="fas fa-brain"></i></div>
        <p class="text-[28px] font-black num leading-none mt-2">84<span class="text-[16px] text-[#7a80a3]">%</span></p>
        <p class="text-[12px] font-extrabold text-[#7a80a3] mt-1">In the zone</p>
      </div>
      <div class="card p-3 text-center">
        <div class="w-10 h-10 rounded-2xl grad-sun mx-auto flex items-center justify-center text-white"><i class="fas fa-mountain"></i></div>
        <p class="text-[28px] font-black num leading-none mt-2">2</p>
        <p class="text-[12px] font-extrabold text-[#7a80a3] mt-1">Kept trying</p>
      </div>
    </div>

    <!-- Next level -->
    <div class="card p-4 mb-6 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-[#e3f8f3] flex items-center justify-center"><i class="fas fa-arrow-trend-up text-[#0fa88c] text-[18px]"></i></div>
      <div class="flex-1">
        <p class="text-[16px] font-black">Next mission gets harder</p>
        <div class="flex items-center gap-1.5 mt-1"><span class="dot bg-[#16c2a3]"></span><span class="dot bg-[#16c2a3]"></span><span class="dot bg-[#16c2a3]"></span><span class="dot bg-[#d7d8ec]"></span><span class="text-[12px] font-extrabold text-[#7a80a3] ml-1">Two-step problems</span></div>
      </div>
    </div>

    <!-- Companions -->
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[20px] font-black tracking-tight">Forest friends</h2>
      <span class="text-[13px] font-extrabold text-[#7a80a3]">4 of 9</span>
    </div>
    <div class="hscroll pb-1">
      <div class="w-[120px] flex-shrink-0 text-center"><div class="h-[120px] rounded-[26px] grad-sun flex items-center justify-center shadow-[0_6px_0_#c96f00]"><i class="fas fa-otter text-white text-[46px]"></i></div><p class="text-[13px] font-black mt-2">Pebble</p></div>
      <div class="w-[120px] flex-shrink-0 text-center"><div class="h-[120px] rounded-[26px] grad-pink flex items-center justify-center shadow-[0_6px_0_#a32a6c] relative"><i class="fas fa-kiwi-bird text-white text-[46px]"></i><span class="absolute top-2 right-2 chip bg-white text-[#e0479e] !px-2 !py-0.5 !text-[10px]">NEW</span></div><p class="text-[13px] font-black mt-2">Kiwi</p></div>
      <div class="w-[120px] flex-shrink-0 text-center"><div class="h-[120px] rounded-[26px] grad-sky flex items-center justify-center shadow-[0_6px_0_#2459c2]"><i class="fas fa-frog text-white text-[46px]"></i></div><p class="text-[13px] font-black mt-2">Hops</p></div>
      <div class="w-[120px] flex-shrink-0 text-center"><div class="h-[120px] rounded-[26px] bg-[#e6e7f3] flex items-center justify-center"><i class="fas fa-lock text-[#a8acc6] text-[30px]"></i></div><p class="text-[13px] font-black mt-2 text-[#a8acc6]">400 gems</p></div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="home.html"><i class="fas fa-house"></i>Home</a>
    <a href="map.html"><i class="fas fa-map-location-dot"></i>Quests</a>
    <a href="mission.html" class="play-tab"><span class="pill"><i class="fas fa-play"></i></span>Play</a>
    <a href="rewards.html" class="active"><i class="fas fa-gem"></i>Rewards</a>
    <a href="parent.html"><i class="fas fa-user-group"></i>Grown-ups</a>
    <div class="home-ind"></div>
  </nav>
</div>
</body>
</html>
