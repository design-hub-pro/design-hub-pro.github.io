<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFocus AI · Focus Recharge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
<style>
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
</style>
</head>
<body>
<div class="screen dark" style="background:radial-gradient(120% 70% at 50% 40%,#2b2f8f 0%,#141650 55%,#0e1030 100%)">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-bold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="flex-1 flex flex-col px-[28px] pb-9">
    <div class="flex items-center justify-between pt-1">
      <span class="chip bg-white/10 text-white"><i class="fas fa-pause text-[10px]"></i>Mission paused</span>
      <span class="chip bg-white/10 text-white"><i class="far fa-clock"></i>0:38</span>
    </div>

    <h1 class="text-[32px] font-black text-center leading-tight mt-8">Recharge your<br><span class="text-[#3fe0bf]">focus power</span></h1>
    <p class="text-[15px] font-bold text-white/60 text-center mt-2">Breathe slowly. Your calm lifts the lantern.</p>

    <!-- orb -->
    <div class="relative h-[360px] mt-4">
      <div class="ring w-[330px] h-[330px] border border-white/10"></div>
      <div class="ring w-[260px] h-[260px] border border-white/15"></div>
      <div class="ring w-[200px] h-[200px]" style="background:radial-gradient(circle,rgba(63,224,191,.55) 0%,rgba(63,224,191,0) 70%)"></div>
      <div class="ring w-[140px] h-[140px] grad-teal flex items-center justify-center shadow-[0_0_80px_rgba(63,224,191,.6)]">
        <div class="text-center">
          <i class="fas fa-lightbulb text-[34px] text-white"></i>
          <p class="text-[14px] font-black mt-1">Breathe in</p>
        </div>
      </div>
      <span class="absolute left-[40px] top-[60px] w-2 h-2 rounded-full bg-[#ffd25a]"></span>
      <span class="absolute right-[50px] top-[100px] w-3 h-3 rounded-full bg-[#ffd25a]/70"></span>
      <span class="absolute left-[70px] bottom-[50px] w-2.5 h-2.5 rounded-full bg-[#3fe0bf]/70"></span>
      <span class="absolute right-[80px] bottom-[30px] w-2 h-2 rounded-full bg-white/60"></span>
    </div>

    <!-- calm meter -->
    <div class="rounded-[24px] bg-white/10 border border-white/10 p-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[14px] font-extrabold text-white/70"><i class="fas fa-brain mr-1 text-[#3fe0bf]"></i>Live from your band</span>
        <span class="text-[28px] font-black num leading-none">72<span class="text-[14px] text-white/50">/100</span></span>
      </div>
      <div class="relative h-3 rounded-full" style="background:linear-gradient(90deg,#ff6b5a,#ffb51f 45%,#3fe0bf)">
        <div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-4 border-[#0e1030]" style="left:calc(72% - 12px)"></div>
        <div class="absolute -top-1 bottom-[-4px] w-[2px] bg-white/80" style="left:60%"></div>
      </div>
      <div class="flex justify-between text-[11px] font-extrabold text-white/50 mt-2"><span>Wiggly</span><span class="text-white/80" style="margin-left:30%">Goal</span><span>Calm</span></div>
    </div>

    <div class="flex gap-3 mt-auto">
      <div class="flex-1 btn !bg-white/10 border border-white/15">Skip</div>
      <div class="flex-[2] btn btn-3d grad-teal"><i class="fas fa-play"></i>Back to quest</div>
    </div>
  </div>
</div>
</body>
</html>
