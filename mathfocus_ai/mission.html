<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFocus AI · Mission</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
<style>
.berry{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9db5,#d91a5b 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.grp{display:flex;gap:6px;padding:10px;border-radius:18px}
.opt{height:76px;border-radius:22px;background:#fff;color:#151a3a;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #c9cbe0}
</style>
</head>
<body>
<div class="screen dark">
  <div class="absolute inset-0">
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop" class="w-full h-[460px] object-cover opacity-70" alt="">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,16,48,.55) 0%,rgba(14,16,48,.3) 25%,#0e1030 50%)"></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-bold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="relative flex-1 flex flex-col px-[28px] pb-9">
    <!-- top row -->
    <div class="flex items-center gap-3 pt-1">
      <div class="w-11 h-11 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark"></i></div>
      <div class="bar flex-1 !bg-white/15 !h-3"><div class="grad-sun" style="width:58%"></div></div>
      <span class="text-[14px] font-black num">4/7</span>
    </div>

    <!-- live focus meter -->
    <div class="mt-4 rounded-[22px] bg-white/10 backdrop-blur-md border border-white/10 p-3 flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl grad-teal flex items-center justify-center"><i class="fas fa-brain"></i></div>
      <div class="flex-1">
        <div class="flex items-center justify-between">
          <span class="text-[13px] font-extrabold text-white/70">Focus power</span>
          <span class="text-[13px] font-black text-[#3fe0bf]">In the zone</span>
        </div>
        <div class="flex items-end gap-[3px] h-[24px] mt-1">
          <span class="flex-1 rounded-sm bg-[#3fe0bf]/40" style="height:35%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/40" style="height:50%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/50" style="height:45%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/50" style="height:60%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/60" style="height:72%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/60" style="height:68%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/70" style="height:80%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/80" style="height:76%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]/90" style="height:88%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]" style="height:92%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]" style="height:85%"></span><span class="flex-1 rounded-sm bg-[#3fe0bf]" style="height:95%"></span>
        </div>
      </div>
      <div class="w-14 h-14 rounded-2xl grad-sun flex flex-col items-center justify-center text-[#151a3a]"><span class="text-[20px] font-black leading-none">x2</span><span class="text-[9px] font-black">GEMS</span></div>
    </div>

    <!-- problem -->
    <div class="mt-5 rounded-[28px] bg-white text-[#151a3a] p-5">
      <div class="flex items-center gap-2 mb-2">
        <span class="chip bg-[#ecebff] text-[#5b5bf7]"><i class="fas fa-volume-high"></i>Read to me</span>
        <span class="chip bg-[#fff4dc] text-[#b86e00]">Fractions</span>
      </div>
      <p class="text-[21px] font-extrabold leading-snug">Leo picks <span class="text-[#d91a5b]">12 berries</span>. He gives <span class="text-[#5b5bf7]">3/4</span> of them to the bunnies. How many do the bunnies get?</p>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <div class="grp bg-[#ecebff] justify-center"><span class="berry"></span><span class="berry"></span><span class="berry"></span></div>
        <div class="grp bg-[#ecebff] justify-center"><span class="berry"></span><span class="berry"></span><span class="berry"></span></div>
        <div class="grp bg-[#ecebff] justify-center"><span class="berry"></span><span class="berry"></span><span class="berry"></span></div>
        <div class="grp bg-[#f5f6fc] justify-center border-2 border-dashed border-[#d7d8ec]"><span class="berry opacity-40"></span><span class="berry opacity-40"></span><span class="berry opacity-40"></span></div>
      </div>
    </div>

    <!-- answers -->
    <div class="grid grid-cols-4 gap-3 mt-5">
      <div class="opt">6</div>
      <div class="opt">8</div>
      <div class="opt !bg-[#16c2a3] !text-white !shadow-[0_6px_0_#0a7f6a]">9</div>
      <div class="opt">10</div>
    </div>

    <div class="flex gap-3 mt-auto">
      <a href="breakdown.html" class="w-[60px] h-[60px] rounded-[20px] bg-white/12 border border-white/15 flex items-center justify-center text-[#ffb51f] text-[20px]" style="background:rgba(255,255,255,.1)"><i class="fas fa-lightbulb"></i></a>
      <div class="btn btn-3d grad-teal flex-1"><i class="fas fa-check"></i>Check answer</div>
    </div>
  </div>
</div>
</body>
</html>
