<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathFocus AI · Pair Focus Band</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen" style="background:linear-gradient(180deg,#ecebff 0%,#f5f6fc 55%)">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-bold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>
  <div class="flex-1 flex flex-col px-[28px] pb-10">
    <div class="flex items-center justify-between pt-2">
      <div class="w-11 h-11 rounded-full bg-white flex items-center justify-center border border-[#e9ebf5]"><i class="fas fa-chevron-left"></i></div>
      <div class="flex gap-1.5"><span class="w-6 h-2 rounded-full bg-[#5b5bf7]"></span><span class="w-6 h-2 rounded-full bg-[#5b5bf7]"></span><span class="w-6 h-2 rounded-full bg-[#d7d8ec]"></span></div>
      <span class="text-[14px] font-extrabold text-[#7a80a3]">Step 2/3</span>
    </div>

    <h1 class="text-[34px] font-black leading-[1.1] tracking-tight mt-8">Put on your<br><span class="text-[#5b5bf7]">Focus Band</span></h1>
    <p class="text-[16px] text-[#7a80a3] font-semibold mt-3">Sensors touch your forehead and behind your ears.</p>

    <!-- Headband illustration -->
    <div class="relative mt-6 mx-auto w-[340px] h-[300px]">
      <div class="absolute inset-0 rounded-full" style="background:radial-gradient(circle,rgba(91,91,247,.22) 0%,rgba(91,91,247,0) 65%)"></div>
      <div class="absolute left-1/2 top-[40px] -translate-x-1/2 w-[200px] h-[230px] rounded-[100px] bg-[#ffd9b8] shadow-inner"></div>
      <div class="absolute left-1/2 top-[34px] -translate-x-1/2 w-[204px] h-[110px] rounded-t-[100px] bg-[#3b2a1f]"></div>
      <div class="absolute left-1/2 top-[150px] -translate-x-1/2 flex gap-12">
        <span class="w-4 h-4 rounded-full bg-[#151a3a]"></span><span class="w-4 h-4 rounded-full bg-[#151a3a]"></span>
      </div>
      <div class="absolute left-1/2 top-[190px] -translate-x-1/2 w-12 h-5 rounded-b-full border-b-[5px] border-[#151a3a]"></div>
      <!-- band -->
      <div class="absolute left-1/2 top-[96px] -translate-x-1/2 w-[236px] h-[34px] rounded-full grad-brand shadow-[0_10px_24px_rgba(75,69,232,.45)] flex items-center justify-between px-3">
        <span class="w-5 h-5 rounded-full bg-[#16c2a3] ring-4 ring-white/40"></span>
        <span class="w-5 h-5 rounded-full bg-[#16c2a3] ring-4 ring-white/40 ml-auto mr-12"></span>
        <span class="w-5 h-5 rounded-full bg-[#ffb51f] ring-4 ring-white/40 mr-12"></span>
        <span class="w-5 h-5 rounded-full bg-[#16c2a3] ring-4 ring-white/40"></span>
      </div>
      <div class="absolute right-0 top-[20px] chip bg-white text-[#151a3a] shadow-lg"><i class="fab fa-bluetooth-b text-[#5b5bf7]"></i>Connected</div>
      <div class="absolute left-0 bottom-[14px] chip bg-white text-[#151a3a] shadow-lg"><i class="fas fa-battery-three-quarters text-[#16c2a3]"></i>82%</div>
    </div>

    <!-- Sensor quality -->
    <div class="card p-4 mt-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[15px] font-extrabold">Sensor contact</span>
        <span class="text-[13px] font-extrabold text-[#ff9f1a]">3 of 4 good</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <div class="rounded-2xl bg-[#e3f8f3] py-3 text-center"><span class="dot bg-[#16c2a3]"></span><p class="text-[12px] font-extrabold mt-1">Left ear</p></div>
        <div class="rounded-2xl bg-[#e3f8f3] py-3 text-center"><span class="dot bg-[#16c2a3]"></span><p class="text-[12px] font-extrabold mt-1">Left brow</p></div>
        <div class="rounded-2xl bg-[#fff4dc] py-3 text-center"><span class="dot bg-[#ffb51f]"></span><p class="text-[12px] font-extrabold mt-1">Right brow</p></div>
        <div class="rounded-2xl bg-[#e3f8f3] py-3 text-center"><span class="dot bg-[#16c2a3]"></span><p class="text-[12px] font-extrabold mt-1">Right ear</p></div>
      </div>
      <p class="text-[13px] text-[#7a80a3] font-semibold mt-3"><i class="fas fa-hand-pointer mr-1 text-[#ff9f1a]"></i>Push hair away from your right eyebrow.</p>
    </div>

    <div class="mt-auto">
      <div class="btn btn-3d grad-brand"><i class="fas fa-brain"></i>Start 60-sec calm check</div>
    </div>
  </div>
</div>
</body>
</html>
