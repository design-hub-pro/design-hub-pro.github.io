<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formline - Capture</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
:root{--accent:#14B8A6;--accent2:#0B6F66;--ball:#CFEA3F;--warn:#F0B03C;--bad:#F2705A}
html,body{height:100%;overflow:hidden;background:#05090A}
body{-webkit-font-smoothing:antialiased;color:#fff}
.num{font-variant-numeric:tabular-nums}
.screen{position:fixed;inset:0;overflow:hidden;background:#05090A}
.feed{position:absolute;inset:0}
.feed img{width:100%;height:100%;object-fit:cover;object-position:50% 34%}
.feed .grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,10,.78) 0%,rgba(5,9,10,.05) 24%,rgba(5,9,10,.12) 50%,rgba(5,9,10,.92) 84%)}
.ov{position:absolute;inset:0}
.jt{fill:var(--ball)}
.jt.w{fill:var(--warn)}
.lim{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;opacity:.92}
.lim.w{stroke:var(--warn)}

.ui{position:absolute;inset:0;display:flex;flex-direction:column}
.status{flex:0 0 59px;padding:18px 28px 0;display:flex;align-items:center;justify-content:space-between}
.status .t{font-size:15px;font-weight:700}
.island{width:112px;height:31px;background:#000;border-radius:18px}
.sig{display:flex;gap:6px;align-items:center;font-size:12px}

.tbar{padding:10px 28px 0;display:flex;align-items:center;justify-content:space-between}
.gb{width:38px;height:38px;border-radius:50%;background:rgba(10,16,18,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:14px}
.pill{display:flex;align-items:center;gap:8px;background:rgba(10,16,18,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);padding:8px 13px;border-radius:12px}
.pill b{font-size:13px;font-weight:800;letter-spacing:-.2px}
.pill i.c{font-size:9px;opacity:.6}

.rec{margin:14px auto 0;display:flex;align-items:center;gap:8px;background:rgba(242,112,90,.18);border:1px solid rgba(242,112,90,.45);padding:6px 12px;border-radius:10px;backdrop-filter:blur(14px)}
.rec .d{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:bl 1.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.rec b{font-size:12px;font-weight:800;letter-spacing:1px}

.ang{position:absolute;background:rgba(6,12,13,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:5px 9px;display:flex;align-items:center;gap:6px}
.ang span{font-size:9px;font-weight:800;letter-spacing:1.2px;color:#9FB2B4}
.ang b{font-size:13px;font-weight:900;letter-spacing:-.3px}
.ang.ok b{color:var(--ball)}
.ang.wn b{color:var(--warn)}

.fill{flex:1}
.panel{padding:0 22px 34px}
.phases{display:flex;gap:4px;margin-bottom:14px}
.ph{flex:1;text-align:center}
.ph i{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.2);margin-bottom:6px}
.ph i.done{background:var(--accent)}
.ph i.now{background:var(--ball)}
.ph span{font-size:8.5px;font-weight:800;letter-spacing:.7px;color:rgba(255,255,255,.42)}
.ph.now span{color:var(--ball)}
.ph.done span{color:rgba(255,255,255,.72)}

.reps{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px}
.rp{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:7px 11px;backdrop-filter:blur(10px)}
.rp span{font-size:10px;font-weight:800;letter-spacing:.8px;color:rgba(255,255,255,.5)}
.rp b{font-size:14px;font-weight:900;letter-spacing:-.4px}
.rp.g b{color:var(--ball)}.rp.w b{color:var(--warn)}
.rp.live{background:rgba(207,234,63,.16);border-color:rgba(207,234,63,.5)}

.ctrls{display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.sq{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(10px)}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.shutter i{width:32px;height:32px;border-radius:9px;background:var(--bad)}
</style>
</head>
<body>
<div class="screen">
  <div class="feed">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790688880965-image-1.png" alt="">
    <div class="grade"></div>
  </div>

  <svg class="ov" viewBox="0 0 436 956" preserveAspectRatio="xMidYMid slice">
    <circle cx="218" cy="252" r="17" fill="none" stroke="#14B8A6" stroke-width="2.6" opacity=".92"/>
    <path class="lim" d="M218 285 219 430"/>
    <path class="lim" d="M190 302 246 299"/>
    <path class="lim" d="M200 432 238 430"/>
    <path class="lim" d="M190 302 168 258"/>
    <path class="lim" d="M168 258 158 214"/>
    <path class="lim w" d="M246 299 281 263"/>
    <path class="lim w" d="M281 263 307 223"/>
    <path class="lim" d="M200 432 193 543"/>
    <path class="lim" d="M193 543 186 652"/>
    <path class="lim" d="M238 430 245 539"/>
    <path class="lim" d="M245 539 251 650"/>
    <path class="lim" d="M307 223 331 196" stroke-dasharray="5 5"/>
    <circle class="jt" cx="190" cy="302" r="5.5"/><circle class="jt" cx="246" cy="299" r="5.5"/>
    <circle class="jt" cx="168" cy="258" r="5"/><circle class="jt" cx="158" cy="214" r="5"/>
    <circle class="jt w" cx="281" cy="263" r="6.5"/><circle class="jt w" cx="307" cy="223" r="5"/>
    <circle class="jt" cx="200" cy="432" r="5.5"/><circle class="jt" cx="238" cy="430" r="5.5"/>
    <circle class="jt" cx="193" cy="543" r="5"/><circle class="jt" cx="245" cy="539" r="5"/>
    <circle class="jt" cx="186" cy="652" r="4.5"/><circle class="jt" cx="251" cy="650" r="4.5"/>
    <circle cx="331" cy="196" r="7" fill="none" stroke="#CFEA3F" stroke-width="2.4"/>
  </svg>

  <div class="ang wn" style="top:246px;right:22px"><span>ELBOW</span><b class="num">142°</b></div>
  <div class="ang ok" style="top:404px;left:22px"><span>TILT</span><b class="num">19°</b></div>
  <div class="ang ok" style="top:560px;right:26px"><span>KNEE</span><b class="num">138°</b></div>

  <div class="ui">
    <div class="status">
      <span class="t num">9:41</span><div class="island"></div>
      <span class="sig"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>

    <div class="tbar">
      <div class="gb"><i class="fa-solid fa-xmark"></i></div>
      <div class="pill"><i class="fa-solid fa-crosshairs" style="font-size:11px;color:var(--ball)"></i><b>Kick Serve</b><i class="fa-solid fa-chevron-down c"></i></div>
      <div class="gb"><i class="fa-solid fa-camera-rotate"></i></div>
    </div>

    <div class="rec"><span class="d"></span><b class="num">REC 01:12</b></div>

    <div class="fill"></div>

    <div class="panel">
      <div class="phases">
        <div class="ph done"><i class="done"></i><span>STANCE</span></div>
        <div class="ph done"><i class="done"></i><span>TOSS</span></div>
        <div class="ph now"><i class="now"></i><span>TROPHY</span></div>
        <div class="ph"><i></i><span>DROP</span></div>
        <div class="ph"><i></i><span>DRIVE</span></div>
        <div class="ph"><i></i><span>CONTACT</span></div>
        <div class="ph"><i></i><span>LAND</span></div>
      </div>

      <div class="reps">
        <div class="rp live"><span>REP 6</span><b class="num">LIVE</b></div>
        <div class="rp g"><span>REP 5</span><b class="num">81</b></div>
        <div class="rp w"><span>REP 4</span><b class="num">68</b></div>
        <div class="rp g"><span>REP 3</span><b class="num">79</b></div>
        <div class="rp g"><span>REP 2</span><b class="num">84</b></div>
        <div class="rp w"><span>REP 1</span><b class="num">64</b></div>
      </div>

      <div class="ctrls">
        <div class="sq"><i class="fa-solid fa-images"></i></div>
        <div class="shutter"><i></i></div>
        <div class="sq"><i class="fa-solid fa-gauge-high"></i></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
