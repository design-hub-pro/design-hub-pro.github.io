<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formline - Setup</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
:root{--ink:#0B1316;--ink2:#2E3F45;--muted:#6A7B81;--faint:#9DACB1;--border:#E7EDEE;--surface:#F4F8F8;--accent:#0D9488;--accent2:#0B6F66;--soft:#E4F2F0;--ball:#CFEA3F;--good:#2FA36B}
html,body{height:100%;overflow:hidden}
body{background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.screen{position:relative;height:100%;display:flex;flex-direction:column;background:var(--surface)}
.status{flex:0 0 59px;padding:18px 28px 0;display:flex;align-items:center;justify-content:space-between}
.status .t{font-size:15px;font-weight:700;letter-spacing:-.2px}
.island{width:112px;height:31px;background:#000;border-radius:18px}
.sig{display:flex;gap:6px;align-items:center;font-size:12px}
.body{flex:1;overflow-y:auto;padding:0 28px 120px}
.meta{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}

.hero{position:relative;height:280px;border-radius:24px;overflow:hidden;margin-top:6px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:52% 30%}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(175deg,rgba(11,19,22,.12) 20%,rgba(11,19,22,.9) 100%)}
.hero .mark{position:absolute;top:18px;left:18px;display:flex;align-items:center;gap:9px}
.hero .mark .ic{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.hero .mark span{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.2px}
.hero .cap{position:absolute;left:20px;right:20px;bottom:18px}
.hero h1{color:#fff;font-size:34px;font-weight:900;letter-spacing:-1.1px;line-height:1.02}
.hero .facts{display:flex;gap:14px;margin-top:10px}
.hero .facts div{color:#DCE7E6;font-size:12px;font-weight:600}
.hero .facts b{color:var(--ball);font-size:15px;font-weight:800;margin-right:4px}

.seg{display:flex;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px;margin-top:12px}
.seg div{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted);border-radius:10px}
.seg div.on{background:var(--ink);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.chip{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.chip svg{color:var(--faint)}
.chip span{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15}
.chip.on{background:var(--soft);border-color:var(--accent)}
.chip.on svg{color:var(--accent2)}
.chip.on span{color:var(--accent2)}
.chip .tick{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center}

.rowset{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.row+.row{border-top:1px solid var(--border)}
.row .lb{font-size:14px;font-weight:700}
.row .pick{display:flex;gap:6px}
.row .pick b{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 11px;border-radius:9px}
.row .pick b.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.cta{position:absolute;left:0;right:0;bottom:0;padding:16px 28px 34px;background:linear-gradient(180deg,rgba(244,248,248,0) 0%,var(--surface) 34%)}
.cta button{width:100%;border:0;height:56px;border-radius:17px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 12px 26px rgba(13,148,136,.32)}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="t num">9:41</span><div class="island"></div>
    <span class="sig"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
  </div>

  <div class="body">
    <div class="hero">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790688880965-image-1.png" alt="">
      <div class="scrim"></div>
      <div class="mark"><div class="ic"><i class="fa-solid fa-wave-square"></i></div><span>Formline</span></div>
      <div class="cap">
        <h1>Build the<br>motion.</h1>
        <div class="facts">
          <div><b class="num">12</b>strokes</div>
          <div><b class="num">84</b>checkpoints</div>
          <div><b class="num">33</b>joints tracked</div>
        </div>
      </div>
    </div>

    <div class="meta" style="margin-top:22px">Rating</div>
    <div class="seg">
      <div>2.5</div><div>3.0</div><div class="on num">3.5</div><div>4.0</div><div>4.5+</div>
    </div>

    <div class="meta" style="margin-top:22px">Focus strokes <span style="color:var(--accent)">3 of 12</span></div>
    <div class="grid">
      <div class="chip on"><div class="tick"><i class="fa-solid fa-check"></i></div>
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11.5" cy="4.6" r="2.7"/><path d="M11.5 7.6v9"/><path d="M11.5 16.6 7.5 26"/><path d="M11.5 16.6 16 25.5"/><path d="M11.5 10.2 6.5 5.5"/><path d="M11.5 10.2 17.5 4.2"/><ellipse cx="19.2" cy="2.4" rx="2.3" ry="3" transform="rotate(32 19.2 2.4)"/></svg>
        <span>Kick<br>Serve</span></div>
      <div class="chip on"><div class="tick"><i class="fa-solid fa-check"></i></div>
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11.5" cy="4.6" r="2.7"/><path d="M11.5 7.6v9"/><path d="M11.5 16.6 6 25.5"/><path d="M11.5 16.6 17 26"/><path d="M11.5 11 4.5 8.6"/><path d="M11.5 11 19 13.4"/><ellipse cx="21.2" cy="14.4" rx="2.3" ry="3" transform="rotate(72 21.2 14.4)"/></svg>
        <span>Forehand<br>Topspin</span></div>
      <div class="chip on"><div class="tick"><i class="fa-solid fa-check"></i></div>
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12.5" cy="4.6" r="2.7"/><path d="M12.5 7.6v9"/><path d="M12.5 16.6 7 26"/><path d="M12.5 16.6 18 25.5"/><path d="M12.5 11 19.5 8.6"/><path d="M12.5 11 5 12.4"/><ellipse cx="2.8" cy="13.2" rx="2.3" ry="3" transform="rotate(108 2.8 13.2)"/></svg>
        <span>1H<br>Backhand</span></div>
      <div class="chip">
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11.5" cy="4.6" r="2.7"/><path d="M11.5 7.6v8.4"/><path d="M11.5 16 7.5 25"/><path d="M11.5 16 15.5 25"/><path d="M11.5 10.6 6.5 12.4"/><path d="M11.5 10.6 17 9"/><ellipse cx="19" cy="7.8" rx="2.2" ry="2.9" transform="rotate(50 19 7.8)"/></svg>
        <span>Forehand<br>Volley</span></div>
      <div class="chip">
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11.5" cy="5.2" r="2.7"/><path d="M11.5 8.2v8.6"/><path d="M11.5 16.8 6.8 25.8"/><path d="M11.5 16.8 16.2 25.8"/><path d="M11.5 10.8 7 4.6"/><path d="M11.5 10.8 16 4.2"/><ellipse cx="17.6" cy="2.2" rx="2.3" ry="3" transform="rotate(20 17.6 2.2)"/></svg>
        <span>Overhead<br>Smash</span></div>
      <div class="chip">
        <svg width="26" height="32" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11.5" cy="4.6" r="2.7"/><path d="M11.5 7.6v8.2"/><path d="M11.5 15.8 4.5 25"/><path d="M11.5 15.8 18.5 25"/><path d="M11.5 10.4 5.5 13"/><path d="M11.5 10.4 17.5 13"/></svg>
        <span>Split<br>Step</span></div>
    </div>

    <div class="rowset">
      <div class="row"><span class="lb">Racket hand</span><span class="pick"><b class="on">Right</b><b>Left</b></span></div>
      <div class="row"><span class="lb">Backhand</span><span class="pick"><b class="on">One</b><b>Two</b></span></div>
    </div>
  </div>

  <div class="cta"><button>Start first capture <i class="fa-solid fa-arrow-right" style="font-size:14px"></i></button></div>
</div>
</body>
</html>
