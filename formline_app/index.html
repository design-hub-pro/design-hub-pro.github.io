<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formline</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
body{background:#fff;color:#0B1316;-webkit-font-smoothing:antialiased}

.head{text-align:center;padding:86px 32px 58px}
.head .ic{width:76px;height:76px;border-radius:24px;background:linear-gradient(145deg,#14B8A6,#0B6F66);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:32px;box-shadow:0 16px 34px rgba(13,148,136,.3)}
.head h1{font-size:54px;font-weight:900;letter-spacing:-2.4px;margin-top:22px}
.head p{font-size:18px;font-weight:500;color:#6A7B81;margin-top:12px;letter-spacing:-.2px}

.grid{max-width:1560px;margin:0 auto;padding:0 40px 110px;display:grid;grid-template-columns:repeat(3,1fr);gap:60px 40px;justify-items:center}
.cell{text-align:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1316;box-shadow:0 30px 70px rgba(11,19,22,.22),inset 0 0 0 2px rgba(255,255,255,.08)}
.scr{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F8F8}
.scr iframe{width:100%;height:100%;border:0;display:block}
.cell .lb{margin-top:20px;font-size:14px;font-weight:800;letter-spacing:-.1px;color:#2E3F45}
</style>
</head>
<body>
  <div class="head">
    <div class="ic"><i class="fa-solid fa-wave-square"></i></div>
    <h1>Formline</h1>
    <p>Pose estimation that scores every tennis stroke you practice, phase by phase.</p>
  </div>

  <div class="grid">
    <div class="cell"><div class="frame"><div class="scr"><iframe src="onboarding.html" scrolling="no"></iframe></div></div><div class="lb">Setup</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="home.html" scrolling="no"></iframe></div></div><div class="lb">Home</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="strokes.html" scrolling="no"></iframe></div></div><div class="lb">Stroke Library</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="capture.html" scrolling="no"></iframe></div></div><div class="lb">Live Capture</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="analysis.html" scrolling="no"></iframe></div></div><div class="lb">Rep Analysis</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="stroke-detail.html" scrolling="no"></iframe></div></div><div class="lb">Stroke Detail</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="compare.html" scrolling="no"></iframe></div></div><div class="lb">Model Compare</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="progress.html" scrolling="no"></iframe></div></div><div class="lb">Progress</div></div>
    <div class="cell"><div class="frame"><div class="scr"><iframe src="profile.html" scrolling="no"></iframe></div></div><div class="lb">Profile</div></div>
  </div>
</body>
</html>
