<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodLight - Environment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #f8f7ff; }

        .status-bar { height: 59px; padding: 0 28px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; background: #f8f7ff; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 50; }

        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 85px; background: #fff; border-top: 1px solid #f0eef5; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #a0a0b0; }
        .tab-item.active { color: #6c3ce0; }
        .tab-item i { font-size: 20px; }

        .metric-card { background: #fff; border-radius: 20px; padding: 20px; border: 1px solid #f0eef5; position: relative; overflow: hidden; }
        .metric-card::before { content: ''; position: absolute; top: 0; right: 0; width: 80px; height: 80px; border-radius: 0 0 0 80px; opacity: 0.1; }

        .gauge-circle { width: 160px; height: 160px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .gauge-bg { stroke: #e5e7eb; }
    </style>
</head>
<body>
    <div style="position: relative; width: 100%; min-height: 100vh; padding-bottom: 85px;">
        <!-- Status Bar -->
        <div class="status-bar" style="position: relative;">
            <div class="dynamic-island"></div>
            <span class="text-gray-800 text-xs font-semibold" style="position:relative;z-index:10;">9:41</span>
            <div class="flex items-center gap-1.5" style="position:relative;z-index:10;">
                <i class="fas fa-signal text-gray-800 text-xs"></i>
                <i class="fas fa-wifi text-gray-800 text-xs"></i>
                <i class="fas fa-battery-full text-gray-800 text-xs"></i>
            </div>
        </div>

        <!-- Header -->
        <div style="padding: 0 28px 20px;">
            <div class="flex items-center justify-between mb-5">
                <h1 class="text-2xl font-bold text-gray-900">Environment</h1>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-xs text-green-600 font-medium">Live</span>
                </div>
            </div>

            <!-- Air Quality Index - Main Gauge -->
            <div class="metric-card mb-5" style="background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 50%, #dbeafe 100%);">
                <div class="flex items-center justify-center mb-3">
                    <div class="gauge-circle">
                        <svg width="160" height="160" viewBox="0 0 160 160" style="position:absolute; transform: rotate(-90deg);">
                            <circle cx="80" cy="80" r="68" fill="none" stroke="#e0e7ff" stroke-width="10"/>
                            <circle cx="80" cy="80" r="68" fill="none" stroke="url(#gaugeGrad)" stroke-width="10" stroke-dasharray="427" stroke-dashoffset="64" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="stop-color:#8b5cf6"/>
                                    <stop offset="100%" style="stop-color:#06b6d4"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="text-center" style="z-index:10;">
                            <p class="text-4xl font-bold text-gray-900">85</p>
                            <p class="text-xs text-purple-600 font-semibold">AQI Score</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400"></div>
                    <span class="text-sm font-semibold text-gray-700">Good Air Quality</span>
                </div>
                <p class="text-xs text-gray-500 text-center mt-1">Updated 30 seconds ago</p>
            </div>

            <!-- Metric Grid -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <!-- Temperature -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-400 to-orange-500 flex items-center justify-center">
                            <i class="fas fa-temperature-half text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">Temp</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">68°F</p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                        <span class="text-[10px] text-green-600">Optimal</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-blue-400 via-green-400 to-red-400 rounded-full h-1.5" style="width:55%"></div>
                    </div>
                </div>

                <!-- Humidity -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center">
                            <i class="fas fa-droplet text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">Humidity</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">45%</p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                        <span class="text-[10px] text-green-600">Comfortable</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-yellow-300 to-blue-400 rounded-full h-1.5" style="width:45%"></div>
                    </div>
                </div>

                <!-- CO2 -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center">
                            <i class="fas fa-wind text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">CO₂</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">620<span class="text-sm font-normal text-gray-400">ppm</span></p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-yellow-400"></div>
                        <span class="text-[10px] text-yellow-600">Moderate</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-green-400 to-yellow-400 rounded-full h-1.5" style="width:62%"></div>
                    </div>
                </div>

                <!-- Noise -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-yellow-500 flex items-center justify-center">
                            <i class="fas fa-volume-low text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">Noise</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">32<span class="text-sm font-normal text-gray-400">dB</span></p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                        <span class="text-[10px] text-green-600">Quiet</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-green-300 to-green-400 rounded-full h-1.5" style="width:32%"></div>
                    </div>
                </div>

                <!-- Light -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center">
                            <i class="fas fa-sun text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">Light</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">340<span class="text-sm font-normal text-gray-400">lux</span></p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                        <span class="text-[10px] text-green-600">Good</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-indigo-300 to-yellow-400 rounded-full h-1.5" style="width:56%"></div>
                    </div>
                </div>

                <!-- PM2.5 -->
                <div class="metric-card">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center">
                            <i class="fas fa-smog text-white text-sm"></i>
                        </div>
                        <span class="text-xs text-gray-500">PM2.5</span>
                    </div>
                    <p class="text-2xl font-bold text-gray-900">12<span class="text-sm font-normal text-gray-400">µg/m³</span></p>
                    <div class="flex items-center gap-1 mt-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                        <span class="text-[10px] text-green-600">Low</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mt-2">
                        <div class="bg-gradient-to-r from-green-300 to-green-400 rounded-full h-1.5" style="width:24%"></div>
                    </div>
                </div>
            </div>

            <!-- 24h Trend -->
            <div class="metric-card">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-gray-800">24h Environment Trend</span>
                    <span class="text-[10px] bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full font-medium">Today</span>
                </div>
                <div style="position:relative; height: 100px;">
                    <svg width="100%" height="100" viewBox="0 0 340 100">
                        <!-- Grid lines -->
                        <line x1="0" y1="25" x2="340" y2="25" stroke="#f3f4f6" stroke-width="1"/>
                        <line x1="0" y1="50" x2="340" y2="50" stroke="#f3f4f6" stroke-width="1"/>
                        <line x1="0" y1="75" x2="340" y2="75" stroke="#f3f4f6" stroke-width="1"/>
                        <!-- AQI line -->
                        <polyline fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                            points="0,40 40,38 80,42 120,55 160,60 200,45 240,35 280,30 320,32 340,35"/>
                        <!-- Fill -->
                        <linearGradient id="areafill" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
                            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
                        </linearGradient>
                        <polygon fill="url(#areafill)"
                            points="0,40 40,38 80,42 120,55 160,60 200,45 240,35 280,30 320,32 340,35 340,100 0,100"/>
                        <!-- Current dot -->
                        <circle cx="340" cy="35" r="4" fill="#8b5cf6"/>
                    </svg>
                </div>
                <div class="flex justify-between mt-2">
                    <span class="text-[10px] text-gray-400">12am</span>
                    <span class="text-[10px] text-gray-400">6am</span>
                    <span class="text-[10px] text-gray-400">12pm</span>
                    <span class="text-[10px] text-gray-400">6pm</span>
                    <span class="text-[10px] text-gray-400">Now</span>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab-item">
                <i class="fas fa-house"></i>
                <span>Home</span>
            </div>
            <div class="tab-item active">
                <i class="fas fa-leaf"></i>
                <span>Environ</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-face-smile"></i>
                <span>Mood</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-chart-line"></i>
                <span>Insights</span>
            </div>
            <div class="tab-item">
                <i class="fas fa-sliders"></i>
                <span>Control</span>
            </div>
        </div>
    </div>
</body>
</html>
