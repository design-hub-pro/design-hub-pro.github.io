<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuardian AI - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            height: 750px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1400 750" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0.15" />
                </linearGradient>
                <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                </linearGradient>
                <!-- Use Case Gradients -->
                <linearGradient id="ucRed" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ef4444" />
                    <stop offset="100%" style="stop-color:#dc2626" />
                </linearGradient>
                <linearGradient id="ucOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f97316" />
                    <stop offset="100%" style="stop-color:#ea580c" />
                </linearGradient>
                <linearGradient id="ucYellow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#eab308" />
                    <stop offset="100%" style="stop-color:#ca8a04" />
                </linearGradient>
                <linearGradient id="ucGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#22c55e" />
                    <stop offset="100%" style="stop-color:#16a34a" />
                </linearGradient>
                <linearGradient id="ucBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6" />
                    <stop offset="100%" style="stop-color:#2563eb" />
                </linearGradient>
                <linearGradient id="ucPurple" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#a855f7" />
                    <stop offset="100%" style="stop-color:#9333ea" />
                </linearGradient>
                <linearGradient id="ucCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#06b6d4" />
                    <stop offset="100%" style="stop-color:#0891b2" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
                </filter>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Background Rectangle -->
            <rect width="1400" height="750" fill="url(#bgGrad)" rx="16"/>

            <!-- Title -->
            <text x="700" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">NetGuardian AI - Use Case Diagram</text>
            <text x="700" y="72" text-anchor="middle" font-size="14" fill="#64748b">Chrome Extension for Online Safety / 网络安全浏览器扩展</text>

            <!-- System Boundary -->
            <rect x="250" y="100" width="900" height="540" fill="url(#systemGrad)" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="10,5" rx="20" filter="url(#softShadow)"/>
            <text x="700" y="130" text-anchor="middle" font-size="18" font-weight="600" fill="#6d28d9">NetGuardian AI Extension System</text>

            <!-- Actor 1: Regular User (Left) -->
            <g transform="translate(70, 220)">
                <circle cx="50" cy="20" r="22" fill="url(#actorGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="42" x2="50" y2="90" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="60" x2="80" y2="60" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="25" y2="130" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="75" y2="130" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">User</text>
                <text x="50" y="178" text-anchor="middle" font-size="12" fill="#64748b">普通用户</text>
            </g>

            <!-- Actor 2: Parent/Guardian (Left Bottom) -->
            <g transform="translate(70, 420)">
                <circle cx="50" cy="20" r="22" fill="#0891b2" filter="url(#shadow)"/>
                <line x1="50" y1="42" x2="50" y2="90" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="60" x2="80" y2="60" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="25" y2="130" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="75" y2="130" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Parent</text>
                <text x="50" y="178" text-anchor="middle" font-size="12" fill="#64748b">家长/监护人</text>
            </g>

            <!-- Actor 3: Threat Database (Right) -->
            <g transform="translate(1200, 180)">
                <rect x="15" y="5" width="70" height="50" fill="#64748b" rx="8" filter="url(#shadow)"/>
                <rect x="25" y="15" width="50" height="6" fill="#94a3b8" rx="2"/>
                <rect x="25" y="26" width="50" height="6" fill="#94a3b8" rx="2"/>
                <rect x="25" y="37" width="30" height="6" fill="#94a3b8" rx="2"/>
                <text x="50" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Threat DB</text>
                <text x="50" y="95" text-anchor="middle" font-size="10" fill="#64748b">威胁数据库</text>
            </g>

            <!-- Actor 4: ML Models (Right) -->
            <g transform="translate(1200, 340)">
                <rect x="15" y="5" width="70" height="50" fill="#9333ea" rx="8" filter="url(#shadow)"/>
                <circle cx="35" cy="30" r="10" fill="none" stroke="white" stroke-width="2"/>
                <circle cx="50" cy="30" r="10" fill="none" stroke="white" stroke-width="2"/>
                <circle cx="65" cy="30" r="10" fill="none" stroke="white" stroke-width="2"/>
                <text x="50" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ML Models</text>
                <text x="50" y="95" text-anchor="middle" font-size="10" fill="#64748b">机器学习模型</text>
            </g>

            <!-- Actor 5: Cloud Sync (Right Bottom) -->
            <g transform="translate(1200, 500)">
                <ellipse cx="50" cy="25" rx="35" ry="20" fill="#3b82f6" filter="url(#shadow)"/>
                <ellipse cx="35" cy="30" rx="20" ry="12" fill="#60a5fa"/>
                <ellipse cx="65" cy="30" rx="20" ry="12" fill="#60a5fa"/>
                <text x="50" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Cloud Sync</text>
                <text x="50" y="85" text-anchor="middle" font-size="10" fill="#64748b">云端同步</text>
            </g>

            <!-- Use Cases - Row 1 -->
            <ellipse cx="400" cy="190" rx="110" ry="40" fill="url(#ucRed)" filter="url(#shadow)"/>
            <text x="400" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="white">Detect Cyberbullying</text>
            <text x="400" y="202" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">检测网络霸凌</text>

            <ellipse cx="650" cy="190" rx="110" ry="40" fill="url(#ucOrange)" filter="url(#shadow)"/>
            <text x="650" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="white">Filter Harmful Content</text>
            <text x="650" y="202" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">过滤有害内容</text>

            <ellipse cx="900" cy="190" rx="110" ry="40" fill="url(#ucYellow)" filter="url(#shadow)"/>
            <text x="900" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="white">Block Phishing Sites</text>
            <text x="900" y="202" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">阻止钓鱼网站</text>

            <!-- Use Cases - Row 2 -->
            <ellipse cx="400" cy="310" rx="110" ry="40" fill="url(#ucGreen)" filter="url(#shadow)"/>
            <text x="400" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="white">Track Screen Time</text>
            <text x="400" y="322" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">追踪屏幕时间</text>

            <ellipse cx="650" cy="310" rx="110" ry="40" fill="url(#ucBlue)" filter="url(#shadow)"/>
            <text x="650" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="white">Set Usage Limits</text>
            <text x="650" y="322" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">设置使用限制</text>

            <ellipse cx="900" cy="310" rx="110" ry="40" fill="url(#ucPurple)" filter="url(#shadow)"/>
            <text x="900" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="white">Receive Alerts</text>
            <text x="900" y="322" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">接收警报</text>

            <!-- Use Cases - Row 3 -->
            <ellipse cx="400" cy="430" rx="110" ry="40" fill="url(#ucCyan)" filter="url(#shadow)"/>
            <text x="400" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="white">View Analytics</text>
            <text x="400" y="442" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">查看分析报告</text>

            <ellipse cx="650" cy="430" rx="110" ry="40" fill="url(#ucRed)" filter="url(#shadow)"/>
            <text x="650" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="white">Manage Family</text>
            <text x="650" y="442" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">管理家庭成员</text>

            <ellipse cx="900" cy="430" rx="110" ry="40" fill="url(#ucGreen)" filter="url(#shadow)"/>
            <text x="900" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="white">Enable Focus Mode</text>
            <text x="900" y="442" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">启用专注模式</text>

            <!-- Use Cases - Row 4 -->
            <ellipse cx="550" cy="550" rx="110" ry="40" fill="url(#ucBlue)" filter="url(#shadow)"/>
            <text x="550" y="545" text-anchor="middle" font-size="12" font-weight="600" fill="white">Analyze Content</text>
            <text x="550" y="562" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">分析内容</text>

            <ellipse cx="800" cy="550" rx="110" ry="40" fill="url(#ucOrange)" filter="url(#shadow)"/>
            <text x="800" y="545" text-anchor="middle" font-size="12" font-weight="600" fill="white">Configure Settings</text>
            <text x="800" y="562" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">配置设置</text>

            <!-- Connection Lines - User -->
            <line x1="150" y1="300" x2="290" y2="190" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="320" x2="290" y2="310" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="340" x2="290" y2="430" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="310" x2="540" y2="190" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="330" x2="540" y2="310" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="320" x2="790" y2="310" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="150" y1="350" x2="790" y2="430" stroke="#7c3aed" stroke-width="2"/>
            <line x1="150" y1="360" x2="690" y2="550" stroke="#7c3aed" stroke-width="2"/>

            <!-- Connection Lines - Parent -->
            <line x1="150" y1="500" x2="290" y2="430" stroke="#0891b2" stroke-width="2"/>
            <line x1="150" y1="520" x2="540" y2="430" stroke="#0891b2" stroke-width="2"/>
            <line x1="150" y1="490" x2="540" y2="310" stroke="#0891b2" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="150" y1="510" x2="690" y2="550" stroke="#0891b2" stroke-width="2"/>

            <!-- Connection Lines - Threat DB -->
            <line x1="1200" y1="230" x2="1010" y2="190" stroke="#64748b" stroke-width="2"/>
            <line x1="1200" y1="240" x2="760" y2="190" stroke="#64748b" stroke-width="2"/>

            <!-- Connection Lines - ML Models -->
            <line x1="1200" y1="370" x2="510" y2="190" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="1200" y1="380" x2="760" y2="190" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="1200" y1="390" x2="660" y2="550" stroke="#9333ea" stroke-width="2"/>

            <!-- Connection Lines - Cloud -->
            <line x1="1200" y1="520" x2="910" y2="550" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
            <line x1="1200" y1="530" x2="510" y2="430" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>

            <!-- Include relationships -->
            <line x1="400" y1="230" x2="550" y2="510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="430" y="380" font-size="10" fill="#64748b" transform="rotate(55, 430, 380)">«include»</text>

            <line x1="650" y1="230" x2="580" y2="510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
            <text x="580" y="380" font-size="10" fill="#64748b" transform="rotate(80, 580, 380)">«include»</text>

            <!-- Legend -->
            <g transform="translate(40, 640)">
                <rect x="0" y="0" width="320" height="90" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#softShadow)"/>
                <text x="15" y="25" font-size="14" font-weight="600" fill="#1e293b">Legend / 图例</text>

                <circle cx="30" cy="50" r="8" fill="url(#actorGrad)"/>
                <text x="50" y="54" font-size="11" fill="#475569">Actor / 参与者</text>

                <ellipse cx="150" cy="50" rx="25" ry="12" fill="url(#ucGreen)"/>
                <text x="185" y="54" font-size="11" fill="#475569">Use Case / 用例</text>

                <line x1="15" y1="75" x2="55" y2="75" stroke="#7c3aed" stroke-width="2"/>
                <text x="65" y="79" font-size="11" fill="#475569">Association</text>

                <line x1="155" y1="75" x2="195" y2="75" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="205" y="79" font-size="11" fill="#475569">Include/Extend</text>
            </g>

            <!-- Protection Categories -->
            <g transform="translate(1040, 640)">
                <rect x="0" y="0" width="320" height="90" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#softShadow)"/>
                <text x="15" y="25" font-size="14" font-weight="600" fill="#1e293b">Protection Areas / 防护领域</text>
                <circle cx="25" cy="48" r="6" fill="#ef4444"/>
                <text x="40" y="52" font-size="11" fill="#475569">Abuse Detection</text>
                <circle cx="165" cy="48" r="6" fill="#f97316"/>
                <text x="180" y="52" font-size="11" fill="#475569">Harmful Content</text>
                <circle cx="25" cy="73" r="6" fill="#eab308"/>
                <text x="40" y="77" font-size="11" fill="#475569">Phishing Protection</text>
                <circle cx="165" cy="73" r="6" fill="#22c55e"/>
                <text x="180" y="77" font-size="11" fill="#475569">Digital Wellness</text>
            </g>
        </svg>
    </div>
</body>
</html>
