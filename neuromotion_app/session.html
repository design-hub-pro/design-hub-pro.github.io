<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroMotion - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #050510; color: #fff; }
        .glass-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        @keyframes wave-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .wave-anim { animation: wave-scroll 4s linear infinite; }
        .wave-anim-fast { animation: wave-scroll 2.5s linear infinite; }
        .wave-anim-slow { animation: wave-scroll 5s linear infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .rec-blink { animation: blink 1.5s ease-in-out infinite; }
        @keyframes countdown-ring { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 251; } }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-center justify-between">
        <span class="text-sm font-semibold">9:41</span>
        <div class="bg-black rounded-full px-5 py-1" style="min-width: 120px; height: 28px;"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div style="padding: 0 28px; padding-bottom: 100px; overflow-y: auto; height: calc(100% - 59px);">
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                    <i class="fas fa-arrow-left text-sm"></i>
                </div>
                <h1 class="text-xl font-bold">Live Session</h1>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full rec-blink"></div>
                <span class="text-red-400 text-xs font-semibold">REC</span>
            </div>
        </div>

        <!-- Session Timer -->
        <div class="glass-card rounded-2xl p-5 mb-5 text-center">
            <div class="flex items-center justify-center gap-3 mb-2">
                <span class="text-4xl font-bold tracking-wider">02:34</span>
            </div>
            <p class="text-gray-400 text-sm">Trial 5 of 12 · Left Hand Imagery</p>
            <div class="mt-3 h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all" style="width: 42%"></div>
            </div>
        </div>

        <!-- Current Task Card -->
        <div class="glass-card rounded-2xl p-5 mb-5 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-indigo-500/20 to-transparent rounded-bl-full"></div>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center">
                    <i class="fas fa-hand text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-lg">Imagine: Left Hand</h3>
                    <p class="text-cyan-400 text-xs">Focus on squeezing your left hand</p>
                </div>
            </div>
            <!-- Visual Cue -->
            <div class="flex justify-center py-6">
                <div class="relative">
                    <svg width="120" height="120" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
                        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#timerGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="339" stroke-dashoffset="140" transform="rotate(-90 60 60)"/>
                        <defs>
                            <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#6366f1"/>
                                <stop offset="100%" style="stop-color:#06b6d4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <i class="fas fa-hand text-3xl text-cyan-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live EEG Channels -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold">Live EEG Signals</h2>
            <span class="text-gray-400 text-xs">22 CH</span>
        </div>
        <div class="glass-card rounded-2xl p-4 mb-5">
            <div class="space-y-2">
                <!-- Channel C3 (high activity) -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-cyan-400 font-mono w-7">C3</span>
                    <div class="flex-1 h-8 overflow-hidden rounded bg-white/5">
                        <svg class="wave-anim-fast" width="200%" height="32" viewBox="0 0 800 32">
                            <path d="M0,16 Q5,2 10,16 Q15,30 20,16 Q25,4 30,16 Q35,28 40,16 Q45,6 50,16 Q55,26 60,16 Q65,3 70,16 Q75,29 80,16 Q85,5 90,16 Q95,27 100,16 Q105,4 110,16 Q115,28 120,16 Q125,6 130,16 Q135,26 140,16 Q145,3 150,16 Q155,29 160,16 Q165,5 170,16 Q175,27 180,16 Q185,4 190,16 Q195,28 200,16 Q205,6 210,16 Q215,26 220,16 Q225,3 230,16 Q235,29 240,16 Q245,5 250,16 Q255,27 260,16 Q265,4 270,16 Q275,28 280,16 Q285,6 290,16 Q295,26 300,16 Q305,3 310,16 Q315,29 320,16 Q325,5 330,16 Q335,27 340,16 Q345,4 350,16 Q355,28 360,16 Q365,6 370,16 Q375,26 380,16 Q385,3 390,16 Q395,29 400,16" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
                            <path d="M400,16 Q405,2 410,16 Q415,30 420,16 Q425,4 430,16 Q435,28 440,16 Q445,6 450,16 Q455,26 460,16 Q465,3 470,16 Q475,29 480,16 Q485,5 490,16 Q495,27 500,16 Q505,4 510,16 Q515,28 520,16 Q525,6 530,16 Q535,26 540,16 Q545,3 550,16 Q555,29 560,16 Q565,5 570,16 Q575,27 580,16 Q585,4 590,16 Q595,28 600,16 Q605,6 610,16 Q615,26 620,16 Q625,3 630,16 Q635,29 640,16 Q645,5 650,16 Q655,27 660,16 Q665,4 670,16 Q675,28 680,16 Q685,6 690,16 Q695,26 700,16 Q705,3 710,16 Q715,29 720,16 Q725,5 730,16 Q735,27 740,16 Q745,4 750,16 Q755,28 760,16 Q765,6 770,16 Q775,26 780,16 Q785,3 790,16 Q795,29 800,16" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
                        </svg>
                    </div>
                </div>
                <!-- Channel Cz -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-purple-400 font-mono w-7">Cz</span>
                    <div class="flex-1 h-8 overflow-hidden rounded bg-white/5">
                        <svg class="wave-anim" width="200%" height="32" viewBox="0 0 800 32">
                            <path d="M0,16 Q10,8 20,16 Q30,24 40,16 Q50,10 60,16 Q70,22 80,16 Q90,9 100,16 Q110,23 120,16 Q130,11 140,16 Q150,21 160,16 Q170,10 180,16 Q190,22 200,16 Q210,9 220,16 Q230,23 240,16 Q250,11 260,16 Q270,21 280,16 Q290,10 300,16 Q310,22 320,16 Q330,9 340,16 Q350,23 360,16 Q370,11 380,16 Q390,21 400,16" fill="none" stroke="#a855f7" stroke-width="1.5"/>
                            <path d="M400,16 Q410,8 420,16 Q430,24 440,16 Q450,10 460,16 Q470,22 480,16 Q490,9 500,16 Q510,23 520,16 Q530,11 540,16 Q550,21 560,16 Q570,10 580,16 Q590,22 600,16 Q610,9 620,16 Q630,23 640,16 Q650,11 660,16 Q670,21 680,16 Q690,10 700,16 Q710,22 720,16 Q730,9 740,16 Q750,23 760,16 Q770,11 780,16 Q790,21 800,16" fill="none" stroke="#a855f7" stroke-width="1.5"/>
                        </svg>
                    </div>
                </div>
                <!-- Channel C4 (lower activity) -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-blue-400 font-mono w-7">C4</span>
                    <div class="flex-1 h-8 overflow-hidden rounded bg-white/5">
                        <svg class="wave-anim-slow" width="200%" height="32" viewBox="0 0 800 32">
                            <path d="M0,16 Q15,12 30,16 Q45,20 60,16 Q75,13 90,16 Q105,19 120,16 Q135,12 150,16 Q165,20 180,16 Q195,13 210,16 Q225,19 240,16 Q255,12 270,16 Q285,20 300,16 Q315,13 330,16 Q345,19 360,16 Q375,12 390,16 Q395,20 400,16" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
                            <path d="M400,16 Q415,12 430,16 Q445,20 460,16 Q475,13 490,16 Q505,19 520,16 Q535,12 550,16 Q565,20 580,16 Q595,13 610,16 Q625,19 640,16 Q655,12 670,16 Q685,20 700,16 Q715,13 730,16 Q745,19 760,16 Q775,12 790,16 Q795,20 800,16" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
                        </svg>
                    </div>
                </div>
                <!-- Channel F3 -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-indigo-400 font-mono w-7">F3</span>
                    <div class="flex-1 h-8 overflow-hidden rounded bg-white/5">
                        <svg class="wave-anim" width="200%" height="32" viewBox="0 0 800 32">
                            <path d="M0,16 Q12,11 24,16 Q36,21 48,16 Q60,12 72,16 Q84,20 96,16 Q108,11 120,16 Q132,21 144,16 Q156,12 168,16 Q180,20 192,16 Q204,11 216,16 Q228,21 240,16 Q252,12 264,16 Q276,20 288,16 Q300,11 312,16 Q324,21 336,16 Q348,12 360,16 Q372,20 384,16 Q396,11 400,16" fill="none" stroke="#6366f1" stroke-width="1.5"/>
                            <path d="M400,16 Q412,11 424,16 Q436,21 448,16 Q460,12 472,16 Q484,20 496,16 Q508,11 520,16 Q532,21 544,16 Q556,12 568,16 Q580,20 592,16 Q604,11 616,16 Q628,21 640,16 Q652,12 664,16 Q676,20 688,16 Q700,11 712,16 Q724,21 736,16 Q748,12 760,16 Q772,20 784,16 Q796,11 800,16" fill="none" stroke="#6366f1" stroke-width="1.5"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="flex justify-between mt-3 text-xs text-gray-500">
                <span>0s</span>
                <span>1s</span>
                <span>2s</span>
                <span>3s</span>
                <span>4s</span>
            </div>
        </div>

        <!-- Signal Quality -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold">Signal Quality</h2>
        </div>
        <div class="glass-card rounded-2xl p-4 mb-5">
            <div class="grid grid-cols-4 gap-3">
                <div class="text-center">
                    <div class="w-10 h-10 mx-auto rounded-full bg-green-500/20 flex items-center justify-center mb-1">
                        <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                    </div>
                    <span class="text-xs text-gray-400">C3</span>
                </div>
                <div class="text-center">
                    <div class="w-10 h-10 mx-auto rounded-full bg-green-500/20 flex items-center justify-center mb-1">
                        <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                    </div>
                    <span class="text-xs text-gray-400">Cz</span>
                </div>
                <div class="text-center">
                    <div class="w-10 h-10 mx-auto rounded-full bg-green-500/20 flex items-center justify-center mb-1">
                        <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                    </div>
                    <span class="text-xs text-gray-400">C4</span>
                </div>
                <div class="text-center">
                    <div class="w-10 h-10 mx-auto rounded-full bg-yellow-500/20 flex items-center justify-center mb-1">
                        <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
                    </div>
                    <span class="text-xs text-gray-400">F3</span>
                </div>
            </div>
            <div class="flex justify-center gap-4 mt-3">
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                    <span class="text-xs text-gray-400">Good</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                    <span class="text-xs text-gray-400">Fair</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                    <span class="text-xs text-gray-400">Poor</span>
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="flex gap-3">
            <button class="flex-1 py-4 rounded-2xl bg-red-500/20 border border-red-500/30 text-red-400 font-semibold flex items-center justify-center gap-2">
                <i class="fas fa-stop"></i>
                <span>Stop</span>
            </button>
            <button class="flex-1 py-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-500 font-semibold flex items-center justify-center gap-2">
                <i class="fas fa-pause"></i>
                <span>Pause</span>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 85px; padding-bottom: 20px;" class="bg-black/90 backdrop-blur-xl border-t border-white/10 flex items-center justify-around px-4">
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-home text-gray-500"></i>
            <span class="text-xs text-gray-500">Home</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-bolt text-indigo-400"></i>
            <span class="text-xs text-indigo-400 font-medium">Session</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-chart-bar text-gray-500"></i>
            <span class="text-xs text-gray-500">Analysis</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-microchip text-gray-500"></i>
            <span class="text-xs text-gray-500">Model</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-user text-gray-500"></i>
            <span class="text-xs text-gray-500">Profile</span>
        </div>
    </div>
</body>
</html>
