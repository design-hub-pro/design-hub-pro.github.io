<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #0f0f0f; }
        .grade-glow {
            box-shadow: 0 0 60px rgba(250, 204, 21, 0.3);
        }
        .bar-fill {
            animation: fill 1s ease-out forwards;
        }
        @keyframes fill {
            from { width: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
    <div class="w-full max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <p class="text-gray-400 text-lg mb-2">Session Complete</p>
            <h1 class="text-white text-4xl font-bold">Serve Receive</h1>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-2 gap-12">
            <!-- Left: Grade -->
            <div class="text-center">
                <div class="w-48 h-48 mx-auto rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center grade-glow mb-6">
                    <div class="w-40 h-40 rounded-full bg-gray-900 flex items-center justify-center">
                        <span class="text-7xl font-bold text-yellow-400">A</span>
                    </div>
                </div>

                <!-- Stars -->
                <div class="flex justify-center gap-2 mb-8">
                    <i class="fas fa-star text-yellow-400 text-2xl"></i>
                    <i class="fas fa-star text-yellow-400 text-2xl"></i>
                    <i class="fas fa-star text-yellow-400 text-2xl"></i>
                    <i class="fas fa-star text-gray-600 text-2xl"></i>
                    <i class="fas fa-star text-gray-600 text-2xl"></i>
                </div>

                <!-- Quick Stats -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-gray-800 rounded-xl p-4">
                        <p class="text-cyan-400 text-2xl font-bold">4,250</p>
                        <p class="text-gray-500 text-xs">Score</p>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4">
                        <p class="text-green-400 text-2xl font-bold">8/10</p>
                        <p class="text-gray-500 text-xs">Success</p>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4">
                        <p class="text-yellow-400 text-2xl font-bold">x7</p>
                        <p class="text-gray-500 text-xs">Max Combo</p>
                    </div>
                </div>
            </div>

            <!-- Right: Performance -->
            <div>
                <h3 class="text-white text-xl font-semibold mb-6">Performance</h3>

                <div class="space-y-5">
                    <!-- Reaction Time -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-300">Reaction Time</span>
                            <span class="text-yellow-400 font-bold">312ms</span>
                        </div>
                        <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
                            <div class="bar-fill h-full bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-full" style="width: 78%;"></div>
                        </div>
                        <p class="text-gray-500 text-xs mt-1">Top 22% of players</p>
                    </div>

                    <!-- Position Accuracy -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-300">Position Accuracy</span>
                            <span class="text-cyan-400 font-bold">87%</span>
                        </div>
                        <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
                            <div class="bar-fill h-full bg-gradient-to-r from-cyan-400 to-cyan-500 rounded-full" style="width: 87%;"></div>
                        </div>
                        <p class="text-gray-500 text-xs mt-1">+5% from last session</p>
                    </div>

                    <!-- Form Score -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-300">Form Score</span>
                            <span class="text-green-400 font-bold">82%</span>
                        </div>
                        <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
                            <div class="bar-fill h-full bg-gradient-to-r from-green-400 to-green-500 rounded-full" style="width: 82%;"></div>
                        </div>
                        <p class="text-gray-500 text-xs mt-1">Platform angle consistent</p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-4 mt-10">
                    <button class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-black font-semibold py-4 rounded-xl transition-colors">
                        <i class="fas fa-redo mr-2"></i>Play Again
                    </button>
                    <button class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-4 rounded-xl transition-colors">
                        <i class="fas fa-home mr-2"></i>Home
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
