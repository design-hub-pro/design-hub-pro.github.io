<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #000; }
        .success-pop {
            animation: pop 0.5s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .score-fly {
            animation: fly-up 0.6s ease-out forwards;
        }
        @keyframes fly-up {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .skeleton-glow {
            filter: drop-shadow(0 0 10px #22c55e);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="relative w-full h-screen">
        <!-- Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=1920&h=1080&fit=crop" alt="Player" class="w-full h-full object-cover opacity-50">
            <div class="absolute inset-0 bg-gradient-to-b from-green-900/30 via-transparent to-black/70"></div>
        </div>

        <!-- Pose Skeleton Overlay -->
        <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-64 h-96 skeleton-glow" viewBox="0 0 100 150">
                <circle cx="50" cy="15" r="10" fill="none" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="25" x2="50" y2="65" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="40" x2="20" y2="55" stroke="#22c55e" stroke-width="3"/>
                <line x1="20" y1="55" x2="15" y2="75" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="40" x2="80" y2="55" stroke="#22c55e" stroke-width="3"/>
                <line x1="80" y1="55" x2="85" y2="75" stroke="#22c55e" stroke-width="3"/>
                <line x1="15" y1="75" x2="85" y2="75" stroke="#22c55e" stroke-width="4"/>
                <line x1="50" y1="65" x2="35" y2="105" stroke="#22c55e" stroke-width="3"/>
                <line x1="35" y1="105" x2="30" y2="140" stroke="#22c55e" stroke-width="3"/>
                <line x1="50" y1="65" x2="65" y2="105" stroke="#22c55e" stroke-width="3"/>
                <line x1="65" y1="105" x2="70" y2="140" stroke="#22c55e" stroke-width="3"/>
            </svg>
        </div>

        <!-- Success Banner -->
        <div class="absolute top-1/4 left-0 right-0 text-center success-pop">
            <div class="inline-flex items-center gap-4 bg-green-500 rounded-2xl px-10 py-5">
                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-green-500 text-2xl"></i>
                </div>
                <div class="text-left">
                    <p class="text-white/80 text-sm">PERFECT REACTION</p>
                    <h2 class="text-white text-4xl font-bold">Great Dig!</h2>
                </div>
            </div>
        </div>

        <!-- Score Popup -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 score-fly" style="animation-delay: 0.3s;">
            <p class="text-7xl font-bold text-yellow-400" style="text-shadow: 0 0 40px rgba(250,204,21,0.5);">+350</p>
        </div>

        <!-- Stats Bar -->
        <div class="absolute bottom-12 left-0 right-0 px-8">
            <div class="max-w-4xl mx-auto">
                <div class="bg-black/70 backdrop-blur-lg rounded-2xl p-8">
                    <div class="grid grid-cols-3 gap-8 text-center">
                        <div>
                            <div class="w-20 h-20 mx-auto bg-green-500/20 rounded-2xl flex items-center justify-center mb-3 border border-green-500/50">
                                <span class="text-green-400 text-3xl font-bold">287</span>
                            </div>
                            <p class="text-gray-400 text-sm">Reaction Time (ms)</p>
                            <p class="text-green-400 font-medium">Excellent</p>
                        </div>
                        <div>
                            <div class="w-20 h-20 mx-auto bg-cyan-500/20 rounded-2xl flex items-center justify-center mb-3 border border-cyan-500/50">
                                <span class="text-cyan-400 text-3xl font-bold">94%</span>
                            </div>
                            <p class="text-gray-400 text-sm">Position Accuracy</p>
                            <p class="text-cyan-400 font-medium">On Target</p>
                        </div>
                        <div>
                            <div class="w-20 h-20 mx-auto bg-purple-500/20 rounded-2xl flex items-center justify-center mb-3 border border-purple-500/50">
                                <span class="text-purple-400 text-3xl font-bold">88°</span>
                            </div>
                            <p class="text-gray-400 text-sm">Platform Angle</p>
                            <p class="text-purple-400 font-medium">Good</p>
                        </div>
                    </div>

                    <div class="mt-6 pt-6 border-t border-white/10 flex items-center justify-center gap-2">
                        <span class="text-gray-400">Next scenario in</span>
                        <span class="text-cyan-400 font-bold text-xl">1.5s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
