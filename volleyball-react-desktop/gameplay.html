<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Gameplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #000; }
        .ball-fly {
            animation: fly 0.8s ease-out forwards;
        }
        @keyframes fly {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .target-pulse {
            animation: target 0.5s ease-in-out infinite alternate;
        }
        @keyframes target {
            from { transform: scale(1); opacity: 0.7; }
            to { transform: scale(1.1); opacity: 1; }
        }
        .trajectory {
            stroke-dasharray: 8;
            animation: dash 0.3s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -16; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Full Screen Game View -->
    <div class="relative w-full h-screen">
        <!-- Court Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1592656094267-764a45160876?w=1920&h=1080&fit=crop" alt="Court" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/50"></div>
        </div>

        <!-- Top HUD -->
        <div class="absolute top-6 left-0 right-0 px-8">
            <div class="flex items-center justify-between max-w-5xl mx-auto">
                <!-- Score -->
                <div class="bg-black/60 backdrop-blur-lg rounded-xl px-6 py-3">
                    <p class="text-gray-400 text-xs mb-1">SCORE</p>
                    <p class="text-white text-3xl font-bold">2,450</p>
                </div>

                <!-- Round -->
                <div class="bg-black/60 backdrop-blur-lg rounded-full px-8 py-4">
                    <p class="text-white text-xl font-semibold">Round 5 / 10</p>
                </div>

                <!-- Timer -->
                <div class="bg-black/60 backdrop-blur-lg rounded-xl px-6 py-3">
                    <p class="text-gray-400 text-xs mb-1">REACT IN</p>
                    <p class="text-red-400 text-3xl font-bold">0.8s</p>
                </div>
            </div>
        </div>

        <!-- Game Elements -->
        <div class="absolute inset-0">
            <!-- Ball Trajectory -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none">
                <path d="M 300 200 Q 600 400 900 550" stroke="#22d3ee" stroke-width="3" fill="none" class="trajectory" opacity="0.6"/>
            </svg>

            <!-- Incoming Ball -->
            <div class="absolute top-[20%] left-[20%] ball-fly">
                <div class="relative">
                    <div class="w-20 h-20 rounded-full bg-gradient-to-br from-white via-yellow-100 to-yellow-200 shadow-2xl shadow-yellow-400/30 flex items-center justify-center">
                        <div class="w-16 h-16 rounded-full border-2 border-dashed border-blue-400/40"></div>
                    </div>
                    <div class="absolute -top-10 left-1/2 -translate-x-1/2 bg-red-500 text-white text-sm font-bold px-3 py-1 rounded-full whitespace-nowrap">
                        75 km/h
                    </div>
                </div>
            </div>

            <!-- Target Zone -->
            <div class="absolute bottom-[25%] right-[25%] target-pulse">
                <div class="relative">
                    <div class="w-40 h-40 rounded-full border-4 border-dashed border-cyan-400/50"></div>
                    <div class="absolute inset-4 rounded-full border-4 border-cyan-400 flex items-center justify-center">
                        <div class="w-12 h-12 bg-cyan-400 rounded-full flex items-center justify-center">
                            <i class="fas fa-crosshairs text-black text-xl"></i>
                        </div>
                    </div>
                    <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 bg-cyan-500 text-black text-sm font-bold px-4 py-2 rounded-full whitespace-nowrap">
                        MOVE HERE
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="absolute bottom-8 left-0 right-0 px-8">
            <div class="max-w-3xl mx-auto">
                <div class="bg-gradient-to-r from-orange-500 to-red-500 rounded-2xl p-6 flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-16 h-16 bg-white/20 rounded-xl flex items-center justify-center">
                            <i class="fas fa-arrow-right text-white text-3xl"></i>
                        </div>
                        <div>
                            <p class="text-white/70 text-sm">INCOMING SERVE</p>
                            <h2 class="text-white text-3xl font-bold">Move Right!</h2>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-white/60 text-sm">Position</p>
                        <p class="text-white text-2xl font-bold">42%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
