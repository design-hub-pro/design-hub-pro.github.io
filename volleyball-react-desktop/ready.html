<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyReact - Get Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; }
        .pulse-ring {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .skeleton-flash {
            animation: flash 1s ease-in-out infinite alternate;
        }
        @keyframes flash {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-6xl px-8">
        <div class="grid grid-cols-2 gap-16 items-center">
            <!-- Left: Camera Feed -->
            <div class="relative">
                <div class="aspect-[4/3] bg-gray-900 rounded-2xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=800&h=600&fit=crop" alt="Player" class="w-full h-full object-cover opacity-70">

                    <!-- Pose Skeleton Overlay -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <svg class="w-48 h-72 skeleton-flash" viewBox="0 0 100 150">
                            <circle cx="50" cy="15" r="10" fill="none" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="50" y1="25" x2="50" y2="65" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="50" y1="35" x2="25" y2="55" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="25" y1="55" x2="30" y2="70" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="50" y1="35" x2="75" y2="55" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="75" y1="55" x2="70" y2="70" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="50" y1="65" x2="35" y2="100" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="35" y1="100" x2="30" y2="130" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="50" y1="65" x2="65" y2="100" stroke="#22d3ee" stroke-width="2"/>
                            <line x1="65" y1="100" x2="70" y2="130" stroke="#22d3ee" stroke-width="2"/>
                        </svg>
                    </div>

                    <!-- Detection Status -->
                    <div class="absolute top-4 left-4 bg-green-500/90 backdrop-blur px-4 py-2 rounded-lg flex items-center gap-2">
                        <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                        <span class="text-white text-sm font-medium">Pose Detected</span>
                    </div>
                </div>
            </div>

            <!-- Right: Countdown -->
            <div class="text-center">
                <p class="text-gray-400 text-lg mb-4">Get into ready position</p>

                <!-- Countdown Number -->
                <div class="pulse-ring inline-block mb-8">
                    <div class="w-48 h-48 rounded-full border-4 border-cyan-500 flex items-center justify-center">
                        <span class="text-8xl font-bold text-cyan-400">3</span>
                    </div>
                </div>

                <h2 class="text-white text-3xl font-bold mb-8">Serve Receive</h2>

                <!-- Instructions -->
                <div class="bg-gray-900 rounded-xl p-6 text-left max-w-sm mx-auto">
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center text-cyan-400 font-bold">1</div>
                            <p class="text-gray-300">Stand in athletic ready stance</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center text-cyan-400 font-bold">2</div>
                            <p class="text-gray-300">Watch for the incoming ball</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center text-cyan-400 font-bold">3</div>
                            <p class="text-gray-300">Move to the target zone</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
