<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawHealth AI - Onboarding</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; background: #fff; }

.status-bar { height: 59px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 8px; position: relative; z-index: 10; }
.status-time { font-size: 17px; font-weight: 600; }
.status-icons { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20; }

.screen { display: flex; flex-direction: column; height: calc(100% - 59px); }

.hero-section { flex: 1; position: relative; overflow: hidden; }
.hero-section img { width: 100%; height: 100%; object-fit: cover; }
.hero-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(transparent, #fff); }

.bottom-section { padding: 0 28px 50px; background: #fff; position: relative; z-index: 5; margin-top: -80px; }

.app-logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #007aff, #5856d6); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,122,255,0.3); }

.app-title { font-size: 34px; font-weight: 800; color: #1c1c1e; line-height: 1.1; }
.app-title span { background: linear-gradient(135deg, #007aff, #5856d6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.app-subtitle { font-size: 16px; color: #8e8e93; margin-top: 8px; line-height: 1.4; }

.features-row { display: flex; gap: 10px; margin: 24px 0; }
.feature-pill { display: flex; align-items: center; gap: 6px; background: #f2f2f7; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #636366; }
.feature-pill i { font-size: 14px; }
.feature-pill:nth-child(1) i { color: #ff9500; }
.feature-pill:nth-child(2) i { color: #8b5cf6; }
.feature-pill:nth-child(3) i { color: #34c759; }

.get-started { width: 100%; padding: 17px; background: linear-gradient(135deg, #007aff, #5856d6); color: #fff; border: none; border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,122,255,0.35); }

.sign-in { width: 100%; padding: 17px; background: #f2f2f7; color: #1c1c1e; border: none; border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center; }

.dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e5ea; }
.dot.active { width: 24px; background: #007aff; border-radius: 4px; }
</style>
</head>
<body>
<div style="position: relative;"><div class="dynamic-island"></div></div>
<div class="status-bar">
  <span class="status-time">9:41</span>
  <span class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
</div>

<div class="screen">
  <div class="hero-section">
    <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=800&q=80" alt="Happy dog">
    <div class="hero-gradient"></div>
  </div>

  <div class="bottom-section">
    <div class="app-logo"><i class="fas fa-paw"></i></div>
    <div class="app-title">Your Dog's<br>Health, <span>Decoded</span></div>
    <div class="app-subtitle">AI-powered food analysis, stool tracking, emotion detection, and behavior monitoring.</div>

    <div class="features-row">
      <div class="feature-pill"><i class="fas fa-bowl-food"></i> Food</div>
      <div class="feature-pill"><i class="fas fa-microscope"></i> Stool</div>
      <div class="feature-pill"><i class="fas fa-face-smile"></i> Mood</div>
    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <button class="get-started"><i class="fas fa-arrow-right"></i> Get Started</button>
    <button class="sign-in">I already have an account</button>
  </div>
</div>
</body>
</html>
