<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrooveClip — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-orange-500 to-amber-400 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-drum text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">GrooveClip</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A clip-on sensor that turns any quiet practice pad into a timing lesson on your phone.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Sensor</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Bluetooth</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Music Education</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Companion App</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868683809-image-1.png" alt="GrooveClip — practicing on a pad with the phone showing timing lanes"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868627320-image-1.png" alt="GrooveClip — the sensor module beside a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868633194-image-1.png" alt="GrooveClip — sensor clipped under the practice pad rim"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868639984-image-1.png" alt="GrooveClip — hands attaching the clip to a pad"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868646629-image-1.png" alt="GrooveClip — signal path from stick hit to phone lanes to weekly report"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868652888-image-1.png" alt="GrooveClip — exploded view of shell, board, piezo, battery, foot and clip"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868659228-image-1.png" alt="GrooveClip — bench test with solenoid striker and oscilloscope"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868690278-image-1.png" alt="GrooveClip — power and signal wiring concept"></div>
        </div>
    </div>
</body>
</html>
