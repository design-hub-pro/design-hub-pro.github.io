<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceEdge - Hockey Training Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a2e;
            box-shadow: 0 50px 100px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #0a0e1a;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-7xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-sky-500 to-blue-700 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-hockey-puck text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">IceEdge</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Your personal hockey training assistant — personalized schedules, game management, nutrition planning & travel coordination</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Hockey</span>
            <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Training</span>
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Nutrition</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Travel</span>
        </div>
    </div>

    <!-- Phone Screenshots Grid -->
    <div class="max-w-7xl mx-auto px-8 pb-24">
        <div class="grid grid-cols-3 gap-8 justify-items-center">

            <!-- Home -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Home Dashboard</p>
            </div>

            <!-- Training -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="training.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Training Plan</p>
            </div>

            <!-- Games -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="games.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Game Schedule</p>
            </div>

            <!-- Diet -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="diet.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Nutrition Tracker</p>
            </div>

            <!-- Travel -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="travel.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Game Travel</p>
            </div>

            <!-- Profile -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Player Profile</p>
            </div>

        </div>
    </div>
</body>
</html>
