<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtCut AI - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, sans-serif; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow-x: hidden; }
        .gradient-orange { background: linear-gradient(135deg, #FF6B35, #FF8C42); }
        .card-dark { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
        .glow-orange { box-shadow: 0 0 20px rgba(255,107,53,0.3); }
        .gradient-dark { background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%); }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="sticky top-0 z-50 bg-black/80 backdrop-blur-xl" style="padding: 14px 28px 0 28px; height: 59px; box-sizing: border-box;">
        <div class="flex justify-between items-center">
            <div class="text-sm font-semibold">9:41</div>
            <div class="w-[126px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Profile Header -->
    <div style="padding: 8px 28px 24px 28px;">
        <div class="flex items-center justify-between mb-5">
            <h1 class="text-xl font-bold">Profile</h1>
            <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-cog text-sm"></i>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <div class="w-20 h-20 rounded-full overflow-hidden ring-2 ring-orange-500 ring-offset-2 ring-offset-black">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face" class="w-full h-full object-cover" alt="">
                </div>
                <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full gradient-orange flex items-center justify-center border-2 border-black">
                    <i class="fas fa-check text-white text-[8px]"></i>
                </div>
            </div>
            <div class="flex-1">
                <h2 class="text-lg font-bold">Marcus Johnson</h2>
                <p class="text-xs text-gray-400">@marcusjhoops</p>
                <div class="flex items-center gap-1 mt-1">
                    <span class="text-[10px] bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full font-medium">Pro Creator</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div style="padding: 0 28px 20px 28px;">
        <div class="grid grid-cols-4 gap-2">
            <div class="text-center">
                <p class="text-xl font-bold">156</p>
                <p class="text-[10px] text-gray-500">Reels</p>
            </div>
            <div class="text-center">
                <p class="text-xl font-bold">24K</p>
                <p class="text-[10px] text-gray-500">Views</p>
            </div>
            <div class="text-center">
                <p class="text-xl font-bold">3.2K</p>
                <p class="text-[10px] text-gray-500">Likes</p>
            </div>
            <div class="text-center">
                <p class="text-xl font-bold">892</p>
                <p class="text-[10px] text-gray-500">Followers</p>
            </div>
        </div>
    </div>

    <!-- AI Stats Card -->
    <div style="padding: 0 28px 20px 28px;">
        <div class="gradient-orange rounded-2xl p-4 glow-orange">
            <div class="flex items-center gap-2 mb-3">
                <i class="fas fa-brain text-white text-sm"></i>
                <span class="text-sm font-bold text-white">AI Performance</span>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white/20 rounded-xl p-2.5 text-center backdrop-blur">
                    <p class="text-lg font-bold text-white">847</p>
                    <p class="text-[9px] text-white/70">Highlights Found</p>
                </div>
                <div class="bg-white/20 rounded-xl p-2.5 text-center backdrop-blur">
                    <p class="text-lg font-bold text-white">42h</p>
                    <p class="text-[9px] text-white/70">Footage Analyzed</p>
                </div>
                <div class="bg-white/20 rounded-xl p-2.5 text-center backdrop-blur">
                    <p class="text-lg font-bold text-white">96%</p>
                    <p class="text-[9px] text-white/70">Accuracy</p>
                </div>
            </div>
        </div>
    </div>

    <!-- My Reels Grid -->
    <div style="padding: 0 28px 120px 28px;">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-bold">My Reels</h2>
            <div class="flex gap-2">
                <div class="w-8 h-8 rounded-lg bg-orange-500/20 flex items-center justify-center">
                    <i class="fas fa-th text-orange-400 text-xs"></i>
                </div>
                <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center">
                    <i class="fas fa-list text-gray-500 text-xs"></i>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">12.4K</span>
                    </div>
                </div>
            </div>
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">8.7K</span>
                    </div>
                </div>
            </div>
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1608245449230-4ac19066d2d0?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">5.1K</span>
                    </div>
                </div>
            </div>
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1519861531473-9200262188bf?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">3.9K</span>
                    </div>
                </div>
            </div>
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1504450758481-7338bbe75c8e?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">2.3K</span>
                    </div>
                </div>
            </div>
            <div class="relative rounded-xl overflow-hidden" style="aspect-ratio: 9/16;">
                <img src="https://images.unsplash.com/photo-1515523110800-9415d13b84a8?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 gradient-dark"></div>
                <div class="absolute bottom-2 left-2 right-2">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-play text-white text-[8px]"></i>
                        <span class="text-[9px] text-white">1.8K</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10" style="padding: 10px 28px 30px 28px;">
        <div class="flex justify-between items-center">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-fire text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Highlights</span>
            </div>
            <div class="flex flex-col items-center gap-1 -mt-4">
                <div class="w-14 h-14 rounded-2xl gradient-orange flex items-center justify-center glow-orange">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-film text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Editor</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-user text-orange-400 text-lg"></i>
                <span class="text-[10px] text-orange-400 font-medium">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
