<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtCut AI - Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, sans-serif; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow-x: hidden; }
        .gradient-orange { background: linear-gradient(135deg, #FF6B35, #FF8C42); }
        .card-dark { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
        .glow-orange { box-shadow: 0 0 20px rgba(255,107,53,0.3); }
        .card-selected { background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.3); }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="sticky top-0 z-50 bg-black/80 backdrop-blur-xl" style="padding: 14px 28px 0 28px; height: 59px; box-sizing: border-box;">
        <div class="flex justify-between items-center">
            <div class="text-sm font-semibold">9:41</div>
            <div class="w-[126px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[10px]"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div style="padding: 8px 28px 20px 28px;">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-arrow-left text-sm"></i>
            </div>
            <h1 class="text-xl font-bold">Export & Share</h1>
        </div>
    </div>

    <!-- Preview -->
    <div style="padding: 0 28px 24px 28px;">
        <div class="relative rounded-2xl overflow-hidden" style="height: 180px;">
            <img src="https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?w=800&h=400&fit=crop" class="w-full h-full object-cover" alt="">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center">
                    <i class="fas fa-play text-white ml-1"></i>
                </div>
            </div>
            <div class="absolute bottom-3 left-3 right-3 flex justify-between items-end">
                <div>
                    <p class="text-sm font-bold">Weekend Highlights Reel</p>
                    <p class="text-[10px] text-gray-400">6 clips • 0:28 • 1080p</p>
                </div>
                <span class="text-[10px] bg-orange-500/80 px-2 py-1 rounded-full font-bold">HD</span>
            </div>
        </div>
    </div>

    <!-- Export Format -->
    <div style="padding: 0 28px 20px 28px;">
        <p class="text-gray-500 text-xs font-medium uppercase tracking-wider mb-3">Format</p>
        <div class="grid grid-cols-3 gap-3">
            <div class="card-selected rounded-2xl p-3 text-center">
                <p class="text-lg font-bold text-orange-400">9:16</p>
                <p class="text-[10px] text-gray-400 mt-0.5">Reels/TikTok</p>
            </div>
            <div class="card-dark rounded-2xl p-3 text-center">
                <p class="text-lg font-bold text-gray-400">16:9</p>
                <p class="text-[10px] text-gray-500 mt-0.5">YouTube</p>
            </div>
            <div class="card-dark rounded-2xl p-3 text-center">
                <p class="text-lg font-bold text-gray-400">1:1</p>
                <p class="text-[10px] text-gray-500 mt-0.5">Square</p>
            </div>
        </div>
    </div>

    <!-- Quality -->
    <div style="padding: 0 28px 20px 28px;">
        <p class="text-gray-500 text-xs font-medium uppercase tracking-wider mb-3">Quality</p>
        <div class="card-dark rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm">Resolution</span>
                <span class="text-sm font-semibold text-orange-400">1080p</span>
            </div>
            <div class="flex gap-2">
                <div class="flex-1 bg-white/5 rounded-lg py-2 text-center text-xs text-gray-500">720p</div>
                <div class="flex-1 bg-orange-500/20 rounded-lg py-2 text-center text-xs text-orange-400 font-medium border border-orange-500/30">1080p</div>
                <div class="flex-1 bg-white/5 rounded-lg py-2 text-center text-xs text-gray-500">4K</div>
            </div>
            <div class="flex justify-between items-center mt-4">
                <span class="text-sm">FPS</span>
                <span class="text-sm font-semibold text-orange-400">60</span>
            </div>
            <div class="flex gap-2 mt-2">
                <div class="flex-1 bg-white/5 rounded-lg py-2 text-center text-xs text-gray-500">30</div>
                <div class="flex-1 bg-orange-500/20 rounded-lg py-2 text-center text-xs text-orange-400 font-medium border border-orange-500/30">60</div>
                <div class="flex-1 bg-white/5 rounded-lg py-2 text-center text-xs text-gray-500">120</div>
            </div>
        </div>
    </div>

    <!-- Share To -->
    <div style="padding: 0 28px 24px 28px;">
        <p class="text-gray-500 text-xs font-medium uppercase tracking-wider mb-3">Share To</p>
        <div class="grid grid-cols-4 gap-3">
            <div class="flex flex-col items-center gap-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 flex items-center justify-center">
                    <i class="fab fa-instagram text-white text-xl"></i>
                </div>
                <span class="text-[10px] text-gray-400">Instagram</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-14 h-14 rounded-2xl bg-black flex items-center justify-center border border-white/10">
                    <i class="fab fa-tiktok text-white text-xl"></i>
                </div>
                <span class="text-[10px] text-gray-400">TikTok</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center">
                    <i class="fab fa-youtube text-white text-xl"></i>
                </div>
                <span class="text-[10px] text-gray-400">YouTube</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center">
                    <i class="fab fa-twitter text-white text-xl"></i>
                </div>
                <span class="text-[10px] text-gray-400">X</span>
            </div>
        </div>
    </div>

    <!-- Export Button -->
    <div style="padding: 0 28px 120px 28px;">
        <div class="gradient-orange rounded-2xl p-4 flex items-center justify-center gap-2 glow-orange">
            <i class="fas fa-download text-white"></i>
            <span class="text-white font-bold">Export Reel</span>
        </div>
        <div class="flex items-center justify-center gap-4 mt-3">
            <span class="text-[10px] text-gray-500"><i class="fas fa-file-video mr-1"></i>~24 MB</span>
            <span class="text-[10px] text-gray-500"><i class="fas fa-clock mr-1"></i>~15s to export</span>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10" style="padding: 10px 28px 30px 28px;">
        <div class="flex justify-between items-center">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-fire text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Highlights</span>
            </div>
            <div class="flex flex-col items-center gap-1 -mt-4">
                <div class="w-14 h-14 rounded-2xl gradient-orange flex items-center justify-center glow-orange">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-film text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Editor</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-user text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
