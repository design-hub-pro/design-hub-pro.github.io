<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtCut AI - AI Basketball Highlight Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, sans-serif; }
        body { background: #ffffff; }
        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #000;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 460px);
            gap: 40px;
            justify-content: center;
            padding: 0 40px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Hero Section -->
    <div class="text-center py-20">
        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center shadow-lg">
                <i class="fas fa-basketball-ball text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-6xl font-black text-gray-900 mb-4">CourtCut <span class="gradient-text">AI</span></h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed">AI-powered basketball highlight editor using pose estimation to automatically detect, cut, and create viral-ready short videos from game footage.</p>
        <div class="flex items-center justify-center gap-6 mt-8">
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <i class="fas fa-bone text-orange-500"></i>
                <span>Pose Estimation</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <i class="fas fa-magic text-orange-500"></i>
                <span>Auto-Edit</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <i class="fas fa-share-alt text-orange-500"></i>
                <span>Social Export</span>
            </div>
        </div>
    </div>

    <!-- Screenshots -->
    <div class="pb-20 overflow-x-auto">
        <div class="screens-grid">
            <!-- Home -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Home</p>
            </div>
            <!-- Upload -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="upload.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Upload & Process</p>
            </div>
            <!-- Highlights -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="highlights.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">AI Highlights</p>
            </div>
            <!-- Editor -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="editor.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Video Editor</p>
            </div>
            <!-- Export -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="export.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Export & Share</p>
            </div>
            <!-- Profile -->
            <div>
                <div class="phone-frame mx-auto">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Profile</p>
            </div>
        </div>
    </div>
</body>
</html>
