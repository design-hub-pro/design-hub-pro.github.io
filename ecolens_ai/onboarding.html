<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoLens AI - Welcome</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Inter', sans-serif; }
  body { background: #0d1f14; color: #fff; position: relative; }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100;
  }
  .status-time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  }

  .content { height: calc(100% - 59px); display: flex; flex-direction: column; position: relative; }

  /* Background */
  .bg-pattern {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden;
  }
  .bg-circle {
    position: absolute; border-radius: 50%; opacity: 0.1;
    border: 1px solid #2d8a4e;
  }
  .bg-circle:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -100px; }
  .bg-circle:nth-child(2) { width: 300px; height: 300px; bottom: 100px; left: -80px; }
  .bg-circle:nth-child(3) { width: 200px; height: 200px; top: 200px; right: -50px; }

  .floating-icons {
    position: absolute; top: 80px; left: 0; right: 0; height: 300px; z-index: 1;
  }
  .float-item {
    position: absolute; width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    animation: floatSlow 6s ease-in-out infinite;
  }
  .float-item:nth-child(1) { top: 20px; left: 50px; background: rgba(45,138,78,0.15); animation-delay: 0s; }
  .float-item:nth-child(2) { top: 80px; right: 40px; background: rgba(96,165,250,0.15); animation-delay: 1s; }
  .float-item:nth-child(3) { top: 160px; left: 80px; background: rgba(251,191,36,0.15); animation-delay: 2s; }
  .float-item:nth-child(4) { top: 120px; left: 200px; background: rgba(244,114,182,0.15); animation-delay: 0.5s; }
  .float-item:nth-child(5) { top: 220px; right: 70px; background: rgba(45,138,78,0.15); animation-delay: 1.5s; }
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); }
  }

  /* Main Content */
  .onboard-content {
    position: relative; z-index: 10; margin-top: auto; padding: 0 28px 40px;
  }
  .app-logo {
    width: 80px; height: 80px; border-radius: 22px;
    background: linear-gradient(135deg, #2d8a4e, #34a85a);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(45,138,78,0.3);
  }
  .onboard-title {
    font-size: 34px; font-weight: 900; line-height: 1.15; margin-bottom: 12px;
  }
  .onboard-title span { color: #4ade80; }
  .onboard-sub {
    font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.6;
    margin-bottom: 32px;
  }

  /* Features */
  .feature-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
  .feature-item {
    display: flex; align-items: center; gap: 14px;
  }
  .feature-icon {
    width: 44px; height: 44px; border-radius: 14px; display: flex;
    align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .feature-icon.green { background: rgba(45,138,78,0.15); color: #4ade80; }
  .feature-icon.blue { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .feature-icon.amber { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .feature-text { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.8); }

  /* CTA */
  .cta-btn {
    width: 100%; padding: 18px; border-radius: 18px; border: none;
    background: linear-gradient(135deg, #2d8a4e, #34a85a);
    color: #fff; font-size: 16px; font-weight: 700;
    box-shadow: 0 8px 30px rgba(45,138,78,0.3);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 14px;
  }
  .secondary-btn {
    width: 100%; padding: 16px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 600;
    text-align: center;
  }

  /* Dots */
  .page-dots {
    display: flex; justify-content: center; gap: 8px; margin-top: 24px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15);
  }
  .dot.active { width: 24px; border-radius: 4px; background: #2d8a4e; }

  .home-indicator {
    width: 134px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px;
    margin: 0 auto; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <div class="bg-pattern">
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
      <div class="bg-circle"></div>
    </div>

    <div class="floating-icons">
      <div class="float-item">🔬</div>
      <div class="float-item">🌿</div>
      <div class="float-item">💰</div>
      <div class="float-item">♻️</div>
      <div class="float-item">🛡️</div>
    </div>

    <div class="onboard-content">
      <div class="app-logo">🔍</div>
      <div class="onboard-title">See What's <span>Really</span> Inside</div>
      <div class="onboard-sub">
        Scan any product to reveal its chemical composition, environmental impact, and smarter alternatives.
      </div>

      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon green"><i class="fas fa-camera"></i></div>
          <div class="feature-text">AI-powered material recognition</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon blue"><i class="fas fa-scale-balanced"></i></div>
          <div class="feature-text">Multi-dimensional safety analysis</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon amber"><i class="fas fa-chart-line"></i></div>
          <div class="feature-text">Track your environmental impact</div>
        </div>
      </div>

      <div class="cta-btn"><i class="fas fa-arrow-right"></i> Get Started</div>
      <div class="secondary-btn">I already have an account</div>

      <div class="page-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
