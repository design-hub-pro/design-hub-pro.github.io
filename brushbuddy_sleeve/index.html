<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrushBuddy — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-teal-400 to-cyan-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-tooth text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">BrushBuddy</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A sleeve for a child's toothbrush that tracks which zones got brushed, missed or scrubbed too hard.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Wearable Sensor</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">IMU</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Bluetooth LE</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Kids Health</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806278220-image-1.png" alt="BrushBuddy — child brushing with the app showing the tooth zone map"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806249479-image-1.png" alt="BrushBuddy — the sleeve on a toothbrush beside a ruler"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806250066-image-1.png" alt="BrushBuddy — resting in a cup next to its charging dock"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806251149-image-1.png" alt="BrushBuddy — parent fitting the sleeve and pairing the app"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806250740-image-1.png" alt="BrushBuddy — signal path from motion sensor to zone map to app"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806250034-image-1.png" alt="BrushBuddy — exploded view of the sleeve layers"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806250205-image-1.png" alt="BrushBuddy — robotic arm brushing a typodont for zone validation"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792806252076-image-1.png" alt="BrushBuddy — power and wiring concept"></div>
        </div>
    </div>
</body>
</html>
