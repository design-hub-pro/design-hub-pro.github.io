<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AceForm · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{ -webkit-font-smoothing:antialiased; box-sizing:border-box; scrollbar-width:none; }
*::-webkit-scrollbar{ display:none; }
html,body{ width:100%; height:100%; margin:0; font-family:'Inter',sans-serif; background:#040B07; color:#fff; }
.screen{ position:relative; width:100%; height:100%; overflow:hidden;
  background: radial-gradient(70% 50% at 50% 30%, rgba(215,255,54,0.18) 0%, rgba(74,222,128,0.05) 40%, transparent 70%), linear-gradient(180deg, #061410 0%, #040B07 60%, #020503 100%); }
.font-display{ font-family:'Space Grotesk', sans-serif; letter-spacing:-0.04em; }
.font-mono{ font-family:'JetBrains Mono', monospace; }
.island{ position:absolute; left:50%; top:14px; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:24px; z-index:31; }
.status-bar{ height:59px; padding:20px 28px 0; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:600; }
.lime-gradient{ background:linear-gradient(135deg, #D7FF36 0%, #4ADE80 60%, #5EEAD4 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.lime-gradient-bg{ background:linear-gradient(135deg, #D7FF36 0%, #4ADE80 60%, #5EEAD4 100%); }
.glow-ring{ position:absolute; border-radius:50%; border:1px dashed rgba(215,255,54,0.22); }
.court-line{ position:absolute; border:1px solid rgba(215,255,54,0.10); }

@keyframes drift { 0%,100%{ transform:translateY(0)} 50%{ transform:translateY(-8px)} }
.node{ position:absolute; padding:7px 11px; border-radius:14px; background:rgba(8,20,12,0.85); border:1px solid rgba(215,255,54,0.22); backdrop-filter:blur(12px); animation:drift 4.5s ease-in-out infinite; }

/* skeleton pose */
.joint{ fill:#D7FF36; stroke:#fff; stroke-width:0.7; }
.bone{ stroke:#D7FF36; stroke-width:1.7; fill:none; stroke-linecap:round; opacity:0.95; filter:drop-shadow(0 0 4px rgba(215,255,54,0.7)); }
.bone-2{ stroke:#5EEAD4; stroke-width:1.5; }
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-signal text-xs"></i>
      <i class="fa-solid fa-wifi text-xs"></i>
      <i class="fa-solid fa-battery-full text-xs"></i>
    </div>
  </div>

  <!-- Court line accents -->
  <div class="court-line" style="left:8%; right:8%; top:32%; height:0;"></div>
  <div class="court-line" style="left:8%; right:8%; top:62%; height:0;"></div>
  <div class="court-line" style="left:50%; top:32%; bottom:38%; width:0;"></div>

  <!-- Glow rings -->
  <div class="glow-ring" style="width:340px; height:340px; left:50%; top:36%; transform:translate(-50%,-50%);"></div>
  <div class="glow-ring" style="width:240px; height:240px; left:50%; top:36%; transform:translate(-50%,-50%); border-color:rgba(94,234,212,0.18);"></div>
  <div class="glow-ring" style="width:150px; height:150px; left:50%; top:36%; transform:translate(-50%,-50%); border-color:rgba(74,222,128,0.30);"></div>

  <!-- Hero pose skeleton (mid-serve silhouette) -->
  <div style="position:absolute; left:50%; top:9%; transform:translateX(-50%); width:280px; height:340px;">
    <svg viewBox="0 0 200 240" width="100%" height="100%">
      <!-- racket -->
      <ellipse cx="160" cy="38" rx="20" ry="14" fill="none" stroke="#D7FF36" stroke-width="1.6" opacity="0.85"/>
      <line x1="148" y1="50" x2="115" y2="78" stroke="#D7FF36" stroke-width="1.6"/>
      <!-- head -->
      <circle cx="105" cy="58" r="10" fill="none" stroke="#D7FF36" stroke-width="1.6"/>
      <!-- spine -->
      <line class="bone" x1="105" y1="68" x2="100" y2="118"/>
      <!-- shoulders -->
      <line class="bone" x1="88" y1="80" x2="122" y2="78"/>
      <!-- right arm (up) -->
      <line class="bone" x1="122" y1="78" x2="138" y2="68"/>
      <line class="bone" x1="138" y1="68" x2="115" y2="78"/>
      <!-- left arm (out) -->
      <line class="bone bone-2" x1="88" y1="80" x2="62" y2="98"/>
      <line class="bone bone-2" x1="62" y1="98" x2="48" y2="118"/>
      <!-- hips -->
      <line class="bone" x1="88" y1="120" x2="112" y2="118"/>
      <!-- right leg (planted back) -->
      <line class="bone" x1="112" y1="118" x2="126" y2="170"/>
      <line class="bone" x1="126" y1="170" x2="138" y2="218"/>
      <!-- left leg (front) -->
      <line class="bone bone-2" x1="88" y1="120" x2="78" y2="172"/>
      <line class="bone bone-2" x1="78" y1="172" x2="70" y2="218"/>
      <!-- joints -->
      <circle class="joint" cx="105" cy="58" r="2.2"/>
      <circle class="joint" cx="88" cy="80" r="2.2"/>
      <circle class="joint" cx="122" cy="78" r="2.2"/>
      <circle class="joint" cx="138" cy="68" r="2.2"/>
      <circle class="joint" cx="115" cy="78" r="2.2"/>
      <circle class="joint" cx="62" cy="98" r="2.2"/>
      <circle class="joint" cx="48" cy="118" r="2.2"/>
      <circle class="joint" cx="88" cy="120" r="2.2"/>
      <circle class="joint" cx="112" cy="118" r="2.2"/>
      <circle class="joint" cx="126" cy="170" r="2.2"/>
      <circle class="joint" cx="138" cy="218" r="2.2"/>
      <circle class="joint" cx="78" cy="172" r="2.2"/>
      <circle class="joint" cx="70" cy="218" r="2.2"/>
      <!-- ball -->
      <circle cx="155" cy="14" r="6" fill="#D7FF36" filter="drop-shadow(0 0 8px #D7FF36)"/>
    </svg>
  </div>

  <!-- Floating metric nodes -->
  <div class="node" style="left:6%; top:18%;">
    <div class="text-[9px] uppercase tracking-wider text-lime-300/80 font-bold">Hip Rotation</div>
    <div class="font-mono text-[15px] font-bold text-white mt-0.5">82°<span class="text-emerald-300 text-[10px] ml-1">+4°</span></div>
  </div>
  <div class="node" style="right:6%; top:14%; animation-delay:0.6s;">
    <div class="text-[9px] uppercase tracking-wider text-cyan-200/80 font-bold">Racket Speed</div>
    <div class="font-mono text-[15px] font-bold text-white mt-0.5">94<span class="text-[9px] text-slate-400 ml-0.5">mph</span></div>
  </div>
  <div class="node" style="left:5%; top:42%; animation-delay:1.2s;">
    <div class="text-[9px] uppercase tracking-wider text-lime-300/80 font-bold">Contact Pt</div>
    <div class="font-mono text-[15px] font-bold text-white mt-0.5">+2.4<span class="text-[9px] text-slate-400 ml-0.5">cm</span></div>
  </div>
  <div class="node" style="right:5%; top:46%; animation-delay:1.8s;">
    <div class="text-[9px] uppercase tracking-wider text-emerald-300/90 font-bold">Form Score</div>
    <div class="font-mono text-[15px] font-bold text-white mt-0.5">92<span class="text-[9px] text-slate-400 ml-0.5">/100</span></div>
  </div>

  <!-- Bottom hero text -->
  <div style="position:absolute; bottom:0; left:0; right:0; padding:0 28px 38px; text-align:center;">

    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-5" style="background:rgba(215,255,54,0.10); border:1px solid rgba(215,255,54,0.25);">
      <i class="fa-solid fa-bolt text-lime-300 text-[10px]"></i>
      <span class="text-[10px] tracking-[0.18em] font-bold text-lime-100 uppercase">AI · 33 joints · 240 fps</span>
    </div>

    <div class="font-display text-[52px] font-extrabold leading-[0.95] tracking-tight">
      <span class="lime-gradient">AceForm</span>
    </div>
    <div class="font-display text-[17px] font-semibold mt-3 text-slate-200 leading-snug">
      The AI mirror coach<br/>for every tennis stroke.
    </div>

    <!-- trust strip -->
    <div class="mt-6 grid grid-cols-3 gap-2">
      <div class="px-2 py-3 rounded-2xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
        <div class="font-display font-extrabold text-[18px] text-white">128K</div>
        <div class="text-[9px] tracking-wider text-slate-400 font-semibold uppercase mt-0.5">Players</div>
      </div>
      <div class="px-2 py-3 rounded-2xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
        <div class="font-display font-extrabold text-[18px] text-white">9.2<span class="text-[10px] text-slate-400">M</span></div>
        <div class="text-[9px] tracking-wider text-slate-400 font-semibold uppercase mt-0.5">Strokes Graded</div>
      </div>
      <div class="px-2 py-3 rounded-2xl" style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);">
        <div class="font-display font-extrabold text-[18px] text-white">+42<span class="text-[10px] text-slate-400">%</span></div>
        <div class="text-[9px] tracking-wider text-slate-400 font-semibold uppercase mt-0.5">Form Lift</div>
      </div>
    </div>

    <!-- CTA -->
    <button class="lime-gradient-bg w-full mt-7 py-4 rounded-2xl font-bold text-[15px] text-emerald-950 tracking-wide shadow-2xl" style="box-shadow:0 16px 40px -10px rgba(215,255,54,0.45);">
      Build my form profile
      <i class="fa-solid fa-arrow-right ml-1.5 text-[12px]"></i>
    </button>
    <div class="mt-4 text-[11px] text-slate-500">
      Already on the court? <span class="text-lime-300 font-semibold">Sign in</span>
    </div>
  </div>
</div>
</body>
</html>
