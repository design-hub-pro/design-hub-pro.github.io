<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Simulation Process</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 78%; }
        }
        .progress-animate {
            animation: progress 2s ease-out forwards;
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-900 w-full h-full overflow-hidden">
    <!-- Status Bar -->
    <div class="bg-gray-900 px-7 pt-3 pb-1 flex justify-between items-center" style="height: 59px;">
        <span class="text-white font-semibold text-base">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-white text-sm"></i>
            <i class="fas fa-wifi text-white text-sm"></i>
            <i class="fas fa-battery-full text-white text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 flex flex-col h-full" style="height: calc(100% - 59px);">
        <!-- Header -->
        <div class="flex items-center justify-between pt-2 mb-6">
            <button class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center">
                <i class="fas fa-times text-white"></i>
            </button>
            <h1 class="text-white text-lg font-semibold">Processing</h1>
            <div class="w-10 h-10"></div>
        </div>

        <!-- Main Processing Visual -->
        <div class="flex-1 flex flex-col items-center justify-center -mt-20">
            <!-- Image Being Processed -->
            <div class="relative mb-10">
                <!-- Pulse Rings -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-56 h-56 rounded-full border-2 border-purple-500/30 pulse-ring"></div>
                </div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-48 h-48 rounded-full border-2 border-purple-500/50 pulse-ring" style="animation-delay: 0.5s;"></div>
                </div>

                <!-- Image Container -->
                <div class="w-44 h-44 rounded-3xl overflow-hidden relative shadow-2xl shadow-purple-500/30">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=400&fit=crop" alt="Processing" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-purple-600/30 shimmer"></div>
                </div>
            </div>

            <!-- Status Text -->
            <h2 class="text-white text-2xl font-bold mb-2">Applying Leica Look</h2>
            <p class="text-gray-400 text-sm mb-8">Simulating lens characteristics...</p>

            <!-- Progress Bar -->
            <div class="w-full max-w-xs mb-6">
                <div class="h-2 bg-white/10 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-purple-500 to-indigo-500 rounded-full progress-animate"></div>
                </div>
                <div class="flex justify-between mt-2">
                    <span class="text-gray-500 text-xs">Processing</span>
                    <span class="text-purple-400 text-xs font-medium">78%</span>
                </div>
            </div>

            <!-- Processing Steps -->
            <div class="w-full max-w-xs space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-white text-xs"></i>
                    </div>
                    <span class="text-white text-sm">Analyzing image</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-white text-xs"></i>
                    </div>
                    <span class="text-white text-sm">Applying color science</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-6 h-6 bg-purple-600 rounded-full flex items-center justify-center animate-spin">
                        <i class="fas fa-circle-notch text-white text-xs"></i>
                    </div>
                    <span class="text-white text-sm">Simulating bokeh</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-6 h-6 bg-white/10 rounded-full flex items-center justify-center">
                        <span class="text-gray-500 text-xs">4</span>
                    </div>
                    <span class="text-gray-500 text-sm">Final rendering</span>
                </div>
            </div>
        </div>

        <!-- Equipment Info -->
        <div class="pb-12">
            <div class="bg-white/5 backdrop-blur rounded-2xl p-4 flex items-center space-x-4">
                <div class="w-14 h-14 bg-white/10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-camera text-white text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold">Leica M11</p>
                    <p class="text-gray-400 text-sm">Summilux 35mm f/1.4</p>
                </div>
                <div class="text-right">
                    <p class="text-purple-400 font-bold text-lg">f/1.4</p>
                    <p class="text-gray-500 text-xs">Aperture</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
