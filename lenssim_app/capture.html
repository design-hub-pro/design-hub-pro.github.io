<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
        .shutter-btn {
            background: radial-gradient(circle at 30% 30%, #ffffff, #e5e7eb);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.8);
        }
        .focus-ring {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .grid-overlay {
            background-image:
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }
    </style>
</head>
<body class="bg-black w-full h-full overflow-hidden">
    <!-- Camera Viewfinder -->
    <div class="relative w-full h-full">
        <!-- Background Image (Camera View) -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=1200&fit=crop" alt="Viewfinder" class="w-full h-full object-cover">
            <div class="grid-overlay absolute inset-0"></div>
        </div>

        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 bg-gradient-to-b from-black/50 to-transparent px-7 pt-3 pb-8 flex justify-between items-center" style="height: 80px;">
            <span class="text-white font-semibold text-base">9:41</span>
            <div class="dynamic-island"></div>
            <div class="flex items-center space-x-1.5">
                <i class="fas fa-signal text-white text-sm"></i>
                <i class="fas fa-wifi text-white text-sm"></i>
                <i class="fas fa-battery-full text-white text-sm"></i>
            </div>
        </div>

        <!-- Top Controls -->
        <div class="absolute top-20 left-0 right-0 px-7 flex justify-between items-center">
            <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
                <i class="fas fa-times text-white text-lg"></i>
            </button>
            <div class="flex items-center space-x-3">
                <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
                    <i class="fas fa-bolt text-yellow-400"></i>
                </button>
                <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
                    <i class="fas fa-gear text-white"></i>
                </button>
            </div>
        </div>

        <!-- Focus Ring -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div class="focus-ring w-28 h-28 border-2 border-yellow-400 rounded-lg flex items-center justify-center">
                <div class="w-4 h-4 border border-yellow-400 rounded-sm"></div>
            </div>
        </div>

        <!-- Equipment Info Card -->
        <div class="absolute top-36 left-7 right-7">
            <div class="bg-black/60 backdrop-blur-md rounded-2xl p-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center">
                            <i class="fas fa-camera text-white text-lg"></i>
                        </div>
                        <div>
                            <p class="text-white font-semibold text-sm">Leica M11</p>
                            <p class="text-white/60 text-xs">Summilux 35mm f/1.4</p>
                        </div>
                    </div>
                    <button class="bg-purple-600 text-white text-xs px-3 py-1.5 rounded-full font-medium">
                        Change
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent pt-16 pb-8 px-7">
            <!-- Settings Row -->
            <div class="flex justify-center space-x-6 mb-6">
                <div class="text-center">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center mb-1">
                        <span class="text-white text-sm font-bold">f/1.4</span>
                    </div>
                    <p class="text-white/60 text-xs">Aperture</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center mb-1">
                        <span class="text-white text-sm font-bold">1/125</span>
                    </div>
                    <p class="text-white/60 text-xs">Shutter</p>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center mb-1">
                        <span class="text-white text-sm font-bold">400</span>
                    </div>
                    <p class="text-white/60 text-xs">ISO</p>
                </div>
            </div>

            <!-- Capture Controls -->
            <div class="flex items-center justify-around">
                <!-- Gallery Thumbnail -->
                <div class="w-14 h-14 rounded-xl overflow-hidden border-2 border-white/30">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=100&h=100&fit=crop" alt="Last Photo" class="w-full h-full object-cover">
                </div>

                <!-- Shutter Button -->
                <div class="relative">
                    <div class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
                        <button class="shutter-btn w-16 h-16 rounded-full active:scale-95 transition-transform"></button>
                    </div>
                </div>

                <!-- Flip Camera -->
                <button class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center">
                    <i class="fas fa-camera-rotate text-white text-xl"></i>
                </button>
            </div>

            <!-- Mode Switcher -->
            <div class="flex justify-center space-x-6 mt-6">
                <span class="text-white/40 text-sm">Video</span>
                <span class="text-yellow-400 text-sm font-semibold">Photo</span>
                <span class="text-white/40 text-sm">Portrait</span>
            </div>
        </div>
    </div>
</body>
</html>
