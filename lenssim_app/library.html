<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
    </style>
</head>
<body class="bg-gray-50 w-full h-full overflow-x-hidden">
    <!-- Status Bar -->
    <div class="bg-gray-50 px-7 pt-3 pb-1 flex justify-between items-center" style="height: 59px;">
        <span class="text-black font-semibold text-base">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-black text-sm"></i>
            <i class="fas fa-wifi text-black text-sm"></i>
            <i class="fas fa-battery-full text-black text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 pb-28 overflow-y-auto" style="height: calc(100% - 59px - 80px);">
        <!-- Header -->
        <div class="flex items-center justify-between pt-2 mb-5">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">My Library</h1>
                <p class="text-gray-500 text-sm">128 simulations</p>
            </div>
            <div class="flex space-x-2">
                <button class="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center">
                    <i class="fas fa-search text-gray-600"></i>
                </button>
                <button class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center">
                    <i class="fas fa-sliders-h text-white"></i>
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex space-x-2 mb-6 overflow-x-auto pb-2 -mx-7 px-7">
            <button class="bg-purple-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">All</button>
            <button class="bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Leica</button>
            <button class="bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Sony</button>
            <button class="bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Fujifilm</button>
            <button class="bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Hasselblad</button>
        </div>

        <!-- Collections -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">Collections</h3>
                <a href="#" class="text-purple-600 text-sm font-medium">See All</a>
            </div>
            <div class="flex space-x-3 overflow-x-auto pb-2 -mx-7 px-7">
                <div class="min-w-[140px] bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl p-4 relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 opacity-20">
                        <i class="fas fa-heart text-white text-6xl"></i>
                    </div>
                    <p class="text-white font-semibold mb-1">Favorites</p>
                    <p class="text-white/70 text-xs">24 photos</p>
                </div>
                <div class="min-w-[140px] bg-gradient-to-br from-pink-500 to-rose-600 rounded-2xl p-4 relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 opacity-20">
                        <i class="fas fa-mountain text-white text-6xl"></i>
                    </div>
                    <p class="text-white font-semibold mb-1">Landscape</p>
                    <p class="text-white/70 text-xs">38 photos</p>
                </div>
                <div class="min-w-[140px] bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-4 relative overflow-hidden">
                    <div class="absolute right-0 bottom-0 opacity-20">
                        <i class="fas fa-user text-white text-6xl"></i>
                    </div>
                    <p class="text-white font-semibold mb-1">Portrait</p>
                    <p class="text-white/70 text-xs">52 photos</p>
                </div>
            </div>
        </div>

        <!-- Recent Section -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">Recent</h3>
                <button class="text-gray-400 text-sm">
                    <i class="fas fa-th-large mr-1"></i>Grid
                </button>
            </div>

            <!-- Photo Grid -->
            <div class="grid grid-cols-3 gap-1.5">
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Leica</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Fuji</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Sony</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Hasselblad</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Leica</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Canon</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Nikon</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Leica</div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1518173946687-a4c036bc9f68?w=300&h=300&fit=crop" alt="Photo" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 left-1 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">Sony</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-7 py-4" style="height: 80px;">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-camera text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Camera</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-purple-600 rounded-full flex items-center justify-center -mt-8 shadow-lg">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-folder-open text-purple-600 text-xl mb-1"></i>
                <span class="text-purple-600 text-xs font-medium">Library</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
