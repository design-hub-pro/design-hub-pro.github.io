<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Photo Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
    </style>
</head>
<body class="bg-gray-900 w-full h-full overflow-x-hidden">
    <!-- Full Image -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=1400&fit=crop" alt="Photo" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/80"></div>
    </div>

    <!-- Status Bar -->
    <div class="absolute top-0 left-0 right-0 px-7 pt-3 pb-1 flex justify-between items-center" style="height: 59px;">
        <span class="text-white font-semibold text-base">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-white text-sm"></i>
            <i class="fas fa-wifi text-white text-sm"></i>
            <i class="fas fa-battery-full text-white text-sm"></i>
        </div>
    </div>

    <!-- Top Controls -->
    <div class="absolute top-16 left-0 right-0 px-7 flex justify-between items-center">
        <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
            <i class="fas fa-arrow-left text-white"></i>
        </button>
        <div class="flex space-x-3">
            <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
                <i class="fas fa-heart text-red-500"></i>
            </button>
            <button class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center">
                <i class="fas fa-ellipsis-h text-white"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Info Panel -->
    <div class="absolute bottom-0 left-0 right-0 px-7 pb-8">
        <!-- Equipment Used -->
        <div class="bg-black/60 backdrop-blur-xl rounded-3xl p-5 mb-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-white font-bold text-lg">Equipment Used</h3>
                <span class="text-gray-400 text-xs">Simulated</span>
            </div>

            <div class="flex items-center space-x-4 mb-4 pb-4 border-b border-white/10">
                <div class="w-14 h-14 bg-white/10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-camera text-white text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold">Leica M11</p>
                    <p class="text-gray-400 text-sm">Full Frame • 60MP Sensor</p>
                </div>
                <button class="text-purple-400 text-sm font-medium">View</button>
            </div>

            <div class="flex items-center space-x-4">
                <div class="w-14 h-14 bg-white/10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-circle-notch text-white text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold">Summilux 35mm f/1.4</p>
                    <p class="text-gray-400 text-sm">Wide Angle • ASPH</p>
                </div>
                <button class="text-purple-400 text-sm font-medium">View</button>
            </div>
        </div>

        <!-- Settings Used -->
        <div class="grid grid-cols-4 gap-3 mb-4">
            <div class="bg-black/40 backdrop-blur-sm rounded-xl p-3 text-center">
                <p class="text-white font-bold text-lg">f/1.4</p>
                <p class="text-gray-400 text-xs">Aperture</p>
            </div>
            <div class="bg-black/40 backdrop-blur-sm rounded-xl p-3 text-center">
                <p class="text-white font-bold text-lg">1/250</p>
                <p class="text-gray-400 text-xs">Shutter</p>
            </div>
            <div class="bg-black/40 backdrop-blur-sm rounded-xl p-3 text-center">
                <p class="text-white font-bold text-lg">200</p>
                <p class="text-gray-400 text-xs">ISO</p>
            </div>
            <div class="bg-black/40 backdrop-blur-sm rounded-xl p-3 text-center">
                <p class="text-white font-bold text-lg">35mm</p>
                <p class="text-gray-400 text-xs">Focal</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex space-x-3">
            <button class="flex-1 bg-white/10 backdrop-blur-sm text-white py-4 rounded-2xl font-semibold flex items-center justify-center space-x-2">
                <i class="fas fa-share-alt"></i>
                <span>Share</span>
            </button>
            <button class="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-semibold flex items-center justify-center space-x-2">
                <i class="fas fa-edit"></i>
                <span>Edit Again</span>
            </button>
        </div>
    </div>
</body>
</html>
