<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
        .gradient-bg {
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
        }
    </style>
</head>
<body class="gradient-bg w-full h-full overflow-hidden">
    <!-- Status Bar -->
    <div class="px-7 pt-3 pb-1 flex justify-between items-center" style="height: 59px;">
        <span class="text-white font-semibold text-base">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-white text-sm"></i>
            <i class="fas fa-wifi text-white text-sm"></i>
            <i class="fas fa-battery-full text-white text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 h-full flex flex-col">
        <!-- Skip Button -->
        <div class="flex justify-end pt-2">
            <button class="text-white/60 text-sm">Skip</button>
        </div>

        <!-- Hero Illustration -->
        <div class="flex-1 flex flex-col items-center justify-center -mt-16">
            <!-- Camera Icons Floating -->
            <div class="relative w-full h-64 mb-8">
                <!-- Main Camera Icon -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                    <div class="w-32 h-32 bg-white/10 backdrop-blur-xl rounded-3xl flex items-center justify-center shadow-2xl">
                        <i class="fas fa-camera text-white text-5xl"></i>
                    </div>
                </div>
                <!-- Floating Elements -->
                <div class="absolute top-4 left-8 w-16 h-16 bg-purple-500/30 backdrop-blur rounded-2xl flex items-center justify-center animate-bounce" style="animation-delay: 0.1s;">
                    <i class="fas fa-circle-notch text-white text-xl"></i>
                </div>
                <div class="absolute top-16 right-8 w-14 h-14 bg-indigo-500/30 backdrop-blur rounded-xl flex items-center justify-center animate-bounce" style="animation-delay: 0.3s;">
                    <i class="fas fa-sun text-white text-lg"></i>
                </div>
                <div class="absolute bottom-8 left-12 w-12 h-12 bg-pink-500/30 backdrop-blur rounded-xl flex items-center justify-center animate-bounce" style="animation-delay: 0.5s;">
                    <i class="fas fa-sliders-h text-white text-sm"></i>
                </div>
                <div class="absolute bottom-16 right-12 w-14 h-14 bg-blue-500/30 backdrop-blur rounded-xl flex items-center justify-center animate-bounce" style="animation-delay: 0.2s;">
                    <i class="fas fa-magic text-white text-lg"></i>
                </div>
            </div>

            <!-- Text Content -->
            <div class="text-center mb-8">
                <h1 class="text-white text-3xl font-bold mb-4">Experience Any Camera</h1>
                <p class="text-white/70 text-base leading-relaxed px-4">
                    Simulate how your photos would look shot with legendary cameras and premium lenses
                </p>
            </div>

            <!-- Feature Highlights -->
            <div class="flex space-x-4 mb-8">
                <div class="flex items-center space-x-2 bg-white/10 rounded-full px-4 py-2">
                    <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                    <span class="text-white text-sm">24 Cameras</span>
                </div>
                <div class="flex items-center space-x-2 bg-white/10 rounded-full px-4 py-2">
                    <div class="w-2 h-2 bg-blue-400 rounded-full"></div>
                    <span class="text-white text-sm">36 Lenses</span>
                </div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="pb-12">
            <!-- Page Indicators -->
            <div class="flex justify-center space-x-2 mb-6">
                <div class="w-8 h-2 bg-white rounded-full"></div>
                <div class="w-2 h-2 bg-white/30 rounded-full"></div>
                <div class="w-2 h-2 bg-white/30 rounded-full"></div>
            </div>

            <!-- Get Started Button -->
            <button class="w-full bg-white text-purple-700 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-purple-500/30 mb-4">
                Get Started
            </button>

            <!-- Sign In Link -->
            <p class="text-center text-white/60 text-sm">
                Already have an account? <a href="#" class="text-white font-semibold">Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
