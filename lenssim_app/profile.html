<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensSim Pro - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .dynamic-island { background: #000; border-radius: 25px; width: 125px; height: 37px; }
    </style>
</head>
<body class="bg-gray-50 w-full h-full overflow-x-hidden">
    <!-- Status Bar -->
    <div class="bg-gray-50 px-7 pt-3 pb-1 flex justify-between items-center" style="height: 59px;">
        <span class="text-black font-semibold text-base">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center space-x-1.5">
            <i class="fas fa-signal text-black text-sm"></i>
            <i class="fas fa-wifi text-black text-sm"></i>
            <i class="fas fa-battery-full text-black text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 pb-28 overflow-y-auto" style="height: calc(100% - 59px - 80px);">
        <!-- Header -->
        <div class="flex justify-between items-center pt-2 mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
            <button class="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center">
                <i class="fas fa-gear text-gray-600"></i>
            </button>
        </div>

        <!-- Profile Card -->
        <div class="bg-white rounded-3xl p-6 mb-6 shadow-sm text-center">
            <div class="w-24 h-24 mx-auto rounded-full overflow-hidden ring-4 ring-purple-100 mb-4">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face" alt="Profile" class="w-full h-full object-cover">
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-1">Alex Chen</h2>
            <p class="text-gray-500 text-sm mb-4">Photography Enthusiast</p>
            <div class="flex items-center justify-center space-x-2">
                <span class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">Pro Member</span>
                <span class="bg-amber-100 text-amber-700 text-xs font-medium px-3 py-1 rounded-full">Since 2024</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-gray-900">128</p>
                <p class="text-gray-500 text-xs">Simulations</p>
            </div>
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-gray-900">24</p>
                <p class="text-gray-500 text-xs">Cameras Used</p>
            </div>
            <div class="bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-gray-900">36</p>
                <p class="text-gray-500 text-xs">Lenses Used</p>
            </div>
        </div>

        <!-- Favorite Gear -->
        <div class="mb-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Favorite Gear</h3>
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="p-4 flex items-center space-x-4 border-b border-gray-100">
                    <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-camera text-purple-600"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900">Leica M11</p>
                        <p class="text-gray-500 text-xs">Most used camera • 45 simulations</p>
                    </div>
                    <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-heart text-purple-600 text-sm"></i>
                    </div>
                </div>
                <div class="p-4 flex items-center space-x-4">
                    <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-circle-notch text-indigo-600"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900">Summilux 35mm f/1.4</p>
                        <p class="text-gray-500 text-xs">Most used lens • 38 simulations</p>
                    </div>
                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-heart text-indigo-600 text-sm"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu Items -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
            <button class="w-full p-4 flex items-center space-x-4 border-b border-gray-100 text-left">
                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-crown text-blue-600"></i>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900">Subscription</p>
                    <p class="text-gray-500 text-xs">Manage your Pro plan</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>
            <button class="w-full p-4 flex items-center space-x-4 border-b border-gray-100 text-left">
                <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-download text-green-600"></i>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900">Downloads</p>
                    <p class="text-gray-500 text-xs">View saved simulations</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>
            <button class="w-full p-4 flex items-center space-x-4 border-b border-gray-100 text-left">
                <div class="w-10 h-10 bg-orange-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bell text-orange-600"></i>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900">Notifications</p>
                    <p class="text-gray-500 text-xs">Manage alerts</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>
            <button class="w-full p-4 flex items-center space-x-4 text-left">
                <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-sign-out-alt text-red-600"></i>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-red-600">Sign Out</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-7 py-4" style="height: 80px;">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-camera text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Camera</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-purple-600 rounded-full flex items-center justify-center -mt-8 shadow-lg">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-folder-open text-gray-400 text-xl mb-1"></i>
                <span class="text-gray-400 text-xs">Library</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-purple-600 text-xl mb-1"></i>
                <span class="text-purple-600 text-xs font-medium">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
