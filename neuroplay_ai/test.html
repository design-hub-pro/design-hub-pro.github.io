<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroPlay - Balance test</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  * { scrollbar-width:none; }
  html, body { height:100%; }
  :root {
    --bg:#000; --card:#1C1C1E; --sep:rgba(255,255,255,0.08);
    --sec:rgba(235,235,245,0.60); --ter:rgba(235,235,245,0.30);
    --blue:#0A84FF; --green:#30D158;
  }
  body { font-family:-apple-system,'SF Pro Text','Inter',sans-serif; background:var(--bg); color:#fff; overflow:hidden; position:relative; }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; }
  .status-time { font-size:17px; font-weight:600; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); }

  .content { padding:0 28px; }

  .navbar { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .cancel { font-size:17px; color:var(--blue); }
  .nav-t { font-size:17px; font-weight:600; }
  .nav-r { font-size:15px; color:var(--sec); }

  .cue { text-align:center; margin-top:56px; }
  .cue-t { font-size:30px; font-weight:700; letter-spacing:-1px; line-height:1.2; }
  .cue-s { font-size:17px; color:var(--sec); margin-top:10px; }

  .ring { position:relative; width:270px; height:270px; margin:48px auto 0; }
  .ring svg { width:100%; height:100%; }
  .ring-n { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .t-n { font-size:74px; font-weight:700; letter-spacing:-3px; line-height:1; }
  .t-l { font-size:15px; color:var(--sec); margin-top:8px; }

  .dots { display:flex; gap:8px; justify-content:center; margin-top:30px; }
  .d { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.20); }
  .d.done { background:var(--green); }
  .d.on { background:#fff; }

  .readout { margin-top:46px; background:var(--card); border-radius:16px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  .r-l { font-size:17px; }
  .r-v { font-size:17px; color:var(--sec); }
  .r-v b { color:#fff; font-weight:600; }

  .foot { position:absolute; left:28px; right:28px; bottom:34px; text-align:center; }
  .stop { height:50px; border-radius:14px; background:#1C1C1E; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; color:#fff; }
  .footnote { font-size:13px; color:var(--ter); margin-top:12px; }
</style>
</head>
<body>
  <div class="status-bar">
    <div class="status-time">07:48</div>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal" style="font-size:13px"></i>
      <i class="fas fa-wifi" style="font-size:13px"></i>
      <i class="fas fa-battery-three-quarters" style="font-size:16px"></i>
    </div>
  </div>

  <div class="content">
    <div class="navbar">
      <div class="cancel">Cancel</div>
      <div class="nav-t">Balance</div>
      <div class="nav-r">2 of 3</div>
    </div>

    <div class="cue">
      <div class="cue-t">Eyes closed.<br>Hands on hips.</div>
      <div class="cue-s">Tandem stance, heel to toe</div>
    </div>

    <div class="ring">
      <svg viewBox="0 0 270 270">
        <circle cx="135" cy="135" r="120" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
        <circle cx="135" cy="135" r="120" fill="none" stroke="#0A84FF" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="452 754" transform="rotate(-90 135 135)"/>
      </svg>
      <div class="ring-n">
        <div class="t-n">12</div>
        <div class="t-l">seconds left</div>
      </div>
    </div>

    <div class="dots">
      <div class="d done"></div>
      <div class="d on"></div>
      <div class="d"></div>
    </div>

    <div class="readout">
      <div class="r-l">Sway path</div>
      <div class="r-v"><b>41 cm</b> · baseline 33–39</div>
    </div>
  </div>

  <div class="foot">
    <div class="stop">Stop test</div>
    <div class="footnote">Measured from the phone at your waist. Stand near a wall.</div>
  </div>
</body>
</html>
