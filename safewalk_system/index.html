<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWalk — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-violet-500 to-indigo-700 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-person-walking text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">SafeWalk</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A clip-on safety pebble that watches behind you with camera, radar and ultrasound, and shares your GPS location.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Wearable</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Safety</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Sensors</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">GPS</span>
        </div>
    </div>

    <!-- Shots: all 8, two per row -->
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484995788-image-1.png" alt="SafeWalk — worn on a backpack during a walk home at dusk"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484968924-image-1.png" alt="SafeWalk — the device beside a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484969102-image-1.png" alt="SafeWalk — fitted to a cap, a backpack strap and a necklace"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484969426-image-1.png" alt="SafeWalk — hands twisting the device onto its strap mount"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484968777-image-1.png" alt="SafeWalk — signal path from sensing to phone alert and location log"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484968463-image-1.png" alt="SafeWalk — exploded stack of the internal build"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484995858-image-1.png" alt="SafeWalk — bench test against a mannequin at a measured distance"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484996882-image-1.png" alt="SafeWalk — power and wiring concept"></div>
        </div>
    </div>
</body>
</html>
