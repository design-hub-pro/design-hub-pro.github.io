<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">

<title>DanceMate · Memory waltz</title></head><body>
<div class="screen" style="background:#F5F0FB"><div class="scroll" style="padding-bottom:40px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-3 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <div class="h-11 px-4 rounded-full bg-[#6B3FA0] text-white flex items-center gap-2 text-[14px] font-bold"><i class="fa-solid fa-brain"></i>Memory waltz</div>
    <div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-user-nurse text-[#6B3FA0]"></i></div>
  </div>

  <!-- Now playing -->
  <div class="mx-[28px] mt-5 rounded-[28px] overflow-hidden relative h-[250px]">
    <img src="assets/ballroom.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(60,30,90,.2),rgba(40,20,60,.9))"></div>
    <span class="absolute top-4 left-4 chip glass"><i class="fa-solid fa-clock-rotate-left text-[12px]"></i>You were 21</span>
    <div class="absolute inset-x-0 bottom-0 p-5">
      <p class="text-white/75 text-[14px] font-semibold">Now playing · 1958</p>
      <p class="serif text-white text-[28px] font-semibold leading-tight">Moon River Waltz</p>
      <div class="flex items-center gap-3 mt-3">
        <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center"><i class="fa-solid fa-pause text-[#6B3FA0]"></i></div>
        <div class="flex-1 flex items-end gap-[3px] h-[30px]">
          <span class="flex-1 bg-white rounded-full" style="height:40%"></span><span class="flex-1 bg-white rounded-full" style="height:75%"></span><span class="flex-1 bg-white rounded-full" style="height:55%"></span><span class="flex-1 bg-white rounded-full" style="height:90%"></span><span class="flex-1 bg-white rounded-full" style="height:60%"></span><span class="flex-1 bg-white rounded-full" style="height:80%"></span><span class="flex-1 bg-white rounded-full" style="height:45%"></span><span class="flex-1 bg-white rounded-full" style="height:70%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:50%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:85%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:40%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:65%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:55%"></span><span class="flex-1 bg-white/40 rounded-full" style="height:30%"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="px-c mt-6 text-center">
    <p class="meta !text-[#8E74B3]">Question 2 of 4</p>
    <p class="serif text-[28px] font-semibold leading-tight mt-2">You stepped forward. What comes next?</p>
  </div>

  <div class="px-c mt-5 grid grid-cols-2 gap-3">
    <div class="rounded-[24px] bg-white p-4 border-[3px] border-[#2FAF7A] relative shadow-sm">
      <i class="fa-solid fa-circle-check text-[#2FAF7A] text-[22px] absolute top-3 right-3"></i>
      <div class="h-[88px] rounded-2xl bg-[#EEF7F2] flex items-center justify-center"><i class="fa-solid fa-arrow-right text-[#2FAF7A] text-[38px]"></i></div>
      <p class="text-[19px] font-extrabold mt-3 text-center">Step to the side</p>
    </div>
    <div class="rounded-[24px] bg-white p-4 border-[3px] border-transparent shadow-sm">
      <div class="h-[88px] rounded-2xl bg-[#F5F0FB] flex items-center justify-center"><i class="fa-solid fa-arrow-down text-[#8E74B3] text-[38px]"></i></div>
      <p class="text-[19px] font-extrabold mt-3 text-center">Step back</p>
    </div>
  </div>

  <div class="mx-[28px] mt-5 rounded-[24px] g-sage p-4 flex items-center gap-4 text-white">
    <div class="w-14 h-14 rounded-2xl bg-white/25 flex items-center justify-center"><i class="fa-solid fa-face-smile-beam text-[26px]"></i></div>
    <div><p class="text-[19px] font-extrabold">That's right!</p><p class="text-[14.5px] font-semibold text-white/90">Now let's dance it together.</p></div>
  </div>

  <div class="px-c mt-5 flex items-center justify-center gap-2">
    <span class="w-10 h-3 rounded-full bg-[#6B3FA0]"></span><span class="w-10 h-3 rounded-full bg-[#6B3FA0]"></span><span class="w-10 h-3 rounded-full bg-[#DCCFEE]"></span><span class="w-10 h-3 rounded-full bg-[#DCCFEE]"></span>
  </div>
  <p class="text-center text-[13.5px] font-semibold text-[#8E74B3] mt-3"><i class="fa-solid fa-microphone mr-1"></i>You can also say your answer out loud</p>
</div></div></body></html>
