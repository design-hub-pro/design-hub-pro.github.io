<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DanceMate · Waltz lessons for seniors with live pose feedback</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Plus Jakarta Sans',sans-serif;color:#2A1A24}
main{overflow-x:auto}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center;width:max-content;margin:0 auto}
.label{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#A3929B;text-align:center;margin-bottom:18px}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2f2a2d,#0d0b0c);box-shadow:0 50px 80px -30px rgba(184,40,95,.32),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#FBF6F1}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
.tag{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#FBF1F4;color:#7A3550}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#F0657F,#B8285F)"><i class="fa-solid fa-music text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:Fraunces,serif">DanceMate</h1>
  <p class="mt-3 text-[19px] text-gray-500">Gentle waltz lessons for seniors, with a camera that watches your steps and cheers you on.</p>
  <div class="mt-5 flex gap-2"><span class="tag">Pose estimation</span><span class="tag">Healthy aging</span><span class="tag">Rehab</span><span class="tag">Social</span></div>
</header>
<main class="pb-28 px-6"><div class="phones">
  <div><p class="label">Comfort profile</p><div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="Comfort profile"></iframe></div></div></div>
  <div><p class="label">Home</p><div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="Home"></iframe></div></div></div>
  <div><p class="label">Comfort check-in</p><div class="phone-frame"><div class="phone-screen"><iframe src="care.html" scrolling="no" title="Comfort check-in"></iframe></div></div></div>
  <div><p class="label">Waltz path</p><div class="phone-frame"><div class="phone-screen"><iframe src="learn.html" scrolling="no" title="Waltz path"></iframe></div></div></div>
  <div><p class="label">Box step lesson</p><div class="phone-frame"><div class="phone-screen"><iframe src="lesson.html" scrolling="no" title="Box step lesson"></iframe></div></div></div>
  <div><p class="label">Live pose feedback</p><div class="phone-frame"><div class="phone-screen"><iframe src="dance.html" scrolling="no" title="Live pose feedback"></iframe></div></div></div>
  <div><p class="label">Session results</p><div class="phone-frame"><div class="phone-screen"><iframe src="results.html" scrolling="no" title="Session results"></iframe></div></div></div>
  <div><p class="label">Memory waltz</p><div class="phone-frame"><div class="phone-screen"><iframe src="memory.html" scrolling="no" title="Memory waltz"></iframe></div></div></div>
  <div><p class="label">Tea dance</p><div class="phone-frame"><div class="phone-screen"><iframe src="together.html" scrolling="no" title="Tea dance"></iframe></div></div></div>
  <div><p class="label">Progress and family</p><div class="phone-frame"><div class="phone-screen"><iframe src="me.html" scrolling="no" title="Progress and family"></iframe></div></div></div>
</div></main>
</body></html>
