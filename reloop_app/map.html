<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReLoop - Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #E8F0E5; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }
        .scroll-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>
    <!-- Map background -->
    <div class="relative w-full h-full overflow-hidden">
        <!-- Map tiles -->
        <div class="absolute inset-0 bg-[#E8F0E5]">
            <svg viewBox="0 0 460 980" class="w-full h-full">
                <!-- Background grid -->
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D5E2D0" stroke-width="0.5"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"/>
                <!-- Green parks -->
                <path d="M 0 200 Q 100 180 200 220 T 460 200 L 460 350 Q 300 380 200 360 T 0 370 Z" fill="#D5E5C5" opacity="0.6"/>
                <path d="M 0 600 Q 130 580 260 620 L 460 610 L 460 780 L 0 790 Z" fill="#D5E5C5" opacity="0.5"/>
                <!-- Water -->
                <path d="M 360 0 L 460 0 L 460 200 Q 400 180 360 200 Z" fill="#BBDEFB" opacity="0.7"/>
                <!-- Roads -->
                <path d="M 0 450 L 460 460" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
                <path d="M 230 0 L 240 980" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
                <path d="M 0 700 L 460 690" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
                <path d="M 100 0 L 110 980" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
                <path d="M 350 0 L 360 980" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Status bar -->
        <div class="status-bar flex items-end pb-2 justify-between relative z-10">
            <div class="flex items-center gap-1">
                <span class="text-sm font-semibold text-gray-900">9:41</span>
            </div>
            <div class="w-32 h-[34px] bg-black rounded-full mt-3"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-xs text-gray-900"></i>
                <i class="fas fa-wifi text-xs text-gray-900"></i>
                <i class="fas fa-battery-full text-sm text-gray-900"></i>
            </div>
        </div>

        <!-- Top search bar -->
        <div class="content-area mt-2 relative z-10">
            <div class="bg-white shadow-lg rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
                <i class="fas fa-search text-gray-400 text-sm"></i>
                <input placeholder="Search location" class="bg-transparent flex-1 text-xs text-gray-700 placeholder-gray-400 outline-none font-medium" />
                <div class="w-7 h-7 bg-gradient-to-br from-green-500 to-lime-500 rounded-lg flex items-center justify-center">
                    <i class="fas fa-sliders-h text-white text-[10px]"></i>
                </div>
            </div>
            <!-- Filter chips -->
            <div class="flex gap-2 mt-3 scroll-container">
                <div class="bg-white shadow rounded-full px-3 py-1.5 flex items-center gap-1 shrink-0">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-[10px] font-extrabold text-gray-900">Donations · 12</span>
                </div>
                <div class="bg-white shadow rounded-full px-3 py-1.5 flex items-center gap-1 shrink-0">
                    <div class="w-2 h-2 bg-amber-500 rounded-full"></div>
                    <span class="text-[10px] font-extrabold text-gray-900">Pickup · 4</span>
                </div>
                <div class="bg-white shadow rounded-full px-3 py-1.5 flex items-center gap-1 shrink-0">
                    <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                    <span class="text-[10px] font-extrabold text-gray-900">Drop-off · 8</span>
                </div>
            </div>
        </div>

        <!-- Map Pins -->
        <div class="absolute top-[280px] left-[80px] z-10">
            <div class="relative">
                <div class="w-11 h-11 bg-gradient-to-br from-green-500 to-lime-500 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white">
                    <i class="fas fa-gift text-white text-sm"></i>
                </div>
                <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2.5 h-2.5 bg-green-500 rotate-45"></div>
            </div>
        </div>
        <div class="absolute top-[380px] left-[260px] z-10">
            <div class="relative">
                <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-orange-500 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white">
                    <i class="fas fa-truck text-white text-xs"></i>
                </div>
            </div>
        </div>
        <div class="absolute top-[210px] left-[300px] z-10">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white">
                <i class="fas fa-map-marker-alt text-white text-xs"></i>
            </div>
        </div>
        <div class="absolute top-[340px] left-[170px] z-10">
            <div class="w-9 h-9 bg-gradient-to-br from-green-500 to-lime-500 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white">
                <i class="fas fa-pencil-alt text-white text-xs"></i>
            </div>
        </div>
        <div class="absolute top-[180px] left-[190px] z-10">
            <div class="w-9 h-9 bg-gradient-to-br from-purple-500 to-fuchsia-500 rounded-full flex items-center justify-center shadow-lg ring-4 ring-white">
                <i class="fas fa-tshirt text-white text-xs"></i>
            </div>
        </div>

        <!-- Current location -->
        <div class="absolute top-[440px] left-[210px] z-10">
            <div class="relative">
                <div class="absolute inset-0 w-10 h-10 bg-blue-500/30 rounded-full animate-ping"></div>
                <div class="w-10 h-10 bg-blue-500 rounded-full ring-4 ring-white flex items-center justify-center">
                    <div class="w-3 h-3 bg-white rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Right floating controls -->
        <div class="absolute top-[200px] right-4 z-10 flex flex-col gap-2">
            <div class="w-10 h-10 bg-white shadow-lg rounded-xl flex items-center justify-center">
                <i class="fas fa-plus text-gray-700 text-xs"></i>
            </div>
            <div class="w-10 h-10 bg-white shadow-lg rounded-xl flex items-center justify-center">
                <i class="fas fa-minus text-gray-700 text-xs"></i>
            </div>
            <div class="w-10 h-10 bg-white shadow-lg rounded-xl flex items-center justify-center">
                <i class="fas fa-location-crosshairs text-blue-600 text-xs"></i>
            </div>
        </div>

        <!-- Bottom sheet -->
        <div class="absolute bottom-[88px] left-0 right-0 z-10">
            <div class="bg-white rounded-t-3xl shadow-2xl pb-3">
                <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mt-2 mb-3"></div>

                <div class="content-area">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-base font-extrabold text-gray-900">Loops near you</h3>
                            <p class="text-[11px] text-gray-400 font-medium">24 within 1 mile</p>
                        </div>
                        <div class="bg-green-50 rounded-full px-3 py-1.5 flex items-center gap-1">
                            <i class="fas fa-list text-green-600 text-[10px]"></i>
                            <span class="text-[10px] text-green-600 font-extrabold">List view</span>
                        </div>
                    </div>
                </div>

                <!-- Horizontal cards -->
                <div class="flex scroll-container gap-3 mt-3 pl-7 pr-7 pb-2">
                    <!-- Card 1 -->
                    <div class="bg-gradient-to-br from-green-50 to-lime-50 border border-green-100 rounded-2xl p-3 min-w-[200px]">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 bg-gradient-to-br from-green-500 to-lime-500 rounded-xl flex items-center justify-center">
                                <i class="fas fa-pencil-alt text-white text-xs"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-green-600 font-extrabold uppercase">DONATE</p>
                                <p class="text-xs font-bold text-gray-900">Pencil Drive</p>
                            </div>
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2 font-medium">Lincoln Golf Club · 0.6 mi</p>
                        <div class="flex items-center justify-between mt-1.5">
                            <span class="text-[10px] text-gray-400">187 donors</span>
                            <span class="text-[10px] text-green-600 font-extrabold">Open</span>
                        </div>
                    </div>
                    <!-- Card 2 -->
                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-100 rounded-2xl p-3 min-w-[200px]">
                        <div class="flex items-center gap-2">
                            <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center">
                                <i class="fas fa-truck text-white text-xs"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-orange-600 font-extrabold uppercase">PICKUP</p>
                                <p class="text-xs font-bold text-gray-900">Battery Route</p>
                            </div>
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2 font-medium">Eco-Pickup Co · Wed</p>
                        <div class="flex items-center justify-between mt-1.5">
                            <span class="text-[10px] text-gray-400">Free</span>
                            <span class="text-[10px] text-orange-600 font-extrabold">Book</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar bg-white border-t border-gray-100 px-6 pt-2 pb-8 z-20">
            <div class="flex items-center justify-around">
                <div class="flex flex-col items-center gap-0.5">
                    <i class="fas fa-home text-gray-400 text-lg"></i>
                    <span class="text-[10px] font-medium text-gray-400">Home</span>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <i class="fas fa-compass text-gray-400 text-lg"></i>
                    <span class="text-[10px] font-medium text-gray-400">Discover</span>
                </div>
                <div class="flex flex-col items-center gap-0.5 relative">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-lime-500 rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-green-200">
                        <i class="fas fa-plus text-white text-lg"></i>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <i class="fas fa-trophy text-gray-400 text-lg"></i>
                    <span class="text-[10px] font-medium text-gray-400">Rank</span>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <i class="fas fa-user text-gray-400 text-lg"></i>
                    <span class="text-[10px] font-medium text-gray-400">Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
