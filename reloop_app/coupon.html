<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReLoop - Coupon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: linear-gradient(135deg, #FEF3C7 0%, #FED7AA 50%, #FECACA 100%); }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .cta-bar { position: absolute; bottom: 0; left: 0; right: 0; }
        /* Ticket scallop edge */
        .ticket {
            -webkit-mask-image: radial-gradient(circle at 14px 50%, transparent 7px, black 7px);
            mask-image: radial-gradient(circle at 14px 50%, transparent 7px, black 7px);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end pb-2 justify-between">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-gray-900">9:41</span>
        </div>
        <div class="w-32 h-[34px] bg-black rounded-full mt-3"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-gray-900"></i>
            <i class="fas fa-wifi text-xs text-gray-900"></i>
            <i class="fas fa-battery-full text-sm text-gray-900"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="content-area pt-2 pb-3 flex items-center justify-between">
        <div class="w-9 h-9 bg-white/60 backdrop-blur rounded-full flex items-center justify-center">
            <i class="fas fa-chevron-left text-gray-700 text-xs"></i>
        </div>
        <h1 class="text-base font-extrabold text-gray-900">Your Coupon</h1>
        <div class="w-9 h-9 bg-white/60 backdrop-blur rounded-full flex items-center justify-center">
            <i class="fas fa-share text-gray-700 text-xs"></i>
        </div>
    </div>

    <!-- Confetti ring success state -->
    <div class="content-area mt-2">
        <div class="bg-white/50 backdrop-blur rounded-full px-3 py-1.5 inline-flex items-center gap-1.5">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-extrabold text-green-700 uppercase tracking-wider">Earned · Pencil drop-off</span>
        </div>
    </div>

    <!-- Ticket Card -->
    <div class="content-area mt-4">
        <div class="bg-white rounded-2xl shadow-2xl shadow-orange-300/50 overflow-hidden">
            <!-- Image header -->
            <div class="relative h-32">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1779683216843-image-1.png" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                <div class="absolute top-2.5 left-2.5 bg-amber-400 text-amber-900 px-2 py-0.5 rounded-full">
                    <span class="text-[9px] font-black uppercase tracking-wider">Verified partner</span>
                </div>
                <div class="absolute bottom-2.5 left-3">
                    <p class="text-[10px] font-extrabold text-amber-200 uppercase tracking-wider">Drift Coffee</p>
                    <p class="text-white font-black text-base">18th Ave · 0.4 mi</p>
                </div>
            </div>

            <!-- Coupon body -->
            <div class="p-5 text-center relative">
                <p class="text-[10px] text-amber-600 font-extrabold uppercase tracking-[2px]">REWARD</p>
                <h2 class="text-3xl font-black text-gray-900 mt-1">$5 OFF</h2>
                <p class="text-xs text-gray-500 font-bold mt-1">Any drink, any size</p>

                <!-- Dashed separator -->
                <div class="my-5 relative">
                    <div class="absolute -left-7 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#FED7AA] rounded-full"></div>
                    <div class="absolute -right-7 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#FED7AA] rounded-full"></div>
                    <div class="border-t-2 border-dashed border-gray-200"></div>
                </div>

                <!-- QR -->
                <div class="bg-white border border-gray-200 rounded-2xl p-4 mx-6 relative">
                    <div class="w-32 h-32 mx-auto bg-white relative">
                        <!-- Simulated QR code -->
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <rect width="100" height="100" fill="white"/>
                            <!-- Corner markers -->
                            <rect x="0" y="0" width="28" height="28" fill="black"/>
                            <rect x="4" y="4" width="20" height="20" fill="white"/>
                            <rect x="8" y="8" width="12" height="12" fill="black"/>
                            <rect x="72" y="0" width="28" height="28" fill="black"/>
                            <rect x="76" y="4" width="20" height="20" fill="white"/>
                            <rect x="80" y="8" width="12" height="12" fill="black"/>
                            <rect x="0" y="72" width="28" height="28" fill="black"/>
                            <rect x="4" y="76" width="20" height="20" fill="white"/>
                            <rect x="8" y="80" width="12" height="12" fill="black"/>
                            <!-- Random pattern bits -->
                            <rect x="34" y="6" width="4" height="4" fill="black"/>
                            <rect x="42" y="6" width="4" height="4" fill="black"/>
                            <rect x="50" y="10" width="4" height="4" fill="black"/>
                            <rect x="58" y="6" width="4" height="4" fill="black"/>
                            <rect x="34" y="14" width="4" height="4" fill="black"/>
                            <rect x="46" y="18" width="4" height="4" fill="black"/>
                            <rect x="54" y="22" width="4" height="4" fill="black"/>
                            <rect x="62" y="14" width="4" height="4" fill="black"/>
                            <rect x="6" y="34" width="4" height="4" fill="black"/>
                            <rect x="14" y="38" width="4" height="4" fill="black"/>
                            <rect x="22" y="42" width="4" height="4" fill="black"/>
                            <rect x="30" y="34" width="4" height="4" fill="black"/>
                            <rect x="38" y="38" width="4" height="4" fill="black"/>
                            <rect x="46" y="42" width="4" height="4" fill="black"/>
                            <rect x="54" y="46" width="4" height="4" fill="black"/>
                            <rect x="62" y="38" width="4" height="4" fill="black"/>
                            <rect x="70" y="42" width="4" height="4" fill="black"/>
                            <rect x="78" y="38" width="4" height="4" fill="black"/>
                            <rect x="86" y="42" width="4" height="4" fill="black"/>
                            <rect x="6" y="46" width="4" height="4" fill="black"/>
                            <rect x="22" y="50" width="4" height="4" fill="black"/>
                            <rect x="34" y="54" width="4" height="4" fill="black"/>
                            <rect x="50" y="58" width="4" height="4" fill="black"/>
                            <rect x="66" y="54" width="4" height="4" fill="black"/>
                            <rect x="78" y="58" width="4" height="4" fill="black"/>
                            <rect x="86" y="62" width="4" height="4" fill="black"/>
                            <rect x="34" y="66" width="4" height="4" fill="black"/>
                            <rect x="42" y="70" width="4" height="4" fill="black"/>
                            <rect x="54" y="66" width="4" height="4" fill="black"/>
                            <rect x="62" y="70" width="4" height="4" fill="black"/>
                            <rect x="74" y="74" width="4" height="4" fill="black"/>
                            <rect x="82" y="78" width="4" height="4" fill="black"/>
                            <rect x="90" y="74" width="4" height="4" fill="black"/>
                            <rect x="38" y="82" width="4" height="4" fill="black"/>
                            <rect x="46" y="86" width="4" height="4" fill="black"/>
                            <rect x="54" y="90" width="4" height="4" fill="black"/>
                            <rect x="66" y="86" width="4" height="4" fill="black"/>
                        </svg>
                    </div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mt-3">Code · RL-CF92K</p>
                </div>

                <p class="text-[11px] text-gray-500 font-medium mt-4">Show this to the barista at checkout</p>
            </div>
        </div>
    </div>

    <!-- Details -->
    <div class="content-area mt-4">
        <div class="bg-white/60 backdrop-blur rounded-2xl p-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Earned</p>
                    <p class="text-xs font-extrabold text-gray-900 mt-0.5">Mar 3, 2026</p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Expires</p>
                    <p class="text-xs font-extrabold text-orange-600 mt-0.5">Apr 2, 2026</p>
                </div>
            </div>
            <div class="mt-3 pt-3 border-t border-white">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Sponsored by</p>
                <div class="flex items-center gap-2 mt-1.5">
                    <div class="w-7 h-7 bg-gradient-to-br from-amber-400 to-orange-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-coffee text-white text-[10px]"></i>
                    </div>
                    <p class="text-xs font-extrabold text-gray-900">Drift Coffee · Hudson Yards</p>
                </div>
            </div>
        </div>
    </div>

    <!-- CTA -->
    <div class="cta-bar bg-white/80 backdrop-blur border-t border-white/50 px-7 pt-3 pb-7">
        <button class="w-full h-12 bg-gradient-to-br from-amber-500 to-orange-500 rounded-2xl flex items-center justify-center gap-2 shadow-md shadow-orange-300">
            <i class="fas fa-map-marker-alt text-white text-sm"></i>
            <span class="text-white font-extrabold text-sm">Get directions · 0.4 mi</span>
        </button>
    </div>
</body>
</html>
