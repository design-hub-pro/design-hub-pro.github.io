<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Prompt</title></head><body>
<div class="screen"><div class="scroll">
  <!-- Hero -->
  <div class="relative h-[420px]">
    <img src="assets/art3.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 35%">
    <div class="absolute inset-0 bg-gradient-to-t from-[#FAF8F5] via-[#120E22]/30 to-[#120E22]/50"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="px-c mt-1 flex justify-between text-white">
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
    </div>
    <div class="absolute bottom-6 left-[28px] right-[28px]">
      <span class="chip bg-white text-[#4752C4]">Week 14 · Any medium</span>
      <h1 class="font-display font-extrabold text-[42px] leading-none mt-3">Night Sounds</h1>
    </div>
  </div>

  <!-- Countdown + stats -->
  <div class="px-c grid grid-cols-3 gap-2.5">
    <div class="card py-4 text-center"><p class="font-display font-extrabold text-[30px] leading-none">47</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Entries</p></div>
    <div class="card py-4 text-center"><p class="font-display font-extrabold text-[30px] leading-none text-[#E8466C]">2d</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Left</p></div>
    <div class="card py-4 text-center"><p class="font-display font-extrabold text-[30px] leading-none text-[#5865F2]">+40</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">XP</p></div>
  </div>

  <!-- Medium split -->
  <div class="px-c mt-4">
    <div class="flex h-3 rounded-full overflow-hidden gap-1">
      <span class="g-coral" style="width:55%"></span><span class="g-blurple" style="width:32%"></span><span class="g-sun" style="width:13%"></span>
    </div>
    <div class="flex gap-4 mt-2.5 text-[12.5px] font-semibold text-gray-500">
      <span class="flex items-center gap-1.5"><span class="dot bg-[#E8466C]"></span>Art 26</span>
      <span class="flex items-center gap-1.5"><span class="dot bg-[#5865F2]"></span>Music 15</span>
      <span class="flex items-center gap-1.5"><span class="dot bg-[#F2930D]"></span>Film 6</span>
    </div>
  </div>

  <!-- Entries -->
  <div class="px-c mt-6 flex items-end justify-between">
    <h2 class="font-display font-bold text-[21px]">Entries</h2>
    <span class="text-[13px] text-gray-400">Newest</span>
  </div>
  <div class="px-c mt-3 grid grid-cols-2 gap-3">
    <div class="h-[230px] rounded-[22px] overflow-hidden relative"><img src="assets/art1.jpg" class="w-full h-full object-cover">
      <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 glass rounded-full pl-1 pr-2.5 py-1 text-white text-[12px] font-semibold"><img src="assets/av3.jpg" class="w-6 h-6 rounded-full object-cover">Ava</div></div>
    <div class="h-[230px] rounded-[22px] overflow-hidden relative" style="background:linear-gradient(160deg,#2B2366,#120E22)">
      <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 h-16 text-[#9AA3FF]"><div class="wave" data-n="26" data-seed="21" data-played=".3"></div></div>
      <div class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white flex items-center justify-center text-[14px]"><i class="fa-solid fa-play ml-0.5"></i></div>
      <span class="absolute top-3 left-3 chip glass-w text-white py-1">0:58</span>
      <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 glass rounded-full pl-1 pr-2.5 py-1 text-white text-[12px] font-semibold"><img src="assets/av5.jpg" class="w-6 h-6 rounded-full object-cover">Dev</div></div>
    <div class="h-[180px] rounded-[22px] overflow-hidden relative"><img src="assets/art4.jpg" class="w-full h-full object-cover">
      <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 glass rounded-full pl-1 pr-2.5 py-1 text-white text-[12px] font-semibold"><img src="assets/av4.jpg" class="w-6 h-6 rounded-full object-cover">Leo</div></div>
    <div class="h-[180px] rounded-[22px] overflow-hidden relative"><img src="assets/music1.jpg" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-black/20"></div>
      <div class="absolute top-3 right-3 w-10 h-10 rounded-full bg-white flex items-center justify-center text-[14px]"><i class="fa-solid fa-play ml-0.5"></i></div>
      <span class="absolute top-3 left-3 chip glass text-white py-1"><i class="fa-solid fa-video"></i>1:12</span></div>
  </div>
</div>
<!-- Sticky CTA -->
<div class="absolute left-0 right-0 bottom-0 px-c pt-4 pb-9 bg-gradient-to-t from-[#FAF8F5] via-[#FAF8F5] to-transparent z-40">
  <a class="btn text-white g-coral shadow-lg"><i class="fa-solid fa-plus"></i>Add my entry</a>
</div>
</div>
<script src="assets/wave.js"></script>
</body></html>
