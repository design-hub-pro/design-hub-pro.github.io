<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Welcome</title></head><body>
<div class="screen" style="background:#17141F">
  <!-- Art collage -->
  <div class="absolute inset-x-0 top-0 h-[560px] overflow-hidden">
    <img src="assets/art3.jpg" class="absolute w-[220px] h-[270px] object-cover rounded-[28px] left-[22px] top-[86px] -rotate-6 shadow-2xl">
    <img src="assets/art1.jpg" class="absolute w-[200px] h-[240px] object-cover rounded-[28px] right-[18px] top-[70px] rotate-[7deg] shadow-2xl">
    <img src="assets/music1.jpg" class="absolute w-[190px] h-[200px] object-cover rounded-[28px] left-[60px] top-[330px] rotate-[4deg] shadow-2xl">
    <img src="assets/art2.jpg" class="absolute w-[180px] h-[210px] object-cover rounded-[28px] right-[40px] top-[300px] -rotate-[5deg] shadow-2xl">
    <!-- floating audio pill -->
    <div class="absolute left-[150px] top-[262px] rotate-[-3deg] flex items-center gap-3 bg-white rounded-full pl-2 pr-4 py-2 shadow-2xl">
      <div class="w-9 h-9 rounded-full g-coral flex items-center justify-center text-white text-[13px]"><i class="fa-solid fa-play ml-0.5"></i></div>
      <div class="wave h-6 text-[#E8466C]" data-n="22" data-seed="3" data-played=".45"></div>
      <span class="text-[12px] font-bold text-gray-500">1:48</span>
    </div>
    <div class="absolute inset-0 bg-gradient-to-b from-[#17141F]/40 via-transparent to-[#17141F]"></div>
  </div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>

  <div class="absolute inset-x-0 bottom-0 px-c pb-12 text-white">
    <div class="w-14 h-14 rounded-[18px] g-coral flex items-center justify-center shadow-lg"><i class="fa-solid fa-infinity text-[22px]"></i></div>
    <h1 class="font-display font-extrabold text-[40px] leading-[1.04] mt-5">Make something.<br>Get seen. Come back.</h1>
    <p class="text-[16px] text-white/60 mt-3">Weekly prompts, real feedback and live jams for your school server.</p>

    <!-- Server preview -->
    <div class="mt-6 rounded-[22px] p-4 flex items-center gap-3.5" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)">
      <div class="w-12 h-12 rounded-2xl g-grape flex items-center justify-center font-display font-extrabold text-[18px]">NA</div>
      <div class="flex-1">
        <p class="font-bold text-[15.5px]">Northview Arts &amp; Music</p>
        <p class="text-[13px] text-white/55 flex items-center gap-1.5 mt-0.5"><span class="dot bg-emerald-400"></span>38 online · 412 members</p>
      </div>
      <div class="avs"><img src="assets/av1.jpg" style="border-color:#2a2533"><img src="assets/av2.jpg" style="border-color:#2a2533"><img src="assets/av3.jpg" style="border-color:#2a2533"></div>
    </div>

    <a class="btn mt-5 text-white" style="background:#5865F2"><i class="fa-brands fa-discord text-[22px]"></i>Continue with Discord</a>
    <p class="text-center text-[12.5px] text-white/40 mt-4">Your roles and channels sync automatically</p>
  </div>
</div>
<script src="assets/wave.js"></script>
</body></html>
