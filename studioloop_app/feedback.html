<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Feedback</title></head><body>
<div class="screen" style="background:#17141F"><div class="scroll">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between text-white">
    <div class="w-11 h-11 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-chevron-down"></i></div>
    <span class="text-[14px] font-semibold text-white/60">Feedback circle</span>
    <div class="w-11 h-11 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-ellipsis"></i></div>
  </div>

  <!-- Cover -->
  <div class="mx-auto mt-5 w-[300px] h-[300px] rounded-[30px] overflow-hidden shadow-2xl relative">
    <img src="assets/music2.jpg" class="w-full h-full object-cover">
  </div>
  <div class="px-c mt-6 text-white flex items-end justify-between">
    <div><h1 class="font-display font-extrabold text-[30px] leading-none">3AM Bus</h1><p class="text-[14px] text-white/55 mt-2">Dev K. · asks about mixing, drums</p></div>
    <i class="fa-regular fa-heart text-[24px] text-white/70 mb-1"></i>
  </div>

  <!-- Waveform with timestamp markers -->
  <div class="px-c mt-6 relative">
    <div class="h-[64px] text-[#9AA3FF]"><div class="wave" data-n="54" data-seed="9" data-played=".38"></div></div>
    <div class="absolute -top-3 left-[86px] w-7 h-7 rounded-full border-2 border-[#17141F] overflow-hidden"><img src="assets/av3.jpg" class="w-full h-full object-cover"></div>
    <div class="absolute -top-3 left-[214px] w-7 h-7 rounded-full border-2 border-[#17141F] overflow-hidden ring-2 ring-[#FF8A6B]"><img src="assets/av1.jpg" class="w-full h-full object-cover"></div>
    <div class="absolute -top-3 left-[318px] w-7 h-7 rounded-full border-2 border-[#17141F] overflow-hidden"><img src="assets/av4.jpg" class="w-full h-full object-cover"></div>
    <div class="flex justify-between text-[12px] font-semibold text-white/40 mt-2"><span>0:57</span><span>2:31</span></div>
  </div>
  <div class="mt-3 flex items-center justify-center gap-10 text-white">
    <i class="fa-solid fa-rotate-left text-[20px] text-white/60"></i>
    <div class="w-[68px] h-[68px] rounded-full bg-white text-[#17141F] flex items-center justify-center text-[22px]"><i class="fa-solid fa-pause"></i></div>
    <i class="fa-solid fa-rotate-right text-[20px] text-white/60"></i>
  </div>

  <!-- Timestamped notes -->
  <div class="mx-[20px] mt-6 rounded-[26px] p-4 space-y-3.5" style="background:#221E2C">
    <div class="flex gap-3">
      <img src="assets/av3.jpg" class="w-9 h-9 rounded-full object-cover">
      <div class="flex-1"><p class="text-[13px] text-white/50"><span class="font-bold text-white">Ava</span> · <span class="text-[#9AA3FF] font-semibold">0:34</span></p>
        <p class="text-[14.5px] text-white mt-0.5">Kick is fighting the bass here. Try a small EQ dip.</p></div>
    </div>
    <div class="flex gap-3">
      <img src="assets/av1.jpg" class="w-9 h-9 rounded-full object-cover">
      <div class="flex-1"><p class="text-[13px] text-white/50"><span class="font-bold text-white">You</span> · <span class="text-[#FF8A6B] font-semibold">1:22</span></p>
        <div class="mt-1.5 flex items-center gap-2 rounded-[14px] px-3 py-2.5" style="background:rgba(255,255,255,.06)">
          <span class="text-[14.5px] text-white/40 flex-1">Love this switch-up...</span>
          <i class="fa-solid fa-microphone text-white/50"></i>
          <div class="w-8 h-8 rounded-full g-coral flex items-center justify-center text-white text-[12px]"><i class="fa-solid fa-arrow-up"></i></div>
        </div>
        <div class="mt-2 flex gap-1.5"><span class="chip py-1 text-[11.5px] text-white/80" style="background:rgba(255,255,255,.08)">Works well</span><span class="chip py-1 text-[11.5px] text-white/80" style="background:rgba(255,255,255,.08)">Try this</span><span class="chip py-1 text-[11.5px] text-white/80" style="background:rgba(255,255,255,.08)">Question</span></div>
      </div>
    </div>
  </div>
</div></div>
<script src="assets/wave.js"></script>
</body></html>
