<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Gallery</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <h1 class="font-display font-extrabold text-[32px]">Gallery</h1>
    <div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-magnifying-glass text-[16px]"></i></div>
  </div>
  <div class="flex gap-2 overflow-x-auto px-c mt-3">
    <span class="chip bg-[#17141F] text-white">All</span>
    <span class="chip card text-gray-600"><i class="fa-solid fa-palette text-[#E8466C]"></i>Art</span>
    <span class="chip card text-gray-600"><i class="fa-solid fa-music text-[#5865F2]"></i>Music</span>
    <span class="chip card text-gray-600"><i class="fa-solid fa-film text-[#F2930D]"></i>Film</span>
    <span class="chip card text-gray-600"><i class="fa-solid fa-seedling text-[#0F9E7B]"></i>First posts</span>
  </div>

  <!-- Featured art post -->
  <div class="mx-[28px] mt-5 card overflow-hidden">
    <div class="h-[330px] relative"><img src="assets/art2.jpg" class="w-full h-full object-cover">
      <span class="absolute top-3 left-3 chip bg-white/95 text-[#E8466C]"><i class="fa-solid fa-star"></i>Spotlight</span></div>
    <div class="p-4 flex items-center gap-3">
      <img src="assets/av3.jpg" class="w-10 h-10 rounded-full object-cover">
      <div class="flex-1"><p class="font-bold text-[15.5px]">Static Blue</p><p class="text-[12.5px] text-gray-400">Ava R. · Grade 11 · 2h</p></div>
      <div class="flex items-center gap-3 text-[14px] font-semibold text-gray-500">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-heart text-[#E8466C]"></i>84</span>
        <span class="flex items-center gap-1.5"><i class="fa-regular fa-comment"></i>12</span>
      </div>
    </div>
  </div>

  <!-- Music post -->
  <div class="mx-[28px] mt-4 card p-4">
    <div class="flex items-center gap-3.5">
      <div class="w-[72px] h-[72px] rounded-[18px] overflow-hidden relative flex-shrink-0"><img src="assets/music2.jpg" class="w-full h-full object-cover"></div>
      <div class="flex-1"><p class="font-bold text-[16px]">3AM Bus</p><p class="text-[12.5px] text-gray-400">Dev K. · Lo-fi beat · 5h</p>
        <div class="mt-1.5 flex gap-1.5"><span class="chip bg-indigo-50 text-[#4752C4] py-0.5 text-[11px]">Mixing</span><span class="chip bg-indigo-50 text-[#4752C4] py-0.5 text-[11px]">Drums</span></div></div>
    </div>
    <div class="mt-4 flex items-center gap-3">
      <div class="w-11 h-11 rounded-full flex items-center justify-center text-white flex-shrink-0" style="background:#5865F2"><i class="fa-solid fa-pause"></i></div>
      <div class="flex-1 h-10 text-[#5865F2]"><div class="wave" data-n="38" data-seed="5" data-played=".42"></div></div>
      <span class="text-[12.5px] font-bold text-gray-400">2:31</span>
    </div>
  </div>

  <!-- Two-up -->
  <div class="px-c mt-4 grid grid-cols-2 gap-3">
    <div class="card overflow-hidden"><div class="h-[170px]"><img src="assets/art4.jpg" class="w-full h-full object-cover"></div>
      <div class="p-3 flex items-center justify-between"><p class="font-bold text-[14px]">Practice Room</p><span class="text-[12.5px] font-semibold text-gray-400"><i class="fa-solid fa-heart text-[#E8466C]"></i> 61</span></div></div>
    <div class="card overflow-hidden"><div class="h-[170px] relative"><img src="assets/art1.jpg" class="w-full h-full object-cover">
      <span class="absolute top-2.5 left-2.5 chip bg-emerald-500 text-white py-1 text-[11px]"><i class="fa-solid fa-seedling"></i>First post</span></div>
      <div class="p-3 flex items-center justify-between"><p class="font-bold text-[14px]">Rooftop Hum</p><span class="text-[12.5px] font-semibold text-gray-400"><i class="fa-solid fa-heart text-[#E8466C]"></i> 19</span></div></div>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab on"><i class="fa-solid fa-images"></i>Gallery</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div>
<script src="assets/wave.js"></script>
</body></html>
