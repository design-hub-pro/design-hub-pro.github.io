<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Share</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <span class="text-[16px] font-semibold text-gray-500">Cancel</span>
    <h1 class="font-display font-bold text-[19px]">Share work</h1>
    <span class="text-[16px] font-semibold text-gray-300">Draft</span>
  </div>

  <!-- Media type -->
  <div class="px-c mt-5 grid grid-cols-3 gap-2.5">
    <div class="rounded-[18px] py-3 flex flex-col items-center gap-1.5 text-white g-coral shadow-md"><i class="fa-solid fa-palette text-[18px]"></i><span class="text-[13px] font-bold">Art</span></div>
    <div class="card rounded-[18px] py-3 flex flex-col items-center gap-1.5 text-gray-500"><i class="fa-solid fa-music text-[18px]"></i><span class="text-[13px] font-bold">Music</span></div>
    <div class="card rounded-[18px] py-3 flex flex-col items-center gap-1.5 text-gray-500"><i class="fa-solid fa-film text-[18px]"></i><span class="text-[13px] font-bold">Video</span></div>
  </div>

  <!-- Preview -->
  <div class="mx-[28px] mt-4 h-[340px] rounded-[28px] overflow-hidden relative">
    <img src="assets/art1.jpg" class="w-full h-full object-cover">
    <div class="absolute top-3 right-3 flex gap-2">
      <div class="w-10 h-10 rounded-full glass text-white flex items-center justify-center"><i class="fa-solid fa-crop-simple"></i></div>
      <div class="w-10 h-10 rounded-full glass text-white flex items-center justify-center"><i class="fa-solid fa-plus"></i></div>
    </div>
    <span class="absolute bottom-3 left-3 chip bg-white/95 text-[#4752C4]"><i class="fa-solid fa-wand-magic-sparkles"></i>Night Sounds</span>
  </div>

  <!-- Title -->
  <div class="mx-[28px] mt-4 card px-4 py-3.5">
    <p class="text-[12px] font-semibold text-gray-400">Title</p>
    <p class="text-[17px] font-bold mt-0.5">Rooftop Hum<span class="inline-block w-[2px] h-[18px] bg-[#5865F2] align-middle ml-0.5"></span></p>
  </div>

  <!-- Feedback ask -->
  <p class="px-c mt-5 text-[14px] font-bold">Ask for feedback on</p>
  <div class="px-c mt-2.5 flex flex-wrap gap-2">
    <span class="chip text-white" style="background:#5865F2"><i class="fa-solid fa-check"></i>Color</span>
    <span class="chip text-white" style="background:#5865F2"><i class="fa-solid fa-check"></i>Composition</span>
    <span class="chip bg-white card text-gray-600">Lighting</span>
    <span class="chip bg-white card text-gray-600">Story</span>
    <span class="chip bg-white card text-gray-600">Just vibes</span>
  </div>

  <!-- Discord cross-post -->
  <div class="mx-[28px] mt-5 card p-4 flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white" style="background:#5865F2"><i class="fa-brands fa-discord text-[20px]"></i></div>
    <div class="flex-1"><p class="font-bold text-[15px]">Post to #art-showcase</p><p class="text-[12.5px] text-gray-400">Thread opens for comments</p></div>
    <div class="w-[52px] h-[32px] rounded-full bg-[#34C759] relative"><span class="absolute right-[3px] top-[3px] w-[26px] h-[26px] rounded-full bg-white shadow"></span></div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-c pt-4 pb-9 bg-gradient-to-t from-[#FAF8F5] via-[#FAF8F5] to-transparent z-40">
  <a class="btn text-white g-coral shadow-lg"><i class="fa-solid fa-paper-plane"></i>Share · +40 XP</a>
</div>
</div></body></html>
