<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Profile</title></head><body>
<div class="screen"><div class="scroll">
  <!-- Banner -->
  <div class="relative h-[220px]">
    <img src="assets/art1.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 60%">
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 to-transparent"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="absolute top-[66px] right-[28px] w-11 h-11 rounded-full glass text-white flex items-center justify-center"><i class="fa-solid fa-gear"></i></div>
  </div>
  <div class="px-c -mt-12 relative flex items-end justify-between">
    <img src="assets/av1.jpg" class="w-[104px] h-[104px] rounded-[32px] object-cover border-[5px] border-[#FAF8F5] shadow-lg">
    <div class="chip bg-orange-50 text-orange-600 text-[14px] mb-2"><i class="fa-solid fa-fire"></i>6-week streak</div>
  </div>
  <div class="px-c mt-3">
    <h1 class="font-display font-extrabold text-[30px] leading-none">Mina Cho</h1>
    <p class="text-[14px] text-gray-400 mt-1.5">@minadraws · Grade 10</p>
    <!-- Discord roles -->
    <div class="mt-3 flex flex-wrap gap-2">
      <span class="chip bg-white card text-gray-700"><span class="dot bg-[#E8466C]"></span>Illustrator</span>
      <span class="chip bg-white card text-gray-700"><span class="dot bg-[#5865F2]"></span>Feedback Pro</span>
      <span class="chip bg-white card text-gray-700"><span class="dot bg-[#F2930D]"></span>Prompt Regular</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="mx-[28px] mt-5 card p-5 grid grid-cols-3 divide-x divide-gray-100 text-center">
    <div><p class="font-display font-extrabold text-[32px] leading-none">23</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Pieces</p></div>
    <div><p class="font-display font-extrabold text-[32px] leading-none text-[#0F9E7B]">41</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Notes given</p></div>
    <div><p class="font-display font-extrabold text-[32px] leading-none text-[#5865F2]">L7</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Level</p></div>
  </div>
  <div class="px-c mt-3 flex items-center gap-3">
    <div class="bar flex-1"><span class="g-blurple" style="width:72%"></span></div>
    <span class="text-[12.5px] font-semibold text-gray-400">180 XP to <span class="text-[#5865F2]">Mentor</span> role</span>
  </div>

  <!-- Badges -->
  <h2 class="px-c mt-6 font-display font-bold text-[20px]">Badges</h2>
  <div class="hscroll mt-3">
    <div class="flex flex-col items-center w-[72px]"><div class="w-16 h-16 rounded-[22px] g-coral flex items-center justify-center text-white text-[24px] shadow-md"><i class="fa-solid fa-palette"></i></div><p class="text-[11.5px] font-semibold mt-1.5 text-center">10 prompts</p></div>
    <div class="flex flex-col items-center w-[72px]"><div class="w-16 h-16 rounded-[22px] g-mint flex items-center justify-center text-white text-[24px] shadow-md"><i class="fa-solid fa-comments"></i></div><p class="text-[11.5px] font-semibold mt-1.5 text-center">Kind critic</p></div>
    <div class="flex flex-col items-center w-[72px]"><div class="w-16 h-16 rounded-[22px] g-sun flex items-center justify-center text-white text-[24px] shadow-md"><i class="fa-solid fa-star"></i></div><p class="text-[11.5px] font-semibold mt-1.5 text-center">Spotlight</p></div>
    <div class="flex flex-col items-center w-[72px]"><div class="w-16 h-16 rounded-[22px] g-grape flex items-center justify-center text-white text-[24px] shadow-md"><i class="fa-solid fa-microphone"></i></div><p class="text-[11.5px] font-semibold mt-1.5 text-center">First jam</p></div>
    <div class="flex flex-col items-center w-[72px]"><div class="w-16 h-16 rounded-[22px] bg-gray-200 flex items-center justify-center text-gray-400 text-[22px]"><i class="fa-solid fa-lock"></i></div><p class="text-[11.5px] font-semibold mt-1.5 text-center text-gray-400">Collab</p></div>
  </div>

  <!-- Portfolio -->
  <div class="px-c mt-6 flex items-end justify-between"><h2 class="font-display font-bold text-[20px]">Portfolio</h2><span class="text-[13px] font-semibold text-[#5865F2]">Export PDF</span></div>
  <div class="px-c mt-3 grid grid-cols-3 gap-2">
    <img src="assets/art1.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
    <img src="assets/art3.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
    <img src="assets/art2.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-images"></i>Gallery</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab on"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
