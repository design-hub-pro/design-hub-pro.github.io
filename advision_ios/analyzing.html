<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdVision — Investigating</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
html,body{width:100%;height:100%;}
h1,h2,h3,.font-display{font-family:'Plus Jakarta Sans',sans-serif;}
.screen{position:relative;width:100%;height:100%;background:#0b0e1a;color:#fff;overflow:hidden;}
.statusbar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30;}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding:0 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.glass{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);}
.brand-grad{background:linear-gradient(135deg,#7c3aed 0%,#06b6d4 100%);}
.glow{box-shadow:0 0 70px rgba(124,58,237,0.45);}
@keyframes spin{to{transform:rotate(360deg);}}
.radar{animation:spin 2.5s linear infinite;}
.spin{animation:spin 1s linear infinite;}
@keyframes pulse2{0%,100%{opacity:.5;transform:scale(.95);}50%{opacity:1;transform:scale(1);}}
.pulse2{animation:pulse2 1.8s ease-in-out infinite;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.step{opacity:0;animation:fadein .5s ease forwards;}
</style>
</head>
<body>
<div class="screen">

  <div class="statusbar">
    <span class="text-[15px] font-semibold tracking-tight">9:41</span>
    <div class="island"></div>
    <div class="flex items-center gap-1.5 text-[13px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">

    <!-- Radar -->
    <div class="relative w-64 h-64 mb-10 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border border-violet-500/20"></div>
      <div class="absolute inset-8 rounded-full border border-violet-500/20"></div>
      <div class="absolute inset-16 rounded-full border border-violet-500/20"></div>
      <div class="absolute inset-0 rounded-full radar" style="background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(34,211,238,0.35) 360deg);"></div>
      <div class="w-28 h-28 brand-grad rounded-full flex items-center justify-center glow pulse2 relative z-10">
        <i class="fas fa-magnifying-glass-chart text-white text-4xl"></i>
      </div>
      <span class="absolute top-10 right-12 w-3 h-3 bg-rose-400 rounded-full pulse2"></span>
      <span class="absolute bottom-16 left-10 w-2.5 h-2.5 bg-amber-300 rounded-full pulse2"></span>
    </div>

    <h1 class="font-display text-[26px] font-extrabold text-center">Investigating…</h1>
    <p class="text-[13.5px] text-slate-400 text-center mt-2 mb-9 leading-relaxed">Cross-checking your evidence<br>against 9 deception signals</p>

    <div class="w-full space-y-3">
      <div class="glass rounded-2xl p-4 flex items-center gap-3.5 step">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/15 flex items-center justify-center"><i class="fas fa-check text-emerald-300 text-sm"></i></div>
        <span class="text-[13.5px] flex-1">Reading caption &amp; claims</span>
      </div>
      <div class="glass rounded-2xl p-4 flex items-center gap-3.5 step" style="animation-delay:.2s">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/15 flex items-center justify-center"><i class="fas fa-check text-emerald-300 text-sm"></i></div>
        <span class="text-[13.5px] flex-1">Inspecting link &amp; affiliate tags</span>
      </div>
      <div class="glass rounded-2xl p-4 flex items-center gap-3.5 step" style="animation-delay:.4s">
        <div class="w-9 h-9 rounded-xl bg-cyan-500/15 flex items-center justify-center"><i class="fas fa-spinner spin text-cyan-300 text-sm"></i></div>
        <span class="text-[13.5px] flex-1">Checking for ad disclosure</span>
      </div>
      <div class="glass rounded-2xl p-4 flex items-center gap-3.5 opacity-40 step" style="animation-delay:.6s">
        <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center"><i class="fas fa-star-half-stroke text-slate-400 text-sm"></i></div>
        <span class="text-[13.5px] flex-1">Scoring scam &amp; fake-review risk</span>
      </div>
    </div>

    <a href="analysis.html" class="mt-10 text-[13px] text-cyan-300 font-medium underline">View results &rarr;</a>

  </div>

</div>
</body>
</html>
