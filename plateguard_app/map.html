<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0B1A2E;width:100%;height:100%;overflow:hidden;color:white}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white;position:relative;z-index:20}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(11,26,46,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#4A6178;font-size:10px;font-weight:500}
.tab.active{color:#F97316}
.tab i{font-size:22px}
.map-area{position:absolute;top:0;left:0;right:0;bottom:88px;overflow:hidden}
.car-pin{position:absolute;top:38%;left:52%;transform:translate(-50%,-50%);z-index:15}
.car-dot{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F97316,#EA580C);padding:3px;box-shadow:0 8px 24px rgba(249,115,22,0.4);display:flex;align-items:center;justify-content:center}
.car-ring{position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(249,115,22,0.5);animation:ping 2s infinite}
@keyframes ping{0%{transform:scale(1);opacity:0.7}100%{transform:scale(2.2);opacity:0}}
.incident-pin{position:absolute;z-index:12}
.card{position:absolute;bottom:88px;left:0;right:0;background:#0B1A2E;border-radius:28px 28px 0 0;z-index:20;padding:20px 28px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>

  <div class="map-area">
    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=900&h=1200&fit=crop" class="w-full h-full object-cover" style="filter:hue-rotate(200deg) saturate(0.6) brightness(0.85)">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,26,46,0.6) 0%,transparent 25%,transparent 50%,rgba(11,26,46,0.95) 75%)"></div>

    <div class="status-bar">
      <span>9:41</span>
      <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
    </div>

    <!-- Top bar -->
    <div class="absolute top-16 left-7 right-7 flex items-center justify-between z-20">
      <div class="bg-white/15 backdrop-blur-xl rounded-full px-4 py-2.5 flex items-center gap-2">
        <i class="fas fa-search text-gray-300 text-xs"></i>
        <span class="text-[12px] text-gray-300">Search location</span>
      </div>
      <div class="flex gap-2">
        <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur-xl flex items-center justify-center"><i class="fas fa-layer-group text-white text-sm"></i></div>
        <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur-xl flex items-center justify-center"><i class="fas fa-location-crosshairs text-white text-sm"></i></div>
      </div>
    </div>

    <!-- Incident markers -->
    <div class="incident-pin" style="top:30%;left:35%">
      <div class="w-8 h-8 rounded-full bg-red-500/80 flex items-center justify-center shadow-lg"><i class="fas fa-car-burst text-white text-[10px]"></i></div>
    </div>
    <div class="incident-pin" style="top:55%;left:28%">
      <div class="w-7 h-7 rounded-full bg-yellow-500/80 flex items-center justify-center shadow-lg"><i class="fas fa-triangle-exclamation text-black text-[9px]"></i></div>
    </div>
    <div class="incident-pin" style="top:25%;left:68%">
      <div class="w-7 h-7 rounded-full bg-blue-500/80 flex items-center justify-center shadow-lg"><i class="fas fa-eye text-white text-[9px]"></i></div>
    </div>

    <!-- Car pin -->
    <div class="car-pin">
      <div class="car-ring"></div>
      <div class="car-dot">
        <i class="fas fa-car text-white text-xl"></i>
      </div>
    </div>
  </div>

  <!-- Bottom card -->
  <div class="card">
    <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-4"></div>
    <div class="flex items-center gap-3 mb-4">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#F97316,#EA580C)"><i class="fas fa-car text-white text-lg"></i></div>
      <div class="flex-1">
        <p class="text-lg font-bold">Tesla Model 3</p>
        <p class="text-[10px] text-gray-400"><i class="fas fa-location-dot text-orange-400 mr-1"></i>Oak & 5th St · Parked 2h ago</p>
      </div>
      <div class="flex items-center gap-1 bg-green-500/15 rounded-full px-2.5 py-1">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        <span class="text-[10px] text-green-400 font-bold">Safe</span>
      </div>
    </div>

    <!-- Trip Stats -->
    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="bg-white/5 rounded-xl p-2.5 text-center border border-white/5">
        <p class="text-lg font-bold">12.4</p>
        <p class="text-[9px] text-gray-500">mi today</p>
      </div>
      <div class="bg-white/5 rounded-xl p-2.5 text-center border border-white/5">
        <p class="text-lg font-bold">3</p>
        <p class="text-[9px] text-gray-500">trips</p>
      </div>
      <div class="bg-white/5 rounded-xl p-2.5 text-center border border-white/5">
        <p class="text-lg font-bold">0</p>
        <p class="text-[9px] text-gray-500">alerts</p>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex items-center gap-4 justify-center">
      <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span><span class="text-[9px] text-gray-500">Collision</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span><span class="text-[9px] text-gray-500">Near Miss</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span><span class="text-[9px] text-gray-500">Sentry</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span><span class="text-[9px] text-gray-500">My Car</span></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-shield-halved"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-clock-rotate-left"></i><span>Events</span></div>
    <div class="tab"><i class="fas fa-video"></i><span>Camera</span></div>
    <div class="tab active"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
