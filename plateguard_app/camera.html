<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0B1A2E;width:100%;height:100%;overflow:hidden;color:white}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white;position:relative;z-index:20}
.content{height:calc(100% - 147px);overflow-y:auto;padding:0 28px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(11,26,46,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#4A6178;font-size:10px;font-weight:500}
.tab.active{color:#F97316}
.tab i{font-size:22px}
.rec-dot{width:10px;height:10px;background:#EF4444;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <div class="content">
    <div class="flex items-center justify-between mb-5">
      <p class="text-2xl font-bold">Camera</p>
      <div class="flex items-center gap-2">
        <div class="rec-dot"></div>
        <span class="text-[11px] text-red-400 font-bold">RECORDING</span>
      </div>
    </div>

    <!-- Live Feed -->
    <div class="rounded-3xl overflow-hidden mb-4 relative">
      <img src="https://images.unsplash.com/photo-1449965408869-ebd13bc9e5b8?w=900&h=500&fit=crop" class="w-full h-52 object-cover">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,26,46,0.4) 0%,transparent 30%,transparent 60%,rgba(11,26,46,0.7) 100%)"></div>
      <!-- Overlay controls -->
      <div class="absolute top-3 left-3 bg-red-500/90 rounded-full px-2.5 py-1 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
        <span class="text-[10px] font-bold text-white">LIVE</span>
      </div>
      <div class="absolute top-3 right-3 flex items-center gap-2">
        <div class="bg-black/40 backdrop-blur rounded-full px-2.5 py-1"><span class="text-[10px] text-white font-medium">4K · 30fps</span></div>
      </div>
      <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="bg-black/40 backdrop-blur rounded-full px-2.5 py-1"><span class="text-[10px] text-white">Rear Camera</span></div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-camera text-white text-xs"></i></div>
          <div class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-expand text-white text-xs"></i></div>
        </div>
      </div>
      <!-- Timestamp overlay -->
      <div class="absolute bottom-12 left-3">
        <span class="text-[10px] text-white/70 font-mono">2026-04-30 09:41:23</span>
      </div>
    </div>

    <!-- Camera Controls -->
    <div class="grid grid-cols-3 gap-2 mb-5">
      <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/5">
        <i class="fas fa-moon text-blue-400 text-lg mb-1"></i>
        <p class="text-[10px] text-gray-400 font-medium">Night Vision</p>
        <p class="text-[9px] text-green-400 font-bold mt-1">ON</p>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/5">
        <i class="fas fa-wand-magic-sparkles text-orange-400 text-lg mb-1"></i>
        <p class="text-[10px] text-gray-400 font-medium">Plate OCR</p>
        <p class="text-[9px] text-green-400 font-bold mt-1">ACTIVE</p>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/5">
        <i class="fas fa-hard-drive text-purple-400 text-lg mb-1"></i>
        <p class="text-[10px] text-gray-400 font-medium">Storage</p>
        <p class="text-[9px] text-gray-300 font-bold mt-1">42 GB</p>
      </div>
    </div>

    <!-- Saved Clips -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[10px] font-bold uppercase text-gray-500 tracking-wider">Saved Clips</p>
        <span class="text-[10px] text-orange-400 font-semibold">View all</span>
      </div>
      <div class="flex gap-3 overflow-x-auto pb-2">
        <div class="flex-shrink-0 w-32 rounded-xl overflow-hidden relative">
          <img src="https://images.unsplash.com/photo-1543465077-db45d34b88a5?w=400&h=300&fit=crop" class="w-full h-24 object-cover">
          <div class="absolute inset-0 bg-black/30"></div>
          <div class="absolute top-2 left-2 bg-red-500/80 rounded px-1.5 py-0.5"><span class="text-[8px] font-bold text-white">IMPACT</span></div>
          <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
            <span class="text-[9px] text-white font-medium">0:47</span>
            <i class="fas fa-play text-[8px] text-white"></i>
          </div>
        </div>
        <div class="flex-shrink-0 w-32 rounded-xl overflow-hidden relative">
          <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&h=300&fit=crop" class="w-full h-24 object-cover">
          <div class="absolute inset-0 bg-black/30"></div>
          <div class="absolute top-2 left-2 bg-yellow-500/80 rounded px-1.5 py-0.5"><span class="text-[8px] font-bold text-black">BRAKE</span></div>
          <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
            <span class="text-[9px] text-white font-medium">0:18</span>
            <i class="fas fa-play text-[8px] text-white"></i>
          </div>
        </div>
        <div class="flex-shrink-0 w-32 rounded-xl overflow-hidden relative">
          <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400&h=300&fit=crop" class="w-full h-24 object-cover">
          <div class="absolute inset-0 bg-black/30"></div>
          <div class="absolute top-2 left-2 bg-blue-500/80 rounded px-1.5 py-0.5"><span class="text-[8px] font-bold text-white">SENTRY</span></div>
          <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
            <span class="text-[9px] text-white font-medium">1:12</span>
            <i class="fas fa-play text-[8px] text-white"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Recording Stats -->
    <div class="bg-white/5 rounded-2xl p-4 border border-white/5 mb-4">
      <p class="text-[10px] text-gray-500 font-bold uppercase mb-3">Today's Recording</p>
      <div class="flex items-center justify-between">
        <div class="text-center">
          <p class="text-xl font-bold text-white">4<span class="text-xs text-gray-500">h</span> 22<span class="text-xs text-gray-500">m</span></p>
          <p class="text-[9px] text-gray-500">Total</p>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center">
          <p class="text-xl font-bold text-white">8.4<span class="text-xs text-gray-500">GB</span></p>
          <p class="text-[9px] text-gray-500">Used</p>
        </div>
        <div class="w-px h-8 bg-white/10"></div>
        <div class="text-center">
          <p class="text-xl font-bold text-white">14</p>
          <p class="text-[9px] text-gray-500">Clips</p>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-shield-halved"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-clock-rotate-left"></i><span>Events</span></div>
    <div class="tab active"><i class="fas fa-video"></i><span>Camera</span></div>
    <div class="tab"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
