<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clips</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif;background:#F2F2F7;width:100%;height:100%;overflow:hidden;color:#1C1C1E}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#1C1C1E;position:relative;z-index:20}
.content{height:calc(100% - 147px);overflow-y:auto;padding:0 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(249,249,249,0.94);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.12);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8E8E93;font-size:10px;font-weight:500}
.tab.active{color:#007AFF}
.tab i{font-size:22px}
.card{background:white;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <div class="content">
    <p class="text-[28px] font-bold tracking-tight mb-5">Clips</p>

    <!-- Clip 1 -->
    <div class="card mb-3">
      <div class="relative">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1777572916918-image-1.png" class="w-full h-44 object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.5) 100%)"></div>
        <div class="absolute top-3 left-3 bg-red-500 rounded-full px-2.5 py-1 flex items-center gap-1.5">
          <i class="fas fa-car-burst text-[10px] text-white"></i>
          <span class="text-[11px] font-bold text-white">Impact</span>
        </div>
        <div class="absolute top-3 right-3 bg-black/40 backdrop-blur rounded-full px-2.5 py-1">
          <span class="text-[11px] text-white font-medium">0:47</span>
        </div>
        <div class="absolute bottom-3 left-3">
          <div class="bg-white/20 backdrop-blur rounded-lg px-2 py-1">
            <span class="text-[11px] font-bold text-white">CA 7XKF291</span>
          </div>
        </div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-white/30 backdrop-blur flex items-center justify-center">
            <i class="fas fa-play text-white text-xl ml-1"></i>
          </div>
        </div>
      </div>
      <div class="px-4 py-3">
        <p class="text-[15px] font-semibold">Parking lot impact</p>
        <p class="text-[13px] text-gray-400">Apr 12 · 2:34 PM · Plate captured</p>
      </div>
    </div>

    <!-- Clip 2 -->
    <div class="card mb-3">
      <div class="relative">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1777572910083-image-1.png" class="w-full h-44 object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.5) 100%)"></div>
        <div class="absolute top-3 left-3 bg-blue-500 rounded-full px-2.5 py-1 flex items-center gap-1.5">
          <i class="fas fa-eye text-[10px] text-white"></i>
          <span class="text-[11px] font-bold text-white">Sentry</span>
        </div>
        <div class="absolute top-3 right-3 bg-black/40 backdrop-blur rounded-full px-2.5 py-1">
          <span class="text-[11px] text-white font-medium">1:12</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-white/30 backdrop-blur flex items-center justify-center">
            <i class="fas fa-play text-white text-xl ml-1"></i>
          </div>
        </div>
      </div>
      <div class="px-4 py-3">
        <p class="text-[15px] font-semibold">Motion detected while parked</p>
        <p class="text-[13px] text-gray-400">Apr 8 · 11:42 PM · Sentry mode</p>
      </div>
    </div>

    <!-- Clip 3 -->
    <div class="card mb-4">
      <div class="relative">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1777572924931-image-1.png" class="w-full h-44 object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.5) 100%)"></div>
        <div class="absolute top-3 left-3 bg-yellow-500 rounded-full px-2.5 py-1 flex items-center gap-1.5">
          <i class="fas fa-triangle-exclamation text-[10px] text-black"></i>
          <span class="text-[11px] font-bold text-black">Braking</span>
        </div>
        <div class="absolute top-3 right-3 bg-black/40 backdrop-blur rounded-full px-2.5 py-1">
          <span class="text-[11px] text-white font-medium">0:18</span>
        </div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-white/30 backdrop-blur flex items-center justify-center">
            <i class="fas fa-play text-white text-xl ml-1"></i>
          </div>
        </div>
      </div>
      <div class="px-4 py-3">
        <p class="text-[15px] font-semibold">Hard braking on Highway 101</p>
        <p class="text-[13px] text-gray-400">Mar 29 · 5:12 PM</p>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab active"><i class="fas fa-film"></i><span>Clips</span></div>
    <div class="tab"><i class="fas fa-bell"></i><span>Alerts</span></div>
    <div class="tab"><i class="fas fa-gear"></i><span>Settings</span></div>
  </div>
</div>
</body>
</html>
