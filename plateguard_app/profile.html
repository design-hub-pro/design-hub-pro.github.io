<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0B1A2E;width:100%;height:100%;overflow:hidden;color:white}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white;position:relative;z-index:20}
.content{height:calc(100% - 147px);overflow-y:auto;padding:0 28px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(11,26,46,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#4A6178;font-size:10px;font-weight:500}
.tab.active{color:#F97316}
.tab i{font-size:22px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <div class="content">
    <p class="text-2xl font-bold mb-5">Profile</p>

    <!-- User Card -->
    <div class="rounded-3xl p-5 mb-4 text-center" style="background:linear-gradient(135deg,#0D2847,#1A3A5C)">
      <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200&h=200&fit=crop" class="w-20 h-20 rounded-full mx-auto border-3 border-orange-400 object-cover mb-3">
      <p class="text-xl font-bold">Alex Chen</p>
      <p class="text-[11px] text-gray-400">alex.chen@email.com</p>
      <div class="flex items-center justify-center gap-3 mt-3">
        <div class="bg-orange-500/15 rounded-full px-3 py-1">
          <span class="text-[10px] text-orange-400 font-bold">Pro Plan</span>
        </div>
        <div class="bg-green-500/15 rounded-full px-3 py-1">
          <span class="text-[10px] text-green-400 font-bold">1 Device</span>
        </div>
      </div>
    </div>

    <!-- Safety Score -->
    <div class="bg-white/5 rounded-2xl p-4 border border-white/5 mb-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-sm font-semibold">Safety Score</p>
        <span class="text-2xl font-black text-green-400">96</span>
      </div>
      <div class="w-full h-2 bg-white/10 rounded-full mb-2"><div class="h-full rounded-full" style="width:96%;background:linear-gradient(90deg,#10B981,#34D399)"></div></div>
      <div class="flex items-center justify-between">
        <span class="text-[10px] text-gray-500">Based on 47 safe driving days</span>
        <span class="text-[10px] text-green-400 font-bold">Excellent</span>
      </div>
    </div>

    <!-- Vehicle Info -->
    <div class="bg-white/5 rounded-2xl p-4 border border-white/5 mb-4">
      <p class="text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-3">My Vehicle</p>
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)">
          <i class="fas fa-car text-white text-xl"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold">2024 Tesla Model 3</p>
          <p class="text-[10px] text-gray-500">White · CA 8ABC123</p>
        </div>
        <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
      </div>
    </div>

    <!-- Settings Menu -->
    <div class="bg-white/5 rounded-2xl border border-white/5 divide-y divide-white/5 mb-4">
      <div class="flex items-center gap-3 p-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(249,115,22,0.15)"><i class="fas fa-bell text-orange-400 text-sm"></i></div>
        <span class="text-[12px] font-semibold flex-1">Notifications</span>
        <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
      </div>
      <div class="flex items-center gap-3 p-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(59,130,246,0.15)"><i class="fas fa-cloud text-blue-400 text-sm"></i></div>
        <span class="text-[12px] font-semibold flex-1">Cloud Storage</span>
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-gray-500">42 GB used</span>
          <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
        </div>
      </div>
      <div class="flex items-center gap-3 p-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(168,85,247,0.15)"><i class="fas fa-share-nodes text-purple-400 text-sm"></i></div>
        <span class="text-[12px] font-semibold flex-1">Sharing & Privacy</span>
        <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
      </div>
      <div class="flex items-center gap-3 p-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(34,197,94,0.15)"><i class="fas fa-file-shield text-green-400 text-sm"></i></div>
        <span class="text-[12px] font-semibold flex-1">Insurance</span>
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-green-400 font-bold">Connected</span>
          <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
        </div>
      </div>
      <div class="flex items-center gap-3 p-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:rgba(239,68,68,0.15)"><i class="fas fa-life-ring text-red-400 text-sm"></i></div>
        <span class="text-[12px] font-semibold flex-1">Help & Support</span>
        <i class="fas fa-chevron-right text-gray-500 text-xs"></i>
      </div>
    </div>

    <!-- Sign Out -->
    <button class="w-full bg-white/5 rounded-2xl py-4 text-center text-red-400 text-sm font-semibold border border-white/5 mb-4">
      Sign Out
    </button>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-shield-halved"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-clock-rotate-left"></i><span>Events</span></div>
    <div class="tab"><i class="fas fa-video"></i><span>Camera</span></div>
    <div class="tab"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
