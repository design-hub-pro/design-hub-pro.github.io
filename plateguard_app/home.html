<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif;background:#F2F2F7;width:100%;height:100%;overflow:hidden;color:#1C1C1E}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#1C1C1E;position:relative;z-index:20}
.content{height:calc(100% - 147px);overflow-y:auto;padding:0 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(249,249,249,0.94);backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,0.12);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8E8E93;font-size:10px;font-weight:500}
.tab.active{color:#007AFF}
.tab i{font-size:22px}
.card{background:white;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <div class="content">
    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <p class="text-[28px] font-bold tracking-tight">PlateGuard</p>
      <div class="flex items-center gap-1.5 bg-green-100 rounded-full px-3 py-1.5">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
        <span class="text-[12px] text-green-700 font-semibold">Connected</span>
      </div>
    </div>

    <!-- Live Camera Card -->
    <div class="card mb-3">
      <div class="relative">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1777572897067-image-1.png" class="w-full h-48 object-cover">
        <div class="absolute top-3 left-3 flex items-center gap-1.5 bg-red-500 rounded-full px-2.5 py-1">
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
          <span class="text-[11px] font-bold text-white">LIVE</span>
        </div>
        <div class="absolute bottom-3 right-3 w-9 h-9 rounded-full bg-black/40 backdrop-blur flex items-center justify-center">
          <i class="fas fa-expand text-white text-sm"></i>
        </div>
      </div>
      <div class="px-4 py-3 flex items-center justify-between">
        <div>
          <p class="text-[15px] font-semibold">Rear Camera</p>
          <p class="text-[13px] text-gray-400">4K · Always recording</p>
        </div>
        <i class="fas fa-chevron-right text-gray-300 text-sm"></i>
      </div>
    </div>

    <!-- Status Card -->
    <div class="card mb-3 p-4">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-11 h-11 rounded-full bg-green-50 flex items-center justify-center">
          <i class="fas fa-shield-halved text-green-500 text-lg"></i>
        </div>
        <div>
          <p class="text-[15px] font-semibold">All Clear</p>
          <p class="text-[13px] text-gray-400">No incidents · 47 days safe</p>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
          <p class="text-[22px] font-bold text-gray-900">87%</p>
          <p class="text-[11px] text-gray-400">Battery</p>
        </div>
        <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
          <p class="text-[22px] font-bold text-gray-900">42<span class="text-[13px] text-gray-400">GB</span></p>
          <p class="text-[11px] text-gray-400">Storage</p>
        </div>
        <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
          <p class="text-[22px] font-bold text-gray-900">0</p>
          <p class="text-[11px] text-gray-400">Alerts</p>
        </div>
      </div>
    </div>

    <!-- SOS Button -->
    <button class="card w-full mb-3 p-4 flex items-center gap-4 active:bg-red-50 transition">
      <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FF3B30,#FF2D55)">
        <i class="fas fa-phone-volume text-white text-lg"></i>
      </div>
      <div class="flex-1 text-left">
        <p class="text-[15px] font-semibold text-red-600">Emergency SOS</p>
        <p class="text-[13px] text-gray-400">Auto-calls 911 on severe impact</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300 text-sm"></i>
    </button>

    <!-- Recent -->
    <div class="card mb-4">
      <div class="px-4 pt-3 pb-2">
        <p class="text-[13px] text-gray-400 font-semibold uppercase tracking-wide">Recent</p>
      </div>
      <div class="divide-y divide-gray-100">
        <div class="flex items-center gap-3 px-4 py-3">
          <div class="w-9 h-9 rounded-full bg-green-50 flex items-center justify-center"><i class="fas fa-car text-green-500 text-sm"></i></div>
          <div class="flex-1">
            <p class="text-[14px] font-medium">Trip completed</p>
            <p class="text-[12px] text-gray-400">12.4 mi · No incidents</p>
          </div>
          <span class="text-[12px] text-gray-400">2h</span>
        </div>
        <div class="flex items-center gap-3 px-4 py-3">
          <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center"><i class="fas fa-parking text-blue-500 text-sm"></i></div>
          <div class="flex-1">
            <p class="text-[14px] font-medium">Sentry mode active</p>
            <p class="text-[12px] text-gray-400">Oak & 5th St</p>
          </div>
          <span class="text-[12px] text-gray-400">Now</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-film"></i><span>Clips</span></div>
    <div class="tab"><i class="fas fa-bell"></i><span>Alerts</span></div>
    <div class="tab"><i class="fas fa-gear"></i><span>Settings</span></div>
  </div>
</div>
</body>
</html>
