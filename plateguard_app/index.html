<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlateGuard App — Companion App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#ffffff}
.phone{width:460px;height:980px;background:#1a1a1a;border-radius:62px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,0.12),0 10px 30px rgba(0,0,0,0.06)}
.screen{width:100%;height:100%;background:#F2F2F7;border-radius:52px;overflow:hidden;position:relative}
iframe{width:100%;height:100%;border:none;display:block}
.screen-label{text-align:center;font-size:14px;font-weight:600;color:#8E8E93;margin-top:20px;letter-spacing:0.5px;text-transform:uppercase}
</style>
</head>
<body>
<div class="max-w-[1600px] mx-auto px-10 py-16">
  <div class="text-center mb-20">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold mb-5" style="background:rgba(0,122,255,0.1);color:#007AFF">
      <span class="w-2 h-2 rounded-full animate-pulse" style="background:#007AFF"></span>
      COMPANION APP
    </div>
    <h1 class="text-7xl font-black text-gray-900 tracking-tight">Plate<span style="color:#007AFF">Guard</span></h1>
    <p class="text-xl text-gray-500 mt-4 max-w-xl mx-auto">View your camera, get collision alerts, and manage your PlateGuard device.</p>
  </div>

  <div class="grid grid-cols-3 gap-x-10 gap-y-16 justify-items-center">
    <div>
      <div class="phone"><div class="screen"><iframe src="home.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">Home</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="clips.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">Clips</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="alerts.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">Alerts</p>
    </div>
    <div>
      <div class="phone"><div class="screen"><iframe src="settings.html" scrolling="no"></iframe></div></div>
      <p class="screen-label">Settings</p>
    </div>
  </div>
</div>
</body>
</html>
