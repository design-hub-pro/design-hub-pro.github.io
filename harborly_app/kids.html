<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids corner</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content" style="background:linear-gradient(180deg,#FFF3DF 0%,#F6F3EE 45%)">
    <div class="flex items-center justify-between mt-2 mb-4">
      <div><p class="text-[13px] font-bold text-[#B9802A]">Kids corner</p><h1 class="serif text-[28px] font-semibold leading-tight">Hi Lily!</h1></div>
      <div class="flex stack"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356411730-image-1.png" class="w-10 h-10 av ring-2 ring-[#F5C76B]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356411060-image-1.png" class="w-10 h-10 av opacity-60"></div>
    </div>
    <div class="card !p-4">
      <p class="text-[14px] font-bold">Where am I sleeping tonight?</p>
      <div class="flex items-center gap-3 mt-3">
        <div class="flex-1 rounded-2xl p-3 g-teal text-white text-center"><i class="fas fa-house text-[22px]"></i><p class="text-[13px] font-bold mt-1">Mom's</p><p class="text-[10px] opacity-80">Tonight</p></div>
        <i class="fas fa-arrow-right text-[#C9C2B6]"></i>
        <div class="flex-1 rounded-2xl p-3 bg-[#FBE4DC] text-[#C2553F] text-center"><i class="fas fa-house-chimney text-[22px]"></i><p class="text-[13px] font-bold mt-1">Dad's</p><p class="text-[10px] opacity-80">Thursday</p></div>
      </div>
    </div>
    <div class="hero h-[200px] mt-4"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356411730-image-1.png"><div class="fade"></div><div class="absolute inset-0 flex items-center justify-center"><div class="play"><i class="fas fa-play ml-0.5"></i></div></div><div class="absolute left-4 bottom-4 text-white"><p class="text-[11px] font-bold uppercase tracking-wider opacity-80">Story</p><p class="serif text-[19px] font-semibold">Two homes, one me</p></div><span class="dur">3:40</span></div>
    <p class="label mt-5 mb-3">How do you feel?</p>
    <div class="grid grid-cols-4 gap-2">
      <div class="rounded-2xl bg-[#DCEBFA] py-3 text-center"><i class="fas fa-cloud-rain text-[22px] text-[#3F7FC0]"></i><p class="text-[11px] font-bold mt-1">Sad</p></div>
      <div class="rounded-2xl bg-[#FBE0DA] py-3 text-center"><i class="fas fa-fire text-[22px] text-[#E06E57]"></i><p class="text-[11px] font-bold mt-1">Mad</p></div>
      <div class="rounded-2xl bg-[#EFE8F7] py-3 text-center"><i class="fas fa-question text-[22px] text-[#6E52A3]"></i><p class="text-[11px] font-bold mt-1">Mixed</p></div>
      <div class="rounded-2xl bg-[#FFF0CC] py-3 text-center ring-2 ring-[#D99A2B]"><i class="fas fa-sun text-[22px] text-[#D99A2B]"></i><p class="text-[11px] font-bold mt-1">Okay</p></div>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="card !p-4"><div class="gi g-rose"><i class="fas fa-palette"></i></div><p class="text-[14px] font-bold mt-2">Draw it out</p><p class="text-[11px] muted">Share with mom or dad</p></div>
      <div class="card !p-4"><div class="gi g-sky"><i class="fas fa-comment-dots"></i></div><p class="text-[14px] font-bold mt-2">Ask anything</p><p class="text-[11px] muted">"Is it my fault?"</p></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-scale-balanced"></i><span>Case</span></div>
    <div class="tab"><div class="tab-sos"><i class="fas fa-heart-pulse"></i></div></div>
    <div class="tab"><i class="fas fa-people-roof"></i><span>Life</span></div>
    <div class="tab active"><i class="fas fa-hand-holding-heart"></i><span>Care</span></div>
  </div>
</div>
</body>
</html>
