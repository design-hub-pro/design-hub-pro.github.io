<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen" style="background:#1F3A3D">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356410584-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(20,40,45,.25),rgba(20,40,45,.55) 45%,rgba(15,28,30,.92))"></div>
  <div class="content relative z-10 text-white">
    <div class="nav"><div class="ib !bg-white/15 !text-white !shadow-none backdrop-blur"><i class="fas fa-xmark"></i></div><p class="text-[15px] font-semibold">Calm space</p><div class="ib !bg-white/15 !text-white !shadow-none backdrop-blur"><i class="fas fa-volume-high"></i></div></div>
    <div class="flex flex-col items-center mt-10">
      <div class="w-[210px] h-[210px] rounded-full bg-white/10 flex items-center justify-center backdrop-blur-sm"><div class="w-[160px] h-[160px] rounded-full bg-white/15 flex items-center justify-center"><div class="w-[110px] h-[110px] rounded-full bg-white/90 flex flex-col items-center justify-center text-[#2F6F6A]"><span class="serif text-[30px] font-semibold leading-none">4</span><span class="text-[11px] font-bold mt-1">Breathe in</span></div></div></div>
      <p class="serif text-[24px] font-semibold mt-6">Before the call with Daniel</p>
      <p class="text-[13px] opacity-80 mt-1">Box breathing &middot; 3 min</p>
      <div class="w-[70%] h-1.5 rounded-full bg-white/20 mt-4 overflow-hidden"><div class="h-full w-[35%] bg-white rounded-full"></div></div>
    </div>
    <div class="rounded-[22px] p-4 mt-8 bg-white/10 backdrop-blur-md border border-white/15">
      <div class="flex items-center justify-between"><p class="text-[13px] font-bold">Your week</p><span class="text-[12px] font-bold text-[#9FE3D6]"><i class="fas fa-arrow-trend-up mr-1"></i>Better</span></div>
      <div class="flex items-end gap-2 h-[96px] mt-3"><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:36px"></div><span class="text-[10px] opacity-70">M</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:48px"></div><span class="text-[10px] opacity-70">T</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:24px"></div><span class="text-[10px] opacity-70">W</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:36px"></div><span class="text-[10px] opacity-70">T</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:60px"></div><span class="text-[10px] opacity-70">F</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-white/25" style="height:72px"></div><span class="text-[10px] opacity-70">S</span></div><div class="flex-1 flex flex-col items-center gap-1"><div class="w-full rounded-lg bg-[#9FE3D6]" style="height:72px"></div><span class="text-[10px] opacity-70">S</span></div></div>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="rounded-2xl p-3 bg-white/10 backdrop-blur-md text-center"><i class="fas fa-pen-to-square text-[18px]"></i><p class="text-[11px] font-bold mt-1">Journal</p></div>
      <div class="rounded-2xl p-3 bg-white/10 backdrop-blur-md text-center"><i class="fas fa-moon text-[18px]"></i><p class="text-[11px] font-bold mt-1">Sleep</p></div>
      <div class="rounded-2xl p-3 bg-[#E8846B] text-center"><i class="fas fa-phone text-[18px]"></i><p class="text-[11px] font-bold mt-1">Talk now</p></div>
    </div>
    <p class="text-[11px] text-center opacity-70 mt-3">In crisis? Call or text 988, any time.</p>
  </div>
</div>
</body>
</html>
