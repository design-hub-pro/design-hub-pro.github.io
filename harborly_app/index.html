<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harborly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#1E2B2A}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c302f,#0c0f0e);box-shadow:0 50px 80px -30px rgba(30,60,55,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F6F3EE}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#5BA79E,#2F6F6A 55%,#E8846B)"><i class="fa-solid fa-anchor text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-semibold tracking-tight" style="font-family:'Fraunces',Georgia,serif">Harborly</h1>
  <p class="mt-3 text-[19px] text-gray-500">Legal steps, a new home and mental health support for every family member going through divorce.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-teal-50 text-teal-800">Family</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Legal</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Mental Health</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Co-Parenting</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="roadmap.html" scrolling="no" title="roadmap"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="legal.html" scrolling="no" title="legal"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="vault.html" scrolling="no" title="vault"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="money.html" scrolling="no" title="money"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="custody.html" scrolling="no" title="custody"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="messages.html" scrolling="no" title="messages"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="calm.html" scrolling="no" title="calm"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="therapist.html" scrolling="no" title="therapist"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="kids.html" scrolling="no" title="kids"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="circle.html" scrolling="no" title="circle"></iframe></div></div>
</div></main>
</body></html>
