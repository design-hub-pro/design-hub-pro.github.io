<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356409863-image-1.png" class="absolute inset-0 w-full h-[62%] object-cover">
  <div class="absolute inset-0 h-[62%]" style="background:linear-gradient(180deg,rgba(20,30,28,.35) 0%,rgba(20,30,28,0) 30%,rgba(246,243,238,0) 70%,#F6F3EE 100%)"></div>
  <div class="absolute left-0 right-0 bottom-0 px-7 pb-10">
    <div class="w-14 h-14 rounded-[18px] g-teal flex items-center justify-center text-white text-[22px] shadow-lg"><i class="fas fa-anchor"></i></div>
    <h1 class="serif text-[36px] font-semibold leading-[1.08] mt-5">One steady place for the whole family.</h1>
    <p class="text-[15px] muted mt-3">Legal steps, a new home, and the feelings in between.</p>
    <p class="label mt-7 mb-3">I am</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="card !p-4 flex items-center gap-3 ring-2 ring-[#2F6F6A]"><div class="gi g-teal"><i class="fas fa-user"></i></div><div><p class="text-[14px] font-bold">A parent</p><p class="text-[11px] muted">Separating</p></div></div>
      <div class="card !p-4 flex items-center gap-3"><div class="gi g-sky"><i class="fas fa-headphones"></i></div><div><p class="text-[14px] font-bold">A teen</p><p class="text-[11px] muted">13 to 17</p></div></div>
      <div class="card !p-4 flex items-center gap-3"><div class="gi g-gold"><i class="fas fa-crayons"></i></div><div><p class="text-[14px] font-bold">A child</p><p class="text-[11px] muted">With a parent</p></div></div>
      <div class="card !p-4 flex items-center gap-3"><div class="gi g-rose"><i class="fas fa-people-group"></i></div><div><p class="text-[14px] font-bold">Family</p><p class="text-[11px] muted">Grandparent, etc.</p></div></div>
    </div>
    <div class="btn primary mt-6">Continue <i class="fas fa-arrow-right text-[14px]"></i></div>
    <p class="text-center text-[12px] muted mt-4"><i class="fas fa-lock mr-1"></i>Private by default. Your ex never sees your space.</p>
  </div>
</div>
</body>
</html>
