<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GripSense - Pair Device</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0A1310; color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.7; }
    70% { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .ring { animation: pulse 2.4s cubic-bezier(0.4,0,0.6,1) infinite; }
  .ring.d2 { animation-delay: 0.8s; }
  .ring.d3 { animation-delay: 1.6s; }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-full" style="font-size: 15px;"></i>
  </div>
</div>

<!-- Content -->
<div style="padding: 0 28px 40px 28px; min-height: 880px; display: flex; flex-direction: column;">

  <!-- Brand -->
  <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px; margin-bottom: 40px;">
    <div style="width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #A3E635, #10B981); display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-hand-fist" style="font-size: 18px; color: #06140C;"></i>
    </div>
    <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.5px;">GripSense</span>
  </div>

  <!-- Headline -->
  <div style="margin-bottom: 8px;">
    <div style="font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.1;">Pair your<br>smart grip</div>
  </div>
  <p style="font-size: 15px; color: #8A9690; line-height: 1.5; margin-bottom: 36px;">Slide the GripSense overgrip onto your racket and hold the power button for 2 seconds.</p>

  <!-- Pairing Visual -->
  <div style="position: relative; height: 300px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
    <!-- Pulsing rings -->
    <div class="ring" style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(163,230,53,0.18);"></div>
    <div class="ring d2" style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(163,230,53,0.14);"></div>
    <div class="ring d3" style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(163,230,53,0.10);"></div>

    <!-- Racket image -->
    <div style="position: relative; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(163,230,53,0.4); z-index: 2;">
      <img src="https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?w=400&h=400&fit=crop" style="width: 100%; height: 100%; object-fit: cover;" alt="Racket grip">
    </div>

    <!-- Bluetooth badge -->
    <div style="position: absolute; bottom: 36px; right: 78px; width: 44px; height: 44px; border-radius: 50%; background: #10B981; display: flex; align-items: center; justify-content: center; z-index: 3; box-shadow: 0 8px 24px rgba(16,185,129,0.5);">
      <i class="fab fa-bluetooth-b" style="font-size: 20px; color: #fff;"></i>
    </div>
  </div>

  <!-- Found device card -->
  <div style="background: #131E18; border: 1px solid rgba(163,230,53,0.25); border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px;">
    <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(163,230,53,0.12); display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-table-tennis-paddle-ball" style="font-size: 20px; color: #A3E635;"></i>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 15px; font-weight: 700;">GripSense Pro</div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #A3E635;"></div>
        <span style="font-size: 12px; color: #8A9690;">Found · 98% battery</span>
      </div>
    </div>
    <i class="fas fa-circle-check" style="font-size: 22px; color: #A3E635;"></i>
  </div>

  <div style="flex: 1;"></div>

  <!-- CTA -->
  <a href="home.html" style="text-decoration: none; display: block;">
    <div style="background: linear-gradient(135deg, #A3E635, #10B981); border-radius: 18px; padding: 18px; text-align: center; color: #06140C; font-size: 16px; font-weight: 700; box-shadow: 0 12px 30px rgba(16,185,129,0.3);">
      Connect Device
    </div>
  </a>
  <div style="text-align: center; margin-top: 16px; font-size: 14px; color: #8A9690;">Set up manually</div>

</div>

</body>
</html>
