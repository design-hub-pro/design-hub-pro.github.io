<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GripSense - Live Session</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 22%, #0F2A1C 0%, #0A1310 55%); color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
  @keyframes needleSwing {
    0%, 100% { transform: rotate(-14deg); }
    50% { transform: rotate(12deg); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .needle { animation: needleSwing 3.2s ease-in-out infinite; transform-origin: bottom center; }
  .live-dot { animation: glowPulse 1.4s ease-in-out infinite; }
  @keyframes barWave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }
  .wb { animation: barWave 1.1s ease-in-out infinite; transform-origin: center; }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-full" style="font-size: 15px;"></i>
  </div>
</div>

<!-- Content -->
<div style="padding: 0 28px 110px 28px;">

  <!-- Top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px;">
    <a href="home.html" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; text-decoration: none;">
      <i class="fas fa-chevron-left" style="font-size: 15px; color: #fff;"></i>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; background: rgba(239,68,68,0.15); padding: 7px 14px; border-radius: 20px;">
      <div class="live-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #EF4444;"></div>
      <span style="font-size: 12px; font-weight: 700; color: #FCA5A5; letter-spacing: 1px;">LIVE · 12:48</span>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-table-tennis-paddle-ball" style="font-size: 15px; color: #A3E635;"></i>
    </div>
  </div>

  <!-- Status label -->
  <div style="text-align: center; margin-bottom: 6px;">
    <div style="font-size: 13px; color: #8A9690; letter-spacing: 1px; text-transform: uppercase;">Grip Pressure</div>
  </div>

  <!-- Gauge -->
  <div style="position: relative; width: 280px; height: 175px; margin: 0 auto 4px;">
    <svg width="280" height="175" viewBox="0 0 280 175">
      <!-- track -->
      <path d="M 24 160 A 116 116 0 0 1 256 160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20" stroke-linecap="round"/>
      <!-- green zone -->
      <path d="M 24 160 A 116 116 0 0 1 95 56" fill="none" stroke="#22C55E" stroke-width="20" stroke-linecap="round"/>
      <!-- target zone (lime) -->
      <path d="M 100 53 A 116 116 0 0 1 180 53" fill="none" stroke="#A3E635" stroke-width="20"/>
      <!-- warn zone -->
      <path d="M 185 56 A 116 116 0 0 1 256 160" fill="none" stroke="#EF4444" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <!-- Needle -->
    <div style="position: absolute; left: 50%; bottom: 15px; width: 4px; height: 108px; transform-origin: bottom center;">
      <div class="needle" style="width: 4px; height: 108px; background: linear-gradient(to top, #fff, #A3E635); border-radius: 4px; transform-origin: bottom center;"></div>
    </div>
    <div style="position: absolute; left: 50%; bottom: 9px; transform: translateX(-50%); width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(163,230,53,0.3);"></div>
    <!-- labels -->
    <div style="position: absolute; left: 8px; bottom: 0; font-size: 11px; color: #22C55E; font-weight: 600;">Soft</div>
    <div style="position: absolute; right: 8px; bottom: 0; font-size: 11px; color: #EF4444; font-weight: 600;">Tight</div>
  </div>

  <!-- Big readout -->
  <div style="text-align: center; margin-bottom: 8px;">
    <div style="font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1;">2.0<span style="font-size: 22px; color: #8A9690; font-weight: 600;"> kg</span></div>
    <div style="display: inline-flex; align-items: center; gap: 7px; background: rgba(163,230,53,0.15); padding: 6px 16px; border-radius: 20px; margin-top: 12px;">
      <i class="fas fa-circle-check" style="font-size: 12px; color: #A3E635;"></i>
      <span style="font-size: 13px; font-weight: 700; color: #A3E635;">Perfect — in the zone</span>
    </div>
  </div>

  <!-- Live waveform -->
  <div style="background: rgba(255,255,255,0.04); border-radius: 18px; padding: 18px 20px; margin: 22px 0 18px; display: flex; align-items: center; justify-content: center; gap: 4px; height: 76px;">
    <div class="wb" style="width: 5px; height: 30px; background: #22C55E; border-radius: 3px; animation-delay: 0s;"></div>
    <div class="wb" style="width: 5px; height: 44px; background: #4ADE80; border-radius: 3px; animation-delay: 0.1s;"></div>
    <div class="wb" style="width: 5px; height: 26px; background: #A3E635; border-radius: 3px; animation-delay: 0.2s;"></div>
    <div class="wb" style="width: 5px; height: 50px; background: #A3E635; border-radius: 3px; animation-delay: 0.3s;"></div>
    <div class="wb" style="width: 5px; height: 34px; background: #A3E635; border-radius: 3px; animation-delay: 0.4s;"></div>
    <div class="wb" style="width: 5px; height: 56px; background: #FBBF24; border-radius: 3px; animation-delay: 0.5s;"></div>
    <div class="wb" style="width: 5px; height: 38px; background: #A3E635; border-radius: 3px; animation-delay: 0.6s;"></div>
    <div class="wb" style="width: 5px; height: 46px; background: #4ADE80; border-radius: 3px; animation-delay: 0.7s;"></div>
    <div class="wb" style="width: 5px; height: 28px; background: #22C55E; border-radius: 3px; animation-delay: 0.8s;"></div>
    <div class="wb" style="width: 5px; height: 42px; background: #A3E635; border-radius: 3px; animation-delay: 0.9s;"></div>
    <div class="wb" style="width: 5px; height: 32px; background: #A3E635; border-radius: 3px; animation-delay: 1.0s;"></div>
    <div class="wb" style="width: 5px; height: 52px; background: #FBBF24; border-radius: 3px; animation-delay: 1.1s;"></div>
    <div class="wb" style="width: 5px; height: 36px; background: #4ADE80; border-radius: 3px; animation-delay: 0.2s;"></div>
    <div class="wb" style="width: 5px; height: 24px; background: #22C55E; border-radius: 3px; animation-delay: 0.5s;"></div>
  </div>

  <!-- Live mini stats -->
  <div style="display: flex; gap: 12px; margin-bottom: 24px;">
    <div style="flex: 1; background: #131E18; border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 22px; font-weight: 800; color: #A3E635;">93%</div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">In zone</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 22px; font-weight: 800; color: #14B8A6;">48</div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">Strokes</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 22px; font-weight: 800; color: #FBBF24;">3</div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">Over-grips</div>
    </div>
  </div>

  <!-- Controls -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 24px;">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #131E18; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <i class="fas fa-volume-high" style="font-size: 18px; color: #A3E635;"></i>
    </div>
    <div style="width: 78px; height: 78px; border-radius: 50%; background: #EF4444; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(239,68,68,0.4);">
      <i class="fas fa-stop" style="font-size: 26px; color: #fff;"></i>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #131E18; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <i class="fas fa-pause" style="font-size: 18px; color: #C5CFC9;"></i>
    </div>
  </div>

</div>

</body>
</html>
