<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GripSense - Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: #0A1310; color: #FFFFFF;
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative;">
  <span style="font-size: 15px; font-weight: 600;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-full" style="font-size: 15px;"></i>
  </div>
</div>

<!-- Content -->
<div style="padding: 0 28px 110px 28px;">

  <!-- Header -->
  <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
    <i class="fas fa-gear" style="font-size: 20px; color: #C5CFC9;"></i>
  </div>

  <!-- Profile -->
  <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;">
    <div style="position: relative;">
      <div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(163,230,53,0.5);">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop&crop=face" style="width: 100%; height: 100%; object-fit: cover;" alt="Avatar">
      </div>
      <div style="position: absolute; bottom: 2px; right: 2px; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #A3E635, #10B981); display: flex; align-items: center; justify-content: center; border: 3px solid #0A1310;">
        <i class="fas fa-bolt" style="font-size: 11px; color: #06140C;"></i>
      </div>
    </div>
    <div style="font-size: 22px; font-weight: 800; margin-top: 14px;">Maya Chen</div>
    <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(163,230,53,0.14); padding: 5px 14px; border-radius: 20px; margin-top: 8px;">
      <i class="fas fa-medal" style="font-size: 11px; color: #A3E635;"></i>
      <span style="font-size: 12px; font-weight: 600; color: #A3E635;">Level 7 · Smooth Operator</span>
    </div>
  </div>

  <!-- Top stats -->
  <div style="display: flex; gap: 12px; margin-bottom: 24px;">
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 26px; font-weight: 800; color: #A3E635;">142</div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">Sessions</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 26px; font-weight: 800; color: #14B8A6;">38<span style="font-size: 13px; color: #8A9690;">h</span></div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">On court</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 26px; font-weight: 800; color: #FBBF24;">9</div>
      <div style="font-size: 11px; color: #8A9690; margin-top: 2px;">Badges</div>
    </div>
  </div>

  <!-- Device card -->
  <div style="background: linear-gradient(135deg, #14532D, #0F3D24); border-radius: 22px; padding: 20px; margin-bottom: 24px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -30px; right: -20px; width: 110px; height: 110px; border-radius: 50%; background: rgba(163,230,53,0.10);"></div>
    <div style="display: flex; align-items: center; gap: 14px; position: relative; z-index: 1;">
      <div style="width: 52px; height: 52px; border-radius: 15px; background: rgba(163,230,53,0.2); display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-table-tennis-paddle-ball" style="font-size: 22px; color: #A3E635;"></i>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 15px; font-weight: 700;">GripSense Pro</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: #A3E635;"></div>
          <span style="font-size: 12px; color: #B7C2BB;">Connected · Firmware 2.4</span>
        </div>
      </div>
      <div style="text-align: center;">
        <i class="fas fa-battery-three-quarters" style="font-size: 16px; color: #A3E635;"></i>
        <div style="font-size: 12px; color: #B7C2BB; margin-top: 4px;">76%</div>
      </div>
    </div>
  </div>

  <!-- Achievements -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
    <div style="font-size: 17px; font-weight: 700;">Achievements</div>
    <span style="font-size: 13px; color: #A3E635; font-weight: 600;">View all</span>
  </div>
  <div style="display: flex; gap: 12px; margin-bottom: 24px;">
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(163,230,53,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;"><i class="fas fa-feather" style="font-size: 18px; color: #A3E635;"></i></div>
      <div style="font-size: 11px; font-weight: 600;">Featherlight</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(20,184,166,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;"><i class="fas fa-fire" style="font-size: 18px; color: #14B8A6;"></i></div>
      <div style="font-size: 11px; font-weight: 600;">10-Day Streak</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
      <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(251,191,36,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;"><i class="fas fa-bullseye" style="font-size: 18px; color: #FBBF24;"></i></div>
      <div style="font-size: 11px; font-weight: 600;">90% Zone</div>
    </div>
    <div style="flex: 1; background: #131E18; border-radius: 18px; padding: 16px 8px; text-align: center; border: 1px solid rgba(255,255,255,0.06); opacity: 0.45;">
      <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;"><i class="fas fa-lock" style="font-size: 16px; color: #6B776F;"></i></div>
      <div style="font-size: 11px; font-weight: 600; color: #8A9690;">Locked</div>
    </div>
  </div>

  <!-- Menu -->
  <div style="background: #131E18; border-radius: 20px; border: 1px solid rgba(255,255,255,0.06); overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.05);">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: rgba(163,230,53,0.12); display: flex; align-items: center; justify-content: center;"><i class="fas fa-bullseye" style="font-size: 15px; color: #A3E635;"></i></div>
      <span style="font-size: 15px; font-weight: 500; flex: 1;">Grip targets</span>
      <i class="fas fa-chevron-right" style="font-size: 13px; color: #6B776F;"></i>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.05);">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: rgba(20,184,166,0.12); display: flex; align-items: center; justify-content: center;"><i class="fas fa-bell" style="font-size: 15px; color: #14B8A6;"></i></div>
      <span style="font-size: 15px; font-weight: 500; flex: 1;">Audio & haptics</span>
      <i class="fas fa-chevron-right" style="font-size: 13px; color: #6B776F;"></i>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px;">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: rgba(251,191,36,0.12); display: flex; align-items: center; justify-content: center;"><i class="fas fa-circle-question" style="font-size: 15px; color: #FBBF24;"></i></div>
      <span style="font-size: 15px; font-weight: 500; flex: 1;">Help & support</span>
      <i class="fas fa-chevron-right" style="font-size: 13px; color: #6B776F;"></i>
    </div>
  </div>

</div>

<!-- Tab Bar -->
<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 88px; background: rgba(10,19,16,0.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 100;">
  <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-house" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Home</span>
  </a>
  <a href="insights.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-chart-line" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Insights</span>
  </a>
  <a href="live.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #A3E635, #10B981); display: flex; align-items: center; justify-content: center; margin-top: -16px; box-shadow: 0 8px 20px rgba(16,185,129,0.4);">
      <i class="fas fa-bolt" style="font-size: 20px; color: #06140C;"></i>
    </div>
  </a>
  <a href="drills.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-graduation-cap" style="font-size: 21px; color: #6B776F;"></i>
    <span style="font-size: 10px; color: #6B776F;">Drills</span>
  </a>
  <a href="profile.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; min-width: 50px;">
    <i class="fas fa-user" style="font-size: 21px; color: #A3E635;"></i>
    <span style="font-size: 10px; color: #A3E635; font-weight: 600;">Profile</span>
  </a>
</div>

</body>
</html>
