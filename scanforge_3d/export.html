<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScanForge 3D - Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
        .model-preview {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-5px) rotateY(10deg); }
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-4 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">Export Model</h1>
        </div>
    </div>

    <!-- Model Preview -->
    <div class="px-6 py-6">
        <div class="bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100 rounded-3xl p-8 flex items-center justify-center" style="height: 200px;">
            <div class="model-preview">
                <i class="fas fa-chess-knight text-blue-600 text-7xl drop-shadow-lg"></i>
            </div>
        </div>
        <div class="mt-4 text-center">
            <h2 class="text-xl font-bold text-gray-900">Chess Knight</h2>
            <p class="text-base text-gray-500">4.2 MB • 48,320 vertices • 96,640 faces</p>
        </div>
    </div>

    <!-- Export Format -->
    <div class="px-6 py-2">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">Export Format</h3>
        <div class="space-y-3">
            <label class="flex items-center p-4 bg-white rounded-2xl border-2 border-blue-500 shadow-sm cursor-pointer">
                <input type="radio" name="format" checked class="hidden">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mr-4">
                    <i class="fas fa-cube text-blue-600 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">STL Format</h4>
                    <p class="text-sm text-gray-500">Best for 3D printing</p>
                </div>
                <div class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-sm"></i>
                </div>
            </label>

            <label class="flex items-center p-4 bg-white rounded-2xl border border-gray-200 shadow-sm cursor-pointer">
                <input type="radio" name="format" class="hidden">
                <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center mr-4">
                    <i class="fas fa-file-code text-purple-600 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">OBJ Format</h4>
                    <p class="text-sm text-gray-500">With textures and materials</p>
                </div>
                <div class="w-6 h-6 border-2 border-gray-300 rounded-full"></div>
            </label>

            <label class="flex items-center p-4 bg-white rounded-2xl border border-gray-200 shadow-sm cursor-pointer">
                <input type="radio" name="format" class="hidden">
                <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center mr-4">
                    <i class="fas fa-file-archive text-emerald-600 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-base">GLTF/GLB Format</h4>
                    <p class="text-sm text-gray-500">For web and AR applications</p>
                </div>
                <div class="w-6 h-6 border-2 border-gray-300 rounded-full"></div>
            </label>
        </div>
    </div>

    <!-- Print Settings -->
    <div class="px-6 py-4">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">Print Settings</h3>
        <div class="bg-white rounded-2xl p-4 space-y-4 border border-gray-100">
            <div class="flex items-center justify-between">
                <span class="text-base text-gray-700">Scale</span>
                <div class="flex items-center gap-3">
                    <button class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-minus text-gray-600 text-sm"></i>
                    </button>
                    <span class="font-semibold text-gray-900 w-16 text-center">100%</span>
                    <button class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-plus text-gray-600 text-sm"></i>
                    </button>
                </div>
            </div>
            <div class="border-t border-gray-100"></div>
            <div class="flex items-center justify-between">
                <span class="text-base text-gray-700">Resolution</span>
                <select class="px-4 py-2 bg-gray-100 rounded-xl text-base font-medium text-gray-900 focus:outline-none">
                    <option>High (0.1mm)</option>
                    <option>Medium (0.2mm)</option>
                    <option>Low (0.3mm)</option>
                </select>
            </div>
            <div class="border-t border-gray-100"></div>
            <div class="flex items-center justify-between">
                <span class="text-base text-gray-700">Generate Supports</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
        </div>
    </div>

    <!-- Export Summary -->
    <div class="px-6 py-2">
        <div class="bg-blue-50 rounded-2xl p-4 flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                <i class="fas fa-info-circle text-blue-600 text-xl"></i>
            </div>
            <div class="flex-1">
                <p class="text-base text-blue-800">Estimated print time: <span class="font-semibold">2h 45m</span></p>
                <p class="text-sm text-blue-600">Material: ~15g PLA filament</p>
            </div>
        </div>
    </div>

    <!-- Export Button -->
    <div class="px-6 py-4">
        <button class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl font-semibold text-lg shadow-lg">
            <i class="fas fa-download mr-2"></i>Export Model
        </button>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-crosshairs text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Scan</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-folder text-blue-600 text-2xl"></i>
                <span class="text-sm text-blue-600 font-medium mt-1">Library</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Stats</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
