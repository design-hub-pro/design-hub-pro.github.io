<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: linear-gradient(180deg, #fff7ed 0%, #fed7aa 60%, #fdba74 100%); }
@keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.wobble { animation: wobble 1.8s ease-in-out infinite; transform-origin: center bottom; }
@keyframes shrink { from { width: 100%; } to { width: 0; } }
.shrink { animation: shrink 20s linear infinite; }
@keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.4); } 50% { box-shadow: 0 0 0 18px rgba(244,63,94,0); } }
.pulse-red { animation: pulse-red 1.6s ease-out infinite; }
</style>
</head>
<body>
<div class="screen">

  <!-- Status Bar -->
  <div class="absolute top-0 left-0 right-0 h-[59px] px-7 flex items-center justify-between z-50">
    <span class="text-sm font-semibold text-slate-900">9:41</span>
    <div class="w-[160px] h-[34px] bg-rose-500 rounded-full flex items-center justify-center gap-1.5 pulse-red">
      <i class="fas fa-exclamation-circle text-white text-[11px]"></i>
      <span class="text-[10px] font-bold text-white">Phone lifted · 12s</span>
    </div>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-slate-900"></i>
      <i class="fas fa-wifi text-xs text-slate-900"></i>
      <i class="fas fa-battery-full text-sm text-slate-900"></i>
    </div>
  </div>

  <div class="absolute inset-0 pt-20 pb-10 px-7 flex flex-col">

    <!-- Top alert pill -->
    <div class="flex items-center justify-center mb-4">
      <div class="bg-rose-500/15 border border-rose-400/40 backdrop-blur rounded-full px-3 py-1.5 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
        <span class="text-[11px] font-bold text-rose-700 uppercase tracking-wider">Sprout needs your attention</span>
      </div>
    </div>

    <!-- Sprout speech -->
    <div class="flex items-end gap-3 mb-5">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-200 to-orange-400 flex-shrink-0 flex items-center justify-center wobble shadow-lg">
        <i class="fas fa-feather text-orange-800 text-2xl"></i>
      </div>
      <div class="flex-1 bg-white rounded-3xl rounded-bl-md p-4 shadow-xl">
        <p class="text-[11px] text-amber-700 font-bold uppercase tracking-wider mb-1">Sprout · just now</p>
        <p class="text-base font-bold text-slate-900 leading-snug">"Hey Alex, I saw you grab your phone 👀 What's up?"</p>
      </div>
    </div>

    <!-- Streak hourglass -->
    <div class="bg-white rounded-3xl p-5 shadow-xl mb-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-bold text-slate-900">Your streak melts in</p>
        <p class="text-2xl font-black text-rose-600 tabular-nums">00:48</p>
      </div>
      <div class="h-2 bg-rose-100 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-rose-500 to-orange-500 rounded-full" style="width: 32%"></div>
      </div>
      <div class="flex items-center justify-between mt-3 text-[11px] text-slate-500 font-semibold">
        <span><i class="fas fa-fire text-orange-500 mr-1"></i>12-day streak</span>
        <span><i class="fas fa-coins text-amber-500 mr-1"></i>94 XP at risk</span>
      </div>
    </div>

    <!-- Mini quick game -->
    <div class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 rounded-3xl p-5 shadow-xl text-white mb-4 relative overflow-hidden">
      <div class="absolute -top-8 -right-8 w-32 h-32 rounded-full bg-white/10"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full bg-white/10"></div>

      <div class="relative flex items-center justify-between mb-3">
        <div>
          <p class="text-[10px] uppercase tracking-widest font-bold text-purple-200">Win it back</p>
          <p class="text-lg font-black">Tap the leaves, save your tree</p>
        </div>
        <div class="bg-white/20 backdrop-blur rounded-xl px-2.5 py-1">
          <span class="text-xs font-black">30s</span>
        </div>
      </div>

      <!-- Game grid -->
      <div class="relative grid grid-cols-4 gap-2 my-3">
        <div class="aspect-square rounded-xl bg-white/20 flex items-center justify-center"><i class="fas fa-leaf text-emerald-300"></i></div>
        <div class="aspect-square rounded-xl bg-emerald-400 flex items-center justify-center ring-2 ring-white"><i class="fas fa-leaf text-white"></i></div>
        <div class="aspect-square rounded-xl bg-white/20"></div>
        <div class="aspect-square rounded-xl bg-white/20 flex items-center justify-center"><i class="fas fa-leaf text-emerald-300"></i></div>
        <div class="aspect-square rounded-xl bg-white/20"></div>
        <div class="aspect-square rounded-xl bg-emerald-400 flex items-center justify-center ring-2 ring-white"><i class="fas fa-leaf text-white"></i></div>
        <div class="aspect-square rounded-xl bg-white/20 flex items-center justify-center"><i class="fas fa-leaf text-emerald-300"></i></div>
        <div class="aspect-square rounded-xl bg-white/20"></div>
      </div>

      <div class="relative flex items-center justify-between text-xs">
        <span class="font-bold">Leaves caught: <span class="text-amber-300">2/8</span></span>
        <span class="font-semibold text-purple-100">Re-dock to skip</span>
      </div>
    </div>

    <!-- Suggested actions -->
    <div class="flex-1"></div>
    <p class="text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-2 px-1">Sprout suggests</p>
    <div class="flex flex-col gap-2 mb-4">
      <button class="bg-slate-900 text-white font-bold py-3.5 rounded-2xl flex items-center justify-between px-4">
        <span class="flex items-center gap-2"><i class="fas fa-undo-alt text-amber-400"></i> Re-dock & save my streak</span>
        <i class="fas fa-arrow-right text-sm text-amber-400"></i>
      </button>
      <button class="bg-white text-slate-800 font-semibold py-3 rounded-2xl flex items-center justify-between px-4 border border-slate-200">
        <span class="flex items-center gap-2"><i class="fas fa-coffee text-orange-500"></i> Take a planned 5-min break</span>
        <i class="fas fa-arrow-right text-sm text-slate-400"></i>
      </button>
      <button class="text-rose-600 text-xs font-bold py-1.5 underline">I'm done focusing for now</button>
    </div>

    <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900 rounded-full"></div>
  </div>
</div>
</body>
</html>
