<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 60%, #020617 100%); }
@keyframes leaf-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.leaf-pulse { animation: leaf-pulse 3s ease-in-out infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }
.spark { animation: rise 4s ease-out infinite; }
@keyframes dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.live-dot { animation: dot 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div class="screen">

  <!-- Glowing aura -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] rounded-full bg-amber-500/20 blur-3xl"></div>

  <!-- Status Bar -->
  <div class="absolute top-0 left-0 right-0 h-[59px] px-7 flex items-center justify-between z-50">
    <span class="text-sm font-semibold text-white">9:41</span>
    <div class="w-[110px] h-[34px] bg-black rounded-full ring-1 ring-amber-500/50 flex items-center justify-between px-3">
      <i class="fas fa-feather text-amber-400 text-[10px]"></i>
      <span class="text-[10px] font-bold text-amber-300">47:12</span>
    </div>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-white"></i>
      <i class="fas fa-wifi text-xs text-white"></i>
      <i class="fas fa-battery-full text-sm text-white"></i>
    </div>
  </div>

  <div class="absolute inset-0 pt-20 pb-10 px-7 flex flex-col">

    <!-- Top dock status -->
    <div class="flex items-center justify-between">
      <div class="bg-white/10 backdrop-blur-xl rounded-full px-3.5 py-2 flex items-center gap-2 border border-white/10">
        <div class="w-2 h-2 bg-amber-400 rounded-full live-dot"></div>
        <span class="text-[11px] font-bold text-white">Phone docked · safe</span>
      </div>
      <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center border border-white/10">
        <i class="fas fa-times text-white text-sm"></i>
      </button>
    </div>

    <!-- Timer + Sprout tree -->
    <div class="flex-1 flex flex-col items-center justify-center relative">

      <!-- Sparkles -->
      <div class="absolute left-1/4 top-1/3 text-amber-300 text-xs spark">✦</div>
      <div class="absolute right-1/4 top-1/2 text-amber-300 text-sm spark" style="animation-delay:1s">✦</div>
      <div class="absolute left-1/3 top-2/3 text-amber-300 text-xs spark" style="animation-delay:2s">✦</div>

      <p class="text-[11px] font-bold text-amber-300 uppercase tracking-widest mb-3">Deep work · Math review</p>

      <!-- Big circle -->
      <div class="relative w-72 h-72 rounded-full bg-gradient-to-br from-amber-500/20 to-orange-600/10 flex items-center justify-center border border-amber-400/30 leaf-pulse">
        <div class="absolute inset-4 rounded-full border-2 border-dashed border-amber-400/30"></div>
        <div class="text-center">
          <p class="text-[10px] uppercase tracking-widest text-amber-300/90 font-bold">Time focused</p>
          <p class="text-6xl font-black text-white tracking-tight">47:12</p>
          <p class="text-xs text-amber-300/80 font-semibold mt-1">Target 60:00</p>
        </div>
        <!-- progress arc -->
        <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="46" fill="none" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="62"/>
          <defs><linearGradient id="g1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs>
        </svg>
      </div>

      <!-- Growing tree label -->
      <div class="mt-8 bg-white/10 backdrop-blur-xl rounded-2xl p-3 flex items-center gap-3 border border-white/10 w-full">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-200 to-orange-300 flex-shrink-0 flex items-center justify-center">
          <i class="fas fa-feather text-orange-700 text-base"></i>
        </div>
        <div class="flex-1">
          <p class="text-xs text-amber-300 font-bold">Sprout is cheering</p>
          <p class="text-sm text-white font-semibold leading-snug">"Half-way mark! Your nest tree just grew a new branch 🌿"</p>
        </div>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div class="bg-white/10 backdrop-blur-xl rounded-2xl p-3 border border-white/10">
        <i class="fas fa-bolt text-amber-400 text-sm"></i>
        <p class="text-[10px] uppercase text-white/60 font-bold mt-1">XP earning</p>
        <p class="text-lg font-black text-white">+94</p>
      </div>
      <div class="bg-white/10 backdrop-blur-xl rounded-2xl p-3 border border-white/10">
        <i class="fas fa-fire text-orange-400 text-sm"></i>
        <p class="text-[10px] uppercase text-white/60 font-bold mt-1">Streak</p>
        <p class="text-lg font-black text-white">12d</p>
      </div>
      <div class="bg-white/10 backdrop-blur-xl rounded-2xl p-3 border border-white/10">
        <i class="fas fa-leaf text-emerald-400 text-sm"></i>
        <p class="text-[10px] uppercase text-white/60 font-bold mt-1">Tree lvl</p>
        <p class="text-lg font-black text-white">7</p>
      </div>
    </div>

    <!-- Action -->
    <div class="flex gap-2">
      <button class="flex-1 bg-white/10 backdrop-blur-xl text-white font-bold py-4 rounded-2xl border border-white/10 flex items-center justify-center gap-2">
        <i class="fas fa-pause text-sm"></i>
        Pause
      </button>
      <button class="flex-1 bg-amber-500 text-slate-900 font-black py-4 rounded-2xl shadow-xl shadow-amber-500/30 flex items-center justify-center gap-2">
        End & save
        <i class="fas fa-check text-sm"></i>
      </button>
    </div>
  </div>

  <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-white rounded-full"></div>
</div>
</body>
</html>
