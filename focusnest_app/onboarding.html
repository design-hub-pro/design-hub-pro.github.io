<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { width: 100%; height: 100%; overflow: hidden; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: linear-gradient(180deg, #fef3c7 0%, #fed7aa 35%, #fb923c 75%, #ea580c 100%); }
.blob { position: absolute; border-radius: 9999px; filter: blur(60px); opacity: 0.6; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes pulse-ring { 0% { transform: scale(0.95); opacity: .8; } 50% { transform: scale(1.15); opacity: 0; } 100% { transform: scale(0.95); opacity: 0; } }
.float { animation: float 4s ease-in-out infinite; }
.ring1 { animation: pulse-ring 2.4s ease-out infinite; }
.ring2 { animation: pulse-ring 2.4s ease-out 0.8s infinite; }
.ring3 { animation: pulse-ring 2.4s ease-out 1.6s infinite; }
</style>
</head>
<body>
<div class="screen">
  <div class="blob bg-amber-200 w-72 h-72 -top-20 -left-20"></div>
  <div class="blob bg-orange-300 w-80 h-80 top-1/2 -right-20"></div>

  <!-- Status Bar -->
  <div class="absolute top-0 left-0 right-0 h-[59px] px-7 flex items-center justify-between z-50">
    <span class="text-sm font-semibold text-slate-900">9:41</span>
    <div class="w-[110px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs text-slate-900"></i>
      <i class="fas fa-wifi text-xs text-slate-900"></i>
      <i class="fas fa-battery-full text-sm text-slate-900"></i>
    </div>
  </div>

  <div class="relative z-10 h-full flex flex-col justify-between pt-24 pb-10 px-7">

    <!-- Mascot -->
    <div class="flex-1 flex flex-col items-center justify-center">
      <div class="relative w-56 h-56 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-white/30 ring1"></div>
        <div class="absolute inset-0 rounded-full bg-white/30 ring2"></div>
        <div class="absolute inset-0 rounded-full bg-white/30 ring3"></div>
        <div class="relative w-44 h-44 rounded-full bg-gradient-to-br from-amber-100 to-amber-300 shadow-2xl flex items-center justify-center float">
          <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-orange-400 rotate-45"></div>
          <!-- Owl eyes -->
          <div class="flex gap-4 mt-2">
            <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center">
              <div class="w-10 h-10 rounded-full bg-slate-900 flex items-end justify-center pb-1">
                <div class="w-3 h-3 rounded-full bg-white"></div>
              </div>
            </div>
            <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center">
              <div class="w-10 h-10 rounded-full bg-slate-900 flex items-end justify-center pb-1">
                <div class="w-3 h-3 rounded-full bg-white"></div>
              </div>
            </div>
          </div>
          <!-- Beak -->
          <div class="absolute bottom-12 w-4 h-4 bg-orange-500 rotate-45"></div>
        </div>
      </div>

      <div class="mt-10 text-center">
        <p class="text-sm font-bold text-orange-900 uppercase tracking-widest mb-3">Meet your focus coach</p>
        <h1 class="text-5xl font-black text-slate-900 leading-tight">Hi, I'm <span class="text-orange-700">Sprout</span></h1>
        <p class="text-base text-slate-800/80 mt-4 px-4 leading-relaxed">I live in your dock and quietly cheer you on every time you stay off your phone.</p>
      </div>
    </div>

    <!-- Capability chips -->
    <div class="flex flex-col gap-2.5 mb-6">
      <div class="bg-white/70 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center gap-3 shadow-lg shadow-orange-900/10">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center">
          <i class="fas fa-eye text-white text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-slate-900">Catches distractions live</p>
          <p class="text-xs text-slate-600">Knows when you grab your phone</p>
        </div>
      </div>
      <div class="bg-white/70 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center gap-3 shadow-lg shadow-orange-900/10">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center">
          <i class="fas fa-comment-dots text-white text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-slate-900">Talks to you like a friend</p>
          <p class="text-xs text-slate-600">Pep talks, not guilt-trips</p>
        </div>
      </div>
      <div class="bg-white/70 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center gap-3 shadow-lg shadow-orange-900/10">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
          <i class="fas fa-gamepad text-white text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-slate-900">Turns focus into a game</p>
          <p class="text-xs text-slate-600">Grow your nest, beat friends</p>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <button class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-2xl shadow-slate-900/40 flex items-center justify-center gap-2">
      Let's grow together
      <i class="fas fa-arrow-right text-sm"></i>
    </button>
    <div class="flex justify-center gap-1.5 mt-5">
      <div class="w-8 h-1.5 rounded-full bg-slate-900"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-slate-900/30"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-slate-900/30"></div>
    </div>

    <!-- Home Indicator -->
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900 rounded-full"></div>
  </div>
</div>
</body>
</html>
