<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AeroVerde — Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen">
  <!-- Header band -->
  <div class="relative h-[210px]">
    <img src="https://images.unsplash.com/photo-1454789548928-9efd52dc4031?w=900&q=80" class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,26,46,0.5) 0%,rgba(11,26,46,0.55) 50%,#EDF2EF 100%)"></div>

    <div class="status-bar on-dark">
      <span class="time">9:41</span>
      <div class="dynamic-island"></div>
      <div class="icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div class="absolute top-[62px] left-0 right-0 px-7 flex items-center justify-between text-white">
      <span class="font-display font-bold text-[15px]">Profile</span>
      <button class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fa-solid fa-gear text-[14px]"></i></button>
    </div>
  </div>

  <div class="content -mt-16 relative">
    <!-- Profile card -->
    <div class="flex flex-col items-center text-center mb-5">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=240&q=80" class="w-24 h-24 rounded-full object-cover ring-4 ring-white shadow-soft mb-3" />
      <div class="flex items-center gap-2">
        <h1 class="font-display text-[22px] font-bold">Leo Martínez</h1>
        <i class="fa-solid fa-circle-check text-[#0FB97D] text-[15px]"></i>
      </div>
      <p class="text-[13px] text-[#64707A] mb-3">Grade 11 · Aspiring aerospace engineer</p>
      <div class="flex items-center gap-2">
        <span class="chip"><i class="fa-solid fa-rocket text-[#FF6A3D]"></i> Rocketeer Lv.6</span>
        <span class="chip"><i class="fa-solid fa-fire text-[#FF6A3D]"></i> 12-day streak</span>
      </div>
    </div>

    <!-- Stat row -->
    <div class="card !p-0 mb-5 flex divide-x divide-[#0B1A2E]/6">
      <div class="flex-1 py-3.5 text-center">
        <p class="font-display text-[22px] font-bold">28</p>
        <p class="text-[10px] text-[#64707A] uppercase tracking-wider">Lessons</p>
      </div>
      <div class="flex-1 py-3.5 text-center">
        <p class="font-display text-[22px] font-bold text-[#0FB97D]">7</p>
        <p class="text-[10px] text-[#64707A] uppercase tracking-wider">Badges</p>
      </div>
      <div class="flex-1 py-3.5 text-center">
        <p class="font-display text-[22px] font-bold text-[#FF6A3D]">2,840</p>
        <p class="text-[10px] text-[#64707A] uppercase tracking-wider">XP</p>
      </div>
    </div>

    <!-- Learning DNA -->
    <h3 class="font-display sec-h mb-3">Your learning DNA</h3>
    <div class="card !p-4 mb-5">
      <div class="space-y-3.5">
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[12px] font-semibold"><i class="fa-solid fa-eye text-[#0FB97D] mr-2"></i>Visual</span>
            <span class="text-[12px] font-bold text-[#0FB97D]">58%</span>
          </div>
          <div class="bar"><div class="gradient-eco" style="width:58%"></div></div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[12px] font-semibold"><i class="fa-solid fa-flask-vial text-[#FF6A3D] mr-2"></i>Hands-on</span>
            <span class="text-[12px] font-bold text-[#FF6A3D]">27%</span>
          </div>
          <div class="bar"><div class="gradient-flame" style="width:27%"></div></div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[12px] font-semibold"><i class="fa-solid fa-headphones text-[#38BDF8] mr-2"></i>Audio</span>
            <span class="text-[12px] font-bold text-[#38BDF8]">15%</span>
          </div>
          <div class="bar"><div class="gradient-sky" style="width:15%"></div></div>
        </div>
      </div>
    </div>

    <!-- Settings list -->
    <div class="card !p-2 mb-5">
      <div class="flex items-center gap-3 p-3">
        <div class="w-9 h-9 rounded-xl bg-[#0FB97D]/12 flex items-center justify-center"><i class="fa-solid fa-shield-halved text-[#0FB97D] text-[14px]"></i></div>
        <span class="flex-1 text-[14px] font-medium">Safety preferences</span>
        <i class="fa-solid fa-chevron-right text-[#C7D0CC] text-[12px]"></i>
      </div>
      <div class="h-px bg-[#0B1A2E]/5 mx-3"></div>
      <div class="flex items-center gap-3 p-3">
        <div class="w-9 h-9 rounded-xl bg-[#FF6A3D]/12 flex items-center justify-center"><i class="fa-solid fa-certificate text-[#FF6A3D] text-[14px]"></i></div>
        <span class="flex-1 text-[14px] font-medium">Certificates</span>
        <span class="tag mr-1">3</span>
        <i class="fa-solid fa-chevron-right text-[#C7D0CC] text-[12px]"></i>
      </div>
      <div class="h-px bg-[#0B1A2E]/5 mx-3"></div>
      <div class="flex items-center gap-3 p-3">
        <div class="w-9 h-9 rounded-xl bg-[#38BDF8]/12 flex items-center justify-center"><i class="fa-solid fa-people-group text-[#38BDF8] text-[14px]"></i></div>
        <span class="flex-1 text-[14px] font-medium">Invite classmates</span>
        <i class="fa-solid fa-chevron-right text-[#C7D0CC] text-[12px]"></i>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="tab-item"><i class="fa-regular fa-compass"></i><span>Learn</span></div>
    <div class="tab-fab"><div class="fab"><i class="fa-solid fa-microscope"></i></div><span>Scan</span></div>
    <div class="tab-item"><i class="fa-regular fa-comment-dots"></i><span>Coach</span></div>
    <div class="tab-item"><i class="fa-regular fa-chart-bar"></i><span>Impact</span></div>
  </div>
</div>
</body>
</html>
