<text x="28" y="34" font-size="12" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.6">BUILD STACK</text>
<rect x="20" y="308" width="920" height="246" rx="8" fill="#F7F0E7"/>
<text x="34" y="330" font-size="11" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">WETTED PATH</text>
<text x="34" y="348" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">brass, PTFE,</text>
<text x="34" y="364" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">graphite, EPDM</text>
