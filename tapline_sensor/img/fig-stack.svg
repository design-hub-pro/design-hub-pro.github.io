<text x="487" y="170" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">XIAO ESP32-C3 and MCP6002, FR4 1.6 mm</text>
<polygon points="212,234 452,234 478,194 238,194" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
