<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="960" height="600" fill="#FDFCFA"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16202B"/></marker></defs>
<text x="28" y="34" font-size="12" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.6">BUILD STACK</text>
<rect x="20" y="308" width="920" height="246" rx="8" fill="#F7F0E7"/>
<text x="34" y="330" font-size="11" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">WETTED PATH</text>
<text x="34" y="348" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">PTFE, graphite,</text>
<text x="34" y="364" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">EPDM, polypropylene</text>
<polygon points="190,110 430,110 456,70 216,70" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="476" y="90" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Tail cap</text>
<text x="476" y="108" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">ABS 2.0 mm, USB-C port</text>
<polygon points="201,172 441,172 467,132 227,132" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="487" y="152" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Battery bay</text>
<text x="487" y="170" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">LiPo 500 mAh, 3.7 V</text>
<polygon points="212,234 452,234 478,194 238,194" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="498" y="214" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Logic board</text>
<text x="498" y="232" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">XIAO ESP32-C3 and MCP6002</text>
<polygon points="223,296 463,296 489,256 249,256" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="509" y="276" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Barrel shell</text>
<text x="509" y="294" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">ABS 2.0 mm, IP54</text>
<polygon points="234,358 474,358 500,318 260,318" fill="#EFE7DA" stroke="#16202B" stroke-width="1.4"/>
<text x="520" y="338" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Head gland</text>
<text x="520" y="356" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">PTFE, EPDM O-ring 8 x 2 mm</text>
<polygon points="245,420 485,420 511,380 271,380" fill="#EFE7DA" stroke="#16202B" stroke-width="1.4"/>
<text x="531" y="400" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Probe tip</text>
<text x="531" y="418" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">Two graphite rods, 3 mm gap</text>
<polygon points="256,482 496,482 522,442 282,442" fill="#EFE7DA" stroke="#16202B" stroke-width="1.4"/>
<text x="542" y="462" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Temperature</text>
<text x="542" y="480" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">NTC potted in the tip</text>
<polygon points="267,544 507,544 533,504 293,504" fill="#EFE7DA" stroke="#16202B" stroke-width="1.4"/>
<text x="553" y="524" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Rinse cup</text>
<text x="553" y="542" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">40 mL, sets the immersion depth</text>
<text x="28" y="584" font-size="13" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">Nothing is plumbed in and nothing can leak. The gland is the only seal, and it is opened once a quarter.</text>
</svg>