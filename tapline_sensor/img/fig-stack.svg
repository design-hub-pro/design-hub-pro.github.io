<text x="476" y="90" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Enclosure lid</text>
<text x="476" y="108" font-size="11.5" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">ABS, 2.0 mm</text>
