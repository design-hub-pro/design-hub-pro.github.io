<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="960" height="520" fill="#FDFCFA"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16202B"/></marker></defs>
<text x="28" y="34" font-size="12" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.6">VALIDATION BENCH</text>
<rect x="28" y="66" width="392" height="150" rx="8" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="46" y="92" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">SAMPLE SET</text>
<text x="46" y="114" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">12 beakers, 40 to 260 ppm</text>
<text x="46" y="134" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">CaCl&#8322; and MgSO&#8324; in deionised water</text>
<polygon points="52,152 96,152 90,202 58,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="74" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">40</text>
<polygon points="112,152 156,152 150,202 118,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="134" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">80</text>
<polygon points="172,152 216,152 210,202 178,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="194" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">120</text>
<polygon points="232,152 276,152 270,202 238,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="254" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">160</text>
<polygon points="292,152 336,152 330,202 298,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="314" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">210</text>
<polygon points="352,152 396,152 390,202 358,202" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="374" y="214" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">260</text>
<rect x="452" y="66" width="236" height="150" rx="8" fill="#FFFFFF" stroke="#C4531E" stroke-width="1.6"/>
<text x="470" y="92" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">SIDE BY SIDE</text>
<text x="470" y="114" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Both probes, one beaker</text>
<polygon points="506,134 634,134 628,200 512,200" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<line x1="540" y1="112" x2="540" y2="188" stroke="#16202B" stroke-width="3"/>
<line x1="600" y1="112" x2="600" y2="188" stroke="#C4531E" stroke-width="3"/>
<text x="534" y="208" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">unit</text>
<text x="606" y="208" font-size="11" fill="#C4531E" text-anchor="middle" font-weight="400" letter-spacing="0">reference</text>
<rect x="720" y="66" width="212" height="150" rx="8" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="738" y="92" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">WATER BATH</text>
<text x="738" y="114" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">8 to 35 &#176;C</text>
<text x="738" y="134" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">five set points</text>
<rect x="738" y="150" width="176" height="52" rx="5" fill="#E8EEF0" stroke="#16202B" stroke-width="1.3"/>
<text x="826" y="182" font-size="11" fill="#5A6B7A" text-anchor="middle" font-weight="400" letter-spacing="0">120 ppm sample held</text>
<text x="28" y="266" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">CARRYOVER TEST</text>
<rect x="28" y="280" width="196" height="74" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="42" y="310" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">1200 &#181;S/cm</text>
<text x="42" y="332" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">dip 30 s</text>
<line x1="227" y1="317" x2="244" y2="317" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="248" y="280" width="196" height="74" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="262" y="310" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Rinse</text>
<text x="262" y="332" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">sample water, twice</text>
<line x1="447" y1="317" x2="464" y2="317" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="468" y="280" width="196" height="74" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="482" y="310" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">150 &#181;S/cm</text>
<text x="482" y="332" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">read</text>
<line x1="667" y1="317" x2="684" y2="317" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="688" y="280" width="196" height="74" rx="6" fill="#F7F0E7" stroke="#E3D7C6" stroke-width="1.2"/>
<text x="702" y="310" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Error</text>
<text x="702" y="332" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">under 2%</text>
<rect x="28" y="392" width="432" height="86" rx="6" fill="#F7F0E7" stroke="#E3D7C6" stroke-width="1.2"/>
<text x="46" y="418" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">THE TRUE VALUE</text>
<text x="46" y="440" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">EDTA titration on every beaker</text>
<text x="46" y="460" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">gives the hardness the fit is scored against</text>
<rect x="486" y="392" width="446" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="504" y="418" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">REPEATABILITY</text>
<text x="504" y="440" font-size="13.5" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Ten dips into the same beaker</text>
<text x="504" y="460" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">probe dried between each, spread under 1.5%</text>
</svg>