<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect width="1000" height="400" fill="#FDFCFA"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16202B"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#C4531E"/></marker></defs>
<text x="28" y="34" font-size="12" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.6">SIGNAL PATH</text>
<rect x="28" y="72" width="168" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="42" y="96" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">SENSE</text>
<text x="42" y="120" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Graphite pair, 1 kHz</text>
<text x="42" y="140" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">bipolar, 3 mm gap</text>
<line x1="200" y1="115.0" x2="215" y2="115.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="221" y="72" width="168" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="235" y="96" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">CONDITION</text>
<text x="235" y="120" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">MCP6002 buffer</text>
<text x="235" y="140" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">1 k&#8486; sense resistor</text>
<line x1="393" y1="115.0" x2="408" y2="115.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="414" y="72" width="168" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="428" y="96" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">DIGITISE</text>
<text x="428" y="120" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">ESP32-C3 ADC</text>
<text x="428" y="140" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">64 samples, 12 bit</text>
<line x1="586" y1="115.0" x2="601" y2="115.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="607" y="72" width="168" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="621" y="96" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">DECIDE</text>
<text x="621" y="120" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Flush 20 s, hold 20 s</text>
<text x="621" y="140" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">median of last 512</text>
<line x1="779" y1="115.0" x2="794" y2="115.0" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="800" y="72" width="168" height="86" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="814" y="96" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">SEND</text>
<text x="814" y="120" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">BLE 5.0, 12 reads/day</text>
<text x="814" y="140" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">30 days on flash</text>
<rect x="28" y="232" width="168" height="74" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="42" y="256" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">TEMPERATURE</text>
<text x="42" y="278" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">NTC 10 k&#8486;, &#177;0.5 &#176;C</text>
<text x="42" y="296" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">25 &#176;C reference</text>
<rect x="221" y="232" width="168" height="74" rx="6" fill="#FFFFFF" stroke="#16202B" stroke-width="1.4"/>
<text x="235" y="256" font-size="10" fill="#C4531E" text-anchor="start" font-weight="700" letter-spacing="1.4">DRAW DETECT</text>
<text x="235" y="278" font-size="13" fill="#16202B" text-anchor="start" font-weight="600" letter-spacing="0">Reed impeller, 0 &#181;A idle</text>
<text x="235" y="296" font-size="12" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">interrupt wakes MCU</text>
<path d="M112,232 L112,200 L454,200 L454,162" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M305,232 L305,214 L647,214 L647,162" fill="none" stroke="#16202B" stroke-width="1.4" marker-end="url(#a)"/>
<text x="28" y="352" font-size="13" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">Temperature compensation is applied before the plateau is taken. Standing water is discarded, not averaged in.</text>
<text x="28" y="376" font-size="13" fill="#5A6B7A" text-anchor="start" font-weight="400" letter-spacing="0">The phone converts the plateau to hardness using the per-home slope.</text>
</svg>