<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pause Mode · Lucid</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #050912; color: white; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; }
.dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 180px; height: 37px; background: #000; border-radius: 24px; z-index: 50; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.status-bar { position: relative; height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: flex-start; font-weight: 600; font-size: 16px; z-index: 20; }
.aurora { position: absolute; inset: 0; background:
  radial-gradient(circle at 50% 38%, rgba(99,102,241,0.55), transparent 35%),
  radial-gradient(circle at 80% 70%, rgba(16,185,129,0.25), transparent 45%),
  radial-gradient(circle at 20% 80%, rgba(139,92,246,0.4), transparent 45%);
  filter: blur(10px); }
.grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 3px 3px; opacity: 0.6; }
.serif { font-family: 'Instrument Serif', serif; }
.glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); }
.breath-orb { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #C4B5FD, #8B5CF6 40%, #4338CA 75%, #1E1B4B 100%); box-shadow: 0 0 80px rgba(139,92,246,0.6), inset 0 0 40px rgba(255,255,255,0.2); animation: breathe 8s ease-in-out infinite; position: relative; }
.breath-orb::after { content:''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); }
@keyframes breathe { 0%,100% { transform: scale(0.92); box-shadow: 0 0 60px rgba(139,92,246,0.5); } 50% { transform: scale(1.05); box-shadow: 0 0 120px rgba(167,139,250,0.8); } }
.timer-ring { position: relative; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="screen">
  <div class="aurora"></div>
  <div class="grain"></div>

  <div class="dynamic-island">
    <i class="fa-solid fa-pause text-emerald-400 text-[10px]"></i>
    <span class="text-[11px] font-semibold text-emerald-200">Pause active</span>
    <span class="text-[11px] text-white/40 ml-auto">14h 32m</span>
  </div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5 text-xs">
      <i class="fa-solid fa-signal text-[11px]"></i>
      <i class="fa-solid fa-wifi text-[11px]"></i>
      <i class="fa-solid fa-battery-full text-[13px]"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="relative z-10 px-7 pt-2 flex items-center justify-between">
    <button class="w-9 h-9 rounded-full glass flex items-center justify-center">
      <i class="fa-solid fa-xmark text-xs"></i>
    </button>
    <div class="text-center">
      <div class="text-[10px] uppercase tracking-widest text-violet-200/70">Cool-Down Ritual</div>
      <div class="text-[13px] font-semibold mt-0.5">Tesla Model Y · 24h pause</div>
    </div>
    <button class="w-9 h-9 rounded-full glass flex items-center justify-center">
      <i class="fa-solid fa-info text-xs"></i>
    </button>
  </div>

  <!-- Breathing Orb -->
  <div class="relative z-10 mt-8 flex items-center justify-center">
    <div class="absolute">
      <svg width="260" height="260" viewBox="0 0 100 100" class="-rotate-90">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ring)" stroke-width="2" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="116"/>
        <defs>
          <linearGradient id="ring"><stop offset="0%" stop-color="#34D399"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F472B6"/></linearGradient>
        </defs>
      </svg>
    </div>
    <div class="breath-orb"></div>
  </div>

  <!-- Time remaining -->
  <div class="relative z-10 mt-8 text-center">
    <div class="text-[10px] uppercase tracking-widest text-violet-200/70">Time remaining</div>
    <div class="flex items-center justify-center gap-1 mt-1">
      <span class="serif italic text-[68px] leading-none">14</span>
      <span class="text-lg text-white/60 mb-2">h</span>
      <span class="serif italic text-[68px] leading-none ml-2">32</span>
      <span class="text-lg text-white/60 mb-2">m</span>
    </div>
    <p class="text-[12px] text-white/50 mt-2 px-10 leading-relaxed">
      Breathe. Your <span class="serif italic text-violet-300">cool-state self</span> will decide tomorrow.
    </p>
  </div>

  <!-- Reflection Prompt -->
  <div class="absolute bottom-0 left-0 right-0 z-10 px-7 pb-8">
    <div class="glass rounded-3xl p-4 mb-3">
      <div class="flex items-center gap-2 mb-2.5">
        <div class="w-5 h-5 rounded-full" style="background: conic-gradient(from 0deg, #6366F1, #EC4899);"></div>
        <div class="text-[10px] uppercase tracking-widest text-violet-200/80 font-bold">Lucid asks</div>
      </div>
      <p class="text-[14px] leading-snug">Imagine your <span class="serif italic text-pink-300">10-year-older self</span>. What would they want with this $52,490?</p>
      <div class="mt-3 flex gap-2">
        <button class="flex-1 bg-white/10 backdrop-blur border border-white/15 rounded-full py-2.5 text-[11px] font-semibold">
          <i class="fa-solid fa-microphone text-[10px] mr-1.5"></i> Voice
        </button>
        <button class="flex-1 bg-white text-zinc-900 rounded-full py-2.5 text-[11px] font-bold">
          Write reflection
        </button>
      </div>
    </div>

    <!-- Bottom Row -->
    <div class="grid grid-cols-3 gap-2">
      <button class="glass rounded-2xl py-3 flex flex-col items-center gap-1">
        <i class="fa-solid fa-circle-check text-emerald-300 text-sm"></i>
        <span class="text-[10px] font-semibold">I'm over it</span>
      </button>
      <button class="glass rounded-2xl py-3 flex flex-col items-center gap-1">
        <i class="fa-solid fa-book text-violet-300 text-sm"></i>
        <span class="text-[10px] font-semibold">Journal</span>
      </button>
      <button class="glass rounded-2xl py-3 flex flex-col items-center gap-1">
        <i class="fa-solid fa-comments text-pink-300 text-sm"></i>
        <span class="text-[10px] font-semibold">Coach</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
