<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding · Lucid</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
html, body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
.screen { width: 100%; height: 100%; position: relative; overflow: hidden; background: #0A0B14; color: white; }
.dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 37px; background: #000; border-radius: 24px; z-index: 50; }
.status-bar { position: relative; height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: flex-start; color: white; font-weight: 600; font-size: 16px; z-index: 20; }
.aurora { position: absolute; inset: 0; background:
  radial-gradient(circle at 20% 30%, rgba(99,102,241,0.55), transparent 45%),
  radial-gradient(circle at 80% 70%, rgba(236,72,153,0.45), transparent 45%),
  radial-gradient(circle at 50% 90%, rgba(139,92,246,0.5), transparent 50%);
  filter: blur(20px); }
.grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 3px 3px; opacity: 0.6; }
.orb-core { position: relative; width: 240px; height: 240px; margin: 0 auto; }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.12); top: 50%; left: 50%; transform: translate(-50%, -50%); }
.ring-1 { width: 240px; height: 240px; border-color: rgba(167,139,250,0.4); animation: spin 18s linear infinite; }
.ring-2 { width: 190px; height: 190px; border-color: rgba(236,72,153,0.35); animation: spin 12s linear infinite reverse; }
.ring-3 { width: 140px; height: 140px; border-color: rgba(99,102,241,0.45); animation: spin 22s linear infinite; }
.lens { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(from 0deg, #6366F1, #8B5CF6, #EC4899, #F59E0B, #6366F1); box-shadow: 0 20px 60px rgba(139,92,246,0.6), inset 0 0 30px rgba(0,0,0,0.4); }
.lens::after { content:''; position:absolute; inset:14px; border-radius:50%; background:#0A0B14; }
.lens::before { content:''; position:absolute; inset:32px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #fff, #C4B5FD 40%, #6366F1 80%); z-index:2; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.dot-1 { position:absolute; top: 12%; right: 10%; width: 8px; height: 8px; border-radius: 50%; background: #EC4899; box-shadow: 0 0 16px #EC4899; }
.dot-2 { position:absolute; bottom: 18%; left: 8%; width: 6px; height: 6px; border-radius: 50%; background: #6366F1; box-shadow: 0 0 14px #6366F1; }
.dot-3 { position:absolute; top: 38%; left: 4%; width: 5px; height: 5px; border-radius: 50%; background: #F59E0B; box-shadow: 0 0 12px #F59E0B; }
.glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); }
.cta { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%); box-shadow: 0 12px 32px rgba(139,92,246,0.5); }
.serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
</style>
</head>
<body>
<div class="screen">
  <div class="aurora"></div>
  <div class="grain"></div>
  <div class="dynamic-island"></div>
  <div class="dot-1"></div><div class="dot-2"></div><div class="dot-3"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5 text-xs">
      <i class="fa-solid fa-signal text-[11px]"></i>
      <i class="fa-solid fa-wifi text-[11px]"></i>
      <i class="fa-solid fa-battery-full text-[13px]"></i>
    </div>
  </div>

  <div class="relative z-10 px-7 pt-6">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-full" style="background: conic-gradient(from 0deg, #6366F1, #8B5CF6, #EC4899, #F59E0B, #6366F1);"></div>
      <span class="font-bold tracking-tight text-lg">Lucid</span>
    </div>
  </div>

  <div class="relative z-10 mt-10">
    <div class="orb-core">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="lens"></div>
    </div>
  </div>

  <div class="relative z-10 px-7 mt-10 text-center">
    <p class="text-[11px] tracking-[0.3em] text-violet-300 mb-3">AI DECISION COACH</p>
    <h1 class="text-[40px] leading-[1.05] font-bold tracking-tight">
      Think <span class="serif italic text-pink-300">clearly.</span><br>
      Decide <span class="serif italic text-violet-300">wisely.</span>
    </h1>
    <p class="text-sm text-white/60 mt-5 px-2 leading-relaxed">
      Detects 47 cognitive biases in real-time and coaches you toward decisions your future self will thank you for.
    </p>
  </div>

  <div class="relative z-10 px-7 mt-7">
    <div class="grid grid-cols-3 gap-2.5">
      <div class="glass rounded-2xl p-3 text-center">
        <div class="text-[22px] font-bold bg-gradient-to-br from-violet-300 to-pink-300 bg-clip-text text-transparent">47</div>
        <div class="text-[9px] text-white/50 mt-0.5 uppercase tracking-wider">Biases</div>
      </div>
      <div class="glass rounded-2xl p-3 text-center">
        <div class="text-[22px] font-bold bg-gradient-to-br from-violet-300 to-pink-300 bg-clip-text text-transparent">$8K</div>
        <div class="text-[9px] text-white/50 mt-0.5 uppercase tracking-wider">Avg Saved</div>
      </div>
      <div class="glass rounded-2xl p-3 text-center">
        <div class="text-[22px] font-bold bg-gradient-to-br from-violet-300 to-pink-300 bg-clip-text text-transparent">94%</div>
        <div class="text-[9px] text-white/50 mt-0.5 uppercase tracking-wider">Better ROI</div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-10 z-10">
    <button class="cta w-full py-4 rounded-full font-semibold text-white flex items-center justify-center gap-2">
      Meet Your Coach <i class="fa-solid fa-arrow-right text-sm"></i>
    </button>
    <p class="text-center text-[11px] text-white/40 mt-4">
      <i class="fa-solid fa-shield-halved mr-1"></i> Backed by Nobel-laureate research
    </p>
  </div>
</div>
</body>
</html>
