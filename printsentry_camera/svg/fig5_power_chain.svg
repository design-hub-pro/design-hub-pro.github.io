<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="ui-sans-serif,system-ui">
<rect width="1040" height="560" fill="#FDFCFA"/>
<text x="30" y="34" font-size="18" font-weight="700" fill="#16202B">Wiring and power chain</text>
<text x="30" y="54" font-size="12.5" fill="#5A6B7A">Independent 5V USB supply, not tapped from the printer</text>
<rect x="30" y="100" width="190" height="60" rx="8" fill="#FDFCFA" stroke="#16202B" stroke-width="1.8"/>
<text x="125.0" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#16202B">USB wall adapter</text>
<text x="125.0" y="146" text-anchor="middle" font-size="11.5" fill="#5A6B7A">5V, 2A capacity</text>
<line x1="220" y1="130.0" x2="260" y2="130.0" stroke="#16202B" stroke-width="1.8"/>
<line x1="260" y1="130.0" x2="950" y2="130.0" stroke="#16202B" stroke-width="2.4"/>
<text x="605.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#5A6B7A">common 5V rail</text>
<line x1="375.0" y1="130.0" x2="375.0" y2="200.0" stroke="#16202B" stroke-width="1.6"/>
<rect x="265.0" y="200.0" width="220" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.8"/>
<text x="375.0" y="224.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16202B">Pi Zero 2 W</text>
<text x="375.0" y="244.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="375.0" dy="0">5V rail, draws 350 mA</tspan><tspan x="375.0" dy="14">typical</tspan></text>
<text x="375.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="375.0" dy="0">I2C to camera sensor, SPI</tspan><tspan x="375.0" dy="13">unused</tspan></text>
<line x1="605.0" y1="130.0" x2="605.0" y2="200.0" stroke="#16202B" stroke-width="1.6"/>
<rect x="495.0" y="200.0" width="220" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.8"/>
<text x="605.0" y="224.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16202B">Camera Module 3</text>
<text x="605.0" y="244.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="605.0" dy="0">3.3V from Pi regulator,</tspan><tspan x="605.0" dy="14">draws 250 mA peak</tspan></text>
<text x="605.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="605.0" dy="0">CSI ribbon to Pi</tspan></text>
<line x1="835.0" y1="130.0" x2="835.0" y2="200.0" stroke="#16202B" stroke-width="1.6"/>
<rect x="725.0" y="200.0" width="220" height="118" rx="8" fill="#FDFCFA" stroke="#C4531E" stroke-width="1.8"/>
<text x="835.0" y="224.0" text-anchor="middle" font-size="13" font-weight="700" fill="#16202B">LED ring</text>
<text x="835.0" y="244.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="835.0" dy="0">5V rail via 47 ohm resistor,</tspan><tspan x="835.0" dy="14">draws 120 mA</tspan></text>
<text x="835.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="835.0" dy="0">PWM from Pi GPIO18</tspan></text>
<text x="30" y="520" font-size="12" fill="#5A6B7A">Total draw about 720 mA at 5V, 3.6 W. Against a 2A (10W) adapter, margin is wide.</text>
<text x="30" y="540" font-size="12" fill="#5A6B7A">Pi 3.3V rail (camera) is regulated on-board. No rail is drawn from the printer PSU.</text>
</svg>