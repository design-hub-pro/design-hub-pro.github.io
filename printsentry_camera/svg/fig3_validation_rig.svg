<rect x="200" y="156" width="240" height="22" rx="4" fill="#FDFCFA" stroke="#16202B" stroke-width="1.6"/>
<text x="320" y="171" text-anchor="middle" font-size="10.5" fill="#5A6B7A">Rigid offset bracket, 60 mm baseline</text>
