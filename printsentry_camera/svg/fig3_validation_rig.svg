<line x1="260" y1="130" x2="320" y2="423" stroke="#0B4F6C" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="380" y1="130" x2="320" y2="423" stroke="#C4531E" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="560" y="218" width="380" height="260" rx="8" fill="#FDFCFA" stroke="#E2DED7" stroke-width="1.6"/>
<text x="576" y="246" font-size="13" font-weight="700" fill="#16202B">Human review log</text>
<text x="576" y="274" font-family="ui-monospace,monospace" font-size="11.5" fill="#5A6B7A">t=00:14:02</text>
<text x="700" y="274" font-size="12" fill="#5A6B7A">no defect</text>
<text x="576" y="310" font-family="ui-monospace,monospace" font-size="11.5" fill="#5A6B7A">t=00:14:04</text>
<text x="700" y="310" font-size="12" fill="#5A6B7A">no defect</text>
<text x="576" y="346" font-family="ui-monospace,monospace" font-size="11.5" fill="#5A6B7A">t=00:14:06</text>
<text x="700" y="346" font-size="12" fill="#C4531E">stringing starts</text>
<text x="576" y="382" font-family="ui-monospace,monospace" font-size="11.5" fill="#5A6B7A">t=00:14:08</text>
<text x="700" y="382" font-size="12" fill="#C4531E">stringing, confirmed</text>
<text x="576" y="418" font-family="ui-monospace,monospace" font-size="11.5" fill="#5A6B7A">t=00:14:10</text>
<text x="700" y="418" font-size="12" fill="#5A6B7A">no defect</text>
<line x1="560" y1="448" x2="940" y2="448" stroke="#E2DED7" stroke-width="1"/>
<text x="576" y="468" font-size="11.5" fill="#5A6B7A">Labeled independently, timestamp-matched to both cameras</text>
<line x1="500" y1="348.0" x2="550" y2="348.0" stroke="#16202B" stroke-width="1.4"/>
<polygon points="550,342.0 560,348.0 550,354.0" fill="#16202B"/>
<text x="30" y="596" font-size="12" fill="#5A6B7A">Every labeled frame carries two votes: PrintSentry's score and the human reviewer's call.</text>
