<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" font-family="ui-sans-serif,system-ui">
<rect width="1180" height="280" fill="#FDFCFA"/>
<text x="40" y="34" font-size="18" font-weight="700" fill="#16202B">Signal path</text>
<text x="40" y="54" font-size="12.5" fill="#5A6B7A">One pass every 2 seconds while a print runs</text>
<rect x="40" y="76" width="208" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.6"/>
<text x="144.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#16202B">SENSE</text>
<text x="144.0" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="144.0" dy="0">Camera Module 3, fixed</tspan><tspan x="144.0" dy="14">focus</tspan></text>
<text x="144.0" y="180" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="144.0" dy="0">1 frame / 2 s, 1024x1024</tspan></text>
<line x1="252" y1="135.0" x2="272" y2="135.0" stroke="#16202B" stroke-width="1.6"/>
<polygon points="272,130.0 282,135.0 272,140.0" fill="#16202B"/>
<rect x="278" y="76" width="208" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.6"/>
<text x="382.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#16202B">PROCESS</text>
<text x="382.0" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="382.0" dy="0">Pi Zero 2 W, TFLite</tspan><tspan x="382.0" dy="14">MobileNetV2</tspan></text>
<text x="382.0" y="180" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="382.0" dy="0">about 180 ms / frame</tspan></text>
<line x1="490" y1="135.0" x2="510" y2="135.0" stroke="#16202B" stroke-width="1.6"/>
<polygon points="510,130.0 520,135.0 510,140.0" fill="#16202B"/>
<rect x="516" y="76" width="208" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.6"/>
<text x="620.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#16202B">DECIDE</text>
<text x="620.0" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="620.0" dy="0">Debounce filter</tspan></text>
<text x="620.0" y="180" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="620.0" dy="0">3 of last 5 frames over 0.85</tspan></text>
<line x1="728" y1="135.0" x2="748" y2="135.0" stroke="#16202B" stroke-width="1.6"/>
<polygon points="748,130.0 758,135.0 748,140.0" fill="#16202B"/>
<rect x="754" y="76" width="208" height="118" rx="8" fill="#FDFCFA" stroke="#C4531E" stroke-width="1.6"/>
<text x="858.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#16202B">ACT</text>
<text x="858.0" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="858.0" dy="0">ntfy.sh push, OctoPrint</tspan><tspan x="858.0" dy="14">pause call</tspan></text>
<text x="858.0" y="180" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="858.0" dy="0">HTTPS POST, under 1 s</tspan></text>
<line x1="966" y1="135.0" x2="986" y2="135.0" stroke="#16202B" stroke-width="1.6"/>
<polygon points="986,130.0 996,135.0 986,140.0" fill="#16202B"/>
<rect x="992" y="76" width="208" height="118" rx="8" fill="#FDFCFA" stroke="#0B4F6C" stroke-width="1.6"/>
<text x="1096.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" fill="#16202B">RECORD</text>
<text x="1096.0" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="400" fill="#5A6B7A"><tspan x="1096.0" dy="0">Snapshot and log to</tspan><tspan x="1096.0" dy="14">microSD</tspan></text>
<text x="1096.0" y="180" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#C4531E"><tspan x="1096.0" dy="0">JPEG plus one CSV row</tspan></text>
<line x1="40" y1="228" x2="1200" y2="228" stroke="#E2DED7" stroke-width="1"/>
<text x="40" y="250" font-size="12" fill="#5A6B7A">ACT is the only step that leaves the device. Sense, process, decide, and record run on board, offline.</text>
</svg>