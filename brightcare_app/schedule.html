<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightCare - Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #E8F0FE 0%, #F0E6FF 50%, #FFF0F5 100%);
            width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 24px; margin: 0 auto; margin-top: 14px; }
        .content-area { padding: 0 20px; padding-bottom: 110px; }
        .tab-bar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
            background: rgba(255,255,255,0.97); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .task-card {
            border-radius: 28px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.15s;
            position: relative;
            overflow: hidden;
        }
        .task-card:active { transform: scale(0.97); }
        .task-done-card { opacity: 0.45; }
        .task-done-card .task-emoji { filter: grayscale(0.5); }
        .task-icon-box {
            width: 72px; height: 72px;
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .task-emoji { font-size: 38px; }
        .active-glow {
            box-shadow: 0 8px 30px rgba(108,92,231,0.3);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 30px rgba(108,92,231,0.3); }
            50% { box-shadow: 0 12px 40px rgba(108,92,231,0.5); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .bounce-icon { animation: bounce 1.5s ease-in-out infinite; }
        .stars-mini i { font-size: 14px; }
    </style>
</head>
<body>
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="content-area">
        <!-- Header with character -->
        <div class="flex items-center justify-between mt-2 mb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">My Day</h1>
                <div class="flex items-center gap-2 mt-1">
                    <div class="flex gap-0.5 stars-mini">
                        <i class="fas fa-star text-amber-400"></i>
                        <i class="fas fa-star text-amber-400"></i>
                        <i class="fas fa-star text-amber-400"></i>
                        <i class="fas fa-star text-amber-400"></i>
                        <i class="fas fa-star text-amber-400"></i>
                        <i class="fas fa-star text-gray-300"></i>
                        <i class="fas fa-star text-gray-300"></i>
                        <i class="fas fa-star text-gray-300"></i>
                    </div>
                    <span class="text-xs font-bold text-amber-500">5/8</span>
                </div>
            </div>
            <div class="w-14 h-14 bg-gradient-to-br from-purple-400 to-pink-400 rounded-full flex items-center justify-center shadow-lg bounce-icon">
                <span class="text-3xl">🌟</span>
            </div>
        </div>

        <!-- Progress visual -->
        <div class="bg-white/60 backdrop-blur rounded-2xl p-3 mb-5 flex items-center gap-3">
            <div class="flex-1 bg-purple-100 rounded-full h-4 overflow-hidden">
                <div class="bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 h-full rounded-full transition-all" style="width: 62%"></div>
            </div>
            <span class="text-lg">🏆</span>
        </div>

        <!-- Task Cards -->
        <div class="space-y-3">

            <!-- Done: Morning Routine -->
            <div class="task-card bg-white/50 task-done-card">
                <div class="task-icon-box bg-sky-100">
                    <span class="task-emoji">🌅</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Morning Routine</p>
                    <p class="text-sm text-gray-400">7:00 AM</p>
                </div>
                <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xl"></i>
                </div>
            </div>

            <!-- Done: Breakfast -->
            <div class="task-card bg-white/50 task-done-card">
                <div class="task-icon-box bg-orange-100">
                    <span class="task-emoji">🥣</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Breakfast</p>
                    <p class="text-sm text-gray-400">7:30 AM</p>
                </div>
                <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xl"></i>
                </div>
            </div>

            <!-- Done: Medicine -->
            <div class="task-card bg-white/50 task-done-card">
                <div class="task-icon-box bg-red-100">
                    <span class="task-emoji">💊</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Medicine</p>
                    <p class="text-sm text-gray-400">8:00 AM</p>
                </div>
                <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xl"></i>
                </div>
            </div>

            <!-- Done: Speech -->
            <div class="task-card bg-white/50 task-done-card">
                <div class="task-icon-box bg-violet-100">
                    <span class="task-emoji">🗣️</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Speech Time</p>
                    <p class="text-sm text-gray-400">8:30 AM</p>
                </div>
                <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xl"></i>
                </div>
            </div>

            <!-- Done: Snack -->
            <div class="task-card bg-white/50 task-done-card">
                <div class="task-icon-box bg-yellow-100">
                    <span class="task-emoji">🍎</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Snack Time</p>
                    <p class="text-sm text-gray-400">9:00 AM</p>
                </div>
                <div class="w-12 h-12 bg-green-400 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xl"></i>
                </div>
            </div>

            <!-- ACTIVE: Reading Time -->
            <div class="task-card bg-gradient-to-r from-purple-500 to-indigo-500 active-glow" style="padding: 20px 16px;">
                <div class="task-icon-box bg-white/20">
                    <span class="task-emoji bounce-icon">📚</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-extrabold text-white text-xl">Reading Time</p>
                    <div class="bg-white/20 rounded-full h-2.5 mt-2 overflow-hidden">
                        <div class="bg-white h-full rounded-full" style="width: 60%"></div>
                    </div>
                    <p class="text-white/70 text-xs mt-1">12 min left</p>
                </div>
                <div class="text-center">
                    <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-play text-white text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- Next: Puzzle -->
            <div class="task-card bg-white/80">
                <div class="task-icon-box bg-emerald-100">
                    <span class="task-emoji">🧩</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Puzzle Fun</p>
                    <p class="text-sm text-gray-400">10:00 AM</p>
                </div>
                <div class="flex gap-0.5">
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                </div>
            </div>

            <!-- Next: Outdoor -->
            <div class="task-card bg-white/80">
                <div class="task-icon-box bg-green-100">
                    <span class="task-emoji">🏃</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-gray-700 text-lg">Outdoor Play</p>
                    <p class="text-sm text-gray-400">11:00 AM</p>
                </div>
                <div class="flex gap-0.5">
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                    <i class="fas fa-star text-amber-400"></i>
                </div>
            </div>

        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-center justify-around px-6 pt-2">
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-home text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-calendar-alt text-purple-600 text-xl"></i>
            <span class="text-xs font-semibold text-purple-600">Schedule</span>
        </div>
        <div class="flex flex-col items-center gap-1 -mt-4">
            <div class="w-14 h-14 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-stopwatch text-white text-xl"></i>
            </div>
            <span class="text-xs text-gray-400">Timer</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-clipboard-list text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Log</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-trophy text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Rewards</span>
        </div>
    </div>
</body>
</html>
