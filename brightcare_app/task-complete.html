<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightCare - Task Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #6C5CE7 0%, #4834D4 100%);
            width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden;
            color: white;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 24px; margin: 0 auto; margin-top: 14px; }
        .content-area { padding: 0 28px; padding-bottom: 60px; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes starBurst { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
        @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-60px) rotate(720deg); opacity: 0; } }
        .bounce-in { animation: bounceIn 0.6s ease-out; }
        .star-burst { animation: starBurst 0.8s ease-out 0.3s both; }
        .confetti-1 { animation: confetti 1.5s ease-out infinite; }
        .confetti-2 { animation: confetti 1.5s ease-out 0.3s infinite; }
        .confetti-3 { animation: confetti 1.5s ease-out 0.6s infinite; }
    </style>
</head>
<body>
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold text-white/80">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-white/80">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="content-area">
        <!-- Confetti particles -->
        <div class="relative h-16">
            <div class="absolute top-0 left-1/4 confetti-1"><i class="fas fa-star text-yellow-300 text-lg"></i></div>
            <div class="absolute top-2 left-1/2 confetti-2"><i class="fas fa-star text-pink-300 text-sm"></i></div>
            <div class="absolute top-0 right-1/4 confetti-3"><i class="fas fa-star text-green-300 text-lg"></i></div>
            <div class="absolute top-4 left-1/3 confetti-2"><i class="fas fa-circle text-yellow-200 text-xs"></i></div>
            <div class="absolute top-2 right-1/3 confetti-1"><i class="fas fa-circle text-blue-300 text-xs"></i></div>
        </div>

        <!-- Success Icon -->
        <div class="text-center mb-6">
            <div class="w-32 h-32 bg-white/15 rounded-full mx-auto flex items-center justify-center bounce-in mb-6">
                <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-5xl"></i>
                </div>
            </div>
            <h1 class="text-3xl font-bold mb-2">Great Job! 🎉</h1>
            <p class="text-white/60 text-lg">Reading Time Completed</p>
        </div>

        <!-- Stars Earned -->
        <div class="bg-white/15 rounded-3xl p-6 mb-6 text-center">
            <p class="text-white/50 text-sm mb-3">Stars Earned</p>
            <div class="flex items-center justify-center gap-3 star-burst">
                <i class="fas fa-star text-yellow-300 text-4xl"></i>
                <i class="fas fa-star text-yellow-300 text-4xl"></i>
                <i class="fas fa-star text-yellow-300 text-4xl"></i>
            </div>
            <p class="text-3xl font-bold mt-3">+3 Stars!</p>
            <p class="text-white/40 text-sm mt-1">Total: 247 ⭐</p>
        </div>

        <!-- Performance Summary -->
        <div class="bg-white/10 rounded-2xl p-4 mb-5">
            <div class="grid grid-cols-2 gap-4">
                <div class="text-center">
                    <p class="text-3xl font-bold text-green-300">30</p>
                    <p class="text-xs text-white/40">Minutes</p>
                </div>
                <div class="text-center">
                    <p class="text-3xl font-bold text-blue-300">100%</p>
                    <p class="text-xs text-white/40">Completed</p>
                </div>
            </div>
            <div class="mt-4 bg-white/10 rounded-xl p-3 text-center">
                <p class="text-sm text-white/50">Timer helped stay focused for</p>
                <p class="text-xl font-bold text-green-300">8 min longer</p>
                <p class="text-xs text-white/30">than average without timer</p>
            </div>
        </div>

        <!-- Token Board Progress -->
        <div class="bg-white/10 rounded-2xl p-4 mb-6">
            <p class="text-sm text-white/50 mb-3 text-center">Token Board Progress</p>
            <div class="flex gap-2 justify-center mb-2">
                <div class="w-10 h-10 bg-amber-400 rounded-lg flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-lg flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-lg flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-lg flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-lg flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
            </div>
            <p class="text-xs text-amber-300 text-center"><i class="fas fa-gift mr-1"></i>3 more for iPad Time!</p>
        </div>

        <!-- Next Task -->
        <div class="flex items-center gap-3 bg-white/10 rounded-2xl p-4 mb-5">
            <div class="w-12 h-12 bg-white/15 rounded-xl flex items-center justify-center">
                <span class="text-2xl">🧩</span>
            </div>
            <div class="flex-1">
                <p class="text-white/50 text-xs">UP NEXT</p>
                <p class="font-bold">Puzzle Activity</p>
                <p class="text-xs text-white/40">10:00 - 10:30 AM</p>
            </div>
            <i class="fas fa-chevron-right text-white/30"></i>
        </div>

        <!-- Action Buttons -->
        <button class="w-full bg-white text-purple-700 py-4 rounded-2xl font-bold text-lg mb-3">
            Start Next Task
        </button>
        <button class="w-full bg-white/15 text-white py-3.5 rounded-2xl font-semibold text-sm">
            Back to Schedule
        </button>
    </div>
</body>
</html>
