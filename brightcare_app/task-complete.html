<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightCare - Task Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #6C5CE7 0%, #8B5CF6 40%, #A78BFA 80%, #DDA0DD 100%);
            width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden;
            color: white;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 24px; margin: 0 auto; margin-top: 14px; }
        .content-area { padding: 0 28px; padding-bottom: 170px; }

        @keyframes confettiDrop {
            0% { transform: translateY(-80px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(900px) rotate(720deg); opacity: 0; }
        }
        .confetti { animation: confettiDrop 3s ease-in infinite; position: absolute; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .pop-in-delay-1 { animation-delay: 0.2s; opacity: 0; }
        .pop-in-delay-2 { animation-delay: 0.4s; opacity: 0; }

        @keyframes starBurst {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .star-burst { animation: starBurst 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        .star-burst-1 { animation-delay: 0.5s; }
        .star-burst-2 { animation-delay: 0.6s; }
        .star-burst-3 { animation-delay: 0.7s; }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.5s ease-out forwards; opacity: 0; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .float-slow { animation: float 3s ease-in-out infinite; }

        .star-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(108,92,231,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 14px 28px 34px 28px;
        }
        .star-slot {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .star-filled {
            background: linear-gradient(135deg, #FCD34D, #F59E0B);
            box-shadow: 0 2px 8px rgba(245,158,11,0.35);
        }
        .star-empty {
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <!-- Confetti -->
    <div class="confetti text-3xl" style="left: 10%; animation-delay: 0s;">🎉</div>
    <div class="confetti text-2xl" style="left: 30%; animation-delay: 0.4s;">⭐</div>
    <div class="confetti text-3xl" style="left: 50%; animation-delay: 0.8s;">🎊</div>
    <div class="confetti text-2xl" style="left: 70%; animation-delay: 0.3s;">✨</div>
    <div class="confetti text-2xl" style="left: 85%; animation-delay: 0.6s;">💜</div>
    <div class="confetti text-xl" style="left: 20%; animation-delay: 1s;">💛</div>

    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="content-area text-center">
        <!-- Celebration Circle -->
        <div class="flex justify-center mt-10 mb-6">
            <div class="w-32 h-32 rounded-full bg-white/10 flex items-center justify-center pop-in">
                <div class="w-28 h-28 rounded-full bg-white/15 flex items-center justify-center">
                    <div class="w-24 h-24 rounded-full bg-white/20 flex items-center justify-center">
                        <span class="text-6xl">🎉</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- YAY Message -->
        <h1 class="text-5xl font-extrabold pop-in pop-in-delay-1">YAY!</h1>
        <p class="text-xl text-white/80 font-semibold mt-2 pop-in pop-in-delay-2">Reading Time Done!</p>

        <!-- Stars Earned -->
        <div class="mt-8 slide-up" style="animation-delay: 0.6s;">
            <p class="text-white/60 text-sm font-medium">You earned</p>
            <div class="flex items-center justify-center gap-3 mt-3">
                <span class="text-4xl star-burst star-burst-1">⭐</span>
                <span class="text-4xl star-burst star-burst-2">⭐</span>
                <span class="text-4xl star-burst star-burst-3">⭐</span>
            </div>
            <p class="text-2xl font-extrabold mt-2">+3 Stars!</p>
        </div>

        <!-- Next Task Preview -->
        <div class="mt-10 slide-up" style="animation-delay: 0.8s;">
            <p class="text-white/50 text-xs font-bold uppercase tracking-widest mb-3">Up Next</p>
            <div class="bg-white/10 backdrop-blur rounded-3xl p-5 mx-4">
                <span class="text-4xl float-slow inline-block">🧩</span>
                <p class="font-extrabold text-xl mt-2">Puzzle Fun!</p>
                <div class="flex items-center justify-center gap-1 mt-1">
                    <i class="fas fa-star text-amber-400 text-sm"></i>
                    <i class="fas fa-star text-amber-400 text-sm"></i>
                    <i class="fas fa-star text-amber-400 text-sm"></i>
                    <span class="text-white/50 text-xs ml-1">3 stars</span>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="mt-8 space-y-3 mx-4 slide-up" style="animation-delay: 1s;">
            <button class="w-full py-4 bg-white text-purple-600 font-extrabold text-lg rounded-2xl shadow-lg active:scale-95 transition-transform">
                Next Task! 🧩
            </button>
            <button class="w-full py-3.5 bg-white/15 text-white font-semibold rounded-2xl active:scale-95 transition-transform">
                Back to My Day
            </button>
        </div>
    </div>

    <!-- Star Token Bar -->
    <div class="star-bar">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-white/80">⭐ 5 / 8</span>
            <span class="text-xs font-semibold text-purple-200">3 more for iPad Time! 🎁</span>
        </div>
        <div class="flex items-center justify-between">
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
        </div>
    </div>
</body>
</html>
