<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightCare - Task Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #6C5CE7 0%, #A29BFE 50%, #DDA0DD 100%);
            width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden;
            color: white; text-align: center;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 24px; margin: 0 auto; margin-top: 14px; }
        .content-area { padding: 0 28px; padding-bottom: 40px; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideUp {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes starBurst {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        @keyframes confettiDrop {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(80px) rotate(720deg); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }
        .pop-in { animation: popIn 0.5s ease-out both; }
        .slide-up { animation: slideUp 0.5s ease-out both; }
        .star-burst { animation: starBurst 0.6s ease-out both; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.5s; }
        .delay-5 { animation-delay: 0.7s; }
        .delay-6 { animation-delay: 0.9s; }
        .confetti { animation: confettiDrop 2s ease-in infinite; }
        .float-slow { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold text-white/80">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-white/80">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="content-area">
        <!-- Confetti -->
        <div class="relative h-10">
            <div class="absolute left-4 top-0 confetti" style="animation-delay: 0s;"><span class="text-2xl">🎉</span></div>
            <div class="absolute left-1/4 top-2 confetti" style="animation-delay: 0.4s;"><span class="text-lg">⭐</span></div>
            <div class="absolute right-1/4 top-0 confetti" style="animation-delay: 0.8s;"><span class="text-2xl">🎊</span></div>
            <div class="absolute right-6 top-1 confetti" style="animation-delay: 1.2s;"><span class="text-lg">✨</span></div>
            <div class="absolute left-1/3 top-3 confetti" style="animation-delay: 0.6s;"><span class="text-sm">💜</span></div>
            <div class="absolute right-1/3 top-2 confetti" style="animation-delay: 1s;"><span class="text-sm">💛</span></div>
        </div>

        <!-- Big check mark -->
        <div class="pop-in mb-4 mt-2">
            <div class="w-36 h-36 bg-white/15 rounded-full mx-auto flex items-center justify-center">
                <div class="w-28 h-28 bg-white/20 rounded-full flex items-center justify-center">
                    <div class="w-22 h-22 flex items-center justify-center">
                        <span class="text-7xl">🎉</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message -->
        <div class="slide-up delay-2 mb-6">
            <h1 class="text-4xl font-extrabold mb-1">YAY!</h1>
            <p class="text-white/60 text-xl">Reading Time Done!</p>
        </div>

        <!-- Stars earned - big and visual -->
        <div class="bg-white/15 rounded-3xl p-6 mb-6 slide-up delay-3">
            <p class="text-white/50 text-sm mb-4">You earned</p>
            <div class="flex items-center justify-center gap-4">
                <span class="text-5xl star-burst delay-4">⭐</span>
                <span class="text-5xl star-burst delay-5">⭐</span>
                <span class="text-5xl star-burst delay-6">⭐</span>
            </div>
            <p class="text-3xl font-extrabold mt-3">+3 Stars!</p>
        </div>

        <!-- Token board progress -->
        <div class="bg-white/10 rounded-2xl p-4 mb-5 slide-up delay-4">
            <div class="flex gap-2 justify-center mb-2">
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center"><i class="fas fa-star text-white text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center border border-dashed border-white/20"><i class="fas fa-star text-white/20 text-sm"></i></div>
            </div>
            <p class="text-sm text-amber-200"><span class="text-lg">🎁</span> 3 more for iPad Time!</p>
        </div>

        <!-- Next task - big visual card -->
        <div class="bg-white/10 rounded-3xl p-5 mb-6 flex items-center gap-4 text-left slide-up delay-5">
            <div class="w-16 h-16 bg-white/15 rounded-2xl flex items-center justify-center flex-shrink-0 float-slow">
                <span class="text-4xl">🧩</span>
            </div>
            <div class="flex-1">
                <p class="text-white/40 text-xs font-semibold">UP NEXT</p>
                <p class="font-bold text-xl">Puzzle Fun!</p>
            </div>
            <div class="flex gap-0.5">
                <i class="fas fa-star text-amber-300 text-sm"></i>
                <i class="fas fa-star text-amber-300 text-sm"></i>
                <i class="fas fa-star text-amber-300 text-sm"></i>
            </div>
        </div>

        <!-- Action buttons - BIG and easy to tap -->
        <button class="w-full bg-white text-purple-700 py-5 rounded-3xl font-extrabold text-xl mb-3 shadow-lg slide-up delay-6">
            Next Task! 🧩
        </button>
        <button class="w-full bg-white/15 text-white py-4 rounded-2xl font-semibold text-base">
            Back to My Day
        </button>
    </div>
</body>
</html>
