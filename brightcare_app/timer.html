<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightCare - Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #1E0A3C 0%, #2D1B69 40%, #3B1C8C 100%);
            width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden;
            color: white;
        }
        .status-bar { height: 59px; padding: 0 28px; color: white; }
        .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 24px; margin: 0 auto; margin-top: 14px; }
        .content-area { padding: 0 28px; padding-bottom: 180px; }

        .timer-ring-outer {
            width: 280px; height: 280px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #A78BFA 0%, #7C3AED 60%, rgba(124,58,237,0.1) 60%, rgba(124,58,237,0.05) 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .timer-ring-inner {
            width: 250px; height: 250px;
            border-radius: 50%;
            background: linear-gradient(180deg, #1E0A3C 0%, #2D1B69 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }

        @keyframes breathe {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(167,139,250,0.3)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 35px rgba(167,139,250,0.5)); transform: scale(1.02); }
        }
        .breathe { animation: breathe 3s ease-in-out infinite; }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .sparkle-1 { animation: sparkle 2s ease-in-out infinite; }
        .sparkle-2 { animation: sparkle 2.5s ease-in-out 0.5s infinite; }
        .sparkle-3 { animation: sparkle 3s ease-in-out 1s infinite; }

        .control-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s;
        }
        .control-btn:active { transform: scale(0.9); }

        .play-btn {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #A78BFA, #7C3AED);
            box-shadow: 0 8px 30px rgba(124,58,237,0.4);
        }

        /* Star Bar */
        .star-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(30,10,60,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 14px 28px 34px 28px;
        }
        .star-slot {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .star-filled {
            background: linear-gradient(135deg, #FCD34D, #F59E0B);
            box-shadow: 0 2px 8px rgba(245,158,11,0.35);
        }
        .star-empty {
            background: rgba(255,255,255,0.06);
            border: 2px dashed rgba(255,255,255,0.15);
        }

        /* Kid Tab Bar */
        .kid-tabs {
            position: absolute; bottom: 98px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px;
            padding: 0 28px;
        }
        .kid-tab {
            flex: 1;
            padding: 10px 0;
            border-radius: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .kid-tab-active {
            background: linear-gradient(135deg, #A78BFA, #7C3AED);
            color: white;
            box-shadow: 0 4px 15px rgba(124,58,237,0.35);
        }
        .kid-tab-inactive {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.5);
        }

        .segment-filled {
            width: 36px; height: 8px;
            border-radius: 4px;
            background: linear-gradient(135deg, #A78BFA, #7C3AED);
        }
        .segment-empty {
            width: 36px; height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            border: 1px dashed rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <div class="content-area">
        <!-- Floating decorations -->
        <div style="position: absolute; top: 80px; left: 32px;" class="text-2xl sparkle-1" style="opacity: 0.3;">✨</div>
        <div style="position: absolute; top: 120px; right: 40px;" class="text-xl sparkle-2" style="opacity: 0.2;">⭐</div>
        <div style="position: absolute; top: 180px; left: 60px;" class="text-lg sparkle-3" style="opacity: 0.25;">🌙</div>

        <!-- Task Label -->
        <div class="text-center mt-6 mb-8">
            <span class="text-5xl">📚</span>
            <h1 class="text-2xl font-extrabold text-white mt-3">Reading Time</h1>
            <p class="text-white/40 text-sm mt-1">Stay focused, you're doing great!</p>
        </div>

        <!-- Timer Ring -->
        <div class="flex justify-center mb-8">
            <div class="timer-ring-outer breathe">
                <div class="timer-ring-inner">
                    <span class="text-6xl font-extrabold tracking-tight">12:34</span>
                    <span class="text-white/40 text-sm mt-1">minutes left</span>
                </div>
            </div>
        </div>

        <!-- Progress Segments -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="segment-filled"></div>
            <div class="segment-filled"></div>
            <div class="segment-filled"></div>
            <div class="segment-filled"></div>
            <div class="segment-filled"></div>
            <div class="segment-empty"></div>
            <div class="segment-empty"></div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-8 mb-6">
            <div class="control-btn bg-white/10">
                <i class="fas fa-rotate-left text-white/60 text-lg"></i>
            </div>
            <div class="control-btn play-btn">
                <i class="fas fa-pause text-white text-2xl"></i>
            </div>
            <div class="control-btn bg-white/10">
                <i class="fas fa-forward text-white/60 text-lg"></i>
            </div>
        </div>

        <!-- Encouragement -->
        <div class="rounded-2xl p-4 text-center mx-4" style="background: rgba(255,255,255,0.06);">
            <p class="text-white/70 text-sm font-medium">
                Almost there! Earn <span class="text-amber-400 font-bold">⭐ 3 stars</span> when you finish
            </p>
        </div>
    </div>

    <!-- Kid Tab Switcher -->
    <div class="kid-tabs">
        <div class="kid-tab kid-tab-inactive">
            <i class="fas fa-calendar-day mr-1"></i> My Day
        </div>
        <div class="kid-tab kid-tab-active">
            <i class="fas fa-stopwatch mr-1"></i> Timer
        </div>
    </div>

    <!-- Persistent Star Token Bar -->
    <div class="star-bar">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-white/80">⭐ 5 / 8</span>
            <span class="text-xs font-semibold text-purple-300">3 more for iPad Time! 🎁</span>
        </div>
        <div class="flex items-center justify-between">
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-filled"><span>⭐</span></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
            <div class="star-slot star-empty"><i class="fas fa-star text-white/20 text-sm"></i></div>
        </div>
    </div>
</body>
</html>
