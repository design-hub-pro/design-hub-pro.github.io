<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.top{position:absolute;inset:0 0 auto 0;height:560px;background:url(img/recipient.jpg) center 20%/cover}
.top:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,25,23,.25) 0%,rgba(28,25,23,0) 30%,rgba(251,248,244,0) 62%,#FBF8F4 100%)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:0 28px 46px}
.logo{width:52px;height:52px;border-radius:17px;background:var(--gradHope);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 14px 26px -10px rgba(15,118,110,.6)}
.role{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:#fff;border:1.5px solid var(--border)}
.role.on{border-color:var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.14)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none}
.role.on .radio{border:7px solid var(--teal)}
.stat{flex:1;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px)}
</style></head>
<body><div class="screen">
  <div class="top"></div>
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>

  <div class="sheet">
    <div class="flex gap-2.5 mb-6">
      <div class="stat"><div class="text-[22px] font-extrabold tracking-tight num">8–15</div><div class="text-[11.5px] font-semibold text-stone-500">ponytails per wig*</div></div>
      <div class="stat"><div class="text-[22px] font-extrabold tracking-tight num">10″+</div><div class="text-[11.5px] font-semibold text-stone-500">typical minimum</div></div>
    </div>
    <div class="logo"><i class="fa-solid fa-hand-holding-heart"></i></div>
    <div class="h1 mt-5" style="font-size:36px">Your hair,<br>someone's <span style="background:var(--gradHope);-webkit-background-clip:text;color:transparent">hope.</span></div>
    <p class="sub mt-3 text-[15px]">An AI guide that gets your donation accepted the first time.</p>

    <div class="mt-6 space-y-2.5">
      <div class="role on"><div class="gicon g-teal"><i class="fa-solid fa-scissors"></i></div><div class="flex-1"><div class="text-[16px] font-bold">I want to donate</div><div class="text-[12.5px] text-stone-500 font-medium">Check, prep, ship, track</div></div><div class="radio"></div></div>
      <div class="role"><div class="gicon g-warm"><i class="fa-solid fa-building-ngo"></i></div><div class="flex-1"><div class="text-[16px] font-bold">I work at a nonprofit</div><div class="text-[12.5px] text-stone-500 font-medium">Forecast, plan, allocate</div></div><div class="radio"></div></div>
    </div>

    <div class="btn mt-6">Get started<i class="fa-solid fa-arrow-right"></i></div>
    <p class="text-center text-[11px] text-stone-400 font-medium mt-4">*Varies by organization and hair length</p>
  </div>
  <div class="homebar"></div>
</div></body></html>
