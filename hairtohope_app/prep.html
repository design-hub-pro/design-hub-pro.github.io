<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Prep</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.ring{position:relative;width:92px;height:92px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:-1px}
.step{display:flex;gap:14px;position:relative;padding-bottom:16px}
.step:before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--border)}
.step:last-child:before{display:none}
.step.done:before{background:var(--teal2)}
.n{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none;background:#fff;border:1.5px solid var(--border);color:var(--muted);position:relative;z-index:2}
.done .n{background:var(--grad);border:0;color:#fff}
.cur .n{background:#fff;border:2px solid var(--coral);color:var(--coral)}
.vthumb{height:150px;border-radius:20px;background:url(img/donor.jpg) center 30%/cover;position:relative;overflow:hidden;margin-top:10px}
.vthumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,25,23,0) 40%,rgba(28,25,23,.7))}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:48</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-2"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="pill" style="background:#CCFBF1;color:#0F766E"><span class="dot" style="background:#0F766E"></span>Brightlocks Kids rules</span><div class="iconbtn"><i class="fa-regular fa-calendar"></i></div></div>

    <div class="card p-5 mt-5 flex items-center gap-5">
      <div class="ring">
        <svg width="92" height="92" viewBox="0 0 92 92"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs>
          <circle cx="46" cy="46" r="38" fill="none" stroke="#EFE9E2" stroke-width="10"/>
          <circle cx="46" cy="46" r="38" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="96" transform="rotate(-90 46 46)"/></svg>
        <b class="num">3/5</b>
      </div>
      <div><div class="meta">Cut-day checklist</div><div class="text-[22px] font-extrabold tracking-tight mt-1 leading-tight">Saturday, Nov 1</div><div class="text-[13px] font-semibold text-stone-500 mt-1"><i class="fa-solid fa-scissors mr-1"></i>Studio Lumen, 11:00</div></div>
    </div>

    <div class="mt-6">
      <div class="step done"><div class="n"><i class="fa-solid fa-check"></i></div><div class="flex-1 pt-1.5"><div class="text-[15px] font-bold">Wash, no conditioner</div></div></div>
      <div class="step done"><div class="n"><i class="fa-solid fa-check"></i></div><div class="flex-1 pt-1.5"><div class="text-[15px] font-bold">Dry completely</div></div></div>
      <div class="step done"><div class="n"><i class="fa-solid fa-check"></i></div><div class="flex-1 pt-1.5"><div class="text-[15px] font-bold">Share guide with stylist</div></div></div>
      <div class="step cur"><div class="n">4</div>
        <div class="flex-1 pt-1.5">
          <div class="flex items-center justify-between"><div class="text-[15px] font-bold">Section into 4 braids</div><span class="text-[11.5px] font-bold text-orange-600">Now</span></div>
          <div class="vthumb"><div class="absolute inset-0 z-[2] flex items-center justify-center"><div class="play"><i class="fa-solid fa-play ml-0.5"></i></div></div><span class="dur">1:48</span></div>
        </div>
      </div>
      <div class="step"><div class="n">5</div><div class="flex-1 pt-1.5"><div class="text-[15px] font-bold text-stone-400">Cut above top band</div></div></div>
    </div>

    <div class="btn mt-2">Mark braids done<i class="fa-solid fa-check"></i></div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
