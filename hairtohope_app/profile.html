<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Me</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cover{height:150px;margin:0 -28px;background:var(--gradHope);position:relative;overflow:hidden}
.cover:before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.av{width:96px;height:96px;border-radius:30px;border:5px solid var(--bg);object-fit:cover;margin-top:-48px;position:relative}
.stat{flex:1;text-align:center;padding:16px 8px}
.badge{flex:none;width:104px;text-align:center}
.badge .b{width:72px;height:72px;border-radius:24px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 12px 22px -12px rgba(28,25,23,.5)}
.badge.lock .b{background:#EFE9E2;color:var(--faint);box-shadow:none}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.row + .row{border-top:1px solid var(--border)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb light" style="position:absolute;left:0;right:0"><span class="t num">10:05</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="cover"></div>
    <div class="flex items-end justify-between">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=240&h=240&fit=crop" class="av">
      <div class="iconbtn mb-1"><i class="fa-solid fa-gear"></i></div>
    </div>
    <div class="h1 mt-3">Priya Shah</div>
    <div class="sub">Donor since 2025 · Columbus, OH</div>

    <div class="card flex mt-5">
      <div class="stat"><div class="big num" style="font-size:30px">1</div><div class="text-[11.5px] font-semibold text-stone-500 mt-1">Donations</div></div>
      <div class="stat border-l border-stone-100"><div class="big num" style="font-size:30px">13.5″</div><div class="text-[11.5px] font-semibold text-stone-500 mt-1">Hair given</div></div>
      <div class="stat border-l border-stone-100"><div class="big num" style="font-size:30px;color:var(--coral)">0</div><div class="text-[11.5px] font-semibold text-stone-500 mt-1">Rejected</div></div>
    </div>

    <div class="sec"><div class="h2">Milestones</div><span class="act">All</span></div>
    <div class="hscroll">
      <div class="badge"><div class="b g-teal"><i class="fa-solid fa-scissors"></i></div><div class="text-[12.5px] font-bold mt-2">First cut</div></div>
      <div class="badge"><div class="b g-warm"><i class="fa-solid fa-circle-check"></i></div><div class="text-[12.5px] font-bold mt-2">Accepted 1st try</div></div>
      <div class="badge"><div class="b g-plum"><i class="fa-solid fa-user-group"></i></div><div class="text-[12.5px] font-bold mt-2">Brought a friend</div></div>
      <div class="badge lock"><div class="b"><i class="fa-solid fa-lock"></i></div><div class="text-[12.5px] font-bold mt-2 text-stone-400">Wig fitted</div></div>
    </div>

    <div class="card mt-6 overflow-hidden">
      <div class="row"><div class="gicon g-amber" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-seedling"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Next eligible cut</div><div class="text-[12px] font-semibold text-stone-500">After Nov 1 cut, about 24 months</div></div><span class="text-[13px] font-bold num text-stone-500">Nov 2028</span></div>
      <div class="row"><div class="gicon g-sky" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-bell"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Wig milestones</div></div><div class="w-11 h-6 rounded-full p-0.5" style="background:var(--teal)"><div class="w-5 h-5 bg-white rounded-full ml-auto"></div></div></div>
      <div class="row"><div class="gicon g-stone" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-user-shield"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Privacy</div></div><i class="fa-solid fa-chevron-right text-stone-300"></i></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-comment-dots"></i>Assistant</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-camera"></i></div></div>
  <div class="tab"><i class="fa-solid fa-location-dot"></i>Track</div>
  <div class="tab on"><i class="fa-solid fa-user"></i>Me</div>
</div>
<div class="homebar"></div>
</div></body></html>
