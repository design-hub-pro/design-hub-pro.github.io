<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Staff Forecast</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.kpi{flex:1;padding:16px}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px}
.seg span{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:10px}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(28,25,23,.08)}
.reg{display:flex;align-items:center;gap:12px;padding:12px 0}
.reg + .reg{border-top:1px solid var(--border)}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">8:30</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="pad">
    <div class="flex items-start justify-between mt-3">
      <div><div class="meta">Brightlocks Kids · Staff</div><div class="h1 mt-1.5">Demand outlook</div></div>
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop" class="w-11 h-11 rounded-[15px] object-cover">
    </div>
    <span class="pill sim mt-3"><i class="fa-solid fa-flask"></i>Simulated data · prototype</span>

    <div class="flex gap-2.5 mt-4">
      <div class="card kpi"><div class="k">Avg. wait</div><div class="big num mt-1">142<span class="text-[14px] text-stone-400 font-bold"> d</span></div><div class="d text-rose-600"><i class="fa-solid fa-arrow-up text-[10px]"></i>9 d vs Q2</div></div>
      <div class="card kpi"><div class="k">Open requests</div><div class="big num mt-1">318</div><div class="d text-stone-500"><span class="dot" style="background:var(--coral)"></span>61 underserved</div></div>
    </div>

    <div class="card p-4 mt-3">
      <div class="flex items-center justify-between">
        <div class="text-[15px] font-bold">Wig requests / week</div>
        <div class="seg" style="width:150px"><span>4w</span><span class="on">12w</span><span>6m</span></div>
      </div>
      <svg viewBox="0 0 360 170" class="w-full mt-3">
        <g stroke="#F0EAE3" stroke-width="1"><line x1="0" y1="20" x2="360" y2="20"/><line x1="0" y1="70" x2="360" y2="70"/><line x1="0" y1="120" x2="360" y2="120"/></g>
        <g font-size="10" fill="#A8A29E" font-weight="600" font-family="Inter"><text x="0" y="16">40</text><text x="0" y="66">30</text><text x="0" y="116">20</text></g>
        <line x1="190" y1="10" x2="190" y2="150" stroke="#D6D3D1" stroke-dasharray="3 4"/>
        <text x="196" y="18" font-size="10" fill="#78716C" font-weight="700" font-family="Inter">Today</text>
        <path d="M190 92 L222 80 L254 70 L286 58 L318 54 L350 44 L350 92 L318 100 L286 100 L254 106 L222 112 L190 92Z" fill="#F97352" opacity=".14"/>
        <path d="M20 118 L50 112 L80 116 L110 104 L140 100 L170 96 L190 92" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M190 92 L222 96 L254 88 L286 79 L318 77 L350 68" fill="none" stroke="#F97352" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
        <circle cx="190" cy="92" r="5" fill="#fff" stroke="#0F766E" stroke-width="3"/>
        <g font-size="10" fill="#A8A29E" font-weight="600" font-family="Inter"><text x="20" y="166">Aug</text><text x="110" y="166">Sep</text><text x="190" y="166">Oct</text><text x="280" y="166">Nov</text><text x="336" y="166">Dec</text></g>
      </svg>
      <div class="flex gap-4 mt-2"><span class="lg"><span class="dot" style="background:#0F766E"></span>Actual</span><span class="lg"><span class="dot" style="background:#F97352"></span>Forecast</span><span class="lg"><span class="w-3 h-2 rounded-sm" style="background:rgba(249,115,82,.2)"></span>80% range</span></div>
    </div>

    <div class="sec"><div class="h2">Need by region</div><span class="act">Map</span></div>
    <div class="card px-4 py-1">
      <div class="reg"><span class="dot" style="background:var(--bad);width:10px;height:10px"></span><div class="flex-1 text-[14px] font-bold">Appalachian OH</div><div class="w-[90px] bar warm"><i style="width:88%"></i></div><span class="text-[13px] font-bold num w-12 text-right">211 d</span></div>
      <div class="reg"><span class="dot" style="background:var(--warn);width:10px;height:10px"></span><div class="flex-1 text-[14px] font-bold">Rural Indiana</div><div class="w-[90px] bar warm"><i style="width:64%"></i></div><span class="text-[13px] font-bold num w-12 text-right">168 d</span></div>
      <div class="reg"><span class="dot" style="background:var(--ok);width:10px;height:10px"></span><div class="flex-1 text-[14px] font-bold">Cleveland metro</div><div class="w-[90px] bar"><i style="width:40%"></i></div><span class="text-[13px] font-bold num w-12 text-right">104 d</span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab on"><i class="fa-solid fa-chart-line"></i>Outlook</div>
  <div class="tab"><i class="fa-solid fa-boxes-stacked"></i>Inventory</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
  <div class="tab"><i class="fa-solid fa-code-compare"></i>Scenarios</div>
  <div class="tab"><i class="fa-solid fa-user-group"></i>Team</div>
</div>
<div class="homebar"></div>
</div></body></html>
