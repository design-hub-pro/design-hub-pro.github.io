<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Ship</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.kit{height:220px;border-radius:28px;background-image:url(img/ship.jpg);background-position:center}
.label{border-radius:24px;background:#fff;border:1px solid var(--border);overflow:hidden;box-shadow:0 18px 36px -22px rgba(28,25,23,.35)}
.label .top{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.barcode{height:54px;background:repeating-linear-gradient(90deg,#1C1917 0 2px,transparent 2px 4px,#1C1917 4px 7px,transparent 7px 9px,#1C1917 9px 10px,transparent 10px 13px);border-radius:4px}
.perf{border-top:2px dashed var(--border);margin:0 18px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:8px 0}
.box{width:22px;height:22px;border-radius:7px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.box.off{background:#fff;border:2px solid var(--border)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">2:10</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-2"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><div class="text-[16px] font-bold">Ship your hair</div><div class="iconbtn"><i class="fa-solid fa-share-from-square"></i></div></div>

    <div class="hero kit mt-5">
      <div class="p-5 h-full flex flex-col justify-between text-white">
        <span class="pill glass self-start"><i class="fa-solid fa-gift"></i>Prepaid by Brightlocks</span>
        <div><div class="text-[24px] font-extrabold tracking-tight">Packing check</div><div class="text-[13px] font-medium opacity-85">Snap your sealed bag. AI confirms before you mail.</div></div>
      </div>
    </div>

    <div class="card p-4 mt-4">
      <div class="check"><div class="box"><i class="fa-solid fa-check"></i></div>4 braids, dry, banded</div>
      <div class="check"><div class="box"><i class="fa-solid fa-check"></i></div>Sealed zip bag</div>
      <div class="check"><div class="box"><i class="fa-solid fa-check"></i></div>Donor form inside</div>
      <div class="check text-stone-400"><div class="box off"></div>Padded mailer</div>
    </div>

    <div class="label mt-4">
      <div class="top"><div class="flex items-center gap-2.5"><i class="fa-solid fa-truck-fast"></i><span class="text-[14px] font-bold">USPS Ground Advantage</span></div><span class="text-[12px] font-semibold opacity-70">Free</span></div>
      <div class="p-[18px]">
        <div class="flex justify-between">
          <div><div class="meta" style="font-size:10px">From</div><div class="text-[14px] font-bold mt-1">Priya S.</div><div class="text-[12px] text-stone-500 font-medium">Columbus, OH</div></div>
          <i class="fa-solid fa-arrow-right text-stone-300 self-center"></i>
          <div class="text-right"><div class="meta" style="font-size:10px">To</div><div class="text-[14px] font-bold mt-1">Brightlocks Kids</div><div class="text-[12px] text-stone-500 font-medium">Cleveland, OH</div></div>
        </div>
      </div>
      <div class="perf"></div>
      <div class="p-[18px] flex items-center gap-4"><div class="barcode flex-1"></div><div class="text-right"><div class="text-[24px] font-extrabold num tracking-tight">2–3</div><div class="text-[11px] font-semibold text-stone-400">days</div></div></div>
    </div>

    <div class="flex gap-2.5 mt-5">
      <div class="btn ghost flex-1"><i class="fa-solid fa-location-dot"></i>Drop-off</div>
      <div class="btn flex-[1.4]"><i class="fa-solid fa-print"></i>Print label</div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
