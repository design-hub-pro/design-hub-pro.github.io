<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairtoHope · Hair Check</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cam{position:absolute;inset:0 0 auto 0;height:520px;background:url(img/braid.jpg) center 35%/cover}
.cam:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 70%,rgba(0,0,0,.35) 100%)}
.corner{position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid;z-index:3}
.ruler{position:absolute;left:96px;top:120px;height:330px;width:3px;background:#2DD4BF;border-radius:2px;z-index:3;box-shadow:0 0 12px rgba(45,212,191,.9)}
.ruler:before,.ruler:after{content:"";position:absolute;left:-7px;width:17px;height:3px;background:#2DD4BF;border-radius:2px}
.ruler:before{top:0}.ruler:after{bottom:0}
.tag{position:absolute;z-index:4;background:rgba(255,255,255,.95);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:470px;background:var(--bg);border-radius:32px 32px 0 0;padding:22px 28px 0;z-index:10}
.grab{width:40px;height:5px;border-radius:3px;background:#E0D8CF;margin:0 auto 18px}
.crit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:1px solid var(--border)}
.crit .k{font-size:12px;font-weight:600;color:var(--muted)}
.crit .v{font-size:15px;font-weight:800;letter-spacing:-.3px}
</style></head>
<body><div class="screen">
  <div class="cam">
    <div class="corner" style="top:96px;left:40px;border-width:3px 0 0 3px;border-radius:12px 0 0 0"></div>
    <div class="corner" style="top:96px;right:40px;border-width:3px 3px 0 0;border-radius:0 12px 0 0"></div>
    <div class="corner" style="top:420px;left:40px;border-width:0 0 3px 3px;border-radius:0 0 0 12px"></div>
    <div class="corner" style="top:420px;right:40px;border-width:0 3px 3px 0;border-radius:0 0 12px 0"></div>
    <div class="ruler"></div>
    <div class="tag" style="left:112px;top:250px"><i class="fa-solid fa-ruler-vertical text-teal-600"></i><span class="num">13.5″ measured</span></div>
    <div class="tag" style="right:44px;top:150px"><span class="dot" style="background:#16A34A"></span>Dry</div>
    <div class="tag" style="right:56px;top:350px"><span class="dot" style="background:#16A34A"></span>Banded</div>
  </div>
  <div class="sb light"><span class="t num">9:45</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad flex justify-between mt-2 relative z-10"><div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div><span class="pill glass self-center"><i class="fa-solid fa-wand-magic-sparkles"></i>AI hair check</span><div class="iconbtn glass"><i class="fa-solid fa-bolt"></i></div></div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="flex items-end justify-between">
      <div><div class="meta">Result</div><div class="h1 mt-1">Ready to donate</div></div>
      <div class="text-right"><div class="big num" style="color:var(--teal)">94<span class="text-[16px] text-stone-400">%</span></div><div class="text-[11px] font-semibold text-stone-400">confidence</div></div>
    </div>

    <div class="grid grid-cols-2 gap-2.5 mt-5">
      <div class="crit"><div class="gicon g-teal" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-ruler"></i></div><div><div class="k">Length</div><div class="v num">13.5″</div></div></div>
      <div class="crit"><div class="gicon g-amber" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-palette"></i></div><div><div class="k">Color</div><div class="v">Dyed</div></div></div>
      <div class="crit"><div class="gicon g-sky" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-droplet-slash"></i></div><div><div class="k">Moisture</div><div class="v">Dry</div></div></div>
      <div class="crit"><div class="gicon g-plum" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-layer-group"></i></div><div><div class="k">Gray</div><div class="v num">&lt; 5%</div></div></div>
    </div>

    <div class="card p-4 mt-4 flex items-center gap-3">
      <div class="avs"><span style="background:#CCFBF1;color:#0F766E">BK</span><span style="background:#FFEDD5;color:#C2410C">CA</span></div>
      <div class="flex-1 text-[13.5px] font-bold">Matches 2 of 3 organizations</div>
      <i class="fa-solid fa-chevron-right text-stone-300"></i>
    </div>
    <div class="btn mt-4">See my matches<i class="fa-solid fa-arrow-right"></i></div>
  </div>
  <div class="homebar"></div>
</div></body></html>
