<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShuttleForm</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0B1417;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:84px 40px 100px}
.hero{display:flex;align-items:center;gap:26px;margin-bottom:72px}
.icon{width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,#19C9B4,#0A7E92);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 34px -14px rgba(10,126,146,.6);flex-shrink:0}
h1{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1}
.tag{font-size:18px;color:#42565C;font-weight:500;margin-top:10px;letter-spacing:-.2px}
.tags{display:flex;gap:8px;margin-top:16px}
.tags span{font-size:12px;font-weight:700;letter-spacing:.4px;background:#F1F5F5;color:#42565C;padding:7px 13px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,460px);gap:64px 44px;justify-content:center}
.item{display:flex;flex-direction:column;align-items:center;gap:18px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1417;box-shadow:0 30px 70px -30px rgba(11,20,23,.55)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#fff}
.label{font-size:15px;font-weight:700;letter-spacing:-.2px}
.n{font-size:12px;font-weight:700;color:#A8B5B9;letter-spacing:1.6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="38" r="8.5" fill="#fff"/>
        <path d="M26 29.5 L17 8 L26 3 L35 8 Z" fill="#fff" fill-opacity=".92"/>
        <path d="M26 29.5 L26 3" stroke="#0A7E92" stroke-width="1.6"/>
        <path d="M21.4 18.5 L30.6 18.5 M19.6 12.5 L32.4 12.5" stroke="#0A7E92" stroke-width="1.6"/>
      </svg>
    </div>
    <div>
      <h1>ShuttleForm</h1>
      <div class="tag">Phone on a tripod, joint-level feedback on every badminton shot you play.</div>
      <div class="tags"><span>Pose Estimation</span><span>Badminton</span><span>On Device</span><span>Coaching</span></div>
    </div>
  </div>

  <div class="grid">
    <div class="item"><div class="frame"><iframe src="setup.html" scrolling="no"></iframe></div><div><span class="n">01</span> <span class="label">Camera setup</span></div></div>
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div><span class="n">02</span> <span class="label">Today</span></div></div>
    <div class="item"><div class="frame"><iframe src="record.html" scrolling="no"></iframe></div><div><span class="n">03</span> <span class="label">Live capture</span></div></div>
    <div class="item"><div class="frame"><iframe src="analysis.html" scrolling="no"></iframe></div><div><span class="n">04</span> <span class="label">Shot analysis</span></div></div>
    <div class="item"><div class="frame"><iframe src="drill.html" scrolling="no"></iframe></div><div><span class="n">05</span> <span class="label">Drill</span></div></div>
    <div class="item"><div class="frame"><iframe src="progress.html" scrolling="no"></iframe></div><div><span class="n">06</span> <span class="label">Progress</span></div></div>
    <div class="item"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div><span class="n">07</span> <span class="label">Profile</span></div></div>
  </div>
</div>
</body>
</html>
