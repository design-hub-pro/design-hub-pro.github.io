<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShuttleForm - Pose</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{display:none}
html,body{height:100%;scrollbar-width:none;-ms-overflow-style:none}
:root{--accent:#12B3A6;--g1:#19C9B4;--g2:#0A7E92;--ink:#0B1417;--mid:#42565C;--muted:#839499;--line:#E4EAEB;--bg:#FAFCFC}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;background:var(--bg);position:relative;overflow-y:auto;overflow-x:hidden;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.sb{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;letter-spacing:-.2px}
.sb .icons{display:flex;gap:6px;align-items:center;font-size:13px}
.island{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:122px;height:35px;background:#000;border-radius:18px}
.pad{padding:0 28px}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(11,20,23,.05),0 8px 24px -8px rgba(11,20,23,.10);border:1px solid rgba(228,234,235,.8)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:none;border-radius:18px;height:58px;width:100%;font-family:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -8px rgba(10,126,146,.55)}
.cp{padding:14px 0;border-bottom:1px solid var(--line)}
.cp:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="screen">
  <div class="sb">
    <div class="t num">9:41</div>
    <div class="island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="pad" style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
    <div style="width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-chevron-left" style="font-size:14px"></i></div>
    <div class="num" style="font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1.6px">POSE 1 OF 8</div>
    <div style="width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-bookmark" style="font-size:14px;color:var(--accent)"></i></div>
  </div>

  <div class="pad" style="margin-top:14px;display:flex;align-items:flex-end;justify-content:space-between">
    <div>
      <div style="font-size:32px;font-weight:800;letter-spacing:-1.2px;line-height:1.05">Overhead smash</div>
      <div class="num" style="font-size:13px;color:var(--muted);font-weight:600;margin-top:6px">42 attempts &middot; best 79 &middot; Wk 6</div>
    </div>
    <div style="text-align:right;flex-shrink:0;margin-left:12px">
      <div class="num" style="font-size:34px;font-weight:800;letter-spacing:-1.4px;line-height:1">68</div>
      <div class="num" style="font-size:12px;font-weight:800;color:var(--accent)"><i class="fas fa-arrow-up" style="font-size:9px"></i> 6</div>
    </div>
  </div>

  <!-- reference video -->
  <div class="pad" style="margin-top:18px">
    <div style="position:relative;height:238px;border-radius:24px;overflow:hidden;box-shadow:0 16px 34px -16px rgba(11,20,23,.5)">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786823226640-image-1.png" style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,24,.25) 0%,rgba(6,20,24,0) 40%,rgba(6,20,24,.9))"></div>
      <div style="position:absolute;top:14px;left:14px;display:flex;gap:7px">
        <span style="background:rgba(18,179,166,.92);color:#fff;font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px">Reference</span>
        <span class="num" style="background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px">0.25x</span>
      </div>
      <div style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35)"><i class="fas fa-play" style="font-size:19px;color:#0B1417;margin-left:4px"></i></div>
      <div style="position:absolute;left:18px;right:18px;bottom:16px;color:#fff">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
          <span class="num" style="font-size:11px;font-weight:700">0:02</span>
          <div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);position:relative">
            <div style="width:34%;height:100%;border-radius:2px;background:#19C9B4"></div>
            <div style="position:absolute;left:34%;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff"></div>
            <div style="position:absolute;left:62%;top:-5px;width:2.5px;height:14px;background:#FFD166"></div>
          </div>
          <span class="num" style="font-size:11px;font-weight:700;opacity:.7">0:06</span>
        </div>
        <div class="num" style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#FFD166">Contact frame at 0:04</div>
      </div>
    </div>
  </div>

  <!-- checkpoints -->
  <div class="pad" style="margin-top:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <div class="meta">Checkpoints</div>
      <div class="num" style="font-size:12px;font-weight:700;color:var(--muted)">2 of 4 met</div>
    </div>
    <div class="card" style="padding:4px 18px">

      <div class="cp">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <span class="dot" style="background:#E4573D"></span>
          <span style="font-size:15.5px;font-weight:700;flex:1">Elbow at contact</span>
          <span class="num" style="font-size:15px;font-weight:800;color:#E4573D">141&deg;</span>
          <span class="num" style="font-size:12px;font-weight:700;color:var(--muted)">/ 168&deg;</span>
        </div>
        <svg viewBox="0 0 340 12" style="width:100%;display:block;height:12px">
          <rect x="0" y="4" width="340" height="6" rx="3" fill="#EDF2F2"/>
          <rect x="196" y="4" width="82" height="6" rx="3" fill="#12B3A6" fill-opacity=".35"/>
          <rect x="130" y="0" width="4" height="12" rx="2" fill="#E4573D"/>
        </svg>
      </div>

      <div class="cp">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <span class="dot" style="background:#D98014"></span>
          <span style="font-size:15.5px;font-weight:700;flex:1">Hip rotation</span>
          <span class="num" style="font-size:15px;font-weight:800;color:#D98014">34&deg;</span>
          <span class="num" style="font-size:12px;font-weight:700;color:var(--muted)">/ 52&deg;</span>
        </div>
        <svg viewBox="0 0 340 12" style="width:100%;display:block;height:12px">
          <rect x="0" y="4" width="340" height="6" rx="3" fill="#EDF2F2"/>
          <rect x="204" y="4" width="78" height="6" rx="3" fill="#12B3A6" fill-opacity=".35"/>
          <rect x="146" y="0" width="4" height="12" rx="2" fill="#D98014"/>
        </svg>
      </div>

      <div class="cp">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <span class="dot" style="background:var(--accent)"></span>
          <span style="font-size:15.5px;font-weight:700;flex:1">Contact height</span>
          <span class="num" style="font-size:15px;font-weight:800">2.41<span style="font-size:11px">m</span></span>
          <span class="num" style="font-size:12px;font-weight:700;color:var(--muted)">/ 2.35m</span>
        </div>
        <svg viewBox="0 0 340 12" style="width:100%;display:block;height:12px">
          <rect x="0" y="4" width="340" height="6" rx="3" fill="#EDF2F2"/>
          <rect x="188" y="4" width="90" height="6" rx="3" fill="#12B3A6" fill-opacity=".35"/>
          <rect x="238" y="0" width="4" height="12" rx="2" fill="#12B3A6"/>
        </svg>
      </div>

      <div class="cp">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
          <span class="dot" style="background:var(--accent)"></span>
          <span style="font-size:15.5px;font-weight:700;flex:1">Non-racket arm</span>
          <span class="num" style="font-size:15px;font-weight:800">149&deg;</span>
          <span class="num" style="font-size:12px;font-weight:700;color:var(--muted)">/ 145&deg;</span>
        </div>
        <svg viewBox="0 0 340 12" style="width:100%;display:block;height:12px">
          <rect x="0" y="4" width="340" height="6" rx="3" fill="#EDF2F2"/>
          <rect x="176" y="4" width="86" height="6" rx="3" fill="#12B3A6" fill-opacity=".35"/>
          <rect x="216" y="0" width="4" height="12" rx="2" fill="#12B3A6"/>
        </svg>
      </div>

    </div>
  </div>

  <!-- attempt history -->
  <div class="pad" style="margin-top:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <div class="meta">Your attempts</div>
      <div style="font-size:12px;font-weight:700;color:var(--accent)">All 42 <i class="fas fa-chevron-right" style="font-size:9px"></i></div>
    </div>
    <div class="card" style="padding:18px">
      <svg viewBox="0 0 340 92" style="width:100%;display:block">
        <line x1="0" y1="30" x2="340" y2="30" stroke="#12B3A6" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55"/>
        <text x="2" y="24" font-family="Inter" font-size="10" font-weight="800" fill="#0A7E92" letter-spacing="1">TARGET 80</text>
        <g>
          <rect x="8"   y="62" width="34" height="24" rx="5" fill="#DCE5E6"/>
          <rect x="60"  y="55" width="34" height="31" rx="5" fill="#DCE5E6"/>
          <rect x="112" y="58" width="34" height="28" rx="5" fill="#DCE5E6"/>
          <rect x="164" y="48" width="34" height="38" rx="5" fill="#B7D9D6"/>
          <rect x="216" y="52" width="34" height="34" rx="5" fill="#B7D9D6"/>
          <rect x="268" y="40" width="34" height="46" rx="5" fill="url(#bg1)"/>
        </g>
        <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#19C9B4"/><stop offset="100%" stop-color="#0A7E92"/></linearGradient></defs>
        <g font-family="Inter" font-size="11" font-weight="800" fill="#42565C" text-anchor="middle">
          <text x="25" y="58">58</text><text x="77" y="51">63</text><text x="129" y="54">61</text><text x="181" y="44">71</text><text x="233" y="48">67</text>
        </g>
        <text x="285" y="36" font-family="Inter" font-size="12" font-weight="800" fill="#0A7E92" text-anchor="middle">79</text>
      </svg>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <span class="num meta" style="font-size:10px;letter-spacing:1px">Wk 1</span>
        <span class="num meta" style="font-size:10px;letter-spacing:1px;color:var(--ink)">Last night</span>
      </div>
    </div>
  </div>

  <div class="pad" style="margin-top:24px;padding-bottom:38px;display:flex;gap:11px">
    <div style="width:58px;height:58px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-layer-group" style="font-size:16px;color:var(--mid)"></i></div>
    <button class="btn"><i class="fas fa-video" style="font-size:14px"></i> Record attempt</button>
  </div>
</div>
</body>
</html>
