<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShuttleForm - Drill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{display:none}
html,body{height:100%;scrollbar-width:none;-ms-overflow-style:none}
:root{--accent:#12B3A6;--g1:#19C9B4;--g2:#0A7E92;--ink:#0B1417;--mid:#42565C;--muted:#839499;--line:#E4EAEB;--bg:#FAFCFC}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;background:var(--bg);position:relative;overflow-y:auto;overflow-x:hidden;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.sb{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;letter-spacing:-.2px}
.sb .icons{display:flex;gap:6px;align-items:center;font-size:13px}
.island{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:122px;height:35px;background:#000;border-radius:18px}
.pad{padding:0 28px}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(11,20,23,.05),0 8px 24px -8px rgba(11,20,23,.10);border:1px solid rgba(228,234,235,.8)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:none;border-radius:18px;height:58px;width:100%;font-family:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -8px rgba(10,126,146,.55)}
.seg{flex:1;height:26px;border-radius:3px;background:#E7EDED}
.seg.ok{background:linear-gradient(180deg,#19C9B4,#0A7E92)}
.seg.miss{background:#E9A94D}
</style>
</head>
<body>
<div class="screen">
  <div class="sb">
    <div class="t num">9:41</div>
    <div class="island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="pad" style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
    <div style="width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-chevron-left" style="font-size:14px"></i></div>
    <div style="display:flex;align-items:center;gap:7px;background:rgba(18,179,166,.11);padding:8px 13px;border-radius:20px">
      <span class="dot" style="background:var(--accent);width:7px;height:7px"></span>
      <span class="num" style="font-size:12px;font-weight:800;color:#0A7E92">Set 2 of 3</span>
    </div>
    <div style="width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-ellipsis" style="font-size:14px"></i></div>
  </div>

  <div class="pad" style="margin-top:16px">
    <div style="font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.05">Shadow smash</div>
    <div class="num" style="font-size:13.5px;color:var(--muted);font-weight:600;margin-top:7px">Fixes elbow lag &middot; 0.09s late &middot; 8 min</div>
  </div>

  <!-- rep counter -->
  <div class="pad" style="margin-top:20px">
    <div class="card" style="padding:20px">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px">
        <div>
          <div class="meta" style="margin-bottom:4px">Reps</div>
          <div style="display:flex;align-items:baseline">
            <span class="num" style="font-size:52px;font-weight:800;letter-spacing:-2.4px;line-height:.9">18</span>
            <span class="num" style="font-size:20px;font-weight:700;color:var(--muted);margin-left:4px">/30</span>
          </div>
        </div>
        <div style="text-align:right">
          <div class="num" style="font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.6px">15</div>
          <div class="meta" style="font-size:10px;letter-spacing:1.4px;margin-top:2px">In band</div>
        </div>
      </div>
      <div style="display:flex;gap:3px">
        <div class="seg ok"></div><div class="seg ok"></div><div class="seg miss"></div><div class="seg ok"></div><div class="seg ok"></div>
        <div class="seg ok"></div><div class="seg ok"></div><div class="seg ok"></div><div class="seg miss"></div><div class="seg ok"></div>
        <div class="seg ok"></div><div class="seg ok"></div><div class="seg ok"></div><div class="seg ok"></div><div class="seg miss"></div>
        <div class="seg ok"></div><div class="seg ok"></div><div class="seg ok"></div>
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
        <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
        <div class="seg"></div><div class="seg"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:9px">
        <span class="num meta" style="font-size:10px;letter-spacing:1px">Rep 1</span>
        <span class="num meta" style="font-size:10px;letter-spacing:1px;color:var(--accent)">3 out of band</span>
        <span class="num meta" style="font-size:10px;letter-spacing:1px">Rep 30</span>
      </div>
    </div>
  </div>

  <!-- target band gauge -->
  <div class="pad" style="margin-top:20px">
    <div class="card" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:17px;font-weight:800;letter-spacing:-.3px">Elbow at contact</div>
        <div class="num" style="font-size:13px;font-weight:800;color:#D98014">152&deg;</div>
      </div>
      <svg viewBox="0 0 360 76" style="width:100%;display:block">
        <rect x="0" y="26" width="360" height="16" rx="8" fill="#EDF2F2"/>
        <rect x="216" y="26" width="90" height="16" rx="8" fill="#12B3A6" fill-opacity=".28"/>
        <rect x="216" y="26" width="4" height="16" fill="#12B3A6"/><rect x="302" y="26" width="4" height="16" fill="#12B3A6"/>
        <!-- session mean marker -->
        <g>
          <rect x="176" y="18" width="5" height="32" rx="2.5" fill="#D98014"/>
          <path d="M178.5 12 L184 4 L173 4 Z" fill="#D98014"/>
        </g>
        <text x="0" y="66" font-family="Inter" font-size="11" font-weight="700" fill="#839499">120&deg;</text>
        <text x="228" y="66" font-family="Inter" font-size="11" font-weight="700" fill="#0A7E92">160-175&deg; band</text>
        <text x="336" y="66" font-family="Inter" font-size="11" font-weight="700" fill="#839499">190&deg;</text>
      </svg>
      <div style="display:flex;gap:10px;margin-top:14px">
        <div style="flex:1;background:#F4F7F7;border-radius:14px;padding:12px 13px">
          <div class="meta" style="font-size:9.5px;letter-spacing:1.4px">Best rep</div>
          <div class="num" style="font-size:22px;font-weight:800;letter-spacing:-.8px;margin-top:3px">167&deg;</div>
        </div>
        <div style="flex:1;background:#F4F7F7;border-radius:14px;padding:12px 13px">
          <div class="meta" style="font-size:9.5px;letter-spacing:1.4px">Set 1 mean</div>
          <div class="num" style="font-size:22px;font-weight:800;letter-spacing:-.8px;margin-top:3px">144&deg;</div>
        </div>
        <div style="flex:1;background:rgba(18,179,166,.1);border-radius:14px;padding:12px 13px">
          <div class="meta" style="font-size:9.5px;letter-spacing:1.4px;color:#0A7E92">Delta</div>
          <div class="num" style="font-size:22px;font-weight:800;letter-spacing:-.8px;margin-top:3px;color:var(--accent)">+8&deg;</div>
        </div>
      </div>
    </div>
  </div>

  <!-- reference clip -->
  <div class="pad" style="margin-top:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <div class="meta">Reference</div>
      <div style="font-size:12px;font-weight:700;color:var(--accent)">Slow 0.25x <i class="fas fa-chevron-right" style="font-size:9px"></i></div>
    </div>
    <div style="display:flex;gap:12px;align-items:stretch">
      <div style="position:relative;width:132px;height:132px;border-radius:20px;overflow:hidden;flex-shrink:0;box-shadow:0 12px 26px -12px rgba(11,20,23,.5)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786821371315-image-1.png" style="width:100%;height:100%;object-fit:cover;display:block">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,24,0) 45%,rgba(6,20,24,.75))"></div>
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center"><i class="fas fa-play" style="font-size:13px;color:#0B1417;margin-left:2px"></i></div>
        <div class="num" style="position:absolute;left:10px;bottom:8px;color:#fff;font-size:11px;font-weight:700">0:04</div>
      </div>
      <div class="card" style="flex:1;padding:15px 16px;display:flex;flex-direction:column;justify-content:center;gap:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="dot" style="background:var(--accent)"></span>
          <span style="font-size:14.5px;font-weight:600;flex:1">Elbow leads wrist</span>
          <span class="num" style="font-size:13px;font-weight:800">168&deg;</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="dot" style="background:var(--accent)"></span>
          <span style="font-size:14.5px;font-weight:600;flex:1">Hip opens first</span>
          <span class="num" style="font-size:13px;font-weight:800">52&deg;</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="dot" style="background:var(--accent)"></span>
          <span style="font-size:14.5px;font-weight:600;flex:1">Contact ahead</span>
          <span class="num" style="font-size:13px;font-weight:800">0.21m</span>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" style="margin-top:24px;padding-bottom:38px;display:flex;gap:11px">
    <div style="width:58px;height:58px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-pause" style="font-size:16px;color:var(--mid)"></i></div>
    <button class="btn">Rep 19 <i class="fas fa-arrow-right" style="font-size:13px"></i></button>
  </div>
</div>
</body>
</html>
