<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShuttleForm - Record</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{display:none}
html,body{scrollbar-width:none}
:root{--accent:#19C9B4;--ink:#060F12;--line:rgba(255,255,255,.1)}
body{font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;background:var(--ink);position:relative;overflow:hidden;color:#fff}
.num{font-variant-numeric:tabular-nums}
.sb{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.sb .t{font-size:15px;font-weight:600;letter-spacing:-.2px}
.sb .icons{display:flex;gap:6px;align-items:center;font-size:13px}
.island{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:122px;height:35px;background:#000;border-radius:18px;z-index:6}
.meta{font-size:10px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:#5F7B81}
.chip{backdrop-filter:blur(12px);border-radius:10px;font-size:11px;font-weight:700;padding:7px 11px;display:flex;align-items:center;gap:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rec{animation:pulse 1.4s infinite}
</style>
</head>
<body>
<div class="screen">
  <!-- viewfinder -->
  <div style="position:absolute;top:0;left:0;right:0;height:610px;overflow:hidden">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786821377734-image-1.png" style="width:100%;height:100%;object-fit:cover;display:block">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,15,18,.55) 0%,rgba(6,15,18,0) 22%,rgba(6,15,18,0) 62%,rgba(6,15,18,.95) 100%)"></div>

    <!-- skeleton overlay -->
    <svg viewBox="0 0 460 610" style="position:absolute;inset:0;width:100%;height:100%">
      <g stroke="#19C9B4" stroke-width="3" stroke-linecap="round" fill="none" opacity=".95">
        <path d="M222.8 238.3 L222.8 285.9"/>
        <path d="M182.3 297.9 L270.5 300.8"/>
        <path d="M182.3 297.9 L175.2 344.3 L225.8 364.6"/>
        <path d="M270.5 300.8 L306.2 339.6 L336 351.5"/>
        <path d="M182.3 297.9 L196 390.2 L259.8 390.2 L270.5 300.8"/>
        <path d="M196 390.2 L118.6 411 L60.8 461.7"/>
        <path d="M259.8 390.2 L336 411 L401.6 461.7"/>
      </g>
      <g fill="#0B1417" stroke="#19C9B4" stroke-width="2.6">
        <circle cx="222.8" cy="285.9" r="4.6"/><circle cx="182.3" cy="297.9" r="5.4"/><circle cx="270.5" cy="300.8" r="5.4"/>
        <circle cx="175.2" cy="344.3" r="5.4"/><circle cx="306.2" cy="339.6" r="5.4"/>
        <circle cx="225.8" cy="364.6" r="4.6"/><circle cx="336" cy="351.5" r="4.6"/>
        <circle cx="196" cy="390.2" r="5.4"/><circle cx="259.8" cy="390.2" r="5.4"/>
        <circle cx="118.6" cy="411" r="5.4"/><circle cx="336" cy="411" r="5.4"/>
        <circle cx="60.8" cy="461.7" r="4.6"/><circle cx="401.6" cy="461.7" r="4.6"/>
      </g>
      <circle cx="222.8" cy="238.3" r="21" fill="none" stroke="#19C9B4" stroke-width="2.2" stroke-dasharray="4 4" opacity=".8"/>
      <!-- elbow angle arc -->
      <path d="M175.2 320.5 A 24 24 0 0 0 198.5 355" fill="none" stroke="#FFD166" stroke-width="2.6"/>
      <!-- shuttle track -->
      <path d="M400 120 Q 355 150 315 196" stroke="#FFD166" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".85"/>
      <circle cx="315" cy="196" r="7" fill="none" stroke="#FFD166" stroke-width="2.4"/>
      <circle cx="315" cy="196" r="2.4" fill="#FFD166"/>
      <!-- bounding box corners -->
      <g stroke="#fff" stroke-width="2.4" opacity=".55" fill="none">
        <path d="M40 214 L40 200 L54 200"/><path d="M420 214 L420 200 L406 200"/>
        <path d="M40 476 L40 490 L54 490"/><path d="M420 476 L420 490 L406 490"/>
      </g>
    </svg>

    <!-- elbow callout -->
    <div style="position:absolute;left:16px;top:365px;background:rgba(6,15,18,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,209,102,.4);border-radius:12px;padding:8px 11px">
      <div class="meta" style="color:#FFD166;font-size:9px">Elbow</div>
      <div class="num" style="font-size:19px;font-weight:800;letter-spacing:-.6px;margin-top:1px">141&deg;</div>
    </div>
  </div>

  <div class="sb">
    <div class="t num">9:41</div>
    <div class="island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <!-- top chips -->
  <div style="position:absolute;top:70px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;z-index:4">
    <div style="display:flex;gap:8px">
      <div class="chip" style="background:rgba(228,87,61,.92)"><span class="rec" style="width:7px;height:7px;border-radius:50%;background:#fff"></span><span class="num">04:12</span></div>
      <div class="chip" style="background:rgba(255,255,255,.14)"><span class="num">60 fps</span></div>
    </div>
    <div class="chip" style="background:rgba(255,255,255,.14)"><i class="fas fa-microchip" style="font-size:10px"></i><span>On device</span></div>
  </div>

  <!-- detection chip -->
  <div style="position:absolute;top:530px;left:28px;right:28px;z-index:4;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px;background:rgba(25,201,180,.92);border-radius:14px;padding:10px 14px">
      <i class="fas fa-crosshairs" style="font-size:13px"></i>
      <div>
        <div style="font-size:15px;font-weight:800;letter-spacing:-.3px">Drive detected</div>
        <div class="num" style="font-size:11px;font-weight:600;opacity:.85">conf 0.94 &middot; rally 14</div>
      </div>
    </div>
    <div class="chip" style="background:rgba(255,255,255,.14)"><i class="fas fa-lock" style="font-size:10px"></i><span>Auto trim</span></div>
  </div>

  <!-- panel -->
  <div style="position:absolute;top:610px;left:0;right:0;bottom:0;padding:20px 28px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="meta">Live angles</div>
      <div class="num meta" style="color:#19C9B4">17 joints tracked</div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:12px 13px">
        <div class="meta" style="font-size:9px">Shoulder</div>
        <div class="num" style="font-size:26px;font-weight:800;letter-spacing:-1px;margin:2px 0 8px">92&deg;</div>
        <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.12);position:relative"><div style="position:absolute;left:52%;width:30%;height:100%;border-radius:2px;background:rgba(25,201,180,.35)"></div><div style="position:absolute;left:63%;width:3px;height:100%;background:#19C9B4"></div></div>
      </div>
      <div style="flex:1;background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.3);border-radius:16px;padding:12px 13px">
        <div class="meta" style="font-size:9px;color:#FFD166">Elbow</div>
        <div class="num" style="font-size:26px;font-weight:800;letter-spacing:-1px;margin:2px 0 8px;color:#FFD166">141&deg;</div>
        <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.12);position:relative"><div style="position:absolute;left:56%;width:30%;height:100%;border-radius:2px;background:rgba(255,209,102,.3)"></div><div style="position:absolute;left:41%;width:3px;height:100%;background:#FFD166"></div></div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:12px 13px">
        <div class="meta" style="font-size:9px">Knee</div>
        <div class="num" style="font-size:26px;font-weight:800;letter-spacing:-1px;margin:2px 0 8px">118&deg;</div>
        <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.12);position:relative"><div style="position:absolute;left:44%;width:32%;height:100%;border-radius:2px;background:rgba(25,201,180,.35)"></div><div style="position:absolute;left:58%;width:3px;height:100%;background:#19C9B4"></div></div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px">
      <div class="meta">This session</div>
      <div class="num meta">41 shots</div>
    </div>
    <div style="display:flex;gap:7px">
      <div style="flex:1;text-align:center;background:rgba(255,255,255,.06);border-radius:13px;padding:9px 0"><div class="num" style="font-size:18px;font-weight:800">14</div><div class="meta" style="font-size:9px;letter-spacing:1.2px">Smash</div></div>
      <div style="flex:1;text-align:center;background:rgba(255,255,255,.06);border-radius:13px;padding:9px 0"><div class="num" style="font-size:18px;font-weight:800">11</div><div class="meta" style="font-size:9px;letter-spacing:1.2px">Clear</div></div>
      <div style="flex:1;text-align:center;background:rgba(25,201,180,.16);border:1px solid rgba(25,201,180,.35);border-radius:13px;padding:9px 0"><div class="num" style="font-size:18px;font-weight:800;color:#19C9B4">9</div><div class="meta" style="font-size:9px;letter-spacing:1.2px;color:#19C9B4">Drive</div></div>
      <div style="flex:1;text-align:center;background:rgba(255,255,255,.06);border-radius:13px;padding:9px 0"><div class="num" style="font-size:18px;font-weight:800">7</div><div class="meta" style="font-size:9px;letter-spacing:1.2px">Net</div></div>
    </div>

    <!-- controls -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:26px">
      <div style="width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-images" style="font-size:16px;color:#9FB6BB"></i></div>
      <div style="width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center">
        <div style="width:32px;height:32px;border-radius:9px;background:#E4573D"></div>
      </div>
      <div style="width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="fas fa-person-running" style="font-size:16px;color:#19C9B4"></i></div>
    </div>
  </div>
</div>
</body>
</html>
