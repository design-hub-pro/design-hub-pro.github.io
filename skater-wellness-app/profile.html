<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Skater Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-blue-50 to-white h-screen overflow-hidden">
    <!-- iOS Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2">
        <div class="flex justify-between items-center text-xs font-semibold">
            <span>9:41</span>
            <div class="flex gap-1 items-center">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-6 pb-24 overflow-y-auto h-full">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Profile</h1>
        </div>

        <!-- Profile Card -->
        <div class="bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl p-6 mb-6 text-white">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center text-3xl font-bold">
                    SK
                </div>
                <div>
                    <h2 class="text-2xl font-bold">Sarah Kim</h2>
                    <p class="text-white/80 text-sm">Figure Skater</p>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3 bg-white/10 rounded-2xl p-4">
                <div class="text-center">
                    <p class="text-2xl font-bold">12</p>
                    <p class="text-xs opacity-80">Day Streak</p>
                </div>
                <div class="text-center border-l border-r border-white/20">
                    <p class="text-2xl font-bold">38</p>
                    <p class="text-xs opacity-80">Exercises</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold">Pro</p>
                    <p class="text-xs opacity-80">Member</p>
                </div>
            </div>
        </div>

        <!-- Settings Sections -->
        <div class="space-y-4">
            <!-- Account Section -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-500 text-xs uppercase">Account</h3>
                </div>
                <button class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-100 active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-user-circle text-gray-400 w-5"></i>
                        <span class="text-gray-900">Edit Profile</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                </button>
                <button class="w-full px-4 py-3 flex items-center justify-between active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-bell text-gray-400 w-5"></i>
                        <span class="text-gray-900">Notifications</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                </button>
            </div>

            <!-- Preferences Section -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-500 text-xs uppercase">Preferences</h3>
                </div>
                <button class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-100 active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-moon text-gray-400 w-5"></i>
                        <span class="text-gray-900">Dark Mode</span>
                    </div>
                    <div class="w-12 h-7 bg-gray-200 rounded-full relative">
                        <div class="w-5 h-5 bg-white rounded-full absolute top-1 left-1 shadow"></div>
                    </div>
                </button>
                <button class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-100 active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-clock text-gray-400 w-5"></i>
                        <span class="text-gray-900">Daily Reminder</span>
                    </div>
                    <span class="text-gray-400 text-sm">9:00 AM</span>
                </button>
                <button class="w-full px-4 py-3 flex items-center justify-between active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-volume-up text-gray-400 w-5"></i>
                        <span class="text-gray-900">Audio Guidance</span>
                    </div>
                    <div class="w-12 h-7 bg-blue-600 rounded-full relative">
                        <div class="w-5 h-5 bg-white rounded-full absolute top-1 right-1 shadow"></div>
                    </div>
                </button>
            </div>

            <!-- Support Section -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-500 text-xs uppercase">Support</h3>
                </div>
                <button class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-100 active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-question-circle text-gray-400 w-5"></i>
                        <span class="text-gray-900">Help Center</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                </button>
                <button class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-100 active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-shield-alt text-gray-400 w-5"></i>
                        <span class="text-gray-900">Privacy Policy</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                </button>
                <button class="w-full px-4 py-3 flex items-center justify-between active:bg-gray-50">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-sign-out-alt text-red-500 w-5"></i>
                        <span class="text-red-500">Sign Out</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                </button>
            </div>
        </div>

        <p class="text-center text-gray-400 text-xs mt-8">Version 1.0.0</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 pb-6">
        <div class="flex justify-around items-center">
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-clipboard-list text-xl"></i>
                <span class="text-xs">Check-in</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-dumbbell text-xl"></i>
                <span class="text-xs">Exercises</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Progress</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-blue-600">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs font-medium">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
