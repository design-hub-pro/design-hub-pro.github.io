<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Skater Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-blue-50 to-white h-screen overflow-hidden">
    <!-- iOS Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2">
        <div class="flex justify-between items-center text-xs font-semibold">
            <span>9:41</span>
            <div class="flex gap-1 items-center">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-6 pb-24 overflow-y-auto h-full">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
            <p class="text-gray-500 mt-1">How are you feeling today?</p>
        </div>

        <!-- Current Status Card -->
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-6">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-sm text-gray-500 mb-1">Current Status</p>
                    <h2 class="text-2xl font-bold text-green-600">Good</h2>
                </div>
                <div class="bg-green-100 p-3 rounded-full">
                    <i class="fas fa-smile text-green-600 text-xl"></i>
                </div>
            </div>
            <div class="flex gap-3 text-xs">
                <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
                    <p class="text-gray-500">Stress</p>
                    <p class="font-bold text-gray-900 mt-1">Low</p>
                </div>
                <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
                    <p class="text-gray-500">Anxiety</p>
                    <p class="font-bold text-gray-900 mt-1">Mild</p>
                </div>
                <div class="flex-1 bg-gray-50 rounded-xl p-3 text-center">
                    <p class="text-gray-500">Energy</p>
                    <p class="font-bold text-gray-900 mt-1">High</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="mb-6">
            <h3 class="text-lg font-bold text-gray-900 mb-3">Quick Relief</h3>
            <div class="grid grid-cols-2 gap-3">
                <button class="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-2xl p-4 shadow-lg active:scale-95 transition">
                    <i class="fas fa-wind text-2xl mb-2"></i>
                    <p class="font-semibold text-sm">Breathing</p>
                </button>
                <button class="bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-2xl p-4 shadow-lg active:scale-95 transition">
                    <i class="fas fa-spa text-2xl mb-2"></i>
                    <p class="font-semibold text-sm">Meditation</p>
                </button>
                <button class="bg-gradient-to-br from-pink-500 to-pink-600 text-white rounded-2xl p-4 shadow-lg active:scale-95 transition">
                    <i class="fas fa-eye text-2xl mb-2"></i>
                    <p class="font-semibold text-sm">Visualization</p>
                </button>
                <button class="bg-gradient-to-br from-teal-500 to-teal-600 text-white rounded-2xl p-4 shadow-lg active:scale-95 transition">
                    <i class="fas fa-hand-paper text-2xl mb-2"></i>
                    <p class="font-semibold text-sm">Grounding</p>
                </button>
            </div>
        </div>

        <!-- Today's Tip -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-6 text-white">
            <div class="flex items-start gap-3">
                <i class="fas fa-lightbulb text-2xl mt-1"></i>
                <div>
                    <h3 class="font-bold mb-2">Today's Tip</h3>
                    <p class="text-sm opacity-90">Progressive muscle relaxation before competition can reduce physical tension and improve focus on the ice.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 pb-6">
        <div class="flex justify-around items-center">
            <button class="flex flex-col items-center gap-1 text-blue-600">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs font-medium">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-clipboard-list text-xl"></i>
                <span class="text-xs">Check-in</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-dumbbell text-xl"></i>
                <span class="text-xs">Exercises</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Progress</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
