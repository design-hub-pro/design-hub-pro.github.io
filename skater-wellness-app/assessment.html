<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - Skater Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-blue-50 to-white h-screen overflow-hidden">
    <!-- iOS Status Bar -->
    <div class="bg-white px-6 pt-3 pb-2">
        <div class="flex justify-between items-center text-xs font-semibold">
            <span>9:41</span>
            <div class="flex gap-1 items-center">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-6 pb-24 overflow-y-auto h-full">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Mental Check-In</h1>
            <p class="text-gray-500 mt-1">Answer honestly to get personalized support</p>
        </div>

        <!-- Progress -->
        <div class="mb-6">
            <div class="flex justify-between text-xs text-gray-500 mb-2">
                <span>Question 2 of 4</span>
                <span>50%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full" style="width: 50%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-3xl shadow-sm p-6 mb-6">
            <div class="mb-6">
                <h2 class="text-xl font-bold text-gray-900 mb-2">Over the past week, how often have you felt nervous or anxious about your performance?</h2>
                <p class="text-sm text-gray-500">Select the option that best describes your experience</p>
            </div>

            <div class="space-y-3">
                <button class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-transparent hover:border-blue-600 rounded-xl p-4 text-left transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-900">Not at all</p>
                            <p class="text-xs text-gray-500">0 days</p>
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 border-gray-300"></div>
                    </div>
                </button>

                <button class="w-full bg-blue-50 border-2 border-blue-600 rounded-xl p-4 text-left transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-900">Several days</p>
                            <p class="text-xs text-gray-500">1-3 days</p>
                        </div>
                        <div class="w-5 h-5 rounded-full bg-blue-600 border-2 border-blue-600 flex items-center justify-center">
                            <div class="w-2 h-2 bg-white rounded-full"></div>
                        </div>
                    </div>
                </button>

                <button class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-transparent hover:border-blue-600 rounded-xl p-4 text-left transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-900">More than half the days</p>
                            <p class="text-xs text-gray-500">4-5 days</p>
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 border-gray-300"></div>
                    </div>
                </button>

                <button class="w-full bg-gray-50 hover:bg-blue-50 border-2 border-transparent hover:border-blue-600 rounded-xl p-4 text-left transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold text-gray-900">Nearly every day</p>
                            <p class="text-xs text-gray-500">6-7 days</p>
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 border-gray-300"></div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex gap-3">
            <button class="flex-1 bg-gray-100 text-gray-700 font-semibold py-4 rounded-2xl active:scale-95 transition">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </button>
            <button class="flex-1 bg-blue-600 text-white font-semibold py-4 rounded-2xl active:scale-95 transition">
                Next<i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 pb-6">
        <div class="flex justify-around items-center">
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-blue-600">
                <i class="fas fa-clipboard-list text-xl"></i>
                <span class="text-xs font-medium">Check-in</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-dumbbell text-xl"></i>
                <span class="text-xs">Exercises</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Progress</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs">Profile</span>
            </button>
        </div>
    </div>
</body>
</html>
