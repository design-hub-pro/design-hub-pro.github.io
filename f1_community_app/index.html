<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Community App - Design Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #000;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 48px;
            justify-items: center;
            max-width: 1560px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-white">

    <!-- Hero Section -->
    <div class="text-center py-16 px-6">
        <div class="flex items-center justify-center gap-4 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-red-600 to-red-800 rounded-2xl flex items-center justify-center shadow-lg shadow-red-500/30">
                <i class="fas fa-flag-checkered text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">F1 Community</h1>
        <p class="text-lg text-gray-500 max-w-xl mx-auto">Your ultimate Formula 1 companion — live races, team insights, and fan community all in one app.</p>
    </div>

    <!-- Screenshots -->
    <div class="px-8 pb-20">
        <div class="screens-grid">
            <!-- Home -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Home</p>
            </div>

            <!-- Schedule -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="schedule.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Race Calendar</p>
            </div>

            <!-- Teams -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="teams.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Teams & Drivers</p>
            </div>

            <!-- Community -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="community.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Community</p>
            </div>

            <!-- Profile -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Profile</p>
            </div>
        </div>
    </div>

</body>
</html>
