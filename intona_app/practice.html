<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intona — Live Trainer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  *::-webkit-scrollbar{display:none;}
  :root{--bg:#0A0A0F;--tx2:rgba(255,255,255,0.56);--tx3:rgba(255,255,255,0.4);--mint:#2BE8A5;--rose:#FB7185;--amber:#FBBF24;--cy:#22D3EE;--v1:#8B5CF6;}
  html,body{height:100%;}
  body{font-family:'Inter',sans-serif;background:radial-gradient(120% 80% at 50% 0%,#171426 0%,#0A0A0F 60%);color:#fff;position:relative;overflow:hidden;}
  .statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:8px 28px 0;position:relative;z-index:20;}
  .time{font-weight:700;font-size:16px;}
  .island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:124px;height:35px;background:#000;border-radius:20px;}
  .sicons{display:flex;gap:7px;font-size:15px;}
  .pad{padding:0 28px;}
  /* tuner ring */
  .meter{position:relative;width:268px;height:268px;margin:0 auto;}
  .ring-bg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.06);}
  .glow{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(43,232,165,0.22),transparent 68%);filter:blur(6px);}
  .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(43,232,165,0.5);animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(0.82);opacity:.7;}100%{transform:scale(1.08);opacity:0;}}
  .cents-scale{position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;gap:0;}
  /* cents bar */
  .centsbar{position:relative;height:64px;display:flex;align-items:flex-end;justify-content:center;gap:5px;margin-top:6px;}
  .centsbar .t{width:3px;background:rgba(255,255,255,0.16);border-radius:3px;}
  .needle{position:absolute;top:0;width:4px;height:54px;background:var(--mint);border-radius:4px;box-shadow:0 0 14px var(--mint);}
  /* waveform */
  .wave{display:flex;align-items:center;justify-content:center;gap:4px;height:54px;}
  .wave span{width:4px;border-radius:4px;background:linear-gradient(180deg,#22D3EE,#8B5CF6);animation:wv 1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:8px;}50%{height:48px;}}
</style>
</head>
<body>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top bar -->
  <div class="pad" style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
    <div style="width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-xmark" style="font-size:16px;"></i>
    </div>
    <div style="text-align:center;">
      <p style="font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.5px;">PITCH MATCHING · 3 / 5</p>
      <p style="font-size:14px;font-weight:700;margin-top:1px;">Sustain the Target</p>
    </div>
    <div style="width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-gauge-high" style="font-size:15px;"></i>
    </div>
  </div>

  <!-- progress dots -->
  <div class="pad" style="display:flex;gap:6px;margin-top:16px;">
    <span style="flex:1;height:4px;border-radius:4px;background:var(--mint);"></span>
    <span style="flex:1;height:4px;border-radius:4px;background:var(--mint);"></span>
    <span style="flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--mint) 60%,rgba(255,255,255,0.12) 60%);"></span>
    <span style="flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,0.12);"></span>
    <span style="flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,0.12);"></span>
  </div>

  <!-- Target / status -->
  <div style="text-align:center;margin-top:30px;">
    <p style="font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:1px;">TARGET NOTE</p>
  </div>

  <!-- Meter -->
  <div class="meter" style="margin-top:18px;">
    <div class="ring-bg"></div>
    <div class="pulse"></div>
    <div class="glow"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <p style="font-size:74px;font-weight:800;letter-spacing:-3px;line-height:1;">A4</p>
      <p style="font-size:13px;color:var(--tx3);font-weight:500;margin-top:2px;">440 Hz</p>
      <div style="display:flex;align-items:center;gap:7px;margin-top:14px;background:rgba(43,232,165,0.16);border:1px solid rgba(43,232,165,0.35);padding:6px 14px;border-radius:30px;">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);"></span>
        <span style="font-size:13px;font-weight:700;color:var(--mint);">On Pitch</span>
      </div>
    </div>
  </div>

  <!-- Cents accuracy bar -->
  <div class="pad" style="margin-top:26px;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);font-weight:600;margin-bottom:2px;">
      <span>♭ flat</span><span style="color:var(--mint);">+2 cents</span><span>sharp ♯</span>
    </div>
    <div class="centsbar">
      <div class="needle" style="left:53%;"></div>
      <div class="t" style="height:18px;"></div><div class="t" style="height:26px;"></div><div class="t" style="height:18px;"></div>
      <div class="t" style="height:34px;"></div><div class="t" style="height:22px;"></div><div class="t" style="height:44px;"></div>
      <div class="t" style="height:56px;background:rgba(43,232,165,0.5);"></div>
      <div class="t" style="height:44px;"></div><div class="t" style="height:22px;"></div><div class="t" style="height:34px;"></div>
      <div class="t" style="height:18px;"></div><div class="t" style="height:26px;"></div><div class="t" style="height:18px;"></div>
    </div>
  </div>

  <!-- Live waveform from mic -->
  <div class="pad" style="margin-top:22px;">
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;">
      <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#22D3EE);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fas fa-microphone" style="font-size:18px;"></i>
      </div>
      <div class="wave" style="flex:1;">
        <span style="height:14px;animation-delay:0s;"></span><span style="height:34px;animation-delay:.1s;"></span>
        <span style="height:22px;animation-delay:.2s;"></span><span style="height:46px;animation-delay:.3s;"></span>
        <span style="height:30px;animation-delay:.15s;"></span><span style="height:48px;animation-delay:.05s;"></span>
        <span style="height:20px;animation-delay:.25s;"></span><span style="height:40px;animation-delay:.35s;"></span>
        <span style="height:26px;animation-delay:.12s;"></span><span style="height:44px;animation-delay:.22s;"></span>
        <span style="height:16px;animation-delay:.32s;"></span><span style="height:36px;animation-delay:.08s;"></span>
        <span style="height:24px;animation-delay:.18s;"></span>
      </div>
      <div style="text-align:right;">
        <p style="font-size:20px;font-weight:800;color:var(--mint);">2.4s</p>
        <p style="font-size:10px;color:var(--tx3);">held</p>
      </div>
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="pad" style="position:absolute;bottom:40px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;">
    <div style="width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-volume-high" style="font-size:18px;color:var(--tx2);"></i>
    </div>
    <div style="width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#22D3EE);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(139,92,246,0.5);">
      <i class="fas fa-pause" style="font-size:26px;"></i>
    </div>
    <div style="width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-forward-step" style="font-size:18px;color:var(--tx2);"></i>
    </div>
  </div>
</body>
</html>
