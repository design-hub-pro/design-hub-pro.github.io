<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlopeSense - Game Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        .screenshot-frame { border-radius: 16px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .screenshot-frame:hover { transform: translateY(-4px); box-shadow: 0 35px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08); }
        .screenshot-frame img { width: 100%; height: auto; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-5xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-sky-400 to-orange-400 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-person-skiing text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">SlopeSense</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A ski-safety game for computer and iPad where first-time kids learn every slope rule by playing.</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Kids</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Safety</span>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">iPad</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Desktop</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468504252-image-1.png" alt="SlopeSense - "></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468502229-image-1.png" alt="SlopeSense - Title Screen"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468520681-image-1.png" alt="SlopeSense - Core Gameplay"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468503176-image-1.png" alt="SlopeSense - Level Map"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468503129-image-1.png" alt="SlopeSense - Icy Patch Warning"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468509724-image-1.png" alt="SlopeSense - Instructor Moment"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468503299-image-1.png" alt="SlopeSense - Ski Rules Badges"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468502937-image-1.png" alt="SlopeSense - Pizza Stop"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468503008-image-1.png" alt="SlopeSense - Look Uphill Merge"></div>
            <div class="screenshot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793468520808-image-1.png" alt="SlopeSense - Trail Sign Quiz"></div>
        </div>
    </div>
</body>
</html>
