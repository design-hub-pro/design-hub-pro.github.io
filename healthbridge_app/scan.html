<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>HealthBridge · Scan</title></head><body>
<div class="screen bg-black">
  <img src="assets/report.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/35"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="absolute top-[70px] left-[28px] right-[28px] flex items-center justify-between text-white">
    <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <span class="chip bg-black/40 backdrop-blur text-white"><i class="fa-solid fa-bolt text-amber-300"></i>Auto</span>
    <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fa-regular fa-images"></i></div>
  </div>
  <!-- frame -->
  <div class="absolute left-[46px] right-[46px] top-[190px] h-[470px] rounded-[26px]" style="box-shadow:0 0 0 2000px rgba(0,0,0,.35)">
    <div class="absolute -top-0.5 -left-0.5 w-12 h-12 border-t-[5px] border-l-[5px] border-teal-300 rounded-tl-[26px]"></div>
    <div class="absolute -top-0.5 -right-0.5 w-12 h-12 border-t-[5px] border-r-[5px] border-teal-300 rounded-tr-[26px]"></div>
    <div class="absolute -bottom-0.5 -left-0.5 w-12 h-12 border-b-[5px] border-l-[5px] border-teal-300 rounded-bl-[26px]"></div>
    <div class="absolute -bottom-0.5 -right-0.5 w-12 h-12 border-b-[5px] border-r-[5px] border-teal-300 rounded-br-[26px]"></div>
    <div class="absolute left-4 right-4 top-[46%] h-[3px] rounded-full bg-teal-300" style="box-shadow:0 0 24px 6px rgba(94,234,212,.7)"></div>
    <span class="absolute top-[22%] left-[14%] chip bg-white/90 text-[#13201F]"><span class="dot bg-amber-500"></span>LDL 162</span>
    <span class="absolute top-[58%] right-[10%] chip bg-white/90 text-[#13201F]"><span class="dot bg-amber-500"></span>A1C 6.1%</span>
    <span class="absolute top-[74%] left-[18%] chip bg-white/90 text-[#13201F]"><span class="dot bg-emerald-500"></span>TSH normal</span>
  </div>
  <div class="absolute top-[680px] left-0 right-0 text-center text-white">
    <p class="font-bold text-[17px]">Lab report found</p>
    <p class="zh text-[14px] text-white/70 mt-0.5">正在识别 24 项指标…</p>
    <div class="mx-auto mt-3 w-[200px] bar bg-white/20"><span class="grad-teal" style="width:68%"></span></div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 pb-12 pt-6">
    <div class="flex justify-center gap-2 text-[13px] font-semibold text-white/60 mb-6">
      <span class="px-3 py-1.5">Prescription</span><span class="px-3 py-1.5 rounded-full bg-white text-[#13201F]">Lab report</span><span class="px-3 py-1.5">Letter</span><span class="px-3 py-1.5">Bill</span>
    </div>
    <div class="flex items-center justify-around px-12">
      <div class="w-12 h-12 rounded-xl overflow-hidden ring-2 ring-white/60"><img src="assets/meds.jpg" class="w-full h-full object-cover"></div>
      <div class="w-[78px] h-[78px] rounded-full border-[4px] border-white flex items-center justify-center"><div class="w-[62px] h-[62px] rounded-full bg-white"></div></div>
      <div class="w-12 h-12 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-file-arrow-up"></i></div>
    </div>
  </div>
</div></body></html>
