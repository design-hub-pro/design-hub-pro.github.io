<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>HealthBridge · Welcome</title></head><body>
<div class="screen bg-[#0B2E2C]">
  <img src="assets/hero.jpg" class="absolute inset-0 w-full h-[640px] object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,46,44,.25) 0%,rgba(11,46,44,0) 25%,rgba(11,46,44,.85) 55%,#0B2E2C 70%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="absolute top-[78px] left-[28px] flex items-center gap-2 text-white">
    <div class="w-9 h-9 rounded-xl grad-teal flex items-center justify-center"><i class="fa-solid fa-bridge text-[15px]"></i></div>
    <span class="font-display font-extrabold text-[19px]">HealthBridge</span>
  </div>
  <div class="absolute top-[300px] right-[28px] card px-3.5 py-2.5 flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-full grad-ok flex items-center justify-center text-white text-[13px]"><i class="fa-solid fa-shield-heart"></i></div>
    <div><p class="text-[12px] font-bold leading-tight">Doctor verified</p><p class="text-[11px] text-gray-500 zh">医生已审核</p></div>
  </div>
  <div class="absolute bottom-0 left-0 right-0 px-c pb-12 text-white">
    <p class="zh text-[17px] text-teal-200 font-medium">用您的语言，看懂健康</p>
    <h1 class="font-display font-extrabold text-[40px] leading-[1.08] mt-2">Understand every<br>word your doctor says.</h1>
    <p class="text-[15px] text-white/70 mt-3 leading-relaxed">Scan, translate and ask. A licensed doctor checks the answers that matter.</p>
    <p class="text-[12px] font-semibold uppercase tracking-wider text-white/50 mt-7">I speak</p>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <div class="rounded-2xl bg-white text-[#13201F] p-4 flex items-center justify-between"><div><p class="zh font-bold text-[18px]">普通话</p><p class="text-[12px] text-gray-500">Mandarin · 简体</p></div><i class="fa-solid fa-circle-check text-teal-600 text-[20px]"></i></div>
      <div class="rounded-2xl bg-white/10 border border-white/15 p-4 flex items-center justify-between"><div><p class="zh font-bold text-[18px]">普通话</p><p class="text-[12px] text-white/60">Mandarin · 繁體</p></div><i class="fa-regular fa-circle text-white/40 text-[20px]"></i></div>
    </div>
    <button class="mt-5 w-full h-[58px] rounded-2xl grad-teal font-bold text-[17px] flex items-center justify-center gap-2 shadow-lg">Get started <span class="zh font-medium text-white/80">开始</span><i class="fa-solid fa-arrow-right ml-1"></i></button>
    <div class="mt-5 flex items-center justify-center gap-5 text-[12px] text-white/55">
      <span><i class="fa-solid fa-lock mr-1.5"></i>HIPAA-ready</span><span><i class="fa-solid fa-user-doctor mr-1.5"></i>Licensed US doctors</span>
    </div>
  </div>
</div></body></html>
