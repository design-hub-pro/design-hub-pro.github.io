<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Center</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div><p class="text-[14px] text-gray-500"><i class="fa-solid fa-location-dot text-[#1E7A4C] mr-1"></i>Oak Grove Senior Center</p><h1 class="font-display font-extrabold text-[30px] leading-tight">Putt Club</h1></div>
    <div class="w-11 h-11 rounded-full bg-white card flex items-center justify-center relative"><i class="fa-regular fa-bell"></i><span class="absolute top-2.5 right-3 w-2 h-2 rounded-full bg-[#E0502F]"></span></div>
  </div>

  <!-- Group hero -->
  <div class="mx-[28px] mt-5 rounded-[28px] overflow-hidden relative h-[230px]">
    <img src="assets/group.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
    <span class="absolute top-4 left-4 chip bg-red-500 text-white"><span class="dot bg-white"></span>Live now</span>
    <div class="absolute bottom-4 left-5 right-5 flex items-end justify-between text-white">
      <div><p class="font-display font-extrabold text-[21px]">Thursday group · Room B</p>
        <div class="flex items-center gap-2 mt-2"><div class="avs flex"><img src="assets/av1.jpg"><img src="assets/av2.jpg"><img src="assets/hero.jpg" style="object-position:58% 18%"><img src="assets/av3.jpg"></div><span class="text-[13px] text-white/80">+5 here</span></div>
      </div>
      <a class="chip bg-white text-[#14231B] text-[14px] px-4 py-2.5">Join</a>
    </div>
  </div>

  <!-- Group goal -->
  <div class="mx-[28px] mt-4 card p-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl g-green text-white flex items-center justify-center"><i class="fa-solid fa-flag"></i></div><div><p class="font-bold text-[16px]">Team goal</p><p class="text-[13px] text-gray-500">1,000 steady putts by Dec 1</p></div></div>
      <p class="font-display font-extrabold text-[26px]">72%</p>
    </div>
    <div class="bar mt-3 h-[10px]"><span class="g-green" style="width:72%"></span></div>
  </div>

  <!-- Steady streak board -->
  <div class="px-c mt-6 flex items-end justify-between"><h2 class="font-display font-bold text-[20px]">Steadiest this week</h2><span class="text-[13px] text-gray-400">by balance</span></div>
  <div class="px-c mt-3 space-y-2.5">
    <div class="card p-3.5 flex items-center gap-3">
      <span class="w-7 h-7 rounded-full g-amber text-white text-[13px] font-bold flex items-center justify-center">1</span>
      <img src="assets/av1.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><p class="font-bold text-[15.5px]">Rosa M.</p><div class="flex gap-1 mt-1"><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span></div></div>
      <p class="font-display font-extrabold text-[22px]">94</p>
    </div>
    <div class="card p-3.5 flex items-center gap-3 ring-2 ring-[#1E7A4C]/40">
      <span class="w-7 h-7 rounded-full bg-[#ECE7DE] text-[13px] font-bold flex items-center justify-center">2</span>
      <img src="assets/hero.jpg" class="w-11 h-11 rounded-full object-cover" style="object-position:58% 18%">
      <div class="flex-1"><p class="font-bold text-[15.5px]">You</p><div class="flex gap-1 mt-1"><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span><span class="dot bg-amber-400"></span><span class="dot bg-emerald-500"></span><span class="dot bg-emerald-500"></span></div></div>
      <p class="font-display font-extrabold text-[22px]">88</p>
    </div>
    <div class="card p-3.5 flex items-center gap-3">
      <span class="w-7 h-7 rounded-full bg-[#ECE7DE] text-[13px] font-bold flex items-center justify-center">3</span>
      <img src="assets/av2.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><p class="font-bold text-[15.5px]">Henry C.</p><div class="flex gap-1 mt-1"><span class="dot bg-emerald-500"></span><span class="dot bg-amber-400"></span><span class="dot bg-emerald-500"></span><span class="dot bg-amber-400"></span><span class="dot bg-emerald-500"></span></div></div>
      <p class="font-display font-extrabold text-[22px]">83</p>
    </div>
  </div>

  <!-- Volunteers -->
  <div class="mx-[28px] mt-4 rounded-[22px] p-4 flex items-center gap-3" style="background:#FFF1EA">
    <div class="avs flex"><img src="assets/av4.jpg"><img src="assets/av3.jpg"></div>
    <div class="flex-1"><p class="font-bold text-[15px]">2 volunteers filming today</p><p class="text-[12.5px] text-gray-500">Daniel, Amy</p></div>
    <i class="fa-solid fa-video text-[#E0502F]"></i>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-chart-line"></i>Progress</div>
<div class="tab play"><div class="fab"><i class="fa-solid fa-golf-ball-tee"></i></div></div>
<div class="tab"><i class="fa-solid fa-film"></i>Clips</div>
<div class="tab on"><i class="fa-solid fa-people-group"></i>Center</div>
</nav>
</div></body></html>
