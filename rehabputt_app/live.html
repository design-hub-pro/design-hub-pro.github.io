<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Live tracking</title></head><body>
<div class="screen bg-black">
  <img src="assets/live.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)"></div>

  <!-- Pose skeleton (viewBox matches 436x956 screen) -->
  <svg class="absolute inset-0 w-full h-full" viewBox="0 0 436 956" preserveAspectRatio="xMidYMid slice">
    <g stroke-linecap="round" fill="none">
      <path d="M122 191 L323 206" stroke="#5AB4FF" stroke-width="4"/>
      <path d="M122 191 L151 401 L208 478 M323 206 L304 401 L208 478" stroke="#5AB4FF" stroke-width="4"/>
      <path d="M122 191 L161 488 M323 206 L314 488 M161 488 L314 488" stroke="#fff" stroke-width="2.5" opacity=".7"/>
      <path d="M161 488 L170 669 L165 841 M314 488 L294 669 L304 841" stroke="#fff" stroke-width="2.5" opacity=".7"/>
      <!-- center of mass plumb line -->
      <path d="M237 230 L237 870" stroke="#34D399" stroke-width="2" stroke-dasharray="6 7"/>
      <!-- elbow arcs -->
      <path d="M140 380 A 26 26 0 0 0 170 420" stroke="#FFC24A" stroke-width="3"/>
      <path d="M318 380 A 26 26 0 0 1 288 420" stroke="#FFC24A" stroke-width="3"/>
      <!-- swing arc ghost -->
      <path d="M95 790 Q 237 850 380 790" stroke="#fff" stroke-width="2" stroke-dasharray="3 8" opacity=".8"/>
    </g>
    <g fill="#fff" stroke="#2B6FD6" stroke-width="3">
      <circle cx="122" cy="191" r="8"/><circle cx="323" cy="206" r="8"/>
      <circle cx="151" cy="401" r="7" stroke="#EE8A12"/><circle cx="304" cy="401" r="7" stroke="#EE8A12"/>
      <circle cx="208" cy="478" r="7"/>
      <circle cx="161" cy="488" r="6" stroke="#22955E"/><circle cx="314" cy="488" r="6" stroke="#22955E"/>
      <circle cx="170" cy="669" r="5" stroke="#22955E"/><circle cx="294" cy="669" r="5" stroke="#22955E"/>
      <circle cx="165" cy="841" r="5" stroke="#22955E"/><circle cx="304" cy="841" r="5" stroke="#22955E"/>
    </g>
    <circle cx="237" cy="500" r="11" fill="#34D399" stroke="#fff" stroke-width="3"/>
  </svg>

  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>

  <!-- top HUD -->
  <div class="absolute top-[68px] left-[28px] right-[28px] flex items-center justify-between text-white">
    <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-pause"></i></div>
    <div class="glass rounded-full px-4 py-2.5 flex items-center gap-2.5">
      <span class="dot bg-red-500"></span><span class="text-[14px] font-semibold">Putt 4 of 12</span>
    </div>
    <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-volume-high"></i></div>
  </div>

  <!-- angle tags -->
  <div class="absolute left-[18px] top-[236px] glass rounded-xl px-2.5 py-1.5 text-white text-[12px] font-semibold"><i class="fa-solid fa-arrows-left-right text-sky-300 mr-1"></i>Shoulder 18°</div>
  <div class="absolute right-[18px] top-[372px] glass rounded-xl px-2.5 py-1.5 text-white text-[12px] font-semibold"><i class="fa-solid fa-angle-left text-amber-300 mr-1"></i>Elbow 158°</div>

  <!-- Coaching cue -->
  <div class="absolute left-[28px] right-[28px] top-[560px] flex justify-center">
    <div class="rounded-[22px] px-5 py-3.5 flex items-center gap-3 text-white shadow-2xl" style="background:linear-gradient(135deg,#7A5CF0,#5B3FD1)">
      <i class="fa-solid fa-hand text-[20px]"></i>
      <div><p class="font-display font-extrabold text-[22px] leading-none">Steadier finish</p><p class="text-[12.5px] text-white/80 mt-1">Hold the end for 2 seconds</p></div>
    </div>
  </div>

  <!-- bottom sheet -->
  <div class="absolute left-[16px] right-[16px] bottom-[28px] rounded-[30px] bg-white/95 p-5">
    <div class="flex items-center justify-between">
      <p class="text-[13px] font-semibold text-gray-500 uppercase tracking-wide">Weight shift</p>
      <span class="chip bg-emerald-50 text-emerald-700 py-1"><span class="dot bg-emerald-500"></span>Safe zone</span>
    </div>
    <div class="relative mt-3 h-[34px]">
      <div class="absolute inset-y-[12px] left-0 right-0 rounded-full" style="background:linear-gradient(90deg,#FFB4A3,#FFE3A3 22%,#BFE9CF 38%,#BFE9CF 62%,#FFE3A3 78%,#FFB4A3)"></div>
      <div class="absolute top-0 left-1/2 w-px h-full bg-gray-400"></div>
      <div class="absolute top-[3px] w-7 h-7 rounded-full bg-[#1E7A4C] border-4 border-white shadow" style="left:calc(54% - 14px)"></div>
    </div>
    <div class="flex justify-between text-[11.5px] text-gray-400 mt-1"><span>Left foot</span><span>Right foot</span></div>
    <div class="mt-4 grid grid-cols-3 gap-2.5 text-center">
      <div class="rounded-2xl bg-[#F3F7F4] py-2.5"><p class="font-display font-extrabold text-[24px] leading-none">1.2<span class="text-[13px]">cm</span></p><p class="text-[11.5px] text-gray-500 mt-1">Sway</p></div>
      <div class="rounded-2xl bg-[#F3F7F4] py-2.5"><p class="font-display font-extrabold text-[24px] leading-none">1:2</p><p class="text-[11.5px] text-gray-500 mt-1">Back : through</p></div>
      <div class="rounded-2xl bg-[#F3F7F4] py-2.5 flex flex-col items-center justify-center">
        <div class="flex gap-1.5"><span class="dot bg-amber-500"></span><span class="dot bg-amber-500"></span><span class="dot bg-amber-500"></span><span class="dot bg-amber-200"></span></div>
        <p class="text-[11.5px] text-gray-500 mt-2">Tempo beat</p>
      </div>
    </div>
  </div>
</div>
</body></html>
