<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Compare clips</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:40px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <p class="font-display font-bold text-[18px]">Walter · Stable vs wobbly</p>
    <div class="w-11 h-11 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-share-nodes"></i></div>
  </div>

  <!-- Side-by-side -->
  <div class="px-c mt-5 grid grid-cols-2 gap-3">
    <div class="relative h-[300px] rounded-[24px] overflow-hidden ring-4 ring-emerald-400">
      <img src="assets/clip2.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:40% 40%">
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 to-transparent"></div>
      <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 184 300" preserveAspectRatio="none"><path d="M96 70 L96 270" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="96" cy="150" r="7" fill="#34D399" stroke="#fff" stroke-width="2"/></svg>
      <span class="absolute top-3 left-3 chip bg-emerald-500 text-white py-1"><span class="dot bg-white"></span>Stable</span>
      <div class="absolute bottom-3 left-3 text-white"><p class="font-display font-extrabold text-[28px] leading-none">0.8<span class="text-[13px]">cm</span></p><p class="text-[11px] text-white/70">Putt 9 · sway</p></div>
    </div>
    <div class="relative h-[300px] rounded-[24px] overflow-hidden ring-4 ring-amber-400">
      <img src="assets/live.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 40%">
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 to-transparent"></div>
      <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 184 300" preserveAspectRatio="none"><path d="M92 70 L92 270" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 5" opacity=".6"/><path d="M92 70 L72 270" stroke="#FFC24A" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="80" cy="150" r="7" fill="#FFC24A" stroke="#fff" stroke-width="2"/></svg>
      <span class="absolute top-3 left-3 chip bg-amber-400 text-[#4A2E0A] py-1"><span class="dot bg-white"></span>Wobbly</span>
      <div class="absolute bottom-3 left-3 text-white"><p class="font-display font-extrabold text-[28px] leading-none">3.1<span class="text-[13px]">cm</span></p><p class="text-[11px] text-white/70">Putt 2 · sway</p></div>
    </div>
  </div>

  <!-- scrubber -->
  <div class="px-c mt-4 flex items-center gap-3">
    <div class="w-11 h-11 rounded-full bg-[#14231B] text-white flex items-center justify-center"><i class="fa-solid fa-play ml-0.5"></i></div>
    <div class="flex-1 relative h-2 rounded-full bg-[#E2DCD0]"><div class="absolute inset-y-0 left-0 w-[58%] rounded-full bg-[#14231B]"></div><div class="absolute -top-1.5 w-5 h-5 rounded-full bg-white border-2 border-[#14231B]" style="left:calc(58% - 10px)"></div></div>
    <span class="text-[13px] font-semibold text-gray-500">0.5×</span>
  </div>

  <!-- Center of mass chart -->
  <div class="mx-[28px] mt-5 card p-4">
    <div class="flex items-center justify-between"><p class="font-bold text-[16px]">Weight shift over the stroke</p></div>
    <div class="flex gap-4 mt-1 text-[12px] text-gray-500"><span><span class="dot bg-emerald-500 mr-1"></span>Stable</span><span><span class="dot bg-amber-400 mr-1"></span>Wobbly</span></div>
    <svg class="mt-3" width="332" height="120" viewBox="0 0 332 120">
      <rect x="0" y="40" width="332" height="40" rx="8" fill="#E7F4EC"/>
      <path d="M0 60 H332" stroke="#9CC9AE" stroke-dasharray="4 5"/>
      <path d="M0 60 C 40 58, 70 63, 110 57 S 170 64, 210 59 S 280 61, 332 60" stroke="#22955E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M0 60 C 40 52, 70 72, 110 66 S 160 34, 200 22 S 260 92, 290 98 S 320 70, 332 74" stroke="#F0A019" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="200" cy="22" r="6" fill="#fff" stroke="#F0A019" stroke-width="3"/>
    </svg>
    <div class="flex justify-between text-[11px] text-gray-400 mt-1"><span>Back</span><span>Impact</span><span>Finish</span></div>
  </div>

  <!-- differences -->
  <div class="px-c mt-4 grid grid-cols-3 gap-2.5">
    <div class="card p-3 text-center"><i class="fa-solid fa-shoe-prints text-amber-500"></i><p class="font-display font-extrabold text-[22px] mt-1">+9cm</p><p class="text-[11px] text-gray-500">Wider step</p></div>
    <div class="card p-3 text-center"><i class="fa-solid fa-gauge-high text-amber-500"></i><p class="font-display font-extrabold text-[22px] mt-1">1.6×</p><p class="text-[11px] text-gray-500">Faster through</p></div>
    <div class="card p-3 text-center"><i class="fa-solid fa-hand text-amber-500"></i><p class="font-display font-extrabold text-[22px] mt-1">0.4s</p><p class="text-[11px] text-gray-500">Finish hold</p></div>
  </div>

  <div class="mx-[28px] mt-4 rounded-[22px] p-4 flex items-center gap-3" style="background:#EFEAFE">
    <img src="assets/av2.jpg" class="w-11 h-11 rounded-full object-cover">
    <p class="flex-1 text-[14px] text-[#3B2A87] font-medium">Send to Coach Lin with a note</p>
    <i class="fa-solid fa-paper-plane text-[#6143D6]"></i>
  </div>
</div></div>
</body></html>
