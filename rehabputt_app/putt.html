<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Putt result</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:40px">
  <!-- Virtual green -->
  <div class="relative h-[420px] overflow-hidden" style="background:radial-gradient(120% 80% at 50% 30%,#6CC48A 0%,#2E8B57 55%,#1C5E3A 100%)">
    <svg class="absolute inset-0" width="436" height="420" viewBox="0 0 436 420">
      <g stroke="#fff" opacity=".08" stroke-width="22"><path d="M-20 120 L460 40"/><path d="M-20 200 L460 120"/><path d="M-20 280 L460 200"/><path d="M-20 360 L460 280"/><path d="M-20 440 L460 360"/></g>
      <ellipse cx="218" cy="236" rx="190" ry="130" fill="#fff" opacity=".06"/>
      <!-- ball path -->
      <path d="M150 390 C 170 320, 250 270, 268 170" stroke="#fff" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
      <circle cx="150" cy="390" r="5" fill="#fff" opacity=".5"/>
      <!-- hole -->
      <ellipse cx="270" cy="166" rx="17" ry="11" fill="#0B2216"/>
      <ellipse cx="270" cy="162" rx="9" ry="6" fill="#fff"/>
      <rect x="269" y="78" width="3" height="88" fill="#fff"/>
      <path d="M272 78 l30 10 -30 10z" fill="#FF8A6B"/>
      <!-- rings -->
      <ellipse cx="270" cy="166" rx="44" ry="28" fill="none" stroke="#FFE08A" stroke-width="2" opacity=".8"/>
      <ellipse cx="270" cy="166" rx="74" ry="48" fill="none" stroke="#FFE08A" stroke-width="1.5" opacity=".45"/>
    </svg>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="absolute top-[68px] left-[28px] right-[28px] flex justify-between text-white">
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
      <span class="glass rounded-full px-4 py-2.5 text-[14px] font-semibold">Hole 4 · Lakeside</span>
    </div>
    <div class="absolute left-[28px] bottom-[34px] text-white">
      <span class="chip bg-[#FFE08A] text-[#5A3E00]"><i class="fa-solid fa-star"></i>In the cup</span>
      <p class="font-display font-extrabold text-[38px] leading-none mt-3">Smooth stroke!</p>
    </div>
  </div>

  <!-- Movement score sheet -->
  <div class="relative -mt-6 rounded-t-[32px] bg-[#F7F4EE] pt-6">
    <div class="px-c flex items-center gap-5">
      <div class="relative w-[104px] h-[104px]">
        <svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="#E2DCD0" stroke-width="10"/><circle cx="52" cy="52" r="44" fill="none" stroke="url(#gr)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="39" transform="rotate(-90 52 52)"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#34B37A"/><stop offset="1" stop-color="#16603B"/></linearGradient></defs></svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center"><p class="font-display font-extrabold text-[34px] leading-none">86</p><p class="text-[11px] text-gray-500">Movement</p></div>
      </div>
      <div class="flex-1">
        <p class="text-[13px] font-semibold text-emerald-700"><i class="fa-solid fa-arrow-trend-up mr-1"></i>+6 vs. last putt</p>
        <p class="font-display font-bold text-[19px] leading-snug mt-1">Balance stayed in the safe zone the whole time.</p>
      </div>
    </div>

    <div class="px-c mt-5 space-y-3.5">
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl g-green text-white flex items-center justify-center"><i class="fa-solid fa-person-walking text-[14px]"></i></div><span class="w-[70px] text-[14px] font-semibold">Balance</span><div class="bar flex-1"><span class="g-green" style="width:91%"></span></div><span class="w-8 text-right font-bold text-[15px]">91</span></div>
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl g-sky text-white flex items-center justify-center"><i class="fa-solid fa-arrows-left-right text-[14px]"></i></div><span class="w-[70px] text-[14px] font-semibold">Range</span><div class="bar flex-1"><span class="g-sky" style="width:78%"></span></div><span class="w-8 text-right font-bold text-[15px]">78</span></div>
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl g-amber text-white flex items-center justify-center"><i class="fa-solid fa-wave-square text-[14px]"></i></div><span class="w-[70px] text-[14px] font-semibold">Tempo</span><div class="bar flex-1"><span class="g-amber" style="width:94%"></span></div><span class="w-8 text-right font-bold text-[15px]">94</span></div>
      <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl g-violet text-white flex items-center justify-center"><i class="fa-solid fa-hand text-[14px]"></i></div><span class="w-[70px] text-[14px] font-semibold">Finish</span><div class="bar flex-1"><span class="g-violet" style="width:72%"></span></div><span class="w-8 text-right font-bold text-[15px]">72</span></div>
    </div>

    <div class="mx-[28px] mt-5 card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center"><i class="fa-solid fa-shoe-prints text-[18px]"></i></div>
      <div class="flex-1"><p class="font-bold text-[16px]">Next: smaller step</p><p class="text-[13px] text-gray-500">Feet a little closer, about shoulder width</p></div>
    </div>

    <div class="px-c mt-5 flex gap-3">
      <a class="btn flex-1 bg-white card text-[#14231B] text-[16px]"><i class="fa-solid fa-chair"></i>Rest</a>
      <a class="btn flex-[1.6] text-white text-[16px]" style="background:linear-gradient(135deg,#2FA36B,#16603B)">Next putt<i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>
</div></div>
</body></html>
