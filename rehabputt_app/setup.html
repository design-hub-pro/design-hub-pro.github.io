<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Safety check</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:40px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <div class="flex gap-1.5"><span class="h-1.5 w-8 rounded-full bg-[#1E7A4C]"></span><span class="h-1.5 w-8 rounded-full bg-[#1E7A4C]"></span><span class="h-1.5 w-8 rounded-full bg-[#DCD5C8]"></span></div>
    <div class="w-11"></div>
  </div>
  <h1 class="px-c mt-5 font-display font-extrabold text-[30px] leading-tight">Safety check</h1>
  <p class="px-c text-[16px] text-gray-500 mt-1">Four things before your first putt.</p>

  <!-- Placement diagram -->
  <div class="mx-[28px] mt-5 rounded-[28px] overflow-hidden relative h-[236px]" style="background:linear-gradient(180deg,#EAF5EE,#D6ECDD)">
    <svg width="380" height="236" viewBox="0 0 380 236" class="absolute inset-0 m-auto">
      <ellipse cx="190" cy="196" rx="170" ry="22" fill="#BFE0CB"/>
      <!-- mat -->
      <path d="M210 186 L340 186 L322 206 L192 206 Z" fill="#2E8B57"/>
      <circle cx="306" cy="196" r="4" fill="#fff"/>
      <!-- person -->
      <circle cx="252" cy="70" r="13" fill="#14231B"/>
      <path d="M252 84 L252 140" stroke="#14231B" stroke-width="9" stroke-linecap="round"/>
      <path d="M252 96 L240 130 M252 96 L262 130" stroke="#14231B" stroke-width="6" stroke-linecap="round"/>
      <path d="M252 140 L240 190 M252 140 L266 190" stroke="#14231B" stroke-width="7" stroke-linecap="round"/>
      <path d="M250 130 L276 188" stroke="#2B6FD6" stroke-width="5" stroke-linecap="round"/>
      <!-- chair -->
      <path d="M300 112 L300 190 M300 150 L336 150 L336 190 M336 150 L336 112" stroke="#B07A3E" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- tripod phone -->
      <rect x="44" y="92" width="22" height="38" rx="5" fill="#14231B"/><circle cx="55" cy="100" r="3" fill="#5AB4FF"/>
      <path d="M55 130 L40 192 M55 130 L70 192 M55 130 L55 192" stroke="#6B7A71" stroke-width="3" stroke-linecap="round"/>
      <!-- field of view -->
      <path d="M66 104 L230 40 L230 200 Z" fill="#2B6FD6" opacity=".09"/>
      <!-- distance -->
      <path d="M60 218 L246 218" stroke="#16603B" stroke-width="2" stroke-dasharray="5 5"/>
      <rect x="120" y="207" width="66" height="22" rx="11" fill="#16603B"/><text x="153" y="222" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#fff">2 m</text>
    </svg>
    <span class="absolute top-4 left-4 chip bg-white text-[#16603B]"><i class="fa-solid fa-mobile-screen"></i>Phone at waist height</span>
  </div>

  <div class="px-c mt-5 space-y-3">
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl g-amber flex items-center justify-center text-white"><i class="fa-solid fa-chair text-[18px]"></i></div>
      <div class="flex-1"><p class="font-bold text-[16px]">Chair within reach</p><p class="text-[13px] text-gray-500">On your non-putting side</p></div>
      <div class="w-8 h-8 rounded-full bg-[#1E7A4C] text-white flex items-center justify-center"><i class="fa-solid fa-check text-[14px]"></i></div>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl g-sky flex items-center justify-center text-white"><i class="fa-solid fa-broom text-[18px]"></i></div>
      <div class="flex-1"><p class="font-bold text-[16px]">Clear, dry floor</p><p class="text-[13px] text-gray-500">No rugs or cords</p></div>
      <div class="w-8 h-8 rounded-full bg-[#1E7A4C] text-white flex items-center justify-center"><i class="fa-solid fa-check text-[14px]"></i></div>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl g-violet flex items-center justify-center text-white"><i class="fa-solid fa-shoe-prints text-[18px]"></i></div>
      <div class="flex-1"><p class="font-bold text-[16px]">Flat shoes on</p><p class="text-[13px] text-gray-500">Non-slip soles</p></div>
      <div class="w-8 h-8 rounded-full bg-[#1E7A4C] text-white flex items-center justify-center"><i class="fa-solid fa-check text-[14px]"></i></div>
    </div>
    <div class="card p-4 flex items-center gap-4 ring-2 ring-[#1E7A4C]/30">
      <div class="w-12 h-12 rounded-2xl g-green flex items-center justify-center text-white"><i class="fa-solid fa-person text-[18px]"></i></div>
      <div class="flex-1"><p class="font-bold text-[16px]">Full body in view</p><p class="text-[13px] text-gray-500">Stand still · head to feet</p></div>
      <div class="relative w-10 h-10">
        <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#E7F4EC" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#1E7A4C" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="40" transform="rotate(-90 20 20)"/></svg>
        <span class="absolute inset-0 flex items-center justify-center text-[12px] font-bold">3s</span>
      </div>
    </div>
  </div>

  <a class="btn mx-[28px] mt-6 text-white" style="background:linear-gradient(135deg,#2FA36B,#16603B)">I'm ready<i class="fa-solid fa-arrow-right"></i></a>
</div></div>
</body></html>
