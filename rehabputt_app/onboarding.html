<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>RehabPutt · Welcome</title></head><body>
<div class="screen bg-black">
  <img src="assets/hero.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:58% 50%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 42%,rgba(8,30,19,.85) 68%,#0B2216 100%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c mt-3 flex items-center gap-2 text-white relative">
    <div class="w-9 h-9 rounded-xl g-green flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-[15px]"></i></div>
    <span class="font-display font-extrabold text-[20px]">RehabPutt</span>
  </div>

  <!-- floating live chips over photo -->
  <div class="absolute left-[28px] top-[200px] glass text-white rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5">
    <span class="dot bg-emerald-400"></span><span class="text-[13px] font-semibold">Balance steady</span>
  </div>
  <div class="absolute right-[28px] top-[300px] glass text-white rounded-2xl px-3.5 py-2.5 text-center">
    <p class="font-display font-extrabold text-[26px] leading-none">92</p><p class="text-[11px] text-white/75 mt-1">Tempo</p>
  </div>

  <div class="absolute left-0 right-0 bottom-0 px-c pb-12 text-white">
    <div class="flex gap-1.5 mb-6"><span class="h-1.5 w-8 rounded-full bg-white"></span><span class="h-1.5 w-1.5 rounded-full bg-white/40"></span><span class="h-1.5 w-1.5 rounded-full bg-white/40"></span></div>
    <h1 class="font-display font-extrabold text-[40px] leading-[1.05]">Gentle putts.<br>Steadier balance.</h1>
    <p class="text-[17px] text-white/80 mt-4 leading-relaxed">Your phone camera watches your shoulders, elbows and weight shift. Every smooth stroke becomes a putt.</p>
    <div class="grid grid-cols-3 gap-3 mt-7">
      <div class="rounded-2xl bg-white/10 py-3 text-center"><i class="fa-solid fa-person-walking text-emerald-300 text-[18px]"></i><p class="text-[12px] mt-1.5 font-semibold">Balance</p></div>
      <div class="rounded-2xl bg-white/10 py-3 text-center"><i class="fa-solid fa-arrows-left-right text-sky-300 text-[18px]"></i><p class="text-[12px] mt-1.5 font-semibold">Range</p></div>
      <div class="rounded-2xl bg-white/10 py-3 text-center"><i class="fa-solid fa-wave-square text-amber-300 text-[18px]"></i><p class="text-[12px] mt-1.5 font-semibold">Tempo</p></div>
    </div>
    <a class="btn mt-7 bg-white text-[#14231B]">Start my first session<i class="fa-solid fa-arrow-right"></i></a>
    <p class="text-center text-[14px] text-white/70 mt-4">I'm a family volunteer <span class="text-white font-semibold underline underline-offset-4">Join a player</span></p>
  </div>
</div>
</body></html>
