<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #1A1A2E 0%, #16213E 50%, #0F0F23 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 50px rgba(139, 92, 246, 0.7); }
        }
        .pet-container { animation: float 4s ease-in-out infinite; }
        .glow-ring { animation: pulse-glow 3s ease-in-out infinite; }
        .streak-badge {
            background: linear-gradient(135deg, #F59E0B 0%, #EF4444 100%);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-6 pt-3 pb-2 text-sm font-semibold">
        <span>9:41</span>
        <div class="w-28 h-8 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-5 pb-24">
        <!-- Header -->
        <div class="flex justify-between items-center mt-4 mb-6">
            <div>
                <p class="text-gray-400 text-sm">Welcome back</p>
                <h1 class="text-2xl font-bold">Alex Chen</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="streak-badge px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fas fa-fire text-sm"></i>
                    <span class="font-bold text-sm">7 Days</span>
                </div>
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-purple-500">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Points Card -->
        <div class="glass-card rounded-3xl p-5 mb-5">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-sm mb-1">Focus Points</p>
                    <div class="flex items-baseline gap-2">
                        <span class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">2,450</span>
                        <span class="text-green-400 text-sm"><i class="fas fa-arrow-up"></i> +180</span>
                    </div>
                </div>
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                    <i class="fas fa-coins text-2xl text-white"></i>
                </div>
            </div>
            <div class="mt-4 bg-white/10 rounded-full h-2">
                <div class="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full" style="width: 65%"></div>
            </div>
            <p class="text-gray-400 text-xs mt-2">550 more points to unlock Golden Fox</p>
        </div>

        <!-- Pet Display -->
        <div class="glass-card rounded-3xl p-6 mb-5 text-center glow-ring">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-400 text-sm">Current Pet</span>
                <span class="px-3 py-1 bg-purple-500/20 rounded-full text-purple-300 text-xs font-medium">Lv.12</span>
            </div>
            <div class="pet-container my-6">
                <div class="w-32 h-32 mx-auto bg-gradient-to-br from-purple-500/20 to-pink-500/20 rounded-full flex items-center justify-center">
                    <span class="text-7xl">🦊</span>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-1">Mystic Fox</h3>
            <p class="text-gray-400 text-sm mb-4">Cosmic Skin Equipped</p>
            <div class="flex justify-center gap-6">
                <div class="text-center">
                    <p class="text-2xl font-bold text-purple-400">24h</p>
                    <p class="text-xs text-gray-400">Focus Time</p>
                </div>
                <div class="w-px bg-white/10"></div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-pink-400">89%</p>
                    <p class="text-xs text-gray-400">Growth</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button class="bg-gradient-to-r from-purple-600 to-purple-500 rounded-2xl p-4 text-left">
                <i class="fas fa-play-circle text-2xl mb-2"></i>
                <p class="font-semibold">Start Focus</p>
                <p class="text-xs text-purple-200">Place phone to begin</p>
            </button>
            <button class="glass-card rounded-2xl p-4 text-left">
                <i class="fas fa-store text-2xl mb-2 text-pink-400"></i>
                <p class="font-semibold">Pet Shop</p>
                <p class="text-xs text-gray-400">3 new items</p>
            </button>
        </div>

        <!-- Today's Stats -->
        <div class="glass-card rounded-3xl p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold">Today's Progress</h3>
                <span class="text-purple-400 text-sm">View All</span>
            </div>
            <div class="flex justify-between">
                <div class="text-center flex-1">
                    <div class="w-12 h-12 mx-auto rounded-full bg-green-500/20 flex items-center justify-center mb-2">
                        <i class="fas fa-clock text-green-400"></i>
                    </div>
                    <p class="text-lg font-bold">3.5h</p>
                    <p class="text-xs text-gray-400">Focus Time</p>
                </div>
                <div class="text-center flex-1">
                    <div class="w-12 h-12 mx-auto rounded-full bg-blue-500/20 flex items-center justify-center mb-2">
                        <i class="fas fa-check-circle text-blue-400"></i>
                    </div>
                    <p class="text-lg font-bold">5</p>
                    <p class="text-xs text-gray-400">Sessions</p>
                </div>
                <div class="text-center flex-1">
                    <div class="w-12 h-12 mx-auto rounded-full bg-yellow-500/20 flex items-center justify-center mb-2">
                        <i class="fas fa-star text-yellow-400"></i>
                    </div>
                    <p class="text-lg font-bold">+180</p>
                    <p class="text-xs text-gray-400">Points</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 py-2 pb-7">
        <div class="flex justify-around">
            <a href="#" class="flex flex-col items-center gap-1 text-purple-400">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-paw text-xl"></i>
                <span class="text-xs">Pets</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Stats</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-xs">Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
