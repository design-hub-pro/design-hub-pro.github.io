<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Pet Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #1A1A2E 0%, #16213E 50%, #0F0F23 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-active {
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
        }
        .premium-badge {
            background: linear-gradient(135deg, #F59E0B 0%, #EF4444 100%);
        }
        .locked-overlay {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-6 pt-3 pb-2 text-sm font-semibold">
        <span>9:41</span>
        <div class="w-28 h-8 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-5 pb-24">
        <!-- Header -->
        <div class="flex justify-between items-center mt-4 mb-5">
            <h1 class="text-2xl font-bold">Pet Shop</h1>
            <div class="flex items-center gap-2 bg-white/10 rounded-full px-4 py-2">
                <i class="fas fa-coins text-yellow-400"></i>
                <span class="font-bold">2,450</span>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-5">
            <button class="tab-active px-5 py-2.5 rounded-full text-sm font-semibold">Pets</button>
            <button class="bg-white/10 px-5 py-2.5 rounded-full text-sm font-medium text-gray-300">Skins</button>
            <button class="bg-white/10 px-5 py-2.5 rounded-full text-sm font-medium text-gray-300">Items</button>
        </div>

        <!-- Featured Pet -->
        <div class="glass-card rounded-3xl p-5 mb-5 relative overflow-hidden">
            <div class="absolute top-4 right-4">
                <span class="premium-badge px-3 py-1 rounded-full text-xs font-bold">NEW</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-24 h-24 bg-gradient-to-br from-yellow-500/20 to-orange-500/20 rounded-2xl flex items-center justify-center">
                    <span class="text-5xl">🦁</span>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold mb-1">Golden Lion</h3>
                    <p class="text-sm text-gray-400 mb-3">Legendary • +50% XP Boost</p>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-coins text-yellow-400"></i>
                        <span class="font-bold">3,000</span>
                    </div>
                </div>
            </div>
            <button class="w-full mt-4 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 font-semibold">
                Unlock Now
            </button>
        </div>

        <!-- Pet Grid -->
        <h3 class="font-semibold mb-3">Available Pets</h3>
        <div class="grid grid-cols-2 gap-3 mb-5">
            <!-- Unlocked Pet -->
            <div class="glass-card rounded-2xl p-4 text-center">
                <div class="w-16 h-16 mx-auto bg-purple-500/20 rounded-xl flex items-center justify-center mb-3">
                    <span class="text-4xl">🦊</span>
                </div>
                <h4 class="font-semibold text-sm mb-1">Mystic Fox</h4>
                <span class="text-xs text-green-400"><i class="fas fa-check-circle"></i> Owned</span>
            </div>

            <!-- Unlocked Pet -->
            <div class="glass-card rounded-2xl p-4 text-center">
                <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-xl flex items-center justify-center mb-3">
                    <span class="text-4xl">🐰</span>
                </div>
                <h4 class="font-semibold text-sm mb-1">Cloud Bunny</h4>
                <span class="text-xs text-green-400"><i class="fas fa-check-circle"></i> Owned</span>
            </div>

            <!-- Locked Pet -->
            <div class="glass-card rounded-2xl p-4 text-center relative">
                <div class="w-16 h-16 mx-auto bg-pink-500/20 rounded-xl flex items-center justify-center mb-3">
                    <span class="text-4xl">🐱</span>
                </div>
                <h4 class="font-semibold text-sm mb-1">Neon Cat</h4>
                <div class="flex items-center justify-center gap-1 text-xs text-gray-400">
                    <i class="fas fa-coins text-yellow-400"></i>
                    <span>1,500</span>
                </div>
            </div>

            <!-- Locked Pet -->
            <div class="glass-card rounded-2xl p-4 text-center relative overflow-hidden">
                <div class="absolute inset-0 locked-overlay flex items-center justify-center z-10">
                    <i class="fas fa-lock text-2xl text-white/60"></i>
                </div>
                <div class="w-16 h-16 mx-auto bg-green-500/20 rounded-xl flex items-center justify-center mb-3">
                    <span class="text-4xl">🐲</span>
                </div>
                <h4 class="font-semibold text-sm mb-1">Baby Dragon</h4>
                <div class="flex items-center justify-center gap-1 text-xs text-gray-400">
                    <i class="fas fa-coins text-yellow-400"></i>
                    <span>5,000</span>
                </div>
            </div>
        </div>

        <!-- Skins Section -->
        <h3 class="font-semibold mb-3">Fox Skins</h3>
        <div class="flex gap-3 overflow-x-auto pb-2">
            <div class="glass-card rounded-2xl p-3 text-center min-w-[100px] border-2 border-purple-500">
                <div class="w-14 h-14 mx-auto bg-purple-500/30 rounded-xl flex items-center justify-center mb-2">
                    <span class="text-3xl">🦊</span>
                </div>
                <p class="text-xs font-medium">Cosmic</p>
                <p class="text-[10px] text-green-400">Equipped</p>
            </div>
            <div class="glass-card rounded-2xl p-3 text-center min-w-[100px]">
                <div class="w-14 h-14 mx-auto bg-blue-500/30 rounded-xl flex items-center justify-center mb-2">
                    <span class="text-3xl filter hue-rotate-180">🦊</span>
                </div>
                <p class="text-xs font-medium">Ice</p>
                <p class="text-[10px] text-gray-400">800 pts</p>
            </div>
            <div class="glass-card rounded-2xl p-3 text-center min-w-[100px]">
                <div class="w-14 h-14 mx-auto bg-red-500/30 rounded-xl flex items-center justify-center mb-2">
                    <span class="text-3xl filter hue-rotate-30">🦊</span>
                </div>
                <p class="text-xs font-medium">Fire</p>
                <p class="text-[10px] text-gray-400">1,200 pts</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 py-2 pb-7">
        <div class="flex justify-around">
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-purple-400">
                <i class="fas fa-paw text-xl"></i>
                <span class="text-xs">Pets</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Stats</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-xs">Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
