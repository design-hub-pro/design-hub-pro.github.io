<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #1A1A2E 0%, #16213E 50%, #0F0F23 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch.active {
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
        }
        .toggle-switch.active::after {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-6 pt-3 pb-2 text-sm font-semibold">
        <span>9:41</span>
        <div class="w-28 h-8 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-5 pb-24">
        <!-- Header -->
        <h1 class="text-2xl font-bold mt-4 mb-5">Settings</h1>

        <!-- Profile Section -->
        <div class="glass-card rounded-3xl p-5 mb-5">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-purple-500">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&h=150&fit=crop" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-lg">Alex Chen</h3>
                    <p class="text-gray-400 text-sm">alex.chen@email.com</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <!-- Device Section -->
        <h3 class="text-gray-400 text-sm font-medium mb-3 px-1">DEVICE</h3>
        <div class="glass-card rounded-2xl mb-5 divide-y divide-white/10">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center">
                        <i class="fas fa-mobile-alt text-green-400"></i>
                    </div>
                    <div>
                        <p class="font-medium">Phone Holder</p>
                        <p class="text-xs text-green-400">Connected</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-400">85%</span>
                    <i class="fas fa-battery-three-quarters text-green-400"></i>
                </div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                        <i class="fas fa-bluetooth-b text-blue-400"></i>
                    </div>
                    <p class="font-medium">Bluetooth</p>
                </div>
                <div class="toggle-switch active"></div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center">
                        <i class="fas fa-sync-alt text-purple-400"></i>
                    </div>
                    <p class="font-medium">Auto-Connect</p>
                </div>
                <div class="toggle-switch active"></div>
            </div>
        </div>

        <!-- Focus Settings -->
        <h3 class="text-gray-400 text-sm font-medium mb-3 px-1">FOCUS SETTINGS</h3>
        <div class="glass-card rounded-2xl mb-5 divide-y divide-white/10">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-yellow-500/20 flex items-center justify-center">
                        <i class="fas fa-bell text-yellow-400"></i>
                    </div>
                    <p class="font-medium">Focus Reminders</p>
                </div>
                <div class="toggle-switch active"></div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center">
                        <i class="fas fa-ban text-red-400"></i>
                    </div>
                    <p class="font-medium">Block Notifications</p>
                </div>
                <div class="toggle-switch"></div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-pink-500/20 flex items-center justify-center">
                        <i class="fas fa-clock text-pink-400"></i>
                    </div>
                    <div>
                        <p class="font-medium">Daily Goal</p>
                        <p class="text-xs text-gray-400">3 hours per day</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <!-- App Settings -->
        <h3 class="text-gray-400 text-sm font-medium mb-3 px-1">APP</h3>
        <div class="glass-card rounded-2xl mb-5 divide-y divide-white/10">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-cyan-500/20 flex items-center justify-center">
                        <i class="fas fa-volume-up text-cyan-400"></i>
                    </div>
                    <p class="font-medium">Sound Effects</p>
                </div>
                <div class="toggle-switch active"></div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-orange-500/20 flex items-center justify-center">
                        <i class="fas fa-moon text-orange-400"></i>
                    </div>
                    <p class="font-medium">Dark Mode</p>
                </div>
                <div class="toggle-switch active"></div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gray-500/20 flex items-center justify-center">
                        <i class="fas fa-question-circle text-gray-400"></i>
                    </div>
                    <p class="font-medium">Help & Support</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <!-- Version -->
        <p class="text-center text-gray-500 text-sm mt-6">FocusPet v1.0.0</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 py-2 pb-7">
        <div class="flex justify-around">
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-paw text-xl"></i>
                <span class="text-xs">Pets</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Stats</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-purple-400">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-xs">Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
