<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Technical System Architecture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>

                    <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>

            </defs>

            <!-- Background -->
            <rect width="1200" height="900" fill="#fff"/>
            <rect width="1200" height="900" fill="url(#grid)"/>

            <!-- Title -->
            <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">FIG. 1 - System Architecture Overview</text>
            <text x="600" y="55" text-anchor="middle" font-size="12" fill="#333">Smart Phone Holder with Gamified Focus Tracking System</text>

            <!-- ==================== HARDWARE SECTION (LEFT) ==================== -->
            <text x="220" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">HARDWARE COMPONENTS</text>

            <!-- Smart Phone Holder (100) -->
            <rect x="50" y="120" width="340" height="420" rx="15" fill="none" stroke="#000" stroke-width="3"/>
            <text x="220" y="145" text-anchor="middle" font-size="13" font-weight="bold">Smart Phone Holder (100)</text>

            <!-- Processor Unit (110) -->
            <rect x="80" y="170" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="150" y="195" text-anchor="middle" font-size="11" font-weight="bold">Processor Unit</text>
            <text x="150" y="210" text-anchor="middle" font-size="10">(110)</text>
            <text x="150" y="225" text-anchor="middle" font-size="9" fill="#555">MCU Controller</text>

            <!-- Sensor Module (120) -->
            <rect x="230" y="170" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="300" y="195" text-anchor="middle" font-size="11" font-weight="bold">Sensor Module</text>
            <text x="300" y="210" text-anchor="middle" font-size="10">(120)</text>
            <text x="300" y="225" text-anchor="middle" font-size="9" fill="#555">Detection Array</text>

            <rect x="80" y="260" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="125" y="282" text-anchor="middle" font-size="9" font-weight="bold">Pressure</text>
            <text x="125" y="295" text-anchor="middle" font-size="8">(121)</text>

            <rect x="180" y="260" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="225" y="282" text-anchor="middle" font-size="9" font-weight="bold">Proximity</text>
            <text x="225" y="295" text-anchor="middle" font-size="8">(122)</text>

            <rect x="280" y="260" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="325" y="282" text-anchor="middle" font-size="9" font-weight="bold">Capacitive</text>
            <text x="325" y="295" text-anchor="middle" font-size="8">(123)</text>

            <!-- Communication Module (130) -->
            <rect x="80" y="330" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="150" y="355" text-anchor="middle" font-size="11" font-weight="bold">Communication</text>
            <text x="150" y="370" text-anchor="middle" font-size="10">(130)</text>
            <text x="150" y="385" text-anchor="middle" font-size="9" fill="#555">BLE 5.0 / WiFi</text>

            <!-- Power Management (140) -->
            <rect x="230" y="330" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="300" y="355" text-anchor="middle" font-size="11" font-weight="bold">Power Unit</text>
            <text x="300" y="370" text-anchor="middle" font-size="10">(140)</text>
            <text x="300" y="385" text-anchor="middle" font-size="9" fill="#555">Li-Po Battery</text>

            <!-- LED Indicator (150) -->
            <rect x="80" y="420" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="125" y="442" text-anchor="middle" font-size="9" font-weight="bold">LED Array</text>
            <text x="125" y="455" text-anchor="middle" font-size="8">(150)</text>

            <!-- USB Port (160) -->
            <rect x="180" y="420" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="225" y="442" text-anchor="middle" font-size="9" font-weight="bold">USB-C Port</text>
            <text x="225" y="455" text-anchor="middle" font-size="8">(160)</text>

            <!-- Storage (170) -->
            <rect x="280" y="420" width="90" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="325" y="442" text-anchor="middle" font-size="9" font-weight="bold">Flash Mem</text>
            <text x="325" y="455" text-anchor="middle" font-size="8">(170)</text>

            <!-- Internal Connections -->
            <line x1="150" y1="240" x2="150" y2="260" stroke="#000" stroke-width="1.5"/>
            <line x1="150" y1="240" x2="300" y2="240" stroke="#000" stroke-width="1.5"/>
            <line x1="300" y1="240" x2="300" y2="260" stroke="#000" stroke-width="1.5"/>
            <line x1="225" y1="240" x2="225" y2="260" stroke="#000" stroke-width="1.5"/>
            <line x1="325" y1="240" x2="325" y2="260" stroke="#000" stroke-width="1.5"/>
            <line x1="125" y1="240" x2="125" y2="260" stroke="#000" stroke-width="1.5"/>

            <text x="600" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">MOBILE APPLICATION</text>

            <!-- Mobile Device (200) -->
            <rect x="440" y="120" width="320" height="500" rx="20" fill="none" stroke="#000" stroke-width="3"/>
            <text x="600" y="145" text-anchor="middle" font-size="13" font-weight="bold">Mobile Device (200)</text>

            <!-- App Layer -->
            <rect x="460" y="165" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="600" y="190" text-anchor="middle" font-size="11" font-weight="bold">Application Layer (210)</text>
            <text x="600" y="205" text-anchor="middle" font-size="9" fill="#555">FocusPet App UI</text>
            <rect x="475" y="215" width="60" height="25" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
            <text x="505" y="232" text-anchor="middle" font-size="8">Home</text>
            <rect x="545" y="215" width="60" height="25" fill="#e8e8e8" stroke="#000" stroke-width="1"/>

            <text x="527" y="315" text-anchor="middle" font-size="9" fill="#555">Pet Animation</text>

            <!-- Points System (230) -->
            <rect x="605" y="260" width="135" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="672" y="285" text-anchor="middle" font-size="11" font-weight="bold">Points System</text>
            <text x="672" y="300" text-anchor="middle" font-size="10">(230)</text>
            <text x="672" y="315" text-anchor="middle" font-size="9" fill="#555">Rewards Logic</text>

            <!-- BLE Handler (240) -->
            <rect x="460" y="345" width="135" height="70" fill="#fff" stroke="#000" stroke-width="2"/>

            <text x="527" y="385" text-anchor="middle" font-size="10">(240)</text>
            <text x="527" y="400" text-anchor="middle" font-size="9" fill="#555">Device Comm</text>

            <!-- Data Manager (250) -->
            <rect x="605" y="345" width="135" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="672" y="370" text-anchor="middle" font-size="11" font-weight="bold">Data Manager</text>
            <text x="672" y="385" text-anchor="middle" font-size="10">(250)</text>
            <text x="672" y="400" text-anchor="middle" font-size="9" fill="#555">State Storage</text>

            <!-- Session Controller (260) -->
            <rect x="460" y="430" width="280" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="600" y="455" text-anchor="middle" font-size="11" font-weight="bold">Focus Session Controller (260)</text>
            <text x="600" y="475" text-anchor="middle" font-size="9" fill="#555">Timer • Detection Events • XP Calculation</text>

            <!-- API Client (270) -->
            <rect x="460" y="515" width="280" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="600" y="540" text-anchor="middle" font-size="11" font-weight="bold">API Client (270)</text>
            <text x="600" y="555" text-anchor="middle" font-size="9" fill="#555">Cloud Sync Layer</text>

            <!-- ==================== CLOUD SECTION (RIGHT) ==================== -->
            <text x="980" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">CLOUD INFRASTRUCTURE</text>

            <!-- Cloud Server (300) -->
            <rect x="810" y="120" width="340" height="420" rx="15" fill="none" stroke="#000" stroke-width="3"/>
            <text x="980" y="145" text-anchor="middle" font-size="13" font-weight="bold">Cloud Server (300)</text>

            <!-- API Gateway (310) -->
            <rect x="840" y="170" width="280" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="980" y="195" text-anchor="middle" font-size="11" font-weight="bold">API Gateway (310)</text>
            <text x="980" y="210" text-anchor="middle" font-size="9" fill="#555">REST/WebSocket</text>

            <!-- Auth Service (320) -->
            <rect x="840" y="235" width="135" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="907" y="260" text-anchor="middle" font-size="11" font-weight="bold">Auth Service</text>
            <text x="907" y="275" text-anchor="middle" font-size="10">(320)</text>

            <!-- User Service (330) -->
            <rect x="985" y="235" width="135" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="1052" y="260" text-anchor="middle" font-size="11" font-weight="bold">User Service</text>
            <text x="1052" y="275" text-anchor="middle" font-size="10">(330)</text>

            <!-- Game Service (340) -->
            <rect x="840" y="310" width="135" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="907" y="335" text-anchor="middle" font-size="11" font-weight="bold">Game Service</text>
            <text x="907" y="350" text-anchor="middle" font-size="10">(340)</text>

            <!-- Rewards Service (350) -->
            <rect x="985" y="310" width="135" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="1052" y="335" text-anchor="middle" font-size="11" font-weight="bold">Rewards Svc</text>
            <text x="1052" y="350" text-anchor="middle" font-size="10">(350)</text>

            <!-- Analytics (360) -->
            <rect x="840" y="385" width="280" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
            <text x="980" y="410" text-anchor="middle" font-size="11" font-weight="bold">Analytics Engine (360)</text>
            <text x="980" y="425" text-anchor="middle" font-size="9" fill="#555">Usage Tracking & Insights</text>

            <!-- Database (370) -->
            <ellipse cx="910" cy="485" rx="55" ry="35" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="910" y="480" text-anchor="middle" font-size="10" font-weight="bold">Database</text>
            <text x="910" y="495" text-anchor="middle" font-size="9">(370)</text>

            <!-- Cache (380) -->
            <ellipse cx="1050" cy="485" rx="55" ry="35" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="1050" y="480" text-anchor="middle" font-size="10" font-weight="bold">Redis Cache</text>
            <text x="1050" y="495" text-anchor="middle" font-size="9">(380)</text>

            <!-- ==================== DATA FLOW ARROWS ==================== -->
            <!-- Hardware to Mobile -->
            <path d="M 390 365 L 460 380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="420" y="355" font-size="9" fill="#555">BLE Data</text>

            <!-- Mobile to Cloud -->
            <path d="M 740 540 L 810 195" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="785" y="350" font-size="9" fill="#555" transform="rotate(-50, 785, 350)">HTTPS/WSS</text>

            <!-- Sensor to Processor -->
            <line x1="230" y1="205" x2="220" y2="205" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- Internal Mobile Connections -->
            <line x1="527" y1="330" x2="527" y2="345" stroke="#000" stroke-width="1.5"/>
            <line x1="672" y1="330" x2="672" y2="345" stroke="#000" stroke-width="1.5"/>
            <line x1="600" y1="500" x2="600" y2="515" stroke="#000" stroke-width="1.5"/>

            <!-- Cloud Internal -->
            <line x1="980" y1="220" x2="980" y2="235" stroke="#000" stroke-width="1.5"/>
            <line x1="907" y1="370" x2="907" y2="385" stroke="#000" stroke-width="1.5"/>
            <line x1="1052" y1="370" x2="1052" y2="385" stroke="#000" stroke-width="1.5"/>
            <line x1="910" y1="435" x2="910" y2="450" stroke="#000" stroke-width="1.5"/>
            <line x1="1050" y1="435" x2="1050" y2="450" stroke="#000" stroke-width="1.5"/>

            <!-- ==================== DATA FLOW SECTION ==================== -->
            <text x="600" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">FIG. 2 - Data Flow Process</text>

            <!-- Flow boxes -->
            <rect x="50" y="620" width="150" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="125" y="645" text-anchor="middle" font-size="10" font-weight="bold">1. Phone Placed</text>
            <text x="125" y="660" text-anchor="middle" font-size="9" fill="#555">Sensor Trigger</text>

            <path d="M 200 650 L 240 650" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

            <text x="325" y="660" text-anchor="middle" font-size="9" fill="#555">Detection Event</text>

            <path d="M 400 650 L 440 650" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

            <rect x="450" y="620" width="150" height="60" fill="#fff" stroke="#000" stroke-width="2"/>

            <text x="525" y="660" text-anchor="middle" font-size="9" fill="#555">Timer Begins</text>

            <rect x="650" y="620" width="150" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="725" y="645" text-anchor="middle" font-size="10" font-weight="bold">4. Pet Growth</text>
            <text x="725" y="660" text-anchor="middle" font-size="9" fill="#555">XP Accumulation</text>

            <path d="M 800 650 L 840 650" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

            <rect x="850" y="620" width="150" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
