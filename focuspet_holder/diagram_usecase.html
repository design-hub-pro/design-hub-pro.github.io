<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Use Case Diagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6366F1"/>
                    <stop offset="100%" style="stop-color:#8B5CF6"/>
                </linearGradient>
                <linearGradient id="systemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#14B8A6"/>
                    <stop offset="100%" style="stop-color:#06B6D4"/>
                </linearGradient>
                <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#EC4899"/>
                    <stop offset="100%" style="stop-color:#F43F5E"/>
                </linearGradient>
                <linearGradient id="rewardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#F59E0B"/>
                    <stop offset="100%" style="stop-color:#EF4444"/>
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
                </filter>
            </defs>

            <!-- Background -->
            <rect width="1200" height="750" fill="#f8fafc"/>

            <!-- Title -->
            <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">FocusPet System - Use Case Diagram</text>
            <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748b">Gamified Phone Holder for Digital Distraction Management</text>

            <!-- System Boundary -->
            <rect x="280" y="100" width="700" height="580" rx="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>
            <text x="630" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">FocusPet System</text>

            <!-- User Actor -->
            <g transform="translate(100, 300)">
                <!-- Person icon -->
                <circle cx="50" cy="30" r="25" fill="url(#userGrad)" filter="url(#shadow)"/>
                <ellipse cx="50" cy="90" rx="35" ry="45" fill="url(#userGrad)" filter="url(#shadow)"/>
                <text x="50" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">User</text>
                <text x="50" y="178" text-anchor="middle" font-size="11" fill="#64748b">(Phone Owner)</text>
            </g>

            <!-- Hardware Actor -->
            <g transform="translate(1050, 200)">
                <rect x="10" y="10" width="80" height="100" rx="10" fill="url(#systemGrad)" filter="url(#shadow)"/>
                <rect x="25" y="25" width="50" height="60" rx="5" fill="#fff"/>
                <circle cx="50" cy="95" r="6" fill="#fff"/>
                <text x="50" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Smart Holder</text>
                <text x="50" y="153" text-anchor="middle" font-size="11" fill="#64748b">(Hardware)</text>
            </g>

            <!-- Cloud Actor -->
            <g transform="translate(1050, 450)">
                <ellipse cx="50" cy="40" rx="45" ry="30" fill="url(#systemGrad)" filter="url(#shadow)"/>
                <ellipse cx="30" cy="50" rx="25" ry="20" fill="url(#systemGrad)"/>
                <ellipse cx="70" cy="50" rx="25" ry="20" fill="url(#systemGrad)"/>
                <text x="50" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Cloud Server</text>
                <text x="50" y="118" text-anchor="middle" font-size="11" fill="#64748b">(Backend)</text>
            </g>

            <!-- Use Cases -->
            <!-- Core Feature: Phone Detection -->
            <g transform="translate(380, 160)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#coreGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Detect Phone</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Placement</text>
            </g>

            <!-- Core Feature: Start Focus Session -->
            <g transform="translate(580, 200)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#coreGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Start Focus</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Session</text>
            </g>

            <!-- Virtual Pet Features -->
            <g transform="translate(330, 280)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#userGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Grow Virtual</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Pet</text>
            </g>

            <g transform="translate(550, 280)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#userGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">View Pet</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Collection</text>
            </g>

            <!-- Reward Features -->
            <g transform="translate(330, 370)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#rewardGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Earn Focus</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Points</text>
            </g>

            <g transform="translate(550, 370)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#rewardGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Purchase Skins</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">& Pets</text>
            </g>

            <g transform="translate(740, 320)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#rewardGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Unlock</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Achievements</text>
            </g>

            <!-- Stats Features -->
            <g transform="translate(330, 460)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#systemGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">View Focus</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Statistics</text>
            </g>

            <g transform="translate(550, 460)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="url(#systemGrad)" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Track Daily</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Streak</text>
            </g>

            <!-- Settings Features -->
            <g transform="translate(440, 550)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="#64748b" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Configure</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Settings</text>
            </g>

            <g transform="translate(660, 550)">
                <ellipse cx="100" cy="35" rx="95" ry="32" fill="#64748b" filter="url(#shadow)"/>
                <text x="100" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Connect</text>
                <text x="100" y="46" text-anchor="middle" font-size="10" fill="#fff">Device</text>
            </g>

            <!-- Connection Lines from User -->
            <line x1="185" y1="320" x2="335" y2="305" stroke="#6366F1" stroke-width="2"/>
            <line x1="185" y1="330" x2="335" y2="315" stroke="#6366F1" stroke-width="2"/>
            <line x1="185" y1="350" x2="335" y2="395" stroke="#F59E0B" stroke-width="2"/>
            <line x1="185" y1="360" x2="335" y2="405" stroke="#F59E0B" stroke-width="2"/>
            <line x1="185" y1="380" x2="335" y2="485" stroke="#14B8A6" stroke-width="2"/>
            <line x1="185" y1="390" x2="335" y2="495" stroke="#14B8A6" stroke-width="2"/>
            <line x1="185" y1="400" x2="440" y2="575" stroke="#64748b" stroke-width="2"/>

            <!-- Connection Lines to Hardware -->
            <line x1="570" y1="195" x2="680" y2="235" stroke="#EC4899" stroke-width="2"/>
            <line x1="775" y1="235" x2="1050" y2="250" stroke="#14B8A6" stroke-width="2"/>
            <line x1="475" y1="195" x2="1050" y2="260" stroke="#EC4899" stroke-width="2"/>
            <line x1="855" y1="585" x2="1050" y2="450" stroke="#14B8A6" stroke-width="2"/>

            <!-- Connection Lines to Cloud -->
            <line x1="650" y1="405" x2="1050" y2="480" stroke="#F59E0B" stroke-width="2"/>
            <line x1="650" y1="495" x2="1050" y2="490" stroke="#14B8A6" stroke-width="2"/>
            <line x1="835" y1="355" x2="1050" y2="470" stroke="#F59E0B" stroke-width="2"/>

            <!-- Include relationships -->
            <line x1="580" y1="235" x2="525" y2="280" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="540" y="250" font-size="10" fill="#64748b">«include»</text>

            <line x1="680" y1="250" x2="525" y2="395" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="620" y="320" font-size="10" fill="#64748b">«include»</text>

            <!-- Legend -->
            <g transform="translate(30, 600)">
                <rect x="0" y="0" width="220" height="130" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
                <text x="110" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Legend</text>

                <ellipse cx="30" cy="50" rx="15" ry="10" fill="url(#coreGrad)"/>
                <text x="55" y="54" font-size="10" fill="#64748b">Core Features</text>

                <ellipse cx="30" cy="75" rx="15" ry="10" fill="url(#userGrad)"/>
                <text x="55" y="79" font-size="10" fill="#64748b">Pet Features</text>

                <ellipse cx="130" cy="50" rx="15" ry="10" fill="url(#rewardGrad)"/>
                <text x="155" y="54" font-size="10" fill="#64748b">Rewards</text>

                <ellipse cx="130" cy="75" rx="15" ry="10" fill="url(#systemGrad)"/>
                <text x="155" y="79" font-size="10" fill="#64748b">Statistics</text>

                <line x1="20" y1="100" x2="50" y2="100" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="55" y="104" font-size="10" fill="#64748b">«include»</text>
            </g>
        </svg>
    </div>
</body>
</html>
