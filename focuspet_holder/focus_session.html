<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPet - Focus Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #1A1A2E 0%, #16213E 50%, #0F0F23 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        .pet-float { animation: float 3s ease-in-out infinite; }
        .glow-breathe { animation: breathe 4s ease-in-out infinite; }
        .progress-ring { transform: rotate(-90deg); }
        .sparkle { animation: sparkle 2s ease-in-out infinite; }
        .sparkle:nth-child(2) { animation-delay: 0.5s; }
        .sparkle:nth-child(3) { animation-delay: 1s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="flex justify-between items-center px-6 pt-3 pb-2 text-sm font-semibold">
        <span>9:41</span>
        <div class="w-28 h-8 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-5 pb-24">
        <!-- Header -->
        <div class="flex justify-between items-center mt-4 mb-6">
            <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="text-lg font-semibold">Focus Session</h1>
            <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-ellipsis-h"></i>
            </button>
        </div>

        <!-- Holder Status -->
        <div class="glass-card rounded-2xl p-4 mb-6 flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center">
                <i class="fas fa-check-circle text-green-400 text-xl"></i>
            </div>
            <div class="flex-1">
                <p class="font-semibold text-green-400">Phone Detected</p>
                <p class="text-sm text-gray-400">Holder connected • Battery 85%</p>
            </div>
            <div class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></div>
        </div>

        <!-- Timer Ring -->
        <div class="relative flex justify-center mb-6">
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-56 h-56 rounded-full bg-purple-500/10 glow-breathe"></div>
            </div>
            <svg class="progress-ring w-56 h-56" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gradient)" stroke-width="8"
                    stroke-linecap="round" stroke-dasharray="565" stroke-dashoffset="141"/>
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8B5CF6"/>
                        <stop offset="100%" stop-color="#EC4899"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <p class="text-5xl font-bold tracking-tight">45:23</p>
                <p class="text-gray-400 mt-1">Minutes Focused</p>
            </div>
        </div>

        <!-- Pet Growing Animation -->
        <div class="glass-card rounded-3xl p-6 mb-5 text-center relative overflow-hidden">
            <!-- Sparkles -->
            <div class="absolute top-4 left-8 sparkle">
                <i class="fas fa-sparkles text-yellow-400 text-sm"></i>
            </div>
            <div class="absolute top-8 right-6 sparkle">
                <i class="fas fa-star text-purple-400 text-xs"></i>
            </div>
            <div class="absolute bottom-12 left-12 sparkle">
                <i class="fas fa-sparkles text-pink-400 text-xs"></i>
            </div>

            <div class="pet-float mb-4">
                <div class="w-28 h-28 mx-auto bg-gradient-to-br from-purple-500/20 to-pink-500/20 rounded-full flex items-center justify-center">
                    <span class="text-6xl">🦊</span>
                </div>
            </div>
            <h3 class="text-lg font-bold mb-1">Mystic Fox is Growing!</h3>
            <p class="text-gray-400 text-sm mb-4">+2 XP every minute</p>

            <!-- Growth Progress -->
            <div class="bg-white/10 rounded-full h-3 mb-2">
                <div class="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all" style="width: 72%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400">
                <span>Level 12</span>
                <span>72% to Level 13</span>
            </div>
        </div>

        <!-- Session Stats -->
        <div class="grid grid-cols-3 gap-3 mb-5">
            <div class="glass-card rounded-2xl p-4 text-center">
                <i class="fas fa-coins text-yellow-400 text-lg mb-2"></i>
                <p class="text-xl font-bold">+90</p>
                <p class="text-xs text-gray-400">Points</p>
            </div>
            <div class="glass-card rounded-2xl p-4 text-center">
                <i class="fas fa-bolt text-purple-400 text-lg mb-2"></i>
                <p class="text-xl font-bold">+45</p>
                <p class="text-xs text-gray-400">Pet XP</p>
            </div>
            <div class="glass-card rounded-2xl p-4 text-center">
                <i class="fas fa-fire text-orange-400 text-lg mb-2"></i>
                <p class="text-xl font-bold">x1.5</p>
                <p class="text-xs text-gray-400">Bonus</p>
            </div>
        </div>

        <!-- End Session Button -->
        <button class="w-full py-4 rounded-2xl bg-white/10 border border-white/20 text-white font-semibold flex items-center justify-center gap-2">
            <i class="fas fa-hand-paper"></i>
            End Session Early
        </button>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 py-2 pb-7">
        <div class="flex justify-around">
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-purple-400">
                <i class="fas fa-paw text-xl"></i>
                <span class="text-xs">Pets</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-xs">Stats</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 text-gray-500">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-xs">Settings</span>
            </a>
        </div>
    </div>
</body>
</html>
