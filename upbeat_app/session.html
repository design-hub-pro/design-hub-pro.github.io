<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Session</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
body,.screen{background:#0F1B1B;color:#fff}
.timer{position:relative;width:210px;height:210px;margin:0 auto}
.timer svg{position:absolute;inset:0}
.timer .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.beat{display:flex;gap:10px;justify-content:center}
.beat span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.15)}
.beat span.on{background:#F2B85B;box-shadow:0 0 18px rgba(242,184,91,0.7)}
.drill{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.06)}
.drill.now{background:rgba(20,161,159,0.18);border:1px solid rgba(20,161,159,0.5)}
.ref{border-radius:20px;overflow:hidden;position:relative;height:78px;background:url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=700&q=80') center/cover}
.ref::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.75),rgba(0,0,0,0.2))}
.ref>*{position:relative;z-index:1}
.ctl{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full">
    <div class="flex items-center justify-between mt-2">
      <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-chevron-down text-sm"></i></div>
      <div class="text-center"><p class="text-[11px] uppercase tracking-wider opacity-60 font-semibold">Piano · Drill 3 of 5</p><p class="text-sm font-bold mt-0.5">Left hand, bars 17 to 32</p></div>
      <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-ellipsis text-sm"></i></div>
    </div>

    <div class="timer mt-4">
      <svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/><circle class="ring" style="transform-origin:center" cx="125" cy="125" r="112" fill="none" stroke="#14A19F" stroke-width="12" stroke-linecap="round" stroke-dasharray="704" stroke-dashoffset="330"/></svg>
      <div class="mid">
        <p class="text-[11px] uppercase tracking-widest opacity-60 font-semibold">Elapsed</p>
        <p class="serif font-bold" style="font-size:54px;line-height:1">18:42</p>
        <p class="text-xs opacity-70 font-semibold mt-1">of 35 min</p>
      </div>
    </div>

    <div class="mt-4 rounded-3xl p-3" style="background:rgba(255,255,255,0.06)">
      <div class="flex items-center justify-between">
        <div class="ctl"><i class="fas fa-minus"></i></div>
        <div class="text-center"><p class="big" style="font-size:40px">88</p><p class="text-[11px] opacity-60 font-semibold uppercase tracking-wider mt-1">bpm · metronome</p></div>
        <div class="ctl"><i class="fas fa-plus"></i></div>
      </div>
      <div class="beat mt-4"><span class="on"></span><span></span><span></span><span></span></div>
    </div>

    <div class="flex flex-col gap-2 mt-4">
      <div class="drill"><span class="w-7 h-7 rounded-full bg-emerald-500 flex items-center justify-center text-[11px]"><i class="fas fa-check"></i></span><span class="text-sm font-semibold flex-1 opacity-60 line-through">Warm up scales</span><span class="text-xs opacity-50">5:00</span></div>
      <div class="drill"><span class="w-7 h-7 rounded-full bg-emerald-500 flex items-center justify-center text-[11px]"><i class="fas fa-check"></i></span><span class="text-sm font-semibold flex-1 opacity-60 line-through">Bars 17 to 24 at 80</span><span class="text-xs opacity-50">6:00</span></div>
      <div class="drill now"><span class="w-7 h-7 rounded-full flex items-center justify-center" style="background:#14A19F"><span class="dot bg-white"></span></span><span class="text-sm font-bold flex-1">Bars 25 to 32 at 88</span><span class="text-xs font-bold" style="color:#14A19F">7:42</span></div>
      <div class="drill"><span class="w-7 h-7 rounded-full border border-white/25"></span><span class="text-sm font-semibold flex-1 opacity-70">Hands together, slow</span><span class="text-xs opacity-50">10:00</span></div>
    </div>

    <div class="ref mt-4">
      <div class="p-4 h-full flex items-center gap-3">
        <span class="w-10 h-10 rounded-full bg-white text-[#14201F] flex items-center justify-center pl-0.5 flex-shrink-0"><i class="fas fa-play text-xs"></i></span>
        <div><p class="text-[10px] uppercase tracking-wider opacity-70 font-semibold">Reference</p><p class="text-sm font-bold">Bars 25 to 32, played at 88</p></div>
      </div>
    </div>

    <div class="flex gap-3 mt-4">
      <button class="flex-1 h-14 rounded-2xl bg-white/10 font-bold text-[15px]"><i class="fas fa-pause mr-2"></i>Pause</button>
      <button class="flex-1 h-14 rounded-2xl font-bold text-[15px] text-[#0F1B1B]" style="background:#F2B85B"><i class="fas fa-flag-checkered mr-2"></i>Finish</button>
    </div>
  </div>
</div>
</body>
</html>
