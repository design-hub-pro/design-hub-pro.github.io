<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
.hero{position:absolute;inset:0;height:520px;background:url('https://images.unsplash.com/photo-1552422535-c45813c61732?w=900&q=80') center/cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,20,0.15) 0%,rgba(10,20,20,0.1) 40%,#FAF8F3 100%)}
.act{border-radius:22px;padding:14px;background:#fff;border:2px solid transparent;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 14px rgba(20,32,31,0.05)}
.act.sel{border-color:#0E7C7B;background:#F0F7F6}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="hero"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full relative">
    <div class="flex items-center gap-2 mt-3">
      <div class="w-9 h-9 rounded-xl bg-white/90 flex items-center justify-center"><i class="fas fa-wave-square teal"></i></div>
      <span class="text-white font-bold tracking-wide">Upbeat</span>
    </div>
    <div class="mt-[290px]">
      <h1 class="serif text-[44px] leading-[1.02] font-bold ink">Practice with<br>a plan. See it<br>pay off.</h1>
      <p class="muted text-[15px] mt-3">Pick what you are working on. You can add more later.</p>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="act sel"><div class="tile" style="background:linear-gradient(135deg,#0E7C7B,#14A19F)"><i class="fas fa-music"></i></div><span class="text-sm font-semibold">Piano</span></div>
      <div class="act"><div class="tile" style="background:linear-gradient(135deg,#E29A2E,#F2B85B)"><i class="fas fa-guitar"></i></div><span class="text-sm font-semibold">Guitar</span></div>
      <div class="act"><div class="tile" style="background:linear-gradient(135deg,#7A5AF8,#A78BFA)"><i class="fas fa-baseball"></i></div><span class="text-sm font-semibold">Tennis</span></div>
      <div class="act"><div class="tile" style="background:linear-gradient(135deg,#2563EB,#60A5FA)"><i class="fas fa-person-swimming"></i></div><span class="text-sm font-semibold">Swimming</span></div>
      <div class="act"><div class="tile" style="background:linear-gradient(135deg,#DC2626,#F87171)"><i class="fas fa-person-running"></i></div><span class="text-sm font-semibold">Running</span></div>
      <div class="act"><div class="tile" style="background:linear-gradient(135deg,#374151,#6B7280)"><i class="fas fa-plus"></i></div><span class="text-sm font-semibold">Other</span></div>
    </div>
    <button class="w-full mt-6 h-14 rounded-2xl bg-teal text-white font-bold text-[16px] flex items-center justify-center gap-2">Continue <i class="fas fa-arrow-right text-sm"></i></button>
    <p class="text-center text-xs muted mt-4">Already practicing? <span class="teal font-semibold">Sign in</span></p>
  </div>
</div>
</body>
</html>
