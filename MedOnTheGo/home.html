<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - MedOnTheGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .status-bar { padding-top: env(safe-area-inset-top, 12px); }
        .map-container {
            background: linear-gradient(180deg, #e8f4ea 0%, #d1e8d4 100%);
            position: relative;
        }
        .map-road {
            position: absolute;
            background: #ffffff;
            border-radius: 4px;
        }
        .map-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #10B981;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .map-marker i {
            transform: rotate(45deg);
            color: white;
            font-size: 16px;
        }
        .map-marker.hospital { background: #EF4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .map-marker.pharmacy { background: #3B82F6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .map-marker.clinic { background: #8B5CF6; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
        .user-location {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #3B82F6;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 8px rgba(59, 130, 246, 0.2), 0 4px 8px rgba(0,0,0,0.2);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    <!-- Status Bar -->
    <div class="status-bar bg-white px-6 py-3 flex justify-between items-center">
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 pb-4">
        <div class="flex items-center justify-between mb-4">
            <div>
                <p class="text-gray-500 text-sm">Current Location</p>
                <div class="flex items-center gap-2">
                    <i class="fas fa-location-dot text-emerald-500"></i>
                    <span class="font-semibold text-gray-900">San Francisco, CA</span>
                </div>
            </div>
            <button class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center shadow-lg">
                <i class="fas fa-phone text-white text-sm"></i>
            </button>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center gap-3 bg-gray-100 rounded-2xl px-4 py-3">
            <i class="fas fa-search text-gray-400"></i>
            <input type="text" placeholder="Search hospitals, pharmacies..." class="bg-transparent flex-1 outline-none text-sm">
            <i class="fas fa-sliders text-emerald-500"></i>
        </div>
    </div>

    <!-- Category Pills -->
    <div class="bg-white px-5 pb-4 flex gap-2 overflow-x-auto">
        <button class="flex items-center gap-2 bg-emerald-500 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
            <i class="fas fa-map-marker-alt"></i> All
        </button>
        <button class="flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
            <i class="fas fa-hospital text-red-500"></i> Hospitals
        </button>
        <button class="flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
            <i class="fas fa-pills text-blue-500"></i> Pharmacy
        </button>
        <button class="flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
            <i class="fas fa-stethoscope text-purple-500"></i> Clinic
        </button>
    </div>

    <!-- Map View -->
    <div class="flex-1 map-container relative overflow-hidden">
        <!-- Map Roads -->
        <div class="map-road" style="width: 100%; height: 12px; top: 30%; left: 0;"></div>
        <div class="map-road" style="width: 100%; height: 12px; top: 60%; left: 0;"></div>
        <div class="map-road" style="width: 12px; height: 100%; top: 0; left: 25%;"></div>
        <div class="map-road" style="width: 12px; height: 100%; top: 0; left: 60%;"></div>
        <div class="map-road" style="width: 12px; height: 100%; top: 0; left: 85%;"></div>

        <!-- User Location -->
        <div class="user-location pulse" style="top: 45%; left: 50%; transform: translate(-50%, -50%);"></div>

        <!-- Map Markers -->
        <div class="map-marker hospital" style="top: 20%; left: 30%;">
            <i class="fas fa-hospital"></i>
        </div>
        <div class="map-marker pharmacy" style="top: 35%; left: 70%;">
            <i class="fas fa-pills"></i>
        </div>
        <div class="map-marker clinic" style="top: 65%; left: 20%;">
            <i class="fas fa-stethoscope"></i>
        </div>
        <div class="map-marker hospital" style="top: 75%; left: 75%;">
            <i class="fas fa-hospital"></i>
        </div>

        <!-- Current Location Button -->
        <button class="absolute bottom-24 right-4 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center">
            <i class="fas fa-crosshairs text-emerald-500 text-lg"></i>
        </button>

        <!-- Nearby Card -->
        <div class="absolute bottom-4 left-4 right-4 bg-white rounded-2xl p-4 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1587351021759-3e566b6af7cc?w=200&h=200&fit=crop" alt="Hospital" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-gray-900 truncate">SF General Hospital</h3>
                    <p class="text-gray-500 text-sm">0.8 mi away • Open 24h</p>
                    <div class="flex items-center gap-1 mt-1">
                        <i class="fas fa-star text-yellow-400 text-xs"></i>
                        <span class="text-sm font-medium">4.8</span>
                        <span class="text-gray-400 text-sm">(324 reviews)</span>
                    </div>
                </div>
                <button class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-arrow-right text-white text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="bg-white px-6 py-3 flex justify-around items-center border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom, 20px);">
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-map-location-dot text-emerald-500 text-xl"></i>
            <span class="text-xs font-medium text-emerald-500">Explore</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-list text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Nearby</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-comment-medical text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Advice</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-user text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Profile</span>
        </button>
    </div>
</body>
</html>
