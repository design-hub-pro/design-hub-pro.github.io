<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedOnTheGo - Medical Facility Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.25), 0 30px 60px -30px rgba(0, 0, 0, 0.3), inset 0 0 0 12px #1a1a1a;
            background: #1a1a1a;
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 35px;
            background: #1a1a1a;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }
        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 38px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen bg-white">
    <!-- Header -->
    <header class="py-12 px-8 text-center">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-plus-circle text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-gray-900">MedOnTheGo</h1>
        </div>
        <p class="text-gray-500 text-lg max-w-2xl mx-auto">Find nearby medical facilities and receive expert medical advice anytime, anywhere</p>
    </header>

    <!-- Screenshots Grid -->
    <main class="max-w-7xl mx-auto px-8 pb-16">
        <div class="flex flex-wrap justify-center gap-8">
            <!-- Home Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <iframe src="home.html"></iframe>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-600">Home</p>
            </div>

            <!-- Search Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <iframe src="search.html"></iframe>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-600">Nearby Facilities</p>
            </div>

            <!-- Detail Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <iframe src="detail.html"></iframe>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-600">Facility Details</p>
            </div>

            <!-- Chat Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <iframe src="chat.html"></iframe>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-600">Medical Advice</p>
            </div>

            <!-- Profile Screen -->
            <div class="flex flex-col items-center">
                <div class="phone-frame">
                    <iframe src="profile.html"></iframe>
                </div>
                <p class="mt-4 text-sm font-medium text-gray-600">Profile</p>
            </div>
        </div>
    </main>
</body>
</html>
