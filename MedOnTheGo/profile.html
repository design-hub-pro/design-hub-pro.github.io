<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - MedOnTheGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .status-bar { padding-top: env(safe-area-inset-top, 12px); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
    <!-- Status Bar -->
    <div class="status-bar bg-emerald-500 px-6 py-3 flex justify-between items-center text-white">
        <span class="text-sm font-semibold">9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Profile Header -->
    <div class="bg-emerald-500 px-5 pb-8 pt-4">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-white">Profile</h1>
            <button class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fas fa-cog text-white"></i>
            </button>
        </div>

        <div class="flex items-center gap-4">
            <div class="w-20 h-20 rounded-full border-4 border-white overflow-hidden">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop" alt="User" class="w-full h-full object-cover">
            </div>
            <div class="text-white">
                <h2 class="text-xl font-bold">John Anderson</h2>
                <p class="text-white/80 text-sm">john.anderson@email.com</p>
                <div class="flex items-center gap-2 mt-1">
                    <i class="fas fa-map-marker-alt text-xs"></i>
                    <span class="text-sm text-white/80">San Francisco, CA</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto bg-white rounded-t-3xl -mt-4 relative z-10">
        <div class="px-5 py-6">
            <!-- Quick Stats -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-emerald-50 rounded-2xl p-4 text-center">
                    <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-bookmark text-emerald-500"></i>
                    </div>
                    <p class="text-xl font-bold text-gray-900">8</p>
                    <p class="text-xs text-gray-500">Saved</p>
                </div>
                <div class="bg-blue-50 rounded-2xl p-4 text-center">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-history text-blue-500"></i>
                    </div>
                    <p class="text-xl font-bold text-gray-900">12</p>
                    <p class="text-xs text-gray-500">Visits</p>
                </div>
                <div class="bg-purple-50 rounded-2xl p-4 text-center">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-comment-medical text-purple-500"></i>
                    </div>
                    <p class="text-xl font-bold text-gray-900">5</p>
                    <p class="text-xs text-gray-500">Chats</p>
                </div>
            </div>

            <!-- Menu Items -->
            <div class="space-y-2">
                <button class="w-full flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
                    <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-user-edit text-emerald-500"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="font-medium text-gray-900">Edit Profile</p>
                        <p class="text-xs text-gray-500">Update your information</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>

                <button class="w-full flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
                    <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-heart text-red-500"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="font-medium text-gray-900">Health Profile</p>
                        <p class="text-xs text-gray-500">Allergies, conditions, medications</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>

                <button class="w-full flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
                    <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-amber-500"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="font-medium text-gray-900">Notifications</p>
                        <p class="text-xs text-gray-500">Manage alerts and reminders</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>

                <button class="w-full flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-shield-halved text-blue-500"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="font-medium text-gray-900">Privacy & Security</p>
                        <p class="text-xs text-gray-500">Control your data</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>

                <button class="w-full flex items-center gap-4 bg-gray-50 rounded-2xl p-4">
                    <div class="w-10 h-10 bg-gray-200 rounded-xl flex items-center justify-center">
                        <i class="fas fa-question-circle text-gray-500"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="font-medium text-gray-900">Help & Support</p>
                        <p class="text-xs text-gray-500">FAQs and contact us</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>

            <!-- Sign Out -->
            <button class="w-full mt-6 py-3 text-red-500 font-medium">
                <i class="fas fa-sign-out-alt mr-2"></i> Sign Out
            </button>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="bg-white px-6 py-3 flex justify-around items-center border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom, 20px);">
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-map-location-dot text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Explore</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-list text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Nearby</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-comment-medical text-gray-400 text-xl"></i>
            <span class="text-xs text-gray-400">Advice</span>
        </button>
        <button class="flex flex-col items-center gap-1">
            <i class="fas fa-user text-emerald-500 text-xl"></i>
            <span class="text-xs font-medium text-emerald-500">Profile</span>
        </button>
    </div>
</body>
</html>
