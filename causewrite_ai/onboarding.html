<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CauseWrite AI - Welcome</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(160deg, #F97316 0%, #E11D48 40%, #BE123C 100%);
    }
    .screen {
      background: transparent;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Status Bar -->
    <div class="status-bar" style="color: white;">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Hero Content -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 40px; text-align: center; color: white;">

      <!-- Logo Icon -->
      <div style="width: 90px; height: 90px; background: rgba(255,255,255,0.2); border-radius: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; backdrop-filter: blur(10px);">
        <i class="fas fa-pen-fancy" style="font-size: 40px; color: white;"></i>
      </div>

      <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 12px; line-height: 1.2;">CauseWrite AI</h1>
      <p style="font-size: 16px; opacity: 0.9; margin-bottom: 48px; line-height: 1.6;">Amplify every cause.<br>Write. Share. Give.</p>

      <!-- Feature List -->
      <div style="width: 100%; max-width: 300px; text-align: left; margin-bottom: 48px;">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
          <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <i class="fas fa-bullhorn" style="font-size: 20px;"></i>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 15px;">Discover Campaigns</div>
            <div style="font-size: 12px; opacity: 0.8;">Find causes that matter to you</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
          <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <i class="fas fa-wand-magic-sparkles" style="font-size: 20px;"></i>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 15px;">AI-Powered Writing</div>
            <div style="font-size: 12px; opacity: 0.8;">Create compelling content instantly</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">
          <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <i class="fas fa-hand-holding-heart" style="font-size: 20px;"></i>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 15px;">Donate & Track Impact</div>
            <div style="font-size: 12px; opacity: 0.8;">See your ripple effect grow</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div style="padding: 0 36px 50px;">
      <button style="width: 100%; padding: 16px; background: white; color: #E11D48; border: none; border-radius: 16px; font-size: 17px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,0.15); margin-bottom: 16px;">
        Get Started
      </button>
      <p style="text-align: center; color: rgba(255,255,255,0.8); font-size: 14px;">
        Already have an account? <span style="font-weight: 600; color: white; text-decoration: underline;">Sign In</span>
      </p>
    </div>
  </div>
</body>
</html>
