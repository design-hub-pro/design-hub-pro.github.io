<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CauseWrite AI - AI Studio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="screen">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Header -->
    <div style="padding: 4px 28px 16px; display: flex; align-items: center; gap: 14px;">
      <div style="width: 36px; height: 36px; background: #F1F5F9; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-chevron-left" style="font-size: 15px; color: #475569;"></i>
      </div>
      <div style="flex: 1;">
        <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-wand-magic-sparkles" style="color: #8B5CF6; font-size: 18px;"></i>
          AI Writing Studio
        </h1>
      </div>
    </div>

    <div class="content">
      <!-- Campaign Context -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #F8FAFC; border-radius: 14px; margin-bottom: 22px; border: 1px solid #E2E8F0;">
        <img src="https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?w=100&h=100&fit=crop" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover;">
        <div style="flex: 1;">
          <div style="font-size: 13px; font-weight: 600;">Clean Water for 10,000 Families</div>
          <div style="font-size: 11px; color: #64748B;">WaterAid Global</div>
        </div>
        <span class="badge badge-emerald"><i class="fas fa-circle" style="font-size: 6px; margin-right: 3px;"></i>Live</span>
      </div>

      <!-- Content Type -->
      <div style="margin-bottom: 22px;">
        <div style="font-size: 13px; font-weight: 600; color: #64748B; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">Content Type</div>
        <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
          <div style="padding: 12px 16px; background: linear-gradient(135deg, #8B5CF6, #7C3AED); color: white; border-radius: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 600;">
            <i class="fas fa-mobile-alt"></i> Social Post
          </div>
          <div style="padding: 12px 16px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 500; color: #64748B;">
            <i class="fas fa-envelope"></i> Email
          </div>
          <div style="padding: 12px 16px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 500; color: #64748B;">
            <i class="fas fa-newspaper"></i> Press
          </div>
          <div style="padding: 12px 16px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 500; color: #64748B;">
            <i class="fas fa-file-alt"></i> Petition
          </div>
        </div>
      </div>

      <!-- Platform -->
      <div style="margin-bottom: 22px;">
        <div style="font-size: 13px; font-weight: 600; color: #64748B; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">Platform</div>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
          <div style="padding: 14px 8px; background: linear-gradient(135deg, #E4405F, #C13584); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: white;">
            <i class="fab fa-instagram" style="font-size: 22px;"></i>
            <span style="font-size: 10px; font-weight: 600;">Instagram</span>
          </div>
          <div style="padding: 14px 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748B;">
            <i class="fab fa-x-twitter" style="font-size: 22px;"></i>
            <span style="font-size: 10px; font-weight: 500;">X</span>
          </div>
          <div style="padding: 14px 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748B;">
            <i class="fab fa-linkedin-in" style="font-size: 22px;"></i>
            <span style="font-size: 10px; font-weight: 500;">LinkedIn</span>
          </div>
          <div style="padding: 14px 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748B;">
            <i class="fab fa-tiktok" style="font-size: 22px;"></i>
            <span style="font-size: 10px; font-weight: 500;">TikTok</span>
          </div>
          <div style="padding: 14px 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #64748B;">
            <i class="fab fa-facebook-f" style="font-size: 22px;"></i>
            <span style="font-size: 10px; font-weight: 500;">Facebook</span>
          </div>
        </div>
      </div>

      <!-- Tone -->
      <div style="margin-bottom: 28px;">
        <div style="font-size: 13px; font-weight: 600; color: #64748B; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">Tone</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <span style="padding: 10px 18px; background: linear-gradient(135deg, #F97316, #E11D48); color: white; border-radius: 24px; font-size: 13px; font-weight: 600;">Urgent</span>
          <span style="padding: 10px 18px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 24px; font-size: 13px; font-weight: 500; color: #64748B;">Hopeful</span>
          <span style="padding: 10px 18px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 24px; font-size: 13px; font-weight: 500; color: #64748B;">Data-Driven</span>
          <span style="padding: 10px 18px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 24px; font-size: 13px; font-weight: 500; color: #64748B;">Emotional</span>
          <span style="padding: 10px 18px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 24px; font-size: 13px; font-weight: 500; color: #64748B;">Professional</span>
        </div>
      </div>

      <!-- Generate Button -->
      <button class="btn btn-ai" style="font-size: 16px; padding: 16px 24px;">
        <i class="fas fa-wand-magic-sparkles"></i> Generate with AI
      </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <a href="#" class="tab-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="#" class="tab-item">
        <i class="fas fa-compass"></i>
        <span>Discover</span>
      </a>
      <a href="#" class="tab-item center-tab active">
        <div class="tab-icon-bg">
          <i class="fas fa-pen-fancy"></i>
        </div>
        <span style="margin-top: 2px; color: #E11D48;">Create</span>
      </a>
      <a href="#" class="tab-item">
        <i class="fas fa-chart-line"></i>
        <span>Impact</span>
      </a>
      <a href="#" class="tab-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  </div>
</body>
</html>
