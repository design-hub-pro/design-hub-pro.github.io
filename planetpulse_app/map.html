<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetPulse - Map</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    scrollbar-width: none;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #E6F1EC;
    width: 100%; height: 100%;
    overflow: hidden;
    color: #07261B;
    position: relative;
  }

  /* Map background */
  .map-bg {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?w=900');
    background-size: cover; background-position: center;
    filter: saturate(0.85) brightness(0.95);
  }
  .map-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,78,59,0.1) 0%, rgba(246,251,247,0.4) 60%, rgba(246,251,247,0) 100%);
  }

  .status-bar {
    position: relative; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0 28px; height: 59px;
  }
  .status-bar .time { font-size: 16px; font-weight: 600; }
  .status-bar .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
  }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .battery { width: 27px; height: 12px; border: 1.5px solid #000; border-radius: 3px; position: relative; padding: 1.5px; }
  .battery::after { content: ''; position: absolute; right: -4px; top: 3px; width: 2px; height: 6px; background: #000; border-radius: 0 1px 1px 0; }
  .battery-fill { width: 75%; height: 100%; background: #000; border-radius: 1.5px; }

  /* Search bar */
  .search-bar {
    position: absolute; top: 70px; left: 20px; right: 20px; z-index: 10;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
    border-radius: 22px; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 24px rgba(7,38,27,0.12);
  }
  .search-bar i { color: #10B981; font-size: 15px; }
  .search-bar input { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 500; color: #07261B; outline: none; }
  .search-bar input::placeholder { color: #9CB5AA; }
  .filter-btn {
    width: 32px; height: 32px; border-radius: 10px;
    background: #10B981; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }

  /* Filter pills */
  .filter-row {
    position: absolute; top: 140px; left: 0; right: 0; z-index: 10;
    display: flex; gap: 8px; overflow-x: auto; padding: 0 20px;
  }
  .fp {
    flex-shrink: 0;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
    padding: 8px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700; color: #07261B;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 12px rgba(7,38,27,0.08);
  }
  .fp.active { background: #07261B; color: #fff; }
  .fp .d { width: 8px; height: 8px; border-radius: 50%; }
  .fp.p .d { background: #EF4444; }
  .fp.c .d { background: #22C55E; }
  .fp.t .d { background: #0EA5E9; }

  /* Markers */
  .marker {
    position: absolute; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
  }
  .marker-bubble {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
    border: 3px solid #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    position: relative;
  }
  .marker-bubble::after {
    content:''; position: absolute;
    bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 10px solid #fff;
  }
  .mb-red { background: linear-gradient(135deg, #F87171, #EF4444); }
  .mb-green { background: linear-gradient(135deg, #34D399, #10B981); }
  .mb-blue { background: linear-gradient(135deg, #38BDF8, #0EA5E9); }
  .mb-amber { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
  .marker .pulse {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid currentColor; animation: mpulse 2s infinite;
  }
  @keyframes mpulse { 0%{transform:scale(1);opacity:0.8;} 100%{transform:scale(2);opacity:0;} }

  .m1 { top: 250px; left: 70px; color: #EF4444; }
  .m2 { top: 320px; left: 200px; color: #10B981; }
  .m3 { top: 230px; right: 60px; color: #0EA5E9; }
  .m4 { top: 400px; left: 130px; color: #F59E0B; }
  .m5 { top: 410px; right: 90px; color: #EF4444; }

  /* Zoom controls */
  .controls {
    position: absolute; top: 200px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctl {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #07261B;
    box-shadow: 0 4px 14px rgba(7,38,27,0.1);
  }
  .ctl.active { background: #10B981; color: #fff; }

  /* Bottom card */
  .bottom-sheet {
    position: absolute; bottom: 100px; left: 16px; right: 16px; z-index: 10;
    background: #fff; border-radius: 28px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(7,38,27,0.18);
  }
  .handle { width: 44px; height: 4px; background: #E2E8F0; border-radius: 3px; margin: 0 auto 14px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-title { font-size: 16px; font-weight: 800; }
  .sheet-count { font-size: 11px; color: #5B7A6E; font-weight: 600; }

  .incident {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
  }
  .incident + .incident { border-top: 1px solid #F1F5F3; }
  .inc-img {
    width: 52px; height: 52px; border-radius: 14px;
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .inc-info { flex: 1; }
  .inc-title { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .inc-title .dot { width: 7px; height: 7px; border-radius: 50%; }
  .inc-meta { font-size: 11px; color: #5B7A6E; margin-top: 2px; }
  .inc-dist {
    background: #F0FDF4; color: #15803D;
    padding: 5px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 800;
  }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    height: 90px; background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding-top: 12px; border-top: 0.5px solid rgba(0,0,0,0.06);
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; color: #9CB5AA;
  }
  .tab-item.active { color: #10B981; }
  .tab-item i { font-size: 20px; }
  .tab-fab {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #10B981, #047857);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
    box-shadow: 0 8px 20px rgba(16,185,129,0.4);
    margin-top: -18px;
  }
  .home-indicator {
    width: 134px; height: 5px; background: #1A1A1A; border-radius: 3px;
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="map-bg"></div>
  <div class="map-overlay"></div>

  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="search-bar">
    <i class="fas fa-magnifying-glass"></i>
    <input type="text" placeholder="Search pollution, cleanups, parks...">
    <div class="filter-btn"><i class="fas fa-sliders"></i></div>
  </div>

  <div class="filter-row">
    <div class="fp active">All</div>
    <div class="fp p"><div class="d"></div>Pollution</div>
    <div class="fp c"><div class="d"></div>Cleanups</div>
    <div class="fp t"><div class="d"></div>Water</div>
    <div class="fp"><div class="d" style="background:#F59E0B"></div>Noise</div>
  </div>

  <div class="controls">
    <div class="ctl"><i class="fas fa-plus"></i></div>
    <div class="ctl"><i class="fas fa-minus"></i></div>
    <div class="ctl active"><i class="fas fa-location-crosshairs"></i></div>
  </div>

  <!-- Markers -->
  <div class="marker m1">
    <div class="pulse"></div>
    <div class="marker-bubble mb-red"><i class="fas fa-trash"></i></div>
  </div>
  <div class="marker m2">
    <div class="marker-bubble mb-green"><i class="fas fa-hands-holding"></i></div>
  </div>
  <div class="marker m3">
    <div class="marker-bubble mb-blue"><i class="fas fa-droplet"></i></div>
  </div>
  <div class="marker m4">
    <div class="marker-bubble mb-amber"><i class="fas fa-volume-high"></i></div>
  </div>
  <div class="marker m5">
    <div class="pulse"></div>
    <div class="marker-bubble mb-red"><i class="fas fa-smog"></i></div>
  </div>

  <div class="bottom-sheet">
    <div class="handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">Nearby Activity</div>
      <div class="sheet-count">5 incidents</div>
    </div>
    <div class="incident">
      <div class="inc-img" style="background-image:url('https://images.unsplash.com/photo-1621451537084-482c73073a0f?w=200')"></div>
      <div class="inc-info">
        <div class="inc-title"><div class="dot" style="background:#EF4444"></div>Plastic Waste · High</div>
        <div class="inc-meta">Reported 12 min ago · 3 verified</div>
      </div>
      <div class="inc-dist">0.4 km</div>
    </div>
    <div class="incident">
      <div class="inc-img" style="background-image:url('https://images.unsplash.com/photo-1567095761054-7a02e69e5c43?w=200')"></div>
      <div class="inc-info">
        <div class="inc-title"><div class="dot" style="background:#22C55E"></div>Beach Cleanup · Active</div>
        <div class="inc-meta">48 joined · Sat 9 AM</div>
      </div>
      <div class="inc-dist">1.2 km</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item active"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab-fab"><i class="fas fa-camera"></i></div>
    <div class="tab-item"><i class="fas fa-chart-simple"></i><span>Impact</span></div>
    <div class="tab-item"><i class="fas fa-user"></i><span>Me</span></div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
