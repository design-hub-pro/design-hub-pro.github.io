<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe Zones</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0B1220;color:white;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7A93;font-size:10px;font-weight:500}
.tab.active{color:#4FD1C5}
.tab i{font-size:22px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:22px}
.zone-card{position:relative;border-radius:24px;overflow:hidden;height:140px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-5">
      <div>
        <p class="text-xs text-gray-400 font-medium">Geofenced</p>
        <h1 class="text-2xl font-bold">Safe Zones</h1>
      </div>
      <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#4FD1C5,#0EA5E9)"><i class="fas fa-plus text-[#0B1220]"></i></div>
    </div>

    <!-- Summary -->
    <div class="card p-4 flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#4FD1C5,#0EA5E9)">
        <i class="fas fa-shield-halved text-[#0B1220] text-lg"></i>
      </div>
      <div class="flex-1">
        <p class="text-2xl font-bold">5 <span class="text-sm text-gray-400 font-normal">active zones</span></p>
        <p class="text-[11px] text-gray-500">Lily is inside Home · Notifications on</p>
      </div>
    </div>

    <!-- Zones list -->
    <div class="grid grid-cols-2 gap-3 mt-5">
      <!-- Home zone -->
      <div class="zone-card col-span-2">
        <img src="https://images.unsplash.com/photo-1449844908441-8829872d2607?w=600&h=300&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,18,32,0.9) 0%,rgba(11,18,32,0.4) 60%,transparent 100%)"></div>
        <div class="absolute top-3 right-3 flex items-center gap-1 bg-green-500/90 rounded-full px-2.5 py-1">
          <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
          <span class="text-[9px] font-bold text-[#0B1220]">INSIDE</span>
        </div>
        <div class="absolute left-4 bottom-4">
          <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center mb-2"><i class="fas fa-house text-white"></i></div>
          <p class="text-lg font-bold">Home</p>
          <p class="text-[10px] text-gray-300">142 Oak Street · 150m radius</p>
        </div>
      </div>

      <div class="zone-card">
        <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=400&h=300&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0B1220]/95 to-transparent"></div>
        <div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-graduation-cap text-[10px] text-white"></i></div>
        <div class="absolute left-3 bottom-3">
          <p class="text-sm font-bold">School</p>
          <p class="text-[9px] text-gray-300">200m · Mon–Fri</p>
        </div>
      </div>

      <div class="zone-card">
        <img src="https://images.unsplash.com/photo-1530549387789-4c1017266635?w=400&h=300&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0B1220]/95 to-transparent"></div>
        <div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-tree text-[10px] text-white"></i></div>
        <div class="absolute left-3 bottom-3">
          <p class="text-sm font-bold">Lincoln Park</p>
          <p class="text-[9px] text-gray-300">100m · After school</p>
        </div>
      </div>

      <div class="zone-card">
        <img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=400&h=300&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0B1220]/95 to-transparent"></div>
        <div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-people-roof text-[9px] text-white"></i></div>
        <div class="absolute left-3 bottom-3">
          <p class="text-sm font-bold">Grandma's</p>
          <p class="text-[9px] text-gray-300">80m · Weekends</p>
        </div>
      </div>

      <div class="zone-card">
        <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=400&h=300&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-[#0B1220]/95 to-transparent"></div>
        <div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-futbol text-[10px] text-white"></i></div>
        <div class="absolute left-3 bottom-3">
          <p class="text-sm font-bold">Soccer Club</p>
          <p class="text-[9px] text-gray-300">120m · Tue/Thu</p>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-shield-halved"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab"><i class="fas fa-bell"></i><span>Alerts</span></div>
    <div class="tab active"><i class="fas fa-location-dot"></i><span>Zones</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
