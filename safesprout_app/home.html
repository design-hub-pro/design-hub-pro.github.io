<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0B1220;width:100%;height:100%;margin:0;overflow:hidden;color:white}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:#F4F7FB}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.content{height:calc(100% - 88px);overflow-y:auto;padding:0}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(11,18,32,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7A93;font-size:10px;font-weight:500}
.tab.active{color:#4FD1C5}
.tab i{font-size:22px}
.map{position:relative;height:58%;overflow:hidden;background:#DCE6F1}
.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:hue-rotate(170deg) saturate(0.7) brightness(0.95)}
.card{background:#0B1220;border-radius:28px 28px 0 0;margin-top:-32px;position:relative;z-index:10;padding:22px 28px 0;color:white}
.pulse{position:relative}
.pulse::before,.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid #4FD1C5;animation:pulse 2s infinite}
.pulse::after{animation-delay:1s}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.child-pin{position:absolute;top:40%;left:55%;transform:translate(-50%,-50%)}
.pin-dot{width:52px;height:52px;border-radius:50%;background:white;padding:3px;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
.pin-dot img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pin-ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid #4FD1C5;animation:pulse 2s infinite}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>

  <!-- Map -->
  <div class="map">
    <img class="map-img" src="https://api.mapbox.com/styles/v1/mapbox/light-v11/static/-122.4194,37.7749,14,0/900x700?access_token=pk.placeholder" onerror="this.src='https://images.unsplash.com/photo-1524661135-423995f22d0b?w=900&h=900&fit=crop'">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,18,32,0.5) 0%,transparent 30%,transparent 60%,rgba(11,18,32,0.9) 100%)"></div>

    <div class="status-bar">
      <span>9:41</span>
      <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
    </div>

    <div class="flex items-center justify-between px-7 mt-1">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-xl flex items-center justify-center"><i class="fas fa-bars text-white"></i></div>
      </div>
      <div class="flex gap-2">
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-xl flex items-center justify-center"><i class="fas fa-layer-group text-white text-sm"></i></div>
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-xl flex items-center justify-center"><i class="fas fa-location-crosshairs text-white text-sm"></i></div>
      </div>
    </div>

    <!-- Safe zone circle -->
    <div class="absolute" style="top:20%;left:35%;width:200px;height:200px;border-radius:50%;border:2px dashed rgba(79,209,197,0.7);background:rgba(79,209,197,0.12)"></div>
    <div class="absolute" style="top:23%;left:38%;background:rgba(79,209,197,0.9);color:#0B1220;font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px">🏠 Home Zone</div>

    <!-- Child pin -->
    <div class="child-pin">
      <div class="pin-ring"></div>
      <div class="pin-dot"><img src="https://i.pravatar.cc/120?img=56"></div>
    </div>

    <!-- Bottom zone label -->
    <div class="absolute left-7 right-7" style="bottom:52px">
      <div class="flex items-center gap-2 bg-white/15 backdrop-blur-xl rounded-full px-3 py-2 w-fit">
        <span class="w-2 h-2 rounded-full bg-green-400"></span>
        <span class="text-[11px] text-white font-semibold">Inside Safe Zone · 2 min ago</span>
      </div>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="card">
    <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-4"></div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <img src="https://i.pravatar.cc/120?img=56" class="w-14 h-14 rounded-2xl border-2 border-teal-400">
        <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-green-400 border-2 border-[#0B1220] flex items-center justify-center"><i class="fas fa-check text-[7px] text-[#0B1220]"></i></div>
      </div>
      <div class="flex-1">
        <p class="text-lg font-bold">Lily, 8</p>
        <p class="text-[11px] text-gray-400 flex items-center gap-1"><i class="fas fa-location-dot text-teal-400 text-[10px]"></i> 142 Oak Street · Home</p>
      </div>
      <div class="flex items-center gap-1 bg-green-500/15 text-green-400 rounded-full px-3 py-1.5">
        <i class="fas fa-battery-three-quarters text-[10px]"></i>
        <span class="text-[11px] font-bold">82%</span>
      </div>
    </div>

    <!-- Quick stats -->
    <div class="grid grid-cols-3 gap-2 mt-4">
      <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
        <div class="flex items-center gap-1.5 text-teal-400"><i class="fas fa-shield-halved text-xs"></i><span class="text-[9px] font-bold uppercase">Safe</span></div>
        <p class="text-xl font-bold mt-1">24<span class="text-xs text-gray-500">h</span></p>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
        <div class="flex items-center gap-1.5 text-blue-400"><i class="fas fa-route text-xs"></i><span class="text-[9px] font-bold uppercase">Trips</span></div>
        <p class="text-xl font-bold mt-1">3</p>
      </div>
      <div class="bg-white/5 rounded-2xl p-3 border border-white/5">
        <div class="flex items-center gap-1.5 text-orange-400"><i class="fas fa-bell text-xs"></i><span class="text-[9px] font-bold uppercase">Alerts</span></div>
        <p class="text-xl font-bold mt-1">0</p>
      </div>
    </div>

    <!-- Emergency CTA -->
    <button class="w-full mt-4 rounded-2xl py-4 font-bold flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#FF4757,#E31C3D);box-shadow:0 12px 30px rgba(227,28,61,0.35)">
      <i class="fas fa-phone-volume"></i>
      <span>Call Lily · Emergency SOS</span>
    </button>
  </div>

  <div class="tab-bar">
    <div class="tab active"><i class="fas fa-shield-halved"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab"><i class="fas fa-bell"></i><span>Alerts</span></div>
    <div class="tab"><i class="fas fa-location-dot"></i><span>Zones</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
