<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOS Alert</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#1a0408;color:white;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at top,#3D0A12 0%,#1a0408 50%,#0B0609 100%)}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.content{height:calc(100% - 59px);overflow-y:auto;padding:0 28px 20px}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,0.6),0 0 60px rgba(255,71,87,0.4)}50%{box-shadow:0 0 0 30px rgba(255,71,87,0),0 0 80px rgba(255,71,87,0.6)}}
.sos-btn{animation:pulse-red 2s infinite}
.countdown{animation:pulse-red 1s infinite}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-8">
      <i class="fas fa-xmark text-white/60 text-xl"></i>
      <div class="flex items-center gap-1.5 bg-red-500 rounded-full px-3 py-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
        <span class="text-[10px] font-bold">LIVE ALERT</span>
      </div>
    </div>

    <div class="text-center mt-4">
      <p class="text-[11px] text-red-400 font-bold uppercase tracking-widest">Emergency Detected</p>
      <h1 class="text-4xl font-black mt-2 leading-tight">Lily needs<br>help now</h1>
      <p class="text-sm text-gray-400 mt-3">SOS button pressed · 24 sec ago</p>
    </div>

    <!-- Child location preview -->
    <div class="mt-7 rounded-3xl overflow-hidden relative h-44 border border-red-500/30">
      <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=600&h=400&fit=crop" class="w-full h-full object-cover" style="filter:hue-rotate(320deg) saturate(1.2) brightness(0.6)">
      <div class="absolute inset-0" style="background:radial-gradient(circle at center,transparent 30%,rgba(26,4,8,0.9) 100%)"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="relative">
          <div class="absolute inset-0 rounded-full bg-red-500/40 animate-ping" style="width:80px;height:80px"></div>
          <img src="https://i.pravatar.cc/120?img=56" class="w-16 h-16 rounded-full border-4 border-red-500 relative z-10">
        </div>
      </div>
      <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between bg-black/50 backdrop-blur-md rounded-xl px-3 py-2">
        <div class="flex items-center gap-2">
          <i class="fas fa-location-dot text-red-400"></i>
          <div>
            <p class="text-[11px] font-semibold">Lincoln Park, bench 3</p>
            <p class="text-[9px] text-gray-400">0.4 mi away</p>
          </div>
        </div>
        <div class="text-right">
          <p class="text-[9px] text-gray-400">ACCURACY</p>
          <p class="text-[11px] font-bold text-green-400">±3m</p>
        </div>
      </div>
    </div>

    <!-- Auto action countdown -->
    <div class="countdown bg-red-500/10 border border-red-500/40 rounded-2xl p-4 mt-5 flex items-center gap-3">
      <div class="w-11 h-11 rounded-full bg-red-500 flex items-center justify-center">
        <span class="text-lg font-black">12</span>
      </div>
      <div class="flex-1">
        <p class="text-xs font-bold">Auto-dialing 911 in 12s</p>
        <p class="text-[10px] text-gray-400">Will share live location & health data</p>
      </div>
      <button class="text-[10px] font-bold text-gray-300 bg-white/10 rounded-full px-3 py-1.5">CANCEL</button>
    </div>

    <!-- Actions -->
    <button class="sos-btn w-full mt-5 rounded-2xl py-5 font-black text-base flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#FF4757,#E31C3D)">
      <i class="fas fa-phone-volume text-xl"></i>
      <span>CALL LILY NOW</span>
    </button>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <button class="bg-white/5 border border-white/10 rounded-xl py-3 text-[10px] font-bold flex flex-col items-center gap-1"><i class="fas fa-route text-teal-400"></i>Navigate</button>
      <button class="bg-white/5 border border-white/10 rounded-xl py-3 text-[10px] font-bold flex flex-col items-center gap-1"><i class="fas fa-users text-blue-400"></i>Alert Family</button>
      <button class="bg-white/5 border border-white/10 rounded-xl py-3 text-[10px] font-bold flex flex-col items-center gap-1"><i class="fas fa-shield text-orange-400"></i>Police</button>
    </div>
  </div>
</div>
</body>
</html>
