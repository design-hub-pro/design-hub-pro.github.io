<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0">
    <title>Profile - GuardianSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-5 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
    </div>

    <!-- Profile Card -->
    <div class="px-6 py-5">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center gap-4 mb-5">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=face" class="w-16 h-16 rounded-2xl object-cover">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Sarah Johnson</h2>
                    <span class="inline-flex items-center gap-1 px-3 py-1 bg-violet-100 text-violet-700 rounded-full text-xs font-medium mt-1">
                        <i class="fas fa-crown text-xs"></i>
                        Premium
                    </span>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-4 pt-4 border-t border-gray-100">
                <div class="text-center">
                    <p class="text-2xl font-bold text-gray-900">1</p>
                    <p class="text-xs text-gray-400">Loved One</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-gray-900">4</p>
                    <p class="text-xs text-gray-400">Sensors</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-gray-900">127</p>
                    <p class="text-xs text-gray-400">Days</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Monitored Person -->
    <div class="px-6 pb-4">
        <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-4">
            <img src="https://images.unsplash.com/photo-1566616213894-2d4e1baee5d8?w=100&h=100&fit=crop&crop=face" class="w-14 h-14 rounded-xl object-cover">
            <div class="flex-1">
                <p class="font-medium text-gray-900">Margaret Johnson</p>
                <p class="text-xs text-gray-400">Mom • 78 years old</p>
            </div>
            <div class="flex items-center gap-1">
                <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                <span class="text-xs text-emerald-600">OK</span>
            </div>
        </div>
    </div>

    <!-- Settings -->
    <div class="px-6">
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="p-4 flex items-center gap-4 border-b border-gray-50">
                <div class="w-10 h-10 bg-violet-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bell text-violet-600"></i>
                </div>
                <p class="flex-1 font-medium text-gray-900">Notifications</p>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>

            <div class="p-4 flex items-center gap-4 border-b border-gray-50">
                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-users text-blue-600"></i>
                </div>
                <p class="flex-1 font-medium text-gray-900">Family Circle</p>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>

            <div class="p-4 flex items-center gap-4 border-b border-gray-50">
                <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-phone text-emerald-600"></i>
                </div>
                <p class="flex-1 font-medium text-gray-900">Emergency Contacts</p>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>

            <div class="p-4 flex items-center gap-4 border-b border-gray-50">
                <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-sliders text-amber-600"></i>
                </div>
                <p class="flex-1 font-medium text-gray-900">Alert Sensitivity</p>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>

            <div class="p-4 flex items-center gap-4">
                <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-shield-halved text-gray-600"></i>
                </div>
                <p class="flex-1 font-medium text-gray-900">Privacy</p>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>
    </div>

    <!-- Privacy Badge -->
    <div class="px-6 py-5">
        <div class="bg-violet-50 rounded-2xl p-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-violet-100 rounded-xl flex items-center justify-center">
                <i class="fas fa-lock text-violet-600"></i>
            </div>
            <div>
                <p class="font-medium text-violet-900">Privacy-First</p>
                <p class="text-xs text-violet-600">No cameras • Local processing</p>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Activity</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Sensors</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-violet-600 text-2xl"></i>
                <span class="text-xs text-violet-600 font-medium mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
