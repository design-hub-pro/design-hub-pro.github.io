<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0">
    <title>Home - GuardianSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow-x: hidden; }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .pulse-ring { animation: pulse-ring 2s ease-out infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-6">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">Mom's Home</h1>
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=face" class="w-12 h-12 rounded-full object-cover">
        </div>
    </div>

    <!-- Main Status Circle -->
    <div class="px-6 py-8">
        <div class="flex flex-col items-center">
            <div class="relative">
                <!-- Pulse rings -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-48 h-48 rounded-full bg-emerald-500/20 pulse-ring"></div>
                </div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-48 h-48 rounded-full bg-emerald-500/10 pulse-ring" style="animation-delay: 0.5s;"></div>
                </div>
                <!-- Main circle -->
                <div class="w-48 h-48 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-xl relative">
                    <div class="text-center text-white">
                        <i class="fas fa-shield-heart text-5xl mb-2"></i>
                        <p class="text-xl font-bold">All Safe</p>
                    </div>
                </div>
            </div>
            <p class="text-gray-400 mt-6">Last activity 5 min ago</p>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="px-6">
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <div class="w-12 h-12 bg-violet-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-satellite-dish text-violet-600 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">4</p>
                <p class="text-xs text-gray-400">Sensors</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-bell-slash text-emerald-600 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">0</p>
                <p class="text-xs text-gray-400">Alerts</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-calendar-check text-blue-600 text-xl"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">7</p>
                <p class="text-xs text-gray-400">Days Safe</p>
            </div>
        </div>
    </div>

    <!-- Room Status -->
    <div class="px-6 py-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Rooms</h2>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-couch text-blue-600"></i>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                    </div>
                </div>
                <p class="font-medium text-gray-900">Living Room</p>
                <p class="text-xs text-gray-400">Active now</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-utensils text-amber-600"></i>
                    </div>
                    <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
                </div>
                <p class="font-medium text-gray-900">Kitchen</p>
                <p class="text-xs text-gray-400">32 min ago</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bed text-indigo-600"></i>
                    </div>
                    <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
                </div>
                <p class="font-medium text-gray-900">Bedroom</p>
                <p class="text-xs text-gray-400">2 hr ago</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <div class="w-10 h-10 bg-teal-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bath text-teal-600"></i>
                    </div>
                    <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
                </div>
                <p class="font-medium text-gray-900">Bathroom</p>
                <p class="text-xs text-gray-400">1 hr ago</p>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-violet-600 text-2xl"></i>
                <span class="text-xs text-violet-600 font-medium mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Activity</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Sensors</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
