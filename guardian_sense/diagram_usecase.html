<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianSense - Use Case Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        svg {
            width: 100%;
            height: 750px;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <defs>
                <linearGradient id="systemBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="useCaseGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
                </filter>
            </defs>

            <!-- Title -->
            <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e3a5f">
                GuardianSense Use Case Diagram
            </text>
            <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">
                AI-Powered Ambient Fall Detection System
            </text>

            <!-- System Boundary -->
            <rect x="280" y="90" width="640" height="560" rx="20" fill="url(#systemBg)" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5"/>
            <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">
                GuardianSense System
            </text>

            <!-- Actor: Senior Resident -->
            <g transform="translate(80, 200)">
                <circle cx="50" cy="25" r="22" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
                <line x1="50" y1="47" x2="50" y2="95" stroke="#475569" stroke-width="2.5"/>
                <line x1="20" y1="65" x2="80" y2="65" stroke="#475569" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="25" y2="140" stroke="#475569" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="75" y2="140" stroke="#475569" stroke-width="2.5"/>
                <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Senior</text>
                <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Resident</text>
            </g>

            <!-- Actor: Family Member -->
            <g transform="translate(80, 420)">
                <circle cx="50" cy="25" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
                <line x1="50" y1="47" x2="50" y2="95" stroke="#d97706" stroke-width="2.5"/>
                <line x1="20" y1="65" x2="80" y2="65" stroke="#d97706" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="25" y2="140" stroke="#d97706" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="75" y2="140" stroke="#d97706" stroke-width="2.5"/>
                <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Family</text>
                <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b45309">Member</text>
            </g>

            <!-- Actor: Emergency Services -->
            <g transform="translate(1030, 200)">
                <circle cx="50" cy="25" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
                <line x1="50" y1="47" x2="50" y2="95" stroke="#dc2626" stroke-width="2.5"/>
                <line x1="20" y1="65" x2="80" y2="65" stroke="#dc2626" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="25" y2="140" stroke="#dc2626" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="75" y2="140" stroke="#dc2626" stroke-width="2.5"/>
                <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Emergency</text>
                <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b91c1c">Services</text>
            </g>

            <!-- Actor: Caregiver -->
            <g transform="translate(1030, 420)">
                <circle cx="50" cy="25" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
                <line x1="50" y1="47" x2="50" y2="95" stroke="#16a34a" stroke-width="2.5"/>
                <line x1="20" y1="65" x2="80" y2="65" stroke="#16a34a" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="25" y2="140" stroke="#16a34a" stroke-width="2.5"/>
                <line x1="50" y1="95" x2="75" y2="140" stroke="#16a34a" stroke-width="2.5"/>
                <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Care</text>
                <text x="50" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#15803d">Provider</text>
            </g>

            <!-- Use Cases -->
            <!-- UC1: Fall Detection -->
            <ellipse cx="460" cy="180" rx="130" ry="40" fill="url(#useCaseGrad4)" filter="url(#shadow)"/>
            <text x="460" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Detect Fall Event</text>
            <text x="460" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">(AI-Powered)</text>

            <!-- UC2: Send Alert -->
            <ellipse cx="740" cy="180" rx="130" ry="40" fill="url(#useCaseGrad4)" filter="url(#shadow)"/>
            <text x="740" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Send Emergency</text>
            <text x="740" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fecaca">Alert</text>

            <!-- UC3: Monitor Activity -->
            <ellipse cx="460" cy="280" rx="130" ry="40" fill="url(#useCaseGrad)" filter="url(#shadow)"/>
            <text x="460" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Monitor Daily</text>
            <text x="460" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">Activity</text>

            <!-- UC4: View Dashboard -->
            <ellipse cx="740" cy="280" rx="130" ry="40" fill="url(#useCaseGrad)" filter="url(#shadow)"/>
            <text x="740" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">View Real-Time</text>
            <text x="740" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">Dashboard</text>

            <!-- UC5: View History -->
            <ellipse cx="460" cy="380" rx="130" ry="40" fill="url(#useCaseGrad2)" filter="url(#shadow)"/>
            <text x="460" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">View Incident</text>
            <text x="460" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">History</text>

            <!-- UC6: Manage Devices -->
            <ellipse cx="740" cy="380" rx="130" ry="40" fill="url(#useCaseGrad2)" filter="url(#shadow)"/>
            <text x="740" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Manage Sensor</text>
            <text x="740" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a7f3d0">Devices</text>

            <!-- UC7: Configure Settings -->
            <ellipse cx="460" cy="480" rx="130" ry="40" fill="url(#useCaseGrad3)" filter="url(#shadow)"/>
            <text x="460" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Configure Alert</text>
            <text x="460" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">Settings</text>

            <!-- UC8: Manage Contacts -->
            <ellipse cx="740" cy="480" rx="130" ry="40" fill="url(#useCaseGrad3)" filter="url(#shadow)"/>
            <text x="740" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Manage Emergency</text>
            <text x="740" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7">Contacts</text>

            <!-- UC9: Receive Notifications -->
            <ellipse cx="600" cy="575" rx="140" ry="40" fill="url(#useCaseGrad)" filter="url(#shadow)"/>
            <text x="600" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Receive Push</text>
            <text x="600" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">Notifications</text>

            <!-- Connection Lines -->
            <!-- Senior to Use Cases -->
            <line x1="155" y1="280" x2="330" y2="200" stroke="#64748b" stroke-width="2"/>
            <line x1="155" y1="300" x2="330" y2="280" stroke="#64748b" stroke-width="2"/>

            <!-- Family to Use Cases -->
            <line x1="155" y1="500" x2="330" y2="380" stroke="#d97706" stroke-width="2"/>
            <line x1="155" y1="520" x2="330" y2="480" stroke="#d97706" stroke-width="2"/>
            <line x1="155" y1="540" x2="460" y2="575" stroke="#d97706" stroke-width="2"/>
            <line x1="155" y1="480" x2="330" y2="280" stroke="#d97706" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="155" y1="490" x2="610" y2="380" stroke="#d97706" stroke-width="2"/>

            <!-- Emergency to Use Cases -->
            <line x1="1030" y1="280" x2="870" y2="200" stroke="#dc2626" stroke-width="2"/>
            <line x1="1030" y1="300" x2="740" y2="575" stroke="#dc2626" stroke-width="2"/>

            <!-- Caregiver to Use Cases -->
            <line x1="1030" y1="500" x2="870" y2="280" stroke="#16a34a" stroke-width="2"/>
            <line x1="1030" y1="510" x2="870" y2="380" stroke="#16a34a" stroke-width="2"/>
            <line x1="1030" y1="520" x2="740" y2="575" stroke="#16a34a" stroke-width="2"/>

            <!-- Include/Extend relationships -->
            <line x1="590" y1="180" x2="610" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
            <text x="600" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">«include»</text>

            <!-- Legend -->
            <rect x="300" y="630" width="600" height="55" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
            <text x="600" y="652" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">LEGEND</text>

            <circle cx="340" cy="670" r="6" fill="#ef4444"/>
            <text x="355" y="674" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Critical Alert</text>

            <circle cx="460" cy="670" r="6" fill="#3b82f6"/>
            <text x="475" y="674" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Monitoring</text>

            <circle cx="570" cy="670" r="6" fill="#10b981"/>
            <text x="585" y="674" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Management</text>

            <circle cx="690" cy="670" r="6" fill="#f59e0b"/>
            <text x="705" y="674" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Configuration</text>

            <line x1="800" y1="670" x2="830" y2="670" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
            <text x="840" y="674" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Relationship</text>
        </svg>
    </div>
</body>
</html>
