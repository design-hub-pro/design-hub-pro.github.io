<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0">
    <title>Sensors - GuardianSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-5 border-b border-gray-100">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">Sensors</h1>
            <button class="w-10 h-10 bg-violet-600 rounded-full flex items-center justify-center">
                <i class="fas fa-plus text-white"></i>
            </button>
        </div>
    </div>

    <!-- Status Pills -->
    <div class="px-6 py-4 flex gap-3">
        <div class="flex items-center gap-2 bg-emerald-50 px-4 py-2 rounded-full">
            <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
            <span class="text-sm text-emerald-700 font-medium">4 Online</span>
        </div>
        <div class="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full">
            <div class="w-2 h-2 bg-gray-400 rounded-full"></div>
            <span class="text-sm text-gray-500 font-medium">0 Offline</span>
        </div>
    </div>

    <!-- Floor Plan -->
    <div class="px-6">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <div class="bg-gray-50 rounded-xl p-4 relative" style="height: 220px;">
                <!-- Living Room -->
                <div class="absolute top-3 left-3 w-28 h-24 bg-blue-50 rounded-xl border-2 border-blue-200 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center mb-1">
                        <i class="fas fa-couch text-blue-600 text-sm"></i>
                    </div>
                    <span class="text-xs text-blue-700 font-medium">Living</span>
                    <div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></div>
                </div>

                <!-- Kitchen -->
                <div class="absolute top-3 right-3 w-28 h-24 bg-amber-50 rounded-xl border-2 border-amber-200 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center mb-1">
                        <i class="fas fa-utensils text-amber-600 text-sm"></i>
                    </div>
                    <span class="text-xs text-amber-700 font-medium">Kitchen</span>
                    <div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></div>
                </div>

                <!-- Bedroom -->
                <div class="absolute bottom-3 left-3 w-28 h-24 bg-indigo-50 rounded-xl border-2 border-indigo-200 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 bg-indigo-100 rounded-lg flex items-center justify-center mb-1">
                        <i class="fas fa-bed text-indigo-600 text-sm"></i>
                    </div>
                    <span class="text-xs text-indigo-700 font-medium">Bedroom</span>
                    <div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></div>
                </div>

                <!-- Bathroom -->
                <div class="absolute bottom-3 right-3 w-28 h-24 bg-teal-50 rounded-xl border-2 border-teal-200 flex flex-col items-center justify-center">
                    <div class="w-8 h-8 bg-teal-100 rounded-lg flex items-center justify-center mb-1">
                        <i class="fas fa-bath text-teal-600 text-sm"></i>
                    </div>
                    <span class="text-xs text-teal-700 font-medium">Bathroom</span>
                    <div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sensor List -->
    <div class="px-6 py-5">
        <div class="space-y-3">
            <!-- Living Room -->
            <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-satellite-dish text-blue-600 text-lg"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium text-gray-900">Living Room</p>
                    <div class="flex items-center gap-3 mt-1">
                        <span class="text-xs text-gray-400"><i class="fas fa-wifi mr-1"></i>Strong</span>
                        <span class="text-xs text-gray-400"><i class="fas fa-battery-full mr-1"></i>98%</span>
                    </div>
                </div>
                <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            </div>

            <!-- Kitchen -->
            <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-satellite-dish text-amber-600 text-lg"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium text-gray-900">Kitchen</p>
                    <div class="flex items-center gap-3 mt-1">
                        <span class="text-xs text-gray-400"><i class="fas fa-wifi mr-1"></i>Good</span>
                        <span class="text-xs text-gray-400"><i class="fas fa-battery-full mr-1"></i>85%</span>
                    </div>
                </div>
                <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            </div>

            <!-- Bedroom -->
            <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-satellite-dish text-indigo-600 text-lg"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium text-gray-900">Bedroom</p>
                    <div class="flex items-center gap-3 mt-1">
                        <span class="text-xs text-gray-400"><i class="fas fa-wifi mr-1"></i>Strong</span>
                        <span class="text-xs text-gray-400"><i class="fas fa-battery-full mr-1"></i>92%</span>
                    </div>
                </div>
                <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            </div>

            <!-- Bathroom -->
            <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 bg-teal-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-satellite-dish text-teal-600 text-lg"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium text-gray-900">Bathroom</p>
                    <div class="flex items-center gap-3 mt-1">
                        <span class="text-xs text-gray-400"><i class="fas fa-wifi mr-1"></i>Good</span>
                        <span class="text-xs text-emerald-500"><i class="fas fa-battery-full mr-1"></i>100%</span>
                    </div>
                </div>
                <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Activity</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-violet-600 text-2xl"></i>
                <span class="text-xs text-violet-600 font-medium mt-1">Sensors</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
