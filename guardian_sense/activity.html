<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0">
    <title>Activity - GuardianSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-5 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Activity</h1>
        <div class="flex gap-2">
            <button class="px-5 py-2 bg-violet-600 text-white rounded-full text-sm font-medium">Today</button>
            <button class="px-5 py-2 bg-gray-100 text-gray-500 rounded-full text-sm font-medium">Week</button>
            <button class="px-5 py-2 bg-gray-100 text-gray-500 rounded-full text-sm font-medium">Month</button>
        </div>
    </div>

    <!-- Activity Score -->
    <div class="px-6 py-5">
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-white/70 text-sm mb-1">Activity Score</p>
                    <p class="text-5xl font-bold">87</p>
                </div>
                <div class="w-20 h-20 relative">
                    <svg class="w-20 h-20 transform -rotate-90">
                        <circle cx="40" cy="40" r="32" stroke="rgba(255,255,255,0.2)" stroke-width="8" fill="none"/>
                        <circle cx="40" cy="40" r="32" stroke="white" stroke-width="8" fill="none"
                            stroke-dasharray="201" stroke-dashoffset="26" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <i class="fas fa-heart-pulse text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Activity Chart -->
    <div class="px-6">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-end justify-between h-32 gap-3 mb-2">
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-200 rounded-lg" style="height: 35%"></div>
                    <span class="text-xs text-gray-400">6a</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-400 rounded-lg" style="height: 70%"></div>
                    <span class="text-xs text-gray-400">9a</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-600 rounded-lg" style="height: 90%"></div>
                    <span class="text-xs text-gray-400">12p</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-300 rounded-lg" style="height: 50%"></div>
                    <span class="text-xs text-gray-400">3p</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-500 rounded-lg" style="height: 65%"></div>
                    <span class="text-xs text-gray-400">6p</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-200 rounded-lg" style="height: 25%"></div>
                    <span class="text-xs text-gray-400">9p</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Room Time -->
    <div class="px-6 py-5">
        <h3 class="font-semibold text-gray-900 mb-4">Time by Room</h3>
        <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bed text-indigo-600"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">Bedroom</span>
                        <span class="text-sm text-gray-400">7h 45m</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full">
                        <div class="h-2 bg-indigo-500 rounded-full" style="width: 95%"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-couch text-blue-600"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">Living Room</span>
                        <span class="text-sm text-gray-400">4h 30m</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full">
                        <div class="h-2 bg-blue-500 rounded-full" style="width: 75%"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-utensils text-amber-600"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">Kitchen</span>
                        <span class="text-sm text-gray-400">2h 15m</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full">
                        <div class="h-2 bg-amber-500 rounded-full" style="width: 45%"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-teal-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bath text-teal-600"></i>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700">Bathroom</span>
                        <span class="text-sm text-gray-400">45m</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full">
                        <div class="h-2 bg-teal-500 rounded-full" style="width: 15%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-violet-600 text-2xl"></i>
                <span class="text-xs text-violet-600 font-medium mt-1">Activity</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Sensors</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-xs text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
