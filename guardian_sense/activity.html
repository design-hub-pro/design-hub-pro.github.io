<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0">
    <title>Activity - GuardianSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; margin: 0; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-3 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-6 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Activity Monitor</h1>

        <!-- Time Filter -->
        <div class="flex gap-2">
            <button class="px-4 py-2 bg-violet-600 text-white rounded-full text-sm font-medium">Today</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium">Week</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium">Month</button>
        </div>
    </div>

    <!-- Activity Summary Card -->
    <div class="px-6 py-5">
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-5 text-white">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <p class="text-white/80 text-sm">Activity Score</p>
                    <p class="text-4xl font-bold">87<span class="text-xl">/100</span></p>
                </div>
                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-heart-pulse text-3xl"></i>
                </div>
            </div>
            <p class="text-white/90 text-sm"><i class="fas fa-arrow-up mr-1"></i>5% higher than last week</p>
        </div>
    </div>

    <!-- Activity Chart -->
    <div class="px-6">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <h3 class="font-semibold text-gray-900 mb-4">Daily Activity Pattern</h3>

            <!-- Simple bar chart -->
            <div class="flex items-end justify-between h-36 gap-2">
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-200 rounded-t-lg" style="height: 40%"></div>
                    <span class="text-xs text-gray-500">6AM</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-400 rounded-t-lg" style="height: 70%"></div>
                    <span class="text-xs text-gray-500">9AM</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-500 rounded-t-lg" style="height: 85%"></div>
                    <span class="text-xs text-gray-500">12PM</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-300 rounded-t-lg" style="height: 55%"></div>
                    <span class="text-xs text-gray-500">3PM</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-400 rounded-t-lg" style="height: 65%"></div>
                    <span class="text-xs text-gray-500">6PM</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-violet-200 rounded-t-lg" style="height: 30%"></div>
                    <span class="text-xs text-gray-500">9PM</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Room Activity -->
    <div class="px-6 py-5">
        <h3 class="font-semibold text-gray-900 mb-4">Room Activity</h3>

        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-utensils text-amber-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">Kitchen</span>
                    </div>
                    <span class="text-sm text-gray-500">2h 15m</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-amber-500 h-2 rounded-full" style="width: 45%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-couch text-blue-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">Living Room</span>
                    </div>
                    <span class="text-sm text-gray-500">4h 30m</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-blue-500 h-2 rounded-full" style="width: 75%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-bed text-indigo-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">Bedroom</span>
                    </div>
                    <span class="text-sm text-gray-500">7h 45m</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-indigo-500 h-2 rounded-full" style="width: 95%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-teal-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-bath text-teal-600"></i>
                        </div>
                        <span class="font-medium text-gray-900">Bathroom</span>
                    </div>
                    <span class="text-sm text-gray-500">45m</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-teal-500 h-2 rounded-full" style="width: 15%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-28"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-violet-600 text-2xl"></i>
                <span class="text-sm text-violet-600 font-medium mt-1">Activity</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Sensors</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
