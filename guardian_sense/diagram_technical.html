<!DOCTYPE html>
<html lang="en">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .diagram-container {
            width: 95%;
            max-width: 1400px;
            background: white;
            padding: 30px;
        }
        svg {
            width: 100%;
            height: 900px;

<body>
    <div class="diagram-container">

            <!-- Title -->
