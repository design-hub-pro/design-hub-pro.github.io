<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Tue, Nov 17 · <i class="fa-solid fa-cloud-sun text-amber-400"></i> 58°F</div><h1 class="text-[28px] font-extrabold tracking-tight">Morning, Coach</h1></div>
    <div class="relative"><img src="img/av2.jpg" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow"><span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full g-grass border-2 border-white"></span></div>
  </div>
  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[270px]">
    <img src="img/course.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,11,.1) 10%,rgba(7,17,11,.92))"></div>
    <div class="absolute top-4 left-4 chip bg-white/15 backdrop-blur text-white"><span class="dot g-live"></span>Cart paired · 84%</div>
    <div class="absolute bottom-5 left-5 right-5 text-white">
      <div class="text-[13px] text-white/60 font-semibold">Next sweep</div>
      <div class="text-[24px] font-bold leading-tight">Range, left rough</div>
      <div class="mt-3 flex items-center justify-between">
        <div class="flex gap-2"><span class="chip bg-white/15"><span class="dot bg-red-500"></span><span class="num">3</span> hot zones</span><span class="chip bg-white/15"><i class="fa-regular fa-clock"></i>~<span class="num">25</span> min</span></div>
        <div class="w-16 h-16 rounded-full grad-lime text-[#0F1A14] flex items-center justify-center text-[24px] shadow-xl"><i class="fa-solid fa-crosshairs"></i></div>
      </div>
    </div>
  </div>
  <div class="mt-4 grid grid-cols-2 gap-4">
    <div class="card p-5"><div class="label">This week</div><div class="num text-[36px] font-bold leading-none mt-2">412</div><div class="text-[13px] text-gray-500 mt-1">balls recovered</div>
      <div class="mt-3 flex items-end gap-1.5 h-10">
        <span class="flex-1 rounded bg-[#D7EED9]" style="height:40%"></span><span class="flex-1 rounded bg-[#D7EED9]" style="height:65%"></span><span class="flex-1 rounded bg-[#D7EED9]" style="height:30%"></span><span class="flex-1 rounded bg-[#D7EED9]" style="height:80%"></span><span class="flex-1 rounded grad-brand" style="height:100%"></span><span class="flex-1 rounded bg-[#EEF1EC]" style="height:15%"></span><span class="flex-1 rounded bg-[#EEF1EC]" style="height:15%"></span>
      </div></div>
    <div class="card p-5"><div class="label">Per sweep</div><div class="num text-[36px] font-bold leading-none mt-2">2.1<span class="text-[16px] text-gray-400">/min</span></div><div class="text-[13px] text-gray-500 mt-1">avg find rate</div>
      <div class="mt-4 flex items-center gap-2 text-[13px] font-semibold text-[#14945A]"><i class="fa-solid fa-arrow-trend-up"></i><span class="num">+18%</span> vs last week</div></div>
  </div>
  <div class="mt-6 flex items-center justify-between"><div class="text-[18px] font-bold">Recent sweeps</div><div class="text-[14px] font-semibold text-[#14945A]">All</div></div>
  <div class="mt-3 hscroll pb-2">
    <div class="w-[230px] shrink-0 card overflow-hidden"><div class="h-[110px] relative"><img src="img/aerial.jpg" class="w-full h-full object-cover"><div class="absolute bottom-2 right-2 chip bg-black/60 text-white !text-[11px] !py-1">22 min</div></div>
      <div class="p-4"><div class="font-bold">Hole 7 tree line</div><div class="flex items-center justify-between mt-1"><span class="text-[13px] text-gray-500">Yesterday</span><span class="num font-bold text-[18px]">68</span></div></div></div>
    <div class="w-[230px] shrink-0 card overflow-hidden"><div class="h-[110px] relative"><img src="img/wedge.jpg" class="w-full h-full object-cover"><div class="absolute bottom-2 right-2 chip bg-black/60 text-white !text-[11px] !py-1">31 min</div></div>
      <div class="p-4"><div class="font-bold">Range, right rough</div><div class="flex items-center justify-between mt-1"><span class="text-[13px] text-gray-500">Sun</span><span class="num font-bold text-[18px]">94</span></div></div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab active"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map-location-dot"></i>Zones</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-crosshairs"></i></div></div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Stats</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
