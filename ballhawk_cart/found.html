<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Ball Found</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body style="background:#07110B"><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="absolute inset-0 grad-ink"></div>
<div class="absolute inset-x-0 top-0 h-[430px] overflow-hidden"><img src="img/ball_low.jpg" class="w-full h-full object-cover" style="filter:brightness(.55)"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,11,.2),#07110B)"></div></div>
<div class="absolute top-[72px] left-7 right-7 flex justify-between items-center text-white">
  <div class="chip grad-lime text-[#0F1A14]"><i class="fa-solid fa-volume-high"></i>Beep · Ball #24</div>
  <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
</div>
<!-- pointer -->
<div class="absolute left-1/2 -translate-x-1/2 top-[150px] w-[300px] h-[300px]">
  <div class="absolute inset-0 rounded-full border border-white/10"></div>
  <div class="absolute inset-[40px] rounded-full border border-white/15"></div>
  <div class="absolute inset-[80px] rounded-full border border-white/20"></div>
  <div class="absolute inset-0 rounded-full" style="background:conic-gradient(from 320deg,rgba(198,244,50,.0),rgba(198,244,50,.45) 40deg,rgba(198,244,50,0) 41deg)"></div>
  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full grad-lime flex items-center justify-center shadow-[0_0_60px_rgba(198,244,50,.5)]" style="transform:translate(-50%,-50%) rotate(-30deg)"><i class="fa-solid fa-location-arrow text-[#0F1A14] text-[38px]" style="transform:rotate(-45deg)"></i></div>
  <div class="absolute w-5 h-5 rounded-full bg-white shadow-[0_0_20px_white]" style="left:62px;top:28px"></div>
</div>
<div class="absolute left-7 right-7 top-[480px] text-white text-center">
  <div class="num text-[64px] font-bold leading-none">2.4<span class="text-[24px] text-white/50 ml-1">m</span></div>
  <div class="mt-2 text-[17px] text-white/70"><span class="font-bold text-white">30° left</span>, under leaf cover</div>
  <div class="mt-5 flex justify-center gap-2">
    <span class="chip glass"><span class="dot g-leaf"></span>Leaves</span>
    <span class="chip glass"><i class="fa-solid fa-bullseye text-[#C6F432]"></i><span class="num">88%</span> sure</span>
    <span class="chip glass"><i class="fa-solid fa-location-dot"></i>Zone B</span>
  </div>
</div>
<div class="absolute left-7 right-7 bottom-[40px] text-white">
  <div class="glass rounded-3xl p-4 flex items-center gap-4">
    <img src="img/ball_low.jpg" class="w-16 h-16 rounded-2xl object-cover">
    <div class="flex-1"><div class="font-bold text-[15px]">Snapshot saved</div><div class="text-[13px] text-white/60">Pinned to the recovery map</div></div>
    <i class="fa-solid fa-map-pin text-[#C6F432]"></i>
  </div>
  <div class="mt-4 flex gap-3">
    <div class="w-[120px] btn glass">Not a ball</div>
    <div class="flex-1 btn grad-lime text-[#0F1A14]"><i class="fa-solid fa-hand"></i>Picked up</div>
  </div>
</div>
<div class="home-ind light"></div>
</div></body></html>
