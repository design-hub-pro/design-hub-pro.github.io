<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Live Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body style="background:#07110B"><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="absolute inset-0"><img src="img/wedge.jpg" class="w-full h-full object-cover" style="object-position:30% 50%;filter:saturate(1.1)"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,11,.7) 0%,rgba(7,17,11,0) 22%,rgba(7,17,11,0) 55%,rgba(7,17,11,.95) 82%)"></div></div>
<!-- top HUD -->
<div class="absolute top-[70px] left-7 right-7 flex items-center justify-between text-white z-10">
  <div class="chip glass"><span class="relative flex w-2 h-2"><span class="absolute inset-0 rounded-full bg-red-500 ping"></span><span class="relative w-2 h-2 rounded-full bg-red-500"></span></span>SCANNING · <span class="num">12:48</span></div>
  <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-volume-high text-[14px]"></i></div>
</div>
<!-- detection boxes -->
<div class="absolute" style="left:206px;top:330px;width:96px;height:96px">
  <div class="absolute -inset-4 rounded-3xl border-2 border-[#C6F432]/40 ping"></div>
  <div class="absolute inset-0 rounded-2xl border-[3px] border-[#C6F432]"></div>
  <div class="absolute -top-9 left-0 chip grad-lime text-[#0F1A14] !py-1 !text-[12px] whitespace-nowrap"><i class="fa-solid fa-golf-ball-tee"></i><span class="num">94%</span> · grass</div>
</div>
<div class="absolute" style="left:356px;top:262px;width:40px;height:40px">
  <div class="absolute inset-0 rounded-xl border-2 border-dashed border-white/70"></div>
  <div class="absolute -top-7 -left-2 chip glass text-white !py-0.5 !px-2 !text-[10px]"><span class="num">61%</span></div>
</div>
<!-- bottom HUD -->
<div class="absolute left-7 right-7 bottom-[112px] text-white">
  <div class="flex items-end justify-between">
    <div><div class="text-[12px] font-semibold text-white/50 uppercase tracking-widest">Found</div><div class="num text-[64px] font-bold leading-none">23</div></div>
    <div class="text-right"><div class="flex justify-end gap-1">
      <span class="w-1.5 h-4 rounded bg-[#C6F432]"></span><span class="w-1.5 h-6 rounded bg-[#C6F432]"></span><span class="w-1.5 h-8 rounded bg-[#C6F432]"></span><span class="w-1.5 h-10 rounded bg-white/25"></span></div>
      <div class="text-[12px] text-white/60 mt-1.5">Pace <span class="num font-bold text-white">0.8</span> m/s · good</div></div>
  </div>
  <div class="mt-4 grid grid-cols-3 gap-2">
    <div class="glass rounded-2xl p-3"><div class="flex items-center gap-1.5 text-[11px] text-white/60"><span class="dot g-grass"></span>Grass</div><div class="num text-[22px] font-bold">14</div></div>
    <div class="glass rounded-2xl p-3"><div class="flex items-center gap-1.5 text-[11px] text-white/60"><span class="dot g-leaf"></span>Leaves</div><div class="num text-[22px] font-bold">6</div></div>
    <div class="glass rounded-2xl p-3"><div class="flex items-center gap-1.5 text-[11px] text-white/60"><span class="dot g-shade"></span>Shade</div><div class="num text-[22px] font-bold">3</div></div>
  </div>
  <div class="mt-4 flex gap-3">
    <div class="flex-1 btn glass text-white"><i class="fa-solid fa-pause"></i>Pause</div>
    <div class="flex-1 btn bg-white text-[#0F1A14]"><i class="fa-solid fa-flag-checkered"></i>End sweep</div>
  </div>
</div>
<div class="tab-bar dark"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map-location-dot"></i>Zones</div><div class="tab"><div class="tab-scan" style="background:linear-gradient(140deg,#D9FB5B,#A3E635);color:#0F1A14"><i class="fa-solid fa-crosshairs"></i></div></div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Stats</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div>
<div class="home-ind light"></div>
</div></body></html>
