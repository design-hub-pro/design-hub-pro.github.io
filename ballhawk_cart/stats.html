<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Sweep Summary</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
    <div class="font-bold">Sweep summary</div>
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket text-[14px]"></i></div>
  </div>
  <div class="mt-5 rounded-[28px] grad-ink text-white p-6 relative overflow-hidden">
    <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full" style="background:radial-gradient(circle,rgba(198,244,50,.35),transparent 70%)"></div>
    <div class="text-[13px] text-white/50 font-semibold">Range, left rough · 31 min</div>
    <div class="mt-2 flex items-end gap-3"><div class="num text-[72px] font-bold leading-none">47</div><div class="pb-2 text-white/60 text-[15px]">balls<br>recovered</div></div>
    <div class="mt-5 grid grid-cols-3 gap-2">
      <div class="glass rounded-2xl p-3"><div class="num text-[22px] font-bold">1.5</div><div class="text-[11px] text-white/50">per min</div></div>
      <div class="glass rounded-2xl p-3"><div class="num text-[22px] font-bold">1.4<span class="text-[12px]">km</span></div><div class="text-[11px] text-white/50">walked</div></div>
      <div class="glass rounded-2xl p-3"><div class="num text-[22px] font-bold">4</div><div class="text-[11px] text-white/50">false alarms</div></div>
    </div>
  </div>
  <div class="mt-4 card p-5">
    <div class="flex items-center justify-between"><div class="font-bold text-[16px]">Where they hid</div><span class="text-[12px] text-gray-400">47 finds</span></div>
    <div class="mt-4 flex h-4 rounded-full overflow-hidden gap-1"><span class="g-grass" style="width:55%"></span><span class="g-leaf" style="width:30%"></span><span class="g-shade" style="width:15%"></span></div>
    <div class="mt-4 space-y-3">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center"><i class="fa-solid fa-seedling"></i></div><div class="flex-1 font-semibold">Deep grass</div><div class="num font-bold text-[18px]">26</div></div>
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center"><i class="fa-solid fa-leaf"></i></div><div class="flex-1 font-semibold">Under leaves</div><div class="num font-bold text-[18px]">14</div></div>
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center"><i class="fa-solid fa-tree"></i></div><div class="flex-1 font-semibold">Tree shade</div><div class="num font-bold text-[18px]">7</div></div>
    </div>
  </div>
  <div class="mt-4 card p-5">
    <div class="flex items-center justify-between"><div class="font-bold text-[16px]">Finds over time</div><span class="chip bg-[#EAF6EE] text-[#14945A] !py-1">5-min bins</span></div>
    <div class="mt-4 flex items-end gap-2 h-24">
      <div class="flex-1 rounded-lg grad-brand" style="height:55%"></div><div class="flex-1 rounded-lg grad-brand" style="height:90%"></div><div class="flex-1 rounded-lg grad-brand" style="height:100%"></div><div class="flex-1 rounded-lg grad-brand" style="height:70%"></div><div class="flex-1 rounded-lg grad-brand" style="height:45%"></div><div class="flex-1 rounded-lg grad-brand" style="height:30%"></div><div class="flex-1 rounded-lg bg-[#D7EED9]" style="height:12%"></div>
    </div>
    <div class="mt-2 flex justify-between text-[11px] text-gray-400 num"><span>0</span><span>10</span><span>20</span><span>31 min</span></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map-location-dot"></i>Zones</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-crosshairs"></i></div></div><div class="tab active"><i class="fa-solid fa-chart-simple"></i>Stats</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
