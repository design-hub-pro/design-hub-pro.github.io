<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body style="background:#07110B"><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="absolute inset-0"><img src="img/ball_low.jpg" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,11,.35) 0%,rgba(7,17,11,0) 30%,rgba(7,17,11,.75) 58%,#07110B 78%)"></div></div>
<!-- detection box over the ball -->
<div class="absolute" style="left:196px;top:272px;width:84px;height:84px">
  <div class="absolute inset-0 rounded-2xl border-[3px] border-[#C6F432]"></div>
  <div class="absolute -top-8 left-0 chip grad-lime text-[#0F1A14] !py-1 !text-[11px]"><i class="fa-solid fa-golf-ball-tee"></i><span class="num">96%</span></div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-7 pb-14 text-white">
  <div class="w-14 h-14 rounded-2xl grad-brand flex items-center justify-center text-[24px] shadow-lg"><i class="fa-solid fa-crosshairs"></i></div>
  <h1 class="mt-6 text-[38px] leading-[1.05] font-extrabold tracking-tight">See the rough<br>from ball height.</h1>
  <p class="mt-4 text-[16px] text-white/70 leading-relaxed">Clip your phone low on a pushcart. Walk the rough. BallHawk beeps and points when it spots a ball.</p>
  <div class="mt-7 flex gap-3">
    <div class="flex-1 glass rounded-2xl p-4"><i class="fa-solid fa-mobile-screen text-[#C6F432]"></i><div class="mt-2 text-[13px] font-semibold">Clip low</div></div>
    <div class="flex-1 glass rounded-2xl p-4"><i class="fa-solid fa-person-walking text-[#C6F432]"></i><div class="mt-2 text-[13px] font-semibold">Push slow</div></div>
    <div class="flex-1 glass rounded-2xl p-4"><i class="fa-solid fa-volume-high text-[#C6F432]"></i><div class="mt-2 text-[13px] font-semibold">Hear beep</div></div>
  </div>
  <div class="mt-7 btn grad-lime text-[#0F1A14]">Set up my cart<i class="fa-solid fa-arrow-right"></i></div>
  <div class="mt-4 text-center text-[14px] text-white/60">Join a team with a code</div>
</div>
<div class="home-ind light"></div>
</div></body></html>
