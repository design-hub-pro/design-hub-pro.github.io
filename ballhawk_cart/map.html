<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Recovery Zones</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="absolute inset-x-0 top-0 h-[600px] overflow-hidden">
  <svg viewBox="0 0 460 600" class="w-full h-full block" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="hot"><stop offset="0" stop-color="#EF4444" stop-opacity=".75"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></radialGradient>
      <radialGradient id="warm"><stop offset="0" stop-color="#F59E0B" stop-opacity=".7"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
      <radialGradient id="cool"><stop offset="0" stop-color="#6366F1" stop-opacity=".55"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
      <pattern id="tex" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#5E9B45" stroke-width=".6" opacity=".35"/></pattern>
    </defs>
    <rect width="460" height="600" fill="#6FA956"/>
    <rect width="460" height="600" fill="url(#tex)"/>
    <!-- fairway -->
    <path d="M150 600 C140 480 190 380 230 300 C270 220 260 140 300 60 L380 60 C350 150 360 240 320 320 C280 400 260 500 280 600 Z" fill="#9BD07A"/>
    <!-- range mats -->
    <rect x="160" y="560" width="140" height="22" rx="6" fill="#E9F3E0"/>
    <!-- trees -->
    <g fill="#2F6B3A"><circle cx="60" cy="140" r="26"/><circle cx="96" cy="176" r="20"/><circle cx="42" cy="210" r="22"/><circle cx="410" cy="380" r="24"/><circle cx="430" cy="430" r="18"/><circle cx="70" cy="420" r="20"/></g>
    <!-- bunker -->
    <ellipse cx="350" cy="250" rx="30" ry="16" fill="#F3E6C2"/>
    <!-- pond -->
    <path d="M60 300 C90 280 140 300 130 340 C120 380 60 370 50 340 Z" fill="#5BB3D9"/>
    <!-- heat -->
    <circle cx="90" cy="190" r="80" fill="url(#hot)"/>
    <circle cx="380" cy="400" r="70" fill="url(#warm)"/>
    <circle cx="110" cy="440" r="60" fill="url(#warm)"/>
    <circle cx="360" cy="140" r="50" fill="url(#cool)"/>
    <!-- route -->
    <path d="M200 560 C140 520 80 480 100 430 C120 380 60 330 70 260 C80 210 100 170 120 150" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    <g fill="#fff" stroke="#0F1A14" stroke-width="2"><circle cx="84" cy="200" r="5"/><circle cx="102" cy="176" r="5"/><circle cx="70" cy="182" r="5"/><circle cx="96" cy="214" r="5"/><circle cx="112" cy="430" r="5"/><circle cx="96" cy="452" r="5"/><circle cx="372" cy="392" r="5"/><circle cx="392" cy="414" r="5"/></g>
    <!-- labels -->
    <g font-family="Space Grotesk" font-weight="700" font-size="13">
      <rect x="128" y="168" width="68" height="28" rx="14" fill="#EF4444"/><text x="162" y="187" text-anchor="middle" fill="#fff">A · 41</text>
      <rect x="296" y="420" width="68" height="28" rx="14" fill="#F59E0B"/><text x="330" y="439" text-anchor="middle" fill="#fff">B · 26</text>
      <rect x="140" y="452" width="68" height="28" rx="14" fill="#F59E0B"/><text x="174" y="471" text-anchor="middle" fill="#fff">C · 19</text>
      <rect x="380" y="118" width="60" height="28" rx="14" fill="#6366F1"/><text x="410" y="137" text-anchor="middle" fill="#fff">D · 8</text>
    </g>
    <!-- cart -->
    <circle cx="200" cy="560" r="16" fill="#C6F432" opacity=".4"/><circle cx="200" cy="560" r="9" fill="#0B7A47" stroke="#fff" stroke-width="3"/>
  </svg>
</div>
<div class="absolute top-[70px] left-7 right-7 flex items-center gap-3 z-10">
  <div class="flex-1 h-12 rounded-2xl bg-white/95 backdrop-blur shadow flex items-center px-4 gap-3"><i class="fa-solid fa-flag text-[#14945A]"></i><span class="font-bold text-[15px]">Oak Hills Range</span><i class="fa-solid fa-chevron-down text-[11px] text-gray-400 ml-auto"></i></div>
  <div class="w-12 h-12 rounded-2xl bg-white/95 shadow flex items-center justify-center"><i class="fa-solid fa-layer-group"></i></div>
</div>
<div class="absolute top-[132px] left-7 flex gap-2 z-10">
  <span class="chip bg-white/95 shadow"><span class="dot bg-red-500"></span>Hot</span><span class="chip bg-white/95 shadow"><span class="dot bg-amber-500"></span>Warm</span><span class="chip bg-white/95 shadow"><span class="dot bg-indigo-500"></span>Cleared</span>
</div>
<!-- sheet -->
<div class="absolute left-0 right-0 bottom-[90px] bg-white rounded-t-[32px] px-7 pt-3 pb-5 shadow-[0_-12px_30px_-12px_rgba(0,0,0,.25)]" style="height:340px">
  <div class="w-10 h-1.5 rounded-full bg-gray-200 mx-auto"></div>
  <div class="mt-4 flex items-center justify-between">
    <div><div class="label">Top zone</div><div class="text-[22px] font-bold">A · Left tree line</div></div>
    <div class="text-right"><div class="num text-[32px] font-bold leading-none text-red-500">41</div><div class="text-[12px] text-gray-400">est. balls</div></div>
  </div>
  <div class="mt-3 flex items-center gap-3">
    <div class="flex-1 bar"><span class="bg-red-500" style="width:72%"></span></div><span class="text-[12px] font-semibold text-gray-500">swept <span class="num">3</span> days ago</span>
  </div>
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="rounded-2xl bg-[#F4F6F1] p-3"><span class="dot g-grass"></span><div class="num text-[20px] font-bold mt-1">48%</div><div class="text-[11px] text-gray-400">grass</div></div>
    <div class="rounded-2xl bg-[#F4F6F1] p-3"><span class="dot g-leaf"></span><div class="num text-[20px] font-bold mt-1">39%</div><div class="text-[11px] text-gray-400">leaves</div></div>
    <div class="rounded-2xl bg-[#F4F6F1] p-3"><span class="dot g-shade"></span><div class="num text-[20px] font-bold mt-1">13%</div><div class="text-[11px] text-gray-400">shade</div></div>
  </div>
  <div class="mt-4 btn grad-brand text-white"><i class="fa-solid fa-route"></i>Start sweep here</div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab active"><i class="fa-solid fa-map-location-dot"></i>Zones</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-crosshairs"></i></div></div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Stats</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
