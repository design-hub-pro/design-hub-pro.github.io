<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Team</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Westlake HS Golf</div><h1 class="text-[28px] font-extrabold tracking-tight">Team sweeps</h1></div>
    <div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-user-plus text-[15px]"></i></div>
  </div>
  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[220px]">
    <img src="img/swing.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,11,0) 20%,rgba(7,17,11,.9))"></div>
    <div class="absolute bottom-5 left-5 right-5 text-white flex items-end justify-between">
      <div><div class="text-[13px] text-white/60 font-semibold">Season total</div><div class="num text-[40px] font-bold leading-none mt-1">2,860</div><div class="text-[13px] text-white/70 mt-1">balls back in the bucket</div></div>
      <div class="flex -space-x-3"><img src="img/av1.jpg" class="w-10 h-10 rounded-full border-2 border-white object-cover"><img src="img/av2.jpg" class="w-10 h-10 rounded-full border-2 border-white object-cover"><div class="w-10 h-10 rounded-full border-2 border-white grad-brand flex items-center justify-center text-[12px] font-bold num">+6</div></div>
    </div>
  </div>
  <div class="mt-4 card p-5">
    <div class="flex items-center justify-between"><div class="font-bold text-[16px]">Season goal</div><span class="num text-[14px] font-bold text-[#14945A]">2,860 / 4,000</span></div>
    <div class="bar mt-3 !h-3"><span class="grad-brand" style="width:71.5%"></span></div>
  </div>
  <div class="mt-6 text-[18px] font-bold">This week</div>
  <div class="mt-3 card divide-y divide-gray-100">
    <div class="flex items-center gap-3 p-4"><div class="w-7 text-center num font-bold text-amber-500">1</div><img src="img/av1.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Maya R.</div><div class="text-[12px] text-gray-400 flex items-center gap-1.5"><span class="dot g-grass"></span>Zone A · 3 sweeps</div></div><div class="num text-[20px] font-bold">164</div></div>
    <div class="flex items-center gap-3 p-4"><div class="w-7 text-center num font-bold text-gray-400">2</div><div class="w-11 h-11 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center font-bold">JT</div><div class="flex-1"><div class="font-bold">Jordan T.</div><div class="text-[12px] text-gray-400 flex items-center gap-1.5"><span class="dot g-leaf"></span>Zone B · 2 sweeps</div></div><div class="num text-[20px] font-bold">121</div></div>
    <div class="flex items-center gap-3 p-4"><div class="w-7 text-center num font-bold text-gray-400">3</div><img src="img/av2.jpg" class="w-11 h-11 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Coach Lee</div><div class="text-[12px] text-gray-400 flex items-center gap-1.5"><span class="dot g-shade"></span>Zone D · 2 sweeps</div></div><div class="num text-[20px] font-bold">88</div></div>
    <div class="flex items-center gap-3 p-4"><div class="w-7 text-center num font-bold text-gray-400">4</div><div class="w-11 h-11 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center font-bold">AK</div><div class="flex-1"><div class="font-bold">Ana K.</div><div class="text-[12px] text-gray-400 flex items-center gap-1.5"><span class="dot g-grass"></span>Zone C · 1 sweep</div></div><div class="num text-[20px] font-bold">39</div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-map-location-dot"></i>Zones</div><div class="tab"><div class="tab-scan"><i class="fa-solid fa-crosshairs"></i></div></div><div class="tab"><i class="fa-solid fa-chart-simple"></i>Stats</div><div class="tab active"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
