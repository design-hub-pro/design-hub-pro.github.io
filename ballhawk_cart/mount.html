<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallHawk Cart · Mount</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
    <div class="text-[13px] font-semibold text-gray-400">Step <span class="num text-[#0F1A14]">2</span> of 3</div>
    <div class="w-10"></div>
  </div>
  <div class="mt-4 flex gap-1.5"><div class="flex-1 h-1.5 rounded-full grad-brand"></div><div class="flex-1 h-1.5 rounded-full grad-brand"></div><div class="flex-1 h-1.5 rounded-full bg-[#E1E6DD]"></div></div>
  <h1 class="mt-6 text-[30px] font-extrabold tracking-tight leading-tight">Clip it low</h1>
  <p class="mt-1 text-[15px] text-gray-500">Lens 15 to 25 cm off the ground, tilted down.</p>
  <!-- cart diagram -->
  <div class="mt-5 card p-0 overflow-hidden">
    <svg viewBox="0 0 404 300" class="w-full block" style="background:linear-gradient(180deg,#EAF4E4,#F7FAF5)">
      <rect x="0" y="246" width="404" height="54" fill="#B8DDA0"/>
      <g stroke="#7BBE5A" stroke-width="2" stroke-linecap="round">
        <path d="M20 250 l4 -12 M34 250 l-3 -14 M50 250 l5 -10 M300 250 l3 -13 M320 250 l-4 -12 M360 250 l2 -14 M380 250 l-3 -10"/>
      </g>
      <!-- cart frame -->
      <path d="M90 60 L150 228" stroke="#1F2B24" stroke-width="7" stroke-linecap="round"/>
      <path d="M150 228 L262 228" stroke="#1F2B24" stroke-width="7" stroke-linecap="round"/>
      <path d="M150 228 L192 140" stroke="#1F2B24" stroke-width="6" stroke-linecap="round"/>
      <rect x="160" y="96" width="62" height="118" rx="14" fill="#2F6B4A"/>
      <rect x="168" y="86" width="46" height="18" rx="6" fill="#244F38"/>
      <circle cx="150" cy="232" r="16" fill="#0F1A14"/><circle cx="150" cy="232" r="6" fill="#9AA59C"/>
      <circle cx="262" cy="232" r="16" fill="#0F1A14"/><circle cx="262" cy="232" r="6" fill="#9AA59C"/>
      <rect x="80" y="50" width="26" height="14" rx="7" fill="#1F2B24"/>
      <!-- phone mount -->
      <rect x="276" y="186" width="24" height="44" rx="6" fill="#14945A" transform="rotate(-12 288 208)"/>
      <rect x="281" y="192" width="14" height="32" rx="3" fill="#C6F432" transform="rotate(-12 288 208)"/>
      <path d="M262 228 L278 214" stroke="#1F2B24" stroke-width="5"/>
      <!-- fov -->
      <path d="M298 200 L404 186 L404 250 Z" fill="#C6F432" opacity=".35"/>
      <circle cx="372" cy="240" r="7" fill="#fff" stroke="#D3D8CF"/>
      <!-- height marker -->
      <path d="M318 206 L318 246" stroke="#0B7A47" stroke-width="2" stroke-dasharray="4 4"/>
      <rect x="326" y="212" width="58" height="24" rx="12" fill="#0B7A47"/>
      <text x="355" y="229" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="13" fill="#fff">18 cm</text>
    </svg>
  </div>
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-4"><div class="flex items-center gap-1.5"><span class="dot g-grass"></span><span class="text-[11px] font-semibold text-gray-400">Height</span></div><div class="num text-[26px] font-bold mt-1">18<span class="text-[13px] text-gray-400 ml-0.5">cm</span></div></div>
    <div class="card p-4"><div class="flex items-center gap-1.5"><span class="dot g-grass"></span><span class="text-[11px] font-semibold text-gray-400">Tilt</span></div><div class="num text-[26px] font-bold mt-1">-12<span class="text-[13px] text-gray-400 ml-0.5">°</span></div></div>
    <div class="card p-4"><div class="flex items-center gap-1.5"><span class="dot g-leaf"></span><span class="text-[11px] font-semibold text-gray-400">Light</span></div><div class="num text-[26px] font-bold mt-1">Low</div></div>
  </div>
  <div class="mt-4 card p-4 flex items-center gap-4">
    <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-[18px]"><i class="fa-solid fa-sun"></i></div>
    <div class="flex-1"><div class="font-bold text-[15px]">Turn the lens away from the sun</div><div class="text-[13px] text-gray-500">Glare is the top cause of missed balls.</div></div>
  </div>
  <div class="mt-6 btn grad-brand text-white">Lens looks good<i class="fa-solid fa-check"></i></div>
</div>
<div class="home-ind"></div>
</div></body></html>
