<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycleSafe AI - Alert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .status-bar { height: 54px; }
        .alert-pulse {
            animation: alert-pulse 0.5s ease-in-out infinite;
        }
        @keyframes alert-pulse {
            0%, 100% { background-color: rgba(239, 68, 68, 0.9); }
            50% { background-color: rgba(239, 68, 68, 0.6); }
        }
        .warning-ring {
            animation: warning-ring 1s ease-out infinite;
        }
        @keyframes warning-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .vehicle-approach {
            animation: approach 1s ease-in-out infinite;
        }
        @keyframes approach {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="w-full min-h-screen alert-pulse text-white">
        <!-- iOS Status Bar -->
        <div class="status-bar px-6 flex items-end pb-2 justify-between">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="flex items-center space-x-1.5 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Alert Header -->
        <div class="px-5 pt-4 text-center">
            <div class="inline-flex items-center space-x-2 bg-white/20 backdrop-blur rounded-full px-4 py-2 mb-4">
                <i class="fas fa-exclamation-triangle text-yellow-300"></i>
                <span class="font-semibold">VEHICLE APPROACHING</span>
            </div>
        </div>

        <!-- Main Alert Visualization -->
        <div class="relative flex flex-col items-center justify-center py-8">
            <!-- Warning Rings -->
            <div class="relative">
                <div class="absolute inset-0 bg-white/20 rounded-full warning-ring"></div>
                <div class="absolute inset-0 bg-white/20 rounded-full warning-ring" style="animation-delay: 0.3s;"></div>

                <div class="w-32 h-32 bg-white/30 backdrop-blur-lg rounded-full flex items-center justify-center">
                    <div class="text-center">
                        <p class="text-5xl font-bold">8m</p>
                        <p class="text-sm opacity-80">behind you</p>
                    </div>
                </div>
            </div>

            <!-- Vehicle Icon -->
            <div class="mt-8 vehicle-approach">
                <div class="w-16 h-16 bg-white/30 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-car text-3xl"></i>
                </div>
            </div>

            <!-- Speed Info -->
            <div class="mt-6 bg-white/20 backdrop-blur rounded-2xl px-6 py-3">
                <p class="text-center">
                    <span class="text-2xl font-bold">25 mph</span>
                    <span class="text-white/70"> approaching speed</span>
                </p>
            </div>
        </div>

        <!-- Action Recommendations -->
        <div class="px-5 py-6">
            <div class="bg-white/20 backdrop-blur-lg rounded-3xl p-5">
                <h3 class="font-bold text-lg mb-4 flex items-center">
                    <i class="fas fa-lightbulb text-yellow-300 mr-2"></i>
                    Recommended Action
                </h3>

                <div class="space-y-3">
                    <div class="flex items-center space-x-4 bg-white/10 rounded-xl p-3">
                        <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                        <div>
                            <p class="font-semibold">Move to the right</p>
                            <p class="text-white/70 text-sm">Allow vehicle to pass safely</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-4 bg-white/10 rounded-xl p-3">
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-hand-paper"></i>
                        </div>
                        <div>
                            <p class="font-semibold">Signal your intent</p>
                            <p class="text-white/70 text-sm">Use hand signals if turning</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alert Timeline -->
        <div class="px-5 pb-32">
            <div class="bg-white/10 backdrop-blur rounded-2xl p-4">
                <p class="text-white/60 text-xs mb-2">ALERT TIMELINE</p>
                <div class="flex items-center space-x-2">
                    <div class="flex-1 h-2 bg-white/20 rounded-full overflow-hidden">
                        <div class="w-3/4 h-full bg-gradient-to-r from-emerald-500 via-yellow-500 to-red-500 rounded-full"></div>
                    </div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-white/60">
                    <span>50m</span>
                    <span>25m</span>
                    <span class="text-red-300 font-semibold">8m</span>
                    <span>0m</span>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="fixed bottom-0 left-0 right-0 bg-black/30 backdrop-blur-lg px-6 py-4 pb-8">
            <div class="flex items-center justify-between">
                <button class="flex-1 bg-white/20 rounded-2xl py-4 mr-3 font-semibold">
                    <i class="fas fa-volume-mute mr-2"></i>
                    Mute
                </button>
                <button class="flex-1 bg-white rounded-2xl py-4 text-red-500 font-semibold">
                    <i class="fas fa-check mr-2"></i>
                    Acknowledge
                </button>
            </div>
        </div>
    </div>
</body>
</html>
