<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycleSafe AI - Active Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        .status-bar { height: 54px; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .safe-pulse {
            animation: safe-pulse 2s ease-in-out infinite;
        }
        @keyframes safe-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
        }
        .radar-scan {
            animation: radar 2s linear infinite;
        }
        @keyframes radar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="w-full min-h-screen bg-gray-900 text-white">
        <!-- iOS Status Bar -->
        <div class="status-bar bg-gray-900 px-6 flex items-end pb-2 justify-between">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="flex items-center space-x-1.5 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Live Map Area -->
        <div class="relative h-64 bg-gray-800 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?w=800&h=400&fit=crop"
                 class="w-full h-full object-cover opacity-60">

            <!-- Overlay gradient -->
            <div class="absolute inset-0 bg-gradient-to-b from-gray-900/60 via-transparent to-gray-900"></div>

            <!-- Route Progress -->
            <div class="absolute top-4 left-4 right-4">
                <div class="bg-black/50 backdrop-blur-md rounded-2xl p-3 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-bicycle text-white"></i>
                        </div>
                        <div>
                            <p class="text-emerald-400 text-xs font-medium">Active Ride</p>
                            <p class="font-bold">To: Downtown Office</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold">1.8 mi</p>
                        <p class="text-gray-400 text-xs">remaining</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Arrow -->
            <div class="absolute bottom-16 left-1/2 transform -translate-x-1/2">
                <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/50">
                    <i class="fas fa-arrow-up text-white text-2xl"></i>
                </div>
            </div>

            <!-- Next Turn -->
            <div class="absolute bottom-4 left-4 right-4">
                <div class="bg-black/50 backdrop-blur-md rounded-xl p-3 flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-turn-up text-white"></i>
                    </div>
                    <div>
                        <p class="font-semibold">Turn right onto Oak Street</p>
                        <p class="text-gray-400 text-sm">in 0.3 miles</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Safety Radar -->
        <div class="px-5 py-4">
            <div class="bg-gray-800 rounded-3xl p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-lg">Rear Traffic Monitor</h2>
                    <span class="bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full">
                        <i class="fas fa-check-circle mr-1"></i>Clear
                    </span>
                </div>

                <!-- Radar Visualization -->
                <div class="relative flex items-center justify-center py-6">
                    <div class="absolute w-40 h-40 border-2 border-emerald-500/20 rounded-full"></div>
                    <div class="absolute w-28 h-28 border-2 border-emerald-500/30 rounded-full"></div>
                    <div class="absolute w-16 h-16 border-2 border-emerald-500/40 rounded-full"></div>

                    <!-- Radar Sweep -->
                    <div class="absolute w-40 h-40 radar-scan">
                        <div class="absolute top-0 left-1/2 w-0.5 h-20 bg-gradient-to-b from-emerald-500 to-transparent origin-bottom"></div>
                    </div>

                    <!-- Center Bike -->
                    <div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center safe-pulse z-10">
                        <i class="fas fa-bicycle text-xl"></i>
                    </div>

                    <!-- Distance Labels -->
                    <span class="absolute top-2 text-xs text-gray-500">50m</span>
                    <span class="absolute text-xs text-gray-500" style="top: 35%;">25m</span>
                </div>

                <p class="text-center text-gray-400 text-sm mt-2">No vehicles detected within 50 meters</p>
            </div>
        </div>

        <!-- Ride Stats -->
        <div class="px-5 pb-28">
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-800 rounded-2xl p-4 text-center">
                    <p class="text-gray-400 text-xs mb-1">Speed</p>
                    <p class="text-2xl font-bold">14.2</p>
                    <p class="text-gray-500 text-xs">mph</p>
                </div>
                <div class="bg-gray-800 rounded-2xl p-4 text-center">
                    <p class="text-gray-400 text-xs mb-1">Duration</p>
                    <p class="text-2xl font-bold">12:34</p>
                    <p class="text-gray-500 text-xs">min</p>
                </div>
                <div class="bg-gray-800 rounded-2xl p-4 text-center">
                    <p class="text-gray-400 text-xs mb-1">Traveled</p>
                    <p class="text-2xl font-bold">2.4</p>
                    <p class="text-gray-500 text-xs">miles</p>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 px-6 py-3 pb-8">
            <div class="flex items-center justify-between">
                <button class="w-14 h-14 bg-gray-700 rounded-full flex items-center justify-center">
                    <i class="fas fa-volume-up text-white text-xl"></i>
                </button>
                <button class="w-20 h-20 bg-red-500 rounded-full flex items-center justify-center shadow-lg shadow-red-500/40">
                    <i class="fas fa-stop text-white text-2xl"></i>
                </button>
                <button class="w-14 h-14 bg-gray-700 rounded-full flex items-center justify-center">
                    <i class="fas fa-pause text-white text-xl"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
