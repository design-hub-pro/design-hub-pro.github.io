<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CycleSafe AI - Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body {
            width: 430px;
            height: 932px;
            margin: 0;
            overflow: hidden;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .radar-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-sweep {
            animation: sweep 3s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-900">
    <!-- Status Bar -->
    <div class="bg-gray-900 px-6 py-2 flex justify-between items-center text-base font-medium text-white">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="px-6 pt-4 pb-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Live Radar</h1>
            <div class="flex items-center gap-2">
                <span class="px-3 py-1.5 bg-green-500/20 text-green-400 text-sm rounded-full font-medium flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                    Active
                </span>
            </div>
        </div>
    </div>

    <!-- Radar Display -->
    <div class="px-6 py-4">
        <div class="relative bg-gray-800 rounded-3xl p-6 aspect-square flex items-center justify-center overflow-hidden">
            <!-- Radar Background Circles -->
            <div class="absolute inset-8 border border-amber-500/20 rounded-full radar-pulse"></div>
            <div class="absolute inset-16 border border-amber-500/30 rounded-full radar-pulse" style="animation-delay: 0.3s"></div>
            <div class="absolute inset-24 border border-amber-500/40 rounded-full radar-pulse" style="animation-delay: 0.6s"></div>

            <!-- Radar Sweep Line -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-full h-full radar-sweep origin-center">
                    <div class="absolute top-1/2 left-1/2 w-1/2 h-0.5 bg-gradient-to-r from-amber-500 to-transparent origin-left"></div>
                </div>
            </div>

            <!-- Bicycle Icon (Center) -->
            <div class="absolute z-10 w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center shadow-lg shadow-amber-500/30">
                <i class="fas fa-bicycle text-white text-2xl"></i>
            </div>

            <!-- Detected Vehicles -->
            <div class="absolute top-16 right-20 w-10 h-10 bg-red-500 rounded-full flex items-center justify-center animate-pulse">
                <i class="fas fa-car text-white text-lg"></i>
            </div>
            <div class="absolute bottom-24 right-16 w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center">
                <i class="fas fa-motorcycle text-white text-sm"></i>
            </div>
            <div class="absolute bottom-32 left-24 w-8 h-8 bg-green-500 rounded-full flex items-center justify-center">
                <i class="fas fa-bicycle text-white text-sm"></i>
            </div>

            <!-- Distance Labels -->
            <span class="absolute bottom-2 right-2 text-amber-400/60 text-sm">50m</span>
            <span class="absolute bottom-16 right-16 text-amber-400/40 text-sm">25m</span>
        </div>
    </div>

    <!-- Detection Summary -->
    <div class="px-6 py-2">
        <h3 class="text-lg font-semibold text-white mb-3">Nearby Objects</h3>
        <div class="space-y-3">
            <div class="bg-gray-800 rounded-2xl p-4 flex items-center gap-4 border-l-4 border-red-500">
                <div class="w-12 h-12 bg-red-500/20 rounded-xl flex items-center justify-center">
                    <i class="fas fa-car text-red-400 text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold text-base">Car Approaching</p>
                    <p class="text-gray-400 text-base">Rear right • 35 mph</p>
                </div>
                <div class="text-right">
                    <p class="text-red-400 font-bold text-xl">18m</p>
                    <p class="text-gray-500 text-sm">~3 sec</p>
                </div>
            </div>

            <div class="bg-gray-800 rounded-2xl p-4 flex items-center gap-4 border-l-4 border-yellow-500">
                <div class="w-12 h-12 bg-yellow-500/20 rounded-xl flex items-center justify-center">
                    <i class="fas fa-motorcycle text-yellow-400 text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold text-base">Motorcycle</p>
                    <p class="text-gray-400 text-base">Rear left • 28 mph</p>
                </div>
                <div class="text-right">
                    <p class="text-yellow-400 font-bold text-xl">32m</p>
                    <p class="text-gray-500 text-sm">~5 sec</p>
                </div>
            </div>

            <div class="bg-gray-800 rounded-2xl p-4 flex items-center gap-4 border-l-4 border-green-500">
                <div class="w-12 h-12 bg-green-500/20 rounded-xl flex items-center justify-center">
                    <i class="fas fa-bicycle text-green-400 text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold text-base">Cyclist</p>
                    <p class="text-gray-400 text-base">Left side • 12 mph</p>
                </div>
                <div class="text-right">
                    <p class="text-green-400 font-bold text-xl">45m</p>
                    <p class="text-gray-500 text-sm">Safe</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Spacer -->
    <div class="h-24"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-satellite-dish text-amber-500 text-2xl"></i>
                <span class="text-sm text-amber-500 font-medium mt-1">Radar</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-bell text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Alerts</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-cloud-sun text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Weather</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
