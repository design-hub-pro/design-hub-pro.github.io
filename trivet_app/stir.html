<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivet - Stir now</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  * { scrollbar-width:none; }
  html, body { height:100%; }
  body { font-family:'Inter',-apple-system,sans-serif; color:#1a1006; overflow:hidden; position:relative;
         background:linear-gradient(168deg,#FF8A3D 0%,#F2691F 46%,#D4531A 100%); }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; color:#2A1608; }
  .status-time { font-size:17px; font-weight:700; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); }

  .content { padding:0 28px; display:flex; flex-direction:column; height:calc(100% - 59px); }

  .top { display:flex; align-items:center; gap:9px; font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:rgba(42,22,8,0.6); margin-top:10px; }

  .icon-wrap { margin:52px auto 0; width:190px; height:190px; border-radius:50%; background:rgba(255,255,255,0.20); display:flex; align-items:center; justify-content:center; position:relative; }
  .icon-wrap::before { content:""; position:absolute; inset:-22px; border-radius:50%; border:2px solid rgba(255,255,255,0.22); }
  .icon-wrap::after { content:""; position:absolute; inset:-48px; border-radius:50%; border:2px solid rgba(255,255,255,0.11); }
  .icon-wrap i { font-size:80px; color:#fff; }

  .h { font-size:52px; font-weight:900; letter-spacing:-2.2px; text-align:center; margin-top:64px; color:#241304; line-height:1; }
  .p { font-size:16px; line-height:1.5; text-align:center; color:rgba(42,22,8,0.72); margin-top:16px; font-weight:500; }
  .p b { font-weight:800; color:#241304; }

  .facts { display:flex; gap:10px; margin-top:30px; }
  .f { flex:1; background:rgba(255,255,255,0.22); border-radius:18px; padding:15px 12px; text-align:center; }
  .f-v { font-size:26px; font-weight:900; letter-spacing:-1px; color:#241304; }
  .f-v span { font-size:12px; font-weight:800; }
  .f-l { font-size:10px; font-weight:700; color:rgba(42,22,8,0.6); margin-top:4px; letter-spacing:0.3px; }

  .spacer { flex:1; }

  .timer { text-align:center; font-size:12px; font-weight:700; color:rgba(42,22,8,0.62); margin-bottom:14px; }
  .btn { width:100%; background:#241304; color:#FFB25E; border:none; border-radius:20px; padding:20px; font-size:16px; font-weight:800; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:10px; }
  .skip { text-align:center; font-size:13px; font-weight:700; color:rgba(42,22,8,0.5); margin:16px 0 34px; }
</style>
</head>
<body>
  <div class="status-bar">
    <div class="status-time">12:11</div>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal" style="font-size:13px"></i>
      <i class="fas fa-wifi" style="font-size:13px"></i>
      <i class="fas fa-battery-full" style="font-size:16px"></i>
    </div>
  </div>

  <div class="content">
    <div class="top"><i class="fas fa-circle" style="font-size:7px"></i> Rice bowl · 8 min in</div>

    <div class="icon-wrap"><i class="fas fa-rotate"></i></div>

    <div class="h">Stir now</div>
    <div class="p">Heat only enters from the bottom. One stir <b>halves the depth</b> and cuts the time to an even bowl by four.</div>

    <div class="facts">
      <div class="f"><div class="f-v">28<span>°C</span></div><div class="f-l">SPREAD NOW</div></div>
      <div class="f"><div class="f-v">6<span>°C</span></div><div class="f-l">AFTER A STIR</div></div>
      <div class="f"><div class="f-v">10<span>s</span></div><div class="f-l">THAT IS ALL</div></div>
    </div>

    <div class="spacer"></div>

    <div class="timer">Heating pauses for 40 s · lid is safe to lift</div>
    <button class="btn"><i class="fas fa-check"></i> Stirred, carry on</button>
    <div class="skip">Skip this time</div>
  </div>
</body>
</html>
