<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#14132B;--muted:#6E6B8A;--faint:#A5A2BC;--border:#E9E7F4;--accent:#5B4BE8;--accent2:#9B6BFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:1560px;margin:0 auto;padding:80px 40px 100px}
.hero{display:flex;align-items:center;gap:26px;margin-bottom:14px}
.icon{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 22px 44px -18px rgba(91,75,232,.85);flex-shrink:0}
.icon i{color:#fff;font-size:38px}
h1{font-size:56px;font-weight:900;letter-spacing:-2.4px;line-height:1}
.tag{font-size:19px;color:var(--muted);margin-top:10px;font-weight:500}
.tags{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:100px;padding:8px 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;margin-top:72px;justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:18px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#111;box-shadow:0 40px 80px -40px rgba(20,19,43,.55),0 0 0 1px rgba(20,19,43,.06)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#fff}
.cap{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon"><i class="fas fa-gem"></i></div>
    <div>
      <h1>Facet</h1>
      <div class="tag">A nine-dimension strengths profile for autistic young adults, matched to real roles.</div>
    </div>
  </div>
  <div class="tags"><span>Neurodiversity</span><span>Assessment</span><span>Clustering</span><span>Employment</span></div>

  <div class="grid">
    <div class="cell"><div class="frame"><iframe src="intake.html" scrolling="no"></iframe></div><div class="cap">Intake</div></div>
    <div class="cell"><div class="frame"><iframe src="assess.html" scrolling="no"></iframe></div><div class="cap">Assessment</div></div>
    <div class="cell"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="cap">Strengths profile</div></div>
    <div class="cell"><div class="frame"><iframe src="clusters.html" scrolling="no"></iframe></div><div class="cap">Cohort map</div></div>
    <div class="cell"><div class="frame"><iframe src="matches.html" scrolling="no"></iframe></div><div class="cap">Role matches</div></div>
    <div class="cell"><div class="frame"><iframe src="track.html" scrolling="no"></iframe></div><div class="cap">Placement track</div></div>
    <div class="cell"><div class="frame"><iframe src="me.html" scrolling="no"></iframe></div><div class="cap">Account</div></div>
  </div>
</div>
</body>
</html>
