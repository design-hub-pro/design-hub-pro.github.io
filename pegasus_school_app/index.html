<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus Campus - School Parent App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        body { background: #ffffff; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            background: #000;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #f8f9fb;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1560px;
            margin: 0 auto;
            justify-items: center;
        }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <!-- Header -->
        <div class="text-center pt-16 pb-12 px-6">
            <div class="flex items-center justify-center gap-3 mb-4">
                <div class="w-14 h-14 bg-gradient-to-br from-blue-900 to-blue-700 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-horse-head text-amber-300 text-2xl"></i>
                </div>
            </div>
            <h1 class="text-4xl font-bold text-gray-900 mb-2">Pegasus Campus</h1>
            <p class="text-gray-500 text-lg max-w-xl mx-auto">Parent navigation & information app for The Pegasus School</p>
        </div>

        <!-- Screenshots -->
        <div class="px-8 pb-20">
            <div class="screens-grid">
                <!-- Home -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="home.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Home</p>
                </div>
                <!-- Map -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="map.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Campus Map</p>
                </div>
                <!-- Teachers -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="teachers.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Teachers</p>
                </div>
                <!-- Events -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="events.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Events</p>
                </div>
                <!-- Profile -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="profile.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Profile</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
