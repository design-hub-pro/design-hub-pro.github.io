<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F1F5F9;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#0F172A}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px);overflow-y:auto;padding:0 28px 30px}
.stat-chip{background:white;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,0.06)}
.card{background:white;border-radius:20px;padding:15px;box-shadow:0 4px 18px rgba(15,23,42,0.07)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9}
.row:last-child{border-bottom:none}
.icon-sq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;color:white;flex-shrink:0}
.badge-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-5">
      <i class="fas fa-arrow-left text-gray-700"></i>
      <h1 class="text-base font-bold text-gray-900">Profile</h1>
      <i class="fas fa-gear text-gray-400"></i>
    </div>

    <div class="flex items-center gap-3 mb-5">
      <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=200&h=200&fit=crop" class="w-16 h-16 rounded-2xl object-cover">
      <div>
        <p class="text-lg font-bold text-gray-900">Jordan Ruiz</p>
        <span class="text-[10px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-full">Volunteer &middot; Line Maintenance</span>
        <p class="text-[11px] text-gray-500 mt-1">Cedar Valley Airport &middot; KCVH</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2.5 mb-5">
      <div class="stat-chip">
        <p class="text-xl font-black text-gray-900">184</p>
        <p class="text-[10px] text-gray-500 font-semibold mt-0.5">Hours logged</p>
      </div>
      <div class="stat-chip">
        <p class="text-xl font-black text-gray-900">47</p>
        <p class="text-[10px] text-gray-500 font-semibold mt-0.5">Tasks done</p>
      </div>
      <div class="stat-chip">
        <p class="text-xl font-black text-blue-700">3</p>
        <p class="text-[10px] text-gray-500 font-semibold mt-0.5">Certifications</p>
      </div>
    </div>

    <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Badges</p>
    <div class="flex gap-3 mb-5">
      <div class="badge-icon" style="background:linear-gradient(135deg,#FCD34D,#D97706)"><i class="fas fa-shield-halved"></i></div>
      <div class="badge-icon" style="background:linear-gradient(135deg,#60A5FA,#2563EB)"><i class="fas fa-wrench"></i></div>
      <div class="badge-icon" style="background:linear-gradient(135deg,#6EE7B7,#059669)"><i class="fas fa-clock"></i></div>
      <div class="badge-icon" style="background:#E2E8F0;color:#94A3B8"><i class="fas fa-plus"></i></div>
    </div>

    <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">Settings</p>
    <div class="card mb-5">
      <div class="row">
        <div class="icon-sq" style="background:linear-gradient(135deg,#93C5FD,#2563EB)"><i class="fas fa-bell"></i></div>
        <p class="text-sm font-semibold text-gray-800 flex-1">Notifications</p>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
      <div class="row">
        <div class="icon-sq" style="background:linear-gradient(135deg,#6EE7B7,#059669)"><i class="fas fa-calendar-check"></i></div>
        <p class="text-sm font-semibold text-gray-800 flex-1">Availability schedule</p>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
      <div class="row">
        <div class="icon-sq" style="background:linear-gradient(135deg,#FCA5A5,#DC2626)"><i class="fas fa-phone"></i></div>
        <p class="text-sm font-semibold text-gray-800 flex-1">Emergency contacts</p>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
      <div class="row">
        <div class="icon-sq" style="background:linear-gradient(135deg,#94A3B8,#475569)"><i class="fas fa-lock"></i></div>
        <p class="text-sm font-semibold text-gray-800 flex-1">Privacy &amp; data</p>
        <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
      </div>
    </div>

    <p class="text-center text-xs font-bold text-red-500 py-2">Sign Out</p>
  </div>
</div>
</body>
</html>
