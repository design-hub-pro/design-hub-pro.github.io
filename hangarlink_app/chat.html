<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Engineer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F1F5F9;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#0F172A}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.chat-header{padding:6px 28px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E2E8F0}
.content{height:calc(100% - 59px - 64px - 78px);overflow-y:auto;padding:14px 28px 10px}
.footer-bar{position:absolute;bottom:0;left:0;right:0;height:78px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #E2E8F0;padding:12px 20px;display:flex;align-items:center;gap:10px}
.bubble-left{background:white;border-radius:16px 16px 16px 4px;padding:10px 13px;box-shadow:0 2px 10px rgba(15,23,42,0.06);max-width:78%}
.bubble-right{background:linear-gradient(135deg,#2563EB,#1E3A8A);color:white;border-radius:16px 16px 4px 16px;padding:10px 13px;max-width:78%}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="chat-header">
    <i class="fas fa-arrow-left text-gray-700"></i>
    <div class="relative">
      <img class="w-10 h-10 rounded-full object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789853852259-image-1.png">
      <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-green-500 border-2 border-white"></span>
    </div>
    <div class="flex-1">
      <p class="text-sm font-bold text-gray-900">Dave Reynolds</p>
      <p class="text-[10px] text-green-600 font-semibold">Online now</p>
    </div>
    <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center"><i class="fas fa-phone text-blue-700 text-xs"></i></div>
    <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center"><i class="fas fa-video text-blue-700 text-xs"></i></div>
  </div>

  <div class="content flex flex-col gap-3">
    <p class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-wide my-1">Today &middot; 10:12 AM</p>

    <div class="self-end bubble-right">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789853851892-image-1.png" class="w-full h-32 object-cover rounded-xl mb-2">
      <p class="text-xs leading-relaxed">Found this near the #3 exhaust flange &mdash; does this look like a stress crack?</p>
    </div>

    <div class="self-start bubble-left">
      <p class="text-xs text-gray-800 leading-relaxed">Good catch, that's worth grounding for. Don't run the engine. I'll swing by Hangar 2 in 10.</p>
    </div>

    <div class="self-start bubble-left flex items-center gap-2.5 py-2.5">
      <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-play text-[10px]"></i></div>
      <div class="flex items-end gap-0.5 h-5">
        <span class="w-0.5 bg-blue-300 rounded" style="height:40%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:80%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:55%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:100%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:65%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:35%"></span>
        <span class="w-0.5 bg-blue-300 rounded" style="height:70%"></span>
      </div>
      <span class="text-[10px] text-gray-400 font-semibold">0:42</span>
    </div>

    <div class="self-end bubble-right">
      <p class="text-xs leading-relaxed">Copy that, tagging the work order as AOG-hold now.</p>
    </div>

    <div class="self-start flex items-center gap-1.5 pl-1">
      <span class="w-1.5 h-1.5 rounded-full bg-gray-300 animate-pulse"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-gray-300 animate-pulse" style="animation-delay:.15s"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-gray-300 animate-pulse" style="animation-delay:.3s"></span>
    </div>
  </div>

  <div class="footer-bar">
    <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0"><i class="fas fa-camera text-blue-700 text-sm"></i></div>
    <div class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm text-gray-400">Message Dave&hellip;</div>
    <div class="w-9 h-9 rounded-full flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#2563EB,#1E3A8A)"><i class="fas fa-paper-plane text-xs"></i></div>
  </div>
</div>
</body>
</html>
