<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F1F5F9;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#0F172A}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 96px);overflow-y:auto;padding:0 28px 20px}
.footer-bar{position:absolute;bottom:0;left:0;right:0;height:96px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #E2E8F0;padding:14px 28px}
.video-frame{position:relative;border-radius:22px;overflow:hidden}
.video-frame img{width:100%;height:200px;object-fit:cover}
.video-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0.15) 0%,rgba(15,23,42,0.05) 40%,rgba(15,23,42,0.5) 100%)}
.play-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center}
.vprog-track{position:absolute;bottom:10px;left:14px;right:14px;height:4px;background:rgba(255,255,255,0.35);border-radius:4px}
.vprog-fill{height:100%;border-radius:4px;background:#3B82F6}
.step-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9}
.step-row:last-child{border-bottom:none}
.step-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-4">
      <i class="fas fa-arrow-left text-gray-700"></i>
      <h1 class="text-sm font-bold text-gray-500">Module 2 &middot; Lesson 3</h1>
      <i class="fas fa-ellipsis text-gray-400"></i>
    </div>

    <div class="video-frame">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789853852560-image-1.png">
      <div class="video-fade"></div>
      <div class="absolute inset-0 flex items-center justify-center"><div class="play-btn"><i class="fas fa-play text-blue-700 ml-0.5"></i></div></div>
      <span class="absolute bottom-4 right-4 text-white text-[10px] font-bold bg-black/40 px-2 py-0.5 rounded">03:12 / 08:15</span>
      <div class="vprog-track"><div class="vprog-fill" style="width:38%"></div></div>
    </div>

    <h2 class="text-xl font-black text-gray-900 mt-4">Reading a Compression Test</h2>
    <div class="flex items-center gap-2 mt-2">
      <img class="w-6 h-6 rounded-full object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1789853852259-image-1.png">
      <p class="text-xs text-gray-500 font-medium">Taught by Dave Reynolds, A&amp;P/IA</p>
    </div>

    <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mt-6 mb-1">Module progress</p>
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="step-row">
        <div class="step-icon bg-green-500 text-white"><i class="fas fa-check"></i></div>
        <p class="text-sm font-semibold text-gray-500 flex-1 line-through">Intro to compression testing</p>
      </div>
      <div class="step-row">
        <div class="step-icon bg-green-500 text-white"><i class="fas fa-check"></i></div>
        <p class="text-sm font-semibold text-gray-500 flex-1 line-through">Tools &amp; safety prep</p>
      </div>
      <div class="step-row">
        <div class="step-icon" style="background:linear-gradient(135deg,#60A5FA,#2563EB);color:white"><i class="fas fa-play text-[10px]"></i></div>
        <p class="text-sm font-bold text-gray-900 flex-1">Reading a compression test</p>
      </div>
      <div class="step-row">
        <div class="step-icon bg-gray-100 text-gray-300"><i class="fas fa-lock text-[10px]"></i></div>
        <p class="text-sm font-semibold text-gray-400 flex-1">Common failure patterns</p>
      </div>
      <div class="step-row">
        <div class="step-icon bg-gray-100 text-gray-300"><i class="fas fa-lock text-[10px]"></i></div>
        <p class="text-sm font-semibold text-gray-400 flex-1">Quiz &amp; certification</p>
      </div>
    </div>
  </div>
  <div class="footer-bar">
    <button class="w-full text-white font-bold text-sm py-3.5 rounded-2xl" style="background:linear-gradient(135deg,#2563EB,#1E3A8A);box-shadow:0 10px 24px rgba(29,78,216,0.3)">Mark Lesson Complete</button>
  </div>
</div>
</body>
</html>
