<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>FireGuard · Satellite</title></head><body>
<div class="screen bg-black">
  <img src="assets/satellite.jpg" class="absolute inset-0 w-full h-[640px] object-cover" style="filter:saturate(1.1)">
  <div class="absolute inset-x-0 top-0 h-[180px]" style="background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)"></div>
  <svg class="absolute" style="left:50%;top:330px;transform:translate(-50%,-50%)" width="400" height="400" viewBox="0 0 400 400">
    <circle cx="200" cy="200" r="190" fill="rgba(52,195,143,.10)" stroke="#34C38F" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="200" cy="200" r="120" fill="rgba(255,192,66,.14)" stroke="#FFC042" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="200" cy="200" r="58" fill="rgba(255,90,31,.22)" stroke="#FF5A1F" stroke-width="2.5"/>
    <rect x="178" y="180" width="44" height="40" rx="6" fill="#fff" stroke="#17191C" stroke-width="2"/>
    <text x="200" y="27" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter">100 ft</text>
    <text x="200" y="97" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter">30 ft</text>
  </svg>
  <span class="absolute chip bg-red-500 text-white" style="left:46px;top:260px"><i class="fa-solid fa-triangle-exclamation"></i>Dense chaparral</span>
  <span class="absolute chip bg-white/90 text-[#17191C]" style="right:40px;top:470px"><i class="fa-solid fa-arrow-trend-up text-orange-500"></i>18° slope</span>
  <div class="status light">
    <span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="relative px-c pt-2 flex gap-2 overflow-x-auto">
    <span class="chip bg-white text-[#17191C]"><i class="fa-solid fa-leaf text-emerald-500"></i>Vegetation</span>
    <span class="chip bg-black/45 backdrop-blur text-white"><i class="fa-solid fa-mountain"></i>Slope</span>
    <span class="chip bg-black/45 backdrop-blur text-white"><i class="fa-solid fa-fire-flame-curved"></i>Fire history</span>
    <span class="chip bg-black/45 backdrop-blur text-white"><i class="fa-solid fa-wind"></i>Wind</span>
  </div>
  <!-- bottom sheet -->
  <div class="absolute left-0 right-0 bottom-0 bg-[#F6F4F1] rounded-t-[32px] pt-3 pb-[110px]" style="box-shadow:0 -12px 40px rgba(0,0,0,.25)">
    <div class="w-10 h-1.5 rounded-full bg-gray-300 mx-auto"></div>
    <div class="px-c mt-4 flex items-center justify-between">
      <div><p class="text-[13px] text-gray-500 font-semibold">Surroundings risk</p><p class="font-display font-extrabold text-[30px] leading-tight">High <span class="text-[15px] text-gray-400 font-semibold">71/100</span></p></div>
      <div class="w-14 h-14 rounded-2xl grad-red flex items-center justify-center text-white"><i class="fa-solid fa-satellite text-[22px]"></i></div>
    </div>
    <div class="px-c mt-4 grid grid-cols-3 gap-3">
      <div class="card p-3.5"><i class="fa-solid fa-tree text-emerald-600"></i><p class="font-display font-extrabold text-[24px] mt-1">64%</p><p class="text-[11.5px] text-gray-500 font-semibold">Fuel cover</p></div>
      <div class="card p-3.5"><i class="fa-solid fa-ruler text-sky-600"></i><p class="font-display font-extrabold text-[24px] mt-1">120<span class="text-[13px]">m</span></p><p class="text-[11.5px] text-gray-500 font-semibold">To wildland</p></div>
      <div class="card p-3.5"><i class="fa-solid fa-droplet text-amber-500"></i><p class="font-display font-extrabold text-[24px] mt-1">Dry</p><p class="text-[11.5px] text-gray-500 font-semibold">Plant moisture</p></div>
    </div>
  </div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab on"><i class="fa-solid fa-satellite"></i>Satellite</div>
<div class="tab scan"><div class="fab"><i class="fa-solid fa-camera"></i></div></div>
<div class="tab"><i class="fa-solid fa-seedling"></i>Plants</div>
<div class="tab"><i class="fa-solid fa-list-check"></i>Plan</div>
</nav>
</div></body></html>
