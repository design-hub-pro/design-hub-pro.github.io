<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>FireGuard · Scan</title>
<style>.box{position:absolute;border:2.5px solid;border-radius:14px}
.box .lbl{position:absolute;top:-34px;left:-2px;white-space:nowrap;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;display:flex;gap:6px;align-items:center}
.corner{position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid}
@keyframes sweep{0%{top:18%}100%{top:72%}}.sweep{position:absolute;left:28px;right:28px;height:3px;background:linear-gradient(90deg,transparent,#FF7A2F,transparent);box-shadow:0 0 24px 6px rgba(255,122,47,.45);animation:sweep 2.6s ease-in-out infinite alternate}</style></head><body>
<div class="screen bg-black">
  <img src="assets/yard.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85) 100%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="relative px-c pt-2 flex items-center justify-between text-white">
    <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <span class="chip bg-black/45 backdrop-blur text-white"><span class="dot bg-orange-400 animate-pulse"></span>Analyzing · 3 found</span>
    <div class="w-11 h-11 rounded-full bg-black/40 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
  </div>
  <div class="box" style="left:44px;top:440px;width:210px;height:190px;border-color:#FF4D4F;background:rgba(255,77,79,.12)"><div class="lbl" style="background:#FF4D4F"><i class="fa-solid fa-fire"></i>Dead brush · 96%</div></div>
  <div class="box" style="left:280px;top:370px;width:130px;height:150px;border-color:#FFA51F;background:rgba(255,165,31,.12)"><div class="lbl" style="background:#F08A12"><i class="fa-solid fa-cubes-stacked"></i>Firewood · 91%</div></div>
  <div class="box" style="left:150px;top:200px;width:200px;height:70px;border-color:#FFD43B;background:rgba(255,212,59,.12)"><div class="lbl" style="background:#E0A800"><i class="fa-solid fa-leaf"></i>Gutter debris</div></div>
  <div class="sweep"></div>
  <div class="absolute left-0 right-0 bottom-0 pb-12 text-white">
    <div class="flex justify-center gap-7 text-[13px] font-bold tracking-wide mb-7">
      <span class="text-white/50">ROOF</span><span class="text-orange-400">YARD</span><span class="text-white/50">PLANT</span><span class="text-white/50">VENTS</span>
    </div>
    <div class="flex items-center justify-between px-[44px]">
      <img src="assets/after.jpg" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-white/70">
      <div class="w-[86px] h-[86px] rounded-full border-[5px] border-white flex items-center justify-center"><div class="w-[68px] h-[68px] rounded-full grad-ember"></div></div>
      <div class="w-14 h-14 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-image text-[20px]"></i></div>
    </div>
    <p class="text-center text-white/60 text-[13px] mt-5">Hold steady. Include the house wall in frame.</p>
  </div>
</div></body></html>
