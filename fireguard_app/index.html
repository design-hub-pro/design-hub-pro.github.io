<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireGuard · Wildfire risk app for California homes</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Inter',sans-serif;color:#17191C}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2d31,#0b0c0d);box-shadow:0 50px 80px -30px rgba(60,30,10,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F6F4F1}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FF7A2F,#D9411A)"><i class="fa-solid fa-shield-halved text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:Manrope">FireGuard</h1>
  <p class="mt-3 text-[19px] text-gray-500">Snap your yard. AI finds wildfire hazards and builds a plan to protect your California home.</p>
  <div class="mt-6 flex gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-700">Wildfire Safety</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Computer Vision</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Satellite</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Plant ID</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="scan.html" scrolling="no" title="scan"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="hazards.html" scrolling="no" title="hazards"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="satellite.html" scrolling="no" title="satellite"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="plant-id.html" scrolling="no" title="plant-id"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="alternatives.html" scrolling="no" title="alternatives"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="plan.html" scrolling="no" title="plan"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="assistant.html" scrolling="no" title="assistant"></iframe></div></div>
</div></main>
</body></html>
