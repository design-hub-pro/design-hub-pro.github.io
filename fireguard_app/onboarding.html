<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>FireGuard · Welcome</title></head><body>
<div class="screen bg-black">
  <img src="assets/hero.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(20,10,5,.55) 58%,#120a06 82%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="relative px-c pt-4 flex items-center gap-2.5 text-white">
    <div class="w-10 h-10 rounded-xl grad-ember flex items-center justify-center"><i class="fa-solid fa-shield-halved"></i></div>
    <span class="font-display font-extrabold text-[22px]">FireGuard</span>
  </div>
  <div class="absolute left-0 right-0 bottom-0 px-c pb-12 text-white">
    <div class="flex gap-2 mb-5">
      <span class="chip bg-white/15 backdrop-blur"><i class="fa-solid fa-camera text-orange-300"></i>Yard scan</span>
      <span class="chip bg-white/15 backdrop-blur"><i class="fa-solid fa-satellite text-sky-300"></i>Satellite</span>
      <span class="chip bg-white/15 backdrop-blur"><i class="fa-solid fa-seedling text-emerald-300"></i>Plant ID</span>
    </div>
    <h1 class="font-display font-extrabold text-[40px] leading-[1.05]">Know your home's<br>wildfire risk.<br><span class="text-orange-400">Then lower it.</span></h1>
    <p class="text-white/70 text-[16px] mt-4 leading-relaxed">Snap your yard. AI finds the hazards and builds your plan.</p>
    <div class="mt-7 bg-white rounded-2xl flex items-center gap-3 px-4 h-[58px] text-[#17191C]">
      <i class="fa-solid fa-location-dot text-orange-500"></i>
      <span class="text-[15px] font-medium flex-1">2148 Canyon View Dr, Santa Rosa</span>
      <i class="fa-solid fa-circle-check text-emerald-500"></i>
    </div>
    <button class="mt-3 w-full h-[58px] rounded-2xl grad-ember font-bold text-[17px] shadow-lg shadow-orange-900/40">Scan my property <i class="fa-solid fa-arrow-right ml-2"></i></button>
    <div class="flex justify-center gap-2 mt-6"><span class="w-6 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span></div>
  </div>
</div></body></html>
