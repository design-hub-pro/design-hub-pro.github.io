<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiStride - My Horses</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; font-family: 'Inter', -apple-system, sans-serif; background: #F8F7F4; width: 100%; height: 100%; overflow-x: hidden; }

  .status-bar {
    height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px; background: #F8F7F4; position: sticky; top: 0; z-index: 100;
  }
  .status-bar .time { font-size: 16px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons i { font-size: 13px; }
  .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }

  .content { padding: 0 28px 120px; }

  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .page-title { font-size: 28px; font-weight: 800; color: #1A1A1A; }
  .add-btn {
    width: 40px; height: 40px; border-radius: 50%; background: #4A7C23; border: none;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn i { color: #fff; font-size: 16px; }

  /* Horse Card Large */
  .horse-card-lg {
    background: #fff; border-radius: 24px; overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  .horse-hero { width: 100%; height: 200px; position: relative; }
  .horse-hero img { width: 100%; height: 100%; object-fit: cover; }
  .horse-hero-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    padding: 20px;
  }
  .horse-hero-overlay h3 { color: #fff; font-size: 24px; font-weight: 800; }
  .horse-hero-overlay p { color: rgba(255,255,255,0.8); font-size: 13px; }
  .sensor-badge {
    position: absolute; top: 14px; right: 14px;
    background: rgba(52,199,89,0.9); backdrop-filter: blur(10px);
    padding: 5px 12px; border-radius: 14px; display: flex; align-items: center; gap: 6px;
  }
  .sensor-badge .dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; }
  .sensor-badge span { font-size: 11px; font-weight: 600; color: #fff; }

  .horse-details { padding: 18px 20px; }
  .horse-stats-row { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .horse-stat { text-align: center; }
  .horse-stat .val { font-size: 22px; font-weight: 800; color: #1A1A1A; }
  .horse-stat .lbl { font-size: 11px; color: #8E8E93; }

  .health-bar-section { margin-bottom: 12px; }
  .health-label { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .health-label span { font-size: 13px; font-weight: 600; color: #1A1A1A; }
  .health-label .score { color: #4A7C23; }
  .health-bar { height: 8px; background: #F0F0F0; border-radius: 4px; overflow: hidden; }
  .health-fill { height: 100%; background: linear-gradient(90deg, #4A7C23, #6BA832); border-radius: 4px; }

  .horse-actions { display: flex; gap: 10px; margin-top: 14px; }
  .action-btn {
    flex: 1; padding: 12px; border-radius: 14px; border: none;
    font-size: 13px; font-weight: 600; display: flex; align-items: center;
    justify-content: center; gap: 6px; cursor: pointer;
  }
  .btn-primary { background: #4A7C23; color: #fff; }
  .btn-secondary { background: #F0F0F0; color: #1A1A1A; }

  /* Small Horse Card */
  .horse-card-sm {
    background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .horse-sm-img { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; flex-shrink: 0; }
  .horse-sm-img img { width: 100%; height: 100%; object-fit: cover; }
  .horse-sm-info { flex: 1; }
  .horse-sm-info h4 { font-size: 17px; font-weight: 700; color: #1A1A1A; }
  .horse-sm-info .meta { font-size: 12px; color: #8E8E93; margin-bottom: 8px; }
  .horse-sm-tags { display: flex; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
  .tag-offline { background: #F5F5F5; color: #8E8E93; }
  .tag-rest { background: #FFF3E0; color: #E67E22; }
  .horse-sm-score { text-align: center; }
  .horse-sm-score .score { font-size: 24px; font-weight: 800; color: #4A7C23; }
  .horse-sm-score .label { font-size: 10px; color: #8E8E93; }

  /* Add Horse Card */
  .add-horse-card {
    border: 2px dashed #D0D0D0; border-radius: 20px; padding: 32px;
    text-align: center; margin-bottom: 16px;
  }
  .add-horse-card i { font-size: 32px; color: #C0C0C0; margin-bottom: 8px; }
  .add-horse-card h4 { font-size: 16px; font-weight: 600; color: #8E8E93; }
  .add-horse-card p { font-size: 12px; color: #B0B0B0; }

  /* Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tab-item i { font-size: 22px; color: #8E8E93; }
  .tab-item span { font-size: 10px; font-weight: 500; color: #8E8E93; }
  .tab-item.active i { color: #4A7C23; }
  .tab-item.active span { color: #4A7C23; font-weight: 600; }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <div class="page-header">
      <div class="page-title">My Horses</div>
      <button class="add-btn"><i class="fas fa-plus"></i></button>
    </div>

    <!-- Primary Horse -->
    <div class="horse-card-lg">
      <div class="horse-hero">
        <img src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=600&h=400&fit=crop" alt="Thunder">
        <div class="sensor-badge">
          <div class="dot"></div>
          <span>Sensor Connected</span>
        </div>
        <div class="horse-hero-overlay">
          <h3>Thunder</h3>
          <p>Hanoverian • Gelding • 8 yrs</p>
        </div>
      </div>
      <div class="horse-details">
        <div class="horse-stats-row">
          <div class="horse-stat">
            <div class="val">142</div>
            <div class="lbl">Sessions</div>
          </div>
          <div class="horse-stat">
            <div class="val">486</div>
            <div class="lbl">km Total</div>
          </div>
          <div class="horse-stat">
            <div class="val">92</div>
            <div class="lbl">Avg Score</div>
          </div>
        </div>
        <div class="health-bar-section">
          <div class="health-label">
            <span>Overall Health</span>
            <span class="score">94/100</span>
          </div>
          <div class="health-bar">
            <div class="health-fill" style="width: 94%;"></div>
          </div>
        </div>
        <div class="horse-actions">
          <button class="action-btn btn-primary"><i class="fas fa-play"></i> Start Session</button>
          <button class="action-btn btn-secondary"><i class="fas fa-cog"></i> Manage</button>
        </div>
      </div>
    </div>

    <!-- Secondary Horse -->
    <div class="horse-card-sm">
      <div class="horse-sm-img">
        <img src="https://images.unsplash.com/photo-1598974357801-cbca100e65d3?w=200&h=200&fit=crop" alt="Bella">
      </div>
      <div class="horse-sm-info">
        <h4>Bella</h4>
        <div class="meta">Arabian • Mare • 6 yrs</div>
        <div class="horse-sm-tags">
          <span class="tag tag-offline">Sensor Off</span>
          <span class="tag tag-rest">Rest Day</span>
        </div>
      </div>
      <div class="horse-sm-score">
        <div class="score">88</div>
        <div class="label">Health</div>
      </div>
    </div>

    <!-- Add Horse -->
    <div class="add-horse-card">
      <i class="fas fa-horse-head"></i>
      <h4>Add New Horse</h4>
      <p>Pair a sensor to get started</p>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <i class="fas fa-house"></i>
      <span>Home</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-chart-bar"></i>
      <span>Analytics</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-plus-circle" style="font-size: 28px;"></i>
      <span>Track</span>
    </div>
    <div class="tab-item active">
      <i class="fas fa-horse-head"></i>
      <span>Horses</span>
    </div>
    <div class="tab-item">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </div>
  </div>
</body>
</html>
