<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemSafe AI - App Design Showcase</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #111; -webkit-font-smoothing: antialiased; }

.hero { text-align: center; padding: 80px 40px 50px; }
.hero .icon-badge { width: 80px; height: 80px; background: linear-gradient(135deg, #FF6B35, #FF3B30); border-radius: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 12px 40px rgba(255,59,48,0.3); }
.hero .icon-badge i { font-size: 36px; color: #fff; }
.hero h1 { font-size: 48px; font-weight: 900; color: #111; line-height: 1.1; margin-bottom: 12px; }
.hero h1 span { background: linear-gradient(135deg, #FF6B35, #FF3B30); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { font-size: 18px; color: #888; max-width: 500px; margin: 0 auto; line-height: 1.5; }

.screens-section { padding: 40px 40px 80px; max-width: 1600px; margin: 0 auto; }
.screens-section h2 { text-align: center; font-size: 32px; font-weight: 800; color: #111; margin-bottom: 50px; }

.screens-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; justify-items: center; }

.phone-frame { width: 460px; height: 980px; background: #000; border-radius: 62px; padding: 12px; box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05); }
.phone-screen { width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #f8f9fa; }
.phone-screen iframe { width: 100%; height: 100%; border: none; }

.screen-label { text-align: center; margin-top: 18px; font-size: 15px; font-weight: 600; color: #666; }

@media (max-width: 1500px) {
    .screens-grid { grid-template-columns: repeat(3, 1fr); gap: 30px; }
    .phone-frame { width: 400px; height: 852px; border-radius: 54px; padding: 10px; }
    .phone-screen { border-radius: 46px; }
}

@media (max-width: 1280px) {
    .screens-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
    .screens-grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 36px; }
}
</style>
</head>
<body>

<div class="hero">
    <div class="icon-badge"><i class="fas fa-flask"></i></div>
    <h1>Chem<span>Safe</span> AI</h1>
    <p>AI-powered chemistry safety companion — identify hazardous materials, access real-time emergency guidance, and build safety expertise.</p>
</div>

<div class="screens-section">
    <h2>App Screenshots</h2>
    <div class="screens-grid">
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="home.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">Home Dashboard</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="scan.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">AI Chemical Scanner</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="emergency.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">Emergency Response</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="training.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">Safety Training</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="reference.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">Chemical Reference</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="sds-detail.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">SDS Detail View</div>
        </div>
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="profile.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="screen-label">User Profile</div>
        </div>
    </div>
</div>

</body>
</html>
