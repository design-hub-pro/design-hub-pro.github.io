<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orator - Record</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #15122A; width: 100%; height: 100%; overflow-x: hidden; scrollbar-width: none; color: #fff; }

  .status-bar { width: 100%; height: 59px; padding: 0 28px 10px; display: flex; justify-content: space-between; align-items: flex-end; position: sticky; top: 0; z-index: 100; }
  .status-time { font-size: 16px; font-weight: 600; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 22px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }

  .content { padding: 0 28px 40px; display: flex; flex-direction: column; height: calc(100% - 59px); }

  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .top-x { width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
  .rec-badge { display: flex; align-items: center; gap: 7px; background: rgba(255,90,90,0.16); padding: 7px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; color: #FF7A7A; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #FF5A5A; box-shadow: 0 0 12px #FF5A5A; }

  .timer { text-align: center; margin-top: 24px; }
  .timer-num { font-size: 56px; font-weight: 900; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .timer-sub { font-size: 13px; color: #9C95C9; font-weight: 600; margin-top: 2px; }

  /* Live waveform */
  .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 150px; margin: 28px 0 8px; }
  .wave span { width: 4px; border-radius: 4px; background: linear-gradient(180deg,#A24BE8,#7B5BF0); }

  .live-tag { text-align: center; font-size: 12px; font-weight: 700; color: #19D3C5; letter-spacing: 1px; text-transform: uppercase; }

  /* Live metrics */
  .live-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 26px; }
  .live-cell { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px 12px; text-align: center; }
  .live-cell i { font-size: 16px; margin-bottom: 8px; }
  .live-v { font-size: 22px; font-weight: 900; }
  .live-l { font-size: 10px; color: #9C95C9; font-weight: 600; margin-top: 3px; }

  /* Real-time coach tip */
  .tip { margin-top: 22px; background: rgba(25,211,197,0.12); border: 1px solid rgba(25,211,197,0.25); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .tip i { color: #19D3C5; font-size: 18px; }
  .tip-txt { font-size: 13px; font-weight: 600; color: #C8FFF9; }

  .controls { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 40px; padding-top: 24px; }
  .ctrl-side { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #C7C0EA; }
  .ctrl-stop { width: 86px; height: 86px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px rgba(255,255,255,0.14); }
  .ctrl-stop .inner { width: 32px; height: 32px; border-radius: 9px; background: #FF5A5A; }
</style>
</head>
<body>

<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<div class="content">
  <div class="top">
    <div class="top-x"><i class="fas fa-xmark"></i></div>
    <div class="rec-badge"><span class="rec-dot"></span> RECORDING</div>
    <div class="top-x"><i class="fas fa-gear"></i></div>
  </div>

  <div class="timer">
    <div class="timer-num">01:24</div>
    <div class="timer-sub">Investor Pitch · live analysis on</div>
  </div>

  <div class="wave">
    <span style="height:30px"></span><span style="height:62px"></span><span style="height:44px"></span><span style="height:96px"></span><span style="height:70px"></span>
    <span style="height:120px"></span><span style="height:54px"></span><span style="height:88px"></span><span style="height:140px"></span><span style="height:66px"></span>
    <span style="height:40px"></span><span style="height:104px"></span><span style="height:78px"></span><span style="height:130px"></span><span style="height:50px"></span>
    <span style="height:92px"></span><span style="height:60px"></span><span style="height:34px"></span><span style="height:74px"></span><span style="height:46px"></span>
    <span style="height:110px"></span><span style="height:58px"></span><span style="height:84px"></span><span style="height:38px"></span><span style="height:68px"></span>
  </div>
  <div class="live-tag"><i class="fas fa-wave-square"></i> Capturing pitch · energy · rhythm</div>

  <div class="live-grid">
    <div class="live-cell">
      <i class="fas fa-gauge-high" style="color:#19D3C5;"></i>
      <div class="live-v">142</div>
      <div class="live-l">PACE wpm</div>
    </div>
    <div class="live-cell">
      <i class="fas fa-music" style="color:#FFB13C;"></i>
      <div class="live-v">±79</div>
      <div class="live-l">PITCH Hz</div>
    </div>
    <div class="live-cell">
      <i class="fas fa-volume-high" style="color:#A24BE8;"></i>
      <div class="live-v">12 dB</div>
      <div class="live-l">DYNAMICS</div>
    </div>
  </div>

  <div class="tip">
    <i class="fas fa-bolt"></i>
    <div class="tip-txt">Slow down slightly — top speakers land near 130 wpm here.</div>
  </div>

  <div class="controls">
    <div class="ctrl-side"><i class="fas fa-flag"></i></div>
    <div class="ctrl-stop"><div class="inner"></div></div>
    <div class="ctrl-side"><i class="fas fa-pause"></i></div>
  </div>
</div>

</body>
</html>
