<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:#7C5CFC;width:100%;height:100%;margin:0;overflow:hidden;color:#2D2150}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(160deg,#8B6FFF 0%,#6C4EE8 60%,#5B3FD6 100%)}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:700;color:#fff}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.content{height:calc(100% - 59px);overflow-y:auto;padding:0 28px 28px}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
.progdot{height:6px;border-radius:6px;background:rgba(255,255,255,0.3)}
.progdot.on{background:#FFC24B}
.card{background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.28)}
.audio-btn{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#FFC24B,#FF9A3D);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(255,154,61,0.5);border:5px solid #fff}
.pill{background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);border-radius:16px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <!-- Top bar -->
    <div class="flex items-center justify-between mt-1 mb-4">
      <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white"><i class="fas fa-xmark"></i></div>
      <div class="flex items-center gap-1.5 pill px-3 py-1.5">
        <i class="fas fa-star text-[#FFC24B] text-sm"></i><span class="text-white font-extrabold text-sm">+4</span>
      </div>
    </div>

    <!-- Progress dots -->
    <div class="flex gap-1.5 mb-6">
      <div class="progdot on flex-1"></div>
      <div class="progdot on flex-1"></div>
      <div class="progdot on flex-1"></div>
      <div class="progdot on flex-1"></div>
      <div class="progdot flex-1"></div>
      <div class="progdot flex-1"></div>
    </div>

    <!-- Word card -->
    <div class="card">
      <div class="relative h-72">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&h=600&fit=crop" class="w-full h-full object-cover">
        <div class="absolute top-3 right-3 bg-white/90 text-[#7C5CFC] text-[11px] font-extrabold px-3 py-1.5 rounded-full">🐾 ANIMALS</div>
      </div>
      <div class="py-7 text-center">
        <h1 class="text-6xl font-extrabold baloo text-gray-900 tracking-wide">Dog</h1>
        <p class="text-base text-gray-400 font-bold mt-1">/dôɡ/</p>
      </div>
    </div>

    <!-- Audio + repeat -->
    <div class="flex items-center justify-center gap-6 mt-7">
      <div class="w-14 h-14 rounded-full bg-white/18 flex items-center justify-center text-white text-lg"><i class="fas fa-rotate-left"></i></div>
      <div class="audio-btn"><i class="fas fa-volume-high text-white text-3xl"></i></div>
      <div class="w-14 h-14 rounded-full bg-white/18 flex items-center justify-center text-white text-lg"><i class="fas fa-microphone"></i></div>
    </div>
    <p class="text-center text-white/80 font-bold text-sm mt-4">Tap to hear the word 🔊</p>

    <!-- Next button -->
    <button class="w-full mt-7 bg-white text-[#6C4EE8] font-extrabold text-lg py-4 rounded-3xl flex items-center justify-center gap-2 shadow-xl baloo">
      Next Word <i class="fas fa-arrow-right"></i>
    </button>
  </div>
</div>
</body>
</html>
