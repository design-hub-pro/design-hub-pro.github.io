<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learn</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:#F4F1FF;width:100%;height:100%;margin:0;overflow:hidden;color:#2D2150}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:700;color:#2D2150}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.content{height:calc(100% - 59px - 92px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);border-top:1px solid #EBE5FF;display:flex;justify-content:space-around;align-items:flex-start;padding-top:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:#B9AEE0;font-size:10px;font-weight:800}
.tab.active{color:#7C5CFC}
.tab i{font-size:21px}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
.cat{border-radius:28px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:138px;display:flex;flex-direction:column;justify-content:space-between}
.cat .ring{position:absolute;top:-30px;right:-30px;width:110px;height:110px;background:rgba(255,255,255,0.15);border-radius:50%}
.progress{height:7px;background:rgba(255,255,255,0.3);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:6px}
.soft{box-shadow:0 8px 24px rgba(124,92,252,0.10)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="mt-2 mb-5">
      <p class="text-xs text-[#7C5CFC] font-extrabold">PICK A WORLD</p>
      <h1 class="text-3xl font-extrabold text-gray-900 leading-tight">Word Worlds 🌈</h1>
    </div>

    <!-- Search -->
    <div class="flex items-center gap-3 bg-white rounded-2xl px-4 py-3 soft mb-5">
      <i class="fas fa-magnifying-glass text-[#B9AEE0]"></i>
      <span class="text-sm text-[#B9AEE0] font-bold">Find a word...</span>
    </div>

    <!-- Category grid -->
    <div class="grid grid-cols-2 gap-4">
      <div class="cat" style="background:linear-gradient(135deg,#FF9A6B,#FF6B8A)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">🐶</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">Animals</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">18/30 words</p>
          <div class="progress"><div class="progress-fill" style="width:60%"></div></div>
        </div>
      </div>
      <div class="cat" style="background:linear-gradient(135deg,#4ED9B0,#2DA88A)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">🍎</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">Food</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">12/24 words</p>
          <div class="progress"><div class="progress-fill" style="width:50%"></div></div>
        </div>
      </div>
      <div class="cat" style="background:linear-gradient(135deg,#7C9BFF,#5B6FE8)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">🚗</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">Vehicles</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">9/18 words</p>
          <div class="progress"><div class="progress-fill" style="width:50%"></div></div>
        </div>
      </div>
      <div class="cat" style="background:linear-gradient(135deg,#FFC24B,#FF9A3D)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">🎨</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">Colors</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">6/12 words</p>
          <div class="progress"><div class="progress-fill" style="width:50%"></div></div>
        </div>
      </div>
      <div class="cat" style="background:linear-gradient(135deg,#C18BFF,#8B5CF6)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">👋</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">My Body</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">4/14 words</p>
          <div class="progress"><div class="progress-fill" style="width:28%"></div></div>
        </div>
      </div>
      <div class="cat" style="background:linear-gradient(135deg,#5BD3FF,#3BA9E8)">
        <div class="ring"></div>
        <div class="text-4xl relative z-10">🔢</div>
        <div class="relative z-10">
          <p class="font-extrabold text-lg baloo">Numbers</p>
          <p class="text-[11px] opacity-90 font-bold mb-2">3/10 words</p>
          <div class="progress"><div class="progress-fill" style="width:30%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab active"><i class="fas fa-shapes"></i><span>Learn</span></div>
    <div class="tab"><i class="fas fa-gamepad"></i><span>Games</span></div>
    <div class="tab"><i class="fas fa-star"></i><span>Stars</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
