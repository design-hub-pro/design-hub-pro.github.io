<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parent Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:#F4F1FF;width:100%;height:100%;margin:0;overflow:hidden;color:#2D2150}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:700;color:#2D2150}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.content{height:calc(100% - 59px - 92px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);border-top:1px solid #EBE5FF;display:flex;justify-content:space-around;align-items:flex-start;padding-top:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:#B9AEE0;font-size:10px;font-weight:800}
.tab.active{color:#7C5CFC}
.tab i{font-size:21px}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
.soft{box-shadow:0 8px 24px rgba(124,92,252,0.10)}
.hero{background:linear-gradient(135deg,#5B3FD6,#7C5CFC);border-radius:30px;padding:22px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-30px;width:140px;height:140px;background:rgba(255,255,255,0.12);border-radius:50%}
.bar{width:100%;background:#EBE5FF;border-radius:8px;display:flex;align-items:flex-end;justify-content:center}
.bar-fill{width:60%;border-radius:8px;background:linear-gradient(180deg,#8B6FFF,#6C4EE8)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-5">
      <div>
        <p class="text-xs text-[#7C5CFC] font-extrabold">PARENT DASHBOARD</p>
        <h1 class="text-2xl font-extrabold text-gray-900 leading-tight">Mia's Progress</h1>
      </div>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center soft text-[#7C5CFC]"><i class="fas fa-shield-halved"></i></div>
    </div>

    <!-- Hero summary -->
    <div class="hero">
      <div class="relative z-10">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold opacity-90">This week</span>
          <span class="bg-white/22 text-[11px] font-extrabold px-3 py-1 rounded-full"><i class="fas fa-arrow-up"></i> +18%</span>
        </div>
        <p class="text-5xl font-extrabold baloo">42 <span class="text-xl font-bold opacity-80">new words</span></p>
        <div class="flex items-center gap-2 mt-3 text-xs font-bold opacity-90">
          <i class="fas fa-clock"></i> 1h 24m learning time · 6 day streak 🔥
        </div>
      </div>
    </div>

    <!-- Weekly chart -->
    <div class="bg-white rounded-3xl p-5 mt-5 soft">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-extrabold text-gray-900">Words Learned</h3>
        <span class="text-[11px] text-gray-400 font-bold">Last 7 days</span>
      </div>
      <div class="flex items-end justify-between gap-2 h-28">
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:55%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">M</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:75%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">T</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:45%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">W</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:85%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">T</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:65%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">F</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:100%"><div class="bar-fill" style="height:100%;background:linear-gradient(180deg,#FFC24B,#FF9A3D)"></div></div><span class="text-[10px] text-[#FF9A3D] font-extrabold">S</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="bar" style="height:70%"><div class="bar-fill" style="height:100%"></div></div><span class="text-[10px] text-gray-400 font-bold">S</span></div>
      </div>
    </div>

    <!-- Mastery by world -->
    <h3 class="text-lg font-extrabold text-gray-900 mt-7 mb-3">Mastery by World</h3>
    <div class="space-y-3">
      <div class="bg-white rounded-2xl p-4 soft flex items-center gap-3">
        <div class="text-2xl">🐶</div>
        <div class="flex-1">
          <div class="flex justify-between mb-1.5"><span class="text-sm font-extrabold text-gray-800">Animals</span><span class="text-xs font-extrabold text-[#FF6B8A]">60%</span></div>
          <div class="h-2 bg-[#EBE5FF] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:60%;background:linear-gradient(90deg,#FF9A6B,#FF6B8A)"></div></div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 soft flex items-center gap-3">
        <div class="text-2xl">🍎</div>
        <div class="flex-1">
          <div class="flex justify-between mb-1.5"><span class="text-sm font-extrabold text-gray-800">Food</span><span class="text-xs font-extrabold text-[#2DD4A7]">50%</span></div>
          <div class="h-2 bg-[#EBE5FF] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:50%;background:linear-gradient(90deg,#4ED9B0,#2DA88A)"></div></div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 soft flex items-center gap-3">
        <div class="text-2xl">🚗</div>
        <div class="flex-1">
          <div class="flex justify-between mb-1.5"><span class="text-sm font-extrabold text-gray-800">Vehicles</span><span class="text-xs font-extrabold text-[#5B6FE8]">50%</span></div>
          <div class="h-2 bg-[#EBE5FF] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:50%;background:linear-gradient(90deg,#7C9BFF,#5B6FE8)"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-shapes"></i><span>Learn</span></div>
    <div class="tab"><i class="fas fa-gamepad"></i><span>Games</span></div>
    <div class="tab"><i class="fas fa-star"></i><span>Stars</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
