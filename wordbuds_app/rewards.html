<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stars</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:#F4F1FF;width:100%;height:100%;margin:0;overflow:hidden;color:#2D2150}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:700;color:#2D2150}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.content{height:calc(100% - 59px - 92px);overflow-y:auto;padding:0 28px 24px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);border-top:1px solid #EBE5FF;display:flex;justify-content:space-around;align-items:flex-start;padding-top:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:#B9AEE0;font-size:10px;font-weight:800}
.tab.active{color:#7C5CFC}
.tab i{font-size:21px}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
.soft{box-shadow:0 8px 24px rgba(124,92,252,0.10)}
.hero{background:linear-gradient(135deg,#FFC24B,#FF9A3D);border-radius:32px;padding:24px;color:#fff;position:relative;overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;top:-40px;left:-30px;width:130px;height:130px;background:rgba(255,255,255,0.16);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-50px;right:-20px;width:150px;height:150px;background:rgba(255,255,255,0.12);border-radius:50%}
.badge{background:#fff;border-radius:24px;padding:14px;text-align:center}
.badge.locked{opacity:0.45}
.medal{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 8px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="mt-2 mb-5">
      <p class="text-xs text-[#FF9A3D] font-extrabold">YOUR COLLECTION</p>
      <h1 class="text-3xl font-extrabold text-gray-900 leading-tight">My Rewards ⭐</h1>
    </div>

    <!-- Stars hero -->
    <div class="hero">
      <div class="relative z-10">
        <div class="text-5xl mb-2">🏆</div>
        <p class="text-6xl font-extrabold baloo leading-none">24</p>
        <p class="text-sm font-bold opacity-90 mt-1">Stars collected this week</p>
        <div class="bg-white/22 rounded-2xl px-4 py-2.5 mt-4 inline-flex items-center gap-2 text-sm font-extrabold">
          <i class="fas fa-gift"></i> 6 more for a new sticker!
        </div>
      </div>
    </div>

    <!-- Badges -->
    <div class="flex items-center justify-between mt-7 mb-3">
      <h3 class="text-lg font-extrabold text-gray-900">Badges</h3>
      <span class="text-xs text-[#7C5CFC] font-extrabold">9 of 20</span>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <div class="badge soft">
        <div class="medal" style="background:linear-gradient(135deg,#FF9A6B,#FF6B8A)">🐶</div>
        <p class="text-[11px] font-extrabold text-gray-800">Animal Pro</p>
      </div>
      <div class="badge soft">
        <div class="medal" style="background:linear-gradient(135deg,#4ED9B0,#2DA88A)">🍎</div>
        <p class="text-[11px] font-extrabold text-gray-800">Foodie</p>
      </div>
      <div class="badge soft">
        <div class="medal" style="background:linear-gradient(135deg,#FFC24B,#FF9A3D)">🔥</div>
        <p class="text-[11px] font-extrabold text-gray-800">5-Day Streak</p>
      </div>
      <div class="badge soft">
        <div class="medal" style="background:linear-gradient(135deg,#7C9BFF,#5B6FE8)">🚗</div>
        <p class="text-[11px] font-extrabold text-gray-800">Speedy</p>
      </div>
      <div class="badge soft">
        <div class="medal" style="background:linear-gradient(135deg,#C18BFF,#8B5CF6)">🎤</div>
        <p class="text-[11px] font-extrabold text-gray-800">First Words</p>
      </div>
      <div class="badge locked soft">
        <div class="medal" style="background:#D9D3F0"><i class="fas fa-lock text-white text-xl"></i></div>
        <p class="text-[11px] font-extrabold text-gray-500">Color Star</p>
      </div>
    </div>

    <!-- Sticker book -->
    <div class="flex items-center justify-between mt-7 mb-3">
      <h3 class="text-lg font-extrabold text-gray-900">Sticker Book</h3>
      <span class="text-xs text-[#7C5CFC] font-extrabold">Open</span>
    </div>
    <div class="flex gap-3 overflow-x-auto -mx-7 px-7 pb-2">
      <div class="w-20 h-20 rounded-3xl bg-white flex items-center justify-center text-4xl soft flex-shrink-0">🌈</div>
      <div class="w-20 h-20 rounded-3xl bg-white flex items-center justify-center text-4xl soft flex-shrink-0">🦄</div>
      <div class="w-20 h-20 rounded-3xl bg-white flex items-center justify-center text-4xl soft flex-shrink-0">🚀</div>
      <div class="w-20 h-20 rounded-3xl bg-white flex items-center justify-center text-4xl soft flex-shrink-0">🐙</div>
      <div class="w-20 h-20 rounded-3xl bg-[#EFEAFF] flex items-center justify-center text-3xl text-[#B9AEE0] soft flex-shrink-0"><i class="fas fa-lock"></i></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-shapes"></i><span>Learn</span></div>
    <div class="tab"><i class="fas fa-gamepad"></i><span>Games</span></div>
    <div class="tab active"><i class="fas fa-star"></i><span>Stars</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
