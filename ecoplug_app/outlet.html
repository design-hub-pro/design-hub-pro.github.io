<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#f6f7f5}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 140px}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -28px;padding:0 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid #ebedea;display:flex;justify-content:space-around;align-items:flex-start;padding:14px 20px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#9ca3af;width:64px}
.tab i{font-size:21px}
.tab.active{color:#059669}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:45}
.toggle{width:52px;height:31px;border-radius:16px;background:#d1d5db;position:relative;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#10b981}.toggle.on::after{left:23px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content">
    <div class="flex items-center justify-between pt-2 pb-5">
      <div class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-gray-700"><i class="fas fa-chevron-left"></i></div>
      <p class="text-[17px] font-bold text-gray-900">Space Heater</p>
      <div class="w-10 h-10 rounded-full bg-white border border-gray-100 flex items-center justify-center text-gray-700"><i class="fas fa-ellipsis"></i></div>
    </div>

    <!-- Big dial -->
    <div class="bg-white rounded-3xl border border-gray-100 p-6 mb-4 flex flex-col items-center">
      <div class="relative w-[220px] h-[220px]">
        <svg viewBox="0 0 220 220" class="w-full h-full -rotate-90">
          <circle cx="110" cy="110" r="96" fill="none" stroke="#f1f3f0" stroke-width="16"/>
          <circle cx="110" cy="110" r="96" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="150"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-[12px] font-semibold text-gray-400 tracking-wide">NOW</span>
          <span class="text-[46px] font-bold text-gray-900 leading-none mt-1">1,420</span>
          <span class="text-[15px] font-semibold text-gray-400 mt-1">watts</span>
        </div>
      </div>
      <div class="flex items-center gap-2 mt-4 bg-rose-50 text-rose-600 text-[12px] font-bold px-3 py-1.5 rounded-full"><i class="fas fa-triangle-exclamation"></i>Above your 1,000 W limit</div>
    </div>

    <!-- Power toggle -->
    <div class="bg-white rounded-2xl border border-gray-100 p-4 flex items-center gap-4 mb-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-400 to-rose-600 text-white flex items-center justify-center text-[18px]"><i class="fas fa-power-off"></i></div>
      <div class="flex-1">
        <p class="text-[15px] font-bold text-gray-900">Power</p>
        <p class="text-[12px] text-gray-400 mt-[2px]">On for 3h 12m · Bedroom</p>
      </div>
      <div class="toggle on"></div>
    </div>

    <!-- Today stats -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-2xl border border-gray-100 p-4">
        <p class="text-[11px] text-gray-400 font-semibold tracking-wide">TODAY</p>
        <p class="text-[28px] font-bold text-gray-900 leading-none mt-2">3.6 <span class="text-[14px] text-gray-400">kWh</span></p>
        <p class="text-[12px] text-rose-500 font-semibold mt-2"><i class="fas fa-arrow-up"></i> 41% vs avg</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 p-4">
        <p class="text-[11px] text-gray-400 font-semibold tracking-wide">COST TODAY</p>
        <p class="text-[28px] font-bold text-gray-900 leading-none mt-2">$0.54</p>
        <p class="text-[12px] text-gray-400 font-medium mt-2">at $0.15 / kWh</p>
      </div>
    </div>

    <!-- 24h bars -->
    <div class="bg-white rounded-2xl border border-gray-100 p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[15px] font-bold text-gray-900">Last 24 hours</p>
        <span class="text-[12px] text-gray-400 font-medium">W per hour</span>
      </div>
      <div class="flex items-end gap-[5px] h-[90px]">
        <div class="flex-1 rounded-t bg-emerald-200" style="height:8%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:8%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-300" style="height:30%"></div><div class="flex-1 rounded-t bg-emerald-400" style="height:70%"></div><div class="flex-1 rounded-t bg-emerald-400" style="height:68%"></div><div class="flex-1 rounded-t bg-emerald-300" style="height:22%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-200" style="height:6%"></div><div class="flex-1 rounded-t bg-emerald-300" style="height:40%"></div><div class="flex-1 rounded-t bg-emerald-400" style="height:75%"></div><div class="flex-1 rounded-t bg-emerald-500" style="height:92%"></div><div class="flex-1 rounded-t bg-rose-400" style="height:100%"></div><div class="flex-1 rounded-t bg-rose-500" style="height:100%"></div><div class="flex-1 rounded-t bg-rose-500" style="height:98%"></div><div class="flex-1 rounded-t bg-rose-500" style="height:100%"></div>
      </div>
      <div class="flex justify-between text-[10px] text-gray-400 font-medium mt-2"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>now</span></div>
    </div>

    <!-- Schedule row -->
    <div class="bg-white rounded-2xl border border-gray-100 p-4 flex items-center gap-4">
      <div class="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fas fa-clock"></i></div>
      <div class="flex-1">
        <p class="text-[15px] font-bold text-gray-900">Auto-off at 11:00 PM</p>
        <p class="text-[12px] text-gray-400 mt-[2px]">Every night</p>
      </div>
      <i class="fas fa-chevron-right text-gray-300"></i>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-chart-simple"></i><span>History</span></div>
    <div class="tab active"><i class="fas fa-plug"></i><span>Outlets</span></div>
    <div class="tab"><i class="fas fa-bell"></i><span>Alerts</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
  <div class="home-ind"></div>
</div></body></html>
