<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#f6f7f5}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 140px}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -28px;padding:0 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid #ebedea;display:flex;justify-content:space-around;align-items:flex-start;padding:14px 20px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#9ca3af;width:64px}
.tab i{font-size:21px}
.tab.active{color:#059669}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:45}
.toggle{width:52px;height:31px;border-radius:16px;background:#d1d5db;position:relative;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#10b981}.toggle.on::after{left:23px}
</style>
</head>
<body>
<div class="screen" style="background:#fff">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content" style="padding-bottom:40px">
    <div class="flex items-center justify-between pt-2 pb-4">
      <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700"><i class="fas fa-xmark"></i></div>
      <p class="text-[17px] font-bold text-gray-900">Add outlet</p>
      <span class="text-[13px] font-semibold text-emerald-600 w-10">Skip</span>
    </div>

    <!-- Steps -->
    <div class="flex items-center gap-2 mb-6">
      <span class="flex-1 h-[5px] rounded-full bg-emerald-600"></span>
      <span class="flex-1 h-[5px] rounded-full bg-emerald-600"></span>
      <span class="flex-1 h-[5px] rounded-full bg-gray-200"></span>
    </div>

    <div class="relative rounded-3xl overflow-hidden h-[300px] mb-6">
      <img src="https://images.unsplash.com/photo-1558002038-1055907df827?q=80&w=900&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
      <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 to-transparent"></div>
      <div class="absolute inset-x-0 bottom-0 p-5">
        <div class="flex items-center gap-2 mb-2"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span class="text-[11px] font-bold text-white/80 tracking-wide">SEARCHING NEARBY</span></div>
        <p class="text-white text-[22px] font-bold leading-tight">Found EcoPlug Strip</p>
        <p class="text-white/70 text-[13px] mt-1">Serial EP-4F2A · 4 sockets</p>
      </div>
    </div>

    <p class="text-[12px] font-bold text-gray-400 tracking-wide mb-3">NAME EACH SOCKET</p>
    <div class="space-y-3 mb-6">
      <div class="bg-gray-50 rounded-2xl p-4 flex items-center gap-4 border border-gray-100">
        <span class="w-8 h-8 rounded-full bg-gray-900 text-white text-[13px] font-bold flex items-center justify-center">1</span>
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 text-white flex items-center justify-center"><i class="fas fa-snowflake"></i></div>
        <p class="flex-1 text-[15px] font-semibold text-gray-900">Fridge</p>
        <i class="fas fa-circle-check text-emerald-500"></i>
      </div>
      <div class="bg-gray-50 rounded-2xl p-4 flex items-center gap-4 border border-gray-100">
        <span class="w-8 h-8 rounded-full bg-gray-900 text-white text-[13px] font-bold flex items-center justify-center">2</span>
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center"><i class="fas fa-mug-hot"></i></div>
        <p class="flex-1 text-[15px] font-semibold text-gray-900">Coffee Maker</p>
        <i class="fas fa-circle-check text-emerald-500"></i>
      </div>
      <div class="bg-white rounded-2xl p-4 flex items-center gap-4 border-2 border-emerald-500">
        <span class="w-8 h-8 rounded-full bg-emerald-600 text-white text-[13px] font-bold flex items-center justify-center">3</span>
        <div class="w-10 h-10 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center"><i class="fas fa-plug"></i></div>
        <p class="flex-1 text-[15px] font-medium text-gray-400">Microwave<span class="inline-block w-[2px] h-4 bg-emerald-600 ml-[1px] align-middle"></span></p>
        <span class="text-[11px] text-gray-400 font-medium">38 W now</span>
      </div>
      <div class="bg-gray-50 rounded-2xl p-4 flex items-center gap-4 border border-gray-100">
        <span class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 text-[13px] font-bold flex items-center justify-center">4</span>
        <div class="w-10 h-10 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center"><i class="fas fa-plug"></i></div>
        <p class="flex-1 text-[15px] font-medium text-gray-400">Nothing plugged in</p>
      </div>
    </div>

    <button class="w-full bg-emerald-600 text-white text-[17px] font-bold py-[18px] rounded-2xl shadow-lg shadow-emerald-600/30">Continue</button>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
