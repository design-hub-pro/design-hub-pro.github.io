<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#f6f7f5}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 140px}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -28px;padding:0 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid #ebedea;display:flex;justify-content:space-around;align-items:flex-start;padding:14px 20px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#9ca3af;width:64px}
.tab i{font-size:21px}
.tab.active{color:#059669}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:45}
.toggle{width:52px;height:31px;border-radius:16px;background:#d1d5db;position:relative;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#10b981}.toggle.on::after{left:23px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar text-gray-900">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <!-- Dimmed home behind the sheet -->
  <div class="content" style="opacity:.35;filter:blur(1px)">
    <div class="flex items-center justify-between pt-2 pb-5">
      <div>
        <p class="text-[13px] text-gray-400 font-medium">Good morning</p>
        <p class="text-[22px] font-bold text-gray-900 tracking-tight">Maple St. Home</p>
      </div>
      <div class="w-11 h-11 rounded-full bg-gray-200"></div>
    </div>
    <div class="rounded-3xl h-48 mb-5" style="background:linear-gradient(135deg,#064e3b,#34d399)"></div>
    <div class="grid grid-cols-3 gap-3 mb-6"><div class="bg-white rounded-2xl h-24 border border-gray-100"></div><div class="bg-white rounded-2xl h-24 border border-gray-100"></div><div class="bg-white rounded-2xl h-24 border border-gray-100"></div></div>
    <div class="space-y-3"><div class="bg-white rounded-2xl h-20 border border-gray-100"></div><div class="bg-white rounded-2xl h-20 border border-gray-100"></div></div>
  </div>
  <div class="absolute inset-0 bg-gray-900/40 z-30"></div>

  <!-- Push banner -->
  <div class="absolute left-4 right-4 top-[64px] z-50 bg-white/95 backdrop-blur rounded-3xl p-4 shadow-2xl flex items-start gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-plug text-[15px]"></i></div>
    <div class="flex-1">
      <div class="flex items-center justify-between"><p class="text-[14px] font-bold text-gray-900">EcoPlug</p><span class="text-[11px] text-gray-400">now</span></div>
      <p class="text-[13px] text-gray-700 leading-snug">Space Heater has drawn 1,420 W for 3 hours. That is about $0.64 so far.</p>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div class="absolute left-0 right-0 bottom-0 z-40 bg-white rounded-t-[36px] px-7 pt-3 pb-12">
    <div class="w-10 h-[5px] rounded-full bg-gray-300 mx-auto mb-5"></div>

    <div class="flex items-center gap-4 mb-5">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-rose-600 text-white flex items-center justify-center text-[22px]"><i class="fas fa-fire"></i></div>
      <div class="flex-1">
        <p class="text-[20px] font-bold text-gray-900">Space Heater</p>
        <p class="text-[13px] text-gray-400 font-medium">Bedroom · on since 6:28 AM</p>
      </div>
      <span class="bg-rose-50 text-rose-600 text-[11px] font-bold px-3 py-1.5 rounded-full">HIGH</span>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-rose-50 rounded-2xl p-3 text-center">
        <p class="text-[24px] font-bold text-rose-600 leading-none">1,420</p>
        <p class="text-[11px] text-rose-400 font-semibold mt-1">W now</p>
      </div>
      <div class="bg-gray-50 rounded-2xl p-3 text-center">
        <p class="text-[24px] font-bold text-gray-900 leading-none">4.3</p>
        <p class="text-[11px] text-gray-400 font-semibold mt-1">kWh today</p>
      </div>
      <div class="bg-gray-50 rounded-2xl p-3 text-center">
        <p class="text-[24px] font-bold text-gray-900 leading-none">$19</p>
        <p class="text-[11px] text-gray-400 font-semibold mt-1">if left on / mo</p>
      </div>
    </div>

    <!-- Mini sparkline -->
    <div class="bg-gray-50 rounded-2xl p-4 mb-5">
      <div class="flex items-center justify-between mb-2">
        <p class="text-[12px] font-bold text-gray-500">LAST 4 HOURS</p>
        <p class="text-[12px] font-semibold text-gray-400">Limit 1,000 W</p>
      </div>
      <svg viewBox="0 0 340 70" class="w-full h-[70px]">
        <line x1="0" y1="26" x2="340" y2="26" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="M0 62 L30 60 L60 58 L80 40 L100 18 L130 14 L160 16 L190 12 L220 15 L250 10 L280 13 L310 9 L340 11 L340 70 L0 70 Z" fill="url(#f)"/>
        <path d="M0 62 L30 60 L60 58 L80 40 L100 18 L130 14 L160 16 L190 12 L220 15 L250 10 L280 13 L310 9 L340 11" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="340" cy="11" r="4" fill="#e11d48"/>
        <defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity=".35"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient></defs>
      </svg>
    </div>

    <button class="w-full bg-rose-500 text-white text-[17px] font-bold py-[18px] rounded-2xl shadow-lg shadow-rose-500/30 mb-3"><i class="fas fa-power-off mr-2"></i>Turn off now</button>
    <div class="flex gap-3">
      <button class="flex-1 bg-gray-100 text-gray-800 text-[15px] font-bold py-[14px] rounded-2xl">Snooze 1h</button>
      <button class="flex-1 bg-gray-100 text-gray-800 text-[15px] font-bold py-[14px] rounded-2xl">Raise limit</button>
    </div>
  </div>
  <div class="home-ind" style="background:#fff;opacity:.9"></div>
</div>
</body></html>
