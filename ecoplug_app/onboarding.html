<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#fff}
.screen{width:100%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#f6f7f5}
.status-bar{height:59px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;background:#000;border-radius:20px;z-index:50}
.content{flex:1;overflow-y:auto;padding:0 28px 140px}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -28px;padding:0 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid #ebedea;display:flex;justify-content:space-around;align-items:flex-start;padding:14px 20px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#9ca3af;width:64px}
.tab i{font-size:21px}
.tab.active{color:#059669}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:45}
.toggle{width:52px;height:31px;border-radius:16px;background:#d1d5db;position:relative;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:#10b981}.toggle.on::after{left:23px}
</style>
</head>
<body>
<div class="screen" style="background:#fff">
  <div class="dynamic-island"></div>
  <div class="status-bar text-white" style="position:absolute;top:0;left:0;right:0;z-index:20">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="relative h-[600px] flex-shrink-0 overflow-hidden">
    <img src="https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
    <div class="absolute inset-0" style="background:linear-gradient(to bottom,rgba(6,78,59,.35) 0%,rgba(6,78,59,.1) 40%,rgba(255,255,255,0) 75%,#fff 100%)"></div>
    <div class="absolute top-[120px] left-7">
      <div class="w-14 h-14 rounded-2xl bg-white/90 backdrop-blur flex items-center justify-center shadow-lg">
        <i class="fas fa-plug text-emerald-600 text-2xl"></i>
      </div>
    </div>
    <!-- floating live card -->
    <div class="absolute right-7 top-[300px] bg-white/95 backdrop-blur rounded-2xl p-4 shadow-xl w-[180px]">
      <div class="flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-[11px] font-semibold text-gray-500">LIVE</span></div>
      <p class="text-[30px] font-bold text-gray-900 leading-none">412<span class="text-[14px] text-gray-400 ml-1">W</span></p>
      <p class="text-[11px] text-emerald-600 font-semibold mt-1"><i class="fas fa-arrow-trend-down"></i> 18% this week</p>
    </div>
  </div>

  <div class="px-7 -mt-6 flex-1 flex flex-col">
    <h1 class="text-[36px] font-bold text-gray-900 leading-[1.05] tracking-tight">See what every<br>outlet costs you.</h1>
    <p class="text-[16px] text-gray-500 mt-4 leading-relaxed">Meter each socket, switch it off from anywhere, and catch the devices that waste power.</p>

    <div class="flex gap-2 mt-6">
      <span class="w-7 h-[6px] rounded-full bg-emerald-600"></span>
      <span class="w-[6px] h-[6px] rounded-full bg-gray-200"></span>
      <span class="w-[6px] h-[6px] rounded-full bg-gray-200"></span>
    </div>

    <div class="mt-auto pb-12">
      <button class="w-full bg-emerald-600 text-white text-[17px] font-bold py-[18px] rounded-2xl shadow-lg shadow-emerald-600/30">Set up my EcoPlug</button>
      <p class="text-center text-[14px] text-gray-400 font-medium mt-4">Already have an account? <span class="text-emerald-600 font-semibold">Sign in</span></p>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
