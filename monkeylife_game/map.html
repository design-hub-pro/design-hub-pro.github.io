<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLife - World Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
        html,body{width:100%;height:100%;overflow:hidden}

        @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(251,191,36,.4)}70%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(251,191,36,0)}}
        @keyframes dotPulse{0%,100%{opacity:.5}50%{opacity:1}}
        .pulse{animation:pulse 2s ease-in-out infinite}
        .dot-pulse{animation:dotPulse 1.5s ease-in-out infinite}

        .path-dot{width:6px;height:6px;background:rgba(255,255,255,.15);border-radius:50%}
        .path-dot.active{background:rgba(74,222,128,.6)}
        .zone-node{transition:all .2s ease}
        .zone-node:hover{transform:scale(1.08)}
    </style>
</head>
<body class="relative overflow-hidden">
    <!-- World map background -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=70"
             class="w-full h-full object-cover" alt="aerial landscape"
             style="filter:saturate(.6) brightness(.35) hue-rotate(20deg)">
        <div class="absolute inset-0" style="background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.6) 100%)"></div>
        <!-- Grid overlay for map feel -->
        <div class="absolute inset-0 opacity-5" style="background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:40px 40px"></div>
    </div>

    <!-- === PATH CONNECTIONS (SVG) === -->
    <svg class="absolute inset-0 z-10" width="100%" height="100%" style="pointer-events:none">
        <!-- Path: Dense Forest → Mountain Ridge -->
        <line x1="18%" y1="65%" x2="35%" y2="38%" stroke="rgba(74,222,128,.3)" stroke-width="2" stroke-dasharray="6 4"/>
        <!-- Path: Mountain Ridge → River Valley -->
        <line x1="38%" y1="35%" x2="55%" y2="55%" stroke="rgba(74,222,128,.3)" stroke-width="2" stroke-dasharray="6 4"/>
        <!-- Path: River Valley → Human Settlement -->
        <line x1="58%" y1="52%" x2="72%" y2="30%" stroke="rgba(255,255,255,.1)" stroke-width="2" stroke-dasharray="6 4"/>
        <!-- Path: Human Settlement → Protected Reserve -->
        <line x1="75%" y1="30%" x2="88%" y2="55%" stroke="rgba(255,255,255,.08)" stroke-width="2" stroke-dasharray="6 4"/>
    </svg>

    <!-- === ZONE NODES === -->

    <!-- Zone 1: Dense Forest (Completed) -->
    <div class="zone-node absolute z-20" style="left:12%;top:55%">
        <div class="relative">
            <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-green-400/60" style="box-shadow:0 0 20px rgba(74,222,128,.2)">
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=200&q=70" class="w-full h-full object-cover" alt="forest">
                <div class="absolute inset-0 bg-green-900/30"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-check text-green-400 text-xl drop-shadow-lg"></i>
                </div>
            </div>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
                <span class="text-green-400 text-[10px] font-bold">Dense Forest</span>
            </div>
            <div class="absolute -top-2 -right-2 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center border border-green-300">
                <span class="text-white text-[8px] font-black">★</span>
            </div>
        </div>
    </div>

    <!-- Zone 2: Mountain Ridge (Completed) -->
    <div class="zone-node absolute z-20" style="left:30%;top:25%">
        <div class="relative">
            <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-green-400/60" style="box-shadow:0 0 20px rgba(74,222,128,.2)">
                <img src="https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=200&q=70" class="w-full h-full object-cover" alt="mountain">
                <div class="absolute inset-0 bg-slate-900/30"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-check text-green-400 text-xl drop-shadow-lg"></i>
                </div>
            </div>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
                <span class="text-green-400 text-[10px] font-bold">Mountain Ridge</span>
            </div>
            <div class="absolute -top-2 -right-2 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center border border-green-300">
                <span class="text-white text-[8px] font-black">★</span>
            </div>
        </div>
    </div>

    <!-- Zone 3: River Valley (Current - Active) -->
    <div class="zone-node absolute z-20" style="left:50%;top:43%">
        <div class="relative pulse">
            <div class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-amber-400" style="box-shadow:0 0 30px rgba(251,191,36,.3)">
                <img src="https://images.unsplash.com/photo-1432405972618-c6b0cfba8428?w=200&q=70" class="w-full h-full object-cover" alt="river">
                <div class="absolute inset-0 bg-blue-900/20"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-play text-amber-400 text-2xl drop-shadow-lg"></i>
                </div>
            </div>
            <div class="absolute -bottom-7 left-1/2 -translate-x-1/2 whitespace-nowrap">
                <span class="text-amber-400 text-[10px] font-bold">River Valley</span>
            </div>
            <div class="absolute -top-2 -right-2 bg-amber-500 rounded-full px-1.5 py-0.5 border border-amber-300">
                <span class="text-white text-[7px] font-black">8/18</span>
            </div>
            <!-- Monkey marker -->
            <div class="absolute -left-5 top-1/2 -translate-y-1/2">
                <div class="w-8 h-8 rounded-full overflow-hidden border-2 border-amber-400" style="box-shadow:0 0 10px rgba(255,215,0,.3)">
                    <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=80&q=80" class="w-full h-full object-cover" alt="monkey">
                </div>
            </div>
        </div>
    </div>

    <!-- Zone 4: Human Settlement (Locked) -->
    <div class="zone-node absolute z-20 opacity-50" style="left:67%;top:20%">
        <div class="relative">
            <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-white/20 grayscale" style="box-shadow:0 0 10px rgba(255,255,255,.05)">
                <img src="https://images.unsplash.com/photo-1518391846015-55a9cc003b25?w=200&q=70" class="w-full h-full object-cover opacity-60" alt="settlement">
                <div class="absolute inset-0 bg-black/40"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-lock text-white/40 text-lg"></i>
                </div>
            </div>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
                <span class="text-white/30 text-[10px] font-bold">Human Settlement</span>
            </div>
        </div>
    </div>

    <!-- Zone 5: Protected Reserve (Locked) -->
    <div class="zone-node absolute z-20 opacity-35" style="left:83%;top:45%">
        <div class="relative">
            <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-white/15 grayscale">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200&q=70" class="w-full h-full object-cover opacity-50" alt="reserve">
                <div class="absolute inset-0 bg-black/50"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fas fa-lock text-white/30 text-lg"></i>
                </div>
            </div>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
                <span class="text-white/20 text-[10px] font-bold">Protected Reserve</span>
            </div>
        </div>
    </div>

    <!-- === HUD === -->
    <!-- Top-left: Map title -->
    <div class="absolute top-3 left-4 z-30">
        <div class="flex items-center gap-2 bg-black/40 backdrop-blur-md rounded-xl px-3 py-2 border border-white/10">
            <i class="fas fa-map text-amber-400 text-sm"></i>
            <span class="text-white font-bold text-sm">World Map</span>
        </div>
    </div>

    <!-- Top-right: Progress -->
    <div class="absolute top-3 right-4 z-30">
        <div class="flex items-center gap-3 bg-black/40 backdrop-blur-md rounded-xl px-3 py-2 border border-white/10">
            <div class="flex items-center gap-1.5">
                <i class="fas fa-star text-amber-400 text-xs"></i>
                <span class="text-amber-400 text-xs font-bold">3/5</span>
            </div>
            <div class="w-20 h-1.5 bg-black/40 rounded-full overflow-hidden">
                <div class="h-full rounded-full" style="width:60%;background:linear-gradient(90deg,#22c55e,#4ade80)"></div>
            </div>
            <span class="text-green-400 text-[10px] font-bold">60%</span>
        </div>
    </div>

    <!-- Bottom: Legend -->
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-30">
        <div class="flex items-center gap-4 bg-black/40 backdrop-blur-md rounded-xl px-4 py-2 border border-white/10">
            <div class="flex items-center gap-1.5">
                <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                <span class="text-white/40 text-[10px]">Cleared</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="w-2.5 h-2.5 rounded-full bg-amber-400 dot-pulse"></div>
                <span class="text-white/40 text-[10px]">Current</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="w-2.5 h-2.5 rounded-full bg-white/20"></div>
                <span class="text-white/40 text-[10px]">Locked</span>
            </div>
        </div>
    </div>

    <!-- Back button -->
    <div class="absolute bottom-3 left-4 z-30">
        <button class="w-8 h-8 bg-black/40 backdrop-blur-md rounded-lg flex items-center justify-center border border-white/10">
            <i class="fas fa-arrow-left text-white/50 text-xs"></i>
        </button>
    </div>

    <!-- Vignette -->
    <div class="absolute inset-0 pointer-events-none z-5" style="box-shadow:inset 0 0 100px rgba(0,0,0,.5)"></div>
</body>
</html>
