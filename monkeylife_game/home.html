<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLife - Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }

        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        @keyframes glow { 0%,100%{opacity:.5;filter:blur(20px)} 50%{opacity:.9;filter:blur(30px)} }
        @keyframes shimmer { 0%{background-position:-300% center} 100%{background-position:300% center} }
        @keyframes leafDrift { 0%{transform:translate(0,0) rotate(0)} 100%{transform:translate(120px, 100vh) rotate(720deg); opacity:0} }
        @keyframes firefly { 0%,100%{opacity:0} 30%,70%{opacity:1} }
        @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
        .float{animation:float 3.5s ease-in-out infinite}
        .title-shimmer{
            background:linear-gradient(90deg,#FFD700,#FFA500,#FFE066,#FFD700);
            background-size:300% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            animation:shimmer 4s linear infinite;
        }
        .leaf{position:absolute;animation:leafDrift 12s linear infinite;opacity:.6;color:#3a7d44}
        .firefly{position:absolute;width:4px;height:4px;background:#ffe066;border-radius:50%;animation:firefly 3s ease-in-out infinite}
        .btn-glow{box-shadow:0 0 30px rgba(255,140,0,.4),0 0 60px rgba(255,140,0,.15)}
        .btn-glow:hover{box-shadow:0 0 40px rgba(255,140,0,.6),0 0 80px rgba(255,140,0,.25)}
    </style>
</head>
<body class="relative overflow-hidden">
    <!-- Full background scene -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1440342359743-84fcb8c21c7c?w=1200&q=80"
             class="w-full h-full object-cover" alt="forest canopy">
        <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(5,25,10,.85) 0%,rgba(5,25,10,.5) 40%,rgba(5,25,10,.3) 65%,rgba(5,25,10,.7) 100%)"></div>
        <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.5) 100%)"></div>
    </div>

    <!-- Golden light source -->
    <div class="absolute top-4 right-1/4 w-48 h-48 rounded-full" style="background:radial-gradient(circle,rgba(255,215,0,.15) 0%,transparent 70%);animation:glow 4s ease-in-out infinite"></div>

    <!-- Floating leaves -->
    <div class="leaf text-2xl" style="left:5%;top:-10%;animation-delay:0s"><i class="fas fa-leaf"></i></div>
    <div class="leaf text-lg" style="left:25%;top:-5%;animation-delay:3s"><i class="fas fa-leaf"></i></div>
    <div class="leaf text-xl" style="left:60%;top:-8%;animation-delay:6s"><i class="fas fa-leaf"></i></div>
    <div class="leaf text-sm" style="left:80%;top:-3%;animation-delay:9s"><i class="fas fa-leaf"></i></div>

    <!-- Fireflies -->
    <div class="firefly" style="top:30%;left:55%;animation-delay:0s"></div>
    <div class="firefly" style="top:50%;left:70%;animation-delay:1s"></div>
    <div class="firefly" style="top:20%;left:65%;animation-delay:2s"></div>
    <div class="firefly" style="top:60%;left:45%;animation-delay:0.5s"></div>
    <div class="firefly" style="top:40%;left:80%;animation-delay:1.5s"></div>

    <!-- Content layout -->
    <div class="relative z-10 flex h-full">
        <!-- Left: Title & Buttons -->
        <div class="flex flex-col justify-center pl-12 pr-8" style="width:55%">
            <!-- Logo mark -->
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-orange-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-paw text-white text-lg"></i>
                </div>
                <span class="text-green-400/60 text-xs font-semibold tracking-[.3em] uppercase">Wildlife Interactive</span>
            </div>

            <h1 class="title-shimmer text-5xl font-black mb-1" style="font-family:'Cinzel',serif;line-height:1.1">MONKEYLIFE</h1>
            <p class="text-green-300/50 text-sm tracking-[.5em] font-semibold mb-6">PRIMATE ODYSSEY</p>

            <!-- Buttons -->
            <div class="flex flex-col gap-3 max-w-[280px]">
                <button class="btn-glow bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-base py-3.5 rounded-2xl flex items-center justify-center gap-3 transition-all hover:scale-[1.02] active:scale-95">
                    <i class="fas fa-play"></i> Play
                </button>
                <div class="flex gap-3">
                    <button class="flex-1 bg-white/10 backdrop-blur-md border border-white/15 text-white font-semibold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-white/15 transition-all">
                        <i class="fas fa-flask text-amber-300 text-xs"></i> Research
                    </button>
                    <button class="flex-1 bg-white/10 backdrop-blur-md border border-white/15 text-white font-semibold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-white/15 transition-all">
                        <i class="fas fa-gear text-white/50 text-xs"></i> Settings
                    </button>
                </div>
            </div>

            <!-- Bottom stats strip -->
            <div class="flex items-center gap-5 mt-8">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-white/30 text-[11px]">12K players online</span>
                </div>
                <div class="w-px h-3 bg-white/10"></div>
                <span class="text-white/20 text-[11px]">v2.1.0</span>
            </div>
        </div>

        <!-- Right: Monkey character -->
        <div class="flex-1 flex items-center justify-center relative">
            <div class="float relative">
                <div class="w-56 h-56 rounded-full overflow-hidden border-4 border-amber-400/20" style="box-shadow:0 0 80px rgba(255,215,0,.15),0 0 160px rgba(255,215,0,.05);">
                    <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=500&q=80"
                         class="w-full h-full object-cover" alt="golden monkey" style="animation:breathe 4s ease-in-out infinite">
                </div>
                <!-- Glow ring -->
                <div class="absolute inset-0 rounded-full border-2 border-amber-400/10" style="animation:glow 3s ease-in-out infinite;transform:scale(1.15)"></div>
                <!-- Particle dots -->
                <div class="absolute -top-3 right-4 w-2 h-2 bg-amber-400 rounded-full" style="animation:firefly 2.5s ease-in-out infinite"></div>
                <div class="absolute bottom-0 -left-4 w-1.5 h-1.5 bg-green-400 rounded-full" style="animation:firefly 3s ease-in-out infinite;animation-delay:.5s"></div>
                <div class="absolute top-8 -right-6 w-1.5 h-1.5 bg-amber-300 rounded-full" style="animation:firefly 2s ease-in-out infinite;animation-delay:1s"></div>
            </div>
        </div>
    </div>

    <!-- Vignette -->
    <div class="absolute inset-0 pointer-events-none z-20" style="box-shadow:inset 0 0 120px rgba(0,0,0,.5)"></div>
</body>
</html>
