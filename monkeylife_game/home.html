<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLife - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-user-select: none; user-select: none;
        }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes leafFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }
        .glow-anim { animation: glow 2s ease-in-out infinite; }
        .shimmer-text {
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        .leaf {
            position: absolute;
            animation: leafFall linear infinite;
            opacity: 0;
        }
        .btn-play {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .btn-play:active { transform: scale(0.96); }
        .btn-secondary {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="relative overflow-hidden" style="background: linear-gradient(180deg, #0a2e1a 0%, #1a4a2e 30%, #2d6b3f 60%, #1a4a2e 100%);">
    <!-- Status Bar -->
    <div class="relative z-50 flex justify-between items-center px-7 bg-transparent" style="height: 59px;">
        <span class="text-white text-sm font-semibold">9:41</span>
        <div class="w-32 h-8 bg-black rounded-full mx-auto"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-white text-xs"></i>
            <i class="fas fa-wifi text-white text-xs"></i>
            <i class="fas fa-battery-full text-white text-xs"></i>
        </div>
    </div>

    <!-- Falling Leaves -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-10">
        <div class="leaf text-green-400 text-lg" style="left:10%; animation-duration:8s; animation-delay:0s;"><i class="fas fa-leaf"></i></div>
        <div class="leaf text-green-300 text-sm" style="left:30%; animation-duration:10s; animation-delay:2s;"><i class="fas fa-leaf"></i></div>
        <div class="leaf text-green-500 text-base" style="left:55%; animation-duration:9s; animation-delay:4s;"><i class="fas fa-leaf"></i></div>
        <div class="leaf text-green-400 text-xs" style="left:75%; animation-duration:11s; animation-delay:1s;"><i class="fas fa-leaf"></i></div>
        <div class="leaf text-green-300 text-lg" style="left:90%; animation-duration:7s; animation-delay:3s;"><i class="fas fa-leaf"></i></div>
    </div>

    <!-- Background Scene -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1518709766631-a6a7f45921c3?w=600&q=80"
             class="w-full h-full object-cover opacity-30" alt="forest">
        <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(10,46,26,0.7) 0%, rgba(26,74,46,0.5) 40%, rgba(10,46,26,0.9) 100%);"></div>
    </div>

    <!-- Moon/Light Source -->
    <div class="absolute top-20 right-8 w-24 h-24 rounded-full z-5 glow-anim"
         style="background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);"></div>

    <!-- Content -->
    <div class="relative z-20 flex flex-col items-center h-full" style="padding: 0 28px;">

        <!-- Monkey Character -->
        <div class="float-anim mt-4 mb-2">
            <div class="relative">
                <div class="w-48 h-48 rounded-full overflow-hidden border-4 border-amber-400/30 shadow-2xl"
                     style="box-shadow: 0 0 60px rgba(255,215,0,0.2);">
                    <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=400&q=80"
                         class="w-full h-full object-cover" alt="monkey">
                </div>
                <!-- Sparkles -->
                <div class="absolute -top-2 -right-2 w-6 h-6 bg-amber-400 rounded-full glow-anim" style="animation-delay: 0.5s;"></div>
                <div class="absolute -bottom-1 -left-3 w-4 h-4 bg-green-400 rounded-full glow-anim" style="animation-delay: 1s;"></div>
                <div class="absolute top-4 -left-4 w-3 h-3 bg-amber-300 rounded-full glow-anim" style="animation-delay: 1.5s;"></div>
            </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-2">
            <h1 class="text-4xl font-black shimmer-text tracking-tight">MonkeyLife</h1>
            <p class="text-green-300/80 text-sm font-medium tracking-widest mt-1">PRIMATE ODYSSEY</p>
        </div>

        <!-- Subtitle -->
        <p class="text-white/50 text-xs text-center mb-6 max-w-[240px]">
            Experience life as a Golden Snub-Nosed Monkey. Survive. Learn. Protect.
        </p>

        <!-- Play Button -->
        <button class="btn-play w-full py-4 rounded-2xl flex items-center justify-center gap-3 mb-3 transition-transform">
            <i class="fas fa-play text-white text-lg"></i>
            <span class="text-white font-bold text-lg">Start Adventure</span>
        </button>

        <!-- Secondary Buttons -->
        <div class="flex gap-3 w-full mb-4">
            <button class="btn-secondary flex-1 py-3.5 rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-95">
                <i class="fas fa-book-open text-green-300 text-sm"></i>
                <span class="text-white font-semibold text-sm">Learn</span>
            </button>
            <button class="btn-secondary flex-1 py-3.5 rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-95">
                <i class="fas fa-flask text-amber-300 text-sm"></i>
                <span class="text-white font-semibold text-sm">Research</span>
            </button>
        </div>

        <!-- Stats Row -->
        <div class="flex items-center justify-between w-full bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10 mb-4">
            <div class="text-center flex-1">
                <p class="text-2xl font-bold text-amber-400">12K</p>
                <p class="text-white/40 text-[10px] mt-0.5">Players</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-2xl font-bold text-green-400">5</p>
                <p class="text-white/40 text-[10px] mt-0.5">Biomes</p>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="text-center flex-1">
                <p class="text-2xl font-bold text-orange-400">98</p>
                <p class="text-white/40 text-[10px] mt-0.5">Facts</p>
            </div>
        </div>

        <!-- Conservation Badge -->
        <div class="flex items-center gap-3 w-full bg-gradient-to-r from-green-900/50 to-emerald-900/30 rounded-xl p-3 border border-green-500/20">
            <div class="w-10 h-10 bg-green-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas fa-shield-heart text-green-400"></i>
            </div>
            <div class="flex-1">
                <p class="text-white text-xs font-semibold">Conservation Partner</p>
                <p class="text-green-400/60 text-[10px]">Supporting wildlife research worldwide</p>
            </div>
            <div class="flex -space-x-2">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&q=80" class="w-6 h-6 rounded-full border border-green-800">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=60&q=80" class="w-6 h-6 rounded-full border border-green-800">
                <div class="w-6 h-6 rounded-full bg-green-600 border border-green-800 flex items-center justify-center">
                    <span class="text-white text-[8px] font-bold">+8</span>
                </div>
            </div>
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Bottom Tab Bar -->
        <div class="absolute bottom-0 left-0 right-0 flex items-center justify-around py-3 pb-7 bg-black/40 backdrop-blur-xl border-t border-white/10">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-amber-400 text-lg"></i>
                <span class="text-amber-400 text-[9px] font-medium">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-map text-white/40 text-lg"></i>
                <span class="text-white/40 text-[9px]">Map</span>
            </div>
            <div class="flex flex-col items-center gap-1 relative">
                <div class="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-full flex items-center justify-center -mt-5 shadow-lg" style="box-shadow: 0 4px 20px rgba(255,140,0,0.4);">
                    <i class="fas fa-gamepad text-white text-xl"></i>
                </div>
                <span class="text-amber-400 text-[9px] font-medium">Play</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-user text-white/40 text-lg"></i>
                <span class="text-white/40 text-[9px]">Profile</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-chart-bar text-white/40 text-lg"></i>
                <span class="text-white/40 text-[9px]">Research</span>
            </div>
        </div>
    </div>
</body>
</html>
