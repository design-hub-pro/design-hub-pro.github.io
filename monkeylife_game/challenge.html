<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLife - Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }
        @keyframes alertPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        @keyframes smokeRise {
            0% { transform: translateY(0) scale(1); opacity: 0.4; }
            100% { transform: translateY(-40px) scale(2); opacity: 0; }
        }
        .shake { animation: shake 0.5s ease-in-out; }
        .alert-pulse { animation: alertPulse 1.5s ease-in-out infinite; }
        .smoke { animation: smokeRise 3s ease-out infinite; }
    </style>
</head>
<body class="relative overflow-hidden" style="background: linear-gradient(180deg, #1a0a0a 0%, #2a1a0a 40%, #3a2a1a 70%, #1a1a0a 100%);">
    <!-- Status Bar -->
    <div class="relative z-50 flex justify-between items-center px-7 bg-transparent" style="height: 59px;">
        <span class="text-white text-sm font-semibold">9:41</span>
        <div class="w-32 h-8 bg-black rounded-full mx-auto"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-white text-xs"></i>
            <i class="fas fa-wifi text-white text-xs"></i>
            <i class="fas fa-battery-full text-white text-xs"></i>
        </div>
    </div>

    <!-- Alert Banner -->
    <div class="relative z-40 mx-4 mb-2">
        <div class="bg-red-900/40 border border-red-500/40 rounded-xl px-4 py-2 flex items-center gap-3">
            <div class="w-8 h-8 bg-red-500/30 rounded-full flex items-center justify-center alert-pulse">
                <i class="fas fa-triangle-exclamation text-red-400"></i>
            </div>
            <div class="flex-1">
                <p class="text-red-400 text-xs font-bold">ENVIRONMENTAL THREAT</p>
                <p class="text-red-300/50 text-[10px]">Logging operation detected in habitat</p>
            </div>
            <div class="bg-red-500/20 rounded-full px-2 py-0.5">
                <span class="text-red-400 text-[10px] font-bold">URGENT</span>
            </div>
        </div>
    </div>

    <!-- Scene -->
    <div class="relative z-10 mx-4" style="height: 280px;">
        <!-- Background scene - deforestation -->
        <div class="absolute inset-0 rounded-2xl overflow-hidden">
            <img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=500&q=70"
                 class="w-full h-full object-cover" alt="forest threat"
                 style="filter: sepia(30%) brightness(60%) hue-rotate(-10deg);">
            <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(26,10,10,0.4) 0%, rgba(42,26,10,0.6) 50%, rgba(26,10,10,0.9) 100%);"></div>

            <!-- Red overlay pulse -->
            <div class="absolute inset-0 bg-red-900/20 alert-pulse"></div>

            <!-- Smoke effects -->
            <div class="absolute bottom-20 right-8 smoke">
                <div class="w-8 h-8 bg-gray-400/20 rounded-full blur-sm"></div>
            </div>
            <div class="absolute bottom-16 right-16 smoke" style="animation-delay: 1s;">
                <div class="w-6 h-6 bg-gray-400/15 rounded-full blur-sm"></div>
            </div>

            <!-- Danger icons in scene -->
            <div class="absolute top-4 right-4 flex items-center gap-1.5 bg-red-900/60 backdrop-blur rounded-lg px-2 py-1 border border-red-500/30">
                <i class="fas fa-truck text-red-400 text-xs"></i>
                <span class="text-red-400 text-[9px] font-bold">Logging Crew</span>
            </div>

            <!-- Tree stumps -->
            <div class="absolute bottom-12 left-8">
                <div class="w-8 h-4 bg-amber-900 rounded-t-sm"></div>
                <div class="w-6 h-1 bg-amber-800 rounded mx-auto"></div>
            </div>
            <div class="absolute bottom-10 left-24">
                <div class="w-6 h-3 bg-amber-900/80 rounded-t-sm"></div>
            </div>

            <!-- Chainsaw icon -->
            <div class="absolute bottom-20 right-10">
                <div class="w-10 h-10 bg-red-900/60 rounded-full flex items-center justify-center border border-red-500/30">
                    <i class="fas fa-gears text-red-400"></i>
                </div>
            </div>

            <!-- Monkey character scared -->
            <div class="absolute bottom-16 left-1/2 -translate-x-1/2">
                <div class="relative">
                    <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-amber-400/50"
                         style="box-shadow: 0 0 20px rgba(255,215,0,0.2);">
                        <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=100&q=80"
                             class="w-full h-full object-cover" alt="monkey">
                    </div>
                    <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-black/60 rounded-lg px-2 py-0.5">
                        <span class="text-amber-400 text-[9px]">❗ Kiki</span>
                    </div>
                </div>
            </div>

            <!-- Fleeing animals -->
            <div class="absolute bottom-8 left-4 flex items-center gap-1 opacity-60">
                <i class="fas fa-dove text-white text-xs"></i>
                <i class="fas fa-dove text-white text-[10px]"></i>
            </div>
        </div>
    </div>

    <!-- Decision Panel -->
    <div class="relative z-30 mx-4 mt-3">
        <!-- Educational info box -->
        <div class="bg-amber-900/20 border border-amber-500/20 rounded-xl p-3 mb-3">
            <div class="flex items-start gap-2">
                <i class="fas fa-lightbulb text-amber-400 text-sm mt-0.5"></i>
                <div>
                    <p class="text-amber-300 text-[11px] font-semibold mb-1">Did You Know?</p>
                    <p class="text-white/50 text-[10px] leading-relaxed">Habitat loss from logging is the #1 threat to Golden Snub-Nosed Monkeys. Over 50% of their forest habitat has been lost in the past 50 years.</p>
                </div>
            </div>
        </div>

        <!-- Decision prompt -->
        <p class="text-white text-sm font-bold mb-2 px-1">What should Kiki do?</p>

        <!-- Option 1 -->
        <button class="w-full bg-gradient-to-r from-green-900/40 to-green-800/20 border border-green-500/30 rounded-xl p-3 mb-2 text-left transition-transform active:scale-[0.98]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-tree text-green-400"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white text-xs font-semibold">Retreat to Higher Canopy</p>
                    <p class="text-green-400/50 text-[10px]">Safe but loses territory access</p>
                </div>
                <div class="flex flex-col items-end gap-1">
                    <span class="text-green-400 text-[9px] font-bold">+20 HP</span>
                    <span class="text-red-400 text-[9px]">-15 Territory</span>
                </div>
            </div>
        </button>

        <!-- Option 2 -->
        <button class="w-full bg-gradient-to-r from-amber-900/40 to-amber-800/20 border border-amber-500/30 rounded-xl p-3 mb-2 text-left transition-transform active:scale-[0.98]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-users text-amber-400"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white text-xs font-semibold">Rally the Troop</p>
                    <p class="text-amber-400/50 text-[10px]">Unite group to find new safe area</p>
                </div>
                <div class="flex flex-col items-end gap-1">
                    <span class="text-pink-400 text-[9px] font-bold">+25 Social</span>
                    <span class="text-amber-400 text-[9px]">-10 Food</span>
                </div>
            </div>
        </button>

        <!-- Option 3 -->
        <button class="w-full bg-gradient-to-r from-blue-900/40 to-blue-800/20 border border-blue-500/30 rounded-xl p-3 text-left transition-transform active:scale-[0.98]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-route text-blue-400"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white text-xs font-semibold">Scout Alternate Route</p>
                    <p class="text-blue-400/50 text-[10px]">Risky but discovers new paths</p>
                </div>
                <div class="flex flex-col items-end gap-1">
                    <span class="text-blue-400 text-[9px] font-bold">+30 Territory</span>
                    <span class="text-red-400 text-[9px]">-20 HP</span>
                </div>
            </div>
        </button>
    </div>

    <!-- Timer -->
    <div class="absolute bottom-7 left-0 right-0 z-40 flex justify-center">
        <div class="flex items-center gap-2 bg-black/40 backdrop-blur-md rounded-full px-4 py-2 border border-white/10">
            <i class="fas fa-clock text-red-400 text-xs"></i>
            <span class="text-white font-bold text-sm">0:28</span>
            <span class="text-white/30 text-[10px]">to decide</span>
        </div>
    </div>
</body>
</html>
