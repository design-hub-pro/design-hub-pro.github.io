<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLife - Challenge Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
        html,body{width:100%;height:100%;overflow:hidden}
        @keyframes alertPulse{0%,100%{opacity:.2}50%{opacity:.4}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1px)}80%{transform:translateX(1px)}}
        @keyframes smokeRise{0%{transform:translateY(0) scale(1);opacity:.3}100%{transform:translateY(-60px) scale(2.5);opacity:0}}
        @keyframes timerPulse{0%,100%{color:#ef4444}50%{color:#fbbf24}}
        .alert-pulse{animation:alertPulse 1.5s ease-in-out infinite}
        .smoke{animation:smokeRise 4s ease-out infinite}
        .timer-pulse{animation:timerPulse 1s ease-in-out infinite}
    </style>
</head>
<body class="relative overflow-hidden">
    <!-- Full scene background -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=1200&q=70"
             class="w-full h-full object-cover"
             style="filter:sepia(20%) brightness(40%) hue-rotate(-15deg) saturate(.7)" alt="threatened forest">
        <!-- Red danger overlay -->
        <div class="absolute inset-0 bg-red-900/15 alert-pulse"></div>
        <!-- Dark gradient -->
        <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(15,5,5,.5) 0%,rgba(15,5,5,.2) 40%,rgba(15,5,5,.7) 100%)"></div>
        <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.6) 100%)"></div>
    </div>

    <!-- Smoke effects -->
    <div class="absolute bottom-1/3 right-[15%] smoke"><div class="w-12 h-12 bg-gray-500/15 rounded-full blur-md"></div></div>
    <div class="absolute bottom-1/4 right-[25%] smoke" style="animation-delay:1.5s"><div class="w-8 h-8 bg-gray-400/10 rounded-full blur-md"></div></div>
    <div class="absolute bottom-1/3 right-[35%] smoke" style="animation-delay:3s"><div class="w-10 h-10 bg-gray-500/10 rounded-full blur-lg"></div></div>

    <!-- Scene elements -->
    <!-- Tree stumps -->
    <div class="absolute bottom-[15%] right-[20%] z-5">
        <div class="w-10 h-5 bg-amber-900/70 rounded-t"></div>
        <div class="w-8 h-1 bg-amber-800/60 rounded mx-auto"></div>
    </div>
    <div class="absolute bottom-[12%] right-[30%] z-5">
        <div class="w-7 h-4 bg-amber-900/50 rounded-t"></div>
    </div>

    <!-- Logging equipment -->
    <div class="absolute bottom-[18%] right-[12%] z-5">
        <div class="w-12 h-12 bg-red-900/40 rounded-full flex items-center justify-center border border-red-500/20">
            <i class="fas fa-truck text-red-400/70 text-lg"></i>
        </div>
    </div>

    <!-- Fleeing birds -->
    <div class="absolute top-[20%] right-[25%] z-5 opacity-40">
        <i class="fas fa-dove text-white text-sm" style="transform:rotate(-15deg)"></i>
        <i class="fas fa-dove text-white text-xs ml-2" style="transform:rotate(-25deg)"></i>
        <i class="fas fa-dove text-white text-[10px] ml-1" style="transform:rotate(-10deg)"></i>
    </div>

    <!-- Monkey character in scene (center-ish) -->
    <div class="absolute z-10" style="top:35%;left:42%">
        <div class="relative">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-amber-400/50" style="box-shadow:0 0 20px rgba(255,215,0,.2)">
                <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=100&q=80" class="w-full h-full object-cover" alt="monkey">
            </div>
        </div>
    </div>

    <!-- === UI OVERLAYS === -->

    <!-- Top: Alert banner -->
    <div class="absolute top-3 left-1/2 -translate-x-1/2 z-30">
        <div class="bg-red-900/50 backdrop-blur-md border border-red-500/40 rounded-xl px-4 py-2 flex items-center gap-3">
            <div class="w-7 h-7 bg-red-500/30 rounded-full flex items-center justify-center">
                <i class="fas fa-triangle-exclamation text-red-400 text-sm"></i>
            </div>
            <div>
                <span class="text-red-400 text-xs font-bold">HABITAT THREAT DETECTED</span>
                <span class="text-red-300/40 text-[10px] ml-2">Logging operation approaching</span>
            </div>
            <div class="bg-red-500/25 rounded-full px-2 py-0.5 ml-2">
                <span class="text-red-400 text-[10px] font-bold">URGENT</span>
            </div>
        </div>
    </div>

    <!-- Timer -->
    <div class="absolute top-3 right-4 z-30">
        <div class="bg-black/50 backdrop-blur-md rounded-xl px-3 py-2 border border-red-500/20 flex items-center gap-2">
            <i class="fas fa-clock text-red-400 text-sm"></i>
            <span class="text-white font-black text-lg timer-pulse">0:28</span>
        </div>
    </div>

    <!-- Left: Educational fact -->
    <div class="absolute top-3 left-4 z-30 max-w-[200px]">
        <div class="bg-amber-900/30 backdrop-blur-md border border-amber-500/20 rounded-xl p-2.5">
            <div class="flex items-center gap-1.5 mb-1">
                <i class="fas fa-lightbulb text-amber-400 text-[10px]"></i>
                <span class="text-amber-300 text-[10px] font-bold">Did You Know?</span>
            </div>
            <p class="text-white/40 text-[9px] leading-relaxed">Over 50% of Golden Snub-Nosed Monkey habitat has been lost to logging in 50 years.</p>
        </div>
    </div>

    <!-- Bottom: Decision options -->
    <div class="absolute bottom-3 left-3 right-3 z-30">
        <div class="flex gap-2">
            <!-- Option 1: Retreat -->
            <button class="flex-1 bg-green-900/40 backdrop-blur-md border border-green-500/30 rounded-xl p-3 text-left transition-all hover:bg-green-900/60 hover:border-green-400/50 active:scale-[0.98] group">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 bg-green-500/20 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-green-500/30">
                        <i class="fas fa-tree text-green-400 text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white text-xs font-bold">Retreat to Canopy</p>
                        <p class="text-green-400/40 text-[9px]">Safe but loses territory</p>
                    </div>
                    <div class="flex flex-col items-end gap-0.5">
                        <span class="text-green-400 text-[9px] font-bold">+20 HP</span>
                        <span class="text-red-400/60 text-[9px]">-15 Land</span>
                    </div>
                </div>
            </button>

            <!-- Option 2: Rally -->
            <button class="flex-1 bg-amber-900/40 backdrop-blur-md border border-amber-500/30 rounded-xl p-3 text-left transition-all hover:bg-amber-900/60 hover:border-amber-400/50 active:scale-[0.98] group">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 bg-amber-500/20 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-amber-500/30">
                        <i class="fas fa-users text-amber-400 text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white text-xs font-bold">Rally the Troop</p>
                        <p class="text-amber-400/40 text-[9px]">Unite group to relocate</p>
                    </div>
                    <div class="flex flex-col items-end gap-0.5">
                        <span class="text-pink-400 text-[9px] font-bold">+25 Social</span>
                        <span class="text-amber-400/60 text-[9px]">-10 Food</span>
                    </div>
                </div>
            </button>

            <!-- Option 3: Scout -->
            <button class="flex-1 bg-blue-900/40 backdrop-blur-md border border-blue-500/30 rounded-xl p-3 text-left transition-all hover:bg-blue-900/60 hover:border-blue-400/50 active:scale-[0.98] group">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-blue-500/30">
                        <i class="fas fa-route text-blue-400 text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white text-xs font-bold">Scout New Route</p>
                        <p class="text-blue-400/40 text-[9px]">Risky, discovers new paths</p>
                    </div>
                    <div class="flex flex-col items-end gap-0.5">
                        <span class="text-blue-400 text-[9px] font-bold">+30 Land</span>
                        <span class="text-red-400/60 text-[9px]">-20 HP</span>
                    </div>
                </div>
            </button>
        </div>
    </div>

    <!-- Back -->
    <div class="absolute top-3 left-3 z-20 hidden">
        <button class="w-8 h-8 bg-black/40 backdrop-blur-md rounded-lg flex items-center justify-center border border-white/10">
            <i class="fas fa-arrow-left text-white/50 text-xs"></i>
        </button>
    </div>

    <!-- Vignette -->
    <div class="absolute inset-0 pointer-events-none z-20" style="box-shadow:inset 0 0 100px rgba(0,0,0,.5)"></div>
</body>
</html>
