<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyForm AI - Reference Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .video-container {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }
        .key-point {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-black">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Video Area -->
        <div class="video-container h-[480px] relative">
            <!-- iOS Status Bar -->
            <div class="absolute top-0 left-0 right-0 px-6 pt-3 pb-2 flex justify-between items-center z-20">
                <span class="text-sm font-semibold text-white">9:41</span>
                <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
                <div class="flex items-center gap-1 text-white">
                    <i class="fas fa-signal text-sm"></i>
                    <i class="fas fa-wifi text-sm"></i>
                    <i class="fas fa-battery-full text-sm"></i>
                </div>
            </div>

            <!-- Back Button & Title -->
            <div class="absolute top-12 left-0 right-0 px-5 flex items-center justify-between z-20">
                <div class="w-10 h-10 bg-white/20 backdrop-blur-lg rounded-full flex items-center justify-center">
                    <i class="fas fa-arrow-left text-white"></i>
                </div>
                <span class="text-white font-semibold">Serve Technique</span>
                <div class="w-10 h-10 bg-white/20 backdrop-blur-lg rounded-full flex items-center justify-center">
                    <i class="fas fa-bookmark text-white"></i>
                </div>
            </div>

            <!-- Video Content -->
            <div class="absolute inset-0 flex items-center justify-center">
                <img src="https://images.unsplash.com/photo-1592656094267-764a45160876?w=400&h=500&fit=crop" alt="Volleyball Serve" class="w-full h-full object-cover opacity-80">

                <!-- Pose Overlay Points -->
                <div class="absolute inset-0">
                    <!-- Shoulder Point -->
                    <div class="absolute top-[35%] left-[55%] key-point">
                        <div class="w-4 h-4 bg-green-400 rounded-full border-2 border-white shadow-lg"></div>
                        <div class="absolute left-6 top-0 bg-green-400 text-white text-xs px-2 py-1 rounded-full whitespace-nowrap">
                            Shoulder aligned
                        </div>
                    </div>

                    <!-- Elbow Point -->
                    <div class="absolute top-[30%] left-[62%] key-point" style="animation-delay: 0.3s">
                        <div class="w-4 h-4 bg-green-400 rounded-full border-2 border-white shadow-lg"></div>
                    </div>

                    <!-- Wrist Point -->
                    <div class="absolute top-[22%] left-[58%] key-point" style="animation-delay: 0.6s">
                        <div class="w-4 h-4 bg-orange-400 rounded-full border-2 border-white shadow-lg"></div>
                        <div class="absolute right-6 top-0 bg-orange-400 text-white text-xs px-2 py-1 rounded-full whitespace-nowrap">
                            Contact point
                        </div>
                    </div>

                    <!-- Hip Point -->
                    <div class="absolute top-[55%] left-[50%] key-point" style="animation-delay: 0.9s">
                        <div class="w-4 h-4 bg-blue-400 rounded-full border-2 border-white shadow-lg"></div>
                    </div>

                    <!-- Skeleton Lines -->
                    <svg class="absolute inset-0 w-full h-full" style="pointer-events: none;">
                        <line x1="55%" y1="35%" x2="62%" y2="30%" stroke="#4ade80" stroke-width="2" opacity="0.7"/>
                        <line x1="62%" y1="30%" x2="58%" y2="22%" stroke="#4ade80" stroke-width="2" opacity="0.7"/>
                        <line x1="55%" y1="35%" x2="50%" y2="55%" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
                    </svg>
                </div>
            </div>

            <!-- Video Controls -->
            <div class="absolute bottom-4 left-0 right-0 px-5">
                <div class="bg-white/20 backdrop-blur-lg rounded-2xl p-4">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                            <i class="fas fa-pause text-gray-900"></i>
                        </div>
                        <div class="flex-1">
                            <div class="h-1 bg-white/30 rounded-full overflow-hidden">
                                <div class="h-full w-[65%] bg-white rounded-full"></div>
                            </div>
                        </div>
                        <span class="text-white text-sm">0:08 / 0:12</span>
                    </div>
                    <div class="flex justify-center gap-6">
                        <button class="text-white/70 text-sm flex items-center gap-1">
                            <i class="fas fa-backward"></i> 5s
                        </button>
                        <button class="text-white text-sm flex items-center gap-1">
                            <i class="fas fa-redo"></i> Replay
                        </button>
                        <button class="text-white/70 text-sm flex items-center gap-1">
                            5s <i class="fas fa-forward"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="bg-white rounded-t-3xl -mt-6 relative z-10 h-[340px]">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mt-3"></div>

            <div class="px-5 pt-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-900">Overhand Serve</h2>
                    <div class="flex items-center gap-1 bg-orange-100 px-3 py-1 rounded-full">
                        <i class="fas fa-clock text-orange-500 text-sm"></i>
                        <span class="text-orange-600 text-sm font-medium">12 sec</span>
                    </div>
                </div>

                <p class="text-gray-500 text-sm mt-2">Master the fundamental serve technique with proper body mechanics and timing.</p>

                <!-- Key Points -->
                <div class="mt-4">
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Key Focus Points</h3>
                    <div class="space-y-2">
                        <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                            <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-hand-point-up text-green-500"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm font-medium text-gray-900">Ball Toss</p>
                                <p class="text-xs text-gray-500">Consistent height, slightly in front</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                            <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                                <i class="fas fa-crosshairs text-blue-500"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm font-medium text-gray-900">Contact Point</p>
                                <p class="text-xs text-gray-500">Full arm extension, center of palm</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <button class="w-full mt-4 bg-gradient-to-r from-orange-500 to-orange-400 text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-orange-200">
                    <i class="fas fa-video"></i>
                    Record My Attempt
                </button>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-black rounded-full"></div>
    </div>
</body>
</html>
