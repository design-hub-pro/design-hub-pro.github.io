<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyForm AI - Record</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .recording-ring {
            animation: recording 1.5s ease-in-out infinite;
        }
        @keyframes recording {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        .grid-line {
            stroke: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="bg-black">
    <div class="w-[375px] h-[812px] mx-auto overflow-hidden rounded-[50px] relative bg-black">
        <!-- Camera View -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?w=400&h=900&fit=crop" alt="Camera View" class="w-full h-full object-cover">

            <!-- Grid Overlay -->
            <svg class="absolute inset-0 w-full h-full" style="pointer-events: none;">
                <!-- Vertical lines -->
                <line x1="33.33%" y1="0" x2="33.33%" y2="100%" class="grid-line" stroke-width="1"/>
                <line x1="66.66%" y1="0" x2="66.66%" y2="100%" class="grid-line" stroke-width="1"/>
                <!-- Horizontal lines -->
                <line x1="0" y1="33.33%" x2="100%" y2="33.33%" class="grid-line" stroke-width="1"/>
                <line x1="0" y1="66.66%" x2="100%" y2="66.66%" class="grid-line" stroke-width="1"/>
            </svg>

            <!-- Pose Guide Overlay -->
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-48 h-72 opacity-30" viewBox="0 0 100 150">
                    <!-- Head -->
                    <circle cx="50" cy="15" r="10" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                    <!-- Body -->
                    <line x1="50" y1="25" x2="50" y2="70" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                    <!-- Arms -->
                    <line x1="50" y1="35" x2="20" y2="55" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                    <line x1="50" y1="35" x2="80" y2="25" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                    <!-- Legs -->
                    <line x1="50" y1="70" x2="35" y2="110" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                    <line x1="50" y1="70" x2="65" y2="110" stroke="white" stroke-width="2" stroke-dasharray="4"/>
                </svg>
            </div>
        </div>

        <!-- iOS Status Bar -->
        <div class="absolute top-0 left-0 right-0 px-6 pt-3 pb-2 flex justify-between items-center z-20">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-32 h-8 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center gap-1 text-white">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Top Controls -->
        <div class="absolute top-14 left-0 right-0 px-5 flex items-center justify-between z-20">
            <div class="w-10 h-10 bg-black/40 backdrop-blur-lg rounded-full flex items-center justify-center">
                <i class="fas fa-times text-white text-lg"></i>
            </div>
            <div class="bg-red-500 px-4 py-2 rounded-full flex items-center gap-2">
                <div class="w-2 h-2 bg-white rounded-full recording-ring"></div>
                <span class="text-white font-semibold">00:04</span>
            </div>
            <div class="w-10 h-10 bg-black/40 backdrop-blur-lg rounded-full flex items-center justify-center">
                <i class="fas fa-rotate text-white text-lg"></i>
            </div>
        </div>

        <!-- AI Tracking Status -->
        <div class="absolute top-28 left-5 right-5 z-20">
            <div class="bg-green-500/90 backdrop-blur-lg rounded-xl px-4 py-3 flex items-center gap-3">
                <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-check text-white"></i>
                </div>
                <div class="flex-1">
                    <p class="text-white font-medium text-sm">AI Tracking Active</p>
                    <p class="text-white/70 text-xs">17 body points detected</p>
                </div>
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Skill Reference Thumbnail -->
        <div class="absolute top-44 right-5 z-20">
            <div class="w-20 h-28 rounded-xl overflow-hidden border-2 border-white shadow-lg">
                <img src="https://images.unsplash.com/photo-1592656094267-764a45160876?w=100&h=150&fit=crop" alt="Reference" class="w-full h-full object-cover">
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 py-1">
                    <p class="text-white text-[10px] text-center">Reference</p>
                </div>
            </div>
        </div>

        <!-- Tips Overlay -->
        <div class="absolute bottom-44 left-5 right-5 z-20">
            <div class="bg-black/50 backdrop-blur-lg rounded-xl p-3">
                <div class="flex items-center gap-2">
                    <i class="fas fa-lightbulb text-yellow-400"></i>
                    <p class="text-white text-sm">Keep your tossing arm steady and straight</p>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent pt-16 pb-10 px-5 z-20">
            <div class="flex items-center justify-center gap-8">
                <!-- Gallery -->
                <div class="w-14 h-14 rounded-xl overflow-hidden border-2 border-white/50">
                    <img src="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=80&h=80&fit=crop" alt="Gallery" class="w-full h-full object-cover">
                </div>

                <!-- Record Button -->
                <div class="relative">
                    <div class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
                        <div class="w-14 h-14 bg-red-500 rounded-lg recording-ring"></div>
                    </div>
                </div>

                <!-- Stop Button -->
                <button class="w-14 h-14 bg-white/20 backdrop-blur-lg rounded-full flex items-center justify-center border-2 border-white">
                    <i class="fas fa-stop text-white text-xl"></i>
                </button>
            </div>

            <p class="text-white/70 text-xs text-center mt-4">Tap stop when finished, or recording will auto-stop at 15s</p>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-30"></div>
    </div>
</body>
</html>
