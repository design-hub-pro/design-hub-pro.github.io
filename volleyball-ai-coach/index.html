<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyForm AI - AI-Powered Volleyball Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        .phone-frame {
            width: 375px;
            height: 812px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.25),
                        0 30px 60px -30px rgba(0, 0, 0, 0.3),
                        inset 0 0 0 2px rgba(255, 255, 255, 0.1);
            background: #000;
            position: relative;
        }

        .phone-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 50px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen-label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- Header -->
    <header class="pt-16 pb-12 px-8">
        <div class="max-w-7xl mx-auto text-center">
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-orange-400 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-200">
                    <i class="fas fa-volleyball text-white text-2xl"></i>
                </div>
            </div>
            <h1 class="text-5xl font-bold text-gray-900 mb-4">
                Volley<span class="gradient-text">Form</span> AI
            </h1>
            <p class="text-xl text-gray-500 max-w-2xl mx-auto">
                AI-Powered Volleyball Training Through Pose Analysis
            </p>

            <!-- Key Features -->
            <div class="flex flex-wrap justify-center gap-6 mt-8">
                <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full">
                    <i class="fas fa-user-check text-orange-500"></i>
                    <span class="text-gray-700 text-sm font-medium">Pose Estimation</span>
                </div>
                <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full">
                    <i class="fas fa-chart-line text-orange-500"></i>
                    <span class="text-gray-700 text-sm font-medium">Real-time Feedback</span>
                </div>
                <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full">
                    <i class="fas fa-dumbbell text-orange-500"></i>
                    <span class="text-gray-700 text-sm font-medium">Targeted Drills</span>
                </div>
                <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-full">
                    <i class="fas fa-mobile-alt text-orange-500"></i>
                    <span class="text-gray-700 text-sm font-medium">Phone Camera Only</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Screens Showcase -->
    <section class="pb-24 px-8">
        <div class="max-w-[1600px] mx-auto">
            <!-- Row 1: Home, Reference, Record -->
            <div class="flex flex-wrap justify-center gap-16 mb-24">
                <!-- Home Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="home.html"></iframe>
                    </div>
                    <div class="screen-label">Home - Skill Selection</div>
                </div>

                <!-- Reference Video Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="reference.html"></iframe>
                    </div>
                    <div class="screen-label">Reference Video</div>
                </div>

                <!-- Record Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="record.html"></iframe>
                    </div>
                    <div class="screen-label">AI Recording</div>
                </div>
            </div>

            <!-- Row 2: Analysis, Practice, Progress -->
            <div class="flex flex-wrap justify-center gap-16">
                <!-- Analysis Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="analysis.html"></iframe>
                    </div>
                    <div class="screen-label">AI Analysis</div>
                </div>

                <!-- Practice Plan Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="practice.html"></iframe>
                    </div>
                    <div class="screen-label">Practice Plan</div>
                </div>

                <!-- Progress Screen -->
                <div class="relative">
                    <div class="phone-frame">
                        <iframe src="progress.html"></iframe>
                    </div>
                    <div class="screen-label">Progress Tracking</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 border-t border-gray-100">
        <div class="max-w-7xl mx-auto px-8 text-center">
            <p class="text-gray-400 text-sm">VolleyForm AI - High-Fidelity Prototype</p>
        </div>
    </footer>
</body>
</html>
