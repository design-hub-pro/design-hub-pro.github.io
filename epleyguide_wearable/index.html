<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpleyGuide — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-teal-400 to-cyan-700 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-ear-listen text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">EpleyGuide</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">An ear-worn motion sensor that tracks head angle and talks you through each step of the Epley maneuver for vertigo.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Wearable</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Medical</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Motion Sensing</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Rehab</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812128175-image-1.png" alt="EpleyGuide, "></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812096516-image-1.png" alt="EpleyGuide, patient guided through the maneuver on an exam table"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812096545-image-1.png" alt="EpleyGuide, the ear piece beside a ruler"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812096843-image-1.png" alt="EpleyGuide, worn behind the ear"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812096100-image-1.png" alt="EpleyGuide, fitting the ear hook"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812096906-image-1.png" alt="EpleyGuide, signal path from head motion to guidance"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812128080-image-1.png" alt="EpleyGuide, exploded build stack"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792812127810-image-1.png" alt="EpleyGuide, bench check on a motorized mannequin head"></div>
        </div>
    </div>
</body>
</html>
