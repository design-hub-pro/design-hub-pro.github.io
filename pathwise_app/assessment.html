<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathwise - Skill Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #F8F9FB; }
        .gradient-card { background: linear-gradient(135deg, #4338CA 0%, #7C3AED 100%); }
        .radar-container { position: relative; width: 220px; height: 220px; margin: 0 auto; }
        .radar-bg { position: absolute; inset: 0; }
        .radar-shape {
            fill: rgba(124, 58, 237, 0.15);
            stroke: #7C3AED;
            stroke-width: 2;
        }
        .radar-grid {
            fill: none;
            stroke: #E5E7EB;
            stroke-width: 1;
        }
        .radar-label {
            font-size: 9px;
            fill: #6B7280;
            font-weight: 600;
        }
        .radar-dot {
            fill: #7C3AED;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-center justify-between bg-white">
        <span class="text-sm font-semibold text-gray-900">9:41</span>
        <div class="bg-black rounded-full w-[126px] h-[37px] mx-auto"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-gray-900"></i>
            <i class="fas fa-wifi text-xs text-gray-900"></i>
            <i class="fas fa-battery-full text-xs text-gray-900"></i>
        </div>
    </div>

    <!-- Header -->
    <div style="padding: 0 28px;" class="bg-white pb-4 pt-1">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Skill Assessment</h1>
        <p class="text-sm text-gray-400">Last updated 2 days ago</p>
    </div>

    <!-- Content -->
    <div style="padding: 0 28px;" class="mt-3">
        <!-- Radar Chart -->
        <div class="bg-white rounded-3xl p-5 border border-gray-100 mb-4">
            <div class="radar-container">
                <svg viewBox="0 0 220 220" width="220" height="220">
                    <!-- Grid -->
                    <polygon points="110,20 188,57 188,163 110,200 32,163 32,57" class="radar-grid"/>
                    <polygon points="110,42 176,71 176,149 110,178 44,149 44,71" class="radar-grid"/>
                    <polygon points="110,64 164,85 164,135 110,156 56,135 56,85" class="radar-grid"/>
                    <polygon points="110,86 152,99 152,121 110,134 68,121 68,99" class="radar-grid"/>
                    <!-- Axes -->
                    <line x1="110" y1="20" x2="110" y2="200" stroke="#E5E7EB" stroke-width="1"/>
                    <line x1="32" y1="57" x2="188" y2="163" stroke="#E5E7EB" stroke-width="1"/>
                    <line x1="188" y1="57" x2="32" y2="163" stroke="#E5E7EB" stroke-width="1"/>
                    <!-- Data shape -->
                    <polygon points="110,30 180,65 172,155 110,185 50,140 48,68" class="radar-shape"/>
                    <!-- Dots -->
                    <circle cx="110" cy="30" r="4" class="radar-dot"/>
                    <circle cx="180" cy="65" r="4" class="radar-dot"/>
                    <circle cx="172" cy="155" r="4" class="radar-dot"/>
                    <circle cx="110" cy="185" r="4" class="radar-dot"/>
                    <circle cx="50" cy="140" r="4" class="radar-dot"/>
                    <circle cx="48" cy="68" r="4" class="radar-dot"/>
                    <!-- Labels -->
                    <text x="110" y="12" text-anchor="middle" class="radar-label">Analytical</text>
                    <text x="200" y="60" text-anchor="start" class="radar-label">Technical</text>
                    <text x="200" y="165" text-anchor="start" class="radar-label">Creative</text>
                    <text x="110" y="215" text-anchor="middle" class="radar-label">Communication</text>
                    <text x="18" y="165" text-anchor="end" class="radar-label">Leadership</text>
                    <text x="18" y="60" text-anchor="end" class="radar-label">Problem-Solving</text>
                </svg>
            </div>
            <div class="flex items-center justify-center gap-4 mt-3">
                <div class="flex items-center gap-1.5">
                    <div class="w-3 h-3 bg-violet-500 rounded-sm opacity-40"></div>
                    <span class="text-[10px] text-gray-500">Your Skills</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-3 h-3 bg-gray-200 rounded-sm"></div>
                    <span class="text-[10px] text-gray-500">CS Major Avg</span>
                </div>
            </div>
        </div>

        <!-- Skill Breakdown -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold text-gray-900">Skill Breakdown</h2>
        </div>

        <div class="space-y-3 mb-5">
            <div class="bg-white rounded-2xl p-4 border border-gray-100">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 bg-indigo-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-brain text-indigo-500 text-sm"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-900">Analytical Thinking</span>
                    </div>
                    <span class="text-lg font-bold text-indigo-600">92</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-gradient-to-r from-indigo-500 to-violet-500 h-2 rounded-full" style="width: 92%"></div>
                </div>
                <p class="text-[10px] text-gray-400 mt-1.5">Top 5% among peers</p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-gray-100">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 bg-emerald-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-code text-emerald-500 text-sm"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-900">Technical Skills</span>
                    </div>
                    <span class="text-lg font-bold text-emerald-600">88</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-gradient-to-r from-emerald-500 to-green-400 h-2 rounded-full" style="width: 88%"></div>
                </div>
                <p class="text-[10px] text-gray-400 mt-1.5">Top 10% among peers</p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-gray-100">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 bg-amber-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-palette text-amber-500 text-sm"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-900">Creativity</span>
                    </div>
                    <span class="text-lg font-bold text-amber-600">75</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-gradient-to-r from-amber-500 to-yellow-400 h-2 rounded-full" style="width: 75%"></div>
                </div>
                <p class="text-[10px] text-gray-400 mt-1.5">Growing steadily</p>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-gray-100">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 bg-sky-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-comments text-sky-500 text-sm"></i>
                        </div>
                        <span class="text-sm font-semibold text-gray-900">Communication</span>
                    </div>
                    <span class="text-lg font-bold text-sky-600">82</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div class="bg-gradient-to-r from-sky-500 to-blue-400 h-2 rounded-full" style="width: 82%"></div>
                </div>
                <p class="text-[10px] text-gray-400 mt-1.5">Above average</p>
            </div>
        </div>

        <!-- Retake Assessment -->
        <button class="w-full gradient-card rounded-2xl py-4 flex items-center justify-center gap-2 mb-4">
            <i class="fas fa-rotate text-white text-sm"></i>
            <span class="text-white font-semibold">Retake Assessment</span>
        </button>

        <div class="h-24"></div>
    </div>

    <!-- Tab Bar -->
    <div style="position: absolute; bottom: 0; left: 0; right: 0;" class="bg-white border-t border-gray-100 px-6 pb-8 pt-2">
        <div class="flex items-center justify-around">
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-house text-gray-400 text-lg"></i>
                <span class="text-[9px] text-gray-400">Home</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-compass text-gray-400 text-lg"></i>
                <span class="text-[9px] text-gray-400">Explore</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-chart-simple text-indigo-600 text-lg"></i>
                <span class="text-[9px] font-semibold text-indigo-600">Assess</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-graduation-cap text-gray-400 text-lg"></i>
                <span class="text-[9px] text-gray-400">Learn</span>
            </div>
            <div class="flex flex-col items-center gap-0.5">
                <i class="fas fa-user text-gray-400 text-lg"></i>
                <span class="text-[9px] text-gray-400">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
