<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Level result</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="absolute left-0 right-0 top-0 h-[330px]" style="background:linear-gradient(180deg,#1570EF 0%,#53B1FD 70%,#F5F8FC 100%)"></div>
  <div class="island"></div>
  <div class="scroll" style="padding-bottom:40px">
    <div class="sb light"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

    <div class="pad mt-3 flex justify-between items-center text-white">
      <div class="w-11 h-11 rounded-2xl glass flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
      <span class="font-bold text-[15px]">Slow Zones · Level 3</span>
      <div class="w-11 h-11 rounded-2xl glass flex items-center justify-center"><i class="fa-solid fa-share"></i></div>
    </div>

    <div class="text-center text-white mt-7">
      <div class="flex justify-center items-end gap-3 text-[#FDB022]">
        <i class="fa-solid fa-star text-[38px] drop-shadow"></i><i class="fa-solid fa-star text-[54px] drop-shadow"></i><i class="fa-solid fa-star text-[38px] text-white/35"></i>
      </div>
      <div class="text-[34px] font-extrabold tracking-tight mt-3">Great control!</div>
      <div class="text-white/80 font-semibold text-[14px] mt-1">2 of 3 stars · Best yet</div>
    </div>

    <div class="pad mt-7">
      <div class="card p-5 grid grid-cols-3 text-center">
        <div><div class="text-[30px] font-extrabold num leading-none">92<span class="text-base text-slate-400">%</span></div><div class="text-[12px] text-slate-500 font-semibold mt-1.5">In safe speed</div></div>
        <div class="border-x border-slate-100"><div class="text-[30px] font-extrabold num leading-none">5<span class="text-base text-slate-400">/6</span></div><div class="text-[12px] text-slate-500 font-semibold mt-1.5">Gates</div></div>
        <div><div class="text-[30px] font-extrabold num leading-none">1</div><div class="text-[12px] text-slate-500 font-semibold mt-1.5">Close call</div></div>
      </div>
    </div>

    <!-- replay video -->
    <div class="pad mt-4">
      <div class="img shade rounded-[24px] h-[168px] overflow-hidden p-4 flex flex-col justify-between" style="background-image:url(img/game1.jpg);background-position:50% 40%">
        <div class="flex justify-between"><span class="pill glass"><i class="fa-solid fa-triangle-exclamation text-[#FDB022]"></i>0:31 too fast</span><span class="pill glassd">0:12</span></div>
        <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-[#1570EF]"><i class="fa-solid fa-play ml-0.5"></i></div><span class="text-white font-bold">Watch your close call</span></div>
      </div>
    </div>

    <!-- feedback -->
    <div class="pad mt-5 space-y-2.5">
      <div class="card p-3.5 flex items-center gap-3.5">
        <div class="gicon g-green"><i class="fa-solid fa-hand"></i></div>
        <div class="flex-1"><div class="font-bold text-[15px]">Pizza before every sign</div><div class="text-[12.5px] text-slate-500 font-semibold">4 of 4 slow zones</div></div>
        <i class="fa-solid fa-circle-check text-[#12B76A] text-lg"></i>
      </div>
      <div class="card p-3.5 flex items-center gap-3.5">
        <div class="gicon g-orange"><i class="fa-solid fa-gauge-high"></i></div>
        <div class="flex-1"><div class="font-bold text-[15px]">Brake earlier on the steep part</div><div class="text-[12.5px] text-slate-500 font-semibold">Hit 22 km/h near the trees</div></div>
        <span class="dot" style="background:var(--amber);width:10px;height:10px"></span>
      </div>
    </div>

    <div class="pad mt-6 grid grid-cols-[56px_1fr] gap-3">
      <div class="btn bg-white shadow-[0_0_0_1px_#E4EAF2] text-[#0B1A33]"><i class="fa-solid fa-rotate-right"></i></div>
      <div class="btn org">Next: Merge Point <i class="fa-solid fa-arrow-right"></i></div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
