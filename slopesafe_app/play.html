<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Play</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.speed{position:absolute;left:28px;top:180px;width:54px;height:300px;border-radius:27px;padding:6px;display:flex;flex-direction:column;justify-content:flex-end}
.zone{position:absolute;left:6px;right:6px;border-radius:20px}
.needle{position:absolute;left:-6px;right:-6px;height:4px;border-radius:4px;background:#fff;box-shadow:0 0 0 3px rgba(11,26,51,.3)}
.pad-btn{width:86px;height:86px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
</style>
</head><body>
<div class="screen dark">
  <div class="img absolute inset-0" style="background-image:url(img/game1.jpg);background-size:auto 100%;background-position:50% 50%"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,31,.35) 0%,rgba(7,17,31,0) 22%,rgba(7,17,31,0) 65%,rgba(7,17,31,.55) 100%)"></div>
  <div class="island"></div>
  <div class="sb light"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

  <!-- top HUD -->
  <div class="pad relative z-10 mt-3 flex items-center justify-between">
    <div class="w-11 h-11 rounded-2xl glassd flex items-center justify-center"><i class="fa-solid fa-pause"></i></div>
    <div class="glassd rounded-full px-4 py-2 flex items-center gap-2 text-[13px] font-bold"><span class="trail green" style="width:10px;height:10px"></span>Slow Zones<span class="text-white/50">·</span><span class="num">0:48</span></div>
    <div class="glassd rounded-full px-3.5 py-2 flex items-center gap-1.5 text-[14px] font-extrabold num"><i class="fa-solid fa-star text-[#FDB022] text-xs"></i>1,240</div>
  </div>

  <!-- gates progress -->
  <div class="pad relative z-10 mt-3 flex gap-1.5">
    <i class="flex-1 h-1.5 rounded-full bg-[#32D583]"></i><i class="flex-1 h-1.5 rounded-full bg-[#32D583]"></i><i class="flex-1 h-1.5 rounded-full bg-[#32D583]"></i><i class="flex-1 h-1.5 rounded-full bg-[#FDB022]"></i><i class="flex-1 h-1.5 rounded-full bg-white/30"></i><i class="flex-1 h-1.5 rounded-full bg-white/30"></i>
  </div>

  <!-- speed meter -->
  <div class="speed glassd z-10">
    <div class="zone" style="top:6px;height:70px;background:rgba(240,68,56,.55)"></div>
    <div class="zone" style="top:80px;height:60px;background:rgba(247,144,9,.5)"></div>
    <div class="zone" style="top:144px;bottom:6px;background:rgba(50,213,131,.45)"></div>
    <div class="needle" style="top:150px"></div>
  </div>
  <div class="absolute z-10 text-center" style="left:28px;top:492px;width:54px">
    <div class="text-[24px] font-extrabold num leading-none">14</div><div class="text-[10px] font-bold text-white/70">km/h</div>
  </div>

  <!-- feedback toast -->
  <div class="absolute z-10 left-[100px] right-[28px] top-[190px] rounded-[20px] bg-white text-[#0B1A33] p-3.5 flex items-center gap-3 shadow-2xl">
    <div class="gicon g-green" style="width:42px;height:42px"><i class="fa-solid fa-thumbs-up"></i></div>
    <div><div class="font-extrabold text-[15px]">Nice pizza!</div><div class="text-[12.5px] text-slate-500 font-semibold">Back in the green zone</div></div>
    <div class="ml-auto text-[#12B76A] font-extrabold num">+50</div>
  </div>

  <!-- tilt indicator -->
  <div class="absolute z-10 left-0 right-0 bottom-[190px] flex justify-center">
    <div class="glassd rounded-full px-4 py-2 flex items-center gap-3 text-[12px] font-bold">
      <i class="fa-solid fa-mobile-screen -rotate-12"></i>
      <div class="relative w-28 h-1.5 rounded-full bg-white/25"><i class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-white" style="left:38%"></i></div>
      Tilt to steer
    </div>
  </div>

  <!-- controls -->
  <div class="absolute z-10 left-0 right-0 bottom-[46px] pad flex items-end justify-between">
    <div class="pad-btn glassd"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="flex flex-col items-center">
      <div class="w-[112px] h-[112px] rounded-full flex flex-col items-center justify-center text-white" style="background:var(--gradOrange);box-shadow:0 0 0 10px rgba(255,107,26,.25),0 18px 30px -10px rgba(255,90,31,.9)">
        <svg width="40" height="34" viewBox="0 0 40 34"><path d="M6 4 L20 30 L34 4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-[12px] font-extrabold mt-1 tracking-wide">HOLD</span>
      </div>
      <span class="text-[12px] font-bold text-white/80 mt-3">Pizza brake</span>
    </div>
    <div class="pad-btn glassd"><i class="fa-solid fa-chevron-right"></i></div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
