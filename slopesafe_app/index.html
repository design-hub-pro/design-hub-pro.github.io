<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
body{font-family:'Inter',sans-serif;color:#0B1A33;margin:0}
*::-webkit-scrollbar{display:none} *{scrollbar-width:none}
.grid3{display:grid;grid-template-columns:repeat(3,460px);gap:56px 44px;justify-content:center}
@media (max-width:1560px){.grid3{grid-template-columns:repeat(2,460px)}}
@media (max-width:1020px){.grid3{grid-template-columns:460px}}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1A33;box-shadow:0 40px 80px -40px rgba(11,26,51,.45),0 0 0 1px rgba(11,26,51,.08);box-sizing:border-box}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;overflow:hidden}
</style></head>
<body>
<div class="px-10 pt-20 pb-28">
  <div class="text-center">
    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl" style="background:linear-gradient(135deg,#FDB022 0%,#FF5A1F 100%)"><i class="fa-solid fa-person-skiing"></i></div>
    <h1 class="text-5xl font-extrabold tracking-tight mt-6">SlopeSafe</h1>
    <p class="text-lg text-slate-500 font-medium mt-3">Kids practice ski safety in a game at home, then get buzz alerts from a watch on the slope.</p>
    <div class="flex gap-2 justify-center mt-5 flex-wrap">
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Kids game</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Ski safety</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Smartwatch alerts</span>
      <span class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-full px-3 py-1.5">Run replay</span>
    </div>
  </div>

  <div class="grid3 mt-20">
    <div class="frame"><iframe src="welcome.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="course.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="play.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="result.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="sensor.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="live.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="alert.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="replay.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="insights.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="family.html" scrolling="no"></iframe></div>
    <div class="frame"><iframe src="passport.html" scrolling="no"></iframe></div>
  </div>
</div>
</body></html>
