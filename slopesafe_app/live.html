<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Live ride</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="absolute inset-0" style="background:radial-gradient(120% 60% at 50% 30%,#12305C 0%,#07111F 70%)"></div>
  <div class="island"></div>
  <div class="sb light"><span class="t">10:52</span><span class="i"><i class="fa-solid fa-location-arrow text-[11px]"></i><i class="fa-solid fa-signal"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad relative z-10 mt-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5 rounded-full bg-white/10 pl-1.5 pr-3.5 py-1.5"><img src="img/kid.jpg" class="w-8 h-8 rounded-full object-cover"><span class="font-bold text-[14px]">Mia</span><span class="live"></span></div>
    <div class="flex items-center gap-2 rounded-full bg-white/10 px-3.5 py-2 text-[13px] font-bold"><span class="trail green" style="width:11px;height:11px"></span>Bunny Lane</div>
  </div>

  <!-- gauge -->
  <div class="relative z-10 mt-8 flex justify-center">
    <div class="relative w-[320px] h-[320px]">
      <svg viewBox="0 0 200 200" class="absolute inset-0 w-full h-full">
        <defs><linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#32D583"/><stop offset=".65" stop-color="#53B1FD"/></linearGradient></defs>
        <path d="M40 160 A85 85 0 1 1 160 160" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12" stroke-linecap="round"/>
        <path d="M40 160 A85 85 0 0 1 100 15" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
        <path d="M148 39 A85 85 0 0 1 160 160" fill="none" stroke="#F04438" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 0"/>
        <circle cx="148" cy="39" r="5" fill="#fff"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <div class="pill bg-[#32D583]/15 text-[#32D583] mb-2"><span class="dot" style="background:#32D583"></span>Safe</div>
        <div class="text-[84px] font-extrabold num leading-none tracking-[-3px]">17</div>
        <div class="text-white/60 font-bold text-sm mt-1">km/h</div>
        <div class="text-white/40 text-[12px] font-semibold mt-3"><i class="fa-solid fa-bell mr-1"></i>Buzz at 25</div>
      </div>
    </div>
  </div>

  <!-- stats -->
  <div class="pad relative z-10 mt-2 grid grid-cols-3 gap-2.5">
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none">6</div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Runs</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none">23</div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Top km/h</div></div>
    <div class="rounded-2xl bg-white/[.06] border border-white/10 p-3.5"><div class="text-[26px] font-extrabold num leading-none text-[#FDB022]">1</div><div class="text-white/50 text-[12px] font-semibold mt-1.5">Alerts</div></div>
  </div>

  <!-- mini map -->
  <div class="pad relative z-10 mt-4">
    <div class="img rounded-[22px] h-[148px] overflow-hidden" style="background-image:url(img/mountain.jpg);background-position:50% 55%">
      <div class="absolute inset-0 bg-[#07111F]/30"></div>
      <svg class="absolute inset-0" width="100%" height="100%" viewBox="0 0 380 148" preserveAspectRatio="none"><path d="M200 10 C 180 50, 230 70, 210 100 S 170 130, 190 145" stroke="#32D583" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M200 10 C 196 22, 195 30, 197 40" stroke="#FDB022" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <div class="absolute left-[184px] top-[92px] w-5 h-5 rounded-full bg-white border-4 border-[#FF6B1A] shadow-[0_0_0_6px_rgba(255,107,26,.3)]"></div>
      <span class="pill glassd absolute left-3 bottom-3"><i class="fa-solid fa-mountain"></i>1,840 m</span>
    </div>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[42px] z-10 grid grid-cols-[1fr_68px] gap-3">
    <div class="btn bg-white/10 border border-white/15 text-white"><i class="fa-solid fa-cable-car"></i>Pauses on lifts</div>
    <div class="btn" style="background:var(--gradRed)"><i class="fa-solid fa-stop"></i></div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
