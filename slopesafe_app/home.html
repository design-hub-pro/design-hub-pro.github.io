<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

    <div class="pad flex items-center justify-between mt-3">
      <div class="flex items-center gap-3">
        <img src="img/kid.jpg" class="w-12 h-12 rounded-2xl object-cover">
        <div><div class="sub text-[13px]">Morning, Mia</div><div class="h2">Ready to ride?</div></div>
      </div>
      <div class="flex gap-2.5">
        <div class="iconbtn"><i class="fa-solid fa-fire text-[#FF5A1F]"></i><span class="badge" style="background:var(--orange)">6</span></div>
        <div class="iconbtn"><i class="fa-regular fa-bell"></i><span class="badge">2</span></div>
      </div>
    </div>

    <!-- Continue level -->
    <div class="pad mt-6">
      <div class="img shade hero" style="background-image:url(img/game3.jpg);height:250px">
        <div class="flex justify-between">
          <span class="pill glass"><span class="trail blue" style="width:11px;height:11px"></span>Level 4</span>
          <span class="pill glass"><i class="fa-solid fa-clock"></i>3 min</span>
        </div>
        <div class="flex items-end justify-between">
          <div>
            <div class="text-white/75 text-[13px] font-semibold">Continue</div>
            <div class="text-white text-[26px] font-extrabold tracking-tight leading-tight">Merge Point</div>
            <div class="flex items-center gap-2 mt-2"><div class="bar w-32" style="background:rgba(255,255,255,.25)"><i style="width:60%;background:#FDB022"></i></div><span class="text-white/80 text-xs font-bold">60%</span></div>
          </div>
          <div class="w-14 h-14 rounded-full bg-white flex items-center justify-center text-[#FF5A1F] text-xl shadow-xl"><i class="fa-solid fa-play ml-1"></i></div>
        </div>
      </div>
    </div>

    <!-- Slope readiness -->
    <div class="pad mt-4">
      <div class="card p-5 flex items-center gap-5">
        <div class="relative w-[92px] h-[92px] flex-none">
          <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#EEF3F9" stroke-width="11"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="79"/>
            <defs><linearGradient id="g"><stop offset="0" stop-color="#53B1FD"/><stop offset="1" stop-color="#1570EF"/></linearGradient></defs>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-[28px] font-extrabold num leading-none">7</span><span class="text-[11px] text-slate-400 font-bold">of 10</span></div>
        </div>
        <div class="flex-1">
          <div class="meta">Slope ready</div>
          <div class="text-[17px] font-bold mt-1 leading-snug">3 skills left before your first real run</div>
          <div class="flex gap-1.5 mt-3">
            <span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#12B76A"></span><span class="dot" style="background:#E4EAF2"></span><span class="dot" style="background:#E4EAF2"></span><span class="dot" style="background:#E4EAF2"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Next drills -->
    <div class="pad">
      <div class="sec"><span class="h2">Next drills</span><span class="act">Course map</span></div>
      <div class="hscroll">
        <div class="w-[168px]">
          <div class="img shade rounded-[22px] h-[200px] p-3 flex flex-col justify-between" style="background-image:url(img/game2.jpg)">
            <span class="pill glass self-start"><i class="fa-solid fa-smog"></i>Fog</span>
            <div class="text-white font-bold text-[15px] leading-tight">Low visibility</div>
          </div>
        </div>
        <div class="w-[168px]">
          <div class="img shade rounded-[22px] h-[200px] p-3 flex flex-col justify-between" style="background-image:url(img/lift.jpg)">
            <span class="pill glass self-start"><i class="fa-solid fa-cable-car"></i>Lift</span>
            <div class="text-white font-bold text-[15px] leading-tight">Chairlift rules</div>
          </div>
        </div>
        <div class="w-[168px]">
          <div class="img shade rounded-[22px] h-[200px] p-3 flex flex-col justify-between" style="background-image:url(img/game1.jpg)">
            <span class="pill glass self-start"><i class="fa-solid fa-hand"></i>Stop</span>
            <div class="text-white font-bold text-[15px] leading-tight">Pizza stop</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Watch -->
    <div class="pad mt-5">
      <div class="rounded-[22px] p-4 flex items-center gap-4 text-white" style="background:var(--gradInk)">
        <div class="gicon g-orange"><i class="fa-solid fa-stopwatch"></i></div>
        <div class="flex-1"><div class="font-bold text-[15px]">Mia's Watch</div><div class="text-white/60 text-[13px] flex items-center gap-2 mt-0.5"><span class="live"></span>Connected · 84%</div></div>
        <div class="text-right"><div class="text-[22px] font-extrabold num leading-none">25</div><div class="text-white/50 text-[11px] font-semibold">km/h limit</div></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-gamepad"></i>Course</div>
    <div class="tab ride"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div><span>Ride</span></div>
    <div class="tab"><i class="fa-solid fa-route"></i>Replays</div>
    <div class="tab"><i class="fa-solid fa-users"></i>Family</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
