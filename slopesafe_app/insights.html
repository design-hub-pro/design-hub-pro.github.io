<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Insights</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

    <div class="pad mt-3 flex items-end justify-between">
      <div><div class="meta">Mia · 4 ski days</div><div class="h1 mt-1">Safety trend</div></div>
      <div class="flex bg-white rounded-full p-1 shadow-[0_0_0_1px_#E4EAF2] text-[12.5px] font-bold"><span class="px-3 py-1.5 rounded-full bg-[#0B1A33] text-white">Days</span><span class="px-3 py-1.5 text-slate-400">Runs</span></div>
    </div>

    <!-- score -->
    <div class="pad mt-5">
      <div class="rounded-[26px] p-5 text-white relative overflow-hidden" style="background:var(--gradSky)">
        <i class="fa-solid fa-person-skiing absolute -right-4 -bottom-6 text-[150px] text-white/10"></i>
        <div class="flex items-start justify-between relative">
          <div>
            <div class="text-white/75 text-[13px] font-semibold">Time in safe speed</div>
            <div class="flex items-baseline gap-2 mt-1"><span class="text-[54px] font-extrabold num leading-none tracking-[-2px]">91%</span><span class="pill glass"><i class="fa-solid fa-arrow-trend-up"></i>+17</span></div>
          </div>
        </div>
        <!-- bars -->
        <div class="flex items-end gap-3 h-[110px] mt-5 relative">
          <div class="flex-1 flex flex-col items-center gap-1.5"><i class="w-full rounded-lg bg-white/35" style="height:70px"></i><span class="text-[11px] font-bold text-white/70">Sat</span></div>
          <div class="flex-1 flex flex-col items-center gap-1.5"><i class="w-full rounded-lg bg-white/35" style="height:66px"></i><span class="text-[11px] font-bold text-white/70">Sun</span></div>
          <div class="flex-1 flex flex-col items-center gap-1.5"><i class="w-full rounded-lg bg-white/50" style="height:78px"></i><span class="text-[11px] font-bold text-white/70">Sat</span></div>
          <div class="flex-1 flex flex-col items-center gap-1.5"><i class="w-full rounded-lg bg-white" style="height:88px"></i><span class="text-[11px] font-bold">Today</span></div>
        </div>
      </div>
    </div>

    <!-- alert counts -->
    <div class="pad mt-4 grid grid-cols-2 gap-3">
      <div class="card p-4">
        <div class="flex items-center justify-between"><div class="gicon g-orange" style="width:38px;height:38px;font-size:15px"><i class="fa-solid fa-gauge-high"></i></div><span class="text-[12px] font-bold text-[#12B76A]"><i class="fa-solid fa-arrow-down"></i> 5</span></div>
        <div class="text-[30px] font-extrabold num mt-3 leading-none">3</div><div class="sub text-[12.5px] mt-1">Speed buzzes</div>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between"><div class="gicon g-red" style="width:38px;height:38px;font-size:15px"><i class="fa-solid fa-person-falling"></i></div><span class="text-[12px] font-bold text-[#12B76A]"><i class="fa-solid fa-arrow-down"></i> 1</span></div>
        <div class="text-[30px] font-extrabold num mt-3 leading-none">0</div><div class="sub text-[12.5px] mt-1">Hard falls</div>
      </div>
    </div>

    <!-- where risk happens -->
    <div class="pad">
      <div class="sec"><span class="h2">Where it gets risky</span></div>
      <div class="card p-4 space-y-3.5">
        <div><div class="flex justify-between text-[13.5px] font-bold"><span><i class="fa-solid fa-mountain text-slate-400 mr-2"></i>Steep pitches</span><span class="num">58%</span></div><div class="bar mt-2"><i style="width:58%;background:var(--red)"></i></div></div>
        <div><div class="flex justify-between text-[13.5px] font-bold"><span><i class="fa-solid fa-code-merge text-slate-400 mr-2"></i>Trail merges</span><span class="num">29%</span></div><div class="bar mt-2"><i style="width:29%;background:var(--amber)"></i></div></div>
        <div><div class="flex justify-between text-[13.5px] font-bold"><span><i class="fa-solid fa-clock text-slate-400 mr-2"></i>Last hour of day</span><span class="num">13%</span></div><div class="bar mt-2"><i style="width:13%;background:var(--sky)"></i></div></div>
      </div>
    </div>

    <!-- recommended drill -->
    <div class="pad mt-4">
      <div class="img shade rounded-[24px] h-[150px] p-4 flex flex-col justify-between overflow-hidden" style="background-image:url(img/game1.jpg);background-position:50% 45%">
        <span class="pill text-white self-start" style="background:var(--gradOrange)"><i class="fa-solid fa-wand-magic-sparkles"></i>Practice tonight</span>
        <div class="flex items-end justify-between"><div class="text-white"><div class="font-extrabold text-[19px]">Steep Pitch Pizza</div><div class="text-white/75 text-[12.5px] font-semibold">Built from today's run 4</div></div><div class="w-11 h-11 rounded-full bg-white flex items-center justify-center text-[#FF5A1F]"><i class="fa-solid fa-play ml-0.5"></i></div></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-gamepad"></i>Course</div>
    <div class="tab ride"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div><span>Ride</span></div>
    <div class="tab on"><i class="fa-solid fa-route"></i>Replays</div>
    <div class="tab"><i class="fa-solid fa-users"></i>Family</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
