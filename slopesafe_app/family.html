<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Family</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.mk{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.mk img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 18px -6px rgba(0,0,0,.6)}
.mk .tip{width:10px;height:10px;background:#fff;transform:rotate(45deg);margin-top:-6px}
</style>
</head><body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="sb"><span class="t">11:08</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div><div class="meta">Parent view</div><div class="h1 mt-1">On the mountain</div></div>
      <img src="img/parent.jpg" class="w-12 h-12 rounded-2xl object-cover">
    </div>

    <!-- map -->
    <div class="pad mt-5">
      <div class="img rounded-[26px] h-[300px] overflow-hidden" style="background-image:url(img/mountain.jpg);background-position:50% 50%">
        <div class="absolute inset-0 bg-[#07111F]/15"></div>
        <div class="mk" style="left:150px;top:150px"><img src="img/kid.jpg" style="border-color:#32D583"><div class="tip" style="background:#32D583"></div></div>
        <div class="mk" style="left:270px;top:215px"><img src="img/kid2.jpg" style="border-color:#FDB022"><div class="tip" style="background:#FDB022"></div></div>
        <div class="absolute left-3 right-3 bottom-3 flex justify-between">
          <span class="pill glassd"><i class="fa-solid fa-snowflake"></i>-6°C · Light snow</span>
          <span class="pill glassd"><i class="fa-solid fa-location-arrow"></i>Live</span>
        </div>
      </div>
    </div>

    <!-- kids -->
    <div class="pad mt-4 space-y-2.5">
      <div class="card p-3.5 flex items-center gap-3.5">
        <div class="relative"><img src="img/kid.jpg" class="w-[52px] h-[52px] rounded-2xl object-cover"><span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#32D583] border-[3px] border-white"></span></div>
        <div class="flex-1"><div class="font-bold text-[16px]">Mia</div><div class="text-[12.5px] text-slate-500 font-semibold flex items-center gap-1.5"><span class="trail green" style="width:9px;height:9px"></span>Bunny Lane · 17 km/h</div></div>
        <div class="text-right"><div class="text-[22px] font-extrabold num leading-none">91%</div><div class="text-[11px] text-slate-400 font-bold">safe</div></div>
      </div>
      <div class="card p-3.5 flex items-center gap-3.5" style="box-shadow:0 0 0 2px #FDB022">
        <div class="relative"><img src="img/kid2.jpg" class="w-[52px] h-[52px] rounded-2xl object-cover"><span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#FDB022] border-[3px] border-white"></span></div>
        <div class="flex-1"><div class="font-bold text-[16px]">Leo</div><div class="text-[12.5px] text-slate-500 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-hourglass-half text-[#F79009]"></i>Stopped 3 min · mid-run</div></div>
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white" style="background:var(--gradSky)"><i class="fa-solid fa-phone"></i></div>
      </div>
    </div>

    <!-- feed -->
    <div class="pad">
      <div class="sec"><span class="h2">Today's alerts</span><span class="act">All</span></div>
      <div class="relative pl-6">
        <div class="absolute left-[7px] top-2 bottom-2 w-0.5 bg-slate-200"></div>
        <div class="relative pb-4"><span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-[#FDB022] border-[3px] border-[#F5F8FC]"></span><div class="flex justify-between"><span class="font-bold text-[14px]">Leo stopped mid-run</span><span class="text-[12px] text-slate-400 font-semibold num">11:05</span></div><div class="text-[12.5px] text-slate-500 font-semibold">Tapped "I'm OK" on watch</div></div>
        <div class="relative pb-4"><span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-[#F04438] border-[3px] border-[#F5F8FC]"></span><div class="flex justify-between"><span class="font-bold text-[14px]">Mia hit 29 km/h</span><span class="text-[12px] text-slate-400 font-semibold num">10:54</span></div><div class="text-[12.5px] text-slate-500 font-semibold">Slowed in 6 s after buzz</div></div>
        <div class="relative"><span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-[#32D583] border-[3px] border-[#F5F8FC]"></span><div class="flex justify-between"><span class="font-bold text-[14px]">Both started riding</span><span class="text-[12px] text-slate-400 font-semibold num">9:30</span></div></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-gamepad"></i>Course</div>
    <div class="tab ride"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div><span>Ride</span></div>
    <div class="tab"><i class="fa-solid fa-route"></i>Replays</div>
    <div class="tab on"><i class="fa-solid fa-users"></i>Family</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
