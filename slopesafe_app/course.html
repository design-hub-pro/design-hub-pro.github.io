<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Course</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.map{position:relative;height:640px;margin-top:8px;background:linear-gradient(180deg,#F5F8FC 0%,#E6F0FB 100%)}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.disc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;border:5px solid #fff;box-shadow:0 10px 22px -10px rgba(11,26,51,.5)}
.done{background:var(--gradGreen)}
.cur{background:var(--gradOrange);width:82px;height:82px;font-size:28px;box-shadow:0 0 0 10px rgba(255,107,26,.16),0 16px 30px -10px rgba(255,90,31,.8)}
.lock{background:#D0D9E5;color:#fff}
.lbl{margin-top:8px;font-size:12.5px;font-weight:700;background:#fff;padding:4px 10px;border-radius:999px;box-shadow:0 0 0 1px var(--border);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stars{font-size:10px;color:#FDB022;margin-top:4px;letter-spacing:2px}
.tree{position:absolute;color:#9DB8A6;font-size:22px;opacity:.55}
</style>
</head><body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

    <div class="pad mt-3 flex items-end justify-between">
      <div><div class="meta">Bunny Hill course</div><div class="h1 mt-1">Your trail</div></div>
      <div class="flex items-center gap-1.5 bg-white rounded-full px-3.5 py-2 shadow-[0_0_0_1px_#E4EAF2]"><i class="fa-solid fa-star text-[#FDB022] text-sm"></i><span class="font-extrabold num">17</span><span class="text-slate-400 text-sm font-semibold">/30</span></div>
    </div>

    <div class="pad mt-5 flex gap-2 overflow-x-auto">
      <span class="chip on"><i class="fa-solid fa-sun"></i>Groomed</span>
      <span class="chip"><i class="fa-solid fa-smog"></i>Fog</span>
      <span class="chip"><i class="fa-regular fa-snowflake"></i>Ice</span>
      <span class="chip"><i class="fa-solid fa-people-group"></i>Crowds</span>
    </div>

    <div class="map mt-5">
      <svg class="absolute inset-0" width="436" height="640" viewBox="0 0 436 640" fill="none">
        <path d="M218 600 C 80 560, 80 480, 130 450 S 330 400, 310 330 S 110 270, 140 200 S 320 140, 260 50" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
        <path d="M218 600 C 80 560, 80 480, 130 450 S 330 400, 310 330" stroke="#32D583" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
        <path d="M310 330 S 110 270, 140 200 S 320 140, 260 50" stroke="#C3CFDD" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>
      </svg>
      <i class="fa-solid fa-tree tree" style="left:30px;top:90px"></i>
      <i class="fa-solid fa-tree tree" style="left:56px;top:120px;font-size:16px"></i>
      <i class="fa-solid fa-tree tree" style="left:370px;top:230px"></i>
      <i class="fa-solid fa-tree tree" style="left:350px;top:520px;font-size:18px"></i>
      <i class="fa-solid fa-tree tree" style="left:22px;top:340px;font-size:18px"></i>
      <i class="fa-solid fa-mountain tree" style="left:340px;top:30px;font-size:30px;color:#B8C9DE"></i>

      <div class="node" style="left:218px;top:590px"><div class="disc done"><i class="fa-solid fa-check"></i></div><div class="lbl"><span class="trail green" style="width:10px;height:10px"></span>Gear up</div><div class="stars">★★★</div></div>
      <div class="node" style="left:118px;top:470px"><div class="disc done"><i class="fa-solid fa-hand"></i></div><div class="lbl"><span class="trail green" style="width:10px;height:10px"></span>Pizza stop</div><div class="stars">★★★</div></div>
      <div class="node" style="left:300px;top:395px"><div class="disc done"><i class="fa-solid fa-gauge"></i></div><div class="lbl"><span class="trail green" style="width:10px;height:10px"></span>Slow zones</div><div class="stars">★★<span style="color:#D0D9E5">★</span></div></div>
      <div class="node" style="left:218px;top:285px"><div class="disc cur"><i class="fa-solid fa-code-merge"></i></div><div class="lbl" style="background:var(--ink);color:#fff;box-shadow:none"><span class="trail blue" style="width:10px;height:10px;background:#53B1FD"></span>Merge Point</div></div>
      <div class="node" style="left:150px;top:180px"><div class="disc lock"><i class="fa-solid fa-lock"></i></div><div class="lbl text-slate-400"><span class="trail blue" style="width:10px;height:10px"></span>Fog run</div></div>
      <div class="node" style="left:268px;top:70px"><div class="disc lock"><i class="fa-solid fa-lock"></i></div><div class="lbl text-slate-400"><span class="trail blue" style="width:10px;height:10px"></span>Icy patch</div></div>
    </div>

    <div class="pad -mt-2">
      <div class="card p-4 flex items-center gap-4">
        <div class="img w-[74px] h-[74px] rounded-2xl flex-none" style="background-image:url(img/game3.jpg)"></div>
        <div class="flex-1">
          <div class="font-bold text-[16px]">Merge Point</div>
          <div class="flex items-center gap-3 mt-1.5 text-[12.5px] text-slate-500 font-semibold"><span><i class="fa-solid fa-mobile-screen mr-1"></i>Tilt</span><span><i class="fa-regular fa-clock mr-1"></i>3 min</span><span><i class="fa-solid fa-people-group mr-1"></i>Busy</span></div>
        </div>
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white" style="background:var(--gradOrange)"><i class="fa-solid fa-play"></i></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab on"><i class="fa-solid fa-gamepad"></i>Course</div>
    <div class="tab ride"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div><span>Ride</span></div>
    <div class="tab"><i class="fa-solid fa-route"></i>Replays</div>
    <div class="tab"><i class="fa-solid fa-users"></i>Family</div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
