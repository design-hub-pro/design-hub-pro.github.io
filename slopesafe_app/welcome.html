<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="screen dark">
  <div class="img absolute inset-0" style="background-image:url(img/hero.jpg);background-position:50% 30%"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,17,31,.25) 0%,rgba(7,17,31,0) 30%,rgba(7,17,31,.75) 58%,#07111F 80%)"></div>
  <div class="island"></div>
  <div class="sb light"><span class="t">9:41</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>

  <div class="pad relative z-10 mt-4 flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background:var(--gradOrange)"><i class="fa-solid fa-person-skiing"></i></div>
    <span class="text-xl font-extrabold tracking-tight">SlopeSafe</span>
  </div>

  <div class="absolute left-0 right-0 bottom-0 pad pb-12 z-10">
    <div class="flex gap-2 mb-5">
      <span class="pill glass"><i class="fa-solid fa-gamepad"></i>Practice at home</span>
      <span class="pill glass"><i class="fa-solid fa-stopwatch"></i>Watch on the slope</span>
    </div>
    <h1 class="text-[40px] font-extrabold leading-[1.02] tracking-[-1.5px]">Learn it in the game.<br><span style="color:#FDB022">Ski it safely.</span></h1>
    <p class="text-[15px] text-white/70 font-medium mt-4 leading-relaxed">Short drills for kids at home, then real-time buzz alerts from a watch or phone on the mountain.</p>

    <div class="grid grid-cols-3 gap-2.5 mt-7">
      <div class="rounded-2xl p-3.5 glassd border border-white/10"><i class="fa-solid fa-gauge-high text-[#FDB022]"></i><div class="text-[12.5px] font-semibold mt-2 leading-tight">Speed control</div></div>
      <div class="rounded-2xl p-3.5 glassd border border-white/10"><i class="fa-solid fa-code-merge text-[#53B1FD]"></i><div class="text-[12.5px] font-semibold mt-2 leading-tight">Safe merging</div></div>
      <div class="rounded-2xl p-3.5 glassd border border-white/10"><i class="fa-solid fa-hand text-[#32D583]"></i><div class="text-[12.5px] font-semibold mt-2 leading-tight">Safe stops</div></div>
    </div>

    <div class="btn org mt-7">Start as a skier <i class="fa-solid fa-arrow-right"></i></div>
    <div class="btn mt-3 border border-white/20 text-white/90"><i class="fa-solid fa-user-shield"></i>I'm a parent</div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
