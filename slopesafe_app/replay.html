<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Run replay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;border:3px solid #fff;box-shadow:0 6px 14px -4px rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;top:470px;bottom:0;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:0 -10px 30px -10px rgba(11,26,51,.25)}
</style>
</head><body>
<div class="screen">
  <div class="img absolute left-0 right-0 top-0 h-[520px]" style="background-image:url(img/mountain.jpg);background-size:cover;background-position:50% 35%"></div>
  <div class="absolute left-0 right-0 top-0 h-[520px]" style="background:linear-gradient(180deg,rgba(7,17,31,.5) 0%,rgba(7,17,31,.05) 30%,rgba(7,17,31,.15) 100%)"></div>
  <svg class="absolute left-0 top-0" width="436" height="520" viewBox="0 0 436 520" fill="none">
    <path d="M232 110 C 250 150, 300 175, 290 215" stroke="#32D583" stroke-width="7" stroke-linecap="round"/>
    <path d="M290 215 C 282 250, 255 262, 240 290" stroke="#FDB022" stroke-width="7" stroke-linecap="round"/>
    <path d="M240 290 C 226 318, 210 330, 200 350" stroke="#F04438" stroke-width="7" stroke-linecap="round"/>
    <path d="M200 350 C 186 380, 230 400, 236 440" stroke="#32D583" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <div class="pin" style="left:232px;top:110px;background:#0B1A33"><i class="fa-solid fa-flag"></i></div>
  <div class="pin" style="left:262px;top:262px;background:#F79009"><i class="fa-solid fa-code-merge"></i></div>
  <div class="pin" style="left:212px;top:328px;background:#F04438;width:36px;height:36px;box-shadow:0 0 0 8px rgba(240,68,56,.3)"><i class="fa-solid fa-gauge-high"></i></div>
  <div class="pin" style="left:236px;top:440px;background:#12B76A"><i class="fa-solid fa-flag-checkered"></i></div>
  <div class="absolute left-[252px] top-[316px] rounded-xl bg-white px-2.5 py-1.5 shadow-xl text-[12px] font-extrabold flex items-center gap-1.5"><span class="dot" style="background:#F04438"></span><span class="num">29 km/h</span></div>

  <div class="island"></div>
  <div class="sb light"><span class="t">4:12</span><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half"></i></span></div>
  <div class="pad relative z-10 mt-3 flex items-center justify-between text-white">
    <div class="w-11 h-11 rounded-2xl glassd flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="text-center"><div class="font-bold text-[15px]">Run 4 · Bunny Lane</div><div class="text-white/70 text-[12px] font-semibold">Today, 10:54</div></div>
    <div class="w-11 h-11 rounded-2xl glassd flex items-center justify-center"><i class="fa-solid fa-play text-sm"></i></div>
  </div>

  <div class="sheet">
    <div class="w-10 h-1.5 rounded-full bg-slate-300 mx-auto mt-3"></div>
    <div class="pad mt-4">
      <div class="flex gap-3">
        <div class="flex-1"><div class="text-[32px] font-extrabold num leading-none">2:41</div><div class="sub text-[12.5px] mt-1">Run time</div></div>
        <div class="flex-1"><div class="text-[32px] font-extrabold num leading-none">29</div><div class="sub text-[12.5px] mt-1">Top km/h</div></div>
        <div class="flex-1"><div class="text-[32px] font-extrabold num leading-none text-[#F04438]">2</div><div class="sub text-[12.5px] mt-1">Risk spots</div></div>
      </div>

      <!-- speed timeline -->
      <div class="mt-5 h-[46px] rounded-xl overflow-hidden flex">
        <i class="block h-full" style="width:34%;background:#32D583"></i><i class="block h-full" style="width:16%;background:#FDB022"></i><i class="block h-full" style="width:12%;background:#F04438"></i><i class="block h-full" style="width:38%;background:#32D583"></i>
      </div>
      <div class="flex justify-between text-[11px] font-bold text-slate-400 mt-1.5 num"><span>0:00</span><span>1:20</span><span>2:41</span></div>

      <div class="mt-5 space-y-2.5">
        <div class="card p-3.5 flex items-center gap-3.5">
          <div class="gicon g-red" style="width:42px;height:42px"><i class="fa-solid fa-gauge-high"></i></div>
          <div class="flex-1"><div class="font-bold text-[15px]">Sped up on the steep pitch</div><div class="text-[12.5px] text-slate-500 font-semibold">6 s over limit · buzzed</div></div>
          <span class="pill text-white" style="background:var(--gradOrange)"><i class="fa-solid fa-gamepad"></i>Drill</span>
        </div>
        <div class="card p-3.5 flex items-center gap-3.5">
          <div class="gicon g-orange" style="width:42px;height:42px"><i class="fa-solid fa-code-merge"></i></div>
          <div class="flex-1"><div class="font-bold text-[15px]">Didn't slow at the merge</div><div class="text-[12.5px] text-slate-500 font-semibold">21 km/h through junction</div></div>
          <span class="pill text-white" style="background:var(--gradOrange)"><i class="fa-solid fa-gamepad"></i>Drill</span>
        </div>
      </div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
