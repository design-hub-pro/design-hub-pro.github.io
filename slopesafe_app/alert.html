<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlopeSafe · Alert</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.watch{width:178px;height:212px;border-radius:52px;background:#0B0B0F;padding:10px;box-shadow:0 0 0 5px #2A2D35,0 30px 60px -20px rgba(0,0,0,.6);position:relative}
.watch::after{content:"";position:absolute;right:-11px;top:58px;width:8px;height:38px;border-radius:4px;background:#3A3D46}
.wscreen{width:100%;height:100%;border-radius:42px;background:#E31B54;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
</style>
</head><body>
<div class="screen dark" style="background:linear-gradient(180deg,#E31B54 0%,#B4123E 55%,#5C0A22 100%)">
  <div class="island"></div>
  <div class="sb light"><span class="t">10:54</span><span class="i"><i class="fa-solid fa-location-arrow text-[11px]"></i><i class="fa-solid fa-signal"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

  <div class="pad relative z-10 mt-4 flex justify-center">
    <span class="pill glass text-[13px]"><i class="fa-solid fa-wave-square"></i>Buzzing wrist · 3 pulses</span>
  </div>

  <div class="relative h-[360px] mt-4">
    <div class="ring" style="width:250px;height:250px"></div>
    <div class="ring" style="width:330px;height:330px;opacity:.6"></div>
    <div class="ring" style="width:410px;height:410px;opacity:.3"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 watch">
      <div class="wscreen">
        <svg width="46" height="36" viewBox="0 0 40 34"><path d="M6 4 L20 30 L34 4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="text-[44px] font-extrabold num leading-none mt-2">29</div>
        <div class="text-[11px] font-bold text-white/80">km/h</div>
        <div class="text-[13px] font-extrabold mt-1.5">PIZZA NOW</div>
      </div>
    </div>
  </div>

  <div class="pad relative z-10 text-center">
    <div class="text-[40px] font-extrabold tracking-[-1.2px] leading-[1.02]">Too fast.<br>Slow down.</div>
    <div class="text-white/75 font-semibold text-[15px] mt-3">4 km/h over your limit for 6 seconds</div>
  </div>

  <div class="pad relative z-10 mt-7">
    <div class="rounded-[22px] bg-white/12 border border-white/20 p-4" style="background:rgba(255,255,255,.1)">
      <div class="relative flex items-end justify-between h-[64px] gap-1">
        <i class="flex-1 rounded-t bg-white/40" style="height:48%"></i><i class="flex-1 rounded-t bg-white/40" style="height:55%"></i><i class="flex-1 rounded-t bg-white/40" style="height:64%"></i><i class="flex-1 rounded-t bg-white/50" style="height:74%"></i><i class="flex-1 rounded-t bg-white/70" style="height:83%"></i><i class="flex-1 rounded-t bg-white" style="height:93%"></i><i class="flex-1 rounded-t bg-white" style="height:100%"></i><i class="flex-1 rounded-t bg-white" style="height:97%"></i><i class="flex-1 rounded-t bg-white" style="height:90%"></i>
        <div class="absolute left-0 right-0 border-t-2 border-dashed border-[#FDB022]" style="bottom:86%"><span class="absolute left-0 -top-[18px] text-[10px] font-extrabold text-[#FDB022]">LIMIT 25</span></div>
      </div>
      <div class="flex justify-between text-[11px] font-bold text-white/60 mt-2"><span>-10s</span><span>now</span></div>
    </div>
  </div>

  <div class="pad absolute left-0 right-0 bottom-[42px] z-10 grid grid-cols-2 gap-3">
    <div class="btn bg-white text-[#B4123E]"><i class="fa-solid fa-check"></i>I slowed down</div>
    <div class="btn border border-white/30 text-white"><i class="fa-solid fa-phone"></i>Call Mom</div>
  </div>
  <div class="homebar light"></div>
</div>
</body></html>
