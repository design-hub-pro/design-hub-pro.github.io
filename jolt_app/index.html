<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - An alarm you have to earn</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;}

  .hero{text-align:center;padding:86px 40px 54px;}
  .app-icon{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#FF5C3D,#FFA630);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 14px 42px rgba(255,92,61,.34);}
  .app-icon i{font-size:34px;color:#fff;}
  .app-name{font-size:52px;font-weight:900;letter-spacing:-2.2px;background:linear-gradient(135deg,#FF5C3D,#FFA630);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .tagline{font-size:20px;color:#5A6472;font-weight:400;margin-top:14px;}
  .tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .tag{font-size:12px;font-weight:600;padding:7px 15px;border-radius:50px;background:#FFEDE7;color:#B5411F;}
  .tag.b{background:#EEF0FE;color:#3B41A8;}
  .tag.g{background:#E7F5EF;color:#0C5844;}

  .screens{padding:0 40px 96px;max-width:1600px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px;justify-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;}
  .label{font-size:13px;font-weight:700;color:#9AA3AF;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
  .phone-frame{width:460px;height:980px;border-radius:62px;background:#0B0E13;padding:12px;box-shadow:0 26px 80px rgba(0,0,0,.17),0 0 0 1px rgba(0,0,0,.05);}
  .phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#0B0E13;}
  .phone-screen iframe{width:100%;height:100%;border:none;border-radius:52px;}
</style>
</head>
<body>
  <div class="hero">
    <div class="app-icon"><i class="fas fa-bolt"></i></div>
    <div class="app-name">Jolt</div>
    <div class="tagline">The alarm stays on until you finish the morning's mission.</div>
    <div class="tags">
      <span class="tag">Alarm</span>
      <span class="tag b">Missions</span>
      <span class="tag g">Photo Match</span>
      <span class="tag">Streaks</span>
    </div>
  </div>

  <div class="screens">
    <div class="grid">
      <div class="item"><div class="label">Pick your chaos</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Tonight</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="tonight.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Mission deck</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="deck.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">6:40 AM</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="ring.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Doing it</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="mission.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Awake</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="awake.html" scrolling="no"></iframe></div></div></div>
      <div class="item"><div class="label">Streak</div>
        <div class="phone-frame"><div class="phone-screen"><iframe src="streak.html" scrolling="no"></iframe></div></div></div>
    </div>
  </div>
</body>
</html>
