<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Ringing</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#0B0E13;color:#fff;overflow:hidden;position:relative;}

  .glow{position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(255,92,61,.42) 0%,rgba(255,92,61,0) 66%);}
  .glow2{position:absolute;bottom:-220px;right:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,166,48,.24) 0%,rgba(255,166,48,0) 68%);}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#fff;position:relative;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .content{padding:52px 28px 0;position:relative;}
  .t{font-size:104px;font-weight:900;letter-spacing:-5.5px;line-height:.9;}
  .d{font-size:15px;font-weight:600;color:rgba(255,255,255,.42);margin-top:12px;letter-spacing:.2px;}

  .card{margin-top:56px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);padding:34px 30px;backdrop-filter:blur(20px);}
  .k{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:#FF7A5C;}
  .card h1{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1.02;margin-top:16px;}
  .card .task{font-size:19px;font-weight:600;color:rgba(255,255,255,.62);margin-top:14px;}
  .meta{display:flex;gap:22px;margin-top:26px;padding-top:24px;border-top:1px solid rgba(255,255,255,.10);font-size:14px;font-weight:700;color:rgba(255,255,255,.55);}
  .meta i{color:#FF7A5C;margin-right:7px;}

  .cta{position:absolute;left:28px;right:28px;bottom:126px;height:76px;border-radius:26px;background:linear-gradient(135deg,#FF5C3D,#FFA630);font-size:21px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 18px 50px rgba(255,92,61,.42);}
  .snooze{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:14px;font-weight:700;color:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;gap:9px;}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="island"></div>
  <div class="status"><span>6:40</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-half"></i></span></div>

  <div class="content">
    <div class="t">6:40</div>
    <div class="d">Thursday, 14 August</div>

    <div class="card">
      <div class="k"><i class="fas fa-lock-open"></i> Mission unsealed</div>
      <h1>Kettle<br>Hunt</h1>
      <div class="task">Photograph the kettle.</div>
      <div class="meta"><span><i class="fas fa-stopwatch"></i>90 sec</span><span><i class="fas fa-camera"></i>Photo match</span></div>
    </div>
  </div>

  <div class="cta"><i class="fas fa-bolt"></i> Start</div>
  <div class="snooze"><i class="fas fa-lock"></i> Snooze locked until you finish</div>
</body>
</html>
