<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Tonight</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;overflow:hidden;position:relative;}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .content{padding:18px 28px 0;}
  .kicker{font-size:13px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#A0A8B4;}

  .clock{display:flex;align-items:flex-end;gap:12px;margin-top:12px;}
  .clock .t{font-size:88px;font-weight:900;letter-spacing:-4.5px;line-height:.92;}
  .clock .m{font-size:24px;font-weight:800;color:#A0A8B4;margin-bottom:12px;}
  .sub{font-size:16px;font-weight:600;color:#8A93A0;margin-top:8px;}
  .sub b{color:#FF5C3D;font-weight:800;}

  .hero{margin-top:30px;height:326px;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(14,17,22,.20);}
  .hero img{width:100%;height:100%;object-fit:cover;}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.10) 0%,rgba(10,14,20,.20) 42%,rgba(10,14,20,.88) 100%);}
  .heroin{position:absolute;left:26px;right:26px;bottom:26px;color:#fff;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;padding:8px 14px;border-radius:50px;background:rgba(255,92,61,.94);}
  .heroin h2{font-size:34px;font-weight:900;letter-spacing:-1.1px;margin-top:14px;}
  .meta{display:flex;gap:16px;margin-top:10px;font-size:14px;font-weight:600;color:rgba(255,255,255,.78);}
  .dice{position:absolute;top:22px;right:22px;width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;}

  .stats{display:flex;gap:14px;margin-top:20px;}
  .st{flex:1;background:#F6F7F9;border-radius:22px;padding:20px 22px;}
  .st .n{font-size:36px;font-weight:900;letter-spacing:-1.4px;}
  .st .l{font-size:13px;font-weight:700;color:#8A93A0;margin-top:2px;text-transform:uppercase;letter-spacing:1.4px;}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:1px solid #EDEFF2;display:flex;padding:14px 28px 0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#B4BBC5;font-size:11px;font-weight:700;}
  .tab i{font-size:20px;}
  .tab.on{color:#FF5C3D;}
</style>
</head>
<body>
  <div class="island"></div>
  <div class="status"><span>11:12</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="content">
    <div class="kicker">Tonight</div>
    <div class="clock"><div class="t">6:40</div><div class="m">AM</div></div>
    <div class="sub">Rings in <b>7h 28m</b></div>

    <div class="hero">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786742970017-image-1.png" alt="">
      <div class="scrim"></div>
      <div class="dice"><i class="fas fa-dice"></i></div>
      <div class="heroin">
        <span class="chip"><i class="fas fa-lock"></i> Sealed</span>
        <h2>Kettle Hunt</h2>
        <div class="meta"><span><i class="fas fa-camera"></i> Photo</span><span><i class="fas fa-stopwatch"></i> 90 sec</span></div>
      </div>
    </div>

    <div class="stats">
      <div class="st"><div class="n">18</div><div class="l">Streak</div></div>
      <div class="st"><div class="n">0</div><div class="l">Snoozes</div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i class="fas fa-moon"></i>Tonight</div>
    <div class="tab"><i class="fas fa-layer-group"></i>Deck</div>
    <div class="tab"><i class="fas fa-fire-flame-curved"></i>Streak</div>
  </div>
</body>
</html>
