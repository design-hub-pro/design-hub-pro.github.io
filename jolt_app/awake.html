<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Awake</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;overflow:hidden;position:relative;}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#fff;z-index:10;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .hero{height:460px;position:relative;}
  .hero img{width:100%;height:100%;object-fit:cover;}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.55) 0%,rgba(10,14,20,.05) 40%,rgba(10,14,20,.72) 100%);}
  .heroin{position:absolute;left:28px;bottom:30px;color:#fff;}
  .k{font-size:12px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:#FFB08F;}
  .heroin h1{font-size:44px;font-weight:900;letter-spacing:-1.9px;margin-top:10px;line-height:1.02;}

  .content{padding:34px 28px 0;}
  .scorerow{display:flex;align-items:flex-end;justify-content:space-between;}
  .score{font-size:76px;font-weight:900;letter-spacing:-4px;line-height:.86;background:linear-gradient(135deg,#FF5C3D,#FFA630);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .scorelbl{font-size:13px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:#A0A8B4;margin-bottom:10px;}

  .stats{display:flex;gap:12px;margin-top:32px;}
  .st{flex:1;background:#F6F7F9;border-radius:20px;padding:18px 16px;text-align:center;}
  .st .n{font-size:27px;font-weight:900;letter-spacing:-1px;}
  .st .l{font-size:11px;font-weight:700;color:#8A93A0;margin-top:3px;text-transform:uppercase;letter-spacing:1.3px;}

  .cta{position:absolute;left:28px;right:28px;bottom:52px;height:64px;border-radius:22px;background:#0E1116;color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;}
</style>
</head>
<body>
  <div class="island"></div>
  <div class="status"><span>6:41</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-half"></i></span></div>

  <div class="hero">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786742986957-image-1.png" alt="">
    <div class="scrim"></div>
    <div class="heroin">
      <div class="k">Mission cleared</div>
      <h1>Awake at 6:41</h1>
    </div>
  </div>

  <div class="content">
    <div class="scorerow">
      <div class="score">94</div>
      <div class="scorelbl">Wake score</div>
    </div>

    <div class="stats">
      <div class="st"><div class="n">0</div><div class="l">Snoozes</div></div>
      <div class="st"><div class="n">47s</div><div class="l">Mission</div></div>
      <div class="st"><div class="n">19</div><div class="l">Streak</div></div>
    </div>
  </div>

  <div class="cta">Tomorrow's mission <i class="fas fa-arrow-right"></i></div>
</body>
</html>
