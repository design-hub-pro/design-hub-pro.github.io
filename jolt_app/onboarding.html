<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Setup</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;overflow:hidden;position:relative;}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;color:#0E1116;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .content{padding:22px 28px 0;}
  .kicker{font-size:13px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#FF5C3D;}
  h1{font-size:40px;font-weight:900;letter-spacing:-1.6px;line-height:1.08;margin-top:14px;}

  .opts{margin-top:44px;display:flex;flex-direction:column;gap:16px;}
  .opt{display:flex;align-items:center;gap:18px;padding:22px 22px;border-radius:24px;background:#F6F7F9;border:2px solid transparent;}
  .opt.on{background:#fff;border-color:#FF5C3D;box-shadow:0 14px 40px rgba(255,92,61,.18);}
  .tile{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8A93A0;background:#E9ECF0;flex:none;}
  .opt.on .tile{background:linear-gradient(135deg,#FF5C3D,#FFA630);color:#fff;}
  .opt .nm{font-size:21px;font-weight:800;letter-spacing:-.4px;}
  .opt .sub{font-size:14px;color:#8A93A0;font-weight:600;margin-top:3px;}
  .check{margin-left:auto;font-size:20px;color:#FF5C3D;}

  .lockrow{margin-top:40px;display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-radius:22px;background:#F6F7F9;}
  .lockrow .l{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:700;}
  .lockrow i{color:#FF5C3D;font-size:17px;}
  .sw{width:52px;height:31px;border-radius:20px;background:linear-gradient(135deg,#FF5C3D,#FFA630);position:relative;}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:25px;height:25px;border-radius:50%;background:#fff;}

  .cta{position:absolute;left:28px;right:28px;bottom:52px;height:64px;border-radius:22px;background:linear-gradient(135deg,#FF5C3D,#FFA630);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 40px rgba(255,92,61,.34);}
</style>
</head>
<body>
  <div class="island"></div>
  <div class="status"><span>6:40</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="content">
    <div class="kicker">Step 1 of 1</div>
    <h1>How hard should<br>mornings hit?</h1>

    <div class="opts">
      <div class="opt">
        <div class="tile"><i class="fas fa-feather"></i></div>
        <div><div class="nm">Gentle</div><div class="sub">30 sec</div></div>
      </div>
      <div class="opt on">
        <div class="tile"><i class="fas fa-fire"></i></div>
        <div><div class="nm">Spicy</div><div class="sub">90 sec</div></div>
        <i class="fas fa-circle-check check"></i>
      </div>
      <div class="opt">
        <div class="tile"><i class="fas fa-bolt"></i></div>
        <div><div class="nm">Unhinged</div><div class="sub">4 min</div></div>
      </div>
    </div>

    <div class="lockrow">
      <div class="l"><i class="fas fa-lock"></i> Lock the snooze</div>
      <div class="sw"></div>
    </div>
  </div>

  <div class="cta">Set my first mission <i class="fas fa-arrow-right"></i></div>
</body>
</html>
