<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Deck</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;overflow:hidden;position:relative;}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .content{padding:18px 28px 0;}
  h1{font-size:40px;font-weight:900;letter-spacing:-1.7px;}

  .chips{display:flex;gap:10px;margin-top:20px;}
  .c{font-size:13px;font-weight:700;padding:10px 18px;border-radius:50px;background:#F1F3F5;color:#7C8593;}
  .c.on{background:#0E1116;color:#fff;}

  .feat{margin-top:20px;height:194px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 16px 40px rgba(14,17,22,.16);}
  .feat img{width:100%;height:100%;object-fit:cover;}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,0) 30%,rgba(10,14,20,.85) 100%);}
  .featin{position:absolute;left:24px;bottom:22px;color:#fff;}
  .tagline{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#FFB08F;}
  .featin h2{font-size:27px;font-weight:900;letter-spacing:-.8px;margin-top:6px;}
  .featin .m{font-size:13px;font-weight:600;color:rgba(255,255,255,.75);margin-top:5px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .card{background:#F6F7F9;border-radius:22px;padding:20px 18px 18px;}
  .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
  .card .nm{font-size:17px;font-weight:800;letter-spacing:-.4px;margin-top:14px;line-height:1.2;}
  .card .d{font-size:13px;font-weight:600;color:#8A93A0;margin-top:5px;}

  .g1{background:linear-gradient(135deg,#FF5C3D,#FFA630);}
  .g2{background:linear-gradient(135deg,#5B6CFF,#8E7BFF);}
  .g3{background:linear-gradient(135deg,#12B886,#4FD1A5);}
  .g4{background:linear-gradient(135deg,#F0526B,#FF8A9B);}
  .g5{background:linear-gradient(135deg,#3AA9E8,#63D3F5);}
  .g6{background:linear-gradient(135deg,#E8A33A,#F5CE63);}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:1px solid #EDEFF2;display:flex;padding:14px 28px 0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#B4BBC5;font-size:11px;font-weight:700;}
  .tab i{font-size:20px;}
  .tab.on{color:#FF5C3D;}
</style>
</head>
<body>
  <div class="island"></div>
  <div class="status"><span>11:14</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="content">
    <h1>Deck</h1>
    <div class="chips"><span class="c on">All 42</span><span class="c">Move</span><span class="c">Loud</span><span class="c">Think</span></div>

    <div class="feat">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786742993529-image-1.png" alt="">
      <div class="scrim"></div>
      <div class="featin">
        <div class="tagline">Most survived</div>
        <h2>Balcony Barefoot</h2>
        <div class="m">2 min · Outside · Cold</div>
      </div>
    </div>

    <div class="grid">
      <div class="card"><div class="ic g1"><i class="fas fa-camera"></i></div><div class="nm">Kettle Hunt</div><div class="d">90 sec</div></div>
      <div class="card"><div class="ic g2"><i class="fas fa-microphone"></i></div><div class="nm">Shout a Poem</div><div class="d">60 sec</div></div>
      <div class="card"><div class="ic g3"><i class="fas fa-person-running"></i></div><div class="nm">40 Jacks</div><div class="d">2 min</div></div>
      <div class="card"><div class="ic g4"><i class="fas fa-music"></i></div><div class="nm">Dance Cam</div><div class="d">75 sec</div></div>
      <div class="card"><div class="ic g5"><i class="fas fa-square-root-variable"></i></div><div class="nm">Math Gauntlet</div><div class="d">3 min</div></div>
      <div class="card"><div class="ic g6"><i class="fas fa-socks"></i></div><div class="nm">Sock Puppet Weather</div><div class="d">90 sec</div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-moon"></i>Tonight</div>
    <div class="tab on"><i class="fas fa-layer-group"></i>Deck</div>
    <div class="tab"><i class="fas fa-fire-flame-curved"></i>Streak</div>
  </div>
</body>
</html>
