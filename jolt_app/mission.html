<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Mission</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#0B0E13;color:#fff;overflow:hidden;position:relative;}

  .cam{position:absolute;inset:0;}
  .cam img{width:100%;height:100%;object-fit:cover;}
  .vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.72) 0%,rgba(8,10,14,.10) 26%,rgba(8,10,14,.14) 58%,rgba(8,10,14,.92) 100%);}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{position:relative;height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .top{position:absolute;top:74px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;}
  .name{font-size:13px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;padding:11px 18px;border-radius:50px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);}
  .timer{font-size:34px;font-weight:900;letter-spacing:-1.4px;color:#FF7A5C;font-variant-numeric:tabular-nums;}

  .frame{position:absolute;top:212px;left:56px;right:56px;height:342px;}
  .cn{position:absolute;width:42px;height:42px;border:4px solid #FF5C3D;border-radius:6px;}
  .tl{top:0;left:0;border-right:none;border-bottom:none;border-top-left-radius:18px;}
  .tr{top:0;right:0;border-left:none;border-bottom:none;border-top-right-radius:18px;}
  .bl{bottom:0;left:0;border-right:none;border-top:none;border-bottom-left-radius:18px;}
  .br{bottom:0;right:0;border-left:none;border-top:none;border-bottom-right-radius:18px;}
  .lock{position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#FF7A5C;}

  .bot{position:absolute;left:28px;right:28px;bottom:52px;}
  .matchrow{display:flex;align-items:baseline;justify-content:space-between;}
  .matchrow .l{font-size:13px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .matchrow .v{font-size:38px;font-weight:900;letter-spacing:-1.5px;}
  .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden;}
  .fill{height:100%;width:82%;border-radius:8px;background:linear-gradient(90deg,#FF5C3D,#FFA630);}
  .shutter{width:88px;height:88px;border-radius:50%;border:5px solid rgba(255,255,255,.9);margin:34px auto 0;display:flex;align-items:center;justify-content:center;}
  .shutter div{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#FF5C3D,#FFA630);}
</style>
</head>
<body>
  <div class="cam">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786742978108-image-1.png" alt="">
    <div class="vig"></div>
  </div>
  <div class="island"></div>
  <div class="status"><span>6:41</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-half"></i></span></div>

  <div class="top">
    <div class="name">Kettle Hunt</div>
    <div class="timer">0:47</div>
  </div>

  <div class="frame">
    <div class="lock">Hold steady</div>
    <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  </div>

  <div class="bot">
    <div class="matchrow"><span class="l">Match</span><span class="v">82%</span></div>
    <div class="bar"><div class="fill"></div></div>
    <div class="shutter"><div></div></div>
  </div>
</body>
</html>
