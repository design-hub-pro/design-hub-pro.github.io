<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jolt - Streak</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;}
  *::-webkit-scrollbar{display:none;}
  html,body{width:100%;height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#0E1116;overflow:hidden;position:relative;}

  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:20;}
  .status{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600;}
  .status .icons{display:flex;gap:6px;align-items:center;font-size:14px;}

  .content{padding:18px 28px 0;}
  h1{font-size:40px;font-weight:900;letter-spacing:-1.7px;}

  .big{margin-top:26px;border-radius:28px;background:linear-gradient(135deg,#FF5C3D,#FFA630);color:#fff;padding:32px 30px;box-shadow:0 18px 44px rgba(255,92,61,.30);}
  .big .n{font-size:82px;font-weight:900;letter-spacing:-4px;line-height:.9;}
  .big .l{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.82);margin-top:8px;}
  .big .r{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.28);display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:rgba(255,255,255,.9);}

  .lbl{font-size:12px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:#A0A8B4;margin-top:34px;}

  .chart{display:flex;align-items:flex-end;gap:12px;height:152px;margin-top:20px;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:flex-end;height:100%;}
  .bar{width:100%;border-radius:10px;background:#F0F1F4;}
  .bar.on{background:linear-gradient(180deg,#FFA630,#FF5C3D);}
  .day{font-size:12px;font-weight:700;color:#A0A8B4;}

  .list{margin-top:26px;display:flex;flex-direction:column;gap:2px;}
  .row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #F0F1F4;}
  .dot{width:10px;height:10px;border-radius:50%;background:#12B886;flex:none;}
  .dot.miss{background:#E4E7EB;}
  .row .nm{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .row .tm{margin-left:auto;font-size:15px;font-weight:700;color:#A0A8B4;font-variant-numeric:tabular-nums;}

  .tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:1px solid #EDEFF2;display:flex;padding:14px 28px 0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#B4BBC5;font-size:11px;font-weight:700;}
  .tab i{font-size:20px;}
  .tab.on{color:#FF5C3D;}
</style>
</head>
<body>
  <div class="island"></div>
  <div class="status"><span>7:02</span><span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></span></div>

  <div class="content">
    <h1>Streak</h1>

    <div class="big">
      <div class="n">19</div>
      <div class="l">Days without a snooze</div>
      <div class="r"><span>Best 24</span><span>Avg wake 6:43</span></div>
    </div>

    <div class="lbl">Minutes to awake</div>
    <div class="chart">
      <div class="col"><div class="bar" style="height:58%"></div><div class="day">M</div></div>
      <div class="col"><div class="bar" style="height:42%"></div><div class="day">T</div></div>
      <div class="col"><div class="bar" style="height:76%"></div><div class="day">W</div></div>
      <div class="col"><div class="bar on" style="height:30%"></div><div class="day">T</div></div>
      <div class="col"><div class="bar" style="height:50%"></div><div class="day">F</div></div>
      <div class="col"><div class="bar" style="height:88%"></div><div class="day">S</div></div>
      <div class="col"><div class="bar" style="height:66%"></div><div class="day">S</div></div>
    </div>

    <div class="list">
      <div class="row"><div class="dot"></div><div class="nm">Kettle Hunt</div><div class="tm">6:41</div></div>
      <div class="row"><div class="dot"></div><div class="nm">40 Jacks</div><div class="tm">6:44</div></div>
      <div class="row"><div class="dot miss"></div><div class="nm">Shout a Poem</div><div class="tm">6:52</div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-moon"></i>Tonight</div>
    <div class="tab"><i class="fas fa-layer-group"></i>Deck</div>
    <div class="tab on"><i class="fas fa-fire-flame-curved"></i>Streak</div>
  </div>
</body>
</html>
