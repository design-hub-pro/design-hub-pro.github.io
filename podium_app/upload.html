<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Speech - Podium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: {50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'} } } }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .upload-zone { border: 2px dashed #c7d2fe; transition: all 0.2s; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #4f46e5; background: #eef2ff; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
            <div class="p-5 flex items-center gap-2 border-b border-gray-100">
                <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
                    <i class="fas fa-microphone-lines text-white text-sm"></i>
                </div>
                <span class="text-lg font-bold">Podium</span>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-th-large w-5 text-center"></i> Dashboard
                </a>
                <a href="upload.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-brand-50 text-brand-700 font-medium text-sm">
                    <i class="fas fa-cloud-arrow-up w-5 text-center"></i> Upload Speech
                </a>
                <a href="feedback.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-comments w-5 text-center"></i> My Feedback
                </a>
                <a href="debate.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-people-arrows w-5 text-center"></i> Async Debate
                </a>
                <a href="judging.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-scale-balanced w-5 text-center"></i> AI Judging
                </a>
                <a href="resources.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-book-open w-5 text-center"></i> Resources
                </a>
                <a href="community.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                    <i class="fas fa-users w-5 text-center"></i> Community
                </a>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <a href="profile.html" class="flex items-center gap-3 px-3 py-2">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face" class="w-8 h-8 rounded-full object-cover" alt="">
                    <div>
                        <div class="text-sm font-semibold">Sarah Mitchell</div>
                        <div class="text-xs text-gray-400">Student</div>
                    </div>
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto">
            <header class="sticky top-0 z-10 bg-white/80 backdrop-blur-lg border-b border-gray-100 px-8 py-4">
                <h1 class="text-xl font-bold">Upload Speech</h1>
                <p class="text-sm text-gray-500">Upload your recording to get AI and coach feedback</p>
            </header>

            <div class="p-8 max-w-3xl">
                <!-- Upload Zone -->
                <div class="upload-zone rounded-2xl p-12 text-center bg-white mb-8 cursor-pointer" id="dropZone">
                    <div class="w-16 h-16 rounded-2xl bg-brand-100 flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-cloud-arrow-up text-brand-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold mb-2">Drag & drop your audio file here</h3>
                    <p class="text-sm text-gray-400 mb-4">Supports MP3, WAV, M4A, WEBM — Max 50 MB</p>
                    <button class="px-5 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-lg hover:bg-brand-700 transition">
                        <i class="fas fa-folder-open mr-1.5"></i> Browse Files
                    </button>

                    <div class="flex items-center justify-center gap-6 mt-6">
                        <div class="h-px bg-gray-200 flex-1"></div>
                        <span class="text-xs text-gray-400">or record directly</span>
                        <div class="h-px bg-gray-200 flex-1"></div>
                    </div>

                    <button class="mt-4 px-5 py-2.5 border-2 border-red-200 text-red-600 text-sm font-semibold rounded-lg hover:bg-red-50 transition">
                        <i class="fas fa-circle text-red-500 mr-1.5 text-xs animate-pulse"></i> Start Recording
                    </button>
                </div>

                <!-- Speech Details Form -->
                <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">
                    <h3 class="font-semibold text-lg">Speech Details</h3>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Title</label>
                        <input type="text" placeholder="e.g., Resolved: Privacy vs. Security" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Category</label>
                            <select class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                                <option>Lincoln-Douglas</option>
                                <option>Policy Debate</option>
                                <option>Public Forum</option>
                                <option>Oratory</option>
                                <option>Extemporaneous</option>
                                <option>Impromptu</option>
                                <option>Congressional Debate</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Visibility</label>
                            <select class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                                <option>Private — Only coaches see this</option>
                                <option>Community — Open for peer feedback</option>
                                <option>Public — Anyone can view</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Notes for Reviewer (optional)</label>
                        <textarea rows="3" placeholder="What would you like feedback on? Any specific areas to focus on?" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Feedback Options</label>
                        <div class="flex gap-4">
                            <label class="flex-1 p-4 rounded-xl border-2 border-brand-200 bg-brand-50 cursor-pointer relative">
                                <input type="checkbox" checked class="sr-only">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center">
                                        <i class="fas fa-robot text-white text-sm"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold">AI Analysis</div>
                                        <div class="text-xs text-gray-500">Instant automated feedback</div>
                                    </div>
                                </div>
                                <i class="fas fa-check-circle text-brand-600 absolute top-3 right-3"></i>
                            </label>
                            <label class="flex-1 p-4 rounded-xl border-2 border-gray-200 cursor-pointer hover:border-brand-200 transition">
                                <input type="checkbox" class="sr-only">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-lg bg-amber-500 flex items-center justify-center">
                                        <i class="fas fa-chalkboard-user text-white text-sm"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold">Coach Review</div>
                                        <div class="text-xs text-gray-500">Expert feedback (24-48h)</div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-2">
                        <button class="px-5 py-2.5 text-sm font-medium text-gray-600 hover:text-gray-800 transition">Save as Draft</button>
                        <button class="px-6 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-lg hover:bg-brand-700 transition shadow-sm">
                            <i class="fas fa-paper-plane mr-1.5"></i> Submit for Review
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
