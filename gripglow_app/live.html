<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripGlow · Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="absolute inset-0 grad-ink"></div><div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full text-white relative">
  <div class="flex items-center justify-between mt-2">
    <div class="chip bg-white/10"><span class="dot r animate-pulse"></span>Live · 7-iron</div>
    <div class="num text-[15px] font-bold text-white/60">Swing <span class="text-white">4</span>/10</div>
  </div>
  <div class="relative h-[470px] flex items-center justify-center mt-2">
    <div class="absolute w-[330px] h-[330px] rounded-full" style="background:radial-gradient(circle,rgba(34,197,94,.35),rgba(34,197,94,0) 68%)"></div>
    <div class="absolute w-[260px] h-[260px] rounded-full border border-emerald-400/25"></div>
    <div class="relative w-[104px] h-[400px] rounded-[52px] flex flex-col items-center justify-center gap-[18px]" style="background:linear-gradient(180deg,#1B3A28,#0B1A12);box-shadow:0 0 0 2px rgba(74,222,128,.6),0 0 70px rgba(34,197,94,.7),inset 0 0 30px rgba(74,222,128,.35)">
      <span class="text-[10px] font-bold tracking-widest text-emerald-300/70 -mt-2 mb-1">LEAD</span>
      <div class="w-[34px] h-[34px] rounded-full g num flex items-center justify-center text-[12px] font-bold" style="opacity:0.95">1</div><div class="w-[34px] h-[34px] rounded-full g num flex items-center justify-center text-[12px] font-bold" style="opacity:0.8">2</div><div class="w-[34px] h-[34px] rounded-full r num flex items-center justify-center text-[12px] font-bold" style="opacity:0.9">3</div><div class="w-[34px] h-[34px] rounded-full g num flex items-center justify-center text-[12px] font-bold" style="opacity:0.85">4</div><div class="w-[34px] h-[34px] rounded-full g num flex items-center justify-center text-[12px] font-bold" style="opacity:0.7">5</div><div class="w-[34px] h-[34px] rounded-full g num flex items-center justify-center text-[12px] font-bold" style="opacity:0.9">6</div>
      <span class="text-[10px] font-bold tracking-widest text-emerald-300/70 mt-1">TRAIL</span>
    </div>
  </div>
  <div class="text-center -mt-2">
    <div class="text-[34px] font-extrabold text-emerald-400 tracking-tight">Just right</div>
    <div class="num text-[15px] text-white/50 mt-1">Squeeze <b class="text-white text-[20px]">5.1</b> / 10</div>
  </div>
  <div class="card-dark p-4 mt-6">
    <div class="flex items-center justify-between mb-2"><span class="label !text-white/40">This set</span><span class="text-[12px] font-semibold text-white/50"><i class="fa-solid fa-circle text-[6px] text-rose-400 mr-1 align-middle"></i>Pad 3 rising</span></div>
    <div class="swings"><span class="g"></span><span class="r"></span><span class="g"></span><span class="g animate-pulse"></span><span class="bg-white/10"></span><span class="bg-white/10"></span><span class="bg-white/10"></span><span class="bg-white/10"></span><span class="bg-white/10"></span><span class="bg-white/10"></span></div>
  </div>
  <div class="flex items-center justify-center gap-6 mt-6">
    <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-microphone"></i></div>
    <div class="w-[72px] h-[72px] rounded-full bg-white text-[#0F1A14] flex items-center justify-center text-[22px]"><i class="fa-solid fa-pause"></i></div>
    <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-flag-checkered"></i></div>
  </div>
</div><div class="home-ind light"></div>
</div></body></html>
