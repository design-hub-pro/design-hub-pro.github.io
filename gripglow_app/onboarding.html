<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripGlow · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<img src="img/swing.jpg" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,16,11,.25) 0%,rgba(7,16,11,.55) 35%,rgba(7,16,11,.96) 62%,#07100B)"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="absolute left-0 right-0 bottom-0 px-7 pb-12 text-white">
  <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl grad-brand flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-[15px]"></i></div><span class="font-extrabold text-[18px] tracking-tight">GripGlow</span></div>
  <div class="flex items-end gap-4 mt-8">
    <div class="w-[22px] h-[120px] rounded-full g glow-g"></div>
    <div class="w-[22px] h-[88px] rounded-full r opacity-40"></div>
    <div class="w-[22px] h-[64px] rounded-full b opacity-40"></div>
  </div>
  <h1 class="text-[40px] font-extrabold leading-[1.05] tracking-tight mt-7">Feel the<br>right squeeze.</h1>
  <p class="text-[16px] text-white/65 mt-3 leading-relaxed">Your grip glows green when your hands get it right.</p>
  <div class="flex gap-2 mt-6">
    <span class="chip bg-white/10 text-white"><i class="dot g"></i>Just right</span>
    <span class="chip bg-white/10 text-white"><i class="dot r"></i>Too tight</span>
    <span class="chip bg-white/10 text-white"><i class="dot b"></i>Too loose</span>
  </div>
  <div class="btn grad-brand text-white mt-8 shadow-[0_14px_30px_-10px_rgba(34,197,94,.8)]">Pair my grip<i class="fa-solid fa-arrow-right"></i></div>
  <div class="btn bg-white/10 text-white mt-3"><i class="fa-solid fa-clipboard-user"></i>I'm a coach</div>
</div>
<div class="home-ind light"></div>
</div></body></html>
