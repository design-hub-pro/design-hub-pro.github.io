<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripGlow · Drills</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2"><h1 class="text-[28px] font-extrabold tracking-tight">Feel drills</h1><div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-magnifying-glass"></i></div></div>
  <div class="flex gap-2 mt-4"><span class="chip bg-[#0F1A14] text-white">For you</span><span class="chip bg-white card"><i class="dot r"></i>Too tight</span><span class="chip bg-white card"><i class="dot b"></i>Too loose</span></div>
  <div class="mt-4 rounded-[28px] overflow-hidden relative h-[260px]">
    <img src="img/address.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(7,16,11,0) 30%,rgba(7,16,11,.92))"></div>
    <div class="absolute top-4 left-4 chip bg-rose-500 text-white">Fixes red</div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="w-[70px] h-[70px] rounded-full bg-white/25 backdrop-blur flex items-center justify-center text-white text-[24px]"><i class="fa-solid fa-play ml-1"></i></div></div>
    <div class="absolute bottom-5 left-5 right-5 text-white flex items-end justify-between"><div><div class="text-[22px] font-bold">Bird in hand</div><div class="text-[13px] text-white/65 mt-0.5">Hold it like it could fly away</div></div><span class="chip bg-black/45 num">2:40</span></div>
  </div>
  <div class="space-y-3 mt-4">
    <div class="card p-3 flex items-center gap-4"><div class="relative w-[112px] h-[84px] rounded-2xl overflow-hidden shrink-0"><img src="img/irons.jpg" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/25 flex items-center justify-center"><i class="fa-solid fa-play text-white text-[14px]"></i></div><span class="absolute bottom-1.5 right-1.5 text-[10px] num font-bold text-white bg-black/55 px-1.5 rounded">1:55</span></div><div class="flex-1 min-w-0"><div class="font-bold text-[15px] leading-tight">Last three fingers</div><div class="chip bg-blue-50 text-blue-600 !px-2 !py-0.5 !text-[11px] mt-1.5">Fixes blue</div><div class="bar mt-2"><span class="grad-brand" style="width:40%"></span></div></div></div>
    <div class="card p-3 flex items-center gap-4"><div class="relative w-[112px] h-[84px] rounded-2xl overflow-hidden shrink-0"><img src="img/cup.jpg" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/25 flex items-center justify-center"><i class="fa-solid fa-play text-white text-[14px]"></i></div><span class="absolute bottom-1.5 right-1.5 text-[10px] num font-bold text-white bg-black/55 px-1.5 rounded">3:10</span></div><div class="flex-1 min-w-0"><div class="font-bold text-[15px] leading-tight">Soft hands putting</div><div class="chip bg-emerald-50 text-emerald-700 !px-2 !py-0.5 !text-[11px] mt-1.5">Stay green</div><div class="bar mt-2"><span class="grad-brand" style="width:100%"></span></div></div></div>
    <div class="card p-3 flex items-center gap-4"><div class="relative w-[112px] h-[84px] rounded-2xl overflow-hidden shrink-0"><img src="img/sunset.jpg" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/25 flex items-center justify-center"><i class="fa-solid fa-play text-white text-[14px]"></i></div><span class="absolute bottom-1.5 right-1.5 text-[10px] num font-bold text-white bg-black/55 px-1.5 rounded">2:05</span></div><div class="flex-1 min-w-0"><div class="font-bold text-[15px] leading-tight">Squeeze ladder 1 to 10</div><div class="chip bg-amber-50 text-amber-700 !px-2 !py-0.5 !text-[11px] mt-1.5">Find your 5</div><div class="bar mt-2"><span class="grad-brand" style="width:0%"></span></div></div></div>
  </div>
</div>

</div></body></html>
