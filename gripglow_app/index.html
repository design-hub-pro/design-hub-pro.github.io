<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripGlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#0F1A14}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2b302d,#0b0f0d);box-shadow:0 50px 80px -30px rgba(20,50,35,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F6F1}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center bg-gradient-to-br from-emerald-400 to-green-700"><i class="fa-solid fa-golf-ball-tee text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight">GripGlow</h1>
  <p class="mt-3 text-[19px] text-gray-500">A smart training grip and app that show junior golfers how hard to squeeze.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700">Golf</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Coaching</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Sensors</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Mobile</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pair.html" scrolling="no" title="pair"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="calibrate.html" scrolling="no" title="calibrate"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="live.html" scrolling="no" title="live"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="swing.html" scrolling="no" title="swing"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="set.html" scrolling="no" title="set"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pads.html" scrolling="no" title="pads"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="team.html" scrolling="no" title="team"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="player.html" scrolling="no" title="player"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="drills.html" scrolling="no" title="drills"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="progress.html" scrolling="no" title="progress"></iframe></div></div>
</div></main>
</body></html>
