<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripGlow · Pair</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content full">
  <div class="flex items-center justify-between mt-2"><div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div><span class="label">Step 1 of 2</span><div class="w-10"></div></div>
  <h1 class="text-[30px] font-extrabold tracking-tight mt-6">Grip found</h1>
  <p class="text-[15px] text-gray-500 mt-1">Hold the club like you're about to swing.</p>
  <div class="relative h-[330px] mt-6 flex items-center justify-center">
    <div class="absolute w-[300px] h-[300px] rounded-full border border-emerald-200"></div>
    <div class="absolute w-[230px] h-[230px] rounded-full border-2 border-emerald-300/70"></div>
    <div class="absolute w-[160px] h-[160px] rounded-full bg-emerald-100/70"></div>
    <div class="relative w-[96px] h-[290px] rounded-[48px] grad-ink flex flex-col items-center justify-center gap-[14px] glow-g">
      <div class="absolute top-3 w-10 h-1.5 rounded-full bg-emerald-400/70"></div>
      <div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.95)">1</div><div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.8)">2</div><div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.7)">3</div><div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.9)">4</div><div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.85)">5</div><div class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[11px] font-bold text-white num" style="background:rgba(34,197,94,0.75)">6</div>
      <div class="absolute bottom-3 w-10 h-1.5 rounded-full bg-emerald-400/70"></div>
    </div>
  </div>
  <div class="card p-4 flex items-center gap-4 mt-4">
    <img src="img/irons.jpg" class="w-14 h-14 rounded-2xl object-cover">
    <div class="flex-1"><div class="font-bold text-[16px]">GripGlow G-07</div><div class="text-[13px] text-gray-400">Junior 7-iron · firmware 1.4</div></div>
    <div class="text-right"><div class="num font-bold text-[18px]">86%</div><div class="text-[11px] text-emerald-600 font-semibold"><i class="fa-solid fa-bluetooth-b"></i> Linked</div></div>
  </div>
  <div class="flex gap-3 mt-4">
    <div class="flex-1 card p-4"><div class="num text-[28px] font-bold">6<span class="text-[15px] text-gray-400">/6</span></div><div class="text-[12px] text-gray-500 font-medium">Pads reading</div></div>
    <div class="flex-1 card p-4"><div class="num text-[28px] font-bold">40<span class="text-[15px] text-gray-400">Hz</span></div><div class="text-[12px] text-gray-500 font-medium">Sample rate</div></div>
    <div class="flex-1 card p-4"><div class="num text-[28px] font-bold">18<span class="text-[15px] text-gray-400">ms</span></div><div class="text-[12px] text-gray-500 font-medium">Light delay</div></div>
  </div>
  <div class="btn bg-[#0F1A14] text-white mt-6">Fit to my hands<i class="fa-solid fa-arrow-right"></i></div>
</div><div class="home-ind"></div>
</div></body></html>
