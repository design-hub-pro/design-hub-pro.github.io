<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cerebra — Live Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen g-deep" style="overflow-y:auto">
  <div class="status-bar on-dark">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="blob" style="width:240px;height:240px;background:#29D9F2;top:60px;right:-80px;opacity:.4"></div>
  <div class="blob" style="width:220px;height:220px;background:#6E5CF7;top:300px;left:-80px;opacity:.4"></div>

  <div class="content pt-1 relative" style="z-index:5">
    <!-- header -->
    <div class="flex items-center justify-between mb-5 text-white">
      <div>
        <p class="text-[11px] text-white/55 uppercase tracking-widest">Live monitor</p>
        <h1 class="font-display text-[22px] font-bold">Your brain, right now</h1>
      </div>
      <div class="glass-dark rounded-full px-3 py-1.5 flex items-center gap-2">
        <span class="dot dot-live"></span><span class="text-[11px] font-semibold text-white">Recording</span>
      </div>
    </div>

    <!-- Neuro orb + readiness -->
    <div class="relative flex items-center justify-center mb-5" style="height:236px">
      <div class="absolute neuro-ring" style="width:226px;height:226px"></div>
      <div class="absolute neuro-ring" style="width:182px;height:182px;animation-delay:.7s;opacity:.55"></div>
      <div class="neuro-orb flex flex-col items-center justify-center text-white" style="width:158px;height:158px">
        <p class="text-[10px] uppercase tracking-widest text-white/70">Readiness</p>
        <p class="font-display text-[46px] font-bold leading-none">82</p>
        <p class="text-[11px] text-white/75 font-semibold">Calm-alert flow</p>
      </div>
      <!-- channel chips -->
      <div class="absolute glass-dark rounded-xl px-2.5 py-1.5 flex items-center gap-1.5" style="top:30px;left:0"><span class="dot dot-calm"></span><span class="text-white text-[10px] font-semibold">AF7 ✓</span></div>
      <div class="absolute glass-dark rounded-xl px-2.5 py-1.5 flex items-center gap-1.5" style="top:30px;right:0"><span class="dot dot-calm"></span><span class="text-white text-[10px] font-semibold">AF8 ✓</span></div>
      <div class="absolute glass-dark rounded-xl px-2.5 py-1.5 flex items-center gap-1.5" style="bottom:22px;left:6px"><span class="dot dot-calm"></span><span class="text-white text-[10px] font-semibold">TP9 ✓</span></div>
      <div class="absolute glass-dark rounded-xl px-2.5 py-1.5 flex items-center gap-1.5" style="bottom:22px;right:6px"><span class="dot dot-amber"></span><span class="text-white text-[10px] font-semibold">TP10 ~</span></div>
    </div>

    <!-- live EEG strip -->
    <div class="glass-dark rounded-[22px] p-4 mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-white text-[12px] font-semibold flex items-center gap-2"><i class="fa-solid fa-wave-square text-[#29D9F2]"></i>Raw EEG</span>
        <span class="text-white/50 text-[11px] font-mono">256 Hz · 4ch</span>
      </div>
      <svg width="100%" height="56" viewBox="0 0 360 56" preserveAspectRatio="none">
        <polyline class="eeg-line" points="0,28 16,28 24,10 34,46 44,16 54,38 66,28 96,28 106,12 116,42 126,20 136,34 150,28 180,28 190,8 200,44 210,18 220,32 234,28 264,28 274,14 284,40 294,22 304,30 318,28 348,28 360,18" stroke="#29D9F2" stroke-width="2" opacity="0.95"/>
        <polyline class="eeg-line" points="0,42 30,42 45,34 60,48 80,40 110,42 130,36 150,46 180,42 210,38 230,46 260,42 290,38 320,46 360,42" stroke="#6E5CF7" stroke-width="1.6" opacity="0.6"/>
      </svg>
    </div>

    <!-- Brainwave bands -->
    <p class="text-white/55 text-[11px] uppercase tracking-widest mb-3">Brainwave bands</p>
    <div class="space-y-2.5 mb-5">
      <div class="glass-dark rounded-2xl p-3 flex items-center gap-3">
        <div class="eq" style="height:30px"><span style="animation-delay:0s"></span><span style="animation-delay:.1s"></span><span style="animation-delay:.2s"></span></div>
        <div class="flex-1">
          <div class="flex items-center justify-between mb-1"><span class="text-white text-[12px] font-semibold">Beta <span class="text-white/45 font-normal">· focus 13–30 Hz</span></span><span class="text-[#29D9F2] text-[12px] font-bold">High</span></div>
          <div class="bar-dark"><div class="g-focus" style="width:74%"></div></div>
        </div>
      </div>
      <div class="glass-dark rounded-2xl p-3 flex items-center gap-3">
        <div class="eq" style="height:30px"><span style="animation-delay:.15s"></span><span style="animation-delay:.05s"></span><span style="animation-delay:.25s"></span></div>
        <div class="flex-1">
          <div class="flex items-center justify-between mb-1"><span class="text-white text-[12px] font-semibold">Alpha <span class="text-white/45 font-normal">· calm 8–12 Hz</span></span><span class="text-[#2BD9B0] text-[12px] font-bold">Strong</span></div>
          <div class="bar-dark"><div class="g-calm" style="width:66%"></div></div>
        </div>
      </div>
      <div class="glass-dark rounded-2xl p-3 flex items-center gap-3">
        <div class="eq" style="height:30px"><span style="animation-delay:.3s"></span><span style="animation-delay:.12s"></span><span style="animation-delay:.22s"></span></div>
        <div class="flex-1">
          <div class="flex items-center justify-between mb-1"><span class="text-white text-[12px] font-semibold">Theta <span class="text-white/45 font-normal">· drowsy 4–7 Hz</span></span><span class="text-white/70 text-[12px] font-bold">Low</span></div>
          <div class="bar-dark"><div class="g-violet" style="width:28%"></div></div>
        </div>
      </div>
    </div>

    <!-- controls -->
    <div class="flex items-center gap-3 mb-2">
      <a href="checkin.html" class="flex-1 h-[54px] glass-dark rounded-[18px] flex items-center justify-center gap-2 text-white font-semibold text-[14px]"><i class="fa-solid fa-pen-to-square text-[13px]"></i> Tag feeling</a>
      <a href="focus.html" class="flex-1 h-[54px] rounded-[18px] g-violet shadow-glow flex items-center justify-center gap-2 text-white font-bold text-[14px]"><i class="fa-solid fa-bolt"></i> Start session</a>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="tab-item"><i class="fa-regular fa-chart-bar"></i><span>Insights</span></div>
    <div class="tab-fab"><div class="fab"><i class="fa-solid fa-wave-square"></i></div><span>Session</span></div>
    <div class="tab-item"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Predict</span></div>
    <div class="tab-item"><i class="fa-regular fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
