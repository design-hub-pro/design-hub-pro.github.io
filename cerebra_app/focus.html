<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cerebra — Focus Session</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen g-deep">
  <div class="status-bar on-dark">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="blob" style="width:280px;height:280px;background:#FF7B54;top:120px;left:50%;transform:translateX(-50%);opacity:.28"></div>

  <div class="content pt-1 relative" style="z-index:5">
    <!-- header -->
    <div class="flex items-center justify-between mb-3 text-white">
      <a href="home.html" class="w-10 h-10 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-down text-[14px]"></i></a>
      <div class="text-center">
        <p class="text-[11px] text-white/55 uppercase tracking-widest">Deep Work</p>
        <p class="font-display text-[14px] font-bold">Focus Session</p>
      </div>
      <div class="w-10 h-10 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-ellipsis text-[14px]"></i></div>
    </div>

    <!-- focus ring + timer -->
    <div class="relative flex items-center justify-center my-3" style="height:300px">
      <svg width="300" height="300" class="gauge absolute">
        <circle cx="150" cy="150" r="132" class="track-dark" stroke-width="14" fill="none"/>
        <circle cx="150" cy="150" r="132" stroke="url(#fg)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="829" stroke-dashoffset="290"/>
        <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9D6B"/><stop offset="0.6" stop-color="#FF7B54"/><stop offset="1" stop-color="#6E5CF7"/></linearGradient></defs>
      </svg>
      <div class="absolute neuro-ring" style="width:200px;height:200px;border-color:rgba(255,123,84,0.35)"></div>
      <div class="flex flex-col items-center text-white">
        <span class="pill mb-2" style="background:rgba(255,123,84,0.22)"><span class="dot dot-focus"></span> In the zone</span>
        <p class="font-display text-[64px] font-bold leading-none">14:22</p>
        <p class="text-white/55 text-[12px] mt-1">of 25:00 remaining</p>
      </div>
    </div>

    <!-- live focus score -->
    <div class="glass-dark rounded-[22px] p-4 mb-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-white text-[12px] font-semibold">Live focus score</span>
        <span class="font-display text-[#FF9D6B] text-[22px] font-bold">86<span class="text-white/40 text-[12px] font-normal">/100</span></span>
      </div>
      <svg width="100%" height="40" viewBox="0 0 360 40" preserveAspectRatio="none">
        <polyline class="eeg-line" points="0,30 30,28 60,24 90,26 120,18 150,20 180,14 210,16 240,10 270,12 300,8 330,11 360,7" stroke="#FF9D6B" stroke-width="2.5"/>
        <polyline class="eeg-line" points="0,30 30,28 60,24 90,26 120,18 150,20 180,14 210,16 240,10 270,12 300,8 330,11 360,7" stroke="#FF9D6B" stroke-width="8" opacity="0.12"/>
      </svg>
      <p class="text-white/55 text-[11px] mt-1"><i class="fa-solid fa-arrow-trend-up text-[#2BD9B0] mr-1"></i>Beta climbing — you've held focus 6 min straight</p>
    </div>

    <!-- ambient + nudge -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="glass-dark rounded-2xl p-3.5 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl g-violet flex items-center justify-center text-white"><i class="fa-solid fa-music text-[14px]"></i></div>
        <div><p class="text-white font-semibold text-[12px]">Focus 40Hz</p><p class="text-white/50 text-[10px]">Binaural · soft</p></div>
      </div>
      <div class="glass-dark rounded-2xl p-3.5 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl g-calm flex items-center justify-center text-white"><i class="fa-solid fa-shield-halved text-[14px]"></i></div>
        <div><p class="text-white font-semibold text-[12px]">Distraction</p><p class="text-white/50 text-[10px]">Auto-nudge on</p></div>
      </div>
    </div>

    <!-- controls -->
    <div class="flex items-center justify-center gap-5">
      <button class="w-14 h-14 glass-dark rounded-full flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-backward"></i></button>
      <button class="w-[78px] h-[78px] rounded-full g-focus shadow-cyan flex items-center justify-center text-white text-[26px]" style="box-shadow:0 16px 40px -10px rgba(255,123,84,0.6)"><i class="fa-solid fa-pause"></i></button>
      <a href="insights.html" class="w-14 h-14 glass-dark rounded-full flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-flag-checkered"></i></a>
    </div>
  </div>
</div>
</body>
</html>
