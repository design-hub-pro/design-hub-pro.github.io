<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cerebra — Relax</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen" style="background:#0C1024">
  <!-- bg image -->
  <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=900&q=80" class="absolute inset-0 w-full h-full object-cover" style="opacity:0.55" />
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(12,16,36,0.55) 0%,rgba(12,16,36,0.35) 40%,rgba(12,16,36,0.92) 100%)"></div>

  <div class="status-bar on-dark relative" style="z-index:5">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="content pt-1 relative" style="z-index:5">
    <!-- header -->
    <div class="flex items-center justify-between mb-2 text-white">
      <a href="home.html" class="w-10 h-10 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-down text-[14px]"></i></a>
      <div class="text-center">
        <p class="text-[11px] text-white/55 uppercase tracking-widest">Downshift</p>
        <p class="font-display text-[14px] font-bold">Relax Session</p>
      </div>
      <div class="w-10 h-10 glass-dark rounded-full flex items-center justify-center"><i class="fa-solid fa-volume-high text-[13px]"></i></div>
    </div>

    <!-- breathing orb -->
    <div class="relative flex flex-col items-center justify-center" style="height:320px">
      <div class="absolute neuro-ring" style="width:250px;height:250px;border-color:rgba(43,217,176,0.3)"></div>
      <div class="breath-orb flex items-center justify-center" style="width:172px;height:172px">
        <div class="text-center text-white">
          <p class="font-display text-[26px] font-bold leading-none">Breathe out</p>
          <p class="text-white/80 text-[13px] mt-1">slowly · 7s</p>
        </div>
      </div>
      <p class="text-white/70 text-[12px] mt-6 tracking-wide">Let your shoulders drop</p>
    </div>

    <!-- calm progress -->
    <div class="glass-dark rounded-[22px] p-4 mb-4 mt-2">
      <div class="flex items-center justify-between mb-3">
        <span class="text-white text-[12px] font-semibold flex items-center gap-2"><span class="dot dot-calm"></span>Calm climbing</span>
        <span class="text-white/55 text-[11px]">Target: Alpha ↑</span>
      </div>
      <div class="grid grid-cols-3 gap-3 text-center">
        <div>
          <p class="font-display text-[26px] font-bold text-[#5BEAC9] leading-none">+41<span class="text-[12px]">%</span></p>
          <p class="text-white/50 text-[10px] mt-1 uppercase tracking-wide">Calm</p>
        </div>
        <div>
          <p class="font-display text-[26px] font-bold text-white leading-none">58<span class="text-[12px] text-white/50">bpm</span></p>
          <p class="text-white/50 text-[10px] mt-1 uppercase tracking-wide">Heart</p>
        </div>
        <div>
          <p class="font-display text-[26px] font-bold text-[#7DE9FF] leading-none">-33<span class="text-[12px]">%</span></p>
          <p class="text-white/50 text-[10px] mt-1 uppercase tracking-wide">Stress</p>
        </div>
      </div>
      <div class="bar-dark mt-4"><div class="g-calm" style="width:62%"></div></div>
      <p class="text-white/45 text-[11px] mt-2">6:12 elapsed · 3:48 left</p>
    </div>

    <!-- controls -->
    <div class="flex items-center justify-center gap-5">
      <button class="w-14 h-14 glass-dark rounded-full flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-wind"></i></button>
      <button class="w-[78px] h-[78px] rounded-full g-calm flex items-center justify-center text-white text-[26px]" style="box-shadow:0 16px 40px -10px rgba(43,217,176,0.6)"><i class="fa-solid fa-pause"></i></button>
      <a href="insights.html" class="w-14 h-14 glass-dark rounded-full flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-flag-checkered"></i></a>
    </div>
  </div>
</div>
</body>
</html>
