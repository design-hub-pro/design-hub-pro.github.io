<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Route</title>
</head>
<body>
<div class="screen" style="background:#DCE3D3">
  <!-- Stylised topo map -->
  <svg viewBox="0 0 436 956" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full">
    <rect width="436" height="956" fill="#E3E8D9"/>
    <g fill="none" stroke="#C6D0B6" stroke-width="1.4">
      <path d="M-20 120 C80 90 160 160 260 120 S420 60 470 100"/>
      <path d="M-20 200 C90 170 170 240 270 200 S420 140 470 180"/>
      <path d="M-20 290 C70 250 180 330 280 290 S410 220 470 260"/>
      <path d="M60 420 C120 360 240 360 300 420 S280 540 200 540 S40 500 60 420Z"/>
      <path d="M100 430 C140 395 230 395 265 432 S250 505 195 505 S85 480 100 430Z"/>
      <path d="M140 440 C165 420 215 420 232 442 S220 478 192 478 S128 465 140 440Z"/>
      <path d="M-20 640 C90 600 190 690 300 640 S430 580 470 620"/>
      <path d="M-20 730 C80 700 200 770 300 730 S420 680 470 710"/>
      <path d="M-20 820 C100 790 200 860 300 820 S420 780 470 800"/>
    </g>
    <path d="M330 -10 C300 120 380 220 340 340 S380 520 420 600 L470 600 L470 -10Z" fill="#CFE0E6"/>
    <g fill="#B9CCA4" opacity=".7"><circle cx="60" cy="600" r="70"/><circle cx="120" cy="700" r="60"/><circle cx="380" cy="760" r="80"/></g>
    <!-- planned -->
    <path d="M196 450 C230 380 300 360 320 290 S280 180 250 120" fill="none" stroke="#14201B" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/>
    <!-- walked -->
    <path d="M70 860 C110 800 90 740 150 700 S120 600 180 560 S180 480 196 450" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <path d="M70 860 C110 800 90 740 150 700 S120 600 180 560 S180 480 196 450" fill="none" stroke="#1F6B4F" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 700 S120 600 160 600" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="70" cy="860" r="9" fill="#fff" stroke="#1F6B4F" stroke-width="4"/>
    <circle cx="196" cy="450" r="34" fill="#2E9A6E" opacity=".18"/>
    <circle cx="196" cy="450" r="12" fill="#2E9A6E" stroke="#fff" stroke-width="4"/>
    <g transform="translate(250 120)"><circle r="14" fill="#14201B"/><path d="M-5 4 L0 -6 L5 4Z" fill="#fff"/></g>
  </svg>

  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

  <div class="px relative z-10 mt-2 flex gap-2">
    <div class="flex-1 h-12 rounded-2xl bg-white shadow flex items-center gap-3 px-4"><i class="fas fa-magnifying-glass muted"></i><span class="muted font-medium">Ridge Loop Trail</span></div>
    <div class="w-12 h-12 rounded-2xl bg-white shadow flex items-center justify-center"><i class="fas fa-layer-group"></i></div>
  </div>
  <div class="absolute right-7 top-[150px] z-10 flex flex-col gap-2">
    <div class="w-12 h-12 rounded-2xl bg-white shadow flex items-center justify-center"><i class="fas fa-location-crosshairs text-emerald-700"></i></div>
    <div class="w-12 h-12 rounded-2xl bg-white shadow flex items-center justify-center"><i class="fas fa-share-nodes"></i></div>
  </div>
  <div class="absolute z-10 chip shadow" style="left:120px;top:590px;background:#FFF4E2;color:#A86A12"><i class="fas fa-weight-hanging"></i>Load 19.6%</div>
  <div class="absolute z-10 chip shadow" style="left:200px;top:96px"><i class="fas fa-flag"></i>Summit 2.4 km</div>

  <!-- bottom sheet -->
  <div class="absolute left-0 right-0 bottom-[96px] z-20 bg-white rounded-t-[32px] shadow-2xl pt-3 pb-5 px">
    <div class="w-10 h-1.5 rounded-full bg-gray-200 mx-auto"></div>
    <div class="flex items-center justify-between mt-4">
      <div><div class="h2">Recording</div><div class="text-xs muted font-semibold flex items-center gap-1.5"><span class="dot r animate-pulse"></span>Fix every 10 s · shared with 2</div></div>
      <div class="flex -space-x-2">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" class="w-8 h-8 rounded-full border-2 border-white object-cover">
        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop" class="w-8 h-8 rounded-full border-2 border-white object-cover">
      </div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-4">
      <div><div class="text-[28px] font-extrabold tracking-tight">8.6</div><div class="text-[11px] muted font-semibold">km</div></div>
      <div><div class="text-[28px] font-extrabold tracking-tight">3:12</div><div class="text-[11px] muted font-semibold">moving</div></div>
      <div><div class="text-[28px] font-extrabold tracking-tight">+540</div><div class="text-[11px] muted font-semibold">m climb</div></div>
    </div>
    <div class="flex gap-3 mt-4">
      <div class="btn ghost flex-1"><i class="fas fa-pause"></i>Pause</div>
      <div class="btn pri flex-1"><i class="fas fa-location-pin"></i>Drop pin</div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-gauge-high"></i>Live</div><div class="tab on"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
