<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Load</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

    <div class="px flex items-center justify-between mt-2">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-chevron-left"></i></div>
      <span class="font-bold">Pack load</span>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-sliders"></i></div>
    </div>

    <div class="px mt-6 text-center">
      <div class="lbl">Right now</div>
      <div class="mt-2" style="font-size:76px;font-weight:800;letter-spacing:-3px;line-height:1">11.4<span class="text-2xl muted font-bold tracking-normal"> kg</span></div>
      <span class="chip mt-3" style="background:#FFF4E2;color:#A86A12"><span class="dot a"></span>1.0 kg under your limit</span>
    </div>

    <!-- body % scale -->
    <div class="px mt-7">
      <div class="card p-5">
        <div class="flex justify-between text-xs font-semibold muted"><span>0%</span><span>10%</span><span>20%</span><span>30%</span></div>
        <div class="relative mt-2 h-4 rounded-full" style="background:linear-gradient(90deg,#2E9A6E 0%,#2E9A6E 45%,#E8A33D 62%,#E0533D 75%)">
          <div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-4 shadow" style="left:calc(60% - 12px);border-color:#14201B"></div>
          <div class="absolute -top-1 -bottom-1 w-0.5 bg-[#14201B]" style="left:66.6%"></div>
        </div>
        <div class="flex justify-between mt-3 text-sm"><span class="font-bold">18% of 62 kg</span><span class="muted font-semibold">Limit 20%</span></div>
      </div>
    </div>

    <!-- 6h chart -->
    <div class="px mt-4">
      <div class="card p-5">
        <div class="flex items-center justify-between"><div class="h2">Today</div><div class="flex gap-1 text-xs font-semibold"><span class="px-3 py-1.5 rounded-full bg-[#14201B] text-white">6h</span><span class="px-3 py-1.5 rounded-full muted">Trip</span></div></div>
        <svg viewBox="0 0 360 150" class="w-full mt-4">
          <line x1="0" y1="34" x2="360" y2="34" stroke="#E0533D" stroke-width="1.5" stroke-dasharray="5 5"/>
          <text x="356" y="28" text-anchor="end" font-size="10" fill="#E0533D" font-weight="700">12.4 kg</text>
          <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E9A6E" stop-opacity=".3"/><stop offset="1" stop-color="#2E9A6E" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 40 L50 42 L90 45 L120 52 L150 30 L170 38 L210 58 L250 62 L290 50 L330 52 L360 50 L360 150 L0 150 Z" fill="url(#fl)"/>
          <path d="M0 40 L50 42 L90 45 L120 52 L150 30 L170 38 L210 58 L250 62 L290 50 L330 52 L360 50" fill="none" stroke="#1F6B4F" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="150" cy="30" r="6" fill="#E8A33D" stroke="#fff" stroke-width="2"/>
        </svg>
        <div class="flex justify-between text-[11px] muted font-semibold"><span>7am</span><span>9am</span><span>11am</span><span>1pm</span></div>
      </div>
    </div>

    <!-- stats -->
    <div class="px mt-4 grid grid-cols-3 gap-3">
      <div class="card p-4"><div class="text-[26px] font-extrabold tracking-tight">12.1</div><div class="text-[11px] muted font-semibold">Peak kg</div></div>
      <div class="card p-4"><div class="text-[26px] font-extrabold tracking-tight">48<span class="text-sm">/52</span></div><div class="text-[11px] muted font-semibold">L / R</div></div>
      <div class="card p-4"><div class="text-[26px] font-extrabold tracking-tight">1</div><div class="text-[11px] muted font-semibold">Alerts</div></div>
    </div>

    <div class="px mt-4">
      <div class="card p-4 flex items-center gap-3">
        <div class="ico" style="background:linear-gradient(135deg,#6C7CF0,#4A58C8)"><i class="fas fa-scale-unbalanced"></i></div>
        <div class="flex-1"><div class="font-bold text-[15px]">Re-zero scale</div><div class="text-xs muted">Last zeroed 2 days ago</div></div>
        <i class="fas fa-chevron-right muted"></i>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab on"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
