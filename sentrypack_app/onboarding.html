<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Welcome</title>
</head>
<body>
<div class="screen" style="background:#0E1A15">
  <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?w=900&h=1400&fit=crop" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(8,16,12,.35) 0%,rgba(8,16,12,0) 30%,rgba(8,16,12,.6) 55%,#0B1611 78%)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

  <div class="px relative z-10 mt-3 flex items-center gap-2 text-white">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#1F6B4F,#2E9A6E)"><i class="fas fa-shield-halved text-sm"></i></div>
    <span class="font-extrabold text-lg tracking-tight">SentryPack</span>
  </div>

  <!-- pod on strap callout -->
  <div class="absolute z-10" style="left:248px;top:300px">
    <div class="relative">
      <span class="absolute -inset-3 rounded-full border-2 border-white/40 animate-ping"></span>
      <span class="block w-5 h-5 rounded-full bg-white border-4" style="border-color:#2E9A6E"></span>
    </div>
  </div>
  <div class="absolute z-10 px-3 py-2 rounded-2xl bg-white/15 backdrop-blur text-white text-xs font-semibold" style="left:120px;top:250px">Pod clips to any strap</div>

  <div class="absolute left-0 right-0 bottom-0 z-10 px pb-12 text-white">
    <div class="flex gap-3 mb-6">
      <div class="flex-1 rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-weight-hanging text-amber-300"></i><div class="text-[11px] font-semibold mt-1 opacity-80">Load</div></div>
      <div class="flex-1 rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-wind text-teal-300"></i><div class="text-[11px] font-semibold mt-1 opacity-80">Air</div></div>
      <div class="flex-1 rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-location-dot text-emerald-300"></i><div class="text-[11px] font-semibold mt-1 opacity-80">GPS</div></div>
      <div class="flex-1 rounded-2xl bg-white/10 backdrop-blur p-3 text-center"><i class="fas fa-battery-full text-lime-300"></i><div class="text-[11px] font-semibold mt-1 opacity-80">4 days</div></div>
    </div>
    <div style="font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.05">Know your pack.<br>Read the air.</div>
    <p class="mt-3 text-[15px] opacity-75">Alerts in seconds when weight or air crosses your limit.</p>
    <div class="btn grn mt-7"><i class="fab fa-bluetooth-b"></i>Pair my pod</div>
    <div class="text-center text-sm font-semibold mt-4 opacity-70">I already have an account</div>
    <div class="flex justify-center gap-1.5 mt-5"><span class="w-6 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span></div>
  </div>
  <div class="homebar light"></div>
</div>
</body>
</html>
