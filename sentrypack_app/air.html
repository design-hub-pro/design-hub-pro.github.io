<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Air quality</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="relative h-[400px] overflow-hidden">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&h=800&fit=crop" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(10,30,30,.35),rgba(10,30,30,.1) 40%,#F4F2EC 100%)"></div>
      <div class="relative"><div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
</div>
      <div class="px relative flex items-center justify-between mt-2 text-white">
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-chevron-left"></i></div>
        <span class="font-bold">Air quality</span>
        <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fas fa-bell"></i></div>
      </div>
      <div class="absolute left-0 right-0 bottom-6 px">
        <div class="card p-6 flex items-center gap-5">
          <div class="relative w-[110px] h-[110px] flex-shrink-0">
            <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90"><circle cx="60" cy="60" r="50" fill="none" stroke="#E5F4EF" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="#2E9A6E" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="248"/></svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center"><div style="font-size:36px;font-weight:800;letter-spacing:-1px">42</div><div class="text-[10px] font-bold muted -mt-1">US AQI</div></div>
          </div>
          <div>
            <div class="text-2xl font-extrabold text-emerald-700">Good</div>
            <div class="text-sm muted mt-1">Alert at AQI 101</div>
            <div class="flex items-center gap-2 mt-3 text-xs font-semibold"><i class="fas fa-arrow-trend-up text-amber-600"></i>+8 since 9am</div>
          </div>
        </div>
      </div>
    </div>

    <!-- pollutant tiles -->
    <div class="px mt-2 grid grid-cols-2 gap-3">
      <div class="card p-4">
        <div class="flex items-center gap-2"><span class="dot g"></span><span class="lbl">PM2.5</span></div>
        <div class="big mt-3">9.8</div><div class="text-xs muted font-semibold mt-1">µg/m³</div>
        <div class="bar mt-3"><div class="g" style="width:28%"></div></div>
      </div>
      <div class="card p-4">
        <div class="flex items-center gap-2"><span class="dot g"></span><span class="lbl">PM10</span></div>
        <div class="big mt-3">18</div><div class="text-xs muted font-semibold mt-1">µg/m³</div>
        <div class="bar mt-3"><div class="g" style="width:20%"></div></div>
      </div>
      <div class="card p-4">
        <div class="flex items-center gap-2"><span class="dot a"></span><span class="lbl">VOC index</span></div>
        <div class="big mt-3">164</div><div class="text-xs muted font-semibold mt-1">rising</div>
        <div class="bar mt-3"><div class="a" style="width:55%"></div></div>
      </div>
      <div class="card p-4">
        <div class="flex items-center gap-2"><span class="dot g"></span><span class="lbl">Humidity</span></div>
        <div class="big mt-3">46<span class="text-lg">%</span></div><div class="text-xs muted font-semibold mt-1">14 °C</div>
        <div class="bar mt-3"><div style="width:46%;background:#3DB6A0"></div></div>
      </div>
    </div>

    <!-- AQI along route -->
    <div class="px mt-4">
      <div class="card p-5">
        <div class="h2">Along your route</div>
        <div class="flex items-end gap-1.5 h-[90px] mt-4">
          <div class="flex-1 rounded-md g" style="height:30%"></div><div class="flex-1 rounded-md g" style="height:34%"></div><div class="flex-1 rounded-md g" style="height:28%"></div><div class="flex-1 rounded-md g" style="height:40%"></div><div class="flex-1 rounded-md a" style="height:62%"></div><div class="flex-1 rounded-md a" style="height:70%"></div><div class="flex-1 rounded-md g" style="height:44%"></div><div class="flex-1 rounded-md g" style="height:38%"></div><div class="flex-1 rounded-md g" style="height:42%"></div><div class="flex-1 rounded-md g" style="height:46%"></div>
        </div>
        <div class="flex justify-between text-[11px] muted font-semibold mt-2"><span>Trailhead</span><span>Road crossing</span><span>Now</span></div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab on"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
