<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Trips</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

    <div class="px flex items-center justify-between mt-2">
      <div class="h1">Trips</div>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-calendar"></i></div>
    </div>

    <!-- month stats -->
    <div class="px mt-4 grid grid-cols-3 gap-3">
      <div class="card p-4"><div class="text-[30px] font-extrabold tracking-tight">64</div><div class="text-[11px] muted font-semibold">km in Nov</div></div>
      <div class="card p-4"><div class="text-[30px] font-extrabold tracking-tight">9.8</div><div class="text-[11px] muted font-semibold">avg kg</div></div>
      <div class="card p-4"><div class="text-[30px] font-extrabold tracking-tight">3</div><div class="text-[11px] muted font-semibold">alerts</div></div>
    </div>

    <!-- featured trip -->
    <div class="px mt-5">
      <div class="relative rounded-[28px] overflow-hidden h-[250px]">
        <img src="https://images.unsplash.com/photo-1501555088652-021faa106b9b?w=900&h=600&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(8,16,12,.85))"></div>
        <span class="absolute left-4 top-4 chip"><span class="dot r animate-pulse"></span>Live · Day 2 of 3</span>
        <div class="absolute left-5 right-5 bottom-5 text-white">
          <div class="text-2xl font-extrabold tracking-tight">Ridge Loop</div>
          <div class="flex gap-4 text-sm font-semibold opacity-85 mt-1"><span><i class="fas fa-route mr-1"></i>21.3 km</span><span><i class="fas fa-weight-hanging mr-1"></i>11.4 kg</span><span><i class="fas fa-wind mr-1"></i>AQI 42</span></div>
          <div class="bar mt-3" style="background:rgba(255,255,255,.25)"><div style="width:58%;background:#fff"></div></div>
        </div>
      </div>
    </div>

    <div class="px mt-6 flex items-center justify-between"><div class="h2">Past trips</div><span class="text-sm font-semibold text-emerald-700">See all</span></div>
    <div class="px mt-3 space-y-3">
      <div class="card p-3 flex items-center gap-3">
        <img src="https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=200&h=200&fit=crop" class="w-[68px] h-[68px] rounded-2xl object-cover">
        <div class="flex-1"><div class="font-bold">Granite Lakes</div><div class="text-xs muted font-semibold">Nov 1 · 14.2 km · 9.1 kg</div>
          <div class="flex gap-1.5 mt-2"><span class="dot g"></span><span class="dot g"></span><span class="dot g"></span></div></div>
        <i class="fas fa-chevron-right muted"></i>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=200&h=200&fit=crop" class="w-[68px] h-[68px] rounded-2xl object-cover">
        <div class="flex-1"><div class="font-bold">Fern Creek Trail</div><div class="text-xs muted font-semibold">Oct 26 · 9.7 km · 7.4 kg</div>
          <div class="flex gap-1.5 mt-2"><span class="dot g"></span><span class="dot a"></span><span class="dot g"></span></div></div>
        <i class="fas fa-chevron-right muted"></i>
      </div>
      <div class="card p-3 flex items-center gap-3">
        <img src="https://images.unsplash.com/photo-1522163182402-834f871fd851?w=200&h=200&fit=crop" class="w-[68px] h-[68px] rounded-2xl object-cover">
        <div class="flex-1"><div class="font-bold">Summit Push</div><div class="text-xs muted font-semibold">Oct 19 · 18.5 km · 13.0 kg</div>
          <div class="flex gap-1.5 mt-2"><span class="dot r"></span><span class="dot g"></span><span class="dot a"></span></div></div>
        <i class="fas fa-chevron-right muted"></i>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab on"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
