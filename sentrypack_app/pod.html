<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Pod</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

    <div class="px flex items-center justify-between mt-2">
      <div><div class="h1">My pod</div><div class="text-sm muted font-semibold">SP-4F21 · firmware 1.3.0</div></div>
      <span class="chip shadow-sm"><span class="dot g"></span>Linked</span>
    </div>

    <!-- device hero -->
    <div class="px mt-5">
      <div class="rounded-[30px] p-6 relative overflow-hidden" style="background:linear-gradient(150deg,#1F6B4F,#123F30)">
        <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full" style="background:rgba(255,255,255,.06)"></div>
        <div class="flex items-center gap-6 relative">
          <div class="w-[92px] h-[124px] rounded-[28px] flex flex-col items-center justify-center shadow-xl" style="background:linear-gradient(160deg,#F7F6F1,#D9D6CC)">
            <div class="w-[64px] h-[44px] rounded-xl flex items-center justify-center" style="background:#14201B"><span class="text-emerald-400 font-extrabold">11.4</span></div>
            <div class="flex gap-1 mt-3"><span class="dot g"></span><span class="dot g"></span><span class="dot g"></span></div>
          </div>
          <div class="text-white">
            <div class="text-sm font-semibold opacity-70">Battery</div>
            <div style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1">78%</div>
            <div class="text-sm font-semibold opacity-80 mt-1">About 3 days 2 h left</div>
          </div>
        </div>
        <div class="flex gap-1 mt-6 relative">
          <div class="flex-1 h-2 rounded-full bg-white"></div><div class="flex-1 h-2 rounded-full bg-white"></div><div class="flex-1 h-2 rounded-full bg-white"></div><div class="flex-1 h-2 rounded-full" style="background:linear-gradient(90deg,#fff 10%,rgba(255,255,255,.25) 10%)"></div>
        </div>
        <div class="flex justify-between text-[11px] text-white/60 font-semibold mt-2 relative"><span>Day 1</span><span>Day 2</span><span>Day 3</span><span>Day 4</span></div>
      </div>
    </div>

    <!-- sensors -->
    <div class="px mt-5 flex items-center justify-between"><div class="h2">Sensors</div><span class="text-xs muted font-semibold">self-test 2 min ago</span></div>
    <div class="px mt-3 grid grid-cols-2 gap-3">
      <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#F0B654,#E08A2E)"><i class="fas fa-weight-hanging"></i></div><div><div class="font-bold text-sm">Load cell</div><div class="flex items-center gap-1.5 text-xs muted"><span class="dot g"></span>OK</div></div></div>
      <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#3DB6A0,#1F7F9A)"><i class="fas fa-wind"></i></div><div><div class="font-bold text-sm">Air</div><div class="flex items-center gap-1.5 text-xs muted"><span class="dot g"></span>OK</div></div></div>
      <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#2E9A6E,#1F6B4F)"><i class="fas fa-satellite"></i></div><div><div class="font-bold text-sm">GPS</div><div class="flex items-center gap-1.5 text-xs muted"><span class="dot g"></span>9 sats</div></div></div>
      <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#6C7CF0,#4A58C8)"><i class="fab fa-bluetooth-b"></i></div><div><div class="font-bold text-sm">Link</div><div class="flex items-center gap-1.5 text-xs muted"><span class="dot a"></span>-78 dBm</div></div></div>
    </div>

    <!-- mount -->
    <div class="px mt-5">
      <div class="card p-4">
        <div class="flex items-center gap-3">
          <div class="ico" style="background:linear-gradient(135deg,#475569,#1E293B)"><i class="fas fa-link"></i></div>
          <div class="flex-1"><div class="font-bold text-[15px]">Strap mount</div><div class="text-xs muted">Left strap · locked</div></div>
          <div class="w-[52px] h-[30px] rounded-full p-0.5 flex justify-end" style="background:#2E9A6E"><div class="w-[26px] h-[26px] rounded-full bg-white shadow"></div></div>
        </div>
        <div class="btn ghost mt-4"><i class="fas fa-eject"></i>Detach pod safely</div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab on"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
