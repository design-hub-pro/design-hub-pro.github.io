<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Live</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

    <div class="px flex items-center justify-between mt-2">
      <div>
        <div class="lbl">Ridge Loop · Day 2</div>
        <div class="h1 mt-1">Good to go</div>
      </div>
      <div class="relative">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow">
        <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full g border-2 border-white"></span>
      </div>
    </div>

    <!-- Pod link chip -->
    <div class="px mt-4 flex gap-2">
      <span class="chip"><span class="dot g"></span>Pod linked</span>
      <span class="chip"><i class="fas fa-battery-three-quarters text-emerald-700"></i>78% · 3d 2h</span>
      <span class="chip"><i class="fas fa-satellite text-emerald-700"></i>GPS 9</span>
    </div>

    <!-- Hero load gauge -->
    <div class="px mt-5">
      <div class="card p-6 relative overflow-hidden">
        <div class="flex items-center justify-between">
          <div class="lbl">Pack load</div>
          <span class="chip" style="background:#FFF4E2;color:#A86A12"><span class="dot a"></span>Near limit</span>
        </div>
        <div class="flex items-center gap-5 mt-4">
          <div class="relative w-[150px] h-[150px] flex-shrink-0">
            <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
              <circle cx="60" cy="60" r="50" fill="none" stroke="#ECEAE3" stroke-width="12"/>
              <circle cx="60" cy="60" r="50" fill="none" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="28"/>
              <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2E9A6E"/><stop offset=".7" stop-color="#E8A33D"/><stop offset="1" stop-color="#E0533D"/></linearGradient></defs>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <div style="font-size:38px;font-weight:800;letter-spacing:-1.5px">11.4</div>
              <div class="text-sm font-semibold muted -mt-1">kg</div>
            </div>
          </div>
          <div class="flex-1 space-y-4">
            <div>
              <div class="text-[28px] font-extrabold tracking-tight">18%</div>
              <div class="text-xs muted font-medium">of body weight · limit 20%</div>
            </div>
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1.5"><span>L 48</span><span class="muted">balance</span><span>R 52</span></div>
              <div class="flex gap-1"><div class="bar flex-1"><div class="g ml-auto" style="width:48%"></div></div><div class="bar flex-1"><div class="g" style="width:52%"></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Air + route tiles -->
    <div class="px mt-4 grid grid-cols-2 gap-4">
      <div class="card p-5">
        <div class="flex items-center justify-between"><div class="ico" style="background:linear-gradient(135deg,#3DB6A0,#1F7F9A)"><i class="fas fa-wind"></i></div><span class="dot g"></span></div>
        <div class="big mt-4">42</div>
        <div class="text-xs muted font-semibold mt-1">AQI · Good</div>
        <svg viewBox="0 0 120 30" class="w-full mt-3 h-7"><path d="M0 22 L15 20 L30 21 L45 16 L60 18 L75 12 L90 14 L105 10 L120 12" fill="none" stroke="#3DB6A0" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between"><div class="ico" style="background:linear-gradient(135deg,#E8A33D,#D2632E)"><i class="fas fa-route"></i></div><span class="dot g"></span></div>
        <div class="big mt-4">8.6<span class="text-base font-bold muted"> km</span></div>
        <div class="text-xs muted font-semibold mt-1">+540 m · 3h 12m</div>
        <div class="bar mt-4"><div style="width:62%;background:linear-gradient(90deg,#E8A33D,#D2632E)"></div></div>
      </div>
    </div>

    <!-- Map preview -->
    <div class="px mt-4">
      <div class="relative rounded-3xl overflow-hidden h-[168px]">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900&h=400&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(10,20,16,.75))"></div>
        <svg viewBox="0 0 400 168" class="absolute inset-0 w-full h-full"><path d="M30 140 C80 120 90 90 140 92 S210 60 250 70 S320 40 350 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/><circle cx="250" cy="70" r="8" fill="#2E9A6E" stroke="#fff" stroke-width="3"/></svg>
        <div class="absolute left-5 bottom-4 text-white">
          <div class="text-xs font-semibold opacity-80">Last fix 6 s ago</div>
          <div class="font-bold text-lg">Pine Saddle · 1,284 m</div>
        </div>
        <div class="absolute right-4 bottom-4 w-10 h-10 rounded-full bg-white/90 flex items-center justify-center"><i class="fas fa-location-arrow text-emerald-800"></i></div>
      </div>
    </div>

    <!-- Recent alert -->
    <div class="px mt-4">
      <div class="card p-4 flex items-center gap-3">
        <div class="ico" style="background:linear-gradient(135deg,#F0B654,#E08A2E)"><i class="fas fa-weight-hanging"></i></div>
        <div class="flex-1"><div class="font-bold text-[15px]">Load hit 19.6%</div><div class="text-xs muted">Water refill at 10:02 · cleared</div></div>
        <span class="text-xs muted font-semibold">2h</span>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab on"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
