<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Alert limits</title>
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

    <div class="px flex items-center gap-3 mt-2">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop" class="w-14 h-14 rounded-2xl object-cover">
      <div class="flex-1"><div class="h2">Maya Ortiz</div><div class="text-xs muted font-semibold">62 kg · 168 cm</div></div>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-pen text-sm"></i></div>
    </div>

    <div class="px mt-6"><div class="h1">Alert limits</div></div>

    <!-- activity presets -->
    <div class="hscroll mt-4">
      <div class="flex-shrink-0 w-[120px] rounded-3xl p-4 text-white" style="background:linear-gradient(135deg,#1F6B4F,#2E9A6E)"><i class="fas fa-person-hiking text-xl"></i><div class="font-bold mt-6">Day hike</div><div class="text-xs opacity-80">20% load</div></div>
      <div class="flex-shrink-0 w-[120px] rounded-3xl p-4 card"><i class="fas fa-campground text-xl text-amber-600"></i><div class="font-bold mt-6">Multi-day</div><div class="text-xs muted">25% load</div></div>
      <div class="flex-shrink-0 w-[120px] rounded-3xl p-4 card"><i class="fas fa-school text-xl text-indigo-600"></i><div class="font-bold mt-6">School</div><div class="text-xs muted">10% load</div></div>
      <div class="flex-shrink-0 w-[120px] rounded-3xl p-4 card"><i class="fas fa-lungs text-xl text-teal-600"></i><div class="font-bold mt-6">Asthma</div><div class="text-xs muted">AQI 51</div></div>
    </div>

    <!-- load slider -->
    <div class="px mt-5">
      <div class="card p-5">
        <div class="flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#F0B654,#E08A2E)"><i class="fas fa-weight-hanging"></i></div><div class="flex-1 font-bold">Max load</div><div class="text-[28px] font-extrabold tracking-tight">12.4<span class="text-sm muted"> kg</span></div></div>
        <div class="relative mt-5 h-2 rounded-full bg-[#ECEAE3]"><div class="absolute left-0 top-0 h-2 rounded-full" style="width:66%;background:linear-gradient(90deg,#2E9A6E,#E8A33D)"></div><div class="absolute top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-white shadow-md border" style="left:calc(66% - 14px)"></div></div>
        <div class="flex justify-between text-[11px] muted font-semibold mt-3"><span>10%</span><span>20% of body</span><span>30%</span></div>
      </div>
    </div>

    <!-- AQI slider -->
    <div class="px mt-3">
      <div class="card p-5">
        <div class="flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#3DB6A0,#1F7F9A)"><i class="fas fa-wind"></i></div><div class="flex-1 font-bold">Air alert at</div><div class="text-[28px] font-extrabold tracking-tight">101<span class="text-sm muted"> AQI</span></div></div>
        <div class="flex gap-1 mt-5"><div class="flex-1 h-2 rounded-full g"></div><div class="flex-1 h-2 rounded-full" style="background:#E8D23D"></div><div class="flex-1 h-2 rounded-full a ring-2 ring-offset-2 ring-[#14201B]"></div><div class="flex-1 h-2 rounded-full r"></div><div class="flex-1 h-2 rounded-full" style="background:#8E3B8E"></div></div>
        <div class="flex justify-between text-[11px] muted font-semibold mt-3"><span>Good</span><span>Moderate</span><span>Sensitive</span><span>Unhealthy</span></div>
      </div>
    </div>

    <!-- delivery -->
    <div class="px mt-3">
      <div class="card divide-y divide-gray-100">
        <div class="p-4 flex items-center gap-3"><i class="fas fa-mobile-screen w-5 text-center muted"></i><div class="flex-1 font-semibold text-[15px]">Phone + haptics</div><div class="w-[52px] h-[30px] rounded-full p-0.5 flex justify-end" style="background:#2E9A6E"><div class="w-[26px] h-[26px] rounded-full bg-white shadow"></div></div></div>
        <div class="p-4 flex items-center gap-3"><i class="fas fa-volume-high w-5 text-center muted"></i><div class="flex-1 font-semibold text-[15px]">Pod buzzer</div><div class="w-[52px] h-[30px] rounded-full p-0.5 flex justify-end" style="background:#2E9A6E"><div class="w-[26px] h-[26px] rounded-full bg-white shadow"></div></div></div>
        <div class="p-4 flex items-center gap-3"><i class="fas fa-user-group w-5 text-center muted"></i><div class="flex-1 font-semibold text-[15px]">Trusted contacts</div>
          <div class="flex -space-x-2"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" class="w-7 h-7 rounded-full border-2 border-white object-cover"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop" class="w-7 h-7 rounded-full border-2 border-white object-cover"></div></div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-gauge-high"></i>Live</div><div class="tab"><i class="fas fa-route"></i>Route</div><div class="tab"><div class="pod"><i class="fas fa-microchip"></i></div>Pod</div><div class="tab"><i class="fas fa-mountain-sun"></i>Trips</div><div class="tab on"><i class="fas fa-user"></i>You</div></nav><div class="homebar"></div>
</div>
</body>
</html>
