<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Air alert</title>
</head>
<body>
<div class="screen" style="background:#2A1410">
  <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=900&h=1400&fit=crop" class="absolute inset-0 w-full h-full object-cover" style="filter:sepia(.6) saturate(1.4) hue-rotate(-15deg) brightness(.6)">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(60,20,10,.55),rgba(40,12,8,.85) 55%,#1E0D09)"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>


  <div class="relative z-10 px text-white mt-6">
    <div class="flex items-center gap-2 text-sm font-semibold opacity-80"><i class="fas fa-shield-halved"></i>SentryPack · 2 s ago</div>
  </div>

  <div class="relative z-10 flex flex-col items-center mt-10 text-white">
    <div class="relative w-[200px] h-[200px] flex items-center justify-center">
      <span class="absolute inset-0 rounded-full border-2 border-[#E0533D]/40 animate-ping"></span>
      <span class="absolute inset-4 rounded-full" style="background:radial-gradient(circle,rgba(224,83,61,.55),rgba(224,83,61,.05))"></span>
      <div class="relative w-[130px] h-[130px] rounded-full flex flex-col items-center justify-center" style="background:linear-gradient(135deg,#F06A4C,#C73A26)">
        <div style="font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1">158</div>
        <div class="text-[11px] font-bold opacity-80 mt-1">US AQI</div>
      </div>
    </div>
    <div class="mt-6 text-[30px] font-extrabold tracking-tight">Unhealthy air</div>
    <p class="opacity-75 mt-2 text-[15px] text-center px-12">PM2.5 jumped to 68 µg/m³. Likely smoke from the east.</p>
  </div>

  <!-- spark -->
  <div class="relative z-10 px mt-6">
    <div class="rounded-3xl bg-white/10 backdrop-blur p-4">
      <svg viewBox="0 0 360 70" class="w-full"><path d="M0 60 L60 58 L120 56 L180 54 L220 50 L250 30 L280 18 L320 12 L360 8" fill="none" stroke="#F58A6E" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="34" x2="360" y2="34" stroke="#fff" stroke-opacity=".4" stroke-dasharray="4 5"/></svg>
      <div class="flex justify-between text-[11px] text-white/60 font-semibold mt-1"><span>-10 min</span><span>limit 101</span><span>now</span></div>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-12 z-10 px space-y-3">
    <div class="btn" style="background:#fff;color:#1E0D09"><i class="fas fa-route"></i>Route away · 1.2 km west</div>
    <div class="flex gap-3">
      <div class="btn flex-1 text-white" style="background:rgba(255,255,255,.14)"><i class="fas fa-paper-plane"></i>Ping group</div>
      <div class="btn flex-1 text-white" style="background:rgba(255,255,255,.14)"><i class="fas fa-bell-slash"></i>Snooze 15m</div>
    </div>
  </div>
  <div class="homebar light"></div>
</div>
</body>
</html>
