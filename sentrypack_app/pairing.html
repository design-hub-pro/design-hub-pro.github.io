<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

<title>SentryPack - Pair and attach</title>
</head>
<body>
<div class="screen">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>

  <div class="px flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fas fa-chevron-left"></i></div>
    <span class="text-sm font-semibold muted">Step 2 of 3</span>
    <div class="w-10"></div>
  </div>
  <div class="px mt-3"><div class="bar"><div class="g" style="width:66%"></div></div></div>

  <div class="px mt-6">
    <div class="h1">Clip and zero</div>
    <p class="muted mt-2 text-[15px]">Slide the pod onto the shoulder strap. Empty pack first.</p>
  </div>

  <!-- Pod illustration -->
  <div class="relative mx-auto mt-6 w-[330px] h-[330px] flex items-center justify-center">
    <div class="absolute inset-0 rounded-full" style="background:radial-gradient(circle,rgba(46,154,110,.18),rgba(46,154,110,0) 70%)"></div>
    <div class="absolute inset-8 rounded-full border-2 border-dashed" style="border-color:rgba(31,107,79,.25)"></div>
    <!-- strap -->
    <div class="absolute w-[70px] h-full rounded-xl" style="background:repeating-linear-gradient(0deg,#2B3A33 0 6px,#33443C 6px 12px)"></div>
    <!-- pod -->
    <div class="relative w-[120px] h-[160px] rounded-[34px] flex flex-col items-center justify-center shadow-2xl" style="background:linear-gradient(160deg,#F7F6F1,#D9D6CC)">
      <div class="w-[84px] h-[60px] rounded-2xl flex items-center justify-center" style="background:#14201B">
        <div class="text-center"><div class="text-emerald-400 font-extrabold text-xl">0.0</div><div class="text-[9px] text-white/60 font-semibold">KG</div></div>
      </div>
      <div class="flex gap-1.5 mt-4"><span class="dot g"></span><span class="dot g"></span><span class="dot" style="background:#C9C5B9"></span></div>
      <div class="mt-3 w-10 h-1.5 rounded-full" style="background:#BDB8AA"></div>
    </div>
    <div class="absolute right-2 top-16 chip shadow"><i class="fas fa-magnet text-emerald-700"></i>Locked</div>
    <div class="absolute left-0 bottom-16 chip shadow"><i class="fab fa-bluetooth-b text-sky-600"></i>SP-4F21</div>
  </div>

  <div class="px mt-6 space-y-3">
    <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#2E9A6E,#1F6B4F)"><i class="fas fa-check"></i></div><div class="flex-1 font-semibold">Pod found</div><span class="dot g"></span></div>
    <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#2E9A6E,#1F6B4F)"><i class="fas fa-link"></i></div><div class="flex-1 font-semibold">Strap mount locked</div><span class="dot g"></span></div>
    <div class="card p-4 flex items-center gap-3"><div class="ico" style="background:linear-gradient(135deg,#F0B654,#E08A2E)"><i class="fas fa-scale-balanced"></i></div><div class="flex-1"><div class="font-semibold">Zeroing scale</div><div class="bar mt-2"><div class="a" style="width:70%"></div></div></div></div>
  </div>

  <div class="absolute left-0 right-0 bottom-10 px"><div class="btn pri">Continue</div></div>
  <div class="homebar"></div>
</div>
</body>
</html>
