<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentryPack - Backpack sensor pod companion app</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: #ffffff; }
  body { font-family:'Inter',-apple-system,sans-serif; color:#14201B; -webkit-font-smoothing:antialiased; }
  .hero { text-align:center; padding:64px 40px 40px; }
  .hero-icon { width:64px; height:64px; border-radius:1rem; margin:0 auto 22px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1F6B4F,#2E9A6E 60%,#E8A33D); }
  .hero-icon i { color:#fff; font-size:28px; }
  .hero h1 { font-size:44px; font-weight:800; letter-spacing:-1.5px; }
  .hero p { font-size:18px; color:#5F6B65; margin-top:10px; }
  .tags { display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .tags span { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500; background:#f3f4f6; color:#5F6B65; }
  .grid { display:grid; grid-template-columns:repeat(3, 460px); gap:48px; justify-content:center; padding:20px 40px 80px; }
  @media (max-width:1560px) { .grid { grid-template-columns:repeat(2, 460px); } }
  @media (max-width:1040px) { .grid { grid-template-columns:460px; } }
  .phone-frame { width:460px; height:980px; border-radius:62px; padding:12px; background:#111; box-shadow:0 20px 60px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06); }
  .phone-screen { width:100%; height:100%; border-radius:52px; overflow:hidden; background:#000; }
  .phone-screen iframe { width:100%; height:100%; border:0; display:block; }
  *::-webkit-scrollbar { display:none; }
  * { scrollbar-width:none; }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-icon"><i class="fas fa-person-hiking"></i></div>
    <h1>SentryPack</h1>
    <p>A strap-clip pod that weighs your pack, reads the air and tracks your route.</p>
    <div class="tags"><span>Outdoor Safety</span><span>Wearable</span><span>IoT</span><span>iOS</span></div>
  </header>
  <main class="grid">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" title="Welcome" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pairing.html" title="Pair and attach" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" title="Live" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="load.html" title="Pack load" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="air.html" title="Air quality" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="alert.html" title="Air alert" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="route.html" title="Route" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="trips.html" title="Trips" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pod.html" title="My pod" scrolling="no"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="limits.html" title="Alert limits" scrolling="no"></iframe></div></div>
  </main>
</body>
</html>
