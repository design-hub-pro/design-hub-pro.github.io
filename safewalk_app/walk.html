<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>SafeWalk</title></head><body><div class="screen" style="background:linear-gradient(170deg,#2A2150,#1B1533 55%,#120D26)">
<div class="status light"><span>6:36</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<div class="scroll text-white" style="padding-bottom:40px">
 <div class="flex items-center justify-between mt-3">
  <div class="navbtn dark"><i class="fas fa-chevron-down"></i></div>
  <div class="px-3.5 h-9 rounded-full bg-white/10 flex items-center gap-2 text-[12.5px] font-bold"><span class="dot bg-emerald-400"></span>Walk live · 8:12</div>
  <div class="navbtn dark"><i class="fas fa-volume-high"></i></div>
 </div>

 <div class="text-center mt-6">
  <div class="eyebrow text-amber-300">Behind you</div>
  <div class="flex items-baseline justify-center gap-2 mt-2"><span class="text-[60px] font-black num leading-none">7.5</span><span class="text-[20px] font-extrabold text-white/60">m</span></div>
  <div class="text-[14.5px] font-semibold text-white/75 mt-2">1 person · 40 s · slower than you</div>
 </div>

 <div class="mt-3 -mx-2"><svg viewBox="0 0 380 300" class="w-full">
 <defs>
  <radialGradient id="fan" cx="190" cy="24" r="270" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9B7BFF" stop-opacity=".42"/><stop offset="1" stop-color="#9B7BFF" stop-opacity=".03"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B5FD" stop-opacity=".55"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/></linearGradient>
 </defs>
 <path d="M190 24 L-34 164 A264 264 0 0 0 414 164 Z" fill="url(#fan)"/>
 <g fill="none" stroke="#C4B5FD" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="3 6">
  <path d="M122 66 A80 80 0 0 0 258 66"/><path d="M54 109 A160 160 0 0 0 326 109"/><path d="M-14 151 A240 240 0 0 0 394 151"/>
 </g>
 <path class="sweep" d="M190 24 L172 286 L208 286 Z" fill="url(#beam)"/>
 <g font-family="Inter" font-size="10.5" font-weight="700" fill="#C4B5FD" fill-opacity=".7"><text x="196" y="100">3 m</text><text x="196" y="180">6 m</text><text x="196" y="260">12 m</text></g>
 <circle cx="262" cy="196" r="20" fill="#F59E0B" fill-opacity=".2"/><circle cx="262" cy="196" r="9" fill="#F59E0B" stroke="#1B1533" stroke-width="3"/>
 <circle cx="96" cy="250" r="5" fill="#C4B5FD" fill-opacity=".5"/>
 <circle cx="190" cy="24" r="17" fill="#6D4AFF" stroke="#fff" stroke-width="3.5"/>
 <path d="M190 15 L196 28 L190 25 L184 28 Z" fill="#fff"/>
</svg></div>

 <div class="grid grid-cols-3 gap-2.5 -mt-3">
  <div class="glass px-3 py-3 flex items-center gap-2.5"><i class="fas fa-video text-violet-300 text-[14px]"></i><div><div class="text-[12px] font-bold leading-tight">Camera</div><div class="flex items-center gap-1.5 text-[10.5px] text-white/55 font-semibold"><span class="dot !w-1.5 !h-1.5 bg-emerald-400"></span>1 shape</div></div></div>
  <div class="glass px-3 py-3 flex items-center gap-2.5"><i class="fas fa-satellite-dish text-violet-300 text-[14px]"></i><div><div class="text-[12px] font-bold leading-tight">Radar</div><div class="flex items-center gap-1.5 text-[10.5px] text-white/55 font-semibold"><span class="dot !w-1.5 !h-1.5 bg-emerald-400"></span>7.5 m</div></div></div>
  <div class="glass px-3 py-3 flex items-center gap-2.5"><i class="fas fa-wave-square text-violet-300 text-[14px]"></i><div><div class="text-[12px] font-bold leading-tight">Sonar</div><div class="flex items-center gap-1.5 text-[10.5px] text-white/55 font-semibold"><span class="dot !w-1.5 !h-1.5 bg-white/40"></span>under 4 m</div></div></div>
 </div>

 <div class="glass p-4 mt-3">
  <div class="flex items-center justify-between">
   <div class="flex items-center gap-2.5"><i class="fas fa-house text-violet-300"></i><span class="text-[14.5px] font-bold">Home in 6 min</span></div>
   <div class="flex items-center gap-2"><div class="avs"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=80" class="av !w-7 !h-7 !border-[#2A2150]"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80" class="av !w-7 !h-7 !border-[#2A2150]"></div><span class="text-[11.5px] font-semibold text-white/60">watching</span></div>
  </div>
  <div class="bar mt-3.5 !bg-white/10"><span class="grad-violet" style="width:58%"></span></div>
  <div class="flex justify-between mt-2 text-[11.5px] font-semibold text-white/55 num"><span>0.64 km</span><span>1.1 km</span></div>
 </div>

 <div class="flex items-center gap-3 mt-4">
  <button class="h-[60px] flex-1 rounded-[22px] grad-coral font-extrabold text-[16px] flex items-center justify-center gap-2.5" style="box-shadow:0 14px 28px -10px rgba(255,90,95,.7)"><i class="fas fa-hand"></i>Hold for SOS</button>
  <button class="h-[60px] w-[60px] rounded-[22px] bg-white/10 flex items-center justify-center text-[18px]"><i class="fas fa-phone-volume"></i></button>
  <button class="h-[60px] w-[60px] rounded-[22px] bg-white/10 flex items-center justify-center text-[18px]"><i class="fas fa-flag-checkered"></i></button>
 </div>
</div>
<div class="home-ind light"></div>
</div></body></html>
