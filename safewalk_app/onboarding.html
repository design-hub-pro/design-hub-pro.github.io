<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>SafeWalk</title></head><body><div class="screen">
<div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484995788-image-1.png" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(18,13,38,.55) 0%,rgba(18,13,38,.05) 30%,rgba(18,13,38,.75) 62%,rgba(18,13,38,.97) 100%)"></div>
<div class="absolute inset-0 flex flex-col text-white" style="padding:76px 28px 44px">
 <div class="flex items-center justify-between">
  <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl grad-violet flex items-center justify-center"><i class="fas fa-person-walking text-[15px]"></i></div><span class="text-[17px] font-extrabold tracking-tight">SafeWalk</span></div>
  <span class="text-[13px] font-semibold text-white/70">Skip</span>
 </div>
 <div class="mt-auto">
  <div class="eyebrow text-violet-300">Clip-on safety pebble</div>
  <h1 class="text-[40px] font-black tracking-tight leading-[1.04] mt-3">Eyes behind you on the walk home.</h1>
  <p class="text-[15px] text-white/75 mt-3 leading-snug">The pebble watches your back. Your phone tells you, and the people you pick.</p>
  <div class="grid grid-cols-3 gap-2.5 mt-6">
   <div class="glass p-3.5 backdrop-blur"><i class="fas fa-satellite-dish text-violet-300 text-[17px]"></i><div class="text-[12.5px] font-bold mt-2.5 leading-tight">Senses who is behind</div></div>
   <div class="glass p-3.5 backdrop-blur"><i class="fas fa-location-dot text-violet-300 text-[17px]"></i><div class="text-[12.5px] font-bold mt-2.5 leading-tight">Shares your route</div></div>
   <div class="glass p-3.5 backdrop-blur"><i class="fas fa-bell text-violet-300 text-[17px]"></i><div class="text-[12.5px] font-bold mt-2.5 leading-tight">Alerts in one buzz</div></div>
  </div>
  <button class="mt-6 h-[58px] w-full rounded-[20px] bg-white text-[#1B1533] font-extrabold text-[16.5px] flex items-center justify-center gap-2.5"><i class="fab fa-bluetooth-b c-violet"></i>Pair my pebble</button>
  <div class="flex justify-center gap-1.5 mt-5"><span class="w-6 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/35"></span><span class="w-1.5 h-1.5 rounded-full bg-white/35"></span></div>
 </div>
</div>
<div class="home-ind light"></div>
</div></body></html>
