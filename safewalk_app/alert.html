<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>SafeWalk</title></head><body><div class="screen">
<div class="status light"><span>6:38</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<div class="absolute left-0 right-0 top-0 h-[430px] grad-coral" style="border-radius:0 0 44px 44px"></div>
<div class="scroll" style="padding-bottom:40px">
 <div class="text-white text-center mt-5">
  <div class="relative w-[76px] h-[76px] mx-auto">
   <div class="absolute inset-0 rounded-full bg-white/40 pulse"></div>
   <div class="relative w-full h-full rounded-full bg-white flex items-center justify-center"><i class="fas fa-person-walking-arrow-right c-coral text-[28px]"></i></div>
  </div>
  <h1 class="text-[29px] font-black tracking-tight leading-[1.1] mt-5">Someone has stayed<br>behind you</h1>
  <div class="grid grid-cols-3 gap-2 mt-5">
   <div class="rounded-[20px] bg-white/18 py-3.5" style="background:rgba(255,255,255,.18)"><div class="flex items-baseline justify-center gap-1"><span class="text-[32px] font-black num leading-none">4.2</span><span class="text-[13px] font-bold text-white/75">m</span></div><div class="text-[11.5px] font-semibold text-white/80 mt-1.5">closing</div></div>
   <div class="rounded-[20px] py-3.5" style="background:rgba(255,255,255,.18)"><div class="text-[32px] font-black num leading-none">2:10</div><div class="text-[11.5px] font-semibold text-white/80 mt-1.5">following</div></div>
   <div class="rounded-[20px] py-3.5" style="background:rgba(255,255,255,.18)"><div class="text-[32px] font-black num leading-none">2</div><div class="text-[11.5px] font-semibold text-white/80 mt-1.5">turns matched</div></div>
  </div>
 </div>

 <div class="card p-3 mt-5 flex items-center gap-3.5">
  <svg viewBox="0 0 150 110" class="w-[150px] h-[110px] rounded-[18px] flex-shrink-0">
 <defs><filter id="bl"><feGaussianBlur stdDeviation="3.2"/></filter><radialGradient id="lamp" cx=".7" cy=".1" r=".9"><stop offset="0" stop-color="#FCD9A0"/><stop offset=".45" stop-color="#5B4A7A"/><stop offset="1" stop-color="#15102B"/></radialGradient></defs>
 <rect width="150" height="110" fill="url(#lamp)"/>
 <path d="M0 86 L150 70 L150 110 L0 110 Z" fill="#0E0A1F" opacity=".7"/>
 <g filter="url(#bl)" fill="#0B0818"><circle cx="78" cy="38" r="9"/><path d="M64 96 L68 54 Q78 46 88 54 L92 96 Z"/></g>
 <rect x="56" y="24" width="46" height="78" rx="6" fill="none" stroke="#FF5A5F" stroke-width="2"/>
 <rect x="56" y="12" width="42" height="13" rx="4" fill="#FF5A5F"/><text x="61" y="21.5" font-family="Inter" font-size="8.5" font-weight="800" fill="#fff">4.2 m</text>
</svg>
  <div class="flex-1 pr-1">
   <div class="eyebrow c-coral">5 s clip</div>
   <div class="text-[15px] font-extrabold leading-tight mt-1.5">Saved on your pebble</div>
   <div class="text-[12px] font-medium text-[#8C87A6] mt-1 leading-snug">Blurred. Nothing leaves it unless you share.</div>
   <div class="flex gap-1.5 mt-2.5"><span class="w-7 h-7 rounded-lg bg-[#F6F4FB] flex items-center justify-center text-[11px] c-violet"><i class="fas fa-video"></i></span><span class="w-7 h-7 rounded-lg bg-[#F6F4FB] flex items-center justify-center text-[11px] c-violet"><i class="fas fa-satellite-dish"></i></span><span class="w-7 h-7 rounded-lg bg-[#F6F4FB] flex items-center justify-center text-[11px] c-violet"><i class="fas fa-wave-square"></i></span></div>
  </div>
 </div>

 <div class="card p-4 mt-3 flex items-center gap-3.5">
  <div class="relative w-[52px] h-[52px] flex-shrink-0">
   <svg viewBox="0 0 52 52" class="w-full h-full -rotate-90"><circle cx="26" cy="26" r="22" fill="none" stroke="#FFE1E2" stroke-width="5"/><circle cx="26" cy="26" r="22" fill="none" stroke="#FF5A5F" stroke-width="5" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="46"/></svg>
   <div class="absolute inset-0 flex items-center justify-center text-[19px] font-black num">8</div>
  </div>
  <div class="flex-1"><div class="text-[14.5px] font-bold leading-tight">Telling your circle in 8 s</div><div class="avs mt-1.5"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=80" class="av !w-7 !h-7"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80" class="av !w-7 !h-7"><img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200&q=80" class="av !w-7 !h-7"></div></div>
  <button class="h-10 px-4 rounded-full bg-[#F6F4FB] text-[13px] font-extrabold">Not yet</button>
 </div>

 <div class="grid grid-cols-3 gap-3 mt-3">
  <div class="card py-4 flex flex-col items-center gap-2.5"><div class="icon-tile grad-violet"><i class="fas fa-phone"></i></div><span class="text-[12.5px] font-bold">Call Mom</span></div>
  <div class="card py-4 flex flex-col items-center gap-2.5"><div class="icon-tile grad-sky"><i class="fas fa-phone-volume"></i></div><span class="text-[12.5px] font-bold">Fake call</span></div>
  <div class="card py-4 flex flex-col items-center gap-2.5"><div class="icon-tile grad-amber"><i class="fas fa-bullhorn"></i></div><span class="text-[12.5px] font-bold">Loud alarm</span></div>
 </div>

 <div class="flex gap-3 mt-4">
  <button class="h-[58px] flex-1 rounded-[20px] bg-white card font-extrabold text-[15.5px] flex items-center justify-center gap-2"><i class="fas fa-check c-mint"></i>I'm OK</button>
  <button class="h-[58px] flex-1 rounded-[20px] grad-coral text-white font-extrabold text-[15.5px] flex items-center justify-center gap-2" style="box-shadow:0 14px 28px -10px rgba(255,90,95,.7)"><i class="fas fa-tower-broadcast"></i>SOS 911</button>
 </div>
</div>
<div class="home-ind light"></div>
</div></body></html>
