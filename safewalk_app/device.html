<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"><title>SafeWalk</title></head><body><div class="screen">
<div class="status"><span>5:40</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><div class="batt"></div></div></div>

<div class="scroll">
 <div class="flex items-center justify-between mt-3">
  <h1 class="text-[28px] font-black tracking-tight">My pebble</h1>
  <div class="h-10 px-3.5 rounded-full bg-white card flex items-center gap-2 text-[12.5px] font-bold"><i class="fab fa-bluetooth-b c-violet"></i>Connected</div>
 </div>

 <div class="relative mt-4 rounded-[28px] overflow-hidden h-[228px] text-white">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795484968924-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(18,13,38,.88) 0%,rgba(18,13,38,.45) 48%,rgba(18,13,38,0) 78%)"></div>
  <div class="relative p-5 h-full flex flex-col justify-between">
   <span class="self-start px-3 py-1.5 rounded-full bg-white/20 backdrop-blur text-[11.5px] font-bold tracking-wide">BACKPACK MODE</span>
   <div>
    <div class="flex items-baseline gap-1"><span class="text-[52px] font-black num leading-none">82</span><span class="text-[20px] font-black text-white/70">%</span></div>
    <div class="text-[13px] font-semibold text-white/80 mt-1.5">About 5 h of walking left</div>
    <div class="bar mt-3 w-[170px] !bg-white/20"><span class="grad-mint" style="width:82%"></span></div>
   </div>
  </div>
 </div>

 <div class="grid grid-cols-4 gap-2.5 mt-4">
  <div class="card p-4"><div class="flex items-center justify-between"><div class="icon-tile grad-violet !w-10 !h-10 !rounded-[13px] text-[14px]"><i class="fas fa-video"></i></div><span class="dot bg-emerald-500"></span></div><div class="text-[14px] font-extrabold mt-3">Camera</div><div class="text-[12px] font-semibold text-[#8C87A6] mt-0.5 num">Clear</div></div>
  <div class="card p-4"><div class="flex items-center justify-between"><div class="icon-tile grad-violet !w-10 !h-10 !rounded-[13px] text-[14px]"><i class="fas fa-satellite-dish"></i></div><span class="dot bg-emerald-500"></span></div><div class="text-[14px] font-extrabold mt-3">Radar</div><div class="text-[12px] font-semibold text-[#8C87A6] mt-0.5 num">12 m</div></div>
  <div class="card p-4"><div class="flex items-center justify-between"><div class="icon-tile grad-violet !w-10 !h-10 !rounded-[13px] text-[14px]"><i class="fas fa-wave-square"></i></div><span class="dot bg-emerald-500"></span></div><div class="text-[14px] font-extrabold mt-3">Sonar</div><div class="text-[12px] font-semibold text-[#8C87A6] mt-0.5 num">4 m</div></div>
  <div class="card p-4"><div class="flex items-center justify-between"><div class="icon-tile grad-violet !w-10 !h-10 !rounded-[13px] text-[14px]"><i class="fas fa-location-crosshairs"></i></div><span class="dot bg-amber-400"></span></div><div class="text-[14px] font-extrabold mt-3">GPS</div><div class="text-[12px] font-semibold text-[#8C87A6] mt-0.5 num">9 sats</div></div>
 </div>

 <div class="card p-5 mt-3">
  <div class="flex items-center justify-between"><span class="text-[14.5px] font-bold">Sensitivity</span><span class="text-[12.5px] font-extrabold c-violet">Balanced</span></div>
  <div class="relative h-8 mt-2 flex items-center">
   <div class="absolute left-0 right-0 h-2 rounded-full bg-[#EAE6F5]"></div><div class="absolute left-0 h-2 rounded-full grad-violet" style="width:55%"></div>
   <div class="absolute w-7 h-7 rounded-full bg-white" style="left:calc(55% - 14px);box-shadow:0 3px 10px rgba(27,21,51,.3);border:2px solid #6D4AFF"></div>
  </div>
  <div class="flex justify-between text-[11.5px] font-semibold text-[#A39FB8] mt-1"><span>Busy street</span><span>Quiet path</span></div>
 </div>

 <div class="card px-5 py-1.5 mt-3 divide-y divide-[#F0EDF8]">
  <div class="flex items-center gap-3.5 py-3"><div class="icon-tile grad-ink"><i class="fas fa-user-shield"></i></div><div class="flex-1"><div class="text-[14.5px] font-bold leading-tight">Video stays on the pebble</div><div class="text-[12px] font-medium text-[#8C87A6] mt-0.5">Only blurred 5 s alert clips are kept</div></div><div class="toggle on"></div></div>
  <div class="flex items-center gap-3.5 py-3"><div class="icon-tile grad-sky"><i class="fas fa-users"></i></div><div class="flex-1"><div class="text-[14.5px] font-bold leading-tight">My circle</div><div class="text-[12px] font-medium text-[#8C87A6] mt-0.5">See me only during a walk</div></div><div class="avs"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=80" class="av !w-8 !h-8"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&q=80" class="av !w-8 !h-8"><img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200&q=80" class="av !w-8 !h-8"></div></div>
 </div>
</div>
<div class="tabbar"><div class="tab"><i class="fas fa-house"></i>Home</div><div class="tab"><i class="fas fa-map-location-dot"></i>Map</div><div class="tab"><div class="fab"><i class="fas fa-person-walking"></i></div></div><div class="tab"><i class="fas fa-bell"></i>Alerts</div><div class="tab on"><i class="fas fa-circle-dot"></i>Pebble</div></div><div class="home-ind"></div>
</div></body></html>
