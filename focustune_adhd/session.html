<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTune - Focus Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#8B5CF6',
                        accent: '#F59E0B',
                        success: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body {
            background: linear-gradient(180deg, #1E1B4B 0%, #312E81 50%, #4C1D95 100%);
            min-height: 100vh;
        }
        .visualizer-bar {
            animation: visualizer 0.5s ease-in-out infinite alternate;
        }
        .visualizer-bar:nth-child(1) { animation-delay: 0s; }
        .visualizer-bar:nth-child(2) { animation-delay: 0.1s; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.2s; }
        .visualizer-bar:nth-child(4) { animation-delay: 0.15s; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.25s; }
        .visualizer-bar:nth-child(6) { animation-delay: 0.1s; }
        .visualizer-bar:nth-child(7) { animation-delay: 0.2s; }
        @keyframes visualizer {
            0% { height: 20px; }
            100% { height: 60px; }
        }
        .timer-ring {
            animation: rotate 60s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .glow-pulse {
            animation: glow-pulse 2s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); }
            50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.8); }
        }
    </style>
</head>
<body class="text-white">
    <!-- Status Bar -->
    <div class="px-6 py-2 flex justify-between items-center text-sm font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-6 pb-24">
        <!-- Header -->
        <div class="flex items-center justify-between py-4">
            <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="text-center">
                <p class="text-white/60 text-sm">Now Playing</p>
                <p class="font-semibold">Focus Session</p>
            </div>
            <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-ellipsis-h"></i>
            </button>
        </div>

        <!-- Album Art / Visualizer -->
        <div class="flex justify-center my-8">
            <div class="relative">
                <div class="w-64 h-64 rounded-full bg-gradient-to-br from-primary/30 to-secondary/30 flex items-center justify-center glow-pulse">
                    <div class="w-56 h-56 rounded-full bg-gradient-to-br from-primary/40 to-secondary/40 flex items-center justify-center">
                        <div class="w-48 h-48 rounded-full overflow-hidden float">
                            <img src="https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=400&h=400&fit=crop" alt="Music" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
                <!-- Animated Ring -->
                <div class="absolute inset-0 rounded-full border-2 border-white/20 timer-ring"></div>
                <div class="absolute -top-1 left-1/2 transform -translate-x-1/2">
                    <div class="w-3 h-3 rounded-full bg-accent"></div>
                </div>
            </div>
        </div>

        <!-- Track Info -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold mb-1">Calm Piano Flow</h1>
            <p class="text-white/60">AI Generated • Focus Mode</p>
        </div>

        <!-- Audio Visualizer -->
        <div class="flex justify-center items-end gap-1 h-16 mb-8">
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
            <div class="w-2 bg-gradient-to-t from-primary to-secondary rounded-full visualizer-bar"></div>
        </div>

        <!-- Timer -->
        <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-6 mb-6">
            <div class="text-center">
                <p class="text-white/60 text-sm mb-2">Time Remaining</p>
                <div class="text-5xl font-bold tracking-wider mb-4">18:32</div>
                <div class="w-full h-2 bg-white/20 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-accent to-primary rounded-full" style="width: 26%"></div>
                </div>
                <p class="text-white/40 text-xs mt-2">6:28 / 25:00</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-6 mb-8">
            <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-random text-white/60"></i>
            </button>
            <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-backward text-white"></i>
            </button>
            <button class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-lg">
                <i class="fas fa-pause text-2xl text-primary"></i>
            </button>
            <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-forward text-white"></i>
            </button>
            <button class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-heart text-pink-400"></i>
            </button>
        </div>

        <!-- Focus Stats -->
        <div class="flex justify-center gap-8">
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-success/20 flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-brain text-success"></i>
                </div>
                <p class="text-white/60 text-xs">Focus Level</p>
                <p class="font-semibold">High</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-accent/20 flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-fire text-accent"></i>
                </div>
                <p class="text-white/60 text-xs">Streak</p>
                <p class="font-semibold">7 days</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 rounded-full bg-secondary/20 flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-star text-secondary"></i>
                </div>
                <p class="text-white/60 text-xs">Points</p>
                <p class="font-semibold">+50</p>
            </div>
        </div>
    </div>

    <!-- Bottom - End Session -->
    <div class="fixed bottom-0 left-0 right-0 px-6 py-4 bg-gradient-to-t from-black/50 to-transparent">
        <button class="w-full bg-white/10 backdrop-blur-lg text-white py-4 rounded-2xl font-semibold border border-white/20">
            End Session Early
        </button>
        <!-- Home Indicator -->
        <div class="flex justify-center pt-4">
            <div class="w-32 h-1 bg-white/50 rounded-full"></div>
        </div>
    </div>
</body>
</html>
