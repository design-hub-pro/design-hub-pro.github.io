<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTune - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#8B5CF6',
                        accent: '#F59E0B',
                        success: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body {
            background: linear-gradient(180deg, #EEF2FF 0%, #F5F3FF 50%, #FEFCE8 100%);
        }
        .float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Status Bar -->
    <div class="px-6 py-2 flex justify-between items-center text-sm font-medium text-gray-600 sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <div class="px-6 pb-12 flex flex-col min-h-screen">
        <!-- Skip Button -->
        <div class="flex justify-end py-4">
            <button class="text-gray-500 text-sm font-medium">Skip</button>
        </div>

        <!-- Main Content -->
        <div class="flex-grow flex flex-col items-center justify-center">
            <!-- Illustration -->
            <div class="relative mb-8">
                <!-- Background circles -->
                <div class="absolute -inset-12 rounded-full bg-primary/10 pulse-slow"></div>
                <div class="absolute -inset-6 rounded-full bg-secondary/20 pulse-slow" style="animation-delay: 0.5s;"></div>

                <!-- Main visual -->
                <div class="relative w-48 h-48 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center float shadow-2xl">
                    <div class="text-center text-white">
                        <div class="text-6xl mb-2">🎵</div>
                        <div class="flex items-center gap-1">
                            <div class="w-1 h-4 bg-white/80 rounded-full"></div>
                            <div class="w-1 h-8 bg-white rounded-full"></div>
                            <div class="w-1 h-6 bg-white/80 rounded-full"></div>
                            <div class="w-1 h-10 bg-white rounded-full"></div>
                            <div class="w-1 h-5 bg-white/80 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Text Content -->
            <div class="text-center max-w-xs">
                <h1 class="text-3xl font-bold text-gray-900 mb-4">AI-Powered Focus Music</h1>
                <p class="text-gray-600 leading-relaxed">Personalized soundscapes generated by AI to help you concentrate, stay calm, and achieve more.</p>
            </div>
        </div>

        <!-- Features Preview -->
        <div class="flex justify-center gap-6 mb-8">
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-white shadow-md flex items-center justify-center mb-2 mx-auto">
                    <i class="fas fa-brain text-primary"></i>
                </div>
                <p class="text-xs text-gray-600">AI Music</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-white shadow-md flex items-center justify-center mb-2 mx-auto">
                    <i class="fas fa-chart-line text-secondary"></i>
                </div>
                <p class="text-xs text-gray-600">Track Progress</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-white shadow-md flex items-center justify-center mb-2 mx-auto">
                    <i class="fas fa-trophy text-accent"></i>
                </div>
                <p class="text-xs text-gray-600">Earn Rewards</p>
            </div>
        </div>

        <!-- Pagination Dots -->
        <div class="flex justify-center gap-2 mb-6">
            <div class="w-8 h-2 rounded-full bg-primary"></div>
            <div class="w-2 h-2 rounded-full bg-gray-300"></div>
            <div class="w-2 h-2 rounded-full bg-gray-300"></div>
        </div>

        <!-- CTA Button -->
        <button class="w-full bg-gradient-to-r from-primary to-secondary text-white py-4 rounded-2xl font-semibold text-lg shadow-lg mb-4">
            Get Started
        </button>

        <p class="text-center text-gray-500 text-sm">
            Already have an account? <span class="text-primary font-medium">Sign In</span>
        </p>

        <!-- Home Indicator -->
        <div class="flex justify-center pt-6">
            <div class="w-32 h-1 bg-gray-900 rounded-full"></div>
        </div>
    </div>
</body>
</html>
