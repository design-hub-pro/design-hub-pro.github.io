<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture - SwingVision AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .screen {
            padding-bottom: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .camera-view {
            flex: 1;
            aspect-ratio: unset;
        }
        .pose-skeleton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .joint {
            width: 12px;
            height: 12px;
            background: #F59E0B;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
        }
        .bone {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, #6366F1, #8B5CF6);
            border-radius: 2px;
            transform-origin: left center;
        }
        .ai-status {
            position: absolute;
            top: 80px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .ai-status.detecting {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .ai-dot {
            width: 10px;
            height: 10px;
            background: #22C55E;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .ai-status.detecting .ai-dot {
            background: #6366F1;
        }
        .guide-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 400px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 20px;
        }
        .guide-text {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
        }
        .timer {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: 700;
            color: #EF4444;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .camera-switch {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .flash-btn {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .bottom-controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .gallery-preview {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid white;
        }
        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tips-overlay {
            position: absolute;
            bottom: 140px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }
        .tip-pill {
            padding: 8px 14px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="screen">
        <!-- Status Bar -->
        <div class="status-bar" style="position: absolute; top: 0; left: 0; right: 0; z-index: 100; background: transparent;">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Camera View -->
        <div class="camera-view">
            <img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=800&h=1200&fit=crop" alt="Camera View">

            <!-- AI Status -->
            <div class="ai-status detecting">
                <div class="ai-dot"></div>
                <span style="font-size: 14px; font-weight: 500;">AI Pose Detection Active</span>
            </div>

            <!-- Recording Timer -->
            <div class="timer" style="display: none;">00:03</div>

            <!-- Guide Frame -->
            <div class="guide-frame">
                <div class="guide-text">Position yourself in the frame</div>
            </div>

            <!-- Pose Skeleton Overlay SVG -->
            <svg class="skeleton-svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
                <!-- Skeleton lines -->
                <line x1="200" y1="120" x2="200" y2="200" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="200" y1="200" x2="200" y2="320" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="200" y1="200" x2="140" y2="180" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="140" y1="180" x2="90" y2="240" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="90" y1="240" x2="60" y2="320" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="200" y1="200" x2="260" y2="180" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="260" y1="180" x2="310" y2="240" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="310" y1="240" x2="350" y2="200" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="200" y1="320" x2="160" y2="420" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="160" y1="420" x2="150" y2="520" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="200" y1="320" x2="240" y2="420" class="skeleton-line" stroke-opacity="0.8"/>
                <line x1="240" y1="420" x2="250" y2="520" class="skeleton-line" stroke-opacity="0.8"/>

                <!-- Joint points -->
                <circle cx="200" cy="120" r="8" class="skeleton-point"/>
                <circle cx="200" cy="200" r="8" class="skeleton-point"/>
                <circle cx="140" cy="180" r="6" class="skeleton-point"/>
                <circle cx="90" cy="240" r="6" class="skeleton-point"/>
                <circle cx="60" cy="320" r="6" class="skeleton-point"/>
                <circle cx="260" cy="180" r="6" class="skeleton-point"/>
                <circle cx="310" cy="240" r="6" class="skeleton-point"/>
                <circle cx="350" cy="200" r="6" class="skeleton-point"/>
                <circle cx="200" cy="320" r="8" class="skeleton-point"/>
                <circle cx="160" cy="420" r="6" class="skeleton-point"/>
                <circle cx="150" cy="520" r="6" class="skeleton-point"/>
                <circle cx="240" cy="420" r="6" class="skeleton-point"/>
                <circle cx="250" cy="520" r="6" class="skeleton-point"/>
            </svg>

            <!-- Top Controls -->
            <div style="position: absolute; top: 50px; left: 20px; right: 20px; display: flex; justify-content: space-between;">
                <button class="camera-switch">
                    <i class="fas fa-times" style="font-size: 20px;"></i>
                </button>
                <div style="display: flex; gap: 12px;">
                    <button class="flash-btn">
                        <i class="fas fa-bolt" style="font-size: 18px;"></i>
                    </button>
                    <button class="camera-switch">
                        <i class="fas fa-sync-alt" style="font-size: 18px;"></i>
                    </button>
                </div>
            </div>

            <!-- Tips -->
            <div class="tips-overlay">
                <div class="tip-pill"><i class="fas fa-check" style="color: #22C55E; margin-right: 6px;"></i>Good lighting</div>
                <div class="tip-pill"><i class="fas fa-check" style="color: #22C55E; margin-right: 6px;"></i>Full body visible</div>
                <div class="tip-pill"><i class="fas fa-check" style="color: #22C55E; margin-right: 6px;"></i>Stable camera</div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <div class="gallery-preview">
                    <img src="https://images.unsplash.com/photo-1593111774240-d529f12cf4bb?w=100&h=100&fit=crop" alt="Gallery">
                </div>
                <div class="record-btn">
                    <div class="record-btn-inner"></div>
                </div>
                <div style="width: 50px; text-align: center;">
                    <i class="fas fa-upload" style="font-size: 24px; opacity: 0.7;"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
