<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiffStage VR - Game Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .screenshot-frame {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .screenshot-frame:hover {
            transform: translateY(-4px);
            box-shadow: 0 35px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08);
        }
        .screenshot-frame img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-5xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-fuchsia-500 to-indigo-700 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-guitar text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">RiffStage VR</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Play lead guitar with a virtual band. AI grades every note, and the crowd reacts live.</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-fuchsia-100 text-fuchsia-700 px-3 py-1 rounded-full font-medium">VR</span>
            <span class="text-xs bg-fuchsia-100 text-fuchsia-700 px-3 py-1 rounded-full font-medium">Music</span>
            <span class="text-xs bg-fuchsia-100 text-fuchsia-700 px-3 py-1 rounded-full font-medium">Simulation</span>
            <span class="text-xs bg-fuchsia-100 text-fuchsia-700 px-3 py-1 rounded-full font-medium">AI Coaching</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/-image-1.png" alt="RiffStage VR - ">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877987411-image-1.png" alt="RiffStage VR - Title Screen">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947805-image-1.png" alt="RiffStage VR - Live Guitar Gameplay">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947897-image-1.png" alt="RiffStage VR - Tour Map">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947566-image-1.png" alt="RiffStage VR - Festival Guitar Solo">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947657-image-1.png" alt="RiffStage VR - Backstage After the Show">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947849-image-1.png" alt="RiffStage VR - AI Performance Review">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877948076-image-1.png" alt="RiffStage VR - Rehearsal with AI Coach">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877947919-image-1.png" alt="RiffStage VR - Band Sync">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792877948100-image-1.png" alt="RiffStage VR - Audience Reaction">
            </div>
        </div>
    </div>
</body>
</html>
