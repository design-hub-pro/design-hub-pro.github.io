<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PeakForm AI - Pose Estimation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  background: #0A0E1A; color: #FFFFFF;
  width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
}

@keyframes jointPulse {
  0%, 100% { opacity: 1; r: 6; }
  50% { opacity: 0.7; r: 8; }
}

@keyframes skeletonGlow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(0,212,170,0.4)); }
  50% { filter: drop-shadow(0 0 10px rgba(0,212,170,0.8)); }
}

@keyframes repPop {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 10;">
  <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">9:41</span>
  <div style="width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>
  <div style="display: flex; gap: 6px; align-items: center;">
    <i class="fas fa-signal" style="font-size: 13px;"></i>
    <i class="fas fa-wifi" style="font-size: 14px;"></i>
    <i class="fas fa-battery-full" style="font-size: 15px;"></i>
  </div>
</div>

<!-- Camera View with Pose Estimation -->
<div style="position: relative; width: 100%; height: 55vh; overflow: hidden;">
  <!-- Background Image -->
  <img src="https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&h=700&fit=crop"
       style="width: 100%; height: 100%; object-fit: cover; display: block;">
  <!-- Dark Overlay -->
  <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,14,26,0.45);"></div>

  <!-- Top Navigation -->
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 5;">
    <a href="workout.html" style="width: 40px; height: 40px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff;">
      <i class="fas fa-arrow-left" style="font-size: 16px;"></i>
    </a>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div style="padding: 6px 14px; background: rgba(255,71,87,0.9); border-radius: 20px; display: flex; align-items: center; gap: 6px;">
        <div style="width: 8px; height: 8px; background: #fff; border-radius: 50; animation: jointPulse 1s infinite;"></div>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.5px;">REC</span>
      </div>
      <a href="#" style="width: 40px; height: 40px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff;">
        <i class="fas fa-times" style="font-size: 18px;"></i>
      </a>
    </div>
  </div>

  <!-- SVG Pose Estimation Skeleton -->
  <svg viewBox="0 0 500 700" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; animation: skeletonGlow 2s ease-in-out infinite;" preserveAspectRatio="xMidYMid slice">
    <!-- Skeleton lines -->
    <!-- Head to neck -->
    <line x1="260" y1="135" x2="260" y2="175" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Neck to left shoulder -->
    <line x1="260" y1="175" x2="210" y2="195" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Neck to right shoulder -->
    <line x1="260" y1="175" x2="310" y2="195" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Left shoulder to left elbow -->
    <line x1="210" y1="195" x2="185" y2="265" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Left elbow to left wrist -->
    <line x1="185" y1="265" x2="175" y2="335" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Right shoulder to right elbow -->
    <line x1="310" y1="195" x2="335" y2="265" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Right elbow to right wrist -->
    <line x1="335" y1="265" x2="340" y2="335" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Shoulder to shoulder (torso top) -->
    <line x1="210" y1="195" x2="310" y2="195" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Spine -->
    <line x1="260" y1="175" x2="260" y2="330" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Left hip -->
    <line x1="260" y1="330" x2="225" y2="345" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Right hip -->
    <line x1="260" y1="330" x2="295" y2="345" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Hip to hip -->
    <line x1="225" y1="345" x2="295" y2="345" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Left hip to left knee -->
    <line x1="225" y1="345" x2="215" y2="445" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Left knee to left ankle -->
    <line x1="215" y1="445" x2="210" y2="555" stroke="#00D4AA" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Right hip to right knee -->
    <line x1="295" y1="345" x2="305" y2="445" stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Right knee to right ankle -->
    <line x1="305" y1="445" x2="310" y2="555" stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Head circle -->
    <circle cx="260" cy="120" r="22" fill="none" stroke="#00D4AA" stroke-width="2.5" opacity="0.9"/>

    <!-- Joint dots -->
    <circle cx="260" cy="175" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite;"/>
    <circle cx="210" cy="195" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.1s;"/>
    <circle cx="310" cy="195" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.15s;"/>
    <circle cx="185" cy="265" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.2s;"/>
    <circle cx="175" cy="335" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.25s;"/>
    <circle cx="335" cy="265" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.3s;"/>
    <circle cx="340" cy="335" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.35s;"/>
    <circle cx="225" cy="345" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.4s;"/>
    <circle cx="295" cy="345" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.45s;"/>
    <circle cx="215" cy="445" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.5s;"/>
    <circle cx="210" cy="555" r="6" fill="#4F7FFF" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.55s;"/>
    <circle cx="305" cy="445" r="6" fill="#FFD700" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.6s;"/>
    <circle cx="310" cy="555" r="6" fill="#FFD700" stroke="#fff" stroke-width="1.5" style="animation: jointPulse 2s ease-in-out infinite 0.65s;"/>

    <!-- Angle arc on right knee -->
    <path d="M 295,425 Q 305,445 315,425" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
    <text x="320" y="440" fill="#FFD700" font-size="13" font-weight="600" font-family="SF Pro Display, system-ui">87°</text>
  </svg>
</div>

<!-- Content Below Camera -->
<div style="padding: 0 28px 40px 28px; margin-top: -20px; position: relative; z-index: 5;">

  <!-- Form Score & Rep Counter Row -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">

    <!-- Form Score -->
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="position: relative; width: 80px; height: 80px;">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
          <circle cx="40" cy="40" r="34" fill="none" stroke="#00D4AA" stroke-width="6" stroke-linecap="round"
                  stroke-dasharray="213.6" stroke-dashoffset="17" transform="rotate(-90 40 40)"/>
        </svg>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
          <div style="font-size: 24px; font-weight: 800; line-height: 1;">92</div>
        </div>
      </div>
      <div>
        <div style="font-size: 13px; color: #8892B0; margin-bottom: 2px;">Form Score</div>
        <div style="font-size: 15px; font-weight: 600; color: #00D4AA;">Excellent Form</div>
      </div>
    </div>

    <!-- Rep Counter -->
    <div style="text-align: center; background: #141929; border-radius: 20px; padding: 14px 24px; border: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 36px; font-weight: 800; line-height: 1; animation: repPop 2s ease-in-out infinite;">
        <span style="color: #4F7FFF;">7</span>
        <span style="color: #8892B0; font-size: 22px; font-weight: 500;"> / 12</span>
      </div>
      <div style="font-size: 12px; color: #8892B0; margin-top: 4px; font-weight: 500; letter-spacing: 0.5px;">REPS</div>
    </div>
  </div>

  <!-- Real-Time Feedback -->
  <div style="background: #141929; border-radius: 20px; padding: 18px 20px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.06);">
    <div style="font-size: 13px; color: #8892B0; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 14px; text-transform: uppercase;">Real-Time Feedback</div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <!-- Green check item -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: rgba(0,212,170,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <i class="fas fa-check" style="font-size: 12px; color: #00D4AA;"></i>
        </div>
        <span style="font-size: 14px; color: #00D4AA; font-weight: 500;">Back straight</span>
      </div>
      <!-- Green check item -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: rgba(0,212,170,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <i class="fas fa-check" style="font-size: 12px; color: #00D4AA;"></i>
        </div>
        <span style="font-size: 14px; color: #00D4AA; font-weight: 500;">Knees aligned</span>
      </div>
      <!-- Yellow warning item -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 28px; height: 28px; border-radius: 50%; background: rgba(255,215,0,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <i class="fas fa-exclamation" style="font-size: 12px; color: #FFD700;"></i>
        </div>
        <span style="font-size: 14px; color: #FFD700; font-weight: 500;">Lower hips 2 more inches</span>
      </div>
    </div>
  </div>

  <!-- Exercise Info Bar -->
  <div style="background: #141929; border-radius: 20px; padding: 18px 20px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 16px; font-weight: 700;">Single-Leg Squats</div>
      <div style="font-size: 13px; color: #8892B0; margin-top: 3px;">Set 2 of 3</div>
    </div>
    <div style="display: flex; gap: 12px;">
      <button style="width: 46px; height: 46px; border-radius: 50%; background: rgba(79,127,255,0.15); border: 1px solid rgba(79,127,255,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4F7FFF;">
        <i class="fas fa-pause" style="font-size: 16px;"></i>
      </button>
      <button style="width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8892B0;">
        <i class="fas fa-forward" style="font-size: 14px;"></i>
      </button>
    </div>
  </div>

</div>

</body>
</html>
