<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeLink - Use Case Diagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 95%;
            max-width: 1400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #1e3a5f;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HopeLink System Use Case Diagram</h1>
        <svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
            <defs>
                <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="volunteerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000020"/>
                </filter>
            </defs>

            <!-- System Boundary -->
            <rect x="250" y="30" width="700" height="690" rx="20" fill="url(#systemBg)" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10,5"/>
            <text x="600" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a5f">HopeLink Kiosk System</text>

            <!-- Actor: Help Seeker -->
            <g transform="translate(60, 180)">
                <circle cx="50" cy="25" r="25" fill="url(#userGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="50" x2="50" y2="100" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="20" y2="90" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="80" y2="90" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="25" y2="140" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="75" y2="140" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a5f">Help Seeker</text>
                <text x="50" y="182" text-anchor="middle" font-size="11" fill="#3b82f6">(Anonymous)</text>
            </g>

            <!-- Actor: Volunteer -->
            <g transform="translate(1050, 150)">
                <circle cx="50" cy="25" r="25" fill="url(#volunteerGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="50" x2="50" y2="100" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="20" y2="90" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="80" y2="90" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="25" y2="140" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="75" y2="140" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Volunteer</text>
            </g>

            <!-- Actor: Admin/Researcher -->
            <g transform="translate(1050, 480)">
                <circle cx="50" cy="25" r="25" fill="url(#adminGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="50" x2="50" y2="100" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="20" y2="90" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="65" x2="80" y2="90" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="25" y2="140" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="100" x2="75" y2="140" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">Admin /</text>
                <text x="50" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">Researcher</text>
            </g>

            <!-- Use Cases -->
            <!-- UC1: Select Language -->
            <ellipse cx="400" cy="110" rx="100" ry="35" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="400" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f">Select Language</text>

            <!-- UC2: Choose Need Category -->
            <ellipse cx="400" cy="195" rx="110" ry="35" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="400" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f">Choose Need</text>
            <text x="400" y="206" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f">Category</text>

            <!-- UC3: Answer Triage Questions -->
            <ellipse cx="400" cy="280" rx="115" ry="35" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="400" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f">Answer Triage</text>
            <text x="400" y="291" text-anchor="middle" font-size="13" font-weight="500" fill="#1e3a5f">Questions</text>

            <!-- UC4: View Matched Resources -->
            <ellipse cx="600" cy="195" rx="115" ry="40" fill="#eff6ff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">View Matched</text>
            <text x="600" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a5f">Resources</text>

            <!-- UC5: Generate Action Card -->
            <ellipse cx="600" cy="300" rx="110" ry="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Generate Action</text>
            <text x="600" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Card</text>

            <!-- UC6: Print/Scan QR -->
            <ellipse cx="800" cy="250" rx="90" ry="32" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
            <text x="800" y="255" text-anchor="middle" font-size="12" fill="#92400e">Print / Scan QR</text>

            <!-- UC7: Request Volunteer -->
            <ellipse cx="400" cy="400" rx="110" ry="40" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
            <text x="400" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Request Volunteer</text>
            <text x="400" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Assistance</text>

            <!-- UC8: Create Ticket -->
            <ellipse cx="600" cy="400" rx="90" ry="32" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
            <text x="600" y="405" text-anchor="middle" font-size="12" fill="#5b21b6">Create Ticket</text>

            <!-- UC9: Claim Ticket -->
            <ellipse cx="800" cy="350" rx="90" ry="32" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
            <text x="800" y="355" text-anchor="middle" font-size="12" fill="#5b21b6">Claim Ticket</text>

            <!-- UC10: Update Status -->
            <ellipse cx="800" cy="420" rx="90" ry="32" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
            <text x="800" y="425" text-anchor="middle" font-size="12" fill="#5b21b6">Update Status</text>

            <!-- UC11: View Dashboard -->
            <ellipse cx="600" cy="520" rx="100" ry="38" fill="#ecfdf5" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">View Analytics</text>
            <text x="600" y="533" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">Dashboard</text>

            <!-- UC12: Export Data -->
            <ellipse cx="800" cy="520" rx="85" ry="32" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
            <text x="800" y="525" text-anchor="middle" font-size="12" fill="#047857">Export Data</text>

            <!-- UC13: Manage Resources -->
            <ellipse cx="400" cy="520" rx="95" ry="35" fill="white" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="400" y="515" text-anchor="middle" font-size="12" fill="#047857">Manage Resource</text>
            <text x="400" y="532" text-anchor="middle" font-size="12" fill="#047857">Database</text>

            <!-- UC14: View Reports -->
            <ellipse cx="600" cy="620" rx="90" ry="32" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
            <text x="600" y="625" text-anchor="middle" font-size="12" fill="#047857">Generate Reports</text>

            <!-- UC15: Monitor Kiosks -->
            <ellipse cx="400" cy="620" rx="90" ry="32" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
            <text x="400" y="625" text-anchor="middle" font-size="12" fill="#047857">Monitor Kiosks</text>

            <!-- Connection Lines - Help Seeker -->
            <line x1="145" y1="290" x2="290" y2="115" stroke="#3b82f6" stroke-width="2"/>
            <line x1="145" y1="310" x2="290" y2="195" stroke="#3b82f6" stroke-width="2"/>
            <line x1="145" y1="330" x2="285" y2="280" stroke="#3b82f6" stroke-width="2"/>
            <line x1="145" y1="370" x2="290" y2="400" stroke="#3b82f6" stroke-width="2"/>

            <!-- Include relationships -->
            <line x1="510" y1="195" x2="485" y2="195" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="510" y1="280" x2="485" y2="240" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="475" y="225" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <line x1="600" y1="235" x2="600" y2="260" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="605" y="252" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <line x1="710" y1="280" x2="690" y2="295" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

            <line x1="510" y1="400" x2="490" y2="400" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="465" y="385" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <!-- Volunteer connections -->
            <line x1="1050" y1="250" x2="890" y2="345" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="1050" y1="270" x2="890" y2="415" stroke="#8b5cf6" stroke-width="2"/>

            <!-- Admin connections -->
            <line x1="1050" y1="560" x2="700" y2="520" stroke="#10b981" stroke-width="2"/>
            <line x1="1050" y1="580" x2="885" y2="520" stroke="#10b981" stroke-width="2"/>
            <line x1="1050" y1="600" x2="690" y2="615" stroke="#10b981" stroke-width="2"/>
            <line x1="700" y1="520" x2="495" y2="520" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="600" y1="555" x2="600" y2="588" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="500" y1="600" x2="490" y2="615" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>

            <!-- Legend -->
            <rect x="270" y="700" width="660" height="1" fill="#e5e7eb"/>
            <g transform="translate(290, 720)">
                <ellipse cx="40" cy="10" rx="35" ry="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
                <text x="95" y="15" font-size="11" fill="#666">User Action</text>

                <ellipse cx="200" cy="10" rx="35" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
                <text x="255" y="15" font-size="11" fill="#666">Core Function</text>

                <ellipse cx="370" cy="10" rx="35" ry="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
                <text x="425" y="15" font-size="11" fill="#666">Key Deliverable</text>

                <ellipse cx="540" cy="10" rx="35" ry="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
                <text x="595" y="15" font-size="11" fill="#666">Admin Function</text>
            </g>
        </svg>
    </div>
</body>
</html>
