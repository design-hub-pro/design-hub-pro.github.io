<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeLink - Select Need</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #3d7ab5 100%);
        }
        .need-btn:hover { transform: translateY(-2px); }
        .need-btn:active { transform: translateY(0); }
    </style>
</head>
<body class="p-4">
    <div class="w-full max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-3">
            <button class="flex items-center gap-2 text-white/80 hover:text-white text-sm">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center">
                    <i class="fas fa-hands-holding-heart text-sm text-white"></i>
                </div>
                <span class="text-lg font-bold text-white">HopeLink</span>
            </div>
            <div class="text-white/60 text-sm">Step 1 of 3</div>
        </div>

        <!-- Progress Bar -->
        <div class="bg-white/20 rounded-full h-2 mb-4">
            <div class="bg-white rounded-full h-2 w-1/3"></div>
        </div>

        <!-- Main Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl p-4">
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-gray-800 mb-1">What do you need help with?</h2>
                <p class="text-sm text-gray-500">Tap the option that best describes your need</p>
            </div>

            <!-- Need Categories Grid -->
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button class="need-btn bg-gradient-to-br from-red-500 to-rose-600 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-house-chimney text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Shelter</div>
                            <div class="text-red-200 text-xs">Emergency</div>
                        </div>
                    </div>
                    <p class="text-red-100 text-xs">Find a safe place to sleep tonight</p>
                </button>

                <button class="need-btn bg-gradient-to-br from-amber-500 to-orange-500 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-utensils text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Food</div>
                            <div class="text-amber-200 text-xs">Meals / Supplies</div>
                        </div>
                    </div>
                    <p class="text-amber-100 text-xs">Free meals and food pantries</p>
                </button>

                <button class="need-btn bg-gradient-to-br from-emerald-500 to-teal-500 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-heart-pulse text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Health</div>
                            <div class="text-emerald-200 text-xs">Medical / Mental</div>
                        </div>
                    </div>
                    <p class="text-emerald-100 text-xs">Free clinics and crisis support</p>
                </button>

                <button class="need-btn bg-gradient-to-br from-blue-500 to-indigo-500 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-briefcase text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Jobs</div>
                            <div class="text-blue-200 text-xs">Work / Training</div>
                        </div>
                    </div>
                    <p class="text-blue-100 text-xs">Entry-level jobs and programs</p>
                </button>

                <button class="need-btn bg-gradient-to-br from-purple-500 to-violet-500 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-file-shield text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Legal</div>
                            <div class="text-purple-200 text-xs">IDs / Rights</div>
                        </div>
                    </div>
                    <p class="text-purple-100 text-xs">ID replacement and legal aid</p>
                </button>

                <button class="need-btn bg-gradient-to-br from-gray-500 to-slate-600 text-white rounded-xl p-3 shadow-lg text-left">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                            <i class="fas fa-circle-question text-lg"></i>
                        </div>
                        <div>
                            <div class="text-base font-bold">Other</div>
                            <div class="text-gray-300 text-xs">General Help</div>
                        </div>
                    </div>
                    <p class="text-gray-200 text-xs">Not sure / Something else</p>
                </button>
            </div>

            <!-- Emergency Banner -->
            <div class="bg-red-50 border border-red-300 rounded-xl p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-red-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-phone-volume text-sm text-red-600"></i>
                    </div>
                    <div>
                        <p class="text-red-800 font-bold text-sm">Life-threatening emergency?</p>
                        <p class="text-red-600 text-xs">Call 911 immediately</p>
                    </div>
                </div>
                <button class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-4 py-2 rounded-lg">
                    <i class="fas fa-exclamation-triangle mr-1"></i>
                    EMERGENCY
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-3 flex justify-between items-center text-blue-200 text-xs">
            <p><i class="fas fa-clock mr-1"></i>Session timeout: 4:32</p>
            <p><i class="fas fa-shield-halved mr-1"></i>Anonymous Session</p>
        </div>
    </div>
</body>
</html>
