<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopeLink - Triage Questions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #3d7ab5 100%);
        }
        .option-btn:hover { transform: scale(1.01); }
    </style>
</head>
<body class="p-4">
    <div class="w-full max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-3">
            <button class="flex items-center gap-2 text-white/80 hover:text-white text-sm">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-white/20 backdrop-blur rounded-lg flex items-center justify-center">
                    <i class="fas fa-hands-holding-heart text-sm text-white"></i>
                </div>
                <span class="text-lg font-bold text-white">HopeLink</span>
            </div>
            <div class="text-white/60 text-sm">Step 2 of 3</div>
        </div>

        <!-- Progress Bar -->
        <div class="bg-white/20 rounded-full h-2 mb-4">
            <div class="bg-white rounded-full h-2 w-2/3"></div>
        </div>

        <!-- Main Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl p-4">
            <!-- Category Badge -->
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-red-500 to-rose-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-house-chimney text-lg text-white"></i>
                </div>
                <div>
                    <p class="text-gray-500 text-xs">Finding help for</p>
                    <p class="text-lg font-bold text-gray-800">Emergency Shelter</p>
                </div>
            </div>

            <!-- Question -->
            <div class="mb-4">
                <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs font-medium">Question 1 of 3</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2 mb-1">
                    Do you need a place to stay tonight?
                </h2>
                <p class="text-sm text-gray-500">This helps us find the right resources for your timeline</p>
            </div>

            <!-- Answer Options -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button class="option-btn bg-red-50 hover:bg-red-100 border-2 border-red-200 rounded-xl p-3 text-left">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-moon text-lg text-red-500"></i>
                        </div>
                        <div>
                            <p class="text-base font-bold text-gray-800">Yes, tonight</p>
                            <p class="text-gray-500 text-xs">Emergency shelter now</p>
                        </div>
                    </div>
                </button>

                <button class="option-btn bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 rounded-xl p-3 text-left">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-calendar-day text-lg text-amber-500"></i>
                        </div>
                        <div>
                            <p class="text-base font-bold text-gray-800">Within days</p>
                            <p class="text-gray-500 text-xs">Okay now, need help soon</p>
                        </div>
                    </div>
                </button>

                <button class="option-btn bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-xl p-3 text-left">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-calendar-week text-lg text-blue-500"></i>
                        </div>
                        <div>
                            <p class="text-base font-bold text-gray-800">Long-term</p>
                            <p class="text-gray-500 text-xs">Permanent housing help</p>
                        </div>
                    </div>
                </button>

                <button class="option-btn bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 rounded-xl p-3 text-left">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-emerald-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-snowflake text-lg text-emerald-500"></i>
                        </div>
                        <div>
                            <p class="text-base font-bold text-gray-800">Warming center</p>
                            <p class="text-gray-500 text-xs">Get warm for hours</p>
                        </div>
                    </div>
                </button>
            </div>

            <!-- Additional Quick Questions -->
            <div class="bg-gray-50 rounded-xl p-3 mb-4">
                <p class="font-semibold text-gray-700 text-sm mb-2">Quick info to help us match you:</p>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <p class="text-xs text-gray-500 mb-1">Have a phone?</p>
                        <div class="flex gap-1">
                            <button class="flex-1 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-medium hover:border-blue-400">Yes</button>
                            <button class="flex-1 py-1.5 bg-blue-500 text-white border border-blue-500 rounded-lg text-xs font-medium">No</button>
                        </div>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-1">Preferred area?</p>
                        <select class="w-full py-1.5 px-2 bg-white border border-gray-200 rounded-lg text-xs font-medium">
                            <option>Near this station</option>
                            <option>Manhattan</option>
                            <option>Brooklyn</option>
                        </select>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-1">Special needs?</p>
                        <div class="flex gap-1">
                            <button class="flex-1 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-medium hover:border-blue-400">Family</button>
                            <button class="flex-1 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-medium hover:border-blue-400">Pet</button>
                            <button class="flex-1 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-medium hover:border-blue-400">ADA</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="flex justify-between items-center">
                <button class="text-gray-500 hover:text-gray-700 font-medium text-sm">
                    <i class="fas fa-arrow-left mr-1"></i>Previous
                </button>
                <button class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold text-sm px-6 py-2.5 rounded-lg shadow-lg">
                    Find Resources <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-3 flex justify-between items-center text-blue-200 text-xs">
            <p><i class="fas fa-clock mr-1"></i>Session timeout: 3:45</p>
            <p><i class="fas fa-shield-halved mr-1"></i>Anonymous Session</p>
        </div>
    </div>
</body>
</html>
