<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hours</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2"><h1 class="display text-[30px] font-bold">My hours</h1><div class="nav !m-0"><div class="ib"><i class="fas fa-file-export"></i></div></div></div>

    <div class="card mt-3">
      <div class="flex items-end justify-between">
        <div><p class="label">This school year</p><p class="display text-[36px] font-extrabold leading-none mt-1">68<span class="text-[18px] text-[#8A9692] font-bold"> hrs</span></p></div>
        <span class="text-[12px] font-bold text-[#0F766E] bg-[#E6F5F2] px-2.5 py-1 rounded-full"><i class="fas fa-arrow-up mr-1"></i>12 this month</span>
      </div>
      <!-- bars -->
      <div class="flex items-end justify-between gap-2 h-[110px] mt-5">
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CCEFE9]" style="height:30%"></div><span class="text-[10px] font-semibold text-[#8A9692]">Jun</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CCEFE9]" style="height:55%"></div><span class="text-[10px] font-semibold text-[#8A9692]">Jul</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CCEFE9]" style="height:70%"></div><span class="text-[10px] font-semibold text-[#8A9692]">Aug</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CCEFE9]" style="height:40%"></div><span class="text-[10px] font-semibold text-[#8A9692]">Sep</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CCEFE9]" style="height:62%"></div><span class="text-[10px] font-semibold text-[#8A9692]">Oct</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg" style="height:88%;background:linear-gradient(180deg,#14B8A6,#0F766E)"></div><span class="text-[10px] font-bold text-[#0F766E]">Nov</span></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-3">
      <div class="card"><div class="gi !w-9 !h-9 !rounded-xl" style="background:linear-gradient(135deg,#5EEAD4,#0F766E)"><i class="fas fa-circle-check text-[14px]"></i></div><p class="display text-[28px] font-extrabold mt-2 leading-none">61</p><p class="text-[12px] font-semibold text-[#8A9692] mt-1">Verified hrs</p></div>
      <div class="card"><div class="gi !w-9 !h-9 !rounded-xl" style="background:linear-gradient(135deg,#FDE68A,#F59E0B)"><i class="fas fa-hourglass-half text-[14px]"></i></div><p class="display text-[28px] font-extrabold mt-2 leading-none">7</p><p class="text-[12px] font-semibold text-[#8A9692] mt-1">Awaiting sign-off</p></div>
    </div>

    <div class="flex items-center justify-between mt-6 mb-3"><h2 class="display text-[19px] font-bold">Recent</h2><span class="text-[12px] font-bold text-[#0F766E]">All 24</span></div>
    <div class="card !p-0 divide-y divide-[#EEF1EE]">
      <div class="flex items-center gap-3 p-3.5"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067638-image-1.png" class="w-11 h-11 rounded-xl object-cover"><div class="flex-1"><p class="text-[14px] font-bold">Code Club</p><p class="text-[12px] text-[#8A9692]">Nov 5</p></div><span class="text-[14px] font-bold">2.0h</span><span class="dot bg-[#0F766E]"></span></div>
      <div class="flex items-center gap-3 p-3.5"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067121-image-1.png" class="w-11 h-11 rounded-xl object-cover"><div class="flex-1"><p class="text-[14px] font-bold">Beach cleanup</p><p class="text-[12px] text-[#8A9692]">Nov 2</p></div><span class="text-[14px] font-bold">3.5h</span><span class="dot bg-[#F59E0B]"></span></div>
      <div class="flex items-center gap-3 p-3.5"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066266-image-1.png" class="w-11 h-11 rounded-xl object-cover"><div class="flex-1"><p class="text-[14px] font-bold">Community garden</p><p class="text-[12px] text-[#8A9692]">Oct 29</p></div><span class="text-[14px] font-bold">2.5h</span><span class="dot bg-[#0F766E]"></span></div>
    </div>

    <div class="btn ghost mt-4"><i class="fas fa-file-pdf text-[#F97362]"></i>Export for school &amp; college apps</div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-compass"></i><span>Discover</span></div>
    <div class="tab"><div class="tab-log"><i class="fas fa-clock"></i></div></div>
    <div class="tab"><i class="fas fa-user-group"></i><span>Squad</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
