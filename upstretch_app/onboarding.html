<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body style="background:#0B1F1C">
<div class="screen">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167069099-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,31,28,.15) 0%,rgba(11,31,28,.35) 40%,rgba(11,31,28,.97) 78%)"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute left-7 right-7 top-[86px] flex items-center gap-2 text-white">
    <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#14B8A6,#F97362)"><i class="fas fa-arrow-trend-up text-[15px]"></i></div>
    <span class="display text-[20px] font-bold">Upstretch</span>
  </div>
  <div class="absolute left-7 right-7 bottom-10 text-white">
    <div class="flex items-center mb-5">
      <img class="w-9 h-9 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067197-image-1.png"><img class="w-9 h-9 av -ml-3" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067739-image-1.png"><img class="w-9 h-9 av -ml-3" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067436-image-1.png">
      <span class="ml-3 text-[13px] font-semibold opacity-90">Your friends are already here</span>
    </div>
    <h1 class="display text-[44px] font-extrabold leading-[1.02]">Volunteer where you'll actually grow.</h1>
    <p class="text-[16px] opacity-75 mt-4 leading-relaxed">Matched to your skills. One step past your comfort zone. Every hour logged.</p>
    <div class="grid grid-cols-3 gap-2 mt-7">
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><i class="fas fa-compass text-[#5EEAD4]"></i><p class="text-[12px] font-semibold mt-2">Find</p></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><i class="fas fa-mountain text-[#FDBA74]"></i><p class="text-[12px] font-semibold mt-2">Stretch</p></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><i class="fas fa-clock text-[#A5B4FC]"></i><p class="text-[12px] font-semibold mt-2">Log</p></div>
    </div>
    <div class="btn mt-7 bg-white text-[#0B1F1C]">Take the 3-min skill check <i class="fas fa-arrow-right"></i></div>
    <p class="text-center text-[13px] opacity-60 mt-4">I have an account &middot; <span class="font-semibold opacity-100">Sign in with school</span></p>
  </div>
</div>
</body>
</html>
