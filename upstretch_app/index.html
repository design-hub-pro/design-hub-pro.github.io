<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upstretch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#14211F}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2f2e,#0b0f0e);box-shadow:0 50px 80px -30px rgba(15,60,55,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F6F7F4}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#14B8A6,#0F766E 50%,#F97362)"><i class="fa-solid fa-arrow-trend-up text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:'Bricolage Grotesque',sans-serif">Upstretch</h1>
  <p class="mt-3 text-[19px] text-gray-500">Volunteering matched to your skills, one step past your comfort zone, with friends.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-teal-50 text-teal-700">Volunteering</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Skill Growth</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Hour Tracking</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Social</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="assess.html" scrolling="no" title="assess"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="discover.html" scrolling="no" title="discover"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="opportunity.html" scrolling="no" title="opportunity"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="prep.html" scrolling="no" title="prep"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="stretch.html" scrolling="no" title="stretch"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="log.html" scrolling="no" title="log"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="hours.html" scrolling="no" title="hours"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="squad.html" scrolling="no" title="squad"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="feed.html" scrolling="no" title="feed"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
</div></main>
</body></html>
