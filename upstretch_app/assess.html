<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Check</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full">
    <div class="nav"><div class="ib"><i class="fas fa-chevron-left"></i></div><span class="text-[13px] font-bold text-[#8A9692]">Skill check &middot; 4 of 6</span><div class="ib"><i class="fas fa-xmark"></i></div></div>
    <div class="track"><div class="fill" style="width:66%"></div></div>

    <h1 class="display text-[28px] font-bold leading-tight mt-6">How comfortable are you leading a group?</h1>
    <p class="text-[14px] text-[#8A9692] mt-2">Be honest. This sets your stretch level.</p>

    <div class="grid grid-cols-5 gap-2 mt-5">
      <div class="card !p-0 h-[74px] flex items-center justify-center"><i class="fas fa-face-flushed text-[24px] text-[#C3CCC8]"></i></div>
      <div class="card !p-0 h-[74px] flex flex-col items-center justify-center ring-2 ring-[#F97362] bg-[#FFF4F1]"><i class="fas fa-face-grimace text-[24px] text-[#F97362]"></i><span class="text-[10px] font-bold text-[#F97362] mt-1">Nervous</span></div>
      <div class="card !p-0 h-[74px] flex items-center justify-center"><i class="fas fa-face-meh text-[24px] text-[#C3CCC8]"></i></div>
      <div class="card !p-0 h-[74px] flex items-center justify-center"><i class="fas fa-face-smile text-[24px] text-[#C3CCC8]"></i></div>
      <div class="card !p-0 h-[74px] flex items-center justify-center"><i class="fas fa-face-grin-stars text-[24px] text-[#C3CCC8]"></i></div>
    </div>

    <!-- radar -->
    <div class="card mt-6">
      <div class="flex items-center justify-between"><span class="label">Your profile so far</span><span class="text-[11px] font-bold text-[#0F766E] bg-[#E6F5F2] px-2 py-1 rounded-full">Live</span></div>
      <svg viewBox="0 0 300 230" class="w-full mt-2">
        <g transform="translate(150,118)" fill="none" stroke="#E2E8E4">
          <polygon points="0,-95 90,-29 56,77 -56,77 -90,-29"/>
          <polygon points="0,-63 60,-19 37,51 -37,51 -60,-19"/>
          <polygon points="0,-32 30,-10 19,26 -19,26 -30,-10"/>
        </g>
        <g transform="translate(150,118)">
          <polygon points="0,-80 78,-25 26,36 -22,30 -54,-17" fill="rgba(20,184,166,.22)" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="0" cy="-80" r="4" fill="#0F766E"/><circle cx="78" cy="-25" r="4" fill="#0F766E"/><circle cx="26" cy="36" r="4" fill="#F97362"/><circle cx="-22" cy="30" r="4" fill="#F97362"/><circle cx="-54" cy="-17" r="4" fill="#0F766E"/>
        </g>
        <g font-family="Inter" font-size="11" font-weight="700" fill="#4B5A56" text-anchor="middle">
          <text x="150" y="14">Tech</text><text x="262" y="92">Teaching</text><text x="216" y="216">Leading</text><text x="84" y="216">Speaking</text><text x="38" y="92">Care</text>
        </g>
      </svg>
      <div class="flex gap-4 text-[12px] font-semibold text-[#4B5A56]"><span><span class="dot bg-[#0F766E] mr-1.5"></span>Strength</span><span><span class="dot bg-[#F97362] mr-1.5"></span>Stretch area</span></div>
    </div>

    <div class="flex flex-wrap gap-2 mt-5">
      <span class="chip active"><i class="fas fa-code"></i>Python</span>
      <span class="chip active"><i class="fas fa-language"></i>Hindi</span>
      <span class="chip active"><i class="fas fa-calculator"></i>Math tutor</span>
      <span class="chip"><i class="fas fa-plus"></i>Add skill</span>
    </div>

    <div class="btn primary mt-7">Next <i class="fas fa-arrow-right"></i></div>
  </div>
</div>
</body>
</html>
