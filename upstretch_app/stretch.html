<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stretch Zone</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <h1 class="display text-[30px] font-bold mt-2">Stretch zone</h1>
    <p class="text-[14px] text-[#8A9692] mt-1">Growth happens one ring out.</p>

    <!-- rings -->
    <div class="relative mx-auto mt-4 w-[300px] h-[300px]">
      <div class="absolute inset-0 rounded-full" style="background:radial-gradient(circle,#FEE2E2 0%,#FEE2E2 100%)"></div>
      <div class="absolute inset-[40px] rounded-full bg-[#FFE4D6]"></div>
      <div class="absolute inset-[96px] rounded-full bg-[#CCEFE9] flex items-center justify-center"><span class="text-[12px] font-bold text-[#0F766E]">Comfort</span></div>
      <span class="absolute top-[52px] left-1/2 -translate-x-1/2 text-[12px] font-bold text-[#F97362]">Stretch</span>
      <span class="absolute top-[14px] left-1/2 -translate-x-1/2 text-[11px] font-bold text-[#DC2626]">Big leap</span>
      <!-- you -->
      <div class="absolute" style="left:186px;top:178px"><img class="w-11 h-11 av shadow-lg" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067197-image-1.png" style="border-width:3px;border-color:#F97362"></div>
      <div class="absolute w-3 h-3 rounded-full bg-[#0F766E]" style="left:120px;top:150px"></div>
      <div class="absolute w-3 h-3 rounded-full bg-[#0F766E]" style="left:160px;top:118px"></div>
      <div class="absolute w-3 h-3 rounded-full bg-[#F97362]" style="left:70px;top:190px"></div>
    </div>
    <div class="flex justify-center gap-6 mt-1">
      <div class="text-center"><p class="display text-[30px] font-extrabold text-[#0F766E] leading-none">7</p><p class="text-[11px] font-semibold text-[#8A9692]">Comfort</p></div>
      <div class="text-center"><p class="display text-[30px] font-extrabold text-[#F97362] leading-none">3</p><p class="text-[11px] font-semibold text-[#8A9692]">Stretch</p></div>
      <div class="text-center"><p class="display text-[30px] font-extrabold text-[#DC2626] leading-none">0</p><p class="text-[11px] font-semibold text-[#8A9692]">Big leap</p></div>
    </div>

    <div class="flex items-center justify-between mt-6 mb-3"><h2 class="display text-[19px] font-bold">This week's dares</h2><span class="text-[12px] font-bold text-[#F97362]">+40 XP</span></div>
    <div class="space-y-3">
      <div class="card flex items-center gap-3">
        <div class="gi" style="background:linear-gradient(135deg,#FDBA74,#F97362)"><i class="fas fa-microphone"></i></div>
        <div class="flex-1"><p class="text-[14px] font-bold">Lead a 5-min intro</p><div class="track mt-2"><div class="fill coral" style="width:0%"></div></div></div>
        <span class="text-[12px] font-bold text-[#F97362]">Try</span>
      </div>
      <div class="card flex items-center gap-3">
        <div class="gi" style="background:linear-gradient(135deg,#F9A8D4,#DB2777)"><i class="fas fa-handshake"></i></div>
        <div class="flex-1"><p class="text-[14px] font-bold">Volunteer with someone new</p><div class="track mt-2"><div class="fill coral" style="width:50%"></div></div></div>
        <span class="text-[12px] font-bold text-[#8A9692]">1/2</span>
      </div>
      <div class="card flex items-center gap-3 opacity-90">
        <div class="gi" style="background:linear-gradient(135deg,#5EEAD4,#0F766E)"><i class="fas fa-check"></i></div>
        <div class="flex-1"><p class="text-[14px] font-bold line-through text-[#8A9692]">Try a new cause area</p></div>
        <i class="fas fa-circle-check text-[#0F766E] text-[20px]"></i>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-compass"></i><span>Discover</span></div>
    <div class="tab"><div class="tab-log"><i class="fas fa-clock"></i></div></div>
    <div class="tab"><i class="fas fa-user-group"></i><span>Squad</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
