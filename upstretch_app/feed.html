<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2"><h1 class="display text-[30px] font-bold">Feed</h1><div class="w-10 h-10 rounded-2xl bg-white shadow-sm flex items-center justify-center relative"><i class="fas fa-bell"></i><span class="absolute top-2 right-2.5 dot bg-[#F97362]"></span></div></div>

    <!-- stories row -->
    <div class="hscroll mt-3">
      <div class="flex flex-col items-center gap-1 flex-shrink-0"><div class="w-[62px] h-[62px] rounded-full border-2 border-dashed border-[#C3CCC8] flex items-center justify-center text-[#8A9692]"><i class="fas fa-plus"></i></div><span class="text-[11px] font-semibold">Share</span></div>
      <div class="flex flex-col items-center gap-1 flex-shrink-0"><div class="p-[3px] rounded-full" style="background:linear-gradient(135deg,#14B8A6,#F97362)"><img class="w-[56px] h-[56px] av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067739-image-1.png"></div><span class="text-[11px] font-semibold">Marcus</span></div>
      <div class="flex flex-col items-center gap-1 flex-shrink-0"><div class="p-[3px] rounded-full" style="background:linear-gradient(135deg,#14B8A6,#F97362)"><img class="w-[56px] h-[56px] av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067436-image-1.png"></div><span class="text-[11px] font-semibold">Kenji</span></div>
      <div class="flex flex-col items-center gap-1 flex-shrink-0"><div class="p-[3px] rounded-full bg-[#E2E8E4]"><img class="w-[56px] h-[56px] av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066354-image-1.png"></div><span class="text-[11px] font-semibold">Oak Grove</span></div>
      <div class="flex flex-col items-center gap-1 flex-shrink-0"><div class="p-[3px] rounded-full" style="background:linear-gradient(135deg,#14B8A6,#F97362)"><img class="w-[56px] h-[56px] av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067197-image-1.png"></div><span class="text-[11px] font-semibold">Squad</span></div>
    </div>

    <!-- post: stretch moment -->
    <div class="card mt-3 !p-0 overflow-hidden">
      <div class="flex items-center gap-3 p-3.5"><img class="w-10 h-10 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067739-image-1.png"><div class="flex-1"><p class="text-[14px] font-bold">Marcus <span class="font-medium text-[#8A9692]">took a big leap</span></p><p class="text-[11px] text-[#8A9692]">2h &middot; Youth Voice</p></div><span class="text-[11px] font-bold bg-[#FEE2E2] text-[#DC2626] px-2 py-1 rounded-full"><i class="fas fa-mountain mr-1"></i>+3</span></div>
      <div class="relative h-[230px]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066997-image-1.png" class="w-full h-full object-cover"><div class="absolute inset-0 flex items-center justify-center"><div class="play"><i class="fas fa-play ml-1"></i></div></div><span class="dur">0:28</span></div>
      <div class="px-3.5 py-3">
        <p class="text-[14px] leading-snug">First time hosting storytime. Hands were shaking. 14 kids stayed to the end.</p>
        <div class="flex items-center gap-5 mt-3 text-[13px] font-semibold text-[#4B5A56]"><span class="text-[#F97362]"><i class="fas fa-hands-clapping mr-1.5"></i>48</span><span><i class="far fa-comment mr-1.5"></i>9</span><span class="ml-auto text-[#0F766E]"><i class="fas fa-plus mr-1"></i>Join next one</span></div>
      </div>
    </div>

    <!-- activity -->
    <div class="card mt-3 flex items-center gap-3">
      <div class="flex flex-shrink-0"><img class="w-9 h-9 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067436-image-1.png"><img class="w-9 h-9 av -ml-3" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067739-image-1.png"><img class="w-9 h-9 av -ml-3" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067197-image-1.png"></div>
      <p class="text-[13px] font-semibold flex-1 leading-snug">Kenji + 2 signed up for <span class="text-[#0F766E]">Beach cleanup</span> Sat</p>
      <span class="text-[12px] font-bold text-white bg-[#0F766E] px-3 py-1.5 rounded-full">Me too</span>
    </div>
    <div class="card mt-3 flex items-center gap-3">
      <div class="gi" style="background:linear-gradient(135deg,#FDE68A,#F59E0B)"><i class="fas fa-trophy"></i></div>
      <p class="text-[13px] font-semibold flex-1 leading-snug">Kenji earned <b>First Aid Ready</b></p>
      <span class="text-[13px] font-bold text-[#F97362]"><i class="fas fa-hands-clapping"></i></span>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-compass"></i><span>Discover</span></div>
    <div class="tab"><div class="tab-log"><i class="fas fa-clock"></i></div></div>
    <div class="tab active"><i class="fas fa-user-group"></i><span>Squad</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
