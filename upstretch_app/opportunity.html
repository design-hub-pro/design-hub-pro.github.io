<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="absolute top-0 left-0 right-0 h-[360px]">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066186-image-1.png" class="w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 35%)"></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute top-[66px] left-7 right-7 flex justify-between">
    <div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-chevron-left"></i></div>
    <div class="flex gap-2"><div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-share-nodes"></i></div><div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-bookmark text-[#0F766E]"></i></div></div>
  </div>

  <div class="absolute left-0 right-0 bottom-0 top-[320px] bg-[#F6F7F4] rounded-t-[32px] px-7 pt-6 overflow-y-auto pb-[120px]">
    <div class="flex items-center gap-2">
      <img class="w-7 h-7 rounded-lg object-cover" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066354-image-1.png"><span class="text-[13px] font-semibold text-[#4B5A56]">Oak Grove Senior Center</span><i class="fas fa-circle-check text-[#0F766E] text-[13px]"></i>
    </div>
    <h1 class="display text-[28px] font-bold leading-tight mt-2">Tech Buddy for Seniors</h1>

    <div class="grid grid-cols-3 gap-2 mt-4">
      <div class="card !p-3 text-center"><p class="display text-[28px] font-extrabold text-[#0F766E] leading-none">92<span class="text-[16px]">%</span></p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">Fit</p></div>
      <div class="card !p-3 text-center"><p class="display text-[28px] font-extrabold leading-none">3<span class="text-[16px]">h</span></p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">Per visit</p></div>
      <div class="card !p-3 text-center"><p class="display text-[28px] font-extrabold text-[#F97362] leading-none">+2</p><p class="text-[11px] font-semibold text-[#8A9692] mt-1">Stretch</p></div>
    </div>

    <!-- why it fits -->
    <div class="card mt-4">
      <p class="label mb-3">Why you</p>
      <div class="space-y-2.5">
        <div class="flex items-center gap-3"><div class="gi !w-9 !h-9 !rounded-xl" style="background:linear-gradient(135deg,#5EEAD4,#0F766E)"><i class="fas fa-laptop text-[14px]"></i></div><span class="text-[14px] font-semibold flex-1">Uses your tech skills</span><span class="dot bg-[#0F766E]"></span></div>
        <div class="flex items-center gap-3"><div class="gi !w-9 !h-9 !rounded-xl" style="background:linear-gradient(135deg,#A5B4FC,#6366F1)"><i class="fas fa-language text-[14px]"></i></div><span class="text-[14px] font-semibold flex-1">Hindi speakers needed</span><span class="dot bg-[#0F766E]"></span></div>
        <div class="flex items-center gap-3"><div class="gi !w-9 !h-9 !rounded-xl" style="background:linear-gradient(135deg,#FDBA74,#F97362)"><i class="fas fa-comments text-[14px]"></i></div><span class="text-[14px] font-semibold flex-1">Stretches: patient teaching</span><span class="dot bg-[#F97362]"></span></div>
      </div>
    </div>

    <!-- friends -->
    <div class="card mt-3 flex items-center gap-3">
      <div class="flex"><img class="w-9 h-9 av" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067739-image-1.png"><img class="w-9 h-9 av -ml-3" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167067436-image-1.png"><div class="w-9 h-9 rounded-full -ml-3 bg-[#E6F5F2] border-2 border-white text-[11px] font-bold text-[#0F766E] flex items-center justify-center">+5</div></div>
      <p class="text-[13px] font-semibold flex-1">Marcus, Kenji and 5 classmates going</p>
    </div>

    <!-- prep -->
    <div class="card mt-3 flex items-center gap-3">
      <div class="gi" style="background:linear-gradient(135deg,#A5B4FC,#6366F1)"><i class="fas fa-graduation-cap"></i></div>
      <div class="flex-1"><p class="text-[14px] font-bold">Prep path &middot; 3 lessons</p><p class="text-[12px] text-[#8A9692]">22 min before Saturday</p></div>
      <span class="text-[12px] font-bold text-[#6366F1]">Start</span>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-7 pb-8 pt-4 bg-gradient-to-t from-[#F6F7F4] via-[#F6F7F4] to-transparent flex gap-3">
    <div class="btn ghost w-[54px] !px-0"><i class="fas fa-user-plus"></i></div>
    <div class="btn primary flex-1">Sign up &middot; Sat 10 AM</div>
  </div>
</div>
</body>
</html>
