<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Hours</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body style="background:#0B1F1C">
<div class="screen" style="background:linear-gradient(180deg,#0F766E 0%,#0B1F1C 62%)">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full text-white">
    <div class="nav"><div class="ib !bg-white/15 !text-white !shadow-none"><i class="fas fa-xmark"></i></div><span class="text-[13px] font-bold opacity-80">Checked in &middot; 10:02 AM</span><div class="ib !bg-white/15 !text-white !shadow-none"><i class="fas fa-camera"></i></div></div>

    <div class="flex items-center gap-3 mt-2">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794167066186-image-1.png" class="w-12 h-12 rounded-2xl object-cover">
      <div><p class="text-[15px] font-bold">Tech Buddy for Seniors</p><p class="text-[12px] opacity-70"><span class="dot bg-[#5EEAD4] mr-1"></span>On site &middot; Oak Grove Center</p></div>
    </div>

    <!-- timer -->
    <div class="relative mx-auto mt-8 w-[270px] h-[270px]">
      <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90"><circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,.12)" stroke-width="5" fill="none"/><circle cx="50" cy="50" r="45" stroke="#5EEAD4" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="120"/></svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="display text-[56px] font-extrabold leading-none tracking-tight">1:43</span>
        <span class="text-[13px] opacity-70 mt-2">of 3:00 planned</span>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-8">
      <div class="rounded-2xl bg-white/10 p-3 text-center"><i class="fas fa-location-dot text-[#5EEAD4]"></i><p class="text-[11px] font-semibold mt-1.5 opacity-80">GPS ok</p></div>
      <div class="rounded-2xl bg-white/10 p-3 text-center"><i class="fas fa-qrcode text-[#5EEAD4]"></i><p class="text-[11px] font-semibold mt-1.5 opacity-80">QR scanned</p></div>
      <div class="rounded-2xl bg-white/10 p-3 text-center"><i class="fas fa-user-check text-[#FDBA74]"></i><p class="text-[11px] font-semibold mt-1.5 opacity-80">Sign-off</p></div>
    </div>

    <div class="rounded-3xl bg-white/10 p-4 mt-4">
      <p class="text-[12px] font-bold opacity-70 uppercase tracking-wider">Quick reflection</p>
      <div class="flex gap-2 mt-3">
        <span class="chip !bg-white/15 !text-white !shadow-none">Easy</span>
        <span class="chip !bg-[#F97362] !text-white !shadow-none"><i class="fas fa-mountain"></i>Stretched me</span>
        <span class="chip !bg-white/15 !text-white !shadow-none">Too much</span>
      </div>
    </div>

    <div class="btn mt-6 bg-white text-[#0B1F1C]"><i class="fas fa-stop"></i>Check out &amp; send to Elena</div>
  </div>
</div>
</body>
</html>
