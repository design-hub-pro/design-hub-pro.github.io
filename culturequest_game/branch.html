<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branches</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full">
    <div class="nav"><div class="ib"><i class="fas fa-chevron-left"></i></div><span class="text-[14px] font-bold">Your path</span><div class="ib"><i class="fas fa-share-nodes"></i></div></div>
    <h1 class="display text-[28px] font-bold leading-tight">The group project split</h1>
    <p class="text-[13px] muted font-semibold mt-1">3 of 7 endings found</p>

    <div class="card mt-4 !p-0 relative h-[440px] overflow-hidden" style="background:radial-gradient(circle at 50% 0%,#F0FAF6,#fff 60%)">
      <svg class="absolute inset-0" width="100%" height="440" viewBox="0 0 380 440" fill="none" stroke-width="4" stroke-linecap="round">
        <path d="M190 50 V110" stroke="#0E8A6B"/>
        <path d="M190 110 C190 140 80 140 80 170" stroke="#E5533B" stroke-dasharray="2 9"/>
        <path d="M190 110 V170" stroke="#0E8A6B"/>
        <path d="M190 110 C190 140 300 140 300 170" stroke="#D9D6CD"/>
        <path d="M80 196 V270" stroke="#E5533B" stroke-dasharray="2 9"/>
        <path d="M190 196 C190 230 130 240 130 270" stroke="#0E8A6B"/>
        <path d="M190 196 C190 230 250 240 250 270" stroke="#D9D6CD"/>
        <path d="M130 296 V370" stroke="#0E8A6B"/>
        <path d="M250 296 V370" stroke="#D9D6CD"/>
        <path d="M300 196 C300 300 330 330 330 370" stroke="#D9D6CD"/>
      </svg>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:164px;top:24px;background:#16213A;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-play"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:164px;top:84px;background:#0E8A6B;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-comments"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:54px;top:170px;background:#E5533B;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-xmark"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:164px;top:170px;background:#0E8A6B;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-check"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:274px;top:170px;background:#C9C6BD;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-question"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:54px;top:270px;background:#E5533B;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-face-frown"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:104px;top:270px;background:#0E8A6B;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-handshake"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:224px;top:270px;background:#C9C6BD;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-lock"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:104px;top:370px;background:#E79A12;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-trophy"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:224px;top:370px;background:#C9C6BD;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-lock"></i></div>
      <div class="absolute w-[52px] h-[52px] rounded-full flex items-center justify-center text-white text-[17px] border-4 border-white" style="left:304px;top:370px;background:#C9C6BD;box-shadow:0 8px 18px rgba(22,33,58,.18)"><i class="fas fa-lock"></i></div>
      <div class="absolute left-[14px] top-[232px] text-[10px] font-bold coral">Emma goes quiet</div>
      <div class="absolute left-[64px] top-[425px] text-[11px] font-extrabold text-[#B66E00]">Best ending: you lead research</div>
    </div>

    <div class="flex items-center gap-4 mt-4 text-[12px] font-bold">
      <span class="flex items-center gap-1.5"><span class="dot" style="background:#0E8A6B"></span>Your path</span>
      <span class="flex items-center gap-1.5"><span class="dot" style="background:#E5533B"></span>First try</span>
      <span class="flex items-center gap-1.5"><span class="dot" style="background:#C9C6BD"></span>Unexplored</span>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-5">
      <div class="btn ghost"><i class="fas fa-shuffle"></i>Try a branch</div>
      <div class="btn primary">Next scene<i class="fas fa-arrow-right"></i></div>
    </div>
  </div>
</div>
</body>
</html>
