<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen" style="background:#0E1424">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868155825-image-1.png" class="absolute inset-0 w-full h-[600px] object-cover" alt="Group project scene">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,20,36,.35) 0%,rgba(14,20,36,0) 22%,rgba(14,20,36,.1) 40%,#0E1424 62%)"></div>
  <div class="relative z-10 px-7 flex items-center justify-between mt-2 text-white">
    <div class="ib glass"><i class="fas fa-xmark"></i></div>
    <div class="flex gap-1.5"><span class="w-7 h-1.5 rounded-full bg-[#3FD3A6]"></span><span class="w-7 h-1.5 rounded-full bg-[#3FD3A6]"></span><span class="w-7 h-1.5 rounded-full bg-white"></span><span class="w-7 h-1.5 rounded-full bg-white/30"></span><span class="w-7 h-1.5 rounded-full bg-white/30"></span></div>
    <div class="ib glass"><i class="fas fa-closed-captioning"></i></div>
  </div>
  <div class="absolute left-7 top-[300px] flex items-center gap-2 text-white"><span class="dot !w-2.5 !h-2.5 bg-[#E5533B] animate-pulse"></span><span class="text-[12px] font-bold">Real clip · filmed by a 10th grader</span></div>
  <div class="absolute inset-x-0 bottom-0 px-7 pb-9 text-white">
    <div class="flex items-center gap-2 mb-2"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156438-image-1.png" class="w-8 h-8 av !border-[#0E1424]" alt=""><span class="text-[13px] font-bold">Emma</span><span class="text-[12px] text-white/50">· group leader</span></div>
    <div class="bubble !text-[#16213A] text-[18px] font-semibold leading-snug">"So I was thinking you could just do the slides? We already split the research."</div>
    <p class="cn text-[13px] text-white/50 mt-2">"那你就做幻灯片吧？研究部分我们已经分好了。"</p>
    <div class="h-1 rounded-full bg-white/15 mt-5"><div class="h-full w-[78%] rounded-full bg-white"></div></div>
    <div class="flex justify-between text-[11px] text-white/50 font-bold mt-1.5"><span>0:19</span><span>0:24</span></div>
    <p class="label !text-white/50 mt-5 mb-3">You want the research part. What do you say?</p>
    <div class="grid grid-cols-[1fr_auto] gap-3">
      <div class="btn primary"><i class="fas fa-microphone"></i>Say it out loud</div>
      <div class="btn !w-[56px] !text-white" style="background:rgba(255,255,255,.12)"><i class="fas fa-keyboard"></i></div>
    </div>
  </div>
</div>
</body>
</html>
