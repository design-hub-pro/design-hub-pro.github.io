<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen" style="background:#0E1424">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156038-image-1.png" class="absolute inset-0 w-full h-[640px] object-cover" alt="School cafeteria">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,20,36,.15) 0%,rgba(14,20,36,.35) 35%,#0E1424 66%)"></div>
  <div class="absolute inset-x-0 bottom-0 px-7 pb-10 text-white">
    <div class="flex items-center gap-2 mb-5"><div class="gi g-jade !w-10 !h-10 !rounded-[13px]"><i class="fas fa-compass"></i></div><span class="display text-[20px] font-bold">CultureQuest</span></div>
    <h1 class="display text-[42px] font-extrabold leading-[1.02]">Practice school<br>before school.</h1>
    <p class="cn text-[17px] mt-3 text-white/70">先在游戏里练习，再走进真实的美国校园</p>
    <div class="flex gap-2 mt-6">
      <span class="chip !bg-white/12 !text-white !shadow-none" style="background:rgba(255,255,255,.12)"><i class="fas fa-film text-[#3FD3A6]"></i>Real clips</span>
      <span class="chip !text-white !shadow-none" style="background:rgba(255,255,255,.12)"><i class="fas fa-code-branch text-[#FFD66E]"></i>Branching</span>
      <span class="chip !text-white !shadow-none" style="background:rgba(255,255,255,.12)"><i class="fas fa-wave-square text-[#FFA07F]"></i>AI tone check</span>
    </div>
    <div class="card !bg-white/8 !shadow-none mt-6 !p-4 flex items-center gap-3" style="background:rgba(255,255,255,.08)">
      <div class="stack flex"><img class="w-9 h-9 av !border-[#0E1424]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156282-image-1.png" alt=""><img class="w-9 h-9 av !border-[#0E1424]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868155710-image-1.png" alt=""><img class="w-9 h-9 av !border-[#0E1424]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156438-image-1.png" alt=""></div>
      <p class="text-[13px] text-white/80 leading-snug">Scenes filmed by newcomer students in real U.S. schools</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-6">
      <div class="btn !bg-white/10 !text-white" style="background:rgba(255,255,255,.1)"><span class="cn">中文</span><i class="fas fa-arrow-right-arrow-left text-xs opacity-60"></i>EN</div>
      <div class="btn primary">Start quest <i class="fas fa-arrow-right"></i></div>
    </div>
  </div>
</div>
</body>
</html>
