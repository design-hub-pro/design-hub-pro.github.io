<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quests</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="nav"><h1 class="display text-[30px] font-bold">Quest map</h1><div class="ib"><i class="fas fa-sliders"></i></div></div>
    <div class="flex gap-2 mb-4 overflow-x-auto -mx-7 px-7"><span class="chip active">All</span><span class="chip">Lunch</span><span class="chip">Class</span><span class="chip">Teachers</span><span class="chip">Sports</span></div>

    <div class="relative">
      <div class="absolute left-[27px] top-6 bottom-6 w-[3px] rounded bg-[#E9E6DE]"></div>
      <div class="absolute left-[27px] top-6 h-[44%] w-[3px] rounded bg-[#0E8A6B]"></div>

      <div class="relative flex gap-4 items-center mb-4">
        <div class="gi g-jade !w-14 !h-14 !rounded-full z-10 border-4 border-[#F6F5F1]"><i class="fas fa-check"></i></div>
        <div class="card flex-1 !p-2.5 flex gap-3 items-center"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156038-image-1.png" class="w-[74px] h-[60px] rounded-[14px] object-cover" alt=""><div class="flex-1"><p class="text-[14px] font-bold">Finding a lunch table</p><p class="text-[12px] text-[#E79A12]"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></p></div></div>
      </div>
      <div class="relative flex gap-4 items-center mb-4">
        <div class="gi g-jade !w-14 !h-14 !rounded-full z-10 border-4 border-[#F6F5F1]"><i class="fas fa-check"></i></div>
        <div class="card flex-1 !p-2.5 flex gap-3 items-center"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868157058-image-1.png" class="w-[74px] h-[60px] rounded-[14px] object-cover" alt=""><div class="flex-1"><p class="text-[14px] font-bold">Speaking up in class</p><p class="text-[12px] text-[#E79A12]"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i></p></div></div>
      </div>
      <div class="relative flex gap-4 items-start mb-4">
        <div class="gi g-gold !w-14 !h-14 !rounded-full z-10 border-4 border-[#F6F5F1] mt-[64px]" style="box-shadow:0 0 0 6px rgba(231,154,18,.18)"><i class="fas fa-play ml-0.5"></i></div>
        <div class="hero flex-1 h-[188px] !rounded-[22px]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868155825-image-1.png" alt=""><div class="fade"></div>
          <div class="absolute bottom-0 p-4 text-white w-full"><span class="tag risk-mid">In progress</span><p class="display text-[20px] font-bold mt-1.5 leading-tight">The group project split</p><div class="flex items-center gap-2 mt-2"><div class="h-1.5 flex-1 rounded-full bg-white/25"><div class="h-full w-3/5 rounded-full bg-[#3FD3A6]"></div></div><span class="text-[11px] font-bold">3/5</span></div></div>
        </div>
      </div>
      <div class="relative flex gap-4 items-center mb-4 opacity-60">
        <div class="gi g-ink !w-14 !h-14 !rounded-full z-10 border-4 border-[#F6F5F1]"><i class="fas fa-lock"></i></div>
        <div class="card flex-1 !p-2.5 flex gap-3 items-center"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868155757-image-1.png" class="w-[74px] h-[60px] rounded-[14px] object-cover grayscale" alt=""><div class="flex-1"><p class="text-[14px] font-bold">Disagreeing with a teacher</p><p class="text-[12px] muted font-semibold">Needs 2 stars on Ch. 2</p></div></div>
      </div>
      <div class="relative flex gap-4 items-center opacity-60">
        <div class="gi g-ink !w-14 !h-14 !rounded-full z-10 border-4 border-[#F6F5F1]"><i class="fas fa-lock"></i></div>
        <div class="card flex-1 !p-2.5 flex gap-3 items-center"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156560-image-1.png" class="w-[74px] h-[60px] rounded-[14px] object-cover grayscale" alt=""><div class="flex-1"><p class="text-[14px] font-bold">Picked last in PE</p><p class="text-[12px] muted font-semibold">Boss scene</p></div></div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i>Home</div>
    <div class="tab active"><i class="fas fa-map"></i>Quests</div>
    <div class="tab-mic"><i class="fas fa-microphone"></i></div>
    <div class="tab"><i class="fas fa-book-open"></i>Phrases</div>
    <div class="tab"><i class="fas fa-video"></i>Clips</div>
  </div>
</div>
</body>
</html>
