<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respond</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar ">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content full">
    <div class="nav"><div class="ib"><i class="fas fa-chevron-left"></i></div><span class="text-[14px] font-bold">Scene 3 · Your turn</span><div class="ib"><i class="fas fa-lightbulb text-[#E79A12]"></i></div></div>
    <div class="flex gap-3 items-end">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794868156438-image-1.png" class="w-10 h-10 av" alt="">
      <div class="bubble text-[15px] font-semibold">So you could just do the slides? We already split the research.</div>
    </div>
    <div class="flex justify-end mt-4"><div class="bubble me text-[16px] font-semibold max-w-[300px]">No. I want research. Slides is easy work<span class="inline-block w-[2px] h-4 bg-[#3FD3A6] ml-1 align-middle animate-pulse"></span></div></div>
    <p class="text-right text-[11px] muted font-bold mt-1.5"><i class="fas fa-circle text-[7px] coral mr-1"></i>Live transcript</p>

    <div class="flex flex-col items-center mt-12">
      <div class="wave flex items-center h-[80px]"><span style="height:10px"></span><span style="height:18px"></span><span style="height:30px"></span><span style="height:22px"></span><span style="height:40px"></span><span style="height:54px"></span><span style="height:36px"></span><span style="height:62px"></span><span style="height:48px"></span><span style="height:28px"></span><span style="height:44px"></span><span style="height:70px"></span><span style="height:52px"></span><span style="height:34px"></span><span style="height:58px"></span><span style="height:40px"></span><span style="height:24px"></span><span style="height:46px"></span><span style="height:32px"></span><span style="height:18px"></span><span style="height:26px"></span><span style="height:14px"></span><span style="height:20px"></span><span style="height:10px"></span><span style="height:8px"></span></div>
      <p class="num display text-[34px] font-bold mt-4">0:06</p>
      <p class="text-[13px] muted font-semibold">Listening for tone, pace and words</p>
      <div class="relative mt-8">
        <div class="absolute -inset-5 rounded-full bg-[#0E8A6B]/10"></div>
        <div class="absolute -inset-10 rounded-full bg-[#0E8A6B]/5"></div>
        <div class="relative w-[96px] h-[96px] rounded-full g-jade flex items-center justify-center text-white text-[30px]" style="box-shadow:0 16px 34px rgba(14,138,107,.4)"><i class="fas fa-stop"></i></div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-14">
      <div class="card !p-3 text-center"><i class="fas fa-gauge-high jade"></i><p class="text-[12px] font-bold mt-1">Pace</p><p class="text-[11px] muted">Good</p></div>
      <div class="card !p-3 text-center"><i class="fas fa-volume-high text-[#E79A12]"></i><p class="text-[12px] font-bold mt-1">Volume</p><p class="text-[11px] muted">A bit loud</p></div>
      <div class="card !p-3 text-center"><i class="fas fa-language text-[#2C6FE0]"></i><p class="text-[12px] font-bold mt-1">Clarity</p><p class="text-[11px] muted">Clear</p></div>
    </div>
  </div>
</div>
</body>
</html>
