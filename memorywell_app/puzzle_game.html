<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryWell - Puzzle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0F0A1E; }
        .puzzle-piece { border-radius: 8px; transition: all 0.3s ease; }
        .puzzle-piece:hover { transform: scale(1.03); }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.4); } 50% { box-shadow: 0 0 20px 4px rgba(124,58,237,0.2); } }
        .pulse { animation: pulse-glow 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 16px; font-weight: 600; color: white;">9:41</span>
        <div style="width: 120px; height: 36px; background: #1a1a2e; border-radius: 20px;"></div>
        <div style="display: flex; gap: 6px; align-items: center; color: white;">
            <i class="fas fa-signal" style="font-size: 14px;"></i>
            <i class="fas fa-wifi" style="font-size: 14px;"></i>
            <i class="fas fa-battery-full" style="font-size: 14px;"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 8px 28px; height: calc(100% - 59px);">
        <!-- Top Bar -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.08); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-chevron-left" style="color: white; font-size: 16px;"></i>
            </div>
            <div style="text-align: center;">
                <p style="font-size: 16px; font-weight: 700; color: white;">Beach Holiday '92</p>
                <p style="font-size: 12px; color: rgba(255,255,255,0.5);">12 pieces &middot; Medium</p>
            </div>
            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.08); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-lightbulb" style="color: #FBBF24; font-size: 16px;"></i>
            </div>
        </div>

        <!-- Stats -->
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-clock" style="color: #A78BFA; font-size: 18px; margin-bottom: 4px;"></i>
                <p style="font-size: 22px; font-weight: 800; color: white;">4:32</p>
                <p style="font-size: 10px; color: rgba(255,255,255,0.4);">Time</p>
            </div>
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-arrows-alt" style="color: #F59E0B; font-size: 18px; margin-bottom: 4px;"></i>
                <p style="font-size: 22px; font-weight: 800; color: white;">18</p>
                <p style="font-size: 10px; color: rgba(255,255,255,0.4);">Moves</p>
            </div>
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-star" style="color: #10B981; font-size: 18px; margin-bottom: 4px;"></i>
                <p style="font-size: 22px; font-weight: 800; color: white;">7/12</p>
                <p style="font-size: 10px; color: rgba(255,255,255,0.4);">Placed</p>
            </div>
        </div>

        <!-- Puzzle Board -->
        <div class="pulse" style="background: rgba(255,255,255,0.04); border-radius: 24px; padding: 12px; margin-bottom: 18px; border: 1px solid rgba(124,58,237,0.2);">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; aspect-ratio: 4/3;">
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 0%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 0%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.15); border: 2px dashed rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.4); font-size: 16px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 0%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 50%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 50%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 50%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.15); border: 2px dashed rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.4); font-size: 16px;"></i>
                </div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.15); border: 2px dashed rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.4); font-size: 16px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 100%/400% 300%; opacity: 1;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.15); border: 2px dashed rgba(124,58,237,0.3); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.4); font-size: 16px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 100%/400% 300%; opacity: 1;"></div>
            </div>
        </div>

        <!-- Remaining Pieces -->
        <div style="margin-bottom: 16px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Remaining Pieces</p>
            <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;">
                <div style="min-width: 72px; height: 56px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 0%/400% 300%; border: 2px solid rgba(124,58,237,0.4);"></div>
                <div style="min-width: 72px; height: 56px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 50%/400% 300%; border: 2px solid rgba(124,58,237,0.4);"></div>
                <div style="min-width: 72px; height: 56px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 100%/400% 300%; border: 2px solid rgba(124,58,237,0.4);"></div>
                <div style="min-width: 72px; height: 56px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 100%/400% 300%; border: 2px solid rgba(124,58,237,0.4);"></div>
                <div style="min-width: 72px; height: 56px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 0%/400% 300%; border: 2px solid rgba(124,58,237,0.4);"></div>
            </div>
        </div>

        <!-- Audio Controls -->
        <div style="background: rgba(255,255,255,0.06); border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #7C3AED, #A78BFA); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-music" style="color: white; font-size: 16px;"></i>
            </div>
            <div style="flex: 1;">
                <p style="font-size: 13px; font-weight: 600; color: white;">Summer of '92 Mix</p>
                <p style="font-size: 11px; color: rgba(255,255,255,0.4);">Era-matched background music</p>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fas fa-volume-up" style="color: #A78BFA; font-size: 16px;"></i>
                <i class="fas fa-microphone" style="color: #F59E0B; font-size: 16px;"></i>
            </div>
        </div>

        <!-- Voice Guide Indicator -->
        <div style="margin-top: 12px; background: rgba(245,158,11,0.1); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(245,158,11,0.15);">
            <div style="display: flex; align-items: center; gap: 3px;">
                <div style="width: 3px; height: 10px; background: #F59E0B; border-radius: 2px; animation: pulse-glow 1s ease-in-out infinite;"></div>
                <div style="width: 3px; height: 16px; background: #F59E0B; border-radius: 2px; animation: pulse-glow 1s ease-in-out 0.2s infinite;"></div>
                <div style="width: 3px; height: 12px; background: #F59E0B; border-radius: 2px; animation: pulse-glow 1s ease-in-out 0.4s infinite;"></div>
                <div style="width: 3px; height: 18px; background: #F59E0B; border-radius: 2px; animation: pulse-glow 1s ease-in-out 0.1s infinite;"></div>
                <div style="width: 3px; height: 8px; background: #F59E0B; border-radius: 2px; animation: pulse-glow 1s ease-in-out 0.3s infinite;"></div>
            </div>
            <div style="flex: 1;">
                <p style="font-size: 12px; font-weight: 600; color: #F59E0B;">Sarah's Voice Guide Active</p>
                <p style="font-size: 10px; color: rgba(245,158,11,0.6);">"Remember this beach trip, Grandma?"</p>
            </div>
        </div>
    </div>
</body>
</html>
