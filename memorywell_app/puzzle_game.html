<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryWell - Puzzle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0F0A1E; }
        .puzzle-piece { border-radius: 8px; transition: all 0.3s ease; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 18px; } }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 16px; font-weight: 600; color: white;">9:41</span>
        <div style="width: 120px; height: 36px; background: #1a1a2e; border-radius: 20px;"></div>
        <div style="display: flex; gap: 6px; align-items: center; color: white;">
            <i class="fas fa-signal" style="font-size: 14px;"></i>
            <i class="fas fa-wifi" style="font-size: 14px;"></i>
            <i class="fas fa-battery-full" style="font-size: 14px;"></i>
        </div>
    </div>

    <!-- Content -->
    <div style="padding: 8px 28px; height: calc(100% - 59px);">
        <!-- Top Bar -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.08); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-chevron-left" style="color: white; font-size: 16px;"></i>
            </div>
            <div style="text-align: center;">
                <p style="font-size: 15px; font-weight: 700; color: white;">Beach Holiday '92</p>
                <p style="font-size: 11px; color: rgba(255,255,255,0.4);">12 pieces &middot; Medium</p>
            </div>
            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.08); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-lightbulb" style="color: #FBBF24; font-size: 16px;"></i>
            </div>
        </div>

        <!-- Stats -->
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-clock" style="color: #A78BFA; font-size: 16px; margin-bottom: 2px;"></i>
                <p style="font-size: 20px; font-weight: 800; color: white;">4:32</p>
                <p style="font-size: 9px; color: rgba(255,255,255,0.35);">Time</p>
            </div>
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-arrows-alt" style="color: #F59E0B; font-size: 16px; margin-bottom: 2px;"></i>
                <p style="font-size: 20px; font-weight: 800; color: white;">18</p>
                <p style="font-size: 9px; color: rgba(255,255,255,0.35);">Moves</p>
            </div>
            <div style="flex: 1; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.06);">
                <i class="fas fa-star" style="color: #10B981; font-size: 16px; margin-bottom: 2px;"></i>
                <p style="font-size: 20px; font-weight: 800; color: white;">7/12</p>
                <p style="font-size: 9px; color: rgba(255,255,255,0.35);">Placed</p>
            </div>
        </div>

        <!-- Puzzle Board -->
        <div style="background: rgba(255,255,255,0.03); border-radius: 22px; padding: 10px; margin-bottom: 14px; border: 1px solid rgba(124,58,237,0.15);">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; aspect-ratio: 4/3;">
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 0%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 0%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.12); border: 2px dashed rgba(124,58,237,0.25); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.35); font-size: 14px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 0%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 50%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 50%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 50%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.12); border: 2px dashed rgba(124,58,237,0.25); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.35); font-size: 14px;"></i>
                </div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.12); border: 2px dashed rgba(124,58,237,0.25); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.35); font-size: 14px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 100%/400% 300%;"></div>
                <div class="puzzle-piece" style="background: rgba(124,58,237,0.12); border: 2px dashed rgba(124,58,237,0.25); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-question" style="color: rgba(124,58,237,0.35); font-size: 14px;"></i>
                </div>
                <div class="puzzle-piece" style="background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 100%/400% 300%;"></div>
            </div>
        </div>

        <!-- Remaining Pieces -->
        <div style="margin-bottom: 14px;">
            <p style="font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Drag to Place</p>
            <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;">
                <div style="min-width: 68px; height: 52px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 0%/400% 300%; border: 2px solid rgba(124,58,237,0.3);"></div>
                <div style="min-width: 68px; height: 52px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 100% 50%/400% 300%; border: 2px solid rgba(124,58,237,0.3);"></div>
                <div style="min-width: 68px; height: 52px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 0% 100%/400% 300%; border: 2px solid rgba(124,58,237,0.3);"></div>
                <div style="min-width: 68px; height: 52px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 66.66% 100%/400% 300%; border: 2px solid rgba(124,58,237,0.3);"></div>
                <div style="min-width: 68px; height: 52px; border-radius: 10px; background: url('https://images.unsplash.com/photo-1609220136736-443140cffec6?w=800') 33.33% 0%/400% 300%; border: 2px solid rgba(124,58,237,0.3);"></div>
            </div>
        </div>

        <!-- Sensory Anchor (Emotional Trigger Zone) -->
        <div style="background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(236,72,153,0.08)); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid rgba(245,158,11,0.15);">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 42px; height: 42px; background: linear-gradient(135deg, #F59E0B, #EC4899); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="fas fa-microphone-lines" style="color: white; font-size: 16px;"></i>
                </div>
                <div style="flex: 1;">
                    <p style="font-size: 12px; font-weight: 700; color: #F59E0B;">Emotional Anchor Ready</p>
                    <p style="font-size: 10px; color: rgba(255,255,255,0.45); line-height: 1.4;">Sarah's voice will play when you restore this memory</p>
                </div>
                <div style="display: flex; align-items: center; gap: 2px;">
                    <div style="width: 3px; background: #F59E0B; border-radius: 2px; animation: wave 1.2s ease-in-out infinite;" ></div>
                    <div style="width: 3px; background: #F59E0B; border-radius: 2px; animation: wave 1.2s ease-in-out 0.2s infinite;"></div>
                    <div style="width: 3px; background: #F59E0B; border-radius: 2px; animation: wave 1.2s ease-in-out 0.4s infinite;"></div>
                    <div style="width: 3px; background: #EC4899; border-radius: 2px; animation: wave 1.2s ease-in-out 0.1s infinite;"></div>
                    <div style="width: 3px; background: #EC4899; border-radius: 2px; animation: wave 1.2s ease-in-out 0.3s infinite;"></div>
                </div>
            </div>
        </div>

        <!-- Music Controls -->
        <div style="background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.05);">
            <div style="width: 38px; height: 38px; background: linear-gradient(135deg, #7C3AED, #A78BFA); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-music" style="color: white; font-size: 14px;"></i>
            </div>
            <div style="flex: 1;">
                <p style="font-size: 12px; font-weight: 600; color: white;">Summer Hits 1992</p>
                <p style="font-size: 10px; color: rgba(255,255,255,0.35);">Era-matched ambiance</p>
            </div>
            <i class="fas fa-pause" style="color: #A78BFA; font-size: 14px;"></i>
            <i class="fas fa-volume-up" style="color: rgba(255,255,255,0.4); font-size: 14px;"></i>
        </div>
    </div>
</body>
</html>
