<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryWell - AI-Powered Cognitive Care & Family Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffffff; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #FAFAF8;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 460px);
            gap: 40px;
            justify-content: center;
            padding: 0 40px;
        }

        .screen-label {
            text-align: center;
            margin-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div style="text-align: center; padding: 80px 40px 60px;">
        <div style="display: inline-flex; align-items: center; gap: 16px; margin-bottom: 20px;">
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #7C3AED, #A78BFA); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-brain" style="color: white; font-size: 28px;"></i>
            </div>
            <h1 style="font-size: 48px; font-weight: 800; color: #1F2937;">MemoryWell</h1>
        </div>
        <p style="font-size: 20px; color: #6B7280; max-width: 700px; margin: 0 auto; line-height: 1.6;">AI-powered cognitive care platform that transforms family memories into interactive therapy, preserving dignity and strengthening bonds.</p>
    </div>

    <!-- Screens -->
    <div class="screens-grid" style="margin-bottom: 60px;">
        <!-- Screen 1: Home -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="home.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Home Dashboard</p>
        </div>

        <!-- Screen 2: Memory Challenge -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="memory_challenge.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Memory Challenge</p>
        </div>

        <!-- Screen 3: Puzzle Game -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="puzzle_game.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Puzzle Game</p>
        </div>

        <!-- Screen 4: Cloud Diary -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="diary.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Cloud Diary</p>
        </div>

        <!-- Screen 5: Add Entry -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="add_entry.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Add Entry</p>
        </div>

        <!-- Screen 6: AI Insights -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="insights.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">AI Insights</p>
        </div>

        <!-- Screen 7: Profile -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="profile.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Patient Profile</p>
        </div>

        <!-- Screen 8: Family Circle -->
        <div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="family.html" scrolling="no"></iframe>
                </div>
            </div>
            <p class="screen-label">Family Circle</p>
        </div>
    </div>
</body>
</html>
