<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>SportPath · 60-second reset</title>
<style>@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1)}}.ring{animation:breathe 8s ease-in-out infinite}</style></head><body>
<div class="screen" style="background:#0B1220">
  <img src="assets/calm.jpg" class="absolute inset-0 w-full h-full object-cover" style="opacity:.55">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,18,32,.5),rgba(11,18,32,.75) 45%,rgba(11,18,32,.97))"></div>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between relative z-20 text-white">
    <div class="w-10 h-10 rounded-full bg-white/12 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark text-[16px]"></i></div>
    <div class="chip glass"><i class="fa-solid fa-wind text-[11px]"></i>60-second reset</div>
    <div class="w-10 h-10 rounded-full bg-white/12 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-volume-high text-[14px]"></i></div>
  </div>

  <div class="relative z-20 text-white text-center mt-10 px-c">
    <p class="meta" style="color:rgba(255,255,255,.55)">After an error · between points</p>
    <h1 class="text-[30px] font-extrabold tracking-tight mt-2">Breathe in</h1>
  </div>

  <div class="relative z-20 flex items-center justify-center mt-10" style="height:330px">
    <div class="absolute w-[300px] h-[300px] rounded-full" style="background:radial-gradient(circle,rgba(59,130,246,.35),rgba(59,130,246,0) 70%)"></div>
    <div class="ring w-[240px] h-[240px] rounded-full flex items-center justify-center" style="background:radial-gradient(circle at 40% 35%,#60A5FA,#1D4ED8 70%);box-shadow:0 30px 80px -20px rgba(37,99,235,.8)">
      <div class="w-[200px] h-[200px] rounded-full border border-white/30 flex flex-col items-center justify-center">
        <p class="text-[72px] font-extrabold leading-none text-white num">4</p>
        <p class="text-[13px] font-semibold text-white/70 mt-2">seconds</p>
      </div>
    </div>
  </div>

  <div class="relative z-20 px-c mt-6 text-white">
    <div class="flex items-center justify-center gap-6 text-[12.5px] font-semibold">
      <span class="flex items-center gap-2"><span class="dot bg-white"></span>In 4</span>
      <span class="flex items-center gap-2 text-white/50"><span class="dot bg-white/30"></span>Hold 4</span>
      <span class="flex items-center gap-2 text-white/50"><span class="dot bg-white/30"></span>Out 6</span>
    </div>
    <div class="mt-6 rounded-2xl p-4 flex items-center gap-3.5" style="background:rgba(255,255,255,.1);backdrop-filter:blur(14px)">
      <div class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-quote-left text-[14px]"></i></div>
      <p class="text-[14px] font-medium leading-snug">That point is over. Pick your zone. The next serve is the only one that exists.</p>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-0 px-[28px] pb-10 z-20 text-white">
    <div class="flex items-center justify-between mb-4 text-[12px] font-semibold text-white/60 num"><span>0:22</span><span>1:00</span></div>
    <div class="h-1.5 rounded-full bg-white/20 relative"><span class="absolute left-0 top-0 h-full w-[37%] rounded-full bg-white"></span></div>
    <div class="mt-6 flex items-center justify-between">
      <div class="w-12 h-12 rounded-full bg-white/12 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-backward-step text-[16px]"></i></div>
      <div class="w-[72px] h-[72px] rounded-full bg-white text-[#0B1220] flex items-center justify-center"><i class="fa-solid fa-pause text-[22px]"></i></div>
      <div class="w-12 h-12 rounded-full bg-white/12 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-forward-step text-[16px]"></i></div>
    </div>
  </div>
</div></body></html>
