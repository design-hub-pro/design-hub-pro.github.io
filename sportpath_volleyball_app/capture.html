<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>SportPath · Pose capture</title>
<style>.corner{position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.9)}
.rec{width:9px;height:9px;border-radius:50%;background:#F43F5E;box-shadow:0 0 0 4px rgba(244,63,94,.3)}</style></head><body>
<div class="screen" style="background:#000">
  <img src="assets/pose_spike.jpg" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85))"></div>
  <svg class="pose" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#22D3EE" stroke-width="8"><line x1="548" y1="460" x2="590" y2="640"/><line x1="515" y1="470" x2="605" y2="478"/><polyline points="605,478 700,528 800,500"/><line x1="575" y1="640" x2="605" y2="640"/><polyline points="575,640 540,795 400,850"/><polyline points="605,640 552,805 455,935"/><line x1="548" y1="460" x2="525" y2="405"/></g>
    <polyline points="515,470 430,478 398,395" stroke="#FBBF24" stroke-width="8"/>
    <g fill="#fff"><circle cx="525" cy="405" r="9"/><circle cx="548" cy="460" r="9"/><circle cx="515" cy="470" r="9"/><circle cx="605" cy="478" r="9"/><circle cx="700" cy="528" r="9"/><circle cx="800" cy="500" r="9"/><circle cx="575" cy="640" r="9"/><circle cx="605" cy="640" r="9"/><circle cx="540" cy="795" r="9"/><circle cx="552" cy="805" r="9"/><circle cx="400" cy="850" r="9"/><circle cx="455" cy="935" r="9"/><circle cx="398" cy="395" r="9"/></g>
    <circle cx="430" cy="478" r="15" fill="#FBBF24" stroke="#fff" stroke-width="4"/>
    <circle cx="760" cy="260" r="46" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" opacity=".8"/>
  </svg>

  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between relative z-20">
    <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-xmark text-[16px]"></i></div>
    <div class="chip glass"><span class="rec"></span>REC <span class="num">0:14</span></div>
    <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-camera-rotate text-[15px]"></i></div>
  </div>
  <div class="px-c mt-3 flex gap-2 relative z-20">
    <span class="chip glass"><i class="fa-solid fa-volleyball text-[11px]"></i>Spike</span>
    <span class="chip glass"><i class="fa-solid fa-eye text-[11px]"></i>Side view</span>
    <span class="chip glass"><span class="dot bg-emerald-400"></span>Full body in frame</span>
  </div>

  <div class="corner" style="left:34px;top:190px;border-right:0;border-bottom:0;border-radius:8px 0 0 0"></div>
  <div class="corner" style="right:34px;top:190px;border-left:0;border-bottom:0;border-radius:0 8px 0 0"></div>
  <div class="corner" style="left:34px;bottom:300px;border-right:0;border-top:0;border-radius:0 0 0 8px"></div>
  <div class="corner" style="right:34px;bottom:300px;border-left:0;border-top:0;border-radius:0 0 8px 0"></div>

  <span class="tag warn" style="left:48px;top:365px"><i class="fa-solid fa-arrow-up text-[10px]"></i> Elbow up</span>
  <span class="tag ok" style="right:44px;top:470px">Approach on time</span>

  <div class="absolute left-0 right-0 bottom-0 px-[28px] pb-9 z-20 text-white">
    <div class="flex items-center justify-between">
      <div><p class="meta" style="color:rgba(255,255,255,.55)">Rep</p><p class="text-[34px] font-extrabold leading-none num mt-1">6<span class="text-[18px] text-white/50"> / 10</span></p></div>
      <div class="flex gap-1.5">
        <span class="w-6 h-1.5 rounded-full bg-emerald-400"></span><span class="w-6 h-1.5 rounded-full bg-emerald-400"></span><span class="w-6 h-1.5 rounded-full bg-amber-400"></span><span class="w-6 h-1.5 rounded-full bg-emerald-400"></span><span class="w-6 h-1.5 rounded-full bg-amber-400"></span><span class="w-6 h-1.5 rounded-full bg-white"></span><span class="w-6 h-1.5 rounded-full bg-white/25"></span><span class="w-6 h-1.5 rounded-full bg-white/25"></span><span class="w-6 h-1.5 rounded-full bg-white/25"></span><span class="w-6 h-1.5 rounded-full bg-white/25"></span>
      </div>
    </div>
    <div class="mt-4 rounded-2xl p-3.5 flex items-center gap-3" style="background:rgba(255,255,255,.12);backdrop-filter:blur(14px)">
      <div class="w-9 h-9 rounded-xl bg-amber-400 text-[#0B1220] flex items-center justify-center"><i class="fa-solid fa-bolt text-[14px]"></i></div>
      <p class="text-[13.5px] font-medium leading-snug flex-1">Live cue: bring the hitting elbow to ear height before you swing.</p>
    </div>
    <div class="mt-5 flex items-center justify-between">
      <div class="w-12 h-12 rounded-xl overflow-hidden ring-2 ring-white/40"><img src="assets/drill_approach.jpg" class="w-full h-full object-cover"></div>
      <div class="w-[78px] h-[78px] rounded-full border-[5px] border-white flex items-center justify-center"><div class="w-[30px] h-[30px] rounded-[8px] bg-rose-500"></div></div>
      <div class="w-12 h-12 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-sliders text-[16px]"></i></div>
    </div>
  </div>
</div></body></html>
