<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WasteWise AI - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        * { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: #F8FAFC; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-sm font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 pt-4 pb-5">
        <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
    </div>

    <!-- Profile Card -->
    <div class="px-5 mb-4">
        <div class="bg-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-18 h-18 rounded-full overflow-hidden border-3 border-green-400">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=face" alt="Profile" class="w-16 h-16 object-cover">
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-bold text-gray-900">Sarah Chen</h2>
                    <p class="text-gray-500 text-sm">Greenview Block A, Unit 12-05</p>
                    <p class="text-green-600 text-sm font-medium mt-1">Eco Warrior Level 5</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="px-5 mb-4">
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <p class="text-2xl font-bold text-gray-900">156</p>
                <p class="text-xs text-gray-500">Total Disposals</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <p class="text-2xl font-bold text-green-600">94%</p>
                <p class="text-xs text-gray-500">Accuracy</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm text-center">
                <p class="text-2xl font-bold text-amber-600">847</p>
                <p class="text-xs text-gray-500">Points</p>
            </div>
        </div>
    </div>

    <!-- Achievements -->
    <div class="px-5 mb-4">
        <h3 class="font-semibold text-gray-900 mb-3">Achievements</h3>
        <div class="flex gap-3 overflow-x-auto pb-2">
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-3 shadow-sm text-center">
                <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-fire text-amber-500 text-xl"></i>
                </div>
                <p class="text-xs text-gray-600">7-Day Streak</p>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-3 shadow-sm text-center">
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-leaf text-green-500 text-xl"></i>
                </div>
                <p class="text-xs text-gray-600">Eco Hero</p>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-3 shadow-sm text-center">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-recycle text-blue-500 text-xl"></i>
                </div>
                <p class="text-xs text-gray-600">Recycler</p>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-3 shadow-sm text-center">
                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fas fa-star text-purple-500 text-xl"></i>
                </div>
                <p class="text-xs text-gray-600">Top 10%</p>
            </div>
        </div>
    </div>

    <!-- Menu Items -->
    <div class="px-5 mb-4">
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-blue-600"></i>
                    </div>
                    <span class="text-gray-900">Notifications</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </div>
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-green-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-location-dot text-green-600"></i>
                    </div>
                    <span class="text-gray-900">My Community</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </div>
            <div class="flex items-center justify-between p-4 border-b border-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-gift text-purple-600"></i>
                    </div>
                    <span class="text-gray-900">Rewards</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-gear text-gray-600"></i>
                    </div>
                    <span class="text-gray-900">Settings</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-2 pb-6">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-pie text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Analytics</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-users text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Community</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-comment-dots text-gray-400 text-xl"></i>
                <span class="text-xs text-gray-400 mt-1">Feedback</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-green-600 text-xl"></i>
                <span class="text-xs text-green-600 font-medium mt-1">Profile</span>
            </div>
        </div>
    </div>

    <div class="h-24"></div>
</body>
</html>
