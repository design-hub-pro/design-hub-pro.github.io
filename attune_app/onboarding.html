<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attune — Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0A0A18; color:#fff; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow:hidden; background:#0A0A18; }

  .bg-img { position:absolute; inset:0; background:url('https://images.unsplash.com/photo-1484704849700-f032a568e944?w=900&q=85') center/cover no-repeat; }
  .bg-grad { position:absolute; inset:0; background:linear-gradient(180deg, rgba(124,92,255,0.45) 0%, rgba(10,10,24,0.6) 45%, rgba(10,10,24,0.97) 80%, #0A0A18 100%); }
  .orb { position:absolute; border-radius:50%; filter:blur(60px); opacity:0.55; }
  .orb1 { width:280px; height:280px; background:#7C5CFF; top:-60px; left:-80px; }
  .orb2 { width:240px; height:240px; background:#2DD4FF; top:120px; right:-90px; opacity:0.4; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; color:#fff; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; color:#fff; }

  .content { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; padding:0 28px 40px; }

  .brand-row { display:flex; align-items:center; gap:11px; margin-top:18px; }
  .brand-mark { width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,#7C5CFF,#2DD4FF); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(124,92,255,0.5); }
  .brand-mark i { font-size:19px; color:#fff; }
  .brand-name { font-size:20px; font-weight:900; letter-spacing:-0.5px; }

  .equalizer { display:flex; align-items:flex-end; gap:5px; height:96px; margin-top:auto; margin-bottom:20px; }
  .eq-bar { width:9px; border-radius:6px; background:linear-gradient(180deg,#2DD4FF,#7C5CFF); animation:bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ height:18px; } 50%{ height:80px; } }
  .eq-bar:nth-child(1){animation-delay:0s;} .eq-bar:nth-child(2){animation-delay:.15s;} .eq-bar:nth-child(3){animation-delay:.3s;}
  .eq-bar:nth-child(4){animation-delay:.45s;} .eq-bar:nth-child(5){animation-delay:.2s;} .eq-bar:nth-child(6){animation-delay:.5s;}
  .eq-bar:nth-child(7){animation-delay:.1s;} .eq-bar:nth-child(8){animation-delay:.35s;}

  .hero-badge { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.1); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.16); padding:8px 14px; border-radius:30px; font-size:11px; font-weight:700; letter-spacing:0.4px; width:fit-content; margin-bottom:20px; }
  .hero-badge i { color:#34E0A1; font-size:10px; }

  h1 { font-size:42px; font-weight:900; line-height:1.04; letter-spacing:-1.5px; }
  h1 span { background:linear-gradient(135deg,#2DD4FF,#7C5CFF); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:15px; color:rgba(255,255,255,0.62); line-height:1.6; margin-top:16px; max-width:330px; }

  .social { display:flex; align-items:center; gap:12px; margin-top:26px; }
  .avatars { display:flex; }
  .avatars img { width:34px; height:34px; border-radius:50%; border:2px solid #0A0A18; object-fit:cover; margin-left:-10px; }
  .avatars img:first-child { margin-left:0; }
  .social-text { font-size:12px; color:rgba(255,255,255,0.6); font-weight:500; line-height:1.4; }
  .social-text b { color:#fff; font-weight:800; }

  .cta { margin-top:26px; height:58px; border-radius:18px; background:linear-gradient(135deg,#7C5CFF,#2DD4FF); display:flex; align-items:center; justify-content:center; gap:10px; font-size:16px; font-weight:800; color:#fff; box-shadow:0 16px 40px rgba(124,92,255,0.45); }
  .cta i { font-size:14px; }
  .signin { text-align:center; font-size:13px; color:rgba(255,255,255,0.5); margin-top:18px; }
  .signin b { color:#fff; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-img"></div>
  <div class="bg-grad"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="brand-row">
      <div class="brand-mark"><i class="fas fa-wave-square"></i></div>
      <div class="brand-name">Attune</div>
    </div>

    <div class="equalizer">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>

    <div class="hero-badge"><i class="fas fa-circle-nodes"></i>ADAPTIVE FOCUS ENGINE</div>
    <h1>Music that<br>learns how<br>you <span>focus.</span></h1>
    <p class="sub">Attune builds the perfect study soundtrack, measures your focus after every session, and gets smarter each time you listen.</p>

    <div class="social">
      <div class="avatars">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&q=80" alt="">
      </div>
      <div class="social-text"><b>48,200 students</b> studied<br>2.1M focused hours this month</div>
    </div>

    <div class="cta"><i class="fas fa-headphones-simple"></i>Build my focus profile</div>
    <div class="signin">Already tuned in? <b>Sign in</b></div>
  </div>
</div>
</body>
</html>
