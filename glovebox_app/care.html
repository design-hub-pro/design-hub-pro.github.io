<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Care</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.health{display:flex;gap:18px;align-items:center;margin-top:18px;padding:18px}
.topview{position:relative;width:132px;height:196px;flex:none}
.body-car{position:absolute;left:30px;top:8px;width:72px;height:180px;border-radius:30px 30px 24px 24px;background:linear-gradient(180deg,#E9EEF5,#D3DBE6);border:2px solid #C3CDDA}
.body-car:before{content:"";position:absolute;left:9px;right:9px;top:38px;height:34px;border-radius:12px 12px 6px 6px;background:#9FB0C4}
.body-car:after{content:"";position:absolute;left:11px;right:11px;bottom:26px;height:24px;border-radius:6px 6px 10px 10px;background:#9FB0C4}
.tire{position:absolute;width:16px;height:34px;border-radius:6px;background:#1F2937}
.psi{position:absolute;font-size:12px;font-weight:800;padding:3px 7px;border-radius:8px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;gap:4px}
.due{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.due:last-child{border-bottom:0}
.tip{width:180px;flex:none}
.tip .ph{height:118px;border-radius:20px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div><div class="meta">Maintenance</div><div class="h1 mt-1.5">Car care</div></div>
      <div class="iconbtn"><i class="fa-regular fa-calendar"></i><span class="badge" style="background:var(--amber)">1</span></div>
    </div>

    <div class="card health">
      <div class="topview">
        <div class="body-car"></div>
        <div class="tire" style="left:22px;top:34px"></div><div class="tire" style="right:22px;top:34px;background:#F59E0B"></div>
        <div class="tire" style="left:22px;bottom:30px"></div><div class="tire" style="right:22px;bottom:30px"></div>
        <div class="psi num" style="left:-8px;top:8px"><span class="dot" style="background:var(--green)"></span>36</div>
        <div class="psi num" style="right:-8px;top:8px;color:#B45309"><span class="dot" style="background:var(--amber)"></span>29</div>
        <div class="psi num" style="left:-8px;bottom:4px"><span class="dot" style="background:var(--green)"></span>35</div>
        <div class="psi num" style="right:-8px;bottom:4px"><span class="dot" style="background:var(--green)"></span>36</div>
      </div>
      <div class="flex-1 flex flex-col gap-4">
        <div class="flex items-center gap-3">
          <div class="ring" style="width:54px;height:54px"><svg width="54" height="54"><circle cx="27" cy="27" r="22" stroke="#DDF5EC" stroke-width="5" fill="none"/><circle cx="27" cy="27" r="22" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="52"/></svg><i class="fa-solid fa-oil-can text-[15px]" style="color:var(--green)"></i></div>
          <div><div class="text-[24px] font-extrabold leading-none num">62%</div><div class="text-[11.5px] font-semibold text-[color:var(--muted)] mt-1">Oil life</div></div>
        </div>
        <div class="flex items-center gap-3">
          <div class="ring" style="width:54px;height:54px"><svg width="54" height="54"><circle cx="27" cy="27" r="22" stroke="#FDEFD3" stroke-width="5" fill="none"/><circle cx="27" cy="27" r="22" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="104"/></svg><i class="fa-solid fa-droplet text-[15px]" style="color:var(--amber)"></i></div>
          <div><div class="text-[24px] font-extrabold leading-none num">25%</div><div class="text-[11.5px] font-semibold text-[color:var(--muted)] mt-1">Washer fluid</div></div>
        </div>
      </div>
    </div>

    <div class="sec"><div class="h2">Coming up</div><span class="act" style="color:var(--green)">Book</span></div>
    <div class="card px-4 py-1">
      <div class="due"><div class="gicon g-amber" style="width:42px;height:42px;border-radius:14px;font-size:16px"><i class="fa-solid fa-circle-exclamation"></i></div><div class="flex-1 font-bold text-[15px]">Front-right tire</div><span class="pill" style="background:#FFF4E5;color:#B45309">Today</span></div>
      <div class="due"><div class="gicon g-care" style="width:42px;height:42px;border-radius:14px;font-size:16px"><i class="fa-solid fa-rotate"></i></div><div class="flex-1 font-bold text-[15px]">Tire rotation</div><span class="text-[13px] font-bold num text-[color:var(--muted)]">1,100 mi</span></div>
      <div class="due"><div class="gicon g-blue" style="width:42px;height:42px;border-radius:14px;font-size:16px"><i class="fa-solid fa-oil-can"></i></div><div class="flex-1 font-bold text-[15px]">First oil service</div><span class="text-[13px] font-bold num text-[color:var(--muted)]">Mar 2027</span></div>
    </div>

    <div class="sec"><div class="h2">5-minute DIY</div><span class="act" style="color:var(--green)">All 14</span></div>
    <div class="hscroll">
      <div class="tip"><div class="ph img shade" style="background-image:url(img/tire.jpg)"><div class="absolute inset-0 flex items-center justify-center" style="z-index:3"><div class="play" style="width:40px;height:40px;font-size:13px"><i class="fa-solid fa-play"></i></div></div><span class="dur">1:30</span></div><div class="font-bold text-[14.5px] tracking-tight mt-2">Check tire pressure</div></div>
      <div class="tip"><div class="ph img shade" style="background-image:url(img/engine.jpg)"><div class="absolute inset-0 flex items-center justify-center" style="z-index:3"><div class="play" style="width:40px;height:40px;font-size:13px"><i class="fa-solid fa-play"></i></div></div><span class="dur">0:55</span></div><div class="font-bold text-[14.5px] tracking-tight mt-2">Top up washer fluid</div></div>
      <div class="tip"><div class="ph img shade" style="background-image:url(img/charge.jpg)"><div class="absolute inset-0 flex items-center justify-center" style="z-index:3"><div class="play" style="width:40px;height:40px;font-size:13px"><i class="fa-solid fa-play"></i></div></div><span class="dur">2:05</span></div><div class="font-bold text-[14.5px] tracking-tight mt-2">Hybrid battery basics</div></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-compass"></i>Explore</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
  <div class="tab"><i class="fa-solid fa-shield-halved"></i>Safety</div>
  <div class="tab on" style="color:var(--green)"><i class="fa-solid fa-wrench"></i>Care</div>
</div>
<div class="homebar"></div>
</div></body></html>
