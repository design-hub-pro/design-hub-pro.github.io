<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Safety training</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.feat{height:230px;border-radius:28px;background-image:url(img/night.jpg);margin-top:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.mod{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:#fff;border:1px solid var(--border)}
.mod .th{width:78px;height:78px;border-radius:17px;flex:none}
.badges{display:flex;gap:12px}
.bdg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex:none}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-end justify-between mt-3">
      <div><div class="meta">Safety training</div><div class="h1 mt-1.5">Drive ready</div></div>
      <div class="ring" style="width:66px;height:66px">
        <svg width="66" height="66"><circle cx="33" cy="33" r="28" stroke="#FDE2E2" stroke-width="6" fill="none"/><circle cx="33" cy="33" r="28" stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="123"/><defs><linearGradient id="g"><stop offset="0" stop-color="#FF8A65"/><stop offset="1" stop-color="#EF4444"/></linearGradient></defs></svg>
        <span class="text-[16px] font-extrabold num">30%</span>
      </div>
    </div>

    <div class="feat img shade">
      <div class="flex justify-between"><span class="pill glass"><i class="fa-solid fa-bolt"></i>Scenario drill</span><span class="pill glass num">8 questions</span></div>
      <div class="text-white">
        <div class="text-[24px] font-extrabold tracking-tight leading-tight">Night rain on the highway</div>
        <div class="flex items-center gap-3 mt-3">
          <div class="flex-1 h-2 rounded-full bg-white/25 overflow-hidden"><i class="block h-full rounded-full" style="width:62%;background:var(--gradSafe)"></i></div>
          <span class="text-[13px] font-bold num">5/8</span>
        </div>
      </div>
    </div>

    <div class="sec"><div class="h2">Modules</div><span class="act" style="color:var(--red)">All 12</span></div>
    <div class="flex flex-col gap-3">
      <div class="mod">
        <div class="th img" style="background-image:url(img/childseat.jpg)"></div>
        <div class="flex-1"><div class="font-bold text-[15.5px] tracking-tight">Child seat install</div>
          <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:100%;background:var(--gradCare)"></i></div><i class="fa-solid fa-circle-check" style="color:var(--green)"></i></div></div>
      </div>
      <div class="mod">
        <div class="th img" style="background-image:url(img/snow.jpg)"></div>
        <div class="flex-1"><div class="font-bold text-[15.5px] tracking-tight">Winter traction</div>
          <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:40%;background:var(--gradSafe)"></i></div><span class="text-[12px] font-bold num text-[color:var(--muted)]">2/5</span></div></div>
      </div>
      <div class="mod">
        <div class="th" style="background:var(--gradSafe);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px"><i class="fa-solid fa-car-burst"></i></div>
        <div class="flex-1"><div class="font-bold text-[15.5px] tracking-tight">After a crash</div>
          <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:0"></i></div><i class="fa-solid fa-lock text-[12px] text-[color:var(--faint)]"></i></div></div>
      </div>
    </div>

    <div class="sec"><div class="h2">Badges</div><span class="text-[13px] font-bold num text-[color:var(--muted)]">3 of 10</span></div>
    <div class="badges">
      <div class="bdg" style="background:var(--gradCare)"><i class="fa-solid fa-baby"></i></div>
      <div class="bdg" style="background:var(--grad)"><i class="fa-solid fa-road"></i></div>
      <div class="bdg" style="background:var(--gradAmber)"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="bdg" style="background:#E8ECF2;color:#B8C1CE"><i class="fa-solid fa-snowflake"></i></div>
      <div class="bdg" style="background:#E8ECF2;color:#B8C1CE"><i class="fa-solid fa-kit-medical"></i></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-compass"></i>Explore</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
  <div class="tab on" style="color:var(--red)"><i class="fa-solid fa-shield-halved"></i>Safety</div>
  <div class="tab"><i class="fa-solid fa-wrench"></i>Care</div>
</div>
<div class="homebar"></div>
</div></body></html>
