<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.bgimg{position:absolute;inset:0;background:url(img/car.jpg) center 40%/cover}
.bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,26,.55) 0%,rgba(8,14,26,0) 28%,rgba(8,14,26,.15) 45%,rgba(8,14,26,.92) 72%,#080E1A 100%)}
.step{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.check{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
</style></head>
<body><div class="screen" style="background:#080E1A">
<div class="bgimg"></div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad relative z-10 mt-4 flex items-center gap-2.5 text-white">
  <div class="w-9 h-9 rounded-xl flex items-center justify-center text-[15px]" style="background:var(--grad)"><i class="fa-solid fa-book-open"></i></div>
  <span class="font-extrabold text-[18px] tracking-tight">Glovebox</span>
</div>

<div class="absolute left-0 right-0 bottom-0 pad pb-12 z-10 text-white">
  <span class="pill glass"><span class="live"></span>VIN matched</span>
  <div class="text-[40px] font-extrabold tracking-tight leading-[1.02] mt-4">Meet your<br>Aster X5 Hybrid</div>

  <div class="flex items-end gap-6 mt-6">
    <div><div class="text-[34px] font-extrabold tracking-tight leading-none num">412</div><div class="text-[12px] font-semibold opacity-60 mt-1.5">manual pages</div></div>
    <i class="fa-solid fa-arrow-right-long text-[20px] opacity-50 mb-4"></i>
    <div><div class="text-[34px] font-extrabold tracking-tight leading-none num" style="color:#7DD8FF">64</div><div class="text-[12px] font-semibold opacity-60 mt-1.5">2-min lessons</div></div>
  </div>

  <div class="flex flex-col gap-2.5 mt-6">
    <div class="step"><span class="check" style="background:var(--green)"><i class="fa-solid fa-check"></i></span><span class="text-[14px] font-semibold flex-1">Owner's manual loaded</span><i class="fa-solid fa-book text-white/50"></i></div>
    <div class="step"><span class="check" style="background:var(--green)"><i class="fa-solid fa-check"></i></span><span class="text-[14px] font-semibold flex-1">Trim and options detected</span><i class="fa-solid fa-car-side text-white/50"></i></div>
    <div class="step"><span class="check" style="border:2px solid #7DD8FF;color:#7DD8FF"><i class="fa-solid fa-circle-notch fa-spin"></i></span><span class="text-[14px] font-semibold flex-1">Building your learning path</span><span class="text-[13px] font-bold num" style="color:#7DD8FF">82%</span></div>
  </div>

  <div class="btn mt-7">Start my first lesson<i class="fa-solid fa-arrow-right"></i></div>
  <div class="text-center text-[13px] font-semibold opacity-60 mt-4"><i class="fa-solid fa-camera mr-1.5"></i>Scan a different VIN</div>
</div>
<div class="homebar light"></div>
</div></body></html>
