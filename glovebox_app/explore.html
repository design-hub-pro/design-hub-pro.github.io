<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Explore cockpit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cock{position:absolute;left:0;right:0;top:0;height:560px;background:url(img/cockpit.jpg) center 55%/cover}
.cock:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,26,.6) 0%,rgba(8,14,26,0) 22%,rgba(8,14,26,0) 70%,rgba(8,14,26,.5) 100%)}
.hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 0 0 6px rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.35);z-index:5}
.hs.done{background:var(--green);color:#fff;box-shadow:0 0 0 6px rgba(16,185,129,.3),0 6px 16px rgba(0,0,0,.35)}
.hs.on{background:var(--blue);color:#fff;width:42px;height:42px;margin:-21px 0 0 -21px;font-size:15px;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(36,87,245,.7)}70%{box-shadow:0 0 0 16px rgba(36,87,245,0)}100%{box-shadow:0 0 0 0 rgba(36,87,245,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;top:500px;background:#fff;border-radius:30px 30px 0 0;z-index:20;box-shadow:0 -20px 40px -20px rgba(0,0,0,.35)}
.grab{width:40px;height:5px;border-radius:3px;background:#D8DEE6;margin:10px auto 0}
.btnrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kb{border-radius:18px;background:var(--surface);height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink2)}
.kb i{font-size:18px}
.kb.sel{background:#EAF0FF;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
</style></head>
<body><div class="screen">
<div class="cock">
  <div class="hs done" style="left:27%;top:40%"><i class="fa-solid fa-check"></i></div>
  <div class="hs on" style="left:14%;top:53%"><i class="fa-solid fa-gauge"></i></div>
  <div class="hs" style="left:48.5%;top:50%">3</div>
  <div class="hs done" style="left:78%;top:50%"><i class="fa-solid fa-check"></i></div>
  <div class="hs" style="left:81%;top:73%">5</div>
  <div class="hs" style="left:10%;top:77%">6</div>
</div>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad relative z-10 flex items-center justify-between mt-3 text-white">
  <div><div class="text-[12px] font-bold tracking-[1.8px] opacity-70">EXPLORE</div><div class="text-[26px] font-extrabold tracking-tight">Tap your cockpit</div></div>
  <div class="ring" style="width:56px;height:56px">
    <svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,.25)" stroke-width="5" fill="none"/><circle cx="28" cy="28" r="24" stroke="#7DD8FF" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="100"/></svg>
    <span class="text-[13px] font-extrabold num">2/6</span>
  </div>
</div>
<div class="absolute z-10 pad left-0 right-0 flex gap-2" style="top:150px">
  <span class="chip on" style="padding:8px 13px;font-size:12.5px">Driver</span>
  <span class="chip" style="padding:8px 13px;font-size:12.5px;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.25)">Center</span>
  <span class="chip" style="padding:8px 13px;font-size:12.5px;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.25)">Doors</span>
  <span class="chip" style="padding:8px 13px;font-size:12.5px;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.25)">Trunk</span>
</div>

<div class="sheet">
  <div class="grab"></div>
  <div class="pad pt-4">
    <div class="flex items-center gap-3.5">
      <div class="gicon g-blue" style="width:52px;height:52px;border-radius:17px;font-size:20px"><i class="fa-solid fa-gauge"></i></div>
      <div class="flex-1"><div class="text-[20px] font-extrabold tracking-tight">Left wheel controls</div><div class="flex items-center gap-1.5 mt-0.5"><span class="dot" style="background:var(--blue)"></span><span class="text-[12.5px] font-semibold text-[color:var(--muted)]">Cruise and lane assist · 4 buttons</span></div></div>
    </div>
    <div class="btnrow mt-5">
      <div class="kb sel"><i class="fa-solid fa-power-off"></i>On/Off</div>
      <div class="kb"><i class="fa-solid fa-plus-minus"></i>Speed</div>
      <div class="kb"><i class="fa-solid fa-car-rear"></i>Gap</div>
      <div class="kb"><i class="fa-solid fa-road"></i>Lane</div>
    </div>
    <div class="flex gap-3 mt-5">
      <div class="btn flex-1" style="height:54px;font-size:15px"><i class="fa-solid fa-play"></i>Watch 0:45</div>
      <div class="btn ghost" style="height:54px;width:60px"><i class="fa-solid fa-cube"></i></div>
      <div class="btn ghost" style="height:54px;width:60px"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--violet)"></i></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab on"><i class="fa-solid fa-compass"></i>Explore</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
  <div class="tab"><i class="fa-solid fa-shield-halved"></i>Safety</div>
  <div class="tab"><i class="fa-solid fa-wrench"></i>Care</div>
</div>
<div class="homebar"></div>
</div></body></html>
