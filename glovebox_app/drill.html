<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Safety drill</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.scene{position:absolute;left:0;right:0;top:0;height:470px;background:url(img/night.jpg) center/cover}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,26,.6) 0%,rgba(8,14,26,.1) 30%,rgba(8,14,26,.2) 55%,#0B1220 100%)}
.scene > *{z-index:3;position:relative}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.segs i.d{background:#4ADE80}.segs i.x{background:#F87171}.segs i.c{background:#fff}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);color:#fff}
.opt .k{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:rgba(255,255,255,.1)}
.opt.ok{background:rgba(16,185,129,.14);border-color:#34D399}
.opt.ok .k{background:var(--gradCare)}
</style></head>
<body><div class="screen" style="background:#0B1220">
<div class="scene">
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad mt-3 flex items-center gap-3">
    <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
    <div class="segs flex-1"><i class="d"></i><i class="d"></i><i class="x"></i><i class="d"></i><i class="d"></i><i class="c"></i><i></i><i></i></div>
  </div>
  <div class="pad mt-6 flex justify-end">
    <div class="ring text-white" style="width:62px;height:62px">
      <svg width="62" height="62"><circle cx="31" cy="31" r="26" stroke="rgba(255,255,255,.2)" stroke-width="5" fill="none"/><circle cx="31" cy="31" r="26" stroke="#FBBF24" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="65"/></svg>
      <span class="text-[18px] font-extrabold num">6s</span>
    </div>
  </div>
</div>
<div class="absolute left-0 right-0 pad z-10 text-white" style="top:300px">
  <span class="pill" style="background:rgba(239,68,68,.2);color:#FCA5A5"><i class="fa-solid fa-car-burst"></i>Hydroplaning</span>
  <div class="text-[27px] font-extrabold tracking-tight leading-[1.15] mt-3">The wheel goes light at 60 mph. What first?</div>

  <div class="flex flex-col gap-3 mt-6">
    <div class="opt"><div class="k"><i class="fa-solid fa-circle-stop"></i></div><span class="text-[15px] font-semibold flex-1">Brake hard</span></div>
    <div class="opt ok"><div class="k"><i class="fa-solid fa-shoe-prints"></i></div><span class="text-[15px] font-semibold flex-1">Ease off the gas, hold straight</span><i class="fa-solid fa-circle-check text-[22px]" style="color:#34D399"></i></div>
    <div class="opt"><div class="k"><i class="fa-solid fa-arrows-turn-right"></i></div><span class="text-[15px] font-semibold flex-1">Steer to the shoulder</span></div>
  </div>

  <div class="flex items-center gap-3 mt-5 p-3.5 rounded-[18px]" style="background:rgba(124,92,255,.16)">
    <div class="gicon g-ai" style="width:36px;height:36px;border-radius:12px;font-size:14px"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <span class="text-[13px] font-semibold flex-1 opacity-90">Your X5 also cuts cruise in rain. <span style="color:#C4B5FD">Manual p.204</span></span>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 pad pb-9 z-10">
  <div class="btn" style="background:var(--gradCare);box-shadow:0 14px 26px -12px rgba(16,185,129,.7)">Correct · next scenario<i class="fa-solid fa-arrow-right"></i></div>
</div>
<div class="homebar light"></div>
</div></body></html>
