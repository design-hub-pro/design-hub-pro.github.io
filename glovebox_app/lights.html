<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Warning lights</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.scan{height:250px;border-radius:28px;background:#05080F;position:relative;overflow:hidden;margin-top:18px}
.scan .cl{position:absolute;inset:0;background:url(img/cockpit.jpg) 30% 38%/260% auto;opacity:.55;filter:saturate(.7)}
.corner{position:absolute;width:30px;height:30px;border-color:#fff;border-style:solid;opacity:.9}
.lamp{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:22px;background:rgba(245,158,11,.14);border:2px solid #F59E0B;display:flex;align-items:center;justify-content:center;font-size:32px;color:#FBBF24;box-shadow:0 0 30px rgba(245,158,11,.55)}
.beam{position:absolute;left:24px;right:24px;top:46%;height:2px;background:linear-gradient(90deg,transparent,#7DD8FF,transparent);box-shadow:0 0 14px #7DD8FF}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lt{aspect-ratio:1;border-radius:20px;background:#0E1726;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.lt .dot{position:absolute;top:9px;right:9px}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="font-bold text-[16px]">Warning lights</div>
      <div class="iconbtn"><i class="fa-solid fa-magnifying-glass"></i></div>
    </div>

    <div class="scan">
      <div class="cl"></div>
      <div class="corner" style="left:22px;top:22px;border-width:3px 0 0 3px;border-radius:10px 0 0 0"></div>
      <div class="corner" style="right:22px;top:22px;border-width:3px 3px 0 0;border-radius:0 10px 0 0"></div>
      <div class="corner" style="left:22px;bottom:22px;border-width:0 0 3px 3px;border-radius:0 0 0 10px"></div>
      <div class="corner" style="right:22px;bottom:22px;border-width:0 3px 3px 0;border-radius:0 0 10px 0"></div>
      <div class="beam"></div>
      <div class="lamp"><i class="fa-solid fa-circle-exclamation"></i></div>
      <span class="pill glass absolute" style="left:50%;bottom:22px;transform:translateX(-50%)"><i class="fa-solid fa-camera"></i>Point at your dash</span>
    </div>

    <div class="card p-4 mt-[-34px] mx-3 relative z-10">
      <div class="flex items-center gap-3.5">
        <div class="gicon g-amber" style="width:50px;height:50px;border-radius:16px;font-size:20px"><i class="fa-solid fa-circle-exclamation"></i></div>
        <div class="flex-1">
          <div class="flex items-center gap-2"><span class="font-extrabold text-[17px] tracking-tight">Low tire pressure</span></div>
          <div class="flex items-center gap-1.5 mt-0.5"><span class="dot" style="background:var(--amber)"></span><span class="text-[12.5px] font-semibold text-[color:var(--muted)]">Safe to drive slowly · check soon</span></div>
        </div>
      </div>
      <div class="flex gap-2.5 mt-4">
        <div class="btn flex-1" style="height:46px;font-size:14px;border-radius:15px"><i class="fa-solid fa-location-dot"></i>Nearest air</div>
        <div class="btn ghost flex-1" style="height:46px;font-size:14px;border-radius:15px"><i class="fa-solid fa-play"></i>How to fix</div>
      </div>
    </div>

    <div class="sec"><div class="h2">Your car's 32 lights</div>
      <div class="flex gap-3 text-[12px] font-semibold text-[color:var(--muted)]"><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--red)"></span>Stop</span><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--amber)"></span>Soon</span><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--green)"></span>Info</span></div>
    </div>
    <div class="grid4">
      <div class="lt" style="color:#F87171"><i class="fa-solid fa-oil-can"></i><span class="dot" style="background:var(--red)"></span></div>
      <div class="lt" style="color:#F87171"><i class="fa-solid fa-temperature-high"></i><span class="dot" style="background:var(--red)"></span></div>
      <div class="lt" style="color:#F87171"><i class="fa-solid fa-car-battery"></i><span class="dot" style="background:var(--red)"></span></div>
      <div class="lt" style="color:#FBBF24"><i class="fa-solid fa-circle-exclamation"></i><span class="dot" style="background:var(--amber)"></span></div>
      <div class="lt" style="color:#FBBF24"><i class="fa-solid fa-gears"></i><span class="dot" style="background:var(--amber)"></span></div>
      <div class="lt" style="color:#FBBF24"><i class="fa-solid fa-gas-pump"></i><span class="dot" style="background:var(--amber)"></span></div>
      <div class="lt" style="color:#34D399"><i class="fa-solid fa-lightbulb"></i><span class="dot" style="background:var(--green)"></span></div>
      <div class="lt" style="color:#60A5FA"><i class="fa-solid fa-road"></i><span class="dot" style="background:var(--green)"></span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab on"><i class="fa-solid fa-compass"></i>Explore</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div>
  <div class="tab"><i class="fa-solid fa-shield-halved"></i>Safety</div>
  <div class="tab"><i class="fa-solid fa-wrench"></i>Care</div>
</div>
<div class="homebar"></div>
</div></body></html>
