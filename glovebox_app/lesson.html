<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glovebox · Lesson</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.player{position:absolute;left:0;right:0;top:0;height:400px;background:url(img/wheel.jpg) center/cover}
.player:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,26,.55) 0%,rgba(8,14,26,.05) 30%,rgba(8,14,26,.1) 60%,rgba(8,14,26,.85) 100%)}
.player > *{z-index:3}
.callout{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;border-radius:12px;padding:6px 10px 6px 6px;font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.callout b{width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.scrub{position:absolute;left:28px;right:28px;bottom:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.scrub i{position:absolute;left:0;top:0;bottom:0;width:41%;background:#fff;border-radius:2px}
.scrub em{position:absolute;left:41%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff}
.scrub s{position:absolute;top:-3px;width:2px;height:10px;background:rgba(255,255,255,.7)}
.body{position:absolute;left:0;right:0;top:376px;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;z-index:10}
.st{display:flex;gap:14px;align-items:center}
.st .n{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.line{width:2px;height:18px;background:var(--border);margin-left:18px}
</style></head>
<body><div class="screen">
<div class="player">
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad flex justify-between mt-3 relative">
    <div class="iconbtn glass"><i class="fa-solid fa-chevron-down"></i></div>
    <div class="flex gap-2.5"><div class="iconbtn glass"><i class="fa-solid fa-closed-captioning"></i></div><div class="iconbtn glass"><i class="fa-solid fa-gauge-simple"></i></div></div>
  </div>
  <div class="callout" style="left:52%;top:178px"><b>1</b>Set</div>
  <div class="callout" style="left:62%;top:226px"><b>2</b>+ / −</div>
  <div class="callout" style="left:24%;top:250px"><b>3</b>Gap</div>
  <div class="absolute left-0 right-0 pad text-white" style="bottom:46px">
    <div class="flex items-center gap-2 text-[12px] font-bold opacity-80"><span class="dot" style="background:#7DD8FF"></span>BASICS · LESSON 7 OF 22</div>
  </div>
  <div class="scrub"><i></i><em></em><s style="left:33%"></s><s style="left:66%"></s></div>
</div>

<div class="body">
  <div class="pad pt-6">
    <div class="flex items-start justify-between">
      <div class="text-[26px] font-extrabold tracking-tight leading-tight">Adaptive cruise<br>control</div>
      <span class="pill" style="background:#FFF4E5;color:#B45309"><i class="fa-solid fa-star"></i>+20 XP</span>
    </div>
    <div class="flex gap-5 mt-4">
      <div><div class="text-[28px] font-extrabold num leading-none">1:48</div><div class="text-[12px] font-semibold text-[color:var(--muted)] mt-1">video</div></div>
      <div><div class="text-[28px] font-extrabold num leading-none">3</div><div class="text-[12px] font-semibold text-[color:var(--muted)] mt-1">steps</div></div>
      <div><div class="text-[28px] font-extrabold num leading-none">p.186</div><div class="text-[12px] font-semibold text-[color:var(--muted)] mt-1">manual</div></div>
    </div>

    <div class="card p-4 mt-5">
      <div class="st"><div class="n" style="background:var(--green);color:#fff"><i class="fa-solid fa-check text-[14px]"></i></div><div class="flex-1 font-bold text-[15px]">Press <span class="text-[color:var(--blue)]">SET</span> above 20 mph</div><i class="fa-solid fa-circle-play text-[20px] text-[color:var(--faint)]"></i></div>
      <div class="line"></div>
      <div class="st"><div class="n" style="background:#EAF0FF;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)">2</div><div class="flex-1 font-bold text-[15px]">Roll + / − to change speed</div><i class="fa-solid fa-circle-play text-[20px] text-[color:var(--blue)]"></i></div>
      <div class="line"></div>
      <div class="st"><div class="n" style="background:var(--surface);color:var(--muted)">3</div><div class="flex-1 font-bold text-[15px] text-[color:var(--muted)]">Tap gap for 1–4 car lengths</div><i class="fa-solid fa-circle-play text-[20px] text-[color:var(--faint)]"></i></div>
    </div>

    <div class="flex items-center gap-3 mt-4 p-3.5 rounded-[18px]" style="background:#FFF7ED">
      <i class="fa-solid fa-square-parking text-[22px]" style="color:#EA580C"></i>
      <span class="text-[13.5px] font-semibold flex-1" style="color:#9A3412">Try step 2 parked. We'll check it.</span>
      <i class="fa-solid fa-chevron-right text-[12px]" style="color:#EA580C"></i>
    </div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 pad pb-9 pt-4 z-20" style="background:linear-gradient(180deg,rgba(247,248,250,0),var(--bg) 30%)">
  <div class="btn">Next step<i class="fa-solid fa-arrow-right"></i></div>
</div>
<div class="homebar"></div>
</div></body></html>
