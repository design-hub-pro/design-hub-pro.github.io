<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VetStrong - Veteran Fitness & Community App</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #1a1a2e; min-height: 100vh; }

  .hero-section { text-align: center; padding: 80px 40px 60px; }
  .app-icon { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #FF6B35, #FFB347); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 12px 40px rgba(255,107,53,0.3); }
  .app-icon i { font-size: 36px; color: #fff; }
  .app-name { font-size: 48px; font-weight: 900; letter-spacing: -1.5px; background: linear-gradient(135deg, #FF6B35, #FFB347); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .app-tagline { font-size: 20px; color: #666; font-weight: 400; margin-top: 8px; max-width: 600px; margin-left: auto; margin-right: auto; }

  .screens-section { padding: 0 40px 80px; max-width: 1600px; margin: 0 auto; }
  .screens-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; justify-items: center; }

  .screen-item { display: flex; flex-direction: column; align-items: center; }
  .screen-label { font-size: 14px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }

  .phone-frame { width: 460px; height: 980px; border-radius: 62px; background: #0A0E1A; padding: 12px; box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05); }
  .phone-screen { width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0A0E1A; }
  .phone-screen iframe { width: 100%; height: 100%; border: none; border-radius: 52px; }
</style>
</head>
<body>
  <div class="hero-section">
    <div class="app-icon"><i class="fas fa-shield-heart"></i></div>
    <div class="app-name">VetStrong</div>
    <div class="app-tagline">Fitness, community, and wellness — built by veterans, for veterans.</div>
  </div>

  <div class="screens-section">
    <div class="screens-grid">
      <div class="screen-item">
        <div class="screen-label">Home</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="home.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>

      <div class="screen-item">
        <div class="screen-label">Workouts</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="workouts.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>

      <div class="screen-item">
        <div class="screen-label">Classes</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="classes.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>

      <div class="screen-item">
        <div class="screen-label">Community</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="community.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>

      <div class="screen-item">
        <div class="screen-label">Wellness</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="wellness.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>

      <div class="screen-item">
        <div class="screen-label">Profile</div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="profile.html" scrolling="no"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
