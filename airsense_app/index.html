<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSense - Smart Air Quality Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        body { background: #ffffff; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            background: #000;
            padding: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #f0f4f8;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1560px;
            margin: 0 auto;
            justify-items: center;
        }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <!-- Header -->
        <div class="text-center pt-16 pb-12 px-6">
            <div class="flex items-center justify-center gap-3 mb-4">
                <div class="w-14 h-14 bg-gradient-to-br from-sky-500 to-emerald-500 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-wind text-white text-2xl"></i>
                </div>
            </div>
            <h1 class="text-4xl font-bold text-gray-900 mb-2">AirSense</h1>
            <p class="text-gray-500 text-lg max-w-xl mx-auto">Smart air quality companion with sensor integration and AI-powered predictions for areas without coverage</p>
            <div class="flex items-center justify-center gap-2 mt-4">
                <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">IoT</span>
                <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Air Quality</span>
                <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">AI Prediction</span>
            </div>
        </div>

        <!-- Screenshots -->
        <div class="px-8 pb-20">
            <div class="screens-grid">
                <!-- Home -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="home.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Home Dashboard</p>
                </div>
                <!-- Map -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="map.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Air Quality Map</p>
                </div>
                <!-- Predictions -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="predict.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">AI Predictions</p>
                </div>
                <!-- Sensors -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="sensors.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Sensor Management</p>
                </div>
                <!-- Indoor Detail -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="indoor.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Indoor Detail</p>
                </div>
                <!-- Alerts -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="alerts.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Alerts & Notifications</p>
                </div>
                <!-- Profile -->
                <div>
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <iframe src="profile.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <p class="text-center text-sm font-semibold text-gray-700 mt-4">Profile</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
