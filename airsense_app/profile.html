<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSense - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; background: #f0f4f8; }

        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }

        .tab-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 85px; background: white;
            border-top: 1px solid #e5e7eb;
            display: flex; align-items: flex-start; justify-content: space-around;
            padding-top: 10px;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #9ca3af; }
        .tab-item.active { color: #0ea5e9; }
        .tab-item i { font-size: 20px; }
    </style>
</head>
<body>
    <div style="position:relative; width:100%; height:100%; overflow-y:auto; padding-bottom:90px;">
        <!-- Status Bar -->
        <div class="status-bar flex items-end justify-between pb-1 bg-white" style="position:relative;">
            <div class="dynamic-island"></div>
            <span class="text-sm font-semibold">9:41</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Profile Card -->
        <div class="bg-white px-7 pt-3 pb-6 text-center">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face"
                 class="w-20 h-20 rounded-full object-cover mx-auto mb-3 border-4 border-sky-100">
            <h2 class="text-lg font-bold text-gray-900">Alex Rivera</h2>
            <p class="text-xs text-gray-400">San Francisco, CA</p>
            <div class="flex items-center justify-center gap-4 mt-4">
                <div class="text-center">
                    <p class="text-xl font-extrabold text-gray-900">5</p>
                    <p class="text-[10px] text-gray-400">Sensors</p>
                </div>
                <div class="w-px h-8 bg-gray-200"></div>
                <div class="text-center">
                    <p class="text-xl font-extrabold text-gray-900">142</p>
                    <p class="text-[10px] text-gray-400">Days Active</p>
                </div>
                <div class="w-px h-8 bg-gray-200"></div>
                <div class="text-center">
                    <p class="text-xl font-extrabold text-emerald-600">A+</p>
                    <p class="text-[10px] text-gray-400">Avg. Indoor</p>
                </div>
            </div>
        </div>

        <!-- Monthly Summary -->
        <div class="content-area mt-4">
            <div class="bg-gradient-to-r from-sky-50 to-emerald-50 rounded-2xl p-4">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-chart-pie text-sky-600 text-sm"></i>
                    <span class="font-bold text-gray-900 text-sm">March Summary</span>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white rounded-xl p-3 text-center">
                        <p class="text-lg font-extrabold text-emerald-600">22</p>
                        <p class="text-[9px] text-gray-400">Good Days</p>
                    </div>
                    <div class="bg-white rounded-xl p-3 text-center">
                        <p class="text-lg font-extrabold text-amber-500">6</p>
                        <p class="text-[9px] text-gray-400">Moderate</p>
                    </div>
                    <div class="bg-white rounded-xl p-3 text-center">
                        <p class="text-lg font-extrabold text-red-500">1</p>
                        <p class="text-[9px] text-gray-400">Poor</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="content-area mt-5">
            <h3 class="font-bold text-gray-900 text-sm mb-3">Settings</h3>
            <div class="bg-white rounded-2xl overflow-hidden">
                <div class="flex items-center gap-4 p-4 border-b border-gray-50">
                    <div class="w-9 h-9 bg-sky-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-sky-600 text-sm"></i>
                    </div>
                    <span class="flex-1 text-sm text-gray-900">Notifications</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-4 p-4 border-b border-gray-50">
                    <div class="w-9 h-9 bg-violet-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sliders text-violet-600 text-sm"></i>
                    </div>
                    <span class="flex-1 text-sm text-gray-900">Alert Thresholds</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-4 p-4 border-b border-gray-50">
                    <div class="w-9 h-9 bg-emerald-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-cloud-arrow-down text-emerald-600 text-sm"></i>
                    </div>
                    <span class="flex-1 text-sm text-gray-900">Data Export</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-4 p-4 border-b border-gray-50">
                    <div class="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-plug text-amber-600 text-sm"></i>
                    </div>
                    <span class="flex-1 text-sm text-gray-900">Integrations</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
                <div class="flex items-center gap-4 p-4">
                    <div class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-circle-info text-gray-600 text-sm"></i>
                    </div>
                    <span class="flex-1 text-sm text-gray-900">About AirSense</span>
                    <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
                </div>
            </div>
        </div>

        <div class="content-area mt-5 mb-4">
            <button class="w-full bg-gray-100 text-red-500 font-semibold text-sm rounded-2xl py-3">Sign Out</button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tab-item">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-map"></i>
            <span>Map</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-chart-line"></i>
            <span>Predict</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-microchip"></i>
            <span>Sensors</span>
        </div>
        <div class="tab-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </div>
    </div>
</body>
</html>
