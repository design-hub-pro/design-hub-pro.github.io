<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBalance - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
            50% { box-shadow: 0 0 40px rgba(118, 75, 162, 0.8); }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .brain-float {
            animation: float 6s ease-in-out infinite;
        }
        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }
        .glow-effect {
            animation: glow 3s ease-in-out infinite;
        }
        .gradient-animated {
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #4facfe, #667eea);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card-3d {
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }
        .card-3d:active {
            transform: scale(0.95) translateZ(-20px);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }
        .neuron-bg {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(240, 147, 251, 0.1) 0%, transparent 50%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-[430px] h-[932px] bg-gradient-to-br from-gray-900 via-purple-900 to-indigo-900 rounded-[60px] shadow-2xl overflow-hidden relative">

        <!-- iOS Status Bar -->
        <div class="absolute top-0 left-0 right-0 h-12 bg-black/40 backdrop-blur-xl text-white flex items-center justify-between px-8 text-xs font-semibold z-50">
            <span>9:41</span>
            <div class="w-24 h-6 bg-black rounded-full"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <!-- Animated Background Particles -->
        <div class="absolute inset-0 neuron-bg opacity-60"></div>

        <!-- Main Content -->
        <div class="relative pt-12 pb-24 h-full overflow-y-auto">

            <!-- Hero Brain Visualization -->
            <div class="relative px-8 pt-12 pb-8">
                <div class="relative">
                    <!-- Animated Brain Container -->
                    <div class="flex justify-center mb-6 brain-float">
                        <div class="relative">
                            <!-- Glow Effect -->
                            <div class="absolute inset-0 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full blur-3xl opacity-60 glow-effect"></div>

                            <!-- Brain SVG -->
                            <div class="relative w-40 h-40 bg-gradient-to-br from-purple-500 via-pink-500 to-indigo-500 rounded-full flex items-center justify-center shadow-2xl">
                                <svg class="w-28 h-28" viewBox="0 0 100 100" fill="none">
                                    <!-- Left Hemisphere -->
                                    <path d="M30 20 Q20 30 20 50 Q20 70 30 80 Q35 75 40 70 Q35 60 35 50 Q35 40 40 30 Q35 25 30 20Z" fill="white" opacity="0.9"/>
                                    <!-- Right Hemisphere -->
                                    <path d="M70 20 Q80 30 80 50 Q80 70 70 80 Q65 75 60 70 Q65 60 65 50 Q65 40 60 30 Q65 25 70 20Z" fill="white" opacity="0.9"/>
                                    <!-- Neural Connections -->
                                    <circle cx="35" cy="35" r="3" fill="white"/>
                                    <circle cx="45" cy="45" r="3" fill="white"/>
                                    <circle cx="55" cy="45" r="3" fill="white"/>
                                    <circle cx="65" cy="35" r="3" fill="white"/>
                                    <circle cx="35" cy="65" r="3" fill="white"/>
                                    <circle cx="65" cy="65" r="3" fill="white"/>
                                    <line x1="35" y1="35" x2="45" y2="45" stroke="white" stroke-width="1" opacity="0.6"/>
                                    <line x1="55" y1="45" x2="65" y2="35" stroke="white" stroke-width="1" opacity="0.6"/>
                                    <line x1="45" y1="45" x2="55" y2="45" stroke="white" stroke-width="1" opacity="0.6"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <h1 class="text-5xl font-black text-center mb-3 text-white drop-shadow-lg">
                        MindBalance
                    </h1>
                    <p class="text-center text-purple-200 text-base font-medium">
                        Master Your Brain's Balance
                    </p>
                </div>
            </div>

            <!-- Game Stats Dashboard -->
            <div class="px-8 mb-6">
                <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 border border-white/20 shadow-2xl">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center">
                            <div class="w-16 h-16 mx-auto mb-2 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg pulse-animation">
                                <i class="fas fa-eye text-2xl text-white"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">65</div>
                            <div class="text-xs text-purple-200">Focus</div>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 mx-auto mb-2 bg-gradient-to-br from-purple-400 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg pulse-animation" style="animation-delay: 0.3s">
                                <i class="fas fa-moon text-2xl text-white"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">72</div>
                            <div class="text-xs text-purple-200">Sleep</div>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 mx-auto mb-2 bg-gradient-to-br from-pink-400 to-rose-600 rounded-2xl flex items-center justify-center shadow-lg pulse-animation" style="animation-delay: 0.6s">
                                <i class="fas fa-heart-pulse text-2xl text-white"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">88</div>
                            <div class="text-xs text-purple-200">Balance</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Action Cards -->
            <div class="px-8 space-y-5">

                <!-- Start Game - Primary Action -->
                <div class="gradient-animated rounded-3xl p-1 shadow-2xl card-3d glow-effect">
                    <div class="bg-gradient-to-br from-purple-600 to-pink-600 rounded-3xl p-6 relative overflow-hidden">
                        <div class="shimmer absolute inset-0"></div>
                        <div class="relative flex items-center justify-between">
                            <div class="flex items-center">
                                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mr-4 backdrop-blur-sm">
                                    <i class="fas fa-gamepad text-3xl text-white"></i>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-bold text-white mb-1">Start Challenge</h3>
                                    <p class="text-white/80 text-sm">7-Day Brain Balance Game</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-white text-2xl"></i>
                        </div>
                    </div>
                </div>

                <!-- Learn Card -->
                <div class="bg-gradient-to-br from-blue-500/20 to-cyan-500/20 backdrop-blur-xl rounded-3xl p-6 border border-blue-400/30 shadow-xl card-3d">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-14 h-14 bg-gradient-to-br from-blue-400 to-cyan-500 rounded-xl flex items-center justify-center mr-4 shadow-lg">
                                <i class="fas fa-brain text-2xl text-white"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1">Learn Science</h3>
                                <p class="text-blue-200 text-sm">How your brain works</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-blue-300 text-xl"></i>
                    </div>
                </div>

                <!-- Progress Card -->
                <div class="bg-gradient-to-br from-green-500/20 to-emerald-500/20 backdrop-blur-xl rounded-3xl p-6 border border-green-400/30 shadow-xl card-3d">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-emerald-500 rounded-xl flex items-center justify-center mr-4 shadow-lg">
                                <i class="fas fa-trophy text-2xl text-white"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1">My Progress</h3>
                                <p class="text-green-200 text-sm">View achievements</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-green-300 text-xl"></i>
                    </div>
                </div>

            </div>

            <!-- Achievement Preview -->
            <div class="px-8 mt-8">
                <h3 class="text-white font-bold mb-4 flex items-center">
                    <i class="fas fa-medal text-yellow-400 mr-2"></i>
                    Next Achievement
                </h3>
                <div class="bg-gradient-to-r from-yellow-500/20 to-orange-500/20 backdrop-blur-xl rounded-2xl p-5 border border-yellow-400/30">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center mr-4">
                            <i class="fas fa-star text-white text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-white font-semibold mb-1">First Victory</div>
                            <div class="w-full bg-white/20 rounded-full h-2">
                                <div class="bg-gradient-to-r from-yellow-400 to-orange-500 h-2 rounded-full" style="width: 30%"></div>
                            </div>
                        </div>
                        <div class="text-yellow-400 font-bold ml-3">30%</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Tab Bar -->
        <div class="absolute bottom-0 left-0 right-0 h-24 bg-black/40 backdrop-blur-2xl border-t border-white/10">
            <div class="flex items-start justify-around pt-3 px-4">
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center mb-1 shadow-lg">
                        <i class="fas fa-home text-white text-xl"></i>
                    </div>
                    <span class="text-xs text-white font-semibold">Home</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-1">
                        <i class="fas fa-graduation-cap text-white/60 text-xl"></i>
                    </div>
                    <span class="text-xs text-white/60">Learn</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-1">
                        <i class="fas fa-gamepad text-white/60 text-xl"></i>
                    </div>
                    <span class="text-xs text-white/60">Play</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-1">
                        <i class="fas fa-user text-white/60 text-xl"></i>
                    </div>
                    <span class="text-xs text-white/60">Profile</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
