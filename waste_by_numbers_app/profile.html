<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waste by the Numbers — Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#F2F5EF; color:#14241B; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; padding-bottom:108px; }

  .dynamic-island { width:120px; height:36px; background:#0A0A0A; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; color:#fff; position:relative; z-index:5; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  .prof-bg { position:absolute; top:0; left:0; right:0; height:250px; background:linear-gradient(160deg,#0E9F6E 0%,#065F46 100%); border-radius:0 0 36px 36px; overflow:hidden; }
  .prof-bg::before { content:''; position:absolute; left:-30px; bottom:-50px; width:180px; height:180px; background:radial-gradient(circle,rgba(190,242,100,0.22),transparent 70%); }
  .prof-bg::after { content:''; position:absolute; right:-30px; top:-30px; width:150px; height:150px; background:radial-gradient(circle,rgba(255,255,255,0.14),transparent 70%); }

  .topbar { padding:4px 28px 0; display:flex; justify-content:flex-end; position:relative; z-index:5; }
  .gear { width:38px; height:38px; border-radius:13px; background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; color:#fff; }

  .prof-head { text-align:center; position:relative; z-index:5; padding:8px 28px 0; color:#fff; }
  .prof-av { width:92px; height:92px; border-radius:30px; object-fit:cover; border:3px solid rgba(255,255,255,0.4); margin:0 auto; display:block; }
  .prof-name { font-size:21px; font-weight:900; margin-top:12px; letter-spacing:-0.5px; }
  .prof-role { font-size:12px; opacity:0.85; margin-top:3px; }
  .prof-role .role-pill { background:rgba(190,242,100,0.22); color:#BEF264; padding:3px 10px; border-radius:8px; font-weight:800; font-size:10px; margin-left:6px; }

  /* Impact stat card */
  .impact { margin:18px 28px 0; background:#fff; border:1px solid #E3EAE2; border-radius:24px; padding:6px; display:flex; box-shadow:0 10px 26px rgba(20,36,27,0.08); position:relative; z-index:5; }
  .impact-cell { flex:1; text-align:center; padding:16px 6px; }
  .impact-cell + .impact-cell { border-left:1px solid #F0F2EE; }
  .impact-v { font-size:24px; font-weight:900; letter-spacing:-1px; }
  .impact-l { font-size:10px; font-weight:600; color:#7A8C82; margin-top:3px; }

  .section-title { padding:24px 28px 12px; font-size:16px; font-weight:800; }

  /* Badges */
  .badges { padding:0 28px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .badge { text-align:center; }
  .badge-ico { width:100%; aspect-ratio:1; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; }
  .badge-name { font-size:9.5px; font-weight:700; margin-top:6px; color:#445; line-height:1.2; }
  .badge.locked .badge-ico { background:#E8ECE6; color:#BBC6BE; }
  .badge.locked .badge-name { color:#A6B3AB; }

  /* Personal impact equiv */
  .equiv { margin:8px 28px 0; background:#0F291E; border-radius:22px; padding:18px; color:#fff; display:flex; align-items:center; gap:16px; position:relative; overflow:hidden; }
  .equiv::before { content:''; position:absolute; right:-20px; top:-20px; width:110px; height:110px; background:radial-gradient(circle,rgba(190,242,100,0.18),transparent 70%); }
  .equiv-ico { width:50px; height:50px; border-radius:16px; background:rgba(190,242,100,0.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .equiv-ico i { font-size:22px; color:#BEF264; }
  .equiv-v { font-size:22px; font-weight:900; letter-spacing:-0.5px; }
  .equiv-l { font-size:11.5px; opacity:0.7; margin-top:2px; line-height:1.4; }

  /* Settings rows */
  .menu { margin:18px 28px 0; background:#fff; border:1px solid #E3EAE2; border-radius:22px; overflow:hidden; }
  .menu-row { display:flex; align-items:center; gap:14px; padding:15px 18px; border-bottom:1px solid #F0F2EE; }
  .menu-row:last-child { border-bottom:none; }
  .menu-ico { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .menu-label { flex:1; font-size:14px; font-weight:600; }
  .menu-chev { color:#C2CCC5; font-size:13px; }

  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:92px; background:rgba(255,255,255,0.94); backdrop-filter:blur(20px); display:flex; justify-content:space-around; align-items:flex-start; padding-top:12px; border-top:0.5px solid #E3EAE2; }
  .tab-item { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:54px; }
  .tab-item i { font-size:19px; color:#A6B3AB; }
  .tab-item span { font-size:10px; color:#A6B3AB; font-weight:600; }
  .tab-item.active i, .tab-item.active span { color:#0E9F6E; }
  .tab-scan-btn { width:56px; height:56px; border-radius:20px; background:linear-gradient(135deg,#BEF264,#65A30D); display:flex; align-items:center; justify-content:center; margin-top:-16px; box-shadow:0 10px 24px rgba(101,163,13,0.4); }
  .tab-scan-btn i { font-size:22px; color:#1A2E05; }
</style>
</head>
<body>
<div class="screen">
  <div class="prof-bg"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="topbar"><div class="gear"><i class="fas fa-gear"></i></div></div>

  <div class="prof-head">
    <img class="prof-av" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=240&q=80">
    <div class="prof-name">Maya Chen</div>
    <div class="prof-role">Grade 11 · Room 226 <span class="role-pill">CLUB LEAD</span></div>
  </div>

  <div class="impact">
    <div class="impact-cell"><div class="impact-v">71</div><div class="impact-l">Trays Scanned</div></div>
    <div class="impact-cell"><div class="impact-v" style="color:#0E9F6E">38 lb</div><div class="impact-l">Waste Cut</div></div>
    <div class="impact-cell"><div class="impact-v" style="color:#F59E0B">$96</div><div class="impact-l">Saved</div></div>
  </div>

  <div class="section-title">Badges earned</div>
  <div class="badges">
    <div class="badge">
      <div class="badge-ico" style="background:linear-gradient(140deg,#0E9F6E,#065F46)"><i class="fas fa-camera"></i></div>
      <div class="badge-name">First Scan</div>
    </div>
    <div class="badge">
      <div class="badge-ico" style="background:linear-gradient(140deg,#F59E0B,#D97706)"><i class="fas fa-fire"></i></div>
      <div class="badge-name">14-Day Streak</div>
    </div>
    <div class="badge">
      <div class="badge-ico" style="background:linear-gradient(140deg,#65A30D,#3F6212)"><i class="fas fa-seedling"></i></div>
      <div class="badge-name">Compost Pro</div>
    </div>
    <div class="badge locked">
      <div class="badge-ico"><i class="fas fa-lock"></i></div>
      <div class="badge-name">100 Scans</div>
    </div>
  </div>

  <div style="height:18px"></div>
  <div class="equiv">
    <div class="equiv-ico"><i class="fas fa-car"></i></div>
    <div>
      <div class="equiv-v">112 miles</div>
      <div class="equiv-l">of driving emissions avoided by the food you helped save</div>
    </div>
  </div>

  <div class="menu">
    <div class="menu-row">
      <div class="menu-ico" style="background:#0E9F6E"><i class="fas fa-clipboard-question"></i></div>
      <div class="menu-label">My food surveys</div>
      <i class="fas fa-chevron-right menu-chev"></i>
    </div>
    <div class="menu-row">
      <div class="menu-ico" style="background:#0EA5E9"><i class="fas fa-trophy"></i></div>
      <div class="menu-label">Class leaderboard</div>
      <i class="fas fa-chevron-right menu-chev"></i>
    </div>
    <div class="menu-row">
      <div class="menu-ico" style="background:#8B5CF6"><i class="fas fa-bell"></i></div>
      <div class="menu-label">Notifications</div>
      <i class="fas fa-chevron-right menu-chev"></i>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item"><i class="fas fa-chart-line"></i><span>Insights</span></div>
    <div class="tab-item"><button class="tab-scan-btn"><i class="fas fa-camera"></i></button></div>
    <div class="tab-item"><i class="fas fa-leaf"></i><span>Learn</span></div>
    <div class="tab-item active"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
