<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste by the Numbers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#F4FAF0; color:#0F291E; scrollbar-width:none; -webkit-font-smoothing:antialiased; }

  /* SCREENSHOTS */
  .screenshots-section { max-width:1600px; margin:0 auto; padding:90px 40px 100px; }
  .section-title { text-align:center; font-size:40px; font-weight:900; margin-bottom:56px; letter-spacing:-1px; }
  .screenshots-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:40px; max-width:1540px; margin:0 auto; justify-items:center; }
  .phone-wrapper { display:flex; flex-direction:column; align-items:center; gap:20px; }
  .phone-label { font-size:15px; font-weight:700; }
  .phone-sublabel { font-size:12px; color:#999; margin-top:4px; }
  .phone-frame { width:460px; height:980px; border-radius:62px; background:#000; padding:12px; box-shadow:0 50px 100px -20px rgba(0,0,0,0.18), 0 30px 60px -30px rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,255,255,0.1); position:relative; }
  .phone-screen { width:100%; height:100%; border-radius:52px; overflow:hidden; background:#0F291E; }
  .phone-screen iframe { width:100%; height:100%; border:none; border-radius:52px; }

  @media (max-width:1500px) { .screenshots-grid { gap:30px; } .phone-frame { width:420px; height:895px; border-radius:56px; padding:11px; } .phone-screen, .phone-screen iframe { border-radius:47px; } }
  @media (max-width:1380px) { .screenshots-grid { gap:24px; } .phone-frame { width:380px; height:810px; border-radius:52px; padding:10px; } .phone-screen, .phone-screen iframe { border-radius:44px; } }
  @media (max-width:1200px) { .phone-frame { width:340px; height:724px; border-radius:48px; padding:9px; } .phone-screen, .phone-screen iframe { border-radius:40px; } }
  @media (max-width:1050px) { .screenshots-grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:700px) { .screenshots-grid { grid-template-columns:1fr; } .section-title { font-size:30px; } }
</style>
</head>
<body>

  <!-- SCREENSHOTS -->
  <div class="screenshots-section">
    <div class="section-title">Waste by the Numbers</div>

    <div class="screenshots-grid">
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Welcome</div><div class="phone-sublabel">Join Your School Club</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Home Dashboard</div><div class="phone-sublabel">Live Savings &amp; Flagged Items</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="scan.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">AI Tray Scan</div><div class="phone-sublabel">Weight &amp; Cost Estimate</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="insights.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Insights</div><div class="phone-sublabel">Patterns &amp; AI Forecasts</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="survey.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Food Survey</div><div class="phone-sublabel">Smarter Kitchen Planning</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="learn.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Learn</div><div class="phone-sublabel">Compost &amp; Recycle 101</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="leaderboard.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Leaderboard</div><div class="phone-sublabel">Class vs. Class Challenge</div></div>
      </div>
      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center"><div class="phone-label">Profile</div><div class="phone-sublabel">Personal Impact &amp; Badges</div></div>
      </div>
    </div>
  </div>

</body>
</html>
