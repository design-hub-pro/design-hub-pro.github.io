<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forkcast · Dish</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.mac{border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--border);padding:13px 12px}
.side{border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--border);padding:8px;width:104px}
.side.on{box-shadow:0 0 0 2px var(--green)}
</style>
</head>
<body><div class="screen">
<div class="absolute top-0 left-0 right-0 h-[380px] img" style="background-image:url(img/salad.jpg)"></div>
<div class="absolute top-0 left-0 right-0 h-[140px]" style="background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0))"></div>
<div class="sb light"><span class="t num">9:42</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></div></div>
<div class="pad relative z-10 flex justify-between mt-3">
  <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
  <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-heart" style="color:#FF8A7A"></i></div>
</div>

<div class="absolute left-0 right-0 bottom-0 top-[330px] rounded-t-[34px] pad pt-6" style="background:var(--bg)">
  <div class="flex justify-between items-start">
    <div>
      <div class="flex items-center gap-2"><span class="dot" style="background:var(--green)"></span><span class="meta" style="color:var(--green2)">Salad bar · Wed</span></div>
      <div class="text-[26px] font-extrabold tracking-tight leading-tight mt-1.5">Quinoa chickpea bowl</div>
    </div>
    <div class="text-[26px] font-extrabold num">$4.25</div>
  </div>

  <div class="grid grid-cols-4 gap-2.5 mt-5">
    <div class="mac"><div class="text-[20px] font-extrabold num leading-none">540</div><div class="text-[11px] font-bold text-[color:var(--muted)] mt-1">kcal</div><div class="bar mt-2.5" style="height:5px"><i style="width:68%;background:var(--orange)"></i></div></div>
    <div class="mac"><div class="text-[20px] font-extrabold num leading-none">21g</div><div class="text-[11px] font-bold text-[color:var(--muted)] mt-1">Protein</div><div class="bar mt-2.5" style="height:5px"><i style="width:55%;background:var(--blue)"></i></div></div>
    <div class="mac"><div class="text-[20px] font-extrabold num leading-none">11g</div><div class="text-[11px] font-bold text-[color:var(--muted)] mt-1">Fiber</div><div class="bar mt-2.5" style="height:5px"><i style="width:80%;background:var(--green)"></i></div></div>
    <div class="mac"><div class="text-[20px] font-extrabold num leading-none">4g</div><div class="text-[11px] font-bold text-[color:var(--muted)] mt-1">Sugar</div><div class="bar mt-2.5" style="height:5px"><i style="width:15%;background:var(--violet)"></i></div></div>
  </div>

  <div class="flex items-center gap-3 mt-4 rounded-[18px] p-3.5" style="background:#ECFDF3">
    <div class="gicon g-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div class="text-[13px] font-semibold leading-snug" style="color:#05603A">Your week is low on veg. This covers <b>2 of 3</b> servings.</div>
  </div>

  <div class="flex items-center gap-2 mt-4">
    <span class="text-[12.5px] font-bold text-[color:var(--muted)] mr-1">Contains</span>
    <span class="pill" style="background:#FFFAEB;color:#B54708"><i class="fa-solid fa-cheese"></i>Dairy</span>
    <span class="pill" style="background:var(--surface);color:var(--ink2)"><i class="fa-solid fa-ban"></i>No nuts</span>
  </div>

  <div class="h2 mt-5" style="font-size:16px">Add a side</div>
  <div class="flex gap-3 mt-3">
    <div class="side on"><div class="img h-[62px] rounded-[12px]" style="background-image:url(img/fruit.jpg)"></div><div class="text-[12px] font-bold mt-1.5">Fruit cup</div><div class="text-[11.5px] font-semibold text-[color:var(--muted)] num">+$1.25</div></div>
    <div class="side"><div class="img h-[62px] rounded-[12px]" style="background-image:url(img/wrap.jpg)"></div><div class="text-[12px] font-bold mt-1.5">Half wrap</div><div class="text-[11.5px] font-semibold text-[color:var(--muted)] num">+$2.00</div></div>
    <div class="side"><div class="h-[62px] rounded-[12px] flex items-center justify-center text-[22px]" style="background:#EFF8FF;color:var(--blue)"><i class="fa-solid fa-bottle-water"></i></div><div class="text-[12px] font-bold mt-1.5">Milk</div><div class="text-[11.5px] font-semibold text-[color:var(--muted)] num">Free</div></div>
  </div>

  <div class="absolute left-[28px] right-[28px] bottom-[38px] flex gap-3">
    <div class="flex items-center gap-4 px-4 rounded-[18px] bg-white" style="box-shadow:0 0 0 1px var(--border)"><i class="fa-solid fa-minus text-[color:var(--muted)]"></i><span class="font-extrabold num">1</span><i class="fa-solid fa-plus"></i></div>
    <div class="btn grn flex-1">Add to Wednesday <span class="opacity-70 num">· $5.50</span></div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
