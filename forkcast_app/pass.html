<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forkcast · Pickup pass</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
#qr{display:grid;grid-template-columns:repeat(25,1fr);width:176px;height:176px}
#qr i{display:block}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:700;width:64px;text-align:center}
.step .b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
</style>
</head>
<body><div class="screen dark" style="background:radial-gradient(120% 60% at 50% 0%,#0B3B2A 0%,#0C111D 60%)">
<div class="sb light"><span class="t num">11:44</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></div></div>
<div class="pad">
  <div class="flex justify-between items-center mt-4">
    <div class="w-11 h-11 rounded-[15px] flex items-center justify-center" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-xmark"></i></div>
    <span class="pill" style="background:rgba(166,239,103,.15);color:var(--lime)"><span class="live"></span>On the shelf</span>
    <div class="w-11 h-11 rounded-[15px] flex items-center justify-center" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-sun"></i></div>
  </div>

  <div class="text-center mt-7">
    <div class="meta" style="color:#85888E">Your shelf</div>
    <div class="text-[64px] font-black tracking-[-3px] leading-none mt-2" style="color:var(--lime)">B4</div>
    <div class="text-[15px] font-semibold dmuted mt-2">East doors · 40 sec walk</div>
  </div>

  <div class="mx-auto mt-7 w-[232px] h-[232px] rounded-[34px] bg-white flex items-center justify-center relative">
    <div id="qr"></div>
    <div class="absolute w-12 h-12 rounded-[14px] flex items-center justify-center text-white text-[19px]" style="background:var(--grad);box-shadow:0 0 0 6px #fff"><i class="fa-solid fa-utensils"></i></div>
  </div>
  <div class="text-center text-[13px] font-semibold dmuted mt-4 num">Order #4417 · Maya Chen</div>

  <div class="dcard p-5 mt-7">
    <div class="flex justify-between items-start">
      <div class="step"><div class="b" style="background:var(--green)"><i class="fa-solid fa-check"></i></div><span>Ordered</span></div>
      <div class="flex-1 h-[3px] mt-4 rounded" style="background:var(--green)"></div>
      <div class="step"><div class="b" style="background:var(--green)"><i class="fa-solid fa-check"></i></div><span>Prepped</span></div>
      <div class="flex-1 h-[3px] mt-4 rounded" style="background:var(--green)"></div>
      <div class="step"><div class="b" style="background:var(--lime);color:#0C111D;box-shadow:0 0 0 5px rgba(166,239,103,.2)"><i class="fa-solid fa-box"></i></div><span style="color:var(--lime)">On shelf</span></div>
      <div class="flex-1 h-[3px] mt-4 rounded" style="background:rgba(255,255,255,.12)"></div>
      <div class="step dmuted"><div class="b" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-hand"></i></div><span>Picked up</span></div>
    </div>
  </div>

  <div class="dcard p-4 mt-3.5 flex items-center gap-4">
    <div class="img w-[58px] h-[58px] rounded-[16px]" style="background-image:url(img/bowl.jpg)"></div>
    <div class="flex-1"><div class="font-bold text-[15px]">Teriyaki chicken bowl</div><div class="text-[12.5px] font-semibold dmuted mt-0.5">+ Fruit cup · Kept at 140°F</div></div>
    <div class="text-right"><div class="text-[22px] font-extrabold num leading-none">18</div><div class="text-[10.5px] font-bold dmuted">MIN SAVED</div></div>
  </div>
</div>
<div class="homebar w"></div>
<script>
(function(){var q=document.getElementById('qr'),n=25,s=7;function f(r,c){var ins=(a,b)=>r>=a&&r<a+s&&c>=b&&c<b+s;var corners=[[0,0],[0,n-s],[n-s,0]];for(var k=0;k<3;k++){var a=corners[k][0],b=corners[k][1];if(ins(a,b)){var y=r-a,x=c-b;return y==0||y==6||x==0||x==6||(y>=2&&y<=4&&x>=2&&x<=4);}}if(r<8&&c<8||r<8&&c>=n-8||r>=n-8&&c<8)return false;return ((r*31+c*17+r*c*7)%11)<5;}
for(var r=0;r<n;r++)for(var c=0;c<n;c++){var i=document.createElement('i');if(f(r,c))i.style.background='#0C111D';q.appendChild(i);}})();
</script>
</div></body></html>
