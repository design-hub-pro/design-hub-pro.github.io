<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forkcast · Live lines</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.q{display:flex;gap:3px}
.q i{width:7px;height:20px;border-radius:3px;background:var(--surface)}
.opt{flex:1;border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink2)}
.opt i{display:block;font-size:17px;margin-bottom:5px}
</style>
</head>
<body><div class="screen">
<div class="sb"><span class="t num">11:46</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></div></div>
<div class="pad">
  <div class="flex justify-between items-center mt-4">
    <div><div class="meta flex items-center gap-2"><span class="live"></span>Live · Lunch A</div><div class="h1 mt-1">Lines</div></div>
    <div class="flex items-center gap-2"><div class="avs"><img src="img/student1.jpg"><img src="img/student2.jpg"><img src="img/chef.jpg"></div><span class="text-[12px] font-bold text-[color:var(--muted)] num">63 reports</span></div>
  </div>

  <div class="card px-4 mt-5">
    <div class="row">
      <div class="gicon g-red"><i class="fa-solid fa-burger"></i></div>
      <div class="flex-1"><div class="font-bold text-[15px]">Grill</div><div class="q mt-1.5"><i style="background:var(--red)"></i><i style="background:var(--red)"></i><i style="background:var(--red)"></i><i style="background:var(--red)"></i><i style="background:var(--red)"></i><i></i></div></div>
      <div class="text-right"><div class="text-[26px] font-extrabold num leading-none">22<span class="text-[13px] text-[color:var(--muted)]">m</span></div><div class="text-[11px] font-bold mt-1" style="color:var(--green2)"><i class="fa-solid fa-circle-check"></i> 11 confirm</div></div>
    </div>
    <div class="row">
      <div class="gicon g-orange"><i class="fa-solid fa-bowl-food"></i></div>
      <div class="flex-1"><div class="font-bold text-[15px]">Pasta</div><div class="q mt-1.5"><i style="background:var(--amber)"></i><i style="background:var(--amber)"></i><i style="background:var(--amber)"></i><i></i><i></i><i></i></div></div>
      <div class="text-right"><div class="text-[26px] font-extrabold num leading-none">9<span class="text-[13px] text-[color:var(--muted)]">m</span></div><div class="text-[11px] font-bold mt-1" style="color:var(--green2)"><i class="fa-solid fa-circle-check"></i> 6 confirm</div></div>
    </div>
    <div class="row">
      <div class="gicon g-green"><i class="fa-solid fa-seedling"></i></div>
      <div class="flex-1"><div class="font-bold text-[15px]">Salad bar</div><div class="q mt-1.5"><i style="background:var(--green)"></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="text-right"><div class="text-[26px] font-extrabold num leading-none">3<span class="text-[13px] text-[color:var(--muted)]">m</span></div><div class="text-[11px] font-bold mt-1" style="color:var(--amber)"><i class="fa-solid fa-circle-question"></i> 2 confirm</div></div>
    </div>
    <div class="row">
      <div class="gicon g-ink"><i class="fa-solid fa-box"></i></div>
      <div class="flex-1"><div class="font-bold text-[15px]">Pre-order shelf</div><div class="text-[12px] font-semibold text-[color:var(--muted)] mt-0.5">Scan and go</div></div>
      <div class="text-right"><div class="text-[26px] font-extrabold num leading-none" style="color:var(--green2)">0<span class="text-[13px]">m</span></div></div>
    </div>
  </div>

  <div class="flex items-center gap-2.5 mt-3.5 text-[12.5px] font-semibold text-[color:var(--muted)]">
    <i class="fa-solid fa-chart-line" style="color:var(--violet)"></i>Grill is <b class="text-[color:var(--ink)]">5 min over</b> forecast. Pizza day.
  </div>
</div>

<!-- report sheet -->
<div class="absolute left-0 right-0 bottom-0 rounded-t-[34px] bg-white pad pt-3 pb-[44px]" style="box-shadow:0 -20px 40px -20px rgba(16,24,40,.25)">
  <div class="w-10 h-[5px] rounded-full mx-auto" style="background:var(--border)"></div>
  <div class="flex justify-between items-center mt-4">
    <div class="font-bold text-[17px] tracking-tight">You're in the Grill line?</div>
    <span class="pill" style="background:#F4F3FF;color:var(--violet)"><i class="fa-solid fa-location-dot"></i>Near Grill</span>
  </div>
  <div class="text-[13px] font-semibold text-[color:var(--muted)] mt-1">Others say <b class="text-[color:var(--ink)] num">22 min</b>. Is that right?</div>
  <div class="flex gap-2.5 mt-4">
    <div class="opt"><i class="fa-solid fa-angles-down" style="color:var(--green)"></i>Shorter</div>
    <div class="opt" style="background:var(--ink);color:#fff"><i class="fa-solid fa-check" style="color:var(--lime)"></i>About right</div>
    <div class="opt"><i class="fa-solid fa-angles-up" style="color:var(--red)"></i>Longer</div>
  </div>
  <div class="flex items-center justify-between mt-4 rounded-[18px] px-4 py-3" style="background:var(--surface)">
    <span class="text-[13px] font-semibold text-[color:var(--ink2)]">Or set your own</span>
    <div class="flex items-center gap-4"><i class="fa-solid fa-minus text-[color:var(--muted)]"></i><span class="text-[20px] font-extrabold num">25 min</span><i class="fa-solid fa-plus"></i></div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
