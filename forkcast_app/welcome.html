<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forkcast · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body><div class="screen dark">
<div class="absolute inset-0 img" style="background-image:url(img/hall.jpg)"></div>
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(12,17,29,.15) 0%,rgba(12,17,29,.35) 35%,rgba(12,17,29,.96) 66%,#0C111D 100%)"></div>
<div class="sb light"><span class="t num">7:58</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></div></div>

<div class="pad relative z-10 mt-5 flex justify-between items-center">
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-[13px] flex items-center justify-center text-[17px]" style="background:var(--grad)"><i class="fa-solid fa-utensils"></i></div>
    <span class="text-[19px] font-extrabold tracking-tight">Forkcast</span>
  </div>
  <span class="pill glass"><span class="live"></span>Lincoln High</span>
</div>

<div class="absolute left-0 right-0 bottom-0 pad pb-12 z-10">
  <div class="flex gap-2 mb-6">
    <span class="pill glass"><i class="fa-regular fa-clock"></i><span class="num">Line now 18 min</span></span>
    <span class="pill" style="background:var(--lime);color:#0C111D"><i class="fa-solid fa-bolt"></i>Pre-order 0 min</span>
  </div>
  <div class="text-[44px] font-extrabold tracking-[-1.8px] leading-[1.02]">Lunch,<br>without<br>the line.</div>
  <div class="text-[16px] text-white/70 font-medium mt-4 leading-snug">Order the night before. Walk in, grab it, sit down.</div>

  <div class="grid grid-cols-3 gap-3 mt-8">
    <div class="rounded-[20px] p-3.5" style="background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.08)">
      <div class="gicon g-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-bag-shopping"></i></div>
      <div class="text-[13px] font-bold mt-3">Order ahead</div>
    </div>
    <div class="rounded-[20px] p-3.5" style="background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.08)">
      <div class="gicon g-orange" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-leaf"></i></div>
      <div class="text-[13px] font-bold mt-3">Eat balanced</div>
    </div>
    <div class="rounded-[20px] p-3.5" style="background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.08)">
      <div class="gicon g-blue" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-tower-broadcast"></i></div>
      <div class="text-[13px] font-bold mt-3">Live wait</div>
    </div>
  </div>

  <div class="btn mt-8" style="background:#fff;color:#0C111D"><i class="fa-solid fa-graduation-cap"></i>I'm a student</div>
  <div class="btn mt-3" style="background:rgba(255,255,255,.08);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14)"><i class="fa-solid fa-kitchen-set"></i>I run the kitchen</div>
  <div class="text-center text-[12.5px] text-white/45 font-medium mt-5">Sign in with your school account</div>
</div>
<div class="homebar w"></div>
</div></body></html>
