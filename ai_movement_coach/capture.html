<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Movement Coach - Capture</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
*::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #000; color: #fff; width: 100%; height: 100vh; overflow: hidden; position: relative; }

/* Camera View Background */
.camera-bg { position: absolute; inset: 0; z-index: 0; }
.camera-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); }

/* Status Bar */
.status-bar { height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 100; }
.status-time { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.dynamic-island { width: 126px; height: 37px; background: #000; border-radius: 20px; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); }
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 15px; }

/* Top Controls */
.top-controls { position: relative; z-index: 10; padding: 8px 28px; display: flex; justify-content: space-between; align-items: center; }
.back-btn { width: 40px; height: 40px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: #fff; font-size: 18px; }
.recording-indicator { display: flex; align-items: center; gap: 8px; background: rgba(239,68,68,0.25); backdrop-filter: blur(20px); padding: 6px 14px; border-radius: 20px; }
.rec-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.recording-indicator span { font-size: 13px; font-weight: 600; color: #ef4444; }
.settings-btn { width: 40px; height: 40px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: #fff; font-size: 18px; }

/* Pose Skeleton Overlay */
.pose-overlay { position: absolute; inset: 0; z-index: 5; }
.skeleton-line { stroke: #818cf8; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(129,140,248,0.6)); }
.skeleton-joint { fill: #a78bfa; filter: drop-shadow(0 0 8px rgba(167,139,250,0.8)); }
.skeleton-joint-active { fill: #4ade80; filter: drop-shadow(0 0 10px rgba(74,222,128,0.8)); }

/* AI Feedback Bubble */
.ai-bubble { position: absolute; top: 140px; right: 20px; z-index: 20; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 16px; max-width: 180px; border: 1px solid rgba(129,140,248,0.3); }
.ai-bubble .ai-label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ai-bubble .ai-label i { font-size: 12px; color: #818cf8; }
.ai-bubble .ai-label span { font-size: 11px; color: #818cf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.ai-bubble p { font-size: 13px; color: rgba(255,255,255,0.9); line-height: 1.4; }

/* Angle Indicator */
.angle-indicator { position: absolute; z-index: 15; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 1.5px solid; }
.angle-good { color: #4ade80; border-color: rgba(74,222,128,0.4); }
.angle-warn { color: #fbbf24; border-color: rgba(251,191,36,0.4); }

/* Live Score */
.live-score { position: absolute; top: 140px; left: 20px; z-index: 20; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border-radius: 20px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
.live-score .score-num { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #4ade80, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.live-score .score-label { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* Mode Selector */
.mode-selector { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); padding: 4px; border-radius: 14px; }
.mode-btn { padding: 8px 16px; border-radius: 10px; border: none; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; background: transparent; cursor: pointer; }
.mode-btn.active { background: rgba(255,255,255,0.15); color: #fff; }

/* Bottom Controls */
.bottom-controls { position: absolute; bottom: 50px; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-around; align-items: center; padding: 0 40px; }
.bottom-btn { width: 48px; height: 48px; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; color: #fff; font-size: 20px; }
.record-btn { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; background: transparent; position: relative; cursor: pointer; }
.record-btn-inner { width: 64px; height: 64px; border-radius: 50%; background: #ef4444; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse-record 2s infinite; }
@keyframes pulse-record { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(0.9); } }

/* Timer */
.timer { position: absolute; bottom: 145px; left: 50%; transform: translateX(-50%); z-index: 20; font-size: 15px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); padding: 6px 18px; border-radius: 20px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- Camera Background -->
<div class="camera-bg">
  <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=800&q=80" alt="Pose">
</div>

<!-- Pose Skeleton SVG -->
<svg class="pose-overlay" viewBox="0 0 436 956">
  <!-- Torso -->
  <line class="skeleton-line" x1="218" y1="280" x2="218" y2="420"/>
  <!-- Shoulders -->
  <line class="skeleton-line" x1="160" y1="310" x2="276" y2="310"/>
  <!-- Left Arm -->
  <line class="skeleton-line" x1="160" y1="310" x2="120" y2="400"/>
  <line class="skeleton-line" x1="120" y1="400" x2="95" y2="480"/>
  <!-- Right Arm -->
  <line class="skeleton-line" x1="276" y1="310" x2="320" y2="390"/>
  <line class="skeleton-line" x1="320" y1="390" x2="345" y2="310"/>
  <!-- Hips -->
  <line class="skeleton-line" x1="185" y1="420" x2="251" y2="420"/>
  <!-- Left Leg -->
  <line class="skeleton-line" x1="185" y1="420" x2="170" y2="560"/>
  <line class="skeleton-line" x1="170" y1="560" x2="160" y2="700"/>
  <!-- Right Leg -->
  <line class="skeleton-line" x1="251" y1="420" x2="265" y2="560"/>
  <line class="skeleton-line" x1="265" y1="560" x2="275" y2="700"/>
  <!-- Head -->
  <circle class="skeleton-joint" cx="218" cy="260" r="22"/>
  <!-- Joints -->
  <circle class="skeleton-joint-active" cx="160" cy="310" r="7"/>
  <circle class="skeleton-joint-active" cx="276" cy="310" r="7"/>
  <circle class="skeleton-joint" cx="120" cy="400" r="6"/>
  <circle class="skeleton-joint" cx="95" cy="480" r="5"/>
  <circle class="skeleton-joint" cx="320" cy="390" r="6"/>
  <circle class="skeleton-joint-active" cx="345" cy="310" r="5"/>
  <circle class="skeleton-joint" cx="185" cy="420" r="6"/>
  <circle class="skeleton-joint" cx="251" cy="420" r="6"/>
  <circle class="skeleton-joint" cx="170" cy="560" r="6"/>
  <circle class="skeleton-joint" cx="265" cy="560" r="6"/>
  <circle class="skeleton-joint" cx="160" cy="700" r="5"/>
  <circle class="skeleton-joint" cx="275" cy="700" r="5"/>
</svg>

<!-- Status Bar -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="dynamic-island"></div>
  <div class="status-icons">
    <i class="fas fa-signal"></i>
    <i class="fas fa-wifi"></i>
    <i class="fas fa-battery-full"></i>
  </div>
</div>

<!-- Top Controls -->
<div class="top-controls">
  <button class="back-btn"><i class="fas fa-chevron-left"></i></button>
  <div class="recording-indicator">
    <div class="rec-dot"></div>
    <span>REC</span>
  </div>
  <button class="settings-btn"><i class="fas fa-sliders"></i></button>
</div>

<!-- Live Score -->
<div class="live-score">
  <div class="score-num">87</div>
  <div class="score-label">Score</div>
</div>

<!-- AI Feedback Bubble -->
<div class="ai-bubble">
  <div class="ai-label">
    <i class="fas fa-sparkles"></i>
    <span>AI Coach</span>
  </div>
  <p>Raise your right arm higher to match the reference pose</p>
</div>

<!-- Angle Indicators -->
<div class="angle-indicator angle-good" style="top: 385px; left: 80px;">125°</div>
<div class="angle-indicator angle-warn" style="top: 300px; right: 70px;">89°</div>

<!-- Mode Selector -->
<div class="mode-selector">
  <button class="mode-btn">Photo</button>
  <button class="mode-btn active">Video</button>
  <button class="mode-btn">Slow-Mo</button>
</div>

<!-- Timer -->
<div class="timer">00:32</div>

<!-- Bottom Controls -->
<div class="bottom-controls">
  <button class="bottom-btn"><i class="fas fa-images"></i></button>
  <button class="record-btn"><div class="record-btn-inner"></div></button>
  <button class="bottom-btn"><i class="fas fa-rotate"></i></button>
</div>

</body>
</html>
