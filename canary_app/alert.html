<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Canary — Alert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
html,body{height:100%;}
body{font-family:'Inter',-apple-system,sans-serif;background:linear-gradient(160deg,#DC2626,#7F1D1D);color:#fff;width:100%;overflow:hidden;scrollbar-width:none;}
.fd{font-family:'Plus Jakarta Sans',sans-serif;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.35);}100%{box-shadow:0 0 0 20px rgba(255,255,255,0);}}
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30;">
  <span style="font-size:15px;font-weight:600;">9:41</span>
  <div style="width:126px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px;"></div>
  <div style="display:flex;gap:6px;align-items:center;"><i class="fas fa-signal" style="font-size:13px;"></i><i class="fas fa-wifi" style="font-size:14px;"></i><i class="fas fa-battery-full" style="font-size:15px;"></i></div>
</div>

<div style="padding:14px 28px 0;display:flex;justify-content:flex-end;">
  <button style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.14);border:none;display:flex;align-items:center;justify-content:center;"><i class="fas fa-xmark" style="font-size:14px;color:#fff;"></i></button>
</div>

<!-- Icon + headline -->
<div style="text-align:center;padding:18px 28px 0;">
  <div style="width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pulse 1.8s infinite;">
    <i class="fas fa-triangle-exclamation" style="font-size:36px;color:#fff;"></i>
  </div>
  <div style="font-size:11px;font-weight:800;letter-spacing:1.6px;color:#FECACA;margin-bottom:10px;">HIGH ALLERGEN ALERT</div>
  <h1 class="fd" style="font-size:28px;font-weight:800;letter-spacing:-0.7px;line-height:1.15;margin-bottom:8px;">Pollen spike detected</h1>
  <div style="font-size:14px;color:rgba(255,255,255,0.8);">Room 118 · near the open window</div>
</div>

<!-- Reading -->
<div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:24px 28px;">
  <div style="text-align:center;">
    <div style="font-size:42px;font-weight:800;letter-spacing:-1.5px;" class="fd">86</div>
    <div style="font-size:10.5px;color:rgba(255,255,255,0.7);margin-top:2px;">CURRENT READING</div>
  </div>
  <div style="width:1px;height:40px;background:rgba(255,255,255,0.2);"></div>
  <div style="text-align:center;">
    <div style="font-size:42px;font-weight:800;letter-spacing:-1.5px;color:rgba(255,255,255,0.4);" class="fd">32</div>
    <div style="font-size:10.5px;color:rgba(255,255,255,0.7);margin-top:2px;">YOUR SAFE LIMIT</div>
  </div>
</div>

<!-- Recommended actions -->
<div style="padding:0 28px;margin-bottom:18px;">
  <div style="font-size:12px;font-weight:800;letter-spacing:0.5px;color:rgba(255,255,255,0.7);margin-bottom:10px;">DO THIS NOW</div>
  <div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:5px;">
    <div style="display:flex;align-items:center;gap:12px;padding:11px 12px;">
      <div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-head-side-mask" style="font-size:13px;"></i></div>
      <span style="font-size:13px;font-weight:600;">Put on your mask before class starts</span>
    </div>
    <div style="height:1px;background:rgba(255,255,255,0.1);margin:0 12px;"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:11px 12px;">
      <div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-chair" style="font-size:13px;"></i></div>
      <span style="font-size:13px;font-weight:600;">Ask to move away from the window seat</span>
    </div>
    <div style="height:1px;background:rgba(255,255,255,0.1);margin:0 12px;"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:11px 12px;">
      <div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-pills" style="font-size:13px;"></i></div>
      <span style="font-size:13px;font-weight:600;">Take your antihistamine if you have it</span>
    </div>
  </div>
</div>

<!-- Actions -->
<div style="position:absolute;bottom:0;left:0;right:0;padding:0 28px 40px;">
  <button style="width:100%;height:56px;border:none;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 34px rgba(0,0,0,0.25);margin-bottom:12px;">
    <i class="fas fa-user-nurse" style="font-size:14px;color:#DC2626;"></i>
    <span style="font-size:15px;font-weight:700;color:#DC2626;">Notify Nurse & Parent</span>
  </button>
  <button style="width:100%;height:50px;border:1px solid rgba(255,255,255,0.3);border-radius:18px;background:rgba(255,255,255,0.06);">
    <span style="font-size:14px;font-weight:600;color:#fff;">I'm okay — dismiss</span>
  </button>
</div>

</body>
</html>
