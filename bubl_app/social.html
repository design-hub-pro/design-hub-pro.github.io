<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUBL — Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap');
  *{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0F0F0F}
  .display{font-family:'Archivo Black',sans-serif;letter-spacing:-0.02em}
  .ring-black{box-shadow:0 0 0 2.5px #0F0F0F}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden" style="background:#0F0F0F">

  <!-- Full image background -->
  <img src="https://images.unsplash.com/photo-1546039907-7fa05f864c02?w=900" class="absolute inset-0 w-full h-full object-cover" alt="">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.1) 25%,rgba(0,0,0,0.1) 60%,rgba(0,0,0,0.85) 100%)"></div>

  <!-- Status Bar -->
  <div class="relative z-10 flex items-center justify-between px-7" style="height:59px;padding-top:18px">
    <span class="text-white font-semibold text-[15px]">9:41</span>
    <div class="absolute left-1/2 -translate-x-1/2 top-2 w-[120px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal"></i><i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters text-[15px]"></i>
    </div>
  </div>

  <!-- Top tabs -->
  <div class="relative z-10 px-7 pt-2 pb-3 flex items-center justify-between">
    <div class="flex gap-4">
      <span class="display text-white/50 text-[16px]">FOR YOU</span>
      <span class="display text-white text-[16px] border-b-2 border-[#C6FF3A] pb-1">FRIENDS</span>
      <span class="display text-white/50 text-[16px]">DROPS</span>
    </div>
    <button class="w-9 h-9 bg-white/15 backdrop-blur-md rounded-full flex items-center justify-center">
      <i class="fas fa-camera text-white text-sm"></i>
    </button>
  </div>

  <!-- Post info overlay (TikTok style) -->
  <div class="absolute bottom-0 left-0 right-0 z-10 px-5 pb-32">

    <!-- Right side action stack -->
    <div class="absolute right-5 bottom-32 flex flex-col items-center gap-4">
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 rounded-full ring-2 ring-white overflow-hidden relative">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100" class="w-full h-full object-cover" alt="">
          <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-5 h-5 bg-[#FF2E93] rounded-full ring-2 ring-black flex items-center justify-center">
            <i class="fas fa-plus text-white text-[8px]"></i>
          </span>
        </div>
      </div>
      <button class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/15 backdrop-blur-md rounded-full flex items-center justify-center">
          <i class="fas fa-heart text-[#FF2E93] text-xl"></i>
        </div>
        <span class="text-white text-[10px] font-bold mt-1">2.4k</span>
      </button>
      <button class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/15 backdrop-blur-md rounded-full flex items-center justify-center">
          <i class="fas fa-comment-dots text-white text-xl"></i>
        </div>
        <span class="text-white text-[10px] font-bold mt-1">186</span>
      </button>
      <button class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/15 backdrop-blur-md rounded-full flex items-center justify-center">
          <i class="fas fa-paper-plane text-white text-lg"></i>
        </div>
        <span class="text-white text-[10px] font-bold mt-1">SEND</span>
      </button>
      <button class="flex flex-col items-center">
        <div class="w-12 h-12 bg-[#C6FF3A] backdrop-blur-md rounded-full flex items-center justify-center ring-2 ring-black">
          <i class="fas fa-mug-hot text-black text-lg"></i>
        </div>
        <span class="text-white text-[10px] font-bold mt-1">ORDER</span>
      </button>
    </div>

    <!-- Caption -->
    <div class="max-w-[260px]">
      <div class="flex items-center gap-2 mb-2">
        <span class="display text-white text-[15px]">@zoe.matcha</span>
        <span class="bg-[#C6FF3A] text-black text-[9px] font-bold px-1.5 py-0.5 rounded-full">+25 ●</span>
      </div>
      <div class="text-white text-[13px] leading-snug mb-2">
        Peach Oolong Fizz with popping boba >>> obsessed 🍑✨ tysm @bubl
      </div>
      <div class="flex items-center gap-1.5 mb-3">
        <span class="bg-white/15 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full">#peachoolong</span>
        <span class="bg-white/15 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full">#bublhaul</span>
      </div>

      <!-- Drink tag chip -->
      <div class="bg-white/15 backdrop-blur-md rounded-xl p-2 flex items-center gap-2 max-w-[240px]">
        <div class="w-10 h-10 rounded-lg ring-1 ring-white/30 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1525385133512-2f3bdd039054?w=200" class="w-full h-full object-cover" alt="">
        </div>
        <div class="flex-1 min-w-0">
          <div class="display text-[11px] text-white leading-none">PEACH OOLONG FIZZ</div>
          <div class="text-[9px] text-white/70 mt-0.5">L · 25% sweet · popping boba</div>
        </div>
        <span class="bg-[#C6FF3A] text-black display text-[10px] px-2 py-1 rounded-full">$5.95</span>
      </div>
    </div>
  </div>

  <!-- Stories rail (top) -->
  <div class="absolute z-10 top-[155px] left-0 right-0 px-7" style="overflow-x:auto">
    <div class="flex gap-2.5" style="width:max-content">
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5" style="background:linear-gradient(135deg,#FF2E93,#C6FF3A)">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white text-[9px] font-bold mt-1">YOU</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5" style="background:linear-gradient(135deg,#FF2E93,#6B2FF7)">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white text-[9px] font-bold mt-1">kai</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5" style="background:linear-gradient(135deg,#FF2E93,#6B2FF7)">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white text-[9px] font-bold mt-1">zoe</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5 bg-white/20">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white/70 text-[9px] font-bold mt-1">jay</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5" style="background:linear-gradient(135deg,#FF2E93,#6B2FF7)">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white/70 text-[9px] font-bold mt-1">ari</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-full p-0.5 bg-white/20">
          <div class="w-full h-full bg-black rounded-full p-0.5">
            <img src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe?w=100" class="w-full h-full rounded-full object-cover" alt="">
          </div>
        </div>
        <span class="text-white/70 text-[9px] font-bold mt-1">leo</span>
      </div>
    </div>
  </div>

  <!-- Live drop indicator -->
  <div class="absolute top-[245px] left-7 z-10 bg-[#FF2E93] ring-black rounded-full px-3 py-1 flex items-center gap-1.5">
    <span class="w-2 h-2 bg-[#C6FF3A] rounded-full animate-pulse"></span>
    <span class="text-white display text-[10px]">LIVE · 312 sipping</span>
  </div>

  <!-- Tab Bar -->
  <div class="absolute bottom-0 left-0 right-0 px-5 pb-6 pt-3 z-20">
    <div class="bg-black rounded-[28px] p-3 flex items-center justify-around ring-black border border-white/10">
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-house text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">HOME</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-mug-hot text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">MENU</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-2 py-1.5 -mt-7 w-14 h-14 rounded-full bg-[#C6FF3A] ring-black justify-center">
        <i class="fas fa-plus text-black text-xl"></i>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl bg-[#FF2E93]">
        <i class="fas fa-bolt text-white text-[16px]"></i>
        <span class="text-white text-[9px] font-bold">FEED</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-circle-dollar-to-slot text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">PERKS</span>
      </button>
    </div>
  </div>

</div>
</body>
</html>
