<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUBL — Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap');
  *{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#FFF6E8}
  .display{font-family:'Archivo Black',sans-serif;letter-spacing:-0.02em}
  .ring-black{box-shadow:0 0 0 2.5px #0F0F0F}
  .pop-shadow{box-shadow:4px 4px 0 0 #0F0F0F}
  .pearl{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #5C3818, #1A0F08)}
</style>
</head>
<body>
<div class="relative w-full h-full" style="background:#FFF6E8">

  <!-- Status Bar -->
  <div class="relative flex items-center justify-between px-7" style="height:59px;padding-top:18px">
    <span class="text-black font-semibold text-[15px]">9:41</span>
    <div class="absolute left-1/2 -translate-x-1/2 top-2 w-[120px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-black text-[13px]">
      <i class="fas fa-signal"></i><i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters text-[15px]"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="px-7 pt-2 pb-3 flex items-center justify-between">
    <button class="w-10 h-10 bg-white rounded-full ring-black flex items-center justify-center">
      <i class="fas fa-arrow-left text-black text-sm"></i>
    </button>
    <div class="text-center">
      <div class="display text-[18px] text-black leading-none">BUILD YOUR BUBL</div>
      <div class="text-[10px] text-gray-500 mt-0.5">Step 2 of 4</div>
    </div>
    <button class="w-10 h-10 bg-white rounded-full ring-black flex items-center justify-center">
      <i class="fas fa-heart text-[#FF2E93] text-sm"></i>
    </button>
  </div>

  <!-- Progress bar -->
  <div class="px-7 mb-3">
    <div class="h-2 bg-white ring-black rounded-full overflow-hidden">
      <div class="h-full" style="width:50%;background:linear-gradient(90deg,#FF2E93,#6B2FF7)"></div>
    </div>
  </div>

  <!-- Live preview -->
  <div class="relative mx-7 mb-4 rounded-3xl ring-black overflow-hidden h-[220px]" style="background:linear-gradient(135deg,#FFD6E8 0%,#FF66B3 100%)">
    <!-- Cup preview -->
    <div class="absolute left-1/2 -translate-x-1/2 top-3">
      <div class="relative w-[110px] h-[170px]">
        <!-- straw -->
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-2 h-14 rounded-full bg-black"></div>
        <!-- lid -->
        <div class="absolute -top-2 left-0 right-0 h-3 rounded-full bg-black"></div>
        <!-- cup -->
        <div class="absolute inset-0 rounded-b-[50px] rounded-t-[14px] overflow-hidden ring-black bg-white">
          <div class="absolute left-0 right-0 bottom-0" style="height:78%;background:linear-gradient(180deg,#FFB6D9 0%,#FF2E93 100%)"></div>
          <!-- pearls -->
          <div class="absolute bottom-2 left-2 pearl"></div>
          <div class="absolute bottom-2 left-7 pearl"></div>
          <div class="absolute bottom-2 left-12 pearl"></div>
          <div class="absolute bottom-3 right-2 pearl"></div>
          <div class="absolute bottom-3 right-7 pearl"></div>
          <div class="absolute bottom-6 left-4 pearl"></div>
          <div class="absolute bottom-6 right-4 pearl"></div>
        </div>
      </div>
    </div>
    <!-- Live stats -->
    <div class="absolute top-3 left-3 flex flex-col gap-1.5">
      <div class="bg-black/70 backdrop-blur-sm rounded-lg px-2 py-1">
        <div class="text-[8px] text-white/70 uppercase">Cals</div>
        <div class="display text-[12px] text-white leading-none">320</div>
      </div>
    </div>
    <div class="absolute top-3 right-3 flex flex-col gap-1.5 items-end">
      <div class="bg-black/70 backdrop-blur-sm rounded-lg px-2 py-1 text-right">
        <div class="text-[8px] text-white/70 uppercase">Sugar</div>
        <div class="display text-[12px] text-white leading-none">50%</div>
      </div>
    </div>
    <!-- Bottom price -->
    <div class="absolute bottom-3 left-3 right-3 flex items-end justify-between">
      <div>
        <div class="text-[10px] text-black/70 uppercase tracking-wider">YOUR CUSTOM</div>
        <div class="display text-[18px] text-black leading-none">STRAWBERRY HAZE</div>
      </div>
      <div class="bg-[#C6FF3A] text-black display text-[16px] px-3 py-1 rounded-full ring-black">$6.75</div>
    </div>
  </div>

  <!-- Customizer scrollable -->
  <div class="overflow-y-auto px-7" style="height:calc(100% - 59px - 92px - 280px - 90px);padding-bottom:12px">

    <!-- Base flavor -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="display text-[14px] text-black">PICK YOUR BASE</span>
        <span class="text-[10px] text-gray-500">Required</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button class="rounded-xl ring-black p-2 text-center bg-[#FF66B3]">
          <div class="text-2xl">🍓</div>
          <div class="text-[9px] font-bold text-white">STRAW</div>
        </button>
        <button class="rounded-xl p-2 text-center bg-white ring-black">
          <div class="text-2xl">🥭</div>
          <div class="text-[9px] font-bold text-black">MANGO</div>
        </button>
        <button class="rounded-xl p-2 text-center bg-white ring-black">
          <div class="text-2xl">🍑</div>
          <div class="text-[9px] font-bold text-black">PEACH</div>
        </button>
        <button class="rounded-xl p-2 text-center bg-white ring-black">
          <div class="text-2xl">🍵</div>
          <div class="text-[9px] font-bold text-black">MATCHA</div>
        </button>
      </div>
    </div>

    <!-- Sweetness -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="display text-[14px] text-black">SWEETNESS</span>
        <span class="display text-[12px] text-[#FF2E93]">50%</span>
      </div>
      <div class="bg-white rounded-xl ring-black p-3">
        <div class="relative h-1.5 bg-gray-200 rounded-full">
          <div class="absolute left-0 top-0 h-full rounded-full" style="width:50%;background:linear-gradient(90deg,#C6FF3A,#FF2E93)"></div>
          <div class="absolute -top-1.5 w-5 h-5 bg-black rounded-full ring-2 ring-[#C6FF3A]" style="left:48%"></div>
        </div>
        <div class="flex justify-between text-[9px] text-gray-500 mt-2 font-bold">
          <span>0%</span><span>25%</span><span class="text-[#FF2E93]">50%</span><span>75%</span><span>100%</span>
        </div>
      </div>
    </div>

    <!-- Ice -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="display text-[14px] text-black">ICE LEVEL</span>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button class="bg-white ring-black rounded-xl p-2"><div class="display text-[11px] text-black">NO</div></button>
        <button class="bg-white ring-black rounded-xl p-2"><div class="display text-[11px] text-black">LESS</div></button>
        <button class="bg-black ring-black rounded-xl p-2"><div class="display text-[11px] text-[#C6FF3A]">REG ❄️</div></button>
        <button class="bg-white ring-black rounded-xl p-2"><div class="display text-[11px] text-black">EXTRA</div></button>
      </div>
    </div>

    <!-- Toppings -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="display text-[14px] text-black">TOPPINGS</span>
        <span class="text-[10px] text-gray-500">2 picked · +$1.50</span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-[#FFD6E8] ring-black rounded-xl p-2.5 flex items-center gap-2">
          <div class="w-9 h-9 rounded-full ring-2 ring-black flex items-center justify-center" style="background:#1A0F08">
            <span class="text-[10px]">⚫</span>
          </div>
          <div class="flex-1">
            <div class="display text-[10px] text-black leading-tight">BLACK PEARLS</div>
            <div class="text-[8px] text-gray-700">+$0.75</div>
          </div>
          <div class="w-5 h-5 rounded-full bg-[#FF2E93] flex items-center justify-center"><i class="fas fa-check text-white text-[9px]"></i></div>
        </div>
        <div class="bg-[#FFE4D6] ring-black rounded-xl p-2.5 flex items-center gap-2">
          <div class="w-9 h-9 rounded-full ring-2 ring-black flex items-center justify-center" style="background:#FF8A3D">
            <span class="text-[10px]">🟠</span>
          </div>
          <div class="flex-1">
            <div class="display text-[10px] text-black leading-tight">POPPING BOBA</div>
            <div class="text-[8px] text-gray-700">+$0.75</div>
          </div>
          <div class="w-5 h-5 rounded-full bg-[#FF2E93] flex items-center justify-center"><i class="fas fa-check text-white text-[9px]"></i></div>
        </div>
        <div class="bg-white ring-black rounded-xl p-2.5 flex items-center gap-2">
          <div class="w-9 h-9 rounded-full ring-2 ring-black flex items-center justify-center bg-[#FFF6E8]">
            <span class="text-[10px]">🌟</span>
          </div>
          <div class="flex-1">
            <div class="display text-[10px] text-black leading-tight">CHEESE FOAM</div>
            <div class="text-[8px] text-gray-500">+$0.95</div>
          </div>
        </div>
        <div class="bg-white ring-black rounded-xl p-2.5 flex items-center gap-2">
          <div class="w-9 h-9 rounded-full ring-2 ring-black flex items-center justify-center bg-[#E8D6FF]">
            <span class="text-[10px]">💜</span>
          </div>
          <div class="flex-1">
            <div class="display text-[10px] text-black leading-tight">TARO PASTE</div>
            <div class="text-[8px] text-gray-500">+$0.85</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pb-6 pt-3" style="background:linear-gradient(180deg,rgba(255,246,232,0) 0%,rgba(255,246,232,1) 30%)">
    <button class="w-full bg-black text-white display text-[16px] py-4 rounded-2xl ring-black pop-shadow flex items-center justify-between px-5">
      <span>ADD TO BAG</span>
      <span class="bg-[#C6FF3A] text-black px-3 py-1 rounded-full text-[13px]">$6.75</span>
    </button>
  </div>

</div>
</body>
</html>
