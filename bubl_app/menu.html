<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUBL — Menu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap');
  *{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#FFF6E8}
  .display{font-family:'Archivo Black',sans-serif;letter-spacing:-0.02em}
  .ring-black{box-shadow:0 0 0 2.5px #0F0F0F}
  .pop-shadow{box-shadow:4px 4px 0 0 #0F0F0F}
</style>
</head>
<body>
<div class="relative w-full h-full" style="background:#FFF6E8">

  <!-- Status Bar -->
  <div class="relative flex items-center justify-between px-7" style="height:59px;padding-top:18px">
    <span class="text-black font-semibold text-[15px]">9:41</span>
    <div class="absolute left-1/2 -translate-x-1/2 top-2 w-[120px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-black text-[13px]">
      <i class="fas fa-signal"></i><i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters text-[15px]"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="px-7 pt-2 pb-3 flex items-end justify-between">
    <div>
      <div class="display text-[36px] text-black leading-none">THE MENU</div>
      <div class="text-xs text-gray-500 mt-1">43 drinks · all customizable</div>
    </div>
    <button class="w-11 h-11 bg-white rounded-full ring-black flex items-center justify-center">
      <i class="fas fa-magnifying-glass text-black text-sm"></i>
    </button>
  </div>

  <!-- Category pills -->
  <div class="px-7 mb-4 overflow-x-auto" style="overflow-x:auto">
    <div class="flex gap-2 pb-1" style="width:max-content">
      <button class="bg-black text-[#C6FF3A] display text-[12px] px-4 py-2.5 rounded-full">ALL 🌈</button>
      <button class="bg-white text-black display text-[12px] px-4 py-2.5 rounded-full ring-black">MILK TEA</button>
      <button class="bg-white text-black display text-[12px] px-4 py-2.5 rounded-full ring-black">FRUIT 🍓</button>
      <button class="bg-white text-black display text-[12px] px-4 py-2.5 rounded-full ring-black">MATCHA</button>
      <button class="bg-white text-black display text-[12px] px-4 py-2.5 rounded-full ring-black">SLUSH</button>
    </div>
  </div>

  <!-- Drinks scrollable -->
  <div class="overflow-y-auto px-7" style="height:calc(100% - 59px - 92px - 175px);padding-bottom:24px">

    <!-- Featured banner -->
    <div class="relative rounded-2xl ring-black overflow-hidden mb-4" style="background:linear-gradient(120deg,#C6FF3A,#6B2FF7)">
      <div class="p-4 flex items-center gap-3">
        <div class="text-4xl">🎯</div>
        <div class="flex-1">
          <div class="display text-[14px] text-black leading-none">TRENDING NOW</div>
          <div class="text-[11px] text-black/70 mt-1">Top 5 drinks teens love this week</div>
        </div>
        <i class="fas fa-arrow-right text-black"></i>
      </div>
    </div>

    <!-- Grid of drinks -->
    <div class="grid grid-cols-2 gap-3">

      <!-- Drink 1 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#FFE9D6,#A77451)">
          <img src="https://images.unsplash.com/photo-1558857563-c0c6ee0e09b8?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
          <span class="absolute top-2 left-2 bg-[#FF2E93] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full ring-black">#1</span>
          <button class="absolute top-2 right-2 w-7 h-7 bg-white/90 rounded-full flex items-center justify-center">
            <i class="far fa-heart text-black text-[11px]"></i>
          </button>
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">BROWN SUGAR DELUXE</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$6.75</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.9
            </div>
          </div>
        </div>
      </div>

      <!-- Drink 2 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#FFD6E8,#FF66B3)">
          <img src="https://images.unsplash.com/photo-1525803377221-4f6ccdaa24ae?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
          <span class="absolute top-2 left-2 bg-[#C6FF3A] text-black text-[9px] font-bold px-1.5 py-0.5 rounded-full ring-black">NEW</span>
          <button class="absolute top-2 right-2 w-7 h-7 bg-[#FF2E93] rounded-full flex items-center justify-center">
            <i class="fas fa-heart text-white text-[11px]"></i>
          </button>
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">STRAWBERRY MATCHA HAZE</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$6.50</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.8
            </div>
          </div>
        </div>
      </div>

      <!-- Drink 3 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#E8D6FF,#6B2FF7)">
          <img src="https://images.unsplash.com/photo-1546039907-7fa05f864c02?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">TARO MILK CLOUD</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$6.25</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.7
            </div>
          </div>
        </div>
      </div>

      <!-- Drink 4 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#D6FFEC,#3DBFA1)">
          <img src="https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">CLASSIC MATCHA LATTE</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$5.75</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.6
            </div>
          </div>
        </div>
      </div>

      <!-- Drink 5 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#FFE4D6,#FF8A3D)">
          <img src="https://images.unsplash.com/photo-1525385133512-2f3bdd039054?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
          <span class="absolute top-2 left-2 bg-black text-[#C6FF3A] text-[9px] font-bold px-1.5 py-0.5 rounded-full">2X 🟢</span>
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">PEACH OOLONG FIZZ</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$5.95</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.8
            </div>
          </div>
        </div>
      </div>

      <!-- Drink 6 -->
      <div class="bg-white rounded-2xl ring-black overflow-hidden pop-shadow">
        <div class="relative h-[140px]" style="background:linear-gradient(180deg,#FFFDD6,#FFD93D)">
          <img src="https://images.unsplash.com/photo-1571115764595-644a1f56a55c?w=400" class="absolute inset-0 w-full h-full object-cover" alt="">
        </div>
        <div class="p-2.5">
          <div class="display text-[12px] text-black leading-tight">MANGO YAKULT BURST</div>
          <div class="flex items-center justify-between mt-2">
            <span class="text-[13px] font-bold text-black">$6.45</span>
            <div class="flex items-center gap-1 text-[10px] text-gray-500">
              <i class="fas fa-star text-[#FF2E93] text-[9px]"></i>4.9
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Tab Bar -->
  <div class="absolute bottom-0 left-0 right-0 px-5 pb-6 pt-3" style="background:linear-gradient(180deg,rgba(255,246,232,0) 0%,rgba(255,246,232,1) 30%)">
    <div class="bg-black rounded-[28px] p-3 flex items-center justify-around ring-black">
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-house text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">HOME</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl bg-[#FF2E93]">
        <i class="fas fa-mug-hot text-white text-[16px]"></i>
        <span class="text-white text-[9px] font-bold">MENU</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-2 py-1.5 -mt-7 w-14 h-14 rounded-full bg-[#C6FF3A] ring-black justify-center">
        <i class="fas fa-plus text-black text-xl"></i>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-bolt text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">FEED</span>
      </button>
      <button class="flex flex-col items-center gap-0.5 px-3 py-1.5">
        <i class="fas fa-circle-dollar-to-slot text-white/60 text-[16px]"></i>
        <span class="text-white/60 text-[9px] font-bold">PERKS</span>
      </button>
    </div>
  </div>

</div>
</body>
</html>
