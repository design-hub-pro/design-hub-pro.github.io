<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUBL — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap');
  *{font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  *::-webkit-scrollbar{display:none}*{scrollbar-width:none}
  html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0F0F0F}
  .display{font-family:'Archivo Black',sans-serif;letter-spacing:-0.02em}
  .bg-cream{background:#FFF6E8}
  .bg-hot{background:#FF2E93}
  .bg-lime{background:#C6FF3A}
  .bg-grape{background:#6B2FF7}
  .text-hot{color:#FF2E93}
  .text-lime{color:#C6FF3A}
  .text-grape{color:#6B2FF7}
  .pop-shadow{box-shadow:6px 6px 0 0 #0F0F0F}
  .ring-black{box-shadow:0 0 0 3px #0F0F0F}
  @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-10px) rotate(8deg)} }
  @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .float{animation:float 4s ease-in-out infinite}
  .spin-slow{animation:spin-slow 18s linear infinite}
  .pearl{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #4A2F1F, #1A0F08);box-shadow:inset -2px -2px 4px rgba(0,0,0,0.4)}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.6}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden" style="background:#FF2E93">

  <!-- Background blobs -->
  <div class="blob bg-lime" style="width:280px;height:280px;top:-80px;right:-100px"></div>
  <div class="blob bg-grape" style="width:260px;height:260px;bottom:120px;left:-100px;opacity:0.5"></div>

  <!-- Status Bar -->
  <div class="relative z-10 flex items-center justify-between px-7" style="height:59px;padding-top:18px">
    <span class="text-white font-semibold text-[15px]">9:41</span>
    <div class="absolute left-1/2 -translate-x-1/2 top-2 w-[120px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal"></i><i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters text-[15px]"></i>
    </div>
  </div>

  <!-- Floating boba cups -->
  <div class="relative z-10" style="height:520px">
    <!-- Main center cup -->
    <div class="absolute left-1/2 -translate-x-1/2 top-12 float">
      <div class="relative w-[220px] h-[300px]">
        <!-- cup body -->
        <div class="absolute inset-0 rounded-b-[100px] rounded-t-[30px] overflow-hidden ring-black" style="background:linear-gradient(180deg,#FFE9D6 0%, #FFD6A8 100%)">
          <!-- liquid -->
          <div class="absolute left-0 right-0 bottom-0" style="height:75%;background:linear-gradient(180deg,#A77451 0%,#5C3818 100%)"></div>
          <!-- foam -->
          <div class="absolute left-0 right-0" style="top:24%;height:8px;background:#FFF6E8;opacity:0.7;border-radius:50%"></div>
          <!-- pearls -->
          <div class="absolute bottom-3 left-4 pearl"></div>
          <div class="absolute bottom-2 left-12 pearl"></div>
          <div class="absolute bottom-3 left-20 pearl"></div>
          <div class="absolute bottom-2 left-28 pearl"></div>
          <div class="absolute bottom-3 right-16 pearl"></div>
          <div class="absolute bottom-2 right-6 pearl"></div>
          <div class="absolute bottom-8 left-8 pearl"></div>
          <div class="absolute bottom-8 right-10 pearl"></div>
          <div class="absolute bottom-12 left-16 pearl"></div>
          <div class="absolute bottom-12 right-20 pearl"></div>
          <!-- sticker label -->
          <div class="absolute" style="top:40%;left:50%;transform:translate(-50%,-50%) rotate(-8deg)">
            <div class="bg-lime px-3 py-1 rounded-full ring-black">
              <span class="display text-[14px] text-black">BROWN SUGAR</span>
            </div>
          </div>
        </div>
        <!-- lid -->
        <div class="absolute -top-2 left-0 right-0 h-6 rounded-full ring-black" style="background:#0F0F0F"></div>
        <!-- straw -->
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-3 h-24 rounded-full bg-lime ring-black"></div>
      </div>
    </div>

    <!-- Side mini cup left -->
    <div class="absolute left-4 top-44 float" style="animation-delay:-1.5s">
      <div class="relative w-[80px] h-[110px]">
        <div class="absolute inset-0 rounded-b-[36px] rounded-t-[12px] ring-black" style="background:#C6FF3A"></div>
        <div class="absolute inset-0 rounded-b-[36px] rounded-t-[12px] overflow-hidden">
          <div class="absolute left-0 right-0 bottom-0" style="height:70%;background:#6B2FF7"></div>
        </div>
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-2 h-14 rounded-full bg-white ring-black"></div>
      </div>
    </div>

    <!-- Side mini cup right -->
    <div class="absolute right-4 top-56 float" style="animation-delay:-3s">
      <div class="relative w-[88px] h-[120px]">
        <div class="absolute inset-0 rounded-b-[36px] rounded-t-[12px] ring-black" style="background:#FFF6E8"></div>
        <div class="absolute inset-0 rounded-b-[36px] rounded-t-[12px] overflow-hidden">
          <div class="absolute left-0 right-0 bottom-0" style="height:70%;background:#FF66B3"></div>
        </div>
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-2 h-14 rounded-full bg-grape ring-black"></div>
      </div>
    </div>

    <!-- Stars -->
    <div class="absolute top-12 right-12 spin-slow text-lime text-3xl">✦</div>
    <div class="absolute top-32 left-12 text-white text-2xl">✦</div>
    <div class="absolute bottom-12 right-20 spin-slow text-white text-2xl" style="animation-direction:reverse">✦</div>
  </div>

  <!-- Bottom content -->
  <div class="absolute bottom-0 left-0 right-0 px-7 pb-10 z-10">
    <div class="display text-white text-[64px] leading-[0.9] mb-3">SIP.<br>SNAP.<br>SHARE.</div>
    <p class="text-white/90 text-[16px] mb-7 max-w-[300px]">The bubble tea brand built for the gang — not your mom.</p>

    <button class="w-full bg-black text-white display text-[18px] py-5 rounded-2xl ring-black pop-shadow flex items-center justify-center gap-3">
      LET'S GO <i class="fas fa-arrow-right"></i>
    </button>

    <div class="flex items-center justify-center gap-2 mt-5">
      <span class="text-white/70 text-sm">Already a member?</span>
      <span class="text-lime font-bold text-sm underline">Sign in</span>
    </div>
  </div>

</div>
</body>
</html>
