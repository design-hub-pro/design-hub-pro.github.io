<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rebound — Onboarding</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0B0E13; color:#fff; scrollbar-width:none; }

  .screen { width:100%; height:100%; position:relative; overflow-y:auto; background:#0B0E13; padding-bottom:40px; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:6px; }
  .status-bar .icons i { font-size:14px; }

  .hero { position:relative; margin:10px 28px 0; height:240px; border-radius:28px; overflow:hidden; }
  .hero img { width:100%; height:100%; object-fit:cover; }
  .hero-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,14,19,0) 20%, rgba(11,14,19,0.95) 100%); }
  .hero-content { position:absolute; bottom:20px; left:20px; right:20px; }
  .hero-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(46,230,168,0.15); border:1px solid rgba(46,230,168,0.4); color:#2EE6A8; padding:6px 12px; border-radius:12px; font-size:10px; font-weight:800; letter-spacing:0.5px; }
  .hero-title { font-size:26px; font-weight:900; letter-spacing:-0.8px; margin-top:10px; line-height:1.15; }
  .hero-title span { color:#2EE6A8; }

  .step-label { padding:26px 28px 4px; font-size:11px; font-weight:800; color:#2EE6A8; letter-spacing:1.5px; text-transform:uppercase; }
  .step-title { padding:0 28px; font-size:21px; font-weight:800; letter-spacing:-0.4px; }
  .step-sub { padding:4px 28px 0; font-size:12px; color:#7A8694; }

  .sports-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px 28px 0; }
  .sport-card {
    background:#151A21; border:1.5px solid rgba(255,255,255,0.06); border-radius:20px;
    padding:18px 8px 14px; text-align:center; position:relative;
  }
  .sport-card i { font-size:24px; color:#7A8694; }
  .sport-card span { display:block; font-size:11px; font-weight:700; color:#9AA5B1; margin-top:8px; }
  .sport-card.active { background:rgba(46,230,168,0.1); border-color:#2EE6A8; }
  .sport-card.active i, .sport-card.active span { color:#2EE6A8; }
  .sport-check { position:absolute; top:8px; right:8px; width:18px; height:18px; border-radius:50%; background:#2EE6A8; display:flex; align-items:center; justify-content:center; }
  .sport-check i { font-size:9px; color:#0B0E13; }

  .level-row { display:flex; gap:10px; padding:16px 28px 0; }
  .level-chip { flex:1; text-align:center; padding:12px 0; border-radius:16px; background:#151A21; border:1.5px solid rgba(255,255,255,0.06); font-size:12px; font-weight:700; color:#9AA5B1; }
  .level-chip.active { background:#2EE6A8; border-color:#2EE6A8; color:#0B0E13; }

  .cta { margin:28px 28px 0; height:58px; border-radius:20px; background:linear-gradient(135deg,#2EE6A8,#19B886); display:flex; align-items:center; justify-content:center; gap:10px; font-size:16px; font-weight:800; color:#0B0E13; box-shadow:0 12px 32px rgba(46,230,168,0.3); }
  .skip { text-align:center; margin-top:16px; font-size:12px; color:#7A8694; font-weight:600; }

  .dots { display:flex; justify-content:center; gap:6px; margin-top:18px; }
  .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.15); }
  .dot.on { width:18px; border-radius:4px; background:#2EE6A8; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="hero">
    <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=900&q=80" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge"><i class="fas fa-wand-magic-sparkles"></i> AI INJURY ASSESSMENT</div>
      <div class="hero-title">Get back in the game,<br><span>the right way</span>.</div>
    </div>
  </div>

  <div class="step-label">Step 1 of 2</div>
  <div class="step-title">What's your sport?</div>
  <div class="step-sub">Assessments are tuned to your sport's injury patterns.</div>

  <div class="sports-grid">
    <div class="sport-card active">
      <div class="sport-check"><i class="fas fa-check"></i></div>
      <i class="fas fa-basketball"></i><span>Basketball</span>
    </div>
    <div class="sport-card"><i class="fas fa-futbol"></i><span>Soccer</span></div>
    <div class="sport-card"><i class="fas fa-person-running"></i><span>Running</span></div>
    <div class="sport-card"><i class="fas fa-football"></i><span>Football</span></div>
    <div class="sport-card"><i class="fas fa-table-tennis-paddle-ball"></i><span>Tennis</span></div>
    <div class="sport-card"><i class="fas fa-volleyball"></i><span>Volleyball</span></div>
  </div>

  <div class="step-title" style="padding-top:24px">Your level</div>
  <div class="level-row">
    <div class="level-chip">Casual</div>
    <div class="level-chip active">Competitive</div>
    <div class="level-chip">Pro</div>
  </div>

  <div class="cta">Continue <i class="fas fa-arrow-right" style="font-size:13px"></i></div>
  <div class="skip">I'm a coach / physio</div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div></div>
</div>
</body>
</html>
