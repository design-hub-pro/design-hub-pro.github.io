<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#E8F0E5;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#1B4332;position:relative;z-index:30;background:transparent}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:40}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #E3EFE0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#A7BBA1;font-size:10px;font-weight:500}
.tab.active{color:#2D6A4F}
.tab i{font-size:22px}

/* Map background */
.map{position:absolute;top:0;left:0;right:0;bottom:0;background:
  radial-gradient(circle at 25% 35%, rgba(82,183,136,0.55) 0%, transparent 18%),
  radial-gradient(circle at 70% 28%, rgba(149,213,178,0.4) 0%, transparent 22%),
  radial-gradient(circle at 55% 60%, rgba(79,169,230,0.3) 0%, transparent 16%),
  radial-gradient(circle at 80% 70%, rgba(82,183,136,0.4) 0%, transparent 20%),
  linear-gradient(135deg,#DCEBD0 0%, #C5DEB7 40%, #A8D097 100%)}
.map::before{content:'';position:absolute;inset:0;background-image:
  linear-gradient(rgba(45,106,79,0.08) 1px, transparent 1px),
  linear-gradient(90deg, rgba(45,106,79,0.08) 1px, transparent 1px);background-size:32px 32px}

/* Faux roads */
.road{position:absolute;background:rgba(255,255,255,0.6);border-radius:2px}

/* Water lake */
.water{position:absolute;border-radius:50%;background:radial-gradient(circle, #6FB8E8 0%, #4FA9E6 70%);box-shadow:0 4px 18px rgba(79,169,230,0.4)}

/* Marker */
.marker{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.marker-pin{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,0.2)}
.marker-pin i{transform:rotate(45deg);color:white;font-size:14px}
.heat{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}

/* Sheet at bottom */
.sheet{position:absolute;bottom:88px;left:0;right:0;background:white;border-radius:28px 28px 0 0;padding:16px 24px 18px;box-shadow:0 -8px 30px rgba(27,67,50,0.15);z-index:25}
.handle{width:36px;height:4px;background:#C5D5C0;border-radius:2px;margin:0 auto 12px}
.score-pill{padding:3px 8px;border-radius:9px;font-size:10px;font-weight:bold}
</style>
</head>
<body>
<div class="screen">
  <div class="map">
    <!-- Heatmap blobs -->
    <div class="heat" style="top:35%;left:28%;width:160px;height:160px;background:radial-gradient(circle, rgba(255,107,91,0.45) 0%, transparent 70%)"></div>
    <div class="heat" style="top:25%;left:62%;width:120px;height:120px;background:radial-gradient(circle, rgba(255,177,79,0.45) 0%, transparent 70%)"></div>
    <div class="heat" style="top:62%;left:55%;width:180px;height:180px;background:radial-gradient(circle, rgba(82,183,136,0.55) 0%, transparent 70%)"></div>

    <!-- Roads -->
    <div class="road" style="top:48%;left:0;right:0;height:4px"></div>
    <div class="road" style="top:0;bottom:0;left:42%;width:3px"></div>

    <!-- Water lake -->
    <div class="water" style="top:55%;left:48%;width:110px;height:78px"></div>

    <!-- Course shapes -->
    <div style="position:absolute;top:20%;left:18%;width:120px;height:110px;background:rgba(82,183,136,0.35);border-radius:60% 40% 70% 30% / 50% 60% 40% 50%;border:2px dashed rgba(45,106,79,0.4)"></div>
    <div style="position:absolute;top:58%;left:50%;width:130px;height:130px;background:rgba(82,183,136,0.3);border-radius:50% 60% 40% 70%;border:2px dashed rgba(45,106,79,0.4)"></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <!-- Search bar -->
  <div class="absolute top-[72px] left-7 right-7 z-20">
    <div class="bg-white rounded-2xl px-4 py-3 flex items-center gap-3 shadow-lg">
      <i class="fas fa-search text-[#2D6A4F]"></i>
      <input class="flex-1 text-sm outline-none placeholder-[#A7BBA1]" placeholder="Search sites near me" value="" />
      <div class="w-8 h-8 rounded-xl bg-[#E3EFE0] flex items-center justify-center"><i class="fas fa-sliders text-[#2D6A4F] text-xs"></i></div>
    </div>
    <!-- Filter chips -->
    <div class="flex gap-2 mt-3">
      <span class="bg-[#1B4332] text-white text-[11px] px-3 py-1.5 rounded-full font-semibold">All</span>
      <span class="bg-white text-[#1B4332] text-[11px] px-3 py-1.5 rounded-full font-semibold shadow-sm"><i class="fas fa-golf-ball-tee mr-1 text-[#2D6A4F]"></i>Courses</span>
      <span class="bg-white text-[#1B4332] text-[11px] px-3 py-1.5 rounded-full font-semibold shadow-sm"><i class="fas fa-tree mr-1 text-[#2D6A4F]"></i>Parks</span>
      <span class="bg-white text-[#1B4332] text-[11px] px-3 py-1.5 rounded-full font-semibold shadow-sm"><i class="fas fa-water mr-1 text-[#4FA9E6]"></i>Wetlands</span>
    </div>
  </div>

  <!-- Map markers -->
  <div class="marker" style="top:38%;left:28%">
    <div class="marker-pin" style="background:linear-gradient(135deg,#52B788,#1B4332)"><i class="fas fa-golf-ball-tee"></i></div>
    <div class="bg-white rounded-full px-2 py-0.5 text-[10px] font-bold text-[#1B4332] mt-1 shadow">BCI 78</div>
  </div>
  <div class="marker" style="top:28%;left:62%">
    <div class="marker-pin" style="background:linear-gradient(135deg,#FFB44A,#F47B1F)"><i class="fas fa-tree"></i></div>
    <div class="bg-white rounded-full px-2 py-0.5 text-[10px] font-bold text-[#1B4332] mt-1 shadow">BCI 54</div>
  </div>
  <div class="marker" style="top:60%;left:55%">
    <div class="marker-pin" style="background:linear-gradient(135deg,#5BA7FF,#2D7FE0)"><i class="fas fa-water"></i></div>
    <div class="bg-white rounded-full px-2 py-0.5 text-[10px] font-bold text-[#1B4332] mt-1 shadow">BCI 86</div>
  </div>
  <div class="marker" style="top:48%;left:74%">
    <div class="marker-pin" style="background:linear-gradient(135deg,#52B788,#1B4332)"><i class="fas fa-golf-ball-tee"></i></div>
    <div class="bg-white rounded-full px-2 py-0.5 text-[10px] font-bold text-[#1B4332] mt-1 shadow">BCI 62</div>
  </div>

  <!-- You are here -->
  <div class="absolute" style="top:42%;left:30%;transform:translate(-50%,-50%);z-index:5">
    <div class="w-5 h-5 rounded-full bg-[#2D6A4F] border-[3px] border-white shadow-lg"></div>
    <div class="absolute top-0 left-0 w-5 h-5 rounded-full bg-[#52B788] animate-ping opacity-60"></div>
  </div>

  <!-- Floating controls right side -->
  <div class="absolute right-5 z-20 flex flex-col gap-2" style="top:42%">
    <div class="w-11 h-11 bg-white rounded-xl shadow-lg flex items-center justify-center"><i class="fas fa-layer-group text-[#1B4332]"></i></div>
    <div class="w-11 h-11 bg-white rounded-xl shadow-lg flex items-center justify-center"><i class="fas fa-location-crosshairs text-[#2D6A4F]"></i></div>
    <div class="w-11 h-11 bg-white rounded-xl shadow-lg flex items-center justify-center"><i class="fas fa-fire text-[#FF6B5B]"></i></div>
  </div>

  <!-- Bottom sheet -->
  <div class="sheet">
    <div class="handle"></div>
    <div class="flex items-center gap-3">
      <img src="https://images.unsplash.com/photo-1535132011086-b8818f016104?w=300&h=300&fit=crop" class="w-16 h-16 rounded-2xl object-cover">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <p class="text-[10px] font-bold text-[#2D6A4F] uppercase tracking-wide">Selected site</p>
          <span class="score-pill bg-[#D8F3DC] text-[#1B4332]">BCI 78 · Rich</span>
        </div>
        <p class="text-base font-bold text-[#1B4332] leading-tight mt-0.5">Pebble Ridge Golf Club</p>
        <p class="text-[11px] text-[#6B8E76]"><i class="fas fa-location-dot text-[10px]"></i> 0.4 mi · 18-hole · Native veg 62%</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-3">
      <div class="bg-[#F4F8F2] rounded-xl py-2 text-center">
        <p class="text-lg font-black text-[#2D6A4F]">14</p>
        <p class="text-[10px] text-[#6B8E76] font-semibold">Bird sp.</p>
      </div>
      <div class="bg-[#FFF7EE] rounded-xl py-2 text-center">
        <p class="text-lg font-black text-[#F47B1F]">23</p>
        <p class="text-[10px] text-[#6B8E76] font-semibold">Insect sp.</p>
      </div>
      <div class="bg-[#EFF7FF] rounded-xl py-2 text-center">
        <p class="text-lg font-black text-[#4FA9E6]">3</p>
        <p class="text-[10px] text-[#6B8E76] font-semibold">Water bodies</p>
      </div>
    </div>

    <button class="mt-3 w-full bg-gradient-to-r from-[#2D6A4F] to-[#1B4332] text-white text-sm font-bold py-3 rounded-2xl flex items-center justify-center gap-2">
      <i class="fas fa-play"></i> Start Survey Here
    </button>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab active"><i class="fas fa-map-location-dot"></i><span>Map</span></div>
    <div class="tab"><i class="fas fa-camera"></i><span>Observe</span></div>
    <div class="tab"><i class="fas fa-chart-column"></i><span>Analyze</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
