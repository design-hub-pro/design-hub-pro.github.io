<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardHub · Track, compare and trade singer photocards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Inter',sans-serif;color:#15121F}
main{overflow-x:auto}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center;width:max-content;margin:0 auto}
.label{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9A95AD;text-align:center;margin-bottom:18px}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2a33,#0c0b10);box-shadow:0 50px 80px -30px rgba(109,74,255,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F7F6FB}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#F3F1FA;color:#4B4560}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#8B5CF6,#E11D74)"><i class="fa-solid fa-layer-group text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight">CardHub</h1>
  <p class="mt-3 text-[19px] text-gray-500">Find any singer photocard across every marketplace, see the true landed price, then buy or trade safely.</p>
  <div class="mt-5 flex gap-2"><span class="tag">Price tracking</span><span class="tag">Marketplace</span><span class="tag">Trading cards</span><span class="tag">Social</span></div>
</header>
<main class="pb-28 px-6"><div class="phones">
  <div><p class="label">Pick artists</p><div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="Pick artists"></iframe></div></div></div>
  <div><p class="label">Market</p><div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="Market"></iframe></div></div></div>
  <div><p class="label">Browse</p><div class="phone-frame"><div class="phone-screen"><iframe src="browse.html" scrolling="no" title="Browse"></iframe></div></div></div>
  <div><p class="label">Card detail</p><div class="phone-frame"><div class="phone-screen"><iframe src="card.html" scrolling="no" title="Card detail"></iframe></div></div></div>
  <div><p class="label">Total cost</p><div class="phone-frame"><div class="phone-screen"><iframe src="compare.html" scrolling="no" title="Total cost"></iframe></div></div></div>
  <div><p class="label">Protected checkout</p><div class="phone-frame"><div class="phone-screen"><iframe src="checkout.html" scrolling="no" title="Protected checkout"></iframe></div></div></div>
  <div><p class="label">Trade builder</p><div class="phone-frame"><div class="phone-screen"><iframe src="trade.html" scrolling="no" title="Trade builder"></iframe></div></div></div>
  <div><p class="label">Trade chat</p><div class="phone-frame"><div class="phone-screen"><iframe src="chat.html" scrolling="no" title="Trade chat"></iframe></div></div></div>
  <div><p class="label">Community</p><div class="phone-frame"><div class="phone-screen"><iframe src="community.html" scrolling="no" title="Community"></iframe></div></div></div>
  <div><p class="label">Binder</p><div class="phone-frame"><div class="phone-screen"><iframe src="binder.html" scrolling="no" title="Binder"></iframe></div></div></div>
  <div><p class="label">Seller shop</p><div class="phone-frame"><div class="phone-screen"><iframe src="shop.html" scrolling="no" title="Seller shop"></iframe></div></div></div>
</div></main>
</body></html>
