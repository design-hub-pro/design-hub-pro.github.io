<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdVision — Analyzing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
*{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.font-display{font-family:'Plus Jakarta Sans',sans-serif;}
body{background:#0b0e1a;}
.app{width:390px;min-height:844px;background:#0b0e1a;position:relative;overflow:hidden;}
.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.07);}
.brand-grad{background:linear-gradient(135deg,#7c3aed 0%,#06b6d4 100%);}
.glow{box-shadow:0 0 60px rgba(124,58,237,0.4);}
@keyframes spin{to{transform:rotate(360deg);}}
.radar{animation:spin 2.5s linear infinite;}
@keyframes pulse2{0%,100%{opacity:.4;transform:scale(.95);}50%{opacity:1;transform:scale(1);}}
.pulse2{animation:pulse2 1.8s ease-in-out infinite;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.step{animation:fadein .5s ease forwards;}
</style>
</head>
<body class="flex items-center justify-center py-6">
<div class="app text-white flex flex-col items-center justify-center px-8">

  <!-- Radar -->
  <div class="relative w-56 h-56 mb-10 flex items-center justify-center">
    <div class="absolute inset-0 rounded-full border border-violet-500/20"></div>
    <div class="absolute inset-6 rounded-full border border-violet-500/20"></div>
    <div class="absolute inset-12 rounded-full border border-violet-500/20"></div>
    <div class="absolute inset-0 rounded-full radar" style="background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(34,211,238,0.35) 360deg);"></div>
    <div class="w-24 h-24 brand-grad rounded-full flex items-center justify-center glow pulse2 relative z-10">
      <i class="fas fa-magnifying-glass-chart text-white text-3xl"></i>
    </div>
    <span class="absolute top-8 right-10 w-2.5 h-2.5 bg-rose-400 rounded-full pulse2"></span>
    <span class="absolute bottom-12 left-8 w-2 h-2 bg-amber-300 rounded-full pulse2"></span>
  </div>

  <h1 class="font-display text-2xl font-extrabold text-center">Investigating…</h1>
  <p class="text-[13px] text-slate-400 text-center mt-2 mb-9">AdVision is cross-checking your evidence<br>against 9 deception signals.</p>

  <!-- Steps -->
  <div class="w-full space-y-3">
    <div class="glass rounded-xl p-3.5 flex items-center gap-3 step">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center"><i class="fas fa-check text-emerald-300 text-xs"></i></div>
      <span class="text-[13px] flex-1">Reading caption & extracting claims</span>
    </div>
    <div class="glass rounded-xl p-3.5 flex items-center gap-3 step" style="animation-delay:.15s">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center"><i class="fas fa-check text-emerald-300 text-xs"></i></div>
      <span class="text-[13px] flex-1">Inspecting link & affiliate tags</span>
    </div>
    <div class="glass rounded-xl p-3.5 flex items-center gap-3 step" style="animation-delay:.3s">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/15 flex items-center justify-center"><i class="fas fa-spinner radar text-cyan-300 text-xs"></i></div>
      <span class="text-[13px] flex-1">Checking for disclosure & sponsorship</span>
    </div>
    <div class="glass rounded-xl p-3.5 flex items-center gap-3 opacity-40 step" style="animation-delay:.45s">
      <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i class="fas fa-star-half-stroke text-slate-400 text-xs"></i></div>
      <span class="text-[13px] flex-1">Scoring scam & fake-review risk</span>
    </div>
  </div>

  <a href="analysis.html" class="mt-10 text-[12px] text-cyan-300 underline">View results &rarr;</a>

</div>
</body>
</html>
