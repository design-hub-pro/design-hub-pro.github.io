<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Replay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.dark .tabbar{background:rgba(7,18,37,.9);border-top-color:rgba(255,255,255,.08)} .dark .tab.mid .fab{border-color:#071225} .dark .tab.on{color:#A5B4FC}</style></head>
<body><div class="screen dark">
<div class="scroll">

<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn glass"><i class="fa-solid fa-chevron-left"></i></div><span class="text-[15px] font-bold">Replay · Run 4</span><div class="iconbtn glass"><i class="fa-solid fa-video"></i></div></div>
</div>
<div class="relative mt-4" style="height:450px">
  <svg viewBox="0 0 436 450" class="absolute inset-0 w-full h-full">
    <defs>
      <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A8A" stop-opacity=".35"/><stop offset="1" stop-color="#E0F2FE" stop-opacity=".95"/></linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <polygon points="150,0 286,0 436,450 0,450" fill="url(#snow)"/>
    <g stroke="rgba(255,255,255,.18)" stroke-width="1"><line x1="186" y1="0" x2="110" y2="450"/><line x1="250" y1="0" x2="326" y2="450"/><line x1="128" y1="80" x2="306" y2="80"/><line x1="96" y1="180" x2="340" y2="180"/><line x1="58" y1="300" x2="378" y2="300"/></g>
    <path d="M218 6 C 280 40, 280 70, 214 100 S 140 160, 214 200 S 320 270, 220 320 S 90 400, 210 450" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>
    <path d="M218 6 C 280 40, 280 70, 214 100 S 140 160, 214 200" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <path d="M214 200 S 320 270, 220 320" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="258" cy="56" r="7" fill="#10B981" stroke="#fff" stroke-width="2.5"/>
    <circle cx="168" cy="150" r="7" fill="#0284C7" stroke="#fff" stroke-width="2.5"/>
    <circle cx="282" cy="262" r="7" fill="#F59E0B" stroke="#fff" stroke-width="2.5"/>
    <!-- avatar -->
    <g transform="translate(222 318)">
      <ellipse cx="0" cy="36" rx="46" ry="9" fill="#0B1A2E" opacity=".22"/>
      <g filter="url(#glow)" opacity=".55"><path d="M-6 -62 L 10 -10 L -14 30" stroke="#818CF8" stroke-width="16" fill="none" stroke-linecap="round"/></g>
      <line x1="-44" y1="24" x2="40" y2="40" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
      <line x1="-40" y1="34" x2="44" y2="50" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
      <path d="M-14 -4 L -20 22 M 10 -6 L 14 30" stroke="#0B1A2E" stroke-width="10" stroke-linecap="round"/>
      <path d="M-8 -60 C -2 -40, 8 -24, 2 -2" stroke="url(#body)" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M-4 -48 L 30 -30 L 44 -32" stroke="url(#body)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-6 -48 L -30 -26" stroke="url(#body)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <line x1="44" y1="-32" x2="58" y2="34" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
      <line x1="-30" y1="-26" x2="-46" y2="30" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-10" cy="-80" r="13" fill="#F8FAFC"/><path d="M-22 -84 a13 13 0 0 1 24 0 z" fill="#4F46E5"/>
      <rect x="-20" y="-84" width="20" height="6" rx="3" fill="#0B1A2E" opacity=".75"/>
    </g>
  </svg>
  <div class="absolute" style="left:276px;top:196px"><div class="pill" style="background:rgba(245,158,11,.95);color:#fff"><i class="fa-solid fa-staff-snake"></i>Pole +180 ms</div></div>
  <div class="absolute" style="left:28px;top:300px"><div class="pill glass"><span class="dot" style="background:#38BDF8"></span>Edge 21°</div></div>
  <div class="absolute" style="left:28px;top:338px"><div class="pill glass"><span class="dot" style="background:#FCD34D"></span>Brake soft</div></div>
</div>
<div class="pad">
  <div class="flex gap-2 -mt-2">
    <span class="pill" style="background:#fff;color:var(--ink)">Behind</span><span class="pill" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)">Side</span><span class="pill" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)">Top</span>
    <span class="pill ml-auto" style="background:rgba(255,255,255,.08);color:#fff">0.5×</span>
  </div>
  <div class="dcard p-4 mt-4">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-full bg-white text-indigo-600 flex items-center justify-center flex-none"><i class="fa-solid fa-pause"></i></div>
      <div class="flex-1">
        <div class="relative h-[34px]">
          <div class="absolute inset-x-0 top-[15px] h-[5px] rounded bg-white/15"></div>
          <div class="absolute left-0 top-[15px] h-[5px] rounded" style="width:62%;background:var(--grad)"></div>
          <span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-emerald-400" style="left:8%"></span><span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-emerald-400" style="left:24%"></span>
          <span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-sky-400" style="left:36%"></span><span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-amber-400" style="left:58%"></span>
          <span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-emerald-400" style="left:72%"></span><span class="absolute top-[2px] w-[3px] h-[10px] rounded bg-amber-400" style="left:88%"></span>
          <span class="absolute w-4 h-4 rounded-full bg-white top-[9.5px] shadow" style="left:calc(62% - 8px)"></span>
        </div>
        <div class="flex justify-between text-[11.5px] font-semibold text-white/50 num"><span>1:23</span><span>Turn 7 of 12</span><span>2:14</span></div>
      </div>
    </div>
  </div>
  <div class="flex gap-4 mt-4 text-[12px] font-semibold text-white/60"><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--pole)"></span>On beat</span><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--edge)"></span>Edge</span><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--brake)"></span>Late / skid</span></div>
</div>

</div>
<div class="tabbar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab on"><i class="fa-solid fa-clapperboard"></i>Replay</div><div class="tab mid"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div></div><div class="tab"><i class="fa-solid fa-shoe-prints"></i>Drills</div><div class="tab"><i class="fa-solid fa-user"></i>Me</div></div>
<div class="homebar"></div>
</div></body></html>
