<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Lesson crew</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="text-[15px] font-bold">Lesson crew</span><div class="iconbtn"><i class="fa-solid fa-user-plus"></i></div></div>
  <div class="hero mt-5" style="height:200px;border-radius:28px;background-image:url(img/trees.jpg)">
    <div class="p-5 h-full flex flex-col justify-between text-white">
      <span class="pill glass self-start"><span class="live"></span>On the hill now</span>
      <div class="flex items-end justify-between"><div><div class="text-[23px] font-extrabold tracking-tight">Saturday Beginners</div><div class="text-[13px] font-semibold opacity-80 mt-0.5">Coach Dan · 10:00 lesson</div></div>
      <div class="avs"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop"><span>+3</span></div></div>
    </div>
  </div>
  <div class="card p-4 mt-4 flex gap-3.5">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=120&h=120&fit=crop" class="w-11 h-11 rounded-[14px] object-cover flex-none">
    <div class="flex-1"><div class="flex items-center justify-between"><span class="text-[14px] font-bold">Coach Dan</span><span class="text-[11.5px] font-semibold text-slate-400">2 min ago</span></div>
    <div class="text-[13.5px] text-slate-600 font-medium mt-1 leading-snug">Nice braking, Maya. Next run, plant the left pole as you feel the beat.</div>
    <div class="flex items-center gap-2 mt-2.5"><span class="pill" style="background:#F3E8FF;color:#6D28D9;padding:4px 10px"><i class="fa-solid fa-clapperboard"></i>Turn 7 clip</span></div></div>
  </div>
  <div class="sec"><div class="h2">Control board</div><span class="text-[12px] font-semibold text-slate-400">Speed never counts</span></div>
  <div class="space-y-2.5">
    <div class="card px-4 py-3 flex items-center gap-3" ><span class="w-5 text-[14px] font-extrabold text-slate-400 num">1</span><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 text-[15px] font-bold">Zoe</span><span class="dot" style="background:var(--ok)"></span><span class="text-[18px] font-extrabold num w-9 text-right">89</span></div>
    <div class="card px-4 py-3 flex items-center gap-3" style="background:#EEF2FF;border-color:#C7D2FE"><span class="w-5 text-[14px] font-extrabold text-slate-400 num">2</span><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 text-[15px] font-bold">Maya (you)</span><span class="dot" style="background:var(--ok)"></span><span class="text-[18px] font-extrabold num w-9 text-right">86</span></div>
    <div class="card px-4 py-3 flex items-center gap-3" ><span class="w-5 text-[14px] font-extrabold text-slate-400 num">3</span><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 text-[15px] font-bold">Leo</span><span class="dot" style="background:var(--ok)"></span><span class="text-[18px] font-extrabold num w-9 text-right">79</span></div>
    <div class="card px-4 py-3 flex items-center gap-3" ><span class="w-5 text-[14px] font-extrabold text-slate-400 num">4</span><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&h=120&fit=crop" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 text-[15px] font-bold">Nia</span><span class="dot" style="background:var(--brake)"></span><span class="text-[18px] font-extrabold num w-9 text-right">72</span></div>
    <div class="card px-4 py-3 flex items-center gap-3" ><span class="w-5 text-[14px] font-extrabold text-slate-400 num">5</span><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop" class="w-10 h-10 rounded-full object-cover"><span class="flex-1 text-[15px] font-bold">Sam</span><span class="dot" style="background:var(--bad)"></span><span class="text-[18px] font-extrabold num w-9 text-right">64</span></div>
  </div>
</div>

</div>
