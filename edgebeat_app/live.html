<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Live run</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen dark">
<div class="scroll">

<div class="absolute inset-x-0 top-0" style="height:520px;background:radial-gradient(70% 60% at 50% 40%,rgba(99,102,241,.45),transparent 70%)"></div>
<div class="relative"><div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div></div>
<div class="pad relative">
  <div class="flex items-center justify-between mt-3">
    <span class="pill" style="background:rgba(244,63,94,.18);color:#FDA4AF"><span class="dot" style="background:#F43F5E"></span>REC 01:24</span>
    <span class="pill glass"><span class="live"></span>2 sensors</span>
  </div>
  <div class="relative mx-auto mt-6" style="width:320px;height:320px">
    <svg viewBox="0 0 320 320" class="absolute inset-0">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset=".55" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs>
      <circle cx="160" cy="160" r="150" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="2"/>
      <circle cx="160" cy="160" r="128" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
      <circle cx="160" cy="160" r="128" fill="none" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="300" transform="rotate(-90 160 160)"/>
      <circle cx="160" cy="160" r="100" fill="rgba(255,255,255,.05)"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <div class="text-[12px] font-bold tracking-[3px] uppercase text-white/50">Next beat</div>
      <div class="flex items-center gap-3 mt-1"><i class="fa-solid fa-arrow-turn-up -scale-x-100 text-[30px] text-sky-300"></i><span class="text-[54px] font-black tracking-tight leading-none">LEFT</span></div>
      <div class="text-[15px] font-semibold text-white/70 mt-2 num">in 0.6 s · 40 BPM</div>
    </div>
  </div>
  <div class="grid grid-cols-3 gap-2.5 mt-6">
    <div class="dcard p-3.5"><div class="text-[11px] font-bold text-white/50 uppercase tracking-wider">Speed</div><div class="text-[28px] font-extrabold num leading-none mt-1.5">13<span class="text-[13px] text-white/50 ml-1">km/h</span></div><div class="bar mt-2.5" style="height:5px"><i style="width:86%;background:#10B981"></i></div></div>
    <div class="dcard p-3.5"><div class="text-[11px] font-bold text-white/50 uppercase tracking-wider">Edge</div><div class="text-[28px] font-extrabold num leading-none mt-1.5">18°</div><div class="flex items-center gap-1.5 mt-2.5 text-[11.5px] font-bold text-sky-300"><span class="dot" style="background:var(--edge)"></span>Good grip</div></div>
    <div class="dcard p-3.5"><div class="text-[11px] font-bold text-white/50 uppercase tracking-wider">Pole</div><div class="text-[28px] font-extrabold num leading-none mt-1.5">+90<span class="text-[13px] text-white/50 ml-1">ms</span></div><div class="flex items-center gap-1.5 mt-2.5 text-[11.5px] font-bold text-amber-300"><span class="dot" style="background:var(--brake)"></span>A bit late</div></div>
  </div>
  <div class="flex items-center justify-between mt-6"><span class="text-[13px] font-bold text-white/60">Turns on beat</span><span class="text-[13px] font-extrabold num">6 / 12</span></div>
  <div class="flex gap-1.5 mt-2.5"><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(16,185,129,.25);color:#6EE7B7">L</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(16,185,129,.25);color:#6EE7B7">R</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(245,158,11,.25);color:#FCD34D">L</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(16,185,129,.25);color:#6EE7B7">R</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(16,185,129,.25);color:#6EE7B7">L</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(16,185,129,.25);color:#6EE7B7">R</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:#fff;color:#0B1A2E">L</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)">R</div><div class="flex-1 h-9 rounded-[10px] flex items-center justify-center text-[11px] font-extrabold" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)">L</div></div>
  <div class="flex gap-3 mt-7">
    <div class="btn glassy flex-1"><i class="fa-solid fa-pause"></i>Pause</div>
    <div class="btn flex-1" style="background:linear-gradient(135deg,#FB7185,#F43F5E);box-shadow:0 14px 26px -12px rgba(244,63,94,.7)"><i class="fa-solid fa-flag-checkered"></i>End run</div>
  </div>
</div>

</div>
<div class="homebar light"></div>
</div></body></html>
