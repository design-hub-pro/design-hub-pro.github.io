<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Drills</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="h1">Drills</div><div class="iconbtn"><i class="fa-solid fa-magnifying-glass"></i></div></div>
  <div class="hscroll mt-4"><span class="chip on">For you</span><span class="chip">Dry land</span><span class="chip">Gentle slope</span><span class="chip">Pole timing</span></div>
  <div class="hero mt-5" style="height:250px;border-radius:28px;background-image:url(img/pole.jpg);background-position:center 60%">
    <div class="p-5 h-full flex flex-col justify-between text-white">
      <div class="flex justify-between"><span class="pill glass"><span class="dot" style="background:#FCD34D"></span>Fixes your left plant</span><span class="pill glass">4 min</span></div>
      <div class="flex items-end justify-between"><div><div class="text-[12.5px] font-semibold opacity-75">Picked from Run 4</div><div class="text-[24px] font-extrabold tracking-tight leading-tight mt-0.5">Tap, turn, tap</div></div><div class="play"><i class="fa-solid fa-play ml-0.5"></i></div></div>
    </div>
  </div>
  <div class="space-y-3 mt-5">
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-rhythm"><i class="fa-solid fa-music"></i></div><div class="flex-1"><div class="flex items-center justify-between"><span class="text-[15px] font-bold">Metronome hops</span><span class="text-[12px] font-bold text-slate-400 num">3 min</span></div><div class="flex items-center gap-2 mt-1 text-[12px] font-semibold text-slate-400"><span>Dry land</span><span class="flex gap-1"><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span></span></div><div class="bar mt-2.5" style="height:5px"><i style="width:100%"></i></div></div></div>
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-brake"><i class="fa-solid fa-hand"></i></div><div class="flex-1"><div class="flex items-center justify-between"><span class="text-[15px] font-bold">Pizza to stop</span><span class="text-[12px] font-bold text-slate-400 num">5 min</span></div><div class="flex items-center gap-2 mt-1 text-[12px] font-semibold text-slate-400"><span>Gentle slope</span><span class="flex gap-1"><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span></span></div><div class="bar mt-2.5" style="height:5px"><i style="width:80%"></i></div></div></div>
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-edge"><i class="fa-solid fa-angle-up"></i></div><div class="flex-1"><div class="flex items-center justify-between"><span class="text-[15px] font-bold">Edge and release</span><span class="text-[12px] font-bold text-slate-400 num">6 min</span></div><div class="flex items-center gap-2 mt-1 text-[12px] font-semibold text-slate-400"><span>Gentle slope</span><span class="flex gap-1"><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span></span></div><div class="bar mt-2.5" style="height:5px"><i style="width:40%"></i></div></div></div>
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-pole"><i class="fa-solid fa-staff-snake"></i></div><div class="flex-1"><div class="flex items-center justify-between"><span class="text-[15px] font-bold">Pole plant ladder</span><span class="text-[12px] font-bold text-slate-400 num">4 min</span></div><div class="flex items-center gap-2 mt-1 text-[12px] font-semibold text-slate-400"><span>Dry land</span><span class="flex gap-1"><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:var(--indigo)"></span><span class="dot" style="width:6px;height:6px;background:#E2E8F0"></span></span></div><div class="bar mt-2.5" style="height:5px"><i style="width:10%"></i></div></div></div>
  </div>
</div>

</div>
<div class="tabbar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-clapperboard"></i>Replay</div><div class="tab mid"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div></div><div class="tab on"><i class="fa-solid fa-shoe-prints"></i>Drills</div><div class="tab"><i class="fa-solid fa-user"></i>Me</div></div>
<div class="homebar"></div>
</div></body></html>
