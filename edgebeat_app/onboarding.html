<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="hero absolute inset-x-0 top-0" style="height:640px;background-image:url(img/lesson.jpg);background-position:center 40%"></div>
<div class="relative z-10"><div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div></div>
<div class="relative z-10 pad" style="padding-top:330px">
  <div class="flex items-center gap-2.5 text-white">
    <div class="w-10 h-10 rounded-[13px] flex items-center justify-center" style="background:var(--gradBeat)"><i class="fa-solid fa-wave-square"></i></div>
    <span class="text-[17px] font-extrabold tracking-tight">EdgeBeat</span>
  </div>
  <div class="text-white text-[40px] font-extrabold tracking-tight leading-[1.04] mt-5">Ski on the beat.<br>Not on speed.</div>
  <div class="text-white/80 text-[15px] font-medium mt-3 leading-snug">Two clip-on sensors score your turns for rhythm and control.</div>
</div>
<div class="pad relative z-10" style="margin-top:58px">
  <div class="grid grid-cols-3 gap-2.5">
    <div class="card p-3.5 text-center"><div class="gicon g-edge mx-auto"><i class="fa-solid fa-shoe-prints"></i></div><div class="text-[12.5px] font-bold mt-2">Boot sensor</div></div>
    <div class="card p-3.5 text-center"><div class="gicon g-pole mx-auto"><i class="fa-solid fa-staff-snake"></i></div><div class="text-[12.5px] font-bold mt-2">Pole sensor</div></div>
    <div class="card p-3.5 text-center"><div class="gicon g-rhythm mx-auto"><i class="fa-solid fa-person-skiing"></i></div><div class="text-[12.5px] font-bold mt-2">Avatar replay</div></div>
  </div>
  <div class="btn mt-6"><i class="fa-brands fa-bluetooth-b"></i>Pair my sensors</div>
  <div class="text-center text-[14px] font-semibold text-slate-500 mt-4">I already have an account</div>
</div>

</div>
<div class="homebar"></div>
</div></body></html>
