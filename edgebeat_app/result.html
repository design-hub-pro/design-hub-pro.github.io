<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Run result</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="absolute inset-x-0 top-0" style="height:430px;background:var(--gradBeat)"></div>
<div class="relative"><div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div></div>
<div class="pad relative">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div><span class="text-white text-[15px] font-bold">Run 4 · Bunny Hill</span><div class="iconbtn glass"><i class="fa-solid fa-arrow-up-from-bracket"></i></div></div>
  <div class="text-center text-white mt-7">
    <div class="text-[12px] font-bold tracking-[3px] uppercase opacity-70">Control score</div>
    <div class="font-black num leading-none mt-2" style="font-size:96px;letter-spacing:-4px">86</div>
    <div class="flex justify-center gap-2 mt-3"><span class="pill glass"><i class="fa-solid fa-arrow-trend-up"></i>+4 vs last</span><span class="pill glass"><i class="fa-solid fa-shield-halved"></i>Under cap all run</span></div>
  </div>
  <div class="card p-5 mt-8">
    <div class="grid grid-cols-3 text-center pb-4 border-b border-slate-100">
      <div><div class="text-[26px] font-extrabold num">12</div><div class="text-[11.5px] font-bold text-slate-400">turns</div></div>
      <div><div class="text-[26px] font-extrabold num">2:14</div><div class="text-[11.5px] font-bold text-slate-400">time</div></div>
      <div><div class="text-[26px] font-extrabold num">14.1</div><div class="text-[11.5px] font-bold text-slate-400">top km/h</div></div>
    </div>
    <div class="space-y-4 mt-4">
      <div><div class="flex items-center justify-between"><span class="flex items-center gap-2 text-[14px] font-bold"><span class="dot" style="background:var(--rhythm)"></span>Rhythm</span><span class="text-[14px] font-extrabold num">91<span class="text-slate-400 font-semibold text-[12px] ml-1.5"></span></span></div><div class="bar mt-2"><i style="width:91%;background:var(--rhythm)"></i></div></div>
      <div><div class="flex items-center justify-between"><span class="flex items-center gap-2 text-[14px] font-bold"><span class="dot" style="background:var(--brake)"></span>Braking</span><span class="text-[14px] font-extrabold num">88<span class="text-slate-400 font-semibold text-[12px] ml-1.5"></span></span></div><div class="bar mt-2"><i style="width:88%;background:var(--brake)"></i></div></div>
      <div><div class="flex items-center justify-between"><span class="flex items-center gap-2 text-[14px] font-bold"><span class="dot" style="background:var(--edge)"></span>Edging</span><span class="text-[14px] font-extrabold num">84<span class="text-slate-400 font-semibold text-[12px] ml-1.5"></span></span></div><div class="bar mt-2"><i style="width:84%;background:var(--edge)"></i></div></div>
      <div><div class="flex items-center justify-between"><span class="flex items-center gap-2 text-[14px] font-bold"><span class="dot" style="background:var(--pole)"></span>Pole timing</span><span class="text-[14px] font-extrabold num">74<span class="text-slate-400 font-semibold text-[12px] ml-1.5"></span></span></div><div class="bar mt-2"><i style="width:74%;background:var(--pole)"></i></div></div>
    </div>
  </div>
  <div class="card p-4 mt-4 flex items-center gap-3.5" style="background:#FFFBEB;border-color:#FDE68A">
    <div class="gicon g-brake"><i class="fa-solid fa-lightbulb"></i></div>
    <div class="flex-1"><div class="text-[14.5px] font-bold">Plant earlier on left turns</div><div class="text-[12.5px] font-semibold text-amber-700 mt-0.5 num">Avg 180 ms after the beat</div></div>
  </div>
  <div class="flex gap-3 mt-5"><div class="btn ghost flex-1"><i class="fa-solid fa-rotate-right"></i>Again</div><div class="btn flex-[1.4]"><i class="fa-solid fa-play"></i>Watch replay</div></div>
</div>

</div>
<div class="homebar"></div>
</div></body></html>
