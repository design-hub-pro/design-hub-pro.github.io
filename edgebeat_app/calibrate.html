<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Calibrate</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="meta">Step 2 of 2</span><div class="w-11"></div></div>
  <div class="h1 mt-5 text-center">Hold your stance</div>
  <div class="sub mt-2 text-center">Knees soft, hands forward. Stay still.</div>
  <div class="relative mx-auto mt-9" style="width:300px;height:300px">
    <svg viewBox="0 0 300 300" class="absolute inset-0">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient></defs>
      <circle cx="150" cy="150" r="136" fill="none" stroke="#E6EDF5" stroke-width="14"/>
      <circle cx="150" cy="150" r="136" fill="none" stroke="url(#cg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="854" stroke-dashoffset="256" transform="rotate(-90 150 150)"/>
      <circle cx="150" cy="150" r="104" fill="#fff"/>
      <circle cx="150" cy="150" r="104" fill="none" stroke="#EEF3F9" stroke-width="2" stroke-dasharray="4 8"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <i class="fa-solid fa-person-skiing text-[64px]" style="background:var(--gradBeat);-webkit-background-clip:text;color:transparent"></i>
      <div class="big num mt-3" style="font-size:44px">3</div>
      <div class="text-[12px] font-bold text-slate-400 tracking-widest uppercase mt-1">seconds</div>
    </div>
  </div>
  <div class="grid grid-cols-3 gap-2.5 mt-9">
    <div class="card p-3.5"><div class="flex items-center gap-1.5 text-[11.5px] font-bold text-slate-400"><span class="dot" style="background:var(--edge)"></span>Boot tilt</div><div class="text-[24px] font-extrabold num mt-1">0.4°</div></div>
    <div class="card p-3.5"><div class="flex items-center gap-1.5 text-[11.5px] font-bold text-slate-400"><span class="dot" style="background:var(--pole)"></span>Pole angle</div><div class="text-[24px] font-extrabold num mt-1">12°</div></div>
    <div class="card p-3.5"><div class="flex items-center gap-1.5 text-[11.5px] font-bold text-slate-400"><span class="dot" style="background:var(--ok)"></span>Drift</div><div class="text-[24px] font-extrabold num mt-1">Low</div></div>
  </div>
  <div class="card p-4 mt-4 flex items-center gap-3.5">
    <img src="img/dryland.jpg" class="w-14 h-14 rounded-[16px] object-cover">
    <div class="flex-1"><div class="text-[14px] font-bold">Practising indoors?</div><div class="text-[12.5px] text-slate-500 font-medium mt-0.5">Dry-land mode uses a balance board</div></div>
    <div class="w-12 h-7 rounded-full bg-slate-200 relative"><div class="w-6 h-6 rounded-full bg-white absolute top-0.5 left-0.5 shadow"></div></div>
  </div>
</div>

</div>
<div class="homebar"></div>
</div></body></html>
