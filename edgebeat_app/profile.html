<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="h1">Me</div><div class="iconbtn"><i class="fa-solid fa-gear"></i></div></div>
  <div class="card p-5 mt-5 flex items-center gap-4">
    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop" class="w-16 h-16 rounded-[20px] object-cover">
    <div class="flex-1"><div class="text-[19px] font-extrabold tracking-tight">Maya Chen</div><div class="flex items-center gap-2 mt-1"><span class="pill" style="background:#D1FAE5;color:#047857;padding:4px 10px"><span class="dot" style="background:#10B981"></span>Green 3</span><span class="text-[12.5px] font-semibold text-slate-400">Day 6 on skis</span></div></div>
  </div>
  <div class="sec"><div class="h2">Sensors</div><span class="act">Add pod</span></div>
  <div class="grid grid-cols-2 gap-3">
    <div class="card p-4"><div class="flex items-center justify-between"><div class="gicon g-edge" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-shoe-prints"></i></div><span class="live"></span></div><div class="text-[14px] font-bold mt-3">Right boot</div><div class="flex items-center gap-2 mt-2"><div class="bar flex-1" style="height:6px"><i style="width:92%;background:var(--ok)"></i></div><span class="text-[12px] font-bold num">92%</span></div></div>
    <div class="card p-4"><div class="flex items-center justify-between"><div class="gicon g-pole" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-staff-snake"></i></div><span class="live"></span></div><div class="text-[14px] font-bold mt-3">Right pole</div><div class="flex items-center gap-2 mt-2"><div class="bar flex-1" style="height:6px"><i style="width:78%;background:var(--ok)"></i></div><span class="text-[12px] font-bold num">78%</span></div></div>
  </div>
  <div class="sec"><div class="h2">Safety</div></div>
  <div class="card px-4 py-1 divide-y divide-slate-100">
    <div class="flex items-center gap-3.5 py-3"><div class="gicon g-rose" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-gauge-simple"></i></div><span class="flex-1 text-[15px] font-semibold">Speed cap</span><span class="text-[15px] font-extrabold num">15 km/h</span><i class="fa-solid fa-chevron-right text-slate-300 text-[12px]"></i></div>
    <div class="flex items-center gap-3.5 py-3"><div class="gicon g-rhythm" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-music"></i></div><span class="flex-1 text-[15px] font-semibold">Beat tempo</span><span class="text-[15px] font-extrabold num">40 BPM</span><i class="fa-solid fa-chevron-right text-slate-300 text-[12px]"></i></div>
    <div class="flex items-center gap-3.5 py-3"><div class="gicon g-ice" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-mobile-screen-button"></i></div><span class="flex-1 text-[15px] font-semibold">Haptic beat</span><div class="w-12 h-7 rounded-full relative" style="background:var(--indigo)"><div class="w-6 h-6 rounded-full bg-white absolute top-0.5 right-0.5 shadow"></div></div></div>
    <div class="flex items-center gap-3.5 py-3"><div class="gicon g-brake" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fa-solid fa-user-shield"></i></div><span class="flex-1 text-[15px] font-semibold">Share runs with coach</span><div class="w-12 h-7 rounded-full relative" style="background:var(--indigo)"><div class="w-6 h-6 rounded-full bg-white absolute top-0.5 right-0.5 shadow"></div></div></div>
  </div>
</div>

</div>
<div class="tabbar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-clapperboard"></i>Replay</div><div class="tab mid"><div class="fab"><i class="fa-solid fa-person-skiing"></i></div></div><div class="tab"><i class="fa-solid fa-shoe-prints"></i>Drills</div><div class="tab on"><i class="fa-solid fa-user"></i>Me</div></div>
<div class="homebar"></div>
</div></body></html>
