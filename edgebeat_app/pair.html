<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeBeat · Pair sensors</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style></style></head>
<body><div class="screen">
<div class="scroll">

<div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
<div class="pad">
  <div class="flex items-center justify-between mt-3"><div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div><span class="meta">Step 1 of 2</span><div class="w-11"></div></div>
  <div class="h1 mt-5">Pair your sensors</div>
  <div class="sub mt-2">Clip one pod on the boot cuff, one on the pole.</div>
  <div class="hero mt-5" style="height:250px;border-radius:28px;background-image:url(img/boot.jpg);background-position:center 45%">
    <div class="h-full p-5 flex flex-col justify-between">
      <span class="pill glass self-start"><i class="fa-brands fa-bluetooth-b"></i>Scanning nearby</span>
      <div class="flex items-end justify-between text-white"><div><div class="text-[12px] font-semibold opacity-75">EdgeBeat Pod</div><div class="text-[20px] font-extrabold tracking-tight">Strap above the buckle</div></div>
      <div class="w-11 h-11 rounded-full bg-white/90 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-play text-[13px] ml-0.5"></i></div></div>
    </div>
  </div>
  <div class="space-y-3 mt-5">
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-edge"><i class="fa-solid fa-shoe-prints"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Right boot</div><div class="flex items-center gap-1.5 mt-1 text-[12px] font-semibold text-slate-400"><i class="fa-solid fa-battery-three-quarters"></i>92%<span class="mx-1">·</span>EB-B1</div></div><span class="pill" style="background:#D1FAE5;color:#047857"><span class="dot" style="background:#10B981"></span>Paired</span></div>
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-pole"><i class="fa-solid fa-staff-snake"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Right pole</div><div class="flex items-center gap-1.5 mt-1 text-[12px] font-semibold text-slate-400"><i class="fa-solid fa-battery-three-quarters"></i>78%<span class="mx-1">·</span>EB-P1</div></div><span class="pill" style="background:#D1FAE5;color:#047857"><span class="dot" style="background:#10B981"></span>Paired</span></div>
    <div class="card p-4 flex items-center gap-3.5"><div class="gicon g-slate"><i class="fa-solid fa-shoe-prints"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Left boot</div><div class="flex items-center gap-1.5 mt-1 text-[12px] font-semibold text-slate-400"><i class="fa-solid fa-battery-three-quarters"></i>--<span class="mx-1">·</span>optional</div></div><span class="pill" style="background:#FEF3C7;color:#B45309"><i class="fa-solid fa-circle-notch fa-spin"></i>Finding</span></div>
  </div>
  <div class="btn mt-6">Calibrate stance<i class="fa-solid fa-arrow-right"></i></div>

</div>
