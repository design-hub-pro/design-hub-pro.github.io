<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MoneyQuest · Life Event</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{ -webkit-font-smoothing:antialiased; font-family:'Inter',sans-serif; }
*::-webkit-scrollbar{ display:none; } *{ scrollbar-width:none; }
html,body{ width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0A0F0C; }
.screen{ width:100%; height:100%; position:relative; overflow:hidden; background:#0A0F0C; color:white; }
.tabular{ font-variant-numeric: tabular-nums; }
.content{ height: 100%; overflow-y:auto; }
</style>
</head>
<body>
<div class="screen">

  <!-- Status bar -->
  <div class="flex justify-between items-center px-7 absolute top-0 left-0 right-0 z-30" style="height:59px;">
    <span class="text-[15px] font-semibold tabular text-white">9:41</span>
    <div class="w-[120px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-[13px] text-white"></i>
      <i class="fas fa-wifi text-[13px] text-white"></i>
      <i class="fas fa-battery-full text-[15px] text-white"></i>
    </div>
  </div>

  <div class="content">

    <!-- Hero image -->
    <div class="relative" style="height:340px;">
      <img src="https://images.unsplash.com/photo-1606293459339-aa5d34a7b0e1?w=900&h=900&fit=crop" class="w-full h-full object-cover">
      <div class="absolute inset-0" style="background:linear-gradient(180deg, rgba(190,18,60,.35) 0%, rgba(10,15,12,.2) 40%, rgba(10,15,12,1) 100%);"></div>

      <!-- Banner -->
      <div class="absolute top-[80px] left-7 right-7">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(244,63,94,.92); box-shadow:0 8px 20px -6px rgba(244,63,94,.5);">
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
          <span class="text-white text-[10px] font-extrabold uppercase tracking-[2px]">Live event · Day 18</span>
        </div>
        <h1 class="text-white font-extrabold leading-[1.05] mt-4" style="font-size:38px;">
          Phone screen<br/>cracked! 😬
        </h1>
        <p class="text-white/85 text-[14px] mt-3 leading-[20px]">
          You dropped your phone. The screen is shattered. How do you handle it?
        </p>
      </div>
    </div>

    <!-- Choices -->
    <div class="px-7 pb-7 -mt-1 space-y-2.5">
      <p class="text-emerald-300 text-[11px] font-bold uppercase tracking-[2px] mb-1">Choose your move</p>

      <!-- Option 1 -->
      <button class="w-full rounded-2xl p-4 text-left flex items-center gap-3" style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#34D399,#10B981);">
          <i class="fas fa-screwdriver-wrench text-white text-[15px]"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <p class="text-[14px] font-bold text-white">Repair the screen</p>
            <p class="text-[14px] font-extrabold tabular text-rose-300">−$120</p>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">3 days at the repair shop · keeps your phone</p>
          <div class="flex gap-1.5 mt-2">
            <span class="text-[9px] font-bold text-emerald-300 bg-emerald-500/15 px-1.5 py-0.5 rounded">Smart</span>
            <span class="text-[9px] font-bold text-slate-400 bg-white/5 px-1.5 py-0.5 rounded">Budget-friendly</span>
          </div>
        </div>
      </button>

      <!-- Option 2 (highlighted recommended) -->
      <button class="w-full rounded-2xl p-4 text-left flex items-center gap-3" style="background:rgba(132,204,22,.08); border:1.5px solid rgba(163,230,53,.4);">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#FBBF24,#F59E0B);">
          <i class="fas fa-shield-halved text-white text-[15px]"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <p class="text-[14px] font-bold text-white">Use insurance</p>
            <p class="text-[14px] font-extrabold tabular text-amber-300">−$29</p>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">Deductible only · you bought coverage in Month 1</p>
          <div class="flex gap-1.5 mt-2">
            <span class="text-[9px] font-bold text-lime-300 bg-lime-500/15 px-1.5 py-0.5 rounded">⭐ Best deal</span>
            <span class="text-[9px] font-bold text-slate-300 bg-white/5 px-1.5 py-0.5 rounded">+20 XP</span>
          </div>
        </div>
      </button>

      <!-- Option 3 -->
      <button class="w-full rounded-2xl p-4 text-left flex items-center gap-3" style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#FB7185,#E11D48);">
          <i class="fas fa-mobile-screen text-white text-[15px]"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <p class="text-[14px] font-bold text-white">Buy a new iPhone</p>
            <p class="text-[14px] font-extrabold tabular text-rose-300">−$799</p>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">Drains 62% of your cash · ouch</p>
          <div class="flex gap-1.5 mt-2">
            <span class="text-[9px] font-bold text-rose-300 bg-rose-500/15 px-1.5 py-0.5 rounded">Risky</span>
            <span class="text-[9px] font-bold text-slate-400 bg-white/5 px-1.5 py-0.5 rounded">Goal at risk</span>
          </div>
        </div>
      </button>

      <!-- Option 4 -->
      <button class="w-full rounded-2xl p-4 text-left flex items-center gap-3" style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#94A3B8,#64748B);">
          <i class="fas fa-clock text-white text-[15px]"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <p class="text-[14px] font-bold text-white">Live with it for now</p>
            <p class="text-[14px] font-extrabold tabular text-slate-300">$0</p>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">Save up · risk it getting worse next month</p>
        </div>
      </button>

      <!-- AI hint -->
      <div class="rounded-2xl p-3.5 mt-3 flex items-start gap-2.5" style="background:rgba(252,211,77,.08); border:1px solid rgba(252,211,77,.18);">
        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style="background:linear-gradient(135deg,#FBBF24,#F59E0B);">
          <i class="fas fa-lightbulb text-white text-[12px]"></i>
        </div>
        <div class="flex-1">
          <p class="text-amber-300 text-[10px] font-bold uppercase tracking-wider">Coach tip</p>
          <p class="text-white text-[12px] leading-[17px] mt-1">
            You bought phone insurance in Month 1 for <span class="font-bold text-amber-200">$8/mo</span>. This is exactly what it's for — claim it.
          </p>
        </div>
      </div>

    </div>

  </div>

</div>
</body>
</html>
