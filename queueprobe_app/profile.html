<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Me</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="row" style="gap:16px;margin:8px 0 20px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308814479-image-1.png" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 18px rgba(14,27,44,.15)" alt="">
      <div style="flex:1"><div class="h1" style="font-size:24px">Maya R.</div><div class="row" style="gap:8px;margin-top:6px"><span class="chip" style="padding:4px 10px;font-size:11.5px">Age 15</span><span class="chip" style="padding:4px 10px;font-size:11.5px">2.0 L goal</span></div></div>
      <i class="fas fa-gear" style="color:var(--faint);font-size:20px"></i>
    </div>
    <div class="card" style="padding:18px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center">
      <div><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">12</div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">day streak</div></div>
      <div style="border-left:1px solid var(--bd);border-right:1px solid var(--bd)"><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">41</div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">goal days</div></div>
      <div><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">86<span style="font-size:15px">L</span></div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">logged</div></div>
    </div>
    <div class="between" style="margin:22px 0 14px"><div class="h2">Badges</div><span style="font-size:13px;font-weight:700;color:var(--acc)">6 of 20</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
      <div style="text-align:center;"><div style="width:64px;height:64px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,#3BC4F2,#1677D9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(14,27,44,.12)"><i class="fas fa-droplet"></i></div><div style="font-size:11.5px;font-weight:700;margin-top:8px;color:var(--mut)">First sip</div></div>
      <div style="text-align:center;"><div style="width:64px;height:64px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,#FFB547,#FF7A6B);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(14,27,44,.12)"><i class="fas fa-fire"></i></div><div style="font-size:11.5px;font-weight:700;margin-top:8px;color:var(--mut)">7 days</div></div>
      <div style="text-align:center;"><div style="width:64px;height:64px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,#4FE0B5,#2CC79A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(14,27,44,.12)"><i class="fas fa-futbol"></i></div><div style="font-size:11.5px;font-weight:700;margin-top:8px;color:var(--mut)">Game ready</div></div>
      <div style="text-align:center;opacity:.4;"><div style="width:64px;height:64px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,#9D90F5,#6B5BE0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 8px 16px rgba(14,27,44,.12)"><i class="fas fa-crown"></i></div><div style="font-size:11.5px;font-weight:700;margin-top:8px;color:var(--mut)">30 days</div></div>
    </div>
    <div class="card" style="padding:4px 16px;margin-top:22px">
      <div style="border-top:0"><div class="between" style="padding:13px 0;"><div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#3BC4F2,#1677D9)"><i class="fas fa-bottle-water"></i></div><span style="font-weight:700;font-size:14.5px">My bottle</span></div><span style="font-size:13.5px;font-weight:700;color:var(--faint)">500 ml <i class="fas fa-chevron-right" style="margin-left:6px"></i></span></div></div>
      <div class="between" style="padding:13px 0;border-top:1px solid var(--bd)"><div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#4FE0B5,#2CC79A)"><i class="fas fa-ruler"></i></div><span style="font-weight:700;font-size:14.5px">Units</span></div><span style="font-size:13.5px;font-weight:700;color:var(--faint)">ml <i class="fas fa-chevron-right" style="margin-left:6px"></i></span></div>
      <div class="between" style="padding:13px 0;border-top:1px solid var(--bd)"><div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#FFB547,#FF7A6B)"><i class="fas fa-house-user"></i></div><span style="font-weight:700;font-size:14.5px">Share weekly chart with parent</span></div><div class="toggle"></div></div>
      <div class="between" style="padding:13px 0;border-top:1px solid var(--bd)"><div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-lock"></i></div><span style="font-weight:700;font-size:14.5px">No ads. No data sold.</span></div><i class="fas fa-circle-check" style="color:var(--mint)"></i></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab on"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
