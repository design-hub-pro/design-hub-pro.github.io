<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Reminders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div style="margin:4px 0 18px"><div class="meta">Smart schedule</div><div class="h1" style="margin-top:4px">Reminders</div></div>
    <div class="card" style="padding:18px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center">
      <div><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px">7</div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">today</div></div>
      <div style="border-left:1px solid var(--bd);border-right:1px solid var(--bd)"><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--mint)">4</div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">answered</div></div>
      <div><div class="num" style="font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--lav)">3</div><div style="font-size:11.5px;font-weight:700;color:var(--faint)">muted in class</div></div>
    </div>
    <div class="row" style="gap:8px;margin:18px 0 16px">
      <span class="chip" style="background:var(--ink);color:#fff;border-color:var(--ink)">School day</span><span class="chip">Game day</span><span class="chip">Weekend</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="gap:14px;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">7:15</div>
        <div class="card between" style="flex:1;padding:12px 14px;">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#FFB547,#FF7A6B)"><i class="fas fa-sun"></i></div><div style="font-weight:700;font-size:14.5px">Wake-up glass</div></div><i class="fas fa-circle-check" style="color:var(--mint);font-size:18px"></i>
        </div></div>
      <div class="row" style="gap:14px;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">10:05</div>
        <div class="card between" style="flex:1;padding:12px 14px;">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#3BC4F2,#1677D9)"><i class="fas fa-school"></i></div><div style="font-weight:700;font-size:14.5px">Break between classes</div></div><i class="fas fa-circle-check" style="color:var(--mint);font-size:18px"></i>
        </div></div>
      <div class="row" style="gap:14px;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">12:20</div>
        <div class="card between" style="flex:1;padding:12px 14px;">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#4FE0B5,#2CC79A)"><i class="fas fa-utensils"></i></div><div style="font-weight:700;font-size:14.5px">Lunch refill</div></div><i class="fas fa-circle-check" style="color:var(--mint);font-size:18px"></i>
        </div></div>
      <div class="row" style="gap:14px;opacity:.55;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">1:00</div>
        <div class="card between" style="flex:1;padding:12px 14px;">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-moon"></i></div><div style="font-weight:700;font-size:14.5px">Class time</div></div><i class="fas fa-moon" style="color:var(--lav)"></i>
        </div></div>
      <div class="row" style="gap:14px;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">3:30</div>
        <div class="card between" style="flex:1;padding:12px 14px;border:2px solid var(--acc);">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#FFB547,#FF7A6B)"><i class="fas fa-futbol"></i></div><div style="font-weight:700;font-size:14.5px">Before practice</div></div><span class="chip" style="padding:4px 10px;background:var(--aqua);border-color:transparent;color:var(--acc);font-size:11.5px">Next</span>
        </div></div>
      <div class="row" style="gap:14px;">
        <div class="num" style="width:46px;font-size:13px;font-weight:800;color:var(--mut)">6:45</div>
        <div class="card between" style="flex:1;padding:12px 14px;">
          <div class="row" style="gap:12px"><div class="ico" style="width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,#4FE0B5,#2CC79A)"><i class="fas fa-bowl-food"></i></div><div style="font-weight:700;font-size:14.5px">Dinner</div></div><span class="dot" style="background:#C9D4DE"></span>
        </div></div>
    </div>
    <div class="card between" style="padding:14px 16px;margin-top:16px">
      <div class="row" style="gap:12px"><div class="ico" style="background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-bell-slash"></i></div><div><div style="font-weight:800;font-size:15px">Silent during class</div><div style="font-size:12px;color:var(--faint);font-weight:600">Uses your bell schedule</div></div></div>
      <div class="toggle on"></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab on"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
