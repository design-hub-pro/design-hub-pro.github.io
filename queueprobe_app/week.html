<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · This week</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="between" style="margin:4px 0 18px">
      <div><div class="meta">Sep 29 – Oct 5</div><div class="h1" style="margin-top:4px">This week</div></div>
      <div class="row" style="gap:6px"><div class="chip" style="padding:8px 10px"><i class="fas fa-chevron-left"></i></div><div class="chip" style="padding:8px 10px"><i class="fas fa-chevron-right"></i></div></div>
    </div>
    <div class="card" style="padding:20px 18px 16px">
      <div class="between">
        <div><div class="num" style="font-size:34px;font-weight:900;letter-spacing:-1.2px">1.8 <span style="font-size:16px;color:var(--faint);letter-spacing:0">L / day</span></div></div>
        <div class="chip" style="background:#E3F8F1;border-color:transparent;color:#1A9B76;padding:6px 10px"><i class="fas fa-arrow-trend-up" style="font-size:11px"></i> +0.3 L</div>
      </div>
      <div style="position:relative;height:250px;margin-top:14px">
        <div style="position:absolute;left:0;right:0;bottom:194px;border-top:2px dashed #BFD6EA"></div>
        <div style="position:absolute;right:0;bottom:198px;font-size:10.5px;font-weight:800;color:var(--acc)">GOAL 2.0</div>
        <div style="display:flex;height:100%;gap:6px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">2.1</div>
        <div style="width:30px;height:175px;border-radius:10px;background:linear-gradient(to top,#1677D9,#3BC4F2)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">M</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">1.4</div>
        <div style="width:30px;height:120px;border-radius:10px;background:repeating-linear-gradient(45deg,#3BC4F2 0 6px,#5AD3F7 6px 12px)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--acc)">T</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">1.8</div>
        <div style="width:30px;height:150px;border-radius:10px;background:linear-gradient(to top,#1677D9,#3BC4F2)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">W</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">2.3</div>
        <div style="width:30px;height:191px;border-radius:10px;background:linear-gradient(to top,#1677D9,#3BC4F2)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">T</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">1.2</div>
        <div style="width:30px;height:100px;border-radius:10px;background:linear-gradient(to top,#FFB547,#FFD08A)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">F</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">2.0</div>
        <div style="width:30px;height:170px;border-radius:10px;background:linear-gradient(to top,#1677D9,#3BC4F2)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">S</div></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="num" style="font-size:10.5px;font-weight:800;color:var(--faint);margin-bottom:6px">1.6</div>
        <div style="width:30px;height:137px;border-radius:10px;background:linear-gradient(to top,#FFB547,#FFD08A)"></div>
        <div style="font-size:12px;font-weight:800;margin-top:8px;color:var(--mut)">S</div></div></div>
      </div>
      <div class="row" style="gap:16px;margin-top:12px;font-size:11.5px;font-weight:700;color:var(--mut)">
        <span class="row" style="gap:6px"><span class="dot" style="background:var(--acc)"></span>Goal hit</span>
        <span class="row" style="gap:6px"><span class="dot" style="background:var(--amb)"></span>Short</span>
        <span class="row" style="gap:6px"><span class="dot" style="background:var(--acc2)"></span>Today</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div class="gtile" style="background:linear-gradient(135deg,#4FE0B5,#2CC79A);padding:16px"><i class="fas fa-bullseye"></i><div class="num" style="font-size:30px;font-weight:900;margin-top:12px">4/7</div><small>goal days</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#FFB547,#FF7A6B);padding:16px"><i class="fas fa-fire"></i><div class="num" style="font-size:30px;font-weight:900;margin-top:12px">12</div><small>day logging streak</small></div>
    </div>
    <div class="card row" style="padding:14px 16px;margin-top:14px;gap:14px">
      <div class="ico" style="background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-lightbulb"></i></div>
      <div style="font-size:14px;font-weight:600;color:var(--mut);line-height:1.4"><b style="color:var(--ink)">Fridays run low.</b> Add a reminder after last period?</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab on"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
