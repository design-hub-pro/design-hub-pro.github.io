<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{background:#fff;color:#0E1B2C}
.head{max-width:1460px;margin:0 auto;padding:80px 40px 56px;text-align:center}
.icon{width:64px;height:64px;margin:0 auto 22px;border-radius:1rem;background:linear-gradient(135deg,#3BC4F2,#1677D9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 14px 32px rgba(22,119,217,.3)}
h1{font-size:52px;font-weight:900;letter-spacing:-2px}
.sub{font-size:18px;color:#5A6878;margin-top:12px;max-width:680px;margin-left:auto;margin-right:auto;line-height:1.5}
.tags{display:flex;gap:8px;justify-content:center;margin-top:18px}
.tags span{font-size:12.5px;font-weight:700;color:#1677D9;background:#E3F5FD;padding:6px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,460px);gap:64px 40px;justify-content:center;padding:0 40px 100px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0E1B2C;box-shadow:0 34px 70px rgba(14,27,44,.22),0 0 0 1px rgba(14,27,44,.06)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#F4F8FB}
@media (max-width:1520px){.grid{grid-template-columns:repeat(2,460px)}}
@media (max-width:1000px){.grid{grid-template-columns:460px}}
</style>
</head>
<body>

<div class="head">
  <div class="icon"><i class="fas fa-droplet"></i></div>
  <h1>QueueProbe</h1>
  <p class="sub">A water tracker for teens that stays quiet in class and reminds you before practice.</p>
  <div class="tags"><span>Health</span><span>Teens</span><span>Habits</span></div>
</div>

<div class="grid">
  <div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="add.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="reminders.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="nudge.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="week.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="squad.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="learn.html" scrolling="no"></iframe></div>
  <div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div>
</div>

</body>
</html>
