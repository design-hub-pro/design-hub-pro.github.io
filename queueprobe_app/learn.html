<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Learn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div style="margin:4px 0 18px"><div class="meta">60-second videos</div><div class="h1" style="margin-top:4px">Why it matters</div></div>
    <div class="hero" style="height:250px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798500-image-1.png" alt="">
      <div class="scrim"></div>
      <div class="play" style="top:50%;left:50%;transform:translate(-50%,-70%);width:58px;height:58px;font-size:18px"><i class="fas fa-play"></i></div>
      <div style="position:absolute;left:20px;right:20px;bottom:18px;color:#fff">
        <div class="chip" style="padding:4px 10px;font-size:11px;background:rgba(255,255,255,.2);color:#fff;border-color:transparent">HOT DAYS</div>
        <div style="font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.4px">Thirst shows up late</div>
      </div>
      <div class="dur" style="top:14px;bottom:auto">1:02</div>
    </div>
    <div class="between" style="margin:22px 0 12px"><div class="h2">Up next</div><span style="font-size:13px;font-weight:700;color:var(--acc)">All</span></div>
    <div class="scroller">
      <div style="flex:0 0 200px"><div class="hero" style="height:130px;border-radius:20px;box-shadow:none"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798308-image-1.png" alt=""><div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div><div class="dur">0:48</div></div><div style="font-weight:800;font-size:14px;margin-top:9px">Water and game day</div></div>
      <div style="flex:0 0 200px"><div class="hero" style="height:130px;border-radius:20px;box-shadow:none"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798161-image-1.png" alt=""><div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div><div class="dur">0:55</div></div><div style="font-weight:800;font-size:14px;margin-top:9px">Focus in last period</div></div>
      <div style="flex:0 0 200px"><div class="hero" style="height:130px;border-radius:20px;box-shadow:none"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308797086-image-1.png" alt=""><div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div><div class="dur">0:40</div></div><div style="font-weight:800;font-size:14px;margin-top:9px">Make water taste better</div></div>
    </div>
    <div class="h2" style="margin:22px 0 12px">Your progress</div>
    <div class="card" style="padding:16px">
      <div class="between"><span style="font-weight:800;font-size:14.5px">Hydration basics</span><span class="num" style="font-size:13px;font-weight:800;color:var(--acc)">5 / 8</span></div>
      <div class="bar" style="margin-top:10px"><span style="width:62%"></span></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
