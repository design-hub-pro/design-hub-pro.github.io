<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Today</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="between" style="margin:4px 0 18px">
      <div><div class="meta">Tuesday, Oct 6</div><div class="h1" style="margin-top:4px">Hey, Maya</div></div>
      <div class="row" style="gap:10px">
        <div class="chip" style="padding:8px 12px;color:var(--coral)"><i class="fas fa-fire"></i><span class="num" style="color:var(--ink)">12</span></div>
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308814479-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover" alt="">
      </div>
    </div>

    <div class="card" style="padding:24px 22px;display:flex;align-items:center;gap:22px;overflow:hidden;position:relative">
      <div style="position:relative;width:118px;height:178px;flex:0 0 118px">
        <svg width="118" height="178" viewBox="0 0 118 178">
          <defs>
            <clipPath id="b"><path d="M42 6h34v16c0 4 4 6 10 10 12 8 20 18 20 34v92c0 8-6 14-14 14H26c-8 0-14-6-14-14V66c0-16 8-26 20-34 6-4 10-6 10-10z"/></clipPath>
            <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3BC4F2"/><stop offset="1" stop-color="#1677D9"/></linearGradient>
          </defs>
          <g clip-path="url(#b)">
            <rect width="118" height="178" fill="#E3F5FD"/>
            <path d="M0 74 C20 66 40 82 60 74 S100 66 118 74 V178 H0z" fill="url(#w)"/>
            <circle cx="40" cy="120" r="4" fill="#fff" opacity=".4"/><circle cx="70" cy="145" r="3" fill="#fff" opacity=".35"/><circle cx="58" cy="100" r="2.5" fill="#fff" opacity=".4"/>
          </g>
          <path d="M42 6h34v16c0 4 4 6 10 10 12 8 20 18 20 34v92c0 8-6 14-14 14H26c-8 0-14-6-14-14V66c0-16 8-26 20-34 6-4 10-6 10-10z" fill="none" stroke="#C6E4F5" stroke-width="2"/>
        </svg>
      </div>
      <div style="flex:1">
        <div class="num" style="font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1">1,450</div>
        <div style="font-size:14px;color:var(--faint);font-weight:700;margin-top:4px">of 2,000 ml</div>
        <div class="chip" style="margin-top:14px;background:var(--aqua);border-color:transparent;color:var(--acc);padding:6px 11px"><i class="fas fa-droplet" style="font-size:11px"></i> 550 ml to go</div>
        <div class="row" style="gap:5px;margin-top:14px">
          <span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:linear-gradient(#3BC4F2,#1677D9)"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:#E3EBF2"></span><span style="width:16px;height:22px;border-radius:4px 4px 6px 6px;background:#E3EBF2"></span>
        </div>
      </div>
    </div>

    <div class="between" style="margin:22px 0 12px"><div class="h2">Quick add</div><span style="font-size:13px;font-weight:700;color:var(--acc)">Edit</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div class="card" style="padding:14px 6px;text-align:center"><i class="fas fa-glass-water" style="font-size:22px;color:var(--acc2)"></i><div class="num" style="font-size:15px;font-weight:800;margin-top:8px">250</div><div style="font-size:11px;color:var(--faint);font-weight:700">glass</div></div>
      <div class="card" style="padding:14px 6px;text-align:center;border:2px solid var(--acc);background:var(--aqua)"><i class="fas fa-bottle-water" style="font-size:22px;color:var(--acc)"></i><div class="num" style="font-size:15px;font-weight:800;margin-top:8px">500</div><div style="font-size:11px;color:var(--acc);font-weight:700">my bottle</div></div>
      <div class="card" style="padding:14px 6px;text-align:center"><i class="fas fa-mug-hot" style="font-size:22px;color:var(--amb)"></i><div class="num" style="font-size:15px;font-weight:800;margin-top:8px">300</div><div style="font-size:11px;color:var(--faint);font-weight:700">tea</div></div>
      <div class="card" style="padding:14px 6px;text-align:center"><i class="fas fa-plus" style="font-size:22px;color:var(--faint)"></i><div style="font-size:15px;font-weight:800;margin-top:8px">Other</div><div style="font-size:11px;color:var(--faint);font-weight:700">custom</div></div>
    </div>

    <div class="hero" style="height:150px;margin-top:20px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798308-image-1.png" alt="">
      <div class="scrim" style="background:linear-gradient(to right,rgba(6,22,44,.85),rgba(6,22,44,.1))"></div>
      <div style="position:absolute;left:20px;top:20px;color:#fff;max-width:230px">
        <div class="row" style="gap:7px;font-size:12px;font-weight:700;opacity:.9"><span class="dot" style="background:var(--amb)"></span>Next reminder · 3:30</div>
        <div style="font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.4px;line-height:1.2">Practice at 4. Top up before you go.</div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
