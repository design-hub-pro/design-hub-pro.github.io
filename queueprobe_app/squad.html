<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Squad</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div style="margin:4px 0 18px"><div class="meta">Squad challenge</div><div class="h1" style="margin-top:4px">U16 Strikers</div></div>
    <div class="hero" style="height:200px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798308-image-1.png" alt="">
      <div class="scrim"></div>
      <div style="position:absolute;top:16px;left:16px" class="chip"><span class="dot" style="background:var(--mint)"></span> 3 days left</div>
      <div style="position:absolute;left:20px;right:20px;bottom:18px;color:#fff">
        <div style="font-size:13px;font-weight:700;opacity:.85">Team goal this week</div>
        <div class="between" style="margin-top:4px">
          <div class="num" style="font-size:34px;font-weight:900;letter-spacing:-1px">68 <span style="font-size:16px;opacity:.75">/ 100 L</span></div>
          <div class="avs"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816051-image-2.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816403-image-3.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816601-image-4.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308814479-image-1.png" alt=""></div>
        </div>
        <div class="bar" style="margin-top:10px;background:rgba(255,255,255,.25)"><span style="width:68%;background:#fff"></span></div>
      </div>
    </div>
    <div class="between" style="margin:22px 0 4px"><div class="h2">Today</div><span style="font-size:12px;font-weight:700;color:var(--faint)">Only % is shared</span></div>
    <div class="row" style="gap:12px;padding:12px 0;border-top:1px solid var(--bd)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816051-image-2.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover" alt="">
        <div style="flex:1"><div class="between"><span style="font-weight:800;font-size:14.5px">Jordan</span><span class="num" style="font-size:13px;font-weight:800;color:var(--mut)">100%</span></div>
        <div class="bar" style="margin-top:7px"><span style="width:100%;background:linear-gradient(90deg,#4FE0B5,#2CC79A)"></span></div></div></div>
    <div class="row" style="gap:12px;padding:12px 0;border-top:1px solid var(--bd)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816403-image-3.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover" alt="">
        <div style="flex:1"><div class="between"><span style="font-weight:800;font-size:14.5px">Lia</span><span class="num" style="font-size:13px;font-weight:800;color:var(--mut)">100%</span></div>
        <div class="bar" style="margin-top:7px"><span style="width:100%;background:linear-gradient(90deg,#4FE0B5,#2CC79A)"></span></div></div></div>
    <div class="row" style="gap:12px;padding:12px 0;border-top:1px solid var(--bd)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308814479-image-1.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover" alt="">
        <div style="flex:1"><div class="between"><span style="font-weight:800;font-size:14.5px">Maya <span style="color:var(--faint);font-weight:600">(you)</span></span><span class="num" style="font-size:13px;font-weight:800;color:var(--mut)">72%</span></div>
        <div class="bar" style="margin-top:7px"><span style="width:72%;"></span></div></div></div>
    <div class="row" style="gap:12px;padding:12px 0;border-top:1px solid var(--bd)">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816601-image-4.png" style="width:40px;height:40px;border-radius:50%;object-fit:cover" alt="">
        <div style="flex:1"><div class="between"><span style="font-weight:800;font-size:14.5px">Sam</span><span class="num" style="font-size:13px;font-weight:800;color:var(--mut)">40%</span></div>
        <div class="bar" style="margin-top:7px"><span style="width:40%;"></span></div></div></div>
    <div class="row" style="gap:10px;margin-top:14px">
      <div class="btn sec" style="flex:1;height:50px;font-size:14.5px"><i class="fas fa-hand-sparkles" style="color:var(--amb)"></i> Cheer Sam</div>
      <div class="btn pri" style="flex:1;height:50px;font-size:14.5px"><i class="fas fa-user-plus"></i> Invite</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-droplet"></i>Today</div>
    <div class="tab"><i class="fas fa-chart-column"></i>Week</div>
    <div class="tab add"><i class="fas fa-plus"></i></div>
    <div class="tab"><i class="fas fa-bell"></i>Remind</div>
    <div class="tab on"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
