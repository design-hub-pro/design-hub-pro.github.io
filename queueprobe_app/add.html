<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Add a drink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content" style="padding-bottom:40px">
    <div class="between" style="margin:4px 0 20px">
      <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-xmark"></i></div>
      <div class="h2">Add a drink</div>
      <div style="width:42px"></div>
    </div>
    <div class="scroller" style="padding-bottom:4px">
      <div class="gtile" style="flex:0 0 96px;background:linear-gradient(135deg,#3BC4F2,#1677D9);box-shadow:0 10px 20px rgba(22,119,217,.3)"><i class="fas fa-droplet"></i><b>Water</b><small>100%</small></div>
      <div class="gtile" style="flex:0 0 96px;background:#fff;color:var(--ink);border:1px solid var(--bd)"><i class="fas fa-champagne-glasses" style="color:var(--acc2)"></i><b>Sparkling</b><small style="color:var(--faint)">100%</small></div>
      <div class="gtile" style="flex:0 0 96px;background:#fff;color:var(--ink);border:1px solid var(--bd)"><i class="fas fa-mug-hot" style="color:var(--amb)"></i><b>Tea</b><small style="color:var(--faint)">counts</small></div>
      <div class="gtile" style="flex:0 0 96px;background:#fff;color:var(--ink);border:1px solid var(--bd)"><i class="fas fa-cow" style="color:var(--lav)"></i><b>Milk</b><small style="color:var(--faint)">counts</small></div>
      <div class="gtile" style="flex:0 0 96px;background:#fff;color:var(--ink);border:1px solid var(--bd)"><i class="fas fa-bolt" style="color:var(--coral)"></i><b>Soda</b><small style="color:var(--faint)">logged only</small></div>
    </div>

    <div style="position:relative;height:330px;margin-top:22px;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,#E3F5FD 0%,rgba(227,245,253,0) 70%)"></div>
      <svg width="170" height="270" viewBox="0 0 170 270" style="position:relative">
        <defs>
          <clipPath id="c"><path d="M14 10h142l-16 246c-1 8-7 14-15 14H45c-8 0-14-6-15-14z"/></clipPath>
          <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AD3F7"/><stop offset="1" stop-color="#1677D9"/></linearGradient>
        </defs>
        <g clip-path="url(#c)"><rect width="170" height="270" fill="#fff"/><path d="M0 110 C30 98 60 122 90 110 S150 98 170 110 V270 H0z" fill="url(#w2)"/></g>
        <path d="M14 10h142l-16 246c-1 8-7 14-15 14H45c-8 0-14-6-15-14z" fill="none" stroke="#C6E4F5" stroke-width="3"/>
        <g stroke="#C6E4F5" stroke-width="2"><line x1="150" y1="60" x2="138" y2="60"/><line x1="146" y1="110" x2="134" y2="110"/><line x1="143" y1="160" x2="131" y2="160"/><line x1="140" y1="210" x2="128" y2="210"/></g>
      </svg>
      <div style="position:absolute;right:6px;top:110px;text-align:right">
        <div class="num" style="font-size:36px;font-weight:900;letter-spacing:-1.5px">350</div>
        <div style="font-size:13px;font-weight:700;color:var(--faint)">ml</div>
      </div>
    </div>
    <div style="text-align:center;font-size:12.5px;font-weight:700;color:var(--faint)"><i class="fas fa-arrows-up-down" style="margin-right:6px"></i>Drag to set amount</div>

    <div class="row" style="gap:8px;justify-content:center;margin-top:18px">
      <span class="chip">150</span><span class="chip">250</span><span class="chip" style="background:var(--ink);color:#fff;border-color:var(--ink)">350</span><span class="chip">500</span><span class="chip">750</span>
    </div>
    <div class="card between" style="padding:14px 16px;margin-top:20px">
      <div class="row" style="gap:12px"><div class="ico" style="background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-clock"></i></div><div><div style="font-weight:800;font-size:15px">Now</div><div style="font-size:12px;color:var(--faint);font-weight:600">2:12 PM</div></div></div>
      <i class="fas fa-chevron-right" style="color:var(--faint)"></i>
    </div>
    <div class="btn pri" style="margin-top:16px"><i class="fas fa-droplet"></i> Add 350 ml</div>
  </div>


</div>
</body>
</html>
