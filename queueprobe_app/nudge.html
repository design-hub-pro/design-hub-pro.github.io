<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Reminder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">

  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798744-image-1.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,22,44,.35),rgba(6,22,44,.15) 40%,rgba(6,22,44,.55))"></div>
  <div style="position:relative">  <div class="status light">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div></div>
  <div style="position:relative;text-align:center;color:#fff;margin-top:26px">
    <div style="font-size:16px;font-weight:600;opacity:.9">Tuesday, October 6</div>
    <div class="num" style="font-size:96px;font-weight:700;letter-spacing:-3px;line-height:1.05">3:30</div>
  </div>
  <div style="position:relative;margin:auto 16px 0;padding-bottom:40px">
    <div style="background:rgba(255,255,255,.82);backdrop-filter:blur(24px);border-radius:26px;padding:16px 16px 14px;box-shadow:0 20px 40px rgba(0,0,0,.25)">
      <div class="between">
        <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3BC4F2,#1677D9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px"><i class="fas fa-droplet"></i></div><span style="font-size:12.5px;font-weight:700;color:var(--mut)">QUEUEPROBE</span></div>
        <span style="font-size:12px;color:var(--mut);font-weight:600">now</span>
      </div>
      <div style="font-size:16px;font-weight:800;margin-top:10px">Practice in 30 min</div>
      <div style="font-size:14px;color:var(--mut);font-weight:500;margin-top:3px">One bottle now. You're 550 ml from today's goal.</div>
      <div style="margin-top:12px" class="bar"><span style="width:72%"></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px">
        <div style="height:44px;border-radius:14px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">+500 ml</div>
        <div style="height:44px;border-radius:14px;background:rgba(14,27,44,.07);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">+250 ml</div>
        <div style="height:44px;border-radius:14px;background:rgba(14,27,44,.07);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">20 min</div>
      </div>
    </div>
    <div style="background:rgba(255,255,255,.55);backdrop-filter:blur(24px);border-radius:22px;padding:12px 16px;margin-top:10px" class="row">
      <div class="avs" style="margin-right:10px"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816051-image-2.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308816403-image-3.png" alt=""></div>
      <div style="font-size:13.5px;font-weight:600;color:var(--ink)"><b>Jordan</b> and <b>Lia</b> just hit their goal</div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:26px;padding:0 30px">
      <div style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center"><i class="fas fa-flashlight"></i></div>
      <div style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center"><i class="fas fa-camera"></i></div>
    </div>
    <div style="width:140px;height:5px;border-radius:3px;background:#fff;margin:18px auto 0"></div>
  </div>


</div>
</body>
</html>
