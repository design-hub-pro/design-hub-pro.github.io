<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueProbe · Set your goal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">

  <div style="position:relative;height:430px;flex:0 0 430px">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791308798352-image-1.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,22,44,.35),rgba(6,22,44,0) 30%,rgba(244,248,251,0) 70%,var(--surf))"></div>
    <div style="position:absolute;top:0;left:0;right:0">  <div class="status light">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div></div>
    <div style="position:absolute;top:70px;left:28px;right:28px" class="between">
      <div class="row" style="gap:6px"><span style="width:26px;height:6px;border-radius:3px;background:#fff"></span><span style="width:26px;height:6px;border-radius:3px;background:#fff"></span><span style="width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.45)"></span></div>
      <span style="color:#fff;font-size:14px;font-weight:700">Skip</span>
    </div>
  </div>
  <div style="padding:0 28px;margin-top:-34px;position:relative">
    <div class="meta">Step 2 of 3</div>
    <div class="h1" style="margin-top:6px;font-size:30px">Your daily goal</div>
    <div class="card" style="margin-top:18px;padding:22px;text-align:center">
      <div class="num" style="font-size:56px;font-weight:900;letter-spacing:-2.5px;line-height:1;color:var(--acc)">2.0<span style="font-size:24px;letter-spacing:0;color:var(--faint);font-weight:800"> L</span></div>
      <div style="font-size:13px;color:var(--mut);font-weight:600;margin-top:8px">about 8 cups · change it anytime</div>
      <div style="margin-top:18px;position:relative;height:30px">
        <div class="bar" style="position:absolute;top:11px;left:0;right:0"><span style="width:50%"></span></div>
        <div style="position:absolute;left:50%;top:1px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 4px 10px rgba(22,119,217,.3)"></div>
      </div>
      <div class="between" style="font-size:11px;font-weight:700;color:var(--faint)"><span>1.0 L</span><span>3.0 L</span></div>
    </div>
    <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      <div class="gtile" style="background:linear-gradient(135deg,#3BC4F2,#1677D9)"><i class="fas fa-cake-candles"></i><b>Age 15</b><small>set</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#FFB547,#FF7A6B)"><i class="fas fa-futbol"></i><b>Soccer</b><small>+0.5 L on game days</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#9D90F5,#6B5BE0)"><i class="fas fa-school"></i><b>School</b><small>7:50 – 3:10</small></div>
    </div>
    <div class="btn pri" style="margin-top:22px">Looks good <i class="fas fa-arrow-right"></i></div>
  </div>


</div>
</body>
</html>
