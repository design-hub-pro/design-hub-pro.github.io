<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFuel - AI Fitness Training & Nutrition App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #ffffff; }
        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #111;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #fff;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 460px);
            gap: 40px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Hero -->
    <div class="text-center pt-16 pb-12 px-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-3xl flex items-center justify-center shadow-lg shadow-emerald-200">
                <i class="fas fa-bolt text-white text-2xl"></i>
            </div>
            <h1 class="text-5xl font-bold text-gray-900">FitFuel</h1>
        </div>
        <p class="text-lg text-gray-500 max-w-xl mx-auto">AI-powered fitness training & nutrition app with smart photo diet logging</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-full font-medium">Training Plans</span>
            <span class="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full font-medium">Nutrition Tracking</span>
            <span class="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full font-medium">Photo Diet Log</span>
            <span class="text-xs bg-purple-50 text-purple-600 px-3 py-1.5 rounded-full font-medium">AI Detection</span>
        </div>
    </div>

    <!-- Screens -->
    <div class="pb-20 px-8 overflow-x-auto">
        <!-- Row 1 -->
        <div class="screens-grid mb-10">
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Onboarding</p>
            </div>
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Home Dashboard</p>
            </div>
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="training.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Training Plan</p>
            </div>
        </div>

        <!-- Row 2 -->
        <div class="screens-grid">
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="workout.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Active Workout</p>
            </div>
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="nutrition.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Nutrition Plan</p>
            </div>
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="dietlog.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Photo Diet Log</p>
            </div>
        </div>

        <!-- Row 3 -->
        <div class="screens-grid mt-10 justify-center">
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-4 font-medium">Profile & Progress</p>
            </div>
        </div>
    </div>
</body>
</html>
