<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFuel - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #000; }
    </style>
</head>
<body>
    <!-- Full screen hero -->
    <div class="relative w-full h-screen">
        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=600&h=1200&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>

        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 px-7 pt-3 pb-1 flex justify-between items-center" style="height:59px;">
            <span class="text-sm font-semibold text-white">9:41</span>
            <div class="w-[126px] h-[37px] bg-black rounded-full mx-auto"></div>
            <div class="flex items-center gap-1.5 text-white">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="absolute bottom-0 left-0 right-0 px-7 pb-10">
            <!-- Logo -->
            <div class="flex items-center gap-2 mb-4">
                <div class="w-11 h-11 bg-emerald-500 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-bolt text-white text-lg"></i>
                </div>
                <span class="text-2xl font-bold text-white">FitFuel</span>
            </div>

            <h1 class="text-3xl font-bold text-white leading-tight">Train Smarter.<br>Eat Better.</h1>
            <p class="text-sm text-white/60 mt-2 leading-relaxed">Your AI-powered fitness companion. Personalized training plans, smart nutrition tracking, and effortless photo diet logging.</p>

            <!-- Feature Pills -->
            <div class="flex flex-wrap gap-2 mt-5">
                <div class="bg-white/10 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-1.5">
                    <i class="fas fa-dumbbell text-emerald-400 text-xs"></i>
                    <span class="text-xs text-white font-medium">Smart Training</span>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-1.5">
                    <i class="fas fa-utensils text-emerald-400 text-xs"></i>
                    <span class="text-xs text-white font-medium">Meal Plans</span>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-1.5">
                    <i class="fas fa-camera text-emerald-400 text-xs"></i>
                    <span class="text-xs text-white font-medium">Photo Logging</span>
                </div>
            </div>

            <!-- CTA -->
            <button class="w-full bg-emerald-500 text-white font-bold py-4 rounded-2xl text-base mt-6 shadow-lg shadow-emerald-500/30">
                Get Started
            </button>
            <p class="text-center text-xs text-white/40 mt-3">Already have an account? <span class="text-emerald-400 font-medium">Sign In</span></p>
        </div>
    </div>
</body>
</html>
