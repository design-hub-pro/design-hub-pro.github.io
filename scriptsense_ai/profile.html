<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScriptSense - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { width: 430px; height: 932px; overflow-x: hidden; background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pb-6">
        <!-- Profile Header -->
        <div class="py-6 text-center">
            <div class="relative inline-block mb-4">
                <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-amber-400 mx-auto">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-amber-500 rounded-full flex items-center justify-center border-2 border-white">
                    <i class="fas fa-star text-white text-xs"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Alex Chen</h1>
            <p class="text-base text-gray-500">Data Science Researcher</p>
            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="text-sm bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Pro Analyst</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-amber-600">47</p>
                <p class="text-sm text-gray-500">Projects</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-blue-600">2.8K</p>
                <p class="text-sm text-gray-500">Analyzed</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-emerald-600">156</p>
                <p class="text-sm text-gray-500">Insights</p>
            </div>
        </div>

        <!-- Achievements -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">Achievements</h2>
            <div class="flex gap-3 overflow-x-auto pb-2">
                <div class="flex-shrink-0 w-20 text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-trophy text-white text-xl"></i>
                    </div>
                    <p class="text-xs text-gray-600">First Analysis</p>
                </div>
                <div class="flex-shrink-0 w-20 text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-pink-500 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-fire text-white text-xl"></i>
                    </div>
                    <p class="text-xs text-gray-600">100 Scripts</p>
                </div>
                <div class="flex-shrink-0 w-20 text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <p class="text-xs text-gray-600">NLP Master</p>
                </div>
                <div class="flex-shrink-0 w-20 text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-chart-line text-white text-xl"></i>
                    </div>
                    <p class="text-xs text-gray-600">Trend Finder</p>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-cog text-gray-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Settings</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-download text-blue-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Export Data</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-share-nodes text-purple-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Share Research</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sign-out-alt text-red-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Log Out</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-pie text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Analytics</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-flask text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Research</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-database text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Dataset</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-amber-600 text-2xl"></i>
                <span class="text-sm text-amber-600 font-medium mt-1">Profile</span>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-24"></div>
</body>
</html>
