<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Compare</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pane{height:340px;border-radius:24px;background:#0B1020}
.pane .lab{position:absolute;left:10px;top:10px;z-index:5}
.pane .sc{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;border-radius:14px;padding:8px 10px;background:rgba(11,16,32,.7);backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px}
.seg div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:8px 0;border-radius:11px;color:var(--muted)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(11,16,32,.08)}
.d{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.d:last-child{border-bottom:0}
.gauge{flex:1;height:8px;border-radius:4px;background:#E6EAF2;position:relative}
.gauge .t{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--ink)}
.gauge .y{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div><div class="meta">Forehand · Contact frame</div><div class="h1 mt-1.5">Compare</div></div>
      <div class="iconbtn"><i class="fa-solid fa-sliders"></i></div>
    </div>
    <div class="seg mt-4"><div class="on">Side by side</div><div>Overlay</div><div>Ghost</div></div>

    <div class="split">
      <div class="pane pose">
        <img src="img/side.jpg">
        <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
          <line class="bone" x1="640" y1="305" x2="567" y2="495" stroke="#B8F335"/>
          <polyline class="bone" points="675,350 710,420 755,415" stroke="#00C2FF"/>
          <polyline class="bone" points="565,345 630,445 690,462" stroke="#00C2FF"/>
          <polyline class="bone" points="525,500 500,650 395,760" stroke="#FF5D5D"/>
          <polyline class="bone" points="610,500 640,660 660,790" stroke="#FF5D5D"/>
          <g fill="#0B1020" class="joint"><circle cx="652" cy="258" r="11" fill="#B8F335"/><circle cx="710" cy="420" r="9"/><circle cx="755" cy="415" r="9"/><circle cx="500" cy="650" r="9"/><circle cx="640" cy="660" r="9"/></g>
        </svg>
        <span class="lab pill dark"><img src="img/avatar.jpg" class="w-5 h-5 rounded-full object-cover">You</span>
        <div class="sc"><span class="text-[11px] font-semibold opacity-70">Swing 17</span><span class="text-[17px] font-extrabold num" style="color:var(--amber)">74</span></div>
      </div>
      <div class="pane pose">
        <img src="img/coach.jpg">
        <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
          <line class="bone" x1="560" y1="398" x2="520" y2="585" stroke="#B8F335"/>
          <polyline class="bone" points="480,410 420,455 375,478" stroke="#00C2FF"/>
          <polyline class="bone" points="630,420 665,520 700,550" stroke="#00C2FF"/>
          <polyline class="bone" points="450,585 420,690 345,815" stroke="#B8F335"/>
          <polyline class="bone" points="590,585 605,690 625,815" stroke="#B8F335"/>
          <g fill="#0B1020" class="joint"><circle cx="580" cy="345" r="11" fill="#B8F335"/><circle cx="420" cy="455" r="9"/><circle cx="375" cy="478" r="9"/><circle cx="420" cy="690" r="9"/><circle cx="605" cy="690" r="9"/></g>
        </svg>
        <span class="lab pill dark"><i class="fa-solid fa-user-tie" style="color:var(--lime)"></i>Coach</span>
        <div class="sc"><span class="text-[11px] font-semibold opacity-70">Labeled</span><span class="text-[11px] font-bold flex items-center gap-1" style="color:var(--lime)"><i class="fa-solid fa-circle-check"></i>Ideal</span></div>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-4">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-white flex-none" style="background:var(--ink)"><i class="fa-solid fa-play text-[13px] pl-0.5"></i></div>
      <div class="flex-1 relative h-9 flex items-center">
        <div class="absolute inset-x-0 h-1.5 rounded-full" style="background:#E6EAF2"></div>
        <div class="absolute h-1.5 rounded-full" style="left:0;width:58%;background:var(--grad)"></div>
        <span class="absolute w-2 h-2 rounded-full" style="left:20%;background:var(--ink)"></span><span class="absolute w-2 h-2 rounded-full" style="left:40%;background:var(--ink)"></span><span class="absolute w-2.5 h-2.5 rounded-full" style="left:57%;background:var(--lime);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--ink)"></span><span class="absolute w-2 h-2 rounded-full" style="left:80%;background:var(--faint)"></span>
      </div>
      <span class="chip" style="padding:7px 11px;font-size:12px"><i class="fa-solid fa-link text-[11px]"></i>Synced</span>
    </div>

    <div class="sec" style="margin-top:20px"><div class="h2">Gap to coach</div><span class="flex items-center gap-3 text-[11.5px] font-semibold text-[color:var(--muted)]"><span class="flex items-center gap-1"><i class="inline-block w-[3px] h-3 rounded bg-[color:var(--ink)]"></i>Coach</span><span class="flex items-center gap-1"><span class="dot" style="background:var(--blue)"></span>You</span></span></div>
    <div class="card px-4 py-1">
      <div class="d"><span class="w-[92px] text-[13.5px] font-semibold">Knee bend</span><div class="gauge"><span class="t" style="left:62%"></span><span class="y" style="left:30%;background:var(--coral)"></span></div><span class="w-12 text-right text-[13px] font-extrabold num" style="color:var(--coral)">-24°</span></div>
      <div class="d"><span class="w-[92px] text-[13.5px] font-semibold">Hip turn</span><div class="gauge"><span class="t" style="left:55%"></span><span class="y" style="left:46%;background:var(--amber)"></span></div><span class="w-12 text-right text-[13px] font-extrabold num" style="color:#D98A00">-9°</span></div>
      <div class="d"><span class="w-[92px] text-[13.5px] font-semibold">Elbow at hit</span><div class="gauge"><span class="t" style="left:70%"></span><span class="y" style="left:68%;background:var(--green)"></span></div><span class="w-12 text-right text-[13px] font-extrabold num" style="color:#0E9F63">-2°</span></div>
      <div class="d"><span class="w-[92px] text-[13.5px] font-semibold">Contact</span><div class="gauge"><span class="t" style="left:50%"></span><span class="y" style="left:38%;background:var(--amber)"></span></div><span class="w-12 text-right text-[13px] font-extrabold num" style="color:#D98A00">40ms</span></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-table-cells-large"></i>Drills</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-video"></i></div></div>
  <div class="tab on"><i class="fa-solid fa-clone"></i>Compare</div>
  <div class="tab"><i class="fa-solid fa-chart-simple"></i>Progress</div>
</div>
<div class="homebar"></div>
</div></body></html>
