<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Camera setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.view{height:372px;border-radius:30px;margin-top:18px}
.corner{position:absolute;width:30px;height:30px;border-color:var(--lime);border-style:solid;z-index:4}
.chk{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:0}
.ok{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="text-[16px] font-bold">Camera setup</div>
      <div class="iconbtn"><i class="fa-solid fa-circle-question"></i></div>
    </div>

    <div class="view pose">
      <img src="img/side.jpg" style="object-position:center 45%">
      <div class="corner" style="top:22px;left:22px;border-width:4px 0 0 4px;border-radius:10px 0 0 0"></div>
      <div class="corner" style="top:22px;right:22px;border-width:4px 4px 0 0;border-radius:0 10px 0 0"></div>
      <div class="corner" style="bottom:22px;left:22px;border-width:0 0 4px 4px;border-radius:0 0 0 10px"></div>
      <div class="corner" style="bottom:22px;right:22px;border-width:0 4px 4px 0;border-radius:0 0 10px 0"></div>
      <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice" style="z-index:3">
        <rect x="300" y="190" width="520" height="640" rx="40" fill="none" stroke="#B8F335" stroke-width="5" stroke-dasharray="18 14"/>
        <line x1="0" y1="668" x2="1100" y2="668" stroke="#00C2FF" stroke-width="4" stroke-dasharray="10 10"/>
      </svg>
      <div class="absolute left-0 right-0 flex justify-center" style="top:24px;z-index:5"><span class="pill dark"><span class="dot" style="background:var(--lime)"></span>Full body in frame</span></div>
      <div class="absolute left-4 right-4 bottom-4 flex justify-between" style="z-index:5">
        <span class="pill dark"><i class="fa-solid fa-ruler-horizontal" style="color:var(--cyan)"></i><span class="num">3.2 m</span></span>
        <span class="pill dark"><i class="fa-solid fa-film" style="color:var(--lime)"></i><span class="num">60 fps</span></span>
        <span class="pill dark"><i class="fa-solid fa-sun" style="color:var(--amber)"></i>Good light</span>
      </div>
    </div>

    <div class="flex items-center justify-between mt-6">
      <div><div class="meta">Ready check</div><div class="text-[22px] font-extrabold tracking-tight mt-1">4 of 4 locked in</div></div>
      <div class="ring" style="width:62px;height:62px"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" stroke="#EEF1F7" stroke-width="7" fill="none"/><circle cx="31" cy="31" r="26" stroke="#8EDB1F" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="164" stroke-dashoffset="0"/></svg><i class="fa-solid fa-check text-[20px]" style="color:#6CB812"></i></div>
    </div>

    <div class="card px-4 py-1 mt-4">
      <div class="chk"><div class="gicon g-blue" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-camera-rotate"></i></div><div class="flex-1 font-semibold text-[14.5px]">Side-on, waist height</div><div class="ok" style="background:var(--green)"><i class="fa-solid fa-check"></i></div></div>
      <div class="chk"><div class="gicon g-lime" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-person"></i></div><div class="flex-1 font-semibold text-[14.5px]">Head to shoes visible</div><div class="ok" style="background:var(--green)"><i class="fa-solid fa-check"></i></div></div>
      <div class="chk"><div class="gicon g-hot" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-hand-back-fist"></i></div><div class="flex-1 font-semibold text-[14.5px]">Right-handed · forehand</div><div class="ok" style="background:var(--green)"><i class="fa-solid fa-check"></i></div></div>
      <div class="chk"><div class="gicon g-violet" style="width:40px;height:40px;border-radius:13px;font-size:15px"><i class="fa-solid fa-lock"></i></div><div class="flex-1 font-semibold text-[14.5px]">Processed on phone</div><div class="ok" style="background:var(--green)"><i class="fa-solid fa-check"></i></div></div>
    </div>

    <div class="btn lime mt-6"><i class="fa-solid fa-circle text-[12px]" style="color:var(--coral)"></i>Start in 5 s</div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
