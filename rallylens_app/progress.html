<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.stat{flex:1;border-radius:22px;padding:14px;color:#fff}
.clip{width:120px;flex:none}
.clip .ph{height:156px;border-radius:18px}
.badge2{width:64px;flex:none;text-align:center}
.badge2 .b{width:58px;height:58px;border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-start justify-between mt-3">
      <div><div class="meta">Since Sept 8</div><div class="h1 mt-1.5">Progress</div></div>
      <img src="img/avatar.jpg" class="w-11 h-11 rounded-[15px] object-cover">
    </div>

    <div class="flex gap-2.5 mt-5">
      <div class="stat" style="background:var(--ink)"><div class="text-[11px] font-bold tracking-[1.4px] opacity-60">AVG SCORE</div><div class="text-[32px] font-black tracking-tight num mt-1">58<i class="fa-solid fa-arrow-right text-[14px] mx-1.5 opacity-50"></i><span style="color:var(--lime)">82</span></div></div>
      <div class="stat" style="background:var(--gradHot)"><i class="fa-solid fa-fire text-[18px]"></i><div class="text-[32px] font-black tracking-tight num mt-0.5">9<span class="text-[14px] font-bold opacity-80"> days</span></div></div>
    </div>

    <div class="card p-4 mt-3">
      <div class="flex items-center justify-between">
        <div class="font-bold text-[15px]">Technique score</div>
        <div class="flex gap-1.5"><span class="chip on" style="padding:5px 10px;font-size:11.5px">8 wk</span><span class="chip" style="padding:5px 10px;font-size:11.5px">All</span></div>
      </div>
      <svg viewBox="0 0 360 150" class="w-full mt-3" style="height:150px">
        <g stroke="#EEF1F7" stroke-width="1"><line x1="0" y1="20" x2="360" y2="20"/><line x1="0" y1="65" x2="360" y2="65"/><line x1="0" y1="110" x2="360" y2="110"/></g>
        <g font-size="9" fill="#A6AEC0" font-family="Inter" font-weight="600"><text x="0" y="16">100</text><text x="0" y="61">75</text><text x="0" y="106">50</text></g>
        <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8F335" stop-opacity=".45"/><stop offset="1" stop-color="#B8F335" stop-opacity="0"/></linearGradient></defs>
        <path d="M24 108 L72 101 L120 92 L168 86 L216 72 L264 64 L312 50 L352 52 L352 140 L24 140Z" fill="url(#fl)"/>
        <polyline points="24,108 72,101 120,92 168,86 216,72 264,64 312,50 352,52" fill="none" stroke="#8EDB1F" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <polyline points="24,124 72,122 120,118 168,112 216,110 264,98 312,92 352,86" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
        <circle cx="352" cy="52" r="6" fill="#0B1020" stroke="#B8F335" stroke-width="3"/>
        <g font-size="9" fill="#A6AEC0" font-family="Inter" font-weight="600"><text x="18" y="148">W1</text><text x="162" y="148">W4</text><text x="340" y="148">W8</text></g>
      </svg>
      <div class="flex gap-4 mt-2 text-[12px] font-semibold text-[color:var(--muted)]"><span class="flex items-center gap-1.5"><span class="dot" style="background:#8EDB1F"></span>Overall</span><span class="flex items-center gap-1.5"><span class="dot" style="background:#8B5CF6"></span>Recovery</span></div>
    </div>

    <div class="sec"><div class="h2">Clip vault</div><span class="act">38 clips</span></div>
    <div class="hscroll">
      <div class="clip"><div class="ph img shade" style="background-image:url(img/side.jpg);background-position:center 40%"><span class="pill dark absolute" style="top:8px;left:8px;z-index:3;padding:3px 8px;font-size:11px">W8</span><span class="dur num">92</span></div></div>
      <div class="clip"><div class="ph img shade" style="background-image:url(img/wall.jpg)"><span class="pill dark absolute" style="top:8px;left:8px;z-index:3;padding:3px 8px;font-size:11px">W5</span><span class="dur num">74</span></div></div>
      <div class="clip"><div class="ph img shade" style="background-image:url(img/hero.jpg)"><span class="pill dark absolute" style="top:8px;left:8px;z-index:3;padding:3px 8px;font-size:11px">W1</span><span class="dur num">51</span></div></div>
    </div>

    <div class="sec"><div class="h2">Badges</div><span class="act">7 / 20</span></div>
    <div class="flex justify-between">
      <div class="badge2"><div class="b g-lime"><i class="fa-solid fa-crosshairs"></i></div><div class="text-[11px] font-semibold mt-1.5">Sniper</div></div>
      <div class="badge2"><div class="b g-hot"><i class="fa-solid fa-fire"></i></div><div class="text-[11px] font-semibold mt-1.5">7-day</div></div>
      <div class="badge2"><div class="b g-blue"><i class="fa-solid fa-bezier-curve"></i></div><div class="text-[11px] font-semibold mt-1.5">Clean arc</div></div>
      <div class="badge2"><div class="b g-gray"><i class="fa-solid fa-shoe-prints"></i></div><div class="text-[11px] font-semibold mt-1.5 text-[color:var(--faint)]">Fast feet</div></div>
      <div class="badge2"><div class="b g-gray"><i class="fa-solid fa-medal"></i></div><div class="text-[11px] font-semibold mt-1.5 text-[color:var(--faint)]">Level 5</div></div>
    </div>
  </div>
</div>
<div class="tabbar">
  <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
  <div class="tab"><i class="fa-solid fa-table-cells-large"></i>Drills</div>
  <div class="tab mid"><div class="fab"><i class="fa-solid fa-video"></i></div></div>
  <div class="tab"><i class="fa-solid fa-clone"></i>Compare</div>
  <div class="tab on"><i class="fa-solid fa-chart-simple"></i>Progress</div>
</div>
<div class="homebar"></div>
</div></body></html>
