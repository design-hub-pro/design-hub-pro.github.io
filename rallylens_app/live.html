<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Live scoring</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.full{position:absolute;inset:0}
.full:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.6) 0%,rgba(5,7,13,0) 22%,rgba(5,7,13,0) 55%,rgba(5,7,13,.92) 82%)}
.hud{position:absolute;left:0;right:0;z-index:10}
.met{flex:1;border-radius:18px;padding:11px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.met .v{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1}
.met .l{font-size:11px;font-weight:600;color:rgba(255,255,255,.62);margin-top:5px}
.met .b{height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.met .b i{display:block;height:100%;border-radius:2px}
.pop{animation:pop 1.8s ease-in-out infinite}
@keyframes pop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.04)}}
.reps{display:flex;gap:5px}
.reps span{flex:1;height:6px;border-radius:3px}
</style></head>
<body><div class="screen dark">
<div class="full pose">
  <img src="img/side.jpg" style="object-position:center">
  <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
    <!-- swing path trail -->
    <path d="M520 250 Q600 170 700 290 T820 470" stroke="#00C2FF" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="3 14" opacity=".95"/>
    <circle cx="790" cy="415" r="16" fill="#B8F335" opacity=".35"/>
    <circle cx="790" cy="415" r="8" fill="#B8F335"/>
    <!-- skeleton -->
    <line class="bone" x1="640" y1="305" x2="567" y2="495" stroke="#B8F335"/>
    <line class="bone" x1="565" y1="345" x2="675" y2="350" stroke="#B8F335"/>
    <line class="bone" x1="525" y1="500" x2="610" y2="500" stroke="#B8F335"/>
    <polyline class="bone" points="675,350 710,420 755,415" stroke="#00C2FF"/>
    <polyline class="bone" points="565,345 630,445 690,462" stroke="#00C2FF"/>
    <polyline class="bone" points="525,500 500,650 395,760" stroke="#C084FC"/>
    <polyline class="bone" points="610,500 640,660 660,790" stroke="#C084FC"/>
    <g fill="#0B1020" class="joint">
      <circle cx="652" cy="258" r="11" fill="#B8F335"/>
      <circle cx="565" cy="345" r="9"/><circle cx="675" cy="350" r="9"/>
      <circle cx="710" cy="420" r="9"/><circle cx="755" cy="415" r="9"/>
      <circle cx="630" cy="445" r="9"/><circle cx="690" cy="462" r="9"/>
      <circle cx="525" cy="500" r="9"/><circle cx="610" cy="500" r="9"/>
      <circle cx="500" cy="650" r="9"/><circle cx="640" cy="660" r="9"/>
      <circle cx="395" cy="760" r="9"/><circle cx="660" cy="790" r="9"/>
    </g>
    <!-- knee angle -->
    <path d="M613 625 A38 38 0 0 1 668 640" stroke="#fff" stroke-width="4" fill="none"/>
  </svg>
</div>

<div class="hud" style="top:0">
  <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad flex items-center justify-between mt-3">
    <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
    <span class="pill dark" style="padding:8px 13px"><span class="rec"></span><span class="num">02:47</span><span class="opacity-60">· Wall rally L4</span></span>
    <div class="iconbtn glass"><i class="fa-solid fa-volume-high"></i></div>
  </div>
</div>

<div class="hud" style="top:150px">
  <div class="pad flex justify-between items-start">
    <div class="pop rounded-[20px] px-4 py-3" style="background:var(--lime);color:var(--ink)">
      <div class="text-[11px] font-extrabold tracking-[1.5px]">SWING #19</div>
      <div class="text-[36px] font-black tracking-[-1.5px] leading-none num mt-1">+94</div>
      <div class="text-[12px] font-bold mt-1"><i class="fa-solid fa-star text-[10px]"></i> Clean contact</div>
    </div>
    <div class="text-right">
      <div class="flex items-center justify-end gap-1.5"><i class="fa-solid fa-fire text-[22px]" style="color:var(--amber)"></i><span class="text-[34px] font-black tracking-tight num">x7</span></div>
      <div class="text-[12px] font-semibold text-white/65">streak · best 11</div>
    </div>
  </div>
</div>
<div class="hud" style="top:548px;left:236px;right:auto"><span class="pill dark" style="font-size:11px"><i class="fa-solid fa-angle-right" style="color:#C084FC"></i>Knee bend <span class="num">142°</span></span></div>

<div class="hud" style="bottom:0">
  <div class="pad pb-10">
    <div class="flex items-end justify-between">
      <div><div class="text-[11px] font-bold tracking-[1.6px] text-white/60">SESSION SCORE</div><div class="text-[48px] font-black tracking-[-2px] leading-none num mt-1">1,486</div></div>
      <div class="text-right"><div class="text-[11px] font-bold tracking-[1.6px] text-white/60">AVG</div><div class="text-[28px] font-extrabold tracking-tight num" style="color:var(--lime)">81</div></div>
    </div>
    <div class="reps mt-4">
      <span style="background:var(--lime)"></span><span style="background:var(--lime)"></span><span style="background:var(--amber)"></span><span style="background:var(--lime)"></span><span style="background:var(--lime)"></span><span style="background:var(--coral)"></span><span style="background:var(--lime)"></span><span style="background:var(--lime)"></span><span style="background:var(--lime)"></span><span style="background:var(--lime)"></span><span style="background:rgba(255,255,255,.18)"></span><span style="background:rgba(255,255,255,.18)"></span>
    </div>
    <div class="flex gap-2 mt-4">
      <div class="met"><div class="v num">92</div><div class="l">Stance</div><div class="b"><i style="width:92%;background:var(--lime)"></i></div></div>
      <div class="met"><div class="v num">88</div><div class="l">Swing</div><div class="b"><i style="width:88%;background:var(--cyan)"></i></div></div>
      <div class="met"><div class="v num">-40<span class="text-[12px]">ms</span></div><div class="l">Contact</div><div class="b"><i style="width:70%;background:var(--amber)"></i></div></div>
      <div class="met"><div class="v num">1.4<span class="text-[12px]">s</span></div><div class="l">Recover</div><div class="b"><i style="width:56%;background:#C084FC"></i></div></div>
    </div>
    <div class="flex items-center justify-center gap-10 mt-6">
      <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.12)"><i class="fa-solid fa-rotate-left"></i></div>
      <div class="w-[74px] h-[74px] rounded-full flex items-center justify-center" style="border:4px solid #fff"><div class="w-8 h-8 rounded-[9px]" style="background:var(--coral)"></div></div>
      <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.12)"><i class="fa-solid fa-person-rays"></i></div>
    </div>
  </div>
</div>
<div class="homebar light"></div>
</div></body></html>
