<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · One fix</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.view{height:392px;border-radius:30px;margin-top:18px;background:#0B1020}
.phase{display:flex;gap:6px;margin-top:16px}
.phase div{flex:1;text-align:center}
.phase .s{height:6px;border-radius:3px;background:#E6EAF2}
.phase .n{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:7px}
.step{display:flex;align-items:center;gap:14px}
.step .k{width:34px;height:34px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="sb"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
  <div class="pad">
    <div class="flex items-center justify-between mt-3">
      <div class="iconbtn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="text-[16px] font-bold">Your one fix</div>
      <div class="iconbtn"><i class="fa-solid fa-bookmark"></i></div>
    </div>

    <div class="view pose">
      <img src="img/side.jpg" style="object-position:center 60%;opacity:.92">
      <svg viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid slice">
        <!-- where feet should go (ghost) -->
        <ellipse cx="560" cy="800" rx="120" ry="26" fill="rgba(184,243,53,.25)" stroke="#B8F335" stroke-width="4" stroke-dasharray="12 9"/>
        <path d="M660 790 C 640 860, 590 860, 575 805" stroke="#B8F335" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#ah)"/>
        <defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8F335"/></marker></defs>
        <polyline class="bone" points="525,500 500,650 395,760" stroke="#FF5D5D"/>
        <polyline class="bone" points="610,500 640,660 660,790" stroke="#FF5D5D"/>
        <line class="bone" x1="640" y1="305" x2="567" y2="495" stroke="rgba(255,255,255,.7)"/>
        <polyline class="bone" points="675,350 710,420 755,415" stroke="rgba(255,255,255,.7)"/>
        <g fill="#0B1020" class="joint"><circle cx="500" cy="650" r="9"/><circle cx="640" cy="660" r="9"/><circle cx="395" cy="760" r="10" fill="#FF5D5D"/><circle cx="660" cy="790" r="10" fill="#FF5D5D"/></g>
      </svg>
      <div class="absolute top-4 left-4 right-4 flex justify-between" style="z-index:5">
        <span class="pill dark"><span class="dot" style="background:var(--coral)"></span>Swing 17 · 0.6 s after contact</span>
        <span class="pill dark"><i class="fa-solid fa-gauge" style="color:var(--cyan)"></i>0.25x</span>
      </div>
      <div class="absolute bottom-4 left-4 right-4 rounded-[18px] p-3 flex items-center gap-3" style="z-index:5;background:rgba(11,16,32,.72);backdrop-filter:blur(14px);color:#fff">
        <div class="w-9 h-9 rounded-full flex items-center justify-center flex-none" style="background:#fff;color:var(--ink)"><i class="fa-solid fa-pause text-[13px]"></i></div>
        <div class="flex-1 h-1.5 rounded-full bg-white/20 relative"><i class="absolute left-0 top-0 h-full rounded-full" style="width:68%;background:var(--lime)"></i><i class="absolute w-3.5 h-3.5 rounded-full bg-white" style="left:66%;top:-4px"></i></div>
        <span class="text-[12px] font-bold num">0:03</span>
      </div>
    </div>

    <div class="phase">
      <div><div class="s" style="background:#8EDB1F"></div><div class="n">Ready</div></div>
      <div><div class="s" style="background:#8EDB1F"></div><div class="n">Backswing</div></div>
      <div><div class="s" style="background:#FFB020"></div><div class="n">Contact</div></div>
      <div><div class="s" style="background:#FF5D5D"></div><div class="n" style="color:var(--coral);font-weight:800">Recovery</div></div>
    </div>

    <div class="text-[25px] font-extrabold tracking-[-.8px] leading-[1.12] mt-6">Two shuffle steps<br>back to center.</div>
    <div class="flex items-center gap-4 mt-4">
      <div><div class="text-[30px] font-black tracking-tight num" style="color:var(--coral)">1.4<span class="text-[16px]">s</span></div><div class="text-[12px] font-semibold text-[color:var(--muted)]">You, avg</div></div>
      <i class="fa-solid fa-arrow-right-long text-[color:var(--faint)] text-[20px]"></i>
      <div><div class="text-[30px] font-black tracking-tight num" style="color:#6CB812">0.9<span class="text-[16px]">s</span></div><div class="text-[12px] font-semibold text-[color:var(--muted)]">Target</div></div>
      <div class="ml-auto flex items-center gap-2 rounded-full px-3 py-2" style="background:var(--surface)"><i class="fa-solid fa-user-tie text-[13px]" style="color:var(--blue)"></i><span class="text-[12px] font-bold">Coach-labeled</span></div>
    </div>

    <div class="btn mt-6"><i class="fa-solid fa-person-running"></i>Practice: Shuffle Back x 20</div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
