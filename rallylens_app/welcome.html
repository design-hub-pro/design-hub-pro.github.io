<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.bgph{position:absolute;inset:0;background:url(img/hero.jpg) center 30%/cover}
.bgph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.25) 0%,rgba(5,7,13,0) 25%,rgba(5,7,13,.55) 52%,#05070D 78%)}
.tag{position:absolute;z-index:5}
</style></head>
<body><div class="screen dark">
<div class="bgph"></div>
<svg class="absolute inset-0 w-full" style="z-index:4;height:56%" viewBox="0 0 436 530" preserveAspectRatio="none">
  <path d="M130 170 Q210 110 300 205" stroke="#B8F335" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
</svg>
<div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

<div class="tag" style="top:150px;left:28px"><span class="pill dark"><span class="dot" style="background:var(--lime)"></span>Stance <span class="num" style="color:var(--lime)">92</span></span></div>
<div class="tag" style="top:250px;right:28px"><span class="pill dark"><span class="dot" style="background:var(--cyan)"></span>Swing path <span class="num" style="color:var(--cyan)">88</span></span></div>
<div class="tag" style="top:370px;left:44px"><span class="pill dark"><i class="fa-solid fa-fire" style="color:var(--amber)"></i><span class="num">x7 streak</span></span></div>

<div class="absolute left-0 right-0 bottom-0 pad pb-12" style="z-index:6">
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-[13px] flex items-center justify-center" style="background:var(--lime);color:var(--ink)"><i class="fa-solid fa-crosshairs text-[18px]"></i></div>
    <span class="text-[19px] font-extrabold tracking-tight">RallyLens</span>
  </div>
  <div class="text-[42px] font-extrabold leading-[1.02] tracking-[-1.6px] mt-6">Your phone is<br>the <span style="color:var(--lime)">coach</span> now.</div>
  <div class="text-[16px] text-white/70 font-medium mt-4 leading-snug">Prop it on a tripod. Hit. Get a score for every swing and one fix at a time.</div>

  <div class="flex gap-2 mt-7">
    <div class="flex-1 rounded-[18px] p-3.5" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><i class="fa-solid fa-person-walking text-[17px]" style="color:var(--lime)"></i><div class="text-[12.5px] font-semibold text-white/80 mt-2">Stance</div></div>
    <div class="flex-1 rounded-[18px] p-3.5" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><i class="fa-solid fa-bezier-curve text-[17px]" style="color:var(--cyan)"></i><div class="text-[12.5px] font-semibold text-white/80 mt-2">Swing</div></div>
    <div class="flex-1 rounded-[18px] p-3.5" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><i class="fa-solid fa-stopwatch text-[17px]" style="color:var(--amber)"></i><div class="text-[12.5px] font-semibold text-white/80 mt-2">Timing</div></div>
    <div class="flex-1 rounded-[18px] p-3.5" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"><i class="fa-solid fa-shoe-prints text-[17px]" style="color:#C084FC"></i><div class="text-[12.5px] font-semibold text-white/80 mt-2">Recovery</div></div>
  </div>

  <div class="btn lime mt-7">Set up my first drill <i class="fa-solid fa-arrow-right"></i></div>
  <div class="text-center text-[14px] text-white/60 font-semibold mt-4">I have an account · <span class="text-white">Sign in</span></div>
</div>
<div class="homebar light"></div>
</div></body></html>
