<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyLens · Session result</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.top{background:#0B1020;color:#fff;border-radius:0 0 36px 36px;padding-bottom:26px;position:relative;overflow:hidden}
.top:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(184,243,53,.28),rgba(184,243,53,0) 65%);top:-60px;left:8px}
.top > *{position:relative}
.row{display:flex;align-items:center;gap:12px;padding:12px 0}
.row .bar{flex:1}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px}
.spark i{flex:1;border-radius:3px 3px 0 0;display:block}
</style></head>
<body><div class="screen">
<div class="scroll">
  <div class="top">
    <div class="sb light"><span class="t num">9:41</span><div class="island"></div><div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>
    <div class="pad">
      <div class="flex items-center justify-between mt-3">
        <div class="iconbtn glass"><i class="fa-solid fa-xmark"></i></div>
        <span class="pill glass"><i class="fa-solid fa-arrow-trend-up" style="color:var(--lime)"></i>Personal best</span>
        <div class="iconbtn glass"><i class="fa-solid fa-share-nodes"></i></div>
      </div>
      <div class="flex items-center gap-5 mt-6">
        <div class="ring" style="width:128px;height:128px"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="56" stroke="rgba(255,255,255,.1)" stroke-width="11" fill="none"/><circle cx="64" cy="64" r="56" stroke="#B8F335" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="63"/></svg><div class="text-center"><div class="text-[40px] font-black tracking-[-2px] leading-none num">82</div><div class="text-[11px] font-bold text-white/55 mt-1">of 100</div></div></div>
        <div>
          <div class="text-[11px] font-bold tracking-[1.6px] text-white/55">WALL RALLY · L4</div>
          <div class="text-[26px] font-extrabold tracking-tight leading-tight mt-1">Sharp session,<br>Lena.</div>
          <div class="flex items-center gap-1.5 mt-2 text-[13px] font-bold" style="color:var(--lime)"><i class="fa-solid fa-caret-up"></i><span class="num">+6 vs last time</span></div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-6">
        <div class="rounded-[18px] p-3" style="background:rgba(255,255,255,.07)"><div class="text-[24px] font-extrabold num">48</div><div class="text-[11.5px] font-semibold text-white/55">Swings</div></div>
        <div class="rounded-[18px] p-3" style="background:rgba(255,255,255,.07)"><div class="text-[24px] font-extrabold num flex items-center gap-1"><i class="fa-solid fa-fire text-[17px]" style="color:var(--amber)"></i>11</div><div class="text-[11.5px] font-semibold text-white/55">Best streak</div></div>
        <div class="rounded-[18px] p-3" style="background:rgba(255,255,255,.07)"><div class="text-[24px] font-extrabold num" style="color:var(--lime)">+240</div><div class="text-[11.5px] font-semibold text-white/55">XP</div></div>
      </div>
    </div>
  </div>

  <div class="pad">
    <div class="sec"><div class="h2">Swing by swing</div><span class="act">Replay</span></div>
    <div class="card p-4">
      <div class="spark">
        <i style="height:55%;background:#FFB020"></i><i style="height:62%;background:#FFB020"></i><i style="height:70%;background:#B8F335"></i><i style="height:40%;background:#FF5D5D"></i><i style="height:74%;background:#B8F335"></i><i style="height:78%;background:#B8F335"></i><i style="height:66%;background:#FFB020"></i><i style="height:82%;background:#B8F335"></i><i style="height:85%;background:#B8F335"></i><i style="height:88%;background:#B8F335"></i><i style="height:91%;background:#B8F335"></i><i style="height:60%;background:#FFB020"></i><i style="height:84%;background:#B8F335"></i><i style="height:90%;background:#B8F335"></i><i style="height:94%;background:#8EDB1F"></i><i style="height:87%;background:#B8F335"></i><i style="height:45%;background:#FF5D5D"></i><i style="height:80%;background:#B8F335"></i><i style="height:92%;background:#B8F335"></i><i style="height:89%;background:#B8F335"></i>
      </div>
      <div class="flex justify-between text-[11px] font-semibold text-[color:var(--faint)] mt-2"><span>Swing 1</span><span>48</span></div>
    </div>

    <div class="card px-4 py-1.5 mt-3">
      <div class="row"><i class="fa-solid fa-person-walking w-5 text-center" style="color:#6CB812"></i><span class="w-[78px] text-[14px] font-semibold">Stance</span><div class="bar"><i style="width:91%;background:var(--gradLime)"></i></div><span class="w-7 text-right font-extrabold num">91</span></div>
      <div class="row"><i class="fa-solid fa-bezier-curve w-5 text-center" style="color:var(--cyan)"></i><span class="w-[78px] text-[14px] font-semibold">Swing</span><div class="bar"><i style="width:86%"></i></div><span class="w-7 text-right font-extrabold num">86</span></div>
      <div class="row"><i class="fa-solid fa-stopwatch w-5 text-center" style="color:var(--amber)"></i><span class="w-[78px] text-[14px] font-semibold">Timing</span><div class="bar"><i style="width:79%;background:var(--gradHot)"></i></div><span class="w-7 text-right font-extrabold num">79</span></div>
      <div class="row"><i class="fa-solid fa-shoe-prints w-5 text-center" style="color:var(--violet)"></i><span class="w-[78px] text-[14px] font-semibold">Recovery</span><div class="bar"><i style="width:64%;background:var(--gradViolet)"></i></div><span class="w-7 text-right font-extrabold num" style="color:var(--coral)">64</span></div>
    </div>

    <div class="rounded-[24px] p-4 mt-3 flex items-center gap-3.5" style="background:#FFF1EC;border:1px solid #FFD9CC">
      <div class="img w-[62px] h-[62px] rounded-[17px] flex-none" style="background-image:url(img/feet.jpg)"></div>
      <div class="flex-1"><div class="meta" style="font-size:10.5px;color:var(--coral)">One fix for next time</div><div class="font-bold text-[15.5px] tracking-tight mt-0.5 leading-snug">Get back to center before the ball hits the wall.</div></div>
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-white flex-none" style="background:var(--coral)"><i class="fa-solid fa-arrow-right text-[14px]"></i></div>
    </div>
  </div>
</div>
<div class="homebar"></div>
</div></body></html>
