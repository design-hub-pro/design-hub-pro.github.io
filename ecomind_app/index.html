<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMind - Nature & Teen Wellness Research App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }

        body { background: #ffffff; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.25), 0 30px 60px -30px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #f0f7f0;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 48px;
            max-width: 1560px;
            margin: 0 auto;
            justify-items: center;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="text-center pt-20 pb-16 px-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200">
                <i class="fas fa-leaf text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-800 text-gray-900 mb-4">EcoMind</h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto">How Nature Spaces Affect Teen Stress, Focus, and Emotional Well-Being</p>
    </div>

    <!-- App Screenshots -->
    <div class="px-8 pb-20">
        <div class="screens-grid">

            <!-- Home -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Home Dashboard</p>
            </div>

            <!-- Explore -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="explore.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Explore Spaces</p>
            </div>

            <!-- Log -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="log.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Log Entry</p>
            </div>

            <!-- Insights -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="insights.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Data Insights</p>
            </div>

            <!-- Assessment -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="assessment.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Assessments</p>
            </div>

            <!-- Profile -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Profile</p>
            </div>

            <!-- Community -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="community.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-500 mt-4">Community</p>
            </div>

        </div>
    </div>

</body>
</html>
