<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCoach | System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-rose-500 to-red-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-heart-pulse text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">PulseCoach</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A CPR practice wristband that buzzes to correct depth, tempo, and release as students press.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">Wearable</span>
            <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">Motion Sensing</span>
            <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">Haptics</span>
            <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">First Aid</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417798323-image-1.png" alt="PulseCoach: "></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417797392-image-1.png" alt="PulseCoach: in use during CPR practice on a manikin"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417797277-image-1.png" alt="PulseCoach: the wristband with a ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417798471-image-1.png" alt="PulseCoach: worn on the wrist during compressions"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417824832-image-1.png" alt="PulseCoach: fastening the band before a session"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417797272-image-1.png" alt="PulseCoach: signal path from motion to buzz to phone"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417797739-image-1.png" alt="PulseCoach: exploded view of the sensor pod"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1795417826910-image-1.png" alt="PulseCoach: bench check against a displacement sensor"></div>
        </div>
    </div>
</body>
</html>
