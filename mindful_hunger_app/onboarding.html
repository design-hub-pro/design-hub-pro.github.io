<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindfulHunger - Welcome</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; scrollbar-width: none; background: #0A0A0A; color: #fff; }

  .status-bar {
    height: 59px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px 28px; background: transparent; position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  }
  .status-bar .time { font-size: 17px; font-weight: 600; color: #fff; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons i { font-size: 14px; color: #fff; }
  .dynamic-island { width: 120px; height: 36px; background: #000; border-radius: 20px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 101; }

  .onboarding {
    width: 100%; height: 100%; position: relative; overflow: hidden;
  }

  .bg-image {
    position: absolute; inset: 0;
  }

  .bg-image img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 40%, rgba(10,10,10,0.95) 75%, #0A0A0A 100%);
  }

  .onboarding-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0 28px 60px 28px;
    text-align: center;
  }

  .app-logo {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, #FF6B6B, #FF3B30);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px auto;
    box-shadow: 0 8px 32px rgba(255,59,48,0.3);
  }

  .app-logo i { font-size: 32px; color: #fff; }

  .app-name {
    font-size: 36px; font-weight: 900; margin-bottom: 8px;
    background: linear-gradient(135deg, #fff, rgba(255,255,255,0.8));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .app-tagline {
    font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 32px;
    line-height: 1.5;
  }

  .features-row {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 32px;
  }

  .feature-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  .feature-dot {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .feature-dot.focus-game {
    background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.2);
  }

  .feature-dot.default {
    background: rgba(255,255,255,0.08);
  }

  .feature-label { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 600; }
  .feature-label.highlight { color: #00E5FF; }

  .page-dots {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 32px;
  }

  .page-dot {
    width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);
  }

  .page-dot.active {
    width: 24px; border-radius: 4px;
    background: linear-gradient(90deg, #FF6B6B, #FF3B30);
  }

  .cta-btn {
    width: 100%; padding: 18px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, #FF6B6B, #FF3B30);
    font-size: 17px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 32px rgba(255,59,48,0.3);
    margin-bottom: 14px;
  }

  .secondary-btn {
    width: 100%; padding: 18px; border-radius: 16px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    font-size: 17px; font-weight: 600; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 24px;
  }

  .login-link {
    font-size: 14px; color: rgba(255,255,255,0.4);
  }

  .login-link a { color: #FF6B6B; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="onboarding">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <div class="bg-image">
      <img src="https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=800&q=80" alt="">
    </div>
    <div class="bg-overlay"></div>

    <div class="onboarding-content">
      <div class="app-logo"><i class="fas fa-brain"></i></div>
      <div class="app-name">MindfulHunger</div>
      <div class="app-tagline">Master your cravings with focus games,<br>AR food scanning & mindfulness.</div>

      <div class="features-row">
        <div class="feature-item">
          <div class="feature-dot focus-game">🎯</div>
          <span class="feature-label highlight">Focus Games</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot focus-game">👓</div>
          <span class="feature-label highlight">AR Glass</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot default">🧠</div>
          <span class="feature-label">Brain Train</span>
        </div>
        <div class="feature-item">
          <div class="feature-dot default">🧘</div>
          <span class="feature-label">Meditate</span>
        </div>
      </div>

      <div class="page-dots">
        <div class="page-dot active"></div>
        <div class="page-dot"></div>
        <div class="page-dot"></div>
      </div>

      <button class="cta-btn">
        <i class="fas fa-arrow-right"></i> Get Started
      </button>
      <button class="secondary-btn">
        <i class="fab fa-apple"></i> Continue with Apple
      </button>
      <div class="login-link">
        Already have an account? <a href="#">Sign In</a>
      </div>
    </div>
  </div>
</body>
</html>
