<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlushCare - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .get-started {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            box-shadow: 0 12px 40px rgba(76, 175, 80, 0.4);
        }
        .feature-icon {
            background: rgba(255,255,255,0.9);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .float-1 { animation: float1 4s ease-in-out infinite; }
        .float-2 { animation: float2 5s ease-in-out infinite; }
        .float-3 { animation: float3 6s ease-in-out infinite; }
        @keyframes float1 {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
        }
        @keyframes float3 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold text-green-900">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-green-900">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 h-full flex flex-col">
        <!-- Skip Button -->
        <div class="flex justify-end mt-2">
            <button class="text-green-700 text-sm font-medium">Skip</button>
        </div>

        <!-- Illustration Area -->
        <div class="flex-1 relative flex items-center justify-center">
            <!-- Floating Plushies -->
            <div class="absolute top-8 left-4 w-20 h-20 float-1">
                <img src="https://images.unsplash.com/photo-1595433707802-6b2626ef1c91?w=200" class="w-full h-full object-cover rounded-2xl shadow-xl" alt="Plush">
            </div>
            <div class="absolute top-4 right-6 w-16 h-16 float-2">
                <img src="https://images.unsplash.com/photo-1563396983906-b3795482a59a?w=200" class="w-full h-full object-cover rounded-2xl shadow-xl" alt="Plush">
            </div>
            <div class="absolute bottom-32 left-8 w-14 h-14 float-3">
                <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=200" class="w-full h-full object-cover rounded-xl shadow-xl" alt="Plush">
            </div>

            <!-- Center Logo -->
            <div class="text-center">
                <div class="w-32 h-32 rounded-full bg-white shadow-2xl flex items-center justify-center mx-auto mb-6">
                    <div class="text-center">
                        <i class="fas fa-shield-check text-5xl text-green-600"></i>
                    </div>
                </div>
                <h1 class="text-4xl font-bold text-green-900 mb-2">PlushCare</h1>
                <p class="text-green-700 text-lg">Protect Your Plushies</p>
            </div>
        </div>

        <!-- Features -->
        <div class="mb-8">
            <div class="flex items-center gap-4 mb-4">
                <div class="feature-icon w-12 h-12 rounded-xl flex items-center justify-center">
                    <i class="fas fa-camera text-green-600 text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-green-900">Instant Scan</p>
                    <p class="text-sm text-green-700/70">AI-powered label reading</p>
                </div>
            </div>
            <div class="flex items-center gap-4 mb-4">
                <div class="feature-icon w-12 h-12 rounded-xl flex items-center justify-center">
                    <i class="fas fa-check-double text-green-600 text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-green-900">Safety Check</p>
                    <p class="text-sm text-green-700/70">Know what's safe for your toys</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="feature-icon w-12 h-12 rounded-xl flex items-center justify-center">
                    <i class="fas fa-box text-green-600 text-lg"></i>
                </div>
                <div>
                    <p class="font-semibold text-green-900">Toy Library</p>
                    <p class="text-sm text-green-700/70">Manage your plush collection</p>
                </div>
            </div>
        </div>

        <!-- Page Indicator -->
        <div class="flex justify-center gap-2 mb-6">
            <div class="w-8 h-2 rounded-full bg-green-600"></div>
            <div class="w-2 h-2 rounded-full bg-green-300"></div>
            <div class="w-2 h-2 rounded-full bg-green-300"></div>
        </div>

        <!-- Get Started Button -->
        <div class="pb-12">
            <button class="get-started w-full py-5 rounded-2xl text-white font-bold text-lg">
                Get Started
            </button>
            <p class="text-center text-green-700/60 text-sm mt-4">
                Already have an account? <span class="text-green-700 font-semibold">Sign In</span>
            </p>
        </div>
    </div>
</body>
</html>
