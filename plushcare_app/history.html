<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlushCare - History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F8F9FA;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .history-card {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 bg-white">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-7 pb-4">
        <div class="flex items-center gap-4 mt-2">
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">Scan History</h1>
        </div>

        <!-- Filter Pills -->
        <div class="flex gap-2 mt-4 overflow-x-auto">
            <button class="px-4 py-2 bg-green-600 text-white rounded-full text-sm font-medium flex-shrink-0">All</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>Safe
            </button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span>Caution
            </button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-red-500"></span>Unsafe
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area mt-4">
        <!-- Today Section -->
        <p class="text-sm font-semibold text-gray-400 mb-3">Today</p>
        <div class="space-y-3 mb-6">
            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check-circle text-xl text-green-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Gentle Baby Wash</p>
                    <p class="text-xs text-gray-400">Johnson's • 10:32 AM</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1595433707802-6b2626ef1c91?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                        <img src="https://images.unsplash.com/photo-1563396983906-b3795482a59a?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>

            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-amber-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-exclamation-triangle text-xl text-amber-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Fabric Softener Plus</p>
                    <p class="text-xs text-gray-400">Downy • 9:15 AM</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>

        <!-- Yesterday Section -->
        <p class="text-sm font-semibold text-gray-400 mb-3">Yesterday</p>
        <div class="space-y-3 mb-6">
            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check-circle text-xl text-green-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Mild Hand Soap</p>
                    <p class="text-xs text-gray-400">Dial • 3:45 PM</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                        <img src="https://images.unsplash.com/photo-1535982330050-f1c2fb79ff78?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                        <img src="https://images.unsplash.com/photo-1595433707802-6b2626ef1c91?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>

            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-red-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-times-circle text-xl text-red-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Bleach Cleaner</p>
                    <p class="text-xs text-gray-400">Clorox • 11:20 AM</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <span class="text-xs text-red-600 font-medium bg-red-50 px-2 py-1 rounded-full">Unsafe</span>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>

            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check-circle text-xl text-green-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Baby Detergent</p>
                    <p class="text-xs text-gray-400">Dreft • 9:00 AM</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                        <img src="https://images.unsplash.com/photo-1563396983906-b3795482a59a?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>

        <!-- This Week Section -->
        <p class="text-sm font-semibold text-gray-400 mb-3">This Week</p>
        <div class="space-y-3">
            <div class="history-card rounded-2xl p-4 flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-check-circle text-xl text-green-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 truncate">Woolite Delicates</p>
                    <p class="text-xs text-gray-400">Woolite • Mon</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="flex -space-x-2">
                        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=50" class="w-6 h-6 rounded-full border-2 border-white object-cover" alt="">
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-camera text-xl text-green-600"></i>
            <span class="text-xs mt-1 text-green-600 font-medium">Scan</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-box text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Plushies</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Profile</span>
        </div>
    </div>
</body>
</html>
