<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlushCare - Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .scanner-frame {
            border: 3px solid rgba(76, 175, 80, 0.8);
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.3);
        }
        .corner {
            width: 30px;
            height: 30px;
            border-color: #4CAF50;
            border-width: 4px;
        }
        .scan-line {
            animation: scan 2s ease-in-out infinite;
            background: linear-gradient(180deg, transparent, rgba(76, 175, 80, 0.6), transparent);
        }
        @keyframes scan {
            0%, 100% { top: 0; }
            50% { top: calc(100% - 4px); }
        }
        .pulse-ring {
            animation: pulse 2s ease-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <!-- Camera View Simulation -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1563453392212-326f5e854473?w=800" class="w-full h-full object-cover opacity-90" alt="Camera view">
    </div>

    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 relative z-10">
        <span class="text-sm font-semibold text-white">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Top Controls -->
    <div class="relative z-10 px-7 mt-2 flex items-center justify-between">
        <button class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center">
            <i class="fas fa-times text-white text-lg"></i>
        </button>
        <p class="text-white font-semibold">Scan Product</p>
        <button class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center">
            <i class="fas fa-bolt text-yellow-400 text-lg"></i>
        </button>
    </div>

    <!-- Instructions -->
    <div class="relative z-10 px-7 mt-6 text-center">
        <p class="text-white/80 text-sm">Point camera at the cleaning product label</p>
    </div>

    <!-- Scanner Frame -->
    <div class="relative z-10 mx-7 mt-6">
        <div class="scanner-frame rounded-3xl overflow-hidden relative" style="height: 340px;">
            <!-- Scan Line -->
            <div class="scan-line absolute left-0 right-0 h-1 z-10"></div>

            <!-- Corner Markers -->
            <div class="absolute top-3 left-3 corner border-t border-l rounded-tl-lg"></div>
            <div class="absolute top-3 right-3 corner border-t border-r rounded-tr-lg"></div>
            <div class="absolute bottom-3 left-3 corner border-b border-l rounded-bl-lg"></div>
            <div class="absolute bottom-3 right-3 corner border-b border-r rounded-br-lg"></div>

            <!-- Product Preview -->
            <div class="absolute inset-0 flex items-center justify-center">
                <img src="https://images.unsplash.com/photo-1585751119414-ef2636f8aede?w=400" class="h-64 object-contain opacity-80" alt="Cleaning product">
            </div>
        </div>
    </div>

    <!-- AI Status -->
    <div class="relative z-10 px-7 mt-6">
        <div class="bg-black/60 backdrop-blur-xl rounded-2xl p-4">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center">
                        <i class="fas fa-brain text-green-400 text-xl"></i>
                    </div>
                    <div class="absolute inset-0 rounded-full border-2 border-green-400 pulse-ring"></div>
                </div>
                <div class="flex-1">
                    <p class="text-white font-semibold">AI Analyzing...</p>
                    <p class="text-white/60 text-sm">Reading ingredients & warnings</p>
                </div>
                <div class="text-right">
                    <p class="text-green-400 font-bold text-lg">78%</p>
                    <p class="text-white/40 text-xs">Complete</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-4 h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-green-400 to-green-500 rounded-full" style="width: 78%;"></div>
            </div>
        </div>
    </div>

    <!-- Detected Info -->
    <div class="relative z-10 px-7 mt-4">
        <div class="flex gap-2">
            <span class="bg-green-500/20 text-green-400 text-xs px-3 py-1.5 rounded-full font-medium">
                <i class="fas fa-check mr-1"></i>Label Detected
            </span>
            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1.5 rounded-full font-medium">
                <i class="fas fa-language mr-1"></i>English
            </span>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="absolute bottom-24 left-0 right-0 z-10 px-7">
        <div class="flex items-center justify-center gap-8">
            <button class="w-14 h-14 rounded-full bg-white/10 backdrop-blur flex items-center justify-center">
                <i class="fas fa-images text-white text-xl"></i>
            </button>
            <button class="w-20 h-20 rounded-full bg-white flex items-center justify-center shadow-xl">
                <div class="w-16 h-16 rounded-full border-4 border-green-500"></div>
            </button>
            <button class="w-14 h-14 rounded-full bg-white/10 backdrop-blur flex items-center justify-center">
                <i class="fas fa-sync-alt text-white text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-xl text-gray-500"></i>
            <span class="text-xs mt-1 text-gray-500">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-camera text-xl text-green-500"></i>
            <span class="text-xs mt-1 text-green-500 font-medium">Scan</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-box text-xl text-gray-500"></i>
            <span class="text-xs mt-1 text-gray-500">Plushies</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-500"></i>
            <span class="text-xs mt-1 text-gray-500">Profile</span>
        </div>
    </div>
</body>
</html>
