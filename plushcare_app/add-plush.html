<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlushCare - Add Plush</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #FFFFFF;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .photo-upload {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border: 2px dashed #4CAF50;
        }
        .material-option {
            transition: all 0.2s ease;
        }
        .material-option.selected {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
        }
        .save-button {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center gap-4 mt-2 mb-6">
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fas fa-times text-gray-600"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">Add New Plush</h1>
        </div>

        <!-- Photo Upload -->
        <div class="photo-upload rounded-3xl h-48 flex flex-col items-center justify-center mb-6">
            <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mb-3">
                <i class="fas fa-camera text-2xl text-green-600"></i>
            </div>
            <p class="text-green-700 font-semibold">Take or Upload Photo</p>
            <p class="text-green-600/70 text-sm mt-1">AI will detect material type</p>
        </div>

        <!-- Name Input -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Plush Name</label>
            <input type="text" placeholder="Give your plush a name..." class="w-full px-4 py-4 bg-gray-50 rounded-2xl border-0 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Material Type -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Material Type</label>
            <div class="grid grid-cols-2 gap-3">
                <button class="material-option selected px-4 py-4 rounded-2xl text-center">
                    <i class="fas fa-tshirt text-xl mb-2 block"></i>
                    <span class="font-medium text-sm">Cotton</span>
                </button>
                <button class="material-option bg-gray-50 text-gray-600 px-4 py-4 rounded-2xl text-center">
                    <i class="fas fa-gem text-xl mb-2 block"></i>
                    <span class="font-medium text-sm">Polyester</span>
                </button>
                <button class="material-option bg-gray-50 text-gray-600 px-4 py-4 rounded-2xl text-center">
                    <i class="fas fa-feather text-xl mb-2 block"></i>
                    <span class="font-medium text-sm">Velvet</span>
                </button>
                <button class="material-option bg-gray-50 text-gray-600 px-4 py-4 rounded-2xl text-center">
                    <i class="fas fa-leaf text-xl mb-2 block"></i>
                    <span class="font-medium text-sm">Organic</span>
                </button>
            </div>
        </div>

        <!-- Special Care -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Special Care Notes</label>
            <div class="space-y-3">
                <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-2xl">
                    <div class="w-6 h-6 rounded-md border-2 border-green-500 bg-green-500 flex items-center justify-center">
                        <i class="fas fa-check text-white text-xs"></i>
                    </div>
                    <span class="text-gray-700">Has electronic components</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-2xl">
                    <div class="w-6 h-6 rounded-md border-2 border-gray-300"></div>
                    <span class="text-gray-700">Delicate embroidery</span>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-2xl">
                    <div class="w-6 h-6 rounded-md border-2 border-gray-300"></div>
                    <span class="text-gray-700">Glued parts</span>
                </div>
            </div>
        </div>

        <!-- AI Detection Badge -->
        <div class="bg-blue-50 rounded-2xl p-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-magic text-blue-600"></i>
                </div>
                <div>
                    <p class="font-semibold text-blue-900 text-sm">AI Material Detection</p>
                    <p class="text-xs text-blue-700 mt-0.5">Upload a photo and we'll auto-detect the material</p>
                </div>
            </div>
        </div>

        <!-- Save Button -->
        <button class="save-button w-full py-4 rounded-2xl text-white font-semibold text-lg">
            Save Plush
        </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-camera text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Scan</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-box text-xl text-green-600"></i>
            <span class="text-xs mt-1 text-green-600 font-medium">Plushies</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Profile</span>
        </div>
    </div>
</body>
</html>
