<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlushCare - My Plushies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F8F9FA;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .plush-card {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .material-tag {
            background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
        }
        .add-button {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1 bg-white">
        <span class="text-sm font-semibold">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-7 pb-4">
        <div class="flex items-center justify-between mt-2">
            <h1 class="text-2xl font-bold text-gray-900">My Plushies</h1>
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fas fa-search text-gray-500"></i>
            </button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mt-4 overflow-x-auto">
            <button class="px-4 py-2 bg-green-600 text-white rounded-full text-sm font-medium flex-shrink-0">All (8)</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0">Cotton (3)</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0">Polyester (4)</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium flex-shrink-0">Velvet (1)</button>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area mt-4">
        <!-- Grid of Plushies -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Plush Card 1 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1595433707802-6b2626ef1c91?w=400" class="w-full h-36 object-cover" alt="Cat plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Mr. Whiskers</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Polyester</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>5 safe products</span>
                    </div>
                </div>
            </div>

            <!-- Plush Card 2 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1563396983906-b3795482a59a?w=400" class="w-full h-36 object-cover" alt="Bear plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Teddy</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Cotton</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>8 safe products</span>
                    </div>
                </div>
            </div>

            <!-- Plush Card 3 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400" class="w-full h-36 object-cover" alt="Bunny plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-amber-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Bunbun</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Velvet</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>3 safe products</span>
                    </div>
                </div>
            </div>

            <!-- Plush Card 4 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=400" class="w-full h-36 object-cover" alt="Dog plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Buddy</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Polyester</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>6 safe products</span>
                    </div>
                </div>
            </div>

            <!-- Plush Card 5 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1535982330050-f1c2fb79ff78?w=400" class="w-full h-36 object-cover" alt="Penguin plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Pengpeng</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Cotton</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>7 safe products</span>
                    </div>
                </div>
            </div>

            <!-- Plush Card 6 -->
            <div class="plush-card rounded-3xl overflow-hidden">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=400" class="w-full h-36 object-cover" alt="Elephant plush">
                    <div class="absolute top-3 right-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full block"></span>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-gray-900">Ellie</h3>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="material-tag text-blue-700 text-xs px-2 py-1 rounded-full font-medium">Polyester</span>
                    </div>
                    <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                        <i class="fas fa-spray-can"></i>
                        <span>5 safe products</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Add Button -->
    <button class="add-button fixed bottom-28 right-7 w-14 h-14 rounded-full flex items-center justify-center z-20">
        <i class="fas fa-plus text-white text-xl"></i>
    </button>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-home text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-camera text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Scan</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-box text-xl text-green-600"></i>
            <span class="text-xs mt-1 text-green-600 font-medium">Plushies</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-400"></i>
            <span class="text-xs mt-1 text-gray-400">Profile</span>
        </div>
    </div>
</body>
</html>
