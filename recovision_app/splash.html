<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecoVision - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100%; height: 100%; background: #0f0f1a; overflow: hidden; }
        .status-bar { height: 59px; padding: 0 28px; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .float-1 { animation: float 3s ease-in-out infinite; }
        .float-2 { animation: float 3s ease-in-out infinite 0.5s; }
        .float-3 { animation: float 3s ease-in-out infinite 1s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2">
        <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-white">9:41</span>
        </div>
        <div class="w-[126px] h-[37px] bg-black rounded-full mt-3"></div>
        <div class="flex items-center gap-1.5 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Hero Image -->
    <div class="relative" style="height: 52%;">
        <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=500&h=700&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-[#0f0f1a]/40 via-transparent to-[#0f0f1a]"></div>

        <!-- Floating Pose Dots -->
        <div class="absolute top-[25%] left-[34%] float-1">
            <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-lg shadow-cyan-400/50"></div>
        </div>
        <div class="absolute top-[38%] right-[30%] float-2">
            <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-lg shadow-cyan-400/50"></div>
        </div>
        <div class="absolute top-[50%] left-[26%] float-3">
            <div class="w-3 h-3 bg-indigo-400 rounded-full shadow-lg shadow-indigo-400/50"></div>
        </div>
        <div class="absolute top-[58%] right-[26%] float-1">
            <div class="w-3 h-3 bg-amber-400 rounded-full shadow-lg shadow-amber-400/50"></div>
        </div>
    </div>

    <!-- Content -->
    <div class="px-8 -mt-6 relative z-10">
        <div class="flex items-center gap-2.5 mb-3">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                <i class="fas fa-eye text-white text-sm"></i>
            </div>
            <span class="text-xl font-bold text-white">RecoVision</span>
        </div>

        <h1 class="text-3xl font-bold text-white leading-tight mb-3">
            AI-Powered<br>Injury Recovery
        </h1>
        <p class="text-gray-400 text-sm leading-relaxed mb-6">
            Computer vision and smart sensors track your form in real-time, guiding you through recovery with precision.
        </p>

        <!-- Feature Tags -->
        <div class="flex flex-wrap items-center gap-2 mb-8">
            <div class="flex items-center gap-1.5 bg-white/8 rounded-full px-3 py-1.5">
                <div class="w-2 h-2 bg-cyan-400 rounded-full"></div>
                <span class="text-xs text-gray-300">Pose Tracking</span>
            </div>
            <div class="flex items-center gap-1.5 bg-white/8 rounded-full px-3 py-1.5">
                <div class="w-2 h-2 bg-emerald-400 rounded-full"></div>
                <span class="text-xs text-gray-300">Smart Sensors</span>
            </div>
            <div class="flex items-center gap-1.5 bg-white/8 rounded-full px-3 py-1.5">
                <div class="w-2 h-2 bg-amber-400 rounded-full"></div>
                <span class="text-xs text-gray-300">AI Feedback</span>
            </div>
        </div>

        <!-- CTA -->
        <button class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-4 rounded-2xl text-base shadow-lg shadow-indigo-500/30 mb-3">
            Get Started
        </button>
        <p class="text-center text-xs text-gray-500">Already have an account? <span class="text-indigo-400 font-medium">Sign In</span></p>
    </div>

    <!-- Page Indicator -->
    <div class="absolute bottom-10 left-0 right-0 flex justify-center gap-2">
        <div class="w-6 h-1.5 bg-indigo-500 rounded-full"></div>
        <div class="w-1.5 h-1.5 bg-gray-600 rounded-full"></div>
        <div class="w-1.5 h-1.5 bg-gray-600 rounded-full"></div>
    </div>
</body>
</html>
