<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HouseKeeper+ | AI-Powered Household Safety Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1a1a1a;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .logo-text {
            font-size: 42px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .logo-text span {
            color: #2563EB;
        }

        .tagline {
            font-size: 22px;
            color: #6b7280;
            font-weight: 400;
            line-height: 1.6;
        }

        /* Screens Gallery */
        .screens-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            padding: 20px 40px 100px;
            max-width: 2200px;
            margin: 0 auto;
        }

        .screen-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screen-label {
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* iPhone 17 Pro Frame - 393 x 852 logical pixels */
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 60px;
            padding: 12px;
            box-shadow:
                0 50px 100px rgba(0, 0, 0, 0.2),
                0 20px 50px rgba(0, 0, 0, 0.15),
                inset 0 0 0 3px #333,
                inset 0 0 0 5px #1a1a1a;
            position: relative;
        }

        /* Dynamic Island */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 36px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }

        /* Side Button - Right */
        .phone-frame::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 180px;
            width: 4px;
            height: 100px;
            background: #333;
            border-radius: 0 2px 2px 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 48px;
            overflow: hidden;
            background: #f9fafb;
        }

        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive */
        @media (max-width: 1600px) {
            .screens-gallery {
                gap: 32px;
                padding: 20px 30px 80px;
            }

            .phone-frame {
                width: 360px;
                height: 780px;
                border-radius: 55px;
            }

            .phone-frame::before {
                width: 115px;
                height: 33px;
            }

            .phone-screen {
                border-radius: 44px;
            }
        }

        @media (max-width: 1200px) {
            .screens-gallery {
                gap: 28px;
                padding: 20px 20px 70px;
            }

            .phone-frame {
                width: 320px;
                height: 693px;
                border-radius: 50px;
                padding: 10px;
            }

            .phone-frame::before {
                width: 100px;
                height: 30px;
                top: 15px;
            }

            .phone-screen {
                border-radius: 40px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 40px 20px 30px;
            }

            .logo-icon {
                width: 52px;
                height: 52px;
                font-size: 26px;
            }

            .logo-text {
                font-size: 32px;
            }

            .tagline {
                font-size: 17px;
            }

            .screens-gallery {
                gap: 24px;
                padding: 20px 16px 60px;
            }

            .phone-frame {
                width: 300px;
                height: 650px;
                border-radius: 46px;
                padding: 8px;
            }

            .phone-frame::before {
                width: 90px;
                height: 28px;
                top: 12px;
            }

            .phone-screen {
                border-radius: 38px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-house-chimney-medical"></i>
            </div>
            <span class="logo-text">HouseKeeper<span>+</span></span>
        </div>
        <p class="tagline">AI-Powered Household Safety & Community Support Platform</p>
    </header>

    <!-- Screens Gallery -->
    <section class="screens-gallery">
        <div class="screen-wrapper">
            <span class="screen-label">Home</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="home.html" title="Home Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">AI Insights</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="ai_insights.html" title="AI Insights Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Services</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="services.html" title="Services Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Alerts</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="alerts.html" title="Alerts Screen"></iframe>
                </div>
            </div>
        </div>

        <div class="screen-wrapper">
            <span class="screen-label">Profile</span>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="profile.html" title="Profile Screen"></iframe>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
