<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>SportPath · Pose capture</title></head><body>
<div class="screen" style="background:#000">
  <img src="assets/pose.jpg" class="absolute inset-0 w-full h-full object-cover" style="transform:scale(1.35);transform-origin:50% 40%">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 60%,rgba(0,0,0,.88))"></div>
  <!-- skeleton overlay -->
  <svg class="absolute inset-0 w-full h-full" viewBox="0 0 436 956" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2DD4BF" stroke-width="4" opacity=".95">
      <line x1="226" y1="236" x2="214" y2="318"/>
      <line x1="214" y1="318" x2="150" y2="352"/><line x1="214" y1="318" x2="282" y2="300"/>
      <line x1="150" y1="352" x2="120" y2="420"/><line x1="282" y1="300" x2="330" y2="222"/>
      <line x1="214" y1="318" x2="218" y2="470"/>
      <line x1="218" y1="470" x2="176" y2="560"/><line x1="218" y1="470" x2="268" y2="556"/>
      <line x1="176" y1="560" x2="190" y2="680"/><line x1="268" y1="556" x2="300" y2="672"/>
    </g>
    <g stroke="#F59E0B" stroke-width="4"><line x1="282" y1="300" x2="330" y2="222"/><line x1="330" y1="222" x2="300" y2="150"/></g>
    <g fill="#fff" stroke="#0F766E" stroke-width="3">
      <circle cx="226" cy="236" r="7"/><circle cx="214" cy="318" r="7"/><circle cx="150" cy="352" r="7"/><circle cx="282" cy="300" r="7"/><circle cx="120" cy="420" r="7"/><circle cx="218" cy="470" r="7"/><circle cx="176" cy="560" r="7"/><circle cx="268" cy="556" r="7"/><circle cx="190" cy="680" r="7"/><circle cx="300" cy="672" r="7"/>
    </g>
    <circle cx="330" cy="222" r="9" fill="#F59E0B" stroke="#fff" stroke-width="3"/><circle cx="300" cy="150" r="7" fill="#fff" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="330" cy="222" r="22" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
  </svg>
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="absolute top-[70px] inset-x-0 px-[28px] flex items-center justify-between text-white">
    <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark text-[16px]"></i></div>
    <div class="chip" style="background:rgba(255,255,255,.16);color:#fff;border:0;backdrop-filter:blur(10px)"><span class="dot bg-rose-500" style="box-shadow:0 0 0 3px rgba(244,63,94,.35)"></span>REC <span class="num">0:31</span></div>
    <div class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-camera-rotate text-[15px]"></i></div>
  </div>
  <div class="absolute top-[132px] left-[28px] flex flex-col gap-2">
    <div class="chip" style="background:rgba(0,0,0,.45);color:#fff;border:0;backdrop-filter:blur(8px)"><i class="fa-solid fa-basketball text-[12px] text-teal-300"></i>Jump shot · side view</div>
    <div class="chip" style="background:rgba(0,0,0,.45);color:#fff;border:0;backdrop-filter:blur(8px)"><i class="fa-solid fa-bone text-[12px] text-teal-300"></i>17 joints tracked · 30 fps</div>
  </div>
  <div class="absolute top-[262px] right-[22px] rounded-2xl px-3.5 py-2.5 text-white" style="background:rgba(245,158,11,.92);backdrop-filter:blur(8px)">
    <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/80">Elbow</p>
    <p class="text-[24px] font-extrabold leading-none num">101°</p>
    <p class="text-[11px] font-semibold mt-1">target 90°</p>
  </div>
  <div class="absolute top-[560px] left-[22px] rounded-2xl px-3.5 py-2.5 text-white" style="background:rgba(13,148,136,.9);backdrop-filter:blur(8px)">
    <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/80">Knee bend</p>
    <p class="text-[24px] font-extrabold leading-none num">118°</p>
    <p class="text-[11px] font-semibold mt-1">good</p>
  </div>
  <div class="absolute inset-x-0 bottom-0 px-[28px] pb-10 text-white">
    <div class="rounded-[20px] p-4 mb-5 flex items-center gap-3" style="background:rgba(255,255,255,.1);backdrop-filter:blur(14px)">
      <div class="w-10 h-10 rounded-xl grad-amber flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="flex-1"><p class="text-[15px] font-bold">Tuck the shooting elbow</p><p class="text-[12.5px] text-white/70 mt-0.5">Rep 7 · elbow drifting out on the way up</p></div>
    </div>
    <div class="flex items-center justify-between">
      <div class="text-center w-[72px]"><p class="text-[26px] font-extrabold num leading-none">7</p><p class="text-[11px] text-white/60 mt-1">reps</p></div>
      <div class="w-[84px] h-[84px] rounded-full border-[5px] border-white flex items-center justify-center"><div class="w-[30px] h-[30px] rounded-md bg-rose-500"></div></div>
      <div class="text-center w-[72px]"><p class="text-[26px] font-extrabold num leading-none">79</p><p class="text-[11px] text-white/60 mt-1">live score</p></div>
    </div>
  </div>
</div></body></html>
