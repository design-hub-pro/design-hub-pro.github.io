<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>SportPath · Guided reset</title></head><body>
<div class="screen ink text-white">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="absolute top-[70px] inset-x-0 px-[28px] flex items-center justify-between">
    <div class="w-10 h-10 rounded-full bg-white/12 flex items-center justify-center" style="background:rgba(255,255,255,.12)"><i class="fa-solid fa-xmark text-[16px]"></i></div>
    <p class="text-[15px] font-bold">Box breathing</p>
    <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.12)"><i class="fa-solid fa-volume-high text-[14px]"></i></div>
  </div>
  <div class="absolute top-[140px] inset-x-0 text-center"><p class="meta" style="color:rgba(255,255,255,.5)">Step 1 of 3 · pre-game</p><p class="text-[34px] font-extrabold mt-2 tracking-tight">Breathe in</p><p class="text-[14px] text-white/60 mt-1">Through the nose. Fill the belly.</p></div>
  <div class="absolute left-1/2 top-[470px] -translate-x-1/2 -translate-y-1/2">
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[330px] h-[330px] rounded-full" style="background:radial-gradient(circle,rgba(45,212,191,.18),rgba(45,212,191,0) 70%)"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[270px] h-[270px] rounded-full border border-white/10"></div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[210px] h-[210px] rounded-full border border-white/10"></div>
    <div class="relative w-[232px] h-[232px] rounded-full grad flex items-center justify-center" style="box-shadow:0 30px 80px -20px rgba(45,212,191,.6)"><p class="text-[64px] font-extrabold num leading-none">3</p></div>
  </div>
  <div class="absolute top-[640px] inset-x-0 px-[28px]">
    <div class="flex items-center justify-between text-[12px] font-semibold text-white/50 mb-2 num"><span>In 4</span><span>Hold 4</span><span>Out 4</span><span>Hold 4</span></div>
    <div class="flex gap-1.5"><span class="h-2 flex-1 rounded-full bg-teal-300"></span><span class="h-2 flex-1 rounded-full bg-white/15"></span><span class="h-2 flex-1 rounded-full bg-white/15"></span><span class="h-2 flex-1 rounded-full bg-white/15"></span></div>
  </div>
  <div class="absolute top-[700px] inset-x-0 px-[28px] grid grid-cols-3 gap-3 num">
    <div class="rounded-2xl p-3.5 text-center" style="background:rgba(255,255,255,.08)"><p class="text-[22px] font-extrabold leading-none">3:12</p><p class="text-[11px] text-white/50 mt-1.5">left</p></div>
    <div class="rounded-2xl p-3.5 text-center" style="background:rgba(255,255,255,.08)"><p class="text-[22px] font-extrabold leading-none">71</p><p class="text-[11px] text-white/50 mt-1.5">bpm <i class="fa-solid fa-arrow-down text-teal-300 text-[9px]"></i></p></div>
    <div class="rounded-2xl p-3.5 text-center" style="background:rgba(255,255,255,.08)"><p class="text-[22px] font-extrabold leading-none">4</p><p class="text-[11px] text-white/50 mt-1.5">cycles</p></div>
  </div>
  <div class="absolute bottom-0 inset-x-0 px-[28px] pb-10">
    <div class="rounded-[20px] p-4 flex items-center gap-3" style="background:rgba(255,255,255,.08)"><div class="w-10 h-10 rounded-xl grad-sky flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-eye"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Up next · Visualize first 3 shots</p><p class="text-[12px] text-white/60 num">6 min</p></div><i class="fa-solid fa-chevron-right text-white/40 text-[13px]"></i></div>
    <div class="flex items-center justify-center gap-8 mt-5"><i class="fa-solid fa-backward-step text-[20px] text-white/60"></i><div class="w-16 h-16 rounded-full bg-white text-[#0F172A] flex items-center justify-center"><i class="fa-solid fa-pause text-[20px]"></i></div><i class="fa-solid fa-forward-step text-[20px] text-white/60"></i></div>
  </div>
</div></body></html>
