<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>SportPath · Sports profile</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:140px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[15px]"></i></div>
    <div class="flex gap-1.5"><span class="w-7 h-1.5 rounded-full bg-[#0D9488]"></span><span class="w-7 h-1.5 rounded-full bg-[#0D9488]"></span><span class="w-7 h-1.5 rounded-full bg-[#E2E8F0]"></span><span class="w-7 h-1.5 rounded-full bg-[#E2E8F0]"></span></div>
    <span class="text-[13px] font-semibold text-gray-400">2 / 4</span>
  </div>
  <div class="px-c mt-7">
    <p class="meta">Your sport</p>
    <h1 class="text-[30px] font-extrabold tracking-tight leading-tight mt-1">What do you play?</h1>
  </div>
  <div class="px-c mt-5 grid grid-cols-3 gap-3">
    <div class="rounded-[20px] h-[96px] grad text-white flex flex-col items-center justify-center gap-2 shadow-lg shadow-teal-700/25"><i class="fa-solid fa-basketball text-[26px]"></i><span class="text-[12.5px] font-bold">Basketball</span></div>
    <div class="rounded-[20px] h-[96px] card flex flex-col items-center justify-center gap-2 text-gray-600"><i class="fa-solid fa-futbol text-[26px]"></i><span class="text-[12.5px] font-semibold">Soccer</span></div>
    <div class="rounded-[20px] h-[96px] card flex flex-col items-center justify-center gap-2 text-gray-600"><i class="fa-solid fa-baseball-bat-ball text-[26px]"></i><span class="text-[12.5px] font-semibold">Baseball</span></div>
    <div class="rounded-[20px] h-[96px] card flex flex-col items-center justify-center gap-2 text-gray-600"><i class="fa-solid fa-person-running text-[26px]"></i><span class="text-[12.5px] font-semibold">Track</span></div>
    <div class="rounded-[20px] h-[96px] card flex flex-col items-center justify-center gap-2 text-gray-600"><i class="fa-solid fa-table-tennis-paddle-ball text-[26px]"></i><span class="text-[12.5px] font-semibold">Tennis</span></div>
    <div class="rounded-[20px] h-[96px] card flex flex-col items-center justify-center gap-2 text-gray-600"><i class="fa-solid fa-volleyball text-[26px]"></i><span class="text-[12.5px] font-semibold">Volleyball</span></div>
  </div>
  <div class="px-c mt-7"><p class="meta">Position</p></div>
  <div class="hscroll mt-3"><span class="chip">PG</span><span class="chip on">SG</span><span class="chip">SF</span><span class="chip">PF</span><span class="chip">C</span></div>
  <div class="px-c mt-7"><p class="meta">Current level</p></div>
  <div class="mx-[28px] mt-3 card p-2">
    <div class="flex items-center gap-3.5 p-3 rounded-2xl"><div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa-solid fa-seedling"></i></div><div class="flex-1"><p class="text-[15.5px] font-semibold">Rec league</p></div></div>
    <div class="flex items-center gap-3.5 p-3 rounded-2xl bg-[#ECFDF5] ring-1 ring-[#0D9488]"><div class="w-10 h-10 rounded-xl grad text-white flex items-center justify-center"><i class="fa-solid fa-school"></i></div><div class="flex-1"><p class="text-[15.5px] font-bold">High school JV</p></div><i class="fa-solid fa-circle-check ac"></i></div>
    <div class="flex items-center gap-3.5 p-3 rounded-2xl"><div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500"><i class="fa-solid fa-medal"></i></div><div class="flex-1"><p class="text-[15.5px] font-semibold">Varsity / club</p></div></div>
  </div>
  <div class="px-c mt-7"><p class="meta">Goal this season</p></div>
  <div class="mx-[28px] mt-3 rounded-[22px] overflow-hidden relative h-[120px]">
    <img src="assets/game.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,17,32,.92),rgba(11,17,32,.35))"></div>
    <div class="absolute inset-0 p-5 text-white flex flex-col justify-center"><p class="text-[12px] font-semibold text-white/60">Target</p><p class="text-[20px] font-extrabold leading-tight">Make varsity<br>by March tryouts</p></div>
    <i class="fa-solid fa-pen absolute top-4 right-4 text-white/70 text-[13px]"></i>
  </div>
</div>
<div class="absolute inset-x-0 bottom-0 px-[28px] pb-9 pt-5" style="background:linear-gradient(180deg,rgba(245,247,249,0),#F5F7F9 40%)">
  <div class="btn grad shadow-lg shadow-teal-700/30">Continue <i class="fa-solid fa-arrow-right text-[14px]"></i></div>
</div>
</div></body></html>
