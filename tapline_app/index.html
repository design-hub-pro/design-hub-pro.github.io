<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapline</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#fff;color:#0B1B22}
.wrap{max-width:1560px;margin:0 auto;padding:80px 48px 120px}
.hero{display:flex;align-items:center;gap:26px;margin-bottom:14px}
.icon{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,#14B8A6 0%,#0284C7 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;box-shadow:0 20px 40px -18px rgba(2,132,199,.9)}
h1{font-size:56px;font-weight:800;letter-spacing:-2.4px;line-height:1}
.tag{font-size:19px;color:#6E858E;font-weight:500;margin-top:12px;letter-spacing:-.2px}
.tags{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.tags span{padding:9px 16px;border-radius:999px;border:1px solid #E4EBEE;font-size:13px;font-weight:600;color:#24404A}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;margin-top:72px;justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1B22;box-shadow:0 40px 80px -40px rgba(11,27,34,.5),0 0 0 1px rgba(11,27,34,.06)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;background:#fff;display:block}
.lbl{margin-top:20px;font-size:15px;font-weight:700;letter-spacing:-.2px}
.lbl s{text-decoration:none;display:block;font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#A4B4BA;margin-top:6px;text-align:center}
</style></head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon"><i class="fa-solid fa-droplet"></i></div>
    <div>
      <h1>Tapline</h1>
      <div class="tag">A clamp-on sensor reads your tap water and the app sets your shower, shampoo and wash accordingly.</div>
    </div>
  </div>
  <div class="tags">
    <span>Water quality</span><span>Smart sensor</span><span>Home routine</span><span>iOS</span>
  </div>

  <div class="grid">
    <div class="cell"><div class="frame"><iframe src="pair.html" scrolling="no"></iframe></div><div class="lbl">Pair sensor<s>Setup</s></div></div>
    <div class="cell"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="lbl">Today's water<s>Home</s></div></div>
    <div class="cell"><div class="frame"><iframe src="reading.html" scrolling="no"></iframe></div><div class="lbl">Live read<s>Capture</s></div></div>
    <div class="cell"><div class="frame"><iframe src="result.html" scrolling="no"></iframe></div><div class="lbl">Read result<s>Grade</s></div></div>
    <div class="cell"><div class="frame"><iframe src="plan.html" scrolling="no"></iframe></div><div class="lbl">Usage plan<s>Settings</s></div></div>
    <div class="cell"><div class="frame"><iframe src="usage.html" scrolling="no"></iframe></div><div class="lbl">Water trends<s>History</s></div></div>
    <div class="cell"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="lbl">Household<s>Profile</s></div></div>
  </div>
</div>
</body></html>
