<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapline · Reading</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
:root{
  --accent:#0EA5A4;--accent2:#0284C7;--ink:#0B1B22;--ink2:#24404A;
  --muted:#6E858E;--border:#E4EBEE;--surface:#F4F8F9;--bg:#FAFCFD;
  --warn:#DB8C2A;--bad:#D25349;--good:#22A184;
  --grad:linear-gradient(135deg,#14B8A6 0%,#0284C7 100%);
}
body{font-family:'Inter',sans-serif;color:var(--ink);background:#fff}
.screen{width:100%;min-height:100vh;height:100%;background:var(--bg);position:relative;overflow-y:auto;overflow-x:hidden}
.sb{height:59px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;flex:none}
.sb .t{font-size:16px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px}
.pad{padding-left:28px;padding-right:28px}
.meta{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 1px 2px rgba(11,27,34,.04),0 8px 24px -12px rgba(11,27,34,.12)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sechead .act{font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:5px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(34,161,132,.6);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(34,161,132,.5)}70%{box-shadow:0 0 0 9px rgba(34,161,132,0)}100%{box-shadow:0 0 0 0 rgba(34,161,132,0)}}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-size:16px;font-weight:700;letter-spacing:-.2px;box-shadow:0 10px 22px -10px rgba(2,132,199,.7)}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--ink);box-shadow:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:12px 14px 0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#A4B4BA;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.tab i{font-size:19px}
.tab.on{color:var(--accent)}
.hair{height:1px;background:var(--border)}
.up{color:var(--bad)}.down{color:var(--good)}
.screen{background:#07191F}
body{color:#fff;background:#07191F}
.sb .t,.sb .i{color:#fff}
.dnav{display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.dnav .b{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff}
.dmeta{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#6E97A2}
.count{text-align:center;margin-top:18px}
.count b{font-size:72px;font-weight:800;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#5EEAD4,#38BDF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.count span{display:block;font-size:12px;font-weight:700;letter-spacing:2.4px;color:#6E97A2;margin-top:10px}
.wave{margin-top:16px;height:100px;display:flex;align-items:center;justify-content:space-between;gap:3px;padding:0 2px}
.wave i{flex:1;border-radius:3px;background:linear-gradient(180deg,#5EEAD4,#0EA5A4);opacity:.9;animation:w 1.4s ease-in-out infinite}
@keyframes w{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.flow{display:flex;gap:10px;margin-top:16px}
.flow>div{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:13px 14px}
.flow .k{font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:#6E97A2;text-transform:uppercase}
.flow .n{font-size:21px;font-weight:700;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.flow .n s{font-size:12px;font-weight:600;color:#6E97A2;text-decoration:none;margin-left:3px}
.ch{display:flex;align-items:center;gap:14px;padding:13px 0}
.ch+.ch{border-top:1px solid rgba(255,255,255,.08)}
.ch .nm{font-size:14.5px;font-weight:600}
.ch .un{font-size:11px;color:#6E97A2;font-weight:600;margin-top:3px;letter-spacing:.4px}
.ch .vl{margin-left:auto;text-align:right}
.ch .vl b{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ch .mt{width:66px;height:5px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden;margin-left:auto}
.ch .mt i{display:block;height:100%;border-radius:4px;background:#5EEAD4}
.lk{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.vol{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px 18px}
.vol .pb{height:8px;border-radius:5px;background:rgba(255,255,255,.13);margin-top:12px;overflow:hidden;position:relative}
.vol .pb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5EEAD4,#38BDF8)}
.vol .pb s{position:absolute;top:-3px;height:14px;width:2px;background:rgba(255,255,255,.45);left:70%}
</style></head><body>
<div class="screen">
  <div class="sb"><div class="t">7:36</div><div class="island"></div>
    <div class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>

  <div class="pad">
    <div class="dnav">
      <div class="b"><i class="fa-solid fa-xmark"></i></div>
      <div class="dmeta">Read 12 · Kitchen</div>
      <div class="b"><i class="fa-solid fa-bolt" style="color:#5EEAD4"></i></div>
    </div>

    <div class="count">
      <b>00:23</b>
      <span>SAMPLING</span>
    </div>

    <div class="wave">
      <i style="height:34%;animation-delay:0s"></i><i style="height:58%;animation-delay:.08s"></i>
      <i style="height:80%;animation-delay:.16s"></i><i style="height:46%;animation-delay:.24s"></i>
      <i style="height:92%;animation-delay:.32s"></i><i style="height:64%;animation-delay:.4s"></i>
      <i style="height:38%;animation-delay:.48s"></i><i style="height:74%;animation-delay:.56s"></i>
      <i style="height:100%;animation-delay:.64s"></i><i style="height:52%;animation-delay:.72s"></i>
      <i style="height:30%;animation-delay:.8s"></i><i style="height:68%;animation-delay:.88s"></i>
      <i style="height:86%;animation-delay:.96s"></i><i style="height:44%;animation-delay:1.04s"></i>
      <i style="height:60%;animation-delay:1.12s"></i><i style="height:96%;animation-delay:1.2s"></i>
      <i style="height:40%;animation-delay:1.28s"></i><i style="height:72%;animation-delay:1.36s"></i>
      <i style="height:56%;animation-delay:1.44s"></i><i style="height:34%;animation-delay:1.52s"></i>
      <i style="height:78%;animation-delay:1.6s"></i><i style="height:50%;animation-delay:1.68s"></i>
      <i style="height:88%;animation-delay:1.76s"></i><i style="height:42%;animation-delay:1.84s"></i>
    </div>

    <div class="flow">
      <div><div class="k">Temp</div><div class="n">14.6<s>°C</s></div></div>
      <div><div class="k">Drift</div><div class="n">0.1<s>°C</s></div></div>
      <div><div class="k">Depth</div><div class="n">18<s>mm</s></div></div>
    </div>

    <div class="vol">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div class="dmeta">Sample window</div>
        <div style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums">14 <span style="color:#6E97A2;font-size:11.5px">/ 20 s</span></div>
      </div>
      <div class="pb"><i style="width:68%"></i><s></s></div>
    </div>

    <div style="margin-top:18px">
      <div class="dmeta" style="margin-bottom:4px">Channels · 2 locked</div>

      <div class="ch">
        <div class="lk" style="background:rgba(94,234,212,.16);color:#5EEAD4"><i class="fa-solid fa-check"></i></div>
        <div><div class="nm">Conductivity</div><div class="un">µS/cm · locked</div></div>
        <div class="vl"><b>428</b><div class="mt"><i style="width:74%"></i></div></div>
      </div>

      <div class="ch">
        <div class="lk" style="background:rgba(94,234,212,.16);color:#5EEAD4"><i class="fa-solid fa-check"></i></div>
        <div><div class="nm">Temperature</div><div class="un">°C · locked</div></div>
        <div class="vl"><b>14.6</b><div class="mt"><i style="width:58%"></i></div></div>
      </div>

      <div class="ch">
        <div class="lk" style="background:rgba(56,189,248,.16);color:#38BDF8"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
        <div><div class="nm">Hardness</div><div class="un">ppm · settling</div></div>
        <div class="vl"><b style="opacity:.7">11<span style="opacity:.4">4</span></b><div class="mt"><i style="width:46%;background:#38BDF8"></i></div></div>
      </div>

      <div class="ch">
        <div class="lk" style="background:rgba(255,255,255,.09);color:#6E97A2"><i class="fa-solid fa-hourglass-half"></i></div>
        <div><div class="nm" style="color:#6E97A2">TDS</div><div class="un">ppm · queued</div></div>
        <div class="vl"><b style="color:#3E626D">--</b><div class="mt"><i style="width:0"></i></div></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;padding:13px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
      <span class="live"></span>
      <span style="font-size:13px;font-weight:600;letter-spacing:.2px">Hold the tip still · 22 s</span>
    </div>

    <div style="height:34px"></div>
  </div>
</div>
</body></html>
