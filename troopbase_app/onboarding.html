<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TroopBase — Welcome</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
body{font-family:'Inter',-apple-system,sans-serif;background:#0F2B1F;color:#fff;width:100%;height:100%;overflow:hidden;scrollbar-width:none;}
.fd{font-family:'Plus Jakarta Sans',sans-serif;}
</style>
</head>
<body>

<!-- Status Bar -->
<div style="height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30;">
  <span style="font-size:15px;font-weight:600;color:#fff;">9:41</span>
  <div style="width:126px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px;"></div>
  <div style="display:flex;gap:6px;align-items:center;color:#fff;"><i class="fas fa-signal" style="font-size:13px;"></i><i class="fas fa-wifi" style="font-size:14px;"></i><i class="fas fa-battery-full" style="font-size:15px;"></i></div>
</div>

<!-- Full-bleed hero image -->
<div style="position:absolute;inset:0;top:0;">
  <img src="https://images.unsplash.com/photo-1475483768296-6163e08872a1?w=900&q=85" style="width:100%;height:100%;object-fit:cover;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,43,31,0.55) 0%,rgba(15,43,31,0.35) 30%,rgba(15,43,31,0.96) 78%,#0F2B1F 100%);"></div>
</div>

<div style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;">
  <div style="flex:1;"></div>

  <div style="padding:0 32px 54px;">
    <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#E0A526,#D97742);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 14px 34px rgba(224,165,38,0.4);">
      <i class="fas fa-compass" style="font-size:28px;color:#fff;"></i>
    </div>
    <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border-radius:20px;padding:7px 14px;margin-bottom:18px;">
      <span style="width:6px;height:6px;border-radius:50%;background:#6FCF97;"></span>
      <span style="font-size:11.5px;font-weight:700;letter-spacing:0.3px;">Troop 214 · Season Kickoff Live</span>
    </div>
    <h1 class="fd" style="font-size:38px;font-weight:800;line-height:1.08;letter-spacing:-1px;margin-bottom:14px;">Run your troop.<br>Grow your troop.</h1>
    <p style="font-size:15px;color:rgba(255,255,255,0.72);line-height:1.6;max-width:340px;margin-bottom:30px;">Plan every campout, assign every task, and turn curious kids into lifelong Scouts — all from one place.</p>

    <button style="width:100%;height:56px;background:linear-gradient(135deg,#D97742,#C4602E);border:none;border-radius:18px;color:#fff;font-size:15.5px;font-weight:700;margin-bottom:12px;box-shadow:0 14px 30px rgba(217,119,66,0.4);display:flex;align-items:center;justify-content:center;gap:10px;">
      <i class="fas fa-user-shield"></i> I'm a Troop Leader
    </button>
    <button style="width:100%;height:56px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:18px;color:#fff;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;">
      <i class="fas fa-users"></i> I'm a Scout / Parent
    </button>

    <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:26px;">
      <div style="text-align:center;">
        <div class="fd" style="font-size:20px;font-weight:800;">1,240</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.55);">Troops Using It</div>
      </div>
      <div style="width:1px;height:26px;background:rgba(255,255,255,0.15);"></div>
      <div style="text-align:center;">
        <div class="fd" style="font-size:20px;font-weight:800;">96%</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.55);">Task Completion</div>
      </div>
      <div style="width:1px;height:26px;background:rgba(255,255,255,0.15);"></div>
      <div style="text-align:center;">
        <div class="fd" style="font-size:20px;font-weight:800;">4.9<i class="fas fa-star" style="font-size:11px;color:#E0A526;margin-left:2px;"></i></div>
        <div style="font-size:10px;color:rgba(255,255,255,0.55);">Leader Rating</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
