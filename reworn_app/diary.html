<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reworn — Diary</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#F4F1EA;color:#211E1A;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#F4F1EA}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#211E1A}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:112px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:90px;background:rgba(244,241,234,.9);backdrop-filter:blur(20px);border-top:1px solid #E4DDD0;display:flex;align-items:flex-start;justify-content:space-around;padding:12px 14px 0;z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#A89E8E;width:56px}
.tab i{font-size:19px}.tab.active{color:#41513E}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#4F6346,#41513E);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 10px 26px rgba(65,81,62,.4);margin-top:-16px}
.card{background:#fff;border:1px solid #EBE5DA}
.thumb{position:relative;aspect-ratio:3/4;border-radius:14px;background-size:cover;background-position:center;ring:1px}
.repeat{position:absolute;top:5px;right:5px;background:#C06A4A;color:#fff;font-size:8px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.daynum{position:absolute;bottom:5px;left:6px;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="px-7 flex items-center justify-between mb-4">
      <div>
        <p class="text-[12.5px] text-[#968D7E] font-medium">Outfit diary</p>
        <h1 class="display text-[26px] font-600 mt-0.5">June 2026</h1>
      </div>
      <div class="flex gap-2">
        <button class="w-9 h-9 rounded-full card flex items-center justify-center text-[#968D7E]"><i class="fas fa-chevron-left text-xs"></i></button>
        <button class="w-9 h-9 rounded-full card flex items-center justify-center text-[#968D7E]"><i class="fas fa-chevron-right text-xs"></i></button>
      </div>
    </div>

    <!-- summary strip -->
    <div class="px-7 grid grid-cols-3 gap-2.5 mb-5">
      <div class="card rounded-2xl p-3 text-center"><p class="display text-[24px] font-600 leading-none">26</p><p class="text-[10.5px] text-[#968D7E] mt-1">Days logged</p></div>
      <div class="card rounded-2xl p-3 text-center"><p class="display text-[24px] font-600 text-[#41513E] leading-none">9</p><p class="text-[10.5px] text-[#968D7E] mt-1">Unique looks</p></div>
      <div class="card rounded-2xl p-3 text-center"><p class="display text-[24px] font-600 text-[#C06A4A] leading-none">11</p><p class="text-[10.5px] text-[#968D7E] mt-1">Repeats</p></div>
    </div>

    <!-- legend -->
    <div class="px-7 flex items-center gap-4 mb-3 text-[11px] text-[#968D7E]">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#C06A4A]"></span>Repeated look</span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#41513E]"></span>First wear</span>
    </div>

    <!-- calendar grid -->
    <div class="px-7 grid grid-cols-4 gap-2.5">
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="daynum">2</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622338328-image-1.png')"><span class="daynum">3</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="repeat">2</span><span class="daynum">4</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622362812-image-1.png')"><span class="daynum">5</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622345213-image-1.png')"><span class="daynum">6</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="repeat">3</span><span class="daynum">9</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622356666-image-1.png')"><span class="daynum">10</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622338328-image-1.png')"><span class="repeat">2</span><span class="daynum">11</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622362812-image-1.png')"><span class="repeat">2</span><span class="daynum">12</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622345213-image-1.png')"><span class="daynum">13</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="repeat">4</span><span class="daynum">16</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622356666-image-1.png')"><span class="repeat">2</span><span class="daynum">17</span></div>
      <div class="thumb right" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622338328-image-1.png')"><span class="repeat">3</span><span class="daynum">18</span></div>
      <div class="thumb ring-1 ring-[#41513E]/30" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622362812-image-1.png')"><span class="daynum">19</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="repeat">5</span><span class="daynum">20</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622345213-image-1.png')"><span class="repeat">2</span><span class="daynum">23</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622338328-image-1.png')"><span class="repeat">4</span><span class="daynum">25</span></div>
      <div class="thumb" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"><span class="repeat">6</span><span class="daynum">26</span></div>
      <a href="capture.html" class="thumb flex items-center justify-center" style="background:#EDE7DB"><i class="fas fa-plus text-[#A89E8E] text-lg"></i><span class="daynum" style="color:#968D7E;text-shadow:none">27</span></a>
    </div>
    <p class="text-center text-[12px] text-[#968D7E] mt-5 px-7">Your <span class="font-semibold text-[#C06A4A]">beige trench look</span> appeared 6× this month.</p>
  </div>

  <div class="tabbar">
    <a href="home.html" class="tab"><i class="fas fa-house"></i>Home</a>
    <a href="diary.html" class="tab active"><i class="fas fa-calendar"></i>Diary</a>
    <a href="capture.html" class="flex flex-col items-center"><div class="fab"><i class="fas fa-camera"></i></div></a>
    <a href="wardrobe.html" class="tab"><i class="fas fa-shirt"></i>Closet</a>
    <a href="profile.html" class="tab"><i class="fas fa-user"></i>Me</a>
  </div>
</div>
</body>
</html>
