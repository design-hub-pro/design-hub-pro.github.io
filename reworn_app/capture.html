<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reworn — Log Fit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Fraunces',serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30;color:#fff}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.det{position:absolute;border:1.5px solid #E7C66B;border-radius:10px;animation:pulse 2.2s infinite}
.tag{position:absolute;background:#E7C66B;color:#211E1A;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622452423-image-1.png" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/15"></div>

  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top bar -->
  <div class="absolute top-[68px] inset-x-0 px-6 flex items-center justify-between z-20">
    <a href="home.html" class="w-10 h-10 rounded-full bg-black/35 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-xmark"></i></a>
    <span class="bg-black/35 backdrop-blur text-white text-[12px] font-semibold px-4 py-2 rounded-full"><i class="fas fa-wand-magic-sparkles text-[#E7C66B] mr-1.5"></i>Detecting your fit…</span>
    <button class="w-10 h-10 rounded-full bg-black/35 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-bolt"></i></button>
  </div>

  <!-- AI detection overlays -->
  <div class="det" style="top:30%;left:30%;width:40%;height:18%"></div>
  <span class="tag" style="top:28%;left:30%">Trench · Beige</span>
  <div class="det" style="top:50%;left:34%;width:32%;height:22%"></div>
  <span class="tag" style="top:48%;left:34%">Straight jeans · Indigo</span>
  <div class="det" style="top:73%;left:38%;width:24%;height:9%"></div>
  <span class="tag" style="top:71%;left:38%">Sneakers · White</span>

  <!-- Detected summary card -->
  <div class="absolute left-6 right-6 bottom-[164px] z-20">
    <div class="bg-white/95 backdrop-blur rounded-[22px] p-4 text-[#211E1A]">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[13px] font-bold"><i class="fas fa-check-circle text-[#41513E] mr-1.5"></i>3 pieces recognized</p>
        <span class="text-[11px] text-[#C06A4A] font-bold">2 seen this week</span>
      </div>
      <div class="flex gap-2">
        <div class="flex-1 rounded-xl bg-[#F4F1EA] p-2 text-center"><div class="w-full h-10 rounded-md bg-cover bg-center mb-1" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622384129-image-1.png')"></div><p class="text-[10px] font-semibold">Trench</p></div>
        <div class="flex-1 rounded-xl bg-[#F4F1EA] p-2 text-center"><div class="w-full h-10 rounded-md bg-cover bg-center mb-1" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622379017-image-1.png')"></div><p class="text-[10px] font-semibold">Jeans</p></div>
        <div class="flex-1 rounded-xl bg-[#F4F1EA] p-2 text-center"><div class="w-full h-10 rounded-md bg-cover bg-center mb-1" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622407949-image-1.png')"></div><p class="text-[10px] font-semibold">Sneakers</p></div>
      </div>
    </div>
  </div>

  <!-- Shutter controls -->
  <div class="absolute inset-x-0 bottom-0 h-[150px] flex items-center justify-around px-10 z-20">
    <button class="w-12 h-12 rounded-xl bg-cover bg-center ring-2 ring-white/40" style="background-image:url('https://cm-idea-images.s3.us-west-1.amazonaws.com/1782622326693-image-1.png')"></button>
    <a href="diary.html" class="w-[74px] h-[74px] rounded-full bg-white/25 backdrop-blur flex items-center justify-center"><span class="w-[60px] h-[60px] rounded-full bg-white"></span></a>
    <button class="w-12 h-12 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white text-lg"><i class="fas fa-rotate"></i></button>
  </div>
</div>
</body>
</html>
