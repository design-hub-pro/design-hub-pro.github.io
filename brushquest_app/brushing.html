<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushQuest - Live Session</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    scrollbar-width: none;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #0E7490 0%, #0891B2 30%, #0E7490 100%);
    width: 100%; height: 100%;
    overflow-x: hidden; overflow-y: auto;
    color: #fff;
    position: relative;
  }
  body::before {
    content:''; position: fixed; inset: 0;
    background: radial-gradient(circle at 80% 10%, rgba(251,191,36,0.25), transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(244,114,182,0.25), transparent 50%);
    pointer-events: none;
  }
  .display { font-family: 'Fredoka', sans-serif; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0 28px; height: 59px;
    position: sticky; top: 0; z-index: 100;
    color: #fff;
  }
  .status-bar .time { font-size: 16px; font-weight: 600; }
  .status-bar .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
  }
  .icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .battery { width: 27px; height: 12px; border: 1.5px solid #fff; border-radius: 3px; padding: 1.5px; position: relative; }
  .battery::after { content:''; position: absolute; right: -4px; top: 3px; width: 2px; height: 6px; background: #fff; border-radius: 0 1px 1px 0; }
  .battery-fill { width: 75%; height: 100%; background: #fff; border-radius: 1.5px; }

  .content { padding: 0 28px 120px 28px; position: relative; z-index: 1; }

  .top-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0 20px;
  }
  .back-btn {
    width: 42px; height: 42px; border-radius: 14px;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; backdrop-filter: blur(10px);
  }
  .live-badge {
    background: rgba(244,63,94,0.9); padding: 8px 14px;
    border-radius: 20px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* Big Timer Ring */
  .timer-wrap {
    display: flex; justify-content: center; align-items: center;
    margin: 4px 0 18px 0; position: relative;
  }
  .timer-svg { width: 260px; height: 260px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 14; }
  .ring-fg {
    fill: none; stroke: url(#g1);
    stroke-width: 14; stroke-linecap: round;
    stroke-dasharray: 691; stroke-dashoffset: 138;
  }
  .timer-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .timer-label { font-size: 11px; color: rgba(255,255,255,0.65); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; }
  .timer-val { font-size: 58px; font-weight: 700; letter-spacing: -2px; font-family: 'Fredoka'; line-height: 1; margin-top: 4px; }
  .timer-sub { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 6px; }
  .timer-char {
    position: absolute; top: -10px; right: 30px;
    width: 54px; height: 54px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .bubble {
    position: absolute; top: -28px; right: -18px;
    background: #FBBF24; color: #0F2E2C;
    padding: 6px 12px; border-radius: 14px 14px 14px 4px;
    font-size: 11px; font-weight: 700; font-family: 'Fredoka';
    white-space: nowrap;
  }

  /* Zone Coverage Map */
  .coverage-card {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 28px; padding: 20px;
    margin-bottom: 16px;
  }
  .cov-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .cov-title { font-size: 14px; font-weight: 700; font-family: 'Fredoka'; }
  .cov-pct { font-size: 22px; font-weight: 700; color: #FBBF24; font-family: 'Fredoka'; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .zone {
    background: rgba(255,255,255,0.08);
    border-radius: 16px; padding: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .zone-ic {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .zone.done .zone-ic { background: #14B8A6; }
  .zone.active .zone-ic { background: #FBBF24; color: #0F2E2C; animation: pulseB 1s infinite; }
  .zone.todo .zone-ic { background: rgba(255,255,255,0.15); }
  @keyframes pulseB { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .zone-name { font-size: 12px; font-weight: 600; line-height: 1.2; }
  .zone-st { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  /* Live Stats */
  .live-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 18px;
  }
  .stat-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    border-radius: 20px; padding: 14px 10px;
    text-align: center;
  }
  .stat-ic { font-size: 20px; margin-bottom: 4px; }
  .stat-v { font-size: 20px; font-weight: 700; font-family: 'Fredoka'; }
  .stat-l { font-size: 10px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* Feedback tip */
  .tip {
    display: flex; align-items: center; gap: 12px;
    background: rgba(251,191,36,0.2);
    border: 1px solid rgba(251,191,36,0.35);
    border-radius: 18px; padding: 12px 14px;
  }
  .tip-ic {
    width: 34px; height: 34px; border-radius: 12px;
    background: #FBBF24; color: #0F2E2C;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .tip-txt { font-size: 12px; font-weight: 500; line-height: 1.4; }
  .tip-txt b { font-weight: 700; }

  /* Pause button */
  .controls {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 18px;
  }
  .ctrl-btn {
    width: 64px; height: 64px; border-radius: 20px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; border: 1px solid rgba(255,255,255,0.2);
  }
  .ctrl-btn.pause {
    background: #fff; color: #0E7490;
    width: 74px; height: 74px; font-size: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 90px; background: rgba(14,116,144,0.85);
    backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.08);
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5);
  }
  .tab-item.active { color: #FBBF24; }
  .tab-item i { font-size: 22px; }
  .tab-dot { width: 4px; height: 4px; border-radius: 50%; background: #FBBF24; }
  .home-indicator {
    width: 134px; height: 5px; background: #fff; border-radius: 3px;
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="content">
    <div class="top-row">
      <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="live-badge"><div class="live-dot"></div> LIVE</div>
      <div class="back-btn"><i class="fas fa-volume-high"></i></div>
    </div>

    <!-- Timer Ring -->
    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="50%" stop-color="#F472B6"/>
            <stop offset="100%" stop-color="#FBBF24"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="120" cy="120" r="110"/>
        <circle class="ring-fg" cx="120" cy="120" r="110"/>
      </svg>
      <div class="timer-center">
        <div class="timer-label">Time Left</div>
        <div class="timer-val">1:24</div>
        <div class="timer-sub">keep going, hero!</div>
      </div>
      <div class="timer-char">
        🦊
        <div class="bubble">You got this!</div>
      </div>
    </div>

    <!-- Coverage -->
    <div class="coverage-card">
      <div class="cov-head">
        <div class="cov-title">Zone Coverage</div>
        <div class="cov-pct">75%</div>
      </div>
      <div class="zones">
        <div class="zone done">
          <div class="zone-ic"><i class="fas fa-check"></i></div>
          <div>
            <div class="zone-name">Upper Right</div>
            <div class="zone-st">32 sec · Perfect</div>
          </div>
        </div>
        <div class="zone done">
          <div class="zone-ic"><i class="fas fa-check"></i></div>
          <div>
            <div class="zone-name">Upper Left</div>
            <div class="zone-st">30 sec · Great</div>
          </div>
        </div>
        <div class="zone active">
          <div class="zone-ic"><i class="fas fa-circle-dot"></i></div>
          <div>
            <div class="zone-name">Lower Left</div>
            <div class="zone-st">Brushing now…</div>
          </div>
        </div>
        <div class="zone todo">
          <div class="zone-ic"><i class="fas fa-lock"></i></div>
          <div>
            <div class="zone-name">Lower Right</div>
            <div class="zone-st">Up next</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Live Stats -->
    <div class="live-stats">
      <div class="stat-box">
        <div class="stat-ic">💪</div>
        <div class="stat-v">Good</div>
        <div class="stat-l">Pressure</div>
      </div>
      <div class="stat-box">
        <div class="stat-ic">⚡</div>
        <div class="stat-v">92</div>
        <div class="stat-l">Motion</div>
      </div>
      <div class="stat-box">
        <div class="stat-ic">⭐</div>
        <div class="stat-v">+46</div>
        <div class="stat-l">Earned</div>
      </div>
    </div>

    <div class="tip">
      <div class="tip-ic"><i class="fas fa-lightbulb"></i></div>
      <div class="tip-txt"><b>Softer now!</b> Move in small circles, not back & forth.</div>
    </div>

    <div class="controls">
      <div class="ctrl-btn"><i class="fas fa-backward-step"></i></div>
      <div class="ctrl-btn pause"><i class="fas fa-pause"></i></div>
      <div class="ctrl-btn"><i class="fas fa-forward-step"></i></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item active">
      <i class="fas fa-tooth"></i><span>Brush</span>
      <div class="tab-dot"></div>
    </div>
    <div class="tab-item"><i class="fas fa-gift"></i><span>Rewards</span></div>
    <div class="tab-item"><i class="fas fa-graduation-cap"></i><span>Learn</span></div>
    <div class="tab-item"><i class="fas fa-user"></i><span>Me</span></div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
