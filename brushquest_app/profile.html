<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrushQuest - Profile</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body {
    scrollbar-width: none;
    font-family: 'Inter', sans-serif;
    background: #FDF4FF;
    width: 100%; height: 100%;
    overflow-x: hidden; overflow-y: auto;
    color: #1F1235;
  }
  .display { font-family: 'Fredoka', sans-serif; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0 28px; height: 59px;
    position: sticky; top: 0; z-index: 100; background: #FDF4FF;
  }
  .time { font-size: 16px; font-weight: 600; }
  .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
  }
  .icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .battery { width: 27px; height: 12px; border: 1.5px solid #000; border-radius: 3px; padding: 1.5px; position: relative; }
  .battery::after { content:''; position: absolute; right: -4px; top: 3px; width: 2px; height: 6px; background: #000; border-radius: 0 1px 1px 0; }
  .battery-fill { width: 75%; height: 100%; background: #000; border-radius: 1.5px; }

  .content { padding: 0 28px 120px 28px; }

  /* Hero Profile */
  .profile-hero {
    background: linear-gradient(155deg, #A855F7 0%, #EC4899 60%, #F472B6 100%);
    border-radius: 32px; padding: 28px 22px;
    margin-top: 4px; margin-bottom: 20px;
    position: relative; overflow: hidden;
    text-align: center; color: #fff;
    box-shadow: 0 16px 44px rgba(168,85,247,0.3);
  }
  .profile-hero::before {
    content:''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(251,191,36,0.25), transparent 60%);
  }
  .hero-top {
    display: flex; justify-content: space-between;
    position: relative; z-index: 2;
  }
  .edit-btn {
    width: 36px; height: 36px; border-radius: 12px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; backdrop-filter: blur(10px);
  }
  .hero-avatar {
    width: 120px; height: 120px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 68px; margin: 4px auto 14px;
    position: relative; z-index: 2;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    border: 5px solid rgba(255,255,255,0.4);
  }
  .hero-name { font-size: 26px; font-weight: 700; font-family: 'Fredoka'; position: relative; z-index: 2; }
  .hero-title { font-size: 13px; opacity: 0.9; margin-top: 2px; position: relative; z-index: 2; }

  /* Level bar */
  .level-box {
    margin-top: 18px; background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    border-radius: 18px; padding: 14px 16px;
    position: relative; z-index: 2;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .level-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 600;
    margin-bottom: 8px;
  }
  .level-bar {
    height: 10px; background: rgba(255,255,255,0.25);
    border-radius: 10px; overflow: hidden;
  }
  .level-fill {
    height: 100%; width: 68%;
    background: linear-gradient(90deg, #FBBF24, #FDE68A);
    border-radius: 10px;
  }

  /* Stats row */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 20px;
  }
  .stat {
    background: #fff; border-radius: 20px; padding: 16px 10px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(168,85,247,0.06);
  }
  .stat-val { font-size: 24px; font-weight: 800; font-family: 'Fredoka'; letter-spacing: -0.5px; }
  .stat-val.pink { color: #EC4899; }
  .stat-val.yellow { color: #F59E0B; }
  .stat-val.teal { color: #14B8A6; }
  .stat-lbl { font-size: 10px; color: #78716C; text-transform: uppercase; margin-top: 2px; font-weight: 600; letter-spacing: 0.5px; }

  /* Achievements */
  .section-title {
    font-size: 17px; font-weight: 700; font-family: 'Fredoka';
    margin: 8px 0 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-title a { font-size: 12px; color: #A855F7; font-weight: 600; font-family: 'Inter'; }

  .badges {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 18px;
  }
  .badge {
    aspect-ratio: 1; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; position: relative;
  }
  .badge.a { background: linear-gradient(135deg, #FDE68A, #FBBF24); }
  .badge.b { background: linear-gradient(135deg, #FBCFE8, #EC4899); }
  .badge.c { background: linear-gradient(135deg, #C7D2FE, #6366F1); }
  .badge.d { background: linear-gradient(135deg, #A7F3D0, #10B981); }
  .badge.locked { background: #F1F5F9; opacity: 0.6; font-size: 20px; color: #94A3B8; }
  .badge-new {
    position: absolute; top: -4px; right: -4px;
    background: #EF4444; color: #fff;
    font-size: 9px; padding: 2px 6px;
    border-radius: 10px; font-weight: 700;
    border: 2px solid #FDF4FF;
  }

  /* Device card */
  .device-card {
    background: #fff; border-radius: 22px; padding: 18px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(168,85,247,0.06);
  }
  .device-ic {
    width: 50px; height: 50px; border-radius: 14px;
    background: linear-gradient(135deg, #A855F7, #EC4899);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .device-info { flex: 1; }
  .device-name { font-size: 14px; font-weight: 700; }
  .device-meta { font-size: 11px; color: #94A3B8; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .on-dot { width: 7px; height: 7px; border-radius: 50%; background: #10B981; }
  .device-bat { font-size: 12px; font-weight: 700; color: #10B981; }

  /* Menu list */
  .menu {
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(168,85,247,0.06);
  }
  .menu-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
  }
  .menu-row + .menu-row { border-top: 1px solid #F5F0F9; }
  .menu-ic {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .menu-ic.a { background: #FCE7F3; color: #EC4899; }
  .menu-ic.b { background: #EDE9FE; color: #8B5CF6; }
  .menu-ic.c { background: #DBEAFE; color: #3B82F6; }
  .menu-ic.d { background: #FEF3C7; color: #F59E0B; }
  .menu-name { flex: 1; font-size: 14px; font-weight: 600; }
  .menu-row > i.fa-chevron-right { color: #CBD5E1; font-size: 12px; }

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 90px; background: rgba(253,244,255,0.95);
    backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding-top: 12px; border-top: 0.5px solid rgba(0,0,0,0.06);
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; color: #C4B5D4;
  }
  .tab-item.active { color: #A855F7; }
  .tab-item i { font-size: 22px; }
  .tab-dot { width: 4px; height: 4px; border-radius: 50%; background: #A855F7; }
  .home-indicator {
    width: 134px; height: 5px; background: #1A1A1A; border-radius: 3px;
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="content">
    <!-- Hero -->
    <div class="profile-hero">
      <div class="hero-top">
        <div class="edit-btn"><i class="fas fa-camera"></i></div>
        <div class="edit-btn"><i class="fas fa-gear"></i></div>
      </div>
      <div class="hero-avatar">🦊</div>
      <div class="hero-name">Mia Chen</div>
      <div class="hero-title">Brush Hero · Age 7</div>

      <div class="level-box">
        <div class="level-row">
          <span>Level 7 · Molar Master</span>
          <span>680 / 1000</span>
        </div>
        <div class="level-bar"><div class="level-fill"></div></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val yellow">1,240</div>
        <div class="stat-lbl">Stars</div>
      </div>
      <div class="stat">
        <div class="stat-val pink">12</div>
        <div class="stat-lbl">Day Streak</div>
      </div>
      <div class="stat">
        <div class="stat-val teal">94%</div>
        <div class="stat-lbl">Avg Score</div>
      </div>
    </div>

    <!-- Achievements -->
    <div class="section-title">Achievements <a href="#">See all</a></div>
    <div class="badges">
      <div class="badge a">👑</div>
      <div class="badge b">💎<div class="badge-new">NEW</div></div>
      <div class="badge c">🚀</div>
      <div class="badge d">🏆</div>
      <div class="badge a">⭐</div>
      <div class="badge locked"><i class="fas fa-lock"></i></div>
      <div class="badge locked"><i class="fas fa-lock"></i></div>
      <div class="badge locked"><i class="fas fa-lock"></i></div>
    </div>

    <!-- Device -->
    <div class="section-title">My Toothbrush</div>
    <div class="device-card">
      <div class="device-ic"><i class="fas fa-tooth"></i></div>
      <div class="device-info">
        <div class="device-name">BrushQuest Pro</div>
        <div class="device-meta"><div class="on-dot"></div> Connected · Last synced 2h ago</div>
      </div>
      <div class="device-bat"><i class="fas fa-battery-three-quarters"></i> 82%</div>
    </div>

    <!-- Menu -->
    <div class="menu">
      <div class="menu-row">
        <div class="menu-ic a"><i class="fas fa-stethoscope"></i></div>
        <div class="menu-name">My Dentist</div>
        <i class="fas fa-chevron-right"></i>
      </div>
      <div class="menu-row">
        <div class="menu-ic b"><i class="fas fa-users"></i></div>
        <div class="menu-name">Family Mode</div>
        <i class="fas fa-chevron-right"></i>
      </div>
      <div class="menu-row">
        <div class="menu-ic c"><i class="fas fa-bell"></i></div>
        <div class="menu-name">Reminders</div>
        <i class="fas fa-chevron-right"></i>
      </div>
      <div class="menu-row">
        <div class="menu-ic d"><i class="fas fa-circle-question"></i></div>
        <div class="menu-name">Help & Support</div>
        <i class="fas fa-chevron-right"></i>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item"><i class="fas fa-tooth"></i><span>Brush</span></div>
    <div class="tab-item"><i class="fas fa-gift"></i><span>Rewards</span></div>
    <div class="tab-item"><i class="fas fa-graduation-cap"></i><span>Learn</span></div>
    <div class="tab-item active">
      <i class="fas fa-user"></i><span>Me</span>
      <div class="tab-dot"></div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
