<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#0B0A13;--card:#171526;--card2:#1E1B33;--border:rgba(255,255,255,.09);--ink:#F5F3FF;--muted:#8E88A8;--brand:#A855F7;--brand2:#EC4899;--good:#34D399;--goodsoft:rgba(52,211,153,.15);--warn:#FBBF24;--off:#F87171;--cyan:#22D3EE}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.body{height:100%;overflow-y:auto;padding-bottom:120px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.h1{font-size:28px;font-weight:800;letter-spacing:-1px}
.meta{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.drow{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--muted)}
.addbtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-decoration:none}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px" style="display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px">
  <div class="h1">Team</div>
  <a href="team.html" class="addbtn"><i class="fa-solid fa-user-plus"></i></a>
</div>

<div class="px">
  <div class="card" style="padding:22px 20px;text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:12px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811817854-image-1.png" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);margin-left:0">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819685-image-1.png" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);margin-left:-14px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818010-image-1.png" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);margin-left:-14px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819328-image-1.png" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);margin-left:-14px">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--card2);color:#fff;font-size:13px;font-weight:750;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--card);margin-left:-14px">+2</div>
    </div>
    <b style="font-size:19px;font-weight:800;letter-spacing:-.4px">Velocity Crew</b>
    <div style="font-size:12.5px;color:var(--muted);margin-top:4px">6 dancers &middot; competitive hip-hop</div>
    <div style="display:flex;justify-content:center;gap:26px;margin-top:16px;border-top:1px solid var(--border);padding-top:15px">
      <div><div style="font-size:20px;font-weight:800;color:var(--good)">91%</div><div style="font-size:10.5px;color:var(--muted);font-weight:650">team sync</div></div>
      <div><div style="font-size:20px;font-weight:800">4</div><div style="font-size:10.5px;color:var(--muted);font-weight:650">this week</div></div>
      <div><div style="font-size:20px;font-weight:800">3</div><div style="font-size:10.5px;color:var(--muted);font-weight:650">routines</div></div>
    </div>
  </div>
</div>

<div class="px" style="margin-top:24px">
  <div class="sec"><span class="meta">Ranked by sync score</span></div>
  <div class="card" style="padding:2px 16px">
    <a href="dancer-detail.html" style="text-decoration:none;color:inherit"><div class="drow">
      <span style="font-size:12px;font-weight:800;color:var(--muted);width:14px">1</span>
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811817854-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover">
      <div style="flex:1"><b style="font-size:14px;font-weight:720">Priya R.</b><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span class="tag">CAPTAIN</span><span style="font-size:11px;color:var(--muted)">14 sessions</span></div></div>
      <span class="dot" style="background:var(--good)"></span><b style="font-size:15px;font-weight:780">97%</b>
    </div></a>
    <a href="dancer-detail.html" style="text-decoration:none;color:inherit"><div class="drow">
      <span style="font-size:12px;font-weight:800;color:var(--muted);width:14px">2</span>
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818671-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover">
      <div style="flex:1"><b style="font-size:14px;font-weight:720">Maya S.</b><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span class="tag">YOU</span><span style="font-size:11px;color:var(--muted)">12 sessions</span></div></div>
      <span class="dot" style="background:var(--good)"></span><b style="font-size:15px;font-weight:780">94%</b>
    </div></a>
    <a href="dancer-detail.html" style="text-decoration:none;color:inherit"><div class="drow">
      <span style="font-size:12px;font-weight:800;color:var(--muted);width:14px">3</span>
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819685-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover">
      <div style="flex:1"><b style="font-size:14px;font-weight:720">Diego M.</b><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span style="font-size:11px;color:var(--muted)">11 sessions</span></div></div>
      <span class="dot" style="background:var(--good)"></span><b style="font-size:15px;font-weight:780">92%</b>
    </div></a>
    <a href="dancer-detail.html" style="text-decoration:none;color:inherit"><div class="drow">
      <span style="font-size:12px;font-weight:800;color:var(--muted);width:14px">4</span>
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818010-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover">
      <div style="flex:1"><b style="font-size:14px;font-weight:720">Naomi K.</b><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span style="font-size:11px;color:var(--muted)">9 sessions</span></div></div>
      <span class="dot" style="background:var(--warn)"></span><b style="font-size:15px;font-weight:780">85%</b>
    </div></a>
    <a href="dancer-detail.html" style="text-decoration:none;color:inherit"><div class="drow">
      <span style="font-size:12px;font-weight:800;color:var(--muted);width:14px">5</span>
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819328-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover">
      <div style="flex:1"><b style="font-size:14px;font-weight:720">Kofi A.</b><div style="display:flex;align-items:center;gap:5px;margin-top:2px"><span style="font-size:11px;color:var(--muted)">10 sessions</span></div></div>
      <span class="dot" style="background:var(--off)"></span><b style="font-size:15px;font-weight:780">78%</b>
    </div></a>
  </div>
</div>

</div>
<div class="tab" style="position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(15,13,25,.92);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:13px;z-index:20">
  <a href="home.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#6C6786;font-size:10px;font-weight:680"><i class="fa-solid fa-house" style="font-size:18px"></i>Home</a>
  <a href="routines.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#6C6786;font-size:10px;font-weight:680"><i class="fa-solid fa-music" style="font-size:18px"></i>Routines</a>
  <a href="record.html" style="flex:1;display:flex;flex-direction:column;align-items:center;text-decoration:none"><span style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#EC4899);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-19px;box-shadow:0 14px 26px -10px rgba(168,85,247,.7)"><i class="fa-solid fa-video" style="font-size:19px"></i></span></a>
  <a href="history.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#6C6786;font-size:10px;font-weight:680"><i class="fa-solid fa-chart-simple" style="font-size:18px"></i>History</a>
  <a href="team.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#fff;font-size:10px;font-weight:680"><i class="fa-solid fa-users" style="font-size:18px"></i>Team</a>
</div>
</div></body></html>
