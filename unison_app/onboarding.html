<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#0B0A13;--card:#171526;--border:rgba(255,255,255,.09);--ink:#F5F3FF;--muted:#8E88A8;--brand:#A855F7;--brand2:#EC4899;--cyan:#22D3EE}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#2A1750 0%,#0B0A13 55%)}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.mesh{position:absolute;top:80px;left:0;right:0;height:340px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.wrap{position:relative;height:calc(100% - 59px);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;box-shadow:0 22px 44px -18px rgba(168,85,247,.65);margin:0 auto 22px}
.logo i{color:#fff;font-size:30px}
h1{font-size:38px;font-weight:800;letter-spacing:-1.4px;text-align:center}
.tag{font-size:14.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.55;padding:0 40px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:56px;border-radius:18px;font-size:15.5px;font-weight:700;letter-spacing:-.2px;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 18px 34px -16px rgba(168,85,247,.6)}
.btn.sec{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--border);margin-top:12px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:22px}
.foot a{color:var(--ink);text-decoration:none;font-weight:700}
</style></head><body>
<div class="screen">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<svg class="mesh" viewBox="0 0 460 340" fill="none">
  <g opacity=".8" stroke="url(#lg)" stroke-width="1.6">
    <path d="M120 70 L200 40 L280 75 L340 130"/>
    <path d="M200 40 L215 130 L280 75"/>
    <path d="M215 130 L170 210 L120 260"/>
    <path d="M215 130 L260 205 L300 255"/>
  </g>
  <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
  <g fill="#EC4899"><circle cx="120" cy="70" r="5"/><circle cx="280" cy="75" r="5"/><circle cx="340" cy="130" r="5"/><circle cx="170" cy="210" r="5"/><circle cx="300" cy="255" r="5"/></g>
  <g fill="#22D3EE"><circle cx="200" cy="40" r="5.5"/><circle cx="215" cy="130" r="6.5"/><circle cx="120" cy="260" r="5"/><circle cx="260" cy="205" r="5"/></g>
</svg>

<div class="wrap">
  <div class="px">
    <div class="logo"><i class="fa-solid fa-circle-nodes"></i></div>
    <h1>Unison</h1>
    <p class="tag">Point your phone at rehearsal. Unison tracks every dancer's pose and shows exactly who's out of step, frame by frame.</p>
  </div>
  <div class="px" style="margin-top:34px">
    <a href="home.html" class="btn pri"><i class="fa-solid fa-user-plus"></i>Create a Team</a>
    <a href="home.html" class="btn sec"><i class="fa-solid fa-key"></i>Join with a Code</a>
    <div class="foot">Just exploring? <a href="home.html">Continue as guest</a></div>
  </div>
</div>
</div>
</body></html>
