<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--good:#34D399;--warn:#FBBF24;--off:#F87171;--cyan:#22D3EE;--brand:#A855F7;--brand2:#EC4899}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#04040A;color:#fff;font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#04040A}
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,10,.62) 0%,rgba(4,4,10,.05) 22%,rgba(4,4,10,.12) 55%,rgba(4,4,10,.94) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:5}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.hud{position:absolute;top:70px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.18)}
.chip{background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);padding:8px 14px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:1.3px;display:flex;align-items:center;gap:6px;color:#fff}
.recdot{width:7px;height:7px;border-radius:50%;background:var(--off);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.overlay{position:absolute;inset:0;z-index:3}
.ref{position:absolute;top:118px;right:22px;width:96px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.5);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);z-index:5}
.ref img{width:100%;height:120px;object-fit:cover;display:block}
.ref .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:1px;padding:4px 6px;text-align:center}
.ref .play{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#04040A;font-size:8px}
.syncbadge{position:absolute;top:118px;left:22px;z-index:5;background:rgba(10,10,20,.55);backdrop-filter:blur(14px);border:1px solid rgba(52,211,153,.45);border-radius:20px;padding:11px 16px;text-align:center;box-shadow:0 0 34px -10px rgba(52,211,153,.4)}
.syncbadge .lbl{font-size:9px;letter-spacing:1.6px;color:rgba(255,255,255,.6);font-weight:800;text-transform:uppercase}
.syncbadge .num{font-size:32px;font-weight:800;letter-spacing:-1.5px;color:var(--good);line-height:1.1}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(8,7,14,.75);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:16px 26px 30px}
.roster{display:flex;gap:8px;margin-bottom:14px}
.roster div{flex:1;text-align:center}
.roster .av{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;position:relative;border:2px solid rgba(255,255,255,.15)}
.roster .av i{position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;border-radius:50%;border:2px solid #0B0A13}
.roster s{text-decoration:none;font-size:9.5px;color:rgba(255,255,255,.55);font-weight:650}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:2px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-decoration:none}
.cbtn.end{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.5);color:var(--off)}
.recbtn{width:72px;height:72px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;text-decoration:none;box-shadow:0 0 0 6px rgba(248,113,113,.18),0 16px 30px -10px rgba(248,113,113,.5)}
.timer{position:absolute;top:122px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);padding:7px 14px;border-radius:14px;font-size:11px;font-weight:800;letter-spacing:1.2px;border:1px solid rgba(255,255,255,.14)}
</style></head><body>
<div class="screen">
  <div class="bg"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811799546-image-1.png" alt=""></div>
  <div class="scrim"></div>

  <svg class="overlay" viewBox="0 0 460 980" preserveAspectRatio="xMidYMid slice">
    <g stroke="#22D3EE" stroke-width="2.4" fill="#22D3EE" opacity=".92">
      <path d="M108 430 L108 500 M108 430 L80 470 M108 430 L138 468 M108 500 L92 570 M108 500 L126 568" stroke-linecap="round"/>
      <circle cx="108" cy="410" r="9" fill="none" stroke-width="2.4"/>
    </g>
    <g stroke="#34D399" stroke-width="2.4" fill="#34D399" opacity=".95">
      <path d="M210 380 L210 460 M210 380 L178 420 M210 380 L244 418 M210 460 L190 540 M210 460 L232 540" stroke-linecap="round"/>
      <circle cx="210" cy="358" r="9" fill="none" stroke-width="2.4"/>
    </g>
    <g stroke="#FBBF24" stroke-width="2.4" fill="#FBBF24" opacity=".95">
      <path d="M320 400 L316 478 M320 400 L354 358 M320 400 L288 436 M316 478 L296 556 M316 478 L340 552" stroke-linecap="round"/>
      <circle cx="320" cy="378" r="9" fill="none" stroke-width="2.4"/>
    </g>
    <g stroke="#F87171" stroke-width="2.4" fill="#F87171" opacity=".95">
      <path d="M395 440 L392 512 M395 440 L426 480 M395 440 L364 470 M392 512 L372 584 M392 512 L412 582" stroke-linecap="round"/>
      <circle cx="395" cy="418" r="9" fill="none" stroke-width="2.4"/>
    </g>
  </svg>

  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="hud">
    <a href="home.html" class="hbtn"><i class="fa-solid fa-xmark"></i></a>
    <div class="chip"><span class="recdot"></span>00:42</div>
    <a href="record.html" class="hbtn"><i class="fa-solid fa-camera-rotate"></i></a>
  </div>
  <div class="timer">RISE &amp; FALL</div>

  <div class="syncbadge">
    <div class="lbl"><i class="fa-solid fa-circle-nodes"></i> Live sync</div>
    <div class="num">88%</div>
  </div>

  <div class="ref">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811820666-image-1.png" alt="">
    <div class="play"><i class="fa-solid fa-play"></i></div>
    <div class="lbl">REFERENCE</div>
  </div>

  <div class="panel">
    <div class="roster">
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811817854-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Priya</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819685-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Diego</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818010-image-1.png) center/cover"><i style="background:var(--warn)"></i></div><s>Naomi</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819328-image-1.png) center/cover"><i style="background:var(--off)"></i></div><s>Kofi</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818671-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Maya</s></div>
    </div>
    <div class="ctrls">
      <a href="record.html" class="cbtn"><i class="fa-solid fa-music"></i></a>
      <a href="analysis.html" class="recbtn"><i class="fa-solid fa-stop"></i></a>
      <a href="home.html" class="cbtn end"><i class="fa-solid fa-xmark"></i></a>
    </div>
  </div>
</div>
</body></html>
