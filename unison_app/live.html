<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--good:#34D399;--warn:#FBBF24;--off:#F87171;--cyan:#22D3EE;--brand:#A855F7;--brand2:#EC4899}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:#020103;color:#fff;font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#020103}
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover;opacity:.8}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,1,3,.7) 0%,rgba(2,1,3,.2) 30%,rgba(2,1,3,.3) 55%,rgba(2,1,3,.96) 100%)}
.sb{position:absolute;top:0;left:0;right:0;height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;z-index:5}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.hud{position:absolute;top:70px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.18)}
.chip{background:rgba(168,85,247,.22);backdrop-filter:blur(10px);border:1px solid rgba(168,85,247,.5);padding:8px 14px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:1.3px;display:flex;align-items:center;gap:6px;color:#fff}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);z-index:5;text-align:center}
.center .lbl{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.6);font-weight:800;text-transform:uppercase}
.center .num{font-size:88px;font-weight:800;letter-spacing:-4px;line-height:1;margin-top:4px;background:linear-gradient(135deg,#A855F7,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.center .sub{font-size:12.5px;color:rgba(255,255,255,.65);font-weight:600;margin-top:6px}
.tracked{position:absolute;top:130px;left:50%;transform:translateX(-50%);z-index:5;font-size:11px;color:rgba(255,255,255,.55);font-weight:650;display:flex;align-items:center;gap:6px}
.tracked .d{width:6px;height:6px;border-radius:50%;background:var(--good);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.overlay{position:absolute;inset:0;z-index:3}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(6,5,10,.78);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:16px 26px 30px}
.roster{display:flex;gap:8px;margin-bottom:14px}
.roster div{flex:1;text-align:center}
.roster .av{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;position:relative}
.roster .av i{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;border:2px solid #06050A}
.roster s{text-decoration:none;font-size:9.5px;color:rgba(255,255,255,.55);font-weight:650}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:2px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-decoration:none}
.cbtn.on{background:rgba(168,85,247,.28);border-color:rgba(168,85,247,.6);color:var(--brand)}
.endbtn{width:72px;height:72px;border-radius:50%;background:rgba(248,113,113,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;text-decoration:none;box-shadow:0 16px 30px -10px rgba(248,113,113,.5)}
</style></head><body>
<div class="screen">
  <div class="bg"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811799353-image-1.png" alt=""></div>
  <div class="scrim"></div>

  <svg class="overlay" viewBox="0 0 460 980" preserveAspectRatio="xMidYMid slice">
    <g stroke="#34D399" stroke-width="2" fill="#34D399" opacity=".85"><path d="M120 560 L120 630 M120 560 L96 596 M120 560 L146 594 M120 630 L104 700 M120 630 L138 700"/><circle cx="120" cy="540" r="8" fill="none" stroke-width="2"/></g>
    <g stroke="#34D399" stroke-width="2" fill="#34D399" opacity=".85"><path d="M205 540 L205 610 M205 540 L180 578 M205 540 L232 576 M205 610 L188 682 M205 610 L224 680" /><circle cx="205" cy="520" r="8" fill="none" stroke-width="2"/></g>
    <g stroke="#FBBF24" stroke-width="2" fill="#FBBF24" opacity=".9"><path d="M290 555 L286 622 M290 555 L318 590 M290 555 L262 588 M286 622 L268 692 M286 622 L306 690"/><circle cx="290" cy="534" r="8" fill="none" stroke-width="2"/></g>
    <g stroke="#F87171" stroke-width="2" fill="#F87171" opacity=".92"><path d="M355 565 L350 635 M355 565 L380 602 M355 565 L326 600 M350 635 L332 705 M350 635 L370 700"/><circle cx="355" cy="544" r="8" fill="none" stroke-width="2"/></g>
  </svg>

  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="hud">
    <a href="home.html" class="hbtn"><i class="fa-solid fa-xmark"></i></a>
    <div class="chip"><i class="fa-solid fa-bolt" style="font-size:9px"></i>LIVE MODE</div>
    <a href="live.html" class="hbtn"><i class="fa-solid fa-arrows-left-right"></i></a>
  </div>
  <div class="tracked"><span class="d"></span>4 of 6 dancers tracked</div>

  <div class="center">
    <div class="lbl">Sync right now</div>
    <div class="num">88%</div>
    <div class="sub">2 dancers drifting late</div>
  </div>

  <div class="panel">
    <div class="roster">
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811817854-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Priya</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819685-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Diego</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818010-image-1.png) center/cover"><i style="background:var(--warn)"></i></div><s>Naomi</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811819328-image-1.png) center/cover"><i style="background:var(--off)"></i></div><s>Kofi</s></div>
      <div><div class="av" style="background:url(https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818671-image-1.png) center/cover"><i style="background:var(--good)"></i></div><s>Maya</s></div>
    </div>
    <div class="ctrls">
      <a href="live.html" class="cbtn on"><i class="fa-solid fa-clone" style="font-size:14px"></i></a>
      <a href="live.html" class="endbtn"><i class="fa-solid fa-pause"></i></a>
      <a href="home.html" class="cbtn"><i class="fa-solid fa-music"></i></a>
    </div>
  </div>
</div>
</body></html>
