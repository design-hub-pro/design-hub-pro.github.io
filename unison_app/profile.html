<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unison</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
:root{--bg:#0B0A13;--card:#171526;--card2:#1E1B33;--border:rgba(255,255,255,.09);--ink:#F5F3FF;--muted:#8E88A8;--brand:#A855F7;--brand2:#EC4899;--good:#34D399;--cyan:#22D3EE;--off:#F87171}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.body{height:100%;overflow-y:auto;padding-bottom:50px}
.sb{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.sb .t{font-size:15px;font-weight:600;padding-bottom:8px}
.sb .i{display:flex;gap:7px;align-items:center;font-size:13px;padding-bottom:9px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px}
.px{padding-left:28px;padding-right:28px}
.meta{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px}
.back{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;text-decoration:none}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.row:last-child{border-bottom:none}
.icn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--card2);color:var(--cyan)}
</style></head><body>
<div class="screen"><div class="body">
<div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></span></div>

<div class="px" style="margin:6px 0 6px"><a href="home.html" class="back"><i class="fa-solid fa-chevron-left"></i></a></div>

<div class="px" style="text-align:center;margin-top:10px">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1788811818671-image-1.png" style="width:88px;height:88px;border-radius:26px;object-fit:cover;box-shadow:0 18px 34px -16px rgba(0,0,0,.7)">
  <div style="font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:14px">Maya Sanchez</div>
  <div style="font-size:12.5px;color:var(--muted);margin-top:3px">Captain &middot; Velocity Crew</div>
</div>

<div class="px" style="margin-top:22px">
  <div class="card" style="padding:16px 8px;display:flex;text-align:center">
    <div style="flex:1"><div style="font-size:21px;font-weight:800;letter-spacing:-.6px">12</div><div style="font-size:10.5px;color:var(--muted);font-weight:650;margin-top:2px">sessions</div></div>
    <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:21px;font-weight:800;letter-spacing:-.6px;color:var(--good)">94%</div><div style="font-size:10.5px;color:var(--muted);font-weight:650;margin-top:2px">avg sync</div></div>
    <div style="flex:1"><div style="font-size:21px;font-weight:800;letter-spacing:-.6px">5</div><div style="font-size:10.5px;color:var(--muted);font-weight:650;margin-top:2px">week streak</div></div>
  </div>
</div>

<div class="px" style="margin-top:26px">
  <div class="meta" style="margin-bottom:10px">Settings</div>
  <div class="card" style="padding:2px 16px">
    <a href="profile.html" class="row"><div class="icn"><i class="fa-solid fa-bell"></i></div><span style="flex:1;font-size:14px;font-weight:650">Notifications</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
    <a href="profile.html" class="row"><div class="icn"><i class="fa-solid fa-video"></i></div><span style="flex:1;font-size:14px;font-weight:650">Camera &amp; Recording</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
    <a href="team.html" class="row"><div class="icn"><i class="fa-solid fa-users"></i></div><span style="flex:1;font-size:14px;font-weight:650">Team Settings</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
    <a href="routines.html" class="row"><div class="icn"><i class="fa-solid fa-music"></i></div><span style="flex:1;font-size:14px;font-weight:650">Reference Routines</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
    <a href="profile.html" class="row"><div class="icn" style="background:rgba(168,85,247,.15);color:var(--brand)"><i class="fa-solid fa-crown"></i></div><span style="flex:1;font-size:14px;font-weight:650">Plan &middot; Pro Team</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
  </div>
</div>

<div class="px" style="margin-top:20px">
  <div class="card" style="padding:2px 16px">
    <a href="profile.html" class="row"><div class="icn"><i class="fa-solid fa-circle-question"></i></div><span style="flex:1;font-size:14px;font-weight:650">Help &amp; Support</span><i class="fa-solid fa-chevron-right" style="font-size:11px;color:#54506E"></i></a>
    <a href="onboarding.html" class="row"><div class="icn" style="background:rgba(248,113,113,.15);color:var(--off)"><i class="fa-solid fa-right-from-bracket"></i></div><span style="flex:1;font-size:14px;font-weight:650;color:var(--off)">Log Out</span></a>
  </div>
</div>

</div></div>
</body></html>
