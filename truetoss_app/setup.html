<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Session Setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
.iconbtn{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(18,32,26,0.06);display:flex;align-items:center;justify-content:center;color:#12201A}
.diagram{border-radius:24px;background:#123524;padding:22px;position:relative;overflow:hidden}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:14px;background:#F0F1EA;display:flex;align-items:center;justify-content:center;font-weight:700;color:#123524}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-1">
      <div class="iconbtn"><i class="fas fa-xmark"></i></div>
      <h1 class="head text-[17px] font-bold">New Session</h1>
      <div class="iconbtn"><i class="far fa-clock"></i></div>
    </div>

    <p class="text-[11px] font-bold uppercase tracking-wider muted mt-5 mb-2">Serve type</p>
    <div class="seg">
      <div class="active">Flat</div>
      <div>Slice</div>
    </div>

    <p class="text-[11px] font-bold uppercase tracking-wider muted mt-5 mb-2">Target</p>
    <div class="seg">
      <div class="active">T</div>
      <div>Wide</div>
    </div>

    <p class="text-[11px] font-bold uppercase tracking-wider muted mt-6 mb-2">Ideal toss window</p>
    <div class="diagram">
      <svg viewBox="0 0 300 220" class="w-full h-[190px]">
        <line x1="150" y1="20" x2="150" y2="200" stroke="#2C4E3B" stroke-width="2" stroke-dasharray="4 6"/>
        <ellipse cx="150" cy="46" rx="46" ry="26" fill="#D4FF4F" opacity="0.16"/>
        <ellipse cx="150" cy="46" rx="46" ry="26" fill="none" stroke="#D4FF4F" stroke-width="1.5" stroke-dasharray="3 5"/>
        <circle cx="150" cy="40" r="9" fill="#D4FF4F"/>
        <path d="M150 40 C150 70 150 100 150 130" stroke="#D4FF4F" stroke-width="3" stroke-linecap="round"/>
        <g stroke="#3E6650" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M150 130 L150 178"/>
          <path d="M150 178 L134 214"/>
          <path d="M150 178 L166 214"/>
          <path d="M150 138 L118 118"/>
          <path d="M150 138 L182 96"/>
        </g>
        <circle cx="150" cy="122" r="10" fill="#3E6650"/>
        <text x="150" y="18" text-anchor="middle" fill="#8FE23E" font-size="10" font-weight="700" font-family="Space Grotesk">RELEASE ZONE</text>
        <text x="150" y="212" text-anchor="middle" fill="#7C9285" font-size="9" font-weight="600" font-family="Space Grotesk">+34cm above reach · 6cm forward</text>
      </svg>
    </div>

    <p class="text-[11px] font-bold uppercase tracking-wider muted mt-6 mb-2">Reps</p>
    <div class="stepper">
      <button><i class="fas fa-minus text-xs"></i></button>
      <span class="text-[20px] font-extrabold head">8 reps</span>
      <button><i class="fas fa-plus text-xs"></i></button>
    </div>

    <div class="flex items-center justify-between mt-5">
      <span class="text-[13px] font-semibold muted">Dominant hand</span>
      <div class="flex gap-2">
        <span class="chip bg-court text-[#D4FF4F]">Right</span>
        <span class="chip" style="background:#EEEFE7;color:#78857D">Left</span>
      </div>
    </div>
  </div>
  <div class="tab-bar" style="background:#F5F6F1;border-top:none">
    <button class="btn-primary w-full h-14 text-[15px]"><i class="fas fa-video"></i>Start Capture</button>
  </div>
</div>
</body>
</html>
