<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
body{background:#0A100C}
.cam{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=900&q=80') center/cover;}
.cam::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,9,0.55) 0%,rgba(6,12,9,0.05) 22%,rgba(6,12,9,0.1) 65%,rgba(6,12,9,0.75) 100%)}
.overlay-svg{position:absolute;inset:0;z-index:3}
.top-row{position:relative;z-index:4;padding:14px 20px 0}
.pill{background:rgba(12,20,15,0.55);backdrop-filter:blur(10px);color:#fff}
.fault{position:absolute;left:20px;right:20px;top:150px;z-index:4;background:rgba(229,72,77,0.16);border:1px solid rgba(229,72,77,0.5);color:#FF9EA1;border-radius:16px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.bottombar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 24px 34px;display:flex;align-items:center;justify-content:space-between}
.rec{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.rec span{width:60px;height:60px;border-radius:16px;background:#E5484D}
.lastclip{width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,0.8);background:url('https://images.unsplash.com/photo-1560012057-4372e14c5085?w=200&q=70') center/cover}
.flip{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;color:#fff}
</style>
</head>
<body>
<div class="screen" style="background:#0A100C">
  <div class="cam"></div>
  <svg class="overlay-svg" viewBox="0 0 460 862" preserveAspectRatio="none">
    <line x1="215" y1="562" x2="228" y2="90" stroke="#D4FF4F" stroke-width="2" stroke-dasharray="3 7" opacity="0.85"/>
    <path d="M215 562 C300 480, 320 360, 260 300 S 232 290, 232 268" stroke="#E5484D" stroke-width="3" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/>
    <g stroke="#D4FF4F" stroke-width="4" stroke-linecap="round">
      <line x1="214" y1="400" x2="225" y2="445"/>
      <line x1="225" y1="445" x2="233" y2="360"/>
      <line x1="233" y1="360" x2="232" y2="268"/>
      <line x1="214" y1="400" x2="200" y2="455"/>
      <line x1="200" y1="455" x2="178" y2="500"/>
      <line x1="178" y1="500" x2="165" y2="545"/>
      <line x1="214" y1="400" x2="215" y2="562"/>
    </g>
    <circle cx="214" cy="400" r="12" fill="#0A100C" stroke="#D4FF4F" stroke-width="3"/>
    <circle cx="225" cy="445" r="6" fill="#D4FF4F"/>
    <circle cx="233" cy="360" r="6" fill="#D4FF4F"/>
    <circle cx="232" cy="268" r="8" fill="#fff" stroke="#E5484D" stroke-width="3"/>
    <circle cx="200" cy="455" r="6" fill="#D4FF4F"/>
    <circle cx="178" cy="500" r="6" fill="#D4FF4F"/>
    <circle cx="165" cy="545" r="6" fill="#D4FF4F"/>
    <circle cx="215" cy="562" r="6" fill="#D4FF4F"/>
  </svg>

  <div class="dynamic-island" style="z-index:5"></div>
  <div class="status-bar light" style="position:relative;z-index:5">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <div class="top-row flex items-center justify-between">
    <div class="pill chip"><i class="fas fa-xmark"></i></div>
    <div class="pill chip"><span class="dot" style="background:#E5484D"></span>Rep 3 of 8 · Flat · T</div>
    <div class="pill chip"><i class="fas fa-gauge"></i></div>
  </div>

  <div class="fault"><i class="fas fa-triangle-exclamation"></i>Arm looping outward — keep the wrist on the line</div>

  <div class="bottombar">
    <div class="lastclip"></div>
    <button class="rec"><span></span></button>
    <div class="flip"><i class="fas fa-camera-rotate"></i></div>
  </div>
</div>
</body>
</html>
