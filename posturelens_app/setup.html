<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureLens - Camera Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-y: auto; background: #F5F3FF; }

        @keyframes radar-pulse {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .radar-ring {
            position: absolute;
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid #6366F1;
            animation: radar-pulse 2s ease-out infinite;
        }
        .radar-ring:nth-child(2) { animation-delay: 0.5s; }
        .radar-ring:nth-child(3) { animation-delay: 1s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2 bg-white">
        <span class="text-sm font-semibold text-gray-900">9:41</span>
        <div class="w-32 h-8 bg-black rounded-full mx-auto" style="margin-top: 12px;"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-gray-900"></i>
            <i class="fas fa-wifi text-xs text-gray-900"></i>
            <i class="fas fa-battery-full text-xs text-gray-900"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-7 pt-2 pb-5">
        <div class="flex items-center justify-between mb-1">
            <i class="fas fa-arrow-left text-gray-600"></i>
            <p class="text-sm font-semibold text-gray-900">Camera Setup</p>
            <span class="text-xs text-indigo-500 font-medium">Skip</span>
        </div>
    </div>

    <!-- Progress Steps -->
    <div class="px-7 py-4 bg-white">
        <div class="flex items-center gap-2">
            <div class="flex-1 h-1.5 bg-indigo-500 rounded-full"></div>
            <div class="flex-1 h-1.5 bg-indigo-500 rounded-full"></div>
            <div class="flex-1 h-1.5 bg-gray-200 rounded-full"></div>
        </div>
        <p class="text-xs text-gray-400 mt-2 text-center">Step 2 of 3</p>
    </div>

    <!-- Main Content -->
    <div class="px-7 pt-6 pb-8">
        <!-- Scanning Animation -->
        <div class="flex flex-col items-center mb-8">
            <div class="relative w-40 h-40 flex items-center justify-center mb-6">
                <div class="radar-ring"></div>
                <div class="radar-ring"></div>
                <div class="radar-ring"></div>
                <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl flex items-center justify-center z-10">
                    <i class="fas fa-camera text-white text-2xl"></i>
                </div>
            </div>
            <h2 class="text-lg font-bold text-gray-900 mb-1">Scanning for Camera...</h2>
            <p class="text-xs text-gray-400 text-center">Make sure your PostureLens camera is powered on and nearby</p>
        </div>

        <!-- Found Device -->
        <div class="bg-white rounded-2xl border-2 border-indigo-200 p-4 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-video text-indigo-500"></i>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900 text-sm">PostureLens Cam v2</p>
                    <p class="text-[10px] text-gray-400">SN: PL-2026-A4F2</p>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                    <span class="text-xs text-green-600 font-medium">Found</span>
                </div>
            </div>
        </div>

        <!-- Placement Guide -->
        <div class="bg-white rounded-2xl p-4 mb-6">
            <p class="font-semibold text-gray-900 text-sm mb-3">Placement Guide</p>
            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-check text-green-500 text-xs"></i>
                    </div>
                    <p class="text-xs text-gray-600">Place on desk, facing your chair</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-check text-green-500 text-xs"></i>
                    </div>
                    <p class="text-xs text-gray-600">2–4 ft away at eye level</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-check text-green-500 text-xs"></i>
                    </div>
                    <p class="text-xs text-gray-600">Good lighting, avoid backlight</p>
                </div>
            </div>
        </div>

        <!-- Connect Button -->
        <button class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl py-4 flex items-center justify-center gap-2">
            <span class="font-bold text-white">Connect Camera</span>
            <i class="fas fa-link text-white/70 text-sm"></i>
        </button>
    </div>
</body>
</html>
