<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureLens - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #4F46E5 0%, #7C3AED 50%, #9333EA 100%); }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }
        .spine-icon {
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.12);
            border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div style="height: 59px; padding: 0 28px;" class="flex items-end justify-between pb-2">
        <span class="text-sm font-semibold text-white/80">9:41</span>
        <div class="w-32 h-8 bg-black/30 rounded-full mx-auto" style="margin-top: 12px;"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs text-white/80"></i>
            <i class="fas fa-wifi text-xs text-white/80"></i>
            <i class="fas fa-battery-full text-xs text-white/80"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col items-center justify-center px-10" style="height: calc(100% - 59px);">
        <!-- Hero Icon -->
        <div class="spine-icon float-anim mb-10">
            <svg width="70" height="70" viewBox="0 0 70 70" fill="none">
                <!-- Camera lens -->
                <circle cx="35" cy="28" r="18" stroke="white" stroke-width="2.5" fill="none"/>
                <circle cx="35" cy="28" r="10" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.1)"/>
                <circle cx="35" cy="28" r="4" fill="white" opacity="0.8"/>
                <!-- Spine wave below -->
                <path d="M35 48 Q30 53 35 58 Q40 63 35 68" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Small dots -->
                <circle cx="35" cy="48" r="2" fill="white"/>
                <circle cx="35" cy="68" r="2" fill="white"/>
            </svg>
        </div>

        <!-- Text -->
        <h1 class="text-3xl font-extrabold text-white text-center mb-3">PostureLens</h1>
        <p class="text-base text-white/60 text-center leading-relaxed mb-12">Smart camera meets AI to keep your posture perfect while you study</p>

        <!-- Feature dots -->
        <div class="flex items-center gap-8 mb-14">
            <div class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-white/15 rounded-2xl flex items-center justify-center backdrop-blur">
                    <i class="fas fa-video text-white text-sm"></i>
                </div>
                <span class="text-[10px] text-white/50">Detect</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-white/15 rounded-2xl flex items-center justify-center backdrop-blur">
                    <i class="fas fa-chart-simple text-white text-sm"></i>
                </div>
                <span class="text-[10px] text-white/50">Track</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 bg-white/15 rounded-2xl flex items-center justify-center backdrop-blur">
                    <i class="fas fa-dumbbell text-white text-sm"></i>
                </div>
                <span class="text-[10px] text-white/50">Improve</span>
            </div>
        </div>

        <!-- CTA Button -->
        <button class="w-full bg-white rounded-2xl py-4 flex items-center justify-center gap-2 mb-4">
            <span class="font-bold text-indigo-600">Get Started</span>
            <i class="fas fa-arrow-right text-indigo-600 text-sm"></i>
        </button>
        <p class="text-xs text-white/40">Already have an account? <span class="text-white/70 font-medium">Sign In</span></p>
    </div>
</body>
</html>
