<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureLens - Smart Posture Companion App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a2e;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.1) inset;
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: white;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-items: center;
            max-width: 1560px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="text-center pt-16 pb-12 px-6">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center">
                <i class="fas fa-eye text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-4xl font-extrabold text-gray-900 mb-3">PostureLens</h1>
        <p class="text-lg text-gray-500 max-w-xl mx-auto">Smart camera companion that detects sitting posture, tracks habits, and guides exercises for healthier study sessions</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="px-8 pb-20">
        <div class="screens-grid">
            <!-- Screen 1: Onboarding -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="onboarding.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Onboarding</p>
            </div>

            <!-- Screen 2: Camera Setup -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="setup.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Camera Setup</p>
            </div>

            <!-- Screen 3: Home Dashboard -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Dashboard</p>
            </div>

            <!-- Screen 4: Live Monitor -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="monitor.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Live Monitor</p>
            </div>

            <!-- Screen 5: Analytics -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="analytics.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Analytics</p>
            </div>

            <!-- Screen 6: Exercise Plan -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="exercises.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Exercise Plan</p>
            </div>

            <!-- Screen 7: Profile -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm font-semibold text-gray-700 mt-4">Profile & Settings</p>
            </div>
        </div>
    </div>
</body>
</html>
