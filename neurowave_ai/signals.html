<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=460, initial-scale=1.0">
    <title>Signals - NeuroWave AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 460px; height: 980px; overflow-x: hidden; background: #f8fafc; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        @keyframes wave-flow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50px); }
        }
        .live-dot { animation: blink 1.5s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
</head>
<body class="relative">
    <!-- Status Bar -->
    <div class="px-7 pt-3 pb-2 flex justify-between items-center text-base font-medium" style="height: 59px;">
        <span>9:41</span>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[34px] bg-black rounded-b-[20px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="px-7 pb-28 overflow-y-auto" style="height: 841px;">
        <!-- Title -->
        <div class="flex items-center justify-between mt-2 mb-5">
            <h1 class="text-2xl font-bold text-gray-900">Signal Analysis</h1>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-400 live-dot"></div>
                <span class="text-xs font-semibold text-green-600">LIVE</span>
            </div>
        </div>

        <!-- Time Filter Pills -->
        <div class="flex gap-2 mb-5">
            <button class="px-4 py-2 rounded-full text-xs font-semibold text-white" style="background: linear-gradient(135deg, #14B8A6, #0891B2);">Live</button>
            <button class="px-4 py-2 rounded-full text-xs font-semibold text-gray-500 bg-white border border-gray-200">1 Hour</button>
            <button class="px-4 py-2 rounded-full text-xs font-semibold text-gray-500 bg-white border border-gray-200">Today</button>
            <button class="px-4 py-2 rounded-full text-xs font-semibold text-gray-500 bg-white border border-gray-200">Week</button>
        </div>

        <!-- EEG Waveform Card -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-gray-900">EEG Channels</h3>
                <span class="text-xs text-gray-400">Real-time</span>
            </div>
            <svg width="100%" height="200" viewBox="0 0 370 200" class="overflow-visible">
                <!-- Channel labels -->
                <text x="0" y="35" fill="#14B8A6" font-size="10" font-weight="600">C3</text>
                <text x="0" y="85" fill="#0891B2" font-size="10" font-weight="600">C4</text>
                <text x="0" y="135" fill="#8b5cf6" font-size="10" font-weight="600">Cz</text>
                <text x="0" y="185" fill="#f59e0b" font-size="10" font-weight="600">Fz</text>
                <!-- Grid lines -->
                <line x1="25" y1="30" x2="370" y2="30" stroke="#f1f5f9" stroke-width="1"/>
                <line x1="25" y1="80" x2="370" y2="80" stroke="#f1f5f9" stroke-width="1"/>
                <line x1="25" y1="130" x2="370" y2="130" stroke="#f1f5f9" stroke-width="1"/>
                <line x1="25" y1="180" x2="370" y2="180" stroke="#f1f5f9" stroke-width="1"/>
                <!-- C3 Channel -->
                <path d="M25,30 Q40,15 55,30 Q70,45 85,25 Q100,5 115,30 Q130,55 145,20 Q160,0 175,30 Q190,50 205,25 Q220,10 235,35 Q250,55 265,20 Q280,0 295,30 Q310,50 325,25 Q340,10 355,30 Q370,45 370,30" fill="none" stroke="#14B8A6" stroke-width="2"/>
                <!-- C4 Channel -->
                <path d="M25,80 Q40,65 55,85 Q70,95 85,75 Q100,60 115,80 Q130,100 145,70 Q160,55 175,85 Q190,95 205,75 Q220,60 235,80 Q250,100 265,70 Q280,55 295,85 Q310,100 325,75 Q340,60 355,80" fill="none" stroke="#0891B2" stroke-width="2"/>
                <!-- Cz Channel -->
                <path d="M25,130 Q40,120 55,135 Q70,145 85,125 Q100,110 115,130 Q130,150 145,125 Q160,108 175,130 Q190,148 205,125 Q220,115 235,135 Q250,150 265,120 Q280,108 295,130 Q310,148 325,125 Q340,108 355,132" fill="none" stroke="#8b5cf6" stroke-width="2"/>
                <!-- Fz Channel -->
                <path d="M25,180 Q40,170 55,182 Q70,190 85,175 Q100,165 115,180 Q130,195 145,178 Q160,162 175,182 Q190,192 205,178 Q220,165 235,180 Q250,195 265,172 Q280,160 295,182 Q310,195 325,175 Q340,162 355,180" fill="none" stroke="#f59e0b" stroke-width="2"/>
            </svg>
        </div>

        <!-- Channel Power -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
            <h3 class="font-bold text-gray-900 mb-4">Channel Power</h3>
            <!-- Alpha -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1.5">
                    <div>
                        <span class="text-sm font-semibold text-gray-800">Alpha</span>
                        <span class="text-xs text-gray-400 ml-1">8-12 Hz</span>
                    </div>
                    <span class="text-sm font-bold text-teal-600">68%</span>
                </div>
                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full" style="width: 68%; background: linear-gradient(90deg, #14B8A6, #0891B2);"></div>
                </div>
            </div>
            <!-- Beta -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1.5">
                    <div>
                        <span class="text-sm font-semibold text-gray-800">Beta</span>
                        <span class="text-xs text-gray-400 ml-1">13-30 Hz</span>
                    </div>
                    <span class="text-sm font-bold text-purple-500">54%</span>
                </div>
                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-purple-500" style="width: 54%;"></div>
                </div>
            </div>
            <!-- Theta -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1.5">
                    <div>
                        <span class="text-sm font-semibold text-gray-800">Theta</span>
                        <span class="text-xs text-gray-400 ml-1">4-7 Hz</span>
                    </div>
                    <span class="text-sm font-bold text-amber-500">42%</span>
                </div>
                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-amber-400" style="width: 42%;"></div>
                </div>
            </div>
            <!-- Gamma -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <div>
                        <span class="text-sm font-semibold text-gray-800">Gamma</span>
                        <span class="text-xs text-gray-400 ml-1">30-100 Hz</span>
                    </div>
                    <span class="text-sm font-bold text-rose-500">23%</span>
                </div>
                <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-rose-400" style="width: 23%;"></div>
                </div>
            </div>
        </div>

        <!-- Spatial Map -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
            <h3 class="font-bold text-gray-900 mb-4">Spatial Map</h3>
            <div class="flex justify-center">
                <svg width="220" height="240" viewBox="0 0 220 240">
                    <!-- Head outline -->
                    <ellipse cx="110" cy="120" rx="85" ry="95" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                    <!-- Nose indicator -->
                    <path d="M110,25 L104,38 L116,38 Z" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                    <!-- Ears -->
                    <path d="M25,120 Q15,110 20,100 Q25,90 25,120" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                    <path d="M195,120 Q205,110 200,100 Q195,90 195,120" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                    <!-- Electrode positions with color intensity -->
                    <!-- Fz - frontal -->
                    <circle cx="110" cy="60" r="14" fill="#f59e0b" opacity="0.5"/>
                    <text x="110" y="64" text-anchor="middle" fill="white" font-size="9" font-weight="600">Fz</text>
                    <!-- C3 - left central (high activity) -->
                    <circle cx="60" cy="115" r="16" fill="#14B8A6" opacity="0.9"/>
                    <text x="60" y="119" text-anchor="middle" fill="white" font-size="9" font-weight="600">C3</text>
                    <!-- Cz - central -->
                    <circle cx="110" cy="115" r="14" fill="#8b5cf6" opacity="0.6"/>
                    <text x="110" y="119" text-anchor="middle" fill="white" font-size="9" font-weight="600">Cz</text>
                    <!-- C4 - right central (lower activity) -->
                    <circle cx="160" cy="115" r="14" fill="#0891B2" opacity="0.4"/>
                    <text x="160" y="119" text-anchor="middle" fill="white" font-size="9" font-weight="600">C4</text>
                    <!-- P3 - left parietal -->
                    <circle cx="75" cy="165" r="12" fill="#14B8A6" opacity="0.7"/>
                    <text x="75" y="169" text-anchor="middle" fill="white" font-size="9" font-weight="600">P3</text>
                    <!-- P4 - right parietal -->
                    <circle cx="145" cy="165" r="12" fill="#0891B2" opacity="0.3"/>
                    <text x="145" y="169" text-anchor="middle" fill="white" font-size="9" font-weight="600">P4</text>
                    <!-- Oz - occipital -->
                    <circle cx="110" cy="195" r="12" fill="#8b5cf6" opacity="0.35"/>
                    <text x="110" y="199" text-anchor="middle" fill="white" font-size="9" font-weight="600">Oz</text>
                    <!-- Legend -->
                    <text x="10" y="235" fill="#94a3b8" font-size="9">Low</text>
                    <rect x="30" y="227" width="60" height="8" rx="4" fill="url(#intensity-grad)"/>
                    <text x="95" y="235" fill="#94a3b8" font-size="9">High</text>
                    <defs>
                        <linearGradient id="intensity-grad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="#14B8A6" stop-opacity="1"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <!-- AI Prediction -->
        <div class="rounded-2xl p-5 mb-5 relative overflow-hidden" style="background: linear-gradient(135deg, #0891B2, #8b5cf6);">
            <div class="absolute top-0 right-0 w-32 h-32 rounded-full bg-white/10 -translate-y-10 translate-x-10"></div>
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
                    <i class="fas fa-robot text-white text-lg"></i>
                </div>
                <h3 class="font-bold text-white">AI Prediction</h3>
            </div>
            <p class="text-white/80 text-xs mb-1">Detected Motor Imagery Class</p>
            <p class="text-white text-xl font-extrabold mb-2">Right Hand Imagery</p>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-2 bg-white/20 rounded-full overflow-hidden">
                    <div class="h-full bg-white rounded-full" style="width: 92.3%;"></div>
                </div>
                <span class="text-white font-bold text-lg">92.3%</span>
            </div>
            <p class="text-white/60 text-xs mt-1">Confidence Score</p>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-gray-200" style="padding-bottom: 20px;">
        <div class="flex justify-around items-center pt-2 pb-1">
            <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-400">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="signals.html" class="flex flex-col items-center gap-0.5 text-teal-600">
                <i class="fas fa-wave-square text-lg"></i>
                <span class="text-[10px] font-semibold">Signals</span>
            </a>
            <a href="training.html" class="flex flex-col items-center gap-0.5 text-gray-400">
                <i class="fas fa-gamepad text-lg"></i>
                <span class="text-[10px] font-medium">Training</span>
            </a>
            <a href="insights.html" class="flex flex-col items-center gap-0.5 text-gray-400">
                <i class="fas fa-chart-line text-lg"></i>
                <span class="text-[10px] font-medium">Insights</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center gap-0.5 text-gray-400">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
