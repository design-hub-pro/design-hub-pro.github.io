<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HavenPulse — Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
  .screen { position: relative; width: 100%; height: 100%; background: #0B0B14; color: #F5F5F7; overflow: hidden; }
  .status-bar { height: 59px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; }
  .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 18px; z-index: 60; }
  .hero-photo { position: absolute; inset: 0; z-index: 1; }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
  .gradient-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,20,0.35) 0%, rgba(11,11,20,0.55) 45%, rgba(11,11,20,0.95) 75%, #0B0B14 100%); z-index: 2; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; pointer-events: none; }
  .pulse-ring { position: absolute; border-radius: 50%; border: 2px solid rgba(167,139,250,0.4); animation: pulse 3s ease-out infinite; }
  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .grain { position:absolute; inset:0; opacity:0.05; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>'); z-index: 3; pointer-events:none; }
</style>
</head>
<body>
<div class="screen">
  <!-- Background photo -->
  <div class="hero-photo">
    <img src="https://images.unsplash.com/photo-1581579438747-1dc8d17bbce4?auto=format&fit=crop&w=900&q=80" alt="Elder" />
  </div>
  <div class="gradient-overlay"></div>
  <div class="grain"></div>

  <!-- Floating blobs -->
  <div class="blob" style="width:240px; height:240px; background:#7C3AED; top:-60px; right:-60px;"></div>
  <div class="blob" style="width:220px; height:220px; background:#F59E0B; bottom:-40px; left:-40px;"></div>

  <!-- Status bar -->
  <div class="dynamic-island"></div>
  <div class="status-bar relative z-10">
    <span>9:41</span>
    <span class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-xs"></i>
    </span>
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col h-[calc(100%-59px)] px-7">

    <!-- Logo lockup -->
    <div class="flex items-center gap-3 mt-2">
      <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg,#A78BFA 0%,#7C3AED 50%,#5B21B6 100%); box-shadow: 0 8px 24px rgba(124,58,237,0.5);">
        <i class="fas fa-shield-heart text-white text-lg"></i>
      </div>
      <div>
        <div class="text-base font-bold tracking-tight">HavenPulse AI</div>
        <div class="text-[11px] text-violet-300/70 -mt-0.5">v 2.4 · Family Edition</div>
      </div>
    </div>

    <!-- Center pulse visual -->
    <div class="flex-1 flex items-center justify-center relative">
      <div class="pulse-ring" style="width:240px; height:240px;"></div>
      <div class="pulse-ring" style="width:240px; height:240px; animation-delay:1s;"></div>
      <div class="pulse-ring" style="width:240px; height:240px; animation-delay:2s;"></div>

      <div class="relative w-44 h-44 rounded-full overflow-hidden ring-4 ring-white/20 shadow-2xl" style="box-shadow: 0 30px 80px rgba(124,58,237,0.5);">
        <img src="https://images.unsplash.com/photo-1605708569586-f8e6562ce040?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover" alt="Mom" />
        <div class="absolute inset-0 bg-gradient-to-t from-violet-900/40 to-transparent"></div>
      </div>

      <div class="absolute -bottom-2 right-8 bg-emerald-500/90 backdrop-blur px-3 py-1.5 rounded-full text-[11px] font-semibold flex items-center gap-1.5 shadow-lg">
        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
        Mom · Safe
      </div>
    </div>

    <!-- Bottom content -->
    <div class="pb-10">
      <div class="text-[11px] tracking-[0.2em] text-violet-300/80 font-semibold mb-3">AI BEHAVIOR GUARDIAN</div>
      <h1 class="text-[34px] font-extrabold leading-[1.05] tracking-tight">
        Know when<br/>something<br/><span class="bg-gradient-to-r from-violet-300 to-amber-200 bg-clip-text text-transparent">feels off.</span>
      </h1>
      <p class="text-sm text-white/60 mt-4 leading-relaxed pr-4">
        Personalized baselines from Apple Health, smart bands &amp; ambient cameras — predicting risk before incidents happen.
      </p>

      <div class="flex items-center gap-3 mt-7">
        <button class="flex-1 h-14 rounded-2xl text-sm font-bold text-white" style="background: linear-gradient(135deg,#7C3AED,#A78BFA); box-shadow: 0 12px 28px rgba(124,58,237,0.45);">
          Get started <i class="fas fa-arrow-right ml-1.5"></i>
        </button>
        <button class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center border border-white/15">
          <i class="fas fa-circle-play text-white text-lg"></i>
        </button>
      </div>

      <div class="text-center text-[11px] text-white/40 mt-5">
        Already a caregiver? <span class="text-violet-300 font-semibold">Sign in</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
