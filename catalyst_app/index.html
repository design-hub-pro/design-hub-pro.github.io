<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalyst</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
body{background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
.phone{width:460px;height:980px;background:#16181d;border-radius:62px;padding:12px;box-shadow:0 30px 60px -20px rgba(11,18,32,.3),0 0 0 2px rgba(0,0,0,.06)}
.phone iframe{width:100%;height:100%;border:none;border-radius:52px;background:#fff;display:block}
.grid-phones{display:grid;grid-template-columns:repeat(1,460px);gap:48px;justify-content:center}
@media (min-width:1040px){.grid-phones{grid-template-columns:repeat(2,460px)}}
@media (min-width:1540px){.grid-phones{grid-template-columns:repeat(3,460px)}}
</style>
</head>
<body>
<div class="max-w-[1500px] mx-auto px-8 py-16">

  <div class="flex flex-col items-center text-center mb-14">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center shadow-xl shadow-emerald-500/25 mb-5">
      <i class="fas fa-bolt text-white text-2xl"></i>
    </div>
    <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight mb-3">Catalyst</h1>
    <p class="text-lg text-gray-500 mb-5">Every stock headline scored bullish or bearish, and what it means for your portfolio.</p>
    <div class="flex flex-wrap justify-center gap-2">
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Fintech</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">News Sentiment</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">AI</span>
      <span class="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full">Investing</span>
    </div>
  </div>

  <div class="grid-phones">
    <div class="phone"><iframe src="onboarding.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="story.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="briefing.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="radar.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="ticker.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="portfolio.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="calendar.html" scrolling="no"></iframe></div>
    <div class="phone"><iframe src="alerts.html" scrolling="no"></iframe></div>
  </div>

</div>
</body>
</html>
