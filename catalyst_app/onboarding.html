<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalyst · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen bg-white">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="flex-1 flex flex-col px-[28px] pb-10">
    <!-- Floating headline cards -->
    <div class="relative h-[400px] mt-4">
      <div class="absolute inset-x-6 top-10 bottom-6 rounded-[36px]" style="background:radial-gradient(circle at 50% 40%,#e3f7ef,#fff 70%)"></div>

      <div class="absolute left-0 top-6 w-[260px] card p-4 shadow-xl -rotate-[4deg]">
        <div class="flex items-center gap-2 mb-2">
          <span class="logo w-7 h-7 rounded-lg bg-[#76b900] text-[10px]">NV</span>
          <span class="text-[12px] font-bold text-[#6b7385]">18m ago</span>
          <span class="ml-auto text-[18px] font-extrabold bull num">+82</span>
        </div>
        <p class="text-[14px] font-bold leading-snug">AI capex guide raised by 22%</p>
      </div>

      <div class="absolute right-0 top-[132px] w-[250px] card p-4 shadow-xl rotate-[3deg]">
        <div class="flex items-center gap-2 mb-2">
          <span class="logo w-7 h-7 rounded-lg bg-black text-[13px]"><i class="fab fa-apple"></i></span>
          <span class="text-[12px] font-bold text-[#6b7385]">1h ago</span>
          <span class="ml-auto text-[18px] font-extrabold bear num">−61</span>
        </div>
        <p class="text-[14px] font-bold leading-snug">Supplier flags softer orders</p>
      </div>

      <div class="absolute left-4 top-[250px] w-[270px] rounded-[22px] overflow-hidden shadow-xl -rotate-[2deg] h-[120px]">
        <img src="https://images.unsplash.com/photo-1576086213369-97a306d36557?q=80&w=700&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
        <div class="absolute inset-0 bg-gradient-to-r from-black/80 to-black/10"></div>
        <div class="absolute inset-0 p-4 flex flex-col justify-between">
          <span class="chip bg-[#f59e0b] text-white py-1 w-fit text-[11px]"><i class="fas fa-flask text-[9px]"></i>FDA</span>
          <div class="flex items-end justify-between">
            <p class="text-white text-[14px] font-bold leading-snug">Phase 3 trial<br>meets main goal</p>
            <span class="bg-white rounded-lg px-2 py-1 text-[15px] font-extrabold bull num">+86</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Copy -->
    <div class="mt-4">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white mb-5 shadow-lg shadow-emerald-500/30" style="background:linear-gradient(135deg,#34d399,#0b7a54)"><i class="fas fa-bolt text-[24px]"></i></div>
      <h1 class="text-[34px] font-extrabold tracking-tight leading-[1.08]">Know what the news<br>means for your stocks.</h1>
      <p class="text-[16px] text-[#6b7385] mt-3">Every headline scored from −100 to +100, in seconds.</p>
    </div>

    <!-- Pager + CTA -->
    <div class="mt-auto">
      <div class="flex gap-2 mb-6">
        <span class="h-[6px] w-6 rounded-full bg-[#0b1220]"></span>
        <span class="h-[6px] w-[6px] rounded-full bg-[#d6d9e0]"></span>
        <span class="h-[6px] w-[6px] rounded-full bg-[#d6d9e0]"></span>
      </div>
      <button class="w-full h-[58px] rounded-2xl bg-[#0b1220] text-white text-[17px] font-semibold flex items-center justify-center gap-2">Connect your portfolio <i class="fas fa-arrow-right text-[14px]"></i></button>
      <p class="text-center text-[14px] text-[#6b7385] mt-4">or <span class="font-semibold text-[#0b1220]">pick stocks manually</span></p>
    </div>
  </div>
</div>
</body>
</html>
