<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalyst · Morning Brief</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="screen dark">
  <div class="dynamic-island"></div>
  <div class="status-bar text-white">
    <span class="text-[17px] font-semibold">9:41</span>
    <span class="flex items-center gap-2 text-[15px]"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
  </div>

  <div class="content" style="padding-bottom:40px">
    <div class="flex items-center justify-between pt-2 pb-4">
      <a href="home.html" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-chevron-down"></i></a>
      <p class="text-[15px] font-semibold">Morning Brief</p>
      <span class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-ellipsis"></i></span>
    </div>

    <!-- Video -->
    <div class="relative rounded-[26px] overflow-hidden h-[250px] mb-5">
      <img src="https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="">
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30"></div>
      <span class="absolute top-4 left-4 chip bg-[#e5484d] text-white py-1"><i class="fas fa-circle text-[6px]"></i>Chapter 2 of 5</span>
      <div class="absolute inset-0 flex items-center justify-center gap-10">
        <i class="fas fa-rotate-left text-white/80 text-[22px]"></i>
        <div class="w-[68px] h-[68px] rounded-full bg-white/25 backdrop-blur flex items-center justify-center"><i class="fas fa-pause text-white text-[24px]"></i></div>
        <i class="fas fa-rotate-right text-white/80 text-[22px]"></i>
      </div>
      <div class="absolute bottom-4 left-4 right-4">
        <p class="text-white text-[17px] font-bold mb-3">NVDA: AI capex guide raised</p>
        <div class="relative h-[5px] rounded-full bg-white/25">
          <div class="h-full rounded-full bg-white" style="width:38%"></div>
          <div class="absolute -top-[5px] w-[15px] h-[15px] rounded-full bg-white" style="left:calc(38% - 7px)"></div>
        </div>
        <div class="flex justify-between text-[11px] text-white/70 mt-2 mono"><span>1:13</span><span>3:12</span></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between mb-7">
      <div class="flex items-center">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=120&auto=format&fit=crop" class="w-8 h-8 rounded-full object-cover border-2 border-[#0b1220]" alt="">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=120&auto=format&fit=crop" class="w-8 h-8 rounded-full object-cover border-2 border-[#0b1220] -ml-2" alt="">
        <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=120&auto=format&fit=crop" class="w-8 h-8 rounded-full object-cover border-2 border-[#0b1220] -ml-2" alt="">
        <span class="text-[12px] text-white/60 ml-3">18.4k watched today</span>
      </div>
      <div class="flex gap-2">
        <span class="chip bg-white/10 text-white mono">1.5×</span>
        <span class="chip bg-white/10 text-white"><i class="fas fa-headphones"></i></span>
      </div>
    </div>

    <!-- Chapters -->
    <h2 class="text-[17px] font-bold mb-3">Chapters</h2>
    <div class="space-y-3">
      <div class="flex items-center gap-3 opacity-50">
        <div class="relative w-[84px] h-[56px] rounded-xl overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
          <i class="fas fa-check absolute inset-0 m-auto w-fit h-fit text-white"></i>
        </div>
        <div class="flex-1"><p class="text-[14px] font-semibold">Market open in 30 seconds</p><p class="text-[12px] text-white/50 mono">0:00 · 0:34</p></div>
      </div>
      <div class="flex items-center gap-3 bg-white/10 rounded-2xl p-2 -mx-2">
        <div class="relative w-[84px] h-[56px] rounded-xl overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
          <div class="absolute bottom-0 left-0 h-[3px] bg-white" style="width:40%"></div>
        </div>
        <div class="flex-1"><p class="text-[14px] font-semibold">NVDA capex guide</p><p class="text-[12px] text-white/50 mono">0:34 · 0:48</p></div>
        <span class="text-[15px] font-extrabold text-emerald-400 num pr-2">+82</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative w-[84px] h-[56px] rounded-xl overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1512054502232-10a0a035d672?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
        </div>
        <div class="flex-1"><p class="text-[14px] font-semibold">Apple supplier warning</p><p class="text-[12px] text-white/50 mono">1:22 · 0:41</p></div>
        <span class="text-[15px] font-extrabold text-[#ff7a7e] num pr-2">−61</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative w-[84px] h-[56px] rounded-xl overflow-hidden flex-shrink-0">
          <img src="https://images.unsplash.com/photo-1593941707882-a5bba14938c7?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover" alt="">
        </div>
        <div class="flex-1"><p class="text-[14px] font-semibold">Tesla deliveries beat</p><p class="text-[12px] text-white/50 mono">2:03 · 0:37</p></div>
        <span class="text-[15px] font-extrabold text-emerald-400 num pr-2">+54</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
