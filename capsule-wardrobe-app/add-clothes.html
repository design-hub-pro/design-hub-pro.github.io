<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣橱精灵 - 添加衣物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        accent: '#1A1A1A',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        body { background: #000; }
        @keyframes scan-line {
            0% { top: 15%; }
            50% { top: 75%; }
            100% { top: 15%; }
        }
        .scan-line {
            animation: scan-line 2.5s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .pulse-ring {
            animation: pulse-ring 2s ease-in-out infinite;
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fade-in-up 0.4s ease-out forwards;
        }
        .corner-bracket {
            position: absolute;
            width: 24px;
            height: 24px;
        }
        .corner-bracket.tl { top: 0; left: 0; border-top: 2.5px solid white; border-left: 2.5px solid white; border-radius: 4px 0 0 0; }
        .corner-bracket.tr { top: 0; right: 0; border-top: 2.5px solid white; border-right: 2.5px solid white; border-radius: 0 4px 0 0; }
        .corner-bracket.bl { bottom: 0; left: 0; border-bottom: 2.5px solid white; border-left: 2.5px solid white; border-radius: 0 0 0 4px; }
        .corner-bracket.br { bottom: 0; right: 0; border-bottom: 2.5px solid white; border-right: 2.5px solid white; border-radius: 0 0 4px 0; }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden">
    <!-- 模拟相机实时画面 (使用背景图模拟) -->
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&h=900&fit=crop"
             class="w-full h-full object-cover" style="filter: brightness(0.85);">
    </div>

    <!-- iOS 状态栏 -->
    <div class="relative z-10 px-6 py-2 flex justify-between items-center text-sm text-white">
        <span class="font-semibold">9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- 顶部导航 -->
    <div class="relative z-10 px-5 pt-2 pb-4 flex items-center justify-between">
        <button class="w-10 h-10 bg-black/30 backdrop-blur-md rounded-full flex items-center justify-center">
            <i class="fas fa-xmark text-white text-lg"></i>
        </button>
        <div class="bg-black/30 backdrop-blur-md rounded-full px-4 py-2 flex items-center gap-2">
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
            <span class="text-white text-sm font-medium">Live 识别中</span>
        </div>
        <button class="w-10 h-10 bg-black/30 backdrop-blur-md rounded-full flex items-center justify-center">
            <i class="fas fa-bolt text-yellow-400 text-lg"></i>
        </button>
    </div>

    <!-- 扫描区域 -->
    <div class="relative z-10 px-8 mt-4">
        <div class="relative aspect-[3/4] mx-auto max-w-[280px]">
            <!-- 四角标识框 -->
            <div class="corner-bracket tl"></div>
            <div class="corner-bracket tr"></div>
            <div class="corner-bracket bl"></div>
            <div class="corner-bracket br"></div>

            <!-- 扫描线 -->
            <div class="scan-line absolute left-2 right-2 h-0.5 bg-gradient-to-r from-transparent via-white to-transparent opacity-60"></div>

            <!-- AI 识别结果浮层 -->
            <div class="absolute top-[20%] left-[10%] fade-in-up" style="animation-delay: 0.5s;">
                <div class="bg-white/95 backdrop-blur-md rounded-xl px-3 py-2 shadow-lg">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-xs font-semibold text-gray-900">白色真丝衬衫</span>
                    </div>
                </div>
            </div>

            <div class="absolute top-[42%] right-[5%] fade-in-up" style="animation-delay: 1s;">
                <div class="bg-white/95 backdrop-blur-md rounded-xl px-3 py-2 shadow-lg">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-tag text-gray-400 text-xs"></i>
                        <span class="text-xs text-gray-600">上装 · 衬衫</span>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-[25%] left-[5%] fade-in-up" style="animation-delay: 1.5s;">
                <div class="bg-white/95 backdrop-blur-md rounded-xl px-3 py-2 shadow-lg">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-gray-100 border border-gray-200"></div>
                        <span class="text-xs text-gray-600">白色</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AI 实时识别信息卡片 -->
    <div class="relative z-10 px-5 mt-6">
        <div class="bg-white/95 backdrop-blur-xl rounded-2xl p-4 shadow-xl">
            <!-- 识别状态 -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wand-magic-sparkles text-white text-sm"></i>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900">AI 已识别</p>
                        <p class="text-xs text-gray-400">置信度 96%</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                    <span class="text-xs text-green-600 font-medium">实时</span>
                </div>
            </div>

            <!-- 识别详情 -->
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="bg-gray-50 rounded-xl p-2.5">
                    <p class="text-xs text-gray-400 mb-0.5">类型</p>
                    <p class="text-sm font-medium text-gray-900">衬衫 · 上装</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-2.5">
                    <p class="text-xs text-gray-400 mb-0.5">颜色</p>
                    <div class="flex items-center gap-1.5">
                        <div class="w-4 h-4 rounded-full bg-gray-100 border border-gray-200"></div>
                        <p class="text-sm font-medium text-gray-900">白色</p>
                    </div>
                </div>
                <div class="bg-gray-50 rounded-xl p-2.5">
                    <p class="text-xs text-gray-400 mb-0.5">材质</p>
                    <p class="text-sm font-medium text-gray-900">真丝</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-2.5">
                    <p class="text-xs text-gray-400 mb-0.5">风格</p>
                    <p class="text-sm font-medium text-gray-900">知性通勤</p>
                </div>
            </div>

            <!-- 可搭配提示 -->
            <div class="bg-gray-50 rounded-xl p-3 mb-3 flex items-center gap-2">
                <i class="fas fa-puzzle-piece text-gray-400 text-sm"></i>
                <p class="text-xs text-gray-500">可与衣橱中 <span class="font-semibold text-gray-900">12件单品</span> 搭配，生成 <span class="font-semibold text-gray-900">8套穿搭</span></p>
            </div>

            <!-- 操作按钮 -->
            <div class="flex gap-3">
                <button class="flex-1 border border-gray-200 text-gray-700 py-3 rounded-xl font-medium text-sm">
                    编辑详情
                </button>
                <button class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-medium text-sm">
                    <i class="fas fa-plus mr-1"></i>加入衣橱
                </button>
            </div>
        </div>
    </div>

    <!-- 底部提示 -->
    <div class="relative z-10 flex justify-center mt-4 pb-8">
        <p class="text-white/50 text-xs">将衣物对准画面，AI 自动识别 · 无需拍照</p>
    </div>
</body>
</html>
