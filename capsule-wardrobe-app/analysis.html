<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣橱精灵 - AI分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        accent: '#1A1A1A',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        body { background: #FFFFFF; }
        .progress-ring { transform: rotate(-90deg); }
    </style>
</head>
<body class="min-h-screen">
    <!-- iOS 状态栏 -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-sm">
        <span class="font-semibold">9:41</span>
        <div class="flex items-center gap-1">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="pb-24 px-5">
        <!-- 头部 -->
        <div class="pt-4 pb-4">
            <h1 class="text-2xl font-bold text-gray-900">AI 衣橱分析</h1>
            <p class="text-gray-400 text-sm mt-1">让你的衣橱更智能、更可持续</p>
        </div>

        <!-- 衣橱健康度 -->
        <div class="border border-gray-100 rounded-2xl p-5 mb-4">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-semibold text-gray-900 mb-1">衣橱健康度</h3>
                    <p class="text-sm text-gray-400">综合评估你的衣橱利用率</p>
                </div>
                <div class="relative">
                    <svg class="w-20 h-20 progress-ring">
                        <circle cx="40" cy="40" r="32" stroke="#F3F4F6" stroke-width="6" fill="none"/>
                        <circle cx="40" cy="40" r="32" stroke="#1A1A1A" stroke-width="6" fill="none"
                                stroke-dasharray="201" stroke-dashoffset="30" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-lg font-bold text-gray-900">85%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据分析卡片 -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="border border-gray-100 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-fire text-gray-700"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">48件</p>
                <p class="text-xs text-gray-400">高频使用单品</p>
                <p class="text-xs text-green-500 mt-1">占比77%</p>
            </div>
            <div class="border border-gray-100 rounded-2xl p-4">
                <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-snowflake text-gray-700"></i>
                </div>
                <p class="text-2xl font-bold text-gray-900">6件</p>
                <p class="text-xs text-gray-400">低频闲置单品</p>
                <p class="text-xs text-red-400 mt-1">建议优化</p>
            </div>
        </div>

        <!-- 优化建议 -->
        <div class="border border-gray-100 rounded-2xl p-4 mb-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-gray-900">智能优化建议</h3>
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">3条新建议</span>
            </div>

            <div class="flex items-start gap-3 mb-4 pb-4 border-b border-gray-100">
                <div class="w-12 h-12 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=100&h=100&fit=crop"
                         class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs bg-red-50 text-red-500 px-2 py-0.5 rounded-full">建议删减</span>
                    </div>
                    <p class="text-sm text-gray-900 font-medium">牛仔短裤</p>
                    <p class="text-xs text-gray-400">90天未穿着，与你的风格不符</p>
                </div>
                <button class="text-gray-900 text-sm font-medium">处理</button>
            </div>

            <div class="flex items-start gap-3 mb-4 pb-4 border-b border-gray-100">
                <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-plus text-gray-300"></i>
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs bg-green-50 text-green-600 px-2 py-0.5 rounded-full">建议添置</span>
                    </div>
                    <p class="text-sm text-gray-900 font-medium">基础款白T恤</p>
                    <p class="text-xs text-gray-400">可与12件单品搭配，提升衣橱灵活性</p>
                </div>
                <button class="text-gray-900 text-sm font-medium">查看</button>
            </div>

            <div class="flex items-start gap-3">
                <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-lightbulb text-gray-400"></i>
                </div>
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full">搭配建议</span>
                    </div>
                    <p class="text-sm text-gray-900 font-medium">驼色风衣新搭配</p>
                    <p class="text-xs text-gray-400">发现5种新搭配组合，提升使用率</p>
                </div>
                <button class="text-gray-900 text-sm font-medium">查看</button>
            </div>
        </div>

        <!-- 可持续时尚 -->
        <div class="bg-gray-50 rounded-2xl p-4">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center">
                    <i class="fas fa-leaf text-white"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-900">可持续时尚成就</h3>
                    <p class="text-xs text-gray-400">你正在为地球做贡献</p>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white rounded-xl p-3 text-center">
                    <p class="text-lg font-bold text-gray-900">89%</p>
                    <p class="text-xs text-gray-400">利用率</p>
                </div>
                <div class="bg-white rounded-xl p-3 text-center">
                    <p class="text-lg font-bold text-gray-900">12kg</p>
                    <p class="text-xs text-gray-400">减少碳排</p>
                </div>
                <div class="bg-white rounded-xl p-3 text-center">
                    <p class="text-lg font-bold text-gray-900">¥2.8k</p>
                    <p class="text-xs text-gray-400">节省开支</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center text-gray-300">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-xs">首页</span>
            </div>
            <div class="flex flex-col items-center text-gray-300">
                <i class="fas fa-shirt text-xl mb-1"></i>
                <span class="text-xs">衣橱</span>
            </div>
            <div class="relative -mt-6">
                <div class="w-14 h-14 bg-gray-900 rounded-full flex items-center justify-center shadow-lg">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center text-gray-300">
                <i class="fas fa-wand-magic-sparkles text-xl mb-1"></i>
                <span class="text-xs">搭配</span>
            </div>
            <div class="flex flex-col items-center text-gray-300">
                <i class="fas fa-user text-xl mb-1"></i>
                <span class="text-xs">我的</span>
            </div>
        </div>
        <div class="flex justify-center mt-2">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>
</body>
</html>
