<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathFocus AI - System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-violet-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-brain text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">MathFocus AI</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A soft EEG headband that reads a child's focus and rewards it inside the MathFocus AI math game.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Wearable</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">EEG</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">Neurofeedback</span>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">ADHD</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197354091-image-1.png" alt="MathFocus AI — "></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197353438-image-1.png" alt="MathFocus AI — child playing the math game while wearing the headband"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197383006-image-1.png" alt="MathFocus AI — the headband on a table with a ruler"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197355086-image-1.png" alt="MathFocus AI — headband and sensor pod worn at the back of the head"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197382670-image-1.png" alt="MathFocus AI — parent clicking the pod into the strap"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197354965-image-1.png" alt="MathFocus AI — signal path from forehead sensors to game and parent report"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197355500-image-1.png" alt="MathFocus AI — exploded view of the sensor pod"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792197397282-image-1.png" alt="MathFocus AI — bench test against a research EEG cap"></div>
        </div>
    </div>
</body>
</html>
