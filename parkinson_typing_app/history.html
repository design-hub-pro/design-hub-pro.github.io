<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar { display: none; }
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #FAFBFC;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="h-[59px] px-[28px] flex items-end pb-2 justify-between bg-white">
        <div class="font-semibold text-[17px]">9:41</div>
        <div class="w-[125px] h-[37px] bg-black rounded-[20px] absolute left-1/2 -translate-x-1/2 top-[12px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <div class="w-7 h-3.5 border border-black rounded-[4px] relative">
                <div class="absolute right-0.5 top-0.5 bottom-0.5 left-0.5 bg-black rounded-[2px]" style="width: 85%"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-[28px] pt-4 pb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Progress</h1>

        <!-- Time Filter -->
        <div class="flex gap-2 mb-6">
            <button class="px-4 py-2 bg-teal-500 text-white rounded-full text-sm font-medium">Week</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm">Month</button>
            <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm">Year</button>
        </div>

        <!-- Chart -->
        <div class="bg-gray-50 rounded-2xl p-4 relative h-40 mb-4">
            <!-- Y Axis Labels -->
            <div class="absolute left-0 top-2 bottom-8 flex flex-col justify-between text-xs text-gray-400">
                <span>100</span>
                <span>75</span>
                <span>50</span>
            </div>
            <!-- Chart Area -->
            <div class="ml-8 h-full flex items-end justify-between gap-2 pb-6">
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-200 rounded-t-lg" style="height: 65%"></div>
                    <span class="text-xs text-gray-400">Mon</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-300 rounded-t-lg" style="height: 72%"></div>
                    <span class="text-xs text-gray-400">Tue</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-300 rounded-t-lg" style="height: 70%"></div>
                    <span class="text-xs text-gray-400">Wed</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-400 rounded-t-lg" style="height: 78%"></div>
                    <span class="text-xs text-gray-400">Thu</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-400 rounded-t-lg" style="height: 75%"></div>
                    <span class="text-xs text-gray-400">Fri</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-teal-500 rounded-t-lg" style="height: 80%"></div>
                    <span class="text-xs text-gray-400">Sat</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-gradient-to-t from-teal-500 to-cyan-400 rounded-t-lg" style="height: 80%"></div>
                    <span class="text-xs text-teal-500 font-medium">Today</span>
                </div>
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="flex gap-3">
            <div class="flex-1 bg-green-50 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-green-600">+8%</p>
                <p class="text-gray-500 text-sm">This Week</p>
            </div>
            <div class="flex-1 bg-teal-50 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-teal-600">12</p>
                <p class="text-gray-500 text-sm">Tests Taken</p>
            </div>
            <div class="flex-1 bg-blue-50 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-blue-600">80</p>
                <p class="text-gray-500 text-sm">Avg Score</p>
            </div>
        </div>
    </div>

    <!-- Recent Tests -->
    <div class="px-[28px] pt-4 pb-32">
        <h2 class="font-semibold text-gray-900 mb-4">Recent Tests</h2>
        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-teal-400 to-cyan-400 rounded-xl flex items-center justify-center">
                        <span class="text-white font-bold">80</span>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">Today, 9:30 AM</p>
                        <p class="text-gray-400 text-sm">2 min test</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-teal-400 to-cyan-400 rounded-xl flex items-center justify-center">
                        <span class="text-white font-bold">77</span>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">Yesterday, 8:15 AM</p>
                        <p class="text-gray-400 text-sm">2 min test</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-teal-400 to-cyan-400 rounded-xl flex items-center justify-center">
                        <span class="text-white font-bold">75</span>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">Jan 26, 10:00 AM</p>
                        <p class="text-gray-400 text-sm">2 min test</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-8 py-4 pb-8">
        <div class="flex justify-around">
            <div class="flex flex-col items-center">
                <i class="fas fa-house text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-keyboard text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Test</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-simple text-teal-500 text-xl mb-1"></i>
                <span class="text-xs text-teal-500 font-medium">Progress</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-gear text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Settings</span>
            </div>
        </div>
    </div>
</body>
</html>
