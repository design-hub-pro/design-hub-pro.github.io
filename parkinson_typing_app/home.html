<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar { display: none; }
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #FAFBFC;
        }
        .score-ring {
            background: conic-gradient(#14B8A6 0deg 288deg, #E5E7EB 288deg 360deg);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="h-[59px] px-[28px] flex items-end pb-2 justify-between bg-white">
        <div class="font-semibold text-[17px]">9:41</div>
        <div class="w-[125px] h-[37px] bg-black rounded-[20px] absolute left-1/2 -translate-x-1/2 top-[12px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <div class="w-7 h-3.5 border border-black rounded-[4px] relative">
                <div class="absolute right-0.5 top-0.5 bottom-0.5 left-0.5 bg-black rounded-[2px]" style="width: 85%"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-[28px] pt-4 pb-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-gray-400 text-sm">Good morning</p>
                <h1 class="text-2xl font-bold text-gray-900">Your Health</h1>
            </div>
            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-bell text-gray-600"></i>
            </div>
        </div>

        <!-- Score Card -->
        <div class="bg-gradient-to-br from-teal-500 to-cyan-500 rounded-3xl p-6 text-white relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full"></div>
            <div class="absolute -right-4 top-16 w-20 h-20 bg-white/10 rounded-full"></div>

            <div class="flex justify-between items-start">
                <div>
                    <p class="text-white/80 text-sm mb-1">Current Score</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-5xl font-bold">80</span>
                        <span class="text-2xl text-white/70">/100</span>
                    </div>
                    <div class="flex items-center gap-2 mt-3">
                        <span class="bg-white/20 px-3 py-1 rounded-full text-sm">Normal</span>
                        <span class="text-white/80 text-sm"><i class="fas fa-arrow-up mr-1"></i>+3</span>
                    </div>
                </div>
                <div class="w-24 h-24 score-ring rounded-full flex items-center justify-center">
                    <div class="w-20 h-20 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-hand-pointer text-3xl text-white"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="px-[28px] pt-6 pb-32">
        <!-- Quick Actions -->
        <div class="flex gap-4 mb-8">
            <button class="flex-1 bg-white rounded-2xl p-5 shadow-sm">
                <div class="w-12 h-12 bg-teal-50 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-play text-teal-500"></i>
                </div>
                <p class="font-semibold text-gray-900">Start Test</p>
                <p class="text-gray-400 text-sm">2 min</p>
            </button>
            <button class="flex-1 bg-white rounded-2xl p-5 shadow-sm">
                <div class="w-12 h-12 bg-cyan-50 rounded-xl flex items-center justify-center mb-3">
                    <i class="fas fa-clock-rotate-left text-cyan-500"></i>
                </div>
                <p class="font-semibold text-gray-900">History</p>
                <p class="text-gray-400 text-sm">12 tests</p>
            </button>
        </div>

        <!-- Metrics -->
        <h2 class="font-semibold text-gray-900 mb-4">Key Metrics</h2>
        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center">
                        <i class="fas fa-gauge-high text-green-500"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-sm">Typing Speed</p>
                        <p class="font-semibold text-gray-900">42 WPM</p>
                    </div>
                </div>
                <span class="text-green-500 text-sm font-medium">Normal</span>
            </div>
            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-blue-500"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-sm">Key Hold Time</p>
                        <p class="font-semibold text-gray-900">105 ms</p>
                    </div>
                </div>
                <span class="text-green-500 text-sm font-medium">Normal</span>
            </div>
            <div class="bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center">
                        <i class="fas fa-wave-square text-purple-500"></i>
                    </div>
                    <div>
                        <p class="text-gray-400 text-sm">Rhythm Consistency</p>
                        <p class="font-semibold text-gray-900">86%</p>
                    </div>
                </div>
                <span class="text-green-500 text-sm font-medium">Good</span>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-8 py-4 pb-8">
        <div class="flex justify-around">
            <div class="flex flex-col items-center">
                <i class="fas fa-house text-teal-500 text-xl mb-1"></i>
                <span class="text-xs text-teal-500 font-medium">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-keyboard text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Test</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-simple text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Progress</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-gear text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Settings</span>
            </div>
        </div>
    </div>
</body>
</html>
