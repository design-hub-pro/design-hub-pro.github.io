<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Parkinson's Motor Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #ffffff;
        }
        .phone-frame {
            width: 460px;
            height: 980px;
            background: #1a1a1a;
            border-radius: 62px;
            padding: 12px;
            box-shadow:
                0 50px 100px -20px rgba(0, 0, 0, 0.25),
                0 30px 60px -30px rgba(0, 0, 0, 0.3),
                inset 0 0 0 2px rgba(255, 255, 255, 0.1);
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #fff;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .gradient-text {
            background: linear-gradient(135deg, #14B8A6 0%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-gradient {
            background: linear-gradient(180deg, #F0FDFA 0%, #FFFFFF 100%);
        }
    </style>
</head>
<body class="bg-white">
    <!-- Hero Section -->
    <div class="hero-gradient py-20 px-8">
        <div class="max-w-6xl mx-auto text-center">
            <!-- Logo -->
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-3xl mb-8 shadow-lg shadow-teal-200">
                <i class="fas fa-keyboard text-white text-3xl"></i>
            </div>

            <h1 class="text-6xl font-bold text-gray-900 mb-4">
                Type<span class="gradient-text">Check</span>
            </h1>
            <p class="text-xl text-gray-500 max-w-2xl mx-auto mb-6">
                Motor Function Assessment Through Typing Analysis
            </p>
            <div class="flex items-center justify-center gap-4 text-sm text-gray-400">
                <span class="flex items-center gap-2">
                    <i class="fas fa-clock text-teal-500"></i>
                    2-minute test
                </span>
                <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                <span class="flex items-center gap-2">
                    <i class="fas fa-shield-halved text-teal-500"></i>
                    Private & Secure
                </span>
                <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                <span class="flex items-center gap-2">
                    <i class="fas fa-chart-line text-teal-500"></i>
                    Track Progress
                </span>
            </div>
        </div>
    </div>

    <!-- Phone Screens Grid -->
    <div class="py-16 px-8">
        <div class="max-w-[1500px] mx-auto">
            <!-- Row 1 -->
            <div class="grid grid-cols-3 gap-12 justify-items-center mb-12">
                <!-- Onboarding -->
                <div class="text-center">
                    <div class="phone-frame mb-6">
                        <div class="phone-screen">
                            <iframe src="onboarding.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900">Welcome</h3>
                    <p class="text-gray-400 text-sm">Onboarding experience</p>
                </div>

                <!-- Home -->
                <div class="text-center">
                    <div class="phone-frame mb-6">
                        <div class="phone-screen">
                            <iframe src="home.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900">Dashboard</h3>
                    <p class="text-gray-400 text-sm">Health overview</p>
                </div>

                <!-- Test -->
                <div class="text-center">
                    <div class="phone-frame mb-6">
                        <div class="phone-screen">
                            <iframe src="test.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900">Typing Test</h3>
                    <p class="text-gray-400 text-sm">Real-time analysis</p>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="grid grid-cols-3 gap-12 justify-items-center">
                <!-- Results -->
                <div class="text-center">
                    <div class="phone-frame mb-6">
                        <div class="phone-screen">
                            <iframe src="results.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900">Results</h3>
                    <p class="text-gray-400 text-sm">Detailed assessment</p>
                </div>

                <!-- History -->
                <div class="text-center">
                    <div class="phone-frame mb-6">
                        <div class="phone-screen">
                            <iframe src="history.html" scrolling="no"></iframe>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900">Progress</h3>
                    <p class="text-gray-400 text-sm">Track over time</p>
                </div>

                <!-- Empty slot for balance or future screen -->
                <div></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="py-12 text-center border-t border-gray-100">
        <p class="text-gray-400 text-sm">
            TypeCheck - Motor Function Assessment
        </p>
    </div>
</body>
</html>
