<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar { display: none; }
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #FAFBFC;
        }
        .score-circle {
            background: conic-gradient(#14B8A6 0deg 288deg, #E5E7EB 288deg 360deg);
        }
        .checkmark-bounce {
            animation: bounce 0.6s ease-out;
        }
        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="h-[59px] px-[28px] flex items-end pb-2 justify-between">
        <div class="font-semibold text-[17px]">9:41</div>
        <div class="w-[125px] h-[37px] bg-black rounded-[20px] absolute left-1/2 -translate-x-1/2 top-[12px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <div class="w-7 h-3.5 border border-black rounded-[4px] relative">
                <div class="absolute right-0.5 top-0.5 bottom-0.5 left-0.5 bg-black rounded-[2px]" style="width: 85%"></div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="px-[28px] pt-6 pb-32">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 checkmark-bounce">
                <i class="fas fa-check text-green-500 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Test Complete</h1>
            <p class="text-gray-400">January 28, 2025</p>
        </div>

        <!-- Main Score -->
        <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm mb-1">Your Score</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-5xl font-bold text-gray-900">80</span>
                        <span class="text-xl text-gray-400">/100</span>
                    </div>
                    <div class="mt-3 inline-flex items-center gap-2 bg-green-50 text-green-600 px-3 py-1.5 rounded-full text-sm font-medium">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                        Normal Range
                    </div>
                </div>
                <div class="w-28 h-28 score-circle rounded-full flex items-center justify-center">
                    <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center">
                        <div class="text-center">
                            <i class="fas fa-hand-pointer text-teal-500 text-2xl mb-1"></i>
                            <p class="text-xs text-gray-400">Motor</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detailed Metrics -->
        <h2 class="font-semibold text-gray-900 mb-4">Analysis Details</h2>
        <div class="space-y-3 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-gauge-high text-blue-500 text-sm"></i>
                        </div>
                        <span class="text-gray-700">Typing Speed</span>
                    </div>
                    <span class="font-semibold">42 WPM</span>
                </div>
                <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 rounded-full" style="width: 84%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-purple-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-clock text-purple-500 text-sm"></i>
                        </div>
                        <span class="text-gray-700">Key Hold Time</span>
                    </div>
                    <span class="font-semibold">105 ms</span>
                </div>
                <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-purple-500 rounded-full" style="width: 78%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-teal-50 rounded-lg flex items-center justify-center">
                            <i class="fas fa-wave-square text-teal-500 text-sm"></i>
                        </div>
                        <span class="text-gray-700">Rhythm</span>
                    </div>
                    <span class="font-semibold">86%</span>
                </div>
                <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-teal-500 rounded-full" style="width: 86%"></div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="space-y-3">
            <button class="w-full bg-gradient-to-r from-teal-500 to-cyan-500 text-white font-semibold py-4 rounded-2xl">
                Save Results
            </button>
            <button class="w-full bg-white text-gray-700 font-semibold py-4 rounded-2xl border border-gray-200">
                Retake Test
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-8 py-4 pb-8">
        <div class="flex justify-around">
            <div class="flex flex-col items-center">
                <i class="fas fa-house text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-keyboard text-teal-500 text-xl mb-1"></i>
                <span class="text-xs text-teal-500 font-medium">Test</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-simple text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Progress</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-gear text-gray-300 text-xl mb-1"></i>
                <span class="text-xs text-gray-400">Settings</span>
            </div>
        </div>
    </div>
</body>
</html>
