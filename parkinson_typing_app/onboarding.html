<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-scrollbar { display: none; }
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .gradient-bg {
            background: linear-gradient(180deg, #E8F4F8 0%, #FFFFFF 50%);
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
        .status-bar-time {
            font-weight: 600;
            font-size: 17px;
        }
    </style>
</head>
<body class="gradient-bg">
    <!-- Status Bar -->
    <div class="h-[59px] px-[28px] flex items-end pb-2 justify-between">
        <div class="status-bar-time">9:41</div>
        <div class="w-[125px] h-[37px] bg-black rounded-[20px] absolute left-1/2 -translate-x-1/2 top-[12px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <div class="w-7 h-3.5 border border-black rounded-[4px] relative">
                <div class="absolute right-0.5 top-0.5 bottom-0.5 left-0.5 bg-black rounded-[2px]" style="width: 85%"></div>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="px-[28px] flex flex-col items-center pt-16">
        <!-- Logo Animation -->
        <div class="relative w-48 h-48 mb-12">
            <div class="absolute inset-0 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-full opacity-20 pulse-ring"></div>
            <div class="absolute inset-4 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-full opacity-30 pulse-ring" style="animation-delay: 0.3s;"></div>
            <div class="absolute inset-8 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-full flex items-center justify-center">
                <i class="fas fa-keyboard text-white text-5xl"></i>
            </div>
        </div>

        <!-- App Name -->
        <h1 class="text-4xl font-bold text-gray-900 mb-3">TypeCheck</h1>
        <p class="text-gray-500 text-lg text-center mb-16">Motor Function Assessment<br>Through Typing Analysis</p>

        <!-- Features -->
        <div class="w-full space-y-4 mb-12">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-teal-50 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-fingerprint text-teal-500 text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold text-gray-900">Quick Assessment</p>
                    <p class="text-gray-400 text-sm">2-minute typing test</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-cyan-50 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-chart-line text-cyan-500 text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold text-gray-900">Track Progress</p>
                    <p class="text-gray-400 text-sm">Monitor changes over time</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-shield-halved text-blue-500 text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold text-gray-900">Private & Secure</p>
                    <p class="text-gray-400 text-sm">Your data stays on device</p>
                </div>
            </div>
        </div>

        <!-- CTA Button -->
        <button class="w-full bg-gradient-to-r from-teal-500 to-cyan-500 text-white font-semibold py-4 rounded-2xl text-lg shadow-lg shadow-teal-200">
            Get Started
        </button>
        <p class="text-gray-400 text-sm mt-4">No account required</p>
    </div>
</body>
</html>
