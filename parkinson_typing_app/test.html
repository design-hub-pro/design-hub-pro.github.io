<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCheck - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar { display: none; }
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #FAFBFC;
        }
        .typed-text {
            color: #14B8A6;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .key {
            transition: all 0.1s ease;
        }
        .key-active {
            background: #14B8A6 !important;
            color: white !important;
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="h-[59px] px-[28px] flex items-end pb-2 justify-between">
        <div class="font-semibold text-[17px]">9:41</div>
        <div class="w-[125px] h-[37px] bg-black rounded-[20px] absolute left-1/2 -translate-x-1/2 top-[12px]"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <div class="w-7 h-3.5 border border-black rounded-[4px] relative">
                <div class="absolute right-0.5 top-0.5 bottom-0.5 left-0.5 bg-black rounded-[2px]" style="width: 85%"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="px-[28px] pt-4 pb-6">
        <div class="flex items-center justify-between mb-6">
            <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">
                <i class="fas fa-xmark text-gray-600"></i>
            </button>
            <div class="flex items-center gap-2">
                <i class="fas fa-clock text-teal-500"></i>
                <span class="font-semibold text-gray-900">1:24</span>
            </div>
            <div class="w-10"></div>
        </div>

        <!-- Progress -->
        <div class="mb-8">
            <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-400">Progress</span>
                <span class="text-teal-500 font-medium">65%</span>
            </div>
            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-teal-500 to-cyan-500 rounded-full" style="width: 65%"></div>
            </div>
        </div>

        <!-- Text Display -->
        <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
            <p class="text-lg leading-relaxed">
                <span class="typed-text">The quick brown fox jumps over the </span><span class="cursor text-gray-900">|</span><span class="text-gray-400">lazy dog near the riverbank on a sunny afternoon.</span>
            </p>
        </div>

        <!-- Live Metrics -->
        <div class="flex gap-3 mb-6">
            <div class="flex-1 bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-3xl font-bold text-gray-900">38</p>
                <p class="text-gray-400 text-sm">WPM</p>
            </div>
            <div class="flex-1 bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-3xl font-bold text-gray-900">96%</p>
                <p class="text-gray-400 text-sm">Accuracy</p>
            </div>
            <div class="flex-1 bg-white rounded-2xl p-4 text-center shadow-sm">
                <p class="text-3xl font-bold text-teal-500">Good</p>
                <p class="text-gray-400 text-sm">Rhythm</p>
            </div>
        </div>
    </div>

    <!-- Keyboard -->
    <div class="absolute bottom-0 left-0 right-0 bg-gray-200 px-1 pt-3 pb-8">
        <div class="flex justify-center gap-1 mb-1">
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">Q</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">W</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">E</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">R</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">T</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">Y</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">U</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">I</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">O</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">P</div>
        </div>
        <div class="flex justify-center gap-1 mb-1 px-4">
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">A</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">S</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">D</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">F</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">G</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">H</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">J</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">K</div>
            <div class="key key-active w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">L</div>
        </div>
        <div class="flex justify-center gap-1 mb-2">
            <div class="key w-11 h-11 bg-gray-300 rounded-lg flex items-center justify-center shadow">
                <i class="fas fa-arrow-up text-sm"></i>
            </div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">Z</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">X</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">C</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">V</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">B</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">N</div>
            <div class="key w-9 h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">M</div>
            <div class="key w-11 h-11 bg-gray-300 rounded-lg flex items-center justify-center shadow">
                <i class="fas fa-delete-left text-sm"></i>
            </div>
        </div>
        <div class="flex justify-center gap-2">
            <div class="key w-24 h-11 bg-gray-300 rounded-lg flex items-center justify-center text-sm shadow">123</div>
            <div class="key flex-1 max-w-[200px] h-11 bg-white rounded-lg flex items-center justify-center text-sm font-medium shadow">space</div>
            <div class="key w-24 h-11 bg-teal-500 rounded-lg flex items-center justify-center text-white text-sm font-medium shadow">return</div>
        </div>
    </div>
</body>
</html>
