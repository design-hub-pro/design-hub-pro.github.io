<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}*::-webkit-scrollbar{display:none}html,body{scrollbar-width:none}
  html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Inter',sans-serif;color:#1c1917;overflow:hidden;}
  .font-serif{font-family:'Fraunces',serif;}
  .map-bg{background:
    radial-gradient(ellipse 200px 160px at 30% 30%, rgba(167,243,208,.7), transparent 70%),
    radial-gradient(ellipse 220px 180px at 70% 65%, rgba(167,243,208,.55), transparent 70%),
    radial-gradient(ellipse 160px 130px at 50% 85%, rgba(186,230,253,.65), transparent 70%),
    linear-gradient(135deg, #e7e5e0, #d6d3ce);
  }
  .pin{filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));}
  .pulse{animation:pulsering 2s infinite;}
  @keyframes pulsering{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
  .river{stroke:#7dd3fc;stroke-width:6;fill:none;opacity:.75;stroke-linecap:round;}
  .road{stroke:#fff;stroke-width:3;fill:none;opacity:.85;}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden map-bg">

  <!-- SVG map content -->
  <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice" viewBox="0 0 460 980">
    <path d="M 0 280 Q 200 270 300 290 T 460 270" class="road"/>
    <path d="M 100 0 Q 130 200 140 400 T 180 980" class="road"/>
    <path d="M 0 560 Q 200 540 320 580 T 460 570" class="road"/>
    <path d="M 330 0 Q 350 200 360 400 T 380 980" class="road"/>
    <path d="M -20 460 Q 120 450 230 490 Q 340 540 460 510" class="river"/>
    <path d="M 230 490 Q 250 600 220 720 Q 200 820 180 980" class="river"/>
  </svg>

  <!-- Status bar -->
  <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-7 pt-3 text-stone-900 text-sm font-semibold z-30" style="height:59px">
    <span>9:41</span>
    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-xs"></i></div>
  </div>

  <!-- Top search -->
  <div class="absolute top-[59px] left-0 right-0 z-20 px-7 pt-3">
    <div class="bg-white rounded-full px-4 py-3 ring-1 ring-stone-200 shadow-lg flex items-center gap-3">
      <i class="fas fa-search text-stone-400 text-sm"></i>
      <span class="text-sm text-stone-500 flex-1">Search species or place…</span>
      <i class="fas fa-sliders text-emerald-700 text-sm"></i>
    </div>

    <!-- Filter chips -->
    <div class="flex gap-2 mt-3 overflow-x-auto pb-1" style="scrollbar-width:none">
      <button class="shrink-0 bg-stone-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-full">All · 312</button>
      <button class="shrink-0 bg-white ring-1 ring-stone-200 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1"><i class="fas fa-dove text-sky-500 text-[10px]"></i> Birds</button>
      <button class="shrink-0 bg-white ring-1 ring-stone-200 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1"><i class="fas fa-paw text-amber-500 text-[10px]"></i> Mammals</button>
      <button class="shrink-0 bg-white ring-1 ring-stone-200 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1"><i class="fas fa-bug text-rose-500 text-[10px]"></i> Insects</button>
      <button class="shrink-0 bg-white ring-1 ring-stone-200 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1"><i class="fas fa-seedling text-emerald-500 text-[10px]"></i> Plants</button>
    </div>
  </div>

  <!-- Park labels -->
  <div class="absolute z-10 italic font-serif text-xs font-bold text-emerald-800/70" style="top:220px;left:80px">Meridian Park</div>
  <div class="absolute z-10 italic font-serif text-xs font-bold text-emerald-800/70" style="top:640px;left:230px">Wild Basin</div>
  <div class="absolute z-10 italic font-serif text-xs font-semibold text-sky-700/70" style="top:520px;left:50px">Barton Creek</div>

  <!-- Pins -->
  <div class="absolute z-10" style="top:300px;left:200px">
    <div class="absolute inset-0 rounded-full bg-emerald-400 pulse" style="width:56px;height:56px;left:-4px;top:-4px"></div>
    <div class="relative w-12 h-12 rounded-full bg-white pin ring-4 ring-emerald-600 flex items-center justify-center">
      <i class="fas fa-dove text-emerald-700"></i>
    </div>
  </div>
  <div class="absolute z-10" style="top:240px;left:100px"><div class="w-11 h-11 rounded-full bg-sky-500 pin ring-4 ring-white flex items-center justify-center text-white text-sm font-bold">12</div></div>
  <div class="absolute z-10" style="top:380px;left:90px"><div class="w-10 h-10 rounded-full bg-emerald-500 pin ring-4 ring-white flex items-center justify-center text-white"><i class="fas fa-seedling text-sm"></i></div></div>
  <div class="absolute z-10" style="top:460px;left:160px"><div class="w-10 h-10 rounded-full bg-amber-500 pin ring-4 ring-white flex items-center justify-center text-white"><i class="fas fa-paw text-sm"></i></div></div>
  <div class="absolute z-10" style="top:380px;left:300px"><div class="w-11 h-11 rounded-full bg-rose-500 pin ring-4 ring-white flex items-center justify-center text-white text-sm font-bold">8</div></div>
  <div class="absolute z-10" style="top:530px;left:340px"><div class="w-10 h-10 rounded-full bg-emerald-500 pin ring-4 ring-white flex items-center justify-center text-white"><i class="fas fa-bug text-sm"></i></div></div>
  <div class="absolute z-10" style="top:640px;left:270px"><div class="w-12 h-12 rounded-full bg-emerald-600 pin ring-4 ring-white flex items-center justify-center text-white text-sm font-bold">24</div></div>
  <div class="absolute z-10" style="top:680px;left:120px"><div class="w-10 h-10 rounded-full bg-purple-500 pin ring-4 ring-white flex items-center justify-center text-white"><i class="fas fa-feather text-sm"></i></div></div>

  <!-- "You are here" -->
  <div class="absolute z-10" style="top:420px;left:220px">
    <div class="w-4 h-4 rounded-full bg-sky-500 ring-4 ring-sky-200 pin"></div>
  </div>

  <!-- Map controls right -->
  <div class="absolute z-20" style="top:320px;right:18px">
    <div class="flex flex-col gap-2">
      <button class="w-11 h-11 rounded-2xl bg-white ring-1 ring-stone-200 shadow-lg flex items-center justify-center"><i class="fas fa-layer-group text-stone-700 text-sm"></i></button>
      <button class="w-11 h-11 rounded-2xl bg-white ring-1 ring-stone-200 shadow-lg flex items-center justify-center"><i class="fas fa-location-crosshairs text-emerald-700 text-sm"></i></button>
    </div>
  </div>

  <!-- Bottom sheet: selected sighting -->
  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] z-20" style="padding-bottom:108px">
    <div class="flex justify-center pt-2"><div class="w-10 h-1 rounded-full bg-stone-300"></div></div>
    <div class="px-7 pt-3">
      <div class="flex items-center gap-1.5 mb-2">
        <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold uppercase tracking-wider">Confirmed</span>
        <span class="text-[10px] bg-amber-500 text-white px-2 py-1 rounded-full font-bold uppercase tracking-wider">Rare here</span>
      </div>
      <div class="flex items-start gap-3">
        <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=200&h=200&fit=crop" class="w-20 h-20 rounded-2xl object-cover">
        <div class="flex-1 min-w-0">
          <div class="text-[10px] text-stone-500 font-semibold uppercase tracking-wider">Aves · Parulidae</div>
          <h3 class="font-serif font-bold text-base leading-tight mt-0.5">Black-throated Blue Warbler</h3>
          <p class="text-[11px] italic text-stone-500">Setophaga caerulescens</p>
          <div class="flex items-center gap-2 mt-1.5 text-[11px] text-stone-600">
            <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=40&h=40&fit=crop" class="w-4 h-4 rounded-full">
            <span class="font-semibold">@lila.m</span>
            <span class="text-stone-400">·</span>
            <span>0.6 mi · 4h ago</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-4 text-center">
        <div class="bg-stone-50 rounded-xl py-2">
          <div class="text-[9px] text-stone-500 uppercase font-bold">Verifications</div>
          <div class="font-serif font-bold text-base mt-0.5 text-emerald-700">12</div>
        </div>
        <div class="bg-stone-50 rounded-xl py-2">
          <div class="text-[9px] text-stone-500 uppercase font-bold">Local total</div>
          <div class="font-serif font-bold text-base mt-0.5">42</div>
        </div>
        <div class="bg-stone-50 rounded-xl py-2">
          <div class="text-[9px] text-stone-500 uppercase font-bold">Best time</div>
          <div class="font-serif font-bold text-base mt-0.5">Dawn</div>
        </div>
      </div>

      <div class="flex gap-2 mt-3">
        <button class="flex-1 bg-emerald-600 text-white text-sm font-bold py-3 rounded-xl">Open species page</button>
        <button class="w-12 h-12 bg-stone-100 rounded-xl flex items-center justify-center"><i class="far fa-bookmark text-stone-700"></i></button>
        <button class="w-12 h-12 bg-stone-100 rounded-xl flex items-center justify-center"><i class="fas fa-directions text-stone-700"></i></button>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-stone-200 z-30" style="padding-bottom:24px">
    <div class="flex items-center justify-around px-2 pt-3">
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-house text-stone-400 text-xl"></i><span class="text-[10px] font-semibold text-stone-500">Today</span></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-map text-emerald-600 text-xl"></i><span class="text-[10px] font-bold text-emerald-700">Map</span></button>
      <button class="relative -mt-6"><div class="w-14 h-14 rounded-2xl bg-emerald-600 ring-4 ring-white flex items-center justify-center shadow-xl"><i class="fas fa-camera text-white text-xl"></i></div></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-book-open text-stone-400 text-xl"></i><span class="text-[10px] font-semibold text-stone-500">Learn</span></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-user text-stone-400 text-xl"></i><span class="text-[10px] font-semibold text-stone-500">Me</span></button>
    </div>
  </div>

  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-black rounded-full z-40"></div>
</div>
</body>
</html>
