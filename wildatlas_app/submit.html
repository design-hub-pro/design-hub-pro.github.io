<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Submit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}*::-webkit-scrollbar{display:none}html,body{scrollbar-width:none}
  html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Inter',sans-serif;background:#000;color:#fff;overflow:hidden;}
  .font-serif{font-family:'Fraunces',serif;}
  .scroll{overflow-y:scroll;height:100%;padding-bottom:120px;}
  .scan-line{background:linear-gradient(180deg, transparent 0%, rgba(16,185,129,.6) 50%, transparent 100%);animation:scan 2.5s ease-in-out infinite;}
  @keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(140%)}}
</style>
</head>
<body>
<div class="relative w-full h-full overflow-hidden bg-stone-950">

  <!-- Camera view background -->
  <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=900&h=1800&fit=crop" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/80"></div>

  <!-- Status bar -->
  <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-7 pt-3 text-white text-sm font-semibold z-30" style="height:59px">
    <span>9:41</span>
    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-xs"></i></div>
  </div>

  <div class="scroll relative z-10">

    <!-- Top bar -->
    <div class="px-7 pt-[70px] flex items-center justify-between">
      <button class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-xmark"></i></button>
      <div class="text-center">
        <div class="text-[10px] uppercase tracking-widest text-emerald-300 font-bold">Step 2 of 3</div>
        <div class="font-serif font-bold text-base">AI is identifying…</div>
      </div>
      <button class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-bolt-lightning text-sm"></i></button>
    </div>

    <!-- Camera frame with detection -->
    <div class="px-7 mt-5">
      <div class="relative aspect-square rounded-3xl overflow-hidden ring-1 ring-white/20">
        <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=600&h=600&fit=crop" class="absolute inset-0 w-full h-full object-cover">

        <!-- Corner brackets -->
        <div class="absolute top-3 left-3 w-7 h-7 border-t-4 border-l-4 border-emerald-400 rounded-tl-2xl"></div>
        <div class="absolute top-3 right-3 w-7 h-7 border-t-4 border-r-4 border-emerald-400 rounded-tr-2xl"></div>
        <div class="absolute bottom-3 left-3 w-7 h-7 border-b-4 border-l-4 border-emerald-400 rounded-bl-2xl"></div>
        <div class="absolute bottom-3 right-3 w-7 h-7 border-b-4 border-r-4 border-emerald-400 rounded-br-2xl"></div>

        <!-- Scan line -->
        <div class="absolute inset-x-3 top-3 bottom-3 overflow-hidden rounded-2xl">
          <div class="absolute inset-x-0 h-12 scan-line"></div>
        </div>

        <!-- Detection box -->
        <div class="absolute" style="top:32%;left:30%;width:42%;height:42%;">
          <div class="w-full h-full ring-2 ring-emerald-400 rounded-xl"></div>
          <div class="absolute -top-7 left-0 bg-emerald-500 text-white text-[10px] font-bold px-2 py-1 rounded-md">94% Setophaga caerulescens</div>
        </div>
      </div>
    </div>

    <!-- AI suggestion card -->
    <div class="px-7 mt-5">
      <div class="bg-white/95 backdrop-blur-lg rounded-3xl p-4 text-stone-900">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center"><i class="fas fa-wand-magic-sparkles text-white"></i></div>
          <div>
            <div class="text-[10px] uppercase tracking-widest text-emerald-700 font-bold">WildAtlas AI · 4.2M photos</div>
            <div class="font-serif font-bold text-sm">Our best guesses</div>
          </div>
          <span class="ml-auto text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-1 rounded-full">3 matches</span>
        </div>

        <!-- Top match -->
        <label class="flex items-center gap-3 bg-emerald-50 rounded-2xl p-3 ring-2 ring-emerald-600">
          <img src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=120&h=120&fit=crop" class="w-12 h-12 rounded-xl object-cover">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-serif font-bold text-sm truncate">Black-throated Blue Warbler</span>
            </div>
            <p class="text-[10px] italic text-stone-500">Setophaga caerulescens</p>
            <div class="flex items-center gap-2 mt-1">
              <div class="flex-1 h-1.5 bg-stone-200 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width:94%"></div></div>
              <span class="text-[10px] font-bold text-emerald-700">94%</span>
            </div>
          </div>
        </label>

        <!-- More -->
        <div class="grid grid-cols-2 gap-2 mt-2">
          <label class="flex items-center gap-2 bg-stone-50 rounded-xl p-2.5">
            <img src="https://images.unsplash.com/photo-1452570053594-1b985d6ea890?w=80&h=80&fit=crop" class="w-10 h-10 rounded-lg object-cover">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-[11px] truncate">Cerulean Warbler</div>
              <div class="text-[9px] text-stone-500">4%</div>
            </div>
          </label>
          <label class="flex items-center gap-2 bg-stone-50 rounded-xl p-2.5">
            <img src="https://images.unsplash.com/photo-1469041797191-50ace28483c3?w=80&h=80&fit=crop" class="w-10 h-10 rounded-lg object-cover">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-[11px] truncate">Blue Grosbeak</div>
              <div class="text-[9px] text-stone-500">2%</div>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Quick context chips -->
    <div class="px-7 mt-4">
      <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-4 ring-1 ring-white/15">
        <div class="text-[10px] uppercase tracking-widest text-stone-300 font-bold mb-3">Quick context</div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-white/10 rounded-xl py-2">
            <i class="fas fa-location-dot text-emerald-300 text-sm"></i>
            <div class="text-[10px] font-bold mt-1">Meridian Park</div>
            <div class="text-[9px] text-stone-400">4m accuracy</div>
          </div>
          <div class="bg-white/10 rounded-xl py-2">
            <i class="fas fa-clock text-emerald-300 text-sm"></i>
            <div class="text-[10px] font-bold mt-1">7:42 AM</div>
            <div class="text-[9px] text-stone-400">May 25</div>
          </div>
          <div class="bg-white/10 rounded-xl py-2">
            <i class="fas fa-tree text-emerald-300 text-sm"></i>
            <div class="text-[10px] font-bold mt-1">Hardwood</div>
            <div class="text-[9px] text-stone-400">canopy</div>
          </div>
        </div>

        <!-- Quality -->
        <div class="mt-4 flex items-center gap-3">
          <div class="flex-1">
            <div class="flex items-center justify-between text-[10px] font-bold mb-1">
              <span class="text-stone-300">Sighting quality</span>
              <span class="text-emerald-300">8.4 / 10</span>
            </div>
            <div class="h-1.5 bg-white/20 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400" style="width:84%"></div>
            </div>
          </div>
        </div>

        <!-- Submit -->
        <button class="w-full mt-4 bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-xl">
          Confirm &amp; submit <i class="fas fa-arrow-right text-sm"></i>
        </button>
      </div>
    </div>

    <div class="h-6"></div>
  </div>

  <!-- Tab Bar (translucent over camera) -->
  <div class="absolute bottom-0 left-0 right-0 bg-black/60 backdrop-blur-xl border-t border-white/10 z-30" style="padding-bottom:24px">
    <div class="flex items-center justify-around px-2 pt-3">
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-house text-white/50 text-xl"></i><span class="text-[10px] font-semibold text-white/60">Today</span></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-map text-white/50 text-xl"></i><span class="text-[10px] font-semibold text-white/60">Map</span></button>
      <button class="relative -mt-6"><div class="w-14 h-14 rounded-2xl bg-emerald-500 ring-4 ring-black/60 flex items-center justify-center shadow-xl"><i class="fas fa-camera text-white text-xl"></i></div></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-book-open text-white/50 text-xl"></i><span class="text-[10px] font-semibold text-white/60">Learn</span></button>
      <button class="flex flex-col items-center gap-1 w-14"><i class="fas fa-user text-white/50 text-xl"></i><span class="text-[10px] font-semibold text-white/60">Me</span></button>
    </div>
  </div>

  <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white rounded-full z-40"></div>
</div>
</body>
</html>
