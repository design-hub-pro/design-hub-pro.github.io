<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GreenCrew — Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  *{-webkit-font-smoothing:antialiased;scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  html,body{width:100%;height:100%;margin:0;font-family:'Inter',sans-serif;background:#000;color:#fff;overflow:hidden}
  .serif{font-family:'Fraunces',serif;letter-spacing:-.02em}
  .hero{
    background:
      linear-gradient(180deg, rgba(8,30,22,.15) 0%, rgba(8,30,22,.55) 55%, rgba(8,30,22,.96) 100%),
      url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900&q=80') center/cover;
  }
  .grain{
    background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  @keyframes pulse-dot{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  .live-dot{animation:pulse-dot 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div class="hero grain w-full h-full relative flex flex-col">
  <!-- Status bar -->
  <div class="flex justify-between items-center px-7 pt-3" style="height:59px">
    <span class="text-white text-[15px] font-semibold tracking-tight">9:41</span>
    <div class="w-[110px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[11px]"></i>
      <i class="fas fa-wifi text-[12px]"></i>
      <i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Top brand row -->
  <div class="px-7 mt-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center shadow-lg shadow-emerald-900/60">
        <i class="fas fa-leaf text-white text-[15px]"></i>
      </div>
      <span class="text-white font-bold tracking-tight text-[17px]">GreenCrew</span>
    </div>
    <button class="text-white/80 text-[13px] font-medium">Sign in</button>
  </div>

  <!-- Floating impact pill -->
  <div class="px-7 mt-4">
    <div class="glass rounded-full px-3.5 py-2 inline-flex items-center gap-2">
      <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full live-dot"></span>
      <span class="text-white/95 text-[11.5px] font-medium">142 crews on trails right now</span>
    </div>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Headline -->
  <div class="px-7 pb-3">
    <h1 class="serif text-white text-[44px] leading-[1.02] font-medium">
      Earn hours.<br>
      Heal a corner<br>
      of the planet.
    </h1>
    <p class="text-white/65 text-[14px] leading-snug mt-3 max-w-[300px]">
      Verified service hours for college applications — earned on real trails, real beaches, real fieldwork.
    </p>
  </div>

  <!-- Avatar stack + count -->
  <div class="px-7 mt-5 flex items-center gap-3">
    <div class="flex -space-x-2">
      <img class="w-8 h-8 rounded-full border-2 border-[#0a2418] object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&q=80">
      <img class="w-8 h-8 rounded-full border-2 border-[#0a2418] object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&q=80">
      <img class="w-8 h-8 rounded-full border-2 border-[#0a2418] object-cover" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&q=80">
      <img class="w-8 h-8 rounded-full border-2 border-[#0a2418] object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80&q=80">
      <div class="w-8 h-8 rounded-full bg-emerald-500 border-2 border-[#0a2418] flex items-center justify-center text-[10px] font-bold text-white">+24k</div>
    </div>
    <span class="text-white/65 text-[12px]">Joined by 24,318 students</span>
  </div>

  <!-- CTAs -->
  <div class="px-7 mt-5 pb-8 space-y-2.5">
    <button class="w-full bg-white text-black font-semibold text-[15px] py-3.5 rounded-2xl flex items-center justify-center gap-2">
      <i class="fab fa-apple text-[18px] mb-0.5"></i>
      Continue with Apple
    </button>
    <button class="w-full bg-white/12 backdrop-blur border border-white/15 text-white font-medium text-[15px] py-3.5 rounded-2xl flex items-center justify-center gap-2">
      <i class="fab fa-google text-[14px]"></i>
      Continue with Google
    </button>
    <p class="text-center text-white/40 text-[11px] mt-3">Verified by 312 schools nationwide</p>
  </div>
</div>
</body>
</html>
