<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GreenCrew — Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{-webkit-font-smoothing:antialiased;scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  html,body{width:100%;height:100%;margin:0;font-family:'Inter',sans-serif;background:#0d1f17;color:#fff;overflow:hidden}
  .serif{font-family:'Fraunces',serif;letter-spacing:-.02em}
  .mono{font-family:'JetBrains Mono',monospace}
  .map-bg{
    background:
      radial-gradient(circle at 45% 50%, rgba(74,222,128,.25), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(34,197,94,.15), transparent 35%),
      linear-gradient(135deg, #163e2c 0%, #0a2418 100%);
  }
  @keyframes ping{75%,100%{transform:scale(2.5);opacity:0}}
  .ping{animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
  @keyframes pulse-dot{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
  .live-dot{animation:pulse-dot 1.4s ease-in-out infinite}
  .topo{
    background-image:
      radial-gradient(ellipse 80px 50px at 25% 35%, transparent 40%, rgba(255,255,255,.05) 41%, transparent 43%),
      radial-gradient(ellipse 120px 70px at 25% 35%, transparent 55%, rgba(255,255,255,.04) 56%, transparent 58%),
      radial-gradient(ellipse 60px 90px at 75% 60%, transparent 35%, rgba(255,255,255,.05) 36%, transparent 38%),
      radial-gradient(ellipse 100px 130px at 75% 60%, transparent 50%, rgba(255,255,255,.04) 51%, transparent 53%);
  }
</style>
</head>
<body>
<div class="map-bg topo w-full h-full relative flex flex-col text-white">

  <!-- Status bar -->
  <div class="flex justify-between items-center px-7 pt-3 relative z-10" style="height:59px">
    <span class="text-white text-[15px] font-semibold tracking-tight">9:41</span>
    <div class="w-[110px] h-[34px] bg-black rounded-full"></div>
    <div class="flex items-center gap-1.5 text-white text-[13px]">
      <i class="fas fa-signal text-[11px]"></i>
      <i class="fas fa-wifi text-[12px]"></i>
      <i class="fas fa-battery-full text-[14px]"></i>
    </div>
  </div>

  <!-- Top live bar -->
  <div class="px-7 mt-2 relative z-10">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-red-500/95 backdrop-blur text-white text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-white rounded-full live-dot"></span>
          LIVE
        </span>
        <div class="text-white">
          <p class="text-[10px] text-emerald-200/80 leading-none mt-0.5">In progress</p>
          <p class="text-[12.5px] font-semibold leading-tight">Salamander Census</p>
        </div>
      </div>
      <div class="text-right">
        <p class="mono text-[18px] text-white leading-none">01:42:08</p>
        <p class="text-[10px] text-emerald-200/65 mt-1">of 4.0 hrs</p>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="mt-3 h-1.5 bg-white/10 rounded-full overflow-hidden">
      <div class="h-full bg-gradient-to-r from-emerald-300 to-emerald-500 rounded-full" style="width:43%"></div>
    </div>
  </div>

  <!-- Map area -->
  <div class="flex-1 relative">
    <!-- Crew pins -->
    <div class="absolute" style="top:18%;left:30%">
      <div class="relative">
        <span class="absolute -inset-2 w-[58px] h-[58px] rounded-full bg-emerald-300/40 ping"></span>
        <img class="relative w-10 h-10 rounded-full object-cover ring-3 ring-emerald-300" style="box-shadow:0 0 0 3px #4ade80" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&q=80">
        <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-emerald-300 text-[#0d1f17] text-[9px] font-bold px-1.5 py-0.5 rounded-full whitespace-nowrap">You</span>
      </div>
    </div>
    <div class="absolute" style="top:40%;left:55%">
      <img class="w-8 h-8 rounded-full object-cover ring-2 ring-white" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&q=80">
    </div>
    <div class="absolute" style="top:30%;left:70%">
      <img class="w-8 h-8 rounded-full object-cover ring-2 ring-white" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&q=80">
    </div>
    <div class="absolute" style="top:55%;left:25%">
      <img class="w-8 h-8 rounded-full object-cover ring-2 ring-white" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80&q=80">
    </div>
    <div class="absolute" style="top:48%;left:75%">
      <div class="w-8 h-8 rounded-full bg-white/15 backdrop-blur flex items-center justify-center ring-2 ring-white/30">
        <span class="text-[10px] font-bold text-white">+11</span>
      </div>
    </div>

    <!-- Discovery markers -->
    <div class="absolute" style="top:22%;left:65%">
      <div class="w-6 h-6 rounded-full bg-amber-400 ring-2 ring-amber-200/50 flex items-center justify-center">
        <i class="fas fa-frog text-[#0d1f17] text-[10px]"></i>
      </div>
    </div>
    <div class="absolute" style="top:52%;left:50%">
      <div class="w-6 h-6 rounded-full bg-amber-400 ring-2 ring-amber-200/50 flex items-center justify-center">
        <i class="fas fa-leaf text-[#0d1f17] text-[10px]"></i>
      </div>
    </div>

    <!-- Compass -->
    <div class="absolute top-3 right-7 w-11 h-11 rounded-full bg-white/10 backdrop-blur-lg border border-white/15 flex items-center justify-center">
      <i class="fas fa-location-crosshairs text-emerald-300 text-[14px]"></i>
    </div>
  </div>

  <!-- Bottom panel -->
  <div class="relative z-10 bg-[#0a2418]/95 backdrop-blur-xl rounded-t-[28px] border-t border-emerald-300/10 px-5 pt-4" style="padding-bottom:110px">

    <!-- Drag handle -->
    <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-3"></div>

    <!-- Recent observations -->
    <div class="flex items-center justify-between mb-2.5 px-2">
      <p class="text-[12px] font-semibold text-white/85">Crew observations <span class="text-emerald-300">·  7</span></p>
      <span class="text-[10.5px] text-white/45">Live feed</span>
    </div>

    <div class="space-y-2">
      <div class="bg-white/5 rounded-2xl p-2.5 flex items-center gap-3">
        <img class="w-11 h-11 rounded-xl object-cover" src="https://images.unsplash.com/photo-1551244072-5d12893278ab?w=120&q=80">
        <div class="flex-1 min-w-0">
          <p class="text-[12.5px] font-semibold text-white truncate">Red-backed Salamander</p>
          <p class="text-[10.5px] text-white/55 mt-0.5">by Jordan · plot 3 · 14s ago</p>
        </div>
        <span class="bg-emerald-400/15 text-emerald-300 text-[9.5px] font-bold px-2 py-1 rounded-full">+1 pt</span>
      </div>
      <div class="bg-white/5 rounded-2xl p-2.5 flex items-center gap-3">
        <img class="w-11 h-11 rounded-xl object-cover" src="https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?w=120&q=80">
        <div class="flex-1 min-w-0">
          <p class="text-[12.5px] font-semibold text-white truncate">Eastern Newt (eft)</p>
          <p class="text-[10.5px] text-white/55 mt-0.5">by Priya · plot 5 · 2 min ago</p>
        </div>
        <span class="bg-amber-400/15 text-amber-300 text-[9.5px] font-bold px-2 py-1 rounded-full">RARE</span>
      </div>
    </div>

    <!-- Capture button -->
    <div class="absolute -top-9 left-1/2 -translate-x-1/2">
      <button class="w-[74px] h-[74px] rounded-full bg-emerald-400 ring-4 ring-[#0a2418] shadow-2xl shadow-emerald-500/40 flex items-center justify-center">
        <i class="fas fa-camera text-[#0d1f17] text-[24px]"></i>
      </button>
      <p class="text-center text-[10px] text-white/65 mt-1.5 font-medium">Log species</p>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="absolute bottom-0 left-0 right-0 px-5 pb-6 pt-2">
    <div class="bg-[#06140e]/95 backdrop-blur rounded-full flex items-center justify-around py-3 ring-1 ring-white/8">
      <button class="flex flex-col items-center text-white/45 px-3"><i class="fas fa-house text-[16px]"></i><span class="w-1 h-1 bg-transparent rounded-full mt-1.5"></span></button>
      <button class="flex flex-col items-center text-white/45 px-3"><i class="fas fa-compass text-[16px]"></i><span class="w-1 h-1 bg-transparent rounded-full mt-1.5"></span></button>
      <button class="flex flex-col items-center text-emerald-300 px-3"><i class="fas fa-people-group text-[16px]"></i><span class="w-1 h-1 bg-emerald-300 rounded-full mt-1.5"></span></button>
      <button class="flex flex-col items-center text-white/45 px-3"><i class="fas fa-graduation-cap text-[16px]"></i><span class="w-1 h-1 bg-transparent rounded-full mt-1.5"></span></button>
      <button class="flex flex-col items-center text-white/45 px-3"><i class="fas fa-user text-[16px]"></i><span class="w-1 h-1 bg-transparent rounded-full mt-1.5"></span></button>
    </div>
  </div>
</div>
</body>
</html>
