<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulTune AI - Welcome</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  *::-webkit-scrollbar { display: none; }
  html, body { scrollbar-width: none; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0f; color: #fff; }

  .status-bar { height: 59px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 8px; position: relative; z-index: 10; }
  .status-bar .time { font-size: 16px; font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }

  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100% - 59px); padding: 0 28px; text-align: center; position: relative; }

  .bg-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%); width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, rgba(139,92,246,0.15) 40%, transparent 70%); z-index: 0; animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: 0.6; transform: translate(-50%, -60%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } }

  .rings { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); z-index: 0; }
  .ring { position: absolute; border: 1px solid rgba(99,102,241,0.08); border-radius: 50%; top: 50%; left: 50%; }
  .ring-1 { width: 200px; height: 200px; margin: -100px 0 0 -100px; animation: spin 20s linear infinite; }
  .ring-2 { width: 280px; height: 280px; margin: -140px 0 0 -140px; animation: spin 30s linear infinite reverse; }
  .ring-3 { width: 360px; height: 360px; margin: -180px 0 0 -180px; animation: spin 40s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ring-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #818cf8; }
  .ring-1 .ring-dot { top: 0; left: 50%; margin-left: -3px; }
  .ring-2 .ring-dot { bottom: 20px; right: 10px; }
  .ring-3 .ring-dot { top: 40px; left: 10px; background: #a78bfa; }

  .logo-icon { font-size: 72px; position: relative; z-index: 1; margin-bottom: 24px; filter: drop-shadow(0 0 30px rgba(99,102,241,0.4)); }

  .brand { position: relative; z-index: 1; }
  .brand h1 { font-size: 36px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #c4b5fd, #818cf8, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand .tagline { font-size: 16px; color: #94a3b8; margin-top: 8px; font-weight: 400; line-height: 1.5; }

  .features { position: relative; z-index: 1; display: flex; gap: 24px; margin-top: 36px; }
  .feature { text-align: center; }
  .feature .f-icon { font-size: 24px; margin-bottom: 6px; }
  .feature .f-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

  .cta-section { position: relative; z-index: 1; margin-top: 44px; width: 100%; }
  .cta-btn { width: 100%; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, #6366f1, #8b5cf6); text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .cta-secondary { text-align: center; margin-top: 14px; font-size: 13px; color: #64748b; }
  .cta-secondary a { color: #818cf8; text-decoration: none; font-weight: 500; }

  .bottom-text { position: absolute; bottom: 40px; font-size: 11px; color: #334155; z-index: 1; }
</style>
</head>
<body>
  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal" style="font-size:14px"></i>
      <i class="fas fa-wifi" style="font-size:14px"></i>
      <i class="fas fa-battery-full" style="font-size:14px"></i>
    </div>
  </div>

  <div class="hero">
    <div class="bg-glow"></div>
    <div class="rings">
      <div class="ring ring-1"><div class="ring-dot"></div></div>
      <div class="ring ring-2"><div class="ring-dot"></div></div>
      <div class="ring ring-3"><div class="ring-dot"></div></div>
    </div>

    <div class="logo-icon">🎧</div>

    <div class="brand">
      <h1>SoulTune AI</h1>
      <div class="tagline">Your sound, decoded.<br>Your soul, understood.</div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="f-icon">🧠</div>
        <div class="f-label">AI Analysis</div>
      </div>
      <div class="feature">
        <div class="f-icon">💜</div>
        <div class="f-label">Mood Diary</div>
      </div>
      <div class="feature">
        <div class="f-icon">🎵</div>
        <div class="f-label">Vibe Create</div>
      </div>
      <div class="feature">
        <div class="f-icon">🤝</div>
        <div class="f-label">Community</div>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-btn"><i class="fas fa-wand-magic-sparkles" style="font-size:14px;"></i> Decode Your Sound</div>
      <div class="cta-secondary">Already have an account? <a href="#">Sign in</a></div>
    </div>

    <div class="bottom-text">Powered by AI · Privacy First</div>
  </div>
</body>
</html>
