<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ravel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#1C1613;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:76px 40px 96px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:70px}
.icon{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,#DD5F3C 0%,#F2A15C 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;box-shadow:0 18px 38px -14px rgba(221,95,60,.6)}
h1{font-size:52px;font-weight:800;letter-spacing:-2.2px;margin-top:26px}
.tag{font-size:18px;color:#6E625B;font-weight:500;margin-top:14px;max-width:640px;line-height:1.5}
.tags{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.tags span{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#8E7C74;border:1px solid #EFE8E3;padding:8px 16px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(3,460px);gap:62px 40px;justify-content:center}
.item{display:flex;flex-direction:column;align-items:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#141010;box-shadow:0 40px 80px -30px rgba(20,16,16,.5),0 0 0 1px rgba(20,16,16,.06)}
.frame iframe{width:100%;height:100%;border:none;border-radius:52px;display:block;background:#F8F4F1}
.lab{margin-top:20px;font-size:15px;font-weight:700;letter-spacing:-.2px}
.no{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#B6A9A1;margin-top:6px}
</style></head>
<body><div class="wrap">
<div class="hero">
  <div class="icon"><i class="fas fa-shuffle"></i></div>
  <h1>Ravel</h1>
  <div class="tag">A chatbot between you and your teen that rewrites what you meant before it lands wrong.</div>
  <div class="tags"><span>Family</span><span>Mediation</span><span>Teens</span><span>Chat AI</span></div>
</div>
<div class="grid">
  <div class="item"><div class="frame"><iframe src="setup.html" scrolling="no"></iframe></div><div class="lab">Pair setup</div><div class="no">01</div></div>
  <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="lab">Today</div><div class="no">02</div></div>
  <div class="item"><div class="frame"><iframe src="compose.html" scrolling="no"></iframe></div><div class="lab">Raw draft</div><div class="no">03</div></div>
  <div class="item"><div class="frame"><iframe src="bridge.html" scrolling="no"></iframe></div><div class="lab">The bridge</div><div class="no">04</div></div>
  <div class="item"><div class="frame"><iframe src="thread.html" scrolling="no"></iframe></div><div class="lab">Shared thread</div><div class="no">05</div></div>
  <div class="item"><div class="frame"><iframe src="repair.html" scrolling="no"></iframe></div><div class="lab">Weekly repair</div><div class="no">06</div></div>
  <div class="item"><div class="frame"><iframe src="read.html" scrolling="no"></iframe></div><div class="lab">The read</div><div class="no">07</div></div>
</div>
</div></body></html>
