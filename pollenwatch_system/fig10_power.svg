<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1200" height="620" fill="#FDFCFA"/><text x="60" y="45" font-size="22" fill="#16202B" font-weight="600">Wiring and power chain</text><rect x="80" y="260" width="140" height="90" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="92" y="294" font-size="14" fill="#16202B" font-weight="600">Li-Po cell</text><text x="92" y="314" font-size="12" fill="#5A6B7A">500 mAh</text><text x="92" y="332" font-size="12" fill="#5A6B7A">3.0-4.2 V</text><rect x="80" y="400" width="140" height="70" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="92" y="428" font-size="13" fill="#16202B" font-weight="600">TP4056</text><text x="92" y="446" font-size="11.5" fill="#5A6B7A">charge from USB-C</text><text x="92" y="462" font-size="11.5" fill="#5A6B7A">500 mA max</text><line x1="150" y1="350" x2="150" y2="400" stroke="#5A6B7A" stroke-width="1.5"/><line x1="330" y1="200" x2="330" y2="520" stroke="#16202B" stroke-width="2.5"/><text x="260" y="190" font-size="12.5" fill="#5A6B7A">battery rail, 3.7 V nom</text><line x1="220" y1="305" x2="330" y2="305" stroke="#16202B" stroke-width="2"/><line x1="330" y1="240" x2="420" y2="240" stroke="#16202B" stroke-width="1.8"/><rect x="420" y="210" width="140" height="60" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="432" y="232" font-size="13" fill="#16202B" font-weight="600">Boost 5 V</text><text x="432" y="248" font-size="11" fill="#5A6B7A">TPS61023</text><text x="432" y="262" font-size="11" fill="#5A6B7A">85-90% eff.</text><line x1="560" y1="240" x2="650" y2="240" stroke="#16202B" stroke-width="1.8"/><rect x="650" y="210" width="230" height="60" rx="8" fill="#fff" stroke="#C4531E" stroke-width="1.8"/><text x="664" y="232" font-size="13" fill="#16202B" font-weight="600">PMS5003</text><text x="664" y="248" font-size="11" fill="#5A6B7A">laser + fan sensor</text><text x="664" y="262" font-size="11" fill="#5A6B7A">100-260 mA active</text><line x1="330" y1="330" x2="420" y2="330" stroke="#16202B" stroke-width="1.8"/><rect x="420" y="300" width="140" height="60" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="432" y="322" font-size="13" fill="#16202B" font-weight="600">LDO 3.3 V</text><text x="432" y="338" font-size="11" fill="#5A6B7A">AP2112</text><text x="432" y="352" font-size="11" fill="#5A6B7A">low quiescent</text><line x1="560" y1="330" x2="650" y2="330" stroke="#16202B" stroke-width="1.8"/><rect x="650" y="300" width="230" height="60" rx="8" fill="#fff" stroke="#C4531E" stroke-width="1.8"/><text x="664" y="322" font-size="13" fill="#16202B" font-weight="600">ESP32-C3</text><text x="664" y="338" font-size="11" fill="#5A6B7A">MCU, BLE radio</text><text x="664" y="352" font-size="11" fill="#5A6B7A">80 mA tx burst, 3 mA idle</text><line x1="330" y1="420" x2="420" y2="420" stroke="#16202B" stroke-width="1.8"/><rect x="420" y="390" width="140" height="60" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="432" y="412" font-size="13" fill="#16202B" font-weight="600">direct 3.7-4.2 V</text><text x="432" y="428" font-size="11" fill="#5A6B7A">no regulation</text><text x="432" y="442" font-size="11" fill="#5A6B7A">battery voltage</text><line x1="560" y1="420" x2="650" y2="420" stroke="#16202B" stroke-width="1.8"/><rect x="650" y="390" width="230" height="60" rx="8" fill="#fff" stroke="#C4531E" stroke-width="1.8"/><text x="664" y="412" font-size="13" fill="#16202B" font-weight="600">RGB LED + buzzer</text><text x="664" y="428" font-size="11" fill="#5A6B7A">alert indicators</text><text x="664" y="442" font-size="11" fill="#5A6B7A">12 mA when lit</text><text x="60" y="560" font-size="13" fill="#5A6B7A">I2C not used; PMS5003 communicates over UART at 9600 baud. Boost converter sized for the sensor</text><text x="60" y="580" font-size="13" fill="#5A6B7A">fan inrush of 260 mA — the missing part in the original plan. See section 4.</text></svg>