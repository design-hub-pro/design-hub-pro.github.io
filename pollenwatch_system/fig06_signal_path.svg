<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1400" height="420" fill="#FDFCFA"/><rect x="70" y="120" width="220" height="150" rx="10" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="86" y="150" font-size="12" letter-spacing="1.5" fill="#C4531E" font-weight="700">SENSE</text><text x="86" y="182" font-size="18" fill="#16202B" font-weight="600">Laser PM sensor</text><text x="86" y="212" font-size="13" fill="#5A6B7A">PMS5003, UART, 1 Hz</text><rect x="330" y="120" width="220" height="150" rx="10" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="346" y="150" font-size="12" letter-spacing="1.5" fill="#C4531E" font-weight="700">PROCESS</text><text x="346" y="182" font-size="18" fill="#16202B" font-weight="600">MCU + calibration</text><text x="346" y="212" font-size="13" fill="#5A6B7A">ESP32-C3, moving avg</text><line x1="290" y1="195" x2="322" y2="195" stroke="#16202B" stroke-width="1.5"/><polygon points="322,189 330,195 322,201" fill="#16202B"/><rect x="590" y="120" width="220" height="150" rx="10" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="606" y="150" font-size="12" letter-spacing="1.5" fill="#C4531E" font-weight="700">DECIDE</text><text x="606" y="182" font-size="18" fill="#16202B" font-weight="600">Threshold compare</text><text x="606" y="212" font-size="13" fill="#5A6B7A">per-user PM10 limit</text><line x1="550" y1="195" x2="582" y2="195" stroke="#16202B" stroke-width="1.5"/><polygon points="582,189 590,195 582,201" fill="#16202B"/><rect x="850" y="120" width="220" height="150" rx="10" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="866" y="150" font-size="12" letter-spacing="1.5" fill="#C4531E" font-weight="700">ACT</text><text x="866" y="182" font-size="18" fill="#16202B" font-weight="600">Alert</text><text x="866" y="212" font-size="13" fill="#5A6B7A">LED + BLE push to phone</text><line x1="810" y1="195" x2="842" y2="195" stroke="#16202B" stroke-width="1.5"/><polygon points="842,189 850,195 842,201" fill="#16202B"/><rect x="1110" y="120" width="220" height="150" rx="10" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="1126" y="150" font-size="12" letter-spacing="1.5" fill="#C4531E" font-weight="700">RECORD</text><text x="1126" y="182" font-size="18" fill="#16202B" font-weight="600">Exposure log</text><text x="1126" y="212" font-size="13" fill="#5A6B7A">flash, synced nightly</text><line x1="1070" y1="195" x2="1102" y2="195" stroke="#16202B" stroke-width="1.5"/><polygon points="1102,189 1110,195 1102,201" fill="#16202B"/><text x="70" y="80" font-size="22" fill="#16202B" font-weight="600">Signal path</text><text x="70" y="310" font-size="13" fill="#5A6B7A">Sample window: 15 s active every 10 min. Alert fires after 3 consecutive windows above threshold (reduces false triggers from single dust puffs).</text></svg>