<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1200" height="560" fill="#FDFCFA"/><text x="60" y="50" font-size="22" fill="#16202B" font-weight="600">Validation rig</text><rect x="80" y="90" width="1040" height="330" rx="10" fill="none" stroke="#16202B" stroke-width="1.5" stroke-dasharray="6 5"/><text x="100" y="115" font-size="13" fill="#5A6B7A">Sealed 1 m³ aerosol chamber</text><rect x="120" y="150" width="140" height="90" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="130" y="180" font-size="13" fill="#16202B" font-weight="600">Aerosol</text><text x="130" y="198" font-size="13" fill="#16202B" font-weight="600">generator</text><text x="130" y="220" font-size="11.5" fill="#5A6B7A">talc + ragweed</text><text x="130" y="234" font-size="11.5" fill="#5A6B7A">pollen surrogate</text><circle cx="440" cy="195" r="34" fill="none" stroke="#5A6B7A" stroke-width="1.5"/><text x="405" y="250" font-size="12" fill="#5A6B7A">mixing fan</text><rect x="640" y="160" width="120" height="60" rx="8" fill="#fff" stroke="#C4531E" stroke-width="2"/><text x="650" y="182" font-size="13" fill="#16202B" font-weight="600">PollenWatch</text><text x="650" y="200" font-size="11" fill="#5A6B7A">(device under</text><text x="650" y="214" font-size="11" fill="#5A6B7A">test)</text><rect x="880" y="140" width="160" height="100" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="895" y="170" font-size="13" fill="#16202B" font-weight="600">TSI DustTrak</text><text x="895" y="188" font-size="13" fill="#16202B" font-weight="600">DRX 8533</text><text x="895" y="210" font-size="11.5" fill="#5A6B7A">reference optical</text><text x="895" y="224" font-size="11.5" fill="#5A6B7A">particle counter</text><line x1="700" y1="300" x2="960" y2="300" stroke="#5A6B7A" stroke-width="2"/><line x1="700" y1="220" x2="700" y2="300" stroke="#5A6B7A" stroke-width="1.5"/><line x1="960" y1="240" x2="960" y2="300" stroke="#5A6B7A" stroke-width="1.5"/><text x="715" y="322" font-size="12" fill="#5A6B7A">common fixture, inlets 15 cm apart, same height</text><rect x="120" y="300" width="140" height="80" rx="8" fill="#fff" stroke="#16202B" stroke-width="1.5"/><text x="130" y="328" font-size="13" fill="#16202B" font-weight="600">Burkard</text><text x="130" y="346" font-size="13" fill="#16202B" font-weight="600">spore trap</text><text x="130" y="366" font-size="11.5" fill="#5A6B7A">7-day field reference</text><text x="80" y="450" font-size="13" fill="#5A6B7A">Chamber run: 5 concentration steps, 10 min each, 6 repeats. Field run: device worn outdoors alongside a fixed Burkard trap for one full pollen season.</text></svg>