<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cadence — Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; background:#15122E; color:#fff; }

  .glow1 { position:absolute; top:-80px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.5), transparent 70%); filter:blur(10px); }
  .glow2 { position:absolute; bottom:120px; left:-90px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle, rgba(251,113,133,0.3), transparent 70%); }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  .content { position:relative; z-index:10; padding:6px 28px 40px; min-height:calc(100% - 59px); display:flex; flex-direction:column; }

  .brand { display:flex; align-items:center; gap:11px; margin-top:14px; }
  .brand-icon { width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#A78BFA,#6D28D9); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(124,58,237,0.5); }
  .brand-icon i { font-size:22px; color:#fff; }
  .brand-name { font-size:20px; font-weight:800; letter-spacing:-0.3px; }

  .head { margin-top:54px; }
  .title { font-size:34px; font-weight:900; letter-spacing:-1.2px; line-height:1.1; }
  .title span { background:linear-gradient(120deg,#C4B5FD,#FB7185); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle { font-size:14.5px; color:rgba(255,255,255,0.55); line-height:1.55; margin-top:12px; }

  .form { margin-top:30px; display:flex; flex-direction:column; gap:14px; }
  .field-label { font-size:11.5px; font-weight:700; color:rgba(255,255,255,0.55); margin-bottom:8px; letter-spacing:0.3px; }
  .input { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:15px 16px; }
  .input.focus { border-color:#A78BFA; box-shadow:0 0 0 3px rgba(167,139,250,0.18); }
  .input i { font-size:15px; color:#A78BFA; width:18px; text-align:center; }
  .input .val { font-size:14px; font-weight:500; }
  .input .eye { margin-left:auto; color:rgba(255,255,255,0.4); font-size:14px; }
  .forgot { text-align:right; font-size:12px; color:#C4B5FD; font-weight:700; margin-top:12px; }

  .cta { margin-top:24px; height:56px; border-radius:17px; background:linear-gradient(135deg,#A78BFA,#6D28D9); display:flex; align-items:center; justify-content:center; gap:10px; font-size:16px; font-weight:800; box-shadow:0 14px 32px rgba(124,58,237,0.45); }
  .cta i { font-size:14px; }

  .divider { display:flex; align-items:center; gap:14px; margin:24px 0; }
  .divider .line { flex:1; height:1px; background:rgba(255,255,255,0.12); }
  .divider span { font-size:11px; color:rgba(255,255,255,0.4); font-weight:600; }

  .socials { display:flex; gap:12px; }
  .social { flex:1; height:52px; border-radius:15px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; gap:9px; font-size:13.5px; font-weight:700; }
  .social i { font-size:17px; }

  .signup { text-align:center; font-size:12.5px; color:rgba(255,255,255,0.5); margin-top:auto; padding-top:28px; }
  .signup b { color:#C4B5FD; font-weight:700; }
</style>
</head>
<body>
<div class="screen">
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-brain"></i></div>
      <div class="brand-name">Cadence</div>
    </div>

    <div class="head">
      <div class="title">Welcome<br><span>back.</span></div>
      <div class="subtitle">Sign in to pick up your plan right where your brain left off.</div>
    </div>

    <div class="form">
      <div>
        <div class="field-label">EMAIL</div>
        <div class="input"><i class="fas fa-envelope"></i><span class="val">ava.chen@school.edu</span></div>
      </div>
      <div>
        <div class="field-label">PASSWORD</div>
        <div class="input focus"><i class="fas fa-lock"></i><span class="val">••••••••••</span><i class="fas fa-eye eye"></i></div>
        <div class="forgot">Forgot password?</div>
      </div>
    </div>

    <div class="cta">Sign In <i class="fas fa-arrow-right"></i></div>

    <div class="divider"><div class="line"></div><span>or continue with</span><div class="line"></div></div>

    <div class="socials">
      <div class="social"><i class="fab fa-apple"></i> Apple</div>
      <div class="social"><i class="fab fa-google"></i> Google</div>
    </div>

    <div class="signup">New to Cadence? <b>Create an account</b></div>
  </div>
</div>
</body>
</html>
