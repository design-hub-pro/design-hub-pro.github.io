<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cadence — Create Account</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow-y:auto; background:#15122E; color:#fff; }

  .glow1 { position:absolute; top:-80px; right:-60px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.5), transparent 70%); filter:blur(10px); }
  .glow2 { position:absolute; bottom:-40px; left:-80px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle, rgba(251,113,133,0.28), transparent 70%); }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  .content { position:relative; z-index:10; padding:6px 28px 40px; }

  .back { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; }
  .back i { font-size:15px; }

  .brand-icon { width:56px; height:56px; border-radius:17px; background:linear-gradient(135deg,#A78BFA,#6D28D9); display:flex; align-items:center; justify-content:center; box-shadow:0 12px 30px rgba(124,58,237,0.5); margin-top:26px; }
  .brand-icon i { font-size:26px; color:#fff; }
  .title { font-size:30px; font-weight:900; letter-spacing:-1px; margin-top:22px; }
  .title span { background:linear-gradient(120deg,#C4B5FD,#FB7185); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle { font-size:14px; color:rgba(255,255,255,0.55); line-height:1.55; margin-top:10px; }

  .form { margin-top:26px; display:flex; flex-direction:column; gap:14px; }
  .field-label { font-size:11.5px; font-weight:700; color:rgba(255,255,255,0.55); margin-bottom:8px; letter-spacing:0.3px; }
  .input { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:15px 16px; }
  .input i { font-size:15px; color:#A78BFA; width:18px; text-align:center; }
  .input .val { font-size:14px; font-weight:500; }
  .input .val.ph { color:rgba(255,255,255,0.4); font-weight:400; }
  .input .eye { margin-left:auto; color:rgba(255,255,255,0.4); font-size:14px; }

  .terms { display:flex; align-items:flex-start; gap:10px; margin-top:18px; }
  .checkbox { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,#8B5CF6,#5B21B6); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .checkbox i { font-size:11px; color:#fff; }
  .terms p { font-size:11.5px; color:rgba(255,255,255,0.55); line-height:1.5; }
  .terms p b { color:#C4B5FD; font-weight:700; }

  .cta { margin-top:22px; height:56px; border-radius:17px; background:linear-gradient(135deg,#A78BFA,#6D28D9); display:flex; align-items:center; justify-content:center; gap:10px; font-size:16px; font-weight:800; box-shadow:0 14px 32px rgba(124,58,237,0.45); }
  .cta i { font-size:14px; }

  .divider { display:flex; align-items:center; gap:14px; margin:22px 0; }
  .divider .line { flex:1; height:1px; background:rgba(255,255,255,0.12); }
  .divider span { font-size:11px; color:rgba(255,255,255,0.4); font-weight:600; }

  .socials { display:flex; gap:12px; }
  .social { flex:1; height:52px; border-radius:15px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; gap:9px; font-size:13.5px; font-weight:700; }
  .social i { font-size:17px; }

  .signin { text-align:center; font-size:12.5px; color:rgba(255,255,255,0.5); margin-top:24px; }
  .signin b { color:#C4B5FD; font-weight:700; }
</style>
</head>
<body>
<div class="screen">
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="back"><i class="fas fa-chevron-left"></i></div>

    <div class="brand-icon"><i class="fas fa-brain"></i></div>
    <div class="title">Create your <span>account</span></div>
    <div class="subtitle">Start turning your notes into a brain-aware calendar in seconds.</div>

    <div class="form">
      <div>
        <div class="field-label">FULL NAME</div>
        <div class="input"><i class="fas fa-user"></i><span class="val">Ava Chen</span></div>
      </div>
      <div>
        <div class="field-label">EMAIL</div>
        <div class="input"><i class="fas fa-envelope"></i><span class="val">ava.chen@school.edu</span></div>
      </div>
      <div>
        <div class="field-label">PASSWORD</div>
        <div class="input"><i class="fas fa-lock"></i><span class="val">••••••••••</span><i class="fas fa-eye eye"></i></div>
      </div>
    </div>

    <div class="terms">
      <div class="checkbox"><i class="fas fa-check"></i></div>
      <p>I agree to Cadence's <b>Terms of Service</b> and <b>Privacy Policy</b>.</p>
    </div>

    <div class="cta">Create Account <i class="fas fa-arrow-right"></i></div>

    <div class="divider"><div class="line"></div><span>or sign up with</span><div class="line"></div></div>

    <div class="socials">
      <div class="social"><i class="fab fa-apple"></i> Apple</div>
      <div class="social"><i class="fab fa-google"></i> Google</div>
    </div>

    <div class="signin">Already have an account? <b>Sign in</b></div>
  </div>
</div>
</body>
</html>
