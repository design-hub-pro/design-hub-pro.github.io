<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cadence — Focus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow:hidden; background:#120F26; color:#fff; }
  .glow { position:absolute; top:120px; left:50%; transform:translateX(-50%); width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.32), transparent 65%); }
  .glow2 { position:absolute; bottom:80px; right:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(251,113,133,0.22), transparent 70%); }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  .content { position:relative; z-index:10; height:calc(100% - 59px); display:flex; flex-direction:column; align-items:center; padding:0 28px 40px; }

  .top-bar { width:100%; display:flex; align-items:center; justify-content:space-between; }
  .top-bar .x { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
  .top-bar .x i { font-size:15px; }
  .session-chip { font-size:11px; font-weight:800; background:rgba(255,255,255,0.1); padding:7px 14px; border-radius:20px; display:flex; align-items:center; gap:7px; }
  .session-chip i { color:#A78BFA; }

  .task-label { font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:0.6px; text-transform:uppercase; margin-top:30px; }
  .task-name { font-size:22px; font-weight:800; margin-top:8px; text-align:center; letter-spacing:-0.4px; }
  .task-meta { font-size:12px; color:rgba(255,255,255,0.5); margin-top:8px; display:flex; align-items:center; gap:7px; }
  .task-meta .d { width:5px; height:5px; border-radius:50%; background:#34D399; }

  /* Timer ring */
  .ring-wrap { position:relative; margin-top:34px; width:248px; height:248px; }
  .ring-wrap svg { transform:rotate(-90deg); }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-time { font-size:52px; font-weight:900; letter-spacing:-2px; }
  .ring-phase { font-size:12px; font-weight:700; color:#A78BFA; letter-spacing:0.5px; margin-top:2px; }
  .ring-pomo { display:flex; gap:7px; margin-top:14px; }
  .ring-pomo .p { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.18); }
  .ring-pomo .p.done { background:#34D399; }
  .ring-pomo .p.on { background:#A78BFA; box-shadow:0 0 10px #A78BFA; }

  .why { margin-top:28px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:13px 15px; display:flex; gap:11px; align-items:center; width:100%; }
  .why-ic { width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,#8B5CF6,#5B21B6); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .why-ic i { font-size:14px; }
  .why p { font-size:11.5px; color:rgba(255,255,255,0.65); line-height:1.45; }
  .why p b { color:#fff; }

  /* Soundscape selector */
  .sound { margin-top:14px; width:100%; }
  .sound-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .sound-head .l { font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:0.5px; text-transform:uppercase; display:flex; align-items:center; gap:7px; }
  .sound-head .l i { color:#A78BFA; }
  .sound-toggle { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; color:#C4B5FD; }
  .sound-toggle .sw { width:34px; height:20px; border-radius:12px; background:linear-gradient(135deg,#A78BFA,#6D28D9); position:relative; }
  .sound-toggle .sw::after { content:''; position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; background:#fff; }
  .sound-opts { display:flex; gap:8px; overflow-x:auto; }
  .sopt { min-width:74px; flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:11px 8px; text-align:center; }
  .sopt i { font-size:16px; color:rgba(255,255,255,0.7); }
  .sopt span { display:block; font-size:9.5px; font-weight:700; color:rgba(255,255,255,0.6); margin-top:6px; }
  .sopt.on { background:linear-gradient(135deg,rgba(167,139,250,0.35),rgba(124,58,237,0.22)); border-color:#A78BFA; }
  .sopt.on i, .sopt.on span { color:#fff; }
  .sopt.on i { color:#C4B5FD; }

  .controls { margin-top:auto; display:flex; align-items:center; justify-content:center; gap:24px; width:100%; }
  .ctrl { width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
  .ctrl i { font-size:17px; color:rgba(255,255,255,0.85); }
  .ctrl.main { width:78px; height:78px; background:linear-gradient(135deg,#A78BFA,#6D28D9); box-shadow:0 14px 34px rgba(124,58,237,0.5); }
  .ctrl.main i { font-size:26px; color:#fff; }
</style>
</head>
<body>
<div class="screen">
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <div class="top-bar">
      <div class="x"><i class="fas fa-chevron-down"></i></div>
      <div class="session-chip"><i class="fas fa-bolt"></i> Peak focus window</div>
      <div class="x"><i class="fas fa-ellipsis"></i></div>
    </div>

    <div class="task-label">Now focusing on</div>
    <div class="task-name">AP Bio · Cell Respiration</div>
    <div class="task-meta"><span class="d"></span> Pomodoro 2 of 2 · Deep work</div>

    <div class="ring-wrap">
      <svg width="248" height="248" viewBox="0 0 248 248">
        <circle cx="124" cy="124" r="112" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="14"/>
        <circle cx="124" cy="124" r="112" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="703.7" stroke-dashoffset="232"/>
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#FB7185"/>
        </linearGradient></defs>
      </svg>
      <div class="ring-center">
        <div class="ring-time">17:42</div>
        <div class="ring-phase">FOCUS · 25 MIN</div>
        <div class="ring-pomo">
          <span class="p done"></span><span class="p on"></span>
        </div>
      </div>
    </div>

    <div class="why">
      <div class="why-ic"><i class="fas fa-brain"></i></div>
      <p><b>Scheduled here on purpose.</b> This is your sharpest window — a 5-min break follows to lock in what you just learned.</p>
    </div>

    <!-- Soundscape -->
    <div class="sound">
      <div class="sound-head">
        <div class="l"><i class="fas fa-headphones"></i> Focus sound</div>
        <div class="sound-toggle"><span>On</span><span class="sw"></span></div>
      </div>
      <div class="sound-opts">
        <div class="sopt"><i class="fas fa-volume-xmark"></i><span>Silence</span></div>
        <div class="sopt on"><i class="fas fa-music"></i><span>Lofi</span></div>
        <div class="sopt"><i class="fas fa-wind"></i><span>White noise</span></div>
        <div class="sopt"><i class="fas fa-cloud-rain"></i><span>Rain</span></div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl"><i class="fas fa-forward-step"></i></div>
      <div class="ctrl main"><i class="fas fa-pause"></i></div>
      <div class="ctrl"><i class="fas fa-check"></i></div>
    </div>
  </div>
</div>
</body>
</html>
