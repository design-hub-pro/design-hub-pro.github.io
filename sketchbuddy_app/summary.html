<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Finished</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content full">
    <div class="flex items-center justify-between mt-2">
      <div class="icon-btn"><i class="fa-solid fa-xmark"></i></div>
      <div class="icon-btn"><i class="fa-solid fa-share-nodes"></i></div>
    </div>

    <div class="text-center mt-2">
      <div class="flex justify-center gap-1 text-[30px] text-[#F2A81D]"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star -mt-2 text-[38px]"></i><i class="fa-regular fa-star"></i></div>
      <h1 class="round text-[32px] font-semibold mt-1">You drew a cat!</h1>
    </div>

    <div class="hero h-[300px] mt-4 rotate-[-1.5deg]">
      <img src="img/paper.jpg" alt="Finished cat drawing" style="object-position:center 45%">
      <div class="absolute top-3 left-3 bg-white/95 rounded-full px-3 py-1 text-[11px] font-bold flex items-center gap-1.5"><i class="fa-solid fa-camera text-[#3B7BEA]"></i>Saved photo</div>
      <div class="absolute bottom-3 right-3 bg-black/45 backdrop-blur text-white rounded-full px-3 py-1.5 text-[12px] font-bold"><i class="fa-solid fa-play text-[10px] mr-1"></i>Stroke replay · 1:12</div>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-5">
      <div class="card !p-3 text-center"><div class="num text-[32px] font-semibold text-[#FF5A36] leading-none">86</div><div class="text-[11px] font-semibold text-[#9A907F] mt-1">Score</div></div>
      <div class="card !p-3 text-center"><div class="num text-[32px] font-semibold text-[#1FA88A] leading-none">2<span class="text-[16px]">/6</span></div><div class="text-[11px] font-semibold text-[#9A907F] mt-1">Arm helped</div></div>
      <div class="card !p-3 text-center"><div class="num text-[32px] font-semibold text-[#3B7BEA] leading-none">7<span class="text-[16px]">m</span></div><div class="text-[11px] font-semibold text-[#9A907F] mt-1">Time</div></div>
    </div>

    <div class="label mt-5 mb-2.5">Every stroke</div>
    <div class="card !p-4">
      <div class="flex items-end justify-between h-[86px] gap-2.5">
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-gradient-to-t from-[#1FA88A] to-[#6FE0C4]" style="height:78px"></div><span class="text-[11px] font-bold text-[#9A907F]">1</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-gradient-to-t from-[#1FA88A] to-[#6FE0C4]" style="height:70px"></div><span class="text-[11px] font-bold text-[#9A907F]">2</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5 relative"><i class="fa-solid fa-robot text-[10px] text-[#1FA88A] absolute -top-4"></i><div class="w-full rounded-lg bg-gradient-to-t from-[#F2A81D] to-[#FFD97A]" style="height:52px"></div><span class="text-[11px] font-bold text-[#9A907F]">3</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-gradient-to-t from-[#1FA88A] to-[#6FE0C4]" style="height:74px"></div><span class="text-[11px] font-bold text-[#9A907F]">4</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5 relative"><i class="fa-solid fa-robot text-[10px] text-[#1FA88A] absolute top-0"></i><div class="w-full rounded-lg bg-gradient-to-t from-[#F2A81D] to-[#FFD97A]" style="height:58px"></div><span class="text-[11px] font-bold text-[#9A907F]">5</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-gradient-to-t from-[#1FA88A] to-[#6FE0C4]" style="height:80px"></div><span class="text-[11px] font-bold text-[#9A907F]">6</span></div>
      </div>
    </div>

    <div class="flex items-center gap-3 mt-5">
      <div class="flex-1 btn btn-ghost"><i class="fa-solid fa-images text-[#8152D6]"></i>Gallery</div>
      <div class="flex-1 btn btn-primary"><i class="fa-solid fa-rotate-right"></i>Draw again</div>
    </div>
  </div>
</div></body></html>
