<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <img src="img/hero.jpg" class="absolute inset-0 w-full h-[66%] object-cover" alt="Child drawing with robot arm">
  <div class="absolute inset-0 h-[66%]" style="background:linear-gradient(180deg,rgba(31,42,68,.35) 0%,rgba(31,42,68,0) 30%,rgba(251,247,240,0) 70%,#FBF7F0 100%)"></div>
  <div class="status-bar light"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>

  <div class="absolute left-[28px] top-[78px] flex items-center gap-2 bg-white/90 backdrop-blur rounded-full pl-1.5 pr-3.5 py-1.5">
    <div class="w-7 h-7 rounded-full g-orange flex items-center justify-center"><i class="fa-solid fa-pencil text-white text-[12px]"></i></div>
    <span class="round font-semibold text-[15px]">SketchBuddy</span>
  </div>

  <!-- floating live chips -->
  <div class="absolute right-[24px] top-[300px] bg-white rounded-2xl px-3 py-2.5 shadow-xl flex items-center gap-2.5">
    <div class="gi g-mint !w-8 !h-8 !rounded-xl !text-[13px]"><i class="fa-solid fa-check"></i></div>
    <div><div class="text-[11px] text-gray-400 font-semibold">Stroke 3 of 6</div><div class="text-[13px] font-bold">Nice round curve</div></div>
  </div>
  <div class="absolute left-[24px] top-[430px] bg-white rounded-2xl px-3 py-2 shadow-xl flex items-center gap-2">
    <span class="dot bg-emerald-400"></span><span class="text-[12px] font-bold">Arm guiding</span>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-[28px] pb-[44px]">
    <h1 class="round text-[38px] leading-[1.05] font-semibold">Learn the motion,<br>not just the picture.</h1>
    <p class="mt-3 text-[15px] text-[#6B7390] leading-relaxed">A gentle robot arm guides each stroke. Your phone watches and says what to fix, right away.</p>
    <div class="flex gap-1.5 mt-6"><span class="h-1.5 w-7 rounded-full bg-[#FF5A36]"></span><span class="h-1.5 w-1.5 rounded-full bg-[#E3D9C8]"></span><span class="h-1.5 w-1.5 rounded-full bg-[#E3D9C8]"></span></div>
    <div class="btn btn-primary mt-6">Set up SketchBuddy <i class="fa-solid fa-arrow-right"></i></div>
    <div class="text-center mt-4 text-[14px] text-[#6B7390]">I already have an account · <span class="font-bold text-[#1F2A44]">Sign in</span></div>
  </div>
</div></body></html>
