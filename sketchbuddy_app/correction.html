<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stroke check</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content full">
    <div class="flex items-center justify-between mt-2">
      <div class="icon-btn"><i class="fa-solid fa-chevron-left"></i></div>
      <span class="round text-[18px] font-semibold">Stroke 3 check</span>
      <div class="icon-btn"><i class="fa-solid fa-volume-high"></i></div>
    </div>

    <!-- overlay compare -->
    <div class="paper rounded-[30px] mt-4 h-[300px] relative shadow-[0_10px_30px_rgba(70,50,20,.08)] overflow-hidden">
      <svg viewBox="0 0 200 150" class="absolute inset-0 w-full h-full" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="100" cy="112" r="40" stroke="#E8DFD0" stroke-width="3"/>
        <path d="M70 88 L74 56 L92 74" stroke="#E8DFD0" stroke-width="3"/>
        <path d="M108 74 L127 42 L132 88" stroke="#6FE0C4" stroke-width="9" opacity=".45"/>
        <path d="M108 74 L122 56 L131 88" stroke="#FF7A45" stroke-width="3.5"/>
        <path d="M122 56 L127 42" stroke="#F2A81D" stroke-width="1.6" stroke-dasharray="2 2"/>
        <path d="M108 74 A 20 20 0 0 1 116 66" stroke="#1F2A44" stroke-width="1"/>
      </svg>
      <div class="absolute bg-[#1F2A44] text-white text-[11px] font-bold rounded-full px-2.5 py-1" style="right:58px;top:40px">14° too flat</div>
      <div class="absolute bottom-4 left-4 flex gap-2 text-[11px] font-bold">
        <span class="bg-white rounded-full px-2.5 py-1 shadow-sm flex items-center gap-1.5"><span class="w-3 h-1.5 rounded bg-[#6FE0C4]"></span>Goal</span>
        <span class="bg-white rounded-full px-2.5 py-1 shadow-sm flex items-center gap-1.5"><span class="w-3 h-1.5 rounded bg-[#FF7A45]"></span>Mia</span>
      </div>
      <div class="absolute bottom-4 right-4 w-10 h-10 rounded-full bg-[#1F2A44] text-white flex items-center justify-center"><i class="fa-solid fa-play text-[12px]"></i></div>
    </div>

    <!-- score + buddy -->
    <div class="flex items-center gap-4 mt-5">
      <div class="relative w-[96px] h-[96px] flex-shrink-0">
        <svg viewBox="0 0 36 36" class="w-full h-full -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#EFE7DA" stroke-width="3.4"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#F2A81D" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="70 100"/></svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="num text-[30px] font-semibold leading-none">72</span><span class="text-[10px] font-bold text-[#9A907F]">of 100</span></div>
      </div>
      <div class="flex-1 bg-white rounded-[20px] rounded-tl-md p-3.5 shadow-sm">
        <div class="text-[15px] font-bold leading-snug">Close! Make the ear go up higher before you turn down.</div>
        <div class="flex items-center gap-1.5 mt-1.5 text-[12px] font-semibold text-[#1FA88A]"><i class="fa-solid fa-robot"></i>Arm can show you</div>
      </div>
    </div>

    <!-- metric rows -->
    <div class="card mt-4 !p-4 space-y-3.5">
      <div class="flex items-center gap-3"><div class="gi g-mint !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-draw-polygon"></i></div><span class="w-[70px] text-[13px] font-bold">Shape</span><div class="track flex-1"><div class="fill mint" style="width:90%"></div></div><span class="num w-8 text-right font-semibold">90</span></div>
      <div class="flex items-center gap-3"><div class="gi g-sun !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-compass-drafting"></i></div><span class="w-[70px] text-[13px] font-bold">Angle</span><div class="track flex-1"><div class="fill sun" style="width:54%"></div></div><span class="num w-8 text-right font-semibold">54</span></div>
      <div class="flex items-center gap-3"><div class="gi g-sky !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-ruler-horizontal"></i></div><span class="w-[70px] text-[13px] font-bold">Spacing</span><div class="track flex-1"><div class="fill sky" style="width:86%"></div></div><span class="num w-8 text-right font-semibold">86</span></div>
      <div class="flex items-center gap-3"><div class="gi g-plum !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-weight-hanging"></i></div><span class="w-[70px] text-[13px] font-bold">Pressure</span><div class="track flex-1"><div class="fill plum" style="width:62%"></div></div><span class="num w-8 text-right font-semibold">62</span></div>
      <div class="text-[11px] text-[#9A907F] pl-12">Pressure is estimated from line darkness and arm sensor.</div>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-5">
      <div class="btn btn-ghost"><i class="fa-solid fa-hand-holding text-[#1FA88A]"></i>Try with arm</div>
      <div class="btn btn-primary">Keep it <i class="fa-solid fa-arrow-right"></i></div>
    </div>
  </div>
</div></body></html>
