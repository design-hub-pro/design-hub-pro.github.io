<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SketchBuddy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#1F2A44}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2d2b33,#0c0b10);box-shadow:0 50px 80px -30px rgba(40,30,70,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#FBF7F0}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center bg-gradient-to-br from-orange-400 to-rose-500"><i class="fa-solid fa-pencil text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-semibold tracking-tight" style="font-family:'Fredoka',sans-serif">SketchBuddy</h1>
  <p class="mt-3 text-[19px] text-gray-500">A robot arm and phone camera teach kids to draw, one stroke at a time.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-700">Kids</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Robotics</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Computer Vision</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Education</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="library.html" scrolling="no" title="library"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="template.html" scrolling="no" title="template"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="setup.html" scrolling="no" title="setup"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="live.html" scrolling="no" title="live"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="guide.html" scrolling="no" title="guide"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="correction.html" scrolling="no" title="correction"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="summary.html" scrolling="no" title="summary"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="progress.html" scrolling="no" title="progress"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="gallery.html" scrolling="no" title="gallery"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="family.html" scrolling="no" title="family"></iframe></div></div>
</div></main>
</body></html>
