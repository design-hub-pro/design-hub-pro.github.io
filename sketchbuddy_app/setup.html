<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Set up paper</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen" style="background:#141A2B">
  <img src="img/paper.jpg" class="absolute inset-0 w-full h-full object-cover opacity-90" style="filter:saturate(.8)" alt="Paper on desk">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(20,26,43,.75) 0%,rgba(20,26,43,0) 22%,rgba(20,26,43,0) 55%,rgba(20,26,43,.95) 100%)"></div>
  <div class="status-bar light"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>

  <div class="relative z-10 flex items-center justify-between px-[28px] mt-2 text-white">
    <div class="w-[42px] h-[42px] rounded-[14px] bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <span class="text-[15px] font-bold">Line up the paper</span>
    <div class="w-[42px] h-[42px] rounded-[14px] bg-white/15 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
  </div>

  <!-- corner markers on detected paper -->
  <div class="absolute" style="left:78px;top:128px;width:280px;height:600px">
    <div class="absolute inset-0 border-2 border-[#6FE0C4] rounded-md" style="box-shadow:0 0 0 2000px rgba(20,26,43,.15)"></div>
    <span class="absolute -left-3 -top-3 w-7 h-7 rounded-full bg-[#6FE0C4] border-4 border-white"></span>
    <span class="absolute -right-3 -top-3 w-7 h-7 rounded-full bg-[#6FE0C4] border-4 border-white"></span>
    <span class="absolute -left-3 -bottom-3 w-7 h-7 rounded-full bg-[#6FE0C4] border-4 border-white"></span>
    <span class="absolute -right-3 -bottom-3 w-7 h-7 rounded-full bg-[#FFD97A] border-4 border-white animate-pulse"></span>
    <div class="absolute left-1/2 -translate-x-1/2 top-4 bg-[#1F2A44]/80 backdrop-blur text-white text-[12px] font-bold rounded-full px-3 py-1.5 whitespace-nowrap"><i class="fa-solid fa-expand mr-1.5 text-[#6FE0C4]"></i>A4 found · tilt 3°</div>
  </div>

  <div class="absolute bottom-0 left-0 right-0 px-[28px] pb-[40px] text-white">
    <div class="grid grid-cols-3 gap-2.5">
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-white/70"><span class="dot bg-emerald-400"></span>Light</div><div class="num text-[22px] font-semibold mt-1">Good</div></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-white/70"><span class="dot bg-emerald-400"></span>Corners</div><div class="num text-[22px] font-semibold mt-1">3/4</div></div>
      <div class="rounded-2xl bg-white/10 backdrop-blur p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-white/70"><span class="dot bg-amber-400"></span>Arm reach</div><div class="num text-[22px] font-semibold mt-1">94%</div></div>
    </div>
    <div class="mt-4 text-[14px] text-white/80 flex items-center gap-2"><i class="fa-solid fa-arrows-up-down-left-right text-[#FFD97A]"></i>Slide the paper a little toward the arm.</div>
    <div class="btn mt-5 bg-white text-[#1F2A44]"><i class="fa-solid fa-check"></i>Paper is set</div>
  </div>
</div></body></html>
