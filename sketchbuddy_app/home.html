<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content">
    <div class="flex items-center justify-between mt-2">
      <div class="flex items-center gap-3">
        <img src="img/kid.jpg" class="av w-12 h-12" alt="Mia">
        <div><div class="text-[13px] text-[#9A907F] font-semibold">Hi Mia</div><div class="round text-[22px] font-semibold leading-tight">Ready to draw?</div></div>
      </div>
      <div class="flex items-center gap-1.5 bg-white rounded-full px-3 py-2 shadow-sm"><i class="fa-solid fa-fire text-[#FF5A36]"></i><span class="num font-semibold">6</span></div>
    </div>

    <!-- device strip -->
    <div class="mt-4 flex items-center gap-2 text-[12px] font-semibold text-[#6B7390]">
      <span class="chip !py-1.5"><span class="dot bg-emerald-400"></span>Arm ready</span>
      <span class="chip !py-1.5"><span class="dot bg-emerald-400"></span>Camera on stand</span>
      <span class="chip !py-1.5"><i class="fa-solid fa-battery-three-quarters text-[#1FA88A]"></i>82%</span>
    </div>

    <!-- today hero -->
    <div class="hero h-[290px] mt-4">
      <img src="img/paper.jpg" alt="Cat drawing" style="object-position:center 40%">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(31,42,68,0) 30%,rgba(31,42,68,.85))"></div>
      <div class="absolute top-4 left-4 bg-white/95 rounded-full px-3 py-1 text-[11px] font-bold text-[#FF5A36]">TODAY'S PICK</div>
      <div class="absolute top-4 right-4 bg-black/40 backdrop-blur rounded-full px-2.5 py-1 text-[11px] font-bold text-white"><i class="fa-solid fa-play text-[9px] mr-1"></i>0:40 demo</div>
      <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
        <div class="round text-[28px] font-semibold">Sleepy Cat</div>
        <div class="flex items-center gap-3 text-[13px] text-white/80 mt-0.5"><span><i class="fa-solid fa-pen-nib mr-1"></i>6 strokes</span><span><i class="fa-regular fa-clock mr-1"></i>8 min</span><span><i class="fa-solid fa-star mr-1 text-amber-300"></i>Level 2</span></div>
        <div class="flex items-center gap-3 mt-3">
          <div class="flex-1"><div class="h-1.5 bg-white/25 rounded-full"><div class="h-full w-1/2 bg-white rounded-full"></div></div></div>
          <div class="bg-white text-[#1F2A44] rounded-full h-10 px-4 flex items-center gap-2 font-bold text-[14px]"><i class="fa-solid fa-play"></i>Resume 3/6</div>
        </div>
      </div>
    </div>

    <!-- stats -->
    <div class="grid grid-cols-3 gap-3 mt-4">
      <div class="card !p-3.5"><div class="num text-[30px] font-semibold text-[#FF5A36] leading-none">84</div><div class="text-[11px] font-semibold text-[#9A907F] mt-1.5">Stroke score</div></div>
      <div class="card !p-3.5"><div class="num text-[30px] font-semibold text-[#1FA88A] leading-none">41<span class="text-[16px]">%</span></div><div class="text-[11px] font-semibold text-[#9A907F] mt-1.5">Arm help</div></div>
      <div class="card !p-3.5"><div class="num text-[30px] font-semibold text-[#3B7BEA] leading-none">23</div><div class="text-[11px] font-semibold text-[#9A907F] mt-1.5">Drawings</div></div>
    </div>

    <div class="flex items-center justify-between mt-6 mb-3"><div class="round text-[19px] font-semibold">Try next</div><span class="text-[13px] font-bold text-[#FF5A36]">Library</span></div>
    <div class="hscroll">
      <div class="w-[132px] flex-shrink-0"><div class="paper h-[132px] rounded-[22px] shadow-sm flex items-center justify-center"><i class="fa-solid fa-fish text-[52px] text-[#3B7BEA]"></i></div><div class="font-bold text-[14px] mt-2">Fish</div><div class="text-[11px] text-[#9A907F]">4 strokes</div></div>
      <div class="w-[132px] flex-shrink-0"><div class="paper h-[132px] rounded-[22px] shadow-sm flex items-center justify-center"><span class="round text-[70px] font-semibold text-[#8152D6]">M</span></div><div class="font-bold text-[14px] mt-2">Letter M</div><div class="text-[11px] text-[#9A907F]">4 strokes</div></div>
      <div class="w-[132px] flex-shrink-0"><div class="paper h-[132px] rounded-[22px] shadow-sm flex items-center justify-center"><i class="fa-solid fa-sun text-[52px] text-[#F2A81D]"></i></div><div class="font-bold text-[14px] mt-2">Sun</div><div class="text-[11px] text-[#9A907F]">9 strokes</div></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab active"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-shapes"></i>Library</div>
    <div class="tab-draw"><i class="fa-solid fa-pencil"></i></div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Progress</div>
    <div class="tab"><i class="fa-solid fa-user-group"></i>Family</div>
  </div>
</div></body></html>
