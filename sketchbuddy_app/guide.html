<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arm guiding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen" style="background:#E3F7F1">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content full">
    <div class="flex items-center justify-between mt-2">
      <div class="icon-btn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="flex items-center gap-2 bg-[#1FA88A] text-white rounded-full px-3.5 py-2 text-[13px] font-bold"><span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>Arm is guiding</div>
      <div class="icon-btn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>

    <div class="hero h-[330px] mt-4">
      <img src="img/hero.jpg" alt="Arm guiding a child's crayon" style="object-position:62% 70%;transform:scale(1.4);transform-origin:62% 75%">
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(31,42,68,0) 55%,rgba(31,42,68,.7))"></div>
      <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between text-white">
        <div><div class="text-[12px] font-bold text-white/70">Hold mode</div><div class="round text-[22px] font-semibold">Hand over hand</div></div>
        <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-video"></i></div>
      </div>
    </div>

    <!-- path progress -->
    <div class="card mt-4 !p-4 flex items-center gap-4">
      <div class="paper w-[110px] h-[110px] rounded-[18px] flex items-center justify-center flex-shrink-0">
        <svg viewBox="0 0 60 60" class="w-[80px] h-[80px]" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 50 L30 10 L50 50" stroke="#E8DFD0" stroke-width="4"/><path d="M10 50 L30 10 L38 26" stroke="#1FA88A" stroke-width="4"/><circle cx="38" cy="26" r="4.5" fill="#fff" stroke="#1FA88A" stroke-width="2.5"/></svg>
      </div>
      <div class="flex-1">
        <div class="text-[12px] font-bold text-[#9A907F]">Ear stroke · 3 of 6</div>
        <div class="num text-[34px] font-semibold leading-none mt-1">64<span class="text-[16px]">%</span></div>
        <div class="track mt-2"><div class="fill mint" style="width:64%"></div></div>
        <div class="text-[12px] text-[#6B7390] font-semibold mt-2">Feel it go up, then down</div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-3">
      <div class="card !p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-[#9A907F]"><span class="dot bg-emerald-400"></span>Grip</div><div class="num text-[22px] font-semibold mt-1">0.8<span class="text-[12px]">N</span></div></div>
      <div class="card !p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-[#9A907F]"><span class="dot bg-emerald-400"></span>Speed</div><div class="num text-[22px] font-semibold mt-1">Slow</div></div>
      <div class="card !p-3"><div class="flex items-center gap-1.5 text-[11px] font-bold text-[#9A907F]"><span class="dot bg-sky-400"></span>Mia leads</div><div class="num text-[22px] font-semibold mt-1">35<span class="text-[12px]">%</span></div></div>
    </div>

    <div class="grid grid-cols-[1fr_auto] gap-3 mt-5">
      <div class="btn btn-ghost"><i class="fa-solid fa-feather text-[#1FA88A]"></i>Let me try alone</div>
      <div class="btn w-14 bg-[#E84D4D] text-white shadow-[0_10px_20px_rgba(232,77,77,.3)]"><i class="fa-solid fa-hand"></i></div>
    </div>
    <div class="text-center text-[11px] text-[#6B7390] font-semibold mt-2">Red button stops the arm at once</div>
  </div>
</div></body></html>
