<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content">
    <div class="flex items-center justify-between mt-2">
      <h1 class="round text-[30px] font-semibold">Progress</h1>
      <div class="flex items-center gap-2 bg-white rounded-full pl-1 pr-3 py-1 shadow-sm"><img src="img/kid.jpg" class="av w-8 h-8" alt=""><span class="text-[14px] font-bold">Mia</span><i class="fa-solid fa-chevron-down text-[11px] text-[#9A907F]"></i></div>
    </div>
    <div class="bg-white rounded-2xl p-1 grid grid-cols-3 mt-4 shadow-sm text-[13px] font-bold text-center">
      <div class="py-2 rounded-xl bg-[#1F2A44] text-white">Week</div><div class="py-2 text-[#6B7390]">Month</div><div class="py-2 text-[#6B7390]">All</div>
    </div>

    <!-- arm help fading: the key parent metric -->
    <div class="card mt-4 !p-5">
      <div class="flex items-start justify-between">
        <div><div class="label">Arm help needed</div><div class="flex items-baseline gap-2 mt-1"><span class="num text-[36px] font-semibold leading-none">41%</span><span class="text-[13px] font-bold text-[#1FA88A]"><i class="fa-solid fa-arrow-down"></i> from 78%</span></div></div>
        <div class="gi g-mint"><i class="fa-solid fa-robot"></i></div>
      </div>
      <svg viewBox="0 0 320 110" class="w-full mt-3">
        <defs><linearGradient id="a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1FA88A" stop-opacity=".25"/><stop offset="1" stop-color="#1FA88A" stop-opacity="0"/></linearGradient></defs>
        <g stroke="#EFE7DA" stroke-width="1"><line x1="0" y1="20" x2="320" y2="20"/><line x1="0" y1="55" x2="320" y2="55"/><line x1="0" y1="90" x2="320" y2="90"/></g>
        <path d="M0 18 L53 26 L106 34 L160 46 L213 52 L266 64 L320 70 L320 110 L0 110Z" fill="url(#a)"/>
        <path d="M0 18 L53 26 L106 34 L160 46 L213 52 L266 64 L320 70" fill="none" stroke="#1FA88A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="320" cy="70" r="5" fill="#fff" stroke="#1FA88A" stroke-width="3"/>
      </svg>
      <div class="flex justify-between text-[11px] font-bold text-[#B3AA9C] mt-1"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="text-[12px] text-[#6B7390] mt-3">Less help means Mia is moving on her own.</div>
    </div>

    <div class="label mt-5 mb-2.5">Stroke skills</div>
    <div class="grid grid-cols-2 gap-3">
      <div class="card !p-4"><div class="flex items-center justify-between"><div class="gi g-mint !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-draw-polygon"></i></div><span class="text-[12px] font-bold text-[#1FA88A]">+9</span></div><div class="num text-[30px] font-semibold mt-2 leading-none">88</div><div class="text-[12px] font-semibold text-[#9A907F] mt-1">Shape</div></div>
      <div class="card !p-4 ring-2 ring-[#FFD97A]"><div class="flex items-center justify-between"><div class="gi g-sun !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-compass-drafting"></i></div><span class="text-[11px] font-bold text-[#F2A81D] bg-[#FFF5DA] rounded-full px-2 py-0.5">Focus</span></div><div class="num text-[30px] font-semibold mt-2 leading-none">67</div><div class="text-[12px] font-semibold text-[#9A907F] mt-1">Angle</div></div>
      <div class="card !p-4"><div class="flex items-center justify-between"><div class="gi g-sky !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-ruler-horizontal"></i></div><span class="text-[12px] font-bold text-[#1FA88A]">+4</span></div><div class="num text-[30px] font-semibold mt-2 leading-none">81</div><div class="text-[12px] font-semibold text-[#9A907F] mt-1">Spacing</div></div>
      <div class="card !p-4"><div class="flex items-center justify-between"><div class="gi g-plum !w-9 !h-9 !rounded-xl !text-[14px]"><i class="fa-solid fa-weight-hanging"></i></div><span class="text-[12px] font-bold text-[#1FA88A]">+6</span></div><div class="num text-[30px] font-semibold mt-2 leading-none">74</div><div class="text-[12px] font-semibold text-[#9A907F] mt-1">Pressure</div></div>
    </div>

    <div class="card mt-4 flex items-center gap-3">
      <div class="gi g-orange"><i class="fa-solid fa-lightbulb"></i></div>
      <div class="flex-1"><div class="font-bold text-[14px]">Try Letter M next</div><div class="text-[12px] text-[#9A907F]">4 sharp angles to practice</div></div>
      <i class="fa-solid fa-chevron-right text-[#B3AA9C]"></i>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-shapes"></i>Library</div>
    <div class="tab-draw"><i class="fa-solid fa-pencil"></i></div>
    <div class="tab active"><i class="fa-solid fa-chart-simple"></i>Progress</div>
    <div class="tab"><i class="fa-solid fa-user-group"></i>Family</div>
  </div>
</div></body></html>
