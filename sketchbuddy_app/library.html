<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content">
    <div class="flex items-center justify-between mt-2">
      <h1 class="round text-[30px] font-semibold">Library</h1>
      <div class="icon-btn"><i class="fa-solid fa-sliders"></i></div>
    </div>
    <div class="mt-3 bg-white rounded-2xl h-12 flex items-center px-4 gap-3 text-[#B3AA9C] shadow-sm"><i class="fa-solid fa-magnifying-glass"></i><span class="text-[15px]">Search animals, letters…</span></div>

    <!-- category tiles -->
    <div class="grid grid-cols-4 gap-2.5 mt-4">
      <div class="text-center"><div class="gi g-orange !w-full !h-[64px] !rounded-[20px] !text-[24px]"><i class="fa-solid fa-paw"></i></div><div class="text-[12px] font-bold mt-1.5">Animals</div></div>
      <div class="text-center"><div class="gi g-plum !w-full !h-[64px] !rounded-[20px] !text-[24px] round font-semibold">Aa</div><div class="text-[12px] font-bold mt-1.5">Letters</div></div>
      <div class="text-center"><div class="gi g-sky !w-full !h-[64px] !rounded-[20px] !text-[24px]"><i class="fa-solid fa-shapes"></i></div><div class="text-[12px] font-bold mt-1.5">Shapes</div></div>
      <div class="text-center"><div class="gi g-mint !w-full !h-[64px] !rounded-[20px] !text-[24px] round font-semibold">123</div><div class="text-[12px] font-bold mt-1.5">Numbers</div></div>
    </div>

    <div class="flex gap-2 mt-5 overflow-x-auto -mx-[28px] px-[28px]">
      <span class="chip active">All levels</span><span class="chip"><span class="dot bg-emerald-400"></span>Level 1</span><span class="chip"><span class="dot bg-amber-400"></span>Level 2</span><span class="chip"><span class="dot bg-rose-400"></span>Level 3</span>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="card !p-3">
        <div class="paper h-[132px] rounded-[16px] relative flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-[110px] h-[110px]" fill="none" stroke="#FF5A36" stroke-width="6" stroke-linecap="round"><circle cx="100" cy="78" r="36"/><path d="M72 56 L76 30 L92 46"/><path d="M108 46 L124 30 L128 56"/><path d="M78 110 C60 150 70 182 100 182 C130 182 140 150 122 110"/><path d="M134 170 C162 168 170 142 156 126"/></svg>
          <span class="absolute top-2 right-2 dot bg-amber-400"></span>
        </div>
        <div class="flex items-center justify-between mt-2.5"><div class="font-bold text-[14px]">Sleepy Cat</div><i class="fa-solid fa-heart text-[#FF5A36] text-[13px]"></i></div>
        <div class="flex items-center gap-2 mt-1"><div class="track flex-1"><div class="fill" style="width:50%"></div></div><span class="text-[11px] font-bold text-[#9A907F]">3/6</span></div>
      </div>
      <div class="card !p-3">
        <div class="paper h-[132px] rounded-[16px] relative flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-[110px] h-[110px]" fill="none" stroke="#3B7BEA" stroke-width="6" stroke-linecap="round"><path d="M40 100 C70 60 130 60 150 100 C130 140 70 140 40 100"/><path d="M150 100 L178 74 L178 126 Z"/><circle cx="72" cy="94" r="4"/></svg>
          <span class="absolute top-2 right-2 dot bg-emerald-400"></span>
        </div>
        <div class="flex items-center justify-between mt-2.5"><div class="font-bold text-[14px]">Fish</div><i class="fa-regular fa-heart text-[#B3AA9C] text-[13px]"></i></div>
        <div class="text-[11px] font-bold text-[#9A907F] mt-1">4 strokes · New</div>
      </div>
      <div class="card !p-3">
        <div class="paper h-[132px] rounded-[16px] relative flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-[110px] h-[110px]" fill="none" stroke="#8152D6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50 160 L50 44 L100 110 L150 44 L150 160"/></svg>
          <span class="absolute top-2 right-2 dot bg-emerald-400"></span>
        </div>
        <div class="flex items-center justify-between mt-2.5"><div class="font-bold text-[14px]">Letter M</div><i class="fa-solid fa-circle-check text-[#1FA88A] text-[13px]"></i></div>
        <div class="flex items-center gap-0.5 mt-1 text-amber-400 text-[11px]"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
      </div>
      <div class="card !p-3">
        <div class="paper h-[132px] rounded-[16px] relative flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-[110px] h-[110px]" fill="none" stroke="#E84D80" stroke-width="6" stroke-linecap="round"><ellipse cx="100" cy="120" rx="46" ry="40"/><ellipse cx="80" cy="54" rx="10" ry="30"/><ellipse cx="120" cy="54" rx="10" ry="30"/><circle cx="100" cy="164" r="8"/></svg>
          <span class="absolute top-2 right-2 dot bg-rose-400"></span>
        </div>
        <div class="flex items-center justify-between mt-2.5"><div class="font-bold text-[14px]">Bunny</div><i class="fa-solid fa-lock text-[#B3AA9C] text-[12px]"></i></div>
        <div class="text-[11px] font-bold text-[#9A907F] mt-1">7 strokes · Level 3</div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab active"><i class="fa-solid fa-shapes"></i>Library</div>
    <div class="tab-draw"><i class="fa-solid fa-pencil"></i></div>
    <div class="tab"><i class="fa-solid fa-chart-simple"></i>Progress</div>
    <div class="tab"><i class="fa-solid fa-user-group"></i>Family</div>
  </div>
</div></body></html>
