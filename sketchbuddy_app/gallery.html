<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content">
    <div class="flex items-center justify-between mt-2">
      <h1 class="round text-[30px] font-semibold">Mia's wall</h1>
      <div class="flex items-center gap-1.5 text-[13px] font-bold text-[#9A907F]"><span class="num text-[20px] text-[#1F2A44]">23</span>drawings</div>
    </div>

    <!-- then vs now -->
    <div class="card mt-4 !p-3">
      <div class="flex items-center justify-between px-1 mb-2.5"><span class="round text-[17px] font-semibold">Cat: then and now</span><span class="text-[12px] font-bold text-[#1FA88A] bg-[#E3F7F1] rounded-full px-2.5 py-1">+31 pts</span></div>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="paper rounded-[18px] h-[190px] relative flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-[140px] h-[140px]" fill="none" stroke="#FF7A45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M70 82 C62 52 96 40 118 52 C140 64 132 104 104 112 C80 118 74 100 70 82"/><path d="M76 58 L70 36 L92 50"/><path d="M114 48 L134 40 L126 66"/><path d="M90 116 C58 140 82 186 110 180 C146 172 140 136 118 112"/><path d="M140 160 C150 150 168 160 160 128"/></svg>
          <span class="absolute bottom-2.5 left-2.5 bg-white rounded-full px-2.5 py-1 text-[11px] font-bold shadow-sm">Sep 3 · <span class="text-[#F2A81D]">55</span></span>
        </div>
        <div class="rounded-[18px] h-[190px] relative overflow-hidden">
          <img src="img/paper.jpg" class="w-full h-full object-cover" style="object-position:center 42%;transform:scale(1.35)" alt="Recent cat">
          <span class="absolute bottom-2.5 left-2.5 bg-white rounded-full px-2.5 py-1 text-[11px] font-bold shadow-sm">Nov 16 · <span class="text-[#1FA88A]">86</span></span>
        </div>
      </div>
    </div>

    <div class="flex gap-2 mt-5 overflow-x-auto -mx-[28px] px-[28px]">
      <span class="chip active">All</span><span class="chip"><i class="fa-solid fa-paw text-[#FF5A36]"></i>Animals</span><span class="chip"><span class="round font-semibold text-[#8152D6]">Aa</span>Letters</span><span class="chip"><i class="fa-solid fa-star text-[#F2A81D]"></i>3 stars</span>
    </div>

    <div class="grid grid-cols-3 gap-2.5 mt-4">
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><svg viewBox="0 0 200 200" class="w-[72%]" fill="none" stroke="#3B7BEA" stroke-width="7" stroke-linecap="round"><path d="M40 100 C70 60 130 60 150 100 C130 140 70 140 40 100"/><path d="M150 100 L178 74 L178 126 Z"/></svg><span class="absolute top-2 right-2 text-[10px] text-[#F2A81D]"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div>
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><svg viewBox="0 0 200 200" class="w-[72%]" fill="none" stroke="#8152D6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M50 160 L50 44 L100 110 L150 44 L150 160"/></svg><span class="absolute top-2 right-2 text-[10px] text-[#F2A81D]"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div>
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><svg viewBox="0 0 200 200" class="w-[72%]" fill="none" stroke="#F2A81D" stroke-width="7" stroke-linecap="round"><circle cx="100" cy="100" r="36"/><path d="M100 30 V48 M100 152 V170 M30 100 H48 M152 100 H170 M52 52 L64 64 M136 136 L148 148 M148 52 L136 64 M52 148 L64 136"/></svg><span class="absolute top-2 right-2 text-[10px] text-[#F2A81D]"><i class="fa-solid fa-star"></i></span></div>
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><svg viewBox="0 0 200 200" class="w-[72%]" fill="none" stroke="#1FA88A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M100 30 L160 140 H40 Z"/><path d="M100 140 V176"/></svg></div>
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><svg viewBox="0 0 200 200" class="w-[72%]" fill="none" stroke="#E84D80" stroke-width="7" stroke-linecap="round"><path d="M100 170 C40 120 30 80 60 56 C80 42 98 56 100 72 C102 56 120 42 140 56 C170 80 160 120 100 170"/></svg><span class="absolute top-2 right-2 text-[10px] text-[#F2A81D]"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div>
      <div class="paper rounded-[16px] aspect-square relative flex items-center justify-center shadow-sm"><span class="round text-[64px] font-semibold text-[#FF5A36]">A</span></div>
    </div>

    <div class="card mt-4 flex items-center gap-3">
      <div class="stack flex"><img src="img/parent.jpg" class="av w-9 h-9" alt=""><img src="img/kid2.jpg" class="av w-9 h-9" alt=""><div class="w-9 h-9 rounded-full bg-[#FFE5DA] border-2 border-white -ml-2.5 flex items-center justify-center text-[11px] font-bold text-[#FF5A36]">+2</div></div>
      <div class="flex-1 text-[13px] font-semibold">Family sees new drawings</div>
      <div class="w-[46px] h-[28px] rounded-full bg-[#1FA88A] p-[3px] flex justify-end"><span class="w-[22px] h-[22px] rounded-full bg-white"></span></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fa-solid fa-house"></i>Home</div>
    <div class="tab"><i class="fa-solid fa-shapes"></i>Library</div>
    <div class="tab-draw"><i class="fa-solid fa-pencil"></i></div>
    <div class="tab active"><i class="fa-solid fa-chart-simple"></i>Progress</div>
    <div class="tab"><i class="fa-solid fa-user-group"></i>Family</div>
  </div>
</div></body></html>
