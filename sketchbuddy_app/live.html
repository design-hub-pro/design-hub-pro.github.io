<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live drawing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen" style="background:#141A2B;color:#fff">
  <div class="status-bar light"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>

  <div class="flex items-center justify-between px-[28px] mt-2">
    <div class="w-[42px] h-[42px] rounded-[14px] bg-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <div class="text-center"><div class="text-[11px] font-bold text-white/50 tracking-wider">SLEEPY CAT</div><div class="round text-[18px] font-semibold">Stroke 3 of 6</div></div>
    <div class="w-[42px] h-[42px] rounded-[14px] bg-white/10 flex items-center justify-center"><i class="fa-solid fa-pause"></i></div>
  </div>

  <!-- camera feed -->
  <div class="mx-[16px] mt-4 h-[470px] rounded-[30px] overflow-hidden relative">
    <img src="img/paper.jpg" class="absolute inset-0 w-full h-full object-cover" style="filter:blur(14px) brightness(.85);transform:scale(1.2)" alt="">
    <div class="absolute bg-white rounded-sm shadow-2xl" style="left:34px;top:30px;width:336px;height:420px;transform:rotate(-1.5deg)">
      <svg viewBox="0 0 200 250" class="w-full h-full" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- ghost of upcoming strokes -->
        <g stroke="#E8DFD0" stroke-width="2.5" stroke-dasharray="3 5"><path d="M78 132 C60 172 70 204 100 204 C130 204 140 172 122 132"/><path d="M134 192 C162 190 170 164 156 148"/></g>
        <!-- done strokes (crayon) -->
        <circle cx="100" cy="100" r="36" stroke="#FF7A45" stroke-width="3.2" opacity=".95"/>
        <path d="M72 79 L75 52 L91 68" stroke="#FF7A45" stroke-width="3.2"/>
        <!-- target stroke 3 -->
        <path d="M108 68 L124 52 L128 79" stroke="#6FE0C4" stroke-width="7" opacity=".35"/>
        <!-- current kid stroke, slightly shallow -->
        <path d="M108 68 L121 57" stroke="#FF7A45" stroke-width="3.2"/>
        <!-- deviation hint -->
        <path d="M121 57 L124 52" stroke="#FFD97A" stroke-width="2" stroke-dasharray="2 2"/>
      </svg>
      <!-- arm tip marker -->
      <div class="absolute" style="left:185px;top:78px">
        <div class="w-9 h-9 rounded-full border-[3px] border-[#6FE0C4] bg-[#6FE0C4]/20 flex items-center justify-center"><span class="w-2.5 h-2.5 rounded-full bg-[#1FA88A]"></span></div>
      </div>
      <div class="absolute bg-[#1F2A44] text-white text-[11px] font-bold rounded-full px-2.5 py-1 flex items-center gap-1.5" style="left:222px;top:44px"><i class="fa-solid fa-arrow-up text-[#FFD97A]"></i>Steeper</div>
    </div>
    <div class="absolute top-4 left-4 flex items-center gap-1.5 bg-black/45 backdrop-blur rounded-full px-3 py-1.5 text-[11px] font-bold"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>LIVE · 30 fps</div>
    <div class="absolute top-4 right-4 flex items-center gap-1.5 bg-[#1FA88A] rounded-full px-3 py-1.5 text-[11px] font-bold"><i class="fa-solid fa-robot"></i>Nudge</div>
    <!-- voice toast -->
    <div class="absolute bottom-4 left-4 right-4 bg-white text-[#1F2A44] rounded-2xl p-3 flex items-center gap-3 shadow-xl">
      <div class="gi g-orange !w-10 !h-10 !rounded-xl"><i class="fa-solid fa-volume-high"></i></div>
      <div class="flex-1"><div class="text-[15px] font-bold">Go up a little steeper!</div><div class="text-[12px] text-[#9A907F]">Pointy ear, like a triangle</div></div>
    </div>
  </div>

  <!-- live meters -->
  <div class="grid grid-cols-4 gap-2 px-[16px] mt-4">
    <div class="rounded-2xl bg-white/[.07] p-3"><div class="text-[11px] font-bold text-white/55">Shape</div><div class="num text-[26px] font-semibold leading-tight">92</div><div class="h-1.5 rounded-full bg-white/10 mt-1"><div class="h-full rounded-full bg-[#6FE0C4]" style="width:92%"></div></div></div>
    <div class="rounded-2xl bg-[#FFD97A]/15 ring-1 ring-[#FFD97A]/50 p-3"><div class="text-[11px] font-bold text-[#FFD97A]">Angle</div><div class="num text-[26px] font-semibold leading-tight">38°</div><div class="text-[10px] font-bold text-white/60">goal 52°</div></div>
    <div class="rounded-2xl bg-white/[.07] p-3"><div class="text-[11px] font-bold text-white/55">Spacing</div><div class="num text-[26px] font-semibold leading-tight">88</div><div class="h-1.5 rounded-full bg-white/10 mt-1"><div class="h-full rounded-full bg-[#6FE0C4]" style="width:88%"></div></div></div>
    <div class="rounded-2xl bg-white/[.07] p-3"><div class="text-[11px] font-bold text-white/55">Pressure</div><div class="flex items-end gap-0.5 h-[30px] mt-1"><span class="w-1.5 h-2 rounded bg-[#8DB8FF]"></span><span class="w-1.5 h-3 rounded bg-[#8DB8FF]"></span><span class="w-1.5 h-4 rounded bg-[#8DB8FF]"></span><span class="w-1.5 h-5 rounded bg-white/15"></span><span class="w-1.5 h-6 rounded bg-white/15"></span></div><div class="text-[10px] font-bold text-white/60">Light</div></div>
  </div>

  <!-- controls -->
  <div class="absolute bottom-[34px] left-0 right-0 px-[28px] flex items-center gap-4">
    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-[18px]"><i class="fa-solid fa-rotate-left"></i></div>
    <div class="flex-1 btn btn-primary"><i class="fa-solid fa-hand-pointer"></i>Guide me</div>
    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center text-[18px]"><i class="fa-solid fa-forward-step"></i></div>
  </div>
</div></body></html>
