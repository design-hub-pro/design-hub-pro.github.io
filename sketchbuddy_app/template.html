<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Template</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"></head>
<body><div class="screen">
  <div class="status-bar"><span>9:41</span><div class="dynamic-island"></div><div class="flex items-center gap-1.5 text-[14px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div></div>
  <div class="content full">
    <div class="flex items-center justify-between mt-2">
      <div class="icon-btn"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="flex gap-2"><div class="icon-btn"><i class="fa-regular fa-heart"></i></div><div class="icon-btn"><i class="fa-solid fa-share-nodes"></i></div></div>
    </div>

    <!-- stroke order canvas -->
    <div class="paper rounded-[30px] mt-4 h-[360px] relative shadow-[0_10px_30px_rgba(70,50,20,.08)]">
      <svg viewBox="0 0 200 200" class="absolute w-[260px] h-[260px]" style="left:60px;top:14px" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#E8DFD0" stroke-width="5"><path d="M78 110 C60 150 70 182 100 182 C130 182 140 150 122 110"/><path d="M134 170 C162 168 170 142 156 126"/><path d="M86 78 L88 80 M112 78 L114 80"/></g>
        <circle cx="100" cy="78" r="36" stroke="#1F2A44" stroke-width="5"/>
        <path d="M72 56 L76 30 L92 46" stroke="#1F2A44" stroke-width="5"/>
        <path d="M108 46 L124 30 L128 56" stroke="#FF5A36" stroke-width="6" stroke-dasharray="6 8"/>
        <circle cx="108" cy="46" r="5" fill="#FF5A36" stroke="none"/>
              </svg>
      <!-- numbered badges -->
      <span class="absolute left-[112px] top-[100px] w-7 h-7 rounded-full bg-[#1F2A44] text-white text-[12px] font-bold flex items-center justify-center">1</span>
      <span class="absolute left-[126px] top-[28px] w-7 h-7 rounded-full bg-[#1F2A44] text-white text-[12px] font-bold flex items-center justify-center">2</span>
      <span class="absolute left-[238px] top-[28px] w-7 h-7 rounded-full bg-[#FF5A36] text-white text-[12px] font-bold flex items-center justify-center shadow-lg">3</span>
      <span class="absolute left-[108px] top-[234px] w-7 h-7 rounded-full bg-white border-2 border-[#E8DFD0] text-[#B3AA9C] text-[12px] font-bold flex items-center justify-center">4</span>
      <span class="absolute left-[272px] top-[150px] w-7 h-7 rounded-full bg-white border-2 border-[#E8DFD0] text-[#B3AA9C] text-[12px] font-bold flex items-center justify-center">5</span>
      <div class="absolute bottom-4 left-4 right-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#1F2A44] text-white flex items-center justify-center"><i class="fa-solid fa-play text-[13px]"></i></div>
        <div class="flex-1 flex gap-1"><span class="h-1.5 flex-1 rounded-full bg-[#1F2A44]"></span><span class="h-1.5 flex-1 rounded-full bg-[#1F2A44]"></span><span class="h-1.5 flex-1 rounded-full bg-[#FF5A36]"></span><span class="h-1.5 flex-1 rounded-full bg-[#E8DFD0]"></span><span class="h-1.5 flex-1 rounded-full bg-[#E8DFD0]"></span><span class="h-1.5 flex-1 rounded-full bg-[#E8DFD0]"></span></div>
      </div>
    </div>

    <div class="flex items-end justify-between mt-5">
      <div><h1 class="round text-[30px] font-semibold leading-none">Sleepy Cat</h1><div class="text-[13px] text-[#9A907F] font-semibold mt-1.5">Animals · Level 2</div></div>
      <div class="flex items-center gap-1.5 text-[13px] font-bold"><span class="dot bg-amber-400"></span>Medium</div>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-4">
      <div class="card !p-3 text-center"><div class="num text-[28px] font-semibold leading-none">6</div><div class="text-[11px] text-[#9A907F] font-semibold mt-1">strokes</div></div>
      <div class="card !p-3 text-center"><div class="num text-[28px] font-semibold leading-none">8<span class="text-[14px]">m</span></div><div class="text-[11px] text-[#9A907F] font-semibold mt-1">about</div></div>
      <div class="card !p-3 text-center"><div class="gi g-sky mx-auto !w-8 !h-8 !rounded-xl !text-[13px]"><i class="fa-solid fa-circle-notch"></i></div><div class="text-[11px] text-[#9A907F] font-semibold mt-1">Skill: curves</div></div>
    </div>

    <div class="label mt-5 mb-2.5">Arm help</div>
    <div class="bg-white rounded-2xl p-1.5 grid grid-cols-3 gap-1 shadow-sm text-center">
      <div class="py-2.5 rounded-xl"><i class="fa-solid fa-hand-holding text-[#9A907F]"></i><div class="text-[12px] font-bold mt-1 text-[#6B7390]">Hold</div></div>
      <div class="py-2.5 rounded-xl bg-[#E3F7F1]"><i class="fa-solid fa-hand-point-right text-[#1FA88A]"></i><div class="text-[12px] font-bold mt-1 text-[#1FA88A]">Nudge</div></div>
      <div class="py-2.5 rounded-xl"><i class="fa-solid fa-feather text-[#9A907F]"></i><div class="text-[12px] font-bold mt-1 text-[#6B7390]">Solo</div></div>
    </div>

    <div class="btn btn-primary mt-5"><i class="fa-solid fa-pencil"></i>Start drawing</div>
  </div>
</div></body></html>
