<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FFF8F4;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:white}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 88px);overflow-y:auto;padding:0}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #F5E6DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#C4A89C;font-size:10px;font-weight:500}
.tab.active{color:#FF6B5B}
.tab i{font-size:22px}
.card{background:white;border-radius:18px;box-shadow:0 4px 20px rgba(255,138,122,0.08)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <!-- Hero banner -->
  <div class="relative h-72" style="background:linear-gradient(180deg,#FF8A7A 0%,#FF6B5B 100%)">
    <div class="absolute inset-0 opacity-20" style="background-image:radial-gradient(circle at 20% 80%,white 1px,transparent 1px),radial-gradient(circle at 60% 20%,white 1px,transparent 1px);background-size:40px 40px"></div>
    <div class="status-bar relative z-10">
      <span>9:41</span>
      <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
    </div>
    <div class="flex items-center justify-between px-7 mt-2 relative z-10">
      <i class="fas fa-arrow-left text-white"></i>
      <i class="fas fa-gear text-white"></i>
    </div>
    <div class="flex flex-col items-center mt-4 relative z-10">
      <img src="https://images.unsplash.com/photo-1544126592-807ade215a0b?w=200&h=200&fit=crop" class="w-24 h-24 rounded-3xl border-4 border-white/40 object-cover">
      <h1 class="text-2xl font-bold text-white mt-3">Emma Rose</h1>
      <p class="text-xs text-white/80">Born Oct 12, 2024 · 18 months</p>
    </div>
  </div>

  <div class="content absolute inset-x-0 top-60 bottom-0 bg-[#FFF8F4] rounded-t-[32px] pt-5">
    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 px-7">
      <div class="card p-3 text-center">
        <p class="text-2xl font-bold text-orange-500">47</p>
        <p class="text-[10px] text-gray-500 font-semibold">MEMORIES</p>
      </div>
      <div class="card p-3 text-center">
        <p class="text-2xl font-bold text-blue-500">14</p>
        <p class="text-[10px] text-gray-500 font-semibold">MILESTONES</p>
      </div>
      <div class="card p-3 text-center">
        <p class="text-2xl font-bold text-teal-500">542</p>
        <p class="text-[10px] text-gray-500 font-semibold">LOGS</p>
      </div>
    </div>

    <!-- Memory gallery -->
    <div class="flex items-center justify-between mt-5 px-7 mb-3">
      <h3 class="text-base font-bold text-gray-900">Memories</h3>
      <span class="text-xs text-orange-500 font-semibold">View all</span>
    </div>
    <div class="grid grid-cols-3 gap-1 px-7">
      <div class="aspect-square rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1522771930-78848d9293e8?w=300&h=300&fit=crop" class="w-full h-full object-cover"></div>
      <div class="aspect-square rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=300&h=300&fit=crop" class="w-full h-full object-cover"></div>
      <div class="aspect-square rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1503919005314-30d93d07d823?w=300&h=300&fit=crop" class="w-full h-full object-cover"></div>
      <div class="aspect-square rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1555252333-9f8e92e65df9?w=300&h=300&fit=crop" class="w-full h-full object-cover"></div>
      <div class="aspect-square rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30?w=300&h=300&fit=crop" class="w-full h-full object-cover"></div>
      <div class="aspect-square rounded-xl overflow-hidden relative">
        <img src="https://images.unsplash.com/photo-1566004100631-35d015d6a491?w=300&h=300&fit=crop" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/50 flex items-center justify-center text-white font-bold">+42</div>
      </div>
    </div>

    <!-- Family -->
    <div class="px-7 mt-6 mb-3 flex items-center justify-between">
      <h3 class="text-base font-bold text-gray-900">Family Care Team</h3>
      <i class="fas fa-plus-circle text-orange-500"></i>
    </div>
    <div class="px-7">
      <div class="card p-4 flex items-center gap-3">
        <div class="flex -space-x-2">
          <img src="https://i.pravatar.cc/80?img=32" class="w-10 h-10 rounded-full border-2 border-white">
          <img src="https://i.pravatar.cc/80?img=14" class="w-10 h-10 rounded-full border-2 border-white">
          <img src="https://i.pravatar.cc/80?img=48" class="w-10 h-10 rounded-full border-2 border-white">
          <img src="https://i.pravatar.cc/80?img=27" class="w-10 h-10 rounded-full border-2 border-white">
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-gray-900">4 caregivers</p>
          <p class="text-[11px] text-gray-400">Mom · Dad · Grandma · Nanny</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-orange-50 flex items-center justify-center"><i class="fas fa-chevron-right text-[10px] text-orange-500"></i></div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-chart-line"></i><span>Track</span></div>
    <div class="tab"><i class="fas fa-puzzle-piece"></i><span>Play</span></div>
    <div class="tab"><i class="fas fa-heart-pulse"></i><span>Health</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
