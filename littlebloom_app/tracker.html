<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FFF8F4;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#1a1a1a}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px}
.content{height:calc(100% - 59px - 88px);overflow-y:auto;padding:0 28px 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid #F5E6DD;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#C4A89C;font-size:10px;font-weight:500}
.tab.active{color:#FF6B5B}
.tab i{font-size:22px}
.card{background:white;border-radius:22px;box-shadow:0 4px 20px rgba(255,138,122,0.08)}
.seg{background:#FFE8E1;border-radius:14px;padding:4px;display:flex;gap:2px}
.seg-item{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:12px;font-weight:600;color:#C4A89C}
.seg-item.active{background:white;color:#FF6B5B;box-shadow:0 2px 8px rgba(255,107,91,0.15)}
.bar{background:linear-gradient(180deg,#FFB8A8,#FF6B5B);border-radius:6px 6px 2px 2px}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-5">
      <h1 class="text-2xl font-bold text-gray-900">Daily Track</h1>
      <div class="w-10 h-10 rounded-full bg-white shadow-md flex items-center justify-center"><i class="fas fa-calendar text-orange-500"></i></div>
    </div>

    <div class="seg">
      <div class="seg-item active">Today</div>
      <div class="seg-item">Week</div>
      <div class="seg-item">Month</div>
    </div>

    <!-- Sleep chart card -->
    <div class="card mt-5 p-5">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-[10px] text-blue-500 font-bold uppercase">Sleep</p>
          <p class="text-3xl font-bold text-gray-900 mt-1">11<span class="text-lg">h</span> 24<span class="text-lg">m</span></p>
          <p class="text-xs text-gray-500 mt-0.5"><i class="fas fa-arrow-up text-green-500"></i> 42m more than avg</p>
        </div>
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#C8E6FF,#5BA7FF)">
          <i class="fas fa-moon text-white text-lg"></i>
        </div>
      </div>
      <div class="flex items-end gap-2 h-16 mt-4">
        <div class="bar flex-1" style="height:50%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:70%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:40%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:85%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:60%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:95%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
        <div class="bar flex-1" style="height:75%;background:linear-gradient(180deg,#C8E6FF,#5BA7FF)"></div>
      </div>
      <div class="flex justify-between mt-2 text-[9px] text-gray-400 font-semibold">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
    </div>

    <!-- Feed + Diaper row -->
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="card p-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#FFD6C8,#FF8A7A)">
          <i class="fas fa-bottle-water text-white"></i>
        </div>
        <p class="text-[10px] text-orange-500 font-bold uppercase mt-3">Feeding</p>
        <p class="text-2xl font-bold text-gray-900">4<span class="text-sm text-gray-400"> / 5</span></p>
        <div class="w-full h-1.5 bg-orange-100 rounded-full mt-2"><div class="h-full rounded-full" style="width:80%;background:linear-gradient(90deg,#FF8A7A,#FF6B5B)"></div></div>
      </div>
      <div class="card p-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#D4F5E6,#6EC5B8)">
          <i class="fas fa-baby text-white"></i>
        </div>
        <p class="text-[10px] text-teal-500 font-bold uppercase mt-3">Diaper</p>
        <p class="text-2xl font-bold text-gray-900">5<span class="text-sm text-gray-400"> today</span></p>
        <div class="w-full h-1.5 bg-teal-100 rounded-full mt-2"><div class="h-full rounded-full" style="width:70%;background:linear-gradient(90deg,#8FD9CC,#6EC5B8)"></div></div>
      </div>
    </div>

    <!-- Recent timeline -->
    <h3 class="text-base font-bold text-gray-900 mt-6 mb-3">Recent</h3>
    <div class="card p-4 space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#FFE8E1"><i class="fas fa-bottle-water text-orange-500 text-sm"></i></div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-gray-900">Breakfast · Oatmeal</p>
          <p class="text-[11px] text-gray-400">180ml · 2h ago</p>
        </div>
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#E1EFFF"><i class="fas fa-moon text-blue-500 text-sm"></i></div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-gray-900">Morning Nap</p>
          <p class="text-[11px] text-gray-400">1h 20m · 30m ago</p>
        </div>
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#D4F5E6"><i class="fas fa-baby text-teal-600 text-sm"></i></div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-gray-900">Diaper Change</p>
          <p class="text-[11px] text-gray-400">Wet · 15m ago</p>
        </div>
        <span class="w-2 h-2 rounded-full bg-teal-500"></span>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab active"><i class="fas fa-chart-line"></i><span>Track</span></div>
    <div class="tab"><i class="fas fa-puzzle-piece"></i><span>Play</span></div>
    <div class="tab"><i class="fas fa-heart-pulse"></i><span>Health</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
