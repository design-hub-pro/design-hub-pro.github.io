<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PointeFit · Live Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%; height:100%; font-family:'Inter',sans-serif; background:#000; color:#fff;}
.font-serif{font-family:'Playfair Display', serif; letter-spacing:-0.02em;}
.font-instrument{font-family:'Instrument Serif', serif; letter-spacing:-0.02em;}
.font-mono{font-family:'JetBrains Mono', monospace;}
.screen{position:relative; width:100%; height:100%; overflow:hidden; background:#0A0307;}
.island{position:absolute; left:50%; top:14px; transform:translateX(-50%); width:124px; height:36px; background:#000; border-radius:24px; z-index:30;}
.status-bar{height:59px; padding:20px 28px 0; display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:600; position:relative; z-index:20;}
.home-indicator{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:140px; height:5px; background:#fff; border-radius:3px; opacity:0.85;}

/* Camera viewfinder backdrop */
.viewport{position:absolute; inset:0; background:
  radial-gradient(60% 35% at 50% 45%, rgba(244,114,182,0.10) 0%, transparent 70%),
  linear-gradient(180deg, #1A0612 0%, #0A0307 70%);
}
.viewport::before{content:""; position:absolute; inset:0;
  background:
    repeating-linear-gradient(0deg, rgba(244,114,182,0.04) 0px, rgba(244,114,182,0.04) 1px, transparent 1px, transparent 3px);
}

/* Grid overlay */
.grid-overlay{position:absolute; inset:0;
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 100% 33%,
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 33% 100%;
  pointer-events:none;
}

/* Corner brackets */
.corner{position:absolute; width:30px; height:30px; border:2px solid #FBCFE8;}
.corner-tl{top:120px; left:30px; border-right:none; border-bottom:none;}
.corner-tr{top:120px; right:30px; border-left:none; border-bottom:none;}
.corner-bl{bottom:240px; left:30px; border-right:none; border-top:none;}
.corner-br{bottom:240px; right:30px; border-left:none; border-top:none;}

/* Scanning line */
.scan-line{position:absolute; left:30px; right:30px; height:2px; top:42%;
  background:linear-gradient(90deg, transparent, #F472B6 50%, transparent);
  box-shadow:0 0 18px #F472B6;
}

/* Two-foot diagram in viewfinder */
.feet-svg{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); width:300px; height:340px;}

.glass{background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.10); backdrop-filter:blur(20px); border-radius:24px;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px; font-size:10px; font-weight:700;}
.rose-gradient{background:linear-gradient(135deg,#FBCFE8 0%, #F472B6 50%, #BE185D 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}

@keyframes pulse-dot{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.5); opacity:0.6;}}
.pulse{animation:pulse-dot 1.4s ease-in-out infinite;}

.metric-pill{background:rgba(0,0,0,0.55); border:1px solid rgba(244,114,182,0.30); border-radius:14px; padding:8px 12px; backdrop-filter:blur(12px);}
.metric-num{font-family:'Playfair Display', serif; font-weight:700; font-size:18px; letter-spacing:-0.02em;}
.metric-lbl{font-size:8.5px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; color:rgba(255,255,255,0.55);}
</style>
</head>
<body>
<div class="screen">
  <div class="viewport"></div>
  <div class="grid-overlay"></div>

  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-signal text-xs"></i>
      <i class="fa-solid fa-wifi text-xs"></i>
      <i class="fa-solid fa-battery-full text-xs"></i>
    </div>
  </div>

  <!-- Top bar -->
  <div class="absolute top-[64px] left-0 right-0 px-7 z-20 flex items-center justify-between">
    <button class="w-10 h-10 glass rounded-full flex items-center justify-center">
      <i class="fa-solid fa-xmark text-white text-sm"></i>
    </button>
    <div class="glass px-3.5 py-1.5 rounded-full flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-rose-400 pulse"></span>
      <span class="text-[10px] font-bold tracking-[0.16em] uppercase text-rose-200">Scanning · Live</span>
    </div>
    <button class="w-10 h-10 glass rounded-full flex items-center justify-center">
      <i class="fa-solid fa-bolt text-white text-sm"></i>
    </button>
  </div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Scan line -->
  <div class="scan-line"></div>

  <!-- Foot SVG -->
  <svg class="feet-svg" viewBox="0 0 300 340" fill="none">
    <!-- Right foot -->
    <g>
      <path d="M195 30 C 165 30, 148 60, 148 100 C 148 140, 156 180, 168 218 C 178 250, 192 280, 210 295 C 228 280, 240 250, 248 218 C 256 180, 260 140, 256 100 C 252 60, 232 30, 195 30 Z"
            stroke="#F472B6" stroke-width="1.5" fill="rgba(244,114,182,0.06)"/>
      <!-- Toes -->
      <ellipse cx="168" cy="42" rx="11" ry="14" stroke="#FBCFE8" stroke-width="1.2" fill="rgba(255,255,255,0.08)"/>
      <ellipse cx="190" cy="32" rx="9" ry="12" stroke="rgba(255,255,255,0.7)" stroke-width="1" fill="rgba(255,255,255,0.05)"/>
      <ellipse cx="208" cy="34" rx="8" ry="11" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <ellipse cx="223" cy="42" rx="7" ry="9" stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <ellipse cx="236" cy="54" rx="6" ry="8" stroke="rgba(255,255,255,0.5)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <!-- Landmarks -->
      <circle cx="168" cy="42" r="3.5" fill="#F472B6"/>
      <circle cx="190" cy="32" r="2.5" fill="#FBCFE8"/>
      <circle cx="208" cy="34" r="2.5" fill="#FBCFE8"/>
      <circle cx="223" cy="42" r="2.5" fill="#FBCFE8"/>
      <circle cx="236" cy="54" r="2.5" fill="#FBCFE8"/>
      <circle cx="195" cy="160" r="3" fill="#FBCFE8"/>
      <circle cx="210" cy="290" r="4" fill="#A78BFA"/>
      <!-- Connections -->
      <line x1="168" y1="42" x2="190" y2="32" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="190" y1="32" x2="208" y2="34" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="208" y1="34" x2="223" y2="42" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="223" y1="42" x2="236" y2="54" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    <!-- Left foot (mirrored) -->
    <g>
      <path d="M105 30 C 135 30, 152 60, 152 100 C 152 140, 144 180, 132 218 C 122 250, 108 280, 90 295 C 72 280, 60 250, 52 218 C 44 180, 40 140, 44 100 C 48 60, 68 30, 105 30 Z"
            stroke="#F472B6" stroke-width="1.5" fill="rgba(244,114,182,0.06)"/>
      <ellipse cx="132" cy="42" rx="11" ry="14" stroke="#FBCFE8" stroke-width="1.2" fill="rgba(255,255,255,0.08)"/>
      <ellipse cx="110" cy="32" rx="9" ry="12" stroke="rgba(255,255,255,0.7)" stroke-width="1" fill="rgba(255,255,255,0.05)"/>
      <ellipse cx="92" cy="34" rx="8" ry="11" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <ellipse cx="77" cy="42" rx="7" ry="9" stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <ellipse cx="64" cy="54" rx="6" ry="8" stroke="rgba(255,255,255,0.5)" stroke-width="1" fill="rgba(255,255,255,0.04)"/>
      <circle cx="132" cy="42" r="3.5" fill="#F472B6"/>
      <circle cx="110" cy="32" r="2.5" fill="#FBCFE8"/>
      <circle cx="92" cy="34" r="2.5" fill="#FBCFE8"/>
      <circle cx="77" cy="42" r="2.5" fill="#FBCFE8"/>
      <circle cx="64" cy="54" r="2.5" fill="#FBCFE8"/>
      <circle cx="105" cy="160" r="3" fill="#FBCFE8"/>
      <circle cx="90" cy="290" r="4" fill="#A78BFA"/>
      <line x1="132" y1="42" x2="110" y2="32" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="110" y1="32" x2="92" y2="34" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="92" y1="34" x2="77" y2="42" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="77" y1="42" x2="64" y2="54" stroke="rgba(244,114,182,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Annotations -->
    <line x1="160" y1="42" x2="100" y2="20" stroke="rgba(244,114,182,0.6)" stroke-width="0.8"/>
    <line x1="240" y1="54" x2="280" y2="36" stroke="rgba(244,114,182,0.6)" stroke-width="0.8"/>
    <line x1="150" y1="295" x2="150" y2="320" stroke="rgba(167,139,250,0.6)" stroke-width="0.8"/>
  </svg>

  <!-- Floating annotation chips on viewport -->
  <div class="absolute z-10 metric-pill" style="top:130px; left:14px;">
    <div class="text-[8.5px] font-bold tracking-[0.10em] uppercase text-pink-200">Big toe</div>
    <div class="metric-num text-white font-mono">+ 6 mm</div>
  </div>
  <div class="absolute z-10 metric-pill" style="top:130px; right:14px; text-align:right;">
    <div class="text-[8.5px] font-bold tracking-[0.10em] uppercase text-pink-200">Pinky toe</div>
    <div class="metric-num text-white font-mono">9°</div>
  </div>
  <div class="absolute z-10 metric-pill" style="bottom:300px; left:50%; transform:translateX(-50%);">
    <div class="text-[8.5px] font-bold tracking-[0.10em] uppercase text-violet-200 text-center">Heel width</div>
    <div class="metric-num text-white font-mono text-center">52 mm</div>
  </div>

  <!-- Right-side metric stack -->
  <div class="absolute z-15 right-4 top-[200px] flex flex-col gap-2">
    <div class="metric-pill" style="width:112px;">
      <div class="metric-lbl">Type</div>
      <div class="metric-num rose-gradient">Egyptian</div>
    </div>
    <div class="metric-pill" style="width:112px;">
      <div class="metric-lbl">Length</div>
      <div class="metric-num text-white">242<span class="text-[10px] text-white/55"> mm</span></div>
    </div>
    <div class="metric-pill" style="width:112px;">
      <div class="metric-lbl">Width</div>
      <div class="metric-num text-white">Medium B</div>
    </div>
    <div class="metric-pill" style="width:112px;">
      <div class="metric-lbl">Arch</div>
      <div class="metric-num text-white">High · 87%</div>
    </div>
  </div>

  <!-- Left side AI thinking -->
  <div class="absolute z-15 left-4 top-[200px]">
    <div class="metric-pill" style="width:110px;">
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 pulse"></span>
        <span class="text-[9px] font-bold tracking-[0.12em] uppercase text-emerald-200">AI · 96%</span>
      </div>
      <div class="text-[11px] text-white font-bold mt-1 leading-tight">12 landmarks locked</div>
    </div>
  </div>

  <!-- AI Voice coach chip -->
  <div class="absolute z-15 left-1/2 -translate-x-1/2 bottom-[225px] glass px-4 py-2.5 rounded-full flex items-center gap-2.5">
    <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FBCFE8,#F472B6);">
      <i class="fa-solid fa-sparkles text-rose-900 text-[10px]"></i>
    </div>
    <span class="text-[11.5px] text-white font-medium">"Spread your toes naturally..."</span>
  </div>

  <!-- Bottom controls -->
  <div class="absolute bottom-0 left-0 right-0 z-20 pb-9">
    <!-- Mode selector -->
    <div class="px-7 mb-5 flex items-center justify-center gap-2">
      <button class="px-3.5 py-2 rounded-full glass text-[10px] font-bold text-white/70">Photo</button>
      <button class="px-3.5 py-2 rounded-full text-[10px] font-bold text-rose-900" style="background:linear-gradient(135deg,#FBCFE8,#F472B6);">Live AI</button>
      <button class="px-3.5 py-2 rounded-full glass text-[10px] font-bold text-white/70">3D Mesh</button>
      <button class="px-3.5 py-2 rounded-full glass text-[10px] font-bold text-white/70">Shoe</button>
    </div>

    <!-- Capture button -->
    <div class="flex items-center justify-between px-9">
      <button class="w-12 h-12 glass rounded-2xl flex items-center justify-center">
        <i class="fa-solid fa-images text-white text-[16px]"></i>
      </button>

      <button class="relative w-[82px] h-[82px] rounded-full flex items-center justify-center" style="background:linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05)); border:3px solid rgba(255,255,255,0.95);">
        <div class="w-[64px] h-[64px] rounded-full" style="background:linear-gradient(135deg,#FBCFE8,#F472B6,#BE185D); box-shadow:0 0 28px rgba(244,114,182,0.7);"></div>
        <div class="absolute inset-0 rounded-full" style="border:2px dashed rgba(244,114,182,0.6); animation:spin 8s linear infinite;"></div>
      </button>

      <button class="w-12 h-12 glass rounded-2xl flex items-center justify-center">
        <i class="fa-solid fa-rotate text-white text-[16px]"></i>
      </button>
    </div>
  </div>

  <style>@keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}</style>

  <div class="home-indicator"></div>
</div>
</body>
</html>
