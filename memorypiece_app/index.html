<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoryPiece - Family Photo Puzzle for Dementia Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #FAFAF7;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screen-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="max-w-7xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-puzzle-piece text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">MemoryPiece</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">Family photo jigsaw puzzles designed for dementia patients — complete the puzzle to reveal cherished family memories</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Dementia Care</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Cognitive Health</span>
            <span class="text-xs bg-purple-100 text-purple-700 px-3 py-1 rounded-full font-medium">Family Connection</span>
            <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">Puzzle Game</span>
        </div>
    </div>

    <!-- Phone Screenshots -->
    <div class="max-w-7xl mx-auto px-8 pb-24">
        <div class="screen-grid">
            <!-- Home -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-5 font-medium">Home</p>
            </div>
            <!-- Album -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="album.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-5 font-medium">Family Album</p>
            </div>
            <!-- Puzzle -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="puzzle.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-5 font-medium">Puzzle Game</p>
            </div>
            <!-- Progress -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="progress.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-5 font-medium">Cognitive Progress</p>
            </div>
            <!-- Family -->
            <div>
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="family.html" scrolling="no"></iframe>
                    </div>
                </div>
                <p class="text-center text-sm text-gray-400 mt-5 font-medium">Family Circle</p>
            </div>
        </div>
    </div>
</body>
</html>
