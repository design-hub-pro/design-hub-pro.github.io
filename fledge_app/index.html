<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fledge — Nest awareness</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
*::-webkit-scrollbar{display:none;}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#11211B;scrollbar-width:none;-webkit-font-smoothing:antialiased;}

.hero{text-align:center;padding:84px 40px 62px;max-width:900px;margin:0 auto;}
.icon{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,#0F6B52,#A8D65C);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;box-shadow:0 20px 46px rgba(15,107,82,.34);}
.icon i{font-size:38px;color:#fff;}
h1{font-size:60px;font-weight:900;letter-spacing:-2.4px;line-height:1;}
h1 span{background:linear-gradient(120deg,#0F6B52,#A8D65C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tag{font-size:19px;color:#6E7C75;margin-top:20px;line-height:1.55;max-width:620px;margin-left:auto;margin-right:auto;font-weight:500;}
.tags{display:flex;justify-content:center;gap:9px;margin-top:28px;flex-wrap:wrap;}
.tg{font-size:12px;font-weight:800;letter-spacing:.6px;padding:8px 15px;border-radius:20px;background:#F1F5EE;color:#0F6B52;border:1px solid #E1EADB;}

.grid{max-width:1560px;margin:0 auto;padding:20px 40px 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;justify-items:center;}
.item{text-align:center;}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0D1A15;box-shadow:0 30px 70px rgba(17,33,27,.24);}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#fff;}
.cap{margin-top:20px;}
.cn{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.ci{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#9AA79F;margin-top:6px;}
</style>
</head>
<body>

<div class="hero">
  <div class="icon"><i class="fas fa-feather"></i></div>
  <h1>Fledge</h1>
  <p class="tag">Know which nests are active near you, and leave them alone until the chicks fly.</p>
  <div class="tags">
    <span class="tg">Wildlife</span>
    <span class="tg">Citizen Science</span>
    <span class="tg">Mapping</span>
    <span class="tg">Virtual Adoption</span>
    <span class="tg">Accessible</span>
  </div>
</div>

<div class="grid">
  <div class="item">
    <div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Set patch</div><div class="ci">01</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="home.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Today</div><div class="ci">02</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="map.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Nest map</div><div class="ci">03</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="nest.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Nest rules</div><div class="ci">04</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="report.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Report incident</div><div class="ci">05</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="adopt.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Virtual adoption</div><div class="ci">06</div></div>
  </div>
  <div class="item">
    <div class="frame"><iframe src="buddy.html" scrolling="no"></iframe></div>
    <div class="cap"><div class="cn">Buddy mode</div><div class="ci">07</div></div>
  </div>
</div>

</body>
</html>
