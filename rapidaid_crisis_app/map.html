<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidAid - Map</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  html, body {
    scrollbar-width:none;
    font-family:'Inter', sans-serif;
    background:#0A0E1A;
    width:100%; height:100%;
    overflow-x:hidden; overflow-y:hidden;
    color:#fff;
    position:relative;
  }
  .display { font-family:'Space Grotesk', sans-serif; letter-spacing:-0.5px; }

  /* Map background */
  .map {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 40% 35%, rgba(220,38,38,0.45) 0%, transparent 28%),
      radial-gradient(circle at 65% 55%, rgba(245,158,11,0.35) 0%, transparent 22%),
      radial-gradient(circle at 30% 70%, rgba(16,185,129,0.3) 0%, transparent 24%),
      linear-gradient(155deg,#0A0E1A 0%,#1E293B 60%,#0F172A 100%);
  }
  .map::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(56,189,248,0.06) 1px, transparent 1px),
      linear-gradient(90deg,rgba(56,189,248,0.06) 1px, transparent 1px);
    background-size:40px 40px;
  }
  .road {
    position:absolute;
    height:2px; background:rgba(148,163,184,0.25);
    border-radius:2px;
  }
  .r1 { top:30%; left:0; right:0; transform:rotate(-3deg); }
  .r2 { top:55%; left:-10%; right:-10%; transform:rotate(6deg); }
  .r3 { top:78%; left:0; right:0; transform:rotate(-2deg); }
  .r4 { top:0; bottom:0; left:35%; width:2px; height:auto; transform:rotate(5deg); }
  .r5 { top:0; bottom:0; left:70%; width:2px; height:auto; transform:rotate(-8deg); }

  .status-bar {
    position:relative; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px 0 28px; height:59px;
    color:#fff;
  }
  .time { font-size:16px; font-weight:600; }
  .dynamic-island {
    width:120px; height:34px; background:#000; border-radius:20px;
    position:absolute; left:50%; transform:translateX(-50%); top:10px;
  }
  .icons { display:flex; gap:6px; align-items:center; font-size:14px; }
  .battery { width:27px; height:12px; border:1.5px solid #fff; border-radius:3px; padding:1.5px; position:relative; }
  .battery::after { content:''; position:absolute; right:-4px; top:3px; width:2px; height:6px; background:#fff; border-radius:0 1px 1px 0; }
  .battery-fill { width:80%; height:100%; background:#fff; border-radius:1.5px; }

  /* Top search bar */
  .top-bar {
    position:absolute; top:70px; left:20px; right:20px; z-index:10;
    display:flex; gap:10px;
  }
  .search {
    flex:1; padding:14px 18px;
    background:rgba(10,14,26,0.7);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    display:flex; align-items:center; gap:10px;
    color:rgba(255,255,255,0.85);
    font-size:13px;
  }
  .search i { color:#94A3B8; }
  .top-btn {
    width:48px; height:48px; border-radius:16px;
    background:rgba(10,14,26,0.7);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px;
  }

  /* Filter chips */
  .filters {
    position:absolute; top:140px; left:0; right:0; z-index:10;
    display:flex; gap:8px; padding:0 20px; overflow-x:auto;
  }
  .chip {
    padding:8px 14px; border-radius:20px;
    background:rgba(10,14,26,0.7);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12);
    font-size:11px; font-weight:600; color:#fff;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .chip.active { background:#DC2626; border-color:#DC2626; box-shadow:0 8px 22px rgba(220,38,38,0.4); }
  .chip .dot { width:6px; height:6px; border-radius:50%; }
  .chip.active .dot { background:#fff; }
  .dot-red { background:#DC2626; }
  .dot-amb { background:#F59E0B; }
  .dot-grn { background:#10B981; }
  .dot-blu { background:#0EA5E9; }

  /* Pins */
  .pin {
    position:absolute; z-index:5;
    transform:translate(-50%,-100%);
  }
  .pin-body {
    width:36px; height:36px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px;
    box-shadow:0 10px 24px rgba(0,0,0,0.5);
    border:2px solid #fff;
  }
  .pin-body i { transform:rotate(45deg); }
  .pin.red .pin-body { background:#DC2626; }
  .pin.amb .pin-body { background:#F59E0B; }
  .pin.grn .pin-body { background:#10B981; }
  .pin.blu .pin-body { background:#0EA5E9; }
  .pin::after {
    content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
    width:10px; height:4px; border-radius:50%;
    background:rgba(0,0,0,0.5); filter:blur(2px);
  }
  .pin.big .pin-body {
    width:52px; height:52px; font-size:20px;
    box-shadow:0 0 0 10px rgba(220,38,38,0.18), 0 0 0 20px rgba(220,38,38,0.08), 0 12px 28px rgba(220,38,38,0.5);
    animation:throb 1.8s ease-out infinite;
  }
  @keyframes throb {
    0%,100% { box-shadow:0 0 0 10px rgba(220,38,38,0.18), 0 0 0 20px rgba(220,38,38,0.08), 0 12px 28px rgba(220,38,38,0.5); }
    50% { box-shadow:0 0 0 14px rgba(220,38,38,0.12), 0 0 0 28px rgba(220,38,38,0.04), 0 12px 28px rgba(220,38,38,0.6); }
  }

  /* Bottom incident card */
  .bottom-card {
    position:absolute; bottom:110px; left:20px; right:20px; z-index:10;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:26px; padding:18px;
  }
  .bc-top {
    display:flex; align-items:flex-start; gap:12px; margin-bottom:12px;
  }
  .bc-icon {
    width:50px; height:50px; border-radius:16px;
    background:linear-gradient(135deg,#DC2626,#991B1B);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    box-shadow:0 10px 22px rgba(220,38,38,0.4);
  }
  .bc-info { flex:1; }
  .bc-title { font-size:16px; font-weight:700; }
  .bc-sub { font-size:11px; color:rgba(255,255,255,0.6); margin-top:2px; }
  .bc-sev {
    padding:5px 10px; border-radius:12px;
    background:rgba(220,38,38,0.18); color:#FCA5A5;
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px;
  }
  .bc-stats {
    display:flex; gap:8px; margin-bottom:14px;
  }
  .bc-stat {
    flex:1; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:10px;
  }
  .bc-stat-val { font-size:18px; font-weight:800; letter-spacing:-0.3px; }
  .bc-stat-lbl { font-size:9px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.6px; font-weight:600; margin-top:1px; }
  .bc-btns { display:flex; gap:8px; }
  .bc-btn {
    flex:1; padding:12px; border-radius:14px;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .bc-btn.nav { background:#0EA5E9; color:#fff; }
  .bc-btn.resp { background:linear-gradient(135deg,#DC2626,#991B1B); color:#fff; box-shadow:0 8px 20px rgba(220,38,38,0.4); }

  /* Tab bar */
  .tab-bar {
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    height:90px; background:rgba(10,14,26,0.85);
    backdrop-filter:blur(20px);
    display:flex; justify-content:space-around; align-items:flex-start;
    padding-top:12px; border-top:0.5px solid rgba(255,255,255,0.08);
  }
  .tab-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; font-weight:600; color:rgba(255,255,255,0.4);
  }
  .tab-item.active { color:#fff; }
  .tab-item i { font-size:20px; }
  .tab-dot { width:4px; height:4px; border-radius:50%; background:#DC2626; }
  .tab-center {
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg,#DC2626,#991B1B);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:22px; margin-top:-18px;
    box-shadow:0 10px 26px rgba(220,38,38,0.5);
  }
  .home-indicator {
    width:134px; height:5px; background:#fff; border-radius:3px;
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  }
</style>
</head>
<body>
  <div class="map">
    <div class="road r1"></div>
    <div class="road r2"></div>
    <div class="road r3"></div>
    <div class="road r4"></div>
    <div class="road r5"></div>
  </div>

  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="top-bar">
    <div class="search"><i class="fas fa-magnifying-glass"></i>Search incidents, shelters…</div>
    <div class="top-btn"><i class="fas fa-layer-group"></i></div>
  </div>

  <div class="filters">
    <div class="chip active"><span class="dot"></span> All</div>
    <div class="chip"><span class="dot dot-red"></span> Incidents</div>
    <div class="chip"><span class="dot dot-amb"></span> Warnings</div>
    <div class="chip"><span class="dot dot-grn"></span> Shelters</div>
    <div class="chip"><span class="dot dot-blu"></span> Medical</div>
  </div>

  <!-- Pins -->
  <div class="pin red big" style="top:40%; left:42%;">
    <div class="pin-body"><i class="fas fa-triangle-exclamation"></i></div>
  </div>
  <div class="pin amb" style="top:55%; left:65%;">
    <div class="pin-body"><i class="fas fa-fire"></i></div>
  </div>
  <div class="pin grn" style="top:38%; left:25%;">
    <div class="pin-body"><i class="fas fa-house-chimney-user"></i></div>
  </div>
  <div class="pin blu" style="top:62%; left:30%;">
    <div class="pin-body"><i class="fas fa-kit-medical"></i></div>
  </div>
  <div class="pin grn" style="top:72%; left:70%;">
    <div class="pin-body"><i class="fas fa-house-chimney-user"></i></div>
  </div>

  <!-- Bottom card -->
  <div class="bottom-card">
    <div class="bc-top">
      <div class="bc-icon"><i class="fas fa-triangle-exclamation"></i></div>
      <div class="bc-info">
        <div class="bc-title display">Building Collapse</div>
        <div class="bc-sub">📍 Wenchuan Rd · 1.2 km away · 3 min ago</div>
      </div>
      <div class="bc-sev">CRITICAL</div>
    </div>
    <div class="bc-stats">
      <div class="bc-stat"><div class="bc-stat-val">14</div><div class="bc-stat-lbl">Trapped</div></div>
      <div class="bc-stat"><div class="bc-stat-val">8</div><div class="bc-stat-lbl">Responders</div></div>
      <div class="bc-stat"><div class="bc-stat-val">4 min</div><div class="bc-stat-lbl">ETA</div></div>
    </div>
    <div class="bc-btns">
      <div class="bc-btn nav"><i class="fas fa-diamond-turn-right"></i> Navigate</div>
      <div class="bc-btn resp"><i class="fas fa-bolt"></i> Respond</div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab-item active">
      <i class="fas fa-map-location-dot"></i><span>Map</span>
      <div class="tab-dot"></div>
    </div>
    <div class="tab-center"><i class="fas fa-bolt"></i></div>
    <div class="tab-item"><i class="fas fa-hand-holding-heart"></i><span>Tasks</span></div>
    <div class="tab-item"><i class="fas fa-user"></i><span>Me</span></div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
