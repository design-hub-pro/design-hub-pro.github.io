<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidAid - SOS</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  html, body {
    scrollbar-width:none;
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(220,38,38,0.4) 0%, transparent 55%),
      linear-gradient(180deg,#1C0606 0%,#0A0E1A 100%);
    width:100%; height:100%;
    overflow-x:hidden; overflow-y:auto;
    color:#fff;
  }
  .display { font-family:'Space Grotesk', sans-serif; letter-spacing:-0.5px; }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px 0 28px; height:59px;
    position:sticky; top:0; z-index:100;
    color:#fff;
  }
  .time { font-size:16px; font-weight:600; }
  .dynamic-island {
    width:120px; height:34px; background:#000; border-radius:20px;
    position:absolute; left:50%; transform:translateX(-50%); top:10px;
  }
  .icons { display:flex; gap:6px; align-items:center; font-size:14px; }
  .battery { width:27px; height:12px; border:1.5px solid #fff; border-radius:3px; padding:1.5px; position:relative; }
  .battery::after { content:''; position:absolute; right:-4px; top:3px; width:2px; height:6px; background:#fff; border-radius:0 1px 1px 0; }
  .battery-fill { width:80%; height:100%; background:#fff; border-radius:1.5px; }

  .content { padding:0 28px 60px 28px; }

  .nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0 16px 0;
  }
  .nav-btn {
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px;
  }
  .nav-title { font-size:13px; color:rgba(255,255,255,0.7); font-weight:600; }

  .hero { text-align:center; padding:10px 0 18px 0; }
  .tag {
    display:inline-block; padding:5px 12px; border-radius:12px;
    background:rgba(220,38,38,0.22);
    border:1px solid rgba(220,38,38,0.4);
    color:#FCA5A5; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:1.2px;
  }
  .hero-title { font-size:32px; font-weight:800; margin-top:12px; line-height:1.05; }
  .hero-title b { background:linear-gradient(135deg,#FCA5A5,#F59E0B); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-sub { font-size:13px; color:rgba(255,255,255,0.6); margin-top:6px; }

  /* SOS orb */
  .orb-wrap {
    display:flex; align-items:center; justify-content:center;
    margin:16px 0 18px 0; position:relative; height:230px;
  }
  .ring {
    position:absolute; border-radius:50%;
    border:1.5px solid rgba(220,38,38,0.35);
    animation:ripple 2.2s ease-out infinite;
  }
  .ring.r1 { width:220px; height:220px; animation-delay:0s; }
  .ring.r2 { width:260px; height:260px; animation-delay:0.6s; }
  .ring.r3 { width:300px; height:300px; animation-delay:1.2s; }
  @keyframes ripple {
    0% { opacity:0.9; transform:scale(0.75); }
    100% { opacity:0; transform:scale(1.1); }
  }
  .orb {
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FCA5A5 0%, #DC2626 45%, #7F1D1D 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff;
    box-shadow:
      0 0 80px rgba(220,38,38,0.7),
      inset -15px -15px 40px rgba(0,0,0,0.5),
      inset 12px 12px 30px rgba(255,255,255,0.2);
    position:relative; z-index:5;
  }
  .orb-text { font-size:38px; font-weight:800; font-family:'Space Grotesk', sans-serif; letter-spacing:1px; }
  .orb-sub { font-size:11px; color:rgba(255,255,255,0.75); margin-top:2px; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
  .orb-icon { font-size:26px; margin-bottom:4px; }

  /* Type selector */
  .section-label {
    font-size:10px; color:rgba(255,255,255,0.5);
    text-transform:uppercase; letter-spacing:1.2px; font-weight:700;
    margin-bottom:10px;
  }
  .type-grid {
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
    margin-bottom:20px;
  }
  .type {
    aspect-ratio:1;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
  }
  .type.selected {
    background:rgba(220,38,38,0.25);
    border-color:#DC2626;
    box-shadow:0 8px 22px rgba(220,38,38,0.35);
  }
  .type i { font-size:18px; color:#FCA5A5; }
  .type.selected i { color:#fff; }
  .type span { font-size:9px; font-weight:700; color:rgba(255,255,255,0.85); }

  /* Location card */
  .loc-card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:20px; padding:14px;
    display:flex; align-items:center; gap:12px;
    margin-bottom:12px;
  }
  .loc-icon {
    width:42px; height:42px; border-radius:14px;
    background:linear-gradient(135deg,#0EA5E9,#0369A1);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .loc-info { flex:1; }
  .loc-name { font-size:13px; font-weight:700; }
  .loc-coord { font-size:11px; color:rgba(255,255,255,0.55); margin-top:2px; }
  .loc-acc { padding:4px 9px; border-radius:10px; background:rgba(16,185,129,0.2); color:#6EE7B7; font-size:9px; font-weight:800; }

  /* Send btn */
  .send-btn {
    width:100%; padding:18px;
    border-radius:22px; border:none;
    background:linear-gradient(135deg,#DC2626,#991B1B);
    color:#fff; font-size:17px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 16px 40px rgba(220,38,38,0.55);
    text-transform:uppercase; letter-spacing:0.6px;
    margin-top:6px;
  }

  .note {
    display:flex; align-items:center; gap:8px; margin-top:12px;
    font-size:10px; color:rgba(255,255,255,0.5);
    justify-content:center;
  }
  .note i { color:#10B981; }

  .home-indicator {
    width:134px; height:5px; background:#fff; border-radius:3px;
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="content">
    <div class="nav">
      <div class="nav-btn"><i class="fas fa-xmark"></i></div>
      <div class="nav-title">Emergency SOS</div>
      <div class="nav-btn"><i class="fas fa-shield-halved"></i></div>
    </div>

    <div class="hero">
      <div class="tag">● LIVE · BROADCASTING</div>
      <div class="hero-title display">Help is <b>2 min</b><br>away.</div>
      <div class="hero-sub">Auto-sent to 12 responders within 3 km</div>
    </div>

    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="orb">
        <div class="orb-icon">🆘</div>
        <div class="orb-text">SOS</div>
        <div class="orb-sub">Sending…</div>
      </div>
    </div>

    <div class="section-label">EMERGENCY TYPE</div>
    <div class="type-grid">
      <div class="type selected">
        <i class="fas fa-heart-pulse"></i>
        <span>Medical</span>
      </div>
      <div class="type">
        <i class="fas fa-fire"></i>
        <span>Fire</span>
      </div>
      <div class="type">
        <i class="fas fa-water"></i>
        <span>Flood</span>
      </div>
      <div class="type">
        <i class="fas fa-house-crack"></i>
        <span>Trapped</span>
      </div>
    </div>

    <div class="section-label">YOUR LOCATION</div>
    <div class="loc-card">
      <div class="loc-icon"><i class="fas fa-location-crosshairs"></i></div>
      <div class="loc-info">
        <div class="loc-name">Wenchuan Rd, Block 7</div>
        <div class="loc-coord">31.4831° N · 103.5842° E</div>
      </div>
      <div class="loc-acc">±3 m</div>
    </div>

    <button class="send-btn">
      <i class="fas fa-bolt"></i> Broadcast SOS
    </button>

    <div class="note">
      <i class="fas fa-shield-halved"></i> Auto-includes vitals, photo, contacts
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
