<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunForge - Smart Band</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #0d1117; color: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }

        @keyframes orbit { 0% { transform: rotate(0deg) translateX(60px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); } }
        .orbit { animation: orbit 4s linear infinite; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2 relative" style="background: #0d1117;">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold z-10 text-white">9:41</span>
        <div class="flex items-center gap-1.5 z-10 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="content-area pt-1 mb-5">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-chevron-left text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Smart Band</h1>
        </div>
    </div>

    <!-- Band Visualization -->
    <div class="content-area mb-5">
        <div class="bg-gradient-to-b from-cyan-600/15 via-blue-600/10 to-transparent rounded-3xl p-8 border border-cyan-500/15 text-center relative overflow-hidden">
            <div class="relative w-36 h-36 mx-auto mb-4">
                <!-- Orbit ring -->
                <div class="absolute inset-0 rounded-full border border-cyan-500/20"></div>
                <div class="absolute inset-4 rounded-full border border-cyan-500/10"></div>
                <!-- Center watch icon -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-2xl shadow-cyan-500/30">
                    <i class="fas fa-watch text-4xl text-white"></i>
                </div>
                <!-- Orbiting dot -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                    <div class="orbit">
                        <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-lg shadow-cyan-400/50"></div>
                    </div>
                </div>
            </div>
            <h3 class="text-lg font-bold text-white">RunForge Band Pro</h3>
            <div class="flex items-center justify-center gap-2 mt-1">
                <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
                <span class="text-xs text-emerald-400 font-medium">Connected via Bluetooth</span>
            </div>
        </div>
    </div>

    <!-- Band Stats -->
    <div class="content-area mb-5">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-battery-three-quarters text-emerald-400 text-sm"></i>
                    <span class="text-xs text-gray-400">Battery</span>
                </div>
                <p class="text-2xl font-black text-white">78%</p>
                <p class="text-[10px] text-gray-500">~3 days remaining</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-signal text-cyan-400 text-sm"></i>
                    <span class="text-xs text-gray-400">Signal</span>
                </div>
                <p class="text-2xl font-black text-white">Strong</p>
                <p class="text-[10px] text-gray-500">RSSI: -42 dBm</p>
            </div>
        </div>
    </div>

    <!-- Sensor Data -->
    <div class="content-area mb-5">
        <h3 class="text-sm font-bold text-white mb-3">Live Sensors</h3>
        <div class="bg-white/5 rounded-2xl border border-white/[0.06] divide-y divide-white/5">
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center">
                        <i class="fas fa-heart-pulse text-white text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-white">Heart Rate</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold text-white">72</span>
                    <span class="text-xs text-gray-500">bpm</span>
                </div>
            </div>
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center">
                        <i class="fas fa-droplet text-white text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-white">SpO2</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold text-white">98</span>
                    <span class="text-xs text-gray-500">%</span>
                </div>
            </div>
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-green-500 flex items-center justify-center">
                        <i class="fas fa-shoe-prints text-white text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-white">Steps Today</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold text-white">8,421</span>
                </div>
            </div>
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center">
                        <i class="fas fa-temperature-half text-white text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-white">Skin Temp</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold text-white">36.2</span>
                    <span class="text-xs text-gray-500">°C</span>
                </div>
            </div>
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 to-purple-600 flex items-center justify-center">
                        <i class="fas fa-location-arrow text-white text-sm"></i>
                    </div>
                    <span class="text-sm font-medium text-white">GPS Accuracy</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold text-white">±2m</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Last Sync -->
    <div class="content-area pb-28">
        <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06] flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-rotate text-cyan-400"></i>
                <div>
                    <p class="text-sm font-medium text-white">Last Sync</p>
                    <p class="text-[10px] text-gray-500">Just now · All data synced</p>
                </div>
            </div>
            <button class="bg-cyan-500/20 text-cyan-400 text-xs font-semibold px-4 py-2 rounded-xl">Sync</button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 pt-3 pb-8">
        <div class="flex justify-around">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-person-running text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Run</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-hat-wizard text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Character</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-scroll text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Quests</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-trophy text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Ranks</span>
            </div>
        </div>
    </div>
</body>
</html>
