<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunForge - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #0d1117; color: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2 relative" style="background: #0d1117;">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold z-10 text-white">9:41</span>
        <div class="flex items-center gap-1.5 z-10 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="content-area pt-1 mb-5">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                    <i class="fas fa-chevron-left text-white text-sm"></i>
                </div>
                <h1 class="text-xl font-bold text-white">Profile</h1>
            </div>
            <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-gear text-white text-sm"></i>
            </div>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="content-area mb-5">
        <div class="bg-gradient-to-br from-cyan-600/20 to-purple-600/10 rounded-3xl p-6 border border-cyan-500/15 text-center">
            <div class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-cyan-500/40 mx-auto mb-3">
                <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=200&h=200&fit=crop&crop=face" class="w-full h-full object-cover" alt="User">
            </div>
            <h2 class="text-xl font-bold text-white">Ryan Chen</h2>
            <p class="text-xs text-gray-400 mb-3">@stormrunner · Member since 2025</p>
            <div class="flex justify-center gap-6">
                <div class="text-center">
                    <p class="text-lg font-black text-cyan-400">342</p>
                    <p class="text-[10px] text-gray-500">Runs</p>
                </div>
                <div class="text-center">
                    <p class="text-lg font-black text-purple-400">1,847</p>
                    <p class="text-[10px] text-gray-500">km Total</p>
                </div>
                <div class="text-center">
                    <p class="text-lg font-black text-yellow-400">24</p>
                    <p class="text-[10px] text-gray-500">Level</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Weekly Activity Chart -->
    <div class="content-area mb-5">
        <h3 class="text-sm font-bold text-white mb-3">This Week</h3>
        <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
            <div class="flex items-end justify-between gap-2 h-28 mb-2">
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-cyan-500 to-cyan-400" style="height: 70%;"></div>
                    <span class="text-[9px] text-gray-500">M</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-cyan-500 to-cyan-400" style="height: 45%;"></div>
                    <span class="text-[9px] text-gray-500">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-cyan-500 to-cyan-400" style="height: 90%;"></div>
                    <span class="text-[9px] text-gray-500">W</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-cyan-500 to-cyan-400" style="height: 30%;"></div>
                    <span class="text-[9px] text-gray-500">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-purple-500 to-purple-400" style="height: 85%;"></div>
                    <span class="text-[9px] text-gray-500">F</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-gradient-to-t from-cyan-500 to-cyan-400" style="height: 60%;"></div>
                    <span class="text-[9px] text-gray-500">S</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full rounded-lg bg-white/10" style="height: 10%;"></div>
                    <span class="text-[9px] text-cyan-400 font-semibold">S</span>
                </div>
            </div>
            <div class="flex justify-between">
                <span class="text-xs text-gray-500">38.2 km this week</span>
                <span class="text-xs text-emerald-400">+12% vs last week</span>
            </div>
        </div>
    </div>

    <!-- All-Time Stats -->
    <div class="content-area mb-5">
        <h3 class="text-sm font-bold text-white mb-3">All-Time Stats</h3>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <i class="fas fa-road text-cyan-400 text-sm mb-2"></i>
                <p class="text-xl font-black text-white">1,847<span class="text-xs font-normal text-gray-500"> km</span></p>
                <p class="text-[10px] text-gray-500">Total Distance</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <i class="fas fa-clock text-purple-400 text-sm mb-2"></i>
                <p class="text-xl font-black text-white">186<span class="text-xs font-normal text-gray-500"> hrs</span></p>
                <p class="text-[10px] text-gray-500">Total Time</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <i class="fas fa-fire text-orange-400 text-sm mb-2"></i>
                <p class="text-xl font-black text-white">98.4k</p>
                <p class="text-[10px] text-gray-500">Calories Burned</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06]">
                <i class="fas fa-mountain text-emerald-400 text-sm mb-2"></i>
                <p class="text-xl font-black text-white">4,210<span class="text-xs font-normal text-gray-500"> m</span></p>
                <p class="text-[10px] text-gray-500">Elevation Gain</p>
            </div>
        </div>
    </div>

    <!-- Badges -->
    <div class="content-area pb-8">
        <h3 class="text-sm font-bold text-white mb-3">Badges</h3>
        <div class="flex gap-3 flex-wrap">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-yellow-500/20 to-amber-600/10 border border-yellow-500/20 flex items-center justify-center">
                <i class="fas fa-bolt text-yellow-400 text-xl"></i>
            </div>
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-500/20 to-indigo-600/10 border border-purple-500/20 flex items-center justify-center">
                <i class="fas fa-crown text-purple-400 text-xl"></i>
            </div>
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500/20 to-rose-600/10 border border-red-500/20 flex items-center justify-center">
                <i class="fas fa-fire text-red-400 text-xl"></i>
            </div>
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-600/10 border border-cyan-500/20 flex items-center justify-center">
                <i class="fas fa-mountain text-cyan-400 text-xl"></i>
            </div>
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-green-600/10 border border-emerald-500/20 flex items-center justify-center">
                <i class="fas fa-star text-emerald-400 text-xl"></i>
            </div>
            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                <i class="fas fa-lock text-gray-600 text-xl"></i>
            </div>
        </div>
    </div>
</body>
</html>
