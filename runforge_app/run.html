<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunForge - Active Run</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #0d1117; color: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .content-area { padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }
        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; }

        @keyframes pulse-glow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        .pulse-glow { animation: pulse-glow 1.5s ease-in-out infinite; }

        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .heartbeat { animation: heartbeat 0.8s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2 relative bg-gradient-to-r from-cyan-600 to-blue-700">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold z-10 text-white">9:41</span>
        <div class="flex items-center gap-1.5 z-10 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Map Area -->
    <div class="relative">
        <div class="h-72 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?w=800&h=600&fit=crop" class="w-full h-full object-cover opacity-70" alt="Map">
            <div class="absolute inset-0 bg-gradient-to-b from-blue-700/50 via-transparent to-[#0d1117]"></div>
        </div>
        <!-- Running indicator -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-xl rounded-full px-4 py-2 flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
            <span class="text-xs font-semibold text-white">Running Now</span>
            <span class="text-xs text-gray-400">· 5'24"/km</span>
        </div>
        <!-- Route line overlay -->
        <svg class="absolute inset-0 w-full h-full" style="top: 0;">
            <path d="M80,200 Q150,120 200,160 T320,100 T400,150" stroke="url(#routeGradient)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8,4"/>
            <defs>
                <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#06b6d4"/>
                    <stop offset="100%" style="stop-color:#8b5cf6"/>
                </linearGradient>
            </defs>
            <circle cx="400" cy="150" r="6" fill="#06b6d4" class="pulse-glow"/>
        </svg>
    </div>

    <!-- Live Stats -->
    <div class="content-area -mt-8 relative z-10">
        <!-- Timer -->
        <div class="text-center mb-5">
            <p class="text-6xl font-black text-white tracking-tight">28:14</p>
            <p class="text-xs text-gray-500 mt-1">Duration</p>
        </div>

        <!-- Main Stats Grid -->
        <div class="grid grid-cols-3 gap-3 mb-5">
            <div class="bg-white/5 rounded-2xl p-3.5 text-center border border-white/[0.06]">
                <p class="text-2xl font-black text-cyan-400">5.2</p>
                <p class="text-[10px] text-gray-500">km</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-3.5 text-center border border-white/[0.06]">
                <p class="text-2xl font-black text-purple-400">5'24"</p>
                <p class="text-[10px] text-gray-500">pace/km</p>
            </div>
            <div class="bg-white/5 rounded-2xl p-3.5 text-center border border-white/[0.06]">
                <div class="flex items-center justify-center gap-1">
                    <i class="fas fa-heart text-red-400 text-xs heartbeat"></i>
                    <p class="text-2xl font-black text-red-400">142</p>
                </div>
                <p class="text-[10px] text-gray-500">bpm</p>
            </div>
        </div>

        <!-- Real-time Game Power -->
        <div class="bg-gradient-to-r from-yellow-600/20 to-amber-600/10 rounded-2xl p-4 border border-yellow-500/20 mb-5">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i class="fas fa-bolt text-yellow-400"></i>
                    <span class="text-sm font-bold text-white">Power Gaining</span>
                </div>
                <span class="text-xs text-yellow-400 font-semibold">LIVE</span>
            </div>
            <div class="flex items-end gap-4">
                <div class="flex-1">
                    <div class="flex items-baseline gap-1 mb-1">
                        <span class="text-3xl font-black text-yellow-400">+185</span>
                        <span class="text-sm text-yellow-400/60">XP</span>
                    </div>
                    <div class="flex gap-3">
                        <span class="text-[10px] text-gray-400"><i class="fas fa-fist-raised text-orange-400 mr-1"></i>+12 ATK</span>
                        <span class="text-[10px] text-gray-400"><i class="fas fa-shield text-blue-400 mr-1"></i>+8 DEF</span>
                        <span class="text-[10px] text-gray-400"><i class="fas fa-wind text-cyan-400 mr-1"></i>+15 SPD</span>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">Streak</p>
                    <p class="text-lg font-black text-orange-400">x2.5</p>
                </div>
            </div>
        </div>

        <!-- Band Data -->
        <div class="bg-white/5 rounded-2xl p-4 border border-white/[0.06] mb-5">
            <div class="flex items-center gap-2 mb-3">
                <i class="fas fa-watch text-cyan-400 text-sm"></i>
                <span class="text-xs font-semibold text-white">Smart Band Live</span>
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse ml-auto"></div>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <div class="text-center">
                    <p class="text-lg font-bold text-white">72</p>
                    <p class="text-[9px] text-gray-500">Cadence</p>
                </div>
                <div class="text-center">
                    <p class="text-lg font-bold text-white">0.8m</p>
                    <p class="text-[9px] text-gray-500">Stride</p>
                </div>
                <div class="text-center">
                    <p class="text-lg font-bold text-white">42</p>
                    <p class="text-[9px] text-gray-500">VO₂</p>
                </div>
                <div class="text-center">
                    <p class="text-lg font-bold text-white">78%</p>
                    <p class="text-[9px] text-gray-500">Band</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="content-area pb-28">
        <div class="flex items-center justify-center gap-6">
            <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-lock text-gray-400 text-lg"></i>
            </div>
            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center shadow-lg shadow-red-500/30">
                <i class="fas fa-stop text-white text-2xl"></i>
            </div>
            <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-pause text-gray-400 text-lg"></i>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar bg-black/90 backdrop-blur-xl border-t border-white/10 px-6 pt-3 pb-8">
        <div class="flex justify-around">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-home text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Home</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-person-running text-cyan-400 text-lg"></i>
                <span class="text-[10px] text-cyan-400 font-semibold">Run</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-hat-wizard text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Character</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-scroll text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Quests</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-trophy text-gray-500 text-lg"></i>
                <span class="text-[10px] text-gray-500">Ranks</span>
            </div>
        </div>
    </div>
</body>
</html>
