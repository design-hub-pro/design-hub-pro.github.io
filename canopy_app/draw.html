<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy — Canvas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#17201C;--acc:#2F6B57;--clay:#C4623C;--amber:#D99B3C;--faint:#8A9690}
html,body{width:100%;height:100%}
body{background:#121714;color:#fff;overflow:hidden}
.screen{position:relative;width:100%;height:100%;background:#121714;overflow:hidden;display:flex;flex-direction:column}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600;color:#fff}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:400;letter-spacing:-.4px}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:4px 28px 14px}
.ghost{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(255,255,255,.8)}
.canvas{flex:1;margin:0 20px;border-radius:20px;overflow:hidden;position:relative;background:#F4F1EA;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.canvas img{width:100%;height:100%;object-fit:cover}
.pill{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(18,23,20,.62);backdrop-filter:blur(10px);padding:8px 14px;border-radius:12px;white-space:nowrap}
.dock{padding:18px 20px 26px}
.sw{width:32px;height:32px;border-radius:50%;flex:0 0 32px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(255,255,255,.18)}
.tool{flex:1;height:50px;border-radius:15px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(255,255,255,.62)}
.tool.on{background:#fff;color:#121714}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:17px;background:var(--clay);color:#fff;font-size:16px;font-weight:700;box-shadow:0 12px 26px rgba(196,98,60,.34)}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="navrow">
    <div class="ghost"><i class="fas fa-xmark"></i></div>
    <div style="text-align:center">
      <div style="font-size:15px;font-weight:700">Weather inside you</div>
      <div class="num" style="font-size:12px;color:rgba(255,255,255,.45);margin-top:1px">04:12 · autosaved</div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="ghost"><i class="fas fa-rotate-left"></i></div>
      <div class="ghost" style="background:#fff;color:#121714"><i class="fas fa-check"></i></div>
    </div>
  </div>

  <div class="canvas">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790736601765-image-1.png" alt="">
    <div class="pill" style="top:16px"><i class="fas fa-eye-slash" style="font-size:11px;color:#9FE0C0"></i> Not graded. Not shared.</div>
    <div style="position:absolute;right:14px;top:14px"></div>
    <div style="position:absolute;left:14px;bottom:14px;display:flex;gap:7px">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#fff;background:rgba(18,23,20,.6);backdrop-filter:blur(8px);padding:6px 10px;border-radius:9px"><i class="fas fa-layer-group" style="font-size:10px"></i> 3 layers</div>
    </div>
  </div>

  <div class="dock">
    <div style="display:flex;align-items:center;gap:11px;justify-content:space-between">
      <div class="sw on" style="background:#2C3742"></div>
      <div class="sw" style="background:#4E6076"></div>
      <div class="sw" style="background:#7B8CA0"></div>
      <div class="sw" style="background:#9BA893"></div>
      <div class="sw" style="background:#4E9C7F"></div>
      <div class="sw" style="background:#D99B3C"></div>
      <div class="sw" style="background:#C4623C"></div>
      <div class="sw" style="background:#F4F1EA"></div>
      <div class="sw" style="background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:11px"><i class="fas fa-plus"></i></div>
    </div>

    <div style="display:flex;align-items:center;gap:13px;margin-top:17px">
      <span style="font-size:11px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:1.4px">SIZE</span>
      <div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative">
        <div style="width:44%;height:100%;border-radius:3px;background:#fff"></div>
        <div style="position:absolute;left:44%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#fff"></div>
      </div>
      <span class="num" style="font-size:12px;font-weight:700;color:rgba(255,255,255,.6)">18</span>
    </div>

    <div style="display:flex;gap:9px;margin-top:16px">
      <div class="tool on"><i class="fas fa-paintbrush"></i></div>
      <div class="tool"><i class="fas fa-pencil"></i></div>
      <div class="tool"><i class="fas fa-fill-drip"></i></div>
      <div class="tool"><i class="fas fa-eraser"></i></div>
      <div class="tool"><i class="fas fa-shapes"></i></div>
      <div class="tool"><i class="fas fa-camera"></i></div>
    </div>

    <div style="display:flex;gap:11px;margin-top:16px">
      <div class="btn" style="flex:1">Save to my log</div>
      <div style="flex:0 0 54px;height:54px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(255,255,255,.72)"><i class="fas fa-microphone-lines"></i></div>
    </div>
    <div style="text-align:center;font-size:12.5px;color:rgba(255,255,255,.4);margin-top:13px">Add a voice note if writing feels like too much</div>
  </div>
</div>
</body>
</html>
