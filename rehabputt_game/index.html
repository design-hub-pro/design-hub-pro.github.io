<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RehabPutt - Game Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        .screenshot-frame { border-radius: 16px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .screenshot-frame:hover { transform: translateY(-4px); box-shadow: 0 35px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08); }
        .screenshot-frame img { width: 100%; height: auto; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-5xl mx-auto px-8 pt-16 pb-12 text-center">
        <div class="flex items-center justify-center gap-3 mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-orange-400 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-golf-ball-tee text-white text-3xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">RehabPutt</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A camera-tracked putting game that scores seniors on balance, range and tempo, not golf skill.</p>
        <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Motion</span>
            <span class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">Rehab</span>
            <span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">Seniors</span>
            <span class="text-xs bg-teal-100 text-teal-700 px-3 py-1 rounded-full font-medium">Balance</span>
        </div>
    </div>
    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038204269-image-1.png" alt="RehabPutt - Title Screen">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038205626-image-1.png" alt="RehabPutt - Core Gameplay with Camera Tracking">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038205053-image-1.png" alt="RehabPutt - Garden to Pier Hole Map">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038205012-image-1.png" alt="RehabPutt - Gentle Safety Pause">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038204152-image-1.png" alt="RehabPutt - Community Center Celebration">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038204955-image-1.png" alt="RehabPutt - Player Progress Dials">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038205202-image-1.png" alt="RehabPutt - Tempo Pendulum Training">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038204704-image-1.png" alt="RehabPutt - Weight Shift Balance Pad">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038204827-image-1.png" alt="RehabPutt - Stable vs Wobbly Replay">
            </div>
            <div class="screenshot-frame">
                <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794038217655-image-1.png" alt="RehabPutt - Session Results">
            </div>
        </div>
    </div>
</body>
</html>
