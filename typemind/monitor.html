<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, height=600, initial-scale=1.0">
    <title>TypeMind - Live Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
        .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Extension Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button class="text-white/70 hover:text-white">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-white text-xl font-bold">Live Monitor</h1>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
                <span class="text-white text-sm font-medium">Recording</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-5 py-4 overflow-y-auto" style="height: calc(600px - 68px);">
        <!-- Live Score Display -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4">
            <div class="flex items-center justify-center mb-4">
                <div class="relative">
                    <!-- Pulse rings -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-36 h-36 bg-indigo-100 rounded-full pulse-ring"></div>
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-28 h-28 bg-indigo-200 rounded-full pulse-ring" style="animation-delay: 0.5s;"></div>
                    </div>
                    <!-- Main circle -->
                    <div class="relative w-32 h-32 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex flex-col items-center justify-center shadow-lg">
                        <span class="text-4xl font-bold text-white">83</span>
                        <span class="text-sm text-indigo-200">Organic</span>
                    </div>
                </div>
            </div>
            <p class="text-center text-gray-500 text-sm">Real-time authenticity score</p>
        </div>

        <!-- Current Session Stats -->
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-4">
            <h3 class="text-base font-bold text-gray-900 mb-3">Current Session</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 rounded-xl p-3">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fas fa-keyboard text-indigo-500"></i>
                        <span class="text-sm text-gray-500">Keystrokes</span>
                    </div>
                    <p class="text-xl font-bold text-gray-900">1,247</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-3">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fas fa-clipboard text-amber-500"></i>
                        <span class="text-sm text-gray-500">Pastes</span>
                    </div>
                    <p class="text-xl font-bold text-gray-900">3</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-3">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fas fa-clock text-emerald-500"></i>
                        <span class="text-sm text-gray-500">Duration</span>
                    </div>
                    <p class="text-xl font-bold text-gray-900">18:42</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-3">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fas fa-tachometer-alt text-purple-500"></i>
                        <span class="text-sm text-gray-500">WPM</span>
                    </div>
                    <p class="text-xl font-bold text-gray-900">58</p>
                </div>
            </div>
        </div>

        <!-- Live Activity Feed -->
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-4">
            <h3 class="text-base font-bold text-gray-900 mb-3">Activity Feed</h3>
            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                    <div class="flex-1 flex items-center justify-between">
                        <span class="text-sm text-gray-600">Typing burst detected</span>
                        <span class="text-xs text-gray-400">Just now</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-amber-500 rounded-full"></div>
                    <div class="flex-1 flex items-center justify-between">
                        <span class="text-sm text-gray-600">Small paste (12 chars)</span>
                        <span class="text-xs text-gray-400">2m ago</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full"></div>
                    <div class="flex-1 flex items-center justify-between">
                        <span class="text-sm text-gray-600">Consistent rhythm</span>
                        <span class="text-xs text-gray-400">5m ago</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                    <div class="flex-1 flex items-center justify-between">
                        <span class="text-sm text-gray-600">Natural pause pattern</span>
                        <span class="text-xs text-gray-400">8m ago</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pause/Stop Controls -->
        <div class="flex gap-3">
            <button class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold flex items-center justify-center gap-2">
                <i class="fas fa-pause"></i>
                Pause
            </button>
            <button class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-semibold flex items-center justify-center gap-2">
                <i class="fas fa-stop"></i>
                End Session
            </button>
        </div>
    </div>
</body>
</html>
