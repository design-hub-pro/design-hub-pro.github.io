<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, height=600, initial-scale=1.0">
    <title>TypeMind - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Extension Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button class="text-white/70 hover:text-white">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-white text-xl font-bold">Analytics</h1>
            </div>
            <div class="flex bg-white/20 rounded-lg p-1">
                <button class="px-3 py-1 bg-white text-indigo-600 rounded text-sm font-medium">Week</button>
                <button class="px-3 py-1 text-white/70 text-sm font-medium">Month</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-5 py-4 overflow-y-auto" style="height: calc(600px - 68px);">
        <!-- Weekly Overview -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Weekly Overview</h3>

            <!-- Weekly Chart -->
            <div class="flex items-end justify-between h-32 gap-2 mb-3">
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-400 rounded-t" style="height: 60%"></div>
                    <span class="text-xs text-gray-400">M</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-400 rounded-t" style="height: 75%"></div>
                    <span class="text-xs text-gray-400">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-400 rounded-t" style="height: 55%"></div>
                    <span class="text-xs text-gray-400">W</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-500 rounded-t" style="height: 90%"></div>
                    <span class="text-xs text-gray-900 font-medium">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-300 rounded-t" style="height: 40%"></div>
                    <span class="text-xs text-gray-400">F</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-200 rounded-t" style="height: 25%"></div>
                    <span class="text-xs text-gray-400">S</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-indigo-200 rounded-t" style="height: 20%"></div>
                    <span class="text-xs text-gray-400">S</span>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 rounded-xl p-3">
                    <p class="text-sm text-gray-500">Avg. Organic Score</p>
                    <p class="text-2xl font-bold text-indigo-600">78</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-3">
                    <p class="text-sm text-gray-500">Total Sessions</p>
                    <p class="text-2xl font-bold text-purple-600">23</p>
                </div>
            </div>
        </div>

        <!-- Behavior Breakdown -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Behavior Breakdown</h3>

            <div class="space-y-4">
                <div>
                    <div class="flex justify-between mb-1">
                        <span class="text-sm text-gray-600">Original Typing</span>
                        <span class="text-sm font-semibold text-indigo-600">72%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-500 rounded-full" style="width: 72%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <span class="text-sm text-gray-600">Copy/Paste</span>
                        <span class="text-sm font-semibold text-amber-600">18%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-amber-400 rounded-full" style="width: 18%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <span class="text-sm text-gray-600">Editing/Revisions</span>
                        <span class="text-sm font-semibold text-emerald-600">10%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-emerald-400 rounded-full" style="width: 10%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing Speed Distribution -->
        <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm mb-4">
            <h3 class="text-lg font-bold text-gray-900 mb-3">Typing Speed</h3>
            <div class="flex items-center gap-4">
                <div class="relative w-24 h-24">
                    <svg class="w-24 h-24 transform -rotate-90">
                        <circle cx="48" cy="48" r="40" stroke="#e5e7eb" stroke-width="8" fill="none"/>
                        <circle cx="48" cy="48" r="40" stroke="#6366f1" stroke-width="8" fill="none"
                                stroke-dasharray="251" stroke-dashoffset="63" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-xl font-bold text-gray-900">62</span>
                        <span class="text-xs text-gray-400">WPM</span>
                    </div>
                </div>
                <div class="flex-1 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Peak Speed</span>
                        <span class="font-medium text-gray-900">85 WPM</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Avg. Pause</span>
                        <span class="font-medium text-gray-900">1.2s</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Consistency</span>
                        <span class="font-medium text-emerald-600">High</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Button -->
        <button class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold flex items-center justify-center gap-2">
            <i class="fas fa-download"></i>
            Export Report
        </button>
    </div>
</body>
</html>
