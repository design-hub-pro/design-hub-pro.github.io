<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, height=600, initial-scale=1.0">
    <title>TypeMind - Session History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            overflow-x: hidden;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Extension Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button class="text-white/70 hover:text-white">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <h1 class="text-white text-xl font-bold">History</h1>
            </div>
            <button class="text-white/70 hover:text-white text-sm">
                <i class="fas fa-filter mr-1"></i>Filter
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-5 py-4 overflow-y-auto" style="height: calc(600px - 68px);">
        <!-- Today's Sessions -->
        <div class="mb-5">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Today</h3>
            <div class="space-y-3">
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-file-alt text-emerald-600 text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <p class="text-base font-semibold text-gray-900">Essay Draft</p>
                                <span class="text-lg font-bold text-indigo-600">92</span>
                            </div>
                            <p class="text-sm text-gray-400">Google Docs • 45 min</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-50">
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-keyboard text-xs"></i>
                            <span>2,847</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-clipboard text-xs"></i>
                            <span>2</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-tachometer-alt text-xs"></i>
                            <span>64 WPM</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-envelope text-blue-600 text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <p class="text-base font-semibold text-gray-900">Email Reply</p>
                                <span class="text-lg font-bold text-indigo-600">88</span>
                            </div>
                            <p class="text-sm text-gray-400">Gmail • 12 min</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-50">
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-keyboard text-xs"></i>
                            <span>423</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-clipboard text-xs"></i>
                            <span>1</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-tachometer-alt text-xs"></i>
                            <span>58 WPM</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Yesterday's Sessions -->
        <div class="mb-5">
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Yesterday</h3>
            <div class="space-y-3">
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-code text-purple-600 text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <p class="text-base font-semibold text-gray-900">Code Comments</p>
                                <span class="text-lg font-bold text-amber-500">67</span>
                            </div>
                            <p class="text-sm text-gray-400">GitHub • 28 min</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-50">
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-keyboard text-xs"></i>
                            <span>1,205</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-amber-500">
                            <i class="fas fa-clipboard text-xs"></i>
                            <span>8</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-tachometer-alt text-xs"></i>
                            <span>42 WPM</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                            <i class="fas fa-graduation-cap text-amber-600 text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <p class="text-base font-semibold text-gray-900">Quiz Answers</p>
                                <span class="text-lg font-bold text-emerald-600">95</span>
                            </div>
                            <p class="text-sm text-gray-400">Canvas • 35 min</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-50">
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-keyboard text-xs"></i>
                            <span>892</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-clipboard text-xs"></i>
                            <span>0</span>
                        </div>
                        <div class="flex items-center gap-1 text-sm text-gray-500">
                            <i class="fas fa-tachometer-alt text-xs"></i>
                            <span>52 WPM</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Card -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-4 text-white">
            <p class="text-sm font-medium text-indigo-200 mb-1">This Week</p>
            <div class="flex items-end justify-between">
                <div>
                    <p class="text-3xl font-bold">84</p>
                    <p class="text-sm text-indigo-200">Avg. Organic Score</p>
                </div>
                <div class="text-right">
                    <p class="text-xl font-bold">12</p>
                    <p class="text-sm text-indigo-200">Sessions</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
