<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-4"><h1 class="serif text-[27px] font-semibold">Weekly report</h1><div class="nav !m-0"><div class="ib"><i class="fas fa-arrow-up-from-bracket"></i></div></div></div>
    <div class="flex bg-white rounded-2xl p-1 text-[13px] font-bold"><span class="flex-1 text-center py-2 muted">Day</span><span class="flex-1 text-center py-2 rounded-xl bg-[#16261F] text-white">Week</span><span class="flex-1 text-center py-2 muted">Month</span></div>

    <div class="card mt-4 !p-5">
      <div class="flex items-end justify-between"><div><p class="label">Avg Nutri score</p><p class="num text-[40px] font-bold leading-none mt-1">81</p></div><span class="text-[13px] font-bold leaf bg-[#EAF6EF] px-2.5 py-1 rounded-full"><i class="fas fa-arrow-trend-up mr-1"></i>+7 vs last wk</span></div>
      <div class="flex items-end justify-between gap-2.5 h-[120px] mt-5">
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CDEBD9]" style="height:62%"></div><span class="text-[10px] muted font-bold">M</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CDEBD9]" style="height:70%"></div><span class="text-[10px] muted font-bold">T</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#F7DDBF]" style="height:48%"></div><span class="text-[10px] muted font-bold">W</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CDEBD9]" style="height:78%"></div><span class="text-[10px] muted font-bold">T</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CDEBD9]" style="height:84%"></div><span class="text-[10px] muted font-bold">F</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#1F6B4A]" style="height:92%"></div><span class="text-[10px] font-bold leaf">S</span></div>
        <div class="flex-1 flex flex-col items-center gap-1.5"><div class="w-full rounded-lg bg-[#CDEBD9]" style="height:80%"></div><span class="text-[10px] muted font-bold">S</span></div>
      </div>
    </div>

    <h2 class="serif text-[19px] font-semibold mt-6 mb-3">Nutrient balance</h2>
    <div class="card !p-4 flex items-center gap-4">
      <svg viewBox="0 0 140 140" class="w-[140px] h-[140px] flex-shrink-0">
        <polygon points="70,12 125,50 104,118 36,118 15,50" fill="none" stroke="#E6EBE3" stroke-width="1.5"/>
        <polygon points="70,41 97,60 87,94 53,94 43,60" fill="none" stroke="#E6EBE3" stroke-width="1.5"/>
        <polygon points="70,20 118,52 92,104 50,108 30,54" fill="rgba(63,175,116,.25)" stroke="#1F6B4A" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="70" cy="20" r="4" fill="#1F6B4A"/><circle cx="118" cy="52" r="4" fill="#1F6B4A"/><circle cx="92" cy="104" r="4" fill="#EE8E3A"/><circle cx="50" cy="108" r="4" fill="#1F6B4A"/><circle cx="30" cy="54" r="4" fill="#1F6B4A"/>
      </svg>
      <div class="flex-1 space-y-2 text-[13px] font-semibold">
        <div class="flex justify-between"><span><span class="dot bg-[#3FAF74] mr-2"></span>Protein</span><span class="num">94%</span></div>
        <div class="flex justify-between"><span><span class="dot bg-[#3FAF74] mr-2"></span>Omega-3</span><span class="num">88%</span></div>
        <div class="flex justify-between"><span><span class="dot bg-[#EE8E3A] mr-2"></span>Iron</span><span class="num amber-t">61%</span></div>
        <div class="flex justify-between"><span><span class="dot bg-[#3FAF74] mr-2"></span>Fiber</span><span class="num">82%</span></div>
        <div class="flex justify-between"><span><span class="dot bg-[#3FAF74] mr-2"></span>Vit C</span><span class="num">110%</span></div>
      </div>
    </div>

    <h2 class="serif text-[19px] font-semibold mt-6 mb-3">Next week, focus on</h2>
    <div class="space-y-2.5">
      <div class="card !p-3 flex items-center gap-3"><div class="gi g-amber"><i class="fas fa-droplet"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Iron at 61%</p><p class="text-[12px] muted">Pair lentils with citrus 3x</p></div><span class="text-[12px] font-bold leaf">Plan</span></div>
      <div class="card !p-3 flex items-center gap-3"><div class="gi g-rose"><i class="fas fa-cubes-stacked"></i></div><div class="flex-1"><p class="text-[14px] font-bold">Sodium over 4 days</p><p class="text-[12px] muted">2 packaged meals to swap</p></div><span class="text-[12px] font-bold leaf">Swap</span></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Today</span></div>
    <div class="tab"><i class="fas fa-calendar-days"></i><span>Plan</span></div>
    <div class="tab"><div class="tab-scan"><i class="fas fa-camera"></i></div></div>
    <div class="tab active"><i class="fas fa-chart-simple"></i><span>Insights</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
