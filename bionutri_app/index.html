<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioNutri</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#16261F}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2b302d,#0b0e0c);box-shadow:0 50px 80px -30px rgba(20,60,40,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F6F1}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#5CC48A,#1F6B4A 60%,#EE8E3A)"><i class="fa-solid fa-leaf text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-semibold tracking-tight" style="font-family:'Fraunces',Georgia,serif">BioNutri</h1>
  <p class="mt-3 text-[19px] text-gray-500">Snap a meal and see how its nutrients work together, then get swaps that fit your goals.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-800">Nutrition</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">AI Food Tracking</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Health</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Public Health</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="scan.html" scrolling="no" title="scan"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="meal.html" scrolling="no" title="meal"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="barcode.html" scrolling="no" title="barcode"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="swaps.html" scrolling="no" title="swaps"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pairing.html" scrolling="no" title="pairing"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="plan.html" scrolling="no" title="plan"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="report.html" scrolling="no" title="report"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="simulator.html" scrolling="no" title="simulator"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="learn.html" scrolling="no" title="learn"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
</div></main>
</body></html>
