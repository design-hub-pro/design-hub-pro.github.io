<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal analysis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="relative h-[300px] -mt-[59px]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794366332461-image-1.png" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(244,246,241,0) 70%,#F4F6F1)"></div>
    <div class="absolute top-[66px] left-7 right-7 flex justify-between"><div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-chevron-left"></i></div><div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center"><i class="fas fa-share-nodes"></i></div></div>
  </div>
  <div class="content !h-[calc(100%-241px-90px)] -mt-6 relative">
    <p class="label">Lunch &middot; analysed</p>
    <div class="flex items-end justify-between"><h1 class="serif text-[26px] font-semibold leading-tight">Salmon quinoa bowl</h1><p class="num text-[34px] font-bold leaf leading-none">92</p></div>

    <div class="grid grid-cols-4 gap-2 mt-4">
      <div class="card !p-2.5 text-center"><p class="num text-[19px] font-bold">612</p><p class="text-[10px] muted font-bold">KCAL</p></div>
      <div class="card !p-2.5 text-center"><p class="num text-[19px] font-bold leaf">38g</p><p class="text-[10px] muted font-bold">PROTEIN</p></div>
      <div class="card !p-2.5 text-center"><p class="num text-[19px] font-bold amber-t">11g</p><p class="text-[10px] muted font-bold">FIBER</p></div>
      <div class="card !p-2.5 text-center"><p class="num text-[19px] font-bold text-[#3B82C4]">2.1g</p><p class="text-[10px] muted font-bold">OMEGA-3</p></div>
    </div>

    <h2 class="serif text-[19px] font-semibold mt-6 mb-3">Nutrient interactions</h2>
    <div class="card !p-4">
      <svg viewBox="0 0 360 170" class="w-full">
        <line x1="70" y1="45" x2="180" y2="85" stroke="#3FAF74" stroke-width="3"/>
        <line x1="290" y1="45" x2="180" y2="85" stroke="#3FAF74" stroke-width="3"/>
        <line x1="70" y1="135" x2="180" y2="85" stroke="#D9534F" stroke-width="3" stroke-dasharray="6 5"/>
        <line x1="290" y1="135" x2="180" y2="85" stroke="#3FAF74" stroke-width="3"/>
        <circle cx="180" cy="85" r="34" fill="#1F6B4A"/><text x="180" y="82" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter">Vit D</text><text x="180" y="98" text-anchor="middle" fill="#9BEFBF" font-size="10" font-weight="600" font-family="Inter">salmon</text>
        <circle cx="70" cy="45" r="25" fill="#EAF6EF"/><text x="70" y="49" text-anchor="middle" fill="#1F6B4A" font-size="11" font-weight="700" font-family="Inter">Fat</text>
        <circle cx="290" cy="45" r="25" fill="#EAF6EF"/><text x="290" y="49" text-anchor="middle" fill="#1F6B4A" font-size="11" font-weight="700" font-family="Inter">Calcium</text>
        <circle cx="70" cy="135" r="25" fill="#FDECEC"/><text x="70" y="139" text-anchor="middle" fill="#C9443F" font-size="11" font-weight="700" font-family="Inter">Oxalate</text>
        <circle cx="290" cy="135" r="25" fill="#EAF6EF"/><text x="290" y="139" text-anchor="middle" fill="#1F6B4A" font-size="11" font-weight="700" font-family="Inter">Vit K</text>
      </svg>
      <div class="flex gap-4 text-[11px] font-semibold muted mt-1"><span><span class="dot bg-[#3FAF74] mr-1"></span>Boosts absorption</span><span><span class="dot bg-[#D9534F] mr-1"></span>Blocks</span></div>
    </div>
    <div class="space-y-2.5 mt-3">
      <div class="card !p-3 flex items-center gap-3"><div class="gi g-leaf !w-10 !h-10"><i class="fas fa-plus"></i></div><p class="text-[13px] font-semibold flex-1">Avocado fat helps you absorb salmon's vitamin D</p></div>
      <div class="card !p-3 flex items-center gap-3"><div class="gi g-rose !w-10 !h-10"><i class="fas fa-minus"></i></div><p class="text-[13px] font-semibold flex-1">Spinach oxalate binds some calcium. Add lemon or swap for kale</p></div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab active"><i class="fas fa-house"></i><span>Today</span></div>
    <div class="tab"><i class="fas fa-calendar-days"></i><span>Plan</span></div>
    <div class="tab"><div class="tab-scan"><i class="fas fa-camera"></i></div></div>
    <div class="tab"><i class="fas fa-chart-simple"></i><span>Insights</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
