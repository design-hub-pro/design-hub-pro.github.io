<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute inset-0"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794366332469-image-1.png" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 45%,rgba(0,0,0,.2) 100%)"></div></div>
  <div class="relative z-10 px-7 flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-2xl bg-black/35 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-xmark"></i></div>
    <div class="flex bg-black/35 backdrop-blur rounded-full p-1 text-[12px] font-bold text-white">
      <span class="px-3.5 py-1.5 rounded-full bg-white text-[#16261F]"><i class="fas fa-camera mr-1"></i>Photo</span>
      <span class="px-3.5 py-1.5"><i class="fas fa-barcode mr-1"></i>Barcode</span>
      <span class="px-3.5 py-1.5"><i class="fas fa-keyboard mr-1"></i>Text</span>
    </div>
    <div class="w-10 h-10 rounded-2xl bg-black/35 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-bolt"></i></div>
  </div>
  <!-- detection boxes -->
  <div class="absolute z-10 left-[120px] top-[300px] w-[150px] h-[110px] rounded-2xl border-[3px] border-[#9BEFBF]"><span class="absolute -top-8 left-0 text-[12px] font-bold bg-[#9BEFBF] text-[#123F2C] px-2.5 py-1 rounded-full whitespace-nowrap">Grilled chicken &middot; 96%</span></div>
  <div class="absolute z-10 left-[250px] top-[420px] w-[130px] h-[100px] rounded-2xl border-[3px] border-[#F7C66E]"><span class="absolute -bottom-8 right-0 text-[12px] font-bold bg-[#F7C66E] text-[#5A3407] px-2.5 py-1 rounded-full whitespace-nowrap">Sweet potato &middot; 91%</span></div>
  <div class="absolute z-10 left-[60px] top-[440px] w-[120px] h-[90px] rounded-2xl border-[3px] border-[#8CC4F0]"><span class="absolute -bottom-8 left-0 text-[12px] font-bold bg-[#8CC4F0] text-[#0F3558] px-2.5 py-1 rounded-full whitespace-nowrap">Broccoli &middot; 88%</span></div>

  <div class="absolute z-20 left-0 right-0 bottom-0 bg-white rounded-t-[34px] px-7 pt-3 pb-8 shadow-[0_-10px_40px_rgba(0,0,0,.2)]">
    <div class="w-10 h-1.5 rounded-full bg-[#DCE3D9] mx-auto"></div>
    <div class="flex items-center justify-between mt-4">
      <div><p class="label">3 foods found</p><p class="num text-[32px] font-bold leading-tight">548 <span class="text-[15px] muted font-semibold">kcal</span></p></div>
      <div class="flex gap-2">
        <div class="text-center w-[58px] py-2 rounded-2xl bg-[#EAF6EF]"><p class="num text-[17px] font-bold leaf">46g</p><p class="text-[10px] muted font-bold">PROT</p></div>
        <div class="text-center w-[58px] py-2 rounded-2xl bg-[#FFF3E3]"><p class="num text-[17px] font-bold amber-t">52g</p><p class="text-[10px] muted font-bold">CARB</p></div>
        <div class="text-center w-[58px] py-2 rounded-2xl bg-[#EAF2FB]"><p class="num text-[17px] font-bold text-[#3B82C4]">14g</p><p class="text-[10px] muted font-bold">FAT</p></div>
      </div>
    </div>
    <div class="flex items-center gap-2 mt-3 text-[12px] font-semibold text-[#1F6B4A] bg-[#EAF6EF] rounded-xl px-3 py-2"><i class="fas fa-database"></i>Matched to USDA FoodData Central &middot; portions estimated</div>
    <div class="flex gap-3 mt-4"><div class="btn ghost flex-1 !h-[52px] !text-[15px] border border-[#E5EAE2]"><i class="fas fa-pen"></i>Adjust</div><div class="btn primary flex-[2] !h-[52px] !text-[15px]"><i class="fas fa-check"></i>Log dinner</div></div>
  </div>
</div>
</body>
</html>
