<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScope AI - Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes pulse-corner {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        @keyframes ai-thinking {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .scan-line {
            animation: scan-line 2s linear infinite;
        }
        .pulse-corner {
            animation: pulse-corner 1.5s ease-in-out infinite;
        }
        .ai-thinking {
            animation: ai-thinking 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black">

    <!-- Phone Frame -->
    <div class="w-[430px] h-[932px] mx-auto bg-black relative overflow-hidden">

        <!-- Camera Viewfinder -->
        <div class="absolute inset-0 bg-gradient-to-b from-gray-900 to-black">
            <!-- Simulated camera feed -->
            <div class="absolute inset-0 bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 opacity-60"></div>

            <!-- Grid lines -->
            <svg class="absolute inset-0 w-full h-full opacity-20">
                <line x1="143" y1="0" x2="143" y2="932" stroke="white" stroke-width="1"/>
                <line x1="287" y1="0" x2="287" y2="932" stroke="white" stroke-width="1"/>
                <line x1="0" y1="311" x2="430" y2="311" stroke="white" stroke-width="1"/>
                <line x1="0" y1="622" x2="430" y2="622" stroke="white" stroke-width="1"/>
            </svg>
        </div>

        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 h-14 flex items-start justify-between px-8 pt-3 z-50">
            <div class="text-white text-[17px] font-semibold">9:41</div>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-white text-sm"></i>
                <i class="fas fa-wifi text-white text-sm"></i>
                <i class="fas fa-battery-three-quarters text-white text-sm"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="absolute top-14 left-0 right-0 px-6 py-4 z-40 bg-gradient-to-b from-black/60 to-transparent">
            <div class="flex items-center justify-between">
                <button class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center active:scale-95 transition-transform">
                    <i class="fas fa-times text-white text-lg"></i>
                </button>
                <div class="text-center">
                    <div class="text-white font-bold text-lg">Scan Food Label</div>
                    <div class="text-white/70 text-xs">Position label in frame</div>
                </div>
                <button class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center active:scale-95 transition-transform">
                    <i class="fas fa-bolt text-white text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Scanning Frame -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-64 z-30">
            <!-- Corner Brackets -->
            <div class="absolute top-0 left-0 w-12 h-12 border-l-4 border-t-4 border-green-400 rounded-tl-2xl pulse-corner"></div>
            <div class="absolute top-0 right-0 w-12 h-12 border-r-4 border-t-4 border-green-400 rounded-tr-2xl pulse-corner" style="animation-delay: 0.2s;"></div>
            <div class="absolute bottom-0 left-0 w-12 h-12 border-l-4 border-b-4 border-green-400 rounded-bl-2xl pulse-corner" style="animation-delay: 0.4s;"></div>
            <div class="absolute bottom-0 right-0 w-12 h-12 border-r-4 border-b-4 border-green-400 rounded-br-2xl pulse-corner" style="animation-delay: 0.6s;"></div>

            <!-- Scanning Line -->
            <div class="absolute left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-green-400 to-transparent scan-line shadow-lg shadow-green-400/50"></div>

            <!-- Center Target -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 border-2 border-green-400 rounded-full flex items-center justify-center ai-thinking">
                <div class="w-12 h-12 bg-green-400/20 backdrop-blur-sm rounded-full flex items-center justify-center">
                    <i class="fas fa-crosshairs text-green-400 text-xl"></i>
                </div>
            </div>
        </div>

        <!-- AI Status Indicator -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 translate-y-40 z-40 bg-black/60 backdrop-blur-xl rounded-full px-6 py-3 border border-green-400/30">
            <div class="flex items-center space-x-3">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
                </div>
                <span class="text-green-400 text-sm font-semibold">AI Vision Active</span>
            </div>
        </div>

        <!-- Instructions -->
        <div class="absolute bottom-48 left-0 right-0 px-8 z-40">
            <div class="bg-white/10 backdrop-blur-2xl rounded-3xl p-5 border border-white/20">
                <h4 class="text-white font-bold text-center mb-3">Quick Tips</h4>
                <div class="space-y-2">
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-check-circle text-green-400 text-sm mt-0.5"></i>
                        <span class="text-white/90 text-xs">Hold steady, ensure good lighting</span>
                    </div>
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-check-circle text-green-400 text-sm mt-0.5"></i>
                        <span class="text-white/90 text-xs">Focus on nutrition facts or ingredients list</span>
                    </div>
                    <div class="flex items-start space-x-3">
                        <i class="fas fa-check-circle text-green-400 text-sm mt-0.5"></i>
                        <span class="text-white/90 text-xs">Works with packaged foods, drinks, snacks</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="absolute bottom-0 left-0 right-0 px-6 py-8 pb-12 z-40 bg-gradient-to-t from-black/80 to-transparent">
            <div class="flex items-center justify-between">

                <!-- Gallery Button -->
                <button class="flex flex-col items-center space-y-1 active:scale-95 transition-transform">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl border-2 border-white/30 flex items-center justify-center">
                        <i class="fas fa-images text-white text-xl"></i>
                    </div>
                    <span class="text-white/70 text-xs font-medium">Gallery</span>
                </button>

                <!-- Capture Button -->
                <button class="relative active:scale-95 transition-transform">
                    <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-500 rounded-full flex items-center justify-center shadow-2xl shadow-green-400/50">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center">
                            <i class="fas fa-scanner text-green-600 text-2xl"></i>
                        </div>
                    </div>
                    <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
                        <span class="text-white text-xs font-bold">TAP TO SCAN</span>
                    </div>
                </button>

                <!-- History Button -->
                <button class="flex flex-col items-center space-y-1 active:scale-95 transition-transform">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl border-2 border-white/30 flex items-center justify-center">
                        <i class="fas fa-clock-rotate-left text-white text-xl"></i>
                    </div>
                    <span class="text-white/70 text-xs font-medium">History</span>
                </button>

            </div>
        </div>

    </div>

</body>
</html>
