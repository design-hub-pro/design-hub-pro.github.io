<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiltCuff — System Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; } * { scrollbar-width: none; }
        .shot-frame { border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05); }
        .shot-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 860px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="bg-white">
    <div class="max-w-6xl mx-auto px-8 pt-16 pb-10 text-center">
        <div class="w-16 h-16 mx-auto mb-5 bg-gradient-to-br from-cyan-500 to-sky-600 rounded-2xl flex items-center justify-center shadow-lg">
            <i class="fas fa-bottle-water text-white text-3xl"></i>
        </div>
        <h1 class="text-5xl font-black text-gray-900 mb-3">TiltCuff</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">A bottle sleeve that weighs every sip and tells a real drink from a spill.</p>
        <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Sports</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">IoT</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Load Cell</span>
            <span class="text-xs bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full font-medium">Hydration</span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 pb-24">
        <div class="grid-2col">
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399331913-image-1.png" alt="TiltCuff — athlete drinking at practice"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399275261-image-1.png" alt="TiltCuff — sleeve with ruler for scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399281505-image-1.png" alt="TiltCuff — fitted bottle on the team bench"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399287341-image-1.png" alt="TiltCuff — sliding a bottle into the sleeve"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399338218-image-1.png" alt="TiltCuff — signal path from tilt and weight to app"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399299264-image-1.png" alt="TiltCuff — exploded base pod stack"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399305389-image-1.png" alt="TiltCuff — bench check against a kitchen scale"></div>
            <div class="shot-frame"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1793399344478-image-1.png" alt="TiltCuff — power and wiring concept"></div>
        </div>
    </div>
</body>
</html>
