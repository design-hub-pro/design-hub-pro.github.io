<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otto — New Task</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}
html,body{width:100%;height:100%}
body{font-family:'Inter',sans-serif;background:#fff;color:#0E1116;-webkit-font-smoothing:antialiased;scrollbar-width:none;overflow:hidden}
.display{font-family:'Space Grotesk',sans-serif}
.screen{position:relative;width:100%;height:100%;overflow:hidden}
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:30}
.statusbar .time{font-size:16px;font-weight:600}.statusbar .icons{display:flex;gap:7px;font-size:15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:40}
.content{position:absolute;top:59px;bottom:0;left:0;right:0;overflow-y:auto;padding-bottom:120px}
.sendbar{position:absolute;left:0;right:0;bottom:0;padding:14px 28px 30px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);z-index:40}
.chip{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid #E7E8F0;color:#475067;white-space:nowrap}
.hide-sb{overflow-x:auto;scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.mic-ring{animation:ring 2s ease-out infinite}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <div class="content">
    <!-- Nav -->
    <div class="px-7 flex items-center justify-between mb-6">
      <a href="home.html" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><i class="fas fa-xmark text-slate-600"></i></a>
      <span class="font-bold text-[15px]">New task</span>
      <div class="w-10 h-10 flex items-center justify-center text-slate-400"><i class="fas fa-clock-rotate-left"></i></div>
    </div>

    <!-- Input -->
    <div class="px-7 mb-5">
      <p class="display text-[24px] font-600 leading-snug mb-4 text-slate-900">What should Otto<br>do for you?</p>
      <div class="rounded-3xl border-2 border-indigo-100 bg-indigo-50/40 p-5 min-h-[150px]">
        <p class="text-[17px] leading-relaxed text-slate-800 font-medium">Book a dentist appointment for next week<span class="inline-block w-0.5 h-5 bg-indigo-500 align-middle ml-0.5" style="animation:blink 1s step-end infinite"></span></p>
        <p class="text-[14px] text-slate-400 mt-2">and add it to my calendar.</p>
      </div>
    </div>

    <!-- Suggestion chips -->
    <div class="hide-sb flex gap-2 px-7 mb-7">
      <span class="chip"><i class="fas fa-magnifying-glass text-indigo-500 mr-1"></i>Research</span>
      <span class="chip"><i class="fas fa-envelope text-blue-500 mr-1"></i>Draft email</span>
      <span class="chip"><i class="fas fa-calendar text-emerald-500 mr-1"></i>Schedule</span>
      <span class="chip"><i class="fas fa-file-lines text-amber-500 mr-1"></i>Summarize</span>
    </div>

    <!-- Options -->
    <div class="px-7 space-y-3 mb-7">
      <div class="flex items-center gap-3.5 bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#6366F1,#A855F7)"><i class="fas fa-wand-magic-sparkles text-white text-sm"></i></div>
        <div class="flex-1"><p class="text-[13.5px] font-semibold">Agent</p><p class="text-[12px] text-slate-400">Otto · General assistant</p></div>
        <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-3 bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm">
          <div class="w-9 h-9 rounded-xl bg-amber-100 flex items-center justify-center"><i class="fas fa-flag text-amber-600 text-sm"></i></div>
          <div><p class="text-[13px] font-semibold">High</p><p class="text-[11px] text-slate-400">Priority</p></div>
        </div>
        <div class="flex items-center gap-3 bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm">
          <div class="w-9 h-9 rounded-xl bg-emerald-100 flex items-center justify-center"><i class="fas fa-bolt text-emerald-600 text-sm"></i></div>
          <div><p class="text-[13px] font-semibold">ASAP</p><p class="text-[11px] text-slate-400">Due</p></div>
        </div>
      </div>
    </div>

    <!-- Voice -->
    <div class="flex flex-col items-center">
      <div class="relative w-16 h-16 mb-2">
        <span class="mic-ring absolute inset-0 rounded-full" style="background:rgba(99,102,241,.25)"></span>
        <div class="relative w-16 h-16 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#6366F1,#8B5CF6)"><i class="fas fa-microphone text-white text-xl"></i></div>
      </div>
      <p class="text-[12px] text-slate-400 font-medium">or hold to speak</p>
    </div>
  </div>

  <!-- Send bar -->
  <div class="sendbar">
    <a href="agent-live.html" class="flex items-center justify-center gap-2.5 text-white font-bold text-[16px] py-4 rounded-2xl" style="background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 16px 34px -12px rgba(99,102,241,.7)">
      <i class="fas fa-paper-plane"></i>Hand to Otto
    </a>
  </div>
</div>
<style>@keyframes blink{50%{opacity:0}}</style>
</body>
</html>
