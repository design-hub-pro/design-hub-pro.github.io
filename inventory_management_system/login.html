<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 进销存管理系统</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-features {
            position: absolute;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            max-width: 360px;
        }

        .login-features h2 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .login-features p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9375rem;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
        }

        .login-card {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .role-option {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
        }

        .role-option:hover {
            border-color: var(--primary-300);
        }

        .role-option.selected {
            border-color: var(--primary-500);
            background: var(--primary-50);
        }

        .role-option-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .role-option-title {
            font-weight: 600;
            font-size: 0.9375rem;
            color: var(--gray-900);
        }

        .role-option-desc {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .divider-text {
            font-size: 0.8125rem;
            color: var(--gray-400);
        }

        @media (max-width: 1024px) {
            .login-features {
                display: none;
            }

            .login-card {
                position: static;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Features -->
        <div class="login-features">
            <h2>智能进销存<br>管理系统</h2>
            <p>高效管理库存、优化采购决策、实时掌握经营数据，让您的业务管理更加轻松便捷。</p>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">📦</div>
                    <span>实时库存监控与预警</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <span>FIFO成本法毛利分析</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📋</div>
                    <span>批次管理与溯源追踪</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">👥</div>
                    <span>多角色权限精细控制</span>
                </div>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">📦</div>
                <h1 class="login-title">欢迎回来</h1>
                <p class="login-subtitle">请登录您的账号以继续使用系统</p>
            </div>

            <form class="login-form">
                <!-- Role Selector -->
                <div class="role-selector">
                    <div class="role-option selected" onclick="selectRole(this)">
                        <div class="role-option-icon">👔</div>
                        <div class="role-option-title">管理员</div>
                        <div class="role-option-desc">完整权限</div>
                    </div>
                    <div class="role-option" onclick="selectRole(this)">
                        <div class="role-option-icon">👷</div>
                        <div class="role-option-title">员工</div>
                        <div class="role-option-desc">基础操作</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" placeholder="请输入用户名" value="admin">
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" placeholder="请输入密码" value="••••••••">
                </div>

                <div class="login-actions">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>

                <a href="index.html" class="btn btn-primary login-btn">
                    登录系统
                </a>

                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">演示账号</span>
                    <div class="divider-line"></div>
                </div>

                <div style="background: var(--gray-50); border-radius: var(--radius-md); padding: 16px; font-size: 0.8125rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: var(--gray-500);">管理员账号：</span>
                        <span style="font-family: var(--font-family-mono);">admin / admin123</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--gray-500);">员工账号：</span>
                        <span style="font-family: var(--font-family-mono);">staff / staff123</span>
                    </div>
                </div>
            </form>

            <div style="text-align: center; margin-top: 32px; font-size: 0.8125rem; color: var(--gray-400);">
                © 2025 进销存管理系统 · 版本 1.0.0
            </div>
        </div>
    </div>

    <script>
        function selectRole(element) {
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
        }
    </script>
</body>
</html>
