<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pathway Blueprint — App Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 13px;
            color: #4f46e5;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #1e1b4b, #3730a3, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 16px;
            color: #6b7280;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            max-width: 1580px;
            margin: 0 auto;
            padding: 20px 60px 80px;
            justify-items: center;
        }

        .screen-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            background: #000;
            padding: 12px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.1),
                0 25px 60px rgba(0,0,0,0.3),
                0 10px 20px rgba(0,0,0,0.2),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
        }

        .phone-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 52px;
            overflow: hidden;
        }

        .screen-label {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-badge">
            <i class="fas fa-layer-group"></i>
            AI Education Platform
        </div>
        <h1>AI Pathway Blueprint</h1>
        <p>From AI Consumer to AI Architect — A 3-layer learning ecosystem with Foundation tracks, 10 specialized electives, and power-up micro-courses.</p>
    </div>

    <div class="screens-grid">
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="home.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Dashboard</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="foundation.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">The Foundation</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="electives.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Electives</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="elective_detail.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Elective Detail</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="skills.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Circle of Skills</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="journey.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">My Journey</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="analytics.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Analytics</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="cohort.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Cohorts</span>
        </div>
        <div class="screen-container">
            <div class="phone-frame">
                <iframe src="profile.html" scrolling="no"></iframe>
            </div>
            <span class="screen-label">Profile</span>
        </div>
    </div>
</body>
</html>
