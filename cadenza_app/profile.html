<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadenza · Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;font-family:'Inter',sans-serif;background:#0A0812;color:#F3EEFF;}
.font-serif{font-family:'Fraunces',serif;letter-spacing:-0.02em;}
.font-serif-italic{font-family:'Fraunces',serif;font-style:italic;font-weight:500;}
.font-mono{font-family:'JetBrains Mono',monospace;}
.screen{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(120% 50% at 50% 0%, rgba(139,92,246,0.22) 0%, transparent 55%), linear-gradient(180deg,#150F28 0%, #0A0812 100%);}
.scroll{position:absolute;inset:0;overflow-y:auto;padding-bottom:60px;}
.island{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:24px;z-index:30;}
.status-bar{height:59px;padding:20px 28px 0;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:#F3EEFF;}
.section-padding{padding-left:28px;padding-right:28px;}
.glass{background:rgba(243,238,255,0.045);border:1px solid rgba(167,139,250,0.14);backdrop-filter:blur(20px);border-radius:24px;}
.violet-grad{background:linear-gradient(135deg,#C4B5FD 0%, #8B5CF6 50%, #4F46E5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.gold-grad{background:linear-gradient(135deg,#FDE68A 0%, #F5B942 50%, #D97706 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-val{font-family:'Fraunces',serif;font-weight:700;letter-spacing:-0.03em;font-size:20px;line-height:1;}
.badge{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.setting-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(167,139,250,0.08);}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="status-bar">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-xs"></i>
        <i class="fa-solid fa-wifi text-xs"></i>
        <i class="fa-solid fa-battery-full text-xs"></i>
      </div>
    </div>

    <!-- Profile header -->
    <div class="section-padding mt-4 flex flex-col items-center text-center">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop" class="w-20 h-20 rounded-full object-cover ring-4 ring-violet-500/25"/>
      <div class="font-serif text-[21px] font-bold mt-3">Maya Chen</div>
      <div class="chip inline-flex items-center gap-1.5 mt-2 px-3 py-1 rounded-full text-[10.5px] font-bold" style="background:rgba(139,92,246,0.18);border:1px solid rgba(167,139,250,0.3);color:#C4B5FD;"><i class="fa-solid fa-music text-[9px]"></i>Piano · Intermediate</div>
    </div>

    <!-- Stats -->
    <div class="section-padding mt-5 grid grid-cols-3 gap-2.5">
      <div class="glass p-3 text-center"><div class="stat-val">42h</div><div class="text-[9px] text-violet-300/50 mt-1 uppercase font-bold tracking-wide">Practiced</div></div>
      <div class="glass p-3 text-center"><div class="stat-val gold-grad">15d</div><div class="text-[9px] text-violet-300/50 mt-1 uppercase font-bold tracking-wide">Best streak</div></div>
      <div class="glass p-3 text-center"><div class="stat-val">6</div><div class="text-[9px] text-violet-300/50 mt-1 uppercase font-bold tracking-wide">Mastered</div></div>
    </div>

    <!-- Achievements -->
    <div class="section-padding mt-6">
      <div class="text-[10px] font-bold tracking-[0.14em] uppercase text-violet-300/70 mb-3">Achievements</div>
      <div class="grid grid-cols-4 gap-2.5">
        <div class="flex flex-col items-center gap-1.5">
          <div class="badge" style="background:linear-gradient(135deg,#FCD34D,#D97706);"><i class="fa-solid fa-fire text-white text-lg"></i></div>
          <span class="text-[9px] text-violet-300/60 font-semibold">15-day</span>
        </div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="badge" style="background:linear-gradient(135deg,#A78BFA,#4F46E5);"><i class="fa-solid fa-bullseye text-white text-lg"></i></div>
          <span class="text-[9px] text-violet-300/60 font-semibold">90%+ acc</span>
        </div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="badge" style="background:linear-gradient(135deg,#6EE7B7,#059669);"><i class="fa-solid fa-compact-disc text-white text-lg"></i></div>
          <span class="text-[9px] text-violet-300/60 font-semibold">6 pieces</span>
        </div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="badge" style="background:rgba(243,238,255,0.06);border:1.5px dashed rgba(167,139,250,0.3);"><i class="fa-solid fa-lock text-violet-300/40 text-base"></i></div>
          <span class="text-[9px] text-violet-300/40 font-semibold">Locked</span>
        </div>
      </div>
    </div>

    <!-- Settings -->
    <div class="section-padding mt-6">
      <div class="text-[10px] font-bold tracking-[0.14em] uppercase text-violet-300/70 mb-1">Practice setup</div>
      <div class="setting-row"><i class="fa-solid fa-sliders text-violet-300 w-4"></i><span class="flex-1 text-[13px] font-semibold">Instrument &amp; tuning reference</span><span class="text-[11px] text-violet-300/50">A = 440Hz</span><i class="fa-solid fa-chevron-right text-violet-300/30 text-xs"></i></div>
      <div class="setting-row"><i class="fa-solid fa-bell text-violet-300 w-4"></i><span class="flex-1 text-[13px] font-semibold">Practice reminders</span><span class="text-[11px] text-violet-300/50">7:30 PM</span><i class="fa-solid fa-chevron-right text-violet-300/30 text-xs"></i></div>
      <div class="setting-row"><i class="fa-solid fa-microphone-lines text-violet-300 w-4"></i><span class="flex-1 text-[13px] font-semibold">Mic sensitivity</span><i class="fa-solid fa-chevron-right text-violet-300/30 text-xs"></i></div>
      <div class="text-[10px] font-bold tracking-[0.14em] uppercase text-violet-300/70 mt-5 mb-1">Account</div>
      <div class="setting-row"><i class="fa-solid fa-shield-halved text-violet-300 w-4"></i><span class="flex-1 text-[13px] font-semibold">Privacy — audio stays on-device</span><i class="fa-solid fa-chevron-right text-violet-300/30 text-xs"></i></div>
      <div class="setting-row"><i class="fa-solid fa-users text-violet-300 w-4"></i><span class="flex-1 text-[13px] font-semibold">Friends &amp; visibility</span><i class="fa-solid fa-chevron-right text-violet-300/30 text-xs"></i></div>
      <div class="setting-row" style="border-bottom:none;"><i class="fa-solid fa-arrow-right-from-bracket text-rose-400 w-4"></i><span class="flex-1 text-[13px] font-semibold text-rose-300">Log out</span></div>
    </div>
  </div>
</div>
</body>
</html>
