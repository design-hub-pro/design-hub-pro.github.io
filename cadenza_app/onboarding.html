<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadenza · Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;font-family:'Inter',sans-serif;background:#0A0812;color:#F3EEFF;}
.font-serif{font-family:'Fraunces',serif;letter-spacing:-0.02em;}
.font-serif-italic{font-family:'Fraunces',serif;font-style:italic;font-weight:500;}
.screen{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(120% 50% at 50% 0%, rgba(139,92,246,0.24) 0%, transparent 55%), linear-gradient(180deg,#150F28 0%, #0A0812 100%);}
.scroll{position:absolute;inset:0;overflow-y:auto;padding-bottom:40px;}
.island{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:24px;z-index:30;}
.status-bar{height:59px;padding:20px 28px 0;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:#F3EEFF;}
.section-padding{padding-left:28px;padding-right:28px;}
.glass{background:rgba(243,238,255,0.045);border:1px solid rgba(167,139,250,0.14);backdrop-filter:blur(20px);border-radius:24px;}
.violet-grad{background:linear-gradient(135deg,#C4B5FD 0%, #8B5CF6 50%, #4F46E5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.progress-dots{display:flex;gap:6px;}
.pdot{width:26px;height:4px;border-radius:2px;background:rgba(167,139,250,0.2);}
.pdot.active{background:linear-gradient(90deg,#A78BFA,#4F46E5);}
.inst-card{border-radius:20px;padding:16px 12px;background:rgba(243,238,255,0.045);border:1.5px solid rgba(167,139,250,0.14);display:flex;flex-direction:column;align-items:center;gap:8px;}
.inst-card.sel{border-color:#A78BFA;background:rgba(139,92,246,0.16);}
.level-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(243,238,255,0.045);border:1.5px solid rgba(167,139,250,0.14);}
.level-row.sel{border-color:#A78BFA;background:rgba(139,92,246,0.14);}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="scroll">
    <div class="status-bar">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-xs"></i>
        <i class="fa-solid fa-wifi text-xs"></i>
        <i class="fa-solid fa-battery-full text-xs"></i>
      </div>
    </div>

    <div class="section-padding mt-4 flex items-center justify-between">
      <div class="w-9 h-9 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left text-violet-100 text-xs"></i></div>
      <div class="progress-dots"><div class="pdot active"></div><div class="pdot active"></div><div class="pdot"></div></div>
      <span class="text-[11px] text-violet-300/50 font-semibold">2 / 3</span>
    </div>

    <div class="section-padding mt-6">
      <div class="text-[10px] font-bold tracking-[0.18em] uppercase text-violet-300/70">Step 2</div>
      <div class="font-serif text-[27px] font-bold mt-1.5">What do you <span class="font-serif-italic violet-grad">play?</span></div>
      <div class="text-[12.5px] text-violet-200/55 mt-2">Cadenza tunes its pitch and rhythm listening to your instrument's range.</div>
    </div>

    <div class="section-padding mt-6 grid grid-cols-3 gap-2.5">
      <div class="inst-card sel">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#A78BFA,#4F46E5);"><i class="fa-solid fa-music text-white text-lg"></i></div>
        <span class="text-[11.5px] font-bold">Piano</span>
      </div>
      <div class="inst-card">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/5"><i class="fa-solid fa-guitar text-violet-200 text-lg"></i></div>
        <span class="text-[11.5px] font-semibold text-violet-200/80">Guitar</span>
      </div>
      <div class="inst-card">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/5"><i class="fa-solid fa-music text-violet-200 text-lg"></i></div>
        <span class="text-[11.5px] font-semibold text-violet-200/80">Violin</span>
      </div>
      <div class="inst-card">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/5"><i class="fa-solid fa-drum text-violet-200 text-lg"></i></div>
        <span class="text-[11.5px] font-semibold text-violet-200/80">Drums</span>
      </div>
      <div class="inst-card">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/5"><i class="fa-solid fa-microphone text-violet-200 text-lg"></i></div>
        <span class="text-[11.5px] font-semibold text-violet-200/80">Voice</span>
      </div>
      <div class="inst-card">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white/5"><i class="fa-solid fa-music text-violet-200 text-lg"></i></div>
        <span class="text-[11.5px] font-semibold text-violet-200/80">Sax</span>
      </div>
    </div>

    <div class="section-padding mt-7">
      <div class="text-[10px] font-bold tracking-[0.18em] uppercase text-violet-300/70 mb-3">Your level</div>
      <div class="space-y-2.5">
        <div class="level-row"><div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i class="fa-solid fa-seedling text-emerald-300 text-xs"></i></div><div><div class="text-[12.5px] font-bold">Beginner</div><div class="text-[10px] text-violet-300/50">Under 1 year</div></div></div>
        <div class="level-row sel"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,#A78BFA,#4F46E5);"><i class="fa-solid fa-chart-simple text-white text-xs"></i></div><div><div class="text-[12.5px] font-bold">Intermediate</div><div class="text-[10px] text-violet-300/60">1–5 years, reads music</div></div><i class="fa-solid fa-check ml-auto text-violet-200 text-xs"></i></div>
        <div class="level-row"><div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i class="fa-solid fa-star text-amber-300 text-xs"></i></div><div><div class="text-[12.5px] font-bold">Advanced</div><div class="text-[10px] text-violet-300/50">5+ years, exam prep</div></div></div>
      </div>
    </div>

    <div class="section-padding mt-8">
      <div class="rounded-2xl py-4 text-center" style="background:linear-gradient(135deg,#A78BFA,#4F46E5);box-shadow:0 14px 30px -8px rgba(139,92,246,0.55);">
        <span class="text-white font-bold text-[14.5px]">Continue</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
