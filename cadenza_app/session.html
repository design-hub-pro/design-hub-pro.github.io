<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadenza · Listening</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,600;0,700;0,800;0,900;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;font-family:'Inter',sans-serif;background:#0A0812;color:#F3EEFF;}
.font-serif{font-family:'Fraunces',serif;letter-spacing:-0.02em;}
.font-serif-italic{font-family:'Fraunces',serif;font-style:italic;font-weight:500;}
.font-mono{font-family:'JetBrains Mono',monospace;}
.screen{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(120% 45% at 50% 0%, rgba(139,92,246,0.28) 0%, transparent 55%), linear-gradient(180deg,#150F28 0%, #0A0812 100%);}
.island{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:24px;z-index:30;}
.status-bar{height:59px;padding:20px 28px 0;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:#F3EEFF;}
.section-padding{padding-left:28px;padding-right:28px;}
.glass{background:rgba(243,238,255,0.045);border:1px solid rgba(167,139,250,0.14);backdrop-filter:blur(20px);border-radius:24px;}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;background:#F3EEFF;border-radius:3px;opacity:0.7;z-index:30;}
.violet-grad{background:linear-gradient(135deg,#C4B5FD 0%, #8B5CF6 50%, #4F46E5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.emerald-grad{background:linear-gradient(135deg,#6EE7B7 0%, #10B981 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:700;}

.pulse-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(167,139,250,0.35);animation:pulseOut 2.6s ease-out infinite;}
.pulse-ring.r2{animation-delay:0.9s;}
.pulse-ring.r3{animation-delay:1.8s;}
@keyframes pulseOut{0%{transform:scale(0.7);opacity:0.9;}100%{transform:scale(1.55);opacity:0;}}
.mic-core{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#A78BFA 0%, #8B5CF6 55%, #4F46E5 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(139,92,246,0.10),0 24px 50px -14px rgba(139,92,246,0.65);}

.bars{display:flex;align-items:center;justify-content:center;gap:3px;height:38px;}
.bar{width:3px;border-radius:2px;background:linear-gradient(180deg,#C4B5FD,#7C3AED);animation:eq 1.1s ease-in-out infinite;}
@keyframes eq{0%,100%{height:20%;}50%{height:100%;}}

.cents-track{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,#F87171 0%, #FCD34D 20%, #34D399 42%, #34D399 58%, #FCD34D 80%, #F87171 100%);opacity:0.9;}
.cents-needle{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,0.8);}

.feed-chip{animation:riseIn 0.4s ease both;}
@keyframes riseIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="screen">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-signal text-xs"></i>
      <i class="fa-solid fa-wifi text-xs"></i>
      <i class="fa-solid fa-battery-full text-xs"></i>
    </div>
  </div>

  <!-- Header -->
  <div class="section-padding mt-2 flex items-center justify-between">
    <div class="w-9 h-9 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-down text-violet-100 text-xs"></i></div>
    <div class="text-center">
      <div class="flex items-center gap-1.5 justify-center">
        <div class="w-1.5 h-1.5 rounded-full bg-rose-400" style="animation:eq 1s ease-in-out infinite;"></div>
        <span class="text-[10px] font-bold tracking-[0.18em] uppercase text-rose-300">Listening</span>
      </div>
      <div class="font-serif text-[15px] font-bold mt-0.5">Clair de Lune</div>
    </div>
    <div class="w-9 h-9 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-ellipsis text-violet-100 text-xs"></i></div>
  </div>

  <!-- Mic visualizer -->
  <div class="section-padding mt-6 flex flex-col items-center relative" style="height:230px;">
    <div class="pulse-ring" style="width:150px;height:150px;"></div>
    <div class="pulse-ring r2" style="width:150px;height:150px;"></div>
    <div class="pulse-ring r3" style="width:150px;height:150px;"></div>
    <div class="mic-core"><i class="fa-solid fa-microphone text-white text-4xl"></i></div>
  </div>

  <!-- Detected pitch -->
  <div class="section-padding mt-2 text-center">
    <div class="text-[10px] font-bold tracking-[0.18em] uppercase text-violet-300/70">Note detected</div>
    <div class="flex items-end justify-center gap-2 mt-1">
      <span class="font-serif text-[46px] font-bold leading-none">F#4</span>
      <span class="font-mono text-[13px] text-emerald-300 mb-2">369.9 Hz</span>
    </div>
    <div class="mt-3 max-w-[220px] mx-auto">
      <div class="cents-track"><div class="cents-needle" style="left:54%;"></div></div>
      <div class="flex justify-between text-[9px] font-mono text-violet-300/50 mt-1"><span>−50¢</span><span class="text-emerald-300 font-bold">+3¢ · in tune</span><span>+50¢</span></div>
    </div>
  </div>

  <!-- Waveform strip -->
  <div class="section-padding mt-4">
    <div class="bars">
      <div class="bar" style="animation-delay:0s"></div><div class="bar" style="animation-delay:0.1s"></div><div class="bar" style="animation-delay:0.2s"></div>
      <div class="bar" style="animation-delay:0.3s"></div><div class="bar" style="animation-delay:0.4s"></div><div class="bar" style="animation-delay:0.15s"></div>
      <div class="bar" style="animation-delay:0.25s"></div><div class="bar" style="animation-delay:0.05s"></div><div class="bar" style="animation-delay:0.35s"></div>
      <div class="bar" style="animation-delay:0.12s"></div><div class="bar" style="animation-delay:0.22s"></div><div class="bar" style="animation-delay:0.32s"></div>
      <div class="bar" style="animation-delay:0.08s"></div><div class="bar" style="animation-delay:0.18s"></div><div class="bar" style="animation-delay:0.28s"></div>
      <div class="bar" style="animation-delay:0.38s"></div><div class="bar" style="animation-delay:0.02s"></div><div class="bar" style="animation-delay:0.42s"></div>
      <div class="bar" style="animation-delay:0.14s"></div><div class="bar" style="animation-delay:0.24s"></div>
    </div>
  </div>

  <!-- Tempo + Accuracy row -->
  <div class="section-padding mt-3 grid grid-cols-2 gap-2.5">
    <div class="glass p-3">
      <div class="text-[9.5px] font-bold tracking-[0.1em] uppercase text-violet-300/60">Tempo</div>
      <div class="flex items-baseline gap-1.5 mt-1">
        <span class="font-mono font-bold text-[20px]">96</span>
        <span class="text-[10px] text-violet-200/50">/ 92 bpm target</span>
      </div>
      <div class="text-[9.5px] text-amber-300 font-semibold mt-0.5"><i class="fa-solid fa-arrow-up text-[8px]"></i> rushing slightly</div>
    </div>
    <div class="glass p-3">
      <div class="text-[9.5px] font-bold tracking-[0.1em] uppercase text-violet-300/60">Live accuracy</div>
      <div class="flex items-baseline gap-1.5 mt-1">
        <span class="font-mono font-bold text-[20px] emerald-grad">93%</span>
        <span class="text-[10px] text-violet-200/50">notes on-pitch</span>
      </div>
      <div class="h-1.5 rounded-full bg-violet-100/10 overflow-hidden mt-1.5"><div class="h-full rounded-full" style="width:93%;background:linear-gradient(90deg,#6EE7B7,#10B981);"></div></div>
    </div>
  </div>

  <!-- Live feed -->
  <div class="section-padding mt-4 space-y-2">
    <div class="feed-chip flex items-center gap-2 text-[11.5px] text-violet-100/80"><i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i> Bar 8 — clean run, tone even</div>
    <div class="feed-chip flex items-center gap-2 text-[11.5px] text-amber-200/90" style="animation-delay:0.15s"><i class="fa-solid fa-triangle-exclamation text-amber-400 text-xs"></i> Bar 9 — rushed by ~35ms</div>
    <div class="feed-chip flex items-center gap-2 text-[11.5px] text-violet-100/80" style="animation-delay:0.3s"><i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i> Left-hand pedal timing steady</div>
  </div>

  <!-- Timer + controls -->
  <div class="absolute left-0 right-0 bottom-0 pb-10 pt-6 section-padding" style="background:linear-gradient(180deg,rgba(10,8,18,0) 0%, rgba(10,8,18,0.97) 40%);">
    <div class="flex items-center justify-between text-[11px] font-mono text-violet-200/60 mb-2">
      <span>12:04</span><span>25:00</span>
    </div>
    <div class="h-1.5 rounded-full bg-violet-100/10 overflow-hidden mb-6"><div class="h-full rounded-full" style="width:48%;background:linear-gradient(90deg,#A78BFA,#4F46E5);"></div></div>
    <div class="flex items-center justify-center gap-8">
      <div class="w-14 h-14 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-pause text-violet-100 text-lg"></i></div>
      <a href="feedback.html" style="pointer-events:none;">
      <div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FB7185,#E11D48);box-shadow:0 16px 34px -10px rgba(225,29,72,0.6);"><i class="fa-solid fa-stop text-white text-2xl"></i></div>
      </a>
      <div class="w-14 h-14 rounded-full glass flex items-center justify-center"><i class="fa-regular fa-bookmark text-violet-100 text-base"></i></div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
