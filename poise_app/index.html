<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poise · Calm for game day</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;background:#fff;font-family:'Inter',sans-serif;color:#161A33}
main{overflow-x:auto}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center;width:max-content;margin:0 auto}
.label{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8C8FA8;text-align:center;margin-bottom:18px}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2a2d31,#0b0c0d);box-shadow:0 50px 80px -30px rgba(40,36,120,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F4F4FA}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#8B7CF6,#4F46C8)"><i class="fa-solid fa-feather text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight">Poise</h1>
  <p class="mt-3 text-[19px] text-gray-500">Game-day calm plans built from your sport, your event and how your nerves show up.</p>
</header>
<main class="pb-28 px-6"><div class="phones">
  <div><p class="label">Athlete setup</p><div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="Athlete setup"></iframe></div></div></div>
  <div><p class="label">Today</p><div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="Today"></iframe></div></div></div>
  <div><p class="label">Nerve check-in</p><div class="phone-frame"><div class="phone-screen"><iframe src="checkin.html" scrolling="no" title="Nerve check-in"></iframe></div></div></div>
  <div><p class="label">Race plan</p><div class="phone-frame"><div class="phone-screen"><iframe src="plan.html" scrolling="no" title="Race plan"></iframe></div></div></div>
  <div><p class="label">Guided reset</p><div class="phone-frame"><div class="phone-screen"><iframe src="routine.html" scrolling="no" title="Guided reset"></iframe></div></div></div>
  <div><p class="label">Game-day mode</p><div class="phone-frame"><div class="phone-screen"><iframe src="gameday.html" scrolling="no" title="Game-day mode"></iframe></div></div></div>
  <div><p class="label">Race debrief</p><div class="phone-frame"><div class="phone-screen"><iframe src="debrief.html" scrolling="no" title="Race debrief"></iframe></div></div></div>
  <div><p class="label">Meet log</p><div class="phone-frame"><div class="phone-screen"><iframe src="log.html" scrolling="no" title="Meet log"></iframe></div></div></div>
  <div><p class="label">Nerve profile</p><div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="Nerve profile"></iframe></div></div></div>
</div></main>
</body></html>
