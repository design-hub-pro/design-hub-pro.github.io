<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>body{background:#0E1028;color:#fff}</style>
<title>Poise · Breathe</title></head><body>
<div class="screen" style="background:radial-gradient(120% 60% at 50% 32%,#2A2766 0%,#0E1028 70%)">
  <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>

  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-chevron-down"></i></div>
    <div class="text-center"><p class="text-[15px] font-bold">Physiological sigh</p><p class="text-[12px] text-white/50 num">Step 2 of 4 · T-25</p></div>
    <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-volume-high text-[14px]"></i></div>
  </div>

  <div class="flex justify-center mt-10">
    <div class="relative w-[300px] h-[300px] flex items-center justify-center">
      <div class="absolute inset-0 rounded-full" style="background:radial-gradient(circle,rgba(139,124,246,.0) 55%,rgba(139,124,246,.18) 70%,rgba(139,124,246,0) 72%)"></div>
      <div class="absolute inset-[22px] rounded-full border border-white/10"></div>
      <svg class="absolute inset-0" viewBox="0 0 300 300">
        <defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9AEFF"/><stop offset="1" stop-color="#5B5BD6"/></linearGradient></defs>
        <circle cx="150" cy="150" r="128" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
        <circle cx="150" cy="150" r="128" fill="none" stroke="url(#r)" stroke-width="6" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="300" transform="rotate(-90 150 150)"/>
        <circle cx="150" cy="22" r="7" fill="#fff" transform="rotate(134 150 150)"/>
      </svg>
      <div class="w-[190px] h-[190px] rounded-full grad flex flex-col items-center justify-center" style="box-shadow:0 0 80px 10px rgba(139,124,246,.45)">
        <p class="meta" style="color:rgba(255,255,255,.7)">Inhale again</p>
        <p class="text-[56px] font-extrabold leading-none mt-1 num">2</p>
        <p class="text-[12px] text-white/70 mt-1">short top-up</p>
      </div>
    </div>
  </div>

  <div class="px-c mt-8 flex justify-center gap-2">
    <span class="h-2 w-8 rounded-full bg-white"></span><span class="h-2 w-8 rounded-full bg-white"></span><span class="h-2 w-8 rounded-full bg-white"></span><span class="h-2 w-8 rounded-full bg-[#8B7CF6]"></span><span class="h-2 w-8 rounded-full bg-white/15"></span><span class="h-2 w-8 rounded-full bg-white/15"></span>
  </div>
  <p class="text-center text-[12px] text-white/50 mt-2 num">Cycle 4 of 6 · 1:48 left</p>

  <div class="mx-[28px] mt-7 rounded-[22px] bg-white/[.06] border border-white/10 p-5">
    <div class="flex items-center justify-between">
      <p class="meta" style="color:rgba(255,255,255,.5)">Heart rate</p>
      <span class="text-[13px] font-bold text-emerald-300 num"><i class="fa-solid fa-arrow-down text-[11px]"></i> 18 bpm</span>
    </div>
    <div class="flex items-end justify-between mt-2 num"><p class="text-[36px] font-extrabold leading-none">78<span class="text-[14px] text-white/40 ml-1">bpm</span></p><p class="text-[12px] text-white/40">target 70</p></div>
    <svg viewBox="0 0 340 70" class="w-full mt-3" height="70">
      <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B7CF6" stop-opacity=".45"/><stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="56" x2="340" y2="56" stroke="rgba(110,231,183,.5)" stroke-dasharray="4 5"/>
      <path d="M0,8 C30,10 50,14 70,20 S120,30 150,34 S200,42 230,44 L230,70 L0,70Z" fill="url(#a)"/>
      <path d="M0,8 C30,10 50,14 70,20 S120,30 150,34 S200,42 230,44" fill="none" stroke="#B9AEFF" stroke-width="2.5"/>
      <circle cx="230" cy="44" r="4.5" fill="#fff"/>
    </svg>
  </div>

  <div class="absolute bottom-10 inset-x-0 px-c flex items-center justify-center gap-6">
    <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-rotate-left"></i></div>
    <div class="w-20 h-20 rounded-full bg-white text-[#161A33] flex items-center justify-center text-[24px]"><i class="fa-solid fa-pause"></i></div>
    <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-forward-step"></i></div>
  </div>
</div>
</body></html>
