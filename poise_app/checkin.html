<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<title>Poise · Check-in</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>

  <div class="px-c pt-2 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <p class="text-[15px] font-bold">Nerve check-in</p>
    <span class="text-[13px] font-semibold text-gray-400 num">1 / 3</span>
  </div>

  <div class="mx-[28px] mt-5 rounded-[26px] ink-grad text-white p-5 relative overflow-hidden">
    <div class="flex items-center justify-between">
      <span class="chip" style="background:rgba(255,255,255,.1);color:#fff;border:0"><span class="dot bg-rose-400 animate-pulse"></span>Live · Watch</span>
      <span class="text-[12px] text-white/50 num">0:42 / 1:00</span>
    </div>
    <div class="flex items-end gap-6 mt-4 num">
      <div><p class="meta" style="color:rgba(255,255,255,.5)">Heart rate</p><p class="text-[44px] font-extrabold leading-none mt-1">96<span class="text-[16px] text-white/50 ml-1">bpm</span></p></div>
      <div class="pb-1"><p class="meta" style="color:rgba(255,255,255,.5)">HRV</p><p class="text-[22px] font-bold leading-none mt-1">41<span class="text-[13px] text-white/50 ml-1">ms</span> <span class="text-[13px] text-rose-300"><i class="fa-solid fa-arrow-down text-[10px]"></i> 27</span></p></div>
    </div>
    <svg viewBox="0 0 360 80" class="w-full mt-4" height="80">
      <defs><linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#8B7CF6" stop-opacity=".2"/><stop offset="1" stop-color="#A99CFF"/></linearGradient></defs>
      <polyline fill="none" stroke="url(#w)" stroke-width="2.5" stroke-linejoin="round" points="0,50 20,50 26,46 32,50 44,50 50,14 56,70 62,44 70,50 92,50 98,46 104,50 116,50 122,10 128,72 134,44 142,50 164,50 170,46 176,50 188,50 194,12 200,70 206,44 214,50 236,50 242,46 248,50 260,50 266,8 272,74 278,44 286,50 308,50 314,46 320,50 332,50 338,12"/>
      <circle cx="338" cy="12" r="4" fill="#fff"/>
    </svg>
  </div>

  <div class="px-c mt-6">
    <div class="flex items-center justify-between"><p class="meta">Activation</p><span class="text-[13px] font-bold text-amber-600">Above your zone</span></div>
    <div class="relative mt-4">
      <div class="h-3 rounded-full" style="background:linear-gradient(90deg,#9CC9F5,#8B7CF6 45%,#F6B04B 75%,#F06A7A)"></div>
      <div class="absolute top-[-6px] h-6 rounded-md border-2 border-[#161A33]" style="left:38%;width:22%"></div>
      <div class="absolute top-[-9px] w-1.5 h-[30px] rounded-full bg-[#161A33]" style="left:74%"></div>
    </div>
    <div class="flex justify-between text-[12px] text-gray-400 font-semibold mt-3"><span>Flat</span><span class="text-[#161A33]">Your race zone</span><span>Wired</span></div>
  </div>

  <div class="px-c mt-6">
    <p class="meta">What do you feel</p>
    <div class="flex flex-wrap gap-2 mt-3">
      <span class="chip on"><i class="fa-solid fa-check text-[10px]"></i>Tight chest</span>
      <span class="chip on"><i class="fa-solid fa-check text-[10px]"></i>Butterflies</span>
      <span class="chip">Shaky legs</span><span class="chip">Yawning</span>
      <span class="chip on"><i class="fa-solid fa-check text-[10px]"></i>"What if I DQ"</span>
      <span class="chip">Can't focus</span><span class="chip">Excited</span>
    </div>
  </div>

  <div class="mx-[28px] mt-6 card p-4 flex items-center gap-4">
    <div class="flex-1">
      <p class="text-[15px] font-bold">Body vs mind</p>
      <div class="flex h-2.5 rounded-full overflow-hidden mt-2.5"><span class="bg-[#5B5BD6]" style="width:64%"></span><span class="bg-amber-400" style="width:36%"></span></div>
      <div class="flex justify-between text-[12px] text-gray-500 mt-2 num"><span><span class="dot bg-[#5B5BD6] mr-1"></span>Body 64%</span><span><span class="dot bg-amber-400 mr-1"></span>Worry 36%</span></div>
    </div>
  </div>

  <div class="px-c mt-6"><div class="btn grad" style="box-shadow:0 14px 28px -12px rgba(79,70,200,.7)"><i class="fa-solid fa-wand-magic-sparkles"></i>Get my plan</div></div>
</div>
</div>
</body></html>
