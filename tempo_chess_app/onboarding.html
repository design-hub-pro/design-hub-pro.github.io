<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempo · Baseline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
:root{
--ink:#1C1917;--ink2:#44403C;--muted:#8C837B;--faint:#B4ABA2;--border:#EDE7DF;--bg:#FAF6F1;--card:#fff;
--acc:#C2751F;--acc2:#E4A35A;--good:#2F8F5B;--alert:#C0392B;--warn:#C2410C;
}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.sb{height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 7px;position:relative;flex-shrink:0}
.sb .t{font-size:15px;font-weight:650;letter-spacing:-.2px}
.sb .r{display:flex;gap:6px;align-items:center;font-size:13px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px}
.body{height:calc(100% - 59px);overflow-y:auto}
.pad{padding-left:28px;padding-right:28px}
.meta{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:650}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:22px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(28,25,23,.04),0 10px 26px -14px rgba(28,25,23,.18)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sech a{font-size:13px;font-weight:600;color:var(--acc);text-decoration:none;display:flex;align-items:center;gap:5px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:92px;background:rgba(255,253,251,.93);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:13px 14px 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#BCB3AA;font-size:10px;font-weight:650;letter-spacing:.2px}
.tab i{font-size:18px}
.tab.on{color:var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:58px;border-radius:18px;background:linear-gradient(135deg,#E0964A,#A85A18);color:#fff;font-size:16px;font-weight:650;box-shadow:0 10px 22px -10px rgba(168,90,24,.7)}
.chip{height:34px;padding:0 15px;border-radius:11px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.hr{height:1px;background:var(--border)}
.sq{width:15px;height:15px}
.ladder{display:flex;flex-direction:column-reverse;gap:4px}
.rung{height:11px;border-radius:3px;background:#F0EAE2}
.rung.on{background:linear-gradient(90deg,#E4A35A,#C2751F)}
.field{display:flex;align-items:center;justify-content:space-between;padding:15px 18px}
</style></head><body>
<div class="screen">
  <div class="sb"><div class="t num">9:41</div><div class="island"></div>
    <div class="r"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

  <div class="body">
    <div class="pad" style="padding-top:6px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="meta">Step 1 of 1</div>
        <div class="meta" style="color:var(--acc)">Baseline</div>
      </div>
      <div style="font-size:34px;font-weight:800;letter-spacing:-1.2px;margin-top:10px;line-height:1.05">Set the baseline</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <div class="chip"><span class="dot" style="background:var(--acc)"></span>3 sessions</div>
        <div class="chip">6 min each</div>
        <div class="chip">Mon Wed Fri</div>
      </div>
    </div>

    <div class="pad" style="margin-top:22px">
      <div class="card" style="overflow:hidden">
        <div style="position:relative;height:158px">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1787436162423-image-1.png" style="width:100%;height:100%;object-fit:cover">
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,25,23,0) 30%,rgba(28,25,23,.82))"></div>
          <div style="position:absolute;left:20px;bottom:16px;color:#fff">
            <div class="meta" style="color:rgba(255,255,255,.72)">Calibration set</div>
            <div style="font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.4px">12 positions · 2 move tactics</div>
          </div>
        </div>
        <div class="field"><div style="font-size:16px;font-weight:600">Age</div><div class="num" style="font-size:16px;font-weight:700">74</div></div>
        <div class="hr" style="margin:0 18px"></div>
        <div class="field"><div style="font-size:16px;font-weight:600">MoCA on file</div><div class="num" style="font-size:16px;font-weight:700">22<span style="color:var(--muted);font-weight:600">/30</span></div></div>
        <div class="hr" style="margin:0 18px"></div>
        <div class="field"><div style="font-size:16px;font-weight:600">Chess history</div>
          <div style="display:flex;gap:6px">
            <span class="chip" style="height:30px;padding:0 11px;font-size:12px">Never</span>
            <span class="chip on" style="height:30px;padding:0 11px;font-size:12px">Casual</span>
            <span class="chip" style="height:30px;padding:0 11px;font-size:12px">Club</span>
          </div>
        </div>
      </div>
    </div>

    <div class="pad" style="margin-top:24px">
      <div class="sech"><div class="meta">Starting depth</div><div class="meta num" style="color:var(--ink)">3 / 8</div></div>
      <div class="card" style="padding:18px;display:flex;gap:20px;align-items:center">
        <div style="display:grid;grid-template-columns:repeat(8,15px);grid-template-rows:repeat(8,15px);border-radius:7px;overflow:hidden;flex-shrink:0">
          <script>
            document.write((function(){var s='';for(var r=0;r<8;r++){for(var c=0;c<8;c++){
              var light=(r+c)%2===0; var bg=light?'#F2E9DC':'#C8A87C'; var mark='';
              if((r===3&&c===4)||(r===5&&c===2)){bg='#C2751F';}
              if(r===2&&c===6){bg='#E4A35A';}
              s+='<div class="sq" style="background:'+bg+'"></div>';}}return s;})());
          </script>
        </div>
        <div style="flex:1">
          <div class="ladder">
            <div class="rung on"></div><div class="rung on"></div><div class="rung on"></div>
            <div class="rung"></div><div class="rung"></div><div class="rung"></div><div class="rung"></div><div class="rung"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:10px">
            <div class="meta" style="font-size:11px;letter-spacing:1.4px">Depth</div>
            <div class="num" style="font-size:13px;font-weight:700;color:var(--acc)">Adaptive</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pad" style="margin-top:22px">
      <div class="card" style="padding:16px 18px;display:flex;align-items:center;gap:13px">
        <div style="width:38px;height:38px;border-radius:11px;background:#F6EFE6;display:flex;align-items:center;justify-content:center;color:var(--acc)"><i class="fa-solid fa-user-doctor"></i></div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:650">Dr. Halvorsen · Neurology</div>
          <div class="meta" style="letter-spacing:.4px;text-transform:none;font-size:13px;font-weight:500;margin-top:2px">Reports shared weekly</div>
        </div>
        <span class="dot" style="background:var(--good)"></span>
      </div>
    </div>

    <div class="pad" style="margin-top:26px;padding-bottom:40px">
      <div class="btn">Begin session 1 <i class="fa-solid fa-arrow-right" style="font-size:14px"></i></div>
    </div>
  </div>
</div></body></html>
