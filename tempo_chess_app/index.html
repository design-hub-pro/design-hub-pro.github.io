<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:#fff;color:#1C1917;-webkit-font-smoothing:antialiased}
.wrap{max-width:1520px;margin:0 auto;padding:80px 40px 120px}
.tag{display:inline-block;padding:7px 14px;border-radius:10px;background:#F7F3EE;border:1px solid #EDE7DF;font-size:13px;font-weight:600;color:#57534E}
.grid{display:grid;grid-template-columns:repeat(3,460px);gap:56px 40px;justify-content:center;margin-top:76px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#1C1917;box-shadow:0 40px 80px -40px rgba(28,25,23,.5)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block}
.cap{margin-top:18px;display:flex;align-items:baseline;gap:10px}
.cap b{font-size:17px;font-weight:700;letter-spacing:-.3px}
.cap span{font-size:13px;font-weight:600;color:#A8A29E;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:22px">
    <div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#E0964A,#A85A18);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 32px -14px rgba(168,90,24,.8)">
      <span style="font-size:46px;color:#fff;line-height:1">&#9822;</span>
    </div>
    <div>
      <div style="font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1">Tempo</div>
      <div style="font-size:18px;color:#57534E;font-weight:500;margin-top:8px">Chess sessions that measure cognition and rebuild it, one move at a time.</div>
    </div>
  </div>
  <div style="display:flex;gap:9px;margin-top:26px">
    <span class="tag">Dementia care</span><span class="tag">Cognitive assessment</span><span class="tag">Rehab</span><span class="tag">Chess</span>
  </div>

  <div class="grid">
    <div><div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div><div class="cap"><b>Baseline setup</b><span>01</span></div></div>
    <div><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="cap"><b>Today</b><span>02</span></div></div>
    <div><div class="frame"><iframe src="play.html" scrolling="no"></iframe></div><div class="cap"><b>Live session</b><span>03</span></div></div>
    <div><div class="frame"><iframe src="result.html" scrolling="no"></iframe></div><div class="cap"><b>Session report</b><span>04</span></div></div>
    <div><div class="frame"><iframe src="trends.html" scrolling="no"></iframe></div><div class="cap"><b>Trends</b><span>05</span></div></div>
    <div><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="cap"><b>Profile</b><span>06</span></div></div>
  </div>
</div></body></html>
