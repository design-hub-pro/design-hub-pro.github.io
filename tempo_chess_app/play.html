<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempo · Session</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--acc:#E4A35A;--acc2:#C2751F;--good:#4CB27A;--alert:#E0705F}
html,body{height:100%}
body{font-family:Inter,-apple-system,sans-serif;background:#16130F;color:#F5F1EC;-webkit-font-smoothing:antialiased}
.screen{width:100%;height:100%;position:relative;overflow:hidden;background:#16130F}
.sb{height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 7px;position:relative}
.sb .t{font-size:15px;font-weight:650}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px}
.body{height:calc(100% - 59px);overflow-y:auto;padding-bottom:34px}
.pad{padding-left:28px;padding-right:28px}
.meta{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#8D8378;font-weight:650}
.num{font-variant-numeric:tabular-nums}
.card{background:#221D18;border-radius:20px;border:1px solid rgba(255,255,255,.07)}
.sq{width:47.5px;height:47.5px;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;position:relative}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.lat{width:9px;border-radius:3px;background:#3A322A}
</style></head><body>
<div class="screen">
  <div class="sb"><div class="t num">9:41</div><div class="island"></div>
    <div style="display:flex;gap:6px;font-size:13px"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div></div>

  <div class="body">
    <div class="pad" style="padding-top:6px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="display:flex;align-items:center;gap:7px">
          <span class="dot pulse" style="background:#E0705F"></span>
          <span class="meta" style="color:#E0705F">Recording</span>
        </div>
        <div class="num" style="font-size:34px;font-weight:800;letter-spacing:-1.4px;margin-top:5px">6:41</div>
      </div>
      <div style="text-align:right">
        <div class="meta">Move</div>
        <div class="num" style="font-size:34px;font-weight:800;letter-spacing:-1.4px;margin-top:5px">14</div>
      </div>
      <div style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#C9C0B6"><i class="fa-solid fa-xmark"></i></div>
    </div>

    <div class="pad" style="margin-top:18px">
      <div style="display:grid;grid-template-columns:repeat(8,47.5px);border-radius:14px;overflow:hidden;box-shadow:0 22px 40px -20px rgba(0,0,0,.9)" id="bd"></div>
    </div>

    <div class="pad" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:19px">&#9822;</span>
        <span class="num" style="font-size:15px;font-weight:700">Nf5</span>
        <span class="num" style="font-size:13px;color:#8D8378">played 4.2s</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px">
        <span class="meta" style="font-size:11px;letter-spacing:1.2px">Your turn</span>
        <span class="num" style="font-size:15px;font-weight:750;color:var(--acc)">0:09</span>
      </div>
    </div>

    <div class="pad" style="margin-top:20px">
      <div class="card" style="padding:18px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
          <div class="meta">Move latency</div>
          <div class="num" style="font-size:13px;font-weight:650;color:#C9C0B6">median 4.2s</div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:5px;height:56px" id="lat"></div>
        <div style="display:flex;justify-content:space-between;margin-top:9px">
          <div class="num" style="font-size:11px;color:#6F665C">m1</div>
          <div class="num" style="font-size:11px;color:#6F665C">m7</div>
          <div class="num" style="font-size:11px;color:var(--acc)">m14</div>
        </div>
      </div>
    </div>

    <div class="pad" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div class="card" style="padding:14px 15px">
        <div class="meta" style="font-size:10px;letter-spacing:1.2px">Hesitations</div>
        <div class="num" style="font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-1px">2</div>
      </div>
      <div class="card" style="padding:14px 15px">
        <div class="meta" style="font-size:10px;letter-spacing:1.2px">Retracted</div>
        <div class="num" style="font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-1px;color:var(--acc)">1</div>
      </div>
      <div class="card" style="padding:14px 15px">
        <div class="meta" style="font-size:10px;letter-spacing:1.2px">Legal rate</div>
        <div class="num" style="font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-1px">93<span style="font-size:15px">%</span></div>
      </div>
    </div>

    <div class="pad" style="margin-top:18px;display:flex;gap:11px">
      <div style="flex:1;height:56px;border-radius:17px;border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:650;color:#E8E1D9">
        <i class="fa-regular fa-lightbulb"></i>Cue <span class="num" style="color:#8D8378">2 left</span></div>
      <div style="flex:1;height:56px;border-radius:17px;background:linear-gradient(135deg,#E0964A,#A85A18);display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:700;color:#fff">
        <i class="fa-solid fa-flag-checkered"></i>End session</div>
    </div>
  </div>
</div>
<script>
var P=[
 ["r","","","","","r","k",""],
 ["p","p","","","","p","p","p"],
 ["","","n","b","","n","",""],
 ["","","","p","","","",""],
 ["","","","P","","","",""],
 ["","","N","","","N","",""],
 ["P","P","","","","P","P","P"],
 ["R","","B","Q","","R","K",""]];
var G={r:"♜",n:"♞",b:"♝",q:"♛",k:"♚",p:"♟",
       R:"♜",N:"♞",B:"♝",Q:"♛",K:"♚",P:"♟"};
var bd=document.getElementById('bd'),h='';
for(var r=0;r<8;r++)for(var c=0;c<8;c++){
  var light=(r+c)%2===0, bg=light?'#E9DAC1':'#A9865C';
  if((r===5&&c===5)||(r===3&&c===5)) bg=light?'#E8C27E':'#C79B52';
  var pc=P[r][c], col=pc&&pc===pc.toLowerCase()?'#20180F':'#FFFDF8';
  var sh=pc&&pc===pc.toUpperCase()?'-webkit-text-stroke:1.1px #2A2119;text-shadow:0 1px 2px rgba(0,0,0,.3)':'text-shadow:0 1px 1px rgba(255,255,255,.18)';
  var ring=(r===4&&c===6)?'<span style="position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(194,117,31,.85);box-shadow:0 0 0 4px rgba(228,163,90,.28)"></span>':'';
  h+='<div class="sq" style="background:'+bg+'">'+ring+'<span style="color:'+col+';'+sh+'">'+(pc?G[pc]:'')+'</span></div>';
}
bd.innerHTML=h;
var L=[22,30,26,41,19,34,28,52,24,31,47,38,29,44],lat=document.getElementById('lat'),s='';
for(var i=0;i<L.length;i++){
  var last=i===L.length-1, hi=L[i]>44;
  var bgc=last?'linear-gradient(180deg,#E4A35A,#C2751F)':(hi?'#8A6A42':'#3A322A');
  s+='<div class="lat'+(last?' pulse':'')+'" style="height:'+L[i]+'px;background:'+bgc+'"></div>';
}
lat.innerHTML=s;
</script>
</body></html>
