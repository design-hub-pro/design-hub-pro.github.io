<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平行心灵 - 智能匹配</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  html, body {
    scrollbar-width:none;
    font-family:'Inter', sans-serif;
    background:#0F0A2E;
    width:100%; height:100%;
    overflow-x:hidden; overflow-y:auto;
    color:#fff;
  }
  body::before {
    content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(124,58,237,0.55) 0%, transparent 45%),
      radial-gradient(circle at 80% 60%, rgba(6,182,212,0.4) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(236,72,153,0.3) 0%, transparent 50%);
    pointer-events:none;
  }
  .display { font-family:'Space Grotesk', sans-serif; letter-spacing:-0.5px; }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px 0 28px; height:59px;
    position:sticky; top:0; z-index:100;
    color:#fff;
  }
  .time { font-size:16px; font-weight:600; }
  .dynamic-island {
    width:120px; height:34px; background:#000; border-radius:20px;
    position:absolute; left:50%; transform:translateX(-50%); top:10px;
  }
  .icons { display:flex; gap:6px; align-items:center; font-size:14px; }
  .battery { width:27px; height:12px; border:1.5px solid #fff; border-radius:3px; padding:1.5px; position:relative; }
  .battery::after { content:''; position:absolute; right:-4px; top:3px; width:2px; height:6px; background:#fff; border-radius:0 1px 1px 0; }
  .battery-fill { width:78%; height:100%; background:#fff; border-radius:1.5px; }

  .content { padding:0 28px 120px 28px; position:relative; z-index:2; }

  .nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0 20px 0;
  }
  .nav-btn {
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px;
  }
  .nav-title { font-size:16px; font-weight:600; }

  .hero-title {
    font-size:30px; font-weight:700; line-height:1.1;
    margin-bottom:6px;
  }
  .hero-title b { background:linear-gradient(135deg,#F9A8D4,#67E8F9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-sub { font-size:14px; color:rgba(255,255,255,0.6); margin-bottom:24px; }

  /* Matching orb */
  .orb-wrap {
    display:flex; align-items:center; justify-content:center;
    margin:10px 0 28px 0; position:relative; height:260px;
  }
  .orb {
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #C4B5FD 0%, #7C3AED 40%, #4C1D95 100%);
    box-shadow:
      0 0 100px rgba(124,58,237,0.6),
      0 0 60px rgba(6,182,212,0.35),
      inset -20px -20px 60px rgba(0,0,0,0.3),
      inset 20px 20px 50px rgba(255,255,255,0.15);
    position:relative;
    animation:breathe 3.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.06); }
  }
  .orb::after {
    content:''; position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6) 0%, transparent 40%);
  }
  .ring {
    position:absolute; border-radius:50%;
    border:1px solid rgba(255,255,255,0.15);
    animation:pulse 3s ease-out infinite;
  }
  .ring.r1 { width:260px; height:260px; animation-delay:0s; }
  .ring.r2 { width:300px; height:300px; animation-delay:0.8s; }
  .ring.r3 { width:340px; height:340px; animation-delay:1.6s; }
  @keyframes pulse {
    0% { opacity:0.8; transform:scale(0.85); }
    100% { opacity:0; transform:scale(1.1); }
  }
  .orb-flag {
    position:absolute; font-size:22px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .f1 { top:8px; left:30px; }
  .f2 { top:30px; right:18px; }
  .f3 { bottom:50px; left:-4px; }
  .f4 { bottom:20px; right:30px; }

  /* Criteria */
  .criteria-label {
    font-size:11px; color:rgba(255,255,255,0.55);
    text-transform:uppercase; letter-spacing:1.4px; font-weight:600;
    margin-bottom:10px;
  }
  .chip-row {
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;
  }
  .chip {
    padding:10px 14px; border-radius:24px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    font-size:12px; font-weight:600; color:rgba(255,255,255,0.85);
    display:flex; align-items:center; gap:6px;
  }
  .chip.active {
    background:linear-gradient(135deg,#7C3AED,#EC4899);
    border-color:transparent;
    box-shadow:0 8px 22px rgba(124,58,237,0.4);
    color:#fff;
  }
  .chip i { font-size:11px; }

  /* Found card */
  .found-card {
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:28px; padding:18px;
    margin-top:10px;
  }
  .found-head {
    display:flex; align-items:center; gap:12px;
  }
  .found-av {
    width:54px; height:54px; border-radius:50%;
    background:url('https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=160&h=160&fit=crop') center/cover;
    border:2px solid rgba(255,255,255,0.25);
    position:relative;
  }
  .found-av::after {
    content:''; position:absolute; bottom:0; right:0;
    width:14px; height:14px; border-radius:50%;
    background:#10B981; border:2px solid #1E1B4B;
  }
  .found-info { flex:1; }
  .found-name { font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .found-name .verified { color:#67E8F9; font-size:12px; }
  .found-meta { font-size:11px; color:rgba(255,255,255,0.6); margin-top:2px; }
  .match-score {
    padding:6px 10px; border-radius:14px;
    background:linear-gradient(135deg,#10B981,#059669);
    font-size:12px; font-weight:700;
  }
  .found-tags {
    display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;
  }
  .found-tag {
    font-size:10px; padding:5px 10px; border-radius:10px;
    background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.85);
    font-weight:500;
  }

  .connect-btn {
    width:100%; margin-top:20px; padding:16px;
    border-radius:20px; border:none;
    background:linear-gradient(135deg,#F472B6 0%, #7C3AED 50%, #06B6D4 100%);
    color:#fff; font-weight:700; font-size:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 14px 34px rgba(124,58,237,0.5);
  }

  /* Tab Bar */
  .tab-bar {
    position:absolute; bottom:0; left:0; right:0;
    height:90px; background:rgba(15,10,46,0.85);
    backdrop-filter:blur(20px);
    display:flex; justify-content:space-around; align-items:flex-start;
    padding-top:12px; border-top:0.5px solid rgba(255,255,255,0.08);
  }
  .tab-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; font-weight:600; color:rgba(255,255,255,0.4);
  }
  .tab-item.active { color:#fff; }
  .tab-item i { font-size:20px; }
  .tab-dot { width:4px; height:4px; border-radius:50%; background:#A78BFA; }
  .tab-center {
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#7C3AED,#06B6D4);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:22px; margin-top:-18px;
    box-shadow:0 10px 26px rgba(124,58,237,0.5);
  }
  .home-indicator {
    width:134px; height:5px; background:#fff; border-radius:3px;
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="content">
    <div class="nav">
      <div class="nav-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="nav-title">智能匹配</div>
      <div class="nav-btn"><i class="fas fa-sliders"></i></div>
    </div>

    <div class="hero-title display">正在寻找<br><b>你的平行心灵。</b></div>
    <div class="hero-sub">AI 跨 47 国匹配 · 约 8 秒</div>

    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="orb"></div>
      <div class="orb-flag f1">🇯🇵</div>
      <div class="orb-flag f2">🇧🇷</div>
      <div class="orb-flag f3">🇫🇷</div>
      <div class="orb-flag f4">🇰🇪</div>
    </div>

    <div class="criteria-label">匹配维度</div>
    <div class="chip-row">
      <div class="chip active"><i class="fas fa-brain"></i> 焦虑</div>
      <div class="chip active"><i class="fas fa-school"></i> 学业压力</div>
      <div class="chip"><i class="fas fa-moon"></i> 睡眠</div>
      <div class="chip active"><i class="fas fa-language"></i> 实时翻译</div>
      <div class="chip"><i class="fas fa-venus-mars"></i> 同龄</div>
    </div>

    <div class="found-card">
      <div class="found-head">
        <div class="found-av"></div>
        <div class="found-info">
          <div class="found-name">理子，16岁 <i class="fas fa-circle-check verified"></i></div>
          <div class="found-meta">🇯🇵 东京 · 认证同伴 L2 · 在线</div>
        </div>
        <div class="match-score">94%</div>
      </div>
      <div class="found-tags">
        <div class="found-tag">💭 考试焦虑</div>
        <div class="found-tag">🌙 睡眠困扰</div>
        <div class="found-tag">🎨 艺术疗愈</div>
      </div>
    </div>

    <button class="connect-btn">
      <i class="fas fa-comment-dots"></i> 开始安全聊天
    </button>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fas fa-comments"></i><span>聊天</span></div>
    <div class="tab-center"><i class="fas fa-bolt"></i></div>
    <div class="tab-item"><i class="fas fa-earth-americas"></i><span>全球</span></div>
    <div class="tab-item"><i class="fas fa-user"></i><span>我的</span></div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
