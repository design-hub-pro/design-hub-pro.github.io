<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平行心灵 - 青少年同伴心理健康</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body {
    font-family:'Inter', -apple-system, sans-serif;
    background:#ffffff;
    color:#0F172A;
    min-height:100vh;
  }
  .hero {
    text-align:center;
    padding:80px 40px 50px;
    max-width:1000px;
    margin:0 auto;
  }
  .app-icon {
    width:92px; height:92px;
    border-radius:24px;
    background:linear-gradient(145deg,#7C3AED,#6D28D9 50%,#06B6D4);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 26px;
    box-shadow:0 18px 46px rgba(124,58,237,0.4);
    font-size:44px;
  }
  .hero h1 {
    font-size:60px;
    font-weight:800;
    letter-spacing:-2px;
    line-height:1.02;
    margin-bottom:20px;
    font-family:'Space Grotesk', sans-serif;
  }
  .hero h1 .accent {
    background:linear-gradient(135deg,#7C3AED 0%,#EC4899 50%,#06B6D4 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero p {
    font-size:18px;
    color:#64748B;
    max-width:640px;
    margin:0 auto;
    line-height:1.6;
  }
  .feature-pills {
    display:flex; justify-content:center;
    gap:10px; flex-wrap:wrap;
    margin-top:30px;
  }
  .pill {
    display:flex; align-items:center; gap:8px;
    padding:10px 20px;
    border-radius:50px;
    font-size:14px; font-weight:500;
    background:#F5F3FF; color:#6D28D9;
  }
  .pill i { color:#7C3AED; }

  .phones-section {
    padding:40px 40px 80px;
    max-width:1600px;
    margin:0 auto;
  }
  .phones-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:40px;
    justify-items:center;
  }
  .phone-wrapper {
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .phone-frame {
    width:460px; height:980px;
    border-radius:62px;
    background:#000;
    padding:12px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.1),
      0 22px 66px rgba(124,58,237,0.18),
      0 4px 20px rgba(0,0,0,0.08);
    position:relative;
  }
  .phone-screen {
    width:100%; height:100%;
    border-radius:52px;
    overflow:hidden;
    background:#FAF7FF;
  }
  .phone-screen iframe {
    width:100%; height:100%;
    border:none;
    border-radius:52px;
  }
  .screen-label { font-size:15px; font-weight:600; letter-spacing:-0.2px; }
  .screen-sublabel { font-size:13px; color:#94A3B8; margin-top:2px; }

  @media (max-width:1500px) {
    .phones-grid { gap:30px; }
    .phone-frame { width:420px; height:896px; border-radius:56px; padding:11px; }
    .phone-screen, .phone-screen iframe { border-radius:47px; }
  }
  @media (max-width:1380px) {
    .phones-grid { gap:24px; }
    .phone-frame { width:380px; height:812px; border-radius:52px; padding:10px; }
    .phone-screen, .phone-screen iframe { border-radius:44px; }
  }
  @media (max-width:1200px) {
    .phones-grid { grid-template-columns:repeat(2,1fr); }
    .phone-frame { width:420px; height:896px; border-radius:56px; }
  }
  @media (max-width:900px) {
    .phones-grid { grid-template-columns:1fr; }
    .hero h1 { font-size:42px; }
    .hero p { font-size:16px; }
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="app-icon">🦋</div>
    <h1>你从来不是<br><span class="accent">一个人。</span></h1>
    <p>平行心灵 为全球青少年匹配有共同经历的同龄人 — 安全、私密、实时翻译，由政府信赖的 AI 安全守护保驾护航。</p>
    <div class="feature-pills">
      <div class="pill"><i class="fas fa-bolt"></i> 智能同伴匹配</div>
      <div class="pill"><i class="fas fa-shield-halved"></i> AI 安全守护</div>
      <div class="pill"><i class="fas fa-language"></i> 实时翻译</div>
      <div class="pill"><i class="fas fa-earth-americas"></i> 47 国覆盖</div>
      <div class="pill"><i class="fas fa-landmark"></i> 政府认证</div>
    </div>
  </div>

  <div class="phones-section">
    <div class="phones-grid">

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">每日打卡</div>
          <div class="screen-sublabel">心情脉搏、快速匹配、幸福指数</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="match.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">智能匹配</div>
          <div class="screen-sublabel">跨国 AI 同伴智能匹配</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="chat.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">安全聊天</div>
          <div class="screen-sublabel">端到端加密 + 实时翻译 + AI 共情</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="safety.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">安全守护</div>
          <div class="screen-sublabel">隐私控制与危机救援</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="impact.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">全球影响力</div>
          <div class="screen-sublabel">匿名政策数据平台</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="calm.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">一起平静</div>
          <div class="screen-sublabel">与同伴同步呼吸冥想</div>
        </div>
      </div>

      <div class="phone-wrapper">
        <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no"></iframe></div></div>
        <div style="text-align:center;">
          <div class="screen-label">我的档案</div>
          <div class="screen-sublabel">同伴认证、徽章与历程</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
