<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平行心灵 - 一起平静</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; }
  html, body {
    scrollbar-width:none;
    font-family:'Inter', sans-serif;
    background:#0F1E3A;
    width:100%; height:100%;
    overflow-x:hidden; overflow-y:auto;
    color:#fff;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(14,165,233,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 80%, rgba(124,58,237,0.35) 0%, transparent 60%);
    pointer-events:none;
  }
  .display { font-family:'Space Grotesk', sans-serif; letter-spacing:-0.5px; }

  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px 0 28px; height:59px;
    color:#fff;
    position:sticky; top:0; z-index:100;
  }
  .time { font-size:16px; font-weight:600; }
  .dynamic-island {
    width:120px; height:34px; background:#000; border-radius:20px;
    position:absolute; left:50%; transform:translateX(-50%); top:10px;
  }
  .icons { display:flex; gap:6px; align-items:center; font-size:14px; }
  .battery { width:27px; height:12px; border:1.5px solid #fff; border-radius:3px; padding:1.5px; position:relative; }
  .battery::after { content:''; position:absolute; right:-4px; top:3px; width:2px; height:6px; background:#fff; border-radius:0 1px 1px 0; }
  .battery-fill { width:80%; height:100%; background:#fff; border-radius:1.5px; }

  .content {
    padding:0 28px 120px 28px; position:relative; z-index:2;
    display:flex; flex-direction:column; height:calc(100% - 59px);
  }

  .nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0 20px 0;
  }
  .nav-btn {
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px;
  }
  .nav-title { font-size:13px; color:rgba(255,255,255,0.7); font-weight:600; }

  .intro { text-align:center; margin-top:6px; }
  .intro-tag {
    display:inline-block; padding:6px 14px; border-radius:14px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.15);
    font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:1px;
    color:#A7F3D0;
  }
  .intro-title { font-size:28px; font-weight:700; margin-top:12px; line-height:1.15; }
  .intro-sub { font-size:13px; color:rgba(255,255,255,0.6); margin-top:6px; }

  /* Breath orb */
  .breath-wrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; min-height:320px;
  }
  .breath-orb {
    width:240px; height:240px; border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(167,243,208,0.5) 0%, rgba(6,182,212,0.35) 40%, rgba(124,58,237,0.3) 100%);
    backdrop-filter:blur(14px);
    border:2px solid rgba(255,255,255,0.25);
    box-shadow:
      0 0 100px rgba(6,182,212,0.5),
      0 0 60px rgba(167,243,208,0.3),
      inset 0 0 60px rgba(255,255,255,0.15);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform:scale(0.85); }
    50% { transform:scale(1.05); }
  }
  .breath-text {
    font-size:26px; font-weight:700; font-family:'Space Grotesk', sans-serif;
    letter-spacing:-0.5px;
  }
  .breath-count {
    font-size:54px; font-weight:800;
    background:linear-gradient(135deg,#A7F3D0,#67E8F9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1;
    margin-top:4px;
  }
  .ring-outer {
    position:absolute;
    width:320px; height:320px; border-radius:50%;
    border:1px dashed rgba(255,255,255,0.15);
  }

  /* Progress and controls */
  .session-info {
    text-align:center; margin-bottom:12px;
  }
  .session-name { font-size:15px; font-weight:700; }
  .session-meta { font-size:11px; color:rgba(255,255,255,0.55); margin-top:2px; }

  .progress {
    height:5px; background:rgba(255,255,255,0.12);
    border-radius:10px; overflow:hidden; margin-bottom:8px;
  }
  .progress span {
    display:block; height:100%;
    background:linear-gradient(90deg,#A7F3D0,#67E8F9,#7C3AED);
    border-radius:10px; width:42%;
  }
  .time-row {
    display:flex; justify-content:space-between;
    font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:20px;
  }

  .controls {
    display:flex; align-items:center; justify-content:center; gap:24px;
    margin-bottom:20px;
  }
  .ctrl-btn {
    width:54px; height:54px; border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:18px;
  }
  .ctrl-play {
    width:74px; height:74px;
    background:linear-gradient(135deg,#7C3AED,#06B6D4);
    border:none;
    box-shadow:0 14px 34px rgba(124,58,237,0.5);
    font-size:24px;
  }

  /* Peer together */
  .peer-together {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(14px);
    border-radius:22px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .pt-avs { display:flex; }
  .pt-av {
    width:34px; height:34px; border-radius:50%;
    border:2px solid #0F1E3A; margin-left:-10px;
    background-size:cover; background-position:center;
  }
  .pt-av:first-child { margin-left:0; }
  .pt-info { flex:1; font-size:12px; color:rgba(255,255,255,0.8); }
  .pt-info b { color:#A7F3D0; font-weight:700; }
  .pt-btn {
    padding:7px 12px; border-radius:12px;
    background:rgba(167,243,208,0.18);
    border:1px solid rgba(167,243,208,0.4);
    font-size:10px; font-weight:700;
    color:#A7F3D0;
  }

  .home-indicator {
    width:134px; height:5px; background:#fff; border-radius:3px;
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <div class="battery"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="content">
    <div class="nav">
      <div class="nav-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="nav-title">一起平静</div>
      <div class="nav-btn"><i class="fas fa-ellipsis"></i></div>
    </div>

    <div class="intro">
      <div class="intro-tag">🌊 4-7-8 呼吸法</div>
      <div class="intro-title display">吸入平静，<br>呼出喧嚣。</div>
      <div class="intro-sub">正与 🇯🇵 理子 同步呼吸</div>
    </div>

    <div class="breath-wrap">
      <div class="ring-outer"></div>
      <div class="breath-orb">
        <div class="breath-text">吸气</div>
        <div class="breath-count">4</div>
      </div>
    </div>

    <div class="session-info">
      <div class="session-name">海洋之静 · 第 02 节</div>
      <div class="session-meta">李娜医生引导 · 剩余 4 分钟</div>
    </div>

    <div class="progress"><span></span></div>
    <div class="time-row"><span>1:47</span><span>4:20</span></div>

    <div class="controls">
      <div class="ctrl-btn"><i class="fas fa-backward"></i></div>
      <div class="ctrl-btn ctrl-play"><i class="fas fa-pause"></i></div>
      <div class="ctrl-btn"><i class="fas fa-forward"></i></div>
    </div>

    <div class="peer-together">
      <div class="pt-avs">
        <div class="pt-av" style="background-image:url('https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=120&h=120&fit=crop');"></div>
        <div class="pt-av" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop');"></div>
        <div class="pt-av" style="background-image:url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop');"></div>
      </div>
      <div class="pt-info"><b>3 位同伴</b> 正在和你一起呼吸</div>
      <div class="pt-btn">加入</div>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
