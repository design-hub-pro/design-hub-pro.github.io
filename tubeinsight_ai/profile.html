<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TubeInsight - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { width: 430px; height: 932px; overflow-x: hidden; background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pb-6">
        <!-- Profile Header -->
        <div class="py-6 text-center">
            <div class="relative inline-block mb-4">
                <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-red-500 mx-auto">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200&h=200&fit=crop&crop=face" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-red-500 rounded-full flex items-center justify-center border-2 border-white">
                    <i class="fab fa-youtube text-white text-xs"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Alex Chen</h1>
            <p class="text-base text-gray-500">@TechWithAlex</p>
            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="text-sm bg-red-100 text-red-700 px-3 py-1 rounded-full font-medium">Tech Creator</span>
                <span class="text-sm bg-purple-100 text-purple-700 px-3 py-1 rounded-full font-medium">Rising Star</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-red-600">1.2K</p>
                <p class="text-sm text-gray-500">Subscribers</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-blue-600">47</p>
                <p class="text-sm text-gray-500">Videos</p>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm">
                <p class="text-2xl font-bold text-emerald-600">87</p>
                <p class="text-sm text-gray-500">Score</p>
            </div>
        </div>

        <!-- Channel Connected -->
        <div class="bg-white rounded-2xl p-4 mb-6 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                    <i class="fab fa-youtube text-red-600 text-xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-base font-semibold text-gray-900">YouTube Channel</h3>
                    <p class="text-sm text-emerald-600"><i class="fas fa-check-circle mr-1"></i>Connected</p>
                </div>
                <button class="text-sm text-red-600 font-medium">Manage</button>
            </div>
        </div>

        <!-- Settings -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-gray-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Notifications</span>
                </div>
                <div class="w-12 h-7 bg-red-500 rounded-full relative">
                    <div class="absolute right-1 top-1 w-5 h-5 bg-white rounded-full"></div>
                </div>
            </div>
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bullseye text-blue-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Niche Settings</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="px-4 py-4 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-crown text-purple-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Upgrade to Pro</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
            <div class="px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sign-out-alt text-red-600"></i>
                    </div>
                    <span class="text-base text-gray-900">Log Out</span>
                </div>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-line text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Analytics</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-lightbulb text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Ideas</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-compass text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Explore</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-red-600 text-2xl"></i>
                <span class="text-sm text-red-600 font-medium mt-1">Profile</span>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-24"></div>
</body>
</html>
