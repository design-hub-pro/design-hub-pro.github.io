<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFF8F0 0%, #FFE8D6 100%);
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; }
        .avatar-ring {
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .avatar-ring.selected {
            box-shadow: 0 0 0 4px #FF6B6B, 0 4px 20px rgba(255,107,107,0.3);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }
        .float-anim-2 { animation: float 3s ease-in-out infinite 0.5s; }
        .float-anim-3 { animation: float 3s ease-in-out infinite 1s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area text-center">
        <!-- Floating Culture Icons -->
        <div class="flex justify-center gap-6 mt-6 mb-4">
            <div class="float-anim">
                <div class="w-16 h-16 rounded-2xl bg-white shadow-md flex items-center justify-center">
                    <span class="text-3xl">🏯</span>
                </div>
            </div>
            <div class="float-anim-2">
                <div class="w-16 h-16 rounded-2xl bg-white shadow-md flex items-center justify-center">
                    <span class="text-3xl">🎎</span>
                </div>
            </div>
            <div class="float-anim-3">
                <div class="w-16 h-16 rounded-2xl bg-white shadow-md flex items-center justify-center">
                    <span class="text-3xl">🐉</span>
                </div>
            </div>
        </div>

        <!-- Hero Image -->
        <div class="relative rounded-3xl overflow-hidden mx-auto mb-6" style="height: 220px;">
            <img src="https://images.unsplash.com/photo-1522383225653-ed111181a951?w=800&h=500&fit=crop" class="w-full h-full object-cover" alt="Cherry blossoms">
            <div class="absolute inset-0 bg-gradient-to-t from-orange-500/40 via-transparent to-transparent"></div>
            <div class="absolute bottom-4 left-0 right-0">
                <div class="bg-white/90 backdrop-blur mx-6 rounded-2xl p-3 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-red-400 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-seedling text-white"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-black text-gray-900 text-sm">CultureSprout</p>
                        <p class="text-xs text-gray-400 font-bold">Discover Asia's magic!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-black text-gray-900 leading-tight mb-2">
            Welcome,<br>Little Explorer!
        </h1>
        <p class="text-gray-400 font-bold text-sm mb-6">Pick your adventure buddy</p>

        <!-- Avatar Selection -->
        <div class="flex justify-center gap-4 mb-6">
            <div class="text-center">
                <div class="avatar-ring w-20 h-20 rounded-full overflow-hidden bg-orange-100 flex items-center justify-center">
                    <span class="text-4xl">🐼</span>
                </div>
                <p class="text-xs font-extrabold text-gray-500 mt-2">Bao</p>
            </div>
            <div class="text-center">
                <div class="avatar-ring selected w-20 h-20 rounded-full overflow-hidden bg-pink-100 flex items-center justify-center">
                    <span class="text-4xl">🐰</span>
                </div>
                <p class="text-xs font-extrabold text-orange-500 mt-2">Mochi</p>
            </div>
            <div class="text-center">
                <div class="avatar-ring w-20 h-20 rounded-full overflow-hidden bg-blue-100 flex items-center justify-center">
                    <span class="text-4xl">🐯</span>
                </div>
                <p class="text-xs font-extrabold text-gray-500 mt-2">Tora</p>
            </div>
            <div class="text-center">
                <div class="avatar-ring w-20 h-20 rounded-full overflow-hidden bg-green-100 flex items-center justify-center">
                    <span class="text-4xl">🐲</span>
                </div>
                <p class="text-xs font-extrabold text-gray-500 mt-2">Long</p>
            </div>
        </div>

        <!-- Age Selection -->
        <p class="text-gray-400 font-bold text-sm mb-3">How old are you?</p>
        <div class="flex justify-center gap-3 mb-8">
            <div class="w-14 h-14 rounded-2xl bg-white shadow-sm flex items-center justify-center">
                <span class="font-black text-gray-400 text-lg">4</span>
            </div>
            <div class="w-14 h-14 rounded-2xl bg-white shadow-sm flex items-center justify-center">
                <span class="font-black text-gray-400 text-lg">5</span>
            </div>
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-400 to-red-400 shadow-md flex items-center justify-center">
                <span class="font-black text-white text-lg">6</span>
            </div>
            <div class="w-14 h-14 rounded-2xl bg-white shadow-sm flex items-center justify-center">
                <span class="font-black text-gray-400 text-lg">7</span>
            </div>
            <div class="w-14 h-14 rounded-2xl bg-white shadow-sm flex items-center justify-center">
                <span class="font-black text-gray-400 text-lg">8</span>
            </div>
        </div>

        <!-- CTA Button -->
        <button class="w-full bg-gradient-to-r from-orange-400 to-red-400 text-white py-4.5 rounded-2xl font-black text-lg flex items-center justify-center gap-3 shadow-lg mb-4" style="box-shadow: 0 10px 40px rgba(255,107,107,0.35); padding: 18px;">
            Let's Explore!
            <i class="fas fa-rocket"></i>
        </button>

        <!-- Page Dots -->
        <div class="flex justify-center gap-2 mb-4">
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            <div class="w-6 h-2 rounded-full bg-orange-400"></div>
        </div>
    </div>
</body>
</html>
