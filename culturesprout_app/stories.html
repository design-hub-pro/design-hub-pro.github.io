<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                    <i class="fas fa-chevron-left text-gray-600"></i>
                </div>
                <h1 class="text-2xl font-black text-gray-900">Story Time</h1>
            </div>
            <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center">
                <i class="fas fa-search text-orange-500"></i>
            </div>
        </div>

        <!-- Culture Filter -->
        <div class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1">
            <div class="flex-shrink-0 bg-gradient-to-br from-orange-400 to-red-400 rounded-2xl px-4 py-2 flex items-center gap-1.5">
                <span class="text-sm">🌸</span>
                <span class="text-white font-extrabold text-sm">All</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2 flex items-center gap-1.5 shadow-sm">
                <span class="text-sm">🇯🇵</span>
                <span class="text-gray-700 font-bold text-sm">Japan</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2 flex items-center gap-1.5 shadow-sm">
                <span class="text-sm">🇨🇳</span>
                <span class="text-gray-700 font-bold text-sm">China</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2 flex items-center gap-1.5 shadow-sm">
                <span class="text-sm">🇮🇳</span>
                <span class="text-gray-700 font-bold text-sm">India</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2 flex items-center gap-1.5 shadow-sm">
                <span class="text-sm">🇰🇷</span>
                <span class="text-gray-700 font-bold text-sm">Korea</span>
            </div>
        </div>

        <!-- Featured Story -->
        <div class="relative rounded-3xl overflow-hidden mb-4" style="height: 200px;">
            <img src="https://images.unsplash.com/photo-1583212292454-1fe6229603b7?w=800&h=400&fit=crop" class="w-full h-full object-cover" alt="Koi fish">
            <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></div>
            <div class="absolute top-3 left-3">
                <span class="bg-yellow-400 text-yellow-900 text-xs font-black px-3 py-1 rounded-full flex items-center gap-1">
                    <i class="fas fa-star text-xs"></i> Popular
                </span>
            </div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
                    <i class="fas fa-play text-orange-500 text-xl ml-1"></i>
                </div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-4">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-lg">🇯🇵</span>
                    <span class="text-white/70 text-xs font-bold">8 min</span>
                    <span class="bg-white/20 backdrop-blur text-white text-xs font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                        <i class="fas fa-wand-magic-sparkles text-yellow-300 text-xs"></i> AI
                    </span>
                </div>
                <h2 class="text-white text-xl font-black">The Koi Fish's Dream</h2>
            </div>
        </div>

        <!-- Story List -->
        <div class="space-y-3">
            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                <div class="w-24 h-20 flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Lanterns">
                </div>
                <div class="p-3 flex-1">
                    <p class="font-black text-sm text-gray-900">Lantern Festival</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm">🇨🇳</span>
                        <span class="text-xs text-gray-400 font-bold">6 min</span>
                    </div>
                </div>
                <div class="pr-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center shadow-sm">
                        <i class="fas fa-play text-white text-xs ml-0.5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                <div class="w-24 h-20 flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1564760055775-d63b17a55c44?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Elephant">
                </div>
                <div class="p-3 flex-1">
                    <p class="font-black text-sm text-gray-900">The Wise Elephant</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm">🇮🇳</span>
                        <span class="text-xs text-gray-400 font-bold">10 min</span>
                    </div>
                </div>
                <div class="pr-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-purple-400 to-violet-500 flex items-center justify-center shadow-sm">
                        <i class="fas fa-play text-white text-xs ml-0.5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                <div class="w-24 h-20 flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1528181304800-259b08848526?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Thai temple">
                </div>
                <div class="p-3 flex-1">
                    <p class="font-black text-sm text-gray-900">The Golden Temple</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm">🇹🇭</span>
                        <span class="text-xs text-gray-400 font-bold">7 min</span>
                        <span class="bg-yellow-100 text-yellow-600 text-xs font-black px-2 py-0.5 rounded-full" style="font-size: 10px;">NEW</span>
                    </div>
                </div>
                <div class="pr-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-sm">
                        <i class="fas fa-play text-white text-xs ml-0.5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                <div class="w-24 h-20 flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1517154421773-0529f29ea451?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Korean scene">
                </div>
                <div class="p-3 flex-1">
                    <p class="font-black text-sm text-gray-900">Moon Rabbit's Gift</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm">🇰🇷</span>
                        <span class="text-xs text-gray-400 font-bold">9 min</span>
                    </div>
                </div>
                <div class="pr-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center shadow-sm">
                        <i class="fas fa-play text-white text-xs ml-0.5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                <div class="w-24 h-20 flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Japanese temple">
                </div>
                <div class="p-3 flex-1">
                    <p class="font-black text-sm text-gray-900">Sakura's Secret</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm">🇯🇵</span>
                        <span class="text-xs text-gray-400 font-bold">5 min</span>
                    </div>
                </div>
                <div class="pr-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center shadow-sm">
                        <i class="fas fa-play text-white text-xs ml-0.5"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Me</span>
        </div>
    </div>
</body>
</html>
