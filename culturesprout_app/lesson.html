<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Japan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .topic-card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Back Nav -->
        <div class="flex items-center justify-between mt-2 mb-3">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                <i class="fas fa-chevron-left text-gray-600"></i>
            </div>
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                <i class="fas fa-bookmark text-gray-400"></i>
            </div>
        </div>

        <!-- Culture Hero - Extra large -->
        <div class="relative rounded-3xl overflow-hidden mb-4" style="height: 230px;">
            <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=800&h=500&fit=crop" class="w-full h-full object-cover" alt="Japan temple">
            <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-5">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-4xl">🇯🇵</span>
                    <h1 class="text-white text-3xl font-black">Japan</h1>
                </div>
            </div>
        </div>

        <!-- Stats - Big visual -->
        <div class="grid grid-cols-3 gap-2.5 mb-4">
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-xl">📚</span>
                <p class="text-xl font-black text-red-500">12</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-xl">🎨</span>
                <p class="text-xl font-black text-teal-500">8</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-xl">✂️</span>
                <p class="text-xl font-black text-purple-500">5</p>
            </div>
        </div>

        <!-- AI Badge - Kid-friendly -->
        <div class="bg-gradient-to-r from-violet-500 to-purple-600 rounded-2xl p-3.5 mb-4 flex items-center gap-3">
            <span class="text-2xl">🪄</span>
            <div class="flex-1">
                <p class="text-white font-black text-sm">Made Just for Luna!</p>
                <p class="text-white/70 text-xs font-bold">Stories picked for you</p>
            </div>
            <i class="fas fa-chevron-right text-white/50"></i>
        </div>

        <!-- Topics - Image Cards instead of icon+text -->
        <h3 class="text-lg font-black text-gray-900 mb-3">Pick a Topic!</h3>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="topic-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-24">
                    <img src="https://images.unsplash.com/photo-1530023367847-a683933f4172?w=400&h=200&fit=crop" class="w-full h-full object-cover" alt="Calligraphy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                    <div class="absolute bottom-2 left-2.5">
                        <p class="font-black text-white text-sm">Art & Craft</p>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-red-50 rounded-full h-2">
                        <div class="bg-red-400 h-2 rounded-full" style="width: 70%"></div>
                    </div>
                </div>
            </div>

            <div class="topic-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-24">
                    <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?w=400&h=200&fit=crop" class="w-full h-full object-cover" alt="Japanese food">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                    <div class="absolute bottom-2 left-2.5">
                        <p class="font-black text-white text-sm">Yummy Food</p>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-amber-50 rounded-full h-2">
                        <div class="bg-amber-400 h-2 rounded-full" style="width: 40%"></div>
                    </div>
                </div>
            </div>

            <div class="topic-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-24">
                    <img src="https://images.unsplash.com/photo-1492571350019-22de08371fd3?w=400&h=200&fit=crop" class="w-full h-full object-cover" alt="Japanese festival">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                    <div class="absolute bottom-2 left-2.5">
                        <p class="font-black text-white text-sm">Festivals!</p>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-blue-50 rounded-full h-2">
                        <div class="bg-blue-400 h-2 rounded-full" style="width: 25%"></div>
                    </div>
                </div>
            </div>

            <div class="topic-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-24">
                    <img src="https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=400&h=200&fit=crop" class="w-full h-full object-cover" alt="Japanese music">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                    <div class="absolute bottom-2 left-2.5">
                        <p class="font-black text-white text-sm">Music!</p>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-green-50 rounded-full h-2">
                        <div class="bg-green-400 h-2 rounded-full" style="width: 15%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Featured Story -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm mb-4">
            <div class="relative h-36">
                <img src="https://images.unsplash.com/photo-1583212292454-1fe6229603b7?w=800&h=350&fit=crop" class="w-full h-full object-cover" alt="Koi">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-14 h-14 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
                        <i class="fas fa-play text-orange-500 text-xl ml-1"></i>
                    </div>
                </div>
                <div class="absolute bottom-3 left-4">
                    <p class="text-white font-black text-sm">The Koi Fish's Dream</p>
                </div>
            </div>
        </div>

        <!-- CTA -->
        <button class="w-full bg-gradient-to-r from-orange-400 to-red-400 text-white py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 shadow-lg" style="box-shadow: 0 8px 32px rgba(255,107,107,0.3);">
            🎨 Start Creating!
        </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Me</span>
        </div>
    </div>
</body>
</html>
