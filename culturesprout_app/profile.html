<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .profile-header {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFD93D 100%);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-4">
            <h1 class="text-2xl font-black text-gray-900">Me</h1>
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                <i class="fas fa-gear text-gray-400"></i>
            </div>
        </div>

        <!-- Profile Card - Big & visual -->
        <div class="profile-header rounded-3xl p-5 mb-4 text-center">
            <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-white shadow-lg mx-auto mb-3">
                <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=200&h=200&fit=crop" class="w-full h-full object-cover" alt="Luna">
            </div>
            <h2 class="text-white text-2xl font-black">Luna</h2>
            <p class="text-white/80 text-sm font-bold">Age 6</p>
            <div class="grid grid-cols-3 gap-2.5 mt-4">
                <div class="bg-white/20 backdrop-blur rounded-xl p-2.5 text-center">
                    <span class="text-lg">⭐</span>
                    <p class="text-white text-lg font-black">156</p>
                </div>
                <div class="bg-white/20 backdrop-blur rounded-xl p-2.5 text-center">
                    <span class="text-lg">🏅</span>
                    <p class="text-white text-lg font-black">Lv.5</p>
                </div>
                <div class="bg-white/20 backdrop-blur rounded-xl p-2.5 text-center">
                    <span class="text-lg">🔥</span>
                    <p class="text-white text-lg font-black">7</p>
                </div>
            </div>
        </div>

        <!-- Cultural Passport - Visual stamps -->
        <h3 class="text-lg font-black text-gray-900 mb-2">My Passport</h3>
        <div class="flex gap-2.5 overflow-x-auto pb-3 -mx-1 px-1">
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-2.5 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full overflow-hidden mb-1">
                    <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="Japan">
                </div>
                <span class="text-xl">🇯🇵</span>
                <div class="w-2 h-2 rounded-full bg-green-400 mx-auto mt-0.5"></div>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-2.5 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full overflow-hidden mb-1">
                    <img src="https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="China">
                </div>
                <span class="text-xl">🇨🇳</span>
                <div class="w-2 h-2 rounded-full bg-green-400 mx-auto mt-0.5"></div>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-2.5 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full overflow-hidden mb-1">
                    <img src="https://images.unsplash.com/photo-1605289355680-75fb41239154?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="India">
                </div>
                <span class="text-xl">🇮🇳</span>
                <div class="w-2 h-2 rounded-full bg-yellow-400 mx-auto mt-0.5"></div>
            </div>
            <div class="flex-shrink-0 w-20 bg-white rounded-2xl p-2.5 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full overflow-hidden mb-1">
                    <img src="https://images.unsplash.com/photo-1517154421773-0529f29ea451?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="Korea">
                </div>
                <span class="text-xl">🇰🇷</span>
                <div class="w-2 h-2 rounded-full bg-yellow-400 mx-auto mt-0.5"></div>
            </div>
            <div class="flex-shrink-0 w-20 bg-gray-50 rounded-2xl p-2.5 text-center opacity-40">
                <div class="w-14 h-14 mx-auto rounded-full bg-gray-200 flex items-center justify-center mb-1">
                    <i class="fas fa-lock text-gray-300"></i>
                </div>
                <span class="text-xl">❓</span>
            </div>
        </div>

        <!-- Badges - Big visual icons -->
        <h3 class="text-lg font-black text-gray-900 mb-2 mt-2">My Badges</h3>
        <div class="grid grid-cols-3 gap-2.5 mb-4">
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-br from-amber-300 to-yellow-500 flex items-center justify-center mb-1.5 shadow-md">
                    <span class="text-2xl">⭐</span>
                </div>
                <p class="text-xs font-extrabold text-gray-700">First Story</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-br from-teal-400 to-green-500 flex items-center justify-center mb-1.5 shadow-md">
                    <span class="text-2xl">🎨</span>
                </div>
                <p class="text-xs font-extrabold text-gray-700">Craft Pro</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-br from-purple-400 to-violet-500 flex items-center justify-center mb-1.5 shadow-md">
                    <span class="text-2xl">🔥</span>
                </div>
                <p class="text-xs font-extrabold text-gray-700">7 Streak</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center mb-1.5 shadow-md">
                    <span class="text-2xl">❤️</span>
                </div>
                <p class="text-xs font-extrabold text-gray-700">Book Worm</p>
            </div>
            <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
                <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center mb-1.5 shadow-md">
                    <span class="text-2xl">🌏</span>
                </div>
                <p class="text-xs font-extrabold text-gray-700">Traveler</p>
            </div>
            <div class="bg-gray-50 rounded-2xl p-3 text-center opacity-40">
                <div class="w-14 h-14 mx-auto rounded-full bg-gray-200 flex items-center justify-center mb-1.5">
                    <i class="fas fa-lock text-gray-300 text-lg"></i>
                </div>
                <p class="text-xs font-extrabold text-gray-400">???</p>
            </div>
        </div>

        <!-- Parent Access -->
        <div class="bg-white rounded-2xl p-4 flex items-center gap-3 shadow-sm">
            <div class="w-11 h-11 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-shield-halved text-gray-400"></i>
            </div>
            <div class="flex-1">
                <p class="font-black text-sm text-gray-900">Parent Zone</p>
            </div>
            <i class="fas fa-chevron-right text-gray-300"></i>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Me</span>
        </div>
    </div>
</body>
</html>
