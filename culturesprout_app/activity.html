<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Back Nav -->
        <div class="flex items-center justify-between mt-2 mb-3">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                <i class="fas fa-chevron-left text-gray-600"></i>
            </div>
            <span class="bg-gradient-to-r from-orange-400 to-red-400 text-white text-xs font-black px-4 py-1.5 rounded-full">Step 3 of 8</span>
        </div>

        <!-- Activity Hero - BIG image -->
        <div class="relative rounded-3xl overflow-hidden mb-4" style="height: 220px;">
            <img src="https://images.unsplash.com/photo-1618842676088-c4d48a6a7c9d?w=800&h=500&fit=crop" class="w-full h-full object-cover" alt="Origami cranes">
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
            <div class="absolute top-4 left-4 flex items-center gap-2">
                <span class="bg-white/20 backdrop-blur text-white text-xs font-bold px-3 py-1.5 rounded-full">🎨 Craft</span>
                <span class="bg-white/20 backdrop-blur text-white text-xs font-bold px-3 py-1.5 rounded-full">⏱ 15 min</span>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-5">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xl">🇯🇵</span>
                </div>
                <h1 class="text-white text-2xl font-black">Paper Crane!</h1>
            </div>
        </div>

        <!-- Step Progress - Chunky for kids -->
        <div class="flex gap-1.5 mb-4">
            <div class="flex-1 h-2.5 rounded-full bg-orange-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-orange-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-orange-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
        </div>

        <!-- Current Step - Image-first -->
        <div class="bg-white rounded-2xl overflow-hidden mb-4 shadow-sm">
            <img src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=800&h=350&fit=crop" class="w-full h-36 object-cover" alt="Paper folding">
            <div class="p-4">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-red-400 flex items-center justify-center flex-shrink-0">
                        <span class="text-white font-black text-sm">3</span>
                    </div>
                    <h3 class="font-black text-gray-900">Fold the Corner!</h3>
                </div>
                <p class="text-sm text-gray-500 font-bold">Fold the top corner down to the bottom corner. Press it flat!</p>
            </div>
        </div>

        <!-- Video Tutorial - Big play button -->
        <div class="relative rounded-2xl overflow-hidden mb-4 shadow-md" style="height: 150px;">
            <img src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=800&h=350&fit=crop" class="w-full h-full object-cover" alt="Origami tutorial">
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                <div class="w-16 h-16 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
                    <i class="fas fa-play text-orange-500 text-2xl ml-1"></i>
                </div>
            </div>
            <div class="absolute bottom-3 right-3 bg-black/60 px-2.5 py-1 rounded-lg">
                <span class="text-white text-xs font-bold">3:24</span>
            </div>
            <div class="absolute bottom-3 left-3 bg-white/90 px-2.5 py-1 rounded-lg flex items-center gap-1">
                <span class="text-xs font-black text-gray-700">Watch How!</span>
            </div>
        </div>

        <!-- What you need - Icon cards -->
        <h3 class="text-base font-black text-gray-900 mb-2">You'll Need</h3>
        <div class="flex gap-3 mb-4">
            <div class="flex-1 bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-2xl">📄</span>
                <p class="text-xs font-extrabold text-gray-700 mt-1">Paper</p>
            </div>
            <div class="flex-1 bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-2xl">📏</span>
                <p class="text-xs font-extrabold text-gray-700 mt-1">Ruler</p>
            </div>
            <div class="flex-1 bg-white rounded-2xl p-3 text-center shadow-sm">
                <span class="text-2xl">🤲</span>
                <p class="text-xs font-extrabold text-gray-700 mt-1">Hands</p>
            </div>
        </div>

        <!-- Fun Fact -->
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl p-3.5 mb-4 border border-amber-200 flex items-center gap-3">
            <span class="text-2xl flex-shrink-0">✨</span>
            <p class="text-xs text-amber-700 font-bold">Fold 1,000 cranes and your wish comes true!</p>
        </div>

        <!-- Action Buttons - Big & colorful -->
        <div class="flex gap-3">
            <button class="flex-1 bg-gray-100 text-gray-500 py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left text-xs"></i>
                Back
            </button>
            <button class="flex-1 bg-gradient-to-r from-orange-400 to-red-400 text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg">
                Next!
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Me</span>
        </div>
    </div>
</body>
</html>
