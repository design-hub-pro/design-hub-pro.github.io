<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 30px; }
        .answer-card {
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .answer-card.correct {
            box-shadow: 0 0 0 3px #22C55E, 0 4px 16px rgba(34,197,94,0.2);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Top Bar -->
        <div class="flex items-center justify-between mt-2 mb-3">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                <i class="fas fa-xmark text-gray-400"></i>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-lg">🔥</span>
                <span class="font-black text-orange-500 text-sm">3</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-lg">⭐</span>
                <span class="font-black text-amber-500 text-sm">45</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="flex gap-1.5 mb-4">
            <div class="flex-1 h-2.5 rounded-full bg-green-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-green-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-green-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-orange-400"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
            <div class="flex-1 h-2.5 rounded-full bg-gray-200"></div>
        </div>

        <!-- Question Image -->
        <div class="relative rounded-3xl overflow-hidden mb-4" style="height: 200px;">
            <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=800&h=400&fit=crop" class="w-full h-full object-cover" alt="Japanese temple">
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
            <div class="absolute top-3 left-3">
                <span class="bg-white/90 text-gray-700 text-xs font-black px-3 py-1.5 rounded-full">Question 4 of 6</span>
            </div>
            <div class="absolute bottom-3 left-3">
                <span class="text-lg">🇯🇵</span>
            </div>
        </div>

        <!-- Question -->
        <h2 class="text-xl font-black text-gray-900 text-center mb-4 leading-tight">
            What is this building called?
        </h2>

        <!-- Answer Options - Image cards -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="answer-card bg-white rounded-2xl p-4 text-center">
                <span class="text-3xl mb-2 block">🏯</span>
                <p class="font-extrabold text-sm text-gray-700">Temple</p>
            </div>
            <div class="answer-card correct bg-white rounded-2xl p-4 text-center relative">
                <div class="absolute -top-1.5 -right-1.5 w-6 h-6 bg-green-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-check text-white text-xs"></i>
                </div>
                <span class="text-3xl mb-2 block">⛩️</span>
                <p class="font-extrabold text-sm text-green-600">Torii Gate</p>
            </div>
            <div class="answer-card bg-white rounded-2xl p-4 text-center">
                <span class="text-3xl mb-2 block">🏠</span>
                <p class="font-extrabold text-sm text-gray-700">House</p>
            </div>
            <div class="answer-card bg-white rounded-2xl p-4 text-center">
                <span class="text-3xl mb-2 block">🏰</span>
                <p class="font-extrabold text-sm text-gray-700">Castle</p>
            </div>
        </div>

        <!-- Correct Feedback -->
        <div class="bg-green-50 rounded-2xl p-4 mb-4 border border-green-200 flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
                <span class="text-2xl">🎉</span>
            </div>
            <div>
                <p class="font-black text-green-700 text-sm">Correct!</p>
                <p class="text-xs text-green-600 font-bold">Torii gates mark the entrance to sacred spaces in Japan!</p>
            </div>
        </div>

        <!-- Next Button -->
        <button class="w-full bg-gradient-to-r from-orange-400 to-red-400 text-white py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 shadow-lg" style="box-shadow: 0 8px 32px rgba(255,107,107,0.3);">
            Next Question!
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>
</body>
</html>
