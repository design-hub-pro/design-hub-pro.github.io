<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .journey-path { position: relative; }
        .journey-path::before {
            content: '';
            position: absolute;
            left: 23px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #FF6B6B, #FF8E53, #FFD93D, #4ECDC4, #A855F7);
            border-radius: 2px;
        }
        .journey-node { position: relative; z-index: 1; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-4">
            <h1 class="text-2xl font-black text-gray-900">My Journey</h1>
            <span class="bg-orange-100 text-orange-600 text-xs font-black px-3 py-1.5 rounded-full">This Week</span>
        </div>

        <!-- Streak Banner -->
        <div class="bg-gradient-to-r from-orange-400 to-red-400 rounded-2xl p-4 mb-4 flex items-center gap-3 shadow-lg" style="box-shadow: 0 8px 24px rgba(255,107,107,0.3);">
            <div class="text-4xl">🔥</div>
            <div class="flex-1">
                <p class="text-white font-black text-lg">7 Day Streak!</p>
                <p class="text-white/80 text-xs font-bold">Keep going, Luna!</p>
            </div>
            <div class="flex gap-1">
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-white/30 flex items-center justify-center"><span class="text-xs">🟠</span></div>
                <div class="w-5 h-5 rounded-full bg-yellow-300 flex items-center justify-center"><span class="text-xs">⭐</span></div>
            </div>
        </div>

        <!-- Weekly Chart - Colorful bars -->
        <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
            <div class="flex items-end justify-between gap-2" style="height: 90px;">
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-orange-300 to-orange-200 rounded-t-xl" style="height: 40%"></div>
                    <span class="text-xs text-gray-400 mt-1.5 font-bold">M</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-orange-400 to-orange-300 rounded-t-xl" style="height: 65%"></div>
                    <span class="text-xs text-gray-400 mt-1.5 font-bold">T</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-orange-300 to-orange-200 rounded-t-xl" style="height: 30%"></div>
                    <span class="text-xs text-gray-400 mt-1.5 font-bold">W</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-orange-400 to-orange-300 rounded-t-xl" style="height: 85%"></div>
                    <span class="text-xs text-gray-400 mt-1.5 font-bold">T</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-orange-300 to-orange-200 rounded-t-xl" style="height: 55%"></div>
                    <span class="text-xs text-gray-400 mt-1.5 font-bold">F</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gradient-to-t from-red-400 to-orange-400 rounded-t-xl" style="height: 100%"></div>
                    <span class="text-xs text-orange-500 mt-1.5 font-black">S</span>
                </div>
                <div class="flex flex-col items-center flex-1">
                    <div class="w-full bg-gray-100 rounded-t-xl" style="height: 5%"></div>
                    <span class="text-xs text-gray-300 mt-1.5 font-bold">S</span>
                </div>
            </div>
        </div>

        <!-- Adventures Timeline - Visual with images -->
        <h3 class="text-lg font-black text-gray-900 mb-3">Adventures</h3>

        <div class="journey-path pl-14 space-y-4 mb-4">
            <!-- Node 1 -->
            <div class="journey-node">
                <div class="absolute w-12 h-12 rounded-full bg-gradient-to-br from-red-400 to-orange-400 flex items-center justify-center shadow-md" style="left: 0;">
                    <span class="text-lg">✂️</span>
                </div>
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                    <img src="https://images.unsplash.com/photo-1604076913837-52ab5f0e1c81?w=120&h=100&fit=crop" class="w-16 h-16 object-cover flex-shrink-0" alt="Origami">
                    <div class="p-2.5 flex-1">
                        <span class="text-xs font-black text-orange-500">Today</span>
                        <p class="font-extrabold text-sm text-gray-900">Origami Crane</p>
                        <span class="text-xs text-gray-400 font-bold">🇯🇵 +15 XP</span>
                    </div>
                </div>
            </div>

            <!-- Node 2 -->
            <div class="journey-node">
                <div class="absolute w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-amber-400 flex items-center justify-center shadow-md" style="left: 0;">
                    <span class="text-lg">📖</span>
                </div>
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                    <img src="https://images.unsplash.com/photo-1583212292454-1fe6229603b7?w=120&h=100&fit=crop" class="w-16 h-16 object-cover flex-shrink-0" alt="Koi fish">
                    <div class="p-2.5 flex-1">
                        <span class="text-xs font-black text-gray-400">Yesterday</span>
                        <p class="font-extrabold text-sm text-gray-900">Koi Fish Story</p>
                        <span class="text-xs text-gray-400 font-bold">🇯🇵 +12 XP</span>
                    </div>
                </div>
            </div>

            <!-- Node 3 -->
            <div class="journey-node">
                <div class="absolute w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-yellow-400 flex items-center justify-center shadow-md" style="left: 0;">
                    <span class="text-lg">🖌️</span>
                </div>
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                    <img src="https://images.unsplash.com/photo-1530023367847-a683933f4172?w=120&h=100&fit=crop" class="w-16 h-16 object-cover flex-shrink-0" alt="Calligraphy">
                    <div class="p-2.5 flex-1">
                        <span class="text-xs font-black text-gray-400">2 days ago</span>
                        <p class="font-extrabold text-sm text-gray-900">Calligraphy</p>
                        <span class="text-xs text-gray-400 font-bold">🇨🇳 +20 XP</span>
                    </div>
                </div>
            </div>

            <!-- Node 4 -->
            <div class="journey-node">
                <div class="absolute w-12 h-12 rounded-full bg-gradient-to-br from-teal-400 to-green-400 flex items-center justify-center shadow-md" style="left: 0;">
                    <span class="text-lg">🎮</span>
                </div>
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm flex items-center">
                    <img src="https://images.unsplash.com/photo-1605289355680-75fb41239154?w=120&h=100&fit=crop" class="w-16 h-16 object-cover flex-shrink-0" alt="Rangoli">
                    <div class="p-2.5 flex-1">
                        <span class="text-xs font-black text-gray-400">3 days ago</span>
                        <p class="font-extrabold text-sm text-gray-900">Rangoli Quiz</p>
                        <span class="text-xs text-gray-400 font-bold">🇮🇳 +10 XP</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- See More -->
        <button class="w-full bg-white text-gray-500 py-3.5 rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-sm">
            See More
            <i class="fas fa-chevron-down text-xs"></i>
        </button>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Me</span>
        </div>
    </div>
</body>
</html>
