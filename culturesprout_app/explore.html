<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Explore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF8F0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; padding-bottom: 100px; }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .culture-card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mt-3 mb-4">
            <h1 class="text-2xl font-black text-gray-900">Explore!</h1>
            <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center">
                <i class="fas fa-search text-orange-500"></i>
            </div>
        </div>

        <!-- Fun Category Scroll -->
        <div class="flex gap-3 overflow-x-auto pb-3 -mx-1 px-1">
            <div class="flex-shrink-0 bg-gradient-to-br from-orange-400 to-red-400 rounded-2xl px-4 py-2.5 flex items-center gap-2">
                <span class="text-lg">🌸</span>
                <span class="text-white font-extrabold text-sm">All</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2.5 flex items-center gap-2 shadow-sm">
                <span class="text-lg">🏯</span>
                <span class="text-gray-700 font-bold text-sm">Stories</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2.5 flex items-center gap-2 shadow-sm">
                <span class="text-lg">🎨</span>
                <span class="text-gray-700 font-bold text-sm">Crafts</span>
            </div>
            <div class="flex-shrink-0 bg-white rounded-2xl px-4 py-2.5 flex items-center gap-2 shadow-sm">
                <span class="text-lg">🍱</span>
                <span class="text-gray-700 font-bold text-sm">Food</span>
            </div>
        </div>

        <!-- Featured Culture - Big Card -->
        <div class="relative rounded-3xl overflow-hidden mb-4" style="height: 190px;">
            <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=800&h=400&fit=crop" class="w-full h-full object-cover" alt="Japanese temple">
            <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></div>
            <div class="absolute top-3 right-3">
                <span class="bg-yellow-400 text-yellow-900 text-xs font-black px-3 py-1 rounded-full flex items-center gap-1">
                    <i class="fas fa-star text-xs"></i> Featured
                </span>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-4">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-3xl">🇯🇵</span>
                    <span class="text-white font-black text-xl">Japan</span>
                </div>
                <div class="flex gap-3 mt-1">
                    <span class="text-white/70 text-xs font-bold flex items-center gap-1">📚 12</span>
                    <span class="text-white/70 text-xs font-bold flex items-center gap-1">🎨 8</span>
                    <span class="text-white/70 text-xs font-bold flex items-center gap-1">✂️ 5</span>
                </div>
            </div>
        </div>

        <!-- Culture Grid -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <!-- China -->
            <div class="culture-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-32">
                    <img src="https://images.unsplash.com/photo-1513297887119-d46091b24bfb?w=400&h=300&fit=crop" class="w-full h-full object-cover" alt="Chinese lanterns">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-2 left-3 flex items-center gap-1.5">
                        <span class="text-xl">🇨🇳</span>
                        <span class="text-white font-black text-sm">China</span>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-red-50 rounded-full h-2">
                        <div class="bg-gradient-to-r from-red-400 to-red-500 h-2 rounded-full" style="width: 45%"></div>
                    </div>
                </div>
            </div>

            <!-- India -->
            <div class="culture-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-32">
                    <img src="https://images.unsplash.com/photo-1605289355680-75fb41239154?w=400&h=300&fit=crop" class="w-full h-full object-cover" alt="Rangoli">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-2 left-3 flex items-center gap-1.5">
                        <span class="text-xl">🇮🇳</span>
                        <span class="text-white font-black text-sm">India</span>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-purple-50 rounded-full h-2">
                        <div class="bg-gradient-to-r from-purple-400 to-pink-400 h-2 rounded-full" style="width: 30%"></div>
                    </div>
                </div>
            </div>

            <!-- Korea -->
            <div class="culture-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-32">
                    <img src="https://images.unsplash.com/photo-1517154421773-0529f29ea451?w=400&h=300&fit=crop" class="w-full h-full object-cover" alt="Korean architecture">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-2 left-3 flex items-center gap-1.5">
                        <span class="text-xl">🇰🇷</span>
                        <span class="text-white font-black text-sm">Korea</span>
                    </div>
                    <div class="absolute top-2 right-2">
                        <span class="bg-yellow-400 text-yellow-900 text-xs font-black px-2 py-0.5 rounded-full" style="font-size: 10px;">NEW</span>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-teal-50 rounded-full h-2">
                        <div class="bg-gradient-to-r from-teal-400 to-cyan-400 h-2 rounded-full" style="width: 10%"></div>
                    </div>
                </div>
            </div>

            <!-- Thailand -->
            <div class="culture-card bg-white rounded-2xl overflow-hidden">
                <div class="relative h-32">
                    <img src="https://images.unsplash.com/photo-1528181304800-259b08848526?w=400&h=300&fit=crop" class="w-full h-full object-cover" alt="Thai temple">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-2 left-3 flex items-center gap-1.5">
                        <span class="text-xl">🇹🇭</span>
                        <span class="text-white font-black text-sm">Thailand</span>
                    </div>
                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                        <div class="bg-white/90 rounded-full w-10 h-10 flex items-center justify-center">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <div class="p-2.5">
                    <div class="bg-gray-100 rounded-full h-2"></div>
                </div>
            </div>
        </div>

        <!-- Coming Soon -->
        <div class="bg-gradient-to-r from-amber-100 to-orange-100 rounded-2xl p-4 flex items-center gap-3">
            <span class="text-3xl">🌟</span>
            <div class="flex-1">
                <p class="font-black text-sm text-gray-900">More coming soon!</p>
                <div class="flex gap-2 mt-1">
                    <span class="text-lg">🇻🇳</span>
                    <span class="text-lg">🇮🇩</span>
                    <span class="text-lg">🇵🇭</span>
                    <span class="text-lg">🇲🇾</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar flex items-start justify-around pt-3">
        <div class="flex flex-col items-center">
            <i class="fas fa-house text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Home</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-compass text-xl text-orange-500"></i>
            <span class="text-xs mt-1 text-orange-500 font-bold">Explore</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-palette text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Create</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-map text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Journey</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fas fa-user text-xl text-gray-300"></i>
            <span class="text-xs mt-1 text-gray-400">Me</span>
        </div>
    </div>
</body>
</html>
