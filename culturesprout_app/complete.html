<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CultureSprout - Complete!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFF8F0 0%, #FFF0E0 100%);
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 24px;
            margin: 0 auto;
            margin-top: 14px;
        }
        .content-area { padding: 0 28px; }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }
        .bounce-anim { animation: bounce 2s ease-in-out infinite; }
        .sparkle-1 { animation: sparkle 1.5s ease-in-out infinite; }
        .sparkle-2 { animation: sparkle 1.5s ease-in-out infinite 0.3s; }
        .sparkle-3 { animation: sparkle 1.5s ease-in-out infinite 0.6s; }
        .sparkle-4 { animation: sparkle 1.5s ease-in-out infinite 0.9s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-1">
        <span class="text-sm font-bold text-gray-800">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5 text-gray-800">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area text-center">
        <!-- Floating Stars -->
        <div class="relative mt-4 mb-2" style="height: 60px;">
            <span class="sparkle-1 absolute text-2xl" style="left: 15%; top: 10px;">✨</span>
            <span class="sparkle-2 absolute text-3xl" style="left: 45%; top: 0px;">⭐</span>
            <span class="sparkle-3 absolute text-2xl" style="left: 75%; top: 15px;">✨</span>
            <span class="sparkle-4 absolute text-xl" style="left: 30%; top: 35px;">🌟</span>
            <span class="sparkle-1 absolute text-xl" style="left: 65%; top: 40px;">🌟</span>
        </div>

        <!-- Trophy / Badge -->
        <div class="bounce-anim mx-auto mb-4">
            <div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-br from-amber-300 via-yellow-400 to-orange-400 flex items-center justify-center shadow-xl" style="box-shadow: 0 12px 40px rgba(255,193,7,0.4);">
                <span class="text-6xl">🏆</span>
            </div>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-black text-gray-900 mb-1">Amazing!</h1>
        <p class="text-gray-400 font-bold text-sm mb-5">You finished the Paper Crane!</p>

        <!-- Reward Card -->
        <div class="bg-white rounded-3xl p-5 mb-4 shadow-md mx-2">
            <!-- XP Earned -->
            <div class="flex items-center justify-center gap-3 mb-4">
                <div class="bg-gradient-to-br from-orange-100 to-red-100 rounded-2xl px-5 py-3 text-center">
                    <span class="text-lg">⭐</span>
                    <p class="text-2xl font-black text-orange-500">+25</p>
                    <p class="text-xs text-gray-400 font-bold">XP</p>
                </div>
                <div class="bg-gradient-to-br from-purple-100 to-violet-100 rounded-2xl px-5 py-3 text-center">
                    <span class="text-lg">🔥</span>
                    <p class="text-2xl font-black text-purple-500">8</p>
                    <p class="text-xs text-gray-400 font-bold">Streak</p>
                </div>
            </div>

            <!-- New Badge Earned -->
            <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl p-3.5 flex items-center gap-3 border border-amber-200">
                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-amber-300 to-yellow-500 flex items-center justify-center shadow-md flex-shrink-0">
                    <span class="text-2xl">✂️</span>
                </div>
                <div class="text-left flex-1">
                    <p class="text-xs text-amber-600 font-bold">New Badge!</p>
                    <p class="font-black text-sm text-gray-900">Origami Master</p>
                </div>
                <span class="text-xl">🎉</span>
            </div>
        </div>

        <!-- Completed Activity Image -->
        <div class="relative rounded-2xl overflow-hidden mb-5 mx-2" style="height: 140px;">
            <img src="https://images.unsplash.com/photo-1618842676088-c4d48a6a7c9d?w=800&h=300&fit=crop" class="w-full h-full object-cover" alt="Origami cranes">
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
            <div class="absolute bottom-3 left-4 flex items-center gap-2">
                <span class="text-lg">🇯🇵</span>
                <span class="text-white font-bold text-sm">Paper Crane</span>
            </div>
            <div class="absolute bottom-3 right-4">
                <span class="bg-green-400 text-green-900 text-xs font-black px-3 py-1 rounded-full">Done!</span>
            </div>
        </div>

        <!-- Passport Stamp -->
        <div class="bg-white rounded-2xl p-4 mb-5 mx-2 shadow-sm flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center flex-shrink-0">
                <span class="text-2xl">🇯🇵</span>
            </div>
            <div class="text-left flex-1">
                <p class="font-black text-sm text-gray-900">Japan Passport</p>
                <div class="bg-gray-100 rounded-full h-2 mt-1">
                    <div class="bg-gradient-to-r from-red-400 to-orange-400 h-2 rounded-full" style="width: 75%"></div>
                </div>
            </div>
            <span class="text-xs text-gray-400 font-bold">75%</span>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mx-2 mb-4">
            <button class="flex-1 bg-white text-gray-600 py-3.5 rounded-2xl font-black text-sm shadow-sm flex items-center justify-center gap-2">
                <i class="fas fa-share text-sm"></i>
                Share
            </button>
            <button class="flex-1 bg-gradient-to-r from-orange-400 to-red-400 text-white py-3.5 rounded-2xl font-black text-sm shadow-lg flex items-center justify-center gap-2">
                Next!
                <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </div>
    </div>
</body>
</html>
