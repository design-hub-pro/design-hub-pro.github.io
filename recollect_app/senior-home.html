<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senior Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FFFBF0;width:100%;height:100%;margin:0;overflow:hidden;color:#241C15}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:17px;font-weight:700}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 100px);overflow-y:auto;padding:0 28px 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:100px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid #F0E6DC;display:flex;justify-content:space-around;padding-top:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;color:#C9A99A;font-size:13px;font-weight:700}.tab.active{color:#E8623D}.tab i{font-size:28px}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(232,98,61,.10)}
.g-warm{background:linear-gradient(135deg,#FB923C,#E8623D 60%,#DB2763)}
.btn-lg{padding:18px;border-radius:20px;font-weight:800;font-size:18px;text-align:center}
</style></head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1.5"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-base"></i></span></div>
<div class="content">
<div class="flex items-center justify-between mt-2 mb-6">
 <div><p class="text-base text-[#B98F79] font-bold">Good morning</p><h1 class="text-[32px] font-black leading-tight">Eleanor</h1></div>
 <img src="https://images.unsplash.com/photo-1607990283143-e81e7a2c9349?w=200&q=80" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow">
</div>
<div class="card overflow-hidden relative">
 <div class="relative" style="height:200px">
  <img src="https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=800&q=80" class="w-full h-full object-cover blur-md scale-110">
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(232,98,61,.35),rgba(36,28,21,.55))"></div>
  <div class="absolute inset-0 flex flex-col items-center justify-center text-white text-center px-6">
   <i class="fas fa-puzzle-piece text-4xl mb-2"></i>
   <p class="text-lg font-black">A new memory from Sarah</p>
   <p class="text-sm opacity-90 mt-1">Play the game to see the photo</p>
  </div>
 </div>
 <div class="p-5">
  <div class="btn-lg g-warm text-white shadow-lg"><i class="fas fa-play mr-2"></i>Tap to Recover</div>
 </div>
</div>
<div class="grid grid-cols-2 gap-4 mt-5">
 <div class="card p-5 text-center"><p class="text-[34px] font-black text-[#E8623D] leading-none">7</p><p class="text-sm font-bold text-[#B98F79] mt-2">Memories found</p></div>
 <div class="card p-5 text-center"><p class="text-[34px] font-black text-[#E8623D] leading-none">12</p><p class="text-sm font-bold text-[#B98F79] mt-2">Day streak <i class="fas fa-fire text-amber-400"></i></p></div>
</div>
<div class="card p-5 mt-5 flex items-center gap-4">
 <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-white text-2xl flex-shrink-0" style="background:linear-gradient(135deg,#818CF8,#4F46E5)"><i class="fas fa-phone"></i></div>
 <div class="flex-1"><p class="text-lg font-black">Call Sarah</p><p class="text-sm text-[#B98F79] font-semibold">Your daughter</p></div>
 <i class="fas fa-chevron-right text-2xl text-[#E4C9BA]"></i>
</div>
</div>
<div class="tab-bar">
 <div class="tab active"><i class="fas fa-house"></i><span>Home</span></div>
 <div class="tab"><i class="fas fa-images"></i><span>Memories</span></div>
 <div class="tab"><i class="fas fa-heart"></i><span>Family</span></div>
</div>
</div></body></html>
