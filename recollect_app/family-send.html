<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send Memory</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FBF7F3;width:100%;height:100%;margin:0;overflow:hidden;color:#241C15}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:15px;font-weight:600}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 100px);overflow-y:auto;padding:0 28px 20px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 20px rgba(232,98,61,.08)}
.chip{padding:10px 16px;border-radius:16px;font-size:13px;font-weight:700;border:1.5px solid #F0E6DC;color:#B98F79}
.chip.active{background:linear-gradient(135deg,#FB923C,#E8623D);color:#fff;border-color:transparent}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;height:100px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid #F0E6DC;padding:14px 28px;display:flex;align-items:center}
.btn-send{width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,#FB923C,#E8623D);color:#fff;font-weight:800;text-align:center;box-shadow:0 10px 24px rgba(232,98,61,.35)}
</style></head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span></div>
<div class="content">
<div class="flex items-center gap-3 mt-2 mb-5">
 <div class="w-9 h-9 rounded-full bg-white shadow flex items-center justify-center"><i class="fas fa-arrow-left text-sm"></i></div>
 <h1 class="text-xl font-bold">New Memory</h1>
</div>
<div class="rounded-[24px] overflow-hidden relative" style="height:220px">
 <img src="https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?w=800&q=80" class="w-full h-full object-cover">
 <div class="absolute inset-0" style="background:linear-gradient(to top,rgba(36,28,21,.6),transparent 50%)"></div>
 <span class="absolute bottom-3 left-4 text-white text-xs font-bold bg-black/30 px-2.5 py-1 rounded-full"><i class="fas fa-image mr-1"></i>Selected photo</span>
</div>
<div class="flex gap-2.5 mt-3 overflow-x-auto">
 <img src="https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?w=200&q=80" class="w-16 h-16 rounded-xl object-cover ring-2 ring-[#E8623D]">
 <img src="https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=200&q=80" class="w-16 h-16 rounded-xl object-cover opacity-70">
 <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=200&q=80" class="w-16 h-16 rounded-xl object-cover opacity-70">
 <img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=200&q=80" class="w-16 h-16 rounded-xl object-cover opacity-70">
 <div class="w-16 h-16 rounded-xl bg-white border-2 border-dashed border-[#E4C9BA] flex items-center justify-center flex-shrink-0"><i class="fas fa-camera text-[#E4C9BA]"></i></div>
</div>
<p class="text-xs font-bold text-[#B98F79] uppercase mt-6 mb-2">Add a memory note</p>
<div class="card">
 <textarea class="w-full text-sm outline-none resize-none" rows="3" style="color:#241C15">This was our trip to the lake, summer 2019! You made us pancakes every morning. Love, Sarah 💛</textarea>
</div>
<p class="text-xs font-bold text-[#B98F79] uppercase mt-6 mb-2">Puzzle difficulty</p>
<div class="flex gap-2.5">
 <div class="chip active">Easy &middot; 6 pieces</div>
 <div class="chip">Medium &middot; 9</div>
 <div class="chip">Hard &middot; 12</div>
</div>
<p class="text-xs font-bold text-[#B98F79] uppercase mt-6 mb-2">Sending to</p>
<div class="card flex items-center gap-3">
 <img src="https://images.unsplash.com/photo-1607990283143-e81e7a2c9349?w=200&q=80" class="w-11 h-11 rounded-full object-cover">
 <div class="flex-1"><p class="text-sm font-bold">Eleanor Sun</p><p class="text-[11px] text-[#B98F79]">Mom &middot; usually plays in the morning</p></div>
 <i class="fas fa-chevron-right text-[#E4C9BA]"></i>
</div>
</div>
<div class="bottom-bar"><div class="btn-send">Send Memory <i class="fas fa-paper-plane ml-1"></i></div></div>
</div></body></html>
