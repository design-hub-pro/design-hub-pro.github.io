<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Memories</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FFFBF0;width:100%;height:100%;margin:0;overflow:hidden;color:#241C15}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:17px;font-weight:700}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px - 100px);overflow-y:auto;padding:0 28px 20px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:100px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid #F0E6DC;display:flex;justify-content:space-around;padding-top:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;color:#C9A99A;font-size:13px;font-weight:700}.tab.active{color:#E8623D}.tab i{font-size:28px}
.tile{border-radius:22px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(232,98,61,.12)}
.tile img{width:100%;height:100%;object-fit:cover}
</style></head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1.5"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-base"></i></span></div>
<div class="content">
<h1 class="text-[32px] font-black mt-2 mb-1">My Memories</h1>
<p class="text-base font-bold text-[#B98F79] mb-5">7 found together</p>
<div class="grid grid-cols-2 gap-4">
 <div><div class="tile" style="height:170px"><img src="https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=600&q=80"><div class="absolute bottom-0 inset-x-0 p-3" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p class="text-white text-sm font-bold">Beach Day</p></div></div></div>
 <div><div class="tile" style="height:170px"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&q=80"><div class="absolute bottom-0 inset-x-0 p-3" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p class="text-white text-sm font-bold">Lake House</p></div></div></div>
 <div><div class="tile" style="height:170px"><img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=600&q=80"><div class="absolute bottom-0 inset-x-0 p-3" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p class="text-white text-sm font-bold">Anniversary</p></div></div></div>
 <div><div class="tile" style="height:170px"><img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=600&q=80"><div class="absolute bottom-0 inset-x-0 p-3" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p class="text-white text-sm font-bold">Family Picnic</p></div></div></div>
 <div><div class="tile" style="height:170px"><img src="https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?w=600&q=80"><div class="absolute bottom-0 inset-x-0 p-3" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p class="text-white text-sm font-bold">Grandkids</p></div></div></div>
 <div><div class="tile flex items-center justify-center" style="height:170px;background:#F3E7D9"><div class="text-center text-[#D9B99E]"><i class="fas fa-lock text-2xl"></i><p class="text-xs font-bold mt-1">2 more waiting</p></div></div></div>
</div>
</div>
<div class="tab-bar">
 <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
 <div class="tab active"><i class="fas fa-images"></i><span>Memories</span></div>
 <div class="tab"><i class="fas fa-heart"></i><span>Family</span></div>
</div>
</div></body></html>
