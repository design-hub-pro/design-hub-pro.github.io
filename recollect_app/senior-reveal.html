<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Revealed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#1A140F;width:100%;height:100%;margin:0;overflow:hidden;color:#fff}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:17px;font-weight:700;position:relative;z-index:20}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.photo{position:absolute;inset:0}
.photo img{width:100%;height:100%;object-fit:cover}
.spark{position:absolute;color:#FFD9A8;font-size:18px;opacity:.9}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(15deg)}}
.spark{animation:float 3s ease-in-out infinite}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:24px 28px 28px;background:linear-gradient(180deg,transparent,rgba(26,20,15,.75) 20%,#1A140F 55%)}
.btn-lg{padding:16px;border-radius:18px;font-weight:800;font-size:16px;text-align:center}
.g-warm{background:linear-gradient(135deg,#FB923C,#E8623D 60%,#DB2763)}
</style></head><body><div class="screen">
<div class="photo"><img src="https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=1000&q=80"></div>
<i class="fas fa-sparkle spark" style="top:80px;left:40px;animation-delay:.2s"></i>
<i class="fas fa-sparkle spark" style="top:130px;right:50px;font-size:12px;animation-delay:.8s"></i>
<i class="fas fa-sparkle spark" style="top:220px;left:80px;font-size:14px;animation-delay:1.4s"></i>
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1.5"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-base"></i></span></div>
<div class="sheet">
 <span class="bg-white/20 text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"><i class="fas fa-check mr-1"></i>Memory Recovered</span>
 <p class="text-2xl font-black mt-3 leading-snug">"This was our trip to the lake, summer 2019! You made us pancakes every morning."</p>
 <p class="text-base font-semibold mt-2 opacity-80">— Love, Sarah 💛</p>
 <div class="flex gap-3 mt-6">
  <div class="flex-1 btn-lg bg-white/15 backdrop-blur"><i class="fas fa-volume-high mr-2"></i>Listen</div>
  <div class="flex-1 btn-lg g-warm"><i class="fas fa-heart mr-2"></i>Send a Smile</div>
 </div>
 <p class="text-center text-sm font-bold mt-5 opacity-70">View more memories</p>
</div>
</div></body></html>
