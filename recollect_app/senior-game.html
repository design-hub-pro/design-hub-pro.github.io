<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover the Photo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{-webkit-tap-highlight-color:transparent}*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
html,body{height:100%}body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#FFFBF0;width:100%;height:100%;margin:0;overflow:hidden;color:#241C15}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;font-size:17px;font-weight:700}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.content{height:calc(100% - 59px);overflow-y:auto;padding:0 28px 24px}
.g-warm{background:linear-gradient(135deg,#FB923C,#E8623D 60%,#DB2763)}
.puz{width:336px;height:336px;margin:0 auto;display:grid;grid-template-columns:repeat(3,108px);grid-template-rows:repeat(3,108px);gap:6px}
.cell{border-radius:16px;background-image:url('https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=1000&q=80');background-size:336px 336px;position:relative;overflow:hidden}
.unsolved{background-image:none!important;background:#F1E4D6;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#D9B99E}
.next{outline:3px dashed #E8623D;outline-offset:-3px}
.next::after{content:'';position:absolute;inset:0;background:#E8623D;opacity:.12}
@keyframes pulse2{0%,100%{opacity:.12}50%{opacity:.28}}
.next::after{animation:pulse2 1.6s infinite}
.ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(#E8623D 0turn .56turn,#F1E4D6 0turn);display:flex;align-items:center;justify-content:center}
.ring-in{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#E8623D}
.piece{width:64px;height:64px;border-radius:16px;background-image:url('https://images.unsplash.com/photo-1591382696684-38c427c7547a?w=1000&q=80');background-size:192px 192px;flex-shrink:0}
</style></head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="flex items-center gap-1.5"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-base"></i></span></div>
<div class="content">
<div class="flex items-center justify-between mt-2 mb-5">
 <div class="w-11 h-11 rounded-full bg-white shadow flex items-center justify-center"><i class="fas fa-arrow-left text-base"></i></div>
 <h1 class="text-xl font-black">Recover the Photo</h1>
 <div class="ring"><div class="ring-in">5/9</div></div>
</div>
<div class="puz">
 <div class="cell" style="background-position:0 0"></div>
 <div class="cell unsolved">2</div>
 <div class="cell" style="background-position:-114px 0"></div>
 <div class="cell" style="background-position:0 -114px"></div>
 <div class="cell unsolved next"><i class="fas fa-hand-pointer"></i></div>
 <div class="cell" style="background-position:-228px -114px"></div>
 <div class="cell unsolved">7</div>
 <div class="cell" style="background-position:-114px -228px"></div>
 <div class="cell" style="background-position:-228px -228px"></div>
</div>
<p class="text-center text-lg font-black mt-6">You're doing great, Eleanor! 🎉</p>
<p class="text-center text-sm text-[#B98F79] font-semibold mt-1">Tap a piece below, then tap the glowing spot</p>
<div class="flex items-center justify-center gap-4 mt-5">
 <div class="piece ring-2 ring-[#E8623D]" style="background-position:-64px -64px"></div>
 <div class="piece opacity-60" style="background-position:0 -128px"></div>
 <div class="piece opacity-60" style="background-position:-128px 0"></div>
</div>
<div class="mt-7 mx-6 py-4 rounded-2xl text-center font-bold text-base" style="background:#FBF0E4;color:#B9754B"><i class="fas fa-lightbulb mr-2"></i>Need a hint?</div>
</div>
</div></body></html>
