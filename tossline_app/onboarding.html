<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#0E1410;width:100%;height:100%;margin:0;overflow-y:auto}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.step-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.25)}
.step-dot.active{background:#D6FF3F;width:18px;border-radius:4px}
.sensor-row{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:14px}
.icon-tile{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px}
</style>
</head>
<body>
<div style="position:relative;height:460px;overflow:hidden">
  <img src="https://images.unsplash.com/photo-1530915365347-e35b749a0381?w=900&q=85" style="width:100%;height:100%;object-fit:cover;object-position:center 30%">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,20,16,0.25) 0%,rgba(14,20,16,0.2) 40%,rgba(14,20,16,0.92) 82%,#0E1410 100%)"></div>
  <div class="dynamic-island"></div>
  <div style="height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:20;padding-bottom:6px">
    <span style="font-size:15px;font-weight:600;color:#fff">9:41</span>
    <span style="display:flex;gap:6px;color:#fff"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div style="position:absolute;bottom:28px;left:0;right:0;padding:0 28px">
    <div style="display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:rgba(214,255,63,0.18);border-radius:30px;font-size:11px;font-weight:800;color:#D6FF3F;margin-bottom:14px">
      <i class="fas fa-satellite-dish text-[10px]"></i>PAIRED &amp; CALIBRATED
    </div>
    <h1 style="font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.08">Toss a straight<br>line, every time.</h1>
    <p style="font-size:14px;color:rgba(255,255,255,0.75);margin-top:10px;max-width:320px;line-height:1.5">TossLine's Smart Band reads your arm path in real time and stops the circling before it starts.</p>
  </div>
</div>

<div style="padding:22px 28px 36px">
  <div class="sensor-row flex items-center gap-3 mb-6">
    <div class="icon-tile" style="background:rgba(214,255,63,0.15)"><i class="fas fa-hand-fist" style="color:#D6FF3F"></i></div>
    <div class="flex-1">
      <p class="text-[13px] font-bold text-white">Smart Band</p>
      <p class="text-[11px] text-gray-400">Connected · reads toss-arm path in 3D</p>
    </div>
    <i class="fas fa-circle-check text-lg" style="color:#22C55E"></i>
  </div>

  <div class="grid grid-cols-3 gap-2.5 mb-7">
    <div style="background:rgba(255,255,255,0.05);border-radius:16px;padding:12px" class="text-center">
      <i class="fas fa-hand-point-up text-sm" style="color:#D6FF3F"></i>
      <p class="text-[10px] text-gray-300 font-semibold mt-2 leading-tight">Dominant hand set</p>
    </div>
    <div style="background:rgba(255,255,255,0.05);border-radius:16px;padding:12px" class="text-center">
      <i class="fas fa-ruler-vertical text-sm" style="color:#D6FF3F"></i>
      <p class="text-[10px] text-gray-300 font-semibold mt-2 leading-tight">Reach calibrated</p>
    </div>
    <div style="background:rgba(255,255,255,0.05);border-radius:16px;padding:12px" class="text-center">
      <i class="fas fa-bullseye text-sm" style="color:#D6FF3F"></i>
      <p class="text-[10px] text-gray-300 font-semibold mt-2 leading-tight">Serve types loaded</p>
    </div>
  </div>

  <a href="session-setup.html" style="text-decoration:none">
    <button class="w-full rounded-2xl py-4 font-black text-[15px]" style="background:linear-gradient(90deg,#D6FF3F,#9FD400);color:#0F1B0A;box-shadow:0 12px 26px rgba(159,212,0,0.3)">Set Up Your First Serve</button>
  </a>
  <div class="flex items-center justify-center gap-1.5 mt-6">
    <span class="step-dot active"></span><span class="step-dot"></span><span class="step-dot"></span>
  </div>
</div>
</body>
</html>
