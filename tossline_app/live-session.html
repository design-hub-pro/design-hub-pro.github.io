<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Live Session</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#000;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:30}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#fff;position:relative;z-index:25}
.cam-bg{position:absolute;inset:0}
.cam-bg img{width:100%;height:100%;object-fit:cover}
.cam-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.05) 25%,rgba(0,0,0,0.1) 65%,rgba(0,0,0,0.75) 100%)}
.glass{background:rgba(15,20,15,0.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.12)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#FF4757;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div class="screen">
  <div class="cam-bg"><img src="https://images.unsplash.com/photo-1595435742656-5272d0b3fa82?w=700&q=80"></div>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>

  <!-- Top controls -->
  <div class="relative z-20 flex items-center justify-between px-7 mt-3">
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fas fa-xmark text-white"></i></div>
    <div class="glass rounded-full px-4 py-2 flex items-center gap-2">
      <span class="pulse-dot"></span>
      <span class="text-white text-[12px] font-bold">REC · 00:42</span>
    </div>
    <div class="glass rounded-full px-3 py-2 flex items-center gap-1.5">
      <span class="text-[10px] font-bold" style="color:#8FB4FF">FLAT</span>
      <span class="text-white/40 text-[10px]">·</span>
      <span class="text-[10px] font-bold" style="color:#5FE0CD">T</span>
    </div>
  </div>

  <!-- Target corridor + traced path overlay -->
  <svg viewBox="0 0 300 500" class="absolute z-10" style="top:110px;left:50%;transform:translateX(-50%);width:300px;height:500px">
    <rect x="120" y="20" width="60" height="360" rx="14" fill="rgba(34,197,94,0.08)" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M150 420 C 95 360, 80 260, 130 190 C 165 145, 175 190, 145 165" stroke="#FF4757" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="165" r="10" fill="#FF4757" stroke="#fff" stroke-width="3"/>
    <circle cx="150" cy="420" r="6" fill="#fff"/>
  </svg>

  <!-- Warning banner -->
  <div class="absolute z-20 left-7 right-7" style="top:128px">
    <div class="rounded-2xl px-4 py-3 flex items-center gap-3" style="background:rgba(255,71,87,0.16);border:1px solid rgba(255,71,87,0.45)">
      <i class="fas fa-triangle-exclamation" style="color:#FF4757"></i>
      <div>
        <p class="text-white text-[13px] font-black leading-none">Circular arm path detected</p>
        <p class="text-[11px] mt-1" style="color:#FFC2C8">Lift straight up — don't swing the elbow out</p>
      </div>
    </div>
  </div>

  <!-- Bottom panel -->
  <div class="absolute z-20 left-0 right-0 bottom-0 px-7 pb-10 pt-6" style="background:linear-gradient(180deg,transparent,rgba(0,0,0,0.7) 40%,rgba(0,0,0,0.88))">
    <div class="flex items-center justify-between mb-4">
      <div>
        <p class="text-[11px] font-bold text-white/50 uppercase tracking-widest">Toss</p>
        <p class="text-3xl font-black text-white">7<span class="text-base text-white/40"> / 10</span></p>
      </div>
      <div class="flex gap-1.5">
        <div class="w-6 h-2 rounded-full" style="background:#22C55E"></div>
        <div class="w-6 h-2 rounded-full" style="background:#22C55E"></div>
        <div class="w-6 h-2 rounded-full" style="background:#FF4757"></div>
        <div class="w-6 h-2 rounded-full" style="background:#22C55E"></div>
        <div class="w-6 h-2 rounded-full" style="background:#FF4757"></div>
        <div class="w-6 h-2 rounded-full" style="background:rgba(255,255,255,0.2)"></div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button class="flex-1 rounded-2xl py-4 font-black text-[14px] text-white" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2)"><i class="fas fa-pause mr-2"></i>Pause</button>
      <button class="flex-1 rounded-2xl py-4 font-black text-[14px]" style="background:#FF4757;color:#fff;box-shadow:0 10px 24px rgba(255,71,87,0.35)"><i class="fas fa-stop mr-2"></i>End Session</button>
    </div>
  </div>
</div>
</body>
</html>
