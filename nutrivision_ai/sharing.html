<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVision AI - Sharing Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; }
        .share-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
            position: relative;
            background: #000;
        }
        .share-frame iframe {
            width: 1080px;
            height: 1080px;
            border: none;
            transform-origin: top left;
        }
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div style="text-align: center; padding: 60px 40px 40px;">
        <div style="display: inline-flex; align-items: center; gap: 8px; background: #ecfdf5; color: #059669; padding: 8px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; margin-bottom: 20px;">
            <i class="fas fa-share-nodes"></i>
            <span>WeChat Moments — 9 Images</span>
        </div>
        <h1 style="font-size: 48px; font-weight: 900; color: #111; letter-spacing: -1.5px; margin-bottom: 8px;">
            Nutri<span class="gradient-text">Vision</span> AI Sharing Kit
        </h1>
        <p style="font-size: 18px; color: #6b7280;">Screenshot each image below for your WeChat post</p>
    </div>

    <!-- 3x3 Grid -->
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 40px 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
        <!-- Image 1 -->
        <div>
            <div class="share-frame" id="frame1"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">1 / 9 — Hero</p>
        </div>
        <!-- Image 2 -->
        <div>
            <div class="share-frame" id="frame2"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">2 / 9 — AI Scanner</p>
        </div>
        <!-- Image 3 -->
        <div>
            <div class="share-frame" id="frame3"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">3 / 9 — Metabolic Twin</p>
        </div>
        <!-- Image 4 -->
        <div>
            <div class="share-frame" id="frame4"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">4 / 9 — Tech Architecture</p>
        </div>
        <!-- Image 5 -->
        <div>
            <div class="share-frame" id="frame5"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">5 / 9 — AI Coach</p>
        </div>
        <!-- Image 6 -->
        <div>
            <div class="share-frame" id="frame6"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">6 / 9 — Market Opportunity</p>
        </div>
        <!-- Image 7 -->
        <div>
            <div class="share-frame" id="frame7"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">7 / 9 — All Screens</p>
        </div>
        <!-- Image 8 -->
        <div>
            <div class="share-frame" id="frame8"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">8 / 9 — How It Works</p>
        </div>
        <!-- Image 9 -->
        <div>
            <div class="share-frame" id="frame9"></div>
            <p style="text-align: center; font-size: 13px; color: #9ca3af; margin-top: 12px; font-weight: 600;">9 / 9 — Vision</p>
        </div>
    </div>

    <script>
        const sources = [
            'share-1-hero.html',
            'share-2-scanner.html',
            'share-3-twin.html',
            'share-4-techstack.html',
            'share-5-coach.html',
            'share-6-metrics.html',
            'share-7-screens.html',
            'share-8-journey.html',
            'share-9-vision.html'
        ];

        function setIframeScales() {
            document.querySelectorAll('.share-frame').forEach((frame, i) => {
                // Remove old iframe if any
                const old = frame.querySelector('iframe');
                if (old) old.remove();

                const iframe = document.createElement('iframe');
                iframe.src = sources[i];
                iframe.scrolling = 'no';
                iframe.style.width = '1080px';
                iframe.style.height = '1080px';
                iframe.style.border = 'none';
                iframe.style.transformOrigin = 'top left';

                const frameWidth = frame.clientWidth;
                const scale = frameWidth / 1080;
                iframe.style.transform = `scale(${scale})`;

                frame.appendChild(iframe);
            });
        }

        window.addEventListener('load', setIframeScales);
        window.addEventListener('resize', setIframeScales);
    </script>
</body>
</html>
