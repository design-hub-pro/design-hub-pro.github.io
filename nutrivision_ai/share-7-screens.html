<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share 7 - All Screens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1080px; background: #050510; overflow: hidden; position: relative; }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .phone-frame {
            width: 200px; height: 427px; border-radius: 28px; padding: 6px;
            background: #1a1a1a; box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        }
        .phone-screen { width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: #000; }
        .phone-screen iframe { width: 436px; height: 932px; border: none; transform: scale(0.431); transform-origin: top left; }
    </style>
</head>
<body>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.06), transparent 60%);"></div>

    <div style="position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <!-- Title -->
        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="font-size: 36px; font-weight: 800; color: white; letter-spacing: -1px;">
                7 Screens. One <span class="gradient-text">Intelligent</span> Experience.
            </h2>
        </div>

        <!-- Top Row: 4 phones -->
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="home.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">Dashboard</div>
            </div>
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="scan.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">AI Scanner</div>
            </div>
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="insights.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">Insights</div>
            </div>
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="mealplan.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">Meal Plan</div>
            </div>
        </div>

        <!-- Bottom Row: 3 phones centered -->
        <div style="display: flex; gap: 20px;">
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="twin.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">Metabolic Twin</div>
            </div>
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="coach.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">AI Coach</div>
            </div>
            <div style="text-align: center;">
                <div class="phone-frame">
                    <div class="phone-screen"><iframe src="profile.html" scrolling="no"></iframe></div>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 10px;">Profile</div>
            </div>
        </div>
    </div>
</body>
</html>
