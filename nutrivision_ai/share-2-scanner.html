<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share 2 - AI Food Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1080px; background: #000; overflow: hidden; position: relative; }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        .phone-frame { width: 340px; height: 726px; border-radius: 46px; padding: 10px; background: #1a1a1a; box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05); }
        .phone-screen { width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #000; }
        .phone-screen iframe { width: 436px; height: 932px; border: none; transform: scale(0.733); transform-origin: top left; }
        @keyframes scanPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .scan-pulse { animation: scanPulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Background -->
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(6,182,212,0.12), transparent 60%), radial-gradient(ellipse at 30% 70%, rgba(139,92,246,0.1), transparent 50%);"></div>

    <div style="position: relative; z-index: 10; width: 100%; height: 100%; display: flex;">
        <!-- Left Side - Text -->
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 80px; padding-right: 40px;">
            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); border-radius: 999px; padding: 8px 18px; width: fit-content; margin-bottom: 24px;">
                <i class="fas fa-camera" style="color: #06b6d4; font-size: 12px;"></i>
                <span style="color: #06b6d4; font-size: 13px; font-weight: 600;">COMPUTER VISION</span>
            </div>

            <h2 style="font-size: 48px; font-weight: 800; color: white; line-height: 1.1; letter-spacing: -1px; margin-bottom: 20px;">
                Point. Scan.<br><span class="gradient-text">Understand.</span>
            </h2>

            <p style="color: #6b7280; font-size: 17px; line-height: 1.6; margin-bottom: 40px; max-width: 380px;">
                Multi-item detection with confidence scoring. Instant macro breakdown. No manual logging ever again.
            </p>

            <!-- Feature Pills -->
            <div style="display: flex; flex-direction: column; gap: 14px;">
                <div class="glass" style="border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; max-width: 380px;">
                    <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #06b6d4, #0891b2); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i class="fas fa-crosshairs" style="color: white; font-size: 18px;"></i>
                    </div>
                    <div>
                        <div style="font-size: 15px; font-weight: 700; color: white;">Real-time Detection</div>
                        <div style="font-size: 12px; color: #6b7280; margin-top: 2px;">4+ items identified simultaneously</div>
                    </div>
                </div>
                <div class="glass" style="border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; max-width: 380px;">
                    <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #8b5cf6, #7c3aed); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i class="fas fa-percentage" style="color: white; font-size: 18px;"></i>
                    </div>
                    <div>
                        <div style="font-size: 15px; font-weight: 700; color: white;">98% Accuracy</div>
                        <div style="font-size: 12px; color: #6b7280; margin-top: 2px;">Trained on 10M+ food images</div>
                    </div>
                </div>
                <div class="glass" style="border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; max-width: 380px;">
                    <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #f43f5e, #e11d48); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i class="fas fa-bolt" style="color: white; font-size: 18px;"></i>
                    </div>
                    <div>
                        <div style="font-size: 15px; font-weight: 700; color: white;">< 0.3s Latency</div>
                        <div style="font-size: 12px; color: #6b7280; margin-top: 2px;">On-device neural engine processing</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Phone -->
        <div style="display: flex; align-items: center; justify-content: center; padding-right: 60px;">
            <div class="phone-frame" style="transform: perspective(1200px) rotateY(-8deg);">
                <div class="phone-screen">
                    <iframe src="scan.html" scrolling="no"></iframe>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
