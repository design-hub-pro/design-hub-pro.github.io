<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share 1 - Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1080px; height: 1080px;
            background: #000;
            overflow: hidden;
            position: relative;
        }
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
        }
        .phone-frame {
            width: 260px;
            height: 554px;
            border-radius: 36px;
            padding: 8px;
            background: #1a1a1a;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            overflow: hidden;
            background: #000;
        }
        .phone-screen iframe {
            width: 436px;
            height: 932px;
            border: none;
            transform: scale(0.559);
            transform-origin: top left;
        }
    </style>
</head>
<body>
    <!-- Background Orbs -->
    <div class="glow-orb" style="width: 500px; height: 500px; background: #06b6d4; top: -100px; right: -100px;"></div>
    <div class="glow-orb" style="width: 400px; height: 400px; background: #8b5cf6; bottom: -50px; left: -50px;"></div>
    <div class="glow-orb" style="width: 300px; height: 300px; background: #f43f5e; bottom: 100px; right: 200px; opacity: 0.15;"></div>

    <!-- Content -->
    <div style="position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <!-- Top Badge -->
        <div style="position: absolute; top: 60px; left: 50%; transform: translateX(-50%);">
            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); border-radius: 999px; padding: 10px 24px;">
                <i class="fas fa-sparkles" style="color: #06b6d4; font-size: 14px;"></i>
                <span style="color: #06b6d4; font-size: 16px; font-weight: 600;">AI-Powered Nutritional Intelligence</span>
            </div>
        </div>

        <!-- Title -->
        <div style="text-align: center; margin-bottom: 50px; margin-top: -30px;">
            <h1 style="font-size: 72px; font-weight: 900; color: white; letter-spacing: -2px; line-height: 1;">
                Nutri<span class="gradient-text">Vision</span>
            </h1>
            <h1 style="font-size: 72px; font-weight: 900; letter-spacing: -2px; line-height: 1;" class="gradient-text">AI</h1>
            <p style="color: #6b7280; font-size: 18px; margin-top: 16px; max-width: 500px;">
                Your metabolic digital twin meets<br>real-time food intelligence
            </p>
        </div>

        <!-- 3 Phones -->
        <div style="display: flex; align-items: center; gap: 24px; margin-top: -10px;">
            <!-- Left phone tilted -->
            <div class="phone-frame" style="transform: perspective(1200px) rotateY(12deg) rotateX(2deg) scale(0.88); opacity: 0.85;">
                <div class="phone-screen">
                    <iframe src="insights.html" scrolling="no"></iframe>
                </div>
            </div>
            <!-- Center phone -->
            <div class="phone-frame" style="transform: translateY(-20px); z-index: 5; box-shadow: 0 40px 80px rgba(6,182,212,0.15), 0 0 0 1px rgba(255,255,255,0.08);">
                <div class="phone-screen">
                    <iframe src="home.html" scrolling="no"></iframe>
                </div>
            </div>
            <!-- Right phone tilted -->
            <div class="phone-frame" style="transform: perspective(1200px) rotateY(-12deg) rotateX(2deg) scale(0.88); opacity: 0.85;">
                <div class="phone-screen">
                    <iframe src="scan.html" scrolling="no"></iframe>
                </div>
            </div>
        </div>

        <!-- Bottom Features -->
        <div style="position: absolute; bottom: 55px; display: flex; gap: 36px; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-dna" style="color: #06b6d4; font-size: 16px;"></i>
                <span style="color: #9ca3af; font-size: 14px;">Metabolic Twin</span>
            </div>
            <div style="width: 4px; height: 4px; background: #374151; border-radius: 50%;"></div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-camera" style="color: #8b5cf6; font-size: 16px;"></i>
                <span style="color: #9ca3af; font-size: 14px;">AI Food Scan</span>
            </div>
            <div style="width: 4px; height: 4px; background: #374151; border-radius: 50%;"></div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-brain" style="color: #f43f5e; font-size: 16px;"></i>
                <span style="color: #9ca3af; font-size: 14px;">Predictive Health</span>
            </div>
        </div>
    </div>
</body>
</html>
