<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share 3 - Metabolic Twin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1080px; background: #050510; overflow: hidden; position: relative; }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
        @keyframes orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        .orbit-anim { animation: orbit 20s linear infinite; }
        .pulse-anim { animation: pulse 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- Grid Background -->
    <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(6,182,212,0.06) 1px, transparent 1px); background-size: 40px 40px;"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(6,182,212,0.08), transparent 60%);"></div>

    <div style="position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <!-- Title -->
        <div style="text-align: center; margin-bottom: 50px;">
            <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); border-radius: 999px; padding: 8px 18px; margin-bottom: 20px;">
                <i class="fas fa-atom" style="color: #8b5cf6; font-size: 12px;"></i>
                <span style="color: #8b5cf6; font-size: 13px; font-weight: 600;">BREAKTHROUGH TECHNOLOGY</span>
            </div>
            <h2 style="font-size: 52px; font-weight: 800; color: white; line-height: 1.1; letter-spacing: -1px;">
                Your <span class="gradient-text">Metabolic</span>
            </h2>
            <h2 style="font-size: 52px; font-weight: 800; color: white; line-height: 1.1; letter-spacing: -1px;">
                Digital Twin
            </h2>
            <p style="color: #6b7280; font-size: 17px; margin-top: 16px;">A living simulation of your body's nutritional response</p>
        </div>

        <!-- Central Visualization -->
        <div style="position: relative; width: 400px; height: 400px; margin-bottom: 50px;">
            <!-- Orbit Rings -->
            <div class="orbit-anim" style="position: absolute; inset: 0; border: 1px solid rgba(6,182,212,0.08); border-radius: 50%;"></div>
            <div class="orbit-anim" style="position: absolute; inset: 40px; border: 1px solid rgba(6,182,212,0.12); border-radius: 50%; animation-duration: 15s; animation-direction: reverse;"></div>
            <div class="orbit-anim" style="position: absolute; inset: 80px; border: 1px solid rgba(6,182,212,0.16); border-radius: 50%; animation-duration: 10s;"></div>
            <div style="position: absolute; inset: 120px; border: 1px solid rgba(6,182,212,0.08); border-radius: 50%;"></div>

            <!-- Center Core -->
            <div class="pulse-anim" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; background: radial-gradient(circle, rgba(6,182,212,0.3), transparent); border-radius: 50%;"></div>
            <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(6,182,212,0.3);">
                <i class="fas fa-dna" style="color: white; font-size: 32px;"></i>
            </div>

            <!-- Orbit Nodes -->
            <div class="orbit-anim" style="position: absolute; inset: 0;">
                <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%);">
                    <div class="glass" style="width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-heart-pulse" style="color: #f43f5e; font-size: 20px;"></i>
                    </div>
                </div>
            </div>
            <div class="orbit-anim" style="position: absolute; inset: 0; animation-duration: 15s; animation-direction: reverse;">
                <div style="position: absolute; bottom: 20px; right: 20px;">
                    <div class="glass" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-brain" style="color: #8b5cf6; font-size: 18px;"></i>
                    </div>
                </div>
            </div>
            <div class="orbit-anim" style="position: absolute; inset: 0; animation-duration: 25s;">
                <div style="position: absolute; top: 60px; left: 0;">
                    <div class="glass" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-fire-flame-curved" style="color: #f59e0b; font-size: 18px;"></i>
                    </div>
                </div>
            </div>
            <div class="orbit-anim" style="position: absolute; inset: 0; animation-duration: 18s; animation-direction: reverse;">
                <div style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);">
                    <div class="glass" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-shield-virus" style="color: #06b6d4; font-size: 18px;"></i>
                    </div>
                </div>
            </div>
            <div class="orbit-anim" style="position: absolute; inset: 0; animation-duration: 22s;">
                <div style="position: absolute; top: 50%; right: 0; transform: translateY(-50%);">
                    <div class="glass" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-lungs" style="color: #10b981; font-size: 18px;"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Stats -->
        <div style="display: flex; gap: 24px;">
            <div class="glass" style="border-radius: 20px; padding: 22px 32px; text-align: center;">
                <div style="font-size: 36px; font-weight: 800; color: white;">5</div>
                <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">Body Systems</div>
            </div>
            <div class="glass" style="border-radius: 20px; padding: 22px 32px; text-align: center;">
                <div style="font-size: 36px; font-weight: 800;" class="gradient-text">24/7</div>
                <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">Live Sync</div>
            </div>
            <div class="glass" style="border-radius: 20px; padding: 22px 32px; text-align: center;">
                <div style="font-size: 36px; font-weight: 800; color: white;">87<span style="font-size: 20px; color: #6b7280;">%</span></div>
                <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">Prediction Accuracy</div>
            </div>
            <div class="glass" style="border-radius: 20px; padding: 22px 32px; text-align: center;">
                <div style="font-size: 36px; font-weight: 800; color: white;">∞</div>
                <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">Simulations</div>
            </div>
        </div>
    </div>
</body>
</html>
