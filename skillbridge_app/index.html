<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - AI-Powered Tutor Matching Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #ffffff; }
        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #fff;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .screens-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 48px;
            max-width: 1600px;
            margin: 0 auto;
            justify-items: center;
        }
        .screen-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .screen-label {
            font-size: 15px;
            font-weight: 600;
            color: #6B7280;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="text-center pt-16 pb-12 px-6">
        <div class="flex items-center justify-center gap-3 mb-4">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center">
                <i class="fas fa-graduation-cap text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-extrabold text-gray-900 mb-3">SkillBridge</h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto">AI-Powered Tutor Matching Platform</p>
        <div class="flex items-center justify-center gap-6 mt-6">
            <span class="text-sm text-gray-400"><i class="fas fa-brain mr-1 text-indigo-500"></i> AI Smart Matching</span>
            <span class="text-sm text-gray-400"><i class="fas fa-exchange-alt mr-1 text-amber-500"></i> Skill Exchange</span>
            <span class="text-sm text-gray-400"><i class="fas fa-heart mr-1 text-pink-500"></i> Community Impact</span>
        </div>
    </div>

    <!-- Screens -->
    <div class="px-8 pb-20">
        <div class="screens-grid">
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="home.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Home</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="search.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Search Tutors</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="ai_match.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">AI Match</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="tutor_profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Tutor Profile</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="booking.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Book Session</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="learning_plan.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">AI Learning Plan</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="skill_exchange.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Skill Exchange</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="progress.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Learning Progress</span>
            </div>
            <div class="screen-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="profile.html" scrolling="no"></iframe>
                    </div>
                </div>
                <span class="screen-label">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
