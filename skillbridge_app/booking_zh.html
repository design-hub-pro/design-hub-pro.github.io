<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SkillBridge - 预约课程</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        indigo: {
          500: '#6366F1',
          600: '#4F46E5',
          700: '#4338CA',
          50: '#EEF2FF',
          100: '#E0E7FF',
        },
        amber: {
          400: '#FBBF24',
          500: '#F59E0B',
        }
      },
      fontFamily: {
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
      }
    }
  }
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F8F9FC;
  }

  .date-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .time-slot { transition: all 0.2s ease; }
  .time-slot.selected { background: #4F46E5; color: white; border-color: #4F46E5; }
  .pill { transition: all 0.2s ease; }
  .pill.selected { background: #4F46E5; color: white; }
  .pill:not(.selected) { background: #F1F5F9; color: #64748B; }
  .duration-pill { transition: all 0.2s ease; }
  .duration-pill.selected { background: #4F46E5; color: white; }
  .duration-pill:not(.selected) { background: #F1F5F9; color: #64748B; }
</style>
</head>
<body>

<!-- Status Bar & Dynamic Island -->
<div class="w-full bg-white" style="padding-top: 12px;">
  <div class="flex justify-between items-center px-8 pt-1 pb-0" style="height: 20px;">
    <span class="text-sm font-semibold" style="font-size: 15px;">9:41</span>
    <div class="absolute left-1/2 -translate-x-1/2" style="top: 10px;">
      <div style="width: 126px; height: 37px; background: #000; border-radius: 20px;"></div>
    </div>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs"></i>
      <i class="fas fa-wifi text-xs"></i>
      <i class="fas fa-battery-full text-sm"></i>
    </div>
  </div>
</div>

<!-- Navigation Bar -->
<div class="bg-white px-5 pb-3 flex items-center" style="padding-top: 22px;">
  <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center">
    <i class="fas fa-arrow-left text-gray-700 text-sm"></i>
  </div>
  <h1 class="flex-1 text-center text-lg font-bold text-gray-900 -ml-9">预约课程</h1>
</div>

<!-- Main Content -->
<div class="pb-10" style="padding-left: 28px; padding-right: 28px;">

  <!-- Tutor Mini Card -->
  <div class="bg-white rounded-2xl p-4 mt-4 flex items-center gap-3.5 shadow-sm border border-gray-100">
    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-400 to-indigo-600 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">
      S
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="font-semibold text-gray-900 text-[15px]">Sarah Mitchell</h3>
      <p class="text-gray-500 text-xs mt-0.5">高尔夫教练</p>
    </div>
    <div class="flex items-center gap-1 bg-amber-50 px-2.5 py-1 rounded-full">
      <i class="fas fa-star text-amber-500" style="font-size: 11px;"></i>
      <span class="text-sm font-semibold text-amber-600">4.8</span>
    </div>
  </div>

  <!-- Select Date -->
  <div class="mt-6">
    <h2 class="text-[15px] font-bold text-gray-900 mb-3">选择日期</h2>
    <div class="date-scroll flex gap-2.5 -mx-1 px-1 pb-1">
      <!-- Sat May 3 - selected -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-indigo-600 text-white flex-shrink-0 cursor-pointer">
        <span class="text-[11px] font-medium opacity-80">周六</span>
        <span class="text-xl font-bold mt-0.5">3</span>
        <span class="text-[10px] font-medium opacity-70">5月</span>
      </div>
      <!-- Sun May 4 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周日</span>
        <span class="text-xl font-bold mt-0.5">4</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
      <!-- Mon May 5 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周一</span>
        <span class="text-xl font-bold mt-0.5">5</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
      <!-- Tue May 6 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周二</span>
        <span class="text-xl font-bold mt-0.5">6</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
      <!-- Wed May 7 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周三</span>
        <span class="text-xl font-bold mt-0.5">7</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
      <!-- Thu May 8 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周四</span>
        <span class="text-xl font-bold mt-0.5">8</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
      <!-- Fri May 9 -->
      <div class="flex flex-col items-center justify-center w-[58px] h-[74px] rounded-2xl bg-white border border-gray-200 text-gray-700 flex-shrink-0 cursor-pointer hover:border-indigo-300">
        <span class="text-[11px] font-medium text-gray-400">周五</span>
        <span class="text-xl font-bold mt-0.5">9</span>
        <span class="text-[10px] font-medium text-gray-400">5月</span>
      </div>
    </div>
  </div>

  <!-- Select Time -->
  <div class="mt-6">
    <h2 class="text-[15px] font-bold text-gray-900 mb-3">选择时间</h2>
    <div class="grid grid-cols-2 gap-3">
      <div class="time-slot text-center py-3 rounded-xl border border-gray-200 bg-white text-gray-700 font-medium text-sm cursor-pointer">
        9:00 AM
      </div>
      <div class="time-slot selected text-center py-3 rounded-xl border font-medium text-sm cursor-pointer">
        10:00 AM
      </div>
      <div class="time-slot text-center py-3 rounded-xl border border-gray-200 bg-white text-gray-700 font-medium text-sm cursor-pointer">
        11:00 AM
      </div>
      <div class="time-slot text-center py-3 rounded-xl border border-gray-200 bg-white text-gray-700 font-medium text-sm cursor-pointer">
        2:00 PM
      </div>
    </div>
  </div>

  <!-- Session Type -->
  <div class="mt-6">
    <h2 class="text-[15px] font-bold text-gray-900 mb-3">授课方式</h2>
    <div class="flex gap-3">
      <div class="pill selected flex-1 text-center py-2.5 rounded-xl font-semibold text-sm cursor-pointer">
        <i class="fas fa-map-marker-alt mr-1.5 text-xs"></i>线下面授
      </div>
      <div class="pill flex-1 text-center py-2.5 rounded-xl font-semibold text-sm cursor-pointer">
        <i class="fas fa-video mr-1.5 text-xs"></i>线上授课
      </div>
    </div>
  </div>

  <!-- Location -->
  <div class="mt-5">
    <h2 class="text-[15px] font-bold text-gray-900 mb-3">上课地点</h2>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3.5 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-indigo-50 flex items-center justify-center flex-shrink-0">
        <i class="fas fa-map-pin text-indigo-600 text-sm"></i>
      </div>
      <span class="text-sm font-medium text-gray-800">斯坦福高尔夫球场</span>
      <i class="fas fa-chevron-right text-gray-300 text-xs ml-auto"></i>
    </div>
  </div>

  <!-- Session Duration -->
  <div class="mt-5">
    <h2 class="text-[15px] font-bold text-gray-900 mb-3">课程时长</h2>
    <div class="flex gap-3">
      <div class="duration-pill flex-1 text-center py-2.5 rounded-xl font-semibold text-sm cursor-pointer">
        30分钟
      </div>
      <div class="duration-pill selected flex-1 text-center py-2.5 rounded-xl font-semibold text-sm cursor-pointer">
        60分钟
      </div>
      <div class="duration-pill flex-1 text-center py-2.5 rounded-xl font-semibold text-sm cursor-pointer">
        90分钟
      </div>
    </div>
  </div>

  <!-- Order Summary -->
  <div class="mt-6 bg-indigo-50/70 rounded-2xl p-5 border border-indigo-100">
    <h3 class="text-[15px] font-bold text-gray-900 mb-3">订单详情</h3>
    <div class="flex justify-between items-center mb-2">
      <span class="text-sm text-gray-600">1节高尔夫课程（60分钟）</span>
      <span class="text-sm font-medium text-gray-800">$12.00</span>
    </div>
    <div class="flex justify-between items-center mb-3">
      <span class="text-sm text-gray-600">平台服务费</span>
      <span class="text-sm font-medium text-gray-800">$1.50</span>
    </div>
    <div class="border-t border-indigo-200 pt-3 flex justify-between items-center">
      <span class="text-sm font-bold text-gray-900">合计</span>
      <span class="text-lg font-bold text-indigo-600">$13.50</span>
    </div>
  </div>

  <!-- Confirm Button -->
  <button class="w-full mt-6 mb-4 py-4 bg-indigo-600 text-white font-bold text-base rounded-2xl shadow-lg shadow-indigo-200 active:scale-[0.98] transition-transform">
    确认预约
  </button>

</div>

</body>
</html>
