<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge - 我的进度</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  body { font-family: 'Inter', -apple-system, sans-serif; }
  .gradient-primary { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); }
  .gradient-amber { background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%); }
  .gradient-green { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
  .gradient-ai { background: linear-gradient(135deg, #4F46E5 0%, #6366F1 40%, #8B5CF6 100%); }
  .card-shadow { box-shadow: 0 8px 30px rgba(79, 70, 229, 0.12); }
  .card-shadow-sm { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .bar-animate { animation: barGrow 0.8s ease-out forwards; }
  @keyframes barGrow {
    from { height: 0; }
  }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#4F46E5',
        accent: '#F59E0B',
      }
    }
  }
}
</script>
</head>
<body class="bg-gray-50 overflow-x-hidden" style="width: 100vw; height: 100vh; position: relative;">

  <!-- Main Container -->
  <div class="relative w-full h-full overflow-y-auto overflow-x-hidden" style="padding-bottom: 100px;">

    <!-- iOS Status Bar -->
    <div class="w-full flex items-end justify-center" style="height: 59px; background: #FAFAFA;">
      <div class="flex items-center justify-between w-full px-8 pb-2">
        <span class="text-sm font-semibold text-black">9:41</span>
        <div class="w-[126px] h-[37px] bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
          <i class="fas fa-signal text-sm text-black"></i>
          <i class="fas fa-wifi text-sm text-black"></i>
          <i class="fas fa-battery-full text-sm text-black"></i>
        </div>
      </div>
    </div>

    <!-- Content Area -->
    <div style="padding: 0 28px;">

      <!-- Header -->
      <div class="flex items-center justify-between mt-4 mb-5">
        <h1 class="text-2xl font-bold text-gray-900">我的进度</h1>
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center card-shadow-sm">
          <i class="fas fa-calendar-week text-primary text-sm"></i>
        </div>
      </div>

      <!-- Overview Stats Row -->
      <div class="flex gap-3 mb-6">
        <!-- Sessions Completed -->
        <div class="flex-1 rounded-2xl p-4 relative overflow-hidden" style="background: linear-gradient(135deg, #4F46E5, #6366F1);">
          <div class="absolute -right-3 -top-3 w-16 h-16 rounded-full bg-white/10"></div>
          <p class="text-3xl font-extrabold text-white leading-none mb-1">12</p>
          <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider leading-tight">已完成<br>课程</p>
        </div>
        <!-- Active Courses -->
        <div class="flex-1 rounded-2xl p-4 relative overflow-hidden" style="background: linear-gradient(135deg, #F59E0B, #F97316);">
          <div class="absolute -right-3 -top-3 w-16 h-16 rounded-full bg-white/10"></div>
          <p class="text-3xl font-extrabold text-white leading-none mb-1">3</p>
          <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider leading-tight">进行中<br>课程</p>
        </div>
        <!-- Hours Learned -->
        <div class="flex-1 rounded-2xl p-4 relative overflow-hidden" style="background: linear-gradient(135deg, #10B981, #059669);">
          <div class="absolute -right-3 -top-3 w-16 h-16 rounded-full bg-white/10"></div>
          <p class="text-3xl font-extrabold text-white leading-none mb-1">28</p>
          <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider leading-tight">学习<br>时长</p>
        </div>
      </div>

      <!-- Weekly Activity Chart -->
      <div class="bg-white rounded-2xl p-5 mb-6 card-shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-bold text-gray-900">本周活动</h2>
          <span class="text-[11px] font-semibold text-primary bg-primary/10 px-2.5 py-1 rounded-full">本周</span>
        </div>
        <!-- Bar Chart -->
        <div class="flex items-end justify-between gap-2" style="height: 120px;">
          <!-- Mon -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg bar-animate" style="height: 60%; background: linear-gradient(to top, #4F46E5, #818CF8);"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-400">周一</span>
          </div>
          <!-- Tue -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg bar-animate" style="height: 85%; background: linear-gradient(to top, #4F46E5, #818CF8);"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-400">周二</span>
          </div>
          <!-- Wed -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg bar-animate" style="height: 40%; background: linear-gradient(to top, #4F46E5, #818CF8);"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-400">周三</span>
          </div>
          <!-- Thu -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg bar-animate" style="height: 95%; background: linear-gradient(to top, #4F46E5, #818CF8);"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-400">周四</span>
          </div>
          <!-- Fri -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg bar-animate" style="height: 70%; background: linear-gradient(to top, #F59E0B, #FBBF24); box-shadow: 0 4px 12px rgba(245,158,11,0.3);"></div>
            </div>
            <span class="text-[10px] font-bold text-primary">周五</span>
          </div>
          <!-- Sat -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg" style="height: 20%; background: #E5E7EB;"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-300">周六</span>
          </div>
          <!-- Sun -->
          <div class="flex-1 flex flex-col items-center gap-2">
            <div class="w-full flex items-end justify-center" style="height: 100px;">
              <div class="w-full max-w-[28px] rounded-lg" style="height: 10%; background: #E5E7EB;"></div>
            </div>
            <span class="text-[10px] font-semibold text-gray-300">周日</span>
          </div>
        </div>
        <!-- Legend -->
        <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-50">
          <div class="flex items-center gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
            <span class="text-[10px] font-medium text-gray-400">已完成</span>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-accent"></div>
            <span class="text-[10px] font-medium text-gray-400">今天</span>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-gray-200"></div>
            <span class="text-[10px] font-medium text-gray-400">即将到来</span>
          </div>
        </div>
      </div>

      <!-- Active Learning Plans -->
      <div class="mb-6">
        <h2 class="text-base font-bold text-gray-900 mb-3">进行中的学习计划</h2>

        <!-- Card 1: Golf Basics -->
        <div class="bg-white rounded-2xl p-4 mb-3 card-shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop&crop=face"
                 alt="Sarah M." class="w-11 h-11 rounded-xl object-cover ring-2 ring-primary/15">
            <div class="flex-1">
              <h3 class="font-bold text-sm text-gray-900">高尔夫入门</h3>
              <p class="text-[11px] text-gray-400 font-medium">导师：Sarah M.</p>
            </div>
            <div class="bg-primary/10 rounded-lg px-2.5 py-1">
              <span class="text-[11px] font-bold text-primary">Week 2/8</span>
            </div>
          </div>
          <!-- Progress Bar -->
          <div class="mb-2.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[10px] font-semibold text-gray-400">进度</span>
              <span class="text-[10px] font-bold text-primary">25%</span>
            </div>
            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width: 25%; background: linear-gradient(90deg, #4F46E5, #818CF8);"></div>
            </div>
          </div>
          <!-- Next Session -->
          <div class="flex items-center gap-2 bg-indigo-50/70 rounded-xl px-3 py-2">
            <i class="fas fa-calendar-check text-primary text-xs"></i>
            <span class="text-[11px] font-medium text-gray-600">下次课程：<span class="font-semibold text-primary">May 2, 4:00 PM</span></span>
          </div>
        </div>

        <!-- Card 2: Drum Fundamentals -->
        <div class="bg-white rounded-2xl p-4 mb-3 card-shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-11 h-11 rounded-xl gradient-green flex items-center justify-center">
              <i class="fas fa-arrow-right-arrow-left text-white text-base"></i>
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-sm text-gray-900">架子鼓基础</h3>
              <p class="text-[11px] text-gray-400 font-medium flex items-center gap-1">
                <span class="inline-flex items-center gap-0.5 bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded text-[9px] font-bold">
                  <i class="fas fa-repeat text-[7px]"></i> 技能交换
                </span>
              </p>
            </div>
            <div class="bg-amber-50 rounded-lg px-2.5 py-1">
              <span class="text-[11px] font-bold text-amber-600">Week 5/8</span>
            </div>
          </div>
          <!-- Progress Bar -->
          <div class="mb-2.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[10px] font-semibold text-gray-400">进度</span>
              <span class="text-[10px] font-bold text-emerald-600">60%</span>
            </div>
            <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width: 60%; background: linear-gradient(90deg, #10B981, #34D399);"></div>
            </div>
          </div>
          <!-- Next Session -->
          <div class="flex items-center gap-2 bg-emerald-50/70 rounded-xl px-3 py-2">
            <i class="fas fa-calendar-check text-emerald-500 text-xs"></i>
            <span class="text-[11px] font-medium text-gray-600">下次课程：<span class="font-semibold text-emerald-600">Apr 30, 6:00 PM</span></span>
          </div>
        </div>
      </div>

      <!-- Achievements -->
      <div class="mb-6">
        <h2 class="text-base font-bold text-gray-900 mb-3">成就徽章</h2>
        <div class="flex gap-3 overflow-x-auto pb-2">
          <!-- First Lesson -->
          <div class="min-w-[90px] flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center relative" style="background: linear-gradient(135deg, #FBBF24, #F59E0B); box-shadow: 0 6px 20px rgba(245,158,11,0.3);">
              <i class="fas fa-star text-white text-2xl"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 text-center leading-tight">首次<br>上课</span>
          </div>
          <!-- 5 Sessions -->
          <div class="min-w-[90px] flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #F97316, #EA580C); box-shadow: 0 6px 20px rgba(249,115,22,0.3);">
              <i class="fas fa-fire-flame-curved text-white text-2xl"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 text-center leading-tight">5<br>节课</span>
          </div>
          <!-- Skill Swapper -->
          <div class="min-w-[90px] flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 6px 20px rgba(16,185,129,0.3);">
              <i class="fas fa-arrow-right-arrow-left text-white text-2xl"></i>
            </div>
            <span class="text-[10px] font-semibold text-gray-600 text-center leading-tight">技能<br>交换者</span>
          </div>
          <!-- Week Streak (Locked) -->
          <div class="min-w-[90px] flex flex-col items-center gap-2 opacity-40">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center bg-gray-200 relative">
              <i class="fas fa-bolt text-gray-400 text-2xl"></i>
              <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-gray-300 rounded-full flex items-center justify-center">
                <i class="fas fa-lock text-gray-500 text-[8px]"></i>
              </div>
            </div>
            <span class="text-[10px] font-semibold text-gray-400 text-center leading-tight">连续<br>一周</span>
          </div>
        </div>
      </div>

      <!-- AI Summary Card -->
      <div class="relative rounded-2xl overflow-hidden mb-6 card-shadow" style="min-height: 100px;">
        <div class="absolute inset-0 gradient-ai"></div>
        <div class="absolute inset-0 opacity-10">
          <div class="absolute -right-6 -top-6 w-32 h-32 border-[3px] border-white rounded-full"></div>
          <div class="absolute -right-2 top-10 w-20 h-20 border-[2px] border-white rounded-full"></div>
        </div>
        <div class="relative p-5">
          <div class="flex items-center gap-2 mb-2.5">
            <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">
              <i class="fas fa-sparkles text-white text-xs"></i>
            </div>
            <span class="text-xs font-bold text-white/90 uppercase tracking-wide">AI 总结</span>
          </div>
          <p class="text-sm text-white/90 font-medium leading-relaxed">
            进步很大！你的高尔夫挥杆准确度提升了<span class="text-amber-300 font-bold">35%</span>。继续保持每周练习！
          </p>
          <div class="flex items-center gap-2 mt-3">
            <div class="flex items-center gap-1 bg-white/15 rounded-full px-3 py-1.5">
              <i class="fas fa-arrow-trend-up text-emerald-300 text-xs"></i>
              <span class="text-[11px] font-semibold text-white/90">持续上升</span>
            </div>
          </div>
        </div>
      </div>

    </div><!-- end content padding -->

    <!-- Bottom Tab Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom, 20px);">
      <div class="flex items-center justify-around pt-2 pb-1 px-4">
        <div class="flex flex-col items-center gap-0.5 py-1">
          <div class="w-8 h-8 flex items-center justify-center">
            <i class="fas fa-house text-gray-300 text-lg"></i>
          </div>
          <span class="text-[10px] font-medium text-gray-300">首页</span>
        </div>
        <div class="flex flex-col items-center gap-0.5 py-1">
          <div class="w-8 h-8 flex items-center justify-center">
            <i class="fas fa-magnifying-glass text-gray-300 text-lg"></i>
          </div>
          <span class="text-[10px] font-medium text-gray-300">搜索</span>
        </div>
        <div class="flex flex-col items-center gap-0.5 py-1">
          <div class="w-8 h-8 flex items-center justify-center">
            <i class="fas fa-wand-magic-sparkles text-gray-300 text-lg"></i>
          </div>
          <span class="text-[10px] font-medium text-gray-300">AI匹配</span>
        </div>
        <div class="flex flex-col items-center gap-0.5 py-1">
          <div class="w-8 h-8 rounded-full gradient-primary flex items-center justify-center">
            <i class="fas fa-chart-line text-white text-sm"></i>
          </div>
          <span class="text-[10px] font-semibold text-primary">进度</span>
        </div>
        <div class="flex flex-col items-center gap-0.5 py-1">
          <div class="w-8 h-8 flex items-center justify-center">
            <i class="fas fa-user text-gray-300 text-lg"></i>
          </div>
          <span class="text-[10px] font-medium text-gray-300">我的</span>
        </div>
      </div>
    </div>

  </div><!-- end main container -->

</body>
</html>
