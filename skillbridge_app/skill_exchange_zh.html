<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge - 技能交换</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }
  body { font-family: 'Inter', -apple-system, sans-serif; }
  .gradient-primary { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); }
  .gradient-amber { background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%); }
  .gradient-hero { background: linear-gradient(135deg, #F59E0B 0%, #FB923C 40%, #F97316 100%); }
  .gradient-swap { background: linear-gradient(135deg, #10B981 0%, #059669 50%, #047857 100%); }
  .gradient-exchange { background: linear-gradient(135deg, #10B981 0%, #34D399 100%); }
  .card-shadow { box-shadow: 0 8px 30px rgba(79, 70, 229, 0.12); }
  .card-shadow-sm { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .card-shadow-warm { box-shadow: 0 8px 30px rgba(245, 158, 11, 0.15); }
  .swap-spin { animation: spin-slow 8s linear infinite; }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .pulse-glow { animation: pulse-g 2s ease-in-out infinite; }
  @keyframes pulse-g { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.3); } 50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#4F46E5',
        accent: '#F59E0B',
      }
    }
  }
}
</script>
</head>
<body class="bg-gray-50 overflow-x-hidden" style="width: 100vw; height: 100vh; position: relative;">

  <!-- Main Container -->
  <div class="relative w-full h-full overflow-y-auto overflow-x-hidden" style="padding-bottom: 40px;">

    <!-- iOS Status Bar -->
    <div class="w-full flex items-end justify-center" style="height: 59px; background: #FAFAFA;">
      <div class="flex items-center justify-between w-full px-8 pb-2">
        <span class="text-sm font-semibold text-black">9:41</span>
        <div class="w-[126px] h-[37px] bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
          <i class="fas fa-signal text-sm text-black"></i>
          <i class="fas fa-wifi text-sm text-black"></i>
          <i class="fas fa-battery-full text-sm text-black"></i>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="flex items-center justify-between px-5 py-3">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center card-shadow-sm">
        <i class="fas fa-arrow-left text-gray-700 text-sm"></i>
      </div>
      <h1 class="text-lg font-bold text-gray-900">技能交换</h1>
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center card-shadow-sm">
        <i class="fas fa-sliders text-gray-500 text-sm"></i>
      </div>
    </div>

    <!-- Content Area -->
    <div style="padding: 0 28px;">

      <!-- Hero Banner -->
      <div class="relative rounded-3xl overflow-hidden mb-6 card-shadow-warm" style="height: 155px;">
        <div class="absolute inset-0 gradient-hero"></div>
        <div class="absolute inset-0 opacity-10">
          <div class="absolute -right-8 -top-8 w-40 h-40 border-[3px] border-white rounded-full"></div>
          <div class="absolute -right-2 top-12 w-24 h-24 border-[2px] border-white rounded-full"></div>
          <div class="absolute left-6 -bottom-4 w-20 h-20 border-[2px] border-white rounded-full"></div>
        </div>
        <div class="absolute inset-0 p-6 flex items-center justify-between">
          <div class="flex-1">
            <h2 class="text-white font-extrabold text-xl leading-tight mb-1.5">以技换技，<br>无需花钱</h2>
            <p class="text-white/75 text-xs font-medium leading-relaxed">教你所长，<br>学你所想</p>
          </div>
          <div class="relative w-16 h-16">
            <div class="absolute inset-0 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
              <i class="fas fa-arrow-right-arrow-left text-white text-2xl swap-spin"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Your Skills Section -->
      <div class="mb-5">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg gradient-primary flex items-center justify-center">
              <i class="fas fa-hand-holding-heart text-white text-xs"></i>
            </div>
            <h3 class="text-base font-bold text-gray-900">你的技能</h3>
          </div>
          <span class="text-[11px] font-semibold text-primary">编辑</span>
        </div>
        <div class="flex flex-wrap gap-2.5">
          <div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-full px-4 py-2">
            <i class="fas fa-drum text-primary text-xs"></i>
            <span class="text-sm font-semibold text-primary">架子鼓</span>
          </div>
          <div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-full px-4 py-2">
            <i class="fas fa-music text-primary text-xs"></i>
            <span class="text-sm font-semibold text-primary">乐理</span>
          </div>
          <div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-full px-4 py-2">
            <i class="fas fa-piano-keyboard text-primary text-xs"></i>
            <span class="text-sm font-semibold text-primary">钢琴</span>
          </div>
          <button class="flex items-center gap-1.5 bg-white border-2 border-dashed border-gray-200 rounded-full px-4 py-2">
            <i class="fas fa-plus text-gray-400 text-xs"></i>
            <span class="text-sm font-medium text-gray-400">添加</span>
          </button>
        </div>
      </div>

      <!-- Want to Learn Section -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg gradient-amber flex items-center justify-center">
              <i class="fas fa-lightbulb text-white text-xs"></i>
            </div>
            <h3 class="text-base font-bold text-gray-900">想要学习</h3>
          </div>
          <span class="text-[11px] font-semibold text-accent">编辑</span>
        </div>
        <div class="flex flex-wrap gap-2.5">
          <div class="flex items-center gap-2 bg-amber-50 border border-amber-100 rounded-full px-4 py-2">
            <i class="fas fa-golf-ball-tee text-amber-600 text-xs"></i>
            <span class="text-sm font-semibold text-amber-600">高尔夫</span>
          </div>
          <div class="flex items-center gap-2 bg-amber-50 border border-amber-100 rounded-full px-4 py-2">
            <i class="fas fa-table-tennis-paddle-ball text-amber-600 text-xs"></i>
            <span class="text-sm font-semibold text-amber-600">网球</span>
          </div>
          <button class="flex items-center gap-1.5 bg-white border-2 border-dashed border-gray-200 rounded-full px-4 py-2">
            <i class="fas fa-plus text-gray-400 text-xs"></i>
            <span class="text-sm font-medium text-gray-400">添加</span>
          </button>
        </div>
      </div>

      <!-- Perfect Matches Header -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2.5">
          <h3 class="text-lg font-bold text-gray-900">完美匹配</h3>
          <div class="bg-emerald-100 rounded-full px-2.5 py-0.5">
            <span class="text-xs font-bold text-emerald-600">3</span>
          </div>
        </div>
        <span class="text-xs font-semibold text-primary">查看全部</span>
      </div>

      <!-- Match Card 1 - Jake -->
      <div class="bg-white rounded-2xl p-4 mb-3 card-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&h=200&fit=crop&crop=face"
                 alt="Jake R." class="w-12 h-12 rounded-xl object-cover">
            <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-white">
              <i class="fas fa-check text-white text-[7px]"></i>
            </div>
          </div>
          <div class="flex-1">
            <h4 class="font-bold text-sm text-gray-900">Jake R.</h4>
            <p class="text-[11px] text-gray-400 font-medium">大学运动员</p>
          </div>
          <div class="flex items-center gap-1 bg-emerald-50 rounded-full px-3 py-1">
            <i class="fas fa-bullseye text-emerald-500 text-[10px]"></i>
            <span class="text-xs font-bold text-emerald-600">95%</span>
          </div>
        </div>

        <!-- Skill Swap Visual -->
        <div class="flex items-center gap-2 mb-3">
          <div class="flex-1 bg-amber-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-amber-500 mb-1 uppercase tracking-wider">可教</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-amber-100 text-amber-700 text-[11px] font-semibold rounded-md px-2 py-0.5">高尔夫</span>
              <span class="bg-amber-100 text-amber-700 text-[11px] font-semibold rounded-md px-2 py-0.5">网球</span>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full gradient-exchange flex items-center justify-center pulse-glow flex-shrink-0">
            <i class="fas fa-arrow-right-arrow-left text-white text-xs"></i>
          </div>
          <div class="flex-1 bg-indigo-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-indigo-400 mb-1 uppercase tracking-wider">想学</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-indigo-100 text-indigo-700 text-[11px] font-semibold rounded-md px-2 py-0.5">架子鼓</span>
            </div>
          </div>
        </div>

        <button class="w-full gradient-exchange rounded-xl py-2.5 text-white text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
          <i class="fas fa-handshake text-xs"></i>
          发起交换
        </button>
      </div>

      <!-- Match Card 2 - Lily -->
      <div class="bg-white rounded-2xl p-4 mb-3 card-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=face"
                 alt="Lily W." class="w-12 h-12 rounded-xl object-cover">
            <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-white">
              <i class="fas fa-check text-white text-[7px]"></i>
            </div>
          </div>
          <div class="flex-1">
            <h4 class="font-bold text-sm text-gray-900">Lily W.</h4>
            <p class="text-[11px] text-gray-400 font-medium">高尔夫爱好者</p>
          </div>
          <div class="flex items-center gap-1 bg-emerald-50 rounded-full px-3 py-1">
            <i class="fas fa-bullseye text-emerald-500 text-[10px]"></i>
            <span class="text-xs font-bold text-emerald-600">88%</span>
          </div>
        </div>

        <!-- Skill Swap Visual -->
        <div class="flex items-center gap-2 mb-3">
          <div class="flex-1 bg-amber-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-amber-500 mb-1 uppercase tracking-wider">可教</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-amber-100 text-amber-700 text-[11px] font-semibold rounded-md px-2 py-0.5">高尔夫</span>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full gradient-exchange flex items-center justify-center pulse-glow flex-shrink-0">
            <i class="fas fa-arrow-right-arrow-left text-white text-xs"></i>
          </div>
          <div class="flex-1 bg-indigo-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-indigo-400 mb-1 uppercase tracking-wider">想学</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-indigo-100 text-indigo-700 text-[11px] font-semibold rounded-md px-2 py-0.5">钢琴</span>
            </div>
          </div>
        </div>

        <button class="w-full gradient-exchange rounded-xl py-2.5 text-white text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
          <i class="fas fa-handshake text-xs"></i>
          发起交换
        </button>
      </div>

      <!-- Match Card 3 - Compact -->
      <div class="bg-white rounded-2xl p-4 mb-5 card-shadow">
        <div class="flex items-center gap-3 mb-3">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face"
                 alt="Ryan M." class="w-12 h-12 rounded-xl object-cover">
            <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-white">
              <i class="fas fa-check text-white text-[7px]"></i>
            </div>
          </div>
          <div class="flex-1">
            <h4 class="font-bold text-sm text-gray-900">Ryan M.</h4>
            <p class="text-[11px] text-gray-400 font-medium">网球教练</p>
          </div>
          <div class="flex items-center gap-1 bg-emerald-50 rounded-full px-3 py-1">
            <i class="fas fa-bullseye text-emerald-500 text-[10px]"></i>
            <span class="text-xs font-bold text-emerald-600">82%</span>
          </div>
        </div>

        <!-- Skill Swap Visual -->
        <div class="flex items-center gap-2 mb-3">
          <div class="flex-1 bg-amber-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-amber-500 mb-1 uppercase tracking-wider">可教</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-amber-100 text-amber-700 text-[11px] font-semibold rounded-md px-2 py-0.5">网球</span>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full gradient-exchange flex items-center justify-center pulse-glow flex-shrink-0">
            <i class="fas fa-arrow-right-arrow-left text-white text-xs"></i>
          </div>
          <div class="flex-1 bg-indigo-50 rounded-xl p-2.5">
            <p class="text-[10px] font-semibold text-indigo-400 mb-1 uppercase tracking-wider">想学</p>
            <div class="flex flex-wrap gap-1.5">
              <span class="bg-indigo-100 text-indigo-700 text-[11px] font-semibold rounded-md px-2 py-0.5">乐理</span>
            </div>
          </div>
        </div>

        <button class="w-full gradient-exchange rounded-xl py-2.5 text-white text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
          <i class="fas fa-handshake text-xs"></i>
          发起交换
        </button>
      </div>

      <!-- Active Exchanges Section -->
      <div class="mb-6">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <h3 class="text-lg font-bold text-gray-900">进行中的交换</h3>
            <div class="bg-blue-100 rounded-full px-2.5 py-0.5">
              <span class="text-xs font-bold text-blue-600">1</span>
            </div>
          </div>
        </div>

        <!-- Active Exchange Card -->
        <div class="bg-white rounded-2xl overflow-hidden card-shadow">
          <!-- Progress Header -->
          <div class="gradient-primary p-4 pb-3">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-1.5">
                <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">
                  <i class="fas fa-sync text-white text-[9px]"></i>
                </div>
                <span class="text-white/90 text-[11px] font-semibold uppercase tracking-wider">进行中</span>
              </div>
              <span class="text-white text-xs font-bold bg-white/20 rounded-full px-3 py-1">第2周/共4周</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden">
              <div class="h-full bg-white rounded-full" style="width: 50%;"></div>
            </div>
          </div>
          <!-- Exchange Details -->
          <div class="p-4">
            <div class="flex items-center gap-3">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop&crop=face"
                   alt="Emma S." class="w-11 h-11 rounded-xl object-cover">
              <div class="flex-1">
                <h4 class="font-bold text-sm text-gray-900">Emma S.</h4>
                <div class="flex items-center gap-1.5 mt-0.5">
                  <span class="bg-indigo-100 text-indigo-700 text-[10px] font-semibold rounded-md px-2 py-0.5">你的架子鼓</span>
                  <i class="fas fa-arrow-right-arrow-left text-emerald-400 text-[8px]"></i>
                  <span class="bg-amber-100 text-amber-700 text-[10px] font-semibold rounded-md px-2 py-0.5">她的吉他</span>
                </div>
              </div>
              <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center">
                <i class="fas fa-comment-dots text-primary text-sm"></i>
              </div>
            </div>
            <div class="flex items-center gap-3 mt-3 pt-3 border-t border-gray-50">
              <div class="flex items-center gap-1.5">
                <i class="fas fa-calendar-check text-emerald-400 text-xs"></i>
                <span class="text-[11px] text-gray-400 font-medium">下次：周四 下午3:00</span>
              </div>
              <div class="flex items-center gap-1.5">
                <i class="fas fa-video text-primary text-xs"></i>
                <span class="text-[11px] text-gray-400 font-medium">视频通话</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- end content padding -->

  </div><!-- end main container -->

</body>
</html>
