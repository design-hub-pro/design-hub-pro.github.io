<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StageRight</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#17131F}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2733,#0d0b10);box-shadow:0 50px 80px -30px rgba(60,20,110,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#FAF7F2}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FCD34D,#F59E0B 40%,#6D28D9)"><i class="fa-solid fa-star text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:'Fraunces',serif">StageRight</h1>
  <p class="mt-3 text-[19px] text-gray-500">Rising talent finds vetted agencies, checks contracts, stays safe, builds skills and grows an audience.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-violet-50 text-violet-700">Entertainment</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Talent Safety</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Skill Coaching</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Creator Growth</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="agencies.html" scrolling="no" title="agencies"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="agency.html" scrolling="no" title="agency"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="contract.html" scrolling="no" title="contract"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="gigs.html" scrolling="no" title="gigs"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="rules.html" scrolling="no" title="rules"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="safety.html" scrolling="no" title="safety"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="checkin.html" scrolling="no" title="checkin"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="network.html" scrolling="no" title="network"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="grow.html" scrolling="no" title="grow"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="skills.html" scrolling="no" title="skills"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="practice.html" scrolling="no" title="practice"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="routine.html" scrolling="no" title="routine"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
</div></main>
</body></html>
