<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute inset-0 -z-0">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386825-image-1.png" class="w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(23,19,31,.15) 0%,rgba(23,19,31,.35) 40%,rgba(23,19,31,.97) 78%)"></div>
  </div>
  <div class="absolute inset-x-0 bottom-0 px-7 pb-12 text-white z-10">
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-6" style="background:linear-gradient(135deg,#FCD34D,#F59E0B 45%,#7C3AED)"><i class="fas fa-star text-[22px]"></i></div>
    <h1 class="display text-[44px] font-extrabold leading-[1.02]">Grow your career.<br>Keep your rights.</h1>
    <p class="text-[16px] text-white/70 mt-4 leading-relaxed">Vetted agencies, contract checks, safety tools and real people in your corner.</p>
    <p class="label !text-white/50 mt-8 mb-3">I'm a</p>
    <div class="flex flex-wrap gap-2">
      <span class="chip active !bg-white !text-[#17131F]"><i class="fas fa-masks-theater"></i>Actor</span>
      <span class="chip !bg-white/15 !text-white !shadow-none"><i class="fas fa-microphone"></i>Singer</span>
      <span class="chip !bg-white/15 !text-white !shadow-none"><i class="fas fa-mobile-screen"></i>Creator</span>
      <span class="chip !bg-white/15 !text-white !shadow-none"><i class="fas fa-person-running"></i>Dancer</span>
      <span class="chip !bg-white/15 !text-white !shadow-none"><i class="fas fa-camera"></i>Model</span>
    </div>
    <div class="btn primary mt-8 !bg-white !text-[#17131F] !shadow-none">Get started<i class="fas fa-arrow-right text-sm"></i></div>
    <p class="text-center text-[13px] text-white/50 mt-4">Under 18? A parent joins your account.</p>
  </div>
</div>
</body>
</html>
