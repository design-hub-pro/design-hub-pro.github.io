<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute inset-0"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356388146-image-1.png" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(23,19,31,.55),rgba(23,19,31,.2) 35%,rgba(23,19,31,.95) 70%)"></div></div>
  <div class="content full relative text-white">
    <div class="nav"><div class="ib glass"><i class="fas fa-chevron-down"></i></div><div class="flex items-center gap-2 text-[12px] font-bold bg-[#DC2626] px-3 py-1.5 rounded-full"><span class="dot bg-white"></span>LIVE</div><div class="ib glass"><i class="fas fa-ellipsis"></i></div></div>

    <div class="h-[250px]"></div>
    <p class="label !text-white/60">Safe check-in</p>
    <h1 class="display text-[34px] font-bold leading-tight mt-1">Callback, Brightwater Films</h1>
    <div class="flex items-center gap-2 mt-2 text-[13px] text-white/75"><i class="fas fa-circle-check text-[#A78BFA]"></i>Casting director verified &middot; Studio B, Burbank</div>

    <div class="mt-6 flex items-end gap-3">
      <span class="display text-[64px] font-extrabold leading-none">42:18</span>
      <span class="text-[13px] text-white/60 pb-2">until auto-alert</span>
    </div>
    <div class="track !bg-white/15 mt-3"><div class="fill gold" style="width:30%"></div></div>

    <div class="mt-6 rounded-[22px] bg-white/10 backdrop-blur p-4">
      <div class="flex items-center justify-between"><p class="text-[13px] font-bold">Watching your location</p><span class="text-[11px] text-white/60">3 people</span></div>
      <div class="flex items-center gap-3 mt-3">
        <div class="stack"><img class="w-11 h-11 av !border-[#17131F]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356387362-image-1.png"><img class="w-11 h-11 av !border-[#17131F]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386986-image-1.png"><img class="w-11 h-11 av !border-[#17131F]" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386491-image-1.png"></div>
        <div class="flex gap-1.5 ml-auto"><span class="dot bg-[#34D399]"></span><span class="dot bg-[#34D399]"></span><span class="dot bg-[#FBBF24]"></span></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-5">
      <div class="btn !bg-white !text-[#17131F]"><i class="fas fa-check"></i>I'm safe</div>
      <div class="btn !bg-[#DC2626] !text-white"><i class="fas fa-phone"></i>Fake call</div>
    </div>
  </div>
</div>
</body>
</html>
