<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Kit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar light">
    <span>9:41</span>
    <span class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="absolute top-0 inset-x-0 h-[300px]"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386522-image-1.png" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(23,19,31,.4),rgba(23,19,31,.1) 50%,rgba(250,247,242,1))"></div></div>
  <div class="content relative">
    <div class="nav"><div class="ib glass"><i class="fas fa-gear"></i></div><div class="ib glass"><i class="fas fa-share-from-square"></i></div></div>
    <div class="h-[110px]"></div>
    <div class="flex flex-col items-center text-center">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386467-image-1.png" class="w-[112px] h-[112px] rounded-full object-cover border-4 border-white shadow-lg">
      <div class="flex items-center gap-2 mt-3"><h1 class="display text-[28px] font-bold">Mei Lin</h1><i class="fas fa-circle-check verified"></i></div>
      <p class="text-[13px] text-[#8F879B]">Actor &middot; Singer &middot; Los Angeles</p>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-5">
      <div class="card !p-3 text-center"><p class="display text-[26px] font-extrabold leading-none">48K</p><p class="text-[11px] font-semibold text-[#8F879B] mt-1">Audience</p></div>
      <div class="card !p-3 text-center"><p class="display text-[26px] font-extrabold leading-none">11</p><p class="text-[11px] font-semibold text-[#8F879B] mt-1">Credits</p></div>
      <div class="card !p-3 text-center"><p class="display text-[26px] font-extrabold leading-none text-[#6D28D9]">320</p><p class="text-[11px] font-semibold text-[#8F879B] mt-1">Kit views</p></div>
    </div>

    <div class="hero h-[170px] mt-4">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386825-image-1.png"><div class="fade"></div>
      <div class="absolute inset-0 flex items-center justify-center"><div class="play"><i class="fas fa-play ml-1"></i></div></div>
      <div class="absolute left-4 bottom-3 text-white"><p class="text-[15px] font-bold">2026 showreel</p></div>
      <span class="dur">1:48</span>
    </div>

    <h2 class="display text-[19px] font-bold mt-5 mb-3">Headshots</h2>
    <div class="grid grid-cols-3 gap-2">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386467-image-1.png" class="h-[120px] w-full rounded-[18px] object-cover">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356387608-image-1.png" class="h-[120px] w-full rounded-[18px] object-cover">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1794356386825-image-1.png" class="h-[120px] w-full rounded-[18px] object-cover">
    </div>

    <div class="card mt-4 flex items-center gap-3">
      <div class="gi" style="background:linear-gradient(135deg,#FCD34D,#F59E0B)"><i class="fas fa-link"></i></div>
      <div class="flex-1"><p class="text-[14px] font-bold">stageright.me/meilin</p><p class="text-[12px] text-[#8F879B]">Rep contact hidden until verified</p></div>
      <i class="far fa-copy text-[#8F879B]"></i>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-building"></i><span>Agencies</span></div>
    <div class="tab"><div class="tab-safe"><i class="fas fa-shield-heart"></i></div></div>
    <div class="tab"><i class="fas fa-chart-line"></i><span>Grow</span></div>
    <div class="tab"><i class="fas fa-hand-holding-heart"></i><span>Network</span></div>
  </div>
</div>
</body>
</html>
