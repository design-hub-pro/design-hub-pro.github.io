<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackBalance - Load Alert</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
  .ring-pulse { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,.55); }
</style>
</head>
<body style="background:#0B1220">
<div class="screen">
  <!-- Hero photo -->
  <div class="relative h-[540px]">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805764470-image-1.png" class="absolute inset-0 w-full h-full object-cover" alt="Strap insert on a backpack strap">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,18,32,.55) 0%,rgba(11,18,32,.1) 35%,rgba(11,18,32,.75) 78%,#0B1220 100%)"></div>
    <div class="status-bar light">
      <span class="time">7:47</span>
      <div class="dynamic-island"></div>
      <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters text-[15px]"></i></div>
    </div>
    <div class="px-7 flex justify-between items-center mt-2">
      <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-xmark"></i></div>
      <span class="chip bg-white/20 backdrop-blur text-white"><i class="fas fa-mobile-screen-button"></i>Strap buzzed 2x</span>
    </div>

    <!-- Pulse badge on strap -->
    <div class="absolute left-[38%] top-[44%] w-16 h-16">
      <span class="ring-pulse" style="transform:scale(1.9);opacity:.35"></span>
      <span class="ring-pulse" style="transform:scale(1.45);opacity:.6"></span>
      <div class="absolute inset-0 rounded-full bg-amber-500 flex items-center justify-center text-white text-2xl shadow-xl"><i class="fas fa-arrow-left"></i></div>
    </div>

    <div class="absolute bottom-4 left-7 right-7 text-white">
      <span class="chip bg-amber-500 text-white mb-3"><i class="fas fa-triangle-exclamation"></i>Uneven load · 4 min</span>
      <h1 class="text-[34px] font-black leading-[1.05] tracking-tight">Your pack is<br>leaning left</h1>
    </div>
  </div>

  <div class="px-7 pb-10 text-white">
    <!-- L/R big numbers -->
    <div class="flex items-center gap-4 mb-6">
      <div class="flex-1 rounded-2xl p-4 bg-amber-500/15 border border-amber-400/30">
        <p class="text-[11px] font-bold text-amber-300">LEFT</p>
        <p class="text-[32px] font-black leading-none">58%</p>
      </div>
      <i class="fas fa-scale-unbalanced text-2xl text-slate-500"></i>
      <div class="flex-1 rounded-2xl p-4 bg-sky-500/10 border border-sky-400/25">
        <p class="text-[11px] font-bold text-sky-300">RIGHT</p>
        <p class="text-[32px] font-black leading-none">42%</p>
      </div>
    </div>

    <!-- Step -->
    <div class="rounded-2xl bg-white/5 border border-white/10 p-4 flex items-center gap-4 mb-6">
      <div class="icon-tile grad-sky"><i class="fas fa-arrows-left-right"></i></div>
      <div class="flex-1">
        <p class="text-[15px] font-bold">Pull the right strap tighter</p>
        <p class="text-[12px] text-slate-400 font-medium">Aim for the green zone</p>
      </div>
      <div class="flex gap-1"><span class="dot bg-sky-400"></span><span class="dot bg-white/20"></span><span class="dot bg-white/20"></span></div>
    </div>

    <button class="w-full h-[58px] rounded-2xl bg-white text-slate-900 text-[16px] font-extrabold flex items-center justify-center gap-2 mb-3"><i class="fas fa-check text-emerald-500"></i>Fixed it</button>
    <button class="w-full h-[50px] rounded-2xl text-slate-400 text-[14px] font-bold">Remind me in 5 min</button>
  </div>
</div>
<div class="home-ind" style="background:#fff"></div>
</body>
</html>
