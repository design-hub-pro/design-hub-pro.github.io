<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackBalance - Parent View</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span class="time">7:52</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters text-[15px]"></i></div>
  </div>

  <div class="content">
    <div class="flex items-center justify-between mt-3 mb-5">
      <div>
        <p class="text-[13px] font-semibold text-slate-400">Parent view</p>
        <h1 class="text-[28px] font-black tracking-tight leading-tight">My kids</h1>
      </div>
      <div class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-slate-500 relative"><i class="fas fa-bell"></i><span class="absolute top-2 right-2.5 dot bg-rose-500"></span></div>
    </div>

    <!-- Kid switcher -->
    <div class="hscroll mb-5">
      <div class="flex items-center gap-2.5 pl-1.5 pr-4 py-1.5 rounded-full bg-slate-900 text-white flex-shrink-0">
        <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=100&h=100&fit=crop" class="w-9 h-9 rounded-full object-cover" alt="">
        <span class="text-[14px] font-bold">Maya</span><span class="dot bg-emerald-400"></span>
      </div>
      <div class="flex items-center gap-2.5 pl-1.5 pr-4 py-1.5 rounded-full bg-white shadow-sm flex-shrink-0">
        <span class="w-9 h-9 rounded-full grad-violet text-white flex items-center justify-center font-black text-[14px]">L</span>
        <span class="text-[14px] font-bold">Leo</span><span class="dot bg-slate-300"></span>
      </div>
    </div>

    <!-- Arrived card -->
    <div class="relative rounded-[26px] overflow-hidden h-[180px] mb-5 shadow-lg">
      <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=900&h=500&fit=crop" class="absolute inset-0 w-full h-full object-cover" alt="School building">
      <div class="absolute inset-0 bg-gradient-to-t from-slate-900/85 to-slate-900/10"></div>
      <div class="absolute top-4 left-4 chip bg-emerald-500 text-white"><i class="fas fa-check"></i>Arrived 7:51</div>
      <div class="absolute bottom-4 left-5 right-5 text-white flex items-end justify-between">
        <div>
          <p class="text-[12px] font-semibold opacity-80">Morning walk</p>
          <p class="text-[24px] font-black leading-none">Lincoln Elementary</p>
        </div>
        <p class="text-[13px] font-bold opacity-90">14 min</p>
      </div>
    </div>

    <!-- Scores row -->
    <div class="grid grid-cols-2 gap-3 mb-5">
      <div class="card p-4">
        <div class="flex items-center gap-2 mb-2"><span class="dot bg-sky-500"></span><span class="text-[12px] font-semibold text-slate-400">Shoulder load</span></div>
        <p class="text-[34px] font-black leading-none">72</p>
        <svg viewBox="0 0 120 30" class="w-full h-7 mt-2"><polyline points="0,20 20,16 40,18 60,10 80,14 100,12 120,8" stroke="#0EA5E9" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="card p-4">
        <div class="flex items-center gap-2 mb-2"><span class="dot bg-emerald-500"></span><span class="text-[12px] font-semibold text-slate-400">Allergy exposure</span></div>
        <p class="text-[34px] font-black leading-none">34</p>
        <svg viewBox="0 0 120 30" class="w-full h-7 mt-2"><polyline points="0,22 20,24 40,14 60,18 80,20 100,12 120,16" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      </div>
    </div>

    <!-- Timeline -->
    <p class="sec-title mb-3">This morning</p>
    <div class="relative pl-6">
      <div class="absolute left-[7px] top-2 bottom-2 w-[2px] bg-slate-200"></div>
      <div class="relative mb-4">
        <span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-emerald-500 ring-4 ring-emerald-100"></span>
        <p class="text-[14px] font-bold">Pack rebalanced</p>
        <p class="text-[12px] text-slate-400 font-medium">7:48 · Fixed in 1 min</p>
      </div>
      <div class="relative mb-4">
        <span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-amber-500 ring-4 ring-amber-100"></span>
        <p class="text-[14px] font-bold">Leaning left alert</p>
        <p class="text-[12px] text-slate-400 font-medium">7:47 · 58 / 42</p>
      </div>
      <div class="relative">
        <span class="absolute -left-6 top-1 w-4 h-4 rounded-full bg-sky-500 ring-4 ring-sky-100"></span>
        <p class="text-[14px] font-bold">Left home</p>
        <p class="text-[12px] text-slate-400 font-medium">7:37 · Air good</p>
      </div>
    </div>
  </div>
</div>
<div class="tab-bar">
  <div class="tab active"><i class="fas fa-children"></i>Kids</div>
  <div class="tab"><i class="fas fa-map-location-dot"></i>Map</div>
  <div class="tab"><i class="fas fa-chart-line"></i>Reports</div>
  <div class="tab"><i class="fas fa-gear"></i>Settings</div>
</div>
<div class="home-ind"></div>
</body>
</html>
