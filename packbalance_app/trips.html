<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackBalance - Trips</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span class="time">3:28</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-half text-[15px]"></i></div>
  </div>

  <div class="content">
    <div class="flex items-center justify-between mt-3 mb-4">
      <h1 class="text-[28px] font-black tracking-tight">Trips</h1>
      <div class="flex bg-slate-200/70 rounded-full p-1 text-[12px] font-bold">
        <span class="px-3 py-1 rounded-full bg-white shadow">Week</span>
        <span class="px-3 py-1 text-slate-500">Month</span>
      </div>
    </div>

    <!-- Week stats -->
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="card p-3.5">
        <p class="text-[28px] font-black leading-none text-sky-600">76</p>
        <p class="text-[11px] font-semibold text-slate-400 mt-1">Avg load score</p>
      </div>
      <div class="card p-3.5">
        <p class="text-[28px] font-black leading-none text-emerald-600">29</p>
        <p class="text-[11px] font-semibold text-slate-400 mt-1">Avg allergy</p>
      </div>
      <div class="card p-3.5">
        <p class="text-[28px] font-black leading-none">9</p>
        <p class="text-[11px] font-semibold text-slate-400 mt-1">Trips</p>
      </div>
    </div>

    <!-- Dual bar chart -->
    <div class="card p-4 mb-5">
      <div class="flex items-center justify-between mb-4">
        <p class="sec-title text-[15px]">This week</p>
        <div class="flex gap-3 text-[11px] font-semibold text-slate-500">
          <span class="flex items-center gap-1.5"><span class="dot bg-sky-500"></span>Load</span>
          <span class="flex items-center gap-1.5"><span class="dot bg-emerald-400"></span>Allergy</span>
        </div>
      </div>
      <div class="flex items-end justify-between h-[130px] px-1">
        <div class="flex flex-col items-center gap-2"><div class="flex items-end gap-1 h-[110px]"><div class="w-3 rounded-full bg-sky-500" style="height:68%"></div><div class="w-3 rounded-full bg-emerald-400" style="height:30%"></div></div><span class="text-[11px] font-bold text-slate-400">M</span></div>
        <div class="flex flex-col items-center gap-2"><div class="flex items-end gap-1 h-[110px]"><div class="w-3 rounded-full bg-sky-500" style="height:74%"></div><div class="w-3 rounded-full bg-emerald-400" style="height:22%"></div></div><span class="text-[11px] font-bold text-slate-400">T</span></div>
        <div class="flex flex-col items-center gap-2"><div class="flex items-end gap-1 h-[110px]"><div class="w-3 rounded-full bg-sky-500" style="height:82%"></div><div class="w-3 rounded-full bg-amber-400" style="height:48%"></div></div><span class="text-[11px] font-bold text-slate-400">W</span></div>
        <div class="flex flex-col items-center gap-2"><div class="flex items-end gap-1 h-[110px]"><div class="w-3 rounded-full bg-sky-500" style="height:72%"></div><div class="w-3 rounded-full bg-emerald-400" style="height:34%"></div></div><span class="text-[11px] font-bold text-sky-600">T</span></div>
        <div class="flex flex-col items-center gap-2 opacity-40"><div class="flex items-end gap-1 h-[110px]"><div class="w-3 rounded-full bg-slate-200" style="height:20%"></div><div class="w-3 rounded-full bg-slate-200" style="height:12%"></div></div><span class="text-[11px] font-bold text-slate-400">F</span></div>
      </div>
    </div>

    <!-- Streak -->
    <div class="rounded-[22px] p-4 mb-5 flex items-center gap-4 text-white" style="background:linear-gradient(135deg,#8B5CF6,#6366F1)">
      <div class="w-14 h-14 rounded-2xl bg-white/20 flex items-center justify-center text-2xl"><i class="fas fa-fire"></i></div>
      <div class="flex-1">
        <p class="text-[26px] font-black leading-none">6 trips</p>
        <p class="text-[12px] font-semibold opacity-85 mt-1">Balanced pack streak</p>
      </div>
      <div class="flex -space-x-1.5">
        <span class="w-6 h-6 rounded-full bg-white/90 text-violet-600 text-[10px] flex items-center justify-center"><i class="fas fa-check"></i></span>
        <span class="w-6 h-6 rounded-full bg-white/90 text-violet-600 text-[10px] flex items-center justify-center"><i class="fas fa-check"></i></span>
        <span class="w-6 h-6 rounded-full bg-white/40"></span>
      </div>
    </div>

    <!-- Trip list -->
    <p class="sec-title mb-3">Recent</p>
    <div class="space-y-3">
      <div class="card p-3.5 flex items-center gap-3">
        <div class="icon-tile grad-sky"><i class="fas fa-school"></i></div>
        <div class="flex-1">
          <p class="text-[14px] font-bold">To school</p>
          <p class="text-[12px] text-slate-400 font-medium">Today 7:37 · 14 min</p>
        </div>
        <div class="flex items-center gap-1.5"><span class="dot bg-amber-400"></span><span class="dot bg-emerald-500"></span></div>
      </div>
      <div class="card p-3.5 flex items-center gap-3">
        <div class="icon-tile grad-mint"><i class="fas fa-house"></i></div>
        <div class="flex-1">
          <p class="text-[14px] font-bold">Home</p>
          <p class="text-[12px] text-slate-400 font-medium">Wed 3:10 · 17 min</p>
        </div>
        <div class="flex items-center gap-1.5"><span class="dot bg-emerald-500"></span><span class="dot bg-amber-400"></span></div>
      </div>
      <div class="card p-3.5 flex items-center gap-3">
        <div class="icon-tile grad-amber"><i class="fas fa-futbol"></i></div>
        <div class="flex-1">
          <p class="text-[14px] font-bold">Soccer practice</p>
          <p class="text-[12px] text-slate-400 font-medium">Wed 4:05 · 9 min</p>
        </div>
        <div class="flex items-center gap-1.5"><span class="dot bg-rose-500"></span><span class="dot bg-emerald-500"></span></div>
      </div>
    </div>
  </div>
</div>
<div class="tab-bar">
  <div class="tab"><i class="fas fa-house"></i>Today</div>
  <div class="tab"><i class="fas fa-scale-balanced"></i>Balance</div>
  <div class="tab"><i class="fas fa-wind"></i>Air</div>
  <div class="tab active"><i class="fas fa-route"></i>Trips</div>
  <div class="tab"><i class="fas fa-user"></i>Me</div>
</div>
<div class="home-ind"></div>
</body>
</html>
