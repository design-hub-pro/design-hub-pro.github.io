<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackBalance - App Design</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  * { scrollbar-width:none; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#fff; color:#0F172A; }
  .grid-screens { display:grid; grid-template-columns:repeat(3, 460px); gap:48px 40px; justify-content:center; padding:24px 40px 96px; }
  @media (max-width:1560px) { .grid-screens { grid-template-columns:repeat(2, 460px); } }
  @media (max-width:1040px) { .grid-screens { grid-template-columns:460px; } }
  .phone { width:460px; height:980px; border-radius:62px; padding:12px; background:#0B0F17; box-shadow:0 0 0 2px #2A303B inset, 0 30px 70px rgba(15,23,42,.18), 0 10px 24px rgba(15,23,42,.10); }
  .phone iframe { width:100%; height:100%; border:0; border-radius:52px; display:block; background:#fff; }
</style>
</head>
<body>
  <header class="text-center pt-16 pb-8 px-6">
    <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-sky-500 to-emerald-500 flex items-center justify-center shadow-lg">
      <i class="fas fa-scale-balanced text-white text-3xl"></i>
    </div>
    <h1 class="text-5xl font-black tracking-tight mb-3">PackBalance</h1>
    <p class="text-lg text-slate-500 max-w-2xl mx-auto">A strap insert and app that tells kids when their backpack leans or the air turns bad.</p>
    <div class="flex items-center justify-center gap-2 mt-5 flex-wrap">
      <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Student Health</span>
      <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Load Balance</span>
      <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Air Quality</span>
      <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Wearable IoT</span>
    </div>
  </header>

  <main class="grid-screens">
    <div class="phone"><iframe src="home.html" scrolling="no" title="Today"></iframe></div>
    <div class="phone"><iframe src="balance.html" scrolling="no" title="Balance"></iframe></div>
    <div class="phone"><iframe src="alert.html" scrolling="no" title="Load alert"></iframe></div>
    <div class="phone"><iframe src="air.html" scrolling="no" title="Air quality"></iframe></div>
    <div class="phone"><iframe src="trips.html" scrolling="no" title="Trips"></iframe></div>
    <div class="phone"><iframe src="profile.html" scrolling="no" title="Me"></iframe></div>
    <div class="phone"><iframe src="setup.html" scrolling="no" title="Setup"></iframe></div>
    <div class="phone"><iframe src="parent.html" scrolling="no" title="Parent view"></iframe></div>
  </main>
</body>
</html>
