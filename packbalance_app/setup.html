<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackBalance - Setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body style="background:#fff">
<div class="screen">
  <div class="status-bar">
    <span class="time">6:58</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full text-[15px]"></i></div>
  </div>

  <div class="content" style="padding-bottom:40px">
    <!-- Progress -->
    <div class="flex items-center gap-3 mt-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-left"></i></div>
      <div class="flex-1 flex gap-1.5">
        <span class="h-1.5 flex-1 rounded-full bg-sky-500"></span>
        <span class="h-1.5 flex-1 rounded-full bg-sky-500"></span>
        <span class="h-1.5 flex-1 rounded-full bg-sky-500/30"></span>
        <span class="h-1.5 flex-1 rounded-full bg-slate-100"></span>
      </div>
      <span class="text-[13px] font-bold text-slate-400">2 of 4</span>
    </div>

    <!-- Hero image -->
    <div class="relative rounded-[28px] overflow-hidden h-[300px] mb-6">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1792805730693-image-1.png" class="absolute inset-0 w-full h-full object-cover" alt="Sliding the insert into a strap">
      <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4 flex gap-2">
        <span class="chip bg-white text-slate-800"><span class="w-5 h-5 rounded-full bg-amber-500 text-white flex items-center justify-center text-[10px] font-black">L</span>Found</span>
        <span class="chip bg-white text-slate-800"><span class="w-5 h-5 rounded-full bg-sky-500 text-white flex items-center justify-center text-[10px] font-black">R</span>Found</span>
      </div>
    </div>

    <h1 class="text-[30px] font-black leading-tight tracking-tight mb-2">Zero the straps</h1>
    <p class="text-[15px] text-slate-500 font-medium mb-6">Empty pack on. Stand tall for 5 seconds.</p>

    <!-- Calibration ring -->
    <div class="flex items-center gap-5 mb-6">
      <div class="relative w-[104px] h-[104px] flex-shrink-0">
        <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="52" stroke="#F1F5F9" stroke-width="10" fill="none"/>
          <circle cx="60" cy="60" r="52" stroke="#0EA5E9" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="131"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-[32px] font-black leading-none">3</span>
          <span class="text-[10px] font-bold text-slate-400">sec left</span>
        </div>
      </div>
      <div class="flex-1 space-y-2.5">
        <div class="flex items-center gap-2.5"><span class="w-6 h-6 rounded-full bg-emerald-500 text-white text-[11px] flex items-center justify-center"><i class="fas fa-check"></i></span><span class="text-[14px] font-bold">Pressure pads</span></div>
        <div class="flex items-center gap-2.5"><span class="w-6 h-6 rounded-full bg-emerald-500 text-white text-[11px] flex items-center justify-center"><i class="fas fa-check"></i></span><span class="text-[14px] font-bold">Motion sensor</span></div>
        <div class="flex items-center gap-2.5"><span class="w-6 h-6 rounded-full border-2 border-sky-500 border-t-transparent animate-spin"></span><span class="text-[14px] font-bold text-slate-500">Air sensor warm-up</span></div>
      </div>
    </div>

    <button class="w-full h-[58px] rounded-2xl text-white text-[16px] font-extrabold" style="background:linear-gradient(135deg,#0EA5E9,#10B981)">Hold still</button>
  </div>
</div>
<div class="home-ind"></div>
</body>
</html>
