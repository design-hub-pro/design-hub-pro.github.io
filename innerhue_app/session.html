<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innerhue · Session</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap');
*{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.handwriting{font-family:'Caveat',cursive;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#1a0f2e;}
.screen{width:100%;height:100%;overflow-y:auto;position:relative;color:white;background:linear-gradient(180deg,#2D1B69 0%,#1A0F2E 100%);}
.statusbar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;color:#fff;}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:36px;background:#000;border-radius:20px;}
.brand-grad{background:linear-gradient(135deg,#C4B5FD 0%,#FBCFE8 100%);}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.breathing{animation:breathe 5s ease-in-out infinite;}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="statusbar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-[11px]"></i>
      <i class="fas fa-wifi text-[11px]"></i>
      <i class="fas fa-battery-full text-[13px]"></i>
    </div>
  </div>

  <!-- Top -->
  <div class="px-7 pt-3 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fas fa-chevron-left text-white text-sm"></i></button>
    <p class="text-[12px] uppercase tracking-widest text-purple-200 font-bold">Step 2 of 5</p>
    <button class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fas fa-ellipsis-h text-white text-xs"></i></button>
  </div>

  <!-- Progress -->
  <div class="px-7 mt-4 flex gap-1.5">
    <div class="flex-1 h-1 bg-white rounded-full"></div>
    <div class="flex-1 h-1 bg-white rounded-full"></div>
    <div class="flex-1 h-1 bg-white/20 rounded-full"></div>
    <div class="flex-1 h-1 bg-white/20 rounded-full"></div>
    <div class="flex-1 h-1 bg-white/20 rounded-full"></div>
  </div>

  <!-- Hero illustration -->
  <div class="flex justify-center items-center mt-8 mb-4 relative h-56">
    <div class="absolute w-56 h-56 rounded-full brand-grad opacity-30 blur-2xl breathing"></div>
    <div class="absolute w-44 h-44 rounded-full brand-grad opacity-50 blur-xl breathing" style="animation-delay:.5s"></div>
    <div class="relative w-36 h-36 rounded-full overflow-hidden shadow-2xl border-4 border-white/30 breathing">
      <img src="https://images.unsplash.com/photo-1518715308788-3005759c61d4?w=400" class="w-full h-full object-cover"/>
    </div>
  </div>

  <!-- Title & prompt -->
  <div class="px-7 text-center">
    <p class="text-[11px] uppercase tracking-widest text-purple-200 font-bold">Drawing Your Soft Silhouette</p>
    <h1 class="text-[24px] font-bold text-white mt-2 leading-tight">Pick the color of<br/>kindness</h1>
    <p class="handwriting text-[20px] text-pink-200 mt-3 leading-tight">"What color does your body feel safest in?"</p>
  </div>

  <!-- Audio guide -->
  <div class="px-7 mt-6">
    <div class="glass rounded-2xl p-4 flex items-center gap-3">
      <div class="w-12 h-12 rounded-full brand-grad flex items-center justify-center shadow-lg">
        <i class="fas fa-pause text-white"></i>
      </div>
      <div class="flex-1">
        <p class="text-[13px] font-bold text-white">Soft Voice · Aiyana</p>
        <div class="flex items-center gap-2 mt-1.5">
          <div class="flex-1 h-1 bg-white/15 rounded-full relative">
            <div class="absolute left-0 top-0 h-1 bg-pink-300 rounded-full" style="width:38%"></div>
          </div>
          <span class="text-[10px] text-white/70 font-mono">2:14 / 5:48</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Color picker -->
  <div class="px-7 mt-6">
    <p class="text-[11px] uppercase tracking-widest text-white/50 font-bold mb-3 text-center">Tap your hue</p>
    <div class="flex justify-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-300 to-rose-400"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-300 to-indigo-400 ring-4 ring-white/40"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-300 to-cyan-400"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-300 to-teal-400"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-200 to-orange-300"></div>
    </div>
  </div>

  <!-- Stats during session -->
  <div class="px-7 mt-6">
    <div class="grid grid-cols-3 gap-2">
      <div class="glass rounded-xl p-2.5 text-center">
        <p class="text-[10px] text-white/60 uppercase tracking-wider font-semibold">Heart</p>
        <p class="text-[20px] font-bold text-white mt-0.5">62</p>
      </div>
      <div class="glass rounded-xl p-2.5 text-center">
        <p class="text-[10px] text-white/60 uppercase tracking-wider font-semibold">Breaths</p>
        <p class="text-[20px] font-bold text-white mt-0.5">14</p>
      </div>
      <div class="glass rounded-xl p-2.5 text-center">
        <p class="text-[10px] text-white/60 uppercase tracking-wider font-semibold">Strokes</p>
        <p class="text-[20px] font-bold text-white mt-0.5">38</p>
      </div>
    </div>
  </div>

  <!-- Continue -->
  <div class="px-7 mt-6 mb-6">
    <button class="w-full py-4 rounded-2xl bg-white text-purple-700 font-bold text-[15px] shadow-2xl flex items-center justify-center gap-2">
      Continue · Step 3 <i class="fas fa-arrow-right text-xs"></i>
    </button>
  </div>
</div>
</body>
</html>
