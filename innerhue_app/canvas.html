<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innerhue · Canvas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap');
*{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.handwriting{font-family:'Caveat',cursive;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#1a0f2e;}
.screen{width:100%;height:100%;overflow-y:auto;background:#1a0f2e;position:relative;color:white;}
.statusbar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;color:#fff;}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:36px;background:#000;border-radius:20px;}
.brand-grad{background:linear-gradient(135deg,#C4B5FD 0%,#FBCFE8 100%);}
.canvas-area{background:radial-gradient(circle at 30% 40%,rgba(196,181,253,0.45),transparent 50%),radial-gradient(circle at 70% 60%,rgba(251,207,232,0.45),transparent 55%),radial-gradient(circle at 50% 80%,rgba(167,243,208,0.35),transparent 45%),#fefcf8;}
.color-dot{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,0.15);transition:transform .2s;}
.color-dot.active{border-color:#fff;transform:scale(1.15);}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="statusbar">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-[11px]"></i>
      <i class="fas fa-wifi text-[11px]"></i>
      <i class="fas fa-battery-full text-[13px]"></i>
    </div>
  </div>

  <!-- Top nav -->
  <div class="px-7 pt-3 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center"><i class="fas fa-times text-white text-sm"></i></button>
    <div class="flex flex-col items-center">
      <p class="text-[10px] uppercase tracking-widest text-white/50 font-semibold">Free Canvas</p>
      <div class="flex items-center gap-1.5 mt-0.5"><span class="w-1.5 h-1.5 bg-rose-300 rounded-full"></span><span class="text-[12px] text-white font-medium">Anxious · 6/10</span></div>
    </div>
    <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center"><i class="fas fa-undo text-white text-xs"></i></button>
  </div>

  <!-- AI mood read -->
  <div class="px-7 mt-4">
    <div class="bg-white/8 backdrop-blur border border-white/10 rounded-2xl p-3 flex items-center gap-3" style="background:rgba(255,255,255,0.06);">
      <div class="w-9 h-9 rounded-full brand-grad flex items-center justify-center"><i class="fas fa-sparkles text-white text-xs"></i></div>
      <div class="flex-1">
        <p class="text-[10px] text-purple-200 uppercase tracking-wider font-bold">Hue Read</p>
        <p class="text-[12px] text-white/90 leading-snug mt-0.5">Your strokes feel quick & tight. Try slowing down — breathe in, swirl wide.</p>
      </div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="px-7 mt-4">
    <div class="canvas-area relative rounded-[28px] overflow-hidden" style="height:380px;">
      <!-- watercolor strokes -->
      <svg viewBox="0 0 400 400" class="absolute inset-0 w-full h-full">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%"><stop offset="0%" stop-color="#A78BFA" stop-opacity="0.7"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
          <radialGradient id="g2" cx="50%" cy="50%"><stop offset="0%" stop-color="#F472B6" stop-opacity="0.6"/><stop offset="100%" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
          <radialGradient id="g3" cx="50%" cy="50%"><stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/><stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/></radialGradient>
          <radialGradient id="g4" cx="50%" cy="50%"><stop offset="0%" stop-color="#34D399" stop-opacity="0.5"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="120" cy="140" rx="110" ry="80" fill="url(#g1)"/>
        <ellipse cx="280" cy="180" rx="100" ry="70" fill="url(#g2)"/>
        <ellipse cx="220" cy="290" rx="120" ry="80" fill="url(#g3)"/>
        <ellipse cx="100" cy="310" rx="80" ry="60" fill="url(#g4)"/>
        <path d="M 60 200 Q 150 130 240 220 T 360 240" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 80 280 Q 180 240 280 310" stroke="#EC4899" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
        <circle cx="180" cy="200" r="12" fill="#F472B6" opacity="0.6"/>
        <circle cx="260" cy="120" r="8" fill="#A78BFA" opacity="0.7"/>
        <circle cx="320" cy="280" r="6" fill="#FCD34D" opacity="0.8"/>
      </svg>
      <p class="handwriting absolute bottom-3 right-4 text-[18px] text-purple-700/70">untitled · 2m</p>
    </div>
  </div>

  <!-- Color palette -->
  <div class="px-7 mt-5">
    <div class="flex items-center justify-between mb-3">
      <p class="text-[11px] uppercase tracking-widest text-white/50 font-bold">Hues</p>
      <p class="text-[11px] text-purple-300 font-semibold">+ Custom</p>
    </div>
    <div class="flex gap-2.5 overflow-x-auto pb-1">
      <div class="color-dot active flex-shrink-0" style="background:#A78BFA;"></div>
      <div class="color-dot flex-shrink-0" style="background:#F472B6;"></div>
      <div class="color-dot flex-shrink-0" style="background:#FCD34D;"></div>
      <div class="color-dot flex-shrink-0" style="background:#34D399;"></div>
      <div class="color-dot flex-shrink-0" style="background:#60A5FA;"></div>
      <div class="color-dot flex-shrink-0" style="background:#FB7185;"></div>
      <div class="color-dot flex-shrink-0" style="background:#FDBA74;"></div>
      <div class="color-dot flex-shrink-0" style="background:#1F2937;"></div>
    </div>
  </div>

  <!-- Brushes -->
  <div class="px-7 mt-5">
    <div class="grid grid-cols-4 gap-2.5">
      <button class="bg-white/10 rounded-xl p-3 flex flex-col items-center gap-1.5 border-2 border-purple-400">
        <i class="fas fa-paint-brush text-purple-300 text-base"></i>
        <span class="text-[10px] font-semibold text-white">Watercolor</span>
      </button>
      <button class="bg-white/10 rounded-xl p-3 flex flex-col items-center gap-1.5 border-2 border-transparent">
        <i class="fas fa-pencil-alt text-white/60 text-base"></i>
        <span class="text-[10px] font-medium text-white/70">Pencil</span>
      </button>
      <button class="bg-white/10 rounded-xl p-3 flex flex-col items-center gap-1.5 border-2 border-transparent">
        <i class="fas fa-spray-can text-white/60 text-base"></i>
        <span class="text-[10px] font-medium text-white/70">Spray</span>
      </button>
      <button class="bg-white/10 rounded-xl p-3 flex flex-col items-center gap-1.5 border-2 border-transparent">
        <i class="fas fa-eraser text-white/60 text-base"></i>
        <span class="text-[10px] font-medium text-white/70">Erase</span>
      </button>
    </div>
  </div>

  <!-- Brush size slider -->
  <div class="px-7 mt-4">
    <div class="bg-white/5 rounded-xl p-3 flex items-center gap-3">
      <i class="fas fa-circle text-white/40 text-[8px]"></i>
      <div class="flex-1 h-1 bg-white/15 rounded-full relative">
        <div class="absolute left-0 top-0 h-1 brand-grad rounded-full" style="width:55%"></div>
        <div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg" style="left:53%"></div>
      </div>
      <i class="fas fa-circle text-white/70 text-base"></i>
    </div>
  </div>

  <!-- Save bar -->
  <div class="px-7 mt-5 mb-6">
    <div class="flex gap-3">
      <button class="flex-1 py-3.5 rounded-2xl bg-white/10 border border-white/15 font-semibold text-white text-[14px]">Keep private</button>
      <button class="flex-1 py-3.5 rounded-2xl brand-grad font-bold text-white text-[14px] shadow-lg shadow-purple-500/30">Save & share</button>
    </div>
  </div>
</div>
</body>
</html>
