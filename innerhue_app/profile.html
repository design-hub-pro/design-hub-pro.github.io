<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innerhue · Me</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap');
*{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
.handwriting{font-family:'Caveat',cursive;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#FDF8F2;}
.screen{width:100%;height:100%;overflow-y:auto;background:#FDF8F2;position:relative;}
.statusbar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;color:#1F2937;}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:36px;background:#000;border-radius:20px;}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(253,248,242,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,0.04);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:#9CA3AF;font-size:10px;font-weight:500;}
.tab.active{color:#7C3AED;}
.tab i{font-size:20px;}
.brand-grad{background:linear-gradient(135deg,#C4B5FD 0%,#FBCFE8 100%);}
.warm-grad{background:linear-gradient(135deg,#FDE68A 0%,#FDA4AF 100%);}
.calm-grad{background:linear-gradient(135deg,#A7F3D0 0%,#BAE6FD 100%);}
.text-grad{background:linear-gradient(135deg,#7C3AED,#EC4899);-webkit-background-clip:text;background-clip:text;color:transparent;}
.profile-bg{background:linear-gradient(180deg,rgba(196,181,253,0.5) 0%,rgba(251,207,232,0.3) 50%,#FDF8F2 100%);}
</style>
</head>
<body>
<div class="screen pb-28">
  <div class="dynamic-island"></div>
  <div class="profile-bg absolute inset-x-0 top-0 h-72"></div>

  <div class="statusbar relative">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-[11px]"></i>
      <i class="fas fa-wifi text-[11px]"></i>
      <i class="fas fa-battery-full text-[13px]"></i>
    </div>
  </div>

  <!-- Top -->
  <div class="px-7 pt-2 flex justify-between relative">
    <button class="w-10 h-10 rounded-full bg-white/80 backdrop-blur shadow-sm flex items-center justify-center"><i class="fas fa-share-alt text-gray-700 text-sm"></i></button>
    <button class="w-10 h-10 rounded-full bg-white/80 backdrop-blur shadow-sm flex items-center justify-center"><i class="fas fa-cog text-gray-700 text-sm"></i></button>
  </div>

  <!-- Avatar -->
  <div class="flex flex-col items-center mt-4 relative">
    <div class="relative">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300" class="w-24 h-24 rounded-full object-cover ring-4 ring-white shadow-lg"/>
      <div class="absolute bottom-0 right-0 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md">
        <span class="text-base">🌸</span>
      </div>
    </div>
    <h1 class="text-[22px] font-bold text-gray-900 mt-3">Maya Chen</h1>
    <p class="handwriting text-[18px] text-purple-600">"In quiet recovery."</p>
    <div class="flex items-center gap-1.5 mt-2 px-3 py-1 bg-white/80 backdrop-blur rounded-full shadow-sm">
      <i class="fas fa-fire text-orange-500 text-[10px]"></i>
      <span class="text-[11px] font-bold text-gray-800">Day 47 of bloom</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="px-7 mt-5">
    <div class="bg-white rounded-2xl p-4 shadow-sm grid grid-cols-3 divide-x divide-gray-100">
      <div class="text-center"><p class="text-[22px] font-bold text-gray-900">126</p><p class="text-[10px] text-gray-500 mt-0.5 font-medium">Paintings</p></div>
      <div class="text-center"><p class="text-[22px] font-bold text-grad">8</p><p class="text-[10px] text-gray-500 mt-0.5 font-medium">Sessions</p></div>
      <div class="text-center"><p class="text-[22px] font-bold text-gray-900">312</p><p class="text-[10px] text-gray-500 mt-0.5 font-medium">Followers</p></div>
    </div>
  </div>

  <!-- Achievements -->
  <div class="px-7 mt-5">
    <div class="flex items-center justify-between mb-3">
      <p class="text-[15px] font-bold text-gray-900">Achievements</p>
      <p class="text-[11px] text-purple-600 font-semibold">7 / 24</p>
    </div>
    <div class="flex gap-3 overflow-x-auto -mx-7 px-7 pb-2">
      <div class="flex-shrink-0 flex flex-col items-center gap-2">
        <div class="w-16 h-16 brand-grad rounded-2xl flex items-center justify-center shadow-md"><i class="fas fa-seedling text-white text-xl"></i></div>
        <p class="text-[10px] font-bold text-gray-800">First Bloom</p>
      </div>
      <div class="flex-shrink-0 flex flex-col items-center gap-2">
        <div class="w-16 h-16 warm-grad rounded-2xl flex items-center justify-center shadow-md"><i class="fas fa-fire text-white text-xl"></i></div>
        <p class="text-[10px] font-bold text-gray-800">30-day fire</p>
      </div>
      <div class="flex-shrink-0 flex flex-col items-center gap-2">
        <div class="w-16 h-16 calm-grad rounded-2xl flex items-center justify-center shadow-md"><i class="fas fa-feather text-white text-xl"></i></div>
        <p class="text-[10px] font-bold text-gray-800">Soft Voice</p>
      </div>
      <div class="flex-shrink-0 flex flex-col items-center gap-2">
        <div class="w-16 h-16 bg-gray-200 rounded-2xl flex items-center justify-center"><i class="fas fa-lock text-gray-400 text-lg"></i></div>
        <p class="text-[10px] font-medium text-gray-400">Locked</p>
      </div>
      <div class="flex-shrink-0 flex flex-col items-center gap-2">
        <div class="w-16 h-16 bg-gray-200 rounded-2xl flex items-center justify-center"><i class="fas fa-lock text-gray-400 text-lg"></i></div>
        <p class="text-[10px] font-medium text-gray-400">Locked</p>
      </div>
    </div>
  </div>

  <!-- Gallery tabs -->
  <div class="px-7 mt-6">
    <div class="flex gap-6 border-b border-gray-200">
      <div class="pb-2 border-b-2 border-purple-600"><p class="text-[13px] font-bold text-purple-700">My Art</p></div>
      <div class="pb-2"><p class="text-[13px] font-medium text-gray-400">Saved</p></div>
      <div class="pb-2"><p class="text-[13px] font-medium text-gray-400">Sessions</p></div>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <img src="https://images.unsplash.com/photo-1547891654-e66ed7ebb968?w=300" class="aspect-square w-full rounded-xl object-cover"/>
      <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=300" class="aspect-square w-full rounded-xl object-cover"/>
      <img src="https://images.unsplash.com/photo-1533827432537-70133748f5c8?w=300" class="aspect-square w-full rounded-xl object-cover"/>
      <img src="https://images.unsplash.com/photo-1502691876148-a84978e59af8?w=300" class="aspect-square w-full rounded-xl object-cover"/>
      <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=300" class="aspect-square w-full rounded-xl object-cover"/>
      <img src="https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=300" class="aspect-square w-full rounded-xl object-cover"/>
    </div>
  </div>

  <!-- Care team -->
  <div class="px-7 mt-6">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[13px] font-bold text-gray-900">My care team</p>
        <button class="text-[11px] text-purple-600 font-bold">Manage</button>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=200" class="w-11 h-11 rounded-full object-cover"/>
          <div>
            <p class="text-[12px] font-bold text-gray-900">Dr. Aiyana Ross</p>
            <p class="text-[10px] text-gray-500">Therapist · Wed 4pm</p>
          </div>
        </div>
        <div class="w-9 h-9 rounded-full brand-grad flex items-center justify-center"><i class="fas fa-video text-white text-xs"></i></div>
      </div>
    </div>
  </div>

  <div class="h-6"></div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-home"></i><span>Home</span></div>
    <div class="tab"><i class="fas fa-utensils"></i><span>Log</span></div>
    <div class="tab" style="margin-top:-22px;">
      <div class="w-14 h-14 rounded-full brand-grad flex items-center justify-center shadow-lg shadow-purple-300/60">
        <i class="fas fa-palette text-white text-lg"></i>
      </div>
    </div>
    <div class="tab"><i class="fas fa-users"></i><span>Circle</span></div>
    <div class="tab active"><i class="fas fa-user"></i><span>Me</span></div>
  </div>
</div>
</body>
</html>
