<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:4px 28px 110px;}
.tabular{font-variant-numeric:tabular-nums;}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.greet-sub{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.greet-name{font-size:24px;font-weight:800;margin-top:2px;}
.bell-btn{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink);}
.bell-dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:2px solid var(--surface);}
.hero{position:relative;border-radius:24px;overflow:hidden;height:210px;box-shadow:0 18px 36px rgba(15,23,42,0.16);}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 30%,rgba(15,23,42,0.75) 100%);}
.hero-content{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;}
.hero-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:0.5px;color:#86efac;margin-bottom:6px;}
.hero-status .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;}
.hero-title{font-size:26px;font-weight:800;}
.hero-sub{font-size:12px;font-weight:600;opacity:0.85;margin-top:2px;}
.chip-row{display:flex;gap:10px;margin-top:14px;}
.dev-chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.dev-chip i{color:var(--accent);font-size:15px;}
.dc-title{font-size:12px;font-weight:800;}
.dc-sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.stat-val{font-size:22px;font-weight:900;letter-spacing:-0.5px;}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.3px;text-transform:uppercase;margin-top:3px;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;}
.sec-title{font-size:15px;font-weight:800;}
.sec-action{font-size:12px;font-weight:700;color:var(--accent);}
.alert-prev{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.ap-icon{width:42px;height:42px;border-radius:13px;background:#fee2e2;color:#ef4444;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ap-body{flex:1;}
.ap-title{font-size:14px;font-weight:800;}
.ap-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
.ap-chev{color:var(--muted);}
.cta-btn{margin-top:16px;width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;text-align:center;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 28px rgba(37,99,235,0.3);}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-top:10px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);}
.tab-item.active{color:var(--accent);}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="top-row">
      <div>
        <div class="greet-sub">Good Morning</div>
        <div class="greet-name">Alex</div>
      </div>
      <div class="bell-btn"><i class="fas fa-bell"></i><div class="bell-dot"></div></div>
    </div>

    <div class="hero">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790696338501-image-1.png" alt="Open highway at dusk">
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <div class="hero-status"><span class="dot"></span>ALL CLEAR</div>
        <div class="hero-title">0 alerts today</div>
        <div class="hero-sub">Listening since 8:02 AM</div>
      </div>
    </div>

    <div class="chip-row">
      <div class="dev-chip"><i class="fas fa-chair"></i><div><div class="dc-title tabular">82%</div><div class="dc-sub">Seat Pad</div></div></div>
      <div class="dev-chip"><i class="fas fa-ear-listen"></i><div><div class="dc-title">Connected</div><div class="dc-sub">Listener</div></div></div>
    </div>

    <div class="stat-row">
      <div class="stat-tile"><div class="stat-val tabular">3</div><div class="stat-lbl">Alerts</div></div>
      <div class="stat-tile"><div class="stat-val tabular">42m</div><div class="stat-lbl">Drive time</div></div>
      <div class="stat-tile"><div class="stat-val tabular">78</div><div class="stat-lbl">Peak dB</div></div>
    </div>

    <div class="sec-head">
      <div class="sec-title">Recent Alert</div>
      <div class="sec-action">See all</div>
    </div>
    <div class="alert-prev">
      <div class="ap-icon"><i class="fas fa-truck-medical"></i></div>
      <div class="ap-body">
        <div class="ap-title">Siren · Front Right</div>
        <div class="ap-sub">6:41 PM · 92% match</div>
      </div>
      <i class="fas fa-chevron-right ap-chev"></i>
    </div>

    <div class="cta-btn"><i class="fas fa-waveform-lines"></i>Start Live Monitor</div>
  </div>
  <div class="tab-bar">
    <div class="tab-item active"><i class="fas fa-house"></i>Home</div>
    <div class="tab-item"><i class="fas fa-ear-listen"></i>Listen</div>
    <div class="tab-item"><i class="fas fa-clock-rotate-left"></i>History</div>
    <div class="tab-item"><i class="fas fa-gear"></i>Settings</div>
  </div>
</div>
</body>
</html>
