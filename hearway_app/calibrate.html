<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seat Zones</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:6px 28px 40px;}
.tabular{font-variant-numeric:tabular-nums;}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.back-btn{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.nav-title{font-size:17px;font-weight:800;}
.saved-badge{display:flex;align-items:center;gap:5px;background:#dcfce7;color:#16a34a;font-size:11px;font-weight:800;padding:6px 10px;border-radius:20px;}
.seat-diagram{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 10px 24px rgba(15,23,42,0.05);margin-bottom:18px;}
.seat-shape{width:170px;height:220px;margin:0 auto;display:grid;grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;gap:6px;}
.zone-btn{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--border);background:#f4f6fb;color:var(--muted);font-size:11px;font-weight:800;}
.zone-btn.selected{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;box-shadow:0 10px 20px rgba(37,99,235,0.3);}
.zone-btn i{font-size:15px;}
.slider-row{margin-top:20px;}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.slider-head .zname{font-size:15px;font-weight:800;}
.slider-head .zval{font-size:20px;font-weight:900;color:var(--accent);}
.slider-track{height:10px;background:var(--border);border-radius:10px;position:relative;}
.slider-fill{height:100%;width:80%;border-radius:10px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.slider-handle{position:absolute;top:50%;left:80%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,0.2);}
.test-btn{margin-top:18px;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);text-align:center;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);}
.list-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:20px 0 10px;}
.zrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.zrow:last-child{border-bottom:none;}
.zrow .zicon{width:38px;height:38px;border-radius:11px;background:#eef2fa;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:14px;}
.zrow .zn{flex:1;font-size:14px;font-weight:700;}
.zrow .zbar{width:70px;height:6px;background:var(--border);border-radius:6px;overflow:hidden;}
.zrow .zbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));}
.zrow .zpct{width:34px;text-align:right;font-size:12px;font-weight:800;color:var(--muted);}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="nav-row">
      <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="nav-title">Seat Zones</div>
      <div class="saved-badge"><i class="fas fa-check"></i>Saved</div>
    </div>

    <div class="seat-diagram">
      <div class="seat-shape">
        <div class="zone-btn">Front Left</div>
        <div class="zone-btn selected"><i class="fas fa-wave-square"></i>Front Right</div>
        <div class="zone-btn">Back Left</div>
        <div class="zone-btn">Back Right</div>
      </div>

      <div class="slider-row">
        <div class="slider-head"><span class="zname">Front Right</span><span class="zval tabular">80%</span></div>
        <div class="slider-track"><div class="slider-fill"></div><div class="slider-handle"></div></div>
      </div>

      <div class="test-btn"><i class="fas fa-bolt"></i>Test Vibration</div>
    </div>

    <div class="list-label">All Zones</div>
    <div class="zrow"><div class="zicon"><i class="fas fa-square"></i></div><div class="zn">Front Left</div><div class="zbar"><span style="width:65%"></span></div><div class="zpct">65%</div></div>
    <div class="zrow"><div class="zicon"><i class="fas fa-square"></i></div><div class="zn">Front Right</div><div class="zbar"><span style="width:80%"></span></div><div class="zpct">80%</div></div>
    <div class="zrow"><div class="zicon"><i class="fas fa-square"></i></div><div class="zn">Back Left</div><div class="zbar"><span style="width:55%"></span></div><div class="zpct">55%</div></div>
    <div class="zrow"><div class="zicon"><i class="fas fa-square"></i></div><div class="zn">Back Right</div><div class="zbar"><span style="width:55%"></span></div><div class="zpct">55%</div></div>
  </div>
</div>
</body>
</html>
