<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:#0f172a;color:#fff;}
.screen{width:100%;height:100%;position:relative;overflow:hidden;}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0.55) 0%,rgba(15,23,42,0.35) 35%,rgba(15,23,42,0.92) 100%);}
.status-bar{position:relative;z-index:2;height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:3;}
.body{position:relative;z-index:2;padding:6px 28px;height:calc(100% - 59px);display:flex;flex-direction:column;}
.conf-chip{align-self:flex-start;display:flex;align-items:center;gap:6px;background:rgba(239,68,68,0.22);border:1px solid rgba(239,68,68,0.5);color:#fecaca;font-size:11px;font-weight:800;letter-spacing:0.5px;padding:7px 12px;border-radius:20px;margin-top:6px;}
.big-label{font-size:34px;font-weight:900;line-height:1.05;margin-top:14px;letter-spacing:-0.5px;}
.big-sub{font-size:13px;color:rgba(255,255,255,0.7);font-weight:600;margin-top:6px;}
.compass-wrap{margin:22px auto 0;position:relative;width:190px;height:190px;}
.zone-tag{position:absolute;font-size:10px;font-weight:800;letter-spacing:0.5px;color:rgba(255,255,255,0.55);}
.center-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#f97316);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(239,68,68,0.18);}
.seat-strip{display:flex;align-items:center;gap:14px;margin-top:auto;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:18px;padding:14px 16px;}
.seat-grid{width:56px;height:56px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;flex-shrink:0;}
.seat-cell{border-radius:6px;background:rgba(255,255,255,0.12);}
.seat-cell.hit{background:linear-gradient(135deg,#f97316,#ef4444);}
.seat-txt{flex:1;}
.seat-txt .t1{font-size:13px;font-weight:800;}
.seat-txt .t2{font-size:11px;color:rgba(255,255,255,0.6);font-weight:600;margin-top:2px;}
.actions{display:flex;gap:10px;margin-top:14px;margin-bottom:8px;}
.btn-primary{flex:1;text-align:center;padding:16px;border-radius:16px;background:#fff;color:#0f172a;font-size:14px;font-weight:800;}
.btn-ghost{flex:1;text-align:center;padding:16px;border-radius:16px;border:1.5px solid rgba(255,255,255,0.3);color:#fff;font-size:14px;font-weight:800;}
.tabular{font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="screen">
  <img class="hero-img" src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790696340271-image-1.png" alt="Ambulance light reflected on wet window">
  <div class="scrim"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="dynamic-island"></div>
  <div class="body">
    <div class="conf-chip"><i class="fas fa-circle-exclamation"></i>92% MATCH</div>
    <div class="big-label">Siren Detected</div>
    <div class="big-sub">6:41 PM · Front Right · Hwy 101</div>

    <div class="compass-wrap">
      <svg width="190" height="190" viewBox="0 0 190 190">
        <circle cx="95" cy="95" r="82" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10"/>
        <circle cx="95" cy="95" r="82" fill="none" stroke="url(#g2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="380" transform="rotate(-90 95 95)"/>
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ef4444"/></linearGradient></defs>
      </svg>
      <div class="zone-tag" style="top:4px;left:50%;transform:translateX(-50%);">FL</div>
      <div class="zone-tag" style="top:4px;right:4px;color:#fecaca;">FR</div>
      <div class="zone-tag" style="bottom:4px;left:4px;">BL</div>
      <div class="zone-tag" style="bottom:4px;right:4px;">BR</div>
      <div class="center-icon"><i class="fas fa-truck-medical" style="color:#fff;font-size:22px;"></i></div>
    </div>

    <div class="seat-strip">
      <div class="seat-grid">
        <div class="seat-cell"></div><div class="seat-cell hit"></div>
        <div class="seat-cell"></div><div class="seat-cell"></div>
      </div>
      <div class="seat-txt">
        <div class="t1">Seat zone triggered</div>
        <div class="t2 tabular">Front right · 82% intensity</div>
      </div>
    </div>

    <div class="actions">
      <div class="btn-ghost">Dismiss</div>
      <div class="btn-primary">View Details</div>
    </div>
  </div>
</div>
</body>
</html>
