<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pair Devices</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:6px 28px 30px;text-align:center;}
.app-icon{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;margin:4px auto 12px;box-shadow:0 10px 22px rgba(37,99,235,0.3);}
.app-title{font-size:24px;font-weight:800;}
.app-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;}
.hero{margin-top:18px;border-radius:22px;overflow:hidden;box-shadow:0 16px 32px rgba(15,23,42,0.14);height:170px;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0;}
.step-dot{width:26px;height:4px;border-radius:4px;background:var(--border);}
.step-dot.done{background:linear-gradient(90deg,var(--accent2),var(--accent));}
.device-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;text-align:left;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.d-icon{width:44px;height:44px;border-radius:13px;background:#eef2fa;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px;flex-shrink:0;}
.d-body{flex:1;}
.d-name{font-size:14px;font-weight:800;}
.d-status{font-size:12px;font-weight:700;margin-top:2px;}
.d-status.ok{color:#16a34a;}
.d-status.searching{color:var(--muted);}
.state-icon{font-size:16px;}
.state-icon.ok{color:#16a34a;}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);}
.cta{margin-top:16px;width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;text-align:center;font-size:15px;font-weight:800;box-shadow:0 14px 28px rgba(37,99,235,0.32);}
.skip{margin-top:14px;font-size:13px;color:var(--muted);font-weight:700;}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="app-icon"><i class="fas fa-ear-listen" style="color:#fff;font-size:24px;"></i></div>
    <div class="app-title">HearWay</div>
    <div class="app-sub">Pair your devices to get started</div>

    <div class="hero"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790696341521-image-1.png" alt="Listener and seat pad syncing"></div>

    <div class="steps"><div class="step-dot done"></div><div class="step-dot"></div></div>

    <div class="device-card">
      <div class="d-icon"><i class="fas fa-ear-listen"></i></div>
      <div class="d-body">
        <div class="d-name">Listener</div>
        <div class="d-status ok">Connected</div>
      </div>
      <i class="fas fa-circle-check state-icon ok"></i>
    </div>

    <div class="device-card">
      <div class="d-icon"><i class="fas fa-chair"></i></div>
      <div class="d-body">
        <div class="d-name">Seat Pad</div>
        <div class="d-status searching">Searching…</div>
      </div>
      <div class="spinner"></div>
    </div>

    <div class="cta">Continue</div>
    <div class="skip">Set up later</div>
  </div>
</div>
</body>
</html>
