<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Detail</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;--danger:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:6px 28px 40px;}
.tabular{font-variant-numeric:tabular-nums;}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.back-btn{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.nav-title{font-size:17px;font-weight:800;}
.flag-btn{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.type-row{display:flex;align-items:center;gap:14px;margin:12px 0 18px;}
.type-icon{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#fee2e2,#fecaca);display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:22px;}
.type-name{font-size:22px;font-weight:800;}
.type-meta{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(15,23,42,0.05);}
.card-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.zone-map{display:flex;align-items:center;gap:16px;}
.zone-grid{width:80px;height:80px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;}
.zone-cell{border-radius:8px;background:#eef2fa;border:1px solid var(--border);}
.zone-cell.hit{background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;}
.zone-info .dir{font-size:19px;font-weight:800;}
.zone-info .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
.wave-player{display:flex;align-items:center;gap:12px;}
.play-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.wave-bars{flex:1;display:flex;align-items:flex-end;gap:2px;height:36px;}
.wave-bars span{flex:1;background:var(--border);border-radius:3px;}
.wave-bars span.played{background:linear-gradient(180deg,var(--accent2),var(--accent));}
.class-list{display:flex;flex-direction:column;gap:10px;}
.class-row{display:flex;align-items:center;gap:10px;}
.class-label{width:88px;font-size:12px;font-weight:700;}
.class-track{flex:1;height:7px;background:var(--border);border-radius:6px;overflow:hidden;}
.class-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.class-pct{width:34px;text-align:right;font-size:12px;font-weight:800;color:var(--muted);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:#eef2fa;border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink);}
.actions{display:flex;gap:10px;margin-top:6px;}
.btn-outline{flex:1;text-align:center;padding:13px;border-radius:14px;border:1.5px solid var(--border);font-size:13px;font-weight:800;color:var(--ink);}
.btn-danger{flex:1;text-align:center;padding:13px;border-radius:14px;border:1.5px solid #fecaca;font-size:13px;font-weight:800;color:var(--danger);}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="nav-row">
      <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="nav-title">Alert Detail</div>
      <div class="flag-btn"><i class="fas fa-flag"></i></div>
    </div>

    <div class="type-row">
      <div class="type-icon"><i class="fas fa-truck-medical"></i></div>
      <div>
        <div class="type-name">Siren</div>
        <div class="type-meta">6:41 PM · Today</div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Direction & Zone</div>
      <div class="zone-map">
        <div class="zone-grid">
          <div class="zone-cell"></div>
          <div class="zone-cell hit"></div>
          <div class="zone-cell"></div>
          <div class="zone-cell"></div>
        </div>
        <div class="zone-info">
          <div class="dir">Front Right</div>
          <div class="sub">Zone triggered · 82% intensity</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Audio Snippet · 3.2s</div>
      <div class="wave-player">
        <div class="play-btn"><i class="fas fa-play" style="font-size:13px;"></i></div>
        <div class="wave-bars">
          <span class="played" style="height:40%"></span><span class="played" style="height:70%"></span><span class="played" style="height:55%"></span>
          <span class="played" style="height:90%"></span><span class="played" style="height:60%"></span><span style="height:80%"></span>
          <span style="height:45%"></span><span style="height:65%"></span><span style="height:35%"></span><span style="height:75%"></span>
          <span style="height:50%"></span><span style="height:85%"></span><span style="height:40%"></span><span style="height:60%"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Classification</div>
      <div class="class-list">
        <div class="class-row"><div class="class-label">Siren</div><div class="class-track"><div class="class-fill" style="width:92%"></div></div><div class="class-pct">92%</div></div>
        <div class="class-row"><div class="class-label">Horn</div><div class="class-track"><div class="class-fill" style="width:5%"></div></div><div class="class-pct">5%</div></div>
        <div class="class-row"><div class="class-label">Other</div><div class="class-track"><div class="class-fill" style="width:3%"></div></div><div class="class-pct">3%</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Context</div>
      <div class="chip-row">
        <div class="chip">58 mph</div>
        <div class="chip">Hwy 101</div>
        <div class="chip">92% match</div>
      </div>
    </div>

    <div class="actions">
      <div class="btn-outline">Mark False Positive</div>
      <div class="btn-danger">Delete</div>
    </div>
  </div>
</div>
</body>
</html>
