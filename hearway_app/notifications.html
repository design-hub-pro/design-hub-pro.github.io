<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;--danger:#ef4444;--warn:#f59e0b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:6px 28px 40px;}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.back-btn{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.nav-title{font-size:22px;font-weight:800;}
.mark-read{font-size:12px;font-weight:800;color:var(--accent);}
.sec-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:18px 0 10px;}
.notif-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.n-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.n-icon.warn{background:#fef3c7;color:var(--warn);}
.n-icon.info{background:#dbeafe;color:var(--accent);}
.n-icon.ok{background:#dcfce7;color:#16a34a;}
.n-body{flex:1;}
.n-title{font-size:14px;font-weight:700;}
.n-time{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;}
.n-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0;}
.n-card.read{opacity:0.6;}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="nav-row">
      <div class="back-btn"><i class="fas fa-chevron-left"></i></div>
      <div class="mark-read">Mark all read</div>
    </div>
    <div class="nav-title">Notifications</div>

    <div class="sec-label">New</div>
    <div class="notif-card">
      <div class="n-icon warn"><i class="fas fa-battery-quarter"></i></div>
      <div class="n-body">
        <div class="n-title">Seat pad battery low · 18%</div>
        <div class="n-time">2 min ago</div>
      </div>
      <div class="n-dot"></div>
    </div>
    <div class="notif-card">
      <div class="n-icon warn"><i class="fas fa-plug-circle-xmark"></i></div>
      <div class="n-body">
        <div class="n-title">Listener disconnected</div>
        <div class="n-time">1 hour ago</div>
      </div>
      <div class="n-dot"></div>
    </div>
    <div class="notif-card">
      <div class="n-icon info"><i class="fas fa-download"></i></div>
      <div class="n-body">
        <div class="n-title">Firmware update available · v2.3</div>
        <div class="n-time">3 hours ago</div>
      </div>
      <div class="n-dot"></div>
    </div>

    <div class="sec-label">Earlier</div>
    <div class="notif-card read">
      <div class="n-icon ok"><i class="fas fa-chart-simple"></i></div>
      <div class="n-body">
        <div class="n-title">Weekly summary ready · 12 alerts</div>
        <div class="n-time">Monday</div>
      </div>
    </div>
    <div class="notif-card read">
      <div class="n-icon info"><i class="fas fa-car"></i></div>
      <div class="n-body">
        <div class="n-title">Paired with 2021 Honda Civic</div>
        <div class="n-time">Last week</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
