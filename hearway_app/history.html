<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#ffffff;--bg:#eef2fa;--accent:#2563eb;--accent2:#0ea5e9;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);}
.screen{width:100%;height:100%;position:relative;overflow-y:auto;background:var(--bg);}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;}
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;}
.content{padding:4px 28px 110px;}
.tabular{font-variant-numeric:tabular-nums;}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.h-title{font-size:26px;font-weight:800;}
.count-badge{background:#dbeafe;color:var(--accent);font-size:11px;font-weight:800;padding:6px 10px;border-radius:20px;}
.banner{position:relative;border-radius:20px;overflow:hidden;height:88px;margin-bottom:16px;box-shadow:0 12px 24px rgba(15,23,42,0.1);}
.banner img{width:100%;height:100%;object-fit:cover;display:block;}
.banner-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,23,42,0.75),rgba(15,23,42,0.15));display:flex;flex-direction:column;justify-content:center;padding-left:18px;color:#fff;}
.banner-scrim .b1{font-size:16px;font-weight:800;}
.banner-scrim .b2{font-size:11px;font-weight:600;opacity:0.8;margin-top:2px;}
.filter-row{display:flex;gap:8px;margin-bottom:18px;}
.chip{padding:9px 16px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border);color:var(--muted);background:var(--surface);}
.chip.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;}
.day-label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin:16px 0 10px;}
.log-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 8px 18px rgba(15,23,42,0.04);}
.log-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);}
.log-row:last-child{border-bottom:none;}
.l-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.l-icon.siren{background:#fee2e2;color:#ef4444;}
.l-icon.horn{background:#fef3c7;color:#f59e0b;}
.l-icon.screech{background:#e0e7ff;color:#6366f1;}
.l-body{flex:1;}
.l-title{font-size:14px;font-weight:700;}
.l-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.l-right{text-align:right;}
.l-time{font-size:12px;font-weight:700;color:var(--ink);}
.l-pct{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:88px;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-top:10px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);}
.tab-item.active{color:var(--accent);}
</style>
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div style="display:flex;gap:6px;"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>
  <div class="content">
    <div class="top-row">
      <div class="h-title">History</div>
      <div class="count-badge tabular">12 this week</div>
    </div>

    <div class="banner">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790696343856-image-1.png" alt="Seat pad">
      <div class="banner-scrim">
        <div class="b1">18 sessions logged</div>
        <div class="b2">avg 6:43 min drive</div>
      </div>
    </div>

    <div class="filter-row">
      <div class="chip active">Today</div>
      <div class="chip">Week</div>
      <div class="chip">Month</div>
    </div>

    <div class="day-label">Today</div>
    <div class="log-card">
      <div class="log-row">
        <div class="l-icon siren"><i class="fas fa-truck-medical"></i></div>
        <div class="l-body"><div class="l-title">Siren</div><div class="l-sub">Front Right</div></div>
        <div class="l-right"><div class="l-time">6:41 PM</div><div class="l-pct">92%</div></div>
      </div>
      <div class="log-row">
        <div class="l-icon horn"><i class="fas fa-bullhorn"></i></div>
        <div class="l-body"><div class="l-title">Horn</div><div class="l-sub">Front Left</div></div>
        <div class="l-right"><div class="l-time">2:15 PM</div><div class="l-pct">87%</div></div>
      </div>
      <div class="log-row">
        <div class="l-icon screech"><i class="fas fa-car-burst"></i></div>
        <div class="l-body"><div class="l-title">Screeching Tires</div><div class="l-sub">Back Right</div></div>
        <div class="l-right"><div class="l-time">11:02 AM</div><div class="l-pct">76%</div></div>
      </div>
    </div>

    <div class="day-label">Yesterday</div>
    <div class="log-card">
      <div class="log-row">
        <div class="l-icon siren"><i class="fas fa-truck-medical"></i></div>
        <div class="l-body"><div class="l-title">Siren</div><div class="l-sub">Front Left</div></div>
        <div class="l-right"><div class="l-time">5:20 PM</div><div class="l-pct">95%</div></div>
      </div>
      <div class="log-row">
        <div class="l-icon horn"><i class="fas fa-bullhorn"></i></div>
        <div class="l-body"><div class="l-title">Horn</div><div class="l-sub">Back Left</div></div>
        <div class="l-right"><div class="l-time">8:47 AM</div><div class="l-pct">81%</div></div>
      </div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab-item"><i class="fas fa-house"></i>Home</div>
    <div class="tab-item"><i class="fas fa-ear-listen"></i>Listen</div>
    <div class="tab-item active"><i class="fas fa-clock-rotate-left"></i>History</div>
    <div class="tab-item"><i class="fas fa-gear"></i>Settings</div>
  </div>
</div>
</body>
</html>
