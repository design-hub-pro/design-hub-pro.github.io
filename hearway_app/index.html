<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearWay App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
body{background:#ffffff;color:#0f172a;padding:64px 40px 80px;}
.header{max-width:900px;margin:0 auto 48px;text-align:center;}
.app-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#0ea5e9,#2563eb);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 14px 28px rgba(37,99,235,0.3);}
h1{font-size:32px;font-weight:800;margin-bottom:10px;}
p{font-size:15px;color:#64748b;font-weight:500;max-width:520px;margin:0 auto;}
.grid{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:36px;justify-items:center;}
.cell{display:flex;flex-direction:column;align-items:center;}
.frame{width:460px;height:980px;background:#0b0d10;border-radius:62px;padding:12px;box-shadow:0 30px 60px rgba(15,23,42,0.18);}
.screen-box{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff;}
.screen-box iframe{width:100%;height:100%;border:none;}
.label{margin-top:16px;font-size:14px;font-weight:700;color:#0f172a;text-align:center;}
</style>
</head>
<body>
<div class="header">
  <div class="app-icon"><i class="fas fa-ear-listen" style="color:#fff;font-size:26px;"></i></div>
  <h1>HearWay</h1>
  <p>The companion app for the HearWay seat pad and dash listener, feeling road sounds so drivers who can't hear them still know.</p>
</div>
<div class="grid">
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="onboarding.html" scrolling="no"></iframe></div></div><div class="label">Pair Devices</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="home.html" scrolling="no"></iframe></div></div><div class="label">Home</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="listen.html" scrolling="no"></iframe></div></div><div class="label">Live Monitor</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="alert.html" scrolling="no"></iframe></div></div><div class="label">Alert</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="detail.html" scrolling="no"></iframe></div></div><div class="label">Alert Detail</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="history.html" scrolling="no"></iframe></div></div><div class="label">History</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="calibrate.html" scrolling="no"></iframe></div></div><div class="label">Seat Zones</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="notifications.html" scrolling="no"></iframe></div></div><div class="label">Notifications</div></div>
  <div class="cell"><div class="frame"><div class="screen-box"><iframe src="settings.html" scrolling="no"></iframe></div></div><div class="label">Settings</div></div>
</div>
</body>
</html>
