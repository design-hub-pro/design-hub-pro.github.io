<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>EcoSugar AI - Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
        .scan-line {
            animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(280px); opacity: 1; }
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-900">
    <!-- Status Bar -->
    <div class="bg-gray-900 px-6 py-2 flex justify-between items-center text-base font-medium text-white sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="relative h-[calc(100vh-100px)]">
        <!-- Camera View -->
        <div class="absolute inset-0 bg-gradient-to-b from-gray-800 to-gray-900">
            <!-- Scan Frame -->
            <div class="absolute top-20 left-1/2 -translate-x-1/2 w-80 h-80 border-3 border-emerald-400 rounded-3xl overflow-hidden">
                <!-- Corners -->
                <div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-emerald-400 rounded-tl-3xl"></div>
                <div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-emerald-400 rounded-tr-3xl"></div>
                <div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-emerald-400 rounded-bl-3xl"></div>
                <div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-emerald-400 rounded-br-3xl"></div>

                <!-- Scan Line -->
                <div class="scan-line absolute left-0 right-0 h-1 bg-gradient-to-r from-transparent via-emerald-400 to-transparent"></div>

                <!-- Center Icon -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center">
                        <i class="fas fa-wine-bottle text-white/20 text-7xl mb-4"></i>
                        <p class="text-white/40 text-lg">Position label here</p>
                    </div>
                </div>
            </div>

            <!-- Status -->
            <div class="absolute top-[440px] left-0 right-0 text-center">
                <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-lg rounded-full px-6 py-3">
                    <div class="w-3 h-3 bg-emerald-400 rounded-full pulse"></div>
                    <span class="text-white text-lg font-medium">AI Ready</span>
                </div>
            </div>

            <!-- Scan Button Area -->
            <div class="absolute bottom-32 left-0 right-0 px-6">
                <div class="flex items-center justify-center gap-8">
                    <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-image text-white text-2xl"></i>
                    </button>

                    <button class="w-24 h-24 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/30">
                        <i class="fas fa-camera text-white text-4xl"></i>
                    </button>

                    <button class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-barcode text-white text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-camera text-emerald-500 text-2xl"></i>
                <span class="text-sm text-emerald-500 font-medium mt-1">Scan</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-heartbeat text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Health</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-store text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Stores</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-500 text-2xl"></i>
                <span class="text-sm text-gray-500 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
