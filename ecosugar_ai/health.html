<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>EcoSugar AI - Health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
        .health-ring {
            background: conic-gradient(#10b981 0deg 252deg, #e5e7eb 252deg 360deg);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 py-4 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-900">Sugar Health</h1>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6 pb-32">
        <!-- Health Score Ring -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6">
            <div class="flex items-center justify-center mb-4">
                <div class="relative">
                    <div class="health-ring w-44 h-44 rounded-full flex items-center justify-center">
                        <div class="w-36 h-36 bg-white rounded-full flex flex-col items-center justify-center">
                            <span class="text-5xl font-bold text-emerald-600">70</span>
                            <span class="text-gray-400 text-base">Health Score</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Badge -->
            <div class="flex justify-center mb-4">
                <div class="bg-emerald-100 text-emerald-700 px-6 py-3 rounded-2xl flex items-center gap-3">
                    <i class="fas fa-smile-beam text-2xl"></i>
                    <span class="font-bold text-lg">Good Status</span>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-calendar-day text-blue-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">24g</p>
                    <p class="text-gray-400 text-sm">Today</p>
                </div>
                <div class="bg-gray-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-calendar-week text-purple-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">156g</p>
                    <p class="text-gray-400 text-sm">This Week</p>
                </div>
                <div class="bg-gray-50 rounded-2xl p-3 text-center">
                    <i class="fas fa-bullseye text-emerald-500 text-2xl mb-2"></i>
                    <p class="text-2xl font-bold text-gray-900">50g</p>
                    <p class="text-gray-400 text-sm">Daily Goal</p>
                </div>
            </div>
        </div>

        <!-- Weekly Chart -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
            <h3 class="font-bold text-gray-900 text-lg mb-4">This Week</h3>
            <div class="flex items-end justify-between gap-2 h-32">
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-emerald-400 rounded-t-lg" style="height: 60%"></div>
                    <span class="text-gray-400 text-sm">M</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-emerald-400 rounded-t-lg" style="height: 45%"></div>
                    <span class="text-gray-400 text-sm">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-amber-400 rounded-t-lg" style="height: 80%"></div>
                    <span class="text-gray-400 text-sm">W</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-emerald-400 rounded-t-lg" style="height: 55%"></div>
                    <span class="text-gray-400 text-sm">T</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-emerald-400 rounded-t-lg" style="height: 40%"></div>
                    <span class="text-gray-400 text-sm">F</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-red-400 rounded-t-lg" style="height: 95%"></div>
                    <span class="text-gray-400 text-sm">S</span>
                </div>
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full bg-emerald-500 rounded-t-lg" style="height: 48%"></div>
                    <span class="text-emerald-600 text-sm font-bold">S</span>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex justify-center gap-6 mt-4 pt-4 border-t border-gray-100">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-emerald-400 rounded"></div>
                    <span class="text-gray-500 text-sm">Under Goal</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-amber-400 rounded"></div>
                    <span class="text-gray-500 text-sm">Near Goal</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-red-400 rounded"></div>
                    <span class="text-gray-500 text-sm">Over Goal</span>
                </div>
            </div>
        </div>

        <!-- Health Tips -->
        <div class="bg-gradient-to-br from-blue-500 to-cyan-500 rounded-3xl p-5 text-white">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-lightbulb text-3xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-lg mb-1">Health Tip</h3>
                    <p class="text-blue-100 text-base">Try unsweetened tea instead of soda to cut 35g sugar!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-camera text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Scan</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-heartbeat text-emerald-600 text-2xl"></i>
                <span class="text-sm text-emerald-600 font-medium mt-1">Health</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-store text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Stores</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
