<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>EcoSugar AI - Scan Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 py-4 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <button class="w-11 h-11 bg-gray-100 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </button>
            <h1 class="text-xl font-bold text-gray-900">Scan Result</h1>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6 pb-32">
        <!-- Product Card -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-20 h-20 bg-gradient-to-br from-orange-100 to-amber-100 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-mug-hot text-orange-500 text-4xl"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-2xl font-bold text-gray-900">Caramel Latte</h2>
                    <p class="text-gray-400 text-base">Starbucks • 16 oz</p>
                </div>
            </div>

            <!-- Sugar Score -->
            <div class="bg-amber-50 rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 bg-amber-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-cube text-amber-600 text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm">Sugar Content</p>
                        <p class="text-3xl font-bold text-amber-600">42g</p>
                    </div>
                </div>
                <div class="text-center">
                    <div class="w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-meh text-white text-3xl"></i>
                    </div>
                    <p class="text-amber-600 text-sm font-medium mt-1">High</p>
                </div>
            </div>
        </div>

        <!-- Impact Cards -->
        <h3 class="font-bold text-gray-900 text-lg mb-3">Environmental Impact</h3>
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-12 h-12 mx-auto bg-blue-100 rounded-xl flex items-center justify-center mb-2">
                    <i class="fas fa-tint text-blue-500 text-xl"></i>
                </div>
                <p class="text-xl font-bold text-gray-900">8.4L</p>
                <p class="text-gray-400 text-xs">Water</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-12 h-12 mx-auto bg-emerald-100 rounded-xl flex items-center justify-center mb-2">
                    <i class="fas fa-cloud text-emerald-500 text-xl"></i>
                </div>
                <p class="text-xl font-bold text-gray-900">0.3kg</p>
                <p class="text-gray-400 text-xs">CO₂</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-12 h-12 mx-auto bg-amber-100 rounded-xl flex items-center justify-center mb-2">
                    <i class="fas fa-recycle text-amber-500 text-xl"></i>
                </div>
                <p class="text-xl font-bold text-gray-900">12g</p>
                <p class="text-gray-400 text-xs">Plastic</p>
            </div>
        </div>

        <!-- Daily Progress -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6">
            <div class="flex items-center justify-between mb-3">
                <span class="font-bold text-gray-900 text-lg">Today's Total</span>
                <span class="text-gray-500 text-base">66g / 50g</span>
            </div>
            <div class="bg-gray-100 rounded-full h-4 mb-3">
                <div class="bg-gradient-to-r from-amber-400 to-red-500 rounded-full h-4" style="width: 100%"></div>
            </div>
            <div class="flex items-center gap-2 text-red-500">
                <i class="fas fa-exclamation-circle"></i>
                <span class="text-base font-medium">16g over daily goal</span>
            </div>
        </div>

        <!-- Better Choice -->
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-5 text-white">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                    <i class="fas fa-lightbulb text-2xl"></i>
                </div>
                <div>
                    <p class="text-emerald-100 text-sm">Better Choice</p>
                    <h3 class="font-bold text-xl">Iced Americano</h3>
                </div>
            </div>
            <div class="flex items-center justify-between bg-white/10 rounded-2xl p-4">
                <div class="text-center">
                    <p class="text-3xl font-bold">3g</p>
                    <p class="text-emerald-100 text-sm">Sugar</p>
                </div>
                <div class="text-center px-4 border-x border-white/20">
                    <p class="text-3xl font-bold">-39g</p>
                    <p class="text-emerald-100 text-sm">Save</p>
                </div>
                <div class="text-center">
                    <p class="text-3xl font-bold">+15</p>
                    <p class="text-emerald-100 text-sm">Points</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Actions -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-4 pb-8">
        <div class="flex gap-4">
            <button class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl font-semibold text-lg flex items-center justify-center gap-2">
                <i class="fas fa-redo"></i>
                Scan Again
            </button>
            <button class="flex-1 py-4 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-2xl font-semibold text-lg flex items-center justify-center gap-2">
                <i class="fas fa-plus"></i>
                Log It
            </button>
        </div>
    </div>
</body>
</html>
