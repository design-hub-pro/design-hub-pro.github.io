<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0">
    <title>EcoSugar AI - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium sticky top-0 z-50">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 pt-4 pb-32">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face"
                     class="w-14 h-14 rounded-full object-cover border-2 border-emerald-200">
                <div>
                    <p class="text-gray-400 text-base">Hello,</p>
                    <h1 class="text-2xl font-bold text-gray-900">Alex 👋</h1>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-amber-100 rounded-full px-4 py-2">
                <i class="fas fa-coins text-amber-600"></i>
                <span class="text-amber-700 font-bold text-lg">2,450</span>
            </div>
        </div>

        <!-- Today's Sugar - Large Visual -->
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white mb-6 shadow-lg">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-emerald-100 text-base mb-1">Today's Sugar</p>
                    <div class="flex items-baseline gap-1">
                        <span class="text-6xl font-bold">24</span>
                        <span class="text-2xl text-emerald-200">/ 50g</span>
                    </div>
                </div>
                <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center">
                    <div class="text-center">
                        <i class="fas fa-smile-beam text-4xl mb-1"></i>
                        <p class="text-sm font-medium">Good!</p>
                    </div>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="mt-4 bg-white/20 rounded-full h-4">
                <div class="bg-white rounded-full h-4 w-[48%]"></div>
            </div>
        </div>

        <!-- Quick Scan Button -->
        <button class="w-full bg-white rounded-3xl p-5 mb-6 shadow-sm border border-gray-100 flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl flex items-center justify-center">
                <i class="fas fa-camera text-white text-3xl"></i>
            </div>
            <div class="flex-1 text-left">
                <h3 class="font-bold text-gray-900 text-xl">Scan Drink</h3>
                <p class="text-gray-400 text-base">Tap to scan label</p>
            </div>
            <i class="fas fa-chevron-right text-gray-300 text-xl"></i>
        </button>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-14 h-14 mx-auto bg-blue-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-tint text-blue-500 text-2xl"></i>
                </div>
                <p class="text-3xl font-bold text-gray-900">72L</p>
                <p class="text-gray-400 text-base">Water Saved</p>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                <div class="w-14 h-14 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center mb-3">
                    <i class="fas fa-cloud text-emerald-500 text-2xl"></i>
                </div>
                <p class="text-3xl font-bold text-gray-900">2.4kg</p>
                <p class="text-gray-400 text-base">CO₂ Reduced</p>
            </div>
        </div>

        <!-- Recent Scans -->
        <h2 class="font-bold text-gray-900 text-lg mb-3">Recent</h2>
        <div class="space-y-3">
            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-orange-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-mug-hot text-orange-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-lg">Latte</h4>
                    <p class="text-gray-400 text-sm">2 hours ago</p>
                </div>
                <span class="text-xl font-bold text-amber-500">18g</span>
            </div>

            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm border border-gray-100">
                <div class="w-14 h-14 bg-green-100 rounded-xl flex items-center justify-center">
                    <i class="fas fa-leaf text-green-500 text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h4 class="font-semibold text-gray-900 text-lg">Green Tea</h4>
                    <p class="text-gray-400 text-sm">Yesterday</p>
                </div>
                <span class="text-xl font-bold text-emerald-500">0g</span>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-emerald-600 text-2xl"></i>
                <span class="text-sm text-emerald-600 font-medium mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-camera text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Scan</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-heartbeat text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Health</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-store text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Stores</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
