<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen dark">
  <div class="absolute inset-0 img" style="background-image:url(img/hero.jpg)"></div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(4,20,16,.55) 0%,rgba(4,20,16,0) 26%,rgba(4,20,16,.25) 48%,rgba(4,20,16,.96) 74%,#06120F 100%)"></div>

  <div class="sb light"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

  <div class="pad relative z-10 mt-4 flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl g-teal flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee text-white text-[15px]"></i></div>
    <span class="text-[19px] font-extrabold tracking-tight">ParaPutt</span>
  </div>

  <div class="absolute left-0 right-0 bottom-0 pad pb-14 z-10">
    <span class="pill glass"><span class="live"></span> Grip-sensing putter coach</span>
    <h1 class="text-[40px] font-extrabold leading-[1.04] tracking-[-1.6px] mt-5">Your best putt<br>is the <span style="color:#5EEAC8">standard.</span></h1>
    <p class="text-[15.5px] text-white/70 font-medium mt-4 leading-relaxed">Every stroke is compared to your own best, not a pro's. Lights and buzzes tell you what to fix.</p>

    <div class="flex gap-2.5 mt-7">
      <div class="flex-1 rounded-2xl glassd p-3.5"><i class="fa-solid fa-hand text-[#5EEAC8]"></i><div class="text-[13px] font-bold mt-2">Pressure</div></div>
      <div class="flex-1 rounded-2xl glassd p-3.5"><i class="fa-solid fa-compass-drafting text-[#B7F25C]"></i><div class="text-[13px] font-bold mt-2">Face angle</div></div>
      <div class="flex-1 rounded-2xl glassd p-3.5"><i class="fa-solid fa-wave-square text-[#FCD34D]"></i><div class="text-[13px] font-bold mt-2">Rhythm</div></div>
    </div>

    <div class="btn teal mt-7"><i class="fa-brands fa-bluetooth-b"></i> Pair my grip</div>
    <div class="btn mt-3 text-white/90" style="background:rgba(255,255,255,.1)"><i class="fa-solid fa-people-group text-[15px]"></i> I run a program</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
