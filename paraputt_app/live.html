<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.band{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.08)}
.band .z{position:absolute;top:0;bottom:0;border-radius:999px;background:rgba(45,212,176,.28);box-shadow:inset 0 0 0 1px rgba(45,212,176,.5)}
.band .m{position:absolute;top:-5px;width:20px;height:20px;border-radius:50%;border:3px solid #06120F;transform:translateX(-50%)}
</style></head>
<body>
<div class="screen dark">
  <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[520px] h-[520px] rounded-full" style="background:radial-gradient(circle,rgba(45,212,176,.22),transparent 65%)"></div>
  <div class="sb light"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

  <div class="pad mt-3 flex items-center justify-between relative">
    <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-xmark"></i></div>
    <div class="text-center"><div class="flex items-center gap-2 justify-center text-[12px] font-bold tracking-wider text-[#5EEAC8]"><span class="live"></span> LIVE</div><div class="text-[15px] font-bold mt-0.5">Square-face gate</div></div>
    <div class="pill" style="background:rgba(255,255,255,.08)"><span class="num">14</span><span class="text-white/40">/20</span></div>
  </div>

  <!-- match ring: mirrors the LED ring on the grip -->
  <div class="relative mx-auto mt-6" style="width:276px;height:276px">
    <svg width="276" height="276" viewBox="0 0 276 276">
      <g transform="translate(138 138)" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M0 -118 A118 118 0 0 1 83.4 -83.4" stroke="#2DD4B0"/>
        <path d="M95 -70 A118 118 0 0 1 117.4 -12" stroke="#2DD4B0"/>
        <path d="M117.4 12 A118 118 0 0 1 95 70" stroke="#2DD4B0"/>
        <path d="M83.4 83.4 A118 118 0 0 1 12 117.4" stroke="#2DD4B0"/>
        <path d="M-12 117.4 A118 118 0 0 1 -83.4 83.4" stroke="#2DD4B0"/>
        <path d="M-95 70 A118 118 0 0 1 -117.4 12" stroke="#F5A524"/>
        <path d="M-117.4 -12 A118 118 0 0 1 -95 -70" stroke="rgba(255,255,255,.1)"/>
        <path d="M-83.4 -83.4 A118 118 0 0 1 -12 -117.4" stroke="rgba(255,255,255,.1)"/>
      </g>
      <circle cx="138" cy="138" r="92" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <div class="text-[12px] font-bold tracking-[2px] text-white/50">MATCH</div>
      <div class="text-[72px] font-extrabold tracking-[-3px] leading-none num mt-1">91<span class="text-[32px] text-white/60">%</span></div>
      <div class="pill mt-3" style="background:rgba(45,212,176,.16);color:#5EEAC8"><i class="fa-solid fa-check text-[10px]"></i> In your zone</div>
    </div>
  </div>

  <!-- three signals vs baseline band -->
  <div class="pad mt-7 space-y-5">
    <div>
      <div class="flex justify-between text-[13px] font-semibold"><span class="flex items-center gap-2"><i class="fa-solid fa-hand text-[#5EEAC8]"></i>Grip pressure</span><span class="num text-white/70">2.5 N</span></div>
      <div class="band mt-2.5"><div class="z" style="left:36%;width:26%"></div><div class="m" style="left:49%;background:#2DD4B0"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-[13px] font-semibold"><span class="flex items-center gap-2"><i class="fa-solid fa-compass-drafting text-[#FCD34D]"></i>Face angle</span><span class="num text-[#FCD34D]">1.6° open</span></div>
      <div class="band mt-2.5"><div class="z" style="left:38%;width:24%"></div><div class="m" style="left:68%;background:#F5A524"></div></div>
    </div>
    <div>
      <div class="flex justify-between text-[13px] font-semibold"><span class="flex items-center gap-2"><i class="fa-solid fa-wave-square text-[#B7F25C]"></i>Rhythm</span><span class="num text-white/70">2.0 : 1</span></div>
      <div class="band mt-2.5"><div class="z" style="left:40%;width:22%"></div><div class="m" style="left:52%;background:#2DD4B0"></div></div>
    </div>
  </div>

  <!-- cue + history -->
  <div class="pad mt-7">
    <div class="rounded-[22px] p-4 flex items-center gap-3" style="background:rgba(255,255,255,.06)">
      <div class="gicon g-amber"><i class="fa-solid fa-mobile-screen-button"></i></div>
      <div class="flex-1"><div class="text-[14px] font-bold">2 short buzzes sent</div><div class="text-[12.5px] text-white/50 font-medium">Face open. Lights showed amber.</div></div>
    </div>
    <div class="flex items-center justify-between mt-5">
      <div class="flex gap-1.5">
        <span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#F5A524"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#F0603F"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#F5A524"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#2DD4B0"></span><span class="dot" style="background:#F5A524"></span>
        <span class="dot" style="background:rgba(255,255,255,.12)"></span><span class="dot" style="background:rgba(255,255,255,.12)"></span>
      </div>
      <span class="text-[12px] font-semibold text-white/50">Last 16</span>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-12 pad flex gap-3">
    <div class="btn flex-1" style="background:rgba(255,255,255,.08)"><i class="fa-solid fa-pause"></i> Pause</div>
    <div class="btn teal flex-1"><i class="fa-solid fa-flag-checkered"></i> Finish</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
