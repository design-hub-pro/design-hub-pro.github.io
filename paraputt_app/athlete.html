<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Athlete</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
      <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-ellipsis text-[15px]"></i></div>
    </div>

    <div class="pad mt-4 flex items-center gap-4">
      <div class="relative"><img src="img/p3.jpg" class="w-[76px] h-[76px] rounded-[24px] object-cover"><span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full border-[3px] border-white" style="background:var(--coral)"></span></div>
      <div>
        <div class="text-[24px] font-extrabold tracking-tight">Walt R.</div>
        <div class="flex gap-1.5 mt-1.5"><span class="pill" style="background:var(--surface);color:var(--ink2)"><i class="fa-solid fa-person-cane text-[10px]"></i> Stroke rehab</span><span class="pill" style="background:var(--surface);color:var(--ink2)">Week 6</span></div>
      </div>
    </div>

    <!-- grip chart -->
    <div class="pad mt-6">
      <div class="card p-5">
        <div class="flex items-center justify-between">
          <div><div class="text-[13px] font-semibold text-slate-500">Grip pressure · last 40 putts</div><div class="flex items-end gap-2 mt-1"><span class="big num">58%</span><span class="text-[13px] font-semibold text-slate-400 mb-1">in zone</span></div></div>
          <div class="gicon g-coral"><i class="fa-solid fa-hand"></i></div>
        </div>
        <svg class="mt-4" width="100%" height="120" viewBox="0 0 340 120" preserveAspectRatio="none">
          <rect x="0" y="44" width="340" height="30" rx="6" fill="#D3F5EC"/>
          <path d="M0 62 L17 58 L34 66 L51 30 L68 60 L85 55 L102 70 L119 24 L136 58 L153 63 L170 54 L187 34 L204 60 L221 57 L238 64 L255 52 L272 59 L289 40 L306 58 L323 55 L340 60" fill="none" stroke="#0C1F1A" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="51" cy="30" r="5" fill="#F0603F"/><circle cx="119" cy="24" r="5" fill="#F0603F"/><circle cx="187" cy="34" r="5" fill="#F0603F"/><circle cx="289" cy="40" r="5" fill="#F5A524"/>
        </svg>
        <div class="flex items-center gap-4 mt-2 text-[11.5px] font-semibold text-slate-500"><span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#D3F5EC"></span>His zone</span><span class="flex items-center gap-1.5"><span class="dot" style="background:var(--coral)"></span>Squeeze spike</span></div>
      </div>
    </div>

    <!-- AI pattern -->
    <div class="pad mt-3">
      <div class="rounded-[22px] p-4 flex gap-3.5" style="background:#FFF4ED;box-shadow:0 0 0 1px #FDDCC9">
        <div class="gicon g-coral"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <div><div class="text-[14.5px] font-bold">Pattern spotted</div><div class="text-[13.5px] text-slate-600 font-medium mt-1 leading-snug">Spikes come after 12+ minutes. Likely fatigue in the left hand. Try shorter sets.</div></div>
      </div>
    </div>

    <!-- assigned -->
    <div class="pad">
      <div class="sec"><span class="h2">Assigned</span><span class="act">+ Add drill</span></div>
      <div class="card p-3 flex items-center gap-3.5">
        <div class="img rounded-2xl w-[72px] h-[62px] flex-none" style="background-image:url(img/grip.jpg)"></div>
        <div class="flex-1"><div class="text-[15px] font-bold">Light-grip ladder</div><div class="text-[12px] text-slate-400 font-semibold mt-0.5">3 × 6 putts · rest 2 min</div></div>
        <span class="dot" style="background:#12B76A"></span>
      </div>
    </div>

    <div class="pad mt-4">
      <div class="card p-3 pl-4 flex items-center gap-3">
        <span class="flex-1 text-[14px] text-slate-400 font-medium">Leave Walt a note…</span>
        <div class="w-10 h-10 rounded-full g-teal flex items-center justify-center text-white"><i class="fa-solid fa-microphone text-[14px]"></i></div>
      </div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
