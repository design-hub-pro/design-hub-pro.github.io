<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Session summary</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.bars{display:flex;align-items:flex-end;gap:5px;height:110px}.bars i{flex:1;border-radius:6px 6px 3px 3px;display:block}</style></head>
<body>
<div class="screen">
  <div class="absolute top-0 left-0 right-0 h-[400px] img" style="background-image:url(img/green.jpg)"></div>
  <div class="absolute top-0 left-0 right-0 h-[400px]" style="background:linear-gradient(180deg,rgba(4,20,16,.35) 0%,rgba(4,20,16,.55) 60%,var(--bg) 100%)"></div>

  <div class="sb light"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

  <div class="pad relative mt-3 flex justify-between">
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket text-[14px]"></i></div>
  </div>

  <div class="pad relative mt-8 text-white text-center">
    <div class="w-16 h-16 rounded-[22px] mx-auto flex items-center justify-center text-[26px]" style="background:var(--gradLime);color:#0C1F1A;box-shadow:0 16px 30px -12px rgba(92,194,74,.8)"><i class="fa-solid fa-trophy"></i></div>
    <h1 class="text-[30px] font-extrabold tracking-[-1px] mt-4">Session done</h1>
    <div class="text-[14px] text-white/75 font-medium mt-1">Square-face gate · 18 min</div>
  </div>

  <div class="pad relative mt-7">
    <div class="card p-5">
      <div class="grid grid-cols-3 text-center divide-x divide-slate-100">
        <div><div class="text-[32px] font-extrabold tracking-tight num">20</div><div class="text-[12px] text-slate-500 font-semibold">Putts</div></div>
        <div><div class="text-[32px] font-extrabold tracking-tight num" style="color:var(--teal2)">15</div><div class="text-[12px] text-slate-500 font-semibold">In zone</div></div>
        <div><div class="text-[32px] font-extrabold tracking-tight num">8</div><div class="text-[12px] text-slate-500 font-semibold">Best run</div></div>
      </div>
    </div>
  </div>

  <div class="pad mt-3">
    <div class="card p-5">
      <div class="flex items-center justify-between"><span class="text-[15px] font-bold">Match per putt</span><span class="text-[12px] font-semibold text-slate-400">avg <b class="text-slate-700 num">84%</b></span></div>
      <div class="bars mt-4 relative">
        <div class="absolute left-0 right-0 border-t border-dashed" style="bottom:72%;border-color:#9AA9A4"></div>
        <i style="height:62%;background:#FCD34D"></i><i style="height:70%;background:#FCD34D"></i><i style="height:81%;background:#2DD4B0"></i><i style="height:78%;background:#2DD4B0"></i><i style="height:48%;background:#F0603F"></i><i style="height:84%;background:#2DD4B0"></i><i style="height:88%;background:#2DD4B0"></i><i style="height:69%;background:#FCD34D"></i><i style="height:86%;background:#2DD4B0"></i><i style="height:90%;background:#2DD4B0"></i>
        <i style="height:85%;background:#2DD4B0"></i><i style="height:92%;background:#2DD4B0"></i><i style="height:89%;background:#2DD4B0"></i><i style="height:91%;background:#2DD4B0"></i><i style="height:94%;background:#2DD4B0"></i><i style="height:87%;background:#2DD4B0"></i><i style="height:93%;background:#2DD4B0"></i><i style="height:66%;background:#FCD34D"></i><i style="height:90%;background:#2DD4B0"></i><i style="height:95%;background:#0E9F87"></i>
      </div>
      <div class="flex justify-between text-[11px] font-semibold text-slate-400 mt-2"><span>Putt 1</span><span>Zone line</span><span>20</span></div>
    </div>
  </div>

  <div class="pad mt-3 flex gap-3">
    <div class="card flex-1 p-4 flex items-center gap-3"><div class="gicon g-teal" style="width:40px;height:40px;font-size:15px"><i class="fa-solid fa-arrow-trend-up"></i></div><div><div class="text-[18px] font-extrabold num">+6%</div><div class="text-[11.5px] text-slate-500 font-semibold">vs last session</div></div></div>
    <div class="card flex-1 p-4 flex items-center gap-3"><div class="gicon g-amber" style="width:40px;height:40px;font-size:15px"><i class="fa-solid fa-compass-drafting"></i></div><div><div class="text-[18px] font-extrabold num">0.9°</div><div class="text-[11.5px] text-slate-500 font-semibold">Face drift, down</div></div></div>
  </div>

  <div class="absolute left-0 right-0 bottom-12 pad flex gap-3">
    <div class="btn ghost flex-1"><img src="img/coach.jpg" class="w-6 h-6 rounded-full object-cover"> Send to coach</div>
    <div class="btn pri flex-1">Done</div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
