<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Cues</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.slider{position:relative;height:8px;border-radius:999px;background:var(--surface)}
.slider>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--gradTeal)}
.slider>b{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(12,31,26,.25),0 0 0 1px var(--border);transform:translate(-50%,-50%)}
.mode{flex:1;border-radius:20px;padding:16px 12px;text-align:center;background:#fff;box-shadow:0 0 0 1px var(--border)}
.mode.on{box-shadow:0 0 0 2px var(--teal);background:#F2FCF9}
</style></head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

    <div class="pad mt-3 flex items-center justify-between">
      <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
      <div class="text-[16px] font-bold">Feedback cues</div>
      <div class="text-[14px] font-bold" style="color:var(--teal2)">Test</div>
    </div>

    <!-- LED legend -->
    <div class="pad mt-5">
      <div class="rounded-[28px] p-5 text-white relative overflow-hidden" style="background:var(--gradInk)">
        <div class="text-[12.5px] font-semibold text-white/55">What the grip shows</div>
        <div class="flex items-center justify-between mt-4">
          <div class="text-center"><div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background:rgba(45,212,176,.15);box-shadow:0 0 30px rgba(45,212,176,.55)"><span class="w-8 h-8 rounded-full" style="background:#2DD4B0"></span></div><div class="text-[13px] font-bold mt-3">In zone</div><div class="text-[11.5px] text-white/50 font-medium">1 soft buzz</div></div>
          <div class="text-center"><div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background:rgba(245,165,36,.15);box-shadow:0 0 30px rgba(245,165,36,.45)"><span class="w-8 h-8 rounded-full" style="background:#F5A524"></span></div><div class="text-[13px] font-bold mt-3">Close</div><div class="text-[11.5px] text-white/50 font-medium">2 short</div></div>
          <div class="text-center"><div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center" style="background:rgba(240,96,63,.15);box-shadow:0 0 30px rgba(240,96,63,.45)"><span class="w-8 h-8 rounded-full" style="background:#F0603F"></span></div><div class="text-[13px] font-bold mt-3">Off</div><div class="text-[11.5px] text-white/50 font-medium">1 long</div></div>
        </div>
      </div>
    </div>

    <div class="pad mt-6">
      <div class="meta">Cue type</div>
      <div class="flex gap-3 mt-3">
        <div class="mode"><i class="fa-solid fa-lightbulb text-[20px]" style="color:var(--amber)"></i><div class="text-[13.5px] font-bold mt-2">Lights</div></div>
        <div class="mode"><i class="fa-solid fa-mobile-screen-button text-[20px]" style="color:var(--violet)"></i><div class="text-[13.5px] font-bold mt-2">Buzz</div></div>
        <div class="mode on relative"><i class="fa-solid fa-check absolute top-2.5 right-3 text-[11px]" style="color:var(--teal)"></i><i class="fa-solid fa-layer-group text-[20px]" style="color:var(--teal)"></i><div class="text-[13.5px] font-bold mt-2">Both</div></div>
      </div>
    </div>

    <div class="pad mt-6">
      <div class="card p-5 space-y-6">
        <div>
          <div class="flex justify-between"><span class="text-[14.5px] font-bold">Zone width</span><span class="text-[13px] font-semibold text-slate-400">Medium</span></div>
          <div class="slider mt-4"><i style="width:50%"></i><b style="left:50%"></b></div>
          <div class="flex justify-between text-[11.5px] font-semibold text-slate-400 mt-2.5"><span>Tight</span><span>Wide</span></div>
        </div>
        <div>
          <div class="flex justify-between"><span class="text-[14.5px] font-bold">Buzz strength</span><span class="text-[13px] font-semibold text-slate-400 num">70%</span></div>
          <div class="slider mt-4"><i style="width:70%"></i><b style="left:70%"></b></div>
        </div>
      </div>
    </div>

    <div class="pad mt-6">
      <div class="meta">Adaptive</div>
      <div class="card mt-3 divide-y divide-slate-100">
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-sky" style="width:38px;height:38px;font-size:15px;border-radius:12px"><i class="fa-solid fa-eye-low-vision"></i></div><span class="flex-1 text-[14.5px] font-semibold">Low-vision mode</span><span class="toggle"></span></div>
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-violet" style="width:38px;height:38px;font-size:15px;border-radius:12px"><i class="fa-solid fa-volume-high"></i></div><span class="flex-1 text-[14.5px] font-semibold">Spoken cue on phone</span><span class="toggle on"></span></div>
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-coral" style="width:38px;height:38px;font-size:15px;border-radius:12px"><i class="fa-solid fa-hand-back-fist"></i></div><span class="flex-1 text-[14.5px] font-semibold">Weak-grip range</span><span class="text-[13px] font-semibold text-slate-400 mr-1">0.5–3 N</span><i class="fa-solid fa-chevron-right text-[12px] text-slate-300"></i></div>
      </div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
