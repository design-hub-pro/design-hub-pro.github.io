<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

    <div class="pad mt-4 flex items-center justify-between">
      <h1 class="h1">Progress</h1>
      <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-regular fa-calendar text-[15px]"></i></div>
    </div>

    <div class="pad mt-5">
      <div class="flex p-1 rounded-2xl" style="background:var(--surface)">
        <span class="flex-1 text-center py-2.5 text-[13.5px] font-semibold text-slate-500">Week</span>
        <span class="flex-1 text-center py-2.5 text-[13.5px] font-bold bg-white rounded-xl shadow-sm">Month</span>
        <span class="flex-1 text-center py-2.5 text-[13.5px] font-semibold text-slate-500">All</span>
      </div>
    </div>

    <!-- consistency -->
    <div class="pad mt-5">
      <div class="card p-5">
        <div class="text-[13px] font-semibold text-slate-500">Putts in your zone</div>
        <div class="flex items-end gap-2 mt-1"><span class="big num">78%</span><span class="pill mb-1" style="background:var(--mint);color:var(--teal2)"><i class="fa-solid fa-arrow-up text-[10px]"></i> from 54%</span></div>
        <svg class="mt-5" width="100%" height="130" viewBox="0 0 340 130" preserveAspectRatio="none">
          <defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4B0" stop-opacity=".3"/><stop offset="1" stop-color="#2DD4B0" stop-opacity="0"/></linearGradient></defs>
          <line x1="0" y1="32" x2="340" y2="32" stroke="#EDF3F0"/><line x1="0" y1="72" x2="340" y2="72" stroke="#EDF3F0"/><line x1="0" y1="112" x2="340" y2="112" stroke="#EDF3F0"/>
          <path d="M0 100 C30 98 45 92 70 88 S115 90 140 76 S185 70 210 58 S255 52 280 40 S320 30 340 26 L340 130 L0 130Z" fill="url(#f)"/>
          <path d="M0 100 C30 98 45 92 70 88 S115 90 140 76 S185 70 210 58 S255 52 280 40 S320 30 340 26" fill="none" stroke="#0E9F87" stroke-width="3" stroke-linecap="round"/>
          <circle cx="210" cy="58" r="5" fill="#fff" stroke="#0E9F87" stroke-width="2.5"/>
          <circle cx="340" cy="26" r="6" fill="#0E9F87" stroke="#fff" stroke-width="3"/>
        </svg>
        <div class="flex justify-between text-[11px] font-semibold text-slate-400 mt-1"><span>Oct 8</span><span>Oct 18</span><span>Oct 28</span><span>Nov 6</span></div>
      </div>
    </div>

    <!-- per signal -->
    <div class="pad grid grid-cols-3 gap-3 mt-3">
      <div class="card p-4"><div class="gicon g-teal" style="width:36px;height:36px;font-size:14px;border-radius:12px"><i class="fa-solid fa-hand"></i></div><div class="text-[24px] font-extrabold tracking-tight num mt-3">88%</div><div class="text-[11.5px] text-slate-500 font-semibold">Pressure</div><div class="text-[11.5px] font-bold mt-1" style="color:var(--teal2)">+12</div></div>
      <div class="card p-4"><div class="gicon g-amber" style="width:36px;height:36px;font-size:14px;border-radius:12px"><i class="fa-solid fa-compass-drafting"></i></div><div class="text-[24px] font-extrabold tracking-tight num mt-3">64%</div><div class="text-[11.5px] text-slate-500 font-semibold">Face</div><div class="text-[11.5px] font-bold mt-1" style="color:#B54708">+4</div></div>
      <div class="card p-4"><div class="gicon g-lime" style="width:36px;height:36px;font-size:14px;border-radius:12px"><i class="fa-solid fa-wave-square"></i></div><div class="text-[24px] font-extrabold tracking-tight num mt-3">91%</div><div class="text-[11.5px] text-slate-500 font-semibold">Rhythm</div><div class="text-[11.5px] font-bold mt-1" style="color:var(--teal2)">+19</div></div>
    </div>

    <!-- baseline update -->
    <div class="pad mt-3">
      <div class="rounded-[22px] p-4 flex items-center gap-3.5" style="background:var(--gradInk);color:#fff">
        <div class="gicon g-lime" style="color:#0C1F1A"><i class="fa-solid fa-arrow-up-right-dots"></i></div>
        <div class="flex-1"><div class="text-[14.5px] font-bold">You beat your baseline</div><div class="text-[12.5px] text-white/60 font-medium mt-0.5">5 new steadiest putts this week</div></div>
        <span class="pill" style="background:#B7F25C;color:#0C1F1A">Raise</span>
      </div>
    </div>

    <!-- milestones -->
    <div class="pad">
      <div class="sec"><span class="h2">Milestones</span><span class="act">All 14</span></div>
      <div class="hscroll">
        <div class="card w-[120px] p-4 text-center"><div class="w-14 h-14 mx-auto rounded-full g-teal flex items-center justify-center text-white text-[20px]"><i class="fa-solid fa-medal"></i></div><div class="text-[13px] font-bold mt-3">500 putts</div></div>
        <div class="card w-[120px] p-4 text-center"><div class="w-14 h-14 mx-auto rounded-full g-coral flex items-center justify-center text-white text-[20px]"><i class="fa-solid fa-fire"></i></div><div class="text-[13px] font-bold mt-3">7-day streak</div></div>
        <div class="card w-[120px] p-4 text-center"><div class="w-14 h-14 mx-auto rounded-full g-violet flex items-center justify-center text-white text-[20px]"><i class="fa-solid fa-bullseye"></i></div><div class="text-[13px] font-bold mt-3">30 in zone</div></div>
        <div class="card w-[120px] p-4 text-center opacity-50"><div class="w-14 h-14 mx-auto rounded-full bg-slate-200 flex items-center justify-center text-slate-400 text-[20px]"><i class="fa-solid fa-lock"></i></div><div class="text-[13px] font-bold mt-3">Face master</div></div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a><i class="fa-solid fa-house"></i>Home</a>
    <a><i class="fa-solid fa-circle-play"></i>Drills</a>
    <a><span class="fab"><i class="fa-solid fa-golf-ball-tee"></i></span></a>
    <a class="on"><i class="fa-solid fa-chart-simple"></i>Progress</a>
    <a><i class="fa-solid fa-user"></i>Profile</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body></html>
