<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Baseline</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen">
  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

  <div class="pad mt-3 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
    <div class="flex gap-1.5"><span class="w-6 h-1.5 rounded-full" style="background:var(--teal)"></span><span class="w-6 h-1.5 rounded-full" style="background:var(--teal)"></span><span class="w-6 h-1.5 rounded-full" style="background:var(--teal)"></span></div>
    <div class="w-10"></div>
  </div>

  <div class="pad mt-6">
    <div class="meta">Step 3 of 3</div>
    <h1 class="h1 mt-2">Set your baseline</h1>
    <p class="sub mt-2">Putt 10 times at your own pace. Your steadiest 5 become your standard.</p>
  </div>

  <div class="pad mt-7">
    <div class="rounded-[30px] p-6 text-white relative overflow-hidden" style="background:var(--gradInk)">
      <div class="absolute -right-16 -top-16 w-56 h-56 rounded-full" style="background:radial-gradient(circle,rgba(45,212,176,.35),transparent 70%)"></div>
      <div class="relative flex items-center gap-6">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/>
          <circle cx="75" cy="75" r="62" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="116.9" transform="rotate(-90 75 75)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7F25C"/><stop offset="1" stop-color="#2DD4B0"/></linearGradient></defs>
          <text x="75" y="78" text-anchor="middle" fill="#fff" font-size="40" font-weight="800" font-family="Inter" letter-spacing="-1.5">7</text>
          <text x="75" y="102" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="13" font-weight="600" font-family="Inter">of 10 putts</text>
        </svg>
        <div class="flex-1">
          <div class="flex items-center gap-2 text-[12.5px] font-semibold text-white/60"><span class="live"></span> Listening</div>
          <div class="text-[22px] font-extrabold tracking-tight mt-2 leading-tight">3 more strokes</div>
          <div class="text-[13px] text-white/55 font-medium mt-1">About 1 minute</div>
        </div>
      </div>
      <div class="relative flex gap-2 mt-6">
        <span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:rgba(255,255,255,.25)"></span><span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:#2DD4B0"></span><span class="flex-1 h-2 rounded-full" style="background:rgba(255,255,255,.1)"></span><span class="flex-1 h-2 rounded-full" style="background:rgba(255,255,255,.1)"></span><span class="flex-1 h-2 rounded-full" style="background:rgba(255,255,255,.1)"></span>
      </div>
    </div>
  </div>

  <div class="pad mt-5">
    <div class="meta">Last stroke</div>
    <div class="grid grid-cols-3 gap-3 mt-3">
      <div class="card p-4"><i class="fa-solid fa-hand" style="color:var(--teal)"></i><div class="text-[26px] font-extrabold tracking-tight num mt-2">2.4<span class="text-[13px] text-slate-400 font-semibold ml-0.5">N</span></div><div class="text-[12px] text-slate-500 font-semibold">Grip</div></div>
      <div class="card p-4"><i class="fa-solid fa-compass-drafting" style="color:#5CC24A"></i><div class="text-[26px] font-extrabold tracking-tight num mt-2">0.8<span class="text-[13px] text-slate-400 font-semibold ml-0.5">°</span></div><div class="text-[12px] text-slate-500 font-semibold">Face open</div></div>
      <div class="card p-4"><i class="fa-solid fa-wave-square" style="color:var(--amber)"></i><div class="text-[26px] font-extrabold tracking-tight num mt-2">2.1<span class="text-[13px] text-slate-400 font-semibold ml-0.5">:1</span></div><div class="text-[12px] text-slate-500 font-semibold">Tempo</div></div>
    </div>
    <div class="flex items-center gap-3 mt-4 rounded-2xl p-3.5" style="background:var(--mint)">
      <i class="fa-solid fa-circle-info" style="color:var(--teal2)"></i>
      <span class="text-[13px] font-semibold" style="color:var(--teal2)">Putt 3 was set aside. Grip spiked mid-stroke.</span>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body></html>
