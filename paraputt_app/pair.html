<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Pair</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(14,159,135,.25)}</style></head>
<body>
<div class="screen">
  <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

  <div class="pad mt-3 flex items-center justify-between">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></div>
    <div class="flex gap-1.5"><span class="w-6 h-1.5 rounded-full" style="background:var(--teal)"></span><span class="w-6 h-1.5 rounded-full" style="background:var(--teal)"></span><span class="w-6 h-1.5 rounded-full bg-slate-200"></span></div>
    <div class="w-10"></div>
  </div>

  <div class="pad mt-6">
    <div class="meta">Step 2 of 3</div>
    <h1 class="h1 mt-2">Grip found</h1>
  </div>

  <div class="relative mx-auto mt-7" style="width:280px;height:280px">
    <div class="ring" style="inset:-26px"></div>
    <div class="ring" style="inset:-52px;border-color:rgba(14,159,135,.12)"></div>
    <div class="absolute inset-0 rounded-full img" style="background-image:url(img/grip.jpg);box-shadow:0 30px 60px -30px rgba(8,128,108,.7)"></div>
    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 card px-4 py-2.5 flex items-center gap-2 whitespace-nowrap">
      <i class="fa-brands fa-bluetooth-b" style="color:var(--sky)"></i><span class="text-[14px] font-bold">ParaPutt Grip</span><span class="text-[12px] text-slate-400 font-semibold">PP-2417</span>
    </div>
  </div>

  <div class="pad mt-12">
    <div class="card p-4">
      <div class="flex items-center justify-between">
        <span class="text-[14px] font-bold">Sensor check</span>
        <span class="pill" style="background:var(--mint);color:var(--teal2)"><i class="fa-solid fa-check"></i> All good</span>
      </div>
      <div class="grid grid-cols-4 gap-2 mt-4 text-center">
        <div><div class="gicon g-teal mx-auto"><i class="fa-solid fa-hand"></i></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">6 pads</div></div>
        <div><div class="gicon g-lime mx-auto"><i class="fa-solid fa-compass-drafting"></i></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">Motion</div></div>
        <div><div class="gicon g-amber mx-auto"><i class="fa-solid fa-lightbulb"></i></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">LED ring</div></div>
        <div><div class="gicon g-violet mx-auto"><i class="fa-solid fa-mobile-screen-button"></i></div><div class="text-[11.5px] font-semibold text-slate-500 mt-2">Haptic</div></div>
      </div>
      <div class="flex items-center gap-3 mt-4 pt-4 border-t" style="border-color:var(--border)">
        <i class="fa-solid fa-battery-three-quarters" style="color:var(--teal)"></i>
        <div class="bar flex-1"><i style="width:86%;background:var(--gradTeal)"></i></div>
        <span class="text-[13px] font-bold num">86%</span>
      </div>
    </div>

    <div class="text-[14px] font-bold mt-6">How do you putt?</div>
    <div class="flex gap-2 mt-3">
      <span class="chip"><i class="fa-solid fa-person"></i> Standing</span>
      <span class="chip on"><i class="fa-solid fa-wheelchair"></i> Seated</span>
      <span class="chip"><i class="fa-solid fa-hand-back-fist"></i> One hand</span>
    </div>
  </div>

  <div class="absolute left-0 right-0 bottom-12 pad"><div class="btn pri">Continue <i class="fa-solid fa-arrow-right text-[14px]"></i></div></div>
  <div class="home-ind"></div>
</div>
</body></html>
