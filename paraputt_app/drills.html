<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Drills</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

    <div class="pad mt-4 flex items-center justify-between">
      <h1 class="h1">Drills</h1>
      <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-magnifying-glass text-[15px]"></i></div>
    </div>

    <div class="pad mt-5">
      <div class="hscroll">
        <span class="chip on">For you</span>
        <span class="chip"><i class="fa-solid fa-wheelchair text-[12px]"></i> Seated</span>
        <span class="chip"><i class="fa-solid fa-hand-back-fist text-[12px]"></i> One hand</span>
        <span class="chip"><span class="dot" style="background:var(--teal)"></span>Pressure</span>
        <span class="chip"><span class="dot" style="background:var(--amber)"></span>Face</span>
      </div>
    </div>

    <!-- featured -->
    <div class="pad mt-5">
      <div class="img shade rounded-[28px] h-[250px] p-5 flex flex-col justify-between overflow-hidden" style="background-image:url(img/rehab.jpg)">
        <div class="flex justify-between"><span class="pill glass"><i class="fa-solid fa-star text-[10px]"></i> Coach pick</span><span class="pill glassd"><i class="fa-solid fa-signal text-[10px]"></i> Level 2</span></div>
        <div>
          <div class="flex items-center gap-2 text-white/70 text-[12.5px] font-semibold"><i class="fa-solid fa-wheelchair"></i> Seated · 8 min</div>
          <div class="text-white text-[24px] font-extrabold tracking-tight mt-1 leading-tight">Quiet hands,<br>steady face</div>
          <div class="flex items-center gap-3 mt-3">
            <div class="btn teal h-11 px-5 text-[14px]"><i class="fa-solid fa-play text-[12px]"></i> Start</div>
            <div class="avs"><img src="img/p1.jpg"><img src="img/p3.jpg"><img src="img/p2.jpg"></div>
            <span class="text-white/70 text-[12px] font-semibold">1.2k did this</span>
          </div>
        </div>
      </div>
    </div>

    <!-- continue -->
    <div class="pad">
      <div class="sec"><span class="h2">Keep going</span><span class="act">See all</span></div>
      <div class="space-y-3">
        <div class="card p-3 flex items-center gap-3.5">
          <div class="img rounded-2xl w-[96px] h-[76px] flex items-center justify-center flex-none overflow-hidden" style="background-image:url(img/drill.jpg)"><div class="play" style="width:32px;height:32px;font-size:11px"><i class="fa-solid fa-play"></i></div></div>
          <div class="flex-1">
            <div class="flex items-center gap-1.5"><span class="dot" style="background:var(--amber)"></span><span class="text-[11.5px] font-semibold text-slate-400">Face · 12 min</span></div>
            <div class="text-[15px] font-bold mt-1">Square-face gate</div>
            <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:70%;background:var(--gradAmber)"></i></div><span class="text-[11.5px] font-bold num">14/20</span></div>
          </div>
        </div>
        <div class="card p-3 flex items-center gap-3.5">
          <div class="img rounded-2xl w-[96px] h-[76px] flex items-center justify-center flex-none overflow-hidden" style="background-image:url(img/grip.jpg)"><div class="play" style="width:32px;height:32px;font-size:11px"><i class="fa-solid fa-play"></i></div></div>
          <div class="flex-1">
            <div class="flex items-center gap-1.5"><span class="dot" style="background:var(--teal)"></span><span class="text-[11.5px] font-semibold text-slate-400">Pressure · 6 min</span></div>
            <div class="text-[15px] font-bold mt-1">Light-grip ladder</div>
            <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:40%;background:var(--gradTeal)"></i></div><span class="text-[11.5px] font-bold num">2/5</span></div>
          </div>
        </div>
        <div class="card p-3 flex items-center gap-3.5">
          <div class="img rounded-2xl w-[96px] h-[76px] flex items-center justify-center flex-none overflow-hidden" style="background-image:url(img/kid.jpg)"><div class="play" style="width:32px;height:32px;font-size:11px"><i class="fa-solid fa-play"></i></div></div>
          <div class="flex-1">
            <div class="flex items-center gap-1.5"><span class="dot" style="background:#5CC24A"></span><span class="text-[11.5px] font-semibold text-slate-400">Rhythm · 10 min</span></div>
            <div class="text-[15px] font-bold mt-1">Tick-tock tempo</div>
            <div class="flex items-center gap-2 mt-2"><div class="bar flex-1"><i style="width:0%"></i></div><span class="text-[11.5px] font-bold text-slate-400">New</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a><i class="fa-solid fa-house"></i>Home</a>
    <a class="on"><i class="fa-solid fa-circle-play"></i>Drills</a>
    <a><span class="fab"><i class="fa-solid fa-golf-ball-tee"></i></span></a>
    <a><i class="fa-solid fa-chart-simple"></i>Progress</a>
    <a><i class="fa-solid fa-user"></i>Profile</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body></html>
