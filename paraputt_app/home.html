<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ParaPutt · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="sb"><span class="t">9:41</span><div class="island"></div><span class="i"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[17px]"></i></span></div>

    <div class="pad mt-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="img/p2.jpg" class="w-11 h-11 rounded-full object-cover">
        <div><div class="sub text-[13px]">Good morning</div><div class="text-[20px] font-extrabold tracking-tight">Maya</div></div>
      </div>
      <div class="flex items-center gap-2">
        <span class="pill card" style="color:var(--ink2)"><span class="dot" style="background:#12B76A"></span><i class="fa-solid fa-golf-ball-tee text-[11px]"></i> 86%</span>
        <div class="w-10 h-10 rounded-full card flex items-center justify-center relative"><i class="fa-regular fa-bell text-[15px]"></i><span class="absolute top-2 right-2.5 w-2 h-2 rounded-full" style="background:var(--coral)"></span></div>
      </div>
    </div>

    <!-- baseline match -->
    <div class="pad mt-6">
      <div class="rounded-[28px] p-5 text-white relative overflow-hidden" style="background:var(--gradInk)">
        <div class="absolute -right-10 -bottom-20 w-64 h-64 rounded-full" style="background:radial-gradient(circle,rgba(45,212,176,.35),transparent 70%)"></div>
        <div class="relative flex items-start justify-between">
          <div>
            <div class="text-[12.5px] font-semibold text-white/60">Baseline match · this week</div>
            <div class="flex items-end gap-2 mt-2"><span class="text-[54px] font-extrabold tracking-[-2.5px] leading-none num">82<span class="text-[28px]">%</span></span><span class="pill mb-2" style="background:rgba(183,242,92,.18);color:#B7F25C"><i class="fa-solid fa-arrow-up text-[10px]"></i> 9</span></div>
          </div>
          <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:rgba(255,255,255,.1)"><i class="fa-solid fa-chart-line"></i></div>
        </div>
        <svg class="relative mt-3" width="100%" height="56" viewBox="0 0 340 56" preserveAspectRatio="none">
          <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4B0" stop-opacity=".45"/><stop offset="1" stop-color="#2DD4B0" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 44 L48 40 L97 42 L145 33 L194 30 L242 22 L291 18 L340 10 L340 56 L0 56Z" fill="url(#a)"/>
          <path d="M0 44 L48 40 L97 42 L145 33 L194 30 L242 22 L291 18 L340 10" fill="none" stroke="#5EEAC8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="340" cy="10" r="4.5" fill="#B7F25C"/>
        </svg>
        <div class="relative flex justify-between text-[11px] font-semibold text-white/40 mt-1"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span class="text-white/80">S</span></div>
      </div>
    </div>

    <!-- stats -->
    <div class="pad grid grid-cols-3 gap-3 mt-4">
      <div class="card p-4"><i class="fa-solid fa-fire" style="color:var(--coral)"></i><div class="text-[28px] font-extrabold tracking-tight num mt-1.5">6</div><div class="text-[12px] text-slate-500 font-semibold">Day streak</div></div>
      <div class="card p-4"><i class="fa-solid fa-golf-ball-tee" style="color:var(--teal)"></i><div class="text-[28px] font-extrabold tracking-tight num mt-1.5">214</div><div class="text-[12px] text-slate-500 font-semibold">Putts</div></div>
      <div class="card p-4"><i class="fa-solid fa-bullseye" style="color:var(--violet)"></i><div class="text-[28px] font-extrabold tracking-tight num mt-1.5">31</div><div class="text-[12px] text-slate-500 font-semibold">Best run</div></div>
    </div>

    <!-- today's plan -->
    <div class="pad">
      <div class="sec"><span class="h2">Today's plan</span><span class="act">Change</span></div>
      <div class="img shade rounded-[26px] h-[188px] p-4 flex flex-col justify-between overflow-hidden" style="background-image:url(img/drill.jpg)">
        <div class="flex justify-between"><span class="pill glass"><i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i> Picked for you</span><span class="pill glassd">12 min</span></div>
        <div class="flex items-end justify-between">
          <div><div class="text-white text-[21px] font-extrabold tracking-tight">Square-face gate</div><div class="text-white/70 text-[13px] font-medium mt-0.5">Face opens 1.2° more than your best</div></div>
          <div class="w-12 h-12 rounded-full flex items-center justify-center text-white" style="background:var(--gradTeal)"><i class="fa-solid fa-play text-[15px] ml-0.5"></i></div>
        </div>
      </div>
    </div>

    <!-- signals -->
    <div class="pad">
      <div class="sec"><span class="h2">Your 3 signals</span><span class="act">Details</span></div>
      <div class="card divide-y divide-slate-100">
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-teal"><i class="fa-solid fa-hand"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Hand pressure</div><div class="bar mt-2"><i style="width:88%;background:var(--gradTeal)"></i></div></div><span class="dot" style="background:#12B76A"></span></div>
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-amber"><i class="fa-solid fa-compass-drafting"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Face angle</div><div class="bar mt-2"><i style="width:64%;background:var(--gradAmber)"></i></div></div><span class="dot" style="background:var(--amber)"></span></div>
        <div class="flex items-center gap-3.5 p-4"><div class="gicon g-lime"><i class="fa-solid fa-wave-square"></i></div><div class="flex-1"><div class="text-[15px] font-bold">Stroke rhythm</div><div class="bar mt-2"><i style="width:91%;background:var(--gradLime)"></i></div></div><span class="dot" style="background:#12B76A"></span></div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a class="on"><i class="fa-solid fa-house"></i>Home</a>
    <a><i class="fa-solid fa-circle-play"></i>Drills</a>
    <a><span class="fab"><i class="fa-solid fa-golf-ball-tee"></i></span></a>
    <a><i class="fa-solid fa-chart-simple"></i>Progress</a>
    <a><i class="fa-solid fa-user"></i>Profile</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body></html>
