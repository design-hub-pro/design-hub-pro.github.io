<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">

<title>DanceMate · Box step lesson</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:40px">
  <div class="relative h-[400px]">
    <img src="assets/coach.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 25%">
    <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(30,16,24,.45),rgba(30,16,24,0) 30%,rgba(30,16,24,0) 55%,rgba(30,16,24,.85))"></div>
    <div class="absolute inset-x-0 top-0"><div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div></div>
    <div class="absolute top-[66px] inset-x-0 px-c flex justify-between">
      <div class="w-11 h-11 rounded-full bg-white/25 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="flex gap-2"><div class="h-11 px-4 rounded-full bg-white/25 backdrop-blur flex items-center gap-2 text-white text-[14px] font-bold"><i class="fa-solid fa-closed-captioning"></i>Large</div><div class="w-11 h-11 rounded-full bg-white/25 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-gauge-simple"></i></div></div>
    </div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="w-[74px] h-[74px] rounded-full bg-white/95 flex items-center justify-center shadow-xl"><i class="fa-solid fa-play ac text-[26px] ml-1"></i></div></div>
    <div class="absolute inset-x-0 bottom-0 p-5 px-c">
      <p class="text-white/80 text-[14px] font-semibold">With teacher Rosa · 3:20</p>
      <p class="serif text-white text-[30px] font-semibold leading-tight">The full box</p>
      <div class="mt-3 h-1.5 rounded-full bg-white/30"><div class="h-full w-[35%] rounded-full bg-white"></div></div>
    </div>
  </div>

  <!-- Footprint diagram -->
  <div class="mx-[28px] -mt-1 pt-6 flex items-center justify-between"><p class="serif text-[22px] font-semibold">Where your feet go</p><span class="chip !py-1.5"><i class="fa-solid fa-rotate text-[12px]"></i>Mirror</span></div>
  <div class="mx-[28px] mt-3 card p-5 flex gap-5 items-center">
    <svg viewBox="0 0 200 220" class="w-[190px] h-[210px] flex-shrink-0">
      <rect x="40" y="40" width="120" height="140" rx="16" fill="none" stroke="#EFE4DC" stroke-width="3" stroke-dasharray="7 7"/>
      <path d="M70 160 L70 70 M70 70 L130 70 M130 70 L130 160 M130 160 L70 160" stroke="#F0657F" stroke-width="3" fill="none" opacity=".35"/>
      <g font-family="Plus Jakarta Sans" font-weight="800" font-size="15" text-anchor="middle">
        <g transform="translate(70 70)"><ellipse rx="15" ry="24" fill="#C2366B"/><text y="5" fill="#fff">1</text></g>
        <g transform="translate(130 70)"><ellipse rx="15" ry="24" fill="#E77C9A"/><text y="5" fill="#fff">2</text></g>
        <g transform="translate(130 118)"><ellipse rx="15" ry="24" fill="#E77C9A" opacity=".55"/><text y="5" fill="#fff">3</text></g>
        <g transform="translate(130 160)"><ellipse rx="15" ry="24" fill="#2A1A24"/><text y="5" fill="#fff">4</text></g>
        <g transform="translate(70 160)"><ellipse rx="15" ry="24" fill="#6B5560"/><text y="5" fill="#fff">5</text></g>
        <g transform="translate(70 112)"><ellipse rx="15" ry="24" fill="#6B5560" opacity=".55"/><text y="5" fill="#fff">6</text></g>
      </g>
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#A3929B" font-family="Plus Jakarta Sans">FRONT</text>
    </svg>
    <div class="flex-1 space-y-3">
      <div class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-full bg-[#C2366B] text-white text-[14px] font-extrabold flex items-center justify-center">1</span><p class="text-[16px] font-bold">Left forward</p></div>
      <div class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-full bg-[#E77C9A] text-white text-[14px] font-extrabold flex items-center justify-center">2</span><p class="text-[16px] font-bold">Right to side</p></div>
      <div class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-full bg-[#E77C9A]/60 text-white text-[14px] font-extrabold flex items-center justify-center">3</span><p class="text-[16px] font-bold">Close left</p></div>
      <div class="hair"></div>
      <p class="text-[14px] font-semibold text-[#8A7882]">Then back: 4, 5, 6</p>
    </div>
  </div>

  <!-- Beat -->
  <div class="mx-[28px] mt-4 rounded-[24px] g-plum p-5 flex items-center gap-4">
    <div class="flex gap-2">
      <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-[24px] font-extrabold text-[#6B3FA0]">1</div>
      <div class="w-14 h-14 rounded-2xl bg-white/25 flex items-center justify-center text-[24px] font-extrabold text-white">2</div>
      <div class="w-14 h-14 rounded-2xl bg-white/25 flex items-center justify-center text-[24px] font-extrabold text-white">3</div>
    </div>
    <div class="text-white"><p class="text-[16px] font-extrabold">Count out loud</p><p class="text-[13.5px] font-semibold text-white/80">84 beats a minute</p></div>
  </div>

  <div class="px-c mt-5 flex gap-3">
    <div class="w-[62px] h-[62px] rounded-[20px] card flex items-center justify-center"><i class="fa-solid fa-chair text-[20px] ac"></i></div>
    <div class="btn g-rose flex-1"><i class="fa-solid fa-camera"></i>Try it with my camera</div>
  </div>
</div></div></body></html>
