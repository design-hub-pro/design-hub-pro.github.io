<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">

<title>DanceMate · Comfort check-in</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:40px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-3 flex items-center justify-between">
    <div class="w-11 h-11 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <p class="text-[17px] font-extrabold">Before we dance</p>
    <div class="w-11"></div>
  </div>

  <div class="px-c mt-5"><h1 class="serif text-[30px] font-semibold leading-tight">Tap anything that aches today</h1></div>

  <div class="mx-[28px] mt-5 card p-5 flex gap-4 items-center">
    <svg viewBox="0 0 120 240" class="w-[150px] h-[300px] flex-shrink-0">
      <g fill="#F4E9E2">
        <circle cx="60" cy="26" r="18"/>
        <rect x="38" y="48" width="44" height="78" rx="16"/>
        <rect x="18" y="52" width="16" height="70" rx="8" transform="rotate(8 26 52)"/>
        <rect x="86" y="52" width="16" height="70" rx="8" transform="rotate(-8 94 52)"/>
        <rect x="40" y="122" width="18" height="104" rx="9"/>
        <rect x="62" y="122" width="18" height="104" rx="9"/>
      </g>
      <circle cx="18" cy="126" r="12" fill="#F0657F" opacity=".25"/><circle cx="18" cy="126" r="6" fill="#F0657F"/>
      <circle cx="102" cy="126" r="12" fill="#F0657F" opacity=".25"/><circle cx="102" cy="126" r="6" fill="#F0657F"/>
      <circle cx="71" cy="176" r="13" fill="#FBBF5A" opacity=".3"/><circle cx="71" cy="176" r="6.5" fill="#FBBF5A"/>
      <circle cx="49" cy="176" r="5" fill="none" stroke="#D9CBC2" stroke-width="2"/>
      <circle cx="34" cy="56" r="5" fill="none" stroke="#D9CBC2" stroke-width="2"/><circle cx="86" cy="56" r="5" fill="none" stroke="#D9CBC2" stroke-width="2"/>
    </svg>
    <div class="flex-1 space-y-3">
      <div class="rounded-2xl bg-[#FDECF0] p-3"><div class="flex items-center gap-2"><span class="dot bg-[#F0657F]"></span><p class="text-[16px] font-extrabold">Both hands</p></div><p class="text-[13px] font-semibold text-[#8A7882] mt-0.5">Stiff this morning</p></div>
      <div class="rounded-2xl bg-[#FFF5E6] p-3"><div class="flex items-center gap-2"><span class="dot bg-[#FBBF5A]"></span><p class="text-[16px] font-extrabold">Left knee</p></div><p class="text-[13px] font-semibold text-[#8A7882] mt-0.5">A little sore</p></div>
    </div>
  </div>

  <div class="mx-[28px] mt-4 card p-5">
    <p class="text-[16px] font-extrabold">How is your energy?</p>
    <div class="grid grid-cols-5 gap-2 mt-3">
      <div class="h-[58px] rounded-2xl bg-[#F6F0EB] flex items-center justify-center text-[26px] text-[#A3929B]"><i class="fa-regular fa-face-tired"></i></div>
      <div class="h-[58px] rounded-2xl bg-[#F6F0EB] flex items-center justify-center text-[26px] text-[#A3929B]"><i class="fa-regular fa-face-meh"></i></div>
      <div class="h-[58px] rounded-2xl g-rose flex items-center justify-center text-[26px] text-white ring-4 ring-[#FBE3EA]"><i class="fa-regular fa-face-smile"></i></div>
      <div class="h-[58px] rounded-2xl bg-[#F6F0EB] flex items-center justify-center text-[26px] text-[#A3929B]"><i class="fa-regular fa-face-grin"></i></div>
      <div class="h-[58px] rounded-2xl bg-[#F6F0EB] flex items-center justify-center text-[26px] text-[#A3929B]"><i class="fa-regular fa-face-laugh-beam"></i></div>
    </div>
  </div>

  <p class="px-c mt-6 meta">Today's lesson, adjusted</p>
  <div class="px-c mt-3 space-y-3">
    <div class="card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl g-sage flex items-center justify-center"><i class="fa-solid fa-hand-holding-heart text-white text-[18px]"></i></div><p class="flex-1 text-[16px] font-bold">Soft open hands in the frame</p><i class="fa-solid fa-check text-[#2FAF7A]"></i></div>
    <div class="card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl g-teal flex items-center justify-center"><i class="fa-solid fa-ruler-horizontal text-white text-[18px]"></i></div><p class="flex-1 text-[16px] font-bold">Steps 30% smaller</p><i class="fa-solid fa-check text-[#2FAF7A]"></i></div>
    <div class="card p-4 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl g-sky flex items-center justify-center"><i class="fa-solid fa-gauge-simple-low text-white text-[18px]"></i></div><p class="flex-1 text-[16px] font-bold">Music slowed to 72 bpm</p><i class="fa-solid fa-check text-[#2FAF7A]"></i></div>
  </div>

  <div class="px-c mt-5"><div class="btn g-rose">Start gentle lesson<i class="fa-solid fa-arrow-right"></i></div></div>
</div></div></body></html>
