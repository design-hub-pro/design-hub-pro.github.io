<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">

<title>DanceMate · Live feedback</title></head><body>
<div class="screen bg-black">
  <!-- camera feed: blurred fill + full-body frame of the waltz side step -->
  <img src="assets/waltz_pose.jpg" class="absolute inset-0 w-full h-full object-cover scale-125" style="filter:blur(26px) brightness(.8)">
  <div class="absolute w-[532px] h-[532px]" style="left:-32px;top:215px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent)">
    <img src="assets/waltz_pose.jpg" class="absolute inset-0 w-full h-full object-cover">
    <svg class="pose" viewBox="0 0 1024 1024" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="482" y1="120" x2="486" y2="960" stroke="#fff" stroke-width="4" stroke-dasharray="14 12" opacity=".8"/>
      <g stroke="#5EEAD4" stroke-width="11">
        <line x1="478" y1="215" x2="472" y2="150"/>
        <line x1="380" y1="262" x2="588" y2="242"/>
        <polyline points="588,242 700,300 822,330"/>
        <line x1="425" y1="525" x2="548" y2="525"/>
        <line x1="380" y1="262" x2="425" y2="525"/><line x1="588" y1="242" x2="548" y2="525"/>
        <polyline points="548,525 512,720 528,905"/>
        <polyline points="425,525 420,705"/>
      </g>
      <g stroke="#FBBF5A" stroke-width="12"><polyline points="380,262 290,325 190,345"/></g>
      <g stroke="#FBBF5A" stroke-width="12"><line x1="420" y1="705" x2="365" y2="905"/></g>
      <path d="M 290 325 L 190 300" stroke="#FBBF5A" stroke-width="5" stroke-dasharray="10 9"/>
      <path d="M 365 952 Q 445 985 525 950" stroke="#fff" stroke-width="5" stroke-dasharray="10 9" opacity=".9"/>
      <g fill="#fff" stroke="#1E1018" stroke-width="3"><circle cx="472" cy="150" r="14"/><circle cx="380" cy="262" r="14"/><circle cx="588" cy="242" r="14"/><circle cx="290" cy="325" r="14"/><circle cx="190" cy="345" r="14"/><circle cx="700" cy="300" r="14"/><circle cx="822" cy="330" r="14"/><circle cx="425" cy="525" r="14"/><circle cx="548" cy="525" r="14"/><circle cx="420" cy="705" r="14"/><circle cx="512" cy="720" r="14"/><circle cx="365" cy="905" r="14"/><circle cx="528" cy="905" r="14"/></g>
    </svg>
  </div>
  <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(20,10,16,.6),rgba(20,10,16,0) 22%,rgba(20,10,16,0) 55%,rgba(20,10,16,.85))"></div>

  <div class="absolute inset-x-0 top-0"><div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div></div>
  <div class="absolute top-[66px] inset-x-0 px-c flex items-center justify-between">
    <div class="w-11 h-11 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-xmark text-[18px]"></i></div>
    <div class="h-11 px-4 rounded-full bg-white/20 backdrop-blur flex items-center gap-2 text-white font-bold text-[15px]"><span class="dot bg-[#F0657F] animate-pulse"></span><span class="num">04:12</span></div>
    <div class="w-11 h-11 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fa-solid fa-pause"></i></div>
  </div>

  <!-- Beat counter -->
  <div class="absolute top-[124px] inset-x-0 px-c flex items-start justify-between">
    <div class="flex gap-2">
      <div class="w-[52px] h-[52px] rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-white/70 text-[22px] font-extrabold">1</div>
      <div class="w-[52px] h-[52px] rounded-2xl bg-white flex items-center justify-center text-[#B8285F] text-[26px] font-extrabold scale-110 shadow-lg">2</div>
      <div class="w-[52px] h-[52px] rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-white/70 text-[22px] font-extrabold">3</div>
    </div>
    <div class="w-[92px] h-[120px] rounded-[18px] overflow-hidden ring-2 ring-white/70 relative">
      <img src="assets/coach.jpg" class="w-full h-full object-cover" style="object-position:50% 20%">
      <span class="absolute bottom-1.5 left-1.5 text-[11px] font-extrabold text-white bg-black/50 px-1.5 py-0.5 rounded-md">Rosa</span>
    </div>
  </div>

  <span class="tag warn" style="left:24px;top:418px"><i class="fa-solid fa-arrow-up mr-1"></i>Right elbow 12° low</span>
  <span class="tag ok" style="right:24px;top:318px"><i class="fa-solid fa-check mr-1"></i>Left frame arm</span>
  <span class="tag ok" style="right:40px;top:560px"><i class="fa-solid fa-check mr-1"></i>Tall spine</span>
  <span class="tag" style="left:262px;top:672px"><i class="fa-solid fa-shoe-prints mr-1"></i>Step 2 · side</span>

  <!-- bottom -->
  <div class="absolute inset-x-0 bottom-0 px-c pb-9">
    <div class="flex gap-2 mb-3">
      <span class="chip glass"><span class="dot bg-emerald-400"></span>On the beat</span>
      <span class="chip glass"><span class="dot bg-amber-300"></span>Frame</span>
      <span class="chip glass"><span class="dot bg-emerald-400"></span>Feet</span>
    </div>
    <div class="rounded-[24px] bg-white p-4 flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl g-rose flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-volume-high text-white text-[20px]"></i></div>
      <div class="flex-1"><p class="text-[17px] font-extrabold leading-snug">Lift your right elbow, as if resting it on a partner.</p><p class="text-[13px] font-semibold text-[#8A7882] mt-1">Box 5 of 8 · chair is in reach</p></div>
    </div>
    <div class="flex gap-1.5 mt-4"><span class="flex-1 h-2 rounded-full bg-white"></span><span class="flex-1 h-2 rounded-full bg-white"></span><span class="flex-1 h-2 rounded-full bg-white"></span><span class="flex-1 h-2 rounded-full bg-white"></span><span class="flex-1 h-2 rounded-full bg-[#F0657F]"></span><span class="flex-1 h-2 rounded-full bg-white/30"></span><span class="flex-1 h-2 rounded-full bg-white/30"></span><span class="flex-1 h-2 rounded-full bg-white/30"></span></div>
  </div>
</div></body></html>
