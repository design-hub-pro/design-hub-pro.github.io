<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawnlock - Asleep</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; } * { scrollbar-width:none; }
  html, body { height:100%; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#04050A; color:#5A6480; overflow:hidden; position:relative; }
  body::before { content:''; position:absolute; bottom:-220px; left:50%; transform:translateX(-50%); width:600px; height:460px; border-radius:50%; background:radial-gradient(circle, rgba(58,72,140,0.20), transparent 66%); }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; opacity:0.30; }
  .status-time { font-size:17px; font-weight:700; color:#8891AB; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; color:#8891AB; }
  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); }

  .content { padding:0 28px; position:relative; z-index:5; height:calc(100% - 59px); display:flex; flex-direction:column; }

  .mode { text-align:center; margin-top:44px; }
  .mtag { display:inline-flex; align-items:center; gap:8px; font-size:10.5px; font-weight:850; letter-spacing:2px; text-transform:uppercase; color:#4E5878; border:1px solid rgba(120,136,190,0.18); padding:8px 16px; border-radius:50px; }
  .pulse { width:6px; height:6px; border-radius:50%; background:#5A6BB4; }

  .clock { text-align:center; margin-top:60px; }
  .ct { font-size:96px; font-weight:200; letter-spacing:-4px; line-height:0.92; color:#7A85B8; font-variant-numeric:tabular-nums; }
  .cs { font-size:13.5px; font-weight:650; color:#3E4766; margin-top:16px; letter-spacing:0.4px; }

  .stage { margin-top:58px; }
  .sl { font-size:10px; font-weight:850; letter-spacing:1.8px; text-transform:uppercase; color:#333B57; text-align:center; }
  .arc { margin-top:20px; }

  .facts { display:flex; margin-top:44px; }
  .f { flex:1; text-align:center; }
  .fn { font-size:26px; font-weight:800; color:#6C77A8; letter-spacing:-1px; line-height:1; }
  .fl { font-size:10.5px; font-weight:700; color:#333B57; margin-top:8px; letter-spacing:0.6px; }
  .fsep { width:1px; background:rgba(120,136,190,0.12); }

  .alarm { margin-top:auto; margin-bottom:32px; border-top:1px solid rgba(120,136,190,0.10); padding-top:24px; }
  .arow { display:flex; align-items:center; gap:13px; }
  .aic { width:40px; height:40px; border-radius:13px; background:rgba(255,138,61,0.10); color:#B06A38; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .at { font-size:16px; font-weight:800; color:#8891AB; }
  .am { font-size:11.5px; color:#3E4766; margin-top:3px; font-weight:650; }
  .aq { margin-left:auto; font-size:10px; font-weight:850; letter-spacing:1px; color:#B06A38; border:1px solid rgba(176,106,56,0.28); padding:6px 11px; border-radius:20px; }
  .hint { text-align:center; font-size:11.5px; color:#2C3350; margin-top:22px; font-weight:650; }
</style>
</head>
<body>
  <div class="status-bar">
    <div class="status-time">1:14</div>
    <div class="dynamic-island"></div>
    <div class="status-icons"><i class="fas fa-moon"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters" style="font-size:16px"></i></div>
  </div>

  <div class="content">
    <div class="mode">
      <div class="mtag"><span class="pulse"></span> Sleeping · do not disturb</div>
    </div>

    <div class="clock">
      <div class="ct">1:14</div>
      <div class="cs">Asleep for 2h 05m</div>
    </div>

    <div class="stage">
      <div class="sl">Tonight so far</div>
      <svg class="arc" viewBox="0 0 380 78" preserveAspectRatio="none" style="width:100%;height:78px">
        <rect x="0" y="6" width="46" height="13" rx="4" fill="#3D4778"/>
        <rect x="48" y="24" width="62" height="13" rx="4" fill="#333C68"/>
        <rect x="112" y="42" width="74" height="13" rx="4" fill="#2A3158"/>
        <rect x="188" y="24" width="40" height="13" rx="4" fill="#333C68"/>
        <rect x="230" y="60" width="52" height="13" rx="4" fill="#4B3F7A"/>
        <rect x="284" y="24" width="44" height="13" rx="4" fill="#333C68"/>
        <rect x="330" y="42" width="50" height="13" rx="4" fill="#2A3158"/>
        <path d="M23,19 L23,24 M79,37 L79,42 M149,42 L149,24 M208,37 L208,60 M256,60 L256,24 M306,37 L306,42"
              stroke="rgba(120,136,190,0.14)" stroke-width="1"/>
      </svg>
    </div>

    <div class="facts">
      <div class="f"><div class="fn">13.4</div><div class="fl">BREATHS / MIN</div></div>
      <div class="fsep"></div>
      <div class="f"><div class="fn">2</div><div class="fl">STIRS</div></div>
      <div class="fsep"></div>
      <div class="f"><div class="fn">18.6°</div><div class="fl">ROOM</div></div>
    </div>

    <div class="alarm">
      <div class="arow">
        <div class="aic"><i class="fas fa-bell"></i></div>
        <div>
          <div class="at">6:40 AM · in 5h 26m</div>
          <div class="am">10 push-ups, then the bathroom code</div>
        </div>
        <div class="aq">ARMED</div>
      </div>
      <div class="hint">Tap twice for a dim light. Nothing else works until morning.</div>
    </div>
  </div>
</body>
</html>
