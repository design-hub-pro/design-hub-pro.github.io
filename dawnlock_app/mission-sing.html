<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawnlock - Sing</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; } * { scrollbar-width:none; }
  html, body { height:100%; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#150D07; color:#FFF3E9; overflow:hidden; position:relative; }

  .cam { position:absolute; inset:0; }
  .cam img { width:100%; height:100%; object-fit:cover; opacity:0.9; }
  .cam::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(24,13,6,0.82) 0%, rgba(24,13,6,0.30) 30%, rgba(21,11,5,0.80) 58%, rgba(18,9,4,0.98) 82%); }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; }
  .status-time { font-size:17px; font-weight:700; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dynamic-island { width:150px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:8px; }
  .di-dot { width:8px; height:8px; border-radius:50%; background:#FF5A3D; }
  .di-t { font-size:11px; font-weight:850; color:#FF8A3D; letter-spacing:0.5px; }

  .content { padding:0 28px; position:relative; z-index:5; height:calc(100% - 59px); display:flex; flex-direction:column; }

  .ring-alarm { display:flex; align-items:center; gap:10px; align-self:center; background:rgba(255,90,61,0.18); border:1px solid rgba(255,90,61,0.38); padding:9px 17px; border-radius:50px; margin-top:10px; backdrop-filter:blur(10px); }
  .ra-d { width:7px; height:7px; border-radius:50%; background:#FF5A3D; }
  .ra-t { font-size:11px; font-weight:850; letter-spacing:1.7px; text-transform:uppercase; color:#FFB49C; }

  .headline { text-align:center; margin-top:24px; }
  .hl { font-size:27px; font-weight:900; letter-spacing:-1px; text-shadow:0 2px 20px rgba(0,0,0,0.55); }
  .hs { font-size:13px; color:#CBAE99; margin-top:9px; font-weight:650; }

  .mid { margin-top:auto; }

  .timer { text-align:center; }
  .tn { font-size:74px; font-weight:900; letter-spacing:-3.6px; line-height:0.92; background:linear-gradient(180deg,#FFE3CC,#FF9A4D); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .tl { font-size:12px; font-weight:800; letter-spacing:2.2px; color:#A88770; margin-top:9px; text-transform:uppercase; }

  .live { margin-top:26px; height:120px; position:relative; }
  .live svg { width:100%; height:100%; }

  .meters { display:flex; gap:10px; margin-top:22px; }
  .mt { flex:1; background:rgba(30,18,10,0.82); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:15px 16px 14px; }
  .mtl { font-size:10px; font-weight:850; letter-spacing:1.3px; text-transform:uppercase; color:#8E7160; }
  .mtv { font-size:24px; font-weight:900; letter-spacing:-1px; margin-top:7px; }
  .mtv.g { color:#5FD39B; }
  .mtv.o { color:#FF8A3D; }
  .mtb { height:5px; border-radius:4px; background:rgba(255,255,255,0.10); margin-top:11px; position:relative; }
  .mtf { position:absolute; left:0; top:0; bottom:0; border-radius:4px; }

  .lyric { margin-top:22px; background:rgba(30,18,10,0.82); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.08); border-radius:22px; padding:18px 20px; }
  .ll { font-size:10px; font-weight:850; letter-spacing:1.4px; text-transform:uppercase; color:#8E7160; }
  .lt { font-size:17px; font-weight:800; margin-top:10px; line-height:1.4; }
  .lt .done { color:#8E7160; }
  .lt .now { color:#FF8A3D; }

  .foot { text-align:center; font-size:12px; font-weight:700; color:#6B5648; margin:22px 0 34px; }
</style>
</head>
<body>
  <div class="cam"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786644853572-image-1.png" alt=""></div>

  <div class="status-bar">
    <div class="status-time">6:44</div>
    <div class="dynamic-island"><span class="di-dot"></span><span class="di-t">ALARM</span></div>
    <div class="status-icons"><i class="fas fa-microphone" style="color:#FF8A3D"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full" style="font-size:16px"></i></div>
  </div>

  <div class="content">
    <div class="ring-alarm"><span class="ra-d"></span><span class="ra-t">Sing to dismiss</span></div>

    <div class="headline">
      <div class="hl">Twelve seconds<br>of anything.</div>
      <div class="hs">Humming counts. Mumbling does not.</div>
    </div>

    <div class="mid">
      <div class="timer">
        <div class="tn">9.4</div>
        <div class="tl">of 12 seconds held</div>
      </div>

      <div class="live">
        <svg viewBox="0 0 380 120" preserveAspectRatio="none">
          <line x1="0" y1="46" x2="380" y2="46" stroke="rgba(255,255,255,0.13)" stroke-width="1.5" stroke-dasharray="5 6"/>
          <path d="M0,88 C16,86 24,64 40,60 C58,56 66,72 84,66 C100,60 108,40 126,42 C144,44 150,58 168,52
                   C186,46 192,32 210,36 C228,40 234,54 252,48 C266,43 274,30 288,34"
                fill="none" stroke="url(#sg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="288" cy="34" r="7" fill="#FFD9BF"/>
          <circle cx="288" cy="34" r="14" fill="none" stroke="rgba(255,217,191,0.32)" stroke-width="2"/>
          <g fill="rgba(255,138,61,0.34)">
            <rect x="298" y="52" width="4" height="16" rx="2"/><rect x="308" y="46" width="4" height="28" rx="2"/>
            <rect x="318" y="56" width="4" height="8" rx="2"/><rect x="328" y="50" width="4" height="20" rx="2"/>
            <rect x="338" y="58" width="4" height="4" rx="2"/><rect x="348" y="54" width="4" height="12" rx="2"/>
            <rect x="358" y="57" width="4" height="6" rx="2"/><rect x="368" y="55" width="4" height="10" rx="2"/>
          </g>
          <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8E7160"/><stop offset="55%" stop-color="#FF8A3D"/><stop offset="100%" stop-color="#FFD9BF"/>
          </linearGradient></defs>
          <text x="4" y="40" fill="#6B5648" font-size="10" font-weight="700" font-family="Inter">TARGET PITCH</text>
        </svg>
      </div>

      <div class="meters">
        <div class="mt">
          <div class="mtl">Volume</div>
          <div class="mtv g">Loud enough</div>
          <div class="mtb"><div class="mtf" style="width:78%;background:#5FD39B"></div></div>
        </div>
        <div class="mt">
          <div class="mtl">Pitch match</div>
          <div class="mtv o">61%</div>
          <div class="mtb"><div class="mtf" style="width:61%;background:#FF8A3D"></div></div>
        </div>
      </div>

      <div class="lyric">
        <div class="ll">Today's line · shuffled</div>
        <div class="lt"><span class="done">I get knocked down,</span> <span class="now">but I get up again</span></div>
      </div>

      <div class="foot">Stop singing and the counter goes back to zero</div>
    </div>
  </div>
</body>
</html>
