<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawnlock - Push-ups</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; } * { scrollbar-width:none; }
  html, body { height:100%; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#120A06; color:#FFF3E9; overflow:hidden; position:relative; }

  .cam { position:absolute; inset:0; }
  .cam img { width:100%; height:100%; object-fit:cover; }
  .cam::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(24,10,4,0.86) 0%, rgba(24,10,4,0.34) 34%, rgba(24,10,4,0.62) 62%, rgba(18,8,4,0.96) 88%); }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; }
  .status-time { font-size:17px; font-weight:700; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dynamic-island { width:150px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:8px; }
  .di-dot { width:8px; height:8px; border-radius:50%; background:#FF5A3D; }
  .di-t { font-size:11px; font-weight:850; color:#FF8A3D; letter-spacing:0.5px; }

  .content { padding:0 28px 132px; position:relative; z-index:5; height:calc(100% - 59px); display:flex; flex-direction:column; }

  .ring-alarm { display:flex; align-items:center; gap:10px; align-self:center; background:rgba(255,90,61,0.16); border:1px solid rgba(255,90,61,0.36); padding:9px 17px; border-radius:50px; margin-top:10px; }
  .ra-d { width:7px; height:7px; border-radius:50%; background:#FF5A3D; }
  .ra-t { font-size:11px; font-weight:850; letter-spacing:1.7px; text-transform:uppercase; color:#FF9C7A; }

  .headline { text-align:center; margin-top:26px; }
  .hl { font-size:26px; font-weight:900; letter-spacing:-1px; }
  .hs { font-size:13px; color:#C4A793; margin-top:9px; font-weight:650; }

  .counter { display:flex; justify-content:center; position:relative; margin-top:24px; }
  .cring { width:296px; height:296px; }
  .cin { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .cnum { font-size:118px; font-weight:900; letter-spacing:-7px; line-height:0.86; background:linear-gradient(180deg,#FFD9BF,#FF8A3D); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .cof { font-size:16px; font-weight:800; color:#A88770; letter-spacing:2.4px; margin-top:12px; }

  .depth { margin-top:20px; background:rgba(20,9,4,0.62); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.07); border-radius:22px; padding:16px 18px 14px; }
  .dh { display:flex; justify-content:space-between; align-items:baseline; }
  .dl { font-size:10.5px; font-weight:850; letter-spacing:1.5px; text-transform:uppercase; color:#8E7160; }
  .dv { font-size:11.5px; font-weight:800; color:#5FD39B; }
  .dbars { display:block; width:100%; height:56px; margin-top:12px; }
  .dnote { font-size:11.5px; color:#A08575; margin-top:10px; font-weight:650; text-align:center; }

  .warn { margin-top:auto; margin-bottom:16px; background:rgba(255,90,61,0.12); border:1px solid rgba(255,90,61,0.26); border-radius:20px; padding:15px 18px; display:flex; align-items:center; gap:13px; }
  .wic { width:34px; height:34px; border-radius:11px; background:rgba(255,90,61,0.22); color:#FF9C7A; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .wt { font-size:13px; font-weight:750; line-height:1.4; }
  .wm { font-size:11px; color:#B8907A; margin-top:3px; font-weight:650; }

  .vol { position:absolute; left:28px; right:28px; bottom:34px; z-index:20; }
  .vrow { display:flex; align-items:center; gap:11px; }
  .vt { font-size:11px; font-weight:850; letter-spacing:1.4px; text-transform:uppercase; color:#8E7160; }
  .vv { margin-left:auto; font-size:11.5px; font-weight:850; color:#FF8A3D; }
  .vtrack { height:5px; border-radius:4px; background:rgba(255,255,255,0.10); margin-top:10px; position:relative; }
  .vfill { position:absolute; left:0; top:0; bottom:0; width:74%; border-radius:4px; background:linear-gradient(90deg,#FF8A3D,#FF5A3D); }
  .snooze { text-align:center; font-size:12px; font-weight:750; color:#6B5648; margin-top:18px; letter-spacing:0.3px; }
</style>
</head>
<body>
  <div class="cam"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786644853100-image-1.png" alt=""></div>

  <div class="status-bar">
    <div class="status-time">6:41</div>
    <div class="dynamic-island"><span class="di-dot"></span><span class="di-t">ALARM</span></div>
    <div class="status-icons"><i class="fas fa-volume-high" style="color:#FF8A3D"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full" style="font-size:16px"></i></div>
  </div>

  <div class="content">
    <div class="ring-alarm"><span class="ra-d"></span><span class="ra-t">Mission 1 of 2</span></div>

    <div class="headline">
      <div class="hl">Ten push-ups.</div>
      <div class="hs">Phone flat on the floor. It is watching depth.</div>
    </div>

    <div class="counter">
      <svg class="cring" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="134" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="12"/>
        <circle cx="150" cy="150" r="134" fill="none" stroke="url(#pg)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="842" stroke-dashoffset="253" transform="rotate(-90 150 150)"/>
        <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFD9BF"/><stop offset="100%" stop-color="#FF6A3D"/>
        </linearGradient></defs>
      </svg>
      <div class="cin">
        <div class="cnum">7</div>
        <div class="cof">OF 10</div>
      </div>
    </div>

    <div class="depth">
      <div class="dh">
        <div class="dl">Rep depth</div>
        <div class="dv">7 counted · 2 too shallow</div>
      </div>
      <svg class="dbars" viewBox="0 0 380 56" preserveAspectRatio="none">
        <line x1="0" y1="22" x2="380" y2="22" stroke="rgba(255,255,255,0.16)" stroke-width="1" stroke-dasharray="4 5"/>
        <rect x="0"     y="10.1" width="33.5" height="45.9" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="38.5"  y="5.6"  width="33.5" height="50.4" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="77"    y="34.7" width="33.5" height="21.3" rx="3" fill="rgba(255,255,255,0.24)"/>
        <rect x="115.5" y="13.4" width="33.5" height="42.6" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="154"   y="6.7"  width="33.5" height="49.3" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="192.5" y="15.7" width="33.5" height="40.3" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="231"   y="31.4" width="33.5" height="24.6" rx="3" fill="rgba(255,255,255,0.24)"/>
        <rect x="269.5" y="9"    width="33.5" height="47" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="308"   y="16.8" width="33.5" height="39.2" rx="3" fill="rgba(255,138,61,0.80)"/>
        <rect x="346.5" y="23.5" width="33.5" height="32.5" rx="3" fill="#FFD9BF"/>
      </svg>
      <div class="dnote">Half a push-up is not a push-up.</div>
    </div>

    <div class="warn">
      <div class="wic"><i class="fas fa-volume-high"></i></div>
      <div>
        <div class="wt">Volume goes up in 8 seconds</div>
        <div class="wm">Keep moving and it stays where it is</div>
      </div>
    </div>
  </div>

  <div class="vol">
    <div class="vrow">
      <div class="vt">Alarm level</div>
      <div class="vv">74%</div>
    </div>
    <div class="vtrack"><div class="vfill"></div></div>
    <div class="snooze">Snooze is off. You turned it off on 4 August.</div>
  </div>
</body>
</html>
