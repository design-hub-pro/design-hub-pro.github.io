<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawnlock - Mixer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  *::-webkit-scrollbar { display:none; } * { scrollbar-width:none; }
  html, body { height:100%; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#0A0D18; color:#EEF1FA; overflow:hidden; position:relative; }

  .art { position:absolute; top:0; left:0; right:0; height:400px; }
  .art img { width:100%; height:100%; object-fit:cover; opacity:0.62; }
  .art::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,13,24,0.35) 0%, rgba(10,13,24,0.55) 45%, #0A0D18 96%); }

  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:100; }
  .status-time { font-size:17px; font-weight:700; }
  .status-icons { display:flex; align-items:center; gap:6px; font-size:13px; }
  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:10px; left:50%; transform:translateX(-50%); }

  .content { padding:0 28px; position:relative; z-index:5; }

  .top { display:flex; align-items:center; justify-content:space-between; }
  .x { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; font-size:14px; color:#E6EAF6; }
  .phase { font-size:11px; font-weight:850; letter-spacing:1.8px; text-transform:uppercase; color:#C3CBE0; }

  .title { margin-top:108px; }
  .tt { font-size:32px; font-weight:900; letter-spacing:-1.3px; line-height:1.1; }
  .ts { font-size:13px; color:#A6AFC6; margin-top:8px; font-weight:650; }

  .wave { height:42px; margin-top:16px; display:flex; align-items:center; gap:3px; }
  .wave span { flex:1; border-radius:3px; background:rgba(123,140,255,0.34); }
  .wave span.hot { background:#7B8CFF; }

  .sl-h { font-size:11px; font-weight:850; letter-spacing:1.6px; text-transform:uppercase; color:#6C768F; margin-top:16px; }

  .layer { background:#141A2C; border:1px solid rgba(255,255,255,0.07); border-radius:22px; padding:12px 18px 13px; margin-top:10px; }
  .lrow { display:flex; align-items:center; gap:12px; }
  .lic { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .ln { font-size:14.5px; font-weight:800; }
  .lp { margin-left:auto; font-size:14px; font-weight:850; color:#9AA8FF; font-variant-numeric:tabular-nums; }
  .lt { height:6px; border-radius:4px; background:rgba(255,255,255,0.09); margin-top:11px; position:relative; }
  .lf { position:absolute; left:0; top:0; bottom:0; border-radius:4px; }
  .lk { position:absolute; top:50%; transform:translate(-50%,-50%); width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.5); }

  .add { margin-top:10px; border:1.5px dashed rgba(255,255,255,0.14); border-radius:22px; padding:13px; display:flex; align-items:center; justify-content:center; gap:9px; font-size:13.5px; font-weight:750; color:#6C768F; }

  .fade { margin-top:14px; background:linear-gradient(150deg,rgba(123,140,255,0.18),rgba(176,140,255,0.07)); border:1px solid rgba(123,140,255,0.26); border-radius:24px; padding:16px 20px 17px; }
  .fh { display:flex; align-items:center; gap:11px; }
  .fic { width:34px; height:34px; border-radius:11px; background:rgba(123,140,255,0.24); color:#9AA8FF; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .fn { font-size:14.5px; font-weight:850; }
  .fsw { margin-left:auto; width:48px; height:29px; border-radius:20px; background:#7B8CFF; position:relative; }
  .fsw::after { content:''; position:absolute; right:3px; top:3px; width:23px; height:23px; border-radius:50%; background:#fff; }
  .ftx { font-size:12.5px; color:#A6AFC6; line-height:1.5; margin-top:10px; }
  .ftx b { color:#EEF1FA; font-weight:750; }

  .curve { margin-top:10px; }

  .ctrl { position:absolute; left:0; right:0; bottom:36px; display:flex; align-items:center; justify-content:center; gap:26px; z-index:20; }
  .cb { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.08); color:#C3CBE0; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .cmain { width:70px; height:70px; border-radius:50%; background:#7B8CFF; color:#0A0D18; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 10px 30px rgba(123,140,255,0.36); }
</style>
</head>
<body>
  <div class="art"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1786644842233-image-1.png" alt=""></div>

  <div class="status-bar">
    <div class="status-time">10:52</div>
    <div class="dynamic-island"></div>
    <div class="status-icons"><i class="fas fa-moon" style="color:#7B8CFF"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full" style="font-size:16px"></i></div>
  </div>

  <div class="content">
    <div class="top">
      <div class="x"><i class="fas fa-chevron-down"></i></div>
      <div class="phase">Now playing</div>
      <div class="x"><i class="fas fa-heart"></i></div>
    </div>

    <div class="title">
      <div class="tt">Rain on glass</div>
      <div class="ts">3 layers · 62 dB peak · running 31 min</div>
    </div>

    <div class="wave">
      <span style="height:22%"></span><span style="height:44%"></span><span class="hot" style="height:70%"></span>
      <span style="height:38%"></span><span class="hot" style="height:88%"></span><span style="height:52%"></span>
      <span style="height:30%"></span><span class="hot" style="height:64%"></span><span style="height:46%"></span>
      <span style="height:80%"></span><span style="height:34%"></span><span class="hot" style="height:58%"></span>
      <span style="height:42%"></span><span style="height:72%"></span><span style="height:28%"></span>
      <span class="hot" style="height:50%"></span><span style="height:66%"></span><span style="height:36%"></span>
      <span style="height:54%"></span><span style="height:24%"></span><span class="hot" style="height:46%"></span>
      <span style="height:62%"></span><span style="height:32%"></span><span style="height:20%"></span>
    </div>

    <div class="sl-h">Layers</div>

    <div class="layer">
      <div class="lrow">
        <div class="lic" style="background:rgba(123,140,255,0.20);color:#9AA8FF"><i class="fas fa-cloud-rain"></i></div>
        <div class="ln">Rain on glass</div>
        <div class="lp">70</div>
      </div>
      <div class="lt"><div class="lf" style="width:70%;background:linear-gradient(90deg,#7B8CFF,#9AA8FF)"></div><div class="lk" style="left:70%"></div></div>
    </div>

    <div class="layer">
      <div class="lrow">
        <div class="lic" style="background:rgba(95,211,155,0.18);color:#5FD39B"><i class="fas fa-fan"></i></div>
        <div class="ln">Old desk fan</div>
        <div class="lp">35</div>
      </div>
      <div class="lt"><div class="lf" style="width:35%;background:linear-gradient(90deg,#3E8C68,#5FD39B)"></div><div class="lk" style="left:35%"></div></div>
    </div>

    <div class="layer">
      <div class="lrow">
        <div class="lic" style="background:rgba(176,140,255,0.18);color:#B08CFF"><i class="fas fa-bolt"></i></div>
        <div class="ln">Far thunder</div>
        <div class="lp">15</div>
      </div>
      <div class="lt"><div class="lf" style="width:15%;background:linear-gradient(90deg,#6C4FA8,#B08CFF)"></div><div class="lk" style="left:15%"></div></div>
    </div>

    <div class="add"><i class="fas fa-plus"></i> Add a layer</div>

    <div class="fade">
      <div class="fh">
        <div class="fic"><i class="fas fa-arrow-down-short-wide"></i></div>
        <div class="fn">Fade when I'm asleep</div>
        <div class="fsw"></div>
      </div>
      <svg class="curve" viewBox="0 0 340 60" preserveAspectRatio="none" style="height:46px;width:100%">
        <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7B8CFF" stop-opacity="0.30"/><stop offset="100%" stop-color="#7B8CFF" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="M0,14 L150,14 C200,14 236,26 262,42 C284,55 310,58 340,58 L340,60 L0,60 Z" fill="url(#fg)"/>
        <path d="M0,14 L150,14 C200,14 236,26 262,42 C284,55 310,58 340,58" fill="none" stroke="#7B8CFF" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="150" y1="6" x2="150" y2="60" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 4"/>
        <circle cx="150" cy="14" r="4" fill="#B08CFF"/>
      </svg>
      <div class="ftx">Breathing steadies, volume drops. Silent by <b>12:20 AM</b> so it does not follow you into deep sleep.</div>
    </div>
  </div>

  <div class="ctrl">
    <div class="cb"><i class="fas fa-hourglass-half"></i></div>
    <div class="cmain"><i class="fas fa-pause"></i></div>
    <div class="cb"><i class="fas fa-shuffle"></i></div>
  </div>
</body>
</html>
