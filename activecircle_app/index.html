<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ActiveCircle - Community Activity Groups</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #1a1a2e; }

  .header {
    text-align: center;
    padding: 60px 40px 40px;
  }
  .app-icon {
    width: 80px; height: 80px; border-radius: 22px;
    background: linear-gradient(135deg, #6C5CE7, #a855f7);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 36px; color: white;
    box-shadow: 0 8px 30px rgba(108,92,231,0.3);
  }
  .app-title { font-size: 42px; font-weight: 900; color: #1a1a2e; letter-spacing: -1px; }
  .app-subtitle { font-size: 18px; color: #8E8E93; margin-top: 8px; font-weight: 400; max-width: 500px; margin-left: auto; margin-right: auto; }

  .screens-section {
    padding: 20px 40px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .screens-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    justify-items: center;
  }

  .phone-frame {
    width: 460px;
    height: 980px;
    background: #000;
    border-radius: 62px;
    padding: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 52px;
    overflow: hidden;
    background: white;
  }
  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .screen-label {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    font-weight: 600;
    color: #8E8E93;
  }

  @media (max-width: 1500px) {
    .screens-grid { grid-template-columns: repeat(3, 1fr); gap: 30px; }
    .phone-frame { width: 380px; height: 810px; }
  }
  @media (max-width: 1200px) {
    .screens-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 800px) {
    .screens-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="app-icon"><i class="fas fa-people-group"></i></div>
    <div class="app-title">ActiveCircle</div>
    <div class="app-subtitle">Connect with your community. Find local activity groups for ping pong, kung fu, tai chi, walking, and more.</div>
  </div>

  <div class="screens-section">
    <div class="screens-grid">
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="home.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Home</div>
      </div>
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="explore.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Explore</div>
      </div>
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="group.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Group Detail</div>
      </div>
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="schedule.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Schedule</div>
      </div>
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="chat.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Messages</div>
      </div>
      <div>
        <div class="phone-frame">
          <div class="phone-screen">
            <iframe src="profile.html" scrolling="no"></iframe>
          </div>
        </div>
        <div class="screen-label">Profile</div>
      </div>
    </div>
  </div>

</body>
</html>
