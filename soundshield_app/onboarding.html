<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundShield - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow-x: hidden; background: #0a0a14; color: #fff; }
        .status-bar { height: 59px; padding: 0 28px; }
        .dynamic-island { width: 120px; height: 34px; background: #000; border-radius: 20px; margin: 0 auto; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .ripple { animation: ripple 2s ease-out infinite; }
        .ripple-2 { animation: ripple 2s ease-out infinite 0.6s; }
        .ripple-3 { animation: ripple 2s ease-out infinite 1.2s; }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar flex items-end justify-between pb-2 relative" style="background: #0a0a14;">
        <div class="dynamic-island"></div>
        <span class="text-sm font-semibold z-10 text-white">9:41</span>
        <div class="flex items-center gap-1.5 z-10 text-white">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Hero -->
    <div class="flex flex-col items-center justify-center px-10" style="min-height: calc(100vh - 59px);">
        <!-- Animated Shield -->
        <div class="relative mb-10 float-anim">
            <div class="absolute inset-0 w-36 h-36 rounded-full bg-orange-500/20 ripple" style="top: 50%; left: 50%; transform: translate(-50%, -50%); margin-top: -72px; margin-left: 0;"></div>
            <div class="absolute inset-0 w-36 h-36 rounded-full bg-orange-500/15 ripple-2" style="top: 50%; left: 50%; transform: translate(-50%, -50%); margin-top: -72px; margin-left: 0;"></div>
            <div class="absolute inset-0 w-36 h-36 rounded-full bg-orange-500/10 ripple-3" style="top: 50%; left: 50%; transform: translate(-50%, -50%); margin-top: -72px; margin-left: 0;"></div>
            <div class="w-36 h-36 rounded-full bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center shadow-2xl shadow-orange-500/30 relative z-10">
                <i class="fas fa-shield-halved text-6xl text-white"></i>
            </div>
        </div>

        <!-- Text -->
        <h1 class="text-4xl font-black text-white mb-3 text-center tracking-tight">SoundShield</h1>
        <p class="text-gray-400 text-center text-base leading-relaxed mb-8 max-w-xs">Your AI-powered sound guardian. Stay safe with real-time audio threat detection.</p>

        <!-- Features -->
        <div class="w-full space-y-3 mb-10">
            <div class="flex items-center gap-4 bg-white/5 rounded-2xl p-4 border border-white/10">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-bolt text-white"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold text-white">Instant Alerts</p>
                    <p class="text-[11px] text-gray-500">Visual & haptic danger warnings</p>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-white/5 rounded-2xl p-4 border border-white/10">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-brain text-white"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold text-white">AI Classification</p>
                    <p class="text-[11px] text-gray-500">Identifies 50+ sound types</p>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-white/5 rounded-2xl p-4 border border-white/10">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500 to-green-600 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-clock text-white"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold text-white">24/7 Monitoring</p>
                    <p class="text-[11px] text-gray-500">Always-on background protection</p>
                </div>
            </div>
        </div>

        <!-- CTA -->
        <button class="w-full bg-gradient-to-r from-orange-500 to-red-500 py-4 rounded-2xl text-white font-bold text-base shadow-lg shadow-orange-500/30">
            Get Started
        </button>
        <p class="text-xs text-gray-600 mt-4">Privacy first · No audio recordings stored</p>
    </div>
</body>
</html>
