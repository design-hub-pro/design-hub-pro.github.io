<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Pair sensor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

</head><body><div class="screen">

<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="content full">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[15px]"></i></div>
    <span class="text-[13px] font-semibold text-gray-400">Step 2 of 3</span>
    <div class="w-10"></div>
  </div>
  <h1 class="mt-6 text-[30px] font-extrabold tracking-tight leading-tight">Clip it under<br>your pad</h1>
  <p class="mt-2 text-[15px] text-gray-500">Then tap 4 times so we can set your timing.</p>
  <div class="relative mt-8 h-[300px] flex items-center justify-center">
    <div class="absolute w-[300px] h-[300px] rounded-full border-2 border-orange-200/70"></div>
    <div class="absolute w-[240px] h-[240px] rounded-full border-2 border-orange-300/70"></div>
    <div class="relative w-[190px] h-[190px] rounded-full" style="background:radial-gradient(circle at 40% 35%,#4a4658,#1d1a28 70%);box-shadow:0 30px 40px -20px rgba(20,15,40,.5)">
      <div class="absolute inset-[18px] rounded-full" style="background:radial-gradient(circle at 45% 40%,#6c6878,#3a3647)"></div>
      <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-[78px] h-[30px] rounded-xl grad-brand flex items-center justify-center gap-1.5 text-white text-[11px] font-bold shadow-lg"><i class="fa-solid fa-wave-square"></i>GC-1</div>
    </div>
    <div class="absolute top-6 right-4 card px-3 py-2 flex items-center gap-2 text-[12px] font-semibold"><span class="dot on"></span>Connected</div>
  </div>
  <div class="card p-5 mt-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl grad-ink flex items-center justify-center text-white"><i class="fa-solid fa-microchip"></i></div>
      <div class="flex-1"><div class="font-bold text-[16px]">GrooveClip GC-1</div><div class="text-[13px] text-gray-400">Bluetooth LE · 92% battery</div></div>
      <i class="fa-solid fa-circle-check text-emerald-500 text-[22px]"></i>
    </div>
    <div class="mt-5 label">Calibration taps</div>
    <div class="mt-3 grid grid-cols-4 gap-3">
      <div class="h-14 rounded-2xl grad-brand flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-check"></i></div>
      <div class="h-14 rounded-2xl grad-brand flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-check"></i></div>
      <div class="h-14 rounded-2xl grad-brand flex items-center justify-center text-white text-[18px]"><i class="fa-solid fa-check"></i></div>
      <div class="h-14 rounded-2xl border-2 border-dashed border-orange-300 flex items-center justify-center text-orange-400 num text-[20px] font-bold">4</div>
    </div>
  </div>
  <div class="mt-6 btn bg-[#16131F] text-white opacity-40">Continue</div>
</div>
<div class="home-ind"></div>

</div></body></html>
