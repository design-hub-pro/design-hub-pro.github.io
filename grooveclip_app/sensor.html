<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Sensor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="app.css">

</head><body><div class="screen">

<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="content">
  <h1 class="mt-2 text-[30px] font-extrabold tracking-tight">My sensor</h1>
  <div class="mt-5 rounded-[28px] grad-ink text-white p-6 relative overflow-hidden">
    <div class="absolute right-[-30px] bottom-[-40px] w-[200px] h-[200px] rounded-full" style="background:radial-gradient(circle at 40% 35%,#4a4658,#1d1a28 70%)"></div>
    <div class="absolute right-[38px] bottom-[52px] w-[70px] h-[26px] rounded-lg grad-brand text-[10px] font-bold flex items-center justify-center gap-1"><i class="fa-solid fa-wave-square"></i>GC-1</div>
    <div class="chip bg-emerald-400/15 text-emerald-300 py-1"><span class="dot on"></span>Connected</div>
    <div class="text-[22px] font-bold mt-3">GrooveClip GC-1</div>
    <div class="text-[13px] text-white/50">Firmware 1.2.0</div>
    <div class="flex gap-6 mt-5">
      <div><div class="num text-[30px] font-bold">78<span class="text-[15px] text-white/50">%</span></div><div class="text-[12px] text-white/50 font-semibold">Battery</div></div>
      <div><div class="num text-[30px] font-bold">11<span class="text-[15px] text-white/50">ms</span></div><div class="text-[12px] text-white/50 font-semibold">Latency fix</div></div>
    </div>
  </div>
  <div class="card p-5 mt-4">
    <div class="flex items-center justify-between"><span class="label">Test tap</span><span class="text-[12px] text-gray-400">Hit your pad</span></div>

  </div>
  <div class="card p-5 mt-4">
    <div class="flex items-center justify-between"><span class="font-bold">Sensitivity</span><span class="num font-bold text-orange-500">6</span></div>
    <div class="relative mt-4 h-2 rounded-full bg-gray-100"><div class="absolute h-2 rounded-full grad-brand" style="width:60%"></div><div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-4 border-orange-500 shadow" style="left:calc(60% - 12px)"></div></div>
    <div class="flex justify-between text-[12px] text-gray-400 mt-2"><span>Soft pads</span><span>Hard pads</span></div>
  </div>
  <div class="card mt-4 divide-y divide-gray-100">
    <div class="flex items-center gap-3 p-4"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white flex items-center justify-center text-[14px]"><i class="fa-solid fa-circle-dot"></i></div><span class="flex-1 font-semibold">Pad type</span><span class="text-gray-400 text-[14px]">12" gum rubber</span><i class="fa-solid fa-chevron-right text-gray-300 text-[12px]"></i></div>

  </div>
</div>
<nav class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i><span>Home</span></div><div class="tab"><i class="fa-solid fa-compact-disc"></i><span>Grooves</span></div><div class="tab"><div class="tab-play"><i class="fa-solid fa-drum"></i></div></div><div class="tab"><i class="fa-solid fa-chart-simple"></i><span>Reports</span></div><div class="tab active"><i class="fa-solid fa-user"></i><span>Me</span></div></nav><div class="home-ind"></div>
