<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Session setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

</head><body><div class="screen">

<div class="absolute inset-x-0 top-0 h-[330px]"><img src="img/funk.jpg" class="w-full h-full object-cover"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,12,22,.35),rgba(246,245,242,1) 98%)"></div></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="content full relative">
  <div class="flex items-center justify-between mt-2 text-white">
    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center"><i class="fa-regular fa-heart"></i></div>
  </div>
  <div class="mt-[92px]"><span class="chip bg-white/90 text-gray-700"><i class="fa-solid fa-headphones text-orange-500"></i>Backing track</span>
  <h1 class="mt-2 text-[32px] font-extrabold tracking-tight">Funky Eight</h1></div>
  <div class="card p-6 mt-4">
    <div class="label text-center">Tempo</div>
    <div class="flex items-center justify-between mt-2">
      <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-[18px]"><i class="fa-solid fa-minus"></i></div>
      <div class="text-center"><div class="num text-[64px] font-bold leading-none">84</div><div class="text-[13px] text-gray-400 font-semibold mt-1">BPM</div></div>
      <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center text-[18px]"><i class="fa-solid fa-plus"></i></div>
    </div>
    <div class="relative mt-5 h-2 rounded-full bg-gray-100"><div class="absolute left-0 top-0 h-2 rounded-full grad-brand" style="width:45%"></div><div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white border-4 border-orange-500 shadow" style="left:calc(45% - 12px)"></div></div>
    <div class="flex justify-between mt-2 text-[12px] text-gray-400 num"><span>60</span><span class="text-orange-500 font-semibold">Your best 92</span><span>140</span></div>
  </div>
  <div class="label mt-6 mb-3">Count</div>
  <div class="grid grid-cols-4 gap-3">
    <div class="h-[76px] rounded-2xl card flex flex-col items-center justify-center"><span class="num text-[20px] font-bold">1/4</span><span class="text-[11px] font-semibold text-gray-400">Quarter</span></div><div class="h-[76px] rounded-2xl grad-ink text-white flex flex-col items-center justify-center"><span class="num text-[20px] font-bold">1/8</span><span class="text-[11px] font-semibold text-white/60">Eighth</span></div><div class="h-[76px] rounded-2xl card flex flex-col items-center justify-center"><span class="num text-[20px] font-bold">1/16</span><span class="text-[11px] font-semibold text-gray-400">16th</span></div><div class="h-[76px] rounded-2xl card flex flex-col items-center justify-center"><span class="num text-[20px] font-bold">3</span><span class="text-[11px] font-semibold text-gray-400">Triplet</span></div>
  </div>
  <div class="card mt-5 divide-y divide-gray-100">
    <div class="flex items-center gap-3 p-4"><i class="fa-solid fa-volume-high w-5 text-gray-400"></i><span class="font-semibold flex-1">Track vs click</span>
      <div class="w-[120px] h-1.5 rounded-full bg-gray-100 relative"><div class="absolute h-full rounded-full bg-[#16131F]" style="width:65%"></div></div></div>
    <div class="flex items-center gap-3 p-4"><i class="fa-solid fa-hourglass-start w-5 text-gray-400"></i><span class="font-semibold flex-1">Count-in</span><span class="text-gray-500 font-medium">1 bar</span></div>
    <div class="flex items-center gap-3 p-4"><i class="fa-solid fa-signal w-5 text-gray-400"></i><span class="font-semibold flex-1">Sensor</span><span class="chip bg-emerald-50 text-emerald-600 py-1"><span class="dot on"></span>Ready</span></div>
  </div>
  <div class="mt-6 btn grad-brand text-white"><i class="fa-solid fa-play"></i>Start · 3:00</div>
</div>
<div class="home-ind"></div>

</div></body></html>
