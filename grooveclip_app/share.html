<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Share report</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

</head><body><div class="screen">

<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="content full">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <span class="font-bold">Share report</span><div class="w-10"></div>
  </div>
  <div class="mt-6 mx-6 card p-5 rotate-[-2deg] relative">
    <div class="flex items-center gap-2"><div class="w-7 h-7 rounded-lg grad-brand text-white text-[12px] flex items-center justify-center"><i class="fa-solid fa-wave-square"></i></div><span class="font-bold text-[13px]">Leo · Week of Nov 9</span></div>
    <div class="grid grid-cols-3 mt-4"><div><div class="num text-[24px] font-bold">142</div><div class="text-[11px] text-gray-400">min</div></div><div><div class="num text-[24px] font-bold">87%</div><div class="text-[11px] text-gray-400">on time</div></div><div><div class="num text-[24px] font-bold">84</div><div class="text-[11px] text-gray-400">top BPM</div></div></div>
    <div class="flex items-end gap-1.5 h-[46px] mt-3"><span class="flex-1 rounded bg-orange-200" style="height:62%"></span><span class="flex-1 rounded bg-orange-200" style="height:43%"></span><span class="flex-1 rounded bg-gray-100" style="height:8%"></span><span class="flex-1 rounded bg-orange-200" style="height:80%"></span><span class="flex-1 rounded bg-orange-200" style="height:51%"></span><span class="flex-1 rounded bg-orange-200" style="height:100%"></span><span class="flex-1 rounded bg-orange-200" style="height:69%"></span></div>
    <div class="mt-3 text-[12px] text-gray-500"><i class="dot late mr-1.5"></i>Work on: late upbeats on beat 4</div>
    <div class="absolute -right-3 -top-3 chip grad-ink text-white text-[11px]"><i class="fa-solid fa-file-pdf"></i>PDF</div>
  </div>
  <div class="label mt-8 mb-3">Send to</div>
  <div class="card divide-y divide-gray-100">
    <div class="flex items-center gap-3 p-4"><img src="img/teacher.jpg" class="w-12 h-12 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Ms. Rivera</div><div class="text-[13px] text-gray-400">Drum teacher</div></div><div class="w-[50px] h-[30px] rounded-full bg-emerald-500 relative"><div class="absolute top-[3px] right-[3px] w-6 h-6 rounded-full bg-white shadow"></div></div></div>
    <div class="flex items-center gap-3 p-4"><img src="img/parent.jpg" class="w-12 h-12 rounded-full object-cover"><div class="flex-1"><div class="font-bold">Mom</div><div class="text-[13px] text-gray-400">Parent</div></div><div class="w-[50px] h-[30px] rounded-full bg-emerald-500 relative"><div class="absolute top-[3px] right-[3px] w-6 h-6 rounded-full bg-white shadow"></div></div></div>
    <div class="flex items-center gap-3 p-4"><div class="w-12 h-12 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400"><i class="fa-solid fa-plus"></i></div><div class="flex-1 font-semibold text-gray-500">Add someone</div></div>
  </div>
  <div class="grid grid-cols-4 gap-3 mt-5">
    <div class="flex flex-col items-center gap-2"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white flex items-center justify-center text-[20px]"><i class="fa-solid fa-link"></i></div><span class="text-[12px] font-semibold text-gray-500">Link</span></div><div class="flex flex-col items-center gap-2"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-500 text-white flex items-center justify-center text-[20px]"><i class="fa-solid fa-envelope"></i></div><span class="text-[12px] font-semibold text-gray-500">Email</span></div><div class="flex flex-col items-center gap-2"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-500 text-white flex items-center justify-center text-[20px]"><i class="fa-solid fa-comment"></i></div><span class="text-[12px] font-semibold text-gray-500">Message</span></div><div class="flex flex-col items-center gap-2"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-gray-700 to-gray-900 text-white flex items-center justify-center text-[20px]"><i class="fa-solid fa-download"></i></div><span class="text-[12px] font-semibold text-gray-500">PDF</span></div>
  </div>
  <div class="card p-4 mt-5 flex items-center gap-3"><i class="fa-solid fa-repeat text-orange-500 w-5"></i><span class="flex-1 font-semibold">Auto-send every Sunday</span><div class="w-[50px] h-[30px] rounded-full bg-emerald-500 relative"><div class="absolute top-[3px] right-[3px] w-6 h-6 rounded-full bg-white shadow"></div></div></div>
  <div class="mt-5 btn grad-brand text-white"><i class="fa-solid fa-paper-plane"></i>Send to 2 people</div>
</div>
<div class="home-ind"></div>

</div></body></html>
