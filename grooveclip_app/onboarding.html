<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

</head><body style="background:#0E0C16"><div class="screen">

<img src="img/hero.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 30%">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(14,12,22,.15) 0%,rgba(14,12,22,.2) 35%,rgba(14,12,22,.92) 62%,#0E0C16 100%)"></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>

<div class="absolute left-0 right-0 bottom-0 px-7 pb-12 text-white">
  <div class="flex items-center gap-2.5 mb-7">
    <div class="w-10 h-10 rounded-xl grad-brand flex items-center justify-center"><i class="fa-solid fa-wave-square text-[17px]"></i></div>
    <span class="text-[19px] font-bold tracking-tight">GrooveClip</span>
  </div>
  <h1 class="text-[40px] leading-[1.05] font-extrabold tracking-tight">Quiet practice.<br>Real feedback.</h1>
  <p class="mt-4 text-[16px] text-white/70 leading-relaxed">Clip the sensor under your pad. See every hit land early, late or right on the beat.</p>
  <div class="mt-7 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 p-4">
    <div class="relative h-12">
      <div class="absolute inset-x-0 top-1/2 h-px bg-white/20"></div>
      <div class="absolute inset-0 flex justify-between px-3"><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div><div class="w-px h-full bg-white/25"></div></div>
      <span class="absolute top-[14px] w-5 h-5 rounded-full on" style="left:10px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full early" style="left:58px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full on" style="left:106px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full late" style="left:168px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full on" style="left:208px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full on" style="left:256px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full early" style="left:296px"></span>
      <span class="absolute top-[14px] w-5 h-5 rounded-full on" style="left:350px"></span>
    </div>
    <div class="flex gap-4 mt-2 text-[12px] text-white/70 font-medium"><span><i class="dot on mr-1.5"></i>On time</span><span><i class="dot early mr-1.5"></i>Early</span><span><i class="dot late mr-1.5"></i>Late</span></div>
  </div>
  <div class="mt-7 btn grad-brand text-white"><i class="fa-solid fa-bluetooth-b"></i>Pair my GrooveClip</div>
  <div class="mt-3 btn bg-white/10 text-white/90 font-semibold">I already have an account</div>
  <div class="flex justify-center gap-1.5 mt-6"><span class="w-6 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span></div>
</div>
<div class="home-ind light"></div>

</div></body></html>
