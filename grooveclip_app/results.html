<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrooveClip · Results</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="app.css">

</head><body><div class="screen">

<div class="dynamic-island"></div>

    <span class="font-bold">Session done</span>
    <div class="w-10 h-10 rounded-full card flex items-center justify-center"><i class="fa-solid fa-arrow-up-from-bracket text-[14px]"></i></div>
  </div>
  <div class="flex flex-col items-center mt-3">
    <div class="relative w-[160px] h-[160px]">

      <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="num text-[46px] font-bold leading-none">86<span class="text-[22px] text-gray-400">%</span></div><div class="text-[13px] font-semibold text-gray-400 mt-1">on time</div></div>
    </div>

  <div class="grid grid-cols-3 gap-3 mt-6">
    <div class="card p-4 text-center"><div class="num text-[28px] font-bold">412</div><div class="text-[12px] text-gray-400 font-semibold">Hits</div></div>
    <div class="card p-4 text-center"><div class="num text-[28px] font-bold">84</div><div class="text-[12px] text-gray-400 font-semibold">BPM</div></div>

  </div>
  <div class="card p-5 mt-4">
    <div class="flex items-center justify-between"><span class="label">Where your hits land</span><span class="text-[12px] text-gray-400 num">ms</span></div>
    <div class="flex items-end gap-1 h-[96px] mt-4"><div class="flex-1 rounded-t-md early" style="height:4.6px;opacity:0.75"></div><div class="flex-1 rounded-t-md early" style="height:9.2px;opacity:0.75"></div><div class="flex-1 rounded-t-md early" style="height:16.099999999999998px;opacity:0.75"></div><div class="flex-1 rounded-t-md early" style="height:27.599999999999998px;opacity:0.75"></div><div class="flex-1 rounded-t-md early" style="height:46.0px;opacity:0.75"></div><div class="flex-1 rounded-t-md on" style="height:69.0px;opacity:1"></div><div class="flex-1 rounded-t-md on" style="height:87.39999999999999px;opacity:1"></div><div class="flex-1 rounded-t-md on" style="height:78.19999999999999px;opacity:1"></div><div class="flex-1 rounded-t-md on" style="height:55.199999999999996px;opacity:1"></div><div class="flex-1 rounded-t-md late" style="height:41.4px;opacity:0.75"></div><div class="flex-1 rounded-t-md late" style="height:29.9px;opacity:0.75"></div><div class="flex-1 rounded-t-md late" style="height:20.7px;opacity:0.75"></div><div class="flex-1 rounded-t-md late" style="height:13.799999999999999px;opacity:0.75"></div><div class="flex-1 rounded-t-md late" style="height:6.8999999999999995px;opacity:0.75"></div></div>

    <div class="flex gap-4 mt-3 text-[12px] font-medium text-gray-500"><span><i class="dot early mr-1"></i><b class="num text-gray-800">9%</b> early</span><span><i class="dot on mr-1"></i><b class="num text-gray-800">71%</b> on</span><span><i class="dot late mr-1"></i><b class="num text-gray-800">20%</b> late</span></div>
  </div>
  <div class="card p-5 mt-4">
    <span class="label">By beat</span>
    <div class="grid grid-cols-4 gap-3 mt-3"><div class="rounded-2xl p-3 text-center bg-gray-50"><div class="text-[12px] font-bold text-gray-400">Beat 1</div><div class="num text-[22px] font-bold ">94</div></div><div class="rounded-2xl p-3 text-center bg-gray-50"><div class="text-[12px] font-bold text-gray-400">Beat 2</div><div class="num text-[22px] font-bold ">88</div></div><div class="rounded-2xl p-3 text-center bg-gray-50"><div class="text-[12px] font-bold text-gray-400">Beat 3</div><div class="num text-[22px] font-bold ">90</div></div><div class="rounded-2xl p-3 text-center bg-amber-50 ring-2 ring-amber-300"><div class="text-[12px] font-bold text-gray-400">Beat 4</div><div class="num text-[22px] font-bold t-late">71</div></div></div>
  </div>
  <div class="mt-5 btn grad-brand text-white"><i class="fa-solid fa-bullseye"></i>Drill beat 4 at 76 BPM</div>
  <div class="mt-3 btn card font-semibold"><i class="fa-solid fa-table-cells text-gray-400"></i>Open bar map</div>

<div class="home-ind"></div>

</div></body></html>
