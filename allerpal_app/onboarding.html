<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;background:#F8F7FC;width:100%;height:100%;margin:0;overflow:hidden}
.screen{width:100%;height:100%;position:relative;overflow:hidden}
.status-bar{height:59px;padding:0 28px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-size:15px;font-weight:600;color:#1A1A2E}
.dynamic-island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.content{height:calc(100% - 59px - 100px);overflow-y:auto;padding:0 28px 20px}
.dots{display:flex;gap:6px}
.dot-step{width:6px;height:6px;border-radius:50%;background:#E2DFF5}
.dot-step.active{width:20px;border-radius:4px;background:#6C5CE7}
.allergen-tile{border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:white;box-shadow:0 4px 14px rgba(108,92,231,0.06);border:2px solid transparent}
.allergen-tile.selected{border-color:#6C5CE7;background:#F5F3FF}
.allergen-tile .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;color:white}
.seg{display:flex;background:#EFEDF9;border-radius:14px;padding:4px}
.seg span{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:12px;font-weight:700;color:#8B889C}
.seg span.active{background:white;color:#6C5CE7;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.fixed-btn{position:absolute;left:28px;right:28px;bottom:28px;background:linear-gradient(135deg,#8B7CFC,#6C5CE7);border-radius:18px;padding:16px;text-align:center;color:white;font-weight:700;font-size:15px;box-shadow:0 10px 24px rgba(108,92,231,0.35)}
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="flex items-center gap-1"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><i class="fas fa-battery-full text-sm"></i></span>
  </div>
  <div class="content">
    <div class="flex items-center justify-between mt-2 mb-5">
      <div class="dots"><div class="dot-step active"></div><div class="dot-step"></div><div class="dot-step"></div></div>
      <span class="text-xs text-gray-400 font-semibold">Skip</span>
    </div>

    <h1 class="text-2xl font-black text-gray-900 leading-snug">What are you<br>managing?</h1>
    <p class="text-xs text-gray-500 mt-2">Select your allergens. You can add more anytime.</p>

    <div class="grid grid-cols-3 gap-3 mt-5">
      <div class="allergen-tile selected"><div class="ic" style="background:linear-gradient(135deg,#FF9A8B,#FF5A5F)"><i class="fas fa-seedling"></i></div><span class="text-[11px] font-bold text-gray-800">Peanuts</span></div>
      <div class="allergen-tile selected"><div class="ic" style="background:linear-gradient(135deg,#FFC978,#FFB020)"><i class="fas fa-tree"></i></div><span class="text-[11px] font-bold text-gray-800">Tree Nuts</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#B3AFC9,#8B889C)"><i class="fas fa-cow"></i></div><span class="text-[11px] font-bold text-gray-800">Milk</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#FFE07A,#FFC935)"><i class="fas fa-egg"></i></div><span class="text-[11px] font-bold text-gray-800">Egg</span></div>
      <div class="allergen-tile selected"><div class="ic" style="background:linear-gradient(135deg,#7CC7FF,#3B9BFF)"><i class="fas fa-shrimp"></i></div><span class="text-[11px] font-bold text-gray-800">Shellfish</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#D8B990,#B98A55)"><i class="fas fa-wheat-awn"></i></div><span class="text-[11px] font-bold text-gray-800">Wheat</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#8FE3B0,#3FBE73)"><i class="fas fa-leaf"></i></div><span class="text-[11px] font-bold text-gray-800">Soy</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#E7D3A6,#C7A25E)"><i class="fas fa-mortar-pestle"></i></div><span class="text-[11px] font-bold text-gray-800">Sesame</span></div>
      <div class="allergen-tile selected"><div class="ic" style="background:linear-gradient(135deg,#8FE0D6,#17C3B2)"><i class="fas fa-wind"></i></div><span class="text-[11px] font-bold text-gray-800">Pollen</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#C9B7FF,#9B7CFC)"><i class="fas fa-cat"></i></div><span class="text-[11px] font-bold text-gray-800">Pet Dander</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#FFB3C6,#FF6F91)"><i class="fas fa-hand-dots"></i></div><span class="text-[11px] font-bold text-gray-800">Latex</span></div>
      <div class="allergen-tile"><div class="ic" style="background:linear-gradient(135deg,#FFD08A,#FF9A3D)"><i class="fas fa-bug"></i></div><span class="text-[11px] font-bold text-gray-800">Insect Sting</span></div>
    </div>

    <div class="mt-6">
      <p class="text-xs font-bold text-gray-700 mb-2">Overall severity</p>
      <div class="seg">
        <span>Mild</span><span class="active">Moderate</span><span>Severe</span>
      </div>
    </div>
  </div>
  <div class="fixed-btn">Continue</div>
</div>
</body>
</html>
