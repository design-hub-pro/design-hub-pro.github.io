<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Gentle nudge</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen" style="background:#1C2723">
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616788-image-1.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% center;filter:blur(3px) saturate(.9);transform:scale(1.06)" alt="">
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,23,20,.35),rgba(14,23,20,.7))"></div>

  <div class="status light">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <!-- banner notification -->
  <div style="position:relative;z-index:3;margin:6px 14px 0;background:rgba(248,250,249,.88);backdrop-filter:blur(24px);border-radius:24px;padding:14px 16px" class="row">
    <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 40px"><i class="fas fa-person"></i></div>
    <div style="margin-left:12px;flex:1">
      <div class="between"><span style="font-size:13.5px;font-weight:800">PosturePal</span><span style="font-size:12px;color:var(--faint);font-weight:600">now</span></div>
      <div style="font-size:13.5px;color:var(--mut);font-weight:600;margin-top:2px">Head's been dipping for a few minutes. Quick reset?</div>
    </div>
  </div>

  <!-- leaning indicator -->
  <div style="position:relative;z-index:3;text-align:center;margin-top:70px;color:#fff">
    <div style="width:150px;height:150px;margin:0 auto;border-radius:50%;background:rgba(239,123,90,.18);display:flex;align-items:center;justify-content:center">
      <div style="width:108px;height:108px;border-radius:50%;background:rgba(239,123,90,.3);display:flex;align-items:center;justify-content:center">
        <svg width="62" height="70" viewBox="0 0 62 70">
          <circle cx="20" cy="14" r="9" fill="#fff"/>
          <path d="M24 26 C34 30 40 40 42 56" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="38" cy="10" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 3"/>
          <path d="M38 22 L40 56" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 3"/>
        </svg>
      </div>
    </div>
    <div class="num" style="font-size:36px;font-weight:900;letter-spacing:-1px;margin-top:18px">4 min</div>
    <div style="font-size:15px;font-weight:600;opacity:.8;margin-top:2px">leaning toward the page</div>
  </div>

  <!-- sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:36px 36px 0 0;padding:12px 28px 34px">
    <div style="width:40px;height:5px;border-radius:3px;background:#DDE3E0;margin:0 auto 18px"></div>
    <div class="h2" style="font-size:21px">Try a 60-second neck release</div>
    <div class="hero" style="height:170px;margin-top:14px;border-radius:22px;box-shadow:none">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616869-image-1.png" style="object-position:center 30%" alt="">
      <div class="scrim" style="opacity:.6"></div>
      <div class="play" style="left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;font-size:17px"><i class="fas fa-play"></i></div>
      <span class="dur">1:00</span>
      <div class="row" style="position:absolute;left:14px;bottom:12px;gap:6px">
        <span class="chip" style="padding:4px 9px;font-size:11.5px;background:rgba(255,255,255,.9)">3 moves</span>
        <span class="chip" style="padding:4px 9px;font-size:11.5px;background:rgba(255,255,255,.9)">Stay seated</span>
      </div>
    </div>
    <div class="btn pri" style="margin-top:16px"><i class="fas fa-play" style="font-size:13px"></i> Stretch now</div>
    <div class="row" style="gap:10px;margin-top:10px">
      <div class="btn sec" style="flex:1;height:50px;font-size:14.5px">Snooze 10 min</div>
      <div class="btn sec" style="flex:1;height:50px;font-size:14.5px">I'm fixed</div>
    </div>
  </div>
</div>
</body>
</html>
