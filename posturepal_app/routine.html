<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Guided routine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.mv{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--bd)}
.mv:last-child{border-bottom:0}
.mv img{width:54px;height:54px;border-radius:15px;object-fit:cover}
</style>
</head>
<body>
<div class="screen" style="background:#fff">
  <!-- video -->
  <div style="position:absolute;top:0;left:0;right:0;height:540px">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306617137-image-1.png" style="width:100%;height:100%;object-fit:cover;object-position:center 30%" alt="">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,20,16,.45),rgba(10,20,16,0) 28%,rgba(10,20,16,0) 55%,rgba(10,20,16,.85))"></div>
  </div>

  <div class="status light">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div style="position:relative;z-index:3;padding:6px 28px 0;color:#fff" class="between">
    <div style="width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center"><i class="fas fa-chevron-down"></i></div>
    <!-- step progress -->
    <div class="row" style="gap:5px">
      <span style="width:30px;height:4px;border-radius:2px;background:#fff"></span>
      <span style="width:30px;height:4px;border-radius:2px;background:linear-gradient(90deg,#fff 55%,rgba(255,255,255,.35) 55%)"></span>
      <span style="width:30px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)"></span>
      <span style="width:30px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)"></span>
    </div>
    <div style="width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center"><i class="fas fa-volume-high"></i></div>
  </div>

  <!-- camera check pip -->
  <div style="position:absolute;z-index:3;top:128px;right:22px;width:92px;height:122px;border-radius:20px;overflow:hidden;border:2.5px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.3)">
    <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616849-image-1.png" style="width:100%;height:100%;object-fit:cover;object-position:63% 25%" alt="">
    <div style="position:absolute;left:6px;right:6px;bottom:6px;background:rgba(47,122,100,.92);color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:4px 0;text-align:center"><i class="fas fa-check" style="margin-right:3px"></i>Form good</div>
  </div>

  <div style="position:absolute;z-index:3;left:28px;right:28px;top:404px;color:#fff" class="between">
    <div>
      <div style="font-size:12px;font-weight:800;letter-spacing:1.4px;opacity:.8">MOVE 2 OF 4</div>
      <div style="font-size:27px;font-weight:800;letter-spacing:-.6px;margin-top:3px">Chest opener</div>
      <div style="font-size:14px;opacity:.85;font-weight:600;margin-top:3px">Clasp hands, squeeze shoulder blades</div>
    </div>
    <div style="position:relative;width:86px;height:86px;flex:0 0 86px">
      <svg width="86" height="86"><circle cx="43" cy="43" r="37" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.28)" stroke-width="6"/><circle cx="43" cy="43" r="37" fill="none" stroke="#7FE0B8" stroke-width="6" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="105" transform="rotate(-90 43 43)"/></svg>
      <div class="num" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900">17</div>
    </div>
  </div>

  <!-- up next -->
  <div style="position:absolute;left:0;right:0;top:540px;bottom:0;padding:20px 28px 0;background:#fff">
    <div class="row" style="justify-content:center;gap:22px;margin-bottom:16px">
      <div style="width:52px;height:52px;border-radius:18px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-backward-step"></i></div>
      <div style="width:70px;height:70px;border-radius:24px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 12px 24px rgba(47,122,100,.35)"><i class="fas fa-pause"></i></div>
      <div style="width:52px;height:52px;border-radius:18px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-forward-step"></i></div>
    </div>
    <div class="meta">Up next</div>
    <div class="mv"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616424-image-1.png" alt=""><div style="flex:1"><div style="font-size:15px;font-weight:800">Seated twist</div><div style="font-size:12.5px;color:var(--faint);font-weight:600;margin-top:2px">Each side</div></div><span class="num" style="font-size:14px;font-weight:800;color:var(--mut)">0:40</span></div>
    <div class="mv"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616455-image-1.png" alt=""><div style="flex:1"><div style="font-size:15px;font-weight:800">Wrist rolls</div><div style="font-size:12.5px;color:var(--faint);font-weight:600;margin-top:2px">Both hands</div></div><span class="num" style="font-size:14px;font-weight:800;color:var(--mut)">0:20</span></div>
  </div>
</div>
</body>
</html>
