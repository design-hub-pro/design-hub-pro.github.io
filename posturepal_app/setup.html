<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Calibrate</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.cam{position:absolute;inset:0;width:100%;height:100%}
.glass{background:rgba(20,32,28,.55);backdrop-filter:blur(14px);color:#fff;border:1px solid rgba(255,255,255,.14)}
.step{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:14.5px;font-weight:700}
.step .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px}
</style>
</head>
<body>
<div class="screen" style="background:#0E1714">
  <!-- live front-camera feed with landmark overlay -->
  <svg class="cam" viewBox="196 30 236 470" preserveAspectRatio="xMidYMid slice">
    <image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616849-image-1.png" x="0" y="0" width="500" height="500"/>
    <rect x="0" y="0" width="500" height="500" fill="rgba(10,20,16,.28)"/>
    <!-- target guide -->
    <rect x="236" y="70" width="160" height="200" rx="26" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.4" stroke-dasharray="5 4"/>
    <!-- skeleton -->
    <g stroke="#7FE0B8" stroke-width="2.2" stroke-linecap="round" fill="none">
      <line x1="316" y1="196" x2="316" y2="218"/>
      <line x1="262" y1="226" x2="372" y2="226"/>
      <line x1="262" y1="226" x2="228" y2="282"/>
      <line x1="372" y1="226" x2="404" y2="276"/>
      <line x1="290" y1="160" x2="345" y2="160" stroke-opacity=".6"/>
    </g>
    <g fill="#fff" stroke="#2F7A64" stroke-width="1.6">
      <circle cx="316" cy="166" r="3.6"/><circle cx="301" cy="155" r="3"/><circle cx="331" cy="155" r="3"/>
      <circle cx="290" cy="160" r="3"/><circle cx="345" cy="160" r="3"/>
      <circle cx="316" cy="218" r="3.6"/><circle cx="262" cy="226" r="4.2"/><circle cx="372" cy="226" r="4.2"/>
      <circle cx="228" cy="282" r="3.6"/><circle cx="404" cy="276" r="3.6"/>
    </g>
  </svg>

  <div class="status light">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div style="position:relative;z-index:3;padding:6px 28px 0" class="between">
    <div class="glass" style="width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center"><i class="fas fa-xmark"></i></div>
    <div class="glass chip" style="background:rgba(20,32,28,.55);color:#fff"><i class="fas fa-lock" style="font-size:11px"></i> Processed on this phone</div>
    <div class="glass" style="width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center"><i class="fas fa-camera-rotate"></i></div>
  </div>

  <div style="position:relative;z-index:3;text-align:center;margin-top:20px;color:#fff">
    <div style="font-size:12px;font-weight:800;letter-spacing:1.6px;opacity:.8">STEP 2 OF 3</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px">Sit tall. Hold still.</div>
  </div>

  <!-- bottom sheet -->
  <div style="position:absolute;left:14px;right:14px;bottom:14px;z-index:4;background:#fff;border-radius:34px;padding:22px 24px 24px">
    <div class="row" style="gap:16px">
      <div style="position:relative;width:64px;height:64px;flex:0 0 64px">
        <svg width="64" height="64"><circle cx="32" cy="32" r="27" fill="none" stroke="#E7ECE9" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="#2F7A64" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="56" transform="rotate(-90 32 32)"/></svg>
        <div class="num" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900">2</div>
      </div>
      <div>
        <div style="font-size:18px;font-weight:800">Saving your baseline</div>
        <div style="font-size:13px;color:var(--mut);font-weight:600;margin-top:3px">This is what upright looks like for you.</div>
      </div>
    </div>
    <div style="margin-top:14px;border-top:1px solid var(--bd);padding-top:4px">
      <div class="step"><span class="ic" style="background:var(--mint);color:var(--acc)"><i class="fas fa-check"></i></span>Phone at eye level, arm's length</div>
      <div class="step"><span class="ic" style="background:var(--mint);color:var(--acc)"><i class="fas fa-check"></i></span>Head and both shoulders in frame</div>
      <div class="step"><span class="ic" style="background:#FFF4DE;color:#B7791F"><i class="fas fa-sun"></i></span>Light is a little low<span style="margin-left:auto;font-size:12px;color:#B7791F;font-weight:800">OK</span></div>
    </div>
    <div class="row" style="gap:10px;margin-top:14px">
      <div style="flex:1;height:5px;border-radius:3px;background:var(--acc)"></div>
      <div style="flex:1;height:5px;border-radius:3px;background:var(--acc)"></div>
      <div style="flex:1;height:5px;border-radius:3px;background:#E7ECE9"></div>
    </div>
  </div>
</div>
</body>
</html>
