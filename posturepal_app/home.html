<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Today</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <div class="between" style="margin:4px 0 18px">
      <div>
        <div class="meta">Tuesday, Oct 6</div>
        <div class="h1" style="margin-top:4px">Hi, Maya</div>
      </div>
      <div class="row" style="gap:10px">
        <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="far fa-bell"></i></div>
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616577-image-1.png" style="width:42px;height:42px;border-radius:50%;object-fit:cover" alt="">
      </div>
    </div>

    <!-- score ring card -->
    <div class="card" style="padding:22px;display:flex;align-items:center;gap:22px">
      <div style="position:relative;width:132px;height:132px;flex:0 0 132px">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="#E7ECE9" stroke-width="13"/>
          <circle cx="66" cy="66" r="56" fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="63" transform="rotate(-90 66 66)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FB08D"/><stop offset="1" stop-color="#2F7A64"/></linearGradient></defs>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span class="num" style="font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1">82</span>
          <span style="font-size:11px;font-weight:700;color:var(--faint);margin-top:4px">POSTURE</span>
        </div>
      </div>
      <div style="flex:1">
        <div class="chip" style="background:var(--mint);border-color:transparent;color:var(--acc);padding:5px 10px"><i class="fas fa-arrow-trend-up" style="font-size:11px"></i> +6 vs last week</div>
        <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><div class="num" style="font-size:24px;font-weight:800">2h 40m</div><div style="font-size:12px;color:var(--faint);font-weight:600">studied</div></div>
          <div><div class="num" style="font-size:24px;font-weight:800">3</div><div style="font-size:12px;color:var(--faint);font-weight:600">stretches</div></div>
        </div>
      </div>
    </div>

    <!-- start session hero -->
    <div class="hero" style="height:236px;margin-top:16px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306617749-image-1.png" alt="">
      <div class="scrim"></div>
      <div style="position:absolute;top:16px;left:16px" class="chip"><span class="dot" style="background:var(--acc2)"></span> Camera ready</div>
      <div style="position:absolute;left:20px;right:20px;bottom:18px;color:#fff">
        <div style="font-size:23px;font-weight:800;letter-spacing:-.5px">Start a study session</div>
        <div class="between" style="margin-top:12px">
          <div style="font-size:13px;opacity:.85;font-weight:600"><i class="fas fa-clock" style="margin-right:6px"></i>50 min · stretch at 25</div>
          <div style="width:48px;height:48px;border-radius:16px;background:#fff;color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:16px"><i class="fas fa-play"></i></div>
        </div>
      </div>
    </div>

    <!-- today timeline -->
    <div class="between" style="margin:24px 0 12px"><span class="h2">Today</span><span style="font-size:13px;font-weight:700;color:var(--acc)">Details</span></div>
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;gap:3px;height:46px;align-items:flex-end">
        <!-- each bar = 5 min -->
        <span style="flex:1;height:80%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:85%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:78%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:60%;background:var(--amb);border-radius:3px"></span><span style="flex:1;height:45%;background:var(--coral);border-radius:3px"></span><span style="flex:1;height:88%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:90%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:84%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:20%;background:#E7ECE9;border-radius:3px"></span><span style="flex:1;height:20%;background:#E7ECE9;border-radius:3px"></span><span style="flex:1;height:82%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:76%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:62%;background:var(--amb);border-radius:3px"></span><span style="flex:1;height:58%;background:var(--amb);border-radius:3px"></span><span style="flex:1;height:86%;background:var(--acc2);border-radius:3px"></span><span style="flex:1;height:89%;background:var(--acc2);border-radius:3px"></span>
      </div>
      <div class="between" style="margin-top:10px;font-size:11.5px;color:var(--faint);font-weight:600">
        <span>3:30 pm</span>
        <span class="row" style="gap:12px"><span><span class="dot" style="background:var(--acc2);margin-right:4px"></span>Upright</span><span><span class="dot" style="background:var(--amb);margin-right:4px"></span>Leaning</span><span><span class="dot" style="background:var(--coral);margin-right:4px"></span>Slumped</span></span>
        <span>5:00 pm</span>
      </div>
    </div>

    <!-- quick stretches -->
    <div class="between" style="margin:24px 0 12px"><span class="h2">Quick resets</span><span style="font-size:13px;font-weight:700;color:var(--acc)">All</span></div>
    <div class="scroller">
      <div style="flex:0 0 200px">
        <div class="hero" style="height:132px;border-radius:20px;box-shadow:none">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616869-image-1.png" alt="">
          <div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div>
          <span class="dur">1:00</span>
        </div>
        <div style="font-size:14px;font-weight:800;margin-top:9px">Neck release</div>
      </div>
      <div style="flex:0 0 200px">
        <div class="hero" style="height:132px;border-radius:20px;box-shadow:none">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306617137-image-1.png" alt="">
          <div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div>
          <span class="dur">1:30</span>
        </div>
        <div style="font-size:14px;font-weight:800;margin-top:9px">Chest opener</div>
      </div>
      <div style="flex:0 0 200px">
        <div class="hero" style="height:132px;border-radius:20px;box-shadow:none">
          <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616424-image-1.png" alt="">
          <div class="play" style="left:12px;bottom:12px;width:36px;height:36px;font-size:12px"><i class="fas fa-play"></i></div>
          <span class="dur">2:00</span>
        </div>
        <div style="font-size:14px;font-weight:800;margin-top:9px">Seated twist</div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><i class="fas fa-house"></i>Today</div>
    <div class="tab"><i class="fas fa-person-walking"></i>Stretch</div>
    <div class="tab cam"><i class="fas fa-video"></i>Session</div>
    <div class="tab"><i class="fas fa-chart-simple"></i>Insights</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
