<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Me</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.set{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--bd)}
.set:last-child{border-bottom:0}
.set .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:0 0 36px}
.set b{flex:1;font-size:14.5px;font-weight:700}
.set em{font-style:normal;font-size:13px;color:var(--faint);font-weight:700}
.tg{width:48px;height:29px;border-radius:15px;background:var(--acc2);position:relative}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.off{background:#DDE3E0}.tg.off::after{right:auto;left:3px}
.mode{flex:1;border-radius:18px;padding:14px 10px;text-align:center;border:1.5px solid var(--bd);background:#fff}
.mode i{font-size:20px;color:var(--mut)}
.mode div{font-size:12.5px;font-weight:800;margin-top:8px}
.mode.on{border-color:var(--acc);background:#F1FAF6}
.mode.on i{color:var(--acc)}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <!-- profile -->
    <div class="row" style="gap:16px;margin:6px 0 18px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616577-image-1.png" style="width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc2)" alt="">
      <div style="flex:1">
        <div style="font-size:22px;font-weight:800;letter-spacing:-.4px">Maya Chen</div>
        <div style="font-size:13px;color:var(--faint);font-weight:600;margin-top:2px">Grade 11 · baseline set Sep 14</div>
      </div>
      <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-rotate"></i></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800">38</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">sessions</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800">112</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">stretches</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800;color:var(--acc)">9</div><div style="font-size:11.5px;color:var(--faint);font-weight:700">day streak</div></div>
    </div>

    <!-- nudge style -->
    <div class="h2" style="margin:24px 0 12px">How I get nudged</div>
    <div class="row" style="gap:10px">
      <div class="mode on"><i class="fas fa-mobile-screen-button"></i><div>Soft buzz</div></div>
      <div class="mode"><i class="fas fa-circle-half-stroke"></i><div>Screen dim</div></div>
      <div class="mode"><i class="fas fa-volume-low"></i><div>Chime</div></div>
    </div>
    <div class="card" style="padding:16px 18px;margin-top:12px">
      <div class="between"><span style="font-size:14px;font-weight:800">Wait before nudging</span><span class="num" style="font-size:14px;font-weight:800;color:var(--acc)">3 min</span></div>
      <div style="position:relative;height:6px;border-radius:3px;background:#E7ECE9;margin-top:16px">
        <div style="position:absolute;left:0;top:0;bottom:0;width:30%;border-radius:3px;background:var(--acc)"></div>
        <div style="position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)"></div>
      </div>
      <div class="between" style="font-size:11px;color:var(--faint);font-weight:700;margin-top:10px"><span>1 min</span><span>10 min</span></div>
    </div>

    <!-- settings -->
    <div class="card" style="padding:2px 18px;margin-top:14px">
      <div class="set"><span class="ic" style="background:linear-gradient(135deg,#4FB08D,#2F7A64)"><i class="fas fa-lock"></i></span><b>Video never leaves phone</b><span class="tg"></span></div>
      <div class="set"><span class="ic" style="background:linear-gradient(135deg,#6EA8F0,#3A72C9)"><i class="fas fa-clock"></i></span><b>Stretch break every</b><em>25 min</em></div>
      <div class="set"><span class="ic" style="background:linear-gradient(135deg,#A99BF2,#7461DA)"><i class="fas fa-moon"></i></span><b>Quiet during tests</b><span class="tg off"></span></div>
      <div class="set"><span class="ic" style="background:linear-gradient(135deg,#F59B7A,#E0623F)"><i class="fas fa-user-group"></i></span><b>Share streak with crew</b><span class="tg"></span></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-house"></i>Today</div>
    <div class="tab"><i class="fas fa-person-walking"></i>Stretch</div>
    <div class="tab cam"><i class="fas fa-video"></i>Session</div>
    <div class="tab"><i class="fas fa-chart-simple"></i>Insights</div>
    <div class="tab on"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
