<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Stretch library</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.vrow{display:flex;align-items:center;gap:14px;padding:10px 0}
.vthumb{position:relative;width:118px;height:80px;border-radius:16px;overflow:hidden;flex:0 0 118px}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb .dur{right:6px;bottom:6px;font-size:10.5px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <div class="between" style="margin:4px 0 16px">
      <div class="h1">Stretch</div>
      <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-magnifying-glass"></i></div>
    </div>

    <!-- for you hero -->
    <div class="hero" style="height:250px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616424-image-1.png" alt="">
      <div class="scrim"></div>
      <div class="chip" style="position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92)"><i class="fas fa-wand-magic-sparkles" style="font-size:11px;color:var(--acc)"></i> Picked for your neck</div>
      <div class="play" style="top:16px;right:16px"><i class="fas fa-play"></i></div>
      <div style="position:absolute;left:20px;right:20px;bottom:18px;color:#fff">
        <div style="font-size:24px;font-weight:800;letter-spacing:-.5px">Desk reset</div>
        <div class="row" style="gap:14px;margin-top:8px;font-size:13px;font-weight:600;opacity:.9">
          <span><i class="fas fa-clock" style="margin-right:5px"></i>3 min</span>
          <span><i class="fas fa-chair" style="margin-right:5px"></i>Seated</span>
          <span><i class="fas fa-layer-group" style="margin-right:5px"></i>4 moves</span>
        </div>
      </div>
    </div>

    <!-- body area tiles -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px">
      <div class="gtile" style="background:linear-gradient(135deg,#4FB08D,#2F7A64)"><i class="fas fa-head-side"></i><b>Neck</b><small>8</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#6EA8F0,#3A72C9)"><i class="fas fa-child-reaching"></i><b>Shoulders</b><small>11</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#F59B7A,#E0623F)"><i class="fas fa-person-praying"></i><b>Back</b><small>9</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#A99BF2,#7461DA)"><i class="fas fa-eye"></i><b>Eyes</b><small>5</small></div>
    </div>

    <div class="between" style="margin:24px 0 4px"><span class="h2">Under 2 minutes</span><span style="font-size:13px;font-weight:700;color:var(--acc)">See all</span></div>
    <div class="vrow">
      <div class="vthumb"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616869-image-1.png" alt=""><span class="dur">1:00</span></div>
      <div style="flex:1"><div style="font-size:15.5px;font-weight:800">Neck release</div>
        <div class="row" style="gap:8px;margin-top:6px"><span class="dot" style="background:var(--acc2)"></span><span style="font-size:12.5px;color:var(--faint);font-weight:600">Done 12 times</span></div>
        <div class="bar" style="margin-top:8px;height:5px"><span style="width:100%"></span></div></div>
    </div>
    <div class="vrow">
      <div class="vthumb"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306617137-image-1.png" alt=""><span class="dur">1:30</span></div>
      <div style="flex:1"><div style="font-size:15.5px;font-weight:800">Chest opener</div>
        <div class="row" style="gap:8px;margin-top:6px"><span class="dot" style="background:var(--amb)"></span><span style="font-size:12.5px;color:var(--faint);font-weight:600">Halfway</span></div>
        <div class="bar" style="margin-top:8px;height:5px"><span style="width:50%"></span></div></div>
    </div>
    <div class="vrow">
      <div class="vthumb"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616455-image-1.png" alt=""><span class="dur">0:45</span></div>
      <div style="flex:1"><div style="font-size:15.5px;font-weight:800">Wrist and finger reset</div>
        <div class="row" style="gap:8px;margin-top:6px"><span class="dot" style="background:#C9D1CD"></span><span style="font-size:12.5px;color:var(--faint);font-weight:600">New</span></div>
        <div class="bar" style="margin-top:8px;height:5px"><span style="width:0"></span></div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-house"></i>Today</div>
    <div class="tab on"><i class="fas fa-person-walking"></i>Stretch</div>
    <div class="tab cam"><i class="fas fa-video"></i>Session</div>
    <div class="tab"><i class="fas fa-chart-simple"></i>Insights</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
