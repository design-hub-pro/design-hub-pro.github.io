<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Insights</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.col .b{width:100%;max-width:30px;border-radius:9px;background:linear-gradient(180deg,#4FB08D,#2F7A64)}
.col span{font-size:11px;font-weight:700;color:var(--faint)}
.hm{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.hm i{display:block;height:22px;border-radius:6px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <div class="between" style="margin:4px 0 14px">
      <div class="h1">Insights</div>
      <div class="row" style="background:#fff;border:1px solid var(--bd);border-radius:12px;padding:3px;font-size:12.5px;font-weight:700">
        <span style="padding:6px 12px;border-radius:9px;background:var(--ink);color:#fff">Week</span>
        <span style="padding:6px 12px;color:var(--faint)">Month</span>
      </div>
    </div>

    <!-- weekly score -->
    <div class="card" style="padding:20px">
      <div class="between">
        <div>
          <div class="meta">Avg posture</div>
          <div class="row" style="gap:10px;margin-top:4px"><span class="num" style="font-size:36px;font-weight:900;letter-spacing:-1.2px">81</span><span class="chip" style="background:var(--mint);border-color:transparent;color:var(--acc);padding:4px 9px"><i class="fas fa-arrow-up" style="font-size:10px"></i>6</span></div>
        </div>
        <div style="text-align:right">
          <div class="meta">Study time</div>
          <div class="num" style="font-size:24px;font-weight:800;margin-top:6px">14h 20m</div>
        </div>
      </div>
      <div class="row" style="align-items:flex-end;gap:8px;height:130px;margin-top:16px">
        <div class="col"><div class="b" style="height:62px;opacity:.55"></div><span>M</span></div>
        <div class="col"><div class="b" style="height:74px;opacity:.55"></div><span>T</span></div>
        <div class="col"><div class="b" style="height:58px;background:linear-gradient(180deg,#F5C76A,#F2B13C)"></div><span>W</span></div>
        <div class="col"><div class="b" style="height:84px;opacity:.55"></div><span>T</span></div>
        <div class="col"><div class="b" style="height:90px;opacity:.55"></div><span>F</span></div>
        <div class="col"><div class="b" style="height:70px;opacity:.55"></div><span>S</span></div>
        <div class="col"><div class="b" style="height:104px"></div><span style="color:var(--acc)">T</span></div>
      </div>
    </div>

    <!-- when you slump heatmap -->
    <div class="card" style="padding:18px 20px;margin-top:14px">
      <div class="between"><span style="font-size:15px;font-weight:800">When you slump</span><span style="font-size:12px;color:var(--faint);font-weight:700">3 pm to 11 pm</span></div>
      <div class="hm" style="margin-top:14px">
        <i style="background:#DDF1E8"></i><i style="background:#DDF1E8"></i><i style="background:#FBE3C2"></i><i style="background:#FBE3C2"></i><i style="background:#DDF1E8"></i><i style="background:#F7C4B2"></i><i style="background:#EF7B5A"></i><i style="background:#EF7B5A"></i>
        <i style="background:#DDF1E8"></i><i style="background:#DDF1E8"></i><i style="background:#DDF1E8"></i><i style="background:#FBE3C2"></i><i style="background:#DDF1E8"></i><i style="background:#FBE3C2"></i><i style="background:#F7C4B2"></i><i style="background:#EF7B5A"></i>
        <i style="background:#DDF1E8"></i><i style="background:#FBE3C2"></i><i style="background:#DDF1E8"></i><i style="background:#DDF1E8"></i><i style="background:#FBE3C2"></i><i style="background:#F7C4B2"></i><i style="background:#F7C4B2"></i><i style="background:#EF7B5A"></i>
      </div>
      <div class="row" style="gap:10px;margin-top:14px;padding:11px 13px;background:#FDF1EC;border-radius:14px">
        <i class="fas fa-moon" style="color:var(--coral)"></i>
        <span style="font-size:13px;font-weight:700;color:#9A4A33">Most slumps after 9 pm. Earlier stretch?</span>
      </div>
    </div>

    <!-- issue breakdown -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div class="gtile" style="background:linear-gradient(135deg,#F59B7A,#E0623F);padding:16px"><i class="fas fa-head-side"></i><div class="num" style="font-size:28px;font-weight:900;margin-top:14px">62%</div><small>of slumps: head forward</small></div>
      <div class="gtile" style="background:linear-gradient(135deg,#4FB08D,#2F7A64);padding:16px"><i class="fas fa-fire"></i><div class="num" style="font-size:28px;font-weight:900;margin-top:14px">9 days</div><small>stretch streak</small></div>
    </div>

    <!-- friends -->
    <div class="card between" style="padding:14px 16px;margin-top:14px">
      <div class="row" style="gap:12px">
        <div class="avs"><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306617571-image-1.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306618203-image-1.png" alt=""><img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616577-image-1.png" alt=""></div>
        <span style="font-size:14px;font-weight:800">Study crew streaks</span>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--faint);font-size:13px"></i>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><i class="fas fa-house"></i>Today</div>
    <div class="tab"><i class="fas fa-person-walking"></i>Stretch</div>
    <div class="tab cam"><i class="fas fa-video"></i>Session</div>
    <div class="tab on"><i class="fas fa-chart-simple"></i>Insights</div>
    <div class="tab"><i class="fas fa-user"></i>Me</div>
  </div>
</div>
</body>
</html>
