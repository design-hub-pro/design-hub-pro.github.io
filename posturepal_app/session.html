<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Live session</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.met{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:14px 15px}
.met .k{font-size:12px;font-weight:700;color:var(--faint);display:flex;align-items:center;gap:7px}
.met .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.met .v small{font-size:13px;color:var(--faint);font-weight:700;margin-left:2px}
.gauge{height:6px;border-radius:3px;background:#EEF2EF;margin-top:10px;position:relative}
.gauge i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ctl{width:62px;height:62px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content" style="padding-bottom:40px">
    <div class="between" style="margin:2px 0 14px">
      <div>
        <div class="meta" style="color:var(--acc)"><span class="dot" style="background:var(--coral);margin-right:6px;width:7px;height:7px"></span>Live · Chemistry</div>
        <div class="num" style="font-size:34px;font-weight:900;letter-spacing:-1.2px;margin-top:2px">18:42 <span style="font-size:17px;color:var(--faint);font-weight:700">/ 50:00</span></div>
      </div>
      <div class="chip"><i class="fas fa-lock" style="font-size:11px;color:var(--acc)"></i> On-device</div>
    </div>

    <!-- camera preview -->
    <div style="position:relative;height:388px;border-radius:30px;overflow:hidden;box-shadow:0 14px 32px rgba(20,32,28,.18)">
      <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="186 60 260 300" preserveAspectRatio="xMidYMid slice">
        <image href="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616849-image-1.png" x="0" y="0" width="500" height="500"/>
        <rect width="500" height="500" fill="rgba(10,20,16,.22)"/>
        <g stroke="#7FE0B8" stroke-width="2" stroke-linecap="round" fill="none">
          <line x1="316" y1="196" x2="316" y2="218"/><line x1="262" y1="226" x2="372" y2="226"/>
          <line x1="262" y1="226" x2="228" y2="282"/><line x1="372" y1="226" x2="404" y2="276"/>
        </g>
        <!-- baseline ghost -->
        <line x1="258" y1="219" x2="376" y2="219" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 3"/>
        <g fill="#fff" stroke="#2F7A64" stroke-width="1.5">
          <circle cx="316" cy="166" r="3.2"/><circle cx="290" cy="160" r="2.8"/><circle cx="345" cy="160" r="2.8"/>
          <circle cx="316" cy="218" r="3.2"/><circle cx="262" cy="226" r="3.8"/><circle cx="372" cy="226" r="3.8"/>
          <circle cx="228" cy="282" r="3.2"/><circle cx="404" cy="276" r="3.2"/>
        </g>
      </svg>
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(10,20,16,.82),rgba(10,20,16,0) 50%)"></div>
      <div class="chip" style="position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9)"><i class="fas fa-eye-slash" style="font-size:11px"></i> Hide preview</div>
      <div style="position:absolute;left:20px;bottom:18px;right:20px;color:#fff" class="between">
        <div>
          <div style="font-size:12px;font-weight:800;letter-spacing:1.4px;opacity:.8">POSTURE NOW</div>
          <div class="row" style="gap:10px;margin-top:2px">
            <span class="num" style="font-size:56px;font-weight:900;letter-spacing:-2.5px;line-height:1">88</span>
            <span class="chip" style="background:rgba(79,176,141,.25);border-color:rgba(127,224,184,.4);color:#BFF2DC;padding:5px 10px"><span class="dot" style="background:#7FE0B8"></span>Upright</span>
          </div>
        </div>
        <!-- mini sparkline -->
        <svg width="112" height="44" viewBox="0 0 112 44"><polyline points="0,14 12,12 24,16 36,22 48,30 60,26 72,12 84,10 96,9 112,8" fill="none" stroke="#7FE0B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="8" r="3.5" fill="#fff"/></svg>
      </div>
    </div>

    <!-- metrics -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
      <div class="met"><div class="k"><span class="dot" style="background:var(--acc2)"></span>Neck drop</div><div class="v num">4<small>%</small></div><div class="gauge"><i style="left:12%;background:var(--acc2)"></i></div></div>
      <div class="met"><div class="k"><span class="dot" style="background:var(--acc2)"></span>Shoulder tilt</div><div class="v num">2°</div><div class="gauge"><i style="left:8%;background:var(--acc2)"></i></div></div>
      <div class="met"><div class="k"><span class="dot" style="background:var(--amb)"></span>Screen distance</div><div class="v num">41<small>cm</small></div><div class="gauge"><i style="left:58%;background:var(--amb)"></i></div></div>
      <div class="met"><div class="k"><span class="dot" style="background:var(--acc2)"></span>Head tilt</div><div class="v num">3°</div><div class="gauge"><i style="left:10%;background:var(--acc2)"></i></div></div>
    </div>

    <!-- next stretch -->
    <div class="card row" style="gap:13px;padding:12px 14px;margin-top:14px">
      <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1791306616869-image-1.png" style="width:48px;height:48px;border-radius:14px;object-fit:cover" alt="">
      <div style="flex:1">
        <div style="font-size:14.5px;font-weight:800">Stretch break in 6:18</div>
        <div class="bar" style="margin-top:8px"><span style="width:75%"></span></div>
      </div>
    </div>

    <!-- controls -->
    <div class="row" style="justify-content:center;gap:18px;margin-top:20px">
      <div class="ctl" style="background:#fff;border:1px solid var(--bd);color:var(--mut)"><i class="fas fa-bell-slash"></i></div>
      <div class="ctl" style="width:78px;height:78px;border-radius:28px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-size:24px;box-shadow:0 12px 24px rgba(47,122,100,.35)"><i class="fas fa-pause"></i></div>
      <div class="ctl" style="background:#FDECE6;color:var(--coral)"><i class="fas fa-stop"></i></div>
    </div>
  </div>
</div>
</body>
</html>
