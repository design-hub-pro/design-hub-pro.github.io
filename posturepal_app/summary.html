<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosturePal · Session summary</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="app.css">
<style>
.ev{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ev:last-child{border-bottom:0}
.ev .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:0 0 40px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content" style="padding-bottom:30px">
    <div class="between" style="margin:2px 0 14px">
      <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-xmark"></i></div>
      <span style="font-size:15px;font-weight:800">Session complete</span>
      <div style="width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)"><i class="fas fa-arrow-up-from-bracket"></i></div>
    </div>

    <!-- big score -->
    <div style="text-align:center;padding:8px 0 4px">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-size:28px;box-shadow:0 14px 28px rgba(47,122,100,.3)"><i class="fas fa-medal"></i></div>
      <div class="num" style="font-size:72px;font-weight:900;letter-spacing:-3.5px;line-height:1;margin-top:14px">84</div>
      <div style="font-size:14px;font-weight:700;color:var(--mut);margin-top:4px">Chemistry · 50 min</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px">
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800;color:var(--acc)">41m</div><div style="font-size:11.5px;color:var(--faint);font-weight:700;margin-top:2px">Upright</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800;color:#B7791F">7m</div><div style="font-size:11.5px;color:var(--faint);font-weight:700;margin-top:2px">Leaning</div></div>
      <div class="card" style="padding:14px;text-align:center"><div class="num" style="font-size:26px;font-weight:800;color:var(--coral)">2m</div><div style="font-size:11.5px;color:var(--faint);font-weight:700;margin-top:2px">Slumped</div></div>
    </div>

    <!-- score over time -->
    <div class="card" style="padding:18px 18px 14px;margin-top:14px">
      <div class="between"><span style="font-size:15px;font-weight:800">Posture over time</span><span class="chip" style="padding:4px 9px;font-size:11.5px"><i class="fas fa-person-walking" style="font-size:10px;color:var(--acc)"></i> stretch</span></div>
      <svg width="100%" height="140" viewBox="0 0 340 140" preserveAspectRatio="none" style="margin-top:12px;display:block">
        <defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FB08D" stop-opacity=".28"/><stop offset="1" stop-color="#4FB08D" stop-opacity="0"/></linearGradient></defs>
        <rect x="0" y="0" width="340" height="40" fill="#F1FAF6"/>
        <line x1="0" y1="40" x2="340" y2="40" stroke="#CFE7DC" stroke-dasharray="4 4"/>
        <rect x="150" y="0" width="20" height="140" fill="#EEF2EF"/>
        <path d="M0,30 L25,26 L50,28 L75,34 L100,58 L120,84 L140,90 L150,90 L170,22 L195,20 L220,26 L245,30 L265,52 L285,60 L300,34 L320,24 L340,22 L340,140 L0,140 Z" fill="url(#f)"/>
        <path d="M0,30 L25,26 L50,28 L75,34 L100,58 L120,84 L140,90 L150,90 L170,22 L195,20 L220,26 L245,30 L265,52 L285,60 L300,34 L320,24 L340,22" fill="none" stroke="#2F7A64" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="140" cy="90" r="5" fill="#EF7B5A" stroke="#fff" stroke-width="2"/>
        <circle cx="285" cy="60" r="5" fill="#F2B13C" stroke="#fff" stroke-width="2"/>
      </svg>
      <div class="between" style="font-size:11px;color:var(--faint);font-weight:700;margin-top:6px"><span>0</span><span>25</span><span>50 min</span></div>
    </div>

    <!-- moments -->
    <div class="card" style="padding:4px 18px;margin-top:14px">
      <div class="ev"><span class="ic" style="background:linear-gradient(135deg,#F59B7A,#E0623F)"><i class="fas fa-head-side"></i></span><div style="flex:1"><div style="font-size:14.5px;font-weight:800">Head dropped forward</div><div style="font-size:12.5px;color:var(--faint);font-weight:600">min 18 to 22</div></div><span class="dot" style="background:var(--coral)"></span></div>
      <div class="ev"><span class="ic" style="background:linear-gradient(135deg,#4FB08D,#2F7A64)"><i class="fas fa-person-walking"></i></span><div style="flex:1"><div style="font-size:14.5px;font-weight:800">Neck release done</div><div style="font-size:12.5px;color:var(--faint);font-weight:600">score back to 90 after</div></div><span class="dot" style="background:var(--acc2)"></span></div>
    </div>

    <div class="btn pri" style="margin-top:16px">Save to today</div>
  </div>
</div>
</body>
</html>
