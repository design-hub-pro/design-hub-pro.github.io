<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handrail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#131A18;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:76px 40px 110px}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:14px}
.icon{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,#14795F,#55B98C);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 34px -14px rgba(20,121,95,.75)}
.icon i{font-size:34px;color:#fff}
h1{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.tag{font-size:19px;color:#5A6A63;font-weight:500;margin-top:10px;max-width:820px}
.tags{display:flex;gap:9px;margin-top:26px}
.tags span{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#14795F;background:#EAF4F0;border:1px solid #D3E7DE;padding:8px 14px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;margin-top:66px;justify-items:center}
.item{display:flex;flex-direction:column;align-items:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0E1512;box-shadow:0 34px 70px -28px rgba(19,26,24,.55),0 0 0 1px rgba(19,26,24,.08)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#F2F5F3}
.lbl{margin-top:20px;font-size:16px;font-weight:700;letter-spacing:-.2px}
.no{font-size:12px;font-weight:700;letter-spacing:2px;color:#9AA5A0;margin-top:6px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="icon"><i class="fas fa-grip-lines-vertical"></i></div>
    <div>
      <h1>Handrail</h1>
      <p class="tag">A day-care floor log that scores every task by how much prompting it took, and shows the support fading week by week.</p>
    </div>
  </div>
  <div class="tags"><span>Day Care</span><span>Disability</span><span>Rehabilitation</span><span>Staff Tool</span></div>

  <div class="grid">
    <div class="item"><div class="frame"><iframe src="arrival.html" scrolling="no"></iframe></div><div class="lbl">Morning arrival</div><div class="no">01</div></div>
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="lbl">Floor today</div><div class="no">02</div></div>
    <div class="item"><div class="frame"><iframe src="log.html" scrolling="no"></iframe></div><div class="lbl">Log attempt</div><div class="no">03</div></div>
    <div class="item"><div class="frame"><iframe src="member.html" scrolling="no"></iframe></div><div class="lbl">Member file</div><div class="no">04</div></div>
    <div class="item"><div class="frame"><iframe src="workshop.html" scrolling="no"></iframe></div><div class="lbl">Work bench</div><div class="no">05</div></div>
    <div class="item"><div class="frame"><iframe src="handoff.html" scrolling="no"></iframe></div><div class="lbl">Family handoff</div><div class="no">06</div></div>
  </div>
</div>
</body>
</html>
