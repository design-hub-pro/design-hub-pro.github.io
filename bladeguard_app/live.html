<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BladeGuard - Live Training</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #080C18;
            color: #F1F5F9;
            -webkit-font-smoothing: antialiased;
        }
        .status-bar {
            height: 59px;
            padding: 14px 28px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .status-time { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
        .status-icons { display: flex; gap: 6px; align-items: center; }
        .status-icons i { font-size: 12px; opacity: 0.9; }
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .recording-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .island-text { font-size: 11px; font-weight: 600; color: #EF4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .content {
            padding: 8px 28px 100px;
            overflow-y: auto;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 84px;
            background: rgba(8, 12, 24, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #475569;
            font-size: 10px;
            font-weight: 500;
        }
        .tab-item.active { color: #22D3EE; }
        .tab-item i { font-size: 20px; }

        /* Live Header */
        .live-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .live-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .live-title h2 { font-size: 20px; font-weight: 700; }
        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            box-shadow: 0 0 12px rgba(239,68,68,0.5);
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Timer */
        .timer-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .timer {
            font-size: 48px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #22D3EE, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hr-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .hr-icon { color: #EF4444; font-size: 18px; animation: heartbeat 1s ease-in-out infinite; }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .hr-value { font-size: 20px; font-weight: 700; }
        .hr-unit { font-size: 12px; color: #64748B; }

        /* Waveform */
        .waveform-card {
            background: #111827;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
        }
        .waveform-label {
            font-size: 11px;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Metrics Row */
        .metrics-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: #111827;
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .metric-value { font-size: 22px; font-weight: 800; line-height: 1; }
        .metric-unit { font-size: 10px; color: #64748B; font-weight: 500; }
        .metric-label { font-size: 10px; color: #64748B; margin-top: 6px; font-weight: 500; }

        /* Symmetry */
        .symmetry-card {
            background: #111827;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
        }
        .symmetry-header {
            font-size: 11px;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .symmetry-bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .symmetry-side {
            font-size: 12px;
            font-weight: 600;
            width: 50px;
            text-align: center;
        }
        .symmetry-bar-bg {
            flex: 1;
            height: 12px;
            background: #1E293B;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
        }
        .symmetry-bar-left {
            height: 100%;
            background: linear-gradient(to right, #06B6D4, #22D3EE);
            border-radius: 6px 0 0 6px;
        }
        .symmetry-bar-right {
            height: 100%;
            background: linear-gradient(to right, #3B82F6, #6366F1);
            border-radius: 0 6px 6px 0;
        }
        .symmetry-values {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
        .symmetry-values span { font-size: 18px; font-weight: 700; }

        /* Joint Stress Mini */
        .joint-stress-row {
            background: #111827;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
        }
        .joint-stress-header {
            font-size: 11px;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .joints-mini {
            display: flex;
            justify-content: space-around;
        }
        .joint-mini {
            text-align: center;
        }
        .joint-mini-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joint-mini-label { font-size: 9px; color: #94A3B8; font-weight: 500; }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }
        .btn-pause {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1E293B;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #F1F5F9;
        }
        .btn-stop {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 20px rgba(239,68,68,0.3);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="dynamic-island">
            <div class="recording-dot"></div>
            <span class="island-text">REC</span>
        </div>
        <div class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="live-header">
            <div class="live-title">
                <div class="live-dot"></div>
                <h2>Live Training</h2>
            </div>
            <span style="font-size: 12px; color: #64748B;">Bout Practice</span>
        </div>

        <!-- Timer + HR -->
        <div class="timer-section">
            <div class="timer">00:32:15</div>
            <div class="hr-display">
                <i class="fas fa-heartbeat hr-icon"></i>
                <span class="hr-value">156</span>
                <span class="hr-unit">bpm</span>
            </div>
        </div>

        <!-- Accelerometer Waveform -->
        <div class="waveform-card">
            <div class="waveform-label">Acceleration (G-Force)</div>
            <svg width="100%" height="80" viewBox="0 0 350 80" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#22D3EE"/>
                        <stop offset="100%" stop-color="#3B82F6"/>
                    </linearGradient>
                    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <path d="M0,40 Q10,40 20,35 T40,30 T60,45 T80,20 T100,55 T120,15 T140,50 T160,25 T180,42 T200,18 T220,55 T240,22 T260,48 T280,15 T300,52 T320,28 T340,38 T350,40"
                    fill="none" stroke="url(#waveGrad)" stroke-width="2"/>
                <path d="M0,40 Q10,40 20,35 T40,30 T60,45 T80,20 T100,55 T120,15 T140,50 T160,25 T180,42 T200,18 T220,55 T240,22 T260,48 T280,15 T300,52 T320,28 T340,38 T350,40 V80 H0 Z"
                    fill="url(#waveFill)"/>
                <!-- Grid lines -->
                <line x1="0" y1="20" x2="350" y2="20" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="0" y1="40" x2="350" y2="40" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="0" y1="60" x2="350" y2="60" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="4,4"/>
            </svg>
        </div>

        <!-- Key Metrics -->
        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-value" style="color: #22D3EE;">127</div>
                <div class="metric-label">Movements</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" style="color: #FBBF24;">2.4</div>
                <div class="metric-unit">G</div>
                <div class="metric-label">Peak Force</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" style="color: #34D399;">847</div>
                <div class="metric-label">Impacts</div>
            </div>
        </div>

        <!-- Symmetry -->
        <div class="symmetry-card">
            <div class="symmetry-header">Movement Symmetry</div>
            <div class="symmetry-bar-container">
                <span class="symmetry-side" style="color: #22D3EE;">Left</span>
                <div class="symmetry-bar-bg">
                    <div class="symmetry-bar-left" style="width: 48%;"></div>
                    <div class="symmetry-bar-right" style="width: 52%;"></div>
                </div>
                <span class="symmetry-side" style="color: #6366F1;">Right</span>
            </div>
            <div class="symmetry-values">
                <span style="color: #22D3EE;">48%</span>
                <span style="color: #6366F1;">52%</span>
            </div>
        </div>

        <!-- Joint Stress -->
        <div class="joint-stress-row">
            <div class="joint-stress-header">Joint Stress Indicators</div>
            <div class="joints-mini">
                <div class="joint-mini">
                    <div class="joint-mini-dot" style="background: rgba(251,191,36,0.2);">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #FBBF24;"></div>
                    </div>
                    <div class="joint-mini-label">R. Knee</div>
                </div>
                <div class="joint-mini">
                    <div class="joint-mini-dot" style="background: rgba(34,211,238,0.2);">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #22D3EE;"></div>
                    </div>
                    <div class="joint-mini-label">L. Knee</div>
                </div>
                <div class="joint-mini">
                    <div class="joint-mini-dot" style="background: rgba(16,185,129,0.2);">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #10B981;"></div>
                    </div>
                    <div class="joint-mini-label">R. Ankle</div>
                </div>
                <div class="joint-mini">
                    <div class="joint-mini-dot" style="background: rgba(16,185,129,0.2);">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #10B981;"></div>
                    </div>
                    <div class="joint-mini-label">L. Ankle</div>
                </div>
                <div class="joint-mini">
                    <div class="joint-mini-dot" style="background: rgba(16,185,129,0.2);">
                        <div style="width: 12px; height: 12px; border-radius: 50%; background: #10B981;"></div>
                    </div>
                    <div class="joint-mini-label">R. Wrist</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-pause">
                <i class="fas fa-pause"></i>
            </button>
            <button class="btn-stop">
                <i class="fas fa-stop"></i>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tab-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="tab-item active">
            <i class="fas fa-bolt"></i>
            <span>Live</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-child"></i>
            <span>Body</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-chart-line"></i>
            <span>History</span>
        </div>
        <div class="tab-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </div>
    </div>
</body>
</html>
