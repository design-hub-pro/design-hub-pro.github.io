<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Therapy - MindPeak Athlete</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .art-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 16px;
        }
        .art-tabs {
            display: flex;
            gap: 8px;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .art-tab {
            padding: 10px 20px;
            background: var(--dark-card);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray);
            border: none;
            cursor: pointer;
        }
        .art-tab.active {
            background: var(--primary);
            color: white;
        }
        .canvas-container {
            margin: 0 20px 16px;
            border-radius: 20px;
            overflow: hidden;
            background: var(--dark-card);
        }
        .canvas-area {
            width: 100%;
            aspect-ratio: 1;
            background: #1a1a2e;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-area img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            opacity: 0.9;
        }
        .canvas-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--dark);
        }
        .tool-group {
            display: flex;
            gap: 8px;
        }
        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--dark-card);
            border: none;
            color: var(--light);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn.active {
            background: var(--primary);
        }
        .color-picker {
            display: flex;
            gap: 6px;
        }
        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .color-btn.selected {
            border-color: white;
            transform: scale(1.1);
        }
        .templates-section {
            padding: 0 20px;
        }
        .template-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 16px;
        }
        .template-card {
            flex-shrink: 0;
            width: 140px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--dark-card);
        }
        .template-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .template-info {
            padding: 12px;
        }
        .template-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .template-meta {
            font-size: 11px;
            color: var(--gray);
        }
        .gallery-section {
            padding: 20px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .gallery-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- Header -->
        <div class="art-header">
            <h1 style="font-size: 26px; font-weight: 700;">Art Therapy</h1>
            <button style="background: var(--dark-card); border: none; width: 40px; height: 40px; border-radius: 12px; color: white;">
                <i class="fas fa-images"></i>
            </button>
        </div>

        <!-- Art Tabs -->
        <div class="art-tabs">
            <button class="art-tab active">Coloring</button>
            <button class="art-tab">Free Draw</button>
            <button class="art-tab">Patterns</button>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
            <div class="canvas-area">
                <img src="https://images.unsplash.com/photo-1582738411706-bfc8e691d1c2?w=400&h=400&fit=crop" alt="Mandala" style="filter: grayscale(100%) brightness(1.5) contrast(0.8);">
            </div>
            <div class="canvas-tools">
                <div class="tool-group">
                    <button class="tool-btn active"><i class="fas fa-paint-brush"></i></button>
                    <button class="tool-btn"><i class="fas fa-fill-drip"></i></button>
                    <button class="tool-btn"><i class="fas fa-eraser"></i></button>
                </div>
                <div class="color-picker">
                    <div class="color-btn selected" style="background: #14B8A6;"></div>
                    <div class="color-btn" style="background: #8B5CF6;"></div>
                    <div class="color-btn" style="background: #F97316;"></div>
                    <div class="color-btn" style="background: #EC4899;"></div>
                    <div class="color-btn" style="background: #FBBF24;"></div>
                </div>
                <div class="tool-group">
                    <button class="tool-btn"><i class="fas fa-undo"></i></button>
                    <button class="tool-btn"><i class="fas fa-save"></i></button>
                </div>
            </div>
        </div>

        <!-- Templates -->
        <h2 class="section-title">Templates</h2>
        <div class="templates-section">
            <div class="template-scroll">
                <div class="template-card">
                    <img src="https://images.unsplash.com/photo-1582738411706-bfc8e691d1c2?w=300&h=300&fit=crop" alt="Mandala">
                    <div class="template-info">
                        <div class="template-name">Mandala Flow</div>
                        <div class="template-meta">Relaxation</div>
                    </div>
                </div>
                <div class="template-card">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=300&fit=crop" alt="Nature">
                    <div class="template-info">
                        <div class="template-name">Nature Scene</div>
                        <div class="template-meta">Focus</div>
                    </div>
                </div>
                <div class="template-card">
                    <img src="https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?w=300&h=300&fit=crop" alt="Abstract">
                    <div class="template-info">
                        <div class="template-name">Abstract Art</div>
                        <div class="template-meta">Expression</div>
                    </div>
                </div>
                <div class="template-card">
                    <img src="https://images.unsplash.com/photo-1501084817091-a4f3d1d19e07?w=300&h=300&fit=crop" alt="Geometric">
                    <div class="template-info">
                        <div class="template-name">Geometric</div>
                        <div class="template-meta">Balance</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- My Creations -->
        <h2 class="section-title">My Creations</h2>
        <div class="gallery-section" style="padding-top: 0;">
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=200&h=200&fit=crop" alt="Creation 1">
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1547826039-bfc35e0f1ea8?w=200&h=200&fit=crop" alt="Creation 2">
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=200&h=200&fit=crop" alt="Creation 3">
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=200&h=200&fit=crop" alt="Creation 4">
                </div>
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=200&h=200&fit=crop" alt="Creation 5">
                </div>
                <div class="gallery-item" style="background: var(--dark-card); display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-plus" style="font-size: 24px; color: var(--gray);"></i>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <nav class="tab-bar">
            <a href="#" class="tab-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-heart"></i>
                <span>Check-in</span>
            </a>
            <a href="#" class="tab-item center-btn">
                <i class="fas fa-spa"></i>
            </a>
            <a href="#" class="tab-item active">
                <i class="fas fa-palette"></i>
                <span>Art</span>
            </a>
            <a href="#" class="tab-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
</body>
</html>
