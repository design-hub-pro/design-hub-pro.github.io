<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TennisCoach AI - Pose Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin:0; padding:0; background:transparent;">
    <div class="phone-frame" style="box-shadow:none; border-radius:0;">
        <!-- Status Bar -->
        <div class="status-bar dark">
            <span class="status-time">9:41</span>
            <div class="status-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full battery"></i>
            </div>
        </div>
        <div class="dynamic-island"></div>

        <!-- Screen Content -->
        <div class="screen-content" style="background: #000; padding: 0; display: flex; flex-direction: column;">
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 12px;">
                <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-times" style="color: white; font-size: 16px;"></i>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 8px; height: 8px; background: #EF4444; border-radius: 50%; animation: pulse 1.5s infinite;"></div>
                    <span style="color: white; font-size: 14px; font-weight: 600;">Recording</span>
                </div>
                <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-cog" style="color: white; font-size: 16px;"></i>
                </div>
            </div>

            <!-- Camera View with Pose Skeleton -->
            <div style="flex: 1; position: relative; margin: 0 16px;">
                <div style="position: relative; height: 100%; background: linear-gradient(180deg, #1a2e1a 0%, #0f1a0f 100%); border-radius: 24px; overflow: hidden;">
                    <!-- Simulated camera with tennis player -->
                    <img src="https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?w=400&h=600&fit=crop" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.9;" alt="Tennis Player">

                    <!-- Pose Skeleton Overlay -->
                    <svg style="position: absolute; inset: 0; width: 100%; height: 100%;" viewBox="0 0 400 600">
                        <!-- Skeleton Lines -->
                        <!-- Head to Shoulders -->
                        <line x1="200" y1="80" x2="200" y2="140" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Shoulders -->
                        <line x1="150" y1="140" x2="250" y2="140" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Left Arm -->
                        <line x1="150" y1="140" x2="110" y2="200" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <line x1="110" y1="200" x2="80" y2="280" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Right Arm (extended for serve) -->
                        <line x1="250" y1="140" x2="300" y2="100" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <line x1="300" y1="100" x2="340" y2="60" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Spine -->
                        <line x1="200" y1="140" x2="200" y2="280" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Hips -->
                        <line x1="160" y1="280" x2="240" y2="280" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <!-- Left Leg -->
                        <line x1="160" y1="280" x2="140" y2="400" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
                        <line x1="140" y1="400" x2="130" y2="520" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
                        <!-- Right Leg -->
                        <line x1="240" y1="280" x2="260" y2="400" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
                        <line x1="260" y1="400" x2="270" y2="520" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>

                        <!-- Joints -->
                        <!-- Head -->
                        <circle cx="200" cy="80" r="8" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Shoulders -->
                        <circle cx="150" cy="140" r="7" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <circle cx="250" cy="140" r="7" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Elbows -->
                        <circle cx="110" cy="200" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <circle cx="300" cy="100" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Wrists -->
                        <circle cx="80" cy="280" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <circle cx="340" cy="60" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Hips -->
                        <circle cx="160" cy="280" r="7" fill="#EAB308" stroke="white" stroke-width="2"/>
                        <circle cx="240" cy="280" r="7" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Knees -->
                        <circle cx="140" cy="400" r="6" fill="#EAB308" stroke="white" stroke-width="2"/>
                        <circle cx="260" cy="400" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                        <!-- Ankles -->
                        <circle cx="130" cy="520" r="6" fill="#EAB308" stroke="white" stroke-width="2"/>
                        <circle cx="270" cy="520" r="6" fill="#22C55E" stroke="white" stroke-width="2"/>
                    </svg>

                    <!-- Form Score -->
                    <div style="position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 16px; padding: 14px 18px; text-align: center;">
                        <p style="color: rgba(255,255,255,0.6); font-size: 11px; margin-bottom: 4px;">FORM SCORE</p>
                        <p style="color: #22C55E; font-size: 32px; font-weight: 800;">87</p>
                    </div>

                    <!-- Current Exercise -->
                    <div style="position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px 14px;">
                        <p style="color: white; font-size: 13px; font-weight: 600;"><i class="fas fa-shoe-prints" style="margin-right: 6px; color: #CCFF00;"></i>Split Step Drill</p>
                    </div>

                    <!-- Real-time Feedback -->
                    <div style="position: absolute; bottom: 16px; left: 16px; right: 16px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-radius: 16px; padding: 16px;">
                        <div style="display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px;">
                            <div style="width: 36px; height: 36px; background: rgba(234, 179, 8, 0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <i class="fas fa-exclamation-triangle" style="color: #EAB308; font-size: 16px;"></i>
                            </div>
                            <div>
                                <p style="color: white; font-size: 14px; font-weight: 600; margin-bottom: 4px;">Adjust Left Knee Bend</p>
                                <p style="color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.4;">Bend your left knee 15° more for better split step balance</p>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <div style="flex: 1; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; text-align: center;">
                                <p style="color: #22C55E; font-size: 16px; font-weight: 700;">Good</p>
                                <p style="color: rgba(255,255,255,0.5); font-size: 10px;">Upper Body</p>
                            </div>
                            <div style="flex: 1; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; text-align: center;">
                                <p style="color: #EAB308; font-size: 16px; font-weight: 700;">Adjust</p>
                                <p style="color: rgba(255,255,255,0.5); font-size: 10px;">Legs</p>
                            </div>
                            <div style="flex: 1; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; text-align: center;">
                                <p style="color: #22C55E; font-size: 16px; font-weight: 700;">Great</p>
                                <p style="color: rgba(255,255,255,0.5); font-size: 10px;">Arms</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div style="padding: 16px 20px 24px; display: flex; justify-content: center; align-items: center; gap: 24px;">
                <div style="width: 52px; height: 52px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-redo" style="color: white; font-size: 18px;"></i>
                </div>
                <div style="width: 72px; height: 72px; background: #EF4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);">
                    <i class="fas fa-stop" style="color: white; font-size: 24px;"></i>
                </div>
                <div style="width: 52px; height: 52px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-sync-alt" style="color: white; font-size: 18px;"></i>
                </div>
            </div>
        </div>

        <!-- No Tab Bar on this screen for immersive experience -->
        <div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: white; border-radius: 3px; opacity: 0.3;"></div>
    </div>

    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</body>
</html>
