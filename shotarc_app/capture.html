<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShotArc — Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
:root{--ac:#F2622E;--ac2:#FF9B3D;--ok:#4ADE80;--bad:#F87171;}
html,body{width:100%;height:100%;}
.screen{width:100%;height:100%;background:#0B0A09;color:#fff;position:relative;overflow:hidden;}
.num{font-variant-numeric:tabular-nums;}
.statusbar{height:59px;padding:0 28px 10px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:5;}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:20px;}
.sb-time{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.sb-icons{display:flex;gap:7px;font-size:13px;}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);}
.glass{background:rgba(255,255,255,.09);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:20px;}
</style>
</head>
<body>
<div class="screen">
  <!-- viewfinder -->
  <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790731525245-image-1.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,9,.72) 0%,rgba(11,10,9,.25) 34%,rgba(11,10,9,.94) 100%);"></div>

  <div class="statusbar">
    <span class="sb-time num">9:58</span><div class="island"></div>
    <div class="sb-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>

  <!-- top bar -->
  <div style="position:relative;z-index:5;padding:6px 28px 0;display:flex;align-items:center;justify-content:space-between;">
    <div class="num" style="display:flex;align-items:center;gap:8px;background:rgba(248,113,113,.2);border:1px solid rgba(248,113,113,.4);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.4px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#F87171;"></span>REC 14:22
    </div>
    <div style="display:flex;gap:7px;">
      <div class="num" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;"><i class="fa-solid fa-bluetooth-b" style="font-size:11px;color:var(--ok);"></i>84%</div>
      <div class="num" style="background:rgba(255,255,255,.12);padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;">60 fps</div>
    </div>
  </div>

  <!-- rim reticle -->
  <div style="position:absolute;z-index:4;left:50%;top:200px;transform:translateX(-50%);width:160px;height:104px;">
    <div style="position:absolute;left:0;top:0;width:26px;height:26px;border-left:3px solid var(--ac);border-top:3px solid var(--ac);border-radius:4px 0 0 0;"></div>
    <div style="position:absolute;right:0;top:0;width:26px;height:26px;border-right:3px solid var(--ac);border-top:3px solid var(--ac);border-radius:0 4px 0 0;"></div>
    <div style="position:absolute;left:0;bottom:0;width:26px;height:26px;border-left:3px solid var(--ac);border-bottom:3px solid var(--ac);border-radius:0 0 0 4px;"></div>
    <div style="position:absolute;right:0;bottom:0;width:26px;height:26px;border-right:3px solid var(--ac);border-bottom:3px solid var(--ac);border-radius:0 0 4px 0;"></div>
    <div class="meta" style="position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;color:var(--ac);font-size:10px;letter-spacing:1.6px;white-space:nowrap;">Rim &middot; 4.1 m</div>
    <!-- live arc trace into rim -->
    <svg style="position:absolute;left:-150px;top:-50px;" width="200" height="180" viewBox="0 0 200 180">
      <path d="M18 168 Q 92 -8 176 74" fill="none" stroke="#FF9B3D" stroke-width="2.5" stroke-dasharray="5 6" opacity=".85"/>
      <circle cx="176" cy="74" r="6" fill="#FF9B3D"/>
    </svg>
  </div>

  <!-- bottom panel -->
  <div style="position:absolute;z-index:6;left:0;right:0;bottom:0;padding:0 28px 34px;">

    <!-- shot counter + last call -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div class="meta">Shot</div>
        <div class="num" style="font-size:62px;font-weight:900;letter-spacing:-3px;line-height:.95;margin-top:2px;">34<span style="font-size:22px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:-.5px;">/70</span></div>
      </div>
      <div style="text-align:right;">
        <div class="num" style="display:inline-flex;align-items:center;gap:7px;background:rgba(74,222,128,.18);border:1px solid rgba(74,222,128,.45);color:#4ADE80;padding:8px 15px;border-radius:999px;font-size:14px;font-weight:900;letter-spacing:.3px;">
          <i class="fa-solid fa-check" style="font-size:12px;"></i>MADE
        </div>
        <div class="num" style="font-size:12px;color:rgba(255,255,255,.55);font-weight:700;margin-top:8px;">9 in a row</div>
      </div>
    </div>

    <!-- result ticker -->
    <div style="display:flex;gap:5px;align-items:center;margin-bottom:16px;">
      <div style="flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.22);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.22);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
      <div style="flex:1;height:6px;border-radius:99px;background:var(--ok);"></div>
    </div>

    <!-- band live readout -->
    <div class="glass" style="padding:16px 18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;">
        <div class="meta" style="letter-spacing:1.6px;">Band &middot; this release</div>
        <div class="num" style="font-size:11px;font-weight:800;color:var(--ok);">in range</div>
      </div>
      <!-- wrist waveform -->
      <svg width="100%" height="40" viewBox="0 0 340 40" preserveAspectRatio="none" style="display:block;margin-bottom:14px;">
        <path d="M0 26 L18 24 L32 28 L46 22 L60 27 L74 20 L88 25 L102 14 L116 30 L128 6 L138 34 L150 12 L164 24 L180 21 L196 26 L212 23 L230 25 L250 22 L272 26 L296 24 L318 25 L340 24"
              fill="none" stroke="#FF9B3D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div>
          <div class="meta" style="font-size:9px;letter-spacing:1.2px;">Release</div>
          <div class="num" style="font-size:22px;font-weight:900;letter-spacing:-.8px;margin-top:3px;">49<span style="font-size:13px;">&deg;</span></div>
        </div>
        <div>
          <div class="meta" style="font-size:9px;letter-spacing:1.2px;">Snap</div>
          <div class="num" style="font-size:22px;font-weight:900;letter-spacing:-.8px;margin-top:3px;">81</div>
        </div>
        <div>
          <div class="meta" style="font-size:9px;letter-spacing:1.2px;">Drift</div>
          <div class="num" style="font-size:22px;font-weight:900;letter-spacing:-.8px;margin-top:3px;color:var(--ac2);">3.4<span style="font-size:13px;">&deg;</span></div>
        </div>
      </div>
    </div>

    <!-- controls -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">
      <div style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-camera-rotate" style="font-size:16px;"></i></div>
      <div style="width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;">
        <div style="width:30px;height:30px;border-radius:8px;background:#F87171;"></div>
      </div>
      <div style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-bolt" style="font-size:16px;color:var(--ac2);"></i></div>
    </div>
  </div>
</div>
</body>
</html>
