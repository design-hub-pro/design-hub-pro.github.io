<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShotArc — Setup</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
:root{--ac:#F2622E;--ac2:#FF9B3D;--ink:#12100E;--mut:#8A857E;--bd:#EBE7E1;--bg:#FAF8F5;--ok:#2E9E63;--bad:#D94A3D;}
html,body{width:100%;height:100%;}
.screen{width:100%;height:100%;background:var(--bg);color:var(--ink);position:relative;overflow-y:auto;}
.num{font-variant-numeric:tabular-nums;}
.statusbar{height:59px;padding:0 28px 10px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:20px;}
.sb-time{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.sb-icons{display:flex;gap:7px;font-size:13px;}
.wrap{padding:0 28px 40px;}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);}
h1{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;margin-top:8px;}
.card{background:#fff;border:1px solid var(--bd);border-radius:22px;box-shadow:0 1px 2px rgba(18,16,14,.04),0 12px 28px -12px rgba(18,16,14,.14);}
.rowlbl{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.chip{font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:#fff;color:var(--mut);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn{width:100%;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:9px;border:none;box-shadow:0 10px 24px -8px rgba(242,98,46,.6);}
.bar{height:5px;border-radius:99px;background:var(--bd);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);}
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span class="sb-time num">9:41</span><div class="island"></div>
    <div class="sb-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>

  <div class="wrap">
    <div class="meta">Setup</div>
    <h1>Band and camera,<br>both ready.</h1>

    <!-- Band card : signature signal arc -->
    <div class="card" style="margin-top:24px;padding:22px;display:flex;gap:18px;align-items:center;">
      <svg width="86" height="86" viewBox="0 0 86 86" style="flex-shrink:0;">
        <circle cx="43" cy="43" r="36" fill="none" stroke="#EBE7E1" stroke-width="7"/>
        <circle cx="43" cy="43" r="36" fill="none" stroke="#2E9E63" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="226" stroke-dashoffset="36" transform="rotate(-90 43 43)"/>
        <g transform="translate(43,43)">
          <rect x="-9" y="-11" width="18" height="22" rx="6" fill="none" stroke="#12100E" stroke-width="2.4"/>
          <path d="M-13 -6 A14 14 0 0 0 -13 6" fill="none" stroke="#F2622E" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M13 -6 A14 14 0 0 1 13 6" fill="none" stroke="#F2622E" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </svg>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;">
          <span class="dot" style="background:var(--ok);"></span>
          <span class="meta" style="color:var(--ok);">Paired</span>
        </div>
        <div class="rowlbl" style="margin-top:5px;">ShotArc Band</div>
        <div class="num" style="font-size:12px;color:var(--mut);font-weight:600;margin-top:3px;">Right wrist &middot; &minus;48 dBm &middot; v1.4.2</div>
        <div class="bar" style="margin-top:11px;"><i style="width:84%"></i></div>
        <div class="num" style="font-size:11px;color:var(--mut);font-weight:700;margin-top:6px;">84% &middot; about 10 h left</div>
      </div>
    </div>

    <!-- Camera card : rim lock -->
    <div class="card" style="margin-top:14px;overflow:hidden;">
      <div style="position:relative;height:186px;">
        <img src="https://cm-idea-images.s3.us-west-1.amazonaws.com/1790731537291-image-1.png" style="width:100%;height:100%;object-fit:cover;display:block;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,.05) 0%,rgba(18,16,14,.72) 100%);"></div>
        <!-- rim lock reticle -->
        <div style="position:absolute;left:52%;top:26%;width:104px;height:70px;transform:translateX(-50%);">
          <div style="position:absolute;left:0;top:0;width:20px;height:20px;border-left:2.5px solid #F2622E;border-top:2.5px solid #F2622E;border-radius:3px 0 0 0;"></div>
          <div style="position:absolute;right:0;top:0;width:20px;height:20px;border-right:2.5px solid #F2622E;border-top:2.5px solid #F2622E;border-radius:0 3px 0 0;"></div>
          <div style="position:absolute;left:0;bottom:0;width:20px;height:20px;border-left:2.5px solid #F2622E;border-bottom:2.5px solid #F2622E;border-radius:0 0 0 3px;"></div>
          <div style="position:absolute;right:0;bottom:0;width:20px;height:20px;border-right:2.5px solid #F2622E;border-bottom:2.5px solid #F2622E;border-radius:0 0 3px 0;"></div>
        </div>
        <div style="position:absolute;left:20px;bottom:18px;right:20px;display:flex;align-items:flex-end;justify-content:space-between;">
          <div>
            <div class="meta" style="color:rgba(255,255,255,.72);">Rim locked</div>
            <div class="num" style="color:#fff;font-size:26px;font-weight:900;letter-spacing:-.8px;margin-top:3px;">4.1 m</div>
          </div>
          <div class="num" style="color:rgba(255,255,255,.85);font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 11px;border-radius:999px;backdrop-filter:blur(10px);">60 fps &middot; wide</div>
        </div>
      </div>
    </div>

    <!-- Shooting hand -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:26px;">
      <div class="meta">Shooting hand</div>
      <div class="num" style="font-size:11px;font-weight:700;color:var(--mut);">2 of 2 set</div>
    </div>
    <div style="display:flex;gap:9px;margin-top:11px;">
      <div class="chip on" style="flex:1;text-align:center;padding:12px 0;">Right</div>
      <div class="chip" style="flex:1;text-align:center;padding:12px 0;">Left</div>
      <div class="chip" style="flex:1;text-align:center;padding:12px 0;">Both</div>
    </div>

    <button class="btn" style="margin-top:26px;">Start first session <i class="fa-solid fa-arrow-right" style="font-size:14px;"></i></button>
  </div>
</div>
</body>
</html>
