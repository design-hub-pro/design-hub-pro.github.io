<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShotArc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
body{background:#fff;color:#12100E;}
.page{max-width:1500px;margin:0 auto;padding:76px 40px 110px;}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:64px;}
.appicon{width:86px;height:86px;border-radius:24px;background:linear-gradient(135deg,#F2622E,#FF9B3D);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -14px rgba(242,98,46,.75);}
.appicon i{color:#fff;font-size:38px;}
h1{font-size:52px;font-weight:900;letter-spacing:-2.2px;margin-top:24px;}
.sub{font-size:18px;color:#8A857E;font-weight:500;margin-top:12px;max-width:620px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:64px 40px;justify-items:center;}
.item{display:flex;flex-direction:column;align-items:center;}
.frame{width:460px;height:980px;background:#0B0A09;border-radius:62px;padding:12px;box-shadow:0 44px 90px -30px rgba(18,16,14,.42),0 0 0 1px rgba(18,16,14,.06);}
.frame iframe{width:100%;height:100%;border:none;border-radius:52px;display:block;background:#FAF8F5;}
.label{font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#8A857E;margin-top:24px;}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="appicon"><i class="fa-solid fa-basketball"></i></div>
    <h1>ShotArc</h1>
    <p class="sub">The band reads your release, the camera calls the make, and every shot gets one score.</p>
  </div>

  <div class="grid">
    <div class="item"><div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div><div class="label">Band and camera</div></div>
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="label">Today</div></div>
    <div class="item"><div class="frame"><iframe src="capture.html" scrolling="no"></iframe></div><div class="label">Live session</div></div>

    <div class="item"><div class="frame"><iframe src="result.html" scrolling="no"></iframe></div><div class="label">Session result</div></div>
    <div class="item"><div class="frame"><iframe src="shot.html" scrolling="no"></iframe></div><div class="label">Shot detail</div></div>
    <div class="item"><div class="frame"><iframe src="sessions.html" scrolling="no"></iframe></div><div class="label">Sessions</div></div>

    <div class="item"><div class="frame"><iframe src="trends.html" scrolling="no"></iframe></div><div class="label">Trends</div></div>
    <div class="item"><div class="frame"><iframe src="coach.html" scrolling="no"></iframe></div><div class="label">Coach</div></div>
    <div class="item"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="label">Profile</div></div>
  </div>
</div>
</body>
</html>
