<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlareWatch - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; }
    </style>
</head>
<body>
    <div class="w-full h-screen relative text-white overflow-hidden">

        <!-- Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80" class="w-full h-full object-cover" alt="Nature">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0f1a] via-[#0a0f1a]/80 to-transparent"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative z-10 flex items-center justify-between px-7 pt-4 pb-2" style="height:59px;">
            <span class="text-sm font-semibold">9:41</span>
            <div class="w-[126px] h-[36px] bg-black rounded-full mx-auto"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="relative z-10 flex flex-col h-full justify-end pb-16 px-7">

            <!-- Logo & Title -->
            <div class="mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl flex items-center justify-center mb-5 shadow-lg shadow-orange-500/30">
                    <i class="fas fa-fire text-white text-2xl"></i>
                </div>
                <h1 class="text-4xl font-extrabold leading-tight mb-3">
                    Know What<br>You're <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-red-400">Breathing</span>
                </h1>
                <p class="text-base text-gray-300 leading-relaxed">
                    Track gas flaring near you. Understand air quality. Protect your community.
                </p>
            </div>

            <!-- Feature Points -->
            <div class="space-y-3 mb-8">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-satellite text-red-400 text-sm"></i>
                    </div>
                    <p class="text-sm text-gray-300">Satellite-detected flare monitoring</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-shield-halved text-blue-400 text-sm"></i>
                    </div>
                    <p class="text-sm text-gray-300">Real-time health risk guidance</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-500/20 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-users text-green-400 text-sm"></i>
                    </div>
                    <p class="text-sm text-gray-300">Community awareness & education</p>
                </div>
            </div>

            <!-- CTA -->
            <button class="w-full bg-gradient-to-r from-amber-500 to-red-500 text-white font-semibold py-4 rounded-2xl text-base shadow-lg shadow-red-500/30 mb-3">
                Get Started
            </button>
            <p class="text-center text-xs text-gray-500">Already have an account? <span class="text-blue-400">Sign In</span></p>

            <!-- Pagination dots -->
            <div class="flex justify-center gap-2 mt-5">
                <div class="w-6 h-1.5 bg-amber-400 rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-gray-600 rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-gray-600 rounded-full"></div>
            </div>
        </div>
    </div>
</body>
</html>
