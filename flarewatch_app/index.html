<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlareWatch - AI-Powered Gas Flaring Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: #ffffff; }
        .phone-frame {
            width: 460px;
            height: 980px;
            border-radius: 62px;
            padding: 12px;
            background: #1a1a1a;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 52px;
            overflow: hidden;
            background: #0a0f1a;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="text-center pt-20 pb-16 px-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-500/20">
                <i class="fas fa-fire text-white text-2xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-extrabold text-gray-900 mb-4">FlareWatch</h1>
        <p class="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed">AI-powered community gas flaring monitor — track emissions, understand air quality, and protect your community</p>
    </div>

    <!-- Screenshots Grid -->
    <div class="max-w-[1520px] mx-auto px-8 pb-20">
        <!-- Row 1 -->
        <div class="grid grid-cols-3 gap-8 justify-items-center mb-8">
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="onboarding.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="home.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="map.html" scrolling="no"></iframe>
                </div>
            </div>
        </div>
        <!-- Row 2 -->
        <div class="grid grid-cols-3 gap-8 justify-items-center mb-8">
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="alerts.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="trends.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="learn.html" scrolling="no"></iframe>
                </div>
            </div>
        </div>
        <!-- Row 3 -->
        <div class="grid grid-cols-3 gap-8 justify-items-center">
            <div class="phone-frame">
                <div class="phone-screen">
                    <iframe src="profile.html" scrolling="no"></iframe>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
