<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlareWatch - Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; }
        .glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        @keyframes flare-pulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.6); opacity: 0; } }
        .flare-ring { animation: flare-pulse 2s ease-out infinite; }
        @keyframes flare-pulse2 { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.4); opacity: 0; } }
        .flare-ring2 { animation: flare-pulse2 2.5s ease-out infinite; }
    </style>
</head>
<body>
    <div class="w-full h-screen relative text-white overflow-hidden">

        <!-- Map Background -->
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=800&q=80" class="w-full h-full object-cover opacity-40" alt="Map">
            <div class="absolute inset-0 bg-[#0a1628]/70"></div>
            <!-- Grid overlay for map feel -->
            <div class="absolute inset-0" style="background-image: linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px); background-size: 40px 40px;"></div>
        </div>

        <!-- Status Bar -->
        <div class="relative z-10 flex items-center justify-between px-7 pt-4 pb-2" style="height:59px;">
            <span class="text-sm font-semibold">9:41</span>
            <div class="w-[126px] h-[36px] bg-black rounded-full mx-auto"></div>
            <div class="flex items-center gap-1.5">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative z-10 px-7 mb-4">
            <div class="glass-card rounded-2xl px-4 py-3 flex items-center gap-3">
                <i class="fas fa-search text-gray-400 text-sm"></i>
                <span class="text-sm text-gray-400">Search flare sites...</span>
                <div class="ml-auto flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-filter text-blue-400 text-xs"></i>
                    </div>
                    <div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-layer-group text-blue-400 text-xs"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Flare Points -->
        <div class="absolute inset-0 z-[5]">
            <!-- User location -->
            <div class="absolute" style="top: 48%; left: 52%;">
                <div class="w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-lg shadow-blue-500/50"></div>
                <div class="absolute -inset-3 bg-blue-400/20 rounded-full animate-ping" style="animation-duration:3s"></div>
            </div>

            <!-- Flare 1 - HIGH -->
            <div class="absolute" style="top: 32%; left: 38%;">
                <div class="relative">
                    <div class="absolute -inset-5 bg-red-500/20 rounded-full flare-ring"></div>
                    <div class="absolute -inset-3 bg-red-500/30 rounded-full flare-ring2"></div>
                    <div class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center shadow-lg shadow-red-500/50">
                        <i class="fas fa-fire text-white text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Flare 2 - MODERATE -->
            <div class="absolute" style="top: 55%; left: 28%;">
                <div class="relative">
                    <div class="absolute -inset-4 bg-amber-500/20 rounded-full flare-ring"></div>
                    <div class="w-7 h-7 bg-amber-500 rounded-full flex items-center justify-center shadow-lg shadow-amber-500/50">
                        <i class="fas fa-fire text-white text-[10px]"></i>
                    </div>
                </div>
            </div>

            <!-- Flare 3 - LOW -->
            <div class="absolute" style="top: 40%; left: 72%;">
                <div class="relative">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center shadow-lg shadow-green-500/50">
                        <i class="fas fa-fire text-white text-[9px]"></i>
                    </div>
                </div>
            </div>

            <!-- Flare 4 - HIGH -->
            <div class="absolute" style="top: 22%; left: 65%;">
                <div class="relative">
                    <div class="absolute -inset-5 bg-red-500/20 rounded-full flare-ring"></div>
                    <div class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center shadow-lg shadow-red-500/50">
                        <i class="fas fa-fire text-white text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Flare 5 - MODERATE -->
            <div class="absolute" style="top: 68%; left: 60%;">
                <div class="relative">
                    <div class="absolute -inset-4 bg-amber-500/20 rounded-full flare-ring2"></div>
                    <div class="w-7 h-7 bg-amber-500 rounded-full flex items-center justify-center shadow-lg shadow-amber-500/50">
                        <i class="fas fa-fire text-white text-[10px]"></i>
                    </div>
                </div>
            </div>

            <!-- Pollution Zone -->
            <div class="absolute" style="top: 25%; left: 30%; width: 200px; height: 150px;">
                <div class="w-full h-full rounded-full bg-red-500/8 border border-red-500/15" style="filter: blur(8px);"></div>
            </div>
        </div>

        <!-- Map Legend -->
        <div class="absolute top-[120px] right-5 z-10 glass-card rounded-2xl p-3">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <span class="text-[10px] text-gray-300">High</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                    <span class="text-[10px] text-gray-300">Moderate</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-[10px] text-gray-300">Low</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                    <span class="text-[10px] text-gray-300">You</span>
                </div>
            </div>
        </div>

        <!-- Satellite Toggle -->
        <div class="absolute top-[120px] left-5 z-10 glass-card rounded-2xl p-2 flex flex-col gap-2">
            <div class="w-9 h-9 bg-blue-500/30 rounded-xl flex items-center justify-center">
                <i class="fas fa-satellite text-blue-400 text-sm"></i>
            </div>
            <div class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center">
                <i class="fas fa-wind text-gray-400 text-sm"></i>
            </div>
            <div class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center">
                <i class="fas fa-temperature-half text-gray-400 text-sm"></i>
            </div>
        </div>

        <!-- Bottom Info Card -->
        <div class="absolute bottom-20 left-5 right-5 z-10">
            <div class="glass-card rounded-2xl p-4">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-red-500/20 rounded-xl flex items-center justify-center">
                        <i class="fas fa-fire text-red-400"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-semibold">Basin Extraction Site #4</p>
                        <p class="text-xs text-gray-400">3.2 km · Continuous flaring</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-red-400">HIGH</p>
                        <p class="text-[10px] text-gray-500">Intensity</p>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 rounded-xl p-2 text-center">
                        <p class="text-sm font-bold text-white">4.2</p>
                        <p class="text-[9px] text-gray-400">CH₄ ppm</p>
                    </div>
                    <div class="bg-white/5 rounded-xl p-2 text-center">
                        <p class="text-sm font-bold text-white">72h</p>
                        <p class="text-[9px] text-gray-400">Duration</p>
                    </div>
                    <div class="bg-white/5 rounded-xl p-2 text-center">
                        <p class="text-sm font-bold text-white">156</p>
                        <p class="text-[9px] text-gray-400">AQI Impact</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="absolute bottom-0 left-0 right-0 z-20 bg-[#0a0f1a]/95 backdrop-blur-xl border-t border-white/5">
            <div class="flex items-center justify-around py-2 pb-7">
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-home text-gray-500"></i>
                    <span class="text-[10px] text-gray-500">Home</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-map text-blue-400"></i>
                    <span class="text-[10px] text-blue-400 font-medium">Map</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-bell text-gray-500"></i>
                    <span class="text-[10px] text-gray-500">Alerts</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-chart-line text-gray-500"></i>
                    <span class="text-[10px] text-gray-500">Trends</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <i class="fas fa-user text-gray-500"></i>
                    <span class="text-[10px] text-gray-500">Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
