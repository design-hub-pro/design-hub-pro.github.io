<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Glow &amp; Grow</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <i class="fa-solid fa-chevron-left text-[20px]"></i>
    <h1 class="font-display font-bold text-[19px]">Glow &amp; Grow</h1>
    <span class="chip bg-violet-50 text-violet-600 py-1"><i class="fa-solid fa-gem"></i>+15</span>
  </div>

  <!-- Artwork with pinned notes -->
  <div class="mx-[28px] mt-4 h-[400px] rounded-[28px] overflow-hidden relative" style="background:#FFF4C2">
    <img src="assets/sneakers.jpg" class="w-full h-full object-cover">
    <!-- pins -->
    <div class="absolute left-[150px] top-[226px]"><div class="w-9 h-9 rounded-full bg-[#FFB800] border-[3px] border-white shadow-lg flex items-center justify-center text-white text-[13px]"><i class="fa-solid fa-sun"></i></div></div>
    <div class="absolute left-[270px] top-[282px]"><div class="w-9 h-9 rounded-full bg-[#16C47F] border-[3px] border-white shadow-lg flex items-center justify-center text-white text-[13px]"><i class="fa-solid fa-seedling"></i></div></div>
    <div class="absolute left-[64px] top-[300px] flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-white border-[3px] border-[#5865F2] shadow-lg flex items-center justify-center text-[#5865F2] text-[13px] animate-pulse"><i class="fa-solid fa-plus"></i></div></div>
    <div class="absolute top-3 left-3 flex items-center gap-2 glass rounded-full pl-1 pr-3 py-1 text-white text-[12.5px] font-semibold"><img src="assets/av3.jpg" class="w-7 h-7 rounded-full object-cover">Ava's custom kicks</div>
  </div>

  <!-- Notes -->
  <div class="px-c mt-4 space-y-2.5">
    <div class="card p-3.5 flex gap-3 border-l-[5px] border-[#FFB800]">
      <img src="assets/av2.jpg" class="w-9 h-9 rounded-full object-cover">
      <div class="flex-1"><p class="text-[12px] font-bold text-amber-600">GLOW</p><p class="text-[14.5px] mt-0.5">The character on the side is so clean. Line weight is perfect.</p></div>
    </div>
    <div class="card p-3.5 flex gap-3 border-l-[5px] border-[#16C47F]">
      <img src="assets/av5.jpg" class="w-9 h-9 rounded-full object-cover">
      <div class="flex-1"><p class="text-[12px] font-bold text-emerald-600">GROW</p><p class="text-[14.5px] mt-0.5">Toe area feels busy. Maybe one bold color there?</p></div>
    </div>
  </div>

  <!-- Composer -->
  <div class="mx-[28px] mt-3 card p-3">
    <div class="grid grid-cols-2 gap-2">
      <span class="h-10 rounded-[12px] bg-amber-50 text-amber-700 font-bold text-[14px] flex items-center justify-center gap-2 ring-2 ring-amber-300"><i class="fa-solid fa-sun"></i>Glow</span>
      <span class="h-10 rounded-[12px] bg-gray-50 text-gray-500 font-bold text-[14px] flex items-center justify-center gap-2"><i class="fa-solid fa-seedling"></i>Grow</span>
    </div>
    <div class="mt-2 h-11 rounded-[12px] bg-gray-50 px-3.5 flex items-center text-[14.5px] text-gray-400">Love how the colors…<span class="ml-auto w-8 h-8 rounded-full bg-[#15121C] text-white flex items-center justify-center text-[12px]"><i class="fa-solid fa-arrow-up"></i></span></div>
  </div>
</div></div></body></html>
