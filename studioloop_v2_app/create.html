<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Post</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <i class="fa-solid fa-xmark text-[22px] text-gray-500"></i>
    <h1 class="font-display font-bold text-[19px]">New post</h1>
    <span class="text-[15px] font-semibold text-gray-300">Drafts</span>
  </div>

  <!-- Post type -->
  <div class="hscroll mt-4 gap-2">
    <span class="chip bg-[#15121C] text-white px-4 py-2.5"><i class="fa-solid fa-image"></i>Photo</span>
    <span class="chip card text-gray-600 px-4 py-2.5"><i class="fa-solid fa-music"></i>Track</span>
    <span class="chip card text-gray-600 px-4 py-2.5"><i class="fa-solid fa-video"></i>Clip</span>
    <span class="chip card text-gray-600 px-4 py-2.5"><i class="fa-solid fa-square-poll-horizontal"></i>Poll</span>
    <span class="chip card text-gray-600 px-4 py-2.5"><i class="fa-solid fa-images"></i>Dump</span>
  </div>

  <!-- Canvas with stickers -->
  <div class="mx-[28px] mt-4 h-[380px] rounded-[28px] overflow-hidden relative">
    <img src="assets/cartoon2.jpg" class="w-full h-full object-cover">
    <span class="absolute top-6 left-5 sticker g-toon text-[#15121C] -rotate-6 text-[15px]">chef mode</span>
    <span class="absolute bottom-20 right-5 sticker bg-white text-[#FF4FA3] rotate-6 text-[15px]"><i class="fa-solid fa-heart"></i>OC #3</span>
    <div class="absolute bottom-3 left-3 right-3 flex gap-2">
      <div class="flex-1 h-11 rounded-[14px] glass text-white flex items-center justify-center gap-2 text-[13.5px] font-semibold"><i class="fa-solid fa-note-sticky"></i>Stickers</div>
      <div class="flex-1 h-11 rounded-[14px] glass text-white flex items-center justify-center gap-2 text-[13.5px] font-semibold"><i class="fa-solid fa-font"></i>Text</div>
      <div class="flex-1 h-11 rounded-[14px] glass text-white flex items-center justify-center gap-2 text-[13.5px] font-semibold"><i class="fa-solid fa-crop-simple"></i>Crop</div>
    </div>
  </div>

  <!-- Club picker -->
  <p class="px-c mt-5 text-[14px] font-bold">Post to</p>
  <div class="px-c mt-2.5 flex flex-wrap gap-2">
    <span class="chip g-toon text-[#15121C]"><i class="fa-solid fa-check"></i>Cartoons</span>
    <span class="chip g-art text-white"><i class="fa-solid fa-check"></i>Art</span>
    <span class="chip card text-gray-600">Food</span>
    <span class="chip card text-gray-600">Pets</span>
  </div>

  <!-- Toggles -->
  <div class="mx-[28px] mt-4 card divide-y divide-gray-100">
    <div class="p-3.5 flex items-center gap-3"><div class="w-10 h-10 rounded-[14px] g-grape text-white flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles"></i></div><p class="flex-1 font-bold text-[15px]">Ask for Glow &amp; Grow</p>
      <div class="w-[52px] h-[32px] rounded-full bg-[#34C759] relative"><span class="absolute right-[3px] top-[3px] w-[26px] h-[26px] rounded-full bg-white shadow"></span></div></div>
    <div class="p-3.5 flex items-center gap-3"><div class="w-10 h-10 rounded-[14px] g-sky text-white flex items-center justify-center"><i class="fa-solid fa-shuffle"></i></div><p class="flex-1 font-bold text-[15px]">Others can remix</p>
      <div class="w-[52px] h-[32px] rounded-full bg-gray-200 relative"><span class="absolute left-[3px] top-[3px] w-[26px] h-[26px] rounded-full bg-white shadow"></span></div></div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-c pt-4 pb-9 bg-gradient-to-t from-[#FBF9F6] via-[#FBF9F6] to-transparent z-40">
  <a class="btn text-white" style="background:#15121C"><i class="fa-solid fa-paper-plane"></i>Post<span class="chip bg-white/15 py-1 ml-1"><i class="fa-solid fa-gem text-violet-300"></i>+20</span></a>
</div>
</div></body></html>
