<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · House Cup</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <h1 class="font-display font-extrabold text-[32px]">House Cup</h1>
    <span class="chip bg-amber-50 text-amber-700"><i class="fa-regular fa-clock"></i>Week 6 of 8</span>
  </div>

  <!-- Podium -->
  <div class="mx-[28px] mt-4 rounded-[30px] p-5 pb-0 text-white relative overflow-hidden" style="background:linear-gradient(160deg,#2B2366,#15121C)">
    <div class="absolute -top-10 -right-10 w-48 h-48 rounded-full bg-[#FF4FA3]/25 blur-3xl"></div>
    <div class="grid grid-cols-3 items-end gap-2.5 relative">
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-[18px] g-sky flex items-center justify-center text-[22px] border-[3px] border-white/20"><i class="fa-solid fa-water"></i></div>
        <p class="font-bold text-[14px] mt-2">Waves</p><p class="text-[12px] text-white/50">3,920</p>
        <div class="w-full h-[78px] mt-2 rounded-t-[16px] flex items-start justify-center pt-2 font-display font-extrabold text-[24px]" style="background:rgba(255,255,255,.1)">2</div>
      </div>
      <div class="flex flex-col items-center">
        <i class="fa-solid fa-crown text-[#FFB800] text-[22px] mb-1"></i>
        <div class="w-[68px] h-[68px] rounded-[22px] g-anime flex items-center justify-center text-[28px] border-[3px] border-white shadow-xl"><i class="fa-solid fa-meteor"></i></div>
        <p class="font-bold text-[15px] mt-2">Comets</p><p class="text-[12px] text-white/60">4,310</p>
        <div class="w-full h-[112px] mt-2 rounded-t-[16px] flex items-start justify-center pt-2 font-display font-extrabold text-[28px] g-anime">1</div>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-14 h-14 rounded-[18px] g-games flex items-center justify-center text-[22px] border-[3px] border-white/20"><i class="fa-solid fa-leaf"></i></div>
        <p class="font-bold text-[14px] mt-2">Moss</p><p class="text-[12px] text-white/50">3,105</p>
        <div class="w-full h-[56px] mt-2 rounded-t-[16px] flex items-start justify-center pt-2 font-display font-extrabold text-[22px]" style="background:rgba(255,255,255,.1)">3</div>
      </div>
    </div>
  </div>
  <p class="px-c mt-2.5 text-[12.5px] text-gray-400"><i class="fa-solid fa-circle-info mr-1"></i>Points from posts, Glows and events. Teams, not individuals.</p>

  <!-- My contribution -->
  <div class="mx-[28px] mt-4 card p-4 flex items-center gap-4">
    <img src="assets/av1.jpg" class="w-12 h-12 rounded-full object-cover">
    <div class="flex-1"><p class="text-[13px] text-gray-500">You added this week</p><p class="font-display font-extrabold text-[28px] leading-none mt-0.5 c-anime">+185</p></div>
    <span class="sticker bg-[#FFB800] text-[#15121C] rotate-3 text-[12px]">Top 10%</span>
  </div>

  <!-- Quests -->
  <div class="px-c mt-6 flex items-end justify-between"><h2 class="font-display font-bold text-[20px]">Weekly quests</h2><span class="text-[13px] font-semibold text-gray-400">2 / 4</span></div>
  <div class="px-c mt-3 space-y-2.5">
    <div class="card p-3.5 flex items-center gap-3.5">
      <div class="w-11 h-11 rounded-[14px] g-games text-white flex items-center justify-center"><i class="fa-solid fa-check"></i></div>
      <div class="flex-1"><p class="font-bold text-[15px] line-through text-gray-400">Post to a prompt</p></div><span class="text-[13px] font-bold text-gray-300">+50</span>
    </div>
    <div class="card p-3.5 flex items-center gap-3.5">
      <div class="w-11 h-11 rounded-[14px] g-toon text-[#15121C] flex items-center justify-center"><i class="fa-solid fa-sun"></i></div>
      <div class="flex-1"><p class="font-bold text-[15px]">Give 5 Glows</p><div class="mt-1.5 bar"><span class="g-toon" style="width:60%"></span></div></div><span class="text-[13px] font-bold c-toon">+40</span>
    </div>
    <div class="card p-3.5 flex items-center gap-3.5">
      <div class="w-11 h-11 rounded-[14px] g-music text-white flex items-center justify-center"><i class="fa-solid fa-hand-holding-heart"></i></div>
      <div class="flex-1"><p class="font-bold text-[15px]">Welcome a new member</p><div class="mt-1.5 bar"><span style="width:0"></span></div></div><span class="text-[13px] font-bold c-music">+60</span>
    </div>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-compass"></i>Clubs</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab on"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
