<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Anime Club</title></head><body>
<div class="screen"><div class="scroll">
  <div class="relative h-[300px]">
    <img src="assets/anime1.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 30%">
    <div class="absolute inset-0 bg-gradient-to-t from-[#FBF9F6] via-black/10 to-black/40"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="px-c mt-1 flex justify-between text-white">
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-regular fa-bell"></i></div>
    </div>
  </div>
  <div class="px-c -mt-16 relative">
    <div class="flex items-end justify-between">
      <div class="w-[78px] h-[78px] rounded-[24px] g-anime flex items-center justify-center text-white text-[30px] border-4 border-[#FBF9F6] shadow-lg"><i class="fa-solid fa-star"></i></div>
      <a class="chip bg-[#15121C] text-white px-4 py-2.5 text-[14px] mb-1"><i class="fa-solid fa-check"></i>Joined</a>
    </div>
    <h1 class="font-display font-extrabold text-[32px] mt-3 leading-none">Anime Club</h1>
    <div class="mt-2.5 flex items-center gap-2.5"><div class="avs"><img src="assets/av1.jpg" class="!w-7 !h-7"><img src="assets/av3.jpg" class="!w-7 !h-7"><img src="assets/av5.jpg" class="!w-7 !h-7"><img src="assets/av2.jpg" class="!w-7 !h-7"></div><span class="text-[13.5px] font-semibold text-gray-500">164 · <span class="text-emerald-600">9 online</span></span></div>
  </div>

  <!-- Segments -->
  <div class="mx-[28px] mt-5 p-1 rounded-[16px] bg-[#EFEBF3] grid grid-cols-3 text-center text-[14px] font-bold">
    <span class="py-2.5 rounded-[12px] bg-white shadow-sm">Posts</span><span class="py-2.5 text-gray-500">Watch party</span><span class="py-2.5 text-gray-500">Fan art</span>
  </div>

  <!-- Watch party vote -->
  <div class="mx-[28px] mt-4 card p-4">
    <div class="flex items-center justify-between"><p class="font-bold text-[16px]"><i class="fa-solid fa-tv c-anime mr-1.5"></i>Friday watch party</p><span class="text-[12.5px] font-semibold text-gray-400">vote closes 6pm</span></div>
    <div class="mt-3.5 space-y-2.5">
      <div class="relative h-11 rounded-[14px] overflow-hidden bg-pink-50"><span class="absolute inset-y-0 left-0 g-anime opacity-90" style="width:64%"></span><div class="relative h-full px-3.5 flex items-center justify-between text-[14px] font-bold text-white"><span><i class="fa-solid fa-circle-check mr-1.5"></i>Studio film night</span><span>64%</span></div></div>
      <div class="relative h-11 rounded-[14px] overflow-hidden bg-pink-50"><span class="absolute inset-y-0 left-0 bg-pink-200" style="width:36%"></span><div class="relative h-full px-3.5 flex items-center justify-between text-[14px] font-bold"><span>Ep 1–3 marathon</span><span class="text-gray-500">36%</span></div></div>
    </div>
  </div>

  <!-- Spoiler post -->
  <div class="mx-[28px] mt-4 card overflow-hidden">
    <div class="p-3.5 flex items-center gap-3"><img src="assets/av3.jpg" class="w-9 h-9 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14.5px]">Ava R.</p><p class="text-[12px] text-gray-400">Fan art · 20m</p></div><span class="chip bg-amber-50 text-amber-700 py-1 text-[11.5px]"><i class="fa-solid fa-eye-slash"></i>Spoiler: Ep 12</span></div>
    <div class="h-[190px] relative overflow-hidden">
      <img src="assets/anime2.jpg" class="absolute inset-0 w-full h-full object-cover spoiler">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-white"><div class="w-12 h-12 rounded-full glass-w flex items-center justify-center text-[18px]"><i class="fa-solid fa-eye"></i></div><p class="font-bold text-[14px] mt-2">Tap to reveal</p></div>
    </div>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab on"><i class="fa-solid fa-compass"></i>Clubs</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
