<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · For you</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center gap-5">
    <h1 class="font-display font-extrabold text-[28px]">For you</h1>
    <span class="font-display font-bold text-[20px] text-gray-300">Friends</span>
    <span class="font-display font-bold text-[20px] text-gray-300">New</span>
  </div>

  <!-- Photo dump carousel -->
  <div class="mx-[28px] mt-4 card overflow-hidden">
    <div class="p-3.5 flex items-center gap-3"><img src="assets/av4.jpg" class="w-9 h-9 rounded-full object-cover"><div class="flex-1"><p class="font-bold text-[14.5px]">Leo M. <span class="font-semibold text-gray-400">in</span> <span class="c-life">Pets</span></p><p class="text-[12px] text-gray-400">Photo dump · 4</p></div><i class="fa-solid fa-ellipsis text-gray-400"></i></div>
    <div class="h-[300px] relative">
      <img src="assets/pet.jpg" class="w-full h-full object-cover">
      <span class="absolute top-3 right-3 chip glass text-white py-1">1/4</span>
      <span class="absolute bottom-4 left-4 sticker bg-white text-[#FF7A1A] -rotate-3">Mochi does homework</span>
      <div class="absolute bottom-3 right-4 flex gap-1"><span class="w-4 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/60"></span><span class="w-1.5 h-1.5 rounded-full bg-white/60"></span><span class="w-1.5 h-1.5 rounded-full bg-white/60"></span></div>
    </div>
    <!-- Sticker reactions -->
    <div class="p-3.5 flex items-center gap-2">
      <span class="chip bg-orange-50 text-orange-600 py-1.5"><i class="fa-solid fa-cat"></i>48</span>
      <span class="chip bg-pink-50 text-pink-600 py-1.5"><i class="fa-solid fa-heart"></i>31</span>
      <span class="chip bg-sky-50 text-sky-600 py-1.5"><i class="fa-solid fa-face-laugh-squint"></i>22</span>
      <span class="chip bg-gray-100 text-gray-500 py-1.5"><i class="fa-solid fa-plus"></i></span>
      <span class="ml-auto text-[13px] font-semibold text-gray-400"><i class="fa-regular fa-comment mr-1"></i>9</span>
    </div>
  </div>

  <!-- Game clip -->
  <div class="mx-[28px] mt-4 rounded-[24px] overflow-hidden relative h-[210px]">
    <img src="assets/game3.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20"></div>
    <div class="absolute inset-0 flex items-center justify-center"><div class="w-16 h-16 rounded-full glass-w flex items-center justify-center text-white text-[22px]"><i class="fa-solid fa-play ml-1"></i></div></div>
    <span class="absolute top-3 left-3 chip g-games text-white py-1"><i class="fa-solid fa-gamepad"></i>Games</span>
    <span class="absolute top-3 right-3 chip glass text-white py-1">0:42</span>
    <div class="absolute bottom-3 left-4 right-4 flex items-center gap-2 text-white"><img src="assets/av5.jpg" class="w-7 h-7 rounded-full object-cover border-2 border-white"><p class="font-bold text-[14px] flex-1">Boss beaten with 1 HP</p><span class="text-[13px] font-semibold"><i class="fa-solid fa-fire text-orange-400"></i> 112</span></div>
  </div>

  <!-- Poll -->
  <div class="mx-[28px] mt-4 card p-4">
    <div class="flex items-center gap-2"><span class="chip g-life text-white py-1 text-[11.5px]"><i class="fa-solid fa-utensils"></i>Food</span><span class="text-[12.5px] text-gray-400 font-semibold">214 votes</span></div>
    <p class="font-display font-bold text-[19px] mt-2.5">Best lunch this week?</p>
    <div class="mt-3 grid grid-cols-3 gap-2">
      <div class="relative h-[96px] rounded-[16px] overflow-hidden ring-[3px] ring-[#FF7A1A]"><img src="assets/food.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 left-1.5 chip bg-white text-[#FF7A1A] py-0.5 text-[12px] font-extrabold">61%</span></div>
      <div class="relative h-[96px] rounded-[16px] overflow-hidden"><img src="assets/cartoon2.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 left-1.5 chip bg-white/90 py-0.5 text-[12px] font-bold">27%</span></div>
      <div class="relative h-[96px] rounded-[16px] overflow-hidden"><img src="assets/crochet.jpg" class="w-full h-full object-cover"><span class="absolute bottom-1.5 left-1.5 chip bg-white/90 py-0.5 text-[12px] font-bold">12%</span></div>
    </div>
  </div>
</div>
<nav class="tabbar">
<div class="tab on"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-compass"></i>Clubs</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
