<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Game Night</title></head><body>
<div class="screen" style="background:#0E0C16"><div class="scroll">
  <div class="relative h-[400px]">
    <img src="assets/game2.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-[#0E0C16] via-[#0E0C16]/20 to-black/40"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="px-c mt-1 flex justify-between items-center text-white">
      <div class="w-11 h-11 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
      <span class="chip bg-red-500 text-white"><span class="dot bg-white !w-2 !h-2"></span>LIVE · Round 2 of 3</span>
    </div>
    <div class="absolute bottom-5 left-[28px] right-[28px] text-white">
      <span class="sticker g-games text-white -rotate-2"><i class="fa-solid fa-cube"></i>Build Battle</span>
      <h1 class="font-display font-extrabold text-[38px] leading-none mt-3">Sky Castles</h1>
      <p class="text-[14px] text-white/60 mt-2">Theme drops every round · 20 min builds</p>
    </div>
  </div>

  <!-- Round timer -->
  <div class="px-c flex items-center gap-3 text-white">
    <i class="fa-solid fa-stopwatch text-[#4BE59D]"></i>
    <div class="flex-1 h-2.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,.1)"><span class="block h-full rounded-full g-games" style="width:62%"></span></div>
    <span class="font-display font-extrabold text-[18px]">07:42</span>
  </div>

  <!-- Teams scoreboard -->
  <div class="mx-[28px] mt-5 rounded-[26px] p-4 text-white" style="background:#1A1726">
    <div class="grid grid-cols-[1fr_auto_1fr] items-center">
      <div>
        <p class="text-[12px] font-bold text-sky-300">TEAM BLUE</p>
        <p class="font-display font-extrabold text-[40px] leading-none mt-1">2</p>
        <div class="avs mt-2"><img src="assets/av1.jpg" class="!w-7 !h-7 !border-[#1A1726]"><img src="assets/av2.jpg" class="!w-7 !h-7 !border-[#1A1726]"><img src="assets/av5.jpg" class="!w-7 !h-7 !border-[#1A1726]"></div>
      </div>
      <div class="w-11 h-11 rounded-full flex items-center justify-center font-display font-extrabold text-[14px] text-white/50" style="background:rgba(255,255,255,.06)">VS</div>
      <div class="text-right">
        <p class="text-[12px] font-bold text-rose-300">TEAM RED</p>
        <p class="font-display font-extrabold text-[40px] leading-none mt-1 text-white/60">1</p>
        <div class="avs mt-2 justify-end"><img src="assets/av3.jpg" class="!w-7 !h-7 !border-[#1A1726]"><img src="assets/av4.jpg" class="!w-7 !h-7 !border-[#1A1726]"><img src="assets/av1.jpg" class="!w-7 !h-7 !border-[#1A1726]"></div>
      </div>
    </div>
  </div>

  <!-- Up next -->
  <p class="px-c mt-6 text-[13px] font-bold text-white/40 tracking-wider">UP NEXT</p>
  <div class="hscroll mt-3">
    <div class="w-[200px] rounded-[22px] overflow-hidden relative h-[120px]"><img src="assets/game3.jpg" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div><p class="absolute bottom-2.5 left-3 text-white font-bold text-[14px]">Pixel Art Speedrun<br><span class="text-[11.5px] font-semibold text-white/60">Sat · 3:00 PM</span></p></div>
    <div class="w-[200px] rounded-[22px] overflow-hidden relative h-[120px]"><img src="assets/game1.jpg" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div><p class="absolute bottom-2.5 left-3 text-white font-bold text-[14px]">Library Party Games<br><span class="text-[11.5px] font-semibold text-white/60">Wed · lunch</span></p></div>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-c pt-5 pb-9 bg-gradient-to-t from-[#0E0C16] via-[#0E0C16] to-transparent z-40 flex gap-3">
  <a class="btn flex-1 text-white" style="background:#5865F2"><i class="fa-brands fa-discord"></i>Watch on stage</a>
  <a class="btn w-[58px] text-white" style="background:#1A1726"><i class="fa-solid fa-face-grin-stars"></i></a>
</div>
</div></body></html>
