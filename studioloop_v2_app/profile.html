<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Me</title></head><body>
<div class="screen"><div class="scroll">
  <div class="relative h-[210px]">
    <img src="assets/anime2.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 25%">
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 to-transparent"></div>
    <div class="status light"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
    <div class="absolute top-[66px] right-[28px] flex gap-2">
      <div class="h-11 px-4 rounded-full glass text-white flex items-center gap-2 text-[13.5px] font-semibold"><i class="fa-solid fa-pen"></i>Customize</div>
    </div>
  </div>
  <div class="px-c -mt-14 relative flex items-end gap-3">
    <div class="relative">
      <div class="p-[4px] rounded-[34px]" style="background:conic-gradient(#FF4FA3,#FFB800,#16C47F,#5865F2,#FF4FA3)"><img src="assets/av1.jpg" class="w-[100px] h-[100px] rounded-[30px] object-cover border-4 border-[#FBF9F6]"></div>
      <span class="absolute -bottom-1 -right-2 sticker g-anime text-white text-[11px] py-0.5 px-2 rotate-6">L8</span>
    </div>
    <div class="mb-2 flex-1 flex justify-end"><span class="sticker bg-[#FFB800] text-[#15121C] -rotate-3"><i class="fa-solid fa-fire"></i>12-day streak</span></div>
  </div>
  <div class="px-c mt-3">
    <h1 class="font-display font-extrabold text-[30px] leading-none">Mina Cho</h1>
    <p class="text-[14px] text-gray-400 mt-1.5">@minadraws · Grade 8 · House Comets</p>
  </div>

  <!-- Now status -->
  <div class="mx-[28px] mt-4 card p-3 flex items-center gap-3">
    <img src="assets/anime1.jpg" class="w-12 h-12 rounded-[14px] object-cover">
    <div class="flex-1"><p class="text-[11.5px] font-bold c-anime tracking-wide">NOW WATCHING</p><p class="font-bold text-[15px]">Rain City, ep 9</p></div>
    <div class="w-10 h-10 rounded-full bg-pink-50 c-anime flex items-center justify-center"><i class="fa-solid fa-hand-sparkles"></i></div>
  </div>

  <!-- Stats -->
  <div class="mx-[28px] mt-3 card p-5 grid grid-cols-3 divide-x divide-gray-100 text-center">
    <div><p class="font-display font-extrabold text-[32px] leading-none">37</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Posts</p></div>
    <div><p class="font-display font-extrabold text-[32px] leading-none c-games">58</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Glows given</p></div>
    <div><p class="font-display font-extrabold text-[32px] leading-none c-music">9</p><p class="text-[12px] font-semibold text-gray-400 mt-1.5">Events</p></div>
  </div>

  <!-- Sticker book -->
  <div class="px-c mt-6 flex items-end justify-between"><h2 class="font-display font-bold text-[20px]">Sticker book</h2><span class="text-[13px] font-semibold text-gray-400">14 / 40</span></div>
  <div class="px-c mt-3 grid grid-cols-5 gap-2.5">
    <div class="aspect-square rounded-[18px] g-anime flex items-center justify-center text-white text-[22px] -rotate-6 shadow-md border-[3px] border-white"><i class="fa-solid fa-star"></i></div>
    <div class="aspect-square rounded-[18px] g-games flex items-center justify-center text-white text-[22px] rotate-3 shadow-md border-[3px] border-white"><i class="fa-solid fa-cube"></i></div>
    <div class="aspect-square rounded-[18px] g-toon flex items-center justify-center text-[#15121C] text-[22px] -rotate-3 shadow-md border-[3px] border-white"><i class="fa-solid fa-frog"></i></div>
    <div class="aspect-square rounded-[18px] g-life flex items-center justify-center text-white text-[22px] rotate-6 shadow-md border-[3px] border-white"><i class="fa-solid fa-cat"></i></div>
    <div class="aspect-square rounded-[18px] bg-gray-100 flex items-center justify-center text-gray-300 text-[20px] border-2 border-dashed border-gray-200"><i class="fa-solid fa-question"></i></div>
  </div>

  <!-- My stuff -->
  <div class="px-c mt-6 grid grid-cols-3 gap-2">
    <img src="assets/cartoon2.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
    <img src="assets/art2.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
    <img src="assets/food.jpg" class="w-full h-[120px] rounded-[16px] object-cover">
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab"><i class="fa-solid fa-compass"></i>Clubs</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab on"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
