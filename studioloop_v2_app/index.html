<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Loop 2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#15121C}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2a33,#0c0b10);box-shadow:0 50px 80px -30px rgba(40,30,90,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#FBF9F6}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#FF4FA3,#FFB800 55%,#16C47F)"><i class="fa-solid fa-infinity text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight" style="font-family:'Bricolage Grotesque'">Studio Loop 2.0</h1>
  <p class="mt-3 text-[19px] text-gray-500">Anime, games, art, music, pets and lunch. One school Discord, clubs for everything students love.</p>
  <div class="mt-6 flex gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-pink-50 text-pink-600">Grades 6–12</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Discord</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Interest Clubs</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Safe by Default</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="clubs.html" scrolling="no" title="clubs"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="club.html" scrolling="no" title="club"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="gamenight.html" scrolling="no" title="gamenight"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="feed.html" scrolling="no" title="feed"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="create.html" scrolling="no" title="create"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="glowgrow.html" scrolling="no" title="glowgrow"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="events.html" scrolling="no" title="events"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="profile.html" scrolling="no" title="profile"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="housecup.html" scrolling="no" title="housecup"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pulse.html" scrolling="no" title="pulse"></iframe></div></div>
</div></main>
</body></html>
