<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Clubs</title></head><body>
<div class="screen"><div class="scroll">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1"><h1 class="font-display font-extrabold text-[32px]">Clubs</h1></div>
  <div class="mx-[28px] mt-3 h-12 rounded-[16px] card flex items-center gap-3 px-4 text-gray-400 text-[15px]"><i class="fa-solid fa-magnifying-glass"></i>Find a club or start one</div>

  <!-- Featured -->
  <div class="mx-[28px] mt-5 h-[220px] rounded-[28px] overflow-hidden relative">
    <img src="assets/anime2.jpg" class="absolute inset-0 w-full h-full object-cover" style="object-position:50% 40%">
    <div class="absolute inset-0 bg-gradient-to-r from-black/75 via-black/30 to-transparent"></div>
    <span class="absolute top-4 right-4 sticker bg-[#FFB800] text-[#15121C] rotate-6">Most active</span>
    <div class="absolute bottom-5 left-5 text-white">
      <span class="chip g-anime py-1 text-white"><i class="fa-solid fa-star"></i>Anime</span>
      <p class="font-display font-extrabold text-[28px] mt-2 leading-none">Anime Club</p>
      <div class="mt-3 flex items-center gap-2"><div class="avs"><img src="assets/av1.jpg" class="!w-7 !h-7"><img src="assets/av3.jpg" class="!w-7 !h-7"><img src="assets/av5.jpg" class="!w-7 !h-7"></div><span class="text-[13px] font-semibold">164 members · <span class="text-emerald-300">9 online</span></span></div>
    </div>
  </div>

  <!-- Grid -->
  <div class="px-c mt-4 grid grid-cols-2 gap-3">
    <div class="h-[170px] rounded-[24px] overflow-hidden relative"><img src="assets/game2.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/75 to-transparent"></div>
      <span class="absolute top-3 right-3 chip bg-red-500 text-white py-0.5 text-[11px]"><span class="dot bg-white !w-1.5 !h-1.5"></span>LIVE</span>
      <div class="absolute bottom-3 left-3.5 text-white"><p class="font-display font-extrabold text-[19px]">Games</p><p class="text-[12px] text-white/70">198 members</p></div></div>
    <div class="h-[170px] rounded-[24px] overflow-hidden relative" style="background:#FFF4C2"><img src="assets/cartoon1.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      <div class="absolute bottom-3 left-3.5 text-white"><p class="font-display font-extrabold text-[19px]">Cartoons</p><p class="text-[12px] text-white/80">87 members</p></div></div>
    <div class="h-[170px] rounded-[24px] overflow-hidden relative"><img src="assets/art1.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/75 to-transparent"></div>
      <div class="absolute bottom-3 left-3.5 text-white"><p class="font-display font-extrabold text-[19px]">Art</p><p class="text-[12px] text-white/70">231 members</p></div></div>
    <div class="h-[170px] rounded-[24px] overflow-hidden relative"><img src="assets/music1.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/75 to-transparent"></div>
      <div class="absolute bottom-3 left-3.5 text-white"><p class="font-display font-extrabold text-[19px]">Music</p><p class="text-[12px] text-white/70">142 members</p></div></div>
  </div>

  <!-- Everyday life row -->
  <div class="px-c mt-6 flex items-end justify-between"><h2 class="font-display font-bold text-[20px]">Everyday life</h2><span class="text-[13px] font-semibold text-gray-400">6 clubs</span></div>
  <div class="hscroll mt-3 pb-2">
    <div class="w-[118px]"><img src="assets/pet.jpg" class="w-[118px] h-[118px] rounded-[22px] object-cover"><p class="font-bold text-[14px] mt-2">Pets</p><p class="text-[12px] text-gray-400">203</p></div>
    <div class="w-[118px]"><img src="assets/study.jpg" class="w-[118px] h-[118px] rounded-[22px] object-cover"><p class="font-bold text-[14px] mt-2">Study hall</p><p class="text-[12px] text-gray-400">119</p></div>
    <div class="w-[118px]"><img src="assets/sneakers.jpg" class="w-[118px] h-[118px] rounded-[22px] object-cover"><p class="font-bold text-[14px] mt-2">Fits &amp; kicks</p><p class="text-[12px] text-gray-400">96</p></div>
    <div class="w-[118px]"><img src="assets/crochet.jpg" class="w-[118px] h-[118px] rounded-[22px] object-cover"><p class="font-bold text-[14px] mt-2">Crafts</p><p class="text-[12px] text-gray-400">74</p></div>
  </div>
</div>
<nav class="tabbar">
<div class="tab"><i class="fa-solid fa-house"></i>Home</div>
<div class="tab on"><i class="fa-solid fa-compass"></i>Clubs</div>
<div class="tab plus"><div class="fab"><i class="fa-solid fa-plus"></i></div></div>
<div class="tab"><i class="fa-solid fa-calendar"></i>Events</div>
<div class="tab"><i class="fa-solid fa-user"></i>Me</div>
</nav>
</div></body></html>
