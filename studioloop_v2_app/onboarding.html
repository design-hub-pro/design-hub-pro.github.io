<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><title>Studio Loop · Pick your vibes</title></head><body>
<div class="screen"><div class="scroll" style="padding-bottom:150px">
  <div class="status"><span>9:41</span><div class="island"></div><div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i></div></div>
  <div class="px-c pt-1 flex items-center justify-between">
    <div class="flex gap-1.5"><span class="w-7 h-1.5 rounded-full bg-[#15121C]"></span><span class="w-7 h-1.5 rounded-full bg-[#15121C]"></span><span class="w-7 h-1.5 rounded-full bg-gray-200"></span></div>
    <span class="chip bg-indigo-50 text-[#4752C4]"><i class="fa-brands fa-discord"></i>Connected</span>
  </div>
  <h1 class="px-c mt-5 font-display font-extrabold text-[38px] leading-[1.02]">What are you<br>into?</h1>
  <p class="px-c mt-2 text-[15px] text-gray-500">Pick 3 or more. We'll fill your feed.</p>

  <!-- Bento of vibes -->
  <div class="px-c mt-5 grid grid-cols-6 gap-2.5 auto-rows-[112px]">
    <div class="col-span-4 row-span-2 rounded-[24px] overflow-hidden relative ring-[3px] ring-[#FF4FA3] ring-offset-2">
      <img src="assets/anime1.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
      <span class="absolute top-3 right-3 w-8 h-8 rounded-full g-anime flex items-center justify-center text-white text-[14px] border-2 border-white"><i class="fa-solid fa-check"></i></span>
      <p class="absolute bottom-3 left-3.5 text-white font-display font-extrabold text-[24px]">Anime</p>
    </div>
    <div class="col-span-2 row-span-2 rounded-[24px] overflow-hidden relative ring-[3px] ring-[#16C47F] ring-offset-2">
      <img src="assets/game3.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
      <span class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full g-games flex items-center justify-center text-white text-[12px] border-2 border-white"><i class="fa-solid fa-check"></i></span>
      <p class="absolute bottom-3 left-3 text-white font-display font-extrabold text-[19px]">Games</p>
    </div>
    <div class="col-span-2 rounded-[22px] overflow-hidden relative" style="background:#FFF4C2">
      <img src="assets/cartoon1.jpg" class="absolute inset-0 w-full h-full object-cover scale-110">
      <p class="absolute bottom-2 left-3 font-display font-extrabold text-[15px] text-[#15121C]">Cartoons</p>
    </div>
    <div class="col-span-2 rounded-[22px] overflow-hidden relative ring-[3px] ring-[#FF5A5F] ring-offset-2">
      <img src="assets/art2.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      <span class="absolute top-2 right-2 w-6 h-6 rounded-full g-art flex items-center justify-center text-white text-[10px] border-2 border-white"><i class="fa-solid fa-check"></i></span>
      <p class="absolute bottom-2 left-3 font-display font-extrabold text-[15px] text-white">Art</p>
    </div>
    <div class="col-span-2 rounded-[22px] overflow-hidden relative">
      <img src="assets/music2.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      <p class="absolute bottom-2 left-3 font-display font-extrabold text-[15px] text-white">Music</p>
    </div>
    <div class="col-span-3 rounded-[22px] overflow-hidden relative ring-[3px] ring-[#FF7A1A] ring-offset-2">
      <img src="assets/pet.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      <span class="absolute top-2 right-2 w-6 h-6 rounded-full g-life flex items-center justify-center text-white text-[10px] border-2 border-white"><i class="fa-solid fa-check"></i></span>
      <p class="absolute bottom-2 left-3 font-display font-extrabold text-[15px] text-white">Pets</p>
    </div>
    <div class="col-span-3 rounded-[22px] overflow-hidden relative">
      <img src="assets/food.jpg" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      <p class="absolute bottom-2 left-3 font-display font-extrabold text-[15px] text-white">Food</p>
    </div>
  </div>
  <div class="px-c mt-3 flex flex-wrap gap-2">
    <span class="chip card text-gray-700"><i class="fa-solid fa-book-open text-sky-500"></i>Study vibes</span>
    <span class="chip card text-gray-700"><i class="fa-solid fa-shoe-prints text-pink-500"></i>Fits</span>
    <span class="chip card text-gray-700"><i class="fa-solid fa-scissors text-emerald-500"></i>Crafts</span>
    <span class="chip card text-gray-700"><i class="fa-solid fa-person-skating text-orange-500"></i>Skate</span>
  </div>
</div>
<div class="absolute left-0 right-0 bottom-0 px-c pt-5 pb-9 bg-gradient-to-t from-[#FBF9F6] via-[#FBF9F6] to-transparent z-40">
  <a class="btn text-white" style="background:#15121C">Let's go<span class="flex gap-1 ml-1"><span class="dot g-anime"></span><span class="dot g-games"></span><span class="dot g-art"></span><span class="dot g-life"></span></span></a>
  <p class="text-center text-[12.5px] text-gray-400 mt-3"><i class="fa-solid fa-shield-heart mr-1"></i>Under 13? Join with a school account instead</p>
</div>
</div></body></html>
