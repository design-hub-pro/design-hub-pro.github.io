<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeAura - Use Case Diagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 95%;
            max-width: 1400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #831843;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SafeAura System Use Case Diagram</h1>
        <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
            <defs>
                <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="contactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="responderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="systemBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000020"/>
                </filter>
            </defs>

            <!-- System Boundary -->
            <rect x="280" y="30" width="640" height="640" rx="20" fill="url(#systemBg)" stroke="#db2777" stroke-width="3" stroke-dasharray="10,5"/>
            <text x="600" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#831843">SafeAura Personal Safety System</text>

            <!-- Actor: User (Female) -->
            <g transform="translate(80, 200)">
                <circle cx="50" cy="25" r="22" fill="url(#userGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="47" x2="50" y2="90" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="25" y2="80" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="75" y2="80" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="30" y2="125" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="70" y2="125" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">User</text>
                <text x="50" y="168" text-anchor="middle" font-size="12" fill="#9d174d">(Woman)</text>
            </g>

            <!-- Actor: Emergency Contact -->
            <g transform="translate(1070, 150)">
                <circle cx="50" cy="25" r="22" fill="url(#contactGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="47" x2="50" y2="90" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="25" y2="80" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="75" y2="80" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="30" y2="125" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="70" y2="125" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Emergency</text>
                <text x="50" y="168" text-anchor="middle" font-size="12" fill="#7c3aed">Contact</text>
            </g>

            <!-- Actor: First Responder -->
            <g transform="translate(1070, 420)">
                <circle cx="50" cy="25" r="22" fill="url(#responderGrad)" filter="url(#shadow)"/>
                <line x1="50" y1="47" x2="50" y2="90" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="25" y2="80" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="60" x2="75" y2="80" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="30" y2="125" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <line x1="50" y1="90" x2="70" y2="125" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
                <text x="50" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">First</text>
                <text x="50" y="168" text-anchor="middle" font-size="12" fill="#dc2626">Responder</text>
            </g>

            <!-- Use Cases -->
            <!-- UC1: Wear Device -->
            <ellipse cx="420" cy="110" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Wear Discreet Device</text>

            <!-- UC2: One-Touch SOS -->
            <ellipse cx="420" cy="195" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Activate One-Touch</text>
            <text x="420" y="206" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">SOS</text>

            <!-- UC3: Secret Code Activation -->
            <ellipse cx="420" cy="280" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Use Secret Code</text>
            <text x="420" y="291" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Activation</text>

            <!-- UC4: Monitor Status -->
            <ellipse cx="420" cy="365" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="360" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Monitor Safety</text>
            <text x="420" y="376" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Status</text>

            <!-- UC5: Multimodal Detection -->
            <ellipse cx="600" cy="195" rx="110" ry="40" fill="#fdf2f8" stroke="#be185d" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Multimodal Risk</text>
            <text x="600" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Detection</text>

            <!-- UC6: Motion Analysis -->
            <ellipse cx="780" cy="110" rx="90" ry="32" fill="white" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="115" text-anchor="middle" font-size="12" fill="#9d174d">Motion Analysis</text>

            <!-- UC7: Audio Recognition -->
            <ellipse cx="780" cy="180" rx="90" ry="32" fill="white" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="185" text-anchor="middle" font-size="12" fill="#9d174d">Audio Recognition</text>

            <!-- UC8: Location Context -->
            <ellipse cx="780" cy="250" rx="90" ry="32" fill="white" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="245" text-anchor="middle" font-size="12" fill="#9d174d">Location/Time</text>
            <text x="780" y="261" text-anchor="middle" font-size="12" fill="#9d174d">Context</text>

            <!-- UC9: AI Threat Classification -->
            <ellipse cx="600" cy="320" rx="110" ry="40" fill="#fdf2f8" stroke="#be185d" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">AI Threat</text>
            <text x="600" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Classification</text>

            <!-- UC10: Send Alert -->
            <ellipse cx="600" cy="430" rx="110" ry="40" fill="#fef2f2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
            <text x="600" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Send Emergency</text>
            <text x="600" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Alert</text>

            <!-- UC11: Share Location -->
            <ellipse cx="780" cy="390" rx="90" ry="32" fill="white" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="395" text-anchor="middle" font-size="12" fill="#b91c1c">Share Live Location</text>

            <!-- UC12: Transmit Evidence -->
            <ellipse cx="780" cy="460" rx="90" ry="32" fill="white" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="455" text-anchor="middle" font-size="12" fill="#b91c1c">Transmit Audio/</text>
            <text x="780" y="471" text-anchor="middle" font-size="12" fill="#b91c1c">Sensor Data</text>

            <!-- UC13: Receive Alert -->
            <ellipse cx="600" cy="530" rx="100" ry="35" fill="white" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="600" y="525" text-anchor="middle" font-size="13" font-weight="500" fill="#5b21b6">Receive Alert</text>
            <text x="600" y="541" text-anchor="middle" font-size="13" font-weight="500" fill="#5b21b6">Notification</text>

            <!-- UC14: View Live Status -->
            <ellipse cx="420" cy="530" rx="100" ry="35" fill="white" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="525" text-anchor="middle" font-size="13" font-weight="500" fill="#5b21b6">View Live</text>
            <text x="420" y="541" text-anchor="middle" font-size="13" font-weight="500" fill="#5b21b6">Status/Location</text>

            <!-- UC15: Contact Authorities -->
            <ellipse cx="780" cy="530" rx="90" ry="32" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
            <text x="780" y="525" text-anchor="middle" font-size="12" fill="#b91c1c">Contact</text>
            <text x="780" y="541" text-anchor="middle" font-size="12" fill="#b91c1c">Authorities</text>

            <!-- UC16: Manage Contacts -->
            <ellipse cx="420" cy="450" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="445" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Manage Emergency</text>
            <text x="420" y="461" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Contacts</text>

            <!-- UC17: Configure Device -->
            <ellipse cx="420" cy="615" rx="100" ry="35" fill="white" stroke="#db2777" stroke-width="2.5" filter="url(#shadow)"/>
            <text x="420" y="610" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Configure Device</text>
            <text x="420" y="626" text-anchor="middle" font-size="13" font-weight="500" fill="#831843">Settings</text>

            <!-- Connection Lines - User to Use Cases -->
            <line x1="165" y1="280" x2="320" y2="115" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="300" x2="320" y2="195" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="320" x2="320" y2="280" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="340" x2="320" y2="365" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="360" x2="320" y2="450" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="380" x2="320" y2="530" stroke="#db2777" stroke-width="2"/>
            <line x1="165" y1="400" x2="320" y2="615" stroke="#db2777" stroke-width="2"/>

            <!-- Include relationships -->
            <line x1="520" y1="195" x2="490" y2="195" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="520" y1="280" x2="502" y2="240" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="475" y="220" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <line x1="710" y1="180" x2="690" y2="192" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="710" y1="210" x2="690" y2="200" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="710" y1="240" x2="690" y2="210" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

            <line x1="600" y1="235" x2="600" y2="280" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="605" y="262" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <line x1="600" y1="360" x2="600" y2="390" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="605" y="378" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

            <line x1="710" y1="420" x2="690" y2="425" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
            <line x1="710" y1="450" x2="690" y2="440" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

            <line x1="600" y1="470" x2="600" y2="495" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

            <!-- Emergency Contact connections -->
            <line x1="1070" y1="250" x2="870" y2="390" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="1070" y1="270" x2="700" y2="520" stroke="#8b5cf6" stroke-width="2"/>
            <line x1="1070" y1="290" x2="520" y2="520" stroke="#8b5cf6" stroke-width="2"/>

            <!-- First Responder connections -->
            <line x1="1070" y1="500" x2="870" y2="525" stroke="#ef4444" stroke-width="2"/>
            <line x1="1070" y1="520" x2="700" y2="535" stroke="#ef4444" stroke-width="2"/>

            <!-- Legend -->
            <rect x="300" y="680" width="600" height="1" fill="#e5e7eb"/>
            <g transform="translate(320, 700)">
                <ellipse cx="40" cy="12" rx="35" ry="12" fill="white" stroke="#db2777" stroke-width="2"/>
                <text x="95" y="17" font-size="11" fill="#666">Primary Use Case</text>

                <ellipse cx="230" cy="12" rx="35" ry="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
                <text x="285" y="17" font-size="11" fill="#666">Core System Function</text>

                <ellipse cx="430" cy="12" rx="35" ry="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
                <text x="485" y="17" font-size="11" fill="#666">Emergency Action</text>
            </g>
        </svg>
    </div>
</body>
</html>
