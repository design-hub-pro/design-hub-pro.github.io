<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoinTale — Scan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  *::-webkit-scrollbar{display:none;}
  html,body{height:100%;}
  body{background:#000;color:#fff;scrollbar-width:none;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;z-index:40;}
  .statusbar .time{font-size:15px;font-weight:700;}
  .statusbar .icons{display:flex;gap:7px;font-size:14px;}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:35px;background:#000;border-radius:20px;}
  .grad-gold{background:linear-gradient(135deg,#C99B2E,#E8C766);}
  .ring{width:300px;height:300px;border-radius:50%;position:relative;}
  .ring::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid rgba(232,199,102,0.9);box-shadow:0 0 40px rgba(232,199,102,0.45),inset 0 0 40px rgba(232,199,102,0.18);}
  .pulse{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.5;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
  .scanline{position:absolute;left:14px;right:14px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#E8C766,transparent);animation:scan 2.6s ease-in-out infinite;}
  @keyframes scan{0%,100%{top:18%;}50%{top:80%;}}
</style>
</head>
<body>
<!-- Camera viewport -->
<div class="absolute inset-0">
  <img src="https://images.unsplash.com/photo-1554672723-d42a16e533db?w=900&h=1400&fit=crop" class="w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/45"></div>
</div>

<div class="relative z-10 h-full flex flex-col">
  <div class="statusbar">
    <span class="time">9:41</span>
    <div class="island"></div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- Top controls -->
  <div class="flex items-center justify-between" style="padding:8px 28px 0;">
    <button class="w-10 h-10 rounded-full bg-black/45 backdrop-blur flex items-center justify-center"><i class="fas fa-xmark"></i></button>
    <div class="bg-black/45 backdrop-blur px-4 py-2 rounded-full flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-[#E8C766] pulse"></span>
      <span class="text-[12px] font-semibold">Identifying…</span>
    </div>
    <button class="w-10 h-10 rounded-full bg-black/45 backdrop-blur flex items-center justify-center"><i class="fas fa-bolt"></i></button>
  </div>

  <!-- Viewfinder -->
  <div class="flex-1 flex flex-col items-center justify-center">
    <div class="ring flex items-center justify-center">
      <img src="https://images.unsplash.com/photo-1518458028785-8fbcd101ebb9?w=600&h=600&fit=crop" class="w-[264px] h-[264px] rounded-full object-cover">
      <div class="scanline"></div>
      <!-- corner ticks -->
      <span class="absolute -top-5 left-1/2 -translate-x-1/2 text-[#E8C766] text-xs"><i class="fas fa-caret-down"></i></span>
      <span class="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[#E8C766] text-xs"><i class="fas fa-caret-up"></i></span>
    </div>
    <div class="mt-7 bg-black/55 backdrop-blur px-5 py-2.5 rounded-full">
      <p class="text-[13px] font-semibold text-white/85"><i class="fas fa-circle-info text-[#E8C766] mr-2"></i>Align the coin inside the circle</p>
    </div>
  </div>

  <!-- Match card -->
  <div style="padding:0 28px 26px;">
    <div class="bg-white rounded-[26px] p-4 text-[#141B2D]" style="box-shadow:0 -10px 50px rgba(0,0,0,0.45);">
      <div class="flex items-center gap-4">
        <img src="https://images.unsplash.com/photo-1518458028785-8fbcd101ebb9?w=160&h=160&fit=crop" class="w-16 h-16 rounded-2xl object-cover flex-shrink-0">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <p class="text-[11px] font-bold text-emerald-600 uppercase tracking-wide">Match found · 96%</p>
          </div>
          <h3 class="text-[17px] font-extrabold leading-tight mt-0.5 truncate">1921 Morgan Silver Dollar</h3>
          <p class="text-xs text-gray-400 font-medium">United States · Silver · Philadelphia Mint</p>
        </div>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full mt-3.5 overflow-hidden"><div class="h-full grad-gold rounded-full" style="width:96%"></div></div>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 bg-[#141B2D] text-white text-[13px] font-bold py-3 rounded-2xl"><i class="fas fa-book-open mr-1.5"></i>View its story</button>
        <button class="flex-1 grad-gold text-[#1A2238] text-[13px] font-extrabold py-3 rounded-2xl"><i class="fas fa-shield-halved mr-1.5"></i>Verify it</button>
      </div>
    </div>

    <!-- Bottom camera controls -->
    <div class="flex items-center justify-center gap-12 mt-6">
      <button class="w-11 h-11 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fas fa-images text-lg"></i></button>
      <div class="w-[74px] h-[74px] rounded-full border-4 border-white flex items-center justify-center"><div class="w-[58px] h-[58px] rounded-full bg-white"></div></div>
      <button class="w-11 h-11 rounded-full bg-white/15 backdrop-blur flex items-center justify-center"><i class="fas fa-rotate text-lg"></i></button>
    </div>
  </div>
</div>
</body>
</html>
