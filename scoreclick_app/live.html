<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Live Hole</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body class="!bg-[#0B0E14]"><div class="screen text-white">
<div class="absolute inset-x-0 top-0 h-[430px]"><img src="img/range.jpg" class="w-full h-full object-cover opacity-70"><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,14,20,.35),rgba(11,14,20,1) 96%)"></div></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>3:52</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-half text-[15px]"></i></span></div>
<div class="content relative">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-chevron-down"></i></div>
    <div class="chip glass"><span class="relative flex w-2 h-2"><span class="absolute inset-0 rounded-full c-pen ping"></span><span class="relative w-2 h-2 rounded-full c-pen"></span></span>LIVE · Match</div>
    <div class="w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-ellipsis"></i></div>
  </div>
  <div class="mt-8 flex items-end justify-between">
    <div><div class="text-white/60 text-[14px] font-semibold">Hole</div><div class="num text-[64px] font-bold leading-none">14</div></div>
    <div class="text-right"><div class="flex gap-2 justify-end"><span class="chip glass">Par <span class="num">4</span></span><span class="chip glass"><span class="num">362</span> yd</span></div><div class="mt-2 text-[13px] text-white/60">Round <span class="num text-white font-bold">+2</span> thru 13</div></div>
  </div>

  <!-- big counter -->
  <div class="mt-6 rounded-[30px] bg-white/[.06] border border-white/10 p-6">
    <div class="flex items-center justify-between">
      <div><div class="label !text-white/50">This hole</div><div class="num text-[96px] font-bold leading-[.9] mt-1">3</div></div>
      <div class="relative w-[128px] h-[128px] flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-[#FF5A1F]/20 ping"></div>
        <div class="absolute inset-3 rounded-full border-2 border-[#FF5A1F]/40"></div>
        <div class="w-[84px] h-[84px] rounded-full grad-brand flex items-center justify-center text-[30px] shadow-[0_0_40px_rgba(255,90,31,.5)]"><i class="fa-solid fa-hand-pointer"></i></div>
      </div>
    </div>
    <div class="mt-5 grid grid-cols-3 gap-3 text-center">
      <div class="rounded-2xl bg-white/[.06] py-3"><div class="num text-[28px] font-bold t-stroke">2</div><div class="text-[11px] text-white/50 font-semibold">STROKES</div></div>
      <div class="rounded-2xl bg-white/[.06] py-3"><div class="num text-[28px] font-bold text-[#6EA0FF]">1</div><div class="text-[11px] text-white/50 font-semibold">PUTTS</div></div>
      <div class="rounded-2xl bg-white/[.06] py-3"><div class="num text-[28px] font-bold text-white/30">0</div><div class="text-[11px] text-white/50 font-semibold">PENALTY</div></div>
    </div>
  </div>

  <!-- live feed -->
  <div class="mt-6 label !text-white/50">Live feed</div>
  <div class="mt-3 space-y-2.5">
    <div class="flex items-center gap-3 rounded-2xl bg-[#10B981]/15 border border-[#10B981]/40 p-3.5">
      <div class="w-10 h-10 rounded-xl bg-[#10B981]/25 flex items-center justify-center t-swing"><i class="fa-solid fa-wave-square"></i></div>
      <div class="flex-1"><div class="font-semibold text-[15px]">Putt stroke sensed</div><div class="text-[12px] text-white/50">Waiting for your click</div></div>
      <div class="flex gap-1"><span class="w-2 h-2 rounded-full c-swing ping"></span></div>
    </div>
    <div class="flex items-center gap-3 rounded-2xl bg-white/[.05] p-3.5">
      <div class="w-10 h-10 rounded-xl grad-blue flex items-center justify-center"><i class="fa-solid fa-flag"></i></div>
      <div class="flex-1"><div class="font-semibold text-[15px]">First putt</div><div class="text-[12px] text-white/50">Double click · 3:51</div></div>
      <i class="fa-solid fa-circle-check text-emerald-400"></i>
    </div>
    <div class="flex items-center gap-3 rounded-2xl bg-white/[.05] p-3.5">
      <div class="w-10 h-10 rounded-xl grad-brand flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee"></i></div>
      <div class="flex-1"><div class="font-semibold text-[15px]">Approach</div><div class="text-[12px] text-white/50">Swing + click · 3:48</div></div>
      <i class="fa-solid fa-circle-check text-emerald-400"></i>
    </div>
  </div>
</div>
<div class="tab-bar dark"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-table-cells"></i>Card</div><div class="tab"><div class="tab-click !border-[#0B0E14]"><i class="fa-solid fa-hand-pointer"></i></div></div><div class="tab"><i class="fa-solid fa-brain"></i>Patterns</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind light"></div>
</div></body></html>
