<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Team Match</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Coach view</div><h1 class="text-[28px] font-extrabold tracking-tight">Varsity match</h1></div>
    <img src="img/coach.jpg" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow">
  </div>

  <div class="mt-5 rounded-[28px] overflow-hidden relative h-[200px]">
    <img src="img/swing.jpg" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(11,14,20,.92) 35%,rgba(11,14,20,.2))"></div>
    <div class="absolute inset-0 p-5 text-white flex flex-col justify-between">
      <div class="chip glass self-start"><span class="relative flex w-2 h-2"><span class="absolute inset-0 rounded-full c-pen ping"></span><span class="relative w-2 h-2 rounded-full c-pen"></span></span>Live · Back 9</div>
      <div class="flex items-end gap-6">
        <div><div class="text-[12px] text-white/60 font-semibold">Team total</div><div class="num text-[44px] font-bold leading-none">162</div></div>
        <div class="pb-1"><div class="text-[12px] text-white/60 font-semibold">Lakeside</div><div class="num text-[26px] font-bold leading-none text-white/70">168</div></div>
        <div class="chip bg-emerald-500 text-white mb-1 ml-auto"><i class="fa-solid fa-arrow-up"></i><span class="num">6</span></div>
      </div>
    </div>
  </div>

  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="card p-3 text-center"><div class="num text-[28px] font-bold">5</div><div class="text-[11px] text-gray-500 font-semibold">ON COURSE</div></div>
    <div class="card p-3 text-center"><div class="num text-[28px] font-bold text-emerald-600">3</div><div class="text-[11px] text-gray-500 font-semibold">SUBMITTED</div></div>
    <div class="card p-3 text-center"><div class="num text-[28px] font-bold text-amber-500">2</div><div class="text-[11px] text-gray-500 font-semibold">FLAGS</div></div>
  </div>

  <div class="mt-6 flex items-center justify-between"><div class="text-[18px] font-bold">Players</div><div class="text-[13px] font-semibold text-gray-400">Thru · Score</div></div>
  <div class="mt-3 space-y-2.5">
    <div class="card p-3.5 flex items-center gap-3">
      <img src="img/av1.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><div class="font-bold text-[15px]">Maya Chen</div><div class="bar mt-1.5 w-[120px]"><span class="grad-brand" style="width:100%"></span></div></div>
      <span class="dot c-warn"></span><span class="num text-[13px] text-gray-400 w-6 text-center">F</span><span class="num font-bold text-[20px] w-9 text-right">39</span>
    </div>
    <div class="card p-3.5 flex items-center gap-3">
      <img src="img/golfer.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><div class="font-bold text-[15px]">Jordan Lee</div><div class="bar mt-1.5 w-[120px]"><span class="grad-brand" style="width:100%"></span></div></div>
      <span class="dot c-ok"></span><span class="num text-[13px] text-gray-400 w-6 text-center">F</span><span class="num font-bold text-[20px] w-9 text-right">38</span>
    </div>
    <div class="card p-3.5 flex items-center gap-3">
      <img src="img/av2.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><div class="font-bold text-[15px]">Sam Ortiz</div><div class="bar mt-1.5 w-[120px]"><span class="grad-brand" style="width:78%"></span></div></div>
      <span class="dot c-swing ping"></span><span class="num text-[13px] text-gray-400 w-6 text-center">16</span><span class="num font-bold text-[20px] w-9 text-right">35</span>
    </div>
    <div class="card p-3.5 flex items-center gap-3">
      <img src="img/parent.jpg" class="w-11 h-11 rounded-full object-cover">
      <div class="flex-1"><div class="font-bold text-[15px]">Ava Patel</div><div class="bar mt-1.5 w-[120px]"><span class="grad-brand" style="width:56%"></span></div></div>
      <span class="dot c-warn"></span><span class="num text-[13px] text-gray-400 w-6 text-center">14</span><span class="num font-bold text-[20px] w-9 text-right">27</span>
    </div>
  </div>
  <div class="mt-4 btn grad-ink text-white"><i class="fa-solid fa-file-export"></i>Export match cards</div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-table-cells"></i>Card</div><div class="tab"><div class="tab-click"><i class="fa-solid fa-hand-pointer"></i></div></div><div class="tab"><i class="fa-solid fa-brain"></i>Patterns</div><div class="tab active"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
