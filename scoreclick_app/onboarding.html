<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen bg-black">
<img src="img/maya.jpg" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,14,20,.15) 0%,rgba(11,14,20,.25) 35%,rgba(11,14,20,.96) 70%)"></div>
<div class="dynamic-island"></div>
<div class="status-bar light"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[15px]"></i></span></div>
<div class="absolute top-[78px] left-7 flex items-center gap-2.5">
  <div class="w-10 h-10 rounded-xl grad-brand flex items-center justify-center text-white"><i class="fa-solid fa-hand-pointer"></i></div>
  <span class="text-white font-extrabold text-[20px] tracking-tight">ScoreClick</span>
</div>
<!-- floating clicker widget -->
<div class="absolute top-[250px] right-7 glass rounded-[26px] p-4 w-[188px] text-white">
  <div class="flex items-center gap-2 text-[12px] font-semibold text-white/70"><span class="relative flex w-2.5 h-2.5"><span class="absolute inset-0 rounded-full c-swing ping"></span><span class="relative w-2.5 h-2.5 rounded-full c-swing"></span></span>Swing detected</div>
  <div class="mt-3 flex items-end gap-1 h-10">
    <span class="w-1.5 rounded bg-white/25" style="height:20%"></span><span class="w-1.5 rounded bg-white/25" style="height:30%"></span><span class="w-1.5 rounded bg-white/40" style="height:55%"></span><span class="w-1.5 rounded bg-emerald-400" style="height:100%"></span><span class="w-1.5 rounded bg-emerald-400" style="height:85%"></span><span class="w-1.5 rounded bg-white/40" style="height:45%"></span><span class="w-1.5 rounded bg-white/25" style="height:25%"></span><span class="w-1.5 rounded bg-white/25" style="height:15%"></span><span class="w-1.5 rounded bg-white/25" style="height:20%"></span><span class="w-1.5 rounded bg-white/25" style="height:12%"></span>
  </div>
  <div class="mt-3 flex items-center justify-between"><span class="text-[13px] font-semibold">Click to confirm</span><span class="w-8 h-8 rounded-full grad-brand flex items-center justify-center text-[13px]"><i class="fa-solid fa-check"></i></span></div>
</div>
<div class="absolute bottom-0 left-0 right-0 px-7 pb-12 text-white">
  <div class="flex gap-2 mb-5">
    <span class="chip glass"><span class="dot c-stroke"></span>Stroke</span>
    <span class="chip glass"><span class="dot c-putt"></span>Putt</span>
    <span class="chip glass"><span class="dot c-pen"></span>Penalty</span>
  </div>
  <h1 class="text-[42px] leading-[1.05] font-extrabold tracking-tight">Swing.<br>Click.<br><span class="text-[#FF7A3D]">No pencil.</span></h1>
  <p class="mt-4 text-[17px] text-white/70 leading-snug">A clicker on your belt counts every shot. Your phone builds the card.</p>
  <div class="mt-7 flex items-center gap-2"><span class="w-7 h-1.5 rounded-full bg-white"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span><span class="w-1.5 h-1.5 rounded-full bg-white/40"></span></div>
  <div class="mt-6 btn grad-brand text-white shadow-lg shadow-orange-900/40">Pair my ScoreClick <i class="fa-solid fa-arrow-right"></i></div>
  <div class="mt-4 text-center text-[14px] text-white/60">I already have an account</div>
</div>
<div class="home-ind light"></div>
</div></body></html>
