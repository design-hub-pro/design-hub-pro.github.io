<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Pair</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[15px]"></i></span></div>
<div class="content full">
  <div class="flex items-center justify-between mt-2">
    <div class="w-10 h-10 rounded-full bg-white card flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="flex gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span><span class="w-7 h-1.5 rounded-full bg-[#FF5A1F]"></span><span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span></div>
    <div class="w-10"></div>
  </div>
  <h1 class="mt-6 text-[30px] font-extrabold tracking-tight leading-tight">Found your clicker</h1>
  <p class="text-[15px] text-gray-500 mt-1">Clip it on the left hip, button facing up.</p>

  <!-- device render -->
  <div class="mt-6 relative h-[300px] rounded-[30px] grad-ink overflow-hidden flex items-center justify-center">
    <div class="absolute w-[260px] h-[260px] rounded-full border border-white/10"></div>
    <div class="absolute w-[190px] h-[190px] rounded-full border border-white/10"></div>
    <div class="absolute w-[150px] h-[150px] rounded-full bg-[#FF5A1F]/25 ping"></div>
    <div class="relative w-[118px] h-[168px] rounded-[38px] bg-gradient-to-b from-[#2A3140] to-[#151922] shadow-2xl border border-white/10 flex flex-col items-center pt-5">
      <div class="w-[3px] h-[24px] rounded-full bg-white/15 absolute -top-[10px]"></div>
      <div class="w-[78px] h-[78px] rounded-full grad-brand flex items-center justify-center shadow-[0_0_40px_rgba(255,90,31,.55)] border-4 border-[#1b202a]"><i class="fa-solid fa-hand-pointer text-white text-[26px]"></i></div>
      <div class="mt-5 flex gap-1.5"><span class="dot c-swing"></span><span class="dot bg-white/20"></span><span class="dot bg-white/20"></span></div>
      <div class="mt-3 text-[10px] font-bold tracking-[.2em] text-white/40">SC-01</div>
    </div>
    <div class="absolute top-4 left-4 chip glass text-white"><i class="fa-brands fa-bluetooth-b"></i>ScoreClick 4F2A</div>
    <div class="absolute top-4 right-4 chip glass text-white"><i class="fa-solid fa-battery-three-quarters text-emerald-400"></i><span class="num">92%</span></div>
    <div class="absolute bottom-4 left-4 right-4 flex justify-between text-[12px] text-white/60 font-semibold"><span><i class="fa-solid fa-wave-square text-emerald-400 mr-1"></i>IMU ready</span><span><i class="fa-solid fa-signal text-emerald-400 mr-1"></i>-48 dBm</span></div>
  </div>

  <div class="mt-6 flex items-center justify-between"><div class="text-[18px] font-bold">Your click language</div><div class="chip bg-orange-50 text-[#F2440F]"><i class="fa-solid fa-play text-[10px]"></i>Try it</div></div>
  <div class="mt-3 space-y-3">
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl grad-brand text-white flex items-center justify-center"><i class="fa-solid fa-golf-ball-tee"></i></div>
      <div class="flex-1"><div class="font-bold">Stroke</div><div class="text-[13px] text-gray-500">After a swing</div></div>
      <div class="flex gap-1.5"><span class="w-4 h-4 rounded-full c-stroke"></span></div>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl grad-blue text-white flex items-center justify-center"><i class="fa-solid fa-flag"></i></div>
      <div class="flex-1"><div class="font-bold">Putt</div><div class="text-[13px] text-gray-500">On the green</div></div>
      <div class="flex gap-1.5"><span class="w-4 h-4 rounded-full c-putt"></span><span class="w-4 h-4 rounded-full c-putt"></span></div>
    </div>
    <div class="card p-4 flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl grad-rose text-white flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="flex-1"><div class="font-bold">Penalty</div><div class="text-[13px] text-gray-500">Water, OB, drop</div></div>
      <div class="w-[52px] h-4 rounded-full c-pen"></div>
    </div>
  </div>
  <div class="mt-6 btn grad-brand text-white">Clip it on <i class="fa-solid fa-arrow-right"></i></div>
</div>
<div class="home-ind"></div>
</div></body></html>
