<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { background: #ffffff; }
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{margin:0;font-family:'Inter',sans-serif;color:#14181F}
.phones{display:grid;grid-template-columns:repeat(3,460px);gap:64px 56px;justify-content:center}
@media(max-width:1600px){.phones{grid-template-columns:repeat(2,460px)}}
@media(max-width:1060px){.phones{grid-template-columns:460px}}
.phone-frame{width:460px;height:980px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2c2f36,#0b0d11);box-shadow:0 50px 80px -30px rgba(20,24,31,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#F5F4EF}
.phone-screen iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<header class="flex flex-col items-center text-center pt-20 pb-16 px-6">
  <div class="w-16 h-16 rounded-2xl flex items-center justify-center bg-gradient-to-br from-orange-400 to-orange-600"><i class="fa-solid fa-hand-pointer text-white text-[26px]"></i></div>
  <h1 class="mt-6 text-[52px] font-extrabold tracking-tight">ScoreClick</h1>
  <p class="mt-3 text-[19px] text-gray-500">Junior golfers swing, click to confirm, and the phone builds a checked scorecard.</p>
  <div class="mt-6 flex flex-wrap justify-center gap-2 text-[13px] font-semibold">
    <span class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-700">Golf</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Wearable</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Motion Sensing</span>
    <span class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600">Mobile</span>
  </div>
</header>
<main class="pb-28 px-6"><div class="phones">
    <div class="phone-frame"><div class="phone-screen"><iframe src="onboarding.html" scrolling="no" title="onboarding"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="pair.html" scrolling="no" title="pair"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="home.html" scrolling="no" title="home"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="live.html" scrolling="no" title="live"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="timeline.html" scrolling="no" title="timeline"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="scorecard.html" scrolling="no" title="scorecard"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="review.html" scrolling="no" title="review"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="patterns.html" scrolling="no" title="patterns"></iframe></div></div>
    <div class="phone-frame"><div class="phone-screen"><iframe src="team.html" scrolling="no" title="team"></iframe></div></div>
</div></main>
</body></html>
