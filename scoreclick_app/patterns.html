<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Click Patterns</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="mt-2"><div class="text-[14px] text-gray-400 font-medium">Learned from 23 rounds</div><h1 class="text-[28px] font-extrabold tracking-tight">Your click habits</h1></div>

  <!-- accuracy hero -->
  <div class="mt-5 rounded-[28px] grad-ink text-white p-5">
    <div class="flex items-start justify-between">
      <div><div class="label !text-white/50">Clean cards</div><div class="num text-[48px] font-bold leading-none mt-1">96<span class="text-[22px] text-white/50">%</span></div><div class="text-[13px] text-emerald-400 font-semibold mt-1"><i class="fa-solid fa-arrow-up"></i> from 78% in round 1</div></div>
      <div class="chip bg-white/10"><i class="fa-solid fa-brain text-[#FF7A3D]"></i>Model v7</div>
    </div>
    <div class="mt-4 flex items-end gap-[5px] h-[70px]">
      <span class="flex-1 rounded-t bg-white/20" style="height:55%"></span><span class="flex-1 rounded-t bg-white/20" style="height:60%"></span><span class="flex-1 rounded-t bg-white/20" style="height:58%"></span><span class="flex-1 rounded-t bg-white/25" style="height:68%"></span><span class="flex-1 rounded-t bg-white/25" style="height:72%"></span><span class="flex-1 rounded-t bg-white/30" style="height:70%"></span><span class="flex-1 rounded-t bg-white/30" style="height:80%"></span><span class="flex-1 rounded-t bg-white/40" style="height:84%"></span><span class="flex-1 rounded-t bg-white/40" style="height:82%"></span><span class="flex-1 rounded-t bg-white/50" style="height:88%"></span><span class="flex-1 rounded-t bg-white/60" style="height:90%"></span><span class="flex-1 rounded-t grad-brand" style="height:96%"></span>
    </div>
    <div class="mt-2 flex justify-between text-[11px] text-white/40"><span>Sep</span><span>Oct</span><span>Nov</span></div>
  </div>

  <!-- click delay -->
  <div class="mt-4 card p-5">
    <div class="flex items-center justify-between"><div class="font-bold">Swing → click delay</div><div class="num font-bold text-[#FF5A1F]">2.4s <span class="text-gray-400 font-sans text-[12px] font-medium">median</span></div></div>
    <svg viewBox="0 0 320 90" class="mt-3 w-full h-[90px]">
      <rect x="64" y="0" width="96" height="74" rx="8" fill="#FFF1EA"/>
      <path d="M0 74 C30 74 50 70 70 50 C90 20 100 8 112 8 C126 8 140 30 160 52 C190 70 230 72 320 74" fill="none" stroke="#FF5A1F" stroke-width="3"/>
      <line x1="112" y1="8" x2="112" y2="74" stroke="#FF5A1F" stroke-dasharray="3 3"/>
      <circle cx="262" cy="73" r="5" fill="#F59E0B"/>
      <text x="0" y="88" font-size="10" fill="#9CA3AF">0s</text><text x="100" y="88" font-size="10" fill="#9CA3AF">2.4s</text><text x="296" y="88" font-size="10" fill="#9CA3AF">8s</text>
    </svg>
    <div class="mt-2 text-[12px] text-gray-500"><span class="dot c-warn mr-1"></span>Clicks after <span class="num font-semibold text-gray-700">6s</span> get a second look</div>
  </div>

  <!-- habit tiles -->
  <div class="mt-4 grid grid-cols-2 gap-4">
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-blue text-white flex items-center justify-center"><i class="fa-solid fa-flag"></i></div><div class="num text-[28px] font-bold mt-3 leading-none">1.8</div><div class="text-[12px] text-gray-500 mt-1">putts per green</div></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-green text-white flex items-center justify-center"><i class="fa-solid fa-person-walking"></i></div><div class="num text-[28px] font-bold mt-3 leading-none">1</div><div class="text-[12px] text-gray-500 mt-1">practice swing, every tee</div></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-amber text-white flex items-center justify-center"><i class="fa-solid fa-flag-checkered"></i></div><div class="num text-[28px] font-bold mt-3 leading-none">H17</div><div class="text-[12px] text-gray-500 mt-1">most missed click</div></div>
    <div class="card p-4"><div class="w-10 h-10 rounded-xl grad-rose text-white flex items-center justify-center"><i class="fa-solid fa-droplet"></i></div><div class="num text-[28px] font-bold mt-3 leading-none">0.6</div><div class="text-[12px] text-gray-500 mt-1">penalties per 9</div></div>
  </div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab"><i class="fa-solid fa-table-cells"></i>Card</div><div class="tab"><div class="tab-click"><i class="fa-solid fa-hand-pointer"></i></div></div><div class="tab active"><i class="fa-solid fa-brain"></i>Patterns</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
