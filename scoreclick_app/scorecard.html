<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreClick · Scorecard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>.row{display:grid;grid-template-columns:62px repeat(9,1fr);align-items:center}</style>
</head><body><div class="screen">
<div class="dynamic-island"></div>
<div class="status-bar"><span>9:41</span><span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters text-[15px]"></i></span></div>
<div class="content">
  <div class="flex items-center justify-between mt-2">
    <div><div class="text-[14px] text-gray-400 font-medium">Cedar Ridge GC · Back 9</div><h1 class="text-[28px] font-extrabold tracking-tight">Scorecard</h1></div>
    <div class="flex bg-white card !rounded-full p-1 text-[13px] font-semibold"><span class="px-3 py-1.5 text-gray-400">Out</span><span class="px-3 py-1.5 rounded-full grad-ink text-white">In</span></div>
  </div>

  <!-- totals hero -->
  <div class="mt-5 rounded-[28px] grad-ink text-white p-5 relative overflow-hidden">
    <img src="img/cup.jpg" class="absolute right-0 top-0 h-full w-[45%] object-cover opacity-50"><div class="absolute inset-0" style="background:linear-gradient(90deg,#11151d 50%,rgba(17,21,29,.2))"></div>
    <div class="relative flex items-end gap-6">
      <div><div class="label !text-white/50">Total</div><div class="num text-[64px] font-bold leading-none mt-1">39</div></div>
      <div class="pb-2"><div class="chip bg-[#FF5A1F] text-white"><span class="num">+3</span></div></div>
    </div>
    <div class="relative mt-4 flex gap-5 text-[13px]">
      <div><span class="num text-[22px] font-bold">16</span><div class="text-white/50">Putts</div></div>
      <div><span class="num text-[22px] font-bold">1</span><div class="text-white/50">Penalty</div></div>
      <div><span class="num text-[22px] font-bold">1</span><div class="text-white/50">Birdie</div></div>
      <div><span class="num text-[22px] font-bold text-amber-300">1</span><div class="text-white/50">Flag</div></div>
    </div>
  </div>

  <!-- card grid -->
  <div class="mt-4 card p-4">
    <div class="row text-[12px] font-bold text-gray-400 pb-2 border-b border-gray-100"><span>HOLE</span><span class="text-center">10</span><span class="text-center">11</span><span class="text-center">12</span><span class="text-center">13</span><span class="text-center">14</span><span class="text-center">15</span><span class="text-center">16</span><span class="text-center">17</span><span class="text-center">18</span></div>
    <div class="row text-[13px] text-gray-500 py-2 border-b border-gray-100 num"><span class="font-sans font-semibold">Par</span><span class="text-center">4</span><span class="text-center">3</span><span class="text-center">5</span><span class="text-center">4</span><span class="text-center">4</span><span class="text-center">3</span><span class="text-center">5</span><span class="text-center">4</span><span class="text-center">4</span></div>
    <div class="row py-2.5 border-b border-gray-100"><span class="text-[13px] font-bold">Maya</span>
      <span class="sc">4</span><span class="sc birdie">2</span><span class="sc bogey">6</span><span class="sc dbl">6</span><span class="sc bogey">5</span><span class="sc">3</span><span class="sc">5</span><span class="sc flag">4<sup class="text-[9px]">?</sup></span><span class="sc">4</span></div>
    <div class="row py-2.5 text-[13px] num"><span class="font-sans font-semibold text-gray-500">Putts</span>
      <span class="text-center t-putt font-bold">2</span><span class="text-center t-putt font-bold">1</span><span class="text-center t-putt font-bold">2</span><span class="text-center t-putt font-bold">2</span><span class="text-center t-putt font-bold">2</span><span class="text-center t-putt font-bold">2</span><span class="text-center t-putt font-bold">2</span><span class="text-center text-amber-500 font-bold">1</span><span class="text-center t-putt font-bold">2</span></div>
    <div class="row pt-1"><span class="text-[13px] font-semibold text-gray-500">Pen</span>
      <span></span><span></span><span></span><span class="text-center"><span class="dot c-pen"></span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="mt-3 flex gap-4 text-[12px] text-gray-500 justify-center">
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full border-2 border-rose-600"></span>Birdie</span>
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[3px] border-2 border-gray-800"></span>Bogey</span>
    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[3px] bg-amber-100 border border-amber-400"></span>Check</span>
  </div>

  <!-- marker sync -->
  <div class="mt-4 card p-4 flex items-center gap-4">
    <div class="flex -space-x-3"><img src="img/av1.jpg" class="w-11 h-11 rounded-full border-2 border-white object-cover"><img src="img/golfer.jpg" class="w-11 h-11 rounded-full border-2 border-white object-cover"></div>
    <div class="flex-1"><div class="font-bold text-[15px]">Marker: Jordan L.</div><div class="text-[12px] text-gray-500">8 of 9 holes agree</div></div>
    <div class="flex gap-1"><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-ok"></span><span class="dot c-warn"></span><span class="dot c-ok"></span></div>
  </div>
  <div class="mt-4 btn grad-brand text-white">Review 1 flag before submit <i class="fa-solid fa-arrow-right"></i></div>
</div>
<div class="tab-bar"><div class="tab"><i class="fa-solid fa-house"></i>Home</div><div class="tab active"><i class="fa-solid fa-table-cells"></i>Card</div><div class="tab"><div class="tab-click"><i class="fa-solid fa-hand-pointer"></i></div></div><div class="tab"><i class="fa-solid fa-brain"></i>Patterns</div><div class="tab"><i class="fa-solid fa-users"></i>Team</div></div><div class="home-ind"></div>
</div></body></html>
