<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneSpot AI - Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar: none;
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow-x: hidden;
        }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .status-bar {
            height: 59px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 8px;
            background: transparent;
            position: relative;
            z-index: 50;
        }
        .content-area {
            padding: 0 28px;
            padding-bottom: 40px;
        }
        .match-badge {
            background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
            border-radius: 12px;
            padding: 6px 12px;
        }
        .comparison-card {
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            overflow: hidden;
        }
        .location-info {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
        }
        .action-button {
            background: linear-gradient(135deg, #C44FFF 0%, #6B8AFF 100%);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            font-weight: 600;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="status-bar">
        <span class="text-sm font-medium">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-arrow-left text-lg"></i>
            </div>
            <div class="match-badge flex items-center gap-2">
                <i class="fas fa-check-circle text-sm"></i>
                <span class="text-sm font-semibold">98% Match</span>
            </div>
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-share-alt text-lg"></i>
            </div>
        </div>

        <!-- Comparison Images -->
        <div class="comparison-card mb-5">
            <div class="grid grid-cols-2 gap-0.5">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&q=80"
                         class="w-full h-36 object-cover" alt="Anime scene">
                    <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                        Your Scene
                    </div>
                </div>
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&q=80"
                         class="w-full h-36 object-cover" alt="Real location">
                    <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                        Real Location
                    </div>
                </div>
            </div>
            <div class="p-4">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xl">🎬</span>
                    <div>
                        <p class="font-semibold">Your Name (Kimi no Na wa)</p>
                        <p class="text-gray-400 text-xs">Directed by Makoto Shinkai</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Location Details -->
        <div class="location-info mb-5">
            <div class="flex items-start gap-3 mb-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-map-marker-alt text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold mb-1">Suga Shrine Steps</p>
                    <p class="text-gray-400 text-sm">Shinjuku City, Tokyo 160-0018</p>
                    <p class="text-purple-400 text-xs mt-1">Famous stairway from the final scene</p>
                </div>
            </div>

            <!-- Mini Map -->
            <div class="relative h-32 rounded-xl overflow-hidden mb-4">
                <img src="https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?w=600&q=80"
                     class="w-full h-full object-cover opacity-70" alt="Map">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-10 h-10 rounded-full bg-purple-500 flex items-center justify-center shadow-lg">
                        <i class="fas fa-location-dot text-white"></i>
                    </div>
                </div>
                <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm rounded-lg px-3 py-1.5 text-xs">
                    <i class="fas fa-directions mr-1"></i> 12 min walk
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-3">
                <div class="stat-card">
                    <p class="text-2xl font-bold text-purple-400">4.8</p>
                    <p class="text-gray-400 text-xs">Rating</p>
                </div>
                <div class="stat-card">
                    <p class="text-2xl font-bold text-pink-400">12k</p>
                    <p class="text-gray-400 text-xs">Visitors</p>
                </div>
                <div class="stat-card">
                    <p class="text-2xl font-bold text-blue-400">86</p>
                    <p class="text-gray-400 text-xs">Photos</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <div class="action-button flex items-center justify-center gap-2">
                <i class="fas fa-route"></i>
                <span>Plan Trip to This Location</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/10 rounded-xl p-4 text-center">
                    <i class="fas fa-bookmark text-lg mb-1"></i>
                    <p class="text-sm">Save</p>
                </div>
                <div class="bg-white/10 rounded-xl p-4 text-center">
                    <i class="fas fa-images text-lg mb-1"></i>
                    <p class="text-sm">More Scenes</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
