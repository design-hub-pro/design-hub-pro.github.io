<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneSpot AI - Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar: none;
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow-x: hidden;
        }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .status-bar {
            height: 59px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 8px;
            background: transparent;
            position: relative;
            z-index: 50;
        }
        .scan-frame {
            position: relative;
            width: 100%;
            height: 420px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 32px;
            overflow: hidden;
        }
        .corner-bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #C44FFF;
        }
        .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
        .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
        .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
        .scan-line {
            position: absolute;
            left: 30px;
            right: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #C44FFF, transparent);
            animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 30px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% - 30px); opacity: 0; }
        }
        .content-area {
            padding: 0 28px;
        }
        .upload-option {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(10px);
        }
        .option-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(196, 79, 255, 0.3);
            border-radius: 50%;
            animation: pulse-ring 2s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="status-bar">
        <span class="text-sm font-medium">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-times text-lg"></i>
            </div>
            <h1 class="text-lg font-semibold">Scan Scene</h1>
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-question text-lg"></i>
            </div>
        </div>

        <!-- Scan Frame -->
        <div class="scan-frame mb-6">
            <div class="corner-bracket corner-tl"></div>
            <div class="corner-bracket corner-tr"></div>
            <div class="corner-bracket corner-bl"></div>
            <div class="corner-bracket corner-br"></div>
            <div class="scan-line"></div>

            <!-- Center Icon -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="relative">
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring" style="animation-delay: 0.5s;"></div>
                    <div class="w-24 h-24 rounded-full bg-gradient-to-br from-purple-500/20 to-pink-500/20 backdrop-blur-xl flex items-center justify-center">
                        <i class="fas fa-film text-4xl text-purple-400"></i>
                    </div>
                </div>
            </div>

            <!-- Instructions -->
            <div class="absolute bottom-12 left-0 right-0 text-center">
                <p class="text-white/80 text-sm">Position the scene within the frame</p>
            </div>
        </div>

        <!-- Upload Options -->
        <div class="space-y-3 mb-8">
            <div class="upload-option">
                <div class="option-icon bg-gradient-to-br from-purple-500 to-pink-500">
                    <i class="fas fa-image text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium">Upload Screenshot</p>
                    <p class="text-gray-400 text-sm">From your gallery</p>
                </div>
                <i class="fas fa-chevron-right text-gray-500"></i>
            </div>

            <div class="upload-option">
                <div class="option-icon bg-gradient-to-br from-blue-500 to-cyan-500">
                    <i class="fas fa-paste text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium">Paste from Clipboard</p>
                    <p class="text-gray-400 text-sm">Quick paste screenshot</p>
                </div>
                <i class="fas fa-chevron-right text-gray-500"></i>
            </div>

            <div class="upload-option">
                <div class="option-icon bg-gradient-to-br from-orange-500 to-red-500">
                    <i class="fas fa-desktop text-xl"></i>
                </div>
                <div class="flex-1">
                    <p class="font-medium">Screen Capture</p>
                    <p class="text-gray-400 text-sm">Capture while watching</p>
                </div>
                <i class="fas fa-chevron-right text-gray-500"></i>
            </div>
        </div>

        <!-- Tips -->
        <div class="bg-gradient-to-r from-purple-500/10 to-pink-500/10 rounded-2xl p-4">
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-lightbulb text-purple-400 text-sm"></i>
                </div>
                <div>
                    <p class="font-medium text-sm mb-1">Pro Tip</p>
                    <p class="text-gray-400 text-xs leading-relaxed">For best results, capture scenes with distinctive landmarks, buildings, or landscapes.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
