<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneSpot AI - Saved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar: none;
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow-x: hidden;
        }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .status-bar {
            height: 59px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 8px;
            background: transparent;
            position: relative;
            z-index: 50;
        }
        .content-area {
            padding: 0 28px;
            padding-bottom: 100px;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 12px;
            border-top: 0.5px solid rgba(255,255,255,0.1);
        }
        .collection-card {
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .segment-control {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 4px;
            display: flex;
        }
        .segment {
            flex: 1;
            padding: 8px 16px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }
        .segment.active {
            background: white;
            color: black;
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="status-bar">
        <span class="text-sm font-medium">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
            <h1 class="text-2xl font-bold">Saved</h1>
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-plus text-lg"></i>
            </div>
        </div>

        <!-- Segment Control -->
        <div class="segment-control mb-6">
            <div class="segment active">Collections</div>
            <div class="segment">Locations</div>
            <div class="segment">Anime</div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-gradient-to-br from-purple-500/20 to-pink-500/20 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-purple-400">24</p>
                <p class="text-gray-400 text-xs">Locations</p>
            </div>
            <div class="bg-gradient-to-br from-blue-500/20 to-cyan-500/20 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-blue-400">8</p>
                <p class="text-gray-400 text-xs">Anime</p>
            </div>
            <div class="bg-gradient-to-br from-green-500/20 to-teal-500/20 rounded-2xl p-4 text-center">
                <p class="text-2xl font-bold text-green-400">3</p>
                <p class="text-gray-400 text-xs">Visited</p>
            </div>
        </div>

        <!-- Collections -->
        <div class="space-y-4">
            <!-- Collection 1 -->
            <div class="collection-card">
                <div class="grid grid-cols-3 gap-0.5 h-32">
                    <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=300&q=80"
                         class="w-full h-full object-cover col-span-2 row-span-2" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1551641506-ee5bf4cb45f1?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                <div class="absolute bottom-3 left-3 right-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold">Makoto Shinkai Films</p>
                            <p class="text-gray-300 text-xs">12 locations</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i class="fas fa-chevron-right text-sm"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Collection 2 -->
            <div class="collection-card">
                <div class="grid grid-cols-3 gap-0.5 h-32">
                    <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=300&q=80"
                         class="w-full h-full object-cover col-span-2 row-span-2" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1528164344705-47542687000d?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1480796927426-f609979314bd?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                <div class="absolute bottom-3 left-3 right-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold">Tokyo Must-Visit</p>
                            <p class="text-gray-300 text-xs">8 locations</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i class="fas fa-chevron-right text-sm"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Collection 3 -->
            <div class="collection-card">
                <div class="grid grid-cols-3 gap-0.5 h-32">
                    <img src="https://images.unsplash.com/photo-1492571350019-22de08371fd3?w=300&q=80"
                         class="w-full h-full object-cover col-span-2 row-span-2" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                    <img src="https://images.unsplash.com/photo-1551641506-ee5bf4cb45f1?w=200&q=80"
                         class="w-full h-full object-cover" alt="Collection">
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                <div class="absolute bottom-3 left-3 right-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-semibold">Jujutsu Kaisen</p>
                            <p class="text-gray-300 text-xs">4 locations</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                            <i class="fas fa-chevron-right text-sm"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-home text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Home</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-search text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Search</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-map-marker-alt text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Map</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-heart text-lg text-purple-400"></i>
            <span class="text-xs text-purple-400">Saved</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-suitcase text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Trips</span>
        </div>
    </div>
</body>
</html>
