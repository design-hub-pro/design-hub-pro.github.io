<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneSpot AI - Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-scrollbar: none;
            scrollbar-width: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow-x: hidden;
        }
        .dynamic-island {
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .status-bar {
            height: 59px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 8px;
            background: transparent;
            position: relative;
            z-index: 50;
        }
        .content-area {
            padding: 0 28px;
            padding-bottom: 100px;
        }
        .search-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 12px;
            border-top: 0.5px solid rgba(255,255,255,0.1);
        }
        .filter-chip {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: linear-gradient(135deg, #C44FFF 0%, #6B8AFF 100%);
        }
        .anime-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
        }
        .location-count {
            background: rgba(196, 79, 255, 0.2);
            border-radius: 8px;
            padding: 4px 8px;
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Status Bar -->
    <div class="status-bar">
        <span class="text-sm font-medium">9:41</span>
        <div class="dynamic-island"></div>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-xs"></i>
            <i class="fas fa-wifi text-xs"></i>
            <i class="fas fa-battery-full text-xs"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
        <!-- Search Bar -->
        <div class="search-bar mb-5">
            <i class="fas fa-search text-gray-400"></i>
            <input type="text" placeholder="Search anime, movie, or location..."
                   class="bg-transparent flex-1 outline-none text-sm" value="Your Name">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                <i class="fas fa-sliders-h text-sm"></i>
            </div>
        </div>

        <!-- Filter Chips -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <div class="filter-chip active">All</div>
            <div class="filter-chip">Anime</div>
            <div class="filter-chip">Movies</div>
            <div class="filter-chip">TV Shows</div>
            <div class="filter-chip">By Location</div>
        </div>

        <!-- Search Results -->
        <div class="mb-4">
            <p class="text-gray-400 text-sm mb-4">3 results for "Your Name"</p>

            <!-- Result 1 -->
            <div class="anime-card mb-4">
                <div class="relative h-40">
                    <img src="https://images.unsplash.com/photo-1480796927426-f609979314bd?w=600&q=80"
                         class="w-full h-full object-cover" alt="Your Name">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="absolute bottom-3 left-3 right-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-bold text-lg">Your Name</p>
                                <p class="text-gray-300 text-xs">君の名は。 • 2016</p>
                            </div>
                            <div class="location-count">
                                <span class="text-purple-300 text-sm font-semibold">47 spots</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-4">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="flex items-center gap-1 text-yellow-400 text-xs">
                            <i class="fas fa-star"></i>
                            <span>8.9</span>
                        </div>
                        <span class="text-gray-500 text-xs">•</span>
                        <span class="text-gray-400 text-xs">Makoto Shinkai</span>
                        <span class="text-gray-500 text-xs">•</span>
                        <span class="text-gray-400 text-xs">Romance, Fantasy</span>
                    </div>
                    <div class="flex gap-2 overflow-x-auto">
                        <div class="flex-shrink-0 w-20 h-14 rounded-lg overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=200&q=80"
                                 class="w-full h-full object-cover" alt="Location">
                        </div>
                        <div class="flex-shrink-0 w-20 h-14 rounded-lg overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=200&q=80"
                                 class="w-full h-full object-cover" alt="Location">
                        </div>
                        <div class="flex-shrink-0 w-20 h-14 rounded-lg overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=200&q=80"
                                 class="w-full h-full object-cover" alt="Location">
                        </div>
                        <div class="flex-shrink-0 w-20 h-14 rounded-lg overflow-hidden bg-white/10 flex items-center justify-center">
                            <span class="text-sm text-gray-400">+44</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Result 2 -->
            <div class="anime-card mb-4">
                <div class="flex gap-3 p-4">
                    <img src="https://images.unsplash.com/photo-1551641506-ee5bf4cb45f1?w=200&q=80"
                         class="w-24 h-24 rounded-xl object-cover" alt="Weathering">
                    <div class="flex-1">
                        <p class="font-semibold mb-1">Weathering With You</p>
                        <p class="text-gray-400 text-xs mb-2">天気の子 • 2019</p>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="flex items-center gap-1 text-yellow-400 text-xs">
                                <i class="fas fa-star"></i>
                                <span>7.5</span>
                            </div>
                            <div class="location-count">
                                <span class="text-purple-300 text-xs font-semibold">38 spots</span>
                            </div>
                        </div>
                        <div class="flex -space-x-2">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 border-2 border-black"></div>
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-500 to-cyan-500 border-2 border-black"></div>
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-green-500 to-teal-500 border-2 border-black"></div>
                            <div class="w-6 h-6 rounded-full bg-white/20 border-2 border-black flex items-center justify-center text-xs">+8k</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Result 3 -->
            <div class="anime-card">
                <div class="flex gap-3 p-4">
                    <img src="https://images.unsplash.com/photo-1528164344705-47542687000d?w=200&q=80"
                         class="w-24 h-24 rounded-xl object-cover" alt="Garden">
                    <div class="flex-1">
                        <p class="font-semibold mb-1">The Garden of Words</p>
                        <p class="text-gray-400 text-xs mb-2">言の葉の庭 • 2013</p>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="flex items-center gap-1 text-yellow-400 text-xs">
                                <i class="fas fa-star"></i>
                                <span>7.4</span>
                            </div>
                            <div class="location-count">
                                <span class="text-purple-300 text-xs font-semibold">12 spots</span>
                            </div>
                        </div>
                        <div class="flex -space-x-2">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-orange-500 to-yellow-500 border-2 border-black"></div>
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-red-500 to-pink-500 border-2 border-black"></div>
                            <div class="w-6 h-6 rounded-full bg-white/20 border-2 border-black flex items-center justify-center text-xs">+2k</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-home text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Home</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-search text-lg text-purple-400"></i>
            <span class="text-xs text-purple-400">Search</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-map-marker-alt text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Map</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-heart text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Saved</span>
        </div>
        <div class="flex flex-col items-center gap-1">
            <i class="fas fa-suitcase text-lg text-gray-500"></i>
            <span class="text-xs text-gray-500">Trips</span>
        </div>
    </div>
</body>
</html>
