<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sceneplay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#5B54E8;--accent2:#9B6FE8;--ink:#14142B;--muted:#71718F;--faint:#9C9CB8;--border:#E9E8F3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:var(--ink);padding:80px 48px 110px}
.hero{max-width:1500px;margin:0 auto 70px;display:flex;align-items:center;gap:26px}
.icon{width:96px;height:96px;border-radius:26px;background:linear-gradient(140deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;box-shadow:0 16px 34px -12px rgba(91,84,232,.7);flex-shrink:0}
h1{font-size:52px;font-weight:800;letter-spacing:-2.2px;line-height:1}
.tag{font-size:19px;color:var(--muted);font-weight:500;margin-top:12px;letter-spacing:-.3px}
.tags{display:flex;gap:9px;margin-top:16px}
.tags span{font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);background:#EEEDFD;padding:7px 13px;border-radius:9px}
.grid{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:64px 40px;justify-items:center}
.item{display:flex;flex-direction:column;align-items:center;gap:18px}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0C0C1C;box-shadow:0 34px 70px -24px rgba(20,20,43,.5),0 0 0 1px rgba(20,20,43,.08)}
.frame iframe{width:100%;height:100%;border:0;border-radius:52px;display:block;background:#fff}
.lbl{font-size:14px;font-weight:700;letter-spacing:-.2px}
.lbl b{color:var(--faint);font-weight:800;margin-right:9px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="hero">
    <div class="icon"><i class="fa-solid fa-masks-theater"></i></div>
    <div>
      <h1>Sceneplay</h1>
      <div class="tag">Practice real social moments with AI characters, then see exactly what worked.</div>
      <div class="tags"><span>Social skills</span><span>AI agents</span><span>Special education</span><span>iOS</span></div>
    </div>
  </div>

  <div class="grid">
    <div class="item"><div class="frame"><iframe src="onboarding.html" scrolling="no"></iframe></div><div class="lbl"><b>01</b>Learner setup</div></div>
    <div class="item"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="lbl"><b>02</b>Today</div></div>
    <div class="item"><div class="frame"><iframe src="scene.html" scrolling="no"></iframe></div><div class="lbl"><b>03</b>Scene brief</div></div>
    <div class="item"><div class="frame"><iframe src="live.html" scrolling="no"></iframe></div><div class="lbl"><b>04</b>Live scene</div></div>
    <div class="item"><div class="frame"><iframe src="debrief.html" scrolling="no"></iframe></div><div class="lbl"><b>05</b>Debrief</div></div>
    <div class="item"><div class="frame"><iframe src="progress.html" scrolling="no"></iframe></div><div class="lbl"><b>06</b>Progress</div></div>
  </div>
</body>
</html>
