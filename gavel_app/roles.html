<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gavel — Assign Role</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="screen">
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
  </div>

  <div class="content pt-1">
    <!-- Nav -->
    <div class="flex items-center justify-between mb-5">
      <a href="team.html" class="w-10 h-10 rounded-full bg-white border border-[#241B2E]/8 flex items-center justify-center shadow-soft">
        <i class="fa-solid fa-chevron-left text-[#241B2E] text-[14px]"></i>
      </a>
      <p class="text-[13px] font-semibold text-[#7A6E78]">Assign role</p>
      <div class="w-10"></div>
    </div>

    <!-- Role hero -->
    <div class="relative rounded-[26px] overflow-hidden p-5 mb-5 g-night text-white">
      <div class="blob" style="width:140px;height:140px;background:#D4A12A;top:-40px;right:-30px;opacity:.45"></div>
      <div class="relative" style="z-index:2">
        <span class="pill mb-3" style="background:rgba(63,123,224,0.32)"><i class="fa-solid fa-shield-halved"></i> Defense</span>
        <h1 class="font-serif text-[24px] font-semibold leading-tight mb-1.5">Closing Attorney</h1>
        <p class="text-[12.5px] text-white/65 leading-relaxed">Delivers the defense closing — ties evidence to reasonable doubt and rebuts the State's theory.</p>
      </div>
    </div>

    <!-- Responsibilities -->
    <h3 class="font-display sec-h mb-3">Responsibilities</h3>
    <div class="card !p-4 mb-6 space-y-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#9B2D54]/10 flex items-center justify-center"><i class="fa-solid fa-pen-nib text-[#9B2D54] text-[13px]"></i></div>
        <p class="text-[13px] font-medium flex-1">Draft a 5-minute closing</p>
        <i class="fa-regular fa-circle text-[#D9CFD4]"></i>
      </div>
      <div class="divline"></div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#9B2D54]/10 flex items-center justify-center"><i class="fa-solid fa-list-check text-[#9B2D54] text-[13px]"></i></div>
        <p class="text-[13px] font-medium flex-1">Memorize 3 rebuttal points</p>
        <i class="fa-regular fa-circle text-[#D9CFD4]"></i>
      </div>
      <div class="divline"></div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#9B2D54]/10 flex items-center justify-center"><i class="fa-solid fa-stopwatch text-[#9B2D54] text-[13px]"></i></div>
        <p class="text-[13px] font-medium flex-1">Timed run-through ×2</p>
        <i class="fa-regular fa-circle text-[#D9CFD4]"></i>
      </div>
    </div>

    <!-- Suggested -->
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-display sec-h">Suggested teammates</h3>
      <span class="tag"><i class="fa-solid fa-wand-magic-sparkles"></i> AI match</span>
    </div>
    <div class="space-y-3 mb-5">
      <label class="block card !p-4" style="border:1.5px solid #9B2D54">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=120&q=80" class="w-12 h-12 rounded-full object-cover" />
          <div class="flex-1">
            <p class="text-[14px] font-bold leading-tight">Sofia Reyes</p>
            <p class="text-[12px] text-[#7A6E78]">Strong public speaker · 2 open slots</p>
          </div>
          <div class="w-6 h-6 rounded-full g-wine flex items-center justify-center"><i class="fa-solid fa-check text-white text-[11px]"></i></div>
        </div>
        <div class="flex items-center gap-2 mt-3">
          <span class="tag tag-mint">94% fit</span>
          <span class="tag tag-gold">Available</span>
          <span class="tag tag-sky">Past closer</span>
        </div>
      </label>
      <label class="block card !p-4">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1463453091185-61582044d556?w=120&q=80" class="w-12 h-12 rounded-full object-cover" />
          <div class="flex-1">
            <p class="text-[14px] font-bold leading-tight">Marcus Bell</p>
            <p class="text-[12px] text-[#7A6E78]">Detail-oriented · 1 open slot</p>
          </div>
          <div class="w-6 h-6 rounded-full border-2 border-[#D9CFD4]"></div>
        </div>
        <div class="flex items-center gap-2 mt-3">
          <span class="tag tag-mint">81% fit</span>
          <span class="tag tag-gold">Available</span>
        </div>
      </label>
    </div>

    <!-- CTA -->
    <button class="w-full py-4 rounded-2xl g-wine text-white font-bold text-[15px] shadow-glow flex items-center justify-center gap-2">
      <i class="fa-solid fa-user-check text-[14px]"></i> Assign Sofia & notify team
    </button>
  </div>
</div>
</body>
</html>
