<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarveTrace — App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
body{background:#fff;color:#0B1220}
.head{max-width:1460px;margin:0 auto;padding:80px 40px 56px;text-align:center}
.icon{width:86px;height:86px;margin:0 auto 22px;border-radius:26px;background:linear-gradient(135deg,#0EA5E9,#2563EB);display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;box-shadow:0 18px 40px rgba(37,99,235,.28)}
h1{font-size:52px;font-weight:900;letter-spacing:-2px}
.sub{font-size:18px;color:#64748B;margin-top:12px;max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,460px);gap:64px 40px;justify-content:center;padding:0 40px 110px}
.cell{display:flex;flex-direction:column;align-items:center}
.frame{width:460px;height:980px;border-radius:62px;padding:12px;background:#0B1220;box-shadow:0 34px 70px rgba(11,18,32,.22),0 0 0 1px rgba(11,18,32,.06)}
.frame iframe{width:436px;height:956px;border:0;border-radius:52px;display:block;background:#F5F7FA}
.label{margin-top:22px;font-size:16px;font-weight:700;letter-spacing:-.2px}
</style>
</head>
<body>

<div class="head">
  <div class="icon"><i class="fas fa-person-skiing"></i></div>
  <h1>CarveTrace</h1>
  <p class="sub">Turns the CarveTrace boot sensor into speed, edge angle, and turn shape you can read after every run.</p>
</div>

<div class="grid">
  <div class="cell"><div class="frame"><iframe src="pair.html" scrolling="no"></iframe></div><div class="label">Pair pod</div></div>
  <div class="cell"><div class="frame"><iframe src="home.html" scrolling="no"></iframe></div><div class="label">Today</div></div>
  <div class="cell"><div class="frame"><iframe src="record.html" scrolling="no"></iframe></div><div class="label">Live run</div></div>

  <div class="cell"><div class="frame"><iframe src="summary.html" scrolling="no"></iframe></div><div class="label">Run complete</div></div>
  <div class="cell"><div class="frame"><iframe src="run.html" scrolling="no"></iframe></div><div class="label">Run detail</div></div>
  <div class="cell"><div class="frame"><iframe src="carve.html" scrolling="no"></iframe></div><div class="label">Carve coach</div></div>

  <div class="cell"><div class="frame"><iframe src="season.html" scrolling="no"></iframe></div><div class="label">Season log</div></div>
  <div class="cell"><div class="frame"><iframe src="crew.html" scrolling="no"></iframe></div><div class="label">Crew</div></div>
  <div class="cell"><div class="frame"><iframe src="profile.html" scrolling="no"></iframe></div><div class="label">Profile</div></div>
</div>

</body>
</html>
