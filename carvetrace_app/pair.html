<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarveTrace — Pair</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--acc:#0EA5E9;--acc2:#2563EB;--ink:#0B1220;--mut:#64748B;--faint:#94A3B8;--bd:#E6EAF0;--surf:#F5F7FA;--pos:#059669}
html,body{width:100%;height:100%}
body{background:var(--surf);color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;background:var(--surf);overflow:hidden;display:flex;flex-direction:column}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 32px}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.card{background:#fff;border-radius:22px;border:1px solid var(--bd);box-shadow:0 1px 2px rgba(11,18,32,.04),0 8px 24px rgba(11,18,32,.05)}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.radarwrap{display:flex;justify-content:center;margin:6px 0 2px}
.seg{display:flex;background:#EDF1F6;border-radius:14px;padding:4px;gap:4px}
.seg div{flex:1;text-align:center;padding:11px 0;border-radius:11px;font-size:15px;font-weight:700;color:var(--mut)}
.seg div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.12)}
.row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.dotwrap{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:11px}
.btn{width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:700;text-align:center;box-shadow:0 10px 24px rgba(37,99,235,.28)}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;letter-spacing:.3px}
.live{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(5,150,105,.16)}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">9:41</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <div class="meta" style="margin:6px 0 8px">Step 1 of 2</div>
    <h1>Pair your pod</h1>

    <div class="radarwrap">
      <svg width="242" height="242" viewBox="0 0 260 260">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#2563EB"/>
          </linearGradient>
          <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0F172A"/>
          </linearGradient>
        </defs>
        <circle cx="130" cy="130" r="118" fill="none" stroke="#E2EEF8" stroke-width="1.5"/>
        <circle cx="130" cy="130" r="90" fill="none" stroke="#DBEAFE" stroke-width="1.5"/>
        <circle cx="130" cy="130" r="62" fill="none" stroke="#E8F1FA" stroke-width="1.5"/>
        <circle cx="130" cy="130" r="118" fill="none" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="741" stroke-dashoffset="178" transform="rotate(-90 130 130)"/>
        <rect x="108" y="100" width="44" height="60" rx="13" fill="url(#pod)"/>
        <rect x="116" y="112" width="28" height="4" rx="2" fill="#0EA5E9" opacity=".85"/>
        <circle cx="130" cy="146" r="3.5" fill="#64748B"/>
        <g stroke="#0EA5E9" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55">
          <path d="M162 116 a22 22 0 0 1 0 28"/><path d="M175 106 a38 38 0 0 1 0 48"/>
          <path d="M98 116 a22 22 0 0 0 0 28"/><path d="M85 106 a38 38 0 0 0 0 48"/>
        </g>
        <text x="130" y="205" text-anchor="middle" font-size="34" font-weight="800" fill="#0B1220" style="font-variant-numeric:tabular-nums">76%</text>
        <text x="130" y="224" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#94A3B8">SIGNAL</text>
      </svg>
    </div>

    <div class="card" style="padding:16px 18px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1E293B,#0F172A);display:flex;align-items:center;justify-content:center;color:#7DD3FC;font-size:15px"><i class="fas fa-microchip"></i></div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px">CarveTrace 8F2A <span class="live"></span></div>
          <div class="num" style="font-size:13px;color:var(--mut);margin-top:2px">-42 dBm · 94% · v1.4.2</div>
        </div>
        <span class="chip" style="background:#DCFCE7;color:#15803D">Found</span>
      </div>
    </div>

    <div class="meta" style="margin-bottom:9px">Boot side</div>
    <div class="seg" style="margin-bottom:18px"><div>Left</div><div class="on">Right</div></div>

    <div class="card" style="padding:6px 18px 8px">
      <div class="row">
        <div class="dotwrap" style="background:#DCFCE7;color:#15803D"><i class="fas fa-check"></i></div>
        <div style="flex:1;font-size:15px;font-weight:600">Pod detected</div>
        <div class="num" style="font-size:13px;color:var(--faint)">0:03</div>
      </div>
      <div class="row">
        <div class="dotwrap" style="background:#DCFCE7;color:#15803D"><i class="fas fa-check"></i></div>
        <div style="flex:1;font-size:15px;font-weight:600">Cuff clamp torque</div>
        <div class="num" style="font-size:13px;color:var(--faint)">OK</div>
      </div>
      <div class="row">
        <div class="dotwrap" style="background:#E0F2FE;color:#0284C7"><i class="fas fa-circle-notch"></i></div>
        <div style="flex:1;font-size:15px;font-weight:600">Flat-ski zero</div>
        <div style="width:74px;height:6px;border-radius:3px;background:#EDF1F6;overflow:hidden"><div style="width:64%;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))"></div></div>
      </div>
      <div class="row">
        <div class="dotwrap" style="background:#EDF1F6;color:#94A3B8"><i class="fas fa-lock"></i></div>
        <div style="flex:1;font-size:15px;font-weight:600;color:var(--faint)">First-run calibration</div>
        <div style="font-size:13px;color:var(--faint)">Locked</div>
      </div>
    </div>

    <div class="btn" style="margin-top:20px">Hold ski flat to zero</div>
  </div>
</div>
</body>
</html>
