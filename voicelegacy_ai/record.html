<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceLegacy AI - Record Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { width: 430px; height: 932px; overflow-x: hidden; }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
        @keyframes waveform {
            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }
        .wave-bar { animation: waveform 0.8s ease-in-out infinite; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.3s; }
        .wave-bar:nth-child(7) { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Status Bar -->
    <div class="bg-white px-6 py-2 flex justify-between items-center text-base font-medium">
        <span>9:41</span>
        <div class="flex items-center gap-1.5">
            <i class="fas fa-signal text-sm"></i>
            <i class="fas fa-wifi text-sm"></i>
            <i class="fas fa-battery-full text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-6 pt-4 pb-5 border-b border-gray-100">
        <div class="flex items-center justify-between">
            <button class="w-10 h-10 flex items-center justify-center">
                <i class="fas fa-arrow-left text-gray-600 text-lg"></i>
            </button>
            <span class="text-lg font-semibold text-gray-900">Record Story</span>
            <button class="w-10 h-10 flex items-center justify-center">
                <i class="fas fa-ellipsis-v text-gray-600 text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-6">
        <!-- Story Type Selector -->
        <div class="flex gap-3 mb-6">
            <button class="flex-1 bg-amber-500 text-white py-3 rounded-xl font-medium text-base flex items-center justify-center gap-2">
                <i class="fas fa-microphone"></i>
                Audio
            </button>
            <button class="flex-1 bg-white text-gray-600 py-3 rounded-xl font-medium text-base flex items-center justify-center gap-2 border border-gray-200">
                <i class="fas fa-video"></i>
                Video
            </button>
            <button class="flex-1 bg-white text-gray-600 py-3 rounded-xl font-medium text-base flex items-center justify-center gap-2 border border-gray-200">
                <i class="fas fa-pen"></i>
                Write
            </button>
        </div>

        <!-- Story Details -->
        <div class="bg-white rounded-2xl p-5 mb-6 shadow-sm">
            <div class="mb-4">
                <label class="text-base font-medium text-gray-700 mb-2 block">Story Title</label>
                <input type="text" value="Grandma's Immigration Story"
                       class="w-full px-4 py-3 bg-gray-50 rounded-xl text-base text-gray-900 border border-gray-200">
            </div>
            <div class="mb-4">
                <label class="text-base font-medium text-gray-700 mb-2 block">Category</label>
                <div class="flex flex-wrap gap-2">
                    <span class="px-4 py-2 bg-amber-100 text-amber-700 rounded-full text-base font-medium">Family History</span>
                    <span class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-base">Immigration</span>
                    <span class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-base">1960s</span>
                </div>
            </div>
            <div>
                <label class="text-base font-medium text-gray-700 mb-2 block">Time Period</label>
                <div class="flex items-center gap-3">
                    <input type="text" value="1962" class="w-24 px-4 py-3 bg-gray-50 rounded-xl text-base text-gray-900 text-center border border-gray-200">
                    <span class="text-gray-400">to</span>
                    <input type="text" value="1965" class="w-24 px-4 py-3 bg-gray-50 rounded-xl text-base text-gray-900 text-center border border-gray-200">
                </div>
            </div>
        </div>

        <!-- Recording Area -->
        <div class="bg-white rounded-2xl p-6 mb-6 shadow-sm text-center">
            <p class="text-base text-gray-500 mb-4">Recording in progress...</p>

            <!-- Timer -->
            <p class="text-5xl font-bold text-gray-900 mb-6">12:34</p>

            <!-- Waveform -->
            <div class="flex items-center justify-center gap-1.5 mb-6 h-10">
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
                <div class="wave-bar w-1.5 bg-amber-500 rounded-full"></div>
            </div>

            <!-- Record Button -->
            <div class="relative inline-flex items-center justify-center mb-4">
                <div class="absolute w-28 h-28 bg-red-100 rounded-full pulse-ring"></div>
                <button class="relative w-24 h-24 bg-red-500 rounded-full flex items-center justify-center shadow-lg">
                    <div class="w-8 h-8 bg-white rounded-sm"></div>
                </button>
            </div>

            <p class="text-base text-gray-500">Tap to stop recording</p>
        </div>

        <!-- AI Prompt Card -->
        <div class="bg-gradient-to-r from-purple-500 to-indigo-600 rounded-2xl p-5 text-white">
            <div class="flex items-start gap-4">
                <div class="w-11 h-11 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-wand-magic-sparkles text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold text-base mb-1">AI Prompt Suggestion</p>
                    <p class="text-purple-100 text-base leading-relaxed">"What was the hardest part about leaving your home country? How did you feel?"</p>
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <button class="flex-1 bg-white/20 py-2 rounded-xl text-base font-medium">Skip</button>
                <button class="flex-1 bg-white text-purple-600 py-2 rounded-xl text-base font-medium">Use Prompt</button>
            </div>
        </div>
    </div>

    <!-- Bottom spacer -->
    <div class="h-24"></div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 pb-8">
        <div class="flex justify-around items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-home text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Home</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-book text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Stories</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-14 h-14 bg-gradient-to-br from-amber-500 to-orange-600 rounded-full flex items-center justify-center -mt-6 shadow-lg">
                    <i class="fas fa-plus text-white text-2xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-network-wired text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Timeline</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-user text-gray-400 text-2xl"></i>
                <span class="text-sm text-gray-400 mt-1">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
