<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcTrace — Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{display:none}*{scrollbar-width:none}
:root{--ink:#F8FAFC;--mut:#94A3B8;--faint:#64748B;--bd:rgba(255,255,255,.09)}
html,body{width:100%;height:100%}
body{background:#06080F;color:var(--ink);overflow:hidden}
.screen{position:relative;width:100%;height:100%;background:radial-gradient(120% 70% at 50% 0%,#1E1B4B 0%,#06080F 62%);overflow:hidden;display:flex;flex-direction:column}
.status{height:59px;flex:0 0 59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:relative;font-size:15px;font-weight:600;color:#fff}
.island{position:absolute;left:50%;transform:translateX(-50%);top:11px;width:118px;height:34px;background:#000;border-radius:18px}
.sicons{display:flex;gap:6px;font-size:13px}
.content{flex:1;overflow-y:auto;padding:0 28px 28px}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.gcard{background:rgba(255,255,255,.045);border:1px solid var(--bd);border-radius:20px}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span class="num">14:06</span><div class="island"></div>
    <div class="sicons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
  </div>

  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px">
      <div style="display:flex;align-items:center;gap:8px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);padding:6px 12px;border-radius:11px">
        <span style="width:8px;height:8px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 4px rgba(239,68,68,.2)"></span>
        <span style="font-size:12px;font-weight:800;letter-spacing:1.2px;color:#FCA5A5">REC</span>
      </div>
      <div style="text-align:right">
        <div class="meta"><i class="fas fa-person-biking" style="color:#34D399"></i> Descent 5 · Cli-machx</div>
        <div class="num" style="font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:1px">02:47</div>
      </div>
    </div>

    <div style="text-align:center;margin:2px 0 -4px">
      <div style="display:flex;align-items:baseline;justify-content:center;gap:9px">
        <span class="num" style="font-size:88px;font-weight:900;letter-spacing:-5px;line-height:1;background:linear-gradient(135deg,#A5B4FC,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent">44.6</span>
        <span style="font-size:19px;font-weight:700;color:var(--mut)">km/h</span>
      </div>
      <div class="num" style="font-size:12.5px;font-weight:700;color:var(--faint);margin-top:4px">peak 52.8 · avg 31.2</div>
    </div>

    <!-- Lean angle gauge -->
    <div style="display:flex;justify-content:center;margin-top:6px">
      <svg width="332" height="196" viewBox="0 0 300 178">
        <defs>
          <linearGradient id="arcg" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
        <path d="M30,150 A120,120 0 0 1 270,150" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="12" stroke-linecap="round"/>
        <path d="M150,30 A120,120 0 0 1 228.7,59.4" fill="none" stroke="url(#arcg)" stroke-width="12" stroke-linecap="round"/>
        <g stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-linecap="round">
          <line x1="150" y1="44" x2="150" y2="56"/>
          <line x1="96" y1="60.8" x2="102.9" y2="70.6"/>
          <line x1="58.1" y1="98.7" x2="67.9" y2="105.6"/>
          <line x1="204" y1="60.8" x2="197.1" y2="70.6"/>
          <line x1="241.9" y1="98.7" x2="232.1" y2="105.6"/>
        </g>
        <text x="58" y="130" font-size="11" font-weight="700" fill="#64748B" style="font-variant-numeric:tabular-nums">60&#176;L</text>
        <text x="214" y="130" font-size="11" font-weight="700" fill="#64748B" style="font-variant-numeric:tabular-nums">60&#176;R</text>
        <line x1="150" y1="150" x2="218.2" y2="71.5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="150" cy="150" r="9" fill="#fff"/>
        <circle cx="150" cy="150" r="4" fill="#1E1B4B"/>
        <text x="150" y="112" text-anchor="middle" font-size="40" font-weight="900" fill="#fff" letter-spacing="-1.5" style="font-variant-numeric:tabular-nums">41&#176;</text>
        <text x="150" y="132" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="2" fill="#64748B">LEAN RIGHT</text>
      </svg>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
      <span class="num" style="font-size:12px;font-weight:800;color:#A5B4FC;width:34px">43&deg;L</span>
      <div style="flex:1;display:flex;height:9px;gap:3px">
        <div style="flex:1;display:flex;justify-content:flex-end">
          <div style="width:91%;background:linear-gradient(90deg,rgba(129,140,248,.15),#818CF8);border-radius:5px"></div>
        </div>
        <div style="flex:1;display:flex">
          <div style="width:100%;background:linear-gradient(90deg,#7C3AED,rgba(124,58,237,.15));border-radius:5px"></div>
        </div>
      </div>
      <span class="num" style="font-size:12px;font-weight:800;color:#C4B5FD;width:34px;text-align:right">47&deg;R</span>
    </div>

    <div style="display:flex;gap:9px;margin-top:16px">
      <div class="gcard" style="flex:1;padding:12px 13px"><div class="meta" style="font-size:10px;letter-spacing:1.3px">Descent</div><div class="num" style="font-size:22px;font-weight:800;margin-top:2px">228<span style="font-size:12px;color:var(--mut)"> m</span></div></div>
      <div class="gcard" style="flex:1;padding:12px 13px"><div class="meta" style="font-size:10px;letter-spacing:1.3px">Corners</div><div class="num" style="font-size:22px;font-weight:800;margin-top:2px">26</div></div>
      <div class="gcard" style="flex:1;padding:12px 13px"><div class="meta" style="font-size:10px;letter-spacing:1.3px">Peak G</div><div class="num" style="font-size:22px;font-weight:800;margin-top:2px">2.1</div></div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin-top:20px">
      <div style="width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut)">
        <i class="fas fa-flag" style="font-size:15px"></i><span style="font-size:9.5px;font-weight:800;letter-spacing:.6px;margin-top:3px">LAP</span>
      </div>
      <div style="flex:1;height:66px;border-radius:24px;background:linear-gradient(135deg,#EF4444,#B91C1C);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 28px rgba(185,28,28,.35)">
        <i class="fas fa-stop" style="font-size:16px"></i><span style="font-size:17px;font-weight:800;letter-spacing:.3px">End descent</span>
      </div>
    </div>

    <div class="num" style="display:flex;justify-content:center;gap:16px;margin-top:14px;font-size:11.5px;font-weight:700;color:var(--faint)">
      <span><i class="fas fa-battery-three-quarters"></i> Pod 87%</span>
      <span><i class="fas fa-satellite-dish"></i> 14 sats</span>
      <span><i class="fas fa-temperature-half"></i> 12&deg;C</span>
    </div>
  </div>
</div>
</body>
</html>
