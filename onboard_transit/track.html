<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OnBoard — Track</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  *::-webkit-scrollbar { display:none; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0A0D14; color:#fff; scrollbar-width:none; -webkit-font-smoothing:antialiased; }
  .screen { width:100%; height:100%; position:relative; overflow:hidden; background:#0F1420; }

  .dynamic-island { width:120px; height:36px; background:#000; border-radius:20px; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:101; }
  .status-bar { height:59px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 28px 8px; position:relative; z-index:50; }
  .status-bar .time { font-size:17px; font-weight:700; }
  .status-bar .icons { display:flex; gap:7px; }
  .status-bar .icons i { font-size:14px; }

  /* full map */
  .map { position:absolute; inset:0; z-index:1; }
  .map svg { width:100%; height:100%; }

  /* top bar */
  .top-bar { position:absolute; top:62px; left:28px; right:28px; z-index:20; display:flex; align-items:center; justify-content:space-between; }
  .top-pill { display:flex; align-items:center; gap:9px; background:rgba(12,16,24,0.82); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.09); border-radius:18px; padding:10px 14px; }
  .top-pill .li { width:8px; height:8px; border-radius:50%; background:#2EE6A6; box-shadow:0 0 10px #2EE6A6; }
  .top-pill .tt { font-size:13px; font-weight:800; }
  .top-pill .ts { font-size:10px; color:#8B93A6; }
  .icon-btn { width:42px; height:42px; border-radius:14px; background:rgba(12,16,24,0.82); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.09); display:flex; align-items:center; justify-content:center; }
  .icon-btn i { font-size:15px; color:#cbd2e0; }

  /* bus callout */
  .bus-callout { position:absolute; z-index:15; left:50%; top:38%; transform:translate(-50%,-50%); }
  .bus-pin { width:54px; height:54px; border-radius:18px; background:linear-gradient(135deg,#FFC53D,#FF9A1F); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px rgba(255,154,31,0.5); position:relative; }
  .bus-pin i { font-size:22px; color:#0A0D14; }
  .bus-pin::after { content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%) rotate(45deg); width:14px; height:14px; background:#FF9A1F; border-radius:3px; }
  .bus-ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90px; height:90px; border-radius:50%; border:2px solid rgba(255,176,32,0.4); animation:ring 2s infinite; }
  @keyframes ring { 0%{transform:translate(-50%,-50%) scale(0.6);opacity:0.9;} 100%{transform:translate(-50%,-50%) scale(1.4);opacity:0;} }

  .you-pin { position:absolute; z-index:14; left:74%; top:64%; }
  .you-dot { width:20px; height:20px; border-radius:50%; background:#3B9EFF; border:3px solid #fff; box-shadow:0 0 0 6px rgba(59,158,255,0.25); }

  /* bottom sheet */
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:30; background:#10141E; border-radius:30px 30px 0 0; border-top:1px solid rgba(255,255,255,0.08); padding:10px 28px 110px; box-shadow:0 -20px 50px rgba(0,0,0,0.5); }
  .grip { width:40px; height:5px; border-radius:5px; background:#2A3242; margin:0 auto 18px; }
  .sheet-head { display:flex; align-items:center; gap:14px; }
  .sh-ic { width:52px; height:52px; border-radius:16px; background:linear-gradient(135deg,#FFC53D,#FF9A1F); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sh-ic i { font-size:22px; color:#0A0D14; }
  .sh-info { flex:1; }
  .sh-t { font-size:17px; font-weight:800; }
  .sh-s { font-size:12px; color:#8B93A6; margin-top:2px; }
  .sh-eta { text-align:right; }
  .sh-eta .v { font-size:26px; font-weight:900; color:#FFB020; letter-spacing:-1px; line-height:1; }
  .sh-eta .l { font-size:10px; color:#8B93A6; font-weight:600; }

  .stat-row { display:flex; gap:12px; margin-top:20px; }
  .stat { flex:1; background:#171D2A; border:1px solid rgba(255,255,255,0.05); border-radius:18px; padding:14px; }
  .stat i { font-size:15px; color:#FFB020; }
  .stat .v { font-size:19px; font-weight:900; margin-top:8px; letter-spacing:-0.5px; }
  .stat .l { font-size:10px; color:#8B93A6; font-weight:600; margin-top:1px; }

  .driver-row { display:flex; align-items:center; gap:13px; margin-top:16px; background:#171D2A; border:1px solid rgba(255,255,255,0.05); border-radius:18px; padding:13px 15px; }
  .driver-row img { width:46px; height:46px; border-radius:14px; object-fit:cover; }
  .driver-row .di { flex:1; }
  .driver-row .dn { font-size:14px; font-weight:800; }
  .driver-row .dl { font-size:11px; color:#8B93A6; margin-top:2px; }
  .driver-row .star { font-size:11px; color:#FFB020; font-weight:700; }
  .call-btns { display:flex; gap:8px; }
  .cbtn { width:40px; height:40px; border-radius:13px; background:#222A3A; display:flex; align-items:center; justify-content:center; }
  .cbtn i { font-size:14px; color:#2EE6A6; }

  /* tab bar */
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:96px; background:rgba(10,13,20,0.9); backdrop-filter:blur(22px); display:flex; justify-content:space-around; align-items:flex-start; padding-top:14px; border-top:0.5px solid rgba(255,255,255,0.08); z-index:40; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:5px; min-width:50px; }
  .tab i { font-size:19px; color:rgba(255,255,255,0.32); }
  .tab span { font-size:10px; color:rgba(255,255,255,0.32); font-weight:600; }
  .tab.active i, .tab.active span { color:#FFB020; }
  .tab-scan { width:58px; height:58px; border-radius:20px; background:linear-gradient(135deg,#FFC53D,#FF9A1F); display:flex; align-items:center; justify-content:center; margin-top:-12px; box-shadow:0 8px 22px rgba(255,154,31,0.4); }
  .tab-scan i { font-size:22px; color:#0A0D14; }
</style>
</head>
<body>
<div class="screen">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></div>
  </div>

  <!-- MAP -->
  <div class="map">
    <svg viewBox="0 0 400 760" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="760" fill="#0F1420"/>
      <g stroke="#181F2D" stroke-width="22">
        <line x1="-40" y1="180" x2="440" y2="240"/>
        <line x1="100" y1="-40" x2="160" y2="800"/>
        <line x1="320" y1="-40" x2="270" y2="800"/>
        <line x1="-40" y1="500" x2="440" y2="430"/>
      </g>
      <g stroke="#141B28" stroke-width="10">
        <line x1="-40" y1="340" x2="440" y2="360"/>
        <line x1="220" y1="-40" x2="240" y2="800"/>
        <line x1="-40" y1="640" x2="440" y2="600"/>
      </g>
      <!-- blocks -->
      <g fill="#121826" opacity="0.6">
        <rect x="30" y="250" width="60" height="60" rx="8"/>
        <rect x="170" y="270" width="50" height="50" rx="8"/>
        <rect x="300" y="280" width="55" height="55" rx="8"/>
        <rect x="40" y="540" width="55" height="55" rx="8"/>
        <rect x="290" y="500" width="60" height="60" rx="8"/>
      </g>
      <!-- route -->
      <path d="M180 660 Q 230 560 200 470 T 200 300 Q 210 220 260 160 L 300 110"
        fill="none" stroke="#FFB020" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
      <path d="M180 660 Q 215 600 205 540" fill="none" stroke="#2EE6A6" stroke-width="6" stroke-linecap="round"/>
      <!-- stops -->
      <circle cx="180" cy="660" r="7" fill="#2EE6A6"/>
      <circle cx="205" cy="470" r="6" fill="#0A0D14" stroke="#FFB020" stroke-width="3"/>
      <circle cx="300" cy="110" r="8" fill="#2EE6A6"/>
      <circle cx="300" cy="110" r="13" fill="none" stroke="#2EE6A6" stroke-width="2" opacity="0.4"/>
    </svg>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-pill"><span class="li"></span><div><div class="tt">Bus #428</div><div class="ts">Route 12 · Live</div></div></div>
    <div class="icon-btn"><i class="fas fa-location-crosshairs"></i></div>
  </div>

  <!-- BUS + YOU -->
  <div class="bus-callout">
    <div class="bus-ring"></div>
    <div class="bus-pin"><i class="fas fa-bus"></i></div>
  </div>
  <div class="you-pin"><div class="you-dot"></div></div>

  <!-- SHEET -->
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-head">
      <div class="sh-ic"><i class="fas fa-bus"></i></div>
      <div class="sh-info">
        <div class="sh-t">Arriving at Oakridge & 5th</div>
        <div class="sh-s">1.8 mi · 2 stops away · on schedule</div>
      </div>
      <div class="sh-eta"><div class="v">4 min</div><div class="l">ETA 8:02</div></div>
    </div>

    <div class="stat-row">
      <div class="stat"><i class="fas fa-gauge-high"></i><div class="v">28 mph</div><div class="l">Current speed</div></div>
      <div class="stat"><i class="fas fa-users"></i><div class="v">18/40</div><div class="l">Seats filled</div></div>
      <div class="stat"><i class="fas fa-bolt"></i><div class="v">96%</div><div class="l">ETA confidence</div></div>
    </div>

    <div class="driver-row">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop" alt="">
      <div class="di">
        <div class="dn">Marcus Thompson</div>
        <div class="dl"><span class="star"><i class="fas fa-star"></i> 4.9</span> · 6 yrs · License #BD-2241</div>
      </div>
      <div class="call-btns">
        <div class="cbtn"><i class="fas fa-phone"></i></div>
        <div class="cbtn"><i class="fas fa-message"></i></div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="tab active"><i class="fas fa-location-dot"></i><span>Track</span></div>
    <div class="tab-scan"><i class="fas fa-qrcode"></i></div>
    <div class="tab"><i class="fas fa-chart-line"></i><span>Forecast</span></div>
    <div class="tab"><i class="fas fa-user"></i><span>Profile</span></div>
  </div>
</div>
</body>
</html>
