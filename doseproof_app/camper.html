<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div style="position:relative;height:330px">
      <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=900&q=80&auto=format&fit=crop&crop=faces" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.35),transparent 35%,rgba(15,23,42,.85))"></div>
      <div style="position:relative"><div class="status light"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div></div>
      <div class="px row between" style="position:relative;margin-top:6px">
        <div class="iconbtn" style="background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)"><i class="fas fa-chevron-left"></i></div>
        <div class="iconbtn" style="background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)"><i class="fas fa-pen"></i></div>
      </div>
      <div class="px" style="position:absolute;left:0;right:0;bottom:22px;color:#fff">
        <div style="font-size:32px;font-weight:800;letter-spacing:-.8px">Maya Chen</div>
        <div class="row" style="gap:8px;margin-top:8px">
          <span class="pill" style="background:rgba(255,255,255,.2);color:#fff">Age 9</span>
          <span class="pill" style="background:rgba(255,255,255,.2);color:#fff"><i class="fas fa-campground"></i>Bluebird cabin</span>
          <span class="pill" style="background:rgba(239,68,68,.85);color:#fff"><i class="fas fa-triangle-exclamation"></i>Peanut</span>
        </div>
      </div>
    </div>

    <!-- stats -->
    <div class="px" style="margin-top:-2px;padding-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div class="card" style="padding:16px;text-align:center"><div class="big" style="font-size:30px;color:#0FA578">100%</div><div class="xs muted" style="margin-top:6px;font-weight:600">Verified</div></div>
      <div class="card" style="padding:16px;text-align:center"><div class="big" style="font-size:30px"><i class="fas fa-fire" style="color:#F97316;font-size:22px"></i> 6</div><div class="xs muted" style="margin-top:6px;font-weight:600">Day streak</div></div>
      <div class="card" style="padding:16px;text-align:center"><div class="big" style="font-size:30px;color:#7C3AED">340</div><div class="xs muted" style="margin-top:6px;font-weight:600">Points</div></div>
    </div>

    <!-- meds -->
    <div class="px" style="margin-top:22px"><div class="h2">Medicines</div></div>
    <div class="hscroll" style="margin-top:12px">
      <div style="min-width:230px;border-radius:24px;padding:18px;background:linear-gradient(135deg,#2F5BEA,#5B8CFF);color:#fff">
        <div class="row between"><div style="width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><i class="fas fa-tablets"></i></div><span class="xs" style="font-weight:700;opacity:.85">Slot B</span></div>
        <div style="font-weight:800;font-size:18px;margin-top:16px">Cetirizine</div>
        <div class="small" style="opacity:.85">5 mg · 0.20 g / tab</div>
        <div class="row" style="gap:6px;margin-top:14px"><span class="pill" style="background:#fff;color:#2F5BEA">8:00</span></div>
      </div>
      <div style="min-width:230px;border-radius:24px;padding:18px;background:linear-gradient(135deg,#7C3AED,#C084FC);color:#fff">
        <div class="row between"><div style="width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center"><i class="fas fa-capsules"></i></div><span class="xs" style="font-weight:700;opacity:.85">Slot D</span></div>
        <div style="font-weight:800;font-size:18px;margin-top:16px">Fluticasone</div>
        <div class="small" style="opacity:.85">Inhaler · puff count</div>
        <div class="row" style="gap:6px;margin-top:14px"><span class="pill" style="background:#fff;color:#7C3AED">8:00</span><span class="pill" style="background:#fff;color:#7C3AED">20:00</span></div>
      </div>
    </div>

    <!-- 14-day grid -->
    <div class="px" style="margin-top:22px">
      <div class="card" style="padding:18px">
        <div class="row between"><div style="font-weight:700">Last 14 days</div><div class="row xs muted" style="gap:10px;font-weight:600"><span class="row" style="gap:4px"><span class="dot g"></span>ok</span><span class="row" style="gap:4px"><span class="dot r"></span>flag</span></div></div>
        <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:14px">
          <div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#F59E0B"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div>
          <div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#E8EEFF;border:2px dashed #2F5BEA"></div>
          <div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div>
          <div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#12B886"></div><div style="height:26px;border-radius:7px;background:#E8EEFF;border:2px dashed #7C3AED"></div>
        </div>
        <div class="row between xs muted" style="margin-top:8px;font-weight:600"><span>Oct 10</span><span>Today</span></div>
      </div>
    </div>

    <!-- guardians -->
    <div class="px" style="margin-top:14px">
      <div class="card row" style="padding:14px 16px;gap:12px">
        <div class="stack"><img class="av" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=80&auto=format&fit=crop&crop=faces"><img class="av" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&q=80&auto=format&fit=crop&crop=faces"></div>
        <div style="flex:1"><div style="font-weight:700" class="small">Parents get a daily digest</div><div class="xs muted">Sent 7:00 PM</div></div>
        <div style="width:46px;height:28px;border-radius:99px;background:#12B886;position:relative"><span style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-house"></i>Today</div><div class="tab on"><i class="fas fa-children"></i>Campers</div><div class="tab"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab"><i class="fas fa-trophy"></i>Rewards</div><div class="tab"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
