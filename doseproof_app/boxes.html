<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px">
      <div><div class="muted small" style="font-weight:600">12 boxes · Health Lodge</div><div class="h1" style="margin-top:2px">Boxes</div></div>
      <div class="iconbtn" style="background:#0F172A;color:#fff"><i class="fas fa-plus"></i></div>
    </div>

    <!-- featured box -->
    <div class="px" style="margin-top:18px">
      <div style="border-radius:28px;padding:22px;background:linear-gradient(145deg,#0F172A,#1E293B);color:#fff;position:relative;overflow:hidden">
        <div class="row between">
          <div><div class="xs" style="color:#94A3B8;font-weight:700;letter-spacing:.6px">BOX 07</div><div style="font-size:22px;font-weight:800;margin-top:2px">Maya C.</div></div>
          <span class="pill" style="background:rgba(52,211,153,.15);color:#34D399"><span class="dot g"></span>Online</span>
        </div>
        <!-- box illustration -->
        <div style="display:flex;justify-content:center;margin:18px 0 6px">
          <svg width="230" height="130" viewBox="0 0 230 130">
            <defs><linearGradient id="bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#94A3B8"/></linearGradient></defs>
            <path d="M30 40 L115 14 L200 40 L115 66Z" fill="#F8FAFC"/>
            <path d="M30 40 L115 66 L115 120 L30 94Z" fill="url(#bx)"/>
            <path d="M200 40 L115 66 L115 120 L200 94Z" fill="#CBD5E1"/>
            <circle cx="72" cy="78" r="7" fill="#2F5BEA"/><circle cx="72" cy="78" r="3" fill="#BFDBFE"/>
            <rect x="140" y="70" width="40" height="6" rx="3" fill="#12B886" transform="skewY(-17)"/>
            <circle cx="115" cy="40" r="4" fill="#12B886"/>
          </svg>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          <div style="text-align:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 4px"><i class="fas fa-box-open" style="color:#34D399"></i><div class="xs" style="margin-top:6px;color:#CBD5E1;font-weight:600">Lid</div></div>
          <div style="text-align:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 4px"><i class="fas fa-weight-scale" style="color:#34D399"></i><div class="xs" style="margin-top:6px;color:#CBD5E1;font-weight:600">±0.01 g</div></div>
          <div style="text-align:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 4px"><i class="fas fa-video" style="color:#34D399"></i><div class="xs" style="margin-top:6px;color:#CBD5E1;font-weight:600">Clear</div></div>
          <div style="text-align:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 4px"><i class="fas fa-microphone" style="color:#34D399"></i><div class="xs" style="margin-top:6px;color:#CBD5E1;font-weight:600">Mic</div></div>
        </div>
        <div class="row between xs" style="margin-top:14px;color:#94A3B8;font-weight:600"><span><i class="fas fa-battery-three-quarters" style="color:#34D399"></i> 78%</span><span><i class="fas fa-pills"></i> 12 tabs left</span><span><i class="fas fa-lock"></i> Locked</span></div>
      </div>
    </div>

    <!-- fleet grid -->
    <div class="px row between" style="margin-top:24px"><div class="h2">All boxes</div><div class="row xs muted" style="gap:12px;font-weight:600"><span class="row" style="gap:5px"><span class="dot g"></span>10</span><span class="row" style="gap:5px"><span class="dot a"></span>1</span><span class="row" style="gap:5px"><span class="dot r"></span>1</span></div></div>
    <div class="px" style="margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div class="card" style="padding:12px 8px;text-align:center"><div style="font-weight:800">01</div><span class="dot g" style="margin-top:6px"></span></div>
      <div class="card" style="padding:12px 8px;text-align:center"><div style="font-weight:800">02</div><span class="dot g" style="margin-top:6px"></span></div>
      <div class="card" style="padding:12px 8px;text-align:center;border:1.5px solid #FECACA;background:#FFF5F5"><div style="font-weight:800;color:#DC2626">03</div><i class="fas fa-flag" style="color:#EF4444;font-size:11px;margin-top:4px"></i></div>
      <div class="card" style="padding:12px 8px;text-align:center"><div style="font-weight:800">04</div><span class="dot g" style="margin-top:6px"></span></div>
      <div class="card" style="padding:12px 8px;text-align:center"><div style="font-weight:800">05</div><span class="dot g" style="margin-top:6px"></span></div>
      <div class="card" style="padding:12px 8px;text-align:center;border:1.5px solid #FDE68A;background:#FFFBEB"><div style="font-weight:800;color:#B45309">06</div><i class="fas fa-battery-quarter" style="color:#F59E0B;font-size:11px;margin-top:4px"></i></div>
      <div class="card" style="padding:12px 8px;text-align:center;border:1.5px solid #2F5BEA"><div style="font-weight:800;color:#2F5BEA">07</div><span class="dot g" style="margin-top:6px"></span></div>
      <div class="card" style="padding:12px 8px;text-align:center"><div style="font-weight:800">08</div><span class="dot g" style="margin-top:6px"></span></div>
    </div>

    <!-- maintenance -->
    <div class="px" style="margin-top:20px">
      <div class="card" style="padding:6px 16px">
        <div class="row" style="gap:14px;padding:13px 0;border-bottom:1px solid #F1F5F9">
          <div class="ico grad-amber"><i class="fas fa-battery-quarter"></i></div>
          <div style="flex:1"><div style="font-weight:700">Box 06 battery 14%</div><div class="xs muted">About 9 h left</div></div>
          <span class="pill warn">Charge</span>
        </div>
        <div class="row" style="gap:14px;padding:13px 0">
          <div class="ico grad-blue"><i class="fas fa-scale-balanced"></i></div>
          <div style="flex:1"><div style="font-weight:700">Weekly scale check</div><div class="xs muted">Use the 1 g reference weight</div></div>
          <span class="pill info">Start</span>
        </div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-house"></i>Today</div><div class="tab"><i class="fas fa-children"></i>Campers</div><div class="tab"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab"><i class="fas fa-trophy"></i>Rewards</div><div class="tab on"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
