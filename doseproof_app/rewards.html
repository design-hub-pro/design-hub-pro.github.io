<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px">
      <div class="h1">Rewards</div>
      <div class="iconbtn"><i class="fas fa-sliders"></i></div>
    </div>

    <!-- cabin hero -->
    <div class="px" style="margin-top:18px">
      <div style="position:relative;height:210px;border-radius:28px;overflow:hidden">
        <img src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=900&q=80&auto=format&fit=crop" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(124,58,237,.9),rgba(236,72,153,.55))"></div>
        <div style="position:absolute;inset:0;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between">
          <div class="row between"><span class="pill" style="background:rgba(255,255,255,.2);color:#fff"><i class="fas fa-crown" style="color:#FDE047"></i>Cabin of the week</span><span class="xs" style="font-weight:700;opacity:.85">2 days left</span></div>
          <div>
            <div style="font-size:28px;font-weight:800;letter-spacing:-.6px">Bluebird</div>
            <div class="row between" style="margin-top:8px">
              <div class="stack">
                <img class="av" src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=100&q=80&auto=format&fit=crop&crop=faces">
                <img class="av" src="https://images.unsplash.com/photo-1472162072942-cd5147eb3902?w=100&q=80&auto=format&fit=crop&crop=faces">
                <img class="av" src="https://images.unsplash.com/photo-1519340241574-2cec6aef0c01?w=100&q=80&auto=format&fit=crop&crop=faces">
                <span class="av" style="background:#fff;color:#7C3AED;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">+5</span>
              </div>
              <div style="font-size:30px;font-weight:900;letter-spacing:-1px">2,480<span class="small" style="opacity:.8;font-weight:600"> pts</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- leaderboard -->
    <div class="px" style="margin-top:22px"><div class="h2">Cabins</div></div>
    <div class="px" style="margin-top:12px">
      <div class="card" style="padding:8px 16px">
        <div class="row" style="gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9">
          <span style="width:22px;font-weight:800;color:#F59E0B">1</span>
          <div class="ico grad-violet" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-dove"></i></div>
          <div style="flex:1"><div style="font-weight:700">Bluebird</div><div class="bar" style="margin-top:6px"><span style="width:96%;background:linear-gradient(90deg,#7C3AED,#EC4899)"></span></div></div>
          <span style="font-weight:800;width:54px;text-align:right">96%</span>
        </div>
        <div class="row" style="gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9">
          <span style="width:22px;font-weight:800;color:#94A3B8">2</span>
          <div class="ico grad-sky" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-fish"></i></div>
          <div style="flex:1"><div style="font-weight:700">Trout</div><div class="bar" style="margin-top:6px"><span style="width:91%;background:#38BDF8"></span></div></div>
          <span style="font-weight:800;width:54px;text-align:right">91%</span>
        </div>
        <div class="row" style="gap:12px;padding:12px 0">
          <span style="width:22px;font-weight:800;color:#B45309">3</span>
          <div class="ico grad-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-tree"></i></div>
          <div style="flex:1"><div style="font-weight:700">Cedar</div><div class="bar" style="margin-top:6px"><span style="width:84%;background:#34D399"></span></div></div>
          <span style="font-weight:800;width:54px;text-align:right">84%</span>
        </div>
      </div>
    </div>

    <!-- prizes -->
    <div class="px row between" style="margin-top:24px"><div class="h2">Prize shop</div><span class="small" style="color:#2F5BEA;font-weight:600">Edit</span></div>
    <div class="hscroll" style="margin-top:12px">
      <div class="card" style="min-width:160px;padding:16px">
        <div class="ico grad-amber" style="width:52px;height:52px;border-radius:16px;font-size:22px"><i class="fas fa-fire-flame-curved"></i></div>
        <div style="font-weight:700;margin-top:14px">S'mores night</div>
        <div class="row" style="gap:6px;margin-top:6px;color:#7C3AED;font-weight:800"><i class="fas fa-star" style="color:#F59E0B"></i>300</div>
      </div>
      <div class="card" style="min-width:160px;padding:16px">
        <div class="ico grad-sky" style="width:52px;height:52px;border-radius:16px;font-size:22px"><i class="fas fa-sailboat"></i></div>
        <div style="font-weight:700;margin-top:14px">Extra canoe</div>
        <div class="row" style="gap:6px;margin-top:6px;color:#7C3AED;font-weight:800"><i class="fas fa-star" style="color:#F59E0B"></i>200</div>
      </div>
      <div class="card" style="min-width:160px;padding:16px">
        <div class="ico grad-violet" style="width:52px;height:52px;border-radius:16px;font-size:22px"><i class="fas fa-music"></i></div>
        <div style="font-weight:700;margin-top:14px">Pick the song</div>
        <div class="row" style="gap:6px;margin-top:6px;color:#7C3AED;font-weight:800"><i class="fas fa-star" style="color:#F59E0B"></i>80</div>
      </div>
    </div>

    <div class="px" style="margin-top:16px">
      <div class="row" style="gap:12px;padding:14px 16px;border-radius:18px;background:#FEF3C7">
        <i class="fas fa-circle-info" style="color:#B45309"></i>
        <div class="xs" style="color:#92400E;font-weight:600;flex:1">Points only count for verified doses. Flagged doses earn 0.</div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-house"></i>Today</div><div class="tab"><i class="fas fa-children"></i>Campers</div><div class="tab"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab on"><i class="fas fa-trophy"></i>Rewards</div><div class="tab"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
