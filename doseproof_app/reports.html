<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px">
      <div class="iconbtn"><i class="fas fa-chevron-left"></i></div>
      <div class="row" style="gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(15,23,42,.06)">
        <span class="small" style="padding:7px 14px;border-radius:10px;font-weight:600;color:#64748B">Day</span>
        <span class="small" style="padding:7px 14px;border-radius:10px;font-weight:700;background:#0F172A;color:#fff">Week</span>
        <span class="small" style="padding:7px 14px;border-radius:10px;font-weight:600;color:#64748B">Session</span>
      </div>
      <div class="iconbtn"><i class="fas fa-calendar"></i></div>
    </div>

    <div class="px" style="margin-top:22px">
      <div class="muted small" style="font-weight:600">Oct 17 – 23 · 24 campers · sample data</div>
      <div class="row" style="gap:12px;align-items:flex-end;margin-top:6px">
        <div style="font-size:56px;font-weight:900;letter-spacing:-2.5px;line-height:1">96.4%</div>
        <span class="pill ok" style="margin-bottom:8px"><i class="fas fa-arrow-trend-up"></i>2.1</span>
      </div>
      <div class="small muted" style="margin-top:4px;font-weight:500">of 336 doses verified on all 4 signals</div>
    </div>

    <!-- bar chart -->
    <div class="px" style="margin-top:18px">
      <div class="card" style="padding:18px">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;height:150px;gap:12px">
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:6%;background:#F87171;border-radius:6px"></div><div style="height:84%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:3%;background:#F87171;border-radius:6px"></div><div style="height:88%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:9%;background:#F87171;border-radius:6px"></div><div style="height:80%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:3%;background:#F87171;border-radius:6px"></div><div style="height:90%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:2%;background:#F87171;border-radius:6px"></div><div style="height:92%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:2%;background:#F87171;border-radius:6px"></div><div style="height:93%;background:#12B886;border-radius:8px"></div></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px"><div style="height:4%;background:#F87171;border-radius:6px"></div><div style="height:70%;background:linear-gradient(180deg,#2F5BEA,#5B8CFF);border-radius:8px"></div></div>
        </div>
        <div class="row between xs muted" style="margin-top:10px;font-weight:600;padding:0 6px"><span>F</span><span>S</span><span>S</span><span>M</span><span>T</span><span>W</span><span style="color:#2F5BEA">T</span></div>
      </div>
    </div>

    <!-- flag reasons -->
    <div class="px" style="margin-top:22px"><div class="h2">Why doses were flagged</div></div>
    <div class="px" style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="card" style="padding:16px"><div class="ico grad-red" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-weight-scale"></i></div><div class="big" style="font-size:28px;margin-top:12px">5</div><div class="xs muted" style="margin-top:4px;font-weight:600">No weight drop</div></div>
      <div class="card" style="padding:16px"><div class="ico grad-violet" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-volume-xmark"></i></div><div class="big" style="font-size:28px;margin-top:12px">3</div><div class="xs muted" style="margin-top:4px;font-weight:600">Replayed sound</div></div>
      <div class="card" style="padding:16px"><div class="ico grad-amber" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-eye-slash"></i></div><div class="big" style="font-size:28px;margin-top:12px">3</div><div class="xs muted" style="margin-top:4px;font-weight:600">Camera blocked</div></div>
      <div class="card" style="padding:16px"><div class="ico grad-sky" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-shuffle"></i></div><div class="big" style="font-size:28px;margin-top:12px">1</div><div class="xs muted" style="margin-top:4px;font-weight:600">Out of order</div></div>
    </div>

    <div class="px" style="margin-top:18px">
      <div class="row" style="gap:12px">
        <div style="flex:1;height:56px;border-radius:18px;background:#0F172A;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px"><i class="fas fa-file-pdf"></i>Export for parents</div>
        <div style="width:56px;height:56px;border-radius:18px;background:#fff;border:1.5px solid #E2E8F0;display:flex;align-items:center;justify-content:center;color:#2F5BEA"><i class="fas fa-fingerprint"></i></div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab on"><i class="fas fa-house"></i>Today</div><div class="tab"><i class="fas fa-children"></i>Campers</div><div class="tab"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab"><i class="fas fa-trophy"></i>Rewards</div><div class="tab"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
