<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="scroll">
    <div class="status"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px">
      <div class="iconbtn"><i class="fas fa-chevron-left"></i></div>
      <div style="font-weight:700">Dose record</div>
      <div class="iconbtn"><i class="fas fa-arrow-up-from-bracket"></i></div>
    </div>

    <!-- verdict -->
    <div class="px" style="margin-top:20px">
      <div style="border-radius:28px;padding:22px;background:linear-gradient(135deg,#0FA578,#12B886 55%,#5EEAD4);color:#fff;position:relative;overflow:hidden">
        <div style="position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)"></div>
        <div class="row" style="gap:14px">
          <div style="width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:26px"><i class="fas fa-shield-halved"></i></div>
          <div>
            <div style="font-size:26px;font-weight:800;letter-spacing:-.5px">Verified</div>
            <div class="small" style="opacity:.9;font-weight:500">Maya C. · Cetirizine 5 mg · 08:02</div>
          </div>
        </div>
        <div class="row" style="gap:8px;margin-top:18px">
          <span class="pill" style="background:rgba(255,255,255,.22);color:#fff"><i class="fas fa-box-open"></i>Lid</span>
          <span class="pill" style="background:rgba(255,255,255,.22);color:#fff"><i class="fas fa-weight-scale"></i>Scale</span>
          <span class="pill" style="background:rgba(255,255,255,.22);color:#fff"><i class="fas fa-video"></i>Cam</span>
          <span class="pill" style="background:rgba(255,255,255,.22);color:#fff"><i class="fas fa-wave-square"></i>Mic</span>
        </div>
      </div>
    </div>

    <!-- video -->
    <div class="px" style="margin-top:16px">
      <div style="position:relative;height:190px;border-radius:24px;overflow:hidden">
        <img src="https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=900&q=80&auto=format&fit=crop" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,23,42,.75))"></div>
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#0F172A;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)"><i class="fas fa-play" style="margin-left:4px"></i></div>
        <div style="position:absolute;left:16px;bottom:14px;color:#fff;font-weight:700" class="small">Pill removal clip</div>
        <span style="position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px">0:14</span>
      </div>
    </div>

    <!-- weight trace -->
    <div class="px" style="margin-top:16px">
      <div class="card" style="padding:18px">
        <div class="row between"><div style="font-weight:700">Scale trace</div><span class="pill ok">−0.21 g</span></div>
        <svg width="100%" height="110" viewBox="0 0 340 110" style="margin-top:10px">
          <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12B886" stop-opacity=".25"/><stop offset="1" stop-color="#12B886" stop-opacity="0"/></linearGradient></defs>
          <line x1="0" y1="30" x2="340" y2="30" stroke="#EEF2F7"/><line x1="0" y1="80" x2="340" y2="80" stroke="#EEF2F7"/>
          <path d="M0 30 L110 30 L118 22 L126 40 L134 26 L150 30 L170 30 L178 70 L186 84 L196 78 L210 80 L340 80 L340 110 L0 110Z" fill="url(#wg)"/>
          <path d="M0 30 L110 30 L118 22 L126 40 L134 26 L150 30 L170 30 L178 70 L186 84 L196 78 L210 80 L340 80" fill="none" stroke="#12B886" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="118" cy="22" r="5" fill="#2F5BEA"/><text x="96" y="14" font-size="10" fill="#64748B" font-weight="600">lid</text>
          <circle cx="186" cy="84" r="5" fill="#12B886"/><text x="196" y="102" font-size="10" fill="#64748B" font-weight="600">pill out</text>
        </svg>
      </div>
    </div>

    <!-- sequence -->
    <div class="px" style="margin-top:16px">
      <div class="card" style="padding:18px">
        <div style="font-weight:700;margin-bottom:12px">Signal order</div>
        <div class="row" style="gap:0;justify-content:space-between;position:relative">
          <div style="position:absolute;left:20px;right:20px;top:20px;height:3px;background:#12B886;border-radius:3px"></div>
          <div style="text-align:center;position:relative"><div class="ico grad-green" style="width:42px;height:42px;border-radius:50%;margin:0 auto;font-size:15px;border:3px solid #fff"><i class="fas fa-box-open"></i></div><div class="xs muted" style="margin-top:6px;font-weight:600">0.0s</div></div>
          <div style="text-align:center;position:relative"><div class="ico grad-green" style="width:42px;height:42px;border-radius:50%;margin:0 auto;font-size:15px;border:3px solid #fff"><i class="fas fa-video"></i></div><div class="xs muted" style="margin-top:6px;font-weight:600">2.4s</div></div>
          <div style="text-align:center;position:relative"><div class="ico grad-green" style="width:42px;height:42px;border-radius:50%;margin:0 auto;font-size:15px;border:3px solid #fff"><i class="fas fa-weight-scale"></i></div><div class="xs muted" style="margin-top:6px;font-weight:600">2.6s</div></div>
          <div style="text-align:center;position:relative"><div class="ico grad-green" style="width:42px;height:42px;border-radius:50%;margin:0 auto;font-size:15px;border:3px solid #fff"><i class="fas fa-wave-square"></i></div><div class="xs muted" style="margin-top:6px;font-weight:600">3.1s</div></div>
          <div style="text-align:center;position:relative"><div class="ico grad-blue" style="width:42px;height:42px;border-radius:50%;margin:0 auto;font-size:15px;border:3px solid #fff"><i class="fas fa-user-nurse"></i></div><div class="xs muted" style="margin-top:6px;font-weight:600">9.0s</div></div>
        </div>
      </div>
    </div>

    <div class="px" style="margin-top:14px">
      <div class="row" style="gap:12px;padding:14px 16px;border-radius:18px;background:#EEF2FF">
        <i class="fas fa-lock" style="color:#2F5BEA"></i>
        <div style="flex:1" class="xs"><span style="font-weight:700">Sealed on device</span> <span class="muted" style="font-family:ui-monospace,Menlo,monospace">sha256 9f3a…c2e1</span></div>
        <i class="fas fa-circle-check" style="color:#2F5BEA"></i>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab on"><i class="fas fa-house"></i>Today</div><div class="tab"><i class="fas fa-children"></i>Campers</div><div class="tab"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab"><i class="fas fa-trophy"></i>Rewards</div><div class="tab"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
