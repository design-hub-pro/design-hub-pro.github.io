<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen" style="background:#0B1020">
  <div class="scroll">
    <div class="status light"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px;color:#fff">
      <div class="iconbtn" style="background:rgba(255,255,255,.08);color:#fff;box-shadow:none"><i class="fas fa-chevron-left"></i></div>
      <div style="text-align:center">
        <div style="font-weight:700">Box 07 · Maya C.</div>
        <div class="xs" style="color:#94A3B8">Cetirizine 5 mg · 1 tablet</div>
      </div>
      <div class="iconbtn" style="background:rgba(255,255,255,.08);color:#fff;box-shadow:none"><i class="fas fa-ellipsis"></i></div>
    </div>

    <!-- camera feed -->
    <div class="px" style="margin-top:18px">
      <div style="position:relative;height:300px;border-radius:28px;overflow:hidden">
        <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=900&q=80&auto=format&fit=crop" style="width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.05)">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.45),transparent 35%,transparent 60%,rgba(11,16,32,.85))"></div>
        <!-- detection box -->
        <div style="position:absolute;left:120px;top:96px;width:120px;height:86px;border:2.5px solid #34D399;border-radius:12px;box-shadow:0 0 0 4000px rgba(11,16,32,.18)">
          <span style="position:absolute;top:-26px;left:-2px;background:#34D399;color:#062A1E;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px">PILL · slot B · 0.96</span>
        </div>
        <div style="position:absolute;left:250px;top:150px;width:60px;height:60px;border:2px dashed rgba(255,255,255,.6);border-radius:30px"></div>
        <div style="position:absolute;top:16px;left:16px" class="row" >
          <span class="pill" style="background:rgba(239,68,68,.92);color:#fff"><span class="dot" style="background:#fff"></span>REC 00:09</span>
        </div>
        <div style="position:absolute;top:16px;right:16px">
          <span class="pill" style="background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px)"><i class="fas fa-video"></i>Inner cam</span>
        </div>
        <div style="position:absolute;left:18px;right:18px;bottom:16px;color:#fff" class="row between">
          <div class="xs" style="font-weight:600;opacity:.85"><i class="fas fa-lightbulb" style="color:#FBBF24"></i> Lens clear · IR on</div>
          <div class="xs" style="font-weight:600;opacity:.85">720p · 15 fps</div>
        </div>
      </div>
    </div>

    <!-- progress -->
    <div class="px" style="margin-top:22px;color:#fff">
      <div class="row between"><div class="h2">Verifying dose</div><div style="font-weight:800;font-size:22px">3<span style="color:#64748B">/4</span></div></div>
      <div class="row" style="gap:6px;margin-top:12px">
        <div style="flex:1;height:6px;border-radius:9px;background:#34D399"></div>
        <div style="flex:1;height:6px;border-radius:9px;background:#34D399"></div>
        <div style="flex:1;height:6px;border-radius:9px;background:#34D399"></div>
        <div style="flex:1;height:6px;border-radius:9px;background:linear-gradient(90deg,#5B8CFF 55%,#1E293B 55%)"></div>
      </div>
    </div>

    <!-- signal tiles -->
    <div class="px" style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:#141B2F;border-radius:22px;padding:16px;color:#fff">
        <div class="row between"><div class="ico grad-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-box-open"></i></div><i class="fas fa-circle-check" style="color:#34D399;font-size:18px"></i></div>
        <div style="font-size:24px;font-weight:800;margin-top:12px">08:02:11</div>
        <div class="xs" style="color:#94A3B8;margin-top:2px;font-weight:600">Lid opened</div>
      </div>
      <div style="background:#141B2F;border-radius:22px;padding:16px;color:#fff">
        <div class="row between"><div class="ico grad-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-weight-scale"></i></div><i class="fas fa-circle-check" style="color:#34D399;font-size:18px"></i></div>
        <div style="font-size:24px;font-weight:800;margin-top:12px">−0.21 g</div>
        <div class="xs" style="color:#94A3B8;margin-top:2px;font-weight:600">Expected 0.20 ± 0.04</div>
      </div>
      <div style="background:#141B2F;border-radius:22px;padding:16px;color:#fff">
        <div class="row between"><div class="ico grad-green" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-hand-holding-medical"></i></div><i class="fas fa-circle-check" style="color:#34D399;font-size:18px"></i></div>
        <div style="font-size:24px;font-weight:800;margin-top:12px">1 pill</div>
        <div class="xs" style="color:#94A3B8;margin-top:2px;font-weight:600">Removed on camera</div>
      </div>
      <div style="background:#141B2F;border-radius:22px;padding:16px;color:#fff;border:1.5px solid #2F5BEA">
        <div class="row between"><div class="ico grad-blue" style="width:38px;height:38px;border-radius:12px;font-size:15px"><i class="fas fa-wave-square"></i></div><i class="fas fa-circle-notch fa-spin" style="color:#5B8CFF;font-size:18px"></i></div>
        <svg width="100%" height="30" viewBox="0 0 160 30" style="margin-top:10px">
          <g fill="#5B8CFF">
            <rect x="0" y="12" width="4" height="6" rx="2"/><rect x="8" y="8" width="4" height="14" rx="2"/><rect x="16" y="3" width="4" height="24" rx="2"/><rect x="24" y="10" width="4" height="10" rx="2"/><rect x="32" y="6" width="4" height="18" rx="2"/><rect x="40" y="0" width="4" height="30" rx="2"/><rect x="48" y="9" width="4" height="12" rx="2"/><rect x="56" y="5" width="4" height="20" rx="2"/><rect x="64" y="11" width="4" height="8" rx="2"/><rect x="72" y="4" width="4" height="22" rx="2"/>
          </g>
          <g fill="#334155"><rect x="80" y="12" width="4" height="6" rx="2"/><rect x="88" y="12" width="4" height="6" rx="2"/><rect x="96" y="12" width="4" height="6" rx="2"/><rect x="104" y="12" width="4" height="6" rx="2"/><rect x="112" y="12" width="4" height="6" rx="2"/><rect x="120" y="12" width="4" height="6" rx="2"/><rect x="128" y="12" width="4" height="6" rx="2"/><rect x="136" y="12" width="4" height="6" rx="2"/><rect x="144" y="12" width="4" height="6" rx="2"/><rect x="152" y="12" width="4" height="6" rx="2"/></g>
        </svg>
        <div class="xs" style="color:#94A3B8;margin-top:4px;font-weight:600">Sound: live check</div>
      </div>
    </div>

    <div class="px" style="margin-top:20px">
      <div class="row" style="gap:12px">
        <div style="flex:1;height:56px;border-radius:18px;background:linear-gradient(135deg,#2F5BEA,#12B886);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px"><i class="fas fa-user-nurse"></i>I witnessed this dose</div>
        <div style="width:56px;height:56px;border-radius:18px;background:#141B2F;color:#F87171;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-flag"></i></div>
      </div>
    </div>
  </div>
  <nav class="tabbar"><div class="tab"><i class="fas fa-house"></i>Today</div><div class="tab"><i class="fas fa-children"></i>Campers</div><div class="tab on"><div class="fab"><i class="fas fa-box-open"></i></div>Live</div><div class="tab"><i class="fas fa-trophy"></i>Rewards</div><div class="tab"><i class="fas fa-microchip"></i>Boxes</div></nav>
</div>

</body>
</html>
