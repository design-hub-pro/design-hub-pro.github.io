<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">
</head>
<body>
<div class="screen" style="background:linear-gradient(180deg,#4F46E5 0%,#7C3AED 45%,#EC4899 100%)">
  <!-- confetti -->
  <div style="position:absolute;inset:0;pointer-events:none">
    <span style="position:absolute;left:40px;top:120px;width:10px;height:18px;background:#FDE047;border-radius:3px;transform:rotate(20deg)"></span>
    <span style="position:absolute;left:110px;top:90px;width:9px;height:9px;background:#34D399;border-radius:50%"></span>
    <span style="position:absolute;right:60px;top:110px;width:10px;height:18px;background:#38BDF8;border-radius:3px;transform:rotate(-25deg)"></span>
    <span style="position:absolute;right:120px;top:170px;width:8px;height:8px;background:#FDE047;border-radius:50%"></span>
    <span style="position:absolute;left:70px;top:330px;width:12px;height:6px;background:#F9A8D4;border-radius:3px;transform:rotate(40deg)"></span>
    <span style="position:absolute;right:40px;top:300px;width:10px;height:10px;background:#A7F3D0;border-radius:2px;transform:rotate(15deg)"></span>
    <span style="position:absolute;left:200px;top:150px;width:6px;height:14px;background:#fff;border-radius:3px;transform:rotate(-10deg);opacity:.8"></span>
  </div>
  <div class="scroll" style="padding-bottom:30px">
    <div class="status light"><span>8:04</span><div class="island"></div><div class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div></div>
    <div class="px row between" style="margin-top:6px;color:#fff">
      <div class="row" style="gap:10px">
        <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=120&q=80&auto=format&fit=crop&crop=faces" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2.5px solid rgba(255,255,255,.7)">
        <div style="font-weight:700">Hi Maya</div>
      </div>
      <span class="pill" style="background:rgba(255,255,255,.2);color:#fff;font-size:14px"><i class="fas fa-star" style="color:#FDE047"></i>360</span>
    </div>

    <div style="text-align:center;margin-top:34px;color:#fff">
      <div style="position:relative;width:190px;height:190px;margin:0 auto">
        <div style="position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.14)"></div>
        <div style="position:absolute;inset:18px;border-radius:50%;background:rgba(255,255,255,.18)"></div>
        <div style="position:absolute;inset:36px;border-radius:50%;background:linear-gradient(135deg,#FDE047,#F59E0B);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.25)">
          <i class="fas fa-paw" style="font-size:54px;color:#fff"></i>
        </div>
        <span style="position:absolute;right:6px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#12B886;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px"><i class="fas fa-check"></i></span>
      </div>
      <div style="font-size:34px;font-weight:900;letter-spacing:-1px;margin-top:22px">Dose done!</div>
      <div style="font-size:17px;opacity:.9;margin-top:4px;font-weight:500">You earned the Brave Bear badge</div>
      <div style="display:inline-block;margin-top:18px;padding:10px 22px;border-radius:999px;background:#fff;color:#7C3AED;font-weight:900;font-size:26px">+20</div>
    </div>

    <!-- streak -->
    <div class="px" style="margin-top:30px">
      <div style="border-radius:26px;padding:18px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);color:#fff">
        <div class="row between"><div style="font-weight:700"><i class="fas fa-fire" style="color:#FDBA74"></i> 7 day streak</div><div class="xs" style="font-weight:700;opacity:.85">3 to Camp Hero</div></div>
        <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px">
          <div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047"></div><div style="height:30px;border-radius:9px;background:#FDE047;box-shadow:0 0 0 3px #fff"></div><div style="height:30px;border-radius:9px;background:rgba(255,255,255,.22)"></div><div style="height:30px;border-radius:9px;background:rgba(255,255,255,.22)"></div><div style="height:30px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center"><i class="fas fa-crown" style="font-size:13px;color:#FDE047"></i></div>
        </div>
      </div>
    </div>

    <!-- badge row -->
    <div class="px row between" style="margin-top:18px">
      <div style="width:76px;height:76px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:#F59E0B"><i class="fas fa-paw"></i></div>
      <div style="width:76px;height:76px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:#0EA5E9"><i class="fas fa-water"></i></div>
      <div style="width:76px;height:76px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:#16A34A"><i class="fas fa-tree"></i></div>
      <div style="width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.75)"><i class="fas fa-lock"></i></div>
    </div>

    <div class="px" style="margin-top:26px">
      <div style="height:60px;border-radius:20px;background:#fff;color:#4F46E5;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px"><i class="fas fa-gift"></i>Spend points</div>
    </div>
  </div>
</div>

</body>
</html>
