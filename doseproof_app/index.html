<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoseProof · Verified camp medication</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #0F172A; -webkit-font-smoothing: antialiased; }
  .hero { text-align: center; padding: 64px 20px 36px; }
  .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 1rem; background: linear-gradient(135deg, #2F5BEA, #12B886); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; box-shadow: 0 12px 28px rgba(47,91,234,.28); }
  h1 { font-size: 48px; font-weight: 900; letter-spacing: -1.5px; }
  .tagline { font-size: 18px; color: #64748B; margin-top: 10px; }
  .tags { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .tags span { font-size: 13px; font-weight: 600; color: #475569; background: #F1F5F9; padding: 6px 14px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(3, 460px); gap: 48px 40px; justify-content: center; padding: 20px 40px 80px; }
  @media (max-width: 1540px) { .grid { grid-template-columns: repeat(2, 460px); } }
  @media (max-width: 1020px) { .grid { grid-template-columns: 460px; } }
  .phone { width: 460px; height: 980px; border-radius: 62px; padding: 12px; background: #0B0B0F; box-shadow: 0 0 0 2px #2A2A31 inset, 0 30px 70px rgba(15,23,42,.18), 0 10px 24px rgba(15,23,42,.10); }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 52px; display: block; background: #F5F7FB; }
</style>
</head>
<body>
  <header class="hero">
    <div class="logo"><i class="fas fa-shield-halved"></i></div>
    <h1>DoseProof</h1>
    <p class="tagline">A camp medicine box that proves each dose was really taken, then rewards the child.</p>
    <div class="tags"><span>Pediatric Health</span><span>Anti-Spoofing</span><span>IoT</span><span>Gamification</span></div>
  </header>
  <main class="grid">
    <div class="phone"><iframe src="home.html" scrolling="no" title="Today"></iframe></div>
    <div class="phone"><iframe src="live.html" scrolling="no" title="Live dose"></iframe></div>
    <div class="phone"><iframe src="evidence.html" scrolling="no" title="Verified record"></iframe></div>
    <div class="phone"><iframe src="flagged.html" scrolling="no" title="Flagged dose"></iframe></div>
    <div class="phone"><iframe src="kid.html" scrolling="no" title="Child reward"></iframe></div>
    <div class="phone"><iframe src="camper.html" scrolling="no" title="Camper"></iframe></div>
    <div class="phone"><iframe src="rewards.html" scrolling="no" title="Rewards"></iframe></div>
    <div class="phone"><iframe src="boxes.html" scrolling="no" title="Boxes"></iframe></div>
    <div class="phone"><iframe src="reports.html" scrolling="no" title="Weekly report"></iframe></div>
  </main>
</body>
</html>
