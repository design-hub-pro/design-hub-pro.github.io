<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyNest - Home</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-scrollbar: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Nunito', sans-serif; }
  body { background: #1a1520; color: #fff; position: relative; }

  /* Status Bar */
  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100;
  }
  .status-time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  }

  /* Background Room Scene */
  .room-scene {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    background: linear-gradient(180deg, #1a1520 0%, #2d2040 30%, #3d2a55 60%, #2a1f3d 100%);
  }
  .room-scene::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, transparent, rgba(26,21,32,0.95));
  }

  /* Stars */
  .stars { position: absolute; top: 60px; left: 0; right: 0; height: 200px; }
  .star {
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  .star:nth-child(1) { top: 20px; left: 15%; animation-delay: 0s; }
  .star:nth-child(2) { top: 45px; left: 35%; animation-delay: 0.5s; width: 2px; height: 2px; }
  .star:nth-child(3) { top: 30px; left: 55%; animation-delay: 1s; }
  .star:nth-child(4) { top: 60px; left: 75%; animation-delay: 1.5s; width: 2px; height: 2px; }
  .star:nth-child(5) { top: 15px; left: 85%; animation-delay: 2s; }
  .star:nth-child(6) { top: 80px; left: 25%; animation-delay: 0.8s; width: 2px; height: 2px; }
  .star:nth-child(7) { top: 50px; left: 65%; animation-delay: 1.3s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* Window */
  .window {
    position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 160px; border-radius: 100px 100px 16px 16px;
    background: linear-gradient(180deg, #4a3a6a 0%, #6a4a8a 50%, #8a6aaa 100%);
    border: 6px solid #5a4a6a; overflow: hidden;
  }
  .moon {
    width: 50px; height: 50px; background: #ffe8a0; border-radius: 50%;
    position: absolute; top: 25px; right: 30px;
    box-shadow: 0 0 30px rgba(255,232,160,0.5), 0 0 60px rgba(255,232,160,0.2);
  }
  .window-divider-v { position: absolute; top: 0; left: 50%; width: 5px; height: 100%; background: #5a4a6a; transform: translateX(-50%); }
  .window-divider-h { position: absolute; top: 50%; left: 0; width: 100%; height: 5px; background: #5a4a6a; transform: translateY(-50%); }

  /* Furniture */
  .couch {
    position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 80px; background: linear-gradient(180deg, #8a6aaa, #6a4a8a);
    border-radius: 20px 20px 8px 8px;
  }
  .couch-cushion {
    position: absolute; top: 8px; width: 75px; height: 45px; background: #9a7aba;
    border-radius: 12px;
  }
  .couch-cushion:nth-child(1) { left: 15px; }
  .couch-cushion:nth-child(2) { left: 95px; }
  .couch-cushion:nth-child(3) { left: 172px; }
  .couch-back {
    position: absolute; top: -25px; left: 5px; right: 5px; height: 30px;
    background: linear-gradient(180deg, #7a5a9a, #8a6aaa); border-radius: 12px 12px 0 0;
  }

  .lamp {
    position: absolute; bottom: 260px; right: 40px;
  }
  .lamp-shade {
    width: 50px; height: 35px; background: linear-gradient(180deg, #ffcc70, #ffa840);
    border-radius: 50% 50% 0 0; margin: 0 auto;
    box-shadow: 0 -10px 40px rgba(255,200,100,0.3);
  }
  .lamp-stand { width: 6px; height: 50px; background: #8a7a6a; margin: 0 auto; }
  .lamp-base { width: 30px; height: 6px; background: #8a7a6a; border-radius: 3px; margin: 0 auto; }
  .lamp-glow {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px; background: radial-gradient(ellipse, rgba(255,200,100,0.15), transparent);
    pointer-events: none;
  }

  .plant {
    position: absolute; bottom: 220px; left: 30px;
  }
  .plant-pot { width: 36px; height: 30px; background: #c4856a; border-radius: 4px 4px 8px 8px; margin: 0 auto; }
  .plant-leaf {
    width: 20px; height: 30px; background: #5a9a6a; border-radius: 50% 0 50% 0;
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%) rotate(-15deg);
  }
  .plant-leaf:nth-child(2) { transform: translateX(-80%) rotate(-35deg); }
  .plant-leaf:nth-child(3) { transform: translateX(-20%) rotate(10deg); }

  .rug {
    position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 30px; background: linear-gradient(90deg, #8a5a6a, #aa7a8a, #8a5a6a);
    border-radius: 50%; opacity: 0.6;
  }

  /* Content Overlay */
  .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }

  /* Greeting */
  .greeting { padding: 8px 28px 0; }
  .greeting-small { font-size: 14px; color: rgba(255,255,255,0.6); font-weight: 500; }
  .greeting-big { font-size: 26px; font-weight: 800; margin-top: 2px; }
  .greeting-big span { color: #ffcc70; }

  /* Mood Card */
  .mood-card {
    margin: 16px 28px; padding: 18px 20px; border-radius: 20px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .mood-label { font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 600; margin-bottom: 12px; }
  .mood-options { display: flex; justify-content: space-between; }
  .mood-item { text-align: center; cursor: pointer; }
  .mood-emoji {
    width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: rgba(255,255,255,0.06); margin-bottom: 4px; transition: all 0.3s;
  }
  .mood-item.active .mood-emoji {
    background: linear-gradient(135deg, #ffcc70, #ff9a40);
    box-shadow: 0 4px 15px rgba(255,200,100,0.3);
  }
  .mood-text { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 500; }
  .mood-item.active .mood-text { color: #ffcc70; }

  /* Quick Actions */
  .quick-actions { padding: 0 28px; margin-top: auto; margin-bottom: 16px; }
  .action-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .action-card {
    flex: 1; padding: 16px; border-radius: 20px; backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08); position: relative; overflow: hidden;
  }
  .action-card.chat {
    background: linear-gradient(135deg, rgba(138,106,170,0.4), rgba(106,74,138,0.3));
  }
  .action-card.music {
    background: linear-gradient(135deg, rgba(106,138,170,0.4), rgba(74,106,138,0.3));
  }
  .action-card.community {
    background: linear-gradient(135deg, rgba(170,138,106,0.4), rgba(138,106,74,0.3));
  }
  .action-card.decor {
    background: linear-gradient(135deg, rgba(138,170,106,0.4), rgba(106,138,74,0.3));
  }
  .action-icon {
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 10px;
  }
  .action-card.chat .action-icon { background: rgba(168,130,200,0.3); color: #c8a0f0; }
  .action-card.music .action-icon { background: rgba(130,168,200,0.3); color: #a0c8f0; }
  .action-card.community .action-icon { background: rgba(200,168,130,0.3); color: #f0c8a0; }
  .action-card.decor .action-icon { background: rgba(168,200,130,0.3); color: #a0f0a8; }
  .action-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .action-sub { font-size: 11px; color: rgba(255,255,255,0.4); }

  /* Now Playing Mini */
  .now-playing {
    margin: 0 28px 12px; padding: 12px 16px; border-radius: 16px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
    display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .np-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #6a4a8a, #8a6aaa);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .np-info { flex: 1; }
  .np-title { font-size: 12px; font-weight: 600; }
  .np-artist { font-size: 10px; color: rgba(255,255,255,0.4); }
  .np-bars { display: flex; gap: 2px; align-items: flex-end; height: 18px; }
  .np-bar {
    width: 3px; background: #ffcc70; border-radius: 2px;
    animation: soundbar 1s ease-in-out infinite;
  }
  .np-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .np-bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
  .np-bar:nth-child(3) { height: 10px; animation-delay: 0.4s; }
  .np-bar:nth-child(4) { height: 16px; animation-delay: 0.1s; }
  @keyframes soundbar {
    0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); }
  }

  /* Tab Bar */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 88px;
    background: rgba(26,21,32,0.95); backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px;
  }
  .tab-item { text-align: center; width: 60px; }
  .tab-icon { font-size: 22px; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
  .tab-label { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 600; }
  .tab-item.active .tab-icon { color: #ffcc70; }
  .tab-item.active .tab-label { color: #ffcc70; }
  .home-indicator {
    width: 134px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px;
    margin: 0 auto; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  }
</style>
</head>
<body>
  <!-- Room Scene Background -->
  <div class="room-scene">
    <div class="stars">
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    </div>
    <div class="window">
      <div class="moon"></div>
      <div class="window-divider-v"></div>
      <div class="window-divider-h"></div>
    </div>
    <div class="lamp">
      <div class="lamp-glow"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-stand"></div>
      <div class="lamp-base"></div>
    </div>
    <div class="plant">
      <div class="plant-leaf"></div>
      <div class="plant-leaf"></div>
      <div class="plant-leaf"></div>
      <div class="plant-pot"></div>
    </div>
    <div class="couch">
      <div class="couch-back"></div>
      <div class="couch-cushion"></div>
      <div class="couch-cushion"></div>
      <div class="couch-cushion"></div>
    </div>
    <div class="rug"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="dynamic-island"></div>
      <div class="status-icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Greeting -->
    <div class="greeting">
      <div class="greeting-small">Good evening,</div>
      <div class="greeting-big">Welcome home, <span>Eric</span> 🌙</div>
    </div>

    <!-- Mood Check-in -->
    <div class="mood-card">
      <div class="mood-label">HOW ARE YOU FEELING?</div>
      <div class="mood-options">
        <div class="mood-item">
          <div class="mood-emoji">😊</div>
          <div class="mood-text">Great</div>
        </div>
        <div class="mood-item">
          <div class="mood-emoji">🙂</div>
          <div class="mood-text">Good</div>
        </div>
        <div class="mood-item active">
          <div class="mood-emoji">😌</div>
          <div class="mood-text">Calm</div>
        </div>
        <div class="mood-item">
          <div class="mood-emoji">😔</div>
          <div class="mood-text">Low</div>
        </div>
        <div class="mood-item">
          <div class="mood-emoji">😢</div>
          <div class="mood-text">Sad</div>
        </div>
      </div>
    </div>

    <!-- Spacer -->
    <div style="flex:1"></div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <div class="action-row">
        <div class="action-card chat">
          <div class="action-icon"><i class="fas fa-comment-dots"></i></div>
          <div class="action-title">Talk to Coco</div>
          <div class="action-sub">Your AI companion</div>
        </div>
        <div class="action-card music">
          <div class="action-icon"><i class="fas fa-music"></i></div>
          <div class="action-title">Soundscapes</div>
          <div class="action-sub">Relax & unwind</div>
        </div>
      </div>
      <div class="action-row">
        <div class="action-card community">
          <div class="action-icon"><i class="fas fa-heart"></i></div>
          <div class="action-title">Warmth Wall</div>
          <div class="action-sub">12 new messages</div>
        </div>
        <div class="action-card decor">
          <div class="action-icon"><i class="fas fa-couch"></i></div>
          <div class="action-title">Decorate</div>
          <div class="action-sub">Make it yours</div>
        </div>
      </div>
    </div>

    <!-- Now Playing -->
    <div class="now-playing">
      <div class="np-icon"><i class="fas fa-cloud-rain"></i></div>
      <div class="np-info">
        <div class="np-title">Rainy Evening</div>
        <div class="np-artist">Ambient Sounds</div>
      </div>
      <div class="np-bars">
        <div class="np-bar"></div>
        <div class="np-bar"></div>
        <div class="np-bar"></div>
        <div class="np-bar"></div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div style="height: 88px; flex-shrink: 0;"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon"><i class="fas fa-home"></i></div>
      <div class="tab-label">Home</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><i class="fas fa-comment-dots"></i></div>
      <div class="tab-label">Chat</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><i class="fas fa-couch"></i></div>
      <div class="tab-label">Room</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><i class="fas fa-heart"></i></div>
      <div class="tab-label">Warmth</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><i class="fas fa-user"></i></div>
      <div class="tab-label">Profile</div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
