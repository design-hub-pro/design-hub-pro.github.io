<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyNest - Welcome</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; font-family: 'Nunito', sans-serif; }
  body {
    background: linear-gradient(180deg, #1a1520 0%, #2d2040 40%, #3d2a55 70%, #2a1f3d 100%);
    color: #fff; display: flex; flex-direction: column;
  }

  .status-bar {
    height: 59px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 100;
  }
  .status-time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons i { font-size: 13px; }
  .dynamic-island {
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  }

  /* Particles */
  .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
  .particle {
    position: absolute; border-radius: 50%; animation: drift 8s ease-in-out infinite;
  }
  .particle:nth-child(1) { width: 6px; height: 6px; background: rgba(255,204,112,0.3); top: 15%; left: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { width: 4px; height: 4px; background: rgba(255,154,170,0.3); top: 25%; left: 70%; animation-delay: 1s; }
  .particle:nth-child(3) { width: 8px; height: 8px; background: rgba(154,192,255,0.2); top: 40%; left: 40%; animation-delay: 2s; }
  .particle:nth-child(4) { width: 5px; height: 5px; background: rgba(192,160,255,0.3); top: 55%; left: 80%; animation-delay: 3s; }
  .particle:nth-child(5) { width: 3px; height: 3px; background: rgba(255,204,112,0.4); top: 70%; left: 15%; animation-delay: 4s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); opacity: 0.3; }
    25% { transform: translate(20px, -15px); opacity: 0.8; }
    50% { transform: translate(-10px, -30px); opacity: 0.5; }
    75% { transform: translate(15px, -10px); opacity: 0.9; }
  }

  .content {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 40px; position: relative; z-index: 10; text-align: center;
  }

  /* House Icon */
  .house-icon {
    width: 120px; height: 120px; margin-bottom: 30px; position: relative;
  }
  .house-body {
    width: 80px; height: 70px; background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
    border-radius: 12px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
  }
  .house-roof {
    width: 0; height: 0; border-left: 55px solid transparent; border-right: 55px solid transparent;
    border-bottom: 40px solid rgba(255,204,112,0.15);
    position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
  }
  .house-door {
    width: 24px; height: 32px; background: linear-gradient(180deg, #ffcc70, #ff9a40);
    border-radius: 12px 12px 0 0; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  }
  .house-window-l, .house-window-r {
    width: 16px; height: 16px; border-radius: 4px; position: absolute; top: 14px;
    background: rgba(255,204,112,0.3); border: 1px solid rgba(255,204,112,0.2);
  }
  .house-window-l { left: 10px; }
  .house-window-r { right: 10px; }
  .house-glow {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 60px;
    background: radial-gradient(ellipse, rgba(255,204,112,0.15), transparent);
  }
  .house-heart {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 24px; animation: heartbeat 2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15); }
  }

  .welcome-title {
    font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 12px;
  }
  .welcome-title span { color: #ffcc70; }
  .welcome-sub {
    font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 40px;
    max-width: 300px;
  }

  /* CTA Buttons */
  .cta-primary {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, #ffcc70, #ff9a40);
    font-size: 16px; font-weight: 800; color: #1a1520;
    font-family: 'Nunito', sans-serif;
    box-shadow: 0 8px 30px rgba(255,204,112,0.3);
    margin-bottom: 14px;
  }
  .cta-secondary {
    width: 100%; padding: 16px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.7);
    font-family: 'Nunito', sans-serif;
  }

  .terms {
    font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 20px; line-height: 1.5;
  }
  .terms a { color: rgba(255,255,255,0.4); text-decoration: none; }

  /* Bottom Indicator */
  .bottom-area { padding: 20px 28px 30px; position: relative; }
  .home-indicator {
    width: 134px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="content">
    <div class="house-icon">
      <div class="house-heart">💛</div>
      <div class="house-roof"></div>
      <div class="house-body">
        <div class="house-window-l"></div>
        <div class="house-window-r"></div>
        <div class="house-door"></div>
      </div>
      <div class="house-glow"></div>
    </div>

    <div class="welcome-title">Welcome to<br><span>CozyNest</span></div>
    <div class="welcome-sub">Your virtual home sanctuary. A warm place to rest, chat, and feel cared for — anytime you need it.</div>

    <button class="cta-primary">Create My Nest</button>
    <button class="cta-secondary">I already have an account</button>

    <div class="terms">By continuing, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a></div>
  </div>

  <div class="bottom-area">
    <div class="home-indicator"></div>
  </div>
</body>
</html>
