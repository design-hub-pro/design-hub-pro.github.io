<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mandate — Enter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
body{font-family:'Inter',sans-serif;background:#14100C;color:#F2E9DB;width:100%;height:100%;overflow:hidden;scrollbar-width:none;}
.disp{font-family:'Cinzel',serif;}
.cn{font-family:'Noto Serif SC',serif;}
</style>
</head>
<body>

<!-- Background -->
<div style="position:absolute;inset:0;">
  <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900&q=80" style="width:100%;height:100%;object-fit:cover;opacity:0.55;">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,0.45) 0%,rgba(20,16,12,0.7) 45%,rgba(20,16,12,0.98) 100%);"></div>
  <!-- giant character -->
  <div class="cn" style="position:absolute;top:150px;left:50%;transform:translateX(-50%);font-size:300px;font-weight:900;color:rgba(217,169,76,0.10);line-height:1;">帝</div>
</div>

<!-- Status Bar -->
<div style="height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30;">
  <span style="font-size:15px;font-weight:600;">9:41</span>
  <div style="width:126px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px;"></div>
  <div style="display:flex;gap:6px;align-items:center;"><i class="fas fa-signal" style="font-size:13px;"></i><i class="fas fa-wifi" style="font-size:14px;"></i><i class="fas fa-battery-full" style="font-size:15px;"></i></div>
</div>

<!-- Content -->
<div style="position:relative;z-index:10;height:calc(100% - 59px);display:flex;flex-direction:column;padding:0 28px;">

  <div style="margin-top:60px;text-align:center;">
    <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid rgba(217,169,76,0.3);border-radius:30px;background:rgba(217,169,76,0.08);backdrop-filter:blur(8px);">
      <i class="fas fa-dragon" style="font-size:12px;color:#E3BC6A;"></i>
      <span style="font-size:11px;font-weight:700;letter-spacing:2px;color:#E3BC6A;">4,000 YEARS · 13 DYNASTIES</span>
    </div>
  </div>

  <div style="margin-top:auto;margin-bottom:36px;">
    <div class="cn" style="font-size:20px;color:#C8463B;font-weight:700;letter-spacing:8px;margin-bottom:14px;">天 命</div>
    <h1 class="disp" style="font-size:62px;font-weight:800;letter-spacing:2px;line-height:0.95;color:#F0CE84;text-shadow:0 4px 30px rgba(217,169,76,0.3);">MANDATE</h1>
    <p style="font-size:16px;color:#C9BCA4;line-height:1.55;margin-top:18px;max-width:330px;">Walk the throne of China's <strong style="color:#F2E9DB;">400+ emperors</strong>. Live the moments that shaped a civilization — in first person.</p>

    <!-- stats -->
    <div style="display:flex;gap:26px;margin-top:30px;">
      <div>
        <div class="disp" style="font-size:32px;font-weight:700;color:#E3BC6A;">438</div>
        <div style="font-size:11px;color:#A89A82;font-weight:600;letter-spacing:0.5px;">Emperors</div>
      </div>
      <div style="width:1px;background:rgba(217,169,76,0.2);"></div>
      <div>
        <div class="disp" style="font-size:32px;font-weight:700;color:#E3BC6A;">13</div>
        <div style="font-size:11px;color:#A89A82;font-weight:600;letter-spacing:0.5px;">Dynasties</div>
      </div>
      <div style="width:1px;background:rgba(217,169,76,0.2);"></div>
      <div>
        <div class="disp" style="font-size:32px;font-weight:700;color:#E3BC6A;">120</div>
        <div style="font-size:11px;color:#A89A82;font-weight:600;letter-spacing:0.5px;">Card Duels</div>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div style="margin-bottom:40px;">
    <button style="width:100%;height:60px;border:none;border-radius:18px;background:linear-gradient(135deg,#E3BC6A,#C8923C);color:#1A1206;font-size:16px;font-weight:800;letter-spacing:0.5px;box-shadow:0 12px 30px rgba(217,169,76,0.35);display:flex;align-items:center;justify-content:center;gap:10px;" class="disp">
      ENTER THE COURT <i class="fas fa-arrow-right" style="font-size:14px;"></i>
    </button>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:#A89A82;">Already ascended? <span style="color:#E3BC6A;font-weight:700;">Sign in</span></div>
  </div>

</div>

</body>
</html>
