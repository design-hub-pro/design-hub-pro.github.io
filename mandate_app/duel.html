<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mandate — Dynasty Duel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
*::-webkit-scrollbar{display:none;}
body{font-family:'Inter',sans-serif;background:#14100C;color:#F2E9DB;width:100%;height:100%;overflow:hidden;scrollbar-width:none;}
.disp{font-family:'Cinzel',serif;}
.cn{font-family:'Noto Serif SC',serif;}
</style>
</head>
<body>

<!-- ambient bg -->
<div style="position:absolute;inset:0;opacity:0.25;"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80" style="width:100%;height:100%;object-fit:cover;"></div>
<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(200,70,59,0.18),rgba(20,16,12,0.96) 70%);"></div>

<!-- Status bar -->
<div style="height:59px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:30;">
  <span style="font-size:15px;font-weight:600;">9:41</span>
  <div style="width:126px;height:37px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px;"></div>
  <div style="display:flex;gap:6px;align-items:center;"><i class="fas fa-signal" style="font-size:13px;"></i><i class="fas fa-wifi" style="font-size:14px;"></i><i class="fas fa-battery-full" style="font-size:15px;"></i></div>
</div>

<!-- Header: score -->
<div style="position:relative;z-index:10;padding:2px 28px 0;display:flex;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:8px;"><i class="fas fa-xmark" style="font-size:17px;color:#A89A82;"></i></div>
  <div style="text-align:center;">
    <div style="font-size:11px;color:#A89A82;font-weight:700;letter-spacing:1px;">ROUND 3 / 5</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:3px;"><span class="disp" style="font-size:22px;font-weight:700;color:#6BB89A;">2</span><span style="font-size:13px;color:#7E7058;">YOU · AI</span><span class="disp" style="font-size:22px;font-weight:700;color:#D45A4A;">1</span></div>
  </div>
  <div style="display:flex;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#6BB89A;"></div><div style="width:8px;height:8px;border-radius:50%;background:#6BB89A;"></div><div style="width:8px;height:8px;border-radius:50%;background:#D45A4A;"></div><div style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);"></div><div style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);"></div></div>
</div>

<!-- Opponent card -->
<div style="position:relative;z-index:10;padding:18px 28px 0;display:flex;justify-content:center;">
  <div style="width:160px;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#2A1A16,#1E1812);border:1px solid rgba(200,70,59,0.4);box-shadow:0 12px 30px rgba(0,0,0,0.5);">
    <div style="height:90px;background:linear-gradient(135deg,#3A4A78,#6B82C9);display:flex;align-items:center;justify-content:center;position:relative;"><span class="cn" style="font-size:46px;font-weight:900;color:rgba(255,255,255,0.9);">宋</span><span style="position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;color:rgba(255,255,255,0.7);">AI</span></div>
    <div style="padding:10px 12px;">
      <div class="disp" style="font-size:13px;font-weight:700;color:#F2E9DB;">Emperor Taizu</div>
      <div style="font-size:9.5px;color:#A89A82;margin-top:1px;">Song · 927–976</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:8px;"><span style="color:#A89A82;">Military 武</span><span class="disp" style="color:#D45A4A;font-weight:700;">82</span></div>
    </div>
  </div>
</div>

<!-- VS contest banner -->
<div style="position:relative;z-index:10;text-align:center;margin:14px 0;">
  <div style="display:inline-flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(217,169,76,0.12);border:1px solid rgba(217,169,76,0.35);border-radius:30px;">
    <i class="fas fa-khanda" style="font-size:13px;color:#E3BC6A;"></i>
    <span class="disp" style="font-size:14px;font-weight:700;color:#F0CE84;letter-spacing:1px;">MILITARY · 武</span>
    <span style="font-size:11px;color:#6BB89A;font-weight:700;">Higher wins</span>
  </div>
</div>

<!-- Your card (highlighted) -->
<div style="position:relative;z-index:10;padding:0 28px;display:flex;justify-content:center;">
  <div style="width:178px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#2A2114,#1E1812);border:2px solid #E3BC6A;box-shadow:0 16px 40px rgba(217,169,76,0.35);">
    <div style="height:104px;background:linear-gradient(135deg,#7A3B34,#C8463B);display:flex;align-items:center;justify-content:center;position:relative;"><span class="cn" style="font-size:54px;font-weight:900;color:rgba(255,255,255,0.92);">秦</span><span style="position:absolute;top:8px;right:8px;padding:3px 7px;background:rgba(20,16,12,0.5);border-radius:7px;font-size:8.5px;font-weight:800;color:#E3BC6A;">LEGENDARY</span></div>
    <div style="padding:11px 13px;">
      <div class="disp" style="font-size:14px;font-weight:700;color:#F2E9DB;">Qin Shi Huang</div>
      <div style="font-size:9.5px;color:#A89A82;margin-top:1px;">Qin · 259–210 BCE</div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(217,169,76,0.16);"><span style="color:#E3BC6A;font-weight:700;">Military 武</span><span class="disp" style="color:#E3BC6A;font-weight:800;font-size:18px;">98</span></div>
    </div>
  </div>
</div>

<!-- learning tidbit + hand -->
<div style="position:absolute;bottom:0;left:0;right:0;z-index:10;padding:16px 24px 30px;background:linear-gradient(180deg,rgba(20,16,12,0) 0%,rgba(20,16,12,0.9) 35%);">
  <div style="background:rgba(95,184,154,0.1);border:1px solid rgba(95,184,154,0.25);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <i class="fas fa-lightbulb" style="font-size:13px;color:#6BB89A;"></i>
    <span style="font-size:11.5px;color:#C9BCA4;line-height:1.4;">Qin's army of 1M+ conscripts crushed all six rival states by 221 BCE.</span>
  </div>
  <!-- choose stat -->
  <div style="font-size:11px;color:#E3BC6A;font-weight:700;letter-spacing:1px;margin-bottom:10px;text-align:center;">CHOOSE YOUR ATTRIBUTE</div>
  <div style="display:flex;gap:9px;justify-content:center;">
    <div style="flex:1;background:linear-gradient(135deg,#C8463B,#9A332A);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:0 8px 18px rgba(200,70,59,0.4);"><div style="font-size:11px;color:#fff;font-weight:700;">武 Military</div><div class="disp" style="font-size:18px;color:#fff;font-weight:800;margin-top:2px;">98</div></div>
    <div style="flex:1;background:#1E1812;border:1px solid rgba(217,169,76,0.18);border-radius:14px;padding:11px 8px;text-align:center;"><div style="font-size:11px;color:#C9BCA4;font-weight:600;">法 Reform</div><div class="disp" style="font-size:18px;color:#E3BC6A;font-weight:700;margin-top:2px;">95</div></div>
    <div style="flex:1;background:#1E1812;border:1px solid rgba(217,169,76,0.18);border-radius:14px;padding:11px 8px;text-align:center;"><div style="font-size:11px;color:#C9BCA4;font-weight:600;">史 Legacy</div><div class="disp" style="font-size:18px;color:#E3BC6A;font-weight:700;margin-top:2px;">99</div></div>
  </div>
</div>

</body>
</html>
